USA_war_with_PRC_tt: "Completing §YBuild the Military of Tomorrow§! focus will unlock §Gnew focus tree§! to prepare for §0the final war§! with §READI§!."
PTF_saint_george_de_dragon: "St. George and the Dragon"
PTF_saint_george_de_dragon_desc: "The awakened dragon of the East claims to be the liberator of the oppressed, but it is in truth the ultimate threat to civilization. Like the Saint George of old, the Patriot Front shall don the armor of righteousness and venture into the treacherous wilderness of the Orient to fulfill this predestined feat of \"Slaying the Dragon.\" This is not a simple geopolitical struggle; it is a holy war between light and shadow, order and chaos, the American spirit and the red plague. When our banners fly over the ruins of the Forbidden City, the world will know who truly reigns." 
PTF_king_wing_change: "King's Wing Shift" 
PTF_king_wing_change_desc: "The Washington politicians of the old era long ago lost the capacity to lead this nation amidst the smoke of the Second Civil War. Through \"King-side Castling,\" we shall formally complete the structural reorganization of power: shifting the executive center to more secure bunkers and a fortified patriotic bureaucratic system. This is more than a tactical retreat; it is a clearing of the board for the coming counter-offensive. Let the remnants of the old world be confounded by our feints, while our true strength massing on the flanks prepares to strike a lethal blow against anyone who dares challenge American sovereignty." 
PTF_king_wing_change_flag_tt: "This will lock the §YProject MacArthur§! and §YRidgway Offensive§! national focuses for §Y90§! days." 
PTF_king_wing_change_trigger_tt: "The §YKing's Flank Pawns§! national focus has not been completed or §Y90§! days have passed since the §YKing's Flank Pawns§! national focus was completed.\n(Current days remaining: [?PTF_king_flank_pawns_flag:days_left])" 
PTF_alexander_re_conquest: "Alexander's Re-conquest" 
PTF_alexander_re_conquest_desc: "The world does not need the chaos of multi-polarity; it needs a single, unifying will. Chairman Russo will inherit the grand vision of Alexander the Great, launching an unprecedented global expansion in the 21st century. We will not merely recover lost influence; we will export American law to every corner of the globe. From the Bering Strait to the Bay of Bengal, the iron hooves of the Patriot Front will crush every barrier to unification. If the Civil War was an act of survival, then this \"Reconquest\" is our rite of passage as the chosen people of a new age." 
PTF_operation_cross: "Operation Cross" 
PTF_operation_cross_desc: "To counter the aggressive revolutionary exports of the Eastern Union, we must awaken the latent ancestral faith of the West. This operation integrates all traditional and patriotic forces into a modern Crusade against the \"Revolutionary Cult\". We shall no longer shy away from violence; we shall celebrate sacrifice. Every soldier is a paladin of civilization, and every bomb dropped is a divine judgment. In the name of the Cross, we will purge the lands across the Pacific of the revolutionary toxins that infect them." 
PTF_coordination: "Piece Coordination" 
PTF_coordination_desc: "War is not an isolated conflict, but a complex gambit. Having integrated the industrial potential of North America, we must ensure that our sea, land, air, and cyber forces operate as a single, synchronized entity. Every missile launch must harmonize with the propaganda machine; every border advancement must match the rhythm of our logistics. We will dissolve the barriers between military branches, establishing a vertical chain of command directly under Chairman Russo. Coordination is efficiency, and efficiency is victory." 
PTF_roosevelt_bill: "Draft the Roosevelt Bill" 
PTF_roosevelt_bill_desc: "This Roosevelt is not the soft-handed bureaucrat of the past, but the \"Big Stick\" warrior. This bill establishes absolute state control over strategic resources, transforming the North American continent into a shipyard and arsenal that never sleeps. We shall purge the inefficiency of the free market, replacing it with a total-war economy subservient to the national will. Every factory, every citizen, every pound of steel, and every drop of oil must bear the mark of the Patriot Front. Let the new \"Big Stick\" reach across the Pacific to shatter the dreams of those who seek to revive the path of revolution."
PTF_cincinnatus_strategy: "Cincinnatus' Strategy" 
PTF_cincinnatus_strategy_desc: "Chairman Thomas Russo is the modern Cincinnatus, laying down the quiet life of a private citizen to take up the sword of the commander in our nation’s darkest hour. This strategy demands that every patriot respond to the call like a citizen-soldier in times of war, and return to productive labor in times of peace—yet always keeping a blade sharp for the enemy. It is a total social restructuring aimed at forging America into a disciplined, militarized organism. We long for peace, but only through extreme preparation for war can we protect our home." 
PTF_fire_vestal_hearth: "Fire of Vesta's Hearth" 
PTF_fire_vestal_hearth_desc: "In ancient Rome, the fire of Vesta symbolized the eternity of the State. For the Patriot Front, the unity and prosperity of North America is the sacred flame we must protect unto death. To ensure this flame is not extinguished during the Great Decisive Battle, we must implement the strictest surveillance and purges at home. Any hidden spies, defeatists, or revolutionary sympathizers will be cast into the fire. This absolute internal stability will support our most brutal gambits abroad. The flame must not die; the American Empire must endure." 
PTF_dance_of_mars: "Mars' Dance" 
PTF_dance_of_mars_desc: "Mars, the god of war, revels in the sound of drums, and we are his perfect partners on the world stage. This is more than a mobilization; it is an aesthetic cult of war. Through mass parades, extreme physical conditioning, and nationwide military competitions, we will ensure every American feels the exhilaration of combat in the rhythm of their muscles. When the entire nation dances to the beat of Mars, any enemy defense will crumble before such pure martial spirit.\n\nWelcome to the new era of total war." 
PTF_sacrifice_attack_king: "Sacrifice to Attack the King" 
PTF_sacrifice_attack_king_desc: "To utterly crush the resistance of EADI, local sacrifices are an inevitable and necessary price. We will deliberately expose secondary strategic nodes or peripheral outposts to lure the revolutionary armies into meticulously designed traps. As the enemy overextends their forces and thins their lines, our elite strike groups will drive directly into their command centers and political heartlands. It is a dangerous gamble, but it is the creed of the Patriot Front: for the ultimate Checkmate, everything is expendable." 
PTF_king_flank_pawns: "King's Flank Pawns" 
PTF_king_flank_pawns_desc: "On the Pacific chessboard, Japan and its \"PDTO\" vassals are but pawns shielding our core interests. Executing the \"King’s Gambit\" means we will allow our strategic frontiers to absorb the enemy's initial shock, using the blood of allies to dull the edge of the Eastern Union’s momentum. Through this brutal calculus, we will filter out the truly loyal subjects and force Japan to pivot entirely toward our war machine. As in chess, so in reality: sacrificing the flank pawns ensures the \"King\" remains invincible on North American soil while the mid-game slaughter begins." 
PTF_king_flank_pawns_trigger_tt: "The §YKing's Wing Shift§! national focus has not been completed or §Y90§! days have passed since the §YKing's Wing Shift§! national focus was completed.\n(Current days remaining: [?PTF_king_wing_change_flag:days_left])" 
PTF_king_flank_pawns_tt: "This will lock the §YAlexander's Re-conquest§! and §YOperation Cross§! national focuses for §Y90§! days." 
PTF_project_macarthur: "Project MacArthur" 
PTF_ridgway_offensive: "Ridgway Offensive"
PTF_ridgway_offensive_desc: "We never truly left the Pacific. The unfinished vision of General MacArthur will be fully realized by the Patriot Front in the 21st century. This project aims to establish a chain of containment stretching from Alaska to Southeast Asia, utilizing nuclear deterrence and long-range precision strikes to lock the Eastern Union within the Asian interior. We will utilize every cutting-edge technology—even those forbidden by outdated international conventions—to ensure the torch of American Order re-illuminates the East. This time, no force on earth will stop our \"Return.\""


PRC_Invade_America_tt: "§YFinal Offensive§! - We will land on the West Coast to force the United States to surrender completely"
PRC_Invade_America_dec_idea: "§YSَنA: Special Operation America§!"
PRC_Invade_America_dec: "§aAmerica§! Final Offensive - Final Phase"
# PTF National Focus Localization
PTF_soaring_white_eagle: "Soaring White Eagle"
PTF_soaring_white_eagle_desc: "The symbol of the United States—the bald eagle—will once again spread its wings and soar over the Pacific. We must revitalize national morale and prepare for the challenges ahead."
PTF_storming_back_into_tne_pacific: "Storming Back into the Pacific"
PTF_storming_back_into_tne_pacific_desc: "The Pacific was once our sphere of influence; now it is time to re-establish our dominance in these waters. We will lead the Pacific Treaty Organization and reshape the regional order."
PTF_the_new_marshal_plan: "The New Marshall Plan"
PTF_the_new_marshal_plan_desc: "Just as the Marshall Plan rebuilt Europe after WWII, we will launch a new aid program to help our Pacific allies rebuild and develop, thereby solidifying our influence."
PTF_freedom_of_navgation: "Freedom of Navigation"
PTF_freedom_of_navgation_desc: "Freedom of navigation is the cornerstone of international trade and maritime order. We will ensure the unimpeded flow of Pacific shipping lanes and safeguard the security of sea lines of communication."
PTF_defeated_but_unbowed: "Defeated but Unbowed"
PTF_defeated_but_unbowed_desc: "Although we have experienced setbacks, the American spirit has never been broken. We will learn from our failures and emerge stronger."
PTF_fortress_of_freedom: "Fortress of Freedom"
PTF_fortress_of_freedom_desc: "The American homeland must become an unbreakable fortress of freedom. We will strengthen our national defense to ensure no enemy can threaten our home."
PTF_roaring_steel: "Roaring Steel"
PTF_roaring_steel_desc: "The American industrial machine will once again run at full speed, and a torrent of steel will overwhelm our enemies. We will mobilize the nation's production capacity."
PTF_oil_the_blade: "Oil the Blade"
PTF_oil_the_blade_desc: "A powerful military requires an adequate fuel supply. We will secure a stable supply of oil resources to prepare for the coming war."
PTF_project_jupiter: "Project Jupiter"
PTF_project_jupiter_desc: "Just as Jupiter, the King of the Gods in Roman mythology, controls lightning, we will master the most advanced military technology and unleash the wrath of thunder from the sky."
PTF_forge_the_chain: "Forge the Chain"
PTF_forge_the_chain_desc: "We will tightly link our Pacific allies together, forming an unbreakable chain to jointly counter any threat."
PTF_stranglehold: "Stranglehold"
PTF_stranglehold_desc: "We will control the key waterways and strategic locations in the Pacific, like seizing the enemy's throat, leaving them unable to breathe."
PTF_the_final_crusade: "The Final Crusade"
PTF_the_final_crusade_desc: "This will be the final battle to defend the free world. We will gather all our forces and launch a decisive offensive to thoroughly defeat the enemies threatening peace."
