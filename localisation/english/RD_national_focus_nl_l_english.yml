APC_trial_by_fire: "Trial by Fire"

################# Below is text descriptions ###########
APC_day_of_liberation_desc: "For too long, the vast lands of the Asia-Pacific have been shrouded in the shadows of colonialism and imperialism. The sweat and blood of the people have been ruthlessly extracted, and their dignity trampled. But today, the torrent of history has converged into an unstoppable thunder. We declare to the world: the hour of liberation has struck! This is not merely a change of dates, but the end of an old era. We shall shatter the chains of inequality and build a new order belonging to the laborers. The people of Asia-Pacific shall no longer be pawns on another's board, but masters of their own destiny."
APC_summon_comrades_desc: "In the face of a great cause, no one is an island. We must issue the loudest call to revolutionary aspirants lurking everywhere, bridging mountains and seas to unite the red sparks scattered across Asia-Pacific into a prairie fire. This is more than a gathering of power; it is a resonance of faith. We must establish a tight organizational network ensuring every comrade finds their place in the struggle. When these people with shared ideals join hands, any decayed fortress of the ruling class will tremble before such unified strength. Together, we shall write a brilliant new chapter in the history of human liberation."
APC_guide_allied_military_desc: "The power of unity requires scientific coordination and professional guidance. As pioneers of the revolution, it is our duty to share our combat experience and advanced strategic tactics with our allies. We must dispatch elite military advisory groups to help brotherly nations build modern command systems and logistical support, transforming spontaneous resistance into disciplined, powerful revolutionary forces. Only when the military forces of all Asia-Pacific nations form a synchronized hammer can we strike a fatal blow to the imperialist camp in the grand strategic game, ensuring that the fruits of liberation remain indestructible."
APC_solve_reactionaries_desc: "The road of revolution is never smooth. Those stubborn reactionaries who dream of turning back the clock are cancers lurking in the depths of society. They collude with external forces, sabotaging production in a desperate struggle before the dawn. We must show no mercy or hesitation, sweeping away these class enemies with thunderous force. By establishing efficient screening systems and people's courts, we will clear out those corrupt officials and feudal remnants clinging to power. This is not just physical elimination, but a restructuring of society to ensure that reactionary thoughts lose the soil to grow ever again."
APC_international_brigades_desc: "A righteous cause never lacks like-minded international friends. We must call upon the global proletariat to form grand International Brigades, letting passionate youths from across the globe shed their blood on the battlefields of Asia-Pacific. These warriors bring diverse skills and perspectives, deeply embedding internationalist spirit into our soil. They symbolize the struggle against fascism and hegemony, serving as a bridge between us and the world revolutionary centers. Through this elite mixed force, we will prove to the world that the liberation of Asia-Pacific is an inseparable core part of the global cause of justice."
APC_hundred_millions_one_heart_desc: "When the will of hundreds of millions converges into a single voice, and countless individual heartbeats unite into one pulse, no force on earth can stop us. Through deep social mobilization and ideological construction, we must make every citizen realize they are the masters of the nation. Whether an apprentice in a factory, a farmer in the fields, or a soldier on the front, everyone strives for the same goal: building a prosperous and stable new order. This unprecedented national cohesion will allow our state machinery to maintain ultra-high-frequency operation under any extreme pressure, creating miracles of construction and warfare."
APC_opening_action_korea_desc: "The situation on the peninsula is the fulcrum of balance in the Asia-Pacific and our primary strategic breakthrough point. We must launch a precise and swift 'Opening Act' to completely shatter the artificially drawn military demarcation line, allowing people separated for decades to embrace once more. Through the dual effects of political induction and military pressure, we will transform this peninsula into a solid outpost of our strategic depth. This is not only to eliminate immediate threats but to send a clear signal: the old spheres of influence are gone. The new Asia-Pacific shall be forged by our hands, with the red flag over the peninsula as the first masterpiece."
APC_operation_downfall_japan_desc: "Against the island neighbor that once brought endless pain to the people of Asia, we must implement a thorough 'Operation Downfall.' This is not simple revenge, but a move to uproot the breeding ground of militarism. We will use air and sea superiority to blockade its trade routes, dismantle its industrial base, and ultimately establish a new government serving the people's interests. We must force the former zaibatsu and right-wing politicians to exit the stage of history, transforming Japan from an imperialist lapdog into an active participant in the peaceful Asia-Pacific order. When the cherry blossoms bloom again, they shall witness a nation returned to its people."
APC_dive_action_india_desc: "Deep changes are brewing at the southern foot of the Himalayas. Targeting the massive geographical block of the South Asian subcontinent, we must execute the highly mobile 'Dive Action.' By supporting local social justice movements and comprehensive infrastructure interconnectivity, we will break the shackles of decadent caste systems and feudal remnants on productivity. This is more than geopolitical expansion; it is a great civilizational reshaping. We will establish a deep strategic partnership with the people of South Asia, incorporating this populous market into our new order, ensuring there are no dead ends in our shared prosperity."
APC_flip_action_anzac_desc: "Those isolated overseas territories long under Western hegemony are key puzzle pieces in our blueprint. Through a sophisticated blend of political infiltration and economic incentives, we will implement 'Flip Action' to alter their strategic color. We must make the people of Australia and New Zealand realize that following the old colonial system leads only to decline, while joining the thriving Asia-Pacific circulation is the only way forward. Through diplomatic maneuvering and guidance of public opinion, we will transform these nations from Western outposts into friendly nodes of our new order, cutting off imperialist tentacles and achieving a full flip of maritime power."
APC_final_act_usa_desc: "All gambits will eventually point toward the other side of the vast ocean. To prepare for the 'Final Act' that decides the future of humanity, we need the most meticulous strategic reserves and ideological preparation. We must continuously deconstruct the global hegemon trying to block historical progress from dimensions of finance, technology, and social thought. When our system becomes strong enough and the internal contradictions of the opponent become irreconcilable, the final showdown will not be a tragic collision but a natural replacement of civilizational order. We will declare the end of the era of hegemony, letting the flags of justice fly high."
APC_pla_max_readiness_desc: "To defend the hard-won fruits of revolution and respond to potential external armed intervention, our people's army must enter a state of 'Highest Readiness.' This means maintaining 24-hour uninterrupted vigilance and response capability from the command center to every grassroots squad. We must rapidly transform cutting-edge research into combat equipment, enhancing the digital coordination of our land, sea, and air forces. This is not for warmongering, but to ensure that when the first enemy shell lands, we can crush them with thunderous force. This drawn bow is the solid shield of the Asia-Pacific order, deterring all aggressors."
APC_wartime_production_desc: "Modern warfare is the ultimate competition of industrial strength. We must shift the nation's industrial focus to wartime tracks at maximum speed, achieving 24-hour operation of factories. By optimizing resource allocation and administrative approvals, we will ensure every bullet, engine, and chip is produced at peak efficiency and delivered to the front. We must build an airtight industrial defense system to ensure that even under extreme blockade, our production lines keep beating like a heart of steel. This continuous supply will arm our troops to the teeth, leaving the opponent in despair before the torrent of our total war."
APC_coastal_defense_desc: "The vast ocean is our barrier, but it could also be a corridor for the enemy. To keep aggressors outside our gates, we must establish a multi-dimensional coastal defense system. From long-range coastal guns buried under rocks to intelligent minefields beneath the sea and land-based anti-ship missiles patrolling our territorial waters, we will turn the long coastline into an indestructible 'Great Wall of Steel.' By maintaining absolute control over offshore waters, we will shatter any attempt at forced landings or naval blockades. This is more than a territorial line; it is the boundary of Asia-Pacific sovereignty."
APC_mobilize_militia_desc: "The power of war lies within the people. Besides the sword of the regular army, we must awaken the omnipresent People's Militia. Through widespread military training and patriotic education, every healthy adult citizen must possess basic combat skills and intelligence awareness. Militia organizations will penetrate every factory, school, and neighborhood, building a dragnet where spies have nowhere to hide and invaders are drowned in the vast ocean of people's war. This mobilization of the entire nation is our most powerful asymmetric strategic deterrent, declaring to the world that to defeat us, one must face the steely resistance of hundreds of millions."
APC_trial_by_fire_desc: "Just as true gold fears no fire, a true powerhouse must prove its mettle in the harshest trials. When the fires of war rage and danger is everywhere, it is the moment for the soul of our nation to undergo ultimate sublimation. This focus symbolizes our final leap from suffering to glory through the baptism of blood and fire. We must use this 'fire' to eliminate weakness and hesitation, forging a new Asia-Pacific community with steely will. When we finally emerge from the smoke, we will see a great civilization that has not only won militarily but also leads the era in thought and systems. This is our immortal medal of honor."
