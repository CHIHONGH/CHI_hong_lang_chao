PRC_stimulate_economy_idea: "Stimulate the Economy"
PARTY_polict: "Completing this national focus will unlock §YBranch§! decisions:"
promote_system_reform_desc: "Since the 3rd Plenary Session of the 11th Central Committee, when the Party shifted its focus from class struggle to economic development, the growing wealth gap that has accompanied China's rapid growth has become impossible to ignore. Waves of public dissatisfaction and recurring crises have exposed the flaws in the current system. For the well-being of the people and the survival of the Party's ideals, cadres led by Comrade Hu Chunhua seek to reform the system to better align it with the socialist realities of our nation."
sail_through_the_storm_desc: "Fortunately, we have gradually emerged from the shadow of the oil crisis. The economy is recovering, and foreign reserves are stabilizing. Many foreign investors are returning to China. The bright economic outlook and rising national pride once again prove that no hardship can defeat the Chinese people — the great rejuvenation of China is within reach."
energy_revolution_desc: "We cannot simply rely on restoring oil imports to ease the domestic energy crisis. By investing in nuclear and renewable energy sectors, we will power our economy and industry through the energy of a new era."
optimize_extraction_technology_desc: "Our extraction industry has long been inefficient. We must establish new industrial regulations and invest in advanced extraction technology to maximize oil production and alleviate the current crisis."
prepare_for_20th_party_congress_desc: "The past has concluded. Xi Jinping has agreed not to seek another term and will coordinate personnel transitions with us. We must begin preparing documents, verifying data, meeting journalists and NPC delegates — and unwrapping the 'inaugural gift' prepared for us."
cross_the_black_gold_wasteland_desc: "Only by first ensuring domestic stability can we effectively carry out reforms to confront the oil crisis and restore national strength. China has never needed unity and strong leadership more than it does today."
exploit_domestic_oil_desc: "At such a critical moment, we cannot continue relying on unstable overseas oil imports. We will expand domestic resource extraction, build more oil rigs and refineries, and ensure energy security lies in our own hands — while reducing transport costs and easing the economic burden."
adopt_dynamic_zero_policy_desc: "If we cannot protect our people’s lives from the virus, the Party’s legitimacy will be severely questioned. The strict measures taken in the early stages have proven effective. Anyone calling for an early relaxation of restrictions either underestimates the virus or harbors ulterior motives. We will continue the zero-COVID policy — as the General Secretary said: 'People first, life first.'"
return_to_normal_desc: "After years of struggle, today we can finally announce to our people and the world: China has emerged from the pandemic era and returned to normal. This is not only a victory for the Communist Party and the People’s Republic, but a triumph achieved by 1.4 billion Chinese citizens!"
strict_lockdown_policy_desc: "Despite our preparations, the coronavirus has proven even more contagious than expected. We must tighten monitoring, allocate more resources, and minimize movement between cities, rural areas, and borders. Though some accuse us of ‘shutting down the nation,’ history will show that lockdowns were a necessary measure to defeat the pandemic."
promote_prevention_measures_desc: "Nucleic acid testing is inexpensive, easy to implement, and essential for detecting coronavirus infections efficiently. It plays a vital role in treating patients, monitoring outbreaks, and restoring normal life. We will promote testing nationwide and establish testing sites across major cities. Initially for government staff — ultimately for every citizen."
focus_on_vaccine_research_desc: "Only by developing reliable vaccines can we control the virus at its source. Companies like Sinovac have achieved decisive progress. We must allocate funds and resources wisely to support vaccine development and ensure that the results are deployed swiftly to protect every citizen."
start_vaccine_research_desc: "We will order all biological research institutes and pharmaceutical enterprises to immediately begin vaccine research and trials. This will help us control the pandemic faster and enhance our global reputation. Several vaccines, including Sinovac’s inactivated vaccine, are already in clinical trials. We have also offered donations and research cooperation to the WHO and developing nations."
lockdown_wuhan_desc: "As panic spreads, the situation is spiraling out of control. Since CCTV reported the discovery of a 'new infectious coronavirus,' mass exodus has been observed across Hubei Province, centered on Wuhan. Highways are overcrowded, nearly paralyzed. Without decisive action, infections will spread nationwide within days. We must act now — Wuhan must be locked down immediately."
covid_full_lockdown_desc: "This will be unprecedented in public health history — to contain the pandemic, China will enter a 'quasi-wartime system,' imposing strict limits on travel and transport. Infected citizens will be isolated and treated in hospitals or temporary medical facilities. Meanwhile, scientists nationwide are mobilized to find the ultimate cure."
PRC_shake_up_the_politburo_2_desc: "The Communist Party’s 20th National Congress will soon convene, electing a new Central Committee and setting the policy direction for the next five years. The world watches closely — and we will seize this opportunity to demonstrate the Party’s strength, unity, and capacity for change."
turbulence_returns_ship_runs_aground_desc: "With pandemic control worsening, the economic storm intensifying, and social conflicts erupting, crisis follows crisis. The death of the second-ranking leader has emboldened internal opposition. The red ship, battered by the storm, teeters on the edge — where will it sail next?"
emergency_work_meeting_desc: "An emergency work meeting must be convened immediately. The domestic situation is deteriorating faster than expected, and conservative plans to maintain the old order have collapsed. Reform must now steer the ship through the storm before the Party fractures completely. We must chart a new course — one that stabilizes the crisis and demonstrates decisive leadership."
overseas_good_doctors_desc: "Rising energy costs have forced cutbacks in energy-intensive industries, disrupting the supply chain. While developing domestic energy, we should also look abroad — to countries like Nigeria, one of Africa’s top oil producers, or to our northern neighbors — to expand trade and mitigate the crisis."
pragmatic_measures_desc: "Empty slogans and bureaucratic showmanship are the rust and fog that blind this great ship. Only through pragmatic, results-driven action can we break through the storm. In critical sectors, we will take concrete measures to restore public confidence and show our resolve to stabilize the situation."
improve_medical_security_measures_desc: "In a socialist state, the strength of medical security reflects its commitment to 'serve the people.' The pandemic has exposed corruption and imbalance in the healthcare system. Reforming public hospitals, achieving universal coverage, and dismantling the capitalist logic of 'money for health' will make true service to the people a reality."
food_safety_reform_regulation_desc: "For years, some local governments have shielded unscrupulous food companies for political gain, flooding markets with unregulated 'three-no' products. Public fear over food safety is widespread. The reform will enforce strict standards through corporate credit archives, blacklist systems, and traceability mechanisms — especially in rural areas where the problem is severe — ensuring the safety of every meal."
stabilize_local_finance_desc: "Over the past decade, many local governments borrowed heavily for vanity projects. This reckless behavior has led to severe fiscal imbalance. To maintain stability and prevent systemic risk, we will transfer central funds, strengthen financial oversight, and ensure efficient use of fiscal resources — prioritizing unfinished public housing projects and compensating affected citizens."
suppress_liberal_dissent_desc: "For years, Western-backed liberal groups have attempted to influence China’s politics and incite 'color revolutions.' With the U.S. now in turmoil, it is time to cut their funding and root out illegal organizations and agitators. We will make it clear: the essence of this nation will not change, and its sovereignty will not be challenged."
form_united_front_desc: "Throughout history, the Party has used united fronts to build consensus during ideological divides. As our position is not yet fully secure, we must unite with compatible forces to stabilize the situation and prevent destructive infighting. Turning differences into resources for governance, we will preserve Party unity and prepare for all challenges."
absorb_leftist_opposition_desc: "Since 1979, leftist politicians have been marginalized. Now, amid rising social tensions, their influence is resurging. Guided by Marxism and rooted in the people’s interests, we will unite with these forces to reshape the nation and overcome all obstacles on our path forward."
reorganize_local_bureaucracy_desc: "From chaotic pandemic management to fiscal mismanagement and corruption, the dysfunction of local governance is undeniable. To advance reform, we must restore the bureaucracy’s service-oriented nature through stricter supervision and self-revolution, cutting the chains of vested interests."
promise_of_new_spring_desc: "To gain support from other forces, we will articulate the necessity of reform and make commitments to transformation while protecting our initiative. Our promise is not for power but for the future of millions — a concrete, actionable reform plan powered by the collective will of workers and just citizens. Let the fire of truth light our path forward!"
loosen_restrictions_on_pro_worker_organizations_desc: "Many grassroots organizations defending workers’ rights — often formed by workers and students — have long been constrained. It is time to lift these restrictions. Throughout history, labor organizations have driven social progress, uniting workers against exploitation. By empowering such groups, we continue this legacy — ensuring that labor rights advance alongside political reform."
in_the_name_of_the_people_desc: "'In the name of the people' is not an abstract slogan, but a concentrated expression of the people’s historical and class identity. Having made progress in institutional reform, it is time to expand and realize this principle in action."
still_stable_desc: "After a series of reforms, stability seems restored — but is it genuine harmony, or merely suppressed tension? 'Development is the best stabilizer,' we once believed, but true stability arises when reform aligns with the people’s needs. Only then will transformation and stability reach a new dialectical unity. The journey continues — we must stay prepared for what lies ahead."
economic_stimulus_plan_desc: "Although we are recovering from the economic crisis, a stimulus plan aligned with systemic reform is now essential. This plan is not just a market fix but a strategic intervention — proving that economic policy can be a lever for fairness and progress, not merely a tool for preserving order."
