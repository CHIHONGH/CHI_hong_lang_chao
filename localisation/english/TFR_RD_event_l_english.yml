  Chihong.6702.d: "Workers' demands for legal rights and their anger towards capitalist oppression have boosted our nationalization work."
  Chihong.6702.a: "Excellent, keep it up."
  Chihong.6802.t: "The United People Will Never Be Defeated"
  Chihong.6802.d: "Events unfolded beyond expectation. Workers and Party members mobilized the majority of the masses to participate in this movement. Many enterprises yielded to public pressure, surrendering the company with reasonable shares and returning power to the workers."
  Chihong.6802.a: "Comrade Workers, Unite."
  Chihong.6902.t: "Factory Seizure Movement Progress is Encouraging"
  Chihong.6902.d: "The matter progressed smoothly; worker Party members successfully advanced the work process and accelerated the implementation."
  Chihong.6902.a: "Keep up the hard work."
  Chihong.7002.t: "Factory Seizure Movement Reaction is Mediocre"
  Chihong.7002.d: "Events unfolded lukewarmly; the work still proceeded, and progress was relatively smooth."
  Chihong.7002.a: "Keep up the hard work."
  Chihong.7102.t: "Factory Seizure Movement Encounters Obstacles"
  Chihong.7102.d: "Events were hindered, the work was difficult to carry out, and the workers were not successfully mobilized. We may need to improve our work."
  Chihong.7102.a: "Reflection is needed..."
  Chihong.7102.b: "Regulate the movement."
  Chihong.7202.t: "Capitalists Collude with Scabs to Sabotage Work"
  Chihong.7202.d: "The progress of the work suffered a massive setback. We failed to mobilize the workers for the factory seizure. Scabs destroyed the bond between us and the workers. We may need to make personnel adjustments..."
  Chihong.7202.a: "Oh, no!"
  Chihong.7202.b: "Let's improve the work. Alas, how could something like this happen..."
