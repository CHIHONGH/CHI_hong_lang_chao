l_english:
  prcs.1.t: "Warriors on the Plateau"
  prcs.1.d: "At over 5,000 meters above sea level, I tightened my coat against the biting wind that flung snow like tiny blades across my face. The Himalayas loomed in the twilight, a silent wall of ice and stone.\n\nThis is my second year at the border outpost. Each night, as I look at the moon, I think of home—the braised pork my mother makes, my father's jasmine tea, the old locust tree in our yard.\n\n"Cold? Have some tea," the instructor said, handing me a steaming thermos of ginger tea. I saluted, but he waved it off, taking my rifle and gesturing to the border. "When I first came, I missed home too. But later I realized—we stand here so others can reunite in peace. The more we guard, the safer our motherland."\n\nUnder the moonlight, his face was firm and calm. I remembered my oath—to defend the motherland to the death. Warmth rose in my chest, pushing away the cold.\n\nThen he showed me a video: a little girl in her mother's arms saying, "Dad, you didn't come back again this year. I miss you, but you're a hero." His voice softened. "My daughter. I haven't been home in three years. I know what you feel. I'll fight for your leave next year."\n\nMy eyes stung. The instructor patted my shoulder. "Remember, we're never alone. Millions stand behind us."\n\nThat night, as I stood guard beneath the moon, I no longer felt lonely. On this snowy plateau, countless comrades stood like me, guarding the peace of our homeland. The moonlight glimmered on my epaulettes—steady, silent, and warm."
  prcs.1.a: "Salute to the PLA"

  prcs.2.t: "New Year 2025"
  prcs.2.d: "Comrades, friends: \nThe bells of the New Year have rung, and the dawn of the Year of the Snake is spreading across the land. In these years full of vitality and change, we hold infinite visions for the future and move hand in hand towards a more glorious tomorrow! \nSnakes, agile and firm, symbolize wisdom, rebirth and unyielding will. Just as the road of revolution, although winding and tortuous, the direction of progress is always unwavering. Let us use the snake's keen insight into the world, use the snake's tenacity to overcome difficulties, unite and struggle on the new journey, and let the communist ideal shine in our era! \nDuring this Spring Festival, let us wish together: the proletariat of the world will unite closely, overthrow exploitation, eliminate classes, and bring true liberation to mankind! May the places where the red flag points be places of freedom and equality; may the hearts of the workers and peasants be accompanied by light and warmth! \nStrive forward in the Year of the Snake, and the revolution will last forever! \nComrades, Happy New Year!"
  prcs.2.a: "China will prosper!"

  prcs.3.t: "Hu Chunhua submits resignation"
  prcs.3.d: "After several years in office, Hu Chunhua formally submitted his request to the Standing Committee of the National People's Congress to resign from the presidency. Subsequently, at the first meeting of the Standing Committee of the 15th National People's Congress, based on the proposal of the Premier of the State Council, the meeting discussed and decided to accept Hu Chunhua's request to resign from the presidency.\n\nAt the subsequent plenary session, Hu Chunhua delivered an important speech entitled "Returning Power to the People". He said: "We have completed the staged reform tasks. Now it is time for power to truly return to the people and for the National People's Congress, the highest organ of power, to fully play its role. "\n\nFinally, in accordance with the provisions of the Constitution, the Standing Committee of the National People's Congress began to perform the powers of the President. This marks an important step for China to move towards greater democratization."
  prcs.3.a: "A new historical phase has begun."

  prcs.4.t: "China invades North Korea"
  prcs.4.d: "Shocking news came from Beijing: The People's Republic of China declared war on the Democratic People's Republic of Korea today. A large number of troops are gathering at the Yalu River border, and the vanguard has entered the North Korean mainland.\nWhen asked about the reason for the declaration of war at today's diplomatic press conference, the spokesperson of the Chinese Ministry of Foreign Affairs replied: "The North Korean people have been living a hungry life under the rule of the Kim family revisionism since 1948, while the North Korean rulers have been eating greasy food and having big bellies. This crime has been ignored for too long. Today, China will complete the unfinished business of the past: completely liberate North Korea and let the real revolution come to the Korean Peninsula."\n\nThe North Korean side strongly condemned China's undeclared war. The North Korean Ministry of Foreign Affairs said: "The invasion of northern imperialism will not make the North Korean people surrender. The Workers' Party of Korea will fight the CCP revisionists to the end. Comrade Kim Jong-un will lead the North Korean army and people to drive the CCP invaders out of North Korea."\nCurrently, videos of the battle between the Chinese and North Korean troops have been leaked on the Internet. We will continue to report on the follow-up of the Sino-North Korean war."
  prcs.4.a: "The clarion call of revolution will surely spread all over the world!"
  prcs.4.b: "Fuck the crazy throne"

  prcs.5.t: "China invades Vietnam"
  prcs.5.d: "In the early hours of this morning, troops mainly composed of the Chinese People's Liberation Army crossed the Sino-Vietnamese border and officially launched a military operation against Vietnam called armed anti-revisionism. The spokesperson of the Chinese Ministry of Foreign Affairs announced at an emergency press conference that the action aims to "correct the serious deviation of Vietnam's revisionist path" and help the Vietnamese people return to the true socialist track.\n\nThe World Liberation International Headquarters issued a statement saying that the top leaders of the Vietnamese Communist Party have been controlled by "capitalist restoration forces and revisionists", betrayed the revolutionary legacy of President Ho Chi Minh, and became "agents of imperialism in Southeast Asia." The statement emphasized that this action is an "internationalist obligation" and its purpose is to "save the Vietnamese revolution that has fallen into the quagmire of revisionism."\n\nInternational leftists have issued statements in support of China's actions. Some scholars even said: "Vietnam has long deviated from the socialist path, and today's action is a historical necessity."\n\nThe Pacific Treaty member states expressed strong protests. The Japanese Foreign Minister called the move a "serious threat to the stability of the Southeast Asian region" and claimed to provide military assistance to Vietnam at all costs"
  prcs.5.a: "The clarion call of revolution will surely spread all over the world!"
  prcs.6.t: "Establishment of World Liberation International"
  prcs.6.d: "Today, the People's Republic of China held an international conference of unprecedented scale in the Great Hall of the People, officially announcing the establishment of the "World Liberation International". This move was seen by many international observers as another major turning point in the global political landscape after the American Civil War.\n\nChinese President Hu Chunhua delivered a two-hour speech at the conference, emphasizing that "the order of the old world is rapidly collapsing, the dawn of a new world has appeared, and since the real "restoration of order", the power of the proletariat has been unprecedentedly strong", and declared that "now, it is time to let the flames of revolution burn again around the world". The President said that the World Liberation International will unite the oppressed people around the world to build a "world without exploitation". "We will fight to the end for a new world without oppression and oppression, and carry out the unfinished work of all protesters dating back 8,000 years." This move has caused a thousand waves in the international community. Suspicion, panic and ecstasy have converged into a frenzied symphony, shattering the remaining old order. Finally, let us quote a comment. When the world is at the crossroads of multiple crises, Beijing has chosen to pick up the banner of revolution. Is this a historical regression or a kind of progress that we have not yet understood? Perhaps only time can give the answer. In this complex global public opinion field, Beijing seems to have made its own choice, and the world, whether ready or not, will have to face this new reality."
  prcs.6.a: "East over West."

  prcs.7.t: "End of the Malay Archipelago Revolution"
  prcs.7.d: "In the Malay Archipelago, the revolutionary movement supported by the Chinese Communist Party has ended."
  prcs.7.a: "Correct"

  prcs.8.t: "China invades Burma"
  prcs.8.d: "After Myanmar's People's Defense Army won the civil war, the situation took a surprising turn: China immediately launched a military invasion of the Southeast Asian country. Beijing announced that the invasion was the result of Myanmar's continuous attacks and incursions into Chinese territory before and after the civil war. However, many geopolitical experts agree that the real purpose of the invasion was to safeguard China's strategic interests in the region.\n\nAfter launching the invasion under the pretext of protecting the border and maintaining regional stability, Chinese troops crossed the border into Myanmar and advanced towards key strategic locations. The sudden invasion shocked the international community and raised concerns about a wider regional conflict and humanitarian crisis."
  prcs.8.a: "Asia is sliding further into endless war."
  prcs.8.b: "This decision is necessary!"
  prcs.9.t: "A ray of hope (Part 2)"
  prcs.9.d: "Minister Liu nodded. \"Go on.\"\"For example, Caojing Industrial Park, once focused on exporting electronics, can guide firms to shift toward producing medical devices and household appliance parts needed domestically. Meanwhile, a direct community-linked distribution network can cut out middlemen.\" Chen Mingyuan drew a diagram. \"This secures jobs, stabilizes prices, and eases logistics pressure.\"\n\n\"The key lies in grassroots cooperation,\" Minister Liu noted.\n\n\"Yes,\" Chen said, eyes bright. \"We can form 'resident demand coordination groups' in communities to gather needs, organize bulk purchasing, even revive cooperative models.\"\n\n\"Interesting—sounds like a return to the collective economy?\"\n\n\"Not exactly. It's innovation under new conditions,\" Chen replied. \"We may not have lived through the planned economy, but we understand socialism's core: ensuring people's livelihoods and stability during crises.\"\n\n\"When did you join the Party?\" Liu asked.\n\"Sophomore year.\"\n\"You young cadres think differently,\" Liu said, patting his shoulder. \"Write a detailed plan—you'll report to the Standing Committee tomorrow.\"\n\"Me?\"\n\"Young people must take responsibility. This crisis needs new ideas.\""
  prcs.9.a: "The seed sowns."

  prcs.10.t: "Golden Horse Awards"
  prcs.10.d: "At the recruit training center in Chenggongling, Taichung, a group of new conscripts from the Republic of China's National Army was in the midst of four months of standing service training. Today's task was the dreaded 3,000-meter weighted run—every \"strawberry soldier's\" nightmare. Despite speeches about \"Whampoa Spirit\" and \"unity,\" such slogans did little to drive these soft recruits to push beyond exhaustion. The scattered ranks across the playground said it all.\n\n\"Hey!\" barked the company commander, stopwatch in one hand, blue clipboard in the other. He kicked Lin Chuxing's boot. \"Faster! At that pace, the Communists would've captured you already!\"\n\n\"Report… sir,\" Lin gasped. \"Request… permission to rest…\"\n\n\"Rest? You just need 14 minutes and 45 seconds to pass three kilometers! Can't you hold out that long?\" The commander caught Lin before he collapsed. \"Even the Afghan Communist Army demands 13 minutes and 40 seconds!\"\n\nHe gripped Lin's shoulders. \"Can you still go on? If not, step aside.\"\n\nHearing the snickers of nearby soldiers, Lin felt shame burn through his dizziness, but his body refused to move faster. His legs were lead. He unbuckled his helmet, held it upside down like a rice cooker bowl, and trudged toward the shade beside the field, every step heavier than the last."
  prcs.10.a: "Mom, I don't want to be a soldier..."
  prcs.11.t: "Grievances Conference"
  prcs.11.d: "Rahul sat in the last row, watching Instructor Zhao step to the podium. As an ordinary Indian infantryman held for two months in a Chinese POW camp, he now faced what they called a \"grievance meeting.\"\"Welcome,\" Zhao said in fluent Hindi. \"Here, all may speak freely. Today's topic: comradeship in the army.\"\n\nSilence. Then a frail soldier, Pritt, stood up. \"Lieutenant Roy made us wash his clothes, fetch water, even massage him. Once, he said I didn't clean well enough and beat me with a belt.\"\nThe room stirred. Roy blushed but stayed silent under Zhao's calm gaze.\n\n\"Anyone else?\" Zhao asked. \nVoices rose—stories of withheld pay, forced labor, caste discrimination, insults. Rahul realized nearly everyone had suffered the same.\n\"Is this discipline?\" Zhao asked. \"In the People's Liberation Army, officers may command—but never abuse or exploit. Power comes from duty, not caste.\"\n\nMonths later, the POWs watched a film on India's poor. \"Do your families face the same injustice?\" a counselor asked. \"The oppression you felt as soldiers—don't your people endure it too?\"\n\nRahul thought of his village, his father's bent back, his mother's rough hands. He had joined the army to escape that life—yet found it again in another form.\nAn older soldier said quietly, \"We call India a democracy, but my village still has no schools or hospitals.\"\n\nThe talks soon turned from army abuse to the roots of poverty and inequality. The Chinese guided them to ask why caste still ruled and why leaders stirred hatred instead of solving problems.\n\nSix months later, when repatriation began, Rahul and thirty others requested to stay.\n\n\"We don't want to go back,\" Rahul told Zhao. \"They'll call us traitors. Even if not, why serve the same corrupt officers?\"\nZhao nodded. \"Your choice will be respected. You will be the spark of India's liberation,\" said Advisor Li. \"One day you'll return—not as prisoners, but as liberators.\"\n\nUnder the red flag, Rahul looked toward the horizon. The road ahead was uncertain, but he knew there was no turning back."
  prcs.11.a: "For the liberation of India, for all the suffering people."

  prcs.12.t: "Though the years pass..."
  prcs.12.d: "Wonsan, North Korea. Under a gray sky, Zhang Youmin's infantry company stood in formation outside the city. Nearby, engineers built fortifications while helicopters bearing Chinese and Pakistani emblems skimmed overhead. Chinese, North Korean, and Pakistani armored columns rolled past, their commanders finalizing combat plans. The flags of China, North Korea, Pakistan, and the World Liberation Front snapped in the wind, while Soviet officers observed from afar—eager to study the coalition's first joint exercise amid rising European tensions.\n\nFor Zhang, it was his first time abroad, but not for his family. He recalled the Korean-language certificate his late grandfather had kept—a reminder that the old army doctor once served on the Korean front, saving lives of People's Army soldiers and even posing with one.\n\n\"Comrade Zhang Youmin?\" A voice with a Korean accent pulled him back. A young KPA squadron leader saluted. \"I'm Park Lizhi. I'll coordinate with you in the exercise.\"\n\nAfter a pause, Park studied Zhang's face, pulled out a worn black-and-white photo, and asked softly, \"Was your grandfather a Volunteer Army doctor?\""
  prcs.12.a: "Yes, he is..."

  prcs.13.t: "Though the years pass..."
  prcs.13.d: "Wonsan, North Korea. Under a gray sky, Zhang Youmin's infantry company stood in formation outside the city. Nearby, engineers built fortifications while helicopters bearing Chinese and Pakistani emblems skimmed overhead. Chinese, North Korean, and Pakistani armored columns rolled past, their commanders finalizing combat plans. The flags of China, North Korea, Pakistan, and the World Liberation Front snapped in the wind, while Soviet officers observed from afar—eager to study the coalition's first joint exercise amid rising European tensions.\n\nFor Zhang, it was his first time abroad, but not for his family. He recalled the Korean-language certificate his late grandfather had kept—a reminder that the old army doctor once served on the Korean front, saving lives of People's Army soldiers and even posing with one.\n\n\"Comrade Zhang Youmin?\" A voice with a Korean accent pulled him back. A young KPA squadron leader saluted. \"I'm Park Lizhi. I'll coordinate with you in the exercise.\"\n\nAfter a pause, Park studied Zhang's face, pulled out a worn black-and-white photo, and asked softly, \"Was your grandfather a Volunteer Army doctor? "
  prcs.13.a: "\"Yes, he is...\""

  prcs.14.t: "Be the best warrior (I)"
  prcs.14.d: "Zhou Hang stared at the green frame, using the Wing Loong 2's thermal pod to guide an AKD10 toward a square-headed tank. He missed the white smoke at the enemy spawn. \"Damn—Hornet again!\" He cursed, wishing he hadn't chased the Japanese Type 90 that'd just killed him.\n\nRoommate Zhang Wei peered over. \"Hornet? I've got Skyrim too—why are you even playing War Thunder?\"\n\n\"Just started on the Chinese tech tree. Only a Khalid and an 80UD so far. The Type 90 melts me—two shots in the time my Khalid can fire one. The 80UD only has AP rounds; it can't face it head-on. Once I get the Type 99 and the J-11, I'll even the score.\"\n\nZhang shrugged. \"Play to your strengths: flank, don't brawl. The Soviets and PLA got buffed, so use ambushes. Add me—I'll take you to 11.0 and show you the ropes.\"\n\nFrom the next dorm, Lin Min called, \"I'm coming. Just finished VT5—shoots every five seconds. Type 99's down to 6.5 now; still, fast-shooting light tanks with anti-MGs are a headache for any golden helmet.\""
  prcs.14.a: "One more round!"

  prcs.15.t: "Be the best warrior (I)"
  prcs.15.d: "Zhou Hang's eyes were fixed on the green frame on the screen. He was using the thermal imaging pod of the Wing Loong 2 to direct an AKD10 towards a square-headed tank.\n\nBut he didn't notice the white smoke rising from the enemy's spawn point. \"Damn it's the Hornet again!\" He looked at the kill report on the screen and couldn't help regretting why he was in a hurry to find the Japanese Type 90 that had just destroyed him when he was in the sky. His roommate Zhang Wei leaned over with curiosity: \"What Hornet? I also have the Skyrim... I'm so surprised, why are you also playing War Thunder?\"\n\n\"Just started, Chinese system, now there is only a Khalid and a 80UD. The Japanese 90 is too beastly. It can fire two rounds in the time it takes my Khalid to fire one shot. The 80UD is even more blank with only armor-piercing shells. How can it beat it head-on?\" Zhou Hang shrugged helplessly, \"When I have the Type 99 and the J-11, I will kill all these Japanese. \"\n\n\"Stupid BVVD, in order to promote his Russia, China in the game was severely slashed. I thought that China's equipment was all inferior imitations of Russian goods. What's more, the Khalid you have is not a hard car itself. You must play to your strengths and avoid your weaknesses and make use of the traditional interspersed methods of the People's Army to attack the opponent from the side. \"Zhang Wei patted Zhou Hang on the shoulder and said, \"Add me as a friend later. I will take you to play 11.0. You follow me and learn how to walk the line.\" Zhang Wei returned to his desk and opened War Thunder, \"Lin Min, where are you? Take Brother Hang to play a few games. Now we need someone who can play airplanes.\" \n\n\"I'm here, wait for me.\" Lin Min's voice came from the dormitory next door, \"I just finished playing VT5 accessories. VT5 can't even stand 12.7. One of the North Industries Bangladesh and your mother's Russians must be a moron, but at least it is a fast-shooting starter, which can barely get me to the sky...\""
  prcs.15.a: "One more round..."

  prcs.16.t: "Be the best warrior (Part 2)"
  prcs.16.d: "\"Brother Hang, yellow mark—Type 90 ahead! Tracks are out, gun's still live, I can't push!\" Zhang Wei's voice was tense. The 620 APFSDS could pierce it, but the Type 90's four-second reload made it deadly. Lin Min had only two missiles left. Their only hope was Zhou Hang's Wing Loong 2 with two AKD10s ready.\n\n\"I'll clear the AA—wait, RWR's screaming!\" Lin Min's alarm shrieked through the dorm speakers. \"AKD10 away—seven kilometers, twenty seconds!\" Zhou Hang's targeting box locked tight on the tank. Earlier, he'd nailed two Abrams in seconds before Zhang Wei finished the third with overpressure from his MG turret.\n\n\"Ten seconds… nine—Zhang Wei, left flank! Wheeled contact!\" Zhou Hang's warning came as a Centauro sped into view. Zhang twisted and fired; the Italian vehicle exploded instantly. The Type 90 tried to return fire but was hit by Zhou Hang's missile, erupting in flames.\n\n\"Nice shot,\" Zhang grinned, pushing forward. \"Lin Min, status?\"\n\n\"F-14 down! I dodged two Phoenixes and smoked him with one Viper shot—wait, damn, Adats at their spawn's targeting me!\"\n\n\"Second AKD10 launched,\" Zhou Hang said calmly. \"Target locked on that aluminum box. Zhang Wei, push the ridge and turn right—three more tanks ahead.\"\n\n\"Roger that, comrade drone.\" Zhang laughed. \"Hang, when you graduate, think about joining the Air Force. Our real drones fly better than that Wing Loong. They've even got a new simulator—you in?\""
  prcs.16.a: "Yeah, that looks good."

  prcs.17.t: "Be the best warrior (Part 2)"
  prcs.17.d: "\"Brother Hang, look at the yellow label. The Japanese Type 90 and the fucking Type 577 were eaten up by the Japanese fuel tanks again.\" Zhang Wei hurriedly reversed, but the Japanese JM33 still got into his crotch of the third-stage Type 99. \"It's the fucking fuel tank that exploded again. Why the hell is China a nitroglycerin fuel tank?\"\n\n\"There's really no way. I've already fired my AKD10, but guess what, hitting the Japanese scalp is a hit.\" Zhou Hang said angrily, \"During the Taiwan Strait, I didn't see the Japanese tanks so hard, but they were still trampled to death together with Abrams.\"\n\n\"Isn't that the stupid Russians? Just now there was an F14, and the two Vipers of the J-8B flew away. It was hard to bite him at six o'clock, but the one-kilometer PILI 5B was able to chase vertically and burn the butt instead of hitting the keycap, and the machine gun was full of sparks. \"Lin Min said as he locked onto the F14 with Doyle's radar, \"Fuck Doyle, please don't chase the Phoenix, okay?\" \n\n\"War Thunder is like this, our sunk costs are too high and it's too late. You've only been playing for less than a month and you still have time to quit.\" Zhang Wei stood up from his seat and walked to Zhou Hang, looking at Zhou Hang's unhappy expression after his drone was destroyed by the Phoenix, \"Recently, the Air Force has released a drone simulation software. If you like drones, go play that. Although it's more difficult, at least it won't be targeted by foreign companies. \""
  prcs.17.a: "He sighed and pointed to the mold."

  prcs.18.t: "Be the best warrior (Part 3)"
  prcs.18.d: "It was past midnight, yet Zhou Hang's dorm still glowed. His fingers flew over the keyboard, eyes fixed on the Wing Loong-2 on screen.\n\"Why is it spinning again? This game's controls are brutal.\"\n\nThe system popped up another failed evaluation—angle too steep, joystick unstable. His seventh failure tonight.\n\n\"The new plane's out. I'm done,\" Zhang Wei yawned, shutting his laptop and climbing into bed. \"Still serving the People's Air Force, huh?\"\n\"One more try—I've got it this time,\" Zhou muttered, hitting retry.\n\nThe drone simulator—developed with Air Force sponsorship and now viral among gamers—let players pilot everything from handheld \"Hummingbird\" scouts to heavy \"Wing Loong\" strike drones. Marketed as \"Experience future air combat,\" players joked it was real \"cyber service.\"\n\nSwitching to a lighter \"Flying Eagle-1,\" Zhou tried a forest recon mission. The realistic airflow simulation made it wobble violently before crashing into a tree.\n\n\"Too real,\" Zhang said from above. \"My cousin's in border defense—he says the real ones are even harder.\"\n\"Then how do they fly them?\" Zhou groaned.\n\"Daily training. That's why it's called 'cyber service,' rookie.\"\n\nA message pinged from Lin Min next door: \"Try Rainbow-7—better stability, auto terrain-follow.\"\n\n\"How'd you know I'm online?\" Zhou typed.\n\"Because it's 3 a.m. and you still haven't logged off,\" Lin shot back.\n\nZhou laughed and switched models. The Rainbow-7 handled smoothly, skimming mountain ridges and dodging radar zones. One objective after another lit green; he leaned into the flight, feeling every gust. When the Mission Complete prompt flashed, he pumped his fists.\n\n\"Finally!\"\n\"Three-twenty,\" Zhang mumbled, \"sleep now?\"\n\nBut Zhou was already loading the next mission—this time, piloting the stealth \"Wing Loong-10.\" Unlocking it had taken weeks.\n\nHe grinned at the screen. \"Worth it. Cyber service for the People's Air Force!\""
  prcs.18.a: "Zhou Hang muttered, and took off again to defend the virtual blue sky of the motherland."

  prcs.19.t: "Last year at this door"
  prcs.19.d: "At eight in the morning, sunlight passed through the window, casting a peach branch's shadow across the blackboard. It slipped into the chalk groove, mixing with dust. Teacher Fang, busy with his lesson plan, didn't notice the branch brushing his trouser leg.\n\nThe class grew noisy—chatter, paper planes, soft snores. He looked up, frowned, and was about to speak when the bell rang. Silence fell instantly. Like frosted eggplants, he thought, forcing calm.\n\nTurning to the board, he wrote the topic: \"The Necessity of Self-Revolution.\"\n\n\"I trust you've prepared,\" he said. The air froze. No one moved. Taoying hid beneath the desk. \"No volunteers? Then the student beside the sleeper—answer.\"\n\"I… I don't know, teacher.\"\n\n\"That's right. Recognize problems, make change,\" Fang said evenly. \"Dialectics teaches us that development stems from internal contradiction—self-revolution breaks history's cycle.\"\n\nThe class slowly focused; the peach shadow danced like blush across their faces.\n\"Free discussion later. Let's continue.\"\n\nThe branch flickered over heads as two boys whispered. \"What's an internal contradiction?\" one asked.\n\"Not me poking you—that's external,\" the other grumbled. Their bickering stopped when Fang loomed over them. \"You two can start the discussion.\"\n\nThe class burst into debate. \"Keep an error log,\" one suggested. \"No, write self-reflections,\" another argued. \"Yours just says your attitude's bad!\" a roommate teased. Laughter filled the room—complaints about lights-out and tardiness flew until Fang cut in, smiling slightly: \"Self-revolution should become self-awareness.\"\n\nOn the desk, the peach blossom fell softly onto Fang's lesson plan, covering the red-circled words: two complete breaks."
  prcs.19.a: "Peach blossoms still smile in the spring breeze."

  prcs.20.t: "People in the apricot forest"
  prcs.20.d: "Doctor Zhang had just seen off the last patient of the morning when he collapsed in a chair from exhaustion. It was already noon, and he didn't want to touch the lunch box his wife had prepared. He just wanted to lie down in a chair and rest for a while. As the only doctor in several nearby villages with nearly thousands of people, he really felt exhausted.\n\nHe used to be very tired. Occasionally, a few nearby villagers would come to him for medical treatment, but when he walked in those villages, he could still often see children with high fever being wrapped in swaddling clothes by their mothers with ginger slices applied to them, and elderly people with enteritis vomiting and diarrhea while drinking Coptis chinensis water. So he could only take the initiative to find those patients and provide them with free medical treatment. Prescribe them medicine at cost price. But some villagers either can't afford it or are more superstitious about their own prescriptions. \n\nHowever, in the past few months, he has been busy here, and the clinic has become lively. After all, seeing a doctor is cheaper, and the recent free clinics have helped the villagers popularize a lot of medical knowledge, and more people are still willing to come to him for treatment. Although it is said that there is no need to take the initiative to go to the village, it is inevitable to be tired. \n\nDoctor Zhang walked to the empty backyard, looked at the apricot tree planted behind the yard, and lit a cigarette for the first time and started smoking. \"It would be great if someone could help me share the pressure of seeing a doctor.\" He thought. \n\n\"Is Doctor Zhang here?\" Someone shouted at the door. \n\n\"Please sit down first, fellow villagers, I'll be there soon.\" He threw the cigarette on the ground and stepped on the cigarette butt. \n\nWhen he walked to the reception desk and saw another man in a white coat standing there, he was immediately stunned. "
  prcs.20.a: "\"Dr. Zhang, I am a new doctor, and we will be colleagues from now on.\""
  prcs.21.t: "Thousands of people, thousands of faces"
  prcs.21.d: "Teacher Fang straightened his collar and walked through the flower-lined corridor, breathing in the sweet spring air. The policy of \"letting a hundred flowers bloom and a hundred schools contend\" finally allowed him to break from formulaic doctrine and teach real thought in his ideological and political class.\n\nSunlight poured through the windows as chalk dust drifted. \"Today,\" he said, smiling at his students, \"we'll talk about breaking the old—criticizing the poisonous weeds of our past. For example, 'practice is the only criterion for testing truth.'\"\n\nHe clicked the screen: a 1932 photo of Shanghai workers striking under red armbands. \"They tested truth with action,\" he said, \"and across the street, the British consulate tested its own truth with rifles. So—were both right?\"\n\nStudents shifted uneasily; some frowned, some took notes with new seriousness. The next slide contrasted a 1978 Guangming Daily headline with a 2023 policy report. Then came two images: striking workers forming a human wall during lockdown, and stock traders ringing a bell.\n\n\"Workers prove unity is strength,\" he said. \"Capitalists prove profit knows no sleep. If both are practice, can truth still be one?\"\n\nThe room fell silent except for pages turning. Even the inattentive students looked up. Fang swiped again: a chart of Xiaogang Village's 1982 grain miracle beside footage of drones sowing fields in 2023. \"Practice created miracles,\" he said, zooming in on an equity chart, \"but now, who owns the land? Investment groups?\"\n\nCold air drifted from the vent. The class straightened. \"When we say practice verifies truth,\" he asked, \"is it twelve-hour shifts on the line—or champagne toasts in boardrooms? What truth are your parents testing?\"\n\nFinally, a map of Tuvalu appeared. \"While the rich world trades carbon credits, Tuvaluans sink beneath rising seas. Whose practice speaks the truth?\"\n\nThe spring breeze entered with the scent of wisteria. Fang tossed the chalk onto the desk, smiling as the room erupted in whispers and debate—the sound of thought blooming at last."
  prcs.21.a: "Classmates! Free discussion for five minutes!"

  prcs.22.t: "Catch the Japanese"
  prcs.22.d: " As the People's Liberation Army swept through city after city, the Taiwan puppet forces collapsed instantly. Under the direction of underground cadres, entire units surrendered in droves. There were so many captives that the advance troops could only seize their weapons and leave rear guards to watch them. New recruit Cheng Gang was one of those guards.\n\n\"Gangzi, these strawberry soldiers are hopeless,\" Wei Xiang muttered after dinner. \"We fired a few warning shots, and they dropped their rifles and started saluting. Catching them's like herding pigs. The rear units are going to have their hands full.\"\n\nLao Zhang from the next squad joined in. \"One of them even asked me how to eat guava. Said his mother always peeled and deseeded it for him.\"\n\nCheng Gang nodded, scanning the rows of prisoners. \"Frontline comrades are still fighting. We can't slack off.\"\n\nA sudden crack of breaking branches froze them.\"Hold it!\" Cheng Gang aimed toward the sound. A man in a strange uniform stood motionless, hand trembling near his pistol but not drawing it.\n\n\"Don't move! Drop your weapon!\" Cheng Gang barked.\nThe man slowly raised his hands. His voice shook as he stammered in a foreign tongue, begging for mercy.\nCheng Gang frowned — he recognized that voice. It was his Japanese instructor from college, Mr. Toyokawa.\n\n\"Toyokawa, calm down,\" he said, stepping forward to disarm him. The man kept trembling, whispering the same plea over and over.\n\nCheng Gang's mind flashed back to his teacher's farewell years ago: \"I'm returning home to serve. Take care of yourself, Cheng Gang.\"\n\nA chill ran up his spine. \"He's Japanese Self-Defense Force!\" he shouted to Wei Xiang. \"The devils are interfering with our unification—report to command immediately!\"\n\nWei Xiang lifted the radio. \"Reporting to battalion: enemy Japanese infantry sighted. Requesting support and interrogation.\""
  prcs.22.a: "Ah...old days..."

  prcs.23.t: "New Mountain City, New Era"
  prcs.23.d: "At night, Xiao Zhang strolled in the Jiefangbei state-owned business district in Chongqing. In the past 10 years, there has not been such a big change. 10 years ago, people were impressed by the bustling pedestrian street with huge crowds of people. And 10 years later... it has become a \"cyberpunk\" city.\n\n Chongqing used to have no shortage of high-rise buildings, but in the era of large-scale infrastructure, the planning of building a giant business district has added icing on the cake for this mountain city. After the seaweed, the central government quickly gave Chongqing construction planning guidance, saying that the goal is to move towards a futuristic city. . Soon, this place became a state-owned business district. The night covered Chongqing with a veil, and the steel skeleton of this mountain city became clearer in the dark. The skyscrapers lined up like giants under a spell, piercing the sky between the mountains. The glass curtain walls reflected the neon light, stirring the stars and the lights of the world into a dazzling vortex. The LED lights in several high-rise buildings flashed a few words, but unlike usual, what came into view was \"Salute to the People of Chongqing\". Xiao Zhang was surprised. After all, he had only seen such scenes in novels. "
  prcs.23.a: "It's a foggy city!"

  prcs.24.t: "Old guard, new faces, young people"
  prcs.24.d: "The atmosphere in the conference room was a bit subtle. No one was talking. Some people looked at the faces they rarely saw with a questioning look; while some new faces had uncertain expressions. What was most puzzling was that among these people sat an old man who was older than many of the people present. His face no longer showed the restlessness of his youth, leaving only a pair of calm eyes.\n\nThe conference room was silent for a while, and it was Hu Chunhua who first broke the state: \"Comrades should have discovered that our 20th National Congress has elected many new faces, but also many old soldiers, which reflects both a new look and steady progress. In any case, we should all unite as one.\"\n\n\"So for now, those who need to be transferred include the general leader of state affairs, the host of economic work, the host of foreign affairs, the host of internal affairs, and the host of propaganda work. \""
  prcs.24.a: "Now, let's discuss who the appropriate candidates are..."

  prcs.25.t: "Flowers blooming on red walls"
  prcs.25.d: "If the President is the helmsman of the Republic, the Premier of the State Council is the first officer of this aircraft carrier. The Premier generally serves as a supplement to the President's focus. If the President himself is active in diplomacy, the Premier will govern on his behalf. If the President is diligent in governing, the Premier will handle foreign affairs. In General Secretary Hu's reform plan, it is necessary to concentrate on major events in the future, so the comrade who succeeds the position of Premier must be experienced, strong and able to convince the public. Therefore, the image of an old predecessor emerged in his mind.\n\nComrade Wang Zhaoguo, one of the members of the Political Bureau during the era of former President Hu Jintao, during the era of Hu Jintao, he headed the Federation of Trade Unions of the People's Republic of China and made a series of correct judgments on economic development. He is not only outstanding in ability, but also quite left-leaning in politics. There are rumors that if he were not so left-leaning, he would be the Premier of the Hu Jintao era.\n\nFor such a loyal, firm and capable old comrade, we should re-appoint him."
  prcs.25.a: "A thousand ships pass by the sunken boat, and a thousand trees bloom in front of the dead tree"

  prcs.26.t: "New institutions..."
  prcs.26.d: "In order to adapt to the new international changes and the form of domestic party building reform, the Political Bureau has authorized the establishment of an independent diplomatic department, the People's Committee of Foreign Affairs, which aims to analyze the international situation, adjust the diplomatic policy of the diplomatic department and give corresponding suggestions.\n\nSome old comrades and former members of the Ministry of Foreign Affairs will join it, but the appointment of the position of chairman of the committee is related to the future diplomatic direction. We should make a careful choice.\n\nThe candidate proposed by the Political Bureau is Comrade Le Yucheng. He represents the conservative and harmonious diplomatic trend within the party. He still supports the concept of peaceful development and opposes the concept of imperialist diplomacy. This moderate concept can help us win more trading partners, but it also limits our assistance to revolutionary brother countries.\n\nAnother candidate is Comrade Mao Yuanxin, a veteran revolutionary. He represents the radicals within the party. Although he is old, his revolutionary heart is still enthusiastic. Choosing Comrade Mao Yuanxin can greatly ease the differences in left-wing ideology within the camp, and we can also let go of exporting revolution.\n\nNow, after careful consideration, General Secretary Hu cast a key vote."
  prcs.26.a: "Let us influence the world through peaceful policies"
  prcs.26.b: "Internationale Scheherazade must be realized"

  prcs.27.t: "Reorganization of the National Development and Reform Commission"
  prcs.27.d: "The functions of the former National Development and Reform Commission have changed, and the original personnel should also begin to change. On the road to the automated planned economy, we need a candidate who is familiar with both science and technology and politics and supports the left. And it happens that a local official has all three and supports our cause.\n\nComrade Yuan Jiajun, who comes from the aerospace department, is also a disciple of the old revolutionary Comrade Qian Xuesen. He not only supports the development of high-tech, but also inherits his teacher's loyalty to socialism and the proletariat. Therefore, we will let Comrade Yuan Jiajun be responsible for the reorganization of the National Development and Reform Commission and the reconstruction of the State Planning Commission."
  prcs.27.a: "It's time for some fresh air"

  prcs.28.t: "Return a favor"
  prcs.28.d: "It can be said that Wang Huning, an evergreen in the political arena, has survived for so many years by choosing the right dish for the right dish. His theoretical construction level is rare in the world, and his political vision is unique, so he can make the right choice every time he faces major issues.\n\nWhen Hu Chunhua announced him as the new Secretary of the Political and Legal Affairs Commission at the meeting, he was shocked but also understood: this was the return of favors from the new left. Obviously, although he and the new left have different political views, they still extended an olive branch to him, intending to win over the original \"establishment left\".\n\nAfter the meeting, Hu Chunhua stretched out his hand, smiled kindly and said: \"Although we have different political views, we still have to be united, Comrade Huning.\"\n\nWang Huning hurriedly shook Hu Chunhua's hand, bowed his head slightly and said: \"Maintaining the unity of the party is the life of the party, and we insist on implementing the resolutions of the Party Central Committee. \""
  prcs.28.a: "United...for now."
  
  prcs.29.t: "New agency, new faces..."
  prcs.29.d: "With the end of the Taiwan Strait War, the domestic situation has undergone new changes. The class struggle that was temporarily shelved in the past should be picked up again at this moment. In order to cope with the increasingly complex domestic struggle, the central government authorized the establishment of a new security agency. The organization will draw elites from the Public Security Bureau, the Central Commission for Discipline Inspection, the local municipal supervision committee, the Organization Department, and the Ministry of Economy, and coordinate with various departments and commissions to cooperate with the party organization's layout for economic reforms."
  prcs.29.a: "Let's put on our velvet gloves."
  prcs.29.b: "It is easy for a country to support an enterprise, and it is not difficult to bring it down."
  prcs.30.t: "Footnotes of History (Part 1)"
  prcs.30.d: "\"Unblock! Unblock!\"\nAfter a busy day, Chen Tinglan was leaning on the back of the sofa to rest. The sound waves, one higher than the other, broke into her dream like an iron horse and an ice river. With a violent throbbing of her heart, she opened her eyes and almost jumped up from the sofa as if she was electrocuted: \"What happened! ?\"\n\"Secretary, outside the door, the whole street is protesting!\" The secretary took the signature pen from his chest in panic. He was trembling with heart and hands, and the pen cap slipped from his fingers accidentally. It rolled several times on the floor piled with various materials and reports, and disappeared in an unknown corner.\nChen Tinglan pulled open the curtains, pulled down the window bolt, and pushed open the window. The dull and bleak spring breeze in the evening and the shouts of people rushed into the house, driving away the last trace of sleepiness in Chen Tinglan's mind.\n\"Increase the supplies!\" \"Fully resume work and school! \"On the bright red slogans and posters, people have clearly stated their needs. The police and armed police are sweating to maintain order. They hold riot batons and shields, but no superior will order the suppression of such a peaceful march.\nChen Tinglan sighed: \"This day has finally come...\"\n\"Secretary, what should we do?\" The secretary took two steps forward and asked anxiously. \"Should we send basic supplies to Xuhui District...\"\n\"Yes, not only should we send them, but we should also send them well.\" Chen Tinglan turned his head and looked at the young cadre. \"Comrade Xiao Zhang, I have only been transferred here for a short time. I am considered a frontline cadre who came to put out fires. You will not act like a local snake just because I am a new strong dragon, right?\"\n\"How could it be, how could it be!\" The secretary stood at attention suddenly. \"Secretary, now we all listen to you. At this time of national crisis, we...\"\n\"We are now grasshoppers on the same rope.\""
  prcs.30.a: "Together through thick and thin."
  prcs.31.t: "A ray of hope (I)"
  prcs.31.d: "Chen Mingyuan rubbed his eyes, staring at the dark window. As the youngest deputy director of the Jiaxing Development and Reform Commission, he'd barely rested in three months since the U.S. Civil War triggered global economic chaos.\n\n\"Mingyuan, still working overtime?\" Minister Liu entered with a cup of tea.\n\"Minister, the Caojing Industrial Park's orders have collapsed—one-third of its factories may go bankrupt,\" Chen said, pointing at the sea of red numbers on his screen.\n\"Our foreign trade dependence is too high,\" Liu sighed, setting down the tea. \"This crisis is worse than 2008.\"\n\nChen stood, gesturing to the city's industrial map. \"Sir, this might also be an opportunity. Our GDP grew fast, but real incomes didn't. It's just exports built on cheap labor and resource exhaustion.\"\n\nLiu raised an eyebrow but nodded for him to continue.\n\"With orders gone, factories are idle, yet domestic demand still exists. The real issue is that we've never built a closed domestic supply chain.\" Chen pulled a document from his drawer. \"We can guide industries to shift inward—produce for our own market.\"\n\nLiu read the proposal. \"You're suggesting reorganizing export firms and creating... an 'industrial mutual aid consortium'?\"\n\"Yes. The government coordinates resources and production, not through subsidies, but collective planning to match local supply and demand.\"\n\"Sounds like a planned economy,\" Liu remarked.\n\"Not exactly,\" Chen replied. \"It's market flexibility under state coordination—crisis management with purpose. We put people's needs first, not profits.\"\n\nMinister Liu looked at the young official's tired but determined face. After a long silence, he nodded slowly. \"Write a report for tomorrow's standing meeting. The city might just need this kind of thinking.\""
  prcs.31.a: "We'll see..."
  prcs.32.t: "Public Opinion Choices in Crisis"
  prcs.32.d: "As the global financial turmoil brought about by the American Civil War continued to worsen, the Central Propaganda Department jointly held a meeting on public opinion guidance. The core topic of the meeting was only one: how to guide the domestic public opinion field during the special period of implementing strengthened macroeconomic regulation and some planned economic measures.\nIn the conference room, two obviously different voices clashed.\nSome government representatives firmly stated: \"Under the current situation, public opinion unification is the key to responding to the crisis. We need to focus on promoting the necessity and effectiveness of government regulation measures, reduce discussions on the slowdown of market-oriented reforms, and create a good public opinion environment for policy implementation.\"\nHowever, some think tanks and media representatives held a different view: \"During the crisis, open discussions should be encouraged to gather wisdom from all parties. Excessive control of public opinion may lead to policy mistakes not being corrected in time, which is not conducive to the scientific decision-making of the government.\"\nAfter several days of meetings, the General Office of the Central Committee issued the \"Guiding Opinions on Strengthening Public Opinion Work during Crisis Periods\", which mentioned the main work direction of the media at present——"
  prcs.32.a: "Unify public opinion and strengthen the people's consensus on the necessity of reform."
  prcs.32.b: "Open up discussion, gather social perspectives and ensure effective implementation of reforms."
  prcs.33.t: "Reexamination of the Economic Development Model"
  prcs.33.d: "As global financial markets gradually return to order and the domestic economic situation stabilizes, China's State Council convened a key economic situation analysis meeting. The core topic of the meeting was only one: whether to continue the government's macroeconomic regulation model strengthened during the economic crisis response. \nIn the meeting room, two completely different voices clashed. \nThe representative of the National Development and Reform Commission firmly stated: \"The regulatory system and planned economic elements established during the crisis have successfully stabilized people's livelihood and employment. These mechanisms should be retained and improved. The international situation is not yet completely clear, and we need to maintain macroeconomic control over key industries and resources. \"\nHowever, representatives of the economic community and some ministries and commissions hold a different view: \"Strengthening regulation is an expedient measure to deal with the crisis, and it should be withdrawn in an orderly manner as the crisis ends. Over-reliance on government regulation will suppress market vitality and affect long-term economic growth potential. \"\nAfter several days of meetings, the State Council issued the \"Decision on Optimizing the Economic Governance System\", the most eye-catching content of which is: "
  prcs.33.a: "\"Strengthen the national strategic control system and ensure economic security and resilience.\""
  prcs.33.b: "Give full play to the role of the market and stimulate the vitality of micro-entities."
  prcs.34.t: "Getting through the most difficult moments of the economic crisis"
  prcs.34.d: "Xiaoya pressed her face against the cold window, tracing little circles in the mist. Outside was gray—just like her father's tired face. For months, the house had been quiet. Mom and Dad no longer laughed or watched funny videos with her. They whispered strange words like \"crisis,\" \"economy,\" and \"unemployment.\"\n\nThe milk tea shop downstairs stayed closed, its faded sign reading \"temporarily shut.\" The park trip was always \"later,\" and even bedtime stories sounded dull. Once, she overheard Grandma say through a video call, \"Save more… you don't know if your job is safe.\"\n\nXiaoya noticed snacks disappearing, fewer online packages arriving, and no birthday cake this year. When classmates talked about their parents being \"laid off,\" she searched the word herself. After that, she stopped asking for toys—or milk tea.\n\nBut today felt different. Coming home from school, she saw the milk tea shop's pink sign glowing again. Older students laughed outside, sipping drinks with cheerful \"puff\" sounds.\n\nUpstairs, Dad was typing at his computer, smiling faintly. Mom hummed a tune while cooking. The air in the house felt lighter—like sunshine breaking through clouds.\n\n\"Mom! The milk tea shop's open!\" Xiaoya called.\n\nMom turned, smiling. \"Really? Finish your homework first, then I'll order you one.\"\n\nXiaoya nodded, eyes shining. She wanted to ask about jobs, \"stability,\" and \"plans,\" but instead she just hugged her mom. That night, she overheard her father talking softly about \"new policies\" and \"job guarantees.\" His voice sounded calm again.\n\nXiaoya smiled into her pillow and drifted off to sleep, dreaming of the warm lights of the milk tea shop downstairs."
  prcs.34.a: "Perhaps \"Let's talk about it later\"?"
  prcs.35.t: "Footnotes of History (Part 2)"
  prcs.35.d: "Chen Tinglan leaned on the balcony, watching the sea of demonstrators and the bright red flags fluttering below. Portraits of Chairman Mao swayed among the crowd. The people are awakening, she thought. The people are speaking for their rights. A faint smile curved her lips — the working masses were standing up at last.\n\n\"In order to deceive the central government, the former secretary hid infection numbers and cut supply deliveries. People couldn't get medicine or help,\" Chen said firmly. \"We can't repeat that.\"\n\nThe secretary hesitated. \"You mean—\"\n\n\"Tell the truth,\" Chen interrupted. \"Report it to the center, to the media, to the public. There's been concealment and false reporting in Shanghai. We must tear open this bubble before it chokes us.\"\n\n\"But if we—\"\n\"We must have the courage to admit mistakes before we can fix them.\" She straightened her jacket. \"Now open the door. I'm going to meet them.\"\n\"The demonstrators?\"\n\"Yes. We'll tell them this is our country — the country of workers and peasants. Their voices are heard. We'll face this crisis together.\"\n\nShe descended the stairs as the chorus of The Internationale grew stronger. When the door opened, the crowd froze — stunned to see officials walking toward them.\n\nChen Tinglan stepped forward with a calm smile. \"Comrade,\" she said, extending her hand, \"give me a red flag.\"\nA heartbeat of silence — then thunderous cheers erupted. The anthem rose higher, the voices steadier, and for the first time in weeks, hope rippled through the crowd."
  prcs.35.a: "\"Give me a red flag too!\""
  prcs.36.t: "Victory of the Great Asian Revolution"
  prcs.36.d: "The Central Committee of the Communist Party of China, the Standing Committee of the National People's Congress, the State Council, the National Committee of the CPPCC, and the Central Military Commission solemnly announce to the entire Party, the whole army, and the people of all ethnic groups:\n\nAccording to the report from our World Liberation International Coalition, the last remnants of the \"Taijuo\" imperialist army have surrendered. The imperialist military clique has collapsed, its fascist war criminals captured and awaiting trial and punishment.\n\nWith authorization from the Central People's Government, we hereby declare that the Asian Socialist Revolutionary War has achieved total victory.\n\nComrades! Fellow countrymen! Brothers and sisters across Asia who fought shoulder to shoulder! Friends of freedom and equality everywhere!\n\nToday marks a day of historic triumph — the day of Asia's liberation, the day of revolutionary victory, the day of rebirth for hundreds of millions of oppressed people. Yet it is also a day of remembrance for countless martyrs who perished under imperialist fascism.\n\nFrom the moment the first Portuguese colonial ship docked in Cochin, to the Opium War, the Sino-Japanese War, the September 18th Incident, and the Nanjing Massacre, imperialism has drenched Asia in blood and humiliation. The crimes of centuries are carved into the mountains and buried in the seas. Countless heroes gave their lives crying, \"Down with imperialism!\"\n\nToday, through their sacrifice, we can finally declare with pride: imperialism is defeated! From this victory shall rise a new China, a new Asia — free from war and oppression, united in peace, independence, and strength."
  prcs.36.a: "Mountains are sea, sun is blood."
  prcs.37.t: "Old Look"
  prcs.37.d: "\"You know, while you're creating value for the company, you're also laying the foundation for your own bright future…\" The team leader's tone was full of that familiar mix of flattery and manipulation, trying to make the new recruits obedient and grateful.\n\n\"Leader, I have a question.\" One newcomer raised his hand. \"Before joining, I talked with HR, but I want to confirm — does our company have an overtime culture?\"\n\nThe leader froze for a moment, caught off guard. \"Overtime? Ah, well, there's some, but not much.\"\n\nYou, an old employee, cursed silently. Liar. But you stayed quiet — you couldn't afford to lose this job. The newcomers, however, didn't stop. \"Can the company guarantee rest on statutory holidays?\" \"Is there overtime pay?\" \"What about medical compensation if someone falls sick?\"\n\nEach question hit home. You and the other veterans stopped typing, watching the usually smug leader grow red-faced. \"It's not you choosing the company — the company chose you!\" he snapped.\n\nThe newcomer smiled calmly. \"If the company chose us, shouldn't we also understand it better? That helps everyone, doesn't it, leader?\"\nThe leader's face darkened. He mumbled something and dismissed everyone.\n\nLater, he messaged you privately. \"Old Liu, this newcomer's sharp. You're our best veteran — guide him.\" You added the newcomer on chat, showed him the ropes, and joined him to the company's groups.\nBut that evening, another message popped up:\n\"Everyone stay tonight for a welcome dinner and to finish today's work.\"\nGrumbles filled the chat. \"Overtime on day one?\" \"Are they serious?\"\nThen the newcomer you mentored messaged you privately:\n\"Brother Liu, if there's nothing urgent, I'll go home first.\"\n\"Not staying for the dinner?\" you asked.\n\"No, I'll eat at home. Someone's waiting for me.\"\nThat simple line hit you harder than any speech. Someone's waiting for me. When did going home stop being your choice?\nYou looked around — other veterans were hesitating too. One by one, they began to laugh, whispering in the group chat: Not tonight.\nFinally, you typed:\"Leader, I've got something tonight. I'm heading home.\""
  prcs.37.a: "Just go home."
  prcs.38.t: "Dawn"
  prcs.38.d: "After a few months, the newcomers had proven themselves. The company's first-quarter revenue rose 5% after they joined, enough to catch the general manager's eye. Soon, study groups from other branches would come to \"learn from their success.\"\n\n\"You guys, when the time comes, please don't mention our overtime situation.\" The leader's muffled voice came from his office. You paused by the door.\n\"But leader, it's already known. We worked overtime, yes, but we also got compensatory leave and bonuses.\"\n\nYou froze. Bonuses? Leave? You'd been working the same late hours—yet got nothing. Anger stirred again.\n\n\"I know, I know,\" the leader said nervously, \"but we can't let them think our achievements rely on overtime. It must look efficient.\"\nThe newcomers didn't agree, and finally, the leader sighed. \"Fine, take a break during the visit. Let the old employees handle it.\"\n\nMoments later, you received his message:\n\n\"Lao Liu, the headquarters group will arrive soon. Lead the old staff to prepare our report. This concerns our company's image—no mistakes allowed.\"\n\nYou typed a mechanical \"Received\" and leaned back, staring blankly at the glowing screen. You thought of the little things—the sticky notes of encouragement, potted plants by the windows, the newcomers' laughter. You decided to include those in the report.\n\nThen your chat window blinked.\"Brother Liu, why won't they let us mention overtime to HQ?\"\nYou started typing, \"It's for the company…\" then deleted it and sent, \"It's for your good.\"\n\n\"But shouldn't we be honest? Otherwise, only we get overtime benefits. That's unfair to the others.\"\n\"It's fine. Just endure it a little longer.\"\n\"I don't think so, Brother Liu.\"\nYou hesitated, then asked, \"Then what do you plan to do?\"There was no reply. The silence that followed weighed heavier than overtime ever did."
  prcs.38.a: "I really don't know what these kids are going to do."
  prcs.39.t: "New Look"
  prcs.39.d: "\"When the time comes, I hope your advanced experience can help other companies in the group grow.\" The study group leader shook your hand warmly at the farewell gathering.\n\n\"No... actually, to be honest...\" You scratched your head, about to tell the truth, but stopped halfway. \"It's really the newcomers who brought new energy to our company.\"\n\"Oh? That's interesting. Tell me more.\" The leader leaned forward with genuine curiosity.\n\nYou shared stories of how the newcomers tried bold ideas, how they questioned unfair rules, and how their laughter filled the office again. As you spoke, your gestures grew animated—and your eyes unconsciously shone.\n\"Now I really want to meet these young people,\" the leader said with a smile. You quickly contacted them for a short video call.\n\"Brother Liu, the leader wants to see me?\"\n\"Yes, Sir Liu, but make it quick, I'm still working…\"\n\"Ah, the team leader? Nice to meet you, sir.\"\n\nOne by one, they appeared on screen, each with their own attitude—some calm, some shy, some defiant. The leader seemed more impressed after each call. Finally, you called your favorite newcomer.\n\"Hello, Brother Liu—oh, hello, team leader!\"\n\"Don't be nervous,\" the leader chuckled. \"Your Brother Liu speaks highly of you. I wanted to see what makes you all special.\"\n\n\"Thank you, sir. But really, it's the old employees like Brother Liu who work the hardest. They've been working overtime for months without proper leave or pay.\"\n\nThe room fell silent.\n\n\"What did you say? Overtime?\" The leader turned serious. \"Lao Liu, is that true?\"\n\nYou froze, instinctively wanting to deny it. But seeing the newcomer's honest face, you took a deep breath and nodded. Then, for the first time, you told the truth—about endless nights, uncounted hours, and quiet endurance.\nThe leader listened silently, then patted your shoulder. \"You've worked hard,\" he said, and promised to report it.\n\nDays later, the headquarters sent an investigation team. They confirmed the long-standing overtime problem and launched an \"anti-overtime culture\" campaign across the group. Compensation and leave were restored to everyone.\n\nYou didn't care much about the back pay—it couldn't replace the lost nights—but you still sent the newcomer a message:\n\"Thank you. You did what I never dared to.\""
  prcs.39.a: "Wish you the best."

  prcs.40.t: "The \"National Studies\""
  prcs.40.d: "\"...But now, when we talk about Chinese studies, what do we truly understand?\" Wei Le's voice trembled slightly. \"We remember doctrines, rules, shackles — but forget that our ancestors once sang of love and freedom. Those were real emotions, real desires, not moral sins.\"\n\nShe paused, her gaze sweeping across the silent classroom. \"The so-called 'preservation of heavenly principles' erased human feelings. For thousands of years, people were told to suppress themselves — and we called that virtue. The brilliance of life was buried beneath layers of obedience.\"\n\nSome students lowered their heads; others stared at her, lost in thought.\n\"But Chinese studies,\" Wei Le continued softly, \"should not be a cage. It should remind us that we are part of an endless current of life — one that celebrates emotion, courage, and beauty. The ancient songs were not vulgar; they were honest. The pre-Qin people dared to love, dared to live, dared to be human.\"\n\nShe turned back to the poem on the board, gently tracing the words with her fingers. \"'There is a dead deer in the wild.' It's not about restraint or shame. It's about mourning, about love, about life's cycle. Our ancestors faced death and desire without fear — and that was their wisdom.\"\n\nHer voice softened. \"When you next speak of Chinese studies, don't think of chains and prohibitions. Think of those who sang beneath open skies, who believed that life — with all its joy and sorrow — was sacred.\"\n\nSilence lingered. Then, as Wei Le wiped her glasses, the bell rang, breaking the stillness. \"That's all for today,\" she said quietly. \"Remember — what we inherit is not obedience, but the courage to feel.\""
  prcs.40.a: "Return to their origins, intentions, and more importantly, the people. "
  prcs.41.t: "Dongshan City TV Report"
  prcs.41.d: "At a key moment when all ethnic groups unite around the Party Central Committee led by General Secretary Hu Chunhua, Zhao Shouren, capitalist of Jin Xin Glass Factory, drew attention as a typical case of resisting socialist reform. He long resisted public ownership, disguised sabotage under 'public-private partnership,' illegally moved 400+ tons of quartz sand, and staged 'production accidents,' harming people's lives.\n\nDuring the municipal work group investigation, Zhao refused to repent, spreading absurd remarks at a state-owned reform meeting, revealing his exploitative nature. Under the factory Party branch's leadership, workers exposed over ten illegal acts: wage withholding, collusion with criminal forces, and sabotage of state production plans.\n\nPer the Measures for Handling Private Assets, the government nationalized all Zhao's production materials. The municipal procuratorate will prosecute his crimes. This case shows the Party and government's determination to protect public ownership and the working class; any action against history and the people will be crushed by the proletarian dictatorship."
  prcs.41.a: "Our reporters will continue to cover the story."

  prcs.42.t: "Old Case Revisited"
  prcs.42.d: "The Xinxiang Town Elementary bell rang at 5:30 PM. Li Zhenguo closed his textbook, chalk dust falling on his faded blue shirt, and carefully collected the chalk pieces, as he had over fifty years ago in the 'cowshed.'\n\nThe office at the corridor's end was lit. The red school building was in dusk, the ping-pong table casting long shadows. Li's keychain clinked in the empty hallway.\n\n'Chairman Li' — he froze, hearing the title. Rapid footsteps approached: the municipal Party secretary appeared, mud on his shoes and pants from the rural road, folder in hand.\n\n'Can we talk inside?' Wang asked. Li smelled the bus station scent, saw no black car. The first document was a red-headed investigation decision: '1978 criminal judgment had procedural violations… now revoked.' The second was a yellowed goods list showing three rolls of cotton, nineteen pounds of pork, 157 pounds of grain, and a notice restoring reputation and benefits.\n\nLi waved off the compensation envelope: 'How did the central government view this at the time? I'm happy teaching, but I want to know.' Wang nodded. Moonlight lit the old and new documents. Li watched Wang scrape dirt from 'counter-revolutionary.'\n\n'Back then, I failed to protect revolutionary achievements, causing bloodshed. Now the banner is yours. Don't be ignorant; carry it well — you are the new hope,' Li said, patting the young secretary's shoulder."
  prcs.42.a: "They exchanged a silent glance, which spoke louder than words."
  prcs.43.t: "The Road Ahead"
  prcs.43.d: "At six in the morning, Old Chen was tinkering with his outdated radio. The pothos on the balcony had curled up behind the glass where frost had formed on the flowers; its leaves were yellowed and drooping. The TV was broadcasting the morning news — the first cold snap of the winter. Old Chen pressed the tuning knob between his thumb and forefinger; as he turned it half a counterclockwise revolution, the loose spindle gave a faint, threadlike \"click.\"\"Twenty years on the job, that old thing's more stubborn than me.\" Aunt Li leaned in her robe against the doorframe. New stubble from chemotherapy glinted like frost under the light. She reached for her thermos but it slipped and fell to the floor; the cancer pain flared again and the painkiller's effect had just worn off…\n\n\"It's all right — the last check… wasn't it okay?\" Her voice was a little hoarse as they left. But the CT room at the district hospital was under maintenance, and the cold wind at the hospital gate lifted Aunt Li's wig; Old Chen pressed down her skewed knit hat, though the chill seeped through their collars straight to his chest. They had to rush to the city hospital.\n\n\"Family of Li Huifang, please collect your report!\" The call pierced the corridor's smell of disinfectant; Old Chen sprang up from the metal chair. Winter sunlight slanted through the \"Chronic Disease Prevention\" bulletin at the end of the hall, carving bands of light across his wife's report. The new shadows were more intricate than the ant nest he'd seen in a cable trench last year."
  prcs.43.a: "Findings are consistent. We recommend…"

  prcs.44.t: "Faint Morning Light"
  prcs.44.d: "Six o'clock. Morning light spread through the chilly corridor. Aunt Li took the thermos of freshly poured hot water and gently pushed open Room 710. The bedside monitor displayed concentration readings of the nanorobots in real time. Old Chen pointed at the screen and told his daughter, \"Look at those little red dots disappearing — the 'little fairies' inside your mother are swarming the cancer cells.\"\n\n\"Mom, what's this C—RISPR?\" middle-schooler Duoduo asked, pointing to the label on the monitor. \"Like the light-sabers the robots use in the cartoons you watch — used to eliminate damaged cells.\" Aunt Li smiled, twisted off the thermos lid and handed it to Old Chen. \"Blow on it first, it's just been filled.\" Twenty days earlier she still had three metastatic foci; after multiple expert follow-ups and imaging checks, only the fluorescent traces kept glowing with a green halo.\n\n\"Good morning, Aunt Li. The sensor patches you're to wear today will help the robots locate the diseased cells faster.\" Nurse Xiao Lin carried in a tray with square sensor patches. \"Chen, stop standing there — can't you see Nurse Lin's here?\" Aunt Li glared at him. Lin set the tray aside and gently applied the patch to Aunt Li. Watching the scene, Old Chen suddenly remembered his wife helping to fix the radio back when a screw was stuck inside it. He instinctively took a sip of water… now he understood what it felt like to have a screw lodged inside.\n\nThe latest report shows that the number of circulating tumor cells…"
  prcs.44.a: "...is within the normal range."

  prcs.45.t: "In the Morning Light"
  prcs.45.d: "Another morning. After saying goodbye to the doctor who had seen them multiple times, Aunt Li saw the elders downstairs gathered around a strange contraption — the latest hospital examination simulator. When community clinics organized checkups before, elders often complained they didn't understand how it worked. \"Today, the National Healthcare Security Administration…\" Morning light fell on the balcony as Duoduo tinkered with her \"nanorobot simulator\": a microscope and a glass dish of colloidal solution with magnetic particles — the birthday present Old Chen and Aunt Li had agonized over picking. \"Mom, when I get into medical school I'll build a patrolling robot to check your health!\" Sunlight passed through the colloid in the dish; the magnetic particles danced under the microscope and reflected lively, chaotic images in Duoduo's eyes.\n\n\"The formal inclusion of 'magnetic nanorobot-targeted CRISPR gene-editing therapy' into…\" came a report from the TV. The frost that had once adorned the window began to melt and drip onto the pothos's new shoots. Old Chen tended the plant; its fresh leaves unfurled a pleasing green. \"A patient participating in Phase III covered by insurance shares their experience…\" \"Hey, Chen, I fixed your radio for you.\""
  prcs.45.a: "Wood rejoices."

  prcs.46.t: "The Smart Age in Progress (Part I)"
  prcs.46.d: "Saturday morning at seven, Aunt Zhang, canvas shopping basket on her arm, pushed open the neighborhood's smart supermarket right on time. The blast of cold from the fresh produce section hit her; a thin frost coated the cabinet glass. A few cartons of milk with yellow tags labeled \"30% off\" looked fresh; Aunt Zhang briskly swept two into her basket. A small screen on the freezer flickered and popped up a number with a voice: \"Discount for purchases over 100.\" Aunt Zhang did the sums in her head and tossed a bag of northeastern rice into the cart.\n\nAt checkout she noticed a new poster at the entrance announcing that between two and four in the afternoon robots would deliver groceries for free — the first delivery included green onions and ginger. She squinted and made a mental note to try it sometime, but wondered, \"Convenient, sure, but will there be any jobs left for delivery people?\"\n\nCarrying her groceries home, her phone in the basket buzzed — a message in the resident committee group. Someone @everyone forwarded a notice from the Human Resources and Social Security Bureau. She stood in the stairwell, squinting, scrolling: \"…free training…digital economy talents…intelligent accounting…complete the course and we'll recommend jobs…\" The words \"intelligent accounting\" nudged at her thoughts; her son Li Ming worked in accounting, but she didn't really know what the term meant. She swiped the notice aside and thought she'd look more closely at home."
  prcs.46.a: "Let's make sweet-and-sour pork ribs today."

  prcs.47.t: "The Smart Age in Progress (Part II)"
  prcs.47.d: "It was half past seven when Li Ming finally came home. He loosened his tie and collapsed into a chair. The steam from the sweet-and-sour ribs fogged his lenses. He had little appetite and pushed rice around with his chopsticks, voice muffled: \"Mom, the company's rolling out a new system. Headquarters built some powerful AI — it'll do reports and reconciliations by itself… I heard they're cutting several accounting positions. Sister Wang and the others in their forties say the new job requirements are too hard to learn…\"\n\nAunt Zhang ladled soup; steam rose from the spoon. Twenty-plus years ago when the textile factory restructured, that thin layoff notice seemed to drift back into view.\n\n\"It's not all layoffs,\" Li Ming's voice dropped with hesitation. \"They opened new roles that need financial modeling, process automation… Mom, do you think I should try that retraining?\" His eyes behind the lenses looked a little adrift.\n\nAunt Zhang suddenly remembered the notice she'd seen in the stairwell that morning. She set the bowl down with a thud. \"Mingzi! Wait — I saw something in the group this morning!\" She fumbled for her phone and frantically swiped. \"Found it! Look!\" She turned the screen to her son. \"Free courses, job recommendations afterwards! There's accounting — isn't that exactly what you were saying you needed to learn?\" She watched him read, and the wrinkles at the corners of her eyes smoothed in the light; her voice brightened: \"When I was laid off, I went to night school and learned computers. Back then I didn't even know how to boot a machine; I memorized a five-stroke input chart for months, my fingers blistered… You have much better conditions than we did.\"\n\nLi Ming looked at his mother's silver hair and thought of the bag of rice she'd bought that morning. In the light, the look in his mother's eyes was the same as when she decided to go to night school twenty years ago."
  prcs.47.a: "Mom, another bowl of soup, please…"

  prcs.48.t: "The Strange Old Man"
  prcs.48.d: "At noon, the factory floor emptied. Only a thin old man remained, coughing quietly. Though perhaps in his fifties or sixties, his face was worn like a decayed elm. Hands behind his back, he stared at a red notice on the wall, eyes full of shock, excitement, and above all relief — the relief of finally holding his head high.\n\nHe traced the red paper reverently. His finger stopped on the words \"Ye Zhongmin sentenced to twenty years' imprisonment.\"\n\n\"At last it's over…\" he muttered, recalling past abuses: unpaid overtime, ten-plus hour shifts, dust-choked workshops, workers buying their own masks, pneumoconiosis, and Ye's ruthless dismissals. Once, Xiao Luo's finger was crushed on a carding machine; Ye demanded compensation for the machine and had him beaten until his leg broke.\n\nFor years, the old man had doubted Ye would face justice. Recently, however, a young cadre team had visited the factory, collecting evidence, listening to grievances, and documenting crimes. Finally, the man who had harmed so many workers would become a prisoner. The old man reread the notice, feeling a joy that cleared decades of darkness. Tears formed at the dry corners of his eyes.\n\n\"Uncle Liu! What are you looking at?\" A robust, slightly inexperienced voice called — the new recruit Xiao Lin returning from lunch. The old man laughed, meeting Xiao Lin's puzzled gaze."
  prcs.48.a: "Xiao Lin, let me tell you a story…"

  prcs.49.t: "Rekindling the Flame"
  prcs.49.d: "Japan, as a bastion of democracy in the Asia-Pacific, must shield the region from communism and dictatorship. We call on peace-loving peoples to join the Pacific Defense Treaty Organization. United, we can confront the emerging empire waging bloody wars against democracies and prevent this communist power from imposing dictatorship and denying human rights. We will spare no means to ensure the complete destruction of the communist monster…\n\nThe Japanese prime minister's face froze on the LCD; the speech cut off. Silence fell, then a rising murmur of anger.\n\n\"Comrades,\" Hu Chunhua said, voice firm, \"you heard Japan. The further our socialist revolution advances, the more terrified the enemy becomes—our example inspires revolutionary forces elsewhere. Communist parties and movements across Asia are mobilizing; some governments panic and seek Japanese help. They use 'anti-communism' to encircle us. We cannot stand aside—our revolution must reach beyond our borders to help liberate others. If Japan uses anti-communism as a pretext, we will respond with the people's courage and strength.\"\n\n\"Now is the time to build a new international organization to unite willing revolutionary forces across Asia. If they choose to be anti-communist, we will help our comrades dye their nations red.\""
  prcs.49.a: "The fire of Asian revolution."
  prcs.50.t: "China's Liberation Against Myanmar"
  prcs.50.d: "Due to the irreconcilable conflict between ethnic minority armed groups and the government army, the Chinese People's Liberation Army (PLA) today crossed into Myanmar to assist the pro-communist army in suppressing the rebellion, bringing liberation and stability to the local people. International journalists revealed that this PLA expedition differs from past warlord-led forces, as it involves providing humanitarian aid to the local population. The Tayyip Erdoğan is outraged by this, calling it 'red imperialism's deprivation of the Burmese people of their freedom and democracy."
  prcs.50.a: "A stray dog, barking and howling in madness."
  prcs.51.t: "The daylight is good"
  prcs.51.d: "That evening, Zhang Shouyi, head of the teaching department, stared at his phone. His nephew's message read: \"Third Uncle, are there still spots in the honors class? Xiao Tao's grades are low, but one word from you would help.\" He sighed and typed, \"No, it's not possible right now.\" It was the first time in twenty years he had refused a relative.\n\nThat afternoon had been sweltering. The faculty packed the conference room to hear the new principal, 42-year-old PhD Zheng, speak. \"The nation is promoting education reform. Nepotism ends here; selecting the best is the only principle.\" Zhang smiled faintly. In thirty years, he'd seen many principals speak this way. The school's resources were controlled by locals: cafeteria contracts went to a relative, performance evaluations favored hometown teachers, and teacher assessments were predictable. Previous principals had learned to navigate the network of power, some ties dating back decades. Reformers roared, but the foundations were never shaken.\n\nZhang expected the same from Zheng—an outsider who would submit in two years. But then the unexpected happened: the sports head was caught taking kickbacks, the grade director investigated for illegal fees, the academic affairs director, logistics head, and vice principal all fell. Connections at the municipal and provincial levels were silent or gone. Zhang's carefully built network collapsed overnight.\n\nHe stared at the group photo on his desk. Nearly half of his old friends had been punished or transferred. Hands trembling, he heard a knock. \"Come in,\" he said. Two policemen entered. \"Comrade Zhang Shouyi, we need your cooperation regarding violations of discipline and law under former principal Chen Ming—canteen contracting, book procurement, and related matters.\"\n\nHe stood silently, glancing out at the school playground. The new semester had begun, and students stood bathed in post-rain sunlight.
  prcs.51.a: "The daylight was just right, but there was no longer any room for him."
  prcs.52.t: "Fine Weather Ahead"
  prcs.52.d: "That evening, Zhang Shouyi, head of the teaching department, stared at his phone. His nephew's message read: \"Third Uncle, are there still spots in the honors class? Xiao Tao's grades are low, but one word from you would help.\" He sighed and typed, \"No, it's not possible right now.\" It was the first time in twenty years he had refused a relative.\n\nThat afternoon had been sweltering. The faculty packed the conference room to hear the new principal, 42-year-old PhD Zheng, speak. \"The nation is promoting education reform. Nepotism ends here; selecting the best is the only principle.\" Zhang smiled faintly. In thirty years, he'd seen many principals speak this way. The school's resources were controlled by locals: cafeteria contracts went to a relative, performance evaluations favored hometown teachers, and teacher assessments were predictable. Previous principals had learned to navigate the network of power, some ties dating back decades. Reformers roared, but the foundations were never shaken.\n\nZhang expected the same from Zheng—an outsider who would submit in two years. But then the unexpected happened: the sports head was caught taking kickbacks, the grade director investigated for illegal fees, the academic affairs director, logistics head, and vice principal all fell. Connections at the municipal and provincial levels were silent or gone. Zhang's carefully built network collapsed overnight.\n\nHe stared at the group photo on his desk. Nearly half of his old friends had been punished or transferred. Hands trembling, he heard a knock. \"Come in,\" he said. Two policemen entered. \"Comrade Zhang Shouyi, we need your cooperation regarding violations of discipline and law under former principal Chen Ming—canteen contracting, book procurement, and related matters.\"\n\nHe stood silently, glancing out at the school playground. The new semester had begun, and students stood bathed in post-rain sunlight.
  prcs.52.a: "Better days are yet to come."

  prcs.53.t: "Aerospace Food Reform"
  prcs.53.d: "Cheng Yijie stood in the Aerospace Food Research Institute lab, staring at a steaming plate of Kung Pao Chicken. Her ninth attempt at making Sichuan cuisine for space had failed.\n\n\"Another failure?\" a colleague asked. \"Why not stick to compressed rations?\"\nShe didn't reply, picking up a piece. In simulated weightlessness, the sauce clung like jelly. She sighed, remembering her promise: \"I want to research space food and improve astronauts' meals!\" Her father ran a long-established Sichuan restaurant, and she had grown up watching the spatula fly and inhaling the spicy aromas. Now, she couldn't even cook a proper Sichuan dish.\n\n\"Maybe I should tweak my hometown sauces...\" she murmured. Three days later, an insulated box arrived, holding bottles labeled \"Pixian Doubanjiang,\" \"Sichuan pepper oil,\" and \"Chili powder,\" with a note: \"Our family's ancestral recipes. Try them.\"\n\nHer eyes lit up. In the lab, she mixed a new sauce, adding the special Doubanjiang and using technology to ensure it adhered evenly in weightlessness. \"What are you doing?\" a colleague asked, alarmed at floating red powder. \"An experiment,\" she said. \"Help me contact the space station; I want to video chat with the astronauts.\"\n\nFive months later, the call connected. Three astronauts floated in the station dining hall, her Kung Pao Chicken in front of them. \"Let's eat!\" the commander said, taking a bite. His eyes widened. \"This… this is so delicious!\" The others ate eagerly, thumbs up and smiling. \"It's just like being home!\" In moments, the plate was empty.
  prcs.53.a: "Food is the first necessity of the people"
  prcs.54.t: "New Spacecraft Design"
  prcs.54.d: "At the 20th International Symposium on Space Technology, China Aerospace Science and Technology Corporation and Tsinghua University's Aerospace Lab unveiled the world's first integrated space-air vehicle, the 'Xiaoyao-NX1000.' Featuring a revolutionary composite propulsion system, it enables seamless travel from ground to near-Earth orbit. Its three-stage system combines a turbine-based combined cycle engine (TBCC), a rotating detonation engine (RDE), and deployable Hall thrusters, achieving fully autonomous propulsion. Fang Qiming, R&D head and Chinese Academy of Engineering academician, said: \"Unlike traditional multi-stage rockets, 'Xiaoyao' switches between air and space modes at 32,000 meters, boosting single-stage orbital efficiency by 40%.\"\n\nThe spacecraft's fuselage uses domestically developed 'diamond aerogel,' maintaining titanium-level strength while cutting weight by 65%. Its biomimetic honeycomb structure withstands 3000℃ reentry heat and enables 15°-75° wing deformation via shape memory alloys. The cargo module uses magnetic levitation docking for autonomous on-orbit payload handling. Chief scientist Li Mingrui noted: \"The liquid hydrogen/methane dual-mode propulsion reduces carbon emissions by 85%, with reusable rockets exceeding 30 cycles.\"\n\nGround maintenance takes just 72 hours, and launch costs are one-fifth of conventional rockets. The 'Xiaoyao' series includes a 20-ton cargo carrier, 50-seat passenger craft, and research vehicle. Its demonstrator completed a 12,000-meter suborbital test, with a full Earth-space round trip planned within two years. Applications include space station resupply, tourism, emergency rescue, and deep space relay. Combining aviation and aerospace, it redefines space transport and enables a potential hourly global 'space logistics' model. The International Astronautical Federation hailed it as humanity entering a new era of space travel."
  prcs.54.a: "To do a good job, one must first have the right tools."
  prcs.55.t: "Research on Restructuring Theory"
  prcs.55.d: "Old Chen, what's the good news today? Usually, you just buy cabbage and pork, but today you've bought beef for the first time.\n\nEarly winter's chill seeped through down jackets, yet the cold couldn't dampen the old professor's joy. \"It's nothing serious. I've spent my life studying and teaching philosophy. I can't claim a deep grasp of Marx, but seeing students use outdated textbooks, treating fixed authority as truth, even claiming 'I am the truth,' has always pained me. But I can't blame them—the textbooks are practically a disgrace. Today, being assigned to revise them, I'm truly happy. A problem I've pondered for decades can finally be solved in my lifetime.\"\n\n\"Oh, Mr. Chen, that's wonderful! But we still wonder—what's the use of all this? After teaching philosophy for years, your concepts aren't as practical as my experience selling vegetables. It may sound crude, but the saying 'a scholar is useless in a hundred ways' still rings true.\"\n\nUnexpectedly, Chen smiled, stroked his chin, and said slowly, \"We've discussed this. Ordinary people don't see the use of these concepts. Like high school math—it doesn't guide buying vegetables. I volunteered to rewrite textbooks and join the academic reform project. Some concepts are complex to solve bigger problems; some are deliberately difficult to create barriers. If my knowledge can make life easier for others, then I've contributed.\"\n\nThe two laughed heartily. After the pork was weighed, Old Chen carried the beef, watched the setting sun, and walked briskly home."
  prcs.55.a: "The vendor deliberately undercharged him by two dollars."
  prcs.56.t: "The Road Home"
  prcs.56.d: "When Park Moon-kyung walked along the under-construction highway toward the small village in North Pyongan Province, he hesitated, suddenly losing courage. This was the place he had longed for day and night—the place his grandmother had sung of in lullabies, called out to in delirium, and carried him on her back as a child on the Dandong Iron Bridge, gazing at the Yalu River. \"Moon-kyung, China has treated us well, repay China and Chairman Mao; but I still want to go home, to see the mountains, the rivers, the rice paddies,\" she had said.\n\nHe was only five then, but her words stayed with him almost his entire life. After the Kim family fell, Park Moon-kyung joined the People's Liberation Army without hesitation during the war against the Tayon imperialist bloc, becoming an outstanding soldier. Yet when the war ended and he reached the peaceful mountain village he and his grandmother had longed for, he could not enter. Was he afraid of acquaintances? Or of losing touch with his roots?\n\nHe took off his backpack, retrieved the urn of his ashes, and wandered through the quiet village—among the mountains, past newly built houses painted in Chinese and Korean, listening to children's laughter, smelling the rice paddies. Exhausted, a long-lost tenderness enveloped him, as if he were an infant again. After a long walk, he finally boarded the train home amidst the flames."
  prcs.56.a: "Fallen leaves return to their roots"
  prcs.57.t: "Farewell"
  prcs.57.d: "countless times, even planned escape routes, none mattered today. These were not police in black uniforms but a diverse group—elderly in their seventies and eighties, children barely teenagers—poor patients suffering from cancer. For years, he had imported anti-cancer drugs and sold them cheaply; they couldn't cure the disease, but they eased suffering.\n\nChen Que, a grassroots doctor, had seen countless patients depart in pain. One day, a regular patient disappeared. Curiosity led him to a shabby suburban shack, where recycled garbage was piled outside. The patient lay on a tattered quilt, groaning, holding a prescription and an astronomical bill, too afraid to enter. From then on, Chen Que sourced cheap medicine and gave it to the poor, sometimes free. Though illegal and unlisted in medical manuals, it alleviated suffering.\n\nNow the patients bowed deeply. \"Brother Chen, you don't have to worry anymore. We can buy medicines at the hospital now,\" one said, smiling through his mask. \"Thank you for caring for us all these years. We won't trouble you anymore.\" Two large tears rolled down Chen Que's cheeks. The moment he had imagined for years had come: he wasn't a savior, just an ordinary man who had carried a heavy burden."
  prcs.57.a: "If only all people in the world were free from illness, why should I care if the medicine on the shelves gathers dust?"
  prcs.58.t: "Awarding Ceremony"
  prcs.58.d: "At three in the morning, I tossed in bed. Sentries' footsteps outside were rhythmic like a pendulum, and moonlight slanted through the window onto the foot of my bed. I stared at the worn cuffs of my training uniform—torn by gravel during a landing exercise. Closing my eyes, memories of that day's sandstorm and hissing radio commands filled my mind, until the landing craft touched down…\n\"Attention! Form ranks!\"\n\"Salute to the Commander!\"\n\"At ease!\"\n\n\"Our country needs strong, brave youth, and the world faces unprecedented change. Under the Party's leadership, defend the homeland and expand our space territory! Victory depends not just on experienced commanders and trained soldiers, but on belief in victory! Young people, give your all! No matter the enemy or predicament, believe in victory! Today, you have earned the right to serve in the Railroad Army, to defend and expand our nation. Remember your honor and mission; strive for our motherland's future with unwavering faith! You are the nation's pride and its guardians!\"\n\n\"Attention!\"\n\"Salute to the Commander!\"\n\"The medal-awarding ceremony begins…\"\n\nThus, I became a regular soldier, a true member of the Railroad Army, advancing to shoulder the heavy duty of defending our homeland.\n\n\"Lin Rui!\"\n\"Present!\"\n\"You are now officially a member of the Railroad Army of the People's Republic of China! Congratulations.\"\n\"Yes, sir!\"\n\nThe commander's rough, warm fingers pinned the gold medal to my left breast. Pressed to my heart, it felt heavy, like a bullet casing. Finally on my chest, the medal marked my identity in the Orbital Force. I had already felt the power of these iron wings in training—I must live up to expectations.\n\n\"The medal-awarding ceremony is over.\"\"Attention!\""
  prcs.58.a: "Salute to the Commander!"

  prcs.59.t: "Project Skyfire"
  prcs.59.d: "Comrade Commander, the 'Skyfire Project' we submitted for review has completed preliminary theoretical verification. This project aims to break through the performance limits of traditional explosives and develop a new generation of high-energy explosive systems based on magnesium hydride.\" The presenter displayed a set of molecular structure diagrams on the large screen. \"Compared to traditional TNT, RDX-magnesium hydride explosive has a theoretical energy density several times higher and can also be used as a rocket propellant, solving two major technical bottlenecks for our military in one fell swoop.\" A murmur of discussion arose in the room. A leader frowned and asked, \"How is stability guaranteed?\" \"This is precisely our core breakthrough point,\" the research team leader continued, \"Our newly developed polymer stabilizer keeps it stable in the range of -40°C to 70°C, and its sensitivity to vibration and radio frequency interference is far lower than that of current equipment. In short, it's safer than what we use now, yet releases more energy.\" A brief silence fell over the meeting room. Then, the general presiding over the meeting nodded and said, \"A very good idea. We will report it to the Chairman for approval as soon as possible."
  prcs.59.a.1: "Give it a try!"
  prcs.59.a.2: "Never mind..."
  prcs.60.t: "Skyfire Project Results Report: Success."
  prcs.60.d: "On the desolate Gobi Desert, a mushroom cloud rose slowly, the shockwave from the explosion sweeping across the test site, and the readings of monitoring equipment rapidly climbed to unprecedented heights. Inside the test site command center, researchers in protective suits cheered. High-definition monitoring footage showed that the test target—a simulated enemy bunker—had been completely destroyed. These new explosives, with a mass far smaller than conventional bombs, produced explosive power far exceeding that of the past, becoming the preferred choice for the PLA's next-generation explosive charge. Various departments praised its capabilities and strongly demanded the rapid application of this revolutionary technology to combat equipment. In further meetings, the Army requested its use in a new generation of smart artillery shells, while the Navy and Rocket Force requested its use as a solid rocket propellant… Although how to translate it into practical applications remains to be discussed, all parties agreed that the emergence of this new high-energy material will reshape the firepower strike model of future battlefields, making the PLA's sword even sharper."
  prcs.60.a: "Keep going!"
  prcs.61.t: "Kunpeng Project"
  prcs.61.d: "Comrade Commander, I have proposed a ground-effect vehicle project codenamed 'Kunpeng.' This is a piece of equipment capable of low-altitude, high-speed flight over the sea, evading radar detection and breaking through enemy fire zones at extremely high speeds.\"\n\nThe Commander flipped through the report: \"What are its specific performance characteristics?\"\n\n\"The prototype can carry dozens of fully armed soldiers, has a range comparable to conventional landing craft, and its radar signature is significantly reduced. We are currently developing a larger version capable of transporting armored vehicles.\" \"This is of great significance for future amphibious operations,\" the Commander nodded. \"Indeed, traditional amphibious landings require long preparation times, making them easy for the enemy to anticipate. Kunpeng can quickly establish a landing zone at unexpected locations, disrupting defensive deployments.\" The Commander closed the document: \"It's impressive. I will report to the Central Military Commission.\""
  prcs.61.a.1: "Give it a try!"
  prcs.61.a.2: "Never mind..."
  prcs.62.t: "Kunpeng Project Results Report: Success."
  prcs.62.d: "With a deafening roar, the 'Kunpeng' ground effect vehicle skimmed low over the sea, traversing the simulated enemy fire zone in an extremely short time, and precisely landing on the designated coastline. The moment the hatch opened, fully armed marines quickly deployed and rapidly established a beachhead. The entire landing process was almost entirely undetected by enemy radar; from takeoff to landing, the entire process was so fast that the observing officers could hardly believe it. The commanders at the test site all applauded and praised the success of the Kunpeng project, declaring it a revolutionary breakthrough in the PLA's amphibious landing capabilities. This aircraft provides unprecedented speed and stealth for amphibious operations, enabling it to suddenly appear when the enemy is unprepared and land simultaneously at multiple points, completely disrupting the enemy's defensive deployment. In future wars, it will give the PLA a decisive advantage and provide overwhelming tactical superiority."
  prcs.62.a: "Cool show!"
  prcs.63.t: "Xuanwu Project"
  prcs.63.t: "Xuanwu Project"
  prcs.63.d: "\"Comrade Chief!\" The researchers of the institute saluted and showed their latest achievements to the newly arrived head of the Armament Department of the Central Military Commission. \n\"Please look at this side, chief.\" Chief Deng Xiaoping pointed to the three-dimensional model on the projection screen, \"This is the latest achievement of our 'Xuanwu Project' - the WZ-237 test vehicle.\" He adjusted his glasses, and the minister nodded slightly, signaling him to continue. \n\"The WZ-237 is equipped with a new 140mm electrothermal chemical cannon with composite armor technology and significantly improved frontal protection. Here,\" he pointed to the tank turret part, \"it is a new fire control system developed by us, which can achieve high-precision strikes in complex environments. The most striking is this cabin, which is equipped with a small swarm UAV system that provides battlefield reconnaissance and target designation, greatly improving the tank's situational awareness. Deng Xiaoping touched the screen and the screen switched to combat simulation, \"On the battlefield, the WZ-237 is not only a firepower platform, but also a mobile information center, providing convenience for nearby friendly forces.\" \nThe minister watched the demonstration carefully and nodded: \"Good project, this will bring a qualitative leap to our armored forces.\" I will report to the Central Military Commission immediately. \""
  prcs.63.a.1: "Try it!"
  prcs.63.a.2: "Forget it......"
  prcs.64.t: "Xuanwu Project Report: Success"
  prcs.64.d: "In the smoke and dust of the battlefield, the WZ-237 test vehicle roared out of cover, and the turret quickly rotated to lock on to the target two kilometers away. With a deafening cannon bang, the target was instantly destroyed. At the same time, the hatch on the top of the tank opened, and a group of micro drones flew out like a swarm and quickly dispersed into the surrounding airspace, providing the tank with real-time battlefield images.\n\nOn the edge of the test site, the head of the Central Military Commission and the leaders of the Equipment Department watched the scene intently. As the tank maneuvered at high speed in complex terrain and hit multiple long-range targets in succession, a burst of admiration erupted at the scene. \n\nThe new fire control system is particularly impressive, maintaining amazing shooting accuracy even when the tank is traveling at high speeds. The vehicle-mounted swarm UAV system has given it unprecedented battlefield perception capabilities, successfully avoiding a number of preset \"enemy\" ambush points. \n\"The success of the Xuanwu project marks a new leap in our army's armor force. The chief engineer proudly said at the briefing, \"WZ-237 integrates firepower, protection, maneuverability and informatization, which can not only cope with the current battlefield environment, but also lay a solid foundation for future information warfare.\" The leaders of the Central Military Commission nodded with satisfaction: \"Putting this type of tank into production and installing it as soon as possible, which will greatly improve the combat capability of our army's mechanized troops.\" "
  prcs.64.a: "New army toy! Hurray!"
  prcs.65.t: "Changying Project"
  prcs.65.d: "Comrade Commander, I am reporting to you on the latest progress of the 'Changying Project.' This is a comprehensive upgrade of our previous missiles, aimed at providing our sixth-generation J-36 fighter jet with all-around strike capabilities. To this end, the project team has developed a complete modular missile system.\"\n\"The core concept of the Changying Project is 'multi-purpose integration.' Each missile adopts a universal base design, allowing for rapid warhead replacement according to mission requirements. Our air-to-air version is equipped with an advanced radar seeker, capable of maintaining lock-on even in severe electromagnetic interference environments; the air-to-ground version integrates a composite guidance system, enabling high-precision strikes in all weather conditions; and the air-to-ship version employs a new stealth shell and trajectory-changing technology, effectively evading enemy shipborne air defense systems.\"\n\"Most notably, the Changying series missiles can conduct swarm coordinated operations. When a fighter jet launches multiple missiles, they automatically network, share target information, and formulate the optimal attack path to reach any target we wish to strike.\"\n\"Very good. We will report the relevant matters of the Changying Project as soon as possible. Please make a decision, Chairman."
  prcs.65.a.1: "Give it a try!"
  prcs.65.a.2: "Never mind..."
  prcs.66.t: "Changying Project Results Report: Success"
  prcs.66.d: "At a secret Qingdao range at 06:00, technicians in protective suits finished checks on a J‑36. Under its wings hung three stealth‑coated missiles—the Changying.\n\nWith a roar the jet climbed and vanished into cloud. Three hundred kilometers out, obsolete warships lay anchored as targets. In the command center the pilot radioed, \"Entering combat airspace, commencing mission,\" and armed the missile cluster. The three missiles separated, then held formation, coordinating like an unseen swarm.\n\n\"Swarm coordination established; missiles planning attack paths,\" the pilot reported. The missiles split and attacked from different angles and altitudes, adjusting trajectories to evade simulated intercepts. One struck the bow, the others hit vital points in rapid succession. The aging ships burned and sank.\n\nThe control room erupted in cheers. The Changying's fusion of AI guidance, encrypted networking and radar‑beating coatings proved the system's lethality and flexibility—giving fighter aircraft a new, precision swarm strike capability in complex battle environments."
  prcs.66.a: "The dream roars."
  prcs.67.t: "Short Sword Project"
  prcs.67.d: "\"Comrade Commander, please allow me to introduce the 'Short Sword Project' to you. This is a major breakthrough in our individual soldier weapon field, designed to provide every infantryman with a miniaturized, multi-purpose loitering munition system. Traditionally, individual soldiers can only carry a limited range of weapons and equipment, resulting in limited options when facing complex battlefield environments. However, the Short Sword Project will completely change this situation.\"\n\n\"The Short Sword system consists of a soldier-borne launcher and multiple miniature loitering munitions. Each munition is lightweight yet integrates an advanced AI navigation system and a modular warhead. Soldiers can quickly configure different mission modes—reconnaissance, anti-armor, assault, or area suppression—based on battlefield needs via a tactical tablet they carry. After launch, the munitions can loiter over the battlefield for up to 40 minutes, ready to receive instructions and change missions at any time.\"\n\nThe researcher opened the carrying case, demonstrating several small, dragonfly-shaped munitions: \"Most impressively, the Short Sword system possesses swarm coordination capabilities. Multiple munitions can form a tactical network, sharing target information to achieve small but lethal saturation attacks.\"This will give our infantry squads the striking capabilities previously reserved for high-level firepower units.\n\n\"Exciting! This plan must be reported to the Central Military Commission immediately.\""
  prcs.67.a.1: "Give it a try!"
  prcs.67.a.2: "Never mind..."
  prcs.68.t: "Short Sword Project Results Report: Success"
  prcs.68.d: "At dawn in Xinjiang, a lightly armed infantry squad crept through rugged mountains. The lead soldier carried an unremarkable backpack. \"Target two o'clock—armored vehicle in cover,\" the captain whispered over the headset. The soldier opened the pack, deployed several dragonfly‑like loitering munitions and configured missions on his tablet. \"Shortsword, ready.\"\n\nThe munitions rose and slipped through the valley with near‑silence, forming coordinated formations invisible to enemy radar. Dots on the command center screen split: one circled for recon, one struck the comms antenna, three struck the armored vehicle. Precise explosions destroyed the target and disabled nearby facilities while the squad remained concealed.\n\n\"The Short Sword test exceeded expectations,\" the report stated. The system achieved individual‑soldier control, multitask execution, and coordinated cluster attacks—without exposing a single soldier to enemy fire. The summary concluded that Short Sword represents a qualitative leap in infantry strike capability, offering new precision‑strike options for complex environments."
  prcs.68.a: "Call roll."
  prcs.69.t: "Project Dawnlight"
  prcs.69.d: "\"Oh my god...\" The leader gazed at the massive blueprint of the space station, unable to help but exclaim, \"This is the result of your 'Project Dawnlight'? How does this space station work?\"\nSeeing the leader's astonished expression, the researchers at the institute excitedly replied, \"Project Dawnlight aims to create an orbital fortress equipped with high-power laser weapon systems capable of accurately striking ground targets! The space station will integrate advanced adaptive optical systems and a supercomputing core to real-time correct atmospheric disturbances, ensuring the laser beam locks onto targets with extreme precision. Whether it's lightly armored units, enemy command centers, or moving strategic assets, a single strike can utterly destroy them!\"\n\"Not only that, Project Dawnlight Space Station will also be equipped with an autonomous defense system, including micro-intercept missiles and Whipple shields, capable of withstanding threats from enemy anti-satellite weapons. The station's power will be provided by a next-generation micro-fission reactor, ensuring sustained combat capability. It can be said that Dawnlight is like an eternal sun, shining wherever there is a threat!\"\n\"Too amazing! Immediately compile a detailed report and submit it for the Chairman's approval!\" The leader, unable to conceal his excitement, declared."
  prcs.69.a.1: "Let's see!"
  prcs.69.a.2: "Forget it..."
  prcs.70.t: "Project Dawn Report: Partial Success"
  prcs.70.d: "Despite the research team's best efforts, the Dawn Project has not fully met its expected goals. The high-power laser installed on the space station revealed critical issues during testing: its output power is insufficient to destroy ground targets in a short period. Mobile targets can quickly escape the beam's lethal range, while fixed targets can be significantly weakened by deploying cheap smoke screens or reflective coatings. If power is forcibly increased to meet design specifications, the immense waste heat generated by the laser will instantly burn out core components, potentially destroying the entire space station. \n\nFacing a series of disheartening data, researchers couldn't help but sigh. However, what gave them some solace was that their work was not in vain—the unprecedented ultra-large laser could play a significant role in high-energy physics, and the construction in space also provided valuable experience. At the very least, there was the Dawn space station itself—the space agency was certainly envious! "
  prcs.70.a: "Aimn't half bad!"
  prcs.71.t: "Wind Blows, World changed (I)"
  prcs.71.d: "Ying Wuhui stood in the new multimedia classroom, fingers brushing the smooth electronic whiteboard. The scent of locust blossoms filled the spring air. He had expected hardship as a young teacher sent to the countryside, but the bright, modern classroom made him feel he had never left the provincial capital.\n\n\"I didn't expect the equipment here to match the city's… my resolve feels wasted,\" he murmured.\n\nDuring break under a century-old locust tree, Ying and colleagues discussed teaching. A veteran teacher said, \"It changes daily… no one wants this remote post. Even those who come are often 'gilded goods,' staying months before leaving. The village chief's nephew taught here ten years despite barely finishing technical school. The kids were like untended weeds.\"\n\nYing frowned. \"And now?\"\n\"The new county education chief is decisive,\" the old teacher said, admiration in his eyes. \"He dismissed all unqualified teachers despite protests from the village chief.\"\n\nAfternoon sunlight lit the classroom as Ying led a science experiment. Children crowded around microscopes, marveling at the tiny world. \"Can we become scientists?\" a girl asked. \"Of course,\" he smiled. \"Work hard, and any dream is possible.\"\n\nAt night, the village courtyard overflowed with people. A young education bureau cadre spoke about the bright future for rural schools. Villagers cheered: \"Our children can now access city-level education, use microscopes and multimedia tools!\" \n\nSomeone muttered, \"Now everything must follow the rules; connections won't help.\" The clamor drowned the complaint. Ying heard it, but stayed silent, feeling the quiet promise of change."
  prcs.71.a: "Change wouldn't happen overnight, but it would in years."
  prcs.72.t: "Wind Blows, World changed (II)"
  prcs.72.d: "The next morning, Teacher Ying stood on the playground, watching the children line up neatly, heads held high, running their morning exercises with a serious yet lively air. In the distance, the mountains were like dark eyebrows, shrouded in morning mist.\n\nThey say dreams don't last, but last night's dream, along with this morning's dawn, lingered in his mind. In the dream, these children, once called weeds, grew up to be successful, blossoming and bearing fruit in various fields.\n\nA controversial phrase from the Xinhua Dictionary flashed through his mind: Zhang Hua was admitted to Peking University, Li Ping entered a secondary vocational school, and I work as a sales clerk in a department store: We all have a bright future.\n\nOnce, this sentence seemed so ridiculous. But now...\n\nFor the first time, we discovered that this sentence was not out of reach.\n\n\"Perhaps this is the mission of our generation,\" he murmured to himself, \"to illuminate every corner with knowledge and ideals.\" The bell rang, and a new day began. The classroom lights came on, and laughter, murmurs, and playful shouts filled the air, followed by Ying Wuhui's reprimand. All the other sounds fell silent, leaving only Ying Wuhui's voice as a solo performance.
  prcs.72.a: "Class, today we're going to talk about…"
  prcs.73.t: "Publication, Association, Censorship (I)"
  prcs.73.d: "In the latest issue of the People's Daily, Comrade Hu Chunhua's article led the edition Let People speak—The Sky Won't Fall.\n\n\"Comrades, we must practice genuine people's democracy. Whether inside or outside the Party, democratic centralism must be upheld. The Communist Party of China is the people's party, and the masses must be allowed to speak—even to criticize us. Some comrades fear public discussion, worried it may diverge from the Party's guidance. When this happens, they suppress the people's enthusiasm. Is this the behavior of a true communist? If the masses only offer praise, never raise concerns, there is a serious problem. How can we reform if we cannot even recognize issues in our work? How can we truly serve the people?\n\n\"Chairman Mao once said: \"They are afraid of the masses, afraid of their criticism. What reason do Marxists-Leninists have to fear the people? Mistakes should be admitted, yet some fear the masses speaking. The more they fear, the more suspicious they appear. We should not be afraid. Our approach: uphold truth and correct mistakes at any time. Issues of right and wrong in our work are contradictions among the people. Resolving them requires discussion, reasoning, criticism, and self-criticism—democratic methods, letting the people speak.\"\n\nAll Party members should put this into practice: allow the people to speak and ease censorship in artistic publications, without creating disorder.
  prcs.73.a: "Next Page"

  prcs.74.t: "Memory of the May 30th Movement"
  prcs.74.d: "Shanghai, a city with a brief yet turbulent political history, has recently taken on a new face. In May, as the hub of national propaganda, the city brimmed with renewed energy. Workers, through spontaneous organization, held a commemorative march recalling past Party-led strikes against imperialism and capitalism.\n\nThe Shanghai Party branch posted on social media that the march marked a major advance in the political consciousness of workers, promising broader rights in future reforms and steadily increasing class awareness and sense of ownership.\n\nThe May Thirtieth Movement had been a landmark achievement under past Party leadership, but its memory had often been overshadowed by \"national rejuvenation\" propaganda. Rumors circulated quietly, but no one spoke openly. Without the Party's tacit approval and support, the march would not have advanced so smoothly.\n\nThough state media stayed silent and police maintained order, the event quickly spread across short video platforms and social media. Within the Party, conservatives worried it might disrupt production and the economy, while reformists welcomed it as a sign of progress in expanding workers' rights. Public opinion was mixed, but the Party's commitment to reforming labor rights and upholding the proletarian democratic dictatorship remained resolute.
  prcs.74.a: "Let's set the next parade location in Shaoshan."
  prcs.75.t: "A Young Student's Diary: My Taipei Road Trip"
  prcs.75.d: "Feb 2, Sunny\nToday is special! Our family is driving to Taipei! Dad checked the car, Mom packed snacks, and my sister and I were excited in the back seat. On the highway along the coast, the sky was blue and the sea endless from Xiamen to Pingtan.\n\nFeb 3, Sunny\nWe crossed the Pingtan–Taipei sea bridge! Surrounded by the blue sea and salty breeze, Dad stopped at a service area on a small island with an aquarium. My sister and I saw tropical fish and a huge turtle. Later we reached Taipei; the streets were busy and smelled of food. At Shilin Night Market, I had a giant chicken cutlet and bubble tea.\n\nFeb 4, Cloudy\nWe visited Taipei 101 and saw the whole city from above. At the National Palace Museum, I loved the \"Jadeite Cabbage,\" and my sister loved the pandas at the zoo.\n\nFeb 5, Overcast\nTime to drive home. I asked Dad if I could drive here myself someday. He said yes — this highway brings friends on both sides closer. I hope to return and explore more of Taiwan."
  prcs.75.a: "A bridge spans north and south, a path to common understanding"
  prcs.76.t: "Publishing, Association, and Censorship (II)"
  prcs.76.d: "Regarding associations, I think people should be allowed — and even encouraged — to form them. Many comrades fear the masses and their movements. When people protest or organize, some want to crush everything indiscriminately. This thinking must stop! Our Party rose with the people and represents their interests. How can we fear popular movements? Protests and associations show dissatisfaction with our work; we should self-criticize and negotiate peacefully. Don't assume foreign reactionaries are misleading them — the people are capable of judgment.\n\nLet the people speak and organize, and ease censorship. Some may resist, but the sky won't fall. At the same time, not everything should be open. The Party must uphold socialist democracy and proletarian culture, not reactionary pseudo-democracy or decadent capitalist ideas, which still require strict review."
  prcs.76.a: "Next page"

  prcs.77.t: "Publishing, Association, and Censorship (III)"
  prcs.77.d: "Likewise, in censorship we cannot imitate the West, using \"democracy\" as a shield. Associations must operate under Party leadership: either form a Party branch or have one assigned. No space for deceptive, showy, or bizarre groups. Organizations united around the Party must have clear goals and principles. Relaxed standards don't mean arbitrary actions or turning into deceptive shells. We aim to create groups for the people to participate freely in politics, not front organizations for manipulation or espionage.\n\nThink carefully: without fully promoting people's democracy and intra-Party democracy, how can there be true proletarian centralism? Suppress speech and protests, and socialism will become revisionist, a de facto bourgeois state, turning proletarian dictatorship into a reactionary, fascist one. We reject Western-style electoral games; the best weapon is to mobilize people to understand and engage in politics. Ignoring this is dangerous. Those who truly serve the people must carry out this reform — anyone trying to block it will be drowned in the ocean of people's power."
  prcs.77.a: "The trend is vast. To follow is prosper, to oppose is perish."
  prcs.80.t: "Southeast Asia Descends into Chaos"
  prcs.80.d: "Multiple media report that after the People's Republic launched \"Operation Silent Dawn,\" already fragile Southeast Asian societies and economies deteriorated further. Coupled with prior Wall Street and oil crises, large-scale rallies and protests erupted. When the PRC navy moved into the Malacca Strait, maritime trade for Indonesia, Malaysia and the Philippines was severely disrupted, becoming the last straw for social stability. Those states declared emergencies and deployed military and police to suppress mass gatherings. Harsh crackdowns only increased calls for a return to stability; many said they would do anything to restore their former lives. Citizens began organizing spontaneously to resist security forces. Governments still claimed control in name but were effectively consumed by turmoil. Seeking outside help, they turned to external powers; responses came from the newly unified PRC and the Japan-led Pacific Defense organization. Foreign intervention pushed domestic problems to the breaking point and ignited civil wars across the region."
  prcs.80.a: "The pearls have dimmed."

  prcs.81.t: "Southeast Asia Restores Order"
  prcs.81.d: "Latest reports say pro-China forces, aided by China, won the civil conflicts in several Southeast Asian states. Under Chinese guidance these factions will build new socialist regimes and adopt contemporary Marxist programs. This marks a major breakthrough for the Pan‑Asian Liberation Front: China's influence has expanded from the South China Sea into the western Pacific and eastern Indian Ocean. With the civil wars ending, affected countries are expected to recover stability and development with Chinese assistance. For the Pacific Defense Pact this is a diplomatic setback: after significant losses of money and manpower they withdrew and accused China of excessive interference and influence over local governments. China's foreign ministry responded that China has always loved peace and, amid turbulent times, acted as a responsible major power fulfilling its duties."
  prcs.81.a: "The Japanese are angry...at their own inability."


  prc_change.1.t: "Li Keqiang passed away"
  prc_change.1.d: "Today, a breaking news shocked the whole of China: Li Keqiang, a member of the Standing Committee of the Political Bureau of the Communist Party of China and the Premier of the State Council, who was less than 70 years old at the time, died of a sudden heart attack in Beijing. This is extremely unbelievable for the leaders of the Communist Party of China who generally have good medical insurance.\n\nIt is reported that Li Keqiang had worked for many days to deal with the sudden oil crisis and the previous outbreak of the new crown epidemic. After Li fell into a coma, the medical team immediately launched a rescue, but in the end it was still powerless. In the official unified caliber, this tragedy was caused by Premier Li's long-term and high-intensity work.\n\nLi's death is undoubtedly a symbol, symbolizing that China's administrative machine can no longer continue under high-load operation. Obviously, a storm will sweep across China with the death of the head of government."
  prc_change.1.a: "Winter is coming..."
  prc_change.2.t: "Interview - Up"
  prc_change.2.d: "In the courtyard of Longdong County Party Committee, where the morning mist had not yet dissipated, dewdrops condensed on the new buds of the old locust tree. In the reception room of the county party committee, the faded wooden long table was polished to a shine, the plastic thermos was steaming, and the slogan "Seek truth from facts" in Fangsong font on the wall was faintly golden in the morning light.\n\n"Here we come!" Someone shouted. Three black cars drove to the gate of the courtyard. The door of the leading Red Flag car opened, and Hu Chunhua, wearing a navy blue suit, walked steadily. He waved to the crowd, and the Shanghai watch on his wrist flashed in the morning light.\n"Comrades, I've been waiting for a long time!" The thick Hubei accent echoed under the eaves, "Today we won't read the manuscript, but just chat about family matters. "He sat down at the head of the long table, took out a fountain pen from his suit pocket, and spread out his blue notebook on the polished tabletop.\n\nZhang Degui, a large cattle farmer, stood up, rubbing his cracked palms: "Report to the chief, our cooperative has 300 cows..." "Don't report." Hu Chunhua interrupted with a smile, "Just call me old comrade. Comrade, sit down and talk slowly."\n\nOld Zhang's dark face flushed: "Feed prices have risen sharply, and silage pits are not enough..." The pen tip rustled as it moved on the paper. "Experts from the Provincial Academy of Agricultural Sciences will be stationed here next week." Hu Chunhua turned to the accompanying cadres and said, "Agricultural machinery subsidies should be tilted towards breeders. "\n\nA sigh suddenly came from the corner. Hu Chunhua looked at a teacher sitting in the corner. He was absent-minded and dazed. Looking out the window, Hu Chunhua stood up and walked over, patted the teacher on the shoulder, and he woke up as if from a dream, "Little comrade, you are the teacher representative of the county here, why are you sighing?" "Prime Minister Hu, our county is short of teachers and teaching aids, but it has not been approved." After the teacher representative answered, he looked at Hu Chunhua with expectation. Hu Chunhua nodded, "After a while, the province will support you. If it doesn't come, you can call the province. This matter will definitely be put on hold."\n\nSeeing that the problem could really be solved, the worker representative Wang Jianguo stood up and was about to speak, Hu Chunhua suddenly asked: "Old comrade, the calluses on your hands are probably caused by the lathe, right?" Amidst the laughter of the whole room, the old worker raised his calloused hands: "Our county technical school is short of CNC machine tools..." "Okay! "The chief slammed the table and said, "The province will allocate 20 new equipment next month, and will also build a technician training base!"
  prc_change.2.a: "Next page"
  prc_change.3.t: "Interview - Next"
  prc_change.3.d: "As the sun rose higher, the shadow of the old locust tree shrank into a small ball. When the village party secretary Zhou Weidong held the account book to report the poverty alleviation results, Hu Chunhua suddenly stretched out his hand: "Let me see." He adjusted his reading glasses and his fingertips ran over the dense numbers: "Comrade Weidong, the money for repairing the canal in the account..." "It was specially approved by the province!" Zhou Weidong stood up anxiously. "Don't panic," Hu Chunhua smiled, "I mean we should add another 300,000 to repair the branch canal." When the noon bell rang, the leader tore a page of paper from his notebook: "This is my phone number. If you encounter difficulties, come to me directly." He turned and looked at the party emblem and national flag on the wall. "Back in Yan'an, Chairman Mao said, 'We Communists are like seeds.' Now these seeds must take root and sprout in the soil of the new era! "\n\nBefore leaving, Hu Chunhua put a fountain pen into the hands of student representative Zeng Haoran: "Baby, you have to study hard and write better articles than us." When the motorcade drove out of the county party committee gate, tens of thousands of people had already been waiting along the street. The sun pierced through the clouds, and the party emblem on Hu Chunhua's chest shone brightly in the spring breeze.\nThe new branches of the old locust tree stretched in the wind, and next to the faded "Serve the People" slogan, the newly installed electronic screen was scrolling the red words "Comprehensively Promote Rural Revitalization."
  prc_change.3.a: "...working completely for the benefit of the people."
  prc_change.4.t: "Planning"
  prc_change.4.d: "Hu Chunhua looked around, and several faces were uncertain under the dim light. He cleared his throat, and the whispers around him disappeared instantly, waiting quietly for him to speak.\n\n"Everyone has seen it during this investigation." Hu Chunhua said, "The unemployment phenomenon outside is very serious, and it is almost threatening the social order."\n\nEveryone nodded silently. Everyone knows the impact of the epidemic on exports: the foreign situation has fallen into extreme chaos, and large numbers of foreign trade orders have become empty words. Many small factory owners woke up and found that the heads of foreign companies they had contacted with were either missing or in the morgue. The once prosperous Yiwu is now full of mourning, with companies with broken capital chains and workers who have been owed wages everywhere. The government is racking its brains to arrange the lives and work of these people, but it is undoubtedly a drop in the bucket in today's economic downturn.\n\n"We may be able to provide relief to these workers in a short period of time, but it will not last long. "Someone said, "There are only two solutions. One is to wait for the foreign countries to gradually stabilize and foreign trade to naturally recover..." He was interrupted: "Looking at the current international situation, is it still possible to stabilize?" This statement aroused a voice of agreement.\n\nHu Chunhua smiled bitterly: "Then we only have one way." He didn't say what it was, but everyone present knew it well. They nodded one after another, and their eyes became firm. Under the dim light, a plan was emerging..."
  prc_change.4.a: "The storm is coming."
  prc_change.5.t: "United Front"
  prc_change.5.d: "Looking at the sunset outside the window, Hu Chunhua thought deeply for a long time. In his office, the heads of several key ministries had been sitting around for a long time. "Comrades," he said softly, "the current situation is clear to everyone." \n\n"The old leftists have been calling for reforms in recent years, and there are more and more new leftists among intellectuals." An official said, "They all oppose the current unfair distribution." \n\n"And those grassroots cadres," another added, "many people miss the spirit of serving the people in the past. Even in the army, there are many comrades who support change." \n\nHu Chunhua nodded: "It's time to unite these forces. We need a new united front to prepare for the coming changes." \n\n"But be careful," an old comrade reminded, "We must grasp the scale and not let the situation get out of control." \n\n"I understand," Hu Chunhua stood up, "This is a necessary change, for the people and for the survival of the party. ""
  prc_change.5.a: "Hearts turn north"
  prc_change.6.t: "A speck of dust in the era"
  prc_change.6.d: "In the market, Xiao Chen took the last two eggs from the paper box, his mind in a mess. He opened WeChat and checked his balance. After deducting the necessary expenses, he only had 32 yuan left this month. His wife was at home in confinement after childbirth, and he lost his job three months ago. He used to have a monthly salary of over 10,000 yuan, but now he can only be frugal. Wearing a mask, he walked home with vegetables. Halfway through, he heard the sirens of police cars and the roar of the people on the next street. He didn't want to get involved, as his wife was still waiting for him at home.\n\n"Give me back my job!"\n\n"Give me back my salary!"\n\nThe sound of the horn echoed in the community, and he couldn't help but feel a little upset. He walked up the stairs and heard the sobbing of Sister Cui next door, and couldn't help thinking that she had also lost her job. He thought for no reason, "Maybe we are both wanderers in the world." But he couldn't provide more help. The powerlessness of government measures, the dying struggle of enterprises, and the free fall of the economy, he seemed to understand the neighbors who were marching outside."
  prc_change.6.a: "A mountain on an individual."
  prc_change.7.t: "The factory no longer roars..."
  prc_change.7.d: "Zhang Jianguo sat at his desk, holding a yellowed bill, looking at the latest People's Daily with a worried look on his face. The headline on the front page read "The Sixth Middle East War broke out, and Arab countries imposed an oil embargo." This mechanical processing factory, which had been struggling for nearly 30 years, was now struggling like a terminally ill patient. The workers' wages had been in arrears for almost three months; the remaining book funds were not even enough to pay for the materials. The loan from CCB was due next month. When the last old customer withdrew the order yesterday, he rubbed his hands and apologized, saying that the orders from the US market had been cut by 70%.\n\nHe sighed, recalling the ups and downs his factory had experienced: this factory had risen against the trend in the industrial winter of the Asia-Pacific financial crisis, and had also stood firm in the 2008 financial tsunami. But now, it has exhausted all its tricks and can't find a way out... Thinking of this, he gently slapped the bill in his hand on the table, and supported his head with his other hand. He smiled nervously."
  prc_change.7.a: " "This time it may really not be possible to continue." "
  prc_change.8.t: "2022 Chinese Communist Party General Secretary Election"
  prc_change.8.d: "The much-anticipated 20th National Congress of the Communist Party of China recently came to an end in Beijing. Delegates from all over the country have left Beijing one after another, but the magnificent and solemn Great Hall of the People has not turned off its crystal chandeliers. This political ceremony can only be officially declared over when the newly elected 20th Central Committee completes its first agenda and elects the party leaders.\n\nWait until the day of the press conference. Facing countless camera flashes and shutter sounds, the seven members of the Central Standing Committee, including the General Secretary of the Communist Party of China, walked on the red carpet and appeared to the world. Surprisingly, the former General Secretary Xi Jinping did not continue to be re-elected as speculated by countries around the world, but followed convention and gave up the throne of General Secretary to Hu Chunhua, the designated successor of the former leader of the Republic, Hu Jintao. Governments around the world cautiously congratulated Hu and waited with suspicion for the first step of the new leader, who was rumored to have close ties with the left wing of the Communist Party of China."
  prc_change.8.a: "The thousand-year-old iron tree is about to bloom."
  prc_change.9.t: "Preview"
  prc_change.9.d: "When he received the list of the presidium of the conference at the preparatory meeting, he immediately frowned again, then read it carefully several times, and even counted it silently in his mind, but repeated it several times, and the result was always the same. He raised his head and looked at the other members of the review team in the conference room.\n"This... uh, is this list okay? "His tone was the same as usual, without any change.\nThere was a moment of silence in the conference room. Everyone else in the conference room turned their heads away and didn't look at him. Only Wang Yang and the others looked around and glanced at him with a playful look.\nThe corners of his mouth twitched, and the piece of paper in his hand also trembled slightly. He glanced at the circle of people in the conference room. Except for the few guys who dared to look at him directly, the others just lowered their heads and didn't speak.\nHe nodded, let out a long breath, grinned, and gave Wang Yang a look with sparks in his eyes.\nFinally, Wang Yang spoke: "Comrade General Secretary, this list of the presidium was reviewed by us together, and there is no problem. There is no need to review it again. We have reviewed and passed it. "After saying that, Wang Yang lowered his head and raised the corners of his mouth.\nHe looked around the conference room for several times, and no one joined in. Everyone was just silent. The slogans in various mass incidents in various places, the remarks attacking him on the Internet, and even the violent incidents that openly attacked the entire country and the party, all made the conference table where he was now constantly up and down. Although he was an experienced old captain, how could such a ship survive such a storm? He couldn't help but tighten the neutral pen used for taking notes.\n"Since this is the decision made by this group now, I can't interfere." After a long silence, he finally spoke, but he looked around the conference room again: "The conference is a place for democratic decision-making. We will still make good decisions in a democratic way. Since we want to engage in intra-party democracy, we must do it well, right? "\nBefore waiting for others to agree, he raised his hand to stop these people, and then waved his hand."
  prc_change.9.a: ""The meeting is adjourned. We will see the result on the first day of the conference.""
  prc_change.10.t: "In the rain and fog"
  prc_change.10.d: "The secretary was sitting in the passenger seat, holding his briefcase tightly. The Red Flag car was shuttling through the rainy streets of Beijing. When the car passed the intersection of Wangfujing Street, he looked over there. At this time, there were only a few people wandering around the crowded Wangfujing Street. He glanced back at the chairman sitting in the back seat. Chairman Xi just turned his head and stared at something outside the window, but there was only thick fog outside. His fingers repeatedly rubbed the cap of a pen, sometimes squeezing the pen tightly, and sometimes scratching it with his nails. Wiping the pen, he did not notice his secretary. \nThe secretary leaned back again. The fog on the street was so thick that he could not see the road ahead. He looked at the unfamiliar driver and suddenly had a strange thought: "He won't take the wrong road, will he?" But he did not speak. He remembered that in the past, when the Commission for Discipline Inspection held a meeting, a group of people did not speak, but just stared at him silently. The secretary felt very thirsty, very thirsty, but he had just drunk water. \nAfter a long time, Xi Jinping spoke, still in that unhurried voice: "Where are Wang Yang and his gang?" \n"Report to the General Secretary, they are still on the way, there may be a traffic jam." The secretary was startled, but immediately answered. \nXi Jinping smiled contemptuously, and asked in that unhurried voice, "Where is Comrade Hu Chunhua?" \n"They said they are almost there, General Secretary." \n"I know." Xi paused, "Then where is Comrade Hu Ning?" \n"He is inspecting the preparations for the venue with other people in the General Office." \n"Not bad. You should take a rest first, lie down for a while, don't be too nervous. Don't be nervous, you will perform well later. "Xi said in an encouraging tone.\n"Thank you for your concern, General Secretary. I will do my best. "The secretary turned around and found that the chairman was no longer staring out the window, but put his hands in his pockets and looked straight ahead. The outlines of the towering monument and the memorial hall were barely visible in the rain and fog.\nThe secretary took a deep breath and lay down on the passenger seat. He was no longer interested in looking outside, it was just a piece of rain and fog. After a while, the car stopped steadily, and outside was a crowd of reporters and the solemn Great Hall.\nThe car door opened, and he still smiled confidently and kindly. "
  prc_change.10.a: "But only the secretary noticed that his hair had turned a lot greyer."
  prc_change.11.t: "Night Talk"
  prc_change.11.d: "They passed through the gate of the courtyard. The evening breeze blew over the lake, touching people's faces. The moon was hidden under the clouds.\nHu Chunhua had walked into this courtyard countless times, but it was the first time at such a late hour as today. After passing through several doors, they finally walked to the depths of the courtyard.\n"Comrade Chunhua, the General Secretary is waiting for you inside..." The secretary took him to one of the side rooms. Hu Chunhua took a deep breath, hesitated for a while, pushed open the door and walked in.\nThis reception room is not very large, and can only accommodate two or three seats. A rosewood coffee table is placed in the middle, on which are some tea sets and a porcelain plate with a few shaqi ma and glutinous rice noodles. Xi Jinping is sitting on the coffee table making tea, and no one else is inside.\n"Chunhua, don't be too restrained, sit down. "Xi Jinping still bowed his head and brewed the tea in his hand. Hu Chunhua hesitated a little, but still sat down slowly.\n"It has been difficult for so many years. The epidemic, the oil crisis, and the economic crisis are also pressing on our chests. "Xi Jinping brewed the tea and handed it to the opposite side, and Chunhua took it immediately.\n"With so many difficulties, it was under your leadership that we got through it..."\n"Without you, who else would give such great support?" Before Hu Chunhua finished speaking, Xi Jinping said this abruptly. A pair of sharp eyes stared at Hu Chunhua's face.\nHu Chunhua was stunned for a moment, but continued to speak: "The needs of the party are the needs of every party member. There is no support for party members. It is our responsibility to do things for the Party Central Committee. "\n"The greater the responsibility, the greater the ability; you know that our party is a place where talents are selected, and the greater the ability, the greater the burden to be carried. "\n"The general secretary is right, but our party is still a collective. No matter how big the burden is, it cannot be carried by one person. Everyone must work hard together, and no one will fall behind. Since everyone has contributed, then we should all share the benefits. "\n"Hehe..." Xi Jinping nodded, "A collective has a core, but it also needs a facade. If the facade is bad, it is still not good for the collective..."\n"General Secretary, we have tried our best. The black swan incident in the United States is such a big thing that it is rare to see in a century..."\n"Comrade Chunhua, don't be so modest." Xi Jinping sat upright and said seriously, "This is a very serious matter. Someone must be responsible for it, and there can only be one person."\n"You know, we are just born for the party, and we are always tied to the party. If we can't follow the will of the people, it will damage our party itself."\n"You helped me a lot in the past few years, and now the party has a new task for you." Xi Jinping finished speaking in one breath, looking directly at him, "This burden is heavy, can you bear it?"\nHu Chunhua pondered for a moment and said firmly: "
  prc_change.11.a: ""Thank you for the General Secretary's trust.""
  prc_change.12.t: "Some are happy, some are sad"
  prc_change.12.d: "When the list of election results was slowly read out, Wang Yang's smile gradually solidified and twisted, and the corners of his mouth that were about to open twisted together. The laughter got stuck in his throat and turned into an indistinguishable mutter.\nHe stared at the representatives with bloodshot eyes, and looked around with a trembling head, but he could not see anything, only darkness, and those teeth bared in the darkness.\n"Comrade Wang Yang, are you feeling unwell? "A faint voice came from the darkness.\n"No, it's not... impossible..."\n"This is the list we have collectively reviewed, there can't be any mistakes..." Wang Yang was about to speak, but this very familiar sentence blocked his mouth.\nSlowly, a person emerged from the darkness, a Hubei native, a man who became the governor at the age of 27, a man who stood out in this meeting, and a man with whom he had a close personal relationship. The man sighed, shook his head, covered his mouth with his hand, and moved his eyes to the other side. For the first time, Wang Yang felt a deep shame, a shame of being betrayed.\n"You...you guys...impossible, it's such a great opportunity...traitors..." He murmured, breathing heavily, dormant for many years, forbearing for many years, hiding his strength for many years, but today he was defeated and got nothing. He just felt a fire suddenly burning in his heart, burning his internal organs.\n"Comrade Wang Yang, the CPPCC is also a vast world, do a good job. "After a dizzy spell, Hu Chunhua shook him, patted his face gently, and fed him some water, which at least put out the fire in his stomach. He finally struggled out of the darkness, rubbed his eyes, and the world in front of him regained color. He no longer looked at his friend beside him, but looked at Chairman Xi standing on the rostrum."
  prc_change.12.a: "On the stage, Xi Jinping and Wang Yang looked at each other for a moment. The Chairman still had a deep gaze, but just smiled contemptuously."
  prc_change.13.t: "Carrying on the past and opening up the future"
  prc_change.13.d: ""Comrades, first of all, thank you all for coming together for this grand event," Xi Jinping walked to the podium and began to deliver his closing speech as the applause gradually died down: "Then, I also thank you all for your efforts and struggles over the past two years, which have enabled our country to finally defeat the epidemic, control the oil crisis, and stabilize the financial crisis. You have always united under the banner of the Party Central Committee, forged ahead courageously, and made great contributions and sacrifices. On behalf of the Party Central Committee, I would like to express my most sincere thanks to you. "After saying this, he bowed deeply to all the party members.\nAt this moment, the applause was thunderous.\nHe talked about many things: targeted poverty alleviation, rural revitalization, common prosperity, new development concepts, comprehensive deepening of reforms, the fight against the three major crises, and most importantly, the whole world has entered an era of great changes that have not been seen in a century due to the American Civil War.\n"On the other side of the ocean, the United States has accumulated social contradictions to an unprecedented level due to its long-term structural injustice in economic development and rigid political mechanisms. The Republicans and Democrats and the interest groups behind them have taken advantage of their internal social contradictions and launched a bloody civil war in order to realize their own political interests, dragging the American people into a dark era and greatly weakening the national strength of the United States. The American Civil War also reminds us all the time with bloody facts that we must comprehensively deepen reforms and must take people's livelihood and well-being as the foothold of economic construction. But the most important thing," he paused, and when everyone's eyes were focused on his face, he continued: "The most important thing is that our ruling party must always take unity and stability as the foundation of politics. Our party cannot lose its footing, and must always take maintaining basic social stability as the basic principle. "\n"In such a turbulent era, I am honored to fight side by side with you. But the party needs a new look. This is the requirement of the party, the people of the whole country, and the requirement of history. But no matter what team it is, no matter who leads it, we still have to stride forward with full courage and absolute confidence, not taking the wrong path, not taking the crooked path, not taking the old path, not fearing any difficulties and obstacles, for the great rejuvenation of the Chinese nation, for the Chinese people, and for the history of China, hand in a full score answer sheet. "\nAfter speaking, he put down the manuscript, raised his head, and said with a momentum that swallowed the mountains and rivers: "The road is long and obstructed, but no matter what, the Chinese nation must be liberated and China will prosper! "\nAll party members stood up at the same time, and the overwhelming voice rang out throughout the hall:"
  prc_change.13.a: ""The Chinese nation will be liberated and China will prosper!""
  Chihong.1.t: "Egg taste"
  Chihong.1.desc: "Park Wenxiu held his gun cautiously, crouched down and walked to a car at the entrance of the village, looked at the center of the village cautiously, and found that the center of the village was empty. There was no sound in the whole village, only the wind from the mountains was blowing. There was a faint smell in the air, and it was hard to tell what it was.\nAfter observing for a long time, the village was surprisingly quiet, without any human voice. Then Park Wenxiu called out to the back and whistled. Hearing the whistle, a PLA soldier emerged from the grass on the hill. He skillfully moved to Park Wenxiu's side. He whispered in Korean: "Are you sure it's safe here? Park Dongji? I didn't find too many devils up there." Park Wenxiu nodded and said, "No problem, Wu Chengren Dongji. I grew up here and I'm very familiar with it. My father occasionally comes home, and he doesn't see anyone on weekdays. The fat pig doesn't want to give us more wages. But my mother is very powerful. She not only feeds me, but also my twin sisters. "While Wu Chengren was muttering, he stood up and strode into the village.\nThe village is made up of a row of houses that form a circle. These houses surround the village square. In the center of the square grows a lush tree. Usually the villagers gather here, but the square is very deserted at this moment. There are footprints everywhere on the ground. Only a colorful ball can be seen rolling alone on the ground. Wu Chengren walked under the tree and found a row of children's shoes that girls would wear neatly placed under the tree. The smell seemed a little obvious, a bit like the smell of rotten eggs.\n"Wu Dongji, come to my house quickly and eat something, otherwise we will not be able to catch up with the troops, and then we will miss the time to fight the Japanese devils. "Park Wenxiu's voice came. He was already standing at the door of his house. Wu Chengren followed immediately. Park Wenxiu pushed the door open and walked in while calling his mother in Korean. But no one answered. So Park Wenxiu went to the side room and asked Wu Chengren to sit down first, and he went to see if there was anything to treat him. But when Wu Chengren walked into the living room, he found a dining table in the middle of the living room. The tatami mats were piled up together, and the table was There were several dirty dolls, the stains on them had dried for a while and were crawling with flies. The smell of rotten eggs in the air became stronger and stronger, and even a burnt smell could be smelled. \nPark Wenxiu came out of the wing room, holding a pot of still warm soup. He walked into the living room, muttering that his sister at home was really ignorant, while setting up the tatami. Then he asked Wu Chengren to sit down first, served the soup, and brought it to Wu Chengren. \n"My mother is the most diligent and cooking woman in this village. I like her broth the most. Today's soup is still hot, but it smells a little wrong..." Park Wenxiu suddenly found something wrong. He saw Wu Chengren's face pale and pointed to a piece of something in his bowl. \nPark Wenxiu took a look and saw that it was a piece of finger, slender and short, like a child's finger. "
  Chihong.1.a: "The smell of rotten eggs in the air is getting stronger and stronger."
  Chihong.2.t: "The violence continues"
  Chihong.2.desc: "Park Moon-soo ran like crazy towards the back hill, with Wu Seung-in following closely behind him. While running, Wu Seung-in seemed to catch a glimpse of something. He saw a pile of naked bodies lying in a mess next to a well in the backyard of a house. He immediately turned his head away. Park Moon-soo ran while shouting, "Follow me, follow me, I know where the folks are, I know! Wu Dong-ji, don't lose me!" "He pushed aside the branches like crazy, crossed the ditch in the mountain, and went down to the river. He didn't even notice that the reeds cut his face. Wu Chengren followed very hard. He wanted to vomit, but he couldn't.\nFinally, they ran to a cave covered by bushes. There were messy footprints in front of the cave. Fortunately, there were no military boots. So Park Wenxiu plucked up the courage and stuck his head into the cave. The sound of the bolt clicked immediately rang, and the bayonet was against his face. Wu Chengren followed closely behind, looking back from time to time.\n"Who! ?" This rude Korean language echoed in the cave.\n"It's me, Park Wenxiu, and I brought a PLA. "\n"Ah, Park Qinyong... and China Dongmu..." The leading guerrilla put down his gun.\n"My mother, is it okay?" Park Wenxiu asked anxiously.\nThe guerrilla suddenly turned his head to the side and didn't speak. "Are you okay...? "The guerrillas still did not speak, but just pulled Park Wenxiu to the depths of the cave.\nThe depths of the cave were crowded with all kinds of women and old people. When Park Wenxiu appeared, the crowd burst into a chaotic cry. "Wenxiu, poor baby..." "What a sin..." He walked towards the center of the crowd. The crying villagers took the initiative to make way for him. The dim flashlight gradually pointed to the "person" lying on the bed in the deepest part of the cave. The person's whole body was black, and a burnt stench came.\nAs soon as Park Wenxiu saw the person's face, he collapsed and knelt down, his voice began to tremble: "Mom..."\n"My son...my son...Mom's hand is broken, and I can't make soup..." Park Wenxiu's mother was burnt all over her body, and her clothes were torn into pieces. The pieces of cloth were strangely stuck to the wound, the ears were hard, the two lips had disappeared, and only the two eyes could move. \n"My son.....Mother is useless...Mother failed to save...sisters...Taeyo...those beasts...when they saw...your sisters...they wanted...then they were..." Park Wenxiu's mother couldn't say anything more, she couldn't go on. \n"Beasts...Wenxiu's mother was just protecting her two sisters, and was dragged to the backyard by Taiyo's soldiers, doused with gasoline, and burned to death...Wenxiu's two sisters also..." The guerrilla said this and began to sob. \nPark Wenxiu fell back to the ground, covering his ears with his hands. He felt a tearing headache. "
  Chihong.2.a: "Instantly, the sound of crying filled the entire cave."
  Chihong_2_tt: "§RLushun, Nanjing, Pyongyang...haven't changed at all...§!"
  Chihong.3.t: ""
  Chihong.3.desc: "Wu Chengren pulled Park Wenxiu up and shook his shoulders.\n"Park Dongji, we have to move. So many villagers are here, without food or medicine. We must do something, or find the troops and let them come to resettle the villagers. Cheer up, Auntie is just burned. If we can find antibiotics, we can save Auntie's life. If we can find a team, it would be even better. In any case, we can't stay here any longer. Move, Park Dongji!" As he spoke, Wu Chengren took out his gauze and carefully bandaged Park Wenxiu's mother. Then, he handed the coagulant, cardiotonic, antibacterial ointment and morphine to the guerrilla and explained the use of the medicine.\nPark Wenxiu took two deep breaths and stood up with gritted teeth.\n"Armani, Mom, hold on, your son will definitely come back. After the war, your son will cook for you. Your son will cook for you for the rest of his life. "After that, Park Wenxiu and Wu Chengren walked out of the cave together. Behind them, the villagers looked at them sadly, watching them plunge into the bushes and disappear in the reeds.\nThey walked towards the front line for several hours, occasionally hearing the whistling of missiles, the sound of tank engines, the sound of guns and fighter planes passing by, but these sounds collided with the mountain and disappeared immediately. In the distance, a few white cranes could be seen flying across the sky.\nThey didn't know how many villages they had passed. Those villages were either filled with smoldering ruins or filled with all kinds of corpses in the village square. When they approached those villages, men and women, young and old, were hanging on the telephone poles on both sides of the village roads. He They were all barefoot and were arranged from oldest to youngest. They saw a bloody baby body hanging upside down on a telephone pole. Various crooked words were written on their bodies in Japanese, and some of the bodies were written in Korean: "Red Element", "Disloyal Mob", "I Offended Democracy", "I Slandered Freedom". Wu Chengren finally couldn't help it and vomited violently. Park Wenxiu just gritted his teeth, didn't look at those things, and continued to move forward. \nWu Chengren saw that in front of a burning school, a little girl covered in blood was dragging a torn rooster doll, standing in front of the fire, motionless. \n"Little friend, I am a Chinese uncle. It's very dangerous here. Let's go quickly. "Wu Chengren pulled the little girl.\nThe little girl didn't move, and murmured something, but Wu Chengren didn't hear it clearly.\n"Armani... Armani..." The little girl raised her hand and pointed to the fire.\nWu Chengren smelled the stench again--"
  Chihong.3.a: "Wu Chengren smelled that stench again, that damn smell of burnt rotten eggs."
  Chihong_3_tt: "§RCommunists§! have become the §tnew Democratic Republicans§!, while the original §2Democratic Republicans§! have disappeared..."
  Chihong.4.t: "One Family"
  Chihong.4.desc: "Park Wenxiu pulled Wu Chengren along a rugged mountain path toward a small market town, hoping to find medicine and supplies. Night was dark, the moon blocked by smoke on the horizon. At dawn, they reached the town.\n\nThey hid their guns and uniforms, crawling to a yard and knocked. A baby cried but was silenced.\n\n\"Fellow villagers, don't be afraid. I'm Park Wenxiu of the Korean People's Army, and I brought a Chinese comrade. We are friends,\" he said softly.\n\nAfter a pause, the door creaked open, showing a bloodshot eye. Inside, a pale woman with shriveled breasts sat on a pile of rotten cotton, feeding a baby that could only draw blood.\n\"What do you want?\" an old one-eyed man asked. \"Where are your guns? Never mind, tell me—there isn't much here.\"\n\n\"Old man, we just need your clothes. My Armani was burned by the Japanese. We have to find medicine, but we can't go in uniform,\" Park Wenxiu explained.\n\n\"Do you know what you're doing?\" the man scowled. \"I've seen Japanese devils, American devils, and southern devils. Over eighty years, I've seen their cruelty. My uncle was once stripped, wrapped in iron, and left in ice and snow. Even now, they are still like that.\"\n\n\"The brutal nature of Japanese imperialists—\" Park Wenxiu began.\n\"Since you know, why come openly? Only two of you—what if the devil finds out?\" the man warned, rummaging in his closet.\n\"Come on, put it on, don't make trouble!\" he said, handing them civilian clothes. \"Find the medicine quickly, your Armani is waiting—go!\"\n\nBefore leaving, Wu Chengren quietly left a nut bar for the woman. She stared blankly, tears slowly running down her face."
  Chihong.4.a: "Silent hatred..."
  Chihong.5.t: "Withered Clinic"
  Chihong.5.desc: "After some time, they found the town clinic. The doctor was gone, leaving only a dozen women and children hiding in the drip room, frozen with fear. Guided by them, Park Wenxiu and Wu Chengren located the medicines they needed. They left an IOU on the doctor's desk, noting what they had taken, their unit, and instructions to show it to the village committee if needed.\n\nJust as they prepared to leave, loud noise erupted outside—a chaotic Japanese song mixed with roaring engines. The refugees panicked, some crying. Park Wenxiu quickly ordered them to lie low and crawl to the back door for escape, while Wukept watch from the windowsill.\n\nThe invading soldiers were disorganized; uniforms and caps worn carelessly. One man's oversized cap tilted awkwardly, while a neatly dressed officer stumbled behind him. The Taiyue troops parked in the square and stormed houses in groups. Wusaw soldiers dragging a half-grown girl by her hair after she tried to flee; her screams vanished amid lewd laughter, gunfire, and the roar of engines.\n\nA dead body, stripped naked, was tied to a Taiyue jeep with a sign reading, \"I am a lowly Xian person.\" The jeep circled the town, running over displaced villagers and broadcasting obscene songs. Soldiers dragged a baby from its desperate mother, chopping off her palm as she clutched the doorframe.\n\nSpotting the clinic, several soldiers charged toward them. Wuswore and ran downstairs.\n\n\"Park Wenxiu, lead the villagers!\" he yelled, face twisted in fury.\n\n\"What about you?\"\n\"Don't worry about me!\""
  Chihong.5.a: "Then, Wu rushed out of the clinic through the main entrance without looking back."
  Chihong_5_tt: "§R\"I am not a hero, I just fight alongside heroes!\" - Che Guevara§!"
  Chihong.6.t: "The End"
  Chihong.6.desc: "Wu Chengren had grown up watching films about the atrocities committed by the Japanese, but nothing prepared him for the horror he now faced firsthand. Memories of reading the Bible in college—turning to Revelation and seeing Peter's words, \"Go and see for yourself\"—suddenly took on a terrifying reality.\n\nHe was shoved forward by careless soldiers, face to face with a well-dressed man and a sloppily dressed one. The latter eyed him with a cruel smile, and a clerk with a crooked cap approached, immediately slapping Wu Chengren.\n\n\"The lowest Chinese are in our hands today!\" the clerk sneered in fluent Chinese. Wu Chengren, despite the pain, met his gaze with disdain. \"A wild dog like you won't last long. When the World Liberation International Coalition comes, you'll have no home… though you probably won't live to see it.\"\n\nFurious, the clerk punched him in the abdomen, but Wu Chengren spat in his face. The clerk smashed a rifle butt into his knee, yet Wu Chengren retaliated with a headbutt. A Japanese officer then signaled the soldiers to restrain him, raining blows with rifle butts and boots. His knee was crushed, his face battered, yet he refused to groan.\n\nThe clerk, enraged, pressed him down and cut his tendons. Teeth broken, Wu Chengren still endured silently. The officer stepped on his face and had the clerk photograph him, laughing as he pocketed the image. Wu Chengren was then thrown to the soldiers, who began a grotesque ritual of cutting and consuming pieces of his flesh."
  Chihong.6.a: "Just like decades ago."
  Chihong_6_tt: "§R\"They pointed to the ruins, and told me that this was peace.\"§!"
  Chihong.7.t: "Democratic military"
  Chihong.7.desc: "The Taiyo soldiers forced all the townspeople into the square. The jeep blasting the girl band's music stopped before them, and the clerk ordered the people to dance in awkward Korean. The soldiers formed a circle, clapping along. Terrified and paralyzed, the townspeople could not move. A soldier yanked a woman forward by her hair, and the others beat her until her bones shattered.\n\n\"The rice cake needs more beating—the softer, the better!\" the clerk jeered, as the soldiers manipulated her body like a puppet, performing a grotesque dance. Some townspeople tried to resist, but the soldiers cut off ears and noses, forcing the survivors to comply. Anyone who misstepped was killed.\n\n\"This is the spread of democracy and civilization! You will feel the enlightenment of our education, even if you are conservative Xian people!\" the clerk shouted as the soldiers laughed.\n\nWhen the music ended, the woman was thrown aside. But the terror continued: villagers of all ages were herded into a warehouse, while children were tied and left in the street. Mothers screamed, only to be silenced by soldiers' branches. Attempts to escape through windows were met with bullets.\n\nThe soldiers outside the warehouse threw in flammable materials, white phosphorus bombs, and grenades. The building was doused with gasoline and set ablaze, flames engulfing it instantly. The soldiers then drove off, crushing anyone in their path, leaving only smoke, fire, and dust behind. In the distance, a massive explosion shook the area, accompanied by gunfire, screams, and desperate pleas that soon fell silent."
  Chihong.7.a: "How polite and clear, you fascist maggot."
  Chihong.8.t: "Execution"
  Chihong.8.desc: "Park Wenxiu and the guerrillas held captured Taiyo soldiers at bayonet point while PLA and KPA guards watched. One officer, neat but collar open, glared with bloodshot eyes; the other, ragged, kept his head down.\n\nA guerrilla lunged forward. \"Do you want to let these beasts go? Give them a bullet? Think of our village, our dead!\"\n\nThe clerk panicked, insisting he wasn't Japanese and blaming the special-forces leader. Park pinned him with a bayonet. The political commissar walked up to the prisoners. \"Unit number, rank.\" Seizing a lifeline, the clerk named Sato Shinsuke of the 12th Detachment as the commander and translated the shabby officer's rushed claims of being conscripted and unwilling.\n\nThe neat officer sneered, then spoke in Korean of racial superiority and a mission to eradicate \"inferior\" peoples. The commissar ordered silence. The neat officer boasted they would win even if they failed today. The clerk trembled, pleading his innocence.\n\n\"You are not Japanese—then what are you? A wild dog?\" Park demanded. The clerk begged for his life, swearing he was forced.\n\"Then do it for us. Kill them all.\" The commissar flung two barrels of gasoline before the clerk. In the chaos, the clerk seized them and doused the prisoners, screaming for a torch to \"pay your blood debt.\"\n\n\"Enough!\" Park Moon‑su snapped, released safety, and opened fire. Guerrillas joined in; the courtyard erupted with gunfire and shouts as the captured soldiers met the villagers' retribution."
  Chihong.8.a: "Instantly, the sound of gunfire spread out."
  Chihong_8_tt: "The bullet fired at the beasts pierced through their bodies.\nThe collapsed buildings are gradually recovering,\nThe rising smoke column is gradually falling back,\nThe planes and tanks are all retreating,\nThe dropped bombs are returning to the bomb bays,\nThe newly formed Japanese Self-Defense Forces have been disbanded,\nThe power of the militarists is dissipating,\nThe Japanese people have never been mobilized;\nThe emperor was beaten back to the dropping of the atomic bomb,\nBetween the time before the rice riots,\nBetween the Meiji Restoration,\nBetween the Tokugawa Shogunate,\nBetween the Japanese Warring States,\nUntil the first emperor lay in his cradle,\nInnocent eyes looking at his mother.\nThen the bullet stopped\nAnd did not penetrate the child.\n\nHereby commemorate the 80th anniversary of the victory of the World Anti-Fascist War. §YI hope there is no §nmilitarism§!§! in the parallel universe."
  Chihong.9.t: "Farewell"
  Chihong.9.desc: "Chen Que opened the door and saw it crowded with people. Though he had imagined this scene countless times and even planned escapes in his mind, none of that mattered today—he did not need to escape.\n\nThe crowd outside were not policemen in black uniforms but a mix of haggard men, women, and children, from elders in their seventies and eighties to young teens. He recognized them as poor cancer patients. For years, he had imported anti-cancer drugs and sold them cheaply. The medicines could not cure the disease but could ease suffering.\n\nAs a grassroots doctor, Chen Que had treated countless patients and witnessed too many deaths. Once, a regular patient disappeared without a word, which puzzled him. Out of curiosity, he tracked the patient to a simple suburban shack. Outside, recycled trash was piled haphazardly, and inside, the patient lay on rotting cotton, groaning, staring at the prescription and astronomical bill, too afraid to go further.\n\nAfter that, Chen Que found channels to buy cheap drugs and sold them to the poor, sometimes freely. He knew these medicines weren't on official lists, and selling them without approval was illegal. Yet, for years, he protected the lives of these impoverished patients. He knew the drugs couldn't cure cancer—or deeper ailments—but if they could bring some relief, he would act without hesitation. It was his duty.\n\n\"Fellow patients, what is this…\" Chen Que began, but the patients bowed deeply.\n\n\"Brother Chen, you don't have to worry anymore. You don't have to risk yourself for us. We can buy these cheap drugs at the hospital now.\" One patient removed their mask, forcing a faint smile: \"Thank you for caring for us all these years, Brother Chen. We won't trouble you again.\" The crowd bowed again.\n\nTwo large tears rolled down Chen Que's cheeks. The day he had envisioned countless times had arrived. He was no savior—just an ordinary man who had accidentally carried a heavy burden."
  Chihong.9.a: "I wish that people in the world would be free of disease, so why should I be sad that the medicine on the shelf is gathering dust."
  Chihong.10.t: "The Road Back Home"
  Chihong.10.desc: "When Park Wenqing walked along the under-construction road toward the entrance of the small village in North Pyongan Province, he hesitated, suddenly losing his courage and unable to step forward.\n\nHe knew this was the place he had longed for day and night. It was where his grandmother had sung to him countless times during his infancy, and where she had softly called his name countless times while delirious with fever. As a child, she had carried him on her back and stood on the Dandong Iron Bridge countless times, gazing across the Yalu River, though the eastern sunlight was too dazzling for him to open his eyes.\n\n\"Wenqing, Wenqing, China treats us well; you must repay China and Chairman Mao. But I still want to go home, to see the mountains, the water, and the rice fields there.\" At five years old, these words had accompanied him for nearly his entire life.\n\nAfter the Kim family was driven from power, Park Wenqing found it hard to describe his feelings, yet he vaguely sensed that the time to take his grandmother home was approaching. When the war against the Taiyo imperialist bloc broke out, he joined the People's Liberation Army without hesitation, becoming an outstanding Korean soldier.\n\nBut when the war ended, and he finally arrived at the peaceful mountain village he and his grandmother had longed for, he could not bring himself to enter. Why? Was he afraid of encountering acquaintances? Or that his accent had grown unfamiliar? Or that he had become estranged from his roots?\n\nHe set down his backpack, took out the urn, and wandered through the quiet village, through the mountains, gazing at the newly built houses painted in both Chinese and Korean, listening to children's joyful laughter, and breathing in the fragrance of the rice fields. Fatigue washed over him—deep, bone-weary fatigue—but alongside it came a long-lost tenderness, as if he were once again an infant in his grandmother's arms."
  Chihong.10.a: "After a long march, he finally boarded the burning train home."
  Chihong.11.t: "The Wind of Reform"
  Chihong.11.desc: "Zhang pushed open the third-floor conference room door, hands sweating on the light blue evaluation form. After 23 years in the county water conservancy archives, this was his first time evaluating Deputy Director Wang.\n\nThe ivy on the windowsill rustled, reminding him of last month's storm when Wang rushed in with an umbrella to save leaking documents. Zhang hesitated over the \"mass base\" column, finally writing \"good.\"\n\nThat evening, Sister Li waved her phone: \"Look, new sunshine notice board!\" Travel expenses were posted; a high-speed rail ticket appeared pricier than a plane ticket. The next morning, Zhang raised the issue at the meeting. The chief financial officer stammered it was a system error.\n\nOn winter solstice, the bureau held its first \"stove meeting.\" Thirty staff gathered around a cast-iron stove as Xiao Lin, a new village official, explained flood prevention. Wang praised the \"silver-haired patrol team\" idea, recalling his father's 1998 flood control experience. Sparks flew from the stove.\n\nIn spring, cadre adjustments were announced: \"Comrade Wang Jianguo transferred to consultant of Flood Control Office.\" Zhang remembered previous reviewers marking \"weak\" in professional ability. Sunlight through sycamore leaves fell on the notice.\n\nNow, resident supervisors in red armbands were visible. Last Friday, Sister Li showed Old Wu the posted irrigation canal progress. Wu laughed: \"Government reform is good—much faster than before.\"\n\nAutumn rain tapped the archive window as Zhang sorted new flood prevention ledgers, sandwiched with a yellowed \"Notes on Democratic Evaluation of Cadres.\" Dust brushed away, the scent of osmanthus mingled with ink in the soft autumn light."
  Chihong.11.a: "The spring breeze of reform is blowing everywhere..."
  Chihong.12.t: "People in the apricot forest"
  Chihong.12.desc: "Doctor Zhang had just seen off the last patient of the morning when he collapsed in a chair. It was already noon, and he didn't want to touch the lunch box his wife had prepared. He just wanted to lie down in a chair and rest for a while. As the only doctor in several nearby villages with nearly thousands of people, he really felt exhausted.\nHe used to be very tired. Occasionally, a few nearby villagers would come to him for medical treatment, but when he walked in those villages, he could still often see children with high fever being wrapped in swaddling clothes by their mothers with ginger slices on their bodies, and elderly people with enteritis vomiting and diarrhea while drinking Coptis chinensis water. So he could only take the initiative to find those patients and provide them with free medical treatment. , prescribe them a prescription at cost price. But some villagers either can't afford it, or are more superstitious about their own prescriptions. \nHowever, in the past few months, he has been busy here, and the clinic has become lively. After all, seeing a doctor is cheaper, and the recent free clinics have helped the villagers popularize a lot of medical knowledge, and more people are still willing to come to him for treatment. Although it is said that there is no need to take the initiative to go to the village, it is inevitable to be tired. \nDoctor Zhang walked to the empty backyard, looked at the apricot tree planted behind the yard, and lit a cigarette for the first time and started smoking. \"It would be great if someone could help me share the pressure of seeing a doctor.\" He thought. \n\"Is Doctor Zhang here?\" Someone shouted at the door. \n\"Please sit down first, fellow villagers, I'll be there soon.\" He threw the cigarette on the ground and stepped on the cigarette butt. \nWhen he walked to the reception desk and saw another man in a white coat standing there, he was immediately stunned. "
  Chihong.12.a: "\"Doctor Zhang, I am a new doctor. We will be colleagues from now on.\""
  Chihong.13.t: "Long March Central Computing System Mass Health Intervention Program"
  Chihong.13.desc: "This plan has passed the Long March system review. Humanoid execution unit CN20280607-4217 will implement the intervention.\n\nTarget: Lin Ximing\nGender: Male\nAge: 23\nOccupation: Former employee, Gangshan Computing Power Distribution Center\n\nCurrent State: Deep social disembedding with circadian disruption, social function atrophy, and low self-worth. Physiologically: malnutrition (high-sugar, high-salt diet), minimal activity (<1000 steps/day), reduced immunity. Psychologically: reality-avoidance (virtual immersion, >10 hours/day gaming), emotional blunting, self-worth anxiety. Environment: excessive bacterial colonies, poor lighting, worsening body-mind imbalance.\n\nIntervention Principles: Non-invasive \"Style companionship\" guided by \"People's Health Protection Regulations.\" Utilize societal material advantages to link environmental adaptation, habit reshaping, and self-value identification, gradually restoring individual-society connection.\n\nImplementation Plan:\nPhysical Health: End sub-healthy diet; drone delivery of 27-style nutritious meals to [Unit 2, No. 46, Jiefang Road, Gangshan Town]; CN20280607-4217 supervises consumption. Restore environmental indicators (colonies, dust, air quality) to normal.\nCognitive Reshaping: Demonstrate Gangshan Town Commune's informatization and intelligent systems to stimulate observational engagement.\nValue Reshaping: Align with preferences and the \"Nostalgia Game Restoration Plan\" to rebuild self-value through game expansion and restoration activities.\n\nHuman value self-anchoring is prioritized over pure efficiency, permitting CN20280607-4217 limited protocol flexibility."
  Chihong.13.a: "Signature: Long March Central Computing System - Social Care Division"
  Chihong.14.t: "Home and Lights"
  Chihong.14.desc: "Fifty-year-old Hu Kailai sat on the bus, quietly pulling the last soft Zhonghua from his pocket. He had started on the production line at 19, with 31 years of work experience and 30 years of party membership, yet he still couldn't keep up with the changes and was prematurely moved off the cadre track—a lifetime of effort exchanged for a leisurely retirement.\n\nHis wife, a fellow technical school graduate, snatched the cigarette: \"On the bus? Can't you control yourself?\"\n\"I'm upset,\" Hu Kailai muttered.\n\n\"Upset about what? If you're transferred, you're transferred. Don't make a fuss. The family still needs money; let the class handle the rest. It's not a big deal.\" His usually critical wife now comforted him.\n\nHu Kailai recalled the frequent personnel shifts over the past year. \"Only the new secretary is serious, constantly harassing people with campaigns. The kid who replaced me may be incompetent, but he's good at talking. The old secretary was so angry he cursed at the meeting. I think, when the work they block can't proceed, we should be invited back.\"\n\n\"Forget the class. Your son's visiting—can't you just give him a good face?\" she scolded gently. \"Don't worry, just rest easy.\"\n\nThe bus stopped smoothly at the community entrance. Vendors, worried about their livelihoods, began setting up stalls again. It was the same scene, unchanged.\n\nHu Kailai entered the store near the gate, now under a supply and marketing cooperative sign, and bought another pack of cigarettes. His wife watched, but he would find a way to smoke again—just as she would continue trying to snuff out his habit."
  Chihong.14.a: "So, life goes on."
  Chihong.15.t: "Cabbage and Truth (I)"
  Chihong.15.desc: "When the cherry blossoms on Luojia Mountain bloomed for the 32nd time, Chen Shouming finally no longer had to squat on the steps of the administrative building to block people.\nAt 6:40 in the morning, he walked down the bluestone steps of the old dormitory as usual. The faded canvas bag rubbed against the hem of his navy blue Zhongshan suit. The bag contained the annotated version of the 1986 edition of \"Das Kapital\". The edges of the hardcover notebook had been wrinkled and yellowed. When he reached the corner of the road, he leaned against an old locust tree by the roadside to rest. There were still some handwriting on the bark, but it had been blurred by the years.\nAfter returning to the philosophy department office, Professor Chen habitually opened the door and sat at the desk. \"Mr. Chen!\" The young assistant ran over and handed over the thermos cup, \"The Party Committee Propaganda Department just called and wanted to invite you to be the speaker of a series of lectures. \"Chen Shouming's fingers paused on the cup lid. Just last year, the same phone called and advised him to take more subjects after attending the advanced course. The hot steam from the tea blurred his lenses. He remembered that rainy night in 2003, when he stood at the door of the logistics warehouse with three boxes of manuscripts. Old Zhang, who was in charge of the keys, smoked a Red Gold Dragon and said, \"Marxist philosophy research room? It has long been changed into a storage point for printing paper.\" At that time, a witty saying was popular on campus: "
  Chihong.15.a: "Better to sell fried dough twists than to study Marxism-Leninism. At least you can hear the sound of money."
  Chihong.16.t: "Big Dreams in Vain"
  Chihong.16.desc: "\"You will never understand how many people your international revolution has blocked...\"\n\"You are just a dreamer...\"\n The young man opened his eyes and saw a bright hall in front of him. A group of people were pointing at a depressed man. They were all wearing formal clothes, only the man was wearing a tattered military coat. Those who were pointing at the man could not see his face clearly, but he could see the depressed man's face clearly, but he didn't recognize him at all.\nFor some reason, he knew the style of the military coat and could understand their language. He just didn't recognize the man surrounded in the middle. He clearly remembered that he was preparing for class in a primary school in Hunan just now, but he suddenly became dazed for a moment, and then he saw this scene.\n...\nThe man said nothing and was accused and insulted by everyone. After a long time, he shook his sleeves and walked straight out of the hall. The movement of opening the door was very heavy, causing the door to shake violently and make a harsh sound.\n..."
  Chihong.16.a: "The scene in front of me changed, as if it was about to enter the next scene."
  Chihong.17.t: "Don't believe it?"
  Chihong.17.desc: "Time seemed to freeze at this moment. The dewdrops on the leaves were half hanging in the air, the birds' chirping was frozen in their throats, the soldiers were panting, and the moisture from their breath never dissipated. The whole world was stagnant, and only the young man and the captain were still able to move. He felt a sense of familiarity, and understood why this stranger called him with such a respectful and affectionate name.\nThe captain stood up with difficulty. He had a gunshot wound on his leg and was obviously limping when he walked. He walked up to the young man, his eyes filled with complex emotions.\n\"I... I didn't let you down, did I? \"The captain's voice trembled a little. The young man didn't know how to answer and could only shake his head gently. \"Really... That's good, that's good...\" Tears flashed in the captain's eyes, \"But Chairman, they don't believe it... I have no way, I really have no way...\" The young man looked at this strange yet familiar face, and an inexplicable feeling surged in his heart. He pointed to the front and asked in his usual Chu accent: \"Little comrade, your adjutant said that the village ahead is where you launched the uprising, why don't you go and have a look?\" \"I dare not.\" The captain lowered his head. \"Why?\" \"Those young people wearing coarse cloth clothes and holding hoes in their hands joined the guerrillas after a few words from me and the village chief. I took them to travel all over the country, and they died in the jungles and valleys for the illusory ideals I talked about,\" the captain's voice became lower and lower, \"I still remember the young man who always sang \"The East is Red\" in the newly learned Chinese, the man who wanted to save a piece of land for his unmarried wife, the boy who left his parents and wanted to make a name for himself, and the old soldier who joined the army again to repay his mother for a few hundred rupees of medicine money. \n\"......\"\n\"I can't remember their names or their faces, I only know that after each ambush, the land behind me was dyed red. Time and time again..."
  Chihong.17.a: "\"Until now, there are only a dozen people left.\""
  Chihong.18.t: "Tears"
  Chihong.18.desc: "The raindrops dripped onto the ground, making a very subtle sound. I gasped, and the moisture from my breath slowly dissipated. The world seemed to start moving again.\n\nMy adjutant and soldiers looked at me in horror, as well as the young man with the same face as my deceased teacher. His soft hand held me and pulled me towards the village ahead that I had expressly forbidden to go to.\n\nI was too ashamed to go, and I didn't dare to go: I had mobilized the first group of people there, but I couldn't lead them to triumph; I had promised to make everyone poor, but I couldn't fulfill it; this was probably the fear and guilt shared by all of us generals. General Liao was like this back then, and so was I.\n\nBut the young man didn't seem to understand this. Perhaps it was because he was a military god who roamed the world and rarely suffered a defeat, or perhaps it was because he already knew the answer. In any case, he pulled me forward, and I was powerless to resist."
  Chihong.18.a: "Footsteps landed on the ground, splashing up clouds of dust."
  Chihong.19.t: "Pakistan's election is early"
  Chihong.19.desc: " In the early hours of this morning, the Pakistan Election Commission approved the Senate's resolution to hold an early national election, which will be held next Monday. It also announced that it would relax the election criteria to allow several left-wing parties, including the Communist Party of Pakistan, to participate in the election.\nThe joint spokesperson of the Commission and the Senate said that this move was made \"in consideration of the development of the domestic and international situation and the strong voice of the people.\" Observers pointed out that this sudden election will become an important turning point in Pakistan's political landscape."
  Chihong.19.a: "We'll have to wait and see."
  Chihong.20.t: "Pakistan Popular Front triumphs in election"
  Chihong.20.desc: "The Pakistan Election Commission announced the final vote count this morning. The Popular Front Party Alliance, formed on the basis of the former Lahore Front, won more than half of the seats in the National Assembly with an absolute advantage of 47% of the votes, creating a major breakthrough in the country's political history.\nThe general secretary of the Popular Front said in his victory speech: \"This is a victory for the Pakistani people. We will be committed to building a new Pakistan that is more fair, democratic and progressive.\" It is reported that the enthusiastic participation of a large number of young voters has become a notable feature of this election.\nThe election can be generally described as peaceful and orderly, and the new government is expected to be formally formed next week."
  Chihong.20.a: "That's great. Send them a congratulatory message."
  Chihong.21.t: "Debate"
  Chihong.21.desc: "The Great Hall of the People gleamed under bright lights. On the rostrum, an old man wore a solemn expression. He scanned the hundreds of faces before him and said slowly, \"Today we discuss a critical question: whether to intervene in the revolutionary processes in Afghanistan and Iran.\"\n\nThe audience stirred. Some shouted \"export revolution!\" while others shook their heads quietly. The old man rapped the table for silence. \"Let the representatives of the supporters speak first.\"\n\nA middle-aged man with glasses stood. His voice was steady but powerful: \"Comrades, we once claimed we would be the torch of world revolution. And now we hesitate to light this flame? Afghan farmers, bent over in the fields, Iranian workers suffocating under theocracy—they are looking to us!\" His tone rose with emotion: \"Have we forgotten our own path? What would the revolutionary martyrs think? They shed blood and gave their lives not for us to sit here hesitating!\"\n\nThunderous applause followed, only to be cut off by another representative's voice.\n\n\"We respect the martyrs, but we must face reality.\" A white-haired old man rose slowly. \"West Asia is far more complex than our country. Religious, tribal, and ethnic conflicts are intertwined, and external forces are deeply involved. If we intervene rashly, can we ensure we won't repeat the mistakes of the Soviet Union?\"\n\nHis eyes swept the room.\n\"I once led a team into Afghanistan's mountains. Villages were dilapidated, people poor, but their wariness of outsiders was ingrained. Power in the countryside rests with the mullahs. Islam runs deep in the Afghan heartland. Militarily, the people embrace feudal warlord norms; culturally, religious indoctrination; economically, landlord-style hierarchy. Iran may be slightly better—but not much.\"\n\n\"Can we give an answer? Can we live up to expectations? Can we…solve these problems?\"\n\nThe hall fell silent. Only the wind outside sobbed against the windows."
  Chihong.21.a: "Acknowledge, analyze, and fight."
  Chihong.21.b: "We should wait for a more mature time rather than act rashly."
  Chihong.22.t: "Faith"
  Chihong.22.desc: "Thirty miles north of Kabul, in the Hindu Kush foothills, old Karim sat before his mud house, fingers tracing his worn Quran. Sixty years had carved grooves on his face. He had seen kingdoms fall, republics rise, foreign flags wave, and now the green flag returned.\n\n\"Oh God…\" he murmured, voice like a dead leaf, \"Why do you test us?\"\nHe gazed at barren fields. As a boy, he fought \"red pagans\"; as a man, \"American Crusaders.\" Both times, victory was declared, and mullahs said God's will prevailed. Now his eldest son sleeps in the valley, his youngest guards a checkpoint.\n\n\"Uncle Karim, what are you thinking?\" asked Abdullah, holding a skinny goat.\n\n\"The Soviets left, yet granaries are empty; the Americans left, yet wells are dry.\"\nAbdullah said, \"The mullah says it's punishment for lack of faith.\"\n\nKarim smiled bitterly. \"I heard that as a boy. Twenty years ago, UN trucks brought food. The mullah called it temptation. Now there's nothing.\"\n\nChildren played among stones, their laughter sharp but fleeting.\n\n\"I thought driving out foreigners would bring Allah's blessing,\" Karim said, pointing with his crutch. \"We drove out two powers, yet the village is poorer than before.\"\n\nAbdullah whispered, \"Maybe next time…\"\nKarim shook his head. \"I have no next time. I am just an old farmer. I cannot feed my grandchildren.\" He touched the cracked earth. \"I've seen too much blood, but never a tulip bloom again.\"\n\nThe mullah called for evening prayers, preaching God's favor and victory for true believers. Karim followed silently, knowing tomorrow the fields would still be dry, the grandchildren still hungry. Candlelight flickered on the Quran; nothing moved."
  Chihong.22.a: "A drop of turbid tears merged into the dust, silently."
  Chihong.23.t: "Afghanistan Investigation Report"
  Chihong.23.desc: "I. Ethnicity & Social Structure\nThe Hindu Kush isolates Afghanistan into valleys and plateaus, where ethnic groups preserve distinct languages, customs, and historical conflicts. Pashtuns (45%) in the south and east support the Taliban, though tribal conflicts exist. Tajiks (27%), Hazaras (9%), and Uzbeks (9%) are excluded and oppressed. A Hazara in Bamiyan said, \"When the Taliban's black flag appears, another disaster comes. We are not a country, just prisoners tied together.\"\n\nII. Economy\nDecades of war destroyed agriculture, irrigation, and left land unused. Southern provinces grow poppies for Taliban income. A Kandahar farmer said, \"Wheat starves us; poppies feed children.\" Opium accounts for 30%+ of GDP; Taliban collect taxes or sell directly. Urban unemployment is 35%, leaving youth vulnerable to extremist recruitment.\n\nIII. Politics & Religion\nThe Taliban rule via religion, tribal power, and force, labeling dissent as heresy. Internal factions clash. Youth are increasingly skeptical: \"We are not against Islam, only oppression in its name.\" Resistance continues in north and central regions, with at least 17 underground groups.\n\nIV. Revolutionary Conditions\nFavorable: ethnic conflicts, youth desire change, economic hardship, organized resistance.\nDisadvantages: entrenched religion, tribal loyalty > national identity, distrust of foreigners, difficult terrain.\n\nV. Recommendations\n\nThe Taliban relies on clan, religion, and violence. Distinguish \"anti-imperialism\" from progressive forces. \n\nSuggested actions:\nBase in Hazara and Tajik regions; Support progressive secular forces, avoid religious disputes;Prioritize land reform and economic development; Build a multi-ethnic united front to avoid being seen as foreign invaders."
  Chihong.23.a: "Raise the flames!"
  Chihong.24.t: "Mahsa Struggle"
  Chihong.24.desc: "A 22-year-old Iranian Kurdish woman named Mahesa Amini was arrested by the morality police in Tehran because she was said to be wearing a headscarf too loosely. Later, the police said that Amini collapsed in the police station due to sudden heart failure and died after two days of coma. But witnesses said that she was beaten before her death and her head hit the side of the police car. Her brain scans showed that she had fractures, bleeding and cerebral edema in her head.\n\nAmini's death triggered a series of large-scale protests across the country. In order to suppress the tide of demonstrators, the Iranian government used tear gas and high-pressure water cannons to disperse demonstrators, and even used birdshot and metal bullets to shoot and kill. It also blocked a large number of applications including Instagram and WhatsApp, and restricted Internet connections to weaken the protesters' ability to organize. This is the largest Internet restriction since Iran completely shut down the Internet in 2019."
  Chihong.24.a: "This is not the end of the beginning, but the beginning of the end."
  Chihong.25.t: "The Man in the Mountain"
  Chihong.25.desc: "Navid casually swiped the screen of his mobile phone, and the news push from the national TV station popped up: \"Beware! \"Man of the Mountain\" terrorists attacked police posts in Kurdistan Province.\" The picture was a blurry photo of several masked men holding weapons, and the eye-catching red font under the title read: \"These atheists controlled by evil forces are trying to undermine the stability of the Islamic Republic. The police say everything is under control.\" Navid snorted contemptuously and turned off the push. It has been three months since he graduated from the Department of Political Science at the University of Tehran. He has been reading these propaganda-like news for twenty-three years and has long been numb. \"Have you really decided? Travel around the country?\" asked his roommate Amir, leaning against the door frame. \"Yes, I want to see the real face of this country before looking for a job.\" Navid closed the suitcase, \"I've been in the bubble of Tehran for too long.\" \n\nAmir lowered his voice: \"Be careful, the situation is not stable now. Ever since that girl...\"\n\nNavid nodded. They all knew who \"that girl\" was referring to."
  Chihong_25_tt: "A curious young man, from the ivory tower to the vast land..."
  Chihong.25.a: "So, he set out"
  Chihong.26.t: "Travel—beauty and reality"
  Chihong.26.desc: "The dusk in Isfahan is stunningly beautiful, with the ancient bridges gleaming golden in the setting sun. Navid stood by the Zayend River, feeling the ancient city he had only seen in textbooks.\nHowever, the reality behind the beautiful scenery was far from beautiful. Just the night before, the cheap hotel he was staying in was broken into, and his laptop and some cash were looted. After calling the police, the police just recorded it carelessly, and even implied that outsiders like him deserved this kind of loss. \"We have more important things to deal with,\" the officer said arrogantly, \"those traitorous demonstrators and terrorists in the mountains. \""
  Chihong.26.a: "It's just this little trade-off..."
  Chihong.27.t: "Travel - Long Distance Bus"
  Chihong.27.desc: "On the long-distance bus to Shiraz, a middle-aged man sat next to Navid. At first, Navid just nodded politely and focused on the desolate mountain scenery passing by outside the window.\n\nBut as the journey progressed, the stranger began to approach him intentionally or unintentionally, and his hand \"inadvertently\" touched his thigh. When Navid stood up and wanted to change seats, the man whispered: \"Don't be so nervous, pretty boy. In this country, we all need some small comfort, don't we?\"\n\nNavid felt a wave of nausea. He realized that in a society that suppresses normal human desires to the extreme, distortion will erupt in another form."
  Chihong.27.a: "People accuse the oppressors of being shameless, but never mention why."
  Chihong.28.t: "Travel—Ordinary Gathering"
  Chihong.28.desc: "In Shiraz, Navid witnessed a scene he had never imagined.\n\nHe was walking near the Hafez cemetery when he heard shouting in the distance. Curiosity drove him closer, and he saw a group of young men and women gathered in the square, shouting \"Life, Freedom\" slogans, and some took off their headscarves and waved them in the air.\n\nBefore he could react, riot police and plainclothes Basij militia had already rushed into the crowd. He witnessed the moment when sticks fell on young faces and saw blood flowing from the forehead of a young man who was no more than 20 years old. When he tried to step forward to help a girl who was pushed down, a Basij member pushed him away fiercely.\n\n\"Get out! Do you want to be arrested with these running dogs?\"\n\nNavid staggered back, anger and powerlessness intertwined in his heart. Is this the Iran he loves?"
  Chihong.28.a: "Yes, but maybe not."
  Chihong.29.t: "Travel - Ending"
  Chihong.29.desc: "At night, in a small town in Kurdistan Province, Navid lay on the simple bed in the hotel, tossing and turning. Outside the window, the outline of the Zagros Mountains loomed in the moonlight.\nHe recalled the journey of the past few months: the looted property, the violence he witnessed, the shame of being violated, and the ubiquitous fear and repression. He remembered the professors in the classrooms of Tehran University carefully avoiding sensitive topics; he remembered the fire in the eyes of the young people who bravely stood up during the Mahsa struggle; he remembered the complicated expressions of the old people when they talked about the \"people in the mountains\" along the way.\nThe official media called them terrorists, pagans and unbelievers, and running dogs of the West. But Navid He began to wonder if those who fled to the mountains were just like him, tired of lies and oppression? \nAt dawn, Navid made a decision. He packed his simple bag, left his room fee, and walked out of the inn. \nNo one guided him, no one recruited him, only the irrepressible desire deep in his heart drove him. He was not sure if he could find those \"people in the mountains\", or even what would happen after he found them. But he knew that he could never go back to the world that pretended everything was normal. \nNavid looked back at the town for the last time, then turned around and walked into the depths of the mountain. In the morning mist, his figure gradually blurred and finally disappeared at the end of the winding mountain road. "
  Chihong.29.a: "Another \"mountain man\" is born."
  Chihong.30.t: "Iranian Civil War"
  Chihong.30.desc: "In the early hours of this morning, armed clashes broke out simultaneously in several cities in Iran, and then the intensity escalated rapidly. This marks that this Middle Eastern country has officially fallen into a state of civil war.\n\nAccording to reports, the armed forces formed by the Communist Party of Iran, the People's Party of Iran and other left-wing coalitions mobilized the masses to launch a large-scale armed uprising in provinces such as Kurdistan, Lorestan and Isfahan, claiming to recapture the fruits of the 1979 revolution.\n\nAt the same time, the Chinese government issued a statement publicly recognizing and supporting the new regime, saying that it \"represents the just cause of the Iranian people in pursuit of freedom and progress.\" After the conflict broke out, the Iranian Revolutionary Guard and government forces quickly counterattacked. Tehran's Supreme Leader Khamenei delivered a televised speech, accusing the rebels of being \"traitors controlled by infidels\" and vowing to \"defend the dignity of the Islamic Republic with flesh and blood.\"\n\nAccording to reporters on the scene, the two sides engaged in fierce exchanges of fire at several strategic locations. Soldiers on both sides shouted to fight for Iran and showed their determination to die if they failed to win."
  Chihong.30.a: "This is not a civil war, this is a revolution!"
  Chihong.31.t: "Eve"
  Chihong.31.desc: "Jeremy Olu pulled the grenade ring, throwing it into the charging crowd. The explosion slowed the black tide, giving him a moment to breathe. As he ducked into the next trench, he wondered: how did he end up here?\n\nMonths ago, he laughed at being sent to Miami for peacekeeping—blue helmets patrolling the U.S. seemed absurd. But the city was unrecognizable: beaches and avenues charred, skyscraper glass reflecting flames.\n\n\"Olu! Third team, reinforce the eastern line!\" the lieutenant shouted. Jeremy ran, crouching past a makeshift medical station where UN staff treated civilians—mostly women and children caught in the Nuclear Division's purge.\n\nAt the eastern trench, he checked ammunition: supplies were low, yesterday's delivery missing. \"Here they come again,\" whispered Kassem, a Senegalese veteran. Jeremy scoped the attackers, hand on his last grenades.\n\nRadio news worsened: the northern checkpoint had fallen, the UN station isolated, reinforcements fifty kilometers away and delayed two days. The wing was alone.\n\nThat night, Jeremy wrote to his wife abroad: \"Ade, the U.S. is not as we imagined. I see humanity's noblest ideals and its cruelest evils. If I don't return, tell our son I died protecting those who could not protect themselves…\" Sirens cut him off. He stowed the letter, checked his gun, tightened his vest, and ran to the front line. Ten years of combat made his movements precise.\n\nIn the distance, the Nuclear Weapons Division approached, black sun and swastika flags fluttering. Jeremy lay behind the bunker, fired steadily, every shot hitting, yet insignificant against their heavy weapons. Then a flash and deafening roar—155mm howitzer fire struck the front, shaking the ground, sending sandbags and concrete flying."
  Chihong.31.a: "So, the battle began..."
  Chihong.32.t: "Big Hand"
  Chihong.32.desc: "When the smoke cleared, Jeremy saw that the once solid fortifications had become a ruin.\n\"Where did they get such heavy weapons?\" a surviving soldier asked in horror.\nJeremy did not answer. He knew that the local garrison's arsenal had been looted, and that a whole unit of American troops had defected with their full equipment. The existence of these heavy artillery pieces was not surprising in itself, but what was really surprising was that they had not taken them out a few days ago.\n\"Qasim!\" Jeremy searched for his comrades in the ruins, but only saw an arm sticking out of the rubble, with the UN armband on it soaked in blood.\nThe intermittent voice of the lieutenant came from the radio: \"Attention everyone... The enemy has deployed M777 howitzers and HIMARS multiple rocket systems... They are bombarding all known positions... Evacuate immediately...\"\nJeremy was just about to move a few steps, but soon, another round of shelling came."
  Chihong.32.a: "So..."
  Chihong.33.t: "Bullets and Wounded People"
  Chihong.33.desc: "This time, the grenade landed precisely on the temporary command post, and the radio immediately fell into silence.\nJeremy took advantage of the brief break to crawl towards the medical station. His legs were scratched by shrapnel, but this did not slow down his determination. When he arrived at the medical station, he saw a chaos - medical staff were urgently transferring the wounded, but everyone's face was full of despair.\n\"Headquarters has lost contact,\" the chief doctor told him with a trembling voice, \"our evacuation route has been cut off.\" \"How many more wounded are there?\" Jeremy asked.\n\"Thirty-seven people, most of whom cannot move on their own.\"\nJeremy gritted his teeth: \"I have a plan.\"\nHe quickly organized the remaining soldiers to build a hidden passage and began to transfer the wounded. But at this moment, a drone quietly flew over their heads..."
  Chihong.33.a: "Damn..."
  Chihong.34.t: "Evacuation"
  Chihong.34.desc: "\"Damn it!\" Jeremy raised his gun and fired, but it was too late. The drone sent back their location.\nIn less than five minutes, the first 155mm grenade landed precisely fifty meters away from the medical station, and the ground shook in the violent explosion. Then came the second, the third... like a deadly rain, falling continuously.\n\"Guided bombs!\" Jeremy realized that the situation was worse than he had imagined, \"They are using precision-guided artillery shells!\"\nThey were trapped in the medical station, surrounded by an approaching artillery circle. Each explosion made the building shake more violently, and the cracks in the walls continued to widen.\n\"We must evacuate in a dispersed manner,\" Jeremy said to the remaining dozen soldiers,\n\"Each person takes two wounded and breaks out along different routes.\" When the last group of people were about to leave, Jeremy noticed that there were three seriously injured people in the corner with no one to take care of them.\n\"You go first,\" he said to the last soldier, \"I'll take care of them. \"\n\"But sir...\"\n\"This is an order!\" Jeremy said firmly, \"I'll find a way.\"\nWhen everyone left, Jeremy stared at the three wounded, struggling internally. He knew he couldn't take everyone away at the same time, and leaving anyone behind meant death.\nOutside, the engine sounds of the heavy armored vehicles of the Nuclear Weapons Division were getting closer and closer, accompanied by the precise bursts of howitzers, which gradually eroded the area controlled by the blue helmets.\nJeremy made a decision. He helped the three wounded hide in the basement, used up all the medical supplies to bandage them, and made sure they had enough water and food. \"Someone will come to save you,\" he said, \"Hold on. \""
  Chihong.34.a: "After that, Jeremy picked up the gun and walked towards his fate..."
  Chihong.35.t: "Hymn"
  Chihong.35.desc: "Jeremy walked out of the medical station, took the last of his ammunition, and found a commanding height. Using a telescope, he clearly saw the artillery positions of the Nuclear Weapon Division - three M777 howitzers and two sets of \"HIMARS\", which were constantly pouring firepower into the peacekeeping area.\nJeremy set up his sniper rifle and adjusted his breathing. He knew he couldn't stop the massacre, but maybe he could buy some time for others. In the scope, he locked the artillery commander.\nThe moment he pulled the trigger, the commander in the distance fell down. The artillery fire of the Nuclear Weapon Division immediately turned to his position.\nJeremy quickly moved and continued to snipe key targets. He successfully killed two gunners and a communications officer, but his ammunition was about to run out. After the last bullet ran out, he took out the unfinished letter and hurriedly wrote the last words on the back:\n\"Dear Ade, when you receive this letter, I will be gone. Please tell our son that his father did not back down in the face of evil. Although we failed, one day, justice will triumph over cruelty. I love you, forever...\"\nHe didn't finish. A 155mm guided missile accurately hit the building he was in, reducing everything to ruins."
  Chihong.35.a: "Jeremy Olu, history will remember this warrior."
  Chihong.36.t: "Report on Japan's potential military adventure"
  Chihong.36.desc: "\n\n\n £GFX_MSS_event_texticon \n\n\n\n\n Dear Comrade Chairman,\n\nSince the end of the Taiwan Strait Campaign, Japan has sought to amend its constitution to promote the so-called \"normalization of the country.\" Specifically, Article 9 renouncing the right to war has been revised, and its armed forces have been renamed the Imperial Japanese Army. These actions show that Japan's post-World War II demilitarization has failed, posing a serious threat to regional peace and subverting the post-war international order.\n\nDomestically, Japan has consolidated militarist policies: under the guise of \"national security\" and through laws such as the Special Security Maintenance Law, it suppresses anti-war groups, enforces ideological censorship, and silences pacifist voices. Its education system is being reshaped to include military training, tamper with history textbooks, and manipulate media to instill militarist ideology.\n\nIn diplomacy, Japan pursues an aggressive strategy. In Northeast Asia, it leverages the Korean Peninsula, provoking incidents like the Takeshima Crisis and the Fishing Boat Incident to alter the regional security balance. Militarily, it secretly separates weapons-grade plutonium in Aomori, Fukui, and other locations under the cover of civilian nuclear energy, threatening global non-proliferation efforts.\n\nIn this critical situation, we must immediately strengthen national defense readiness and prepare for any contingency. Simultaneously, international diplomatic efforts must be intensified to expose Japan's aggressive intentions and secure global support to restrain its militarist ambitions.\n\nComrade Chairman, we are on the brink of war; any negligence may have grave consequences. We will continue to monitor developments closely and report intelligence promptly.\n\nRespectfully,\nSalute"
  Chihong.36.a: "Ministry of State Security of the People's Republic of China."
  Chihong.37.t: "The Proletarian Cultural Festival was a complete success!"
  Chihong.37.desc: "The first National Proletarian Cultural Festival opened yesterday at the Workers' Stadium, gathering people nationwide to celebrate socialist culture and the working class's spirit.\n\nAt the opening, the General Secretary emphasized that, amid U.S. civil strife and Western capitalist crisis, our country has achieved reunification and entered a new stage of socialist construction. The festival aims to strengthen class consciousness, consolidate the proletariat's leading role, and resist decadent bourgeois culture.\n\nThe week-long festival features diverse performances: Taiwan Province presented The Road to Reunification, the workers' troupe staged Fighting in the Workshop, the peasant delegation performed Harvest Fields, and the PLA Art Troupe sang Heroic Hymn.\n\nExhibitions on industry, agriculture, and revolutionary education run nationwide. An International Revolutionary Art Exchange Zone hosts artists from socialist countries. Live broadcasts and collective viewings were organized. Master Wang of Baosteel said, \"I feel proud to see the working class's cultural status rise; this festival belongs to the working people!\"\n\nThe Central Propaganda Department called the festival key to the \"Left-wing Cultural Renaissance Project.\" Provinces and cities will rotate local festivals to shape a national cultural pattern. Policies include supporting worker- and peasant-themed arts, training worker writers, establishing employee cultural clubs, and nationwide activities like Searching for Working Class Heroes.\n\nThe closing ceremony on May 10 will issue the Chinese Proletarian Cultural Manifesto, guiding socialist cultural construction and contributing to a socialist new culture.ituation and contributing to building a socialist new culture."
  Chihong.37.a: "The red flag of proletarian culture is flying high!"
  Chihong.38.t: "A new list of \"People's Artists\" is released!"
  Chihong.38.desc: ""
  Chihong.38.a: "To be commended."
  Chihong.39.t: "Only the Yellow Crane Tower remains here"
  Chihong.39.desc: "Li Ming groaned, \"Oh, my VPN's broken again, and the 14 yuan this month is wasted.\" As a college student, climbing over the firewall had become a daily routine.\n\nJust then, his roommate Wang Hao shouted, \"Brother Ming, the firewall's lifted!\"\n\nLi Ming scoffed, \"Don't joke, this rumor pops up every year.\"\n\"It's real!\" Wang Hao handed him his phone. \"Official notice: due to the U.S. Civil War's impact on global networks, China's Internet now has full international access.\"\n\nHalf believing it, Li Ming typed Twitter's URL. Surprisingly, it began to load—but only a slow error page: \"Due to server damage, Twitter is temporarily unavailable.\" Facebook, YouTube, and Instagram were similar—slow or unreachable.\n\n\"Why?\" Li Ming scratched his head.\nWang Hao shrugged. \"Many Silicon Valley data centers were destroyed. The U.S. Internet is in chaos.\"\nLi Ming realized, \"So the firewall was lifted not by policy, but because…\"\n\n\"Because there's nothing left to block,\" Wang Hao finished. \"Foreign platforms aren't working.\"\nLi Ming laughed, \"The wall we struggled to climb has collapsed, and the outside world has changed.\"\n\nHe closed the dead websites and opened Bilibili, where foreign users were discussing how to adapt to China's platforms.\n\n\"Looks like they're coming in now,\" Li Ming said, gazing out at Beijing's bright night while across the ocean, the country that once dominated the global Internet was falling into darkness."
  Chihong.39.a: "At least I don't need a VPN to access Steam workshop..."
  Chihong.40.t: "Foreign users flock to Xiaohongshu"
  Chihong.40.desc: "Xinhua News Agency, Beijing: As the U.S. civil war worsens, major global network servers on American soil have been severely damaged, paralyzing many international social media platforms. Amid this, Chinese social platforms are seeing an unprecedented surge of international users, becoming new global communication hubs.\n\nAccording to the State Cyberspace Administration, in the past three months, Xiaohongshu's international version gained over 200 million new users, mostly from Europe and South America. WeChat's overseas version added over 300 million users, expanding supported languages from 20 to 37.\n\nCarlos, a Brazilian reporter, said via international Weibo: \"I never thought I'd use Chinese platforms, but now they're my only option. Surprisingly, they're far more functional than I expected.\"\n\nIn response, WeChat, Douyin, and Xiaohongshu increased investment in overseas servers and expanded multilingual content review teams. They also launched AI tools supporting real-time translation in 94 languages to ease cross-border communication.\n\nExperts note that while the global shift presents huge opportunities for Chinese Internet companies, it also brings challenges: adapting to international usage habits while maintaining China's network management model.\n\nThe State Council Information Office announced moderate adjustments to user content management to create a more open environment for international users within Chinese law.\n\nIndustry observers believe this shift could reshape the global Internet, elevating Chinese platforms from \"Chinese services\" to \"global services\" and strengthening China's role in the digital economy and network governance."
  Chihong.40.a: "Come to Xiaohongshu and have a look!"
  Chihong.41.t: "Bus"
  Chihong.41.desc: "Several police cars flashed their lights, flanked by a black bus, slowly drove out of the prison gate and passed through the streets of Taipei. Senior officers of the Taiwan puppet army and those die-hard \"Taiwan independence\" government civil servants were on the same bus. The bus was dull.\n\nThe woman who had once called the wind and rain on the island of Taiwan now looked ashen, not wanting to say a word. She just looked through the one-way glass at the bustling streets of Taipei as usual, as if she had never been there and the war had never broken out - if it weren't for the small bullet holes on the wall still staring at her teasingly.\n\nLai Qingde kept banging his head against the seat in front of him, his teeth chattering. He stood up and wanted to shout a few words, but when he saw that everyone on the bus was lying like dead pigs, he sat down dejectedly, staring at an unknown direction with a dark face."
  Chihong.41.a: "The bus moved forward, heading towards their destiny."
  Chihong.42.t: "The Clown"
  Chihong.42.desc: "In a cavernous room in the prison, Lai Qingde lay on the bed like a dead pig, motionless. After the guards finished their last round of inspection, he suddenly got up, fumbled in the dark for a long time, and grabbed a piece of glass from under his pillow.\n\nHe took a deep breath, opened his mouth, and prepared to swallow the glass directly into his stomach, but when his tongue felt the cold texture of the glass fragment, he changed the direction of the glass fragment several times, trying to find a more suitable angle to swallow the glass, but it seemed that this angle could not be found. Then, he mustered up his courage, picked up the sharpest end of the glass fragment and pointed it at his abdomen, doing He made a gesture as if he was going to perform a caesarean section. But he just stretched out his hand, gesturing for a long time, as if he couldn't find where his abdomen was. He gritted his teeth, rolled up his sleeves again, exposing his wrists, and prepared to let the black blood in his veins gush out. Before cutting, he recalled many things. He thought that he would be dismembered by the devil and his soul would be burned by the flames of hell. He thought of many terrible things, so he finally made up his mind and cut it hard -\n\nThen, a little blood seeped out of his wound, and then gathered into a blood spot and stopped flowing out. Then he threw the glass fragments away and kicked them aside. "
  Chihong.42.a: "\"No, I can't cut too deep...\""
  Chihong.43.t: "Take your seat"
  Chihong.43.desc: "Soon, the bus stopped. The prisoners were taken off the bus one by one and separated: the military was taken away by the soldiers of the military court, and the civilians were taken away by the bailiffs.\n\nAs soon as Lai Qingde got off the bus, he started shouting and yelling, trying to ask the crowd for help, but no one paid attention to him, so he lay down and rolled around, drowning himself in tears and saliva. But the bailiffs behind him stepped over him directly. Tsai Ing-wen was taken to the original venue of the pseudo-legislative council, a place she was very familiar with. Lai Qingde was escorted to the detention center and strictly guarded. He deserves to be tried in private so that others can come and see his circus. \n\nNow, the Legislative Council has been set up as a perfect courtroom. Except for the statue of Sun Yat-sen, all other symbols have been cleaned up and replaced with the national emblem of the People's Republic of China. The entire courtroom is full of people, and a large group of reporters holding cameras are broadcasting this moment to the world. \n\nShe wanted to deliberately fall down or pretend to limp in, but the court bailiff helped her to the bench, which made her trick meaningless. "
  Chihong.43.a: "And so, the long-awaited trial has begun."
  Chihong.44.t: "Destined"
  Chihong.44.desc: "Under the gaze of the national emblem of the People's Republic of China and Sun Yat-sen, the prosecutor, judge, and defense counsel walked into the courtroom. The gavel fell, and the entire courtroom quickly became quiet. Only Tsai Ing-wen was so scared that she almost couldn't stand.\n\nThen, after the judge read out the court rules, the prosecutor stood up and began to read the indictment word by word. But the woman just quietly clasped her hands on the wooden railing of the defendant's seat, gritted her teeth, and only heard this sentence clearly:\n\n\"Tsai Ing-wen and her accomplices have long accepted foreign help, ignored the laws of the People's Republic of China, actively cooperated with foreign forces to promote Taiwan independence, organized illegal armed forces, and even actively accepted foreign armed forces to seek independence by force, disregarding the integrity of China's territorial sovereignty and the safety of people's lives and property, and have constituted the crime of splitting the country and treason. The above charges are clear in facts and sufficient in evidence. According to the Anti-Secession Law, the Criminal Law of the People's Republic of China, and the Criminal Procedure Law of the People's Republic of China, they should be sentenced to life imprisonment. \"\n\nAfter hearing what the prosecutor said, she could no longer stand, hunched over, and held onto the railing, barely managing to keep herself from falling."
  Chihong.44.a: "A fitting ending."
  Chihong.45.t: "Cabbage and Truth (II)"
  Chihong.45.desc: "The changes began one morning after the 20th National Congress. The school party secretary and two young men in jackets knocked on the door of his cramped 10-square-meter study, cluttered with notes and materials. \"Professor Chen, the Central Committee has issued a document on strengthening Marxist disciplines,\" the secretary said, handing over a red-headed document. \"Do you think we should reopen the research room?\"\n\nNow his lecture notes are printed on coated paper, bearing the gold-embossed emblem of the \"Research Center for the Sinification of Marxism.\" Last week, on a trip to Beijing, a newspaper on his high-speed rail seat featured him in an interview, captioned: \"Senior scholars of Wuhan University discuss theoretical innovation in the new era.\"\n\nWhat struck him most was the change in the attitude of teachers and students. He no longer ate alone; as soon as he sat down, someone brought a tray: \"Mr. Chen, the historical materialism methodology you discussed last time…\" Even Professor Zhou from Economics, who once mocked him as an \"old antique,\" borrowed his edited *Chronology of Marx and Engels* last week.\n\nAfter work, he went to the third-floor ideological and political section of the library. Sunset filtered through colored glass, casting golden light on the shelves. The administrator whispered, \"Teacher Chen, the newly arrived Russian original *Complete Works of Lenin* is reserved for you.\" Outside, students were posting notices for the \"Shou Ming Academic Thought Seminar,\" the wet ink reflecting like a spring lake.\n\nHe suddenly recalled a snowy day in 1997, when he spent three months' pension on a green train to Beijing to buy used books. At Panjiayuan, an old bookseller held up the original German *Anti-Dühring*: \"Do you really want this? It's enough to buy cabbage for half a year.\" His frozen hands tucked into his sleeves, he exhaled a cloud of white air."
  Chihong.45.a: "If there is a cabbage that can grow into truth, I would be willing to grow it for the rest of my life."
  Chihong.46.t: "Believe"
  Chihong.46.desc: "\"I probably will never dare to return to that village. I wouldn't know how to face the old lame village chief, standing there with the villagers, looking at me—an eastern liar who failed them—and asking those questions...\"\n\n\"'Namaskara, Captain, you've been gone eight years. Why hasn't that singing boy written? The hunter died by the forest last year, still waiting for his son who could shoot an arrow a hundred paces. The filial son's mother passed the winter before last, and his father still waits at the gate. The old friend's daughter found a good husband who asked no dowry—now she just waits for you to come home to share her joy...'\"\n\nHow could I tell them? That the singing boy was torn apart by shells. That the hunter's child was struck down by a stray bullet. That the filial son shielded me and took seven blows. That the old soldier fell before the enemy...\n\nHow could I say it?\nShould I tell them the communist ideal was a lie? That those comrades in China who once preached common prosperity no longer believe it? That all those lives, those sacrifices, were for nothing?!\n\nThe young man finally understood—why this scarred captain could bear such agony in silence. Because there was pain deeper than words.\n\nHe asked softly, \"But, Chairman… you still believe, don't you?\"\nThe man trembled. \"But what use is it if only I believe? They don't believe anymore! What use is it if I'm the only one left to believe?!\"\n\n\"'They'? Which 'they'?\" the young man pressed.\n\"The Chairman in his palace? The three thousand deputies? Or the billions of workers across China—and the world?\"\n\nPerhaps it was a vision from the future, or an obsession echoing through decades. The young man did not know what awaited after death—but he sensed, dimly, that all of it was bound to him."
  Chihong.46.a: "He reached out and grasped the captain's wrist."
  Chihong_46_tt: "\"Then go and see what they will ask you.\""
  Chihong.47.t: "Our Future"
  Chihong.47.desc: "The villagers saw us coming. Some were surprised by the young man's appearance, some noticed the scars on my body, and some saw the dusty and scarred team following us.\nI couldn't understand what the young man did and said. He was a great man unprecedented in history, and I was just a madman like Don Quixote. I was dragged to a point where I had no way out, so I could only walk out behind him timidly, ready to face the upcoming trial.\nI thought I would hear complaints, face questions, and endure countless \"whys\". Why couldn't I bring back their relatives? Why did I let this team be so embarrassed? I'm afraid that many old men would question him with tears in their eyes after checking, \"Where is my child? Where is he? ″\nThere were indeed old men who came to me in tears after finding the entire team, and some of them even held the hands of young boys. If not only the old father asked his son, but the boy also asked about his brother, I would probably be like Xiang Yu in the past and kill myself.\nI looked around, and as I imagined, it was still the lame village chief of the past. He really brought a group of old and young and walked respectfully in front of himself, a Chinese liar.\nBut it was not the village chief who spoke, but the old men who came to me holding the young boys.\nHe was full of tears, but there was no complaint. He just choked and put the boy's hand in mine. He told me: \"It's okay, this is my second son, he can also work for the future of us 'untouchables'.\"\n...\nThe gradually disappearing figure smiled at me and said: "
  Chihong.47.a: "\"When I struck the water, I didn't believe that it would be gone today.\""
  Chihong.48.t: "Fragment"
  Chihong.48.desc: "Time flows, the light changes, the damp jungle smell hits his face, the smell of soil after rain mixed with the metal smell of guns, he stretched out his hand, rubbed two fingers gently, hesitating whether to leave.\n\nCountless fragments flashed back in front of him, when people in suits and leather shoes in the luxurious hotel toasted and drank, the undisguised sarcasm and anger in the eyes of the man when \"dividing the cake\", the uniformed officers escorted the newly appointed officials to take office, and the indignation and unwillingness of the man who was accused by everyone in the first scene. After that, the man left.\n\nThe young man didn't know when this man went to South Asia, and he was the head of the international aid force that spontaneously left China. He just guessed his ending.\n\nThe picture was reorganized in front of him, and the air was filled with gunpowder and blood. That was the taste of war and death.\n\nHe raised his eyes, and sure enough, the man he didn't know was leading the army to a great defeat and huddled in a corner of the village."
  Chihong.48.a: "Go over there."
  Chihong.49.t: "No complaints"
  Chihong.49.desc: "The man's body was covered with bandages. None of the bandages were white, but blood red. It looked like he should be in pain, but the man just sat on a protruding boulder without saying a word. The adjutant who bandaged him complained and asked him:\n\n\"Now we're defeated. Are you happy? Everyone says you're crazy. Why did you insist on fighting an impossible battle in a foreign country? \n\"...\"\n\"Who says ideals can defeat reality? Who says the people are the source of power? You want a fair world, but the world itself is not fair.\"\n\"...\"\n\"The village ahead is where you once promoted your ideals and launched the first uprising. Do you have the courage to go and have a look?\"\nThe adjutant was still complaining. His words were not pleasant to hear, but there was no resentment on his face. \n\nThe young man looked at the man. He realized that he was just a shadow in this memory, a passer-by. However, he never expected that the man covered in bandages would look up at him. "
  Chihong.49.a: "\"…Chairman.\""
  Chihong_49_tt: "The old memories flooded into his heart."
  Chihong.50.t: ""
  Chihong.50.desc: ""
  Chihong.50.a: ""
  Chihong.51.t: "Farewell"
  Chihong.51.d: "It was a bright spring day in Beijing, birds singing, flowers blooming, the city alive with movement.\n\nOn Tiananmen Square, the pines and cypresses remained green, red flags fluttering in the breeze. Beneath the Monument to the People's Heroes, thousands stood silently. Today, the old man who had slept in the Crystal Hall for nearly fifty years would finally journey home, fulfilling his last wish.\n\nEight honor guards in dark green uniforms carried his black coffin covered with a bright red party flag, a symbol of his lifelong struggle, glowing like a flame in the morning light.\n\nAlong Chang'an Avenue, a convoy of hearses moved slowly. Farewellers held white flowers with quiet resolve. They no longer cried bitterly or stood lost; they watched with solemn reverence the man who had changed China's fate. The last journey of a hero. When he died, the people wept uncertainly for the country's future. Now, the new generation of Chinese Communists stood firm—his spirit lived on, his legacy preserved, the motherland and its people would not forget.\n\n\"The East is Red, the Sun Rises…\" the song rose among the crowd—not loud or fiery, but tender, reverent. Some elders sobbed softly, some youths waved flags silently, others held chrysanthemums, watching the hearse depart quietly.\n\nAt Babaoshan Revolutionary Cemetery, the last wisp of smoke rose, carried by the wind, turning to dust among the embers. His ashes, placed in a white porcelain urn, were escorted south by a special train toward the Xiangjiang homeland he had long dreamed of.\n\nAt last, he left the altar and returned to the people he loved most."
  Chihong.51.a: "Yu'er, Mao Zedong is here to apologize to you."
  Chihong.51.b: "Another victory of dialectics."
  Chihong.52.t: "Monument"
  Chihong.52.d: "The train slowly pulled into Xiangtan Station. The platform was already crowded with people who came to see him off. Thunderbolts shook the sky and red flags fluttered. Just like a hundred years ago, wherever he went, from Beijing to Xiangtan, there was such a scene on both sides of the railway tracks. People gathered spontaneously, as if welcoming an old friend who had returned from a long journey.\n\nOn the bank of the Xiangjiang River, the breeze blew across the river, raising layers of ripples. The crowd on the river bank stretched for more than ten miles. There were Tibetan elders wrapped in white Hada and holding portraits, there were foreign comrades with blond hair and blue eyes, and more were young people full of vigor. They stood silently. , watching this solemn moment. Hu Chunhua personally picked up the white porcelain urn and gently scattered the ashes into the center of the river. \n\nAccompanied by the sound of \"The Internationale\", the ashes were scattered on the river surface and merged with the rolling river water. Between heaven and earth, all things return to one, heroes return to the people, and revolutionaries return to the earth. On this day, there were no complicated ceremonies, no grand salutes, only the surging river, quietly flowing eastward. \n\nAs dusk gradually rose, the farewell crowd began to disperse. A little boy took the teacher's hand, looked up and asked: \"Teacher, why don't we erect a monument for Grandpa Mao? So that everyone can remember him.\" \n\n\"Child, look at this surging river, look at the factories and farmlands on this land, and look at these happy people. The truth that Chairman Mao taught us is the truth that makes the poor stand up and the belief that workers should be the masters of their own affairs. These truths that will never change are his monuments. Even after thousands of years, the passage of time, and the shift of stars, they will never be erased and decayed.\""
  Chihong.52.a: "If one day the evil fog comes back, please... use this monument as a shield."
  PRC_20big_effect: "§RChina's fate will be decided here......§!"
  PRC_tfr_china_end_tt: "§RWhen the mountain flowers are in full bloom, he will be smiling among them§!"
  Chihong.53.t: "Times Have Changed"
  Chihong.53.d: "Wang Jianguo stood on the viewing platform, gazing at the immaculate formations below. The surrounding crowds were excitedly craning their necks, raising cameras and lenses to capture the valiant appearance of the soldiers, while he, looking at this familiar place, fell into a deep contemplation.\n\nHis first connection with Tiananmen was in his childhood. His father would often tell him the story of the 1949 founding ceremony: "Back then, our air force only had a dozen or so planes. To demonstrate our strength, we had to have them fly over twice." His father was part of that aerial formation, piloting a captured American fighter plane over Tiananmen Square. Whenever he spoke of this, tears would always flash in his father's eyes. "We were poor then; in Korea, we were chased and attacked by American planes!" At that time, he vowed to join the air force and go chase the Americans' tails.\n\nReality did not meet his wishes. At the 1999 military parade, Wang Jianguo was inspected as a J-8 pilot, but his emotions were mixed. He knew then that the fighter jet he was piloting was still far behind the U.S. F-22 in technology. After every training session, hearing his comrades quietly discuss "eight to one" (eight of ours for one of theirs), that feeling of helplessness always felt like thorns in his back. "When can we truly stand tall?" This question lingered in his heart for many years.\n\nAnd now, he can finally answer that question. More than twenty years have passed in the blink of an eye, and new types of fighter jets have sprung up like mushrooms after rain. The J-10 first flew in '02, the J-20 in '11—the Chinese Air Force finally had planes that could contend with the Americans. Even more surprising was the triumphant victory of the People's Liberation Army over the U.S. Seventh Fleet in the air over the Taiwan Strait in '22. Hearing this news, he wept with old age: his childhood dream had finally come true.\n\nIn the distance, the sound of the ceremonial bugle rang out. Wang Jianguo wiped the tears from the corners of his eyes, straightened his back, and, along with all the spectators, cast his gaze toward the square that was the most sacred place in their lives. He knew that far away at the airfield, the air fleet had taken off, and his successors were preparing to be reviewed by the motherland and the people.\n\nSolemn voices came over the broadcast:"
  Chihong.53.a: "The Parade March Past Begins!"
  Chihong.54.t: "Blueprint for a Grand Vision"
  Chihong.54.d: "The Central Politburo meeting room has been in session for quite a while. Exhaustion wrapped around all the participants, as if they would fall asleep in their chairs with their clothes on the moment they closed their eyes; but their nerves stubbornly kept them nailed to their seats, for a doctor does not doze off during the delivery of a newborn.\nThey already held three blueprints for the future of this newborn in their hands, one of which would be chosen to fasten the buttons on the new birth. Everyone was quietly waiting for this moment.\n"Based on the comrades' discussions, we have now reached three proposals for the reform of the National People's Congress. Let us now confirm these three drafts once again."\n"The first proposal: the seat proportion structure of the National People's Congress itself is relatively sound, but we will pass a piece of legislation to expand the number of worker and peasant representatives, providing more seats for frontline worker and peasant representatives, thereby increasing their political voice. Although this reform plan will encounter some resistance, its risk is relatively low."\n"The second proposal is more radical, thoroughly reforming the existing structure of the NPC seats. We will implement a complete occupational group representation system, allowing frontline workers from every industry to form occupational groups to participate in politics, while reserving sufficient seats for ethnic minorities. This will ensure that elections better reflect the will of the various labor groups. However, due to its radical nature, this reform must completely exclude the interference of capitalist forces and should involve launching a political movement at the grassroots level to cultivate political consciousness among the masses. Only under such conditions can this reform be guaranteed to be effective."\n"The last proposal is the 'most stable.' We will follow the consistent tradition since the start of the Reform and Opening Up: major reforms will first be piloted locally. After confirming success in the pilot areas, they will be gradually promoted to all regions, with the central government deliberating last."
  Chihong.54.a: "The Blueprint is Drawn, Awaiting the Foundation"
  Chihong.55.t: "How to Reform? What Proportion?"
  Chihong.55.d: "d"
  Chihong.55.a: "a"
  Chihong.56.t: "New Hope"
  Chihong.56.d: "d"
  Chihong.56.a: "a"
  Chihong.57.t: "Extend Media Control?"
  Chihong.57.d: "d"
  Chihong.57.a: "a"
  Chihong.58.t: "Three Departments Issue Joint Notice: Education Reform for the New Era Begins"
  Chihong.58.d: "Today, the Ministry of Education, the National Planning Commission, and the Ministry of Finance jointly issued a notice, circulating the 'Notice of the Ministry of Education, National Planning Commission, and Ministry of Finance on Implementing Comprehensive Socialist Education Reform in the New Era' (hereinafter referred to as the 'Notice'), as well as the 'Notice on Issuing the <Notice of the Ministry of Education, National Planning Commission, and Ministry of Finance on Implementing Comprehensive Education Reform in the New Era>.'\n\nThe 'Notice' clarifies that under the guidance of the Party Central Committee with Comrade Hu Chunhua at its core, education reform must be comprehensively advanced to develop and build the education cause of the new era well. Developing the education cause is the top priority of socialist construction. Based on comprehensively advancing socialist modernization, we must promote the modernization of the education system and mechanisms, and comprehensively build the socialist education system for the new era. All departments must perfect the rural basic education system, promote the equalized distribution of education resources; improve the development curve of vocational education, focusing on cultivating builders of socialism in the new era; and reform higher education, focusing on ideological construction to cultivate innovative talents with firm political stances and advanced thinking.\n\nThe 'Notice' emphasizes that socialist ideological education is the foundation of the education system, and basic education is the most critical part of China's socialist education system in the new era. The focus of the education system reform is to improve basic education, and the key point is to cultivate "red and expert" talents to ensure that "the red land does not fade." In the reform, all departments must focus on overhauling and perfecting vocational education, strengthening its role in cultivating people, fostering a new generation of laborers, perfecting the socialist talent cultivation mechanism, and ensuring the full implementation of labor practice education reform.\n\nThe full text of the 'Notice' has been distributed to the Education Departments (Commissions), Planning Commissions, and Finance Departments (Bureaus) of all provinces, autonomous regions, and municipalities directly under the Central Government, as well as the Education Bureau, Planning Commission, and Finance Bureau of the Xinjiang Production and Construction Corps."
  Chihong.58.a: "The Education Reform for the New Era Begins Here"
  Chihong.59.t: "Initial Success in Education Reform"
  Chihong.59.d: "The sky was azure blue, the clouds pure white, the sun was bright, and the light was just right.\n\nSince the joint issuance of the 'Notice' by the three departments, the education system reform has been rapidly implemented across the country.\n\nChanges occurred on the dirt roads of the countryside, in the streets and alleys of the townships, and amidst the hustle and bustle of the cities. Initially, people discussed the heavy document for a while, then dismissed it.\n\nBut subsequently, the modern national governance system showed its power: advanced data collection and analysis systems and large neural networks provided precise detection of every single point in the education system, and this entire system was then applied to policy formulation, allocation of funds, and concrete implementation.\n\nThus, the people witnessed the most efficient reform in the world to date: in just a few days, students' meals were improved—this was true in almost every school, from the countryside to the city—and corrupt officials were often caught by the Discipline Inspection Commission mere hours after they made their move.\n\nSeveral weeks later, with strong national support, vocational education welcomed better teaching staff, but at the same time, student management became stricter: they must be cultivated into great laborers of the new era! The failures of vocational education in the past must not be allowed to continue.\n\nMeanwhile, a deeper level of reform was brewing..."
  Chihong.59.a: "The Chinese People Witness the Results of the Reform!"
  Chihong.60.t: "Education Reform Achieves Noteworthy Results"
  Chihong.60.d: "Today, the Republic's education reform has entered the deep-water zone. Following collective discussion, the Ministry of Education, the National Planning Commission, and the Ministry of Finance have implemented comprehensive reforms to basic education, vocational education, and higher education.\n\nThrough measures such as adjusting personnel salaries, improving educational facilities and equipment in underdeveloped areas, and merging schools facing 'enrollment difficulties,' all departments have significantly alleviated the regional imbalance in the development of compulsory education. Residents in township areas can now enjoy an education level nearly equivalent to that of urban residents locally.\n\nThe relevant departments have carried out drastic reforms to vocational education and higher education. In vocational education, on the one hand, investment in teaching staff and facilities has been increased; on the other hand, the management of secondary and higher vocational colleges has been strictly regulated, and a standardized internship system has been established, ensuring at least four weeks per semester are spent interning in production units corresponding to their major, thereby fully leveraging vocational education's role in cultivating people and fostering socialist laborers of the new era.\n\nRegarding higher education, all departments have implemented sweeping reforms.\n\nFirstly, a departmental system has been established, splitting university majors and grouping them into various departments (Xuebu). Students are streamed during high school to study knowledge corresponding to a specific department. Subsequently, each department organizes independent college entrance examinations and voluntary application, breaking down the unified college entrance exam into multiple smaller exams, reducing students' test-taking pressure, and focusing on imparting knowledge and ideological education.\n\nSecondly, a refined undergraduate mentorship system has been fully implemented in universities. Students select a mentor and research group each semester, spending four weeks assisting the corresponding research group, while graduate students are arranged to teach undergraduates scientific thinking and research methods.\n\nThirdly, reforms targeting the graduate level have dismissed a number of researchers who were incompetent or academically dishonest. A standardized academic integrity monitoring department has been established, and funding for scientific research has been increased. For applied research, 'hard targets' for achievement conversion have been established. Those who fail to meet the standards must accept scrutiny; while maintaining tolerance, no one who muddies the waters will be overlooked.\n\nFourthly, in response to the long-standing problems in liberal arts, a strict approach to overhaul has been adopted. Those suffering from 'soft bone disease' (lack of integrity or firm political stance) will be investigated thoroughly and shown no leniency. A social science system conforming to socialism will be constructed, emphasizing the combination of social practice with teaching and research, standardizing academic benchmarks in fields like philosophy, literature, and art, and encouraging high-quality research.\n\nMore than a year has passed since the reform's implementation, and the response so far has been positive. Whether it is a complete success remains to be seen over a longer period of observation..."
  Chihong.60.a: "Long Cherished High Aspirations, Reaching Jinggangshan Again"
  Chihong.61.t: "Education Reform Concludes Successfully"
  Chihong.61.d: "Today, the Republic's education reform has concluded successfully!\n\nThis reform, which lasted for more than five years, completely washed away the entrenched sicknesses within the education system, established a socialist education system for the new era, and answered the question of "what kind of people to train, how to train people, and for whom to train people" in the socialist China of the new era.\n\nCultivating new socialist people with high ideological awareness and excellent professional competence in the new era was the fundamental goal of the education reform, and this goal has been fundamentally achieved. Although there are still some minor issues within the Republic's education system, they pale in comparison to the achievements we have already completed. Therefore, the Party Central Committee has concluded through research that the current phase of education reform is complete!"
  Chihong.61.a: "Nothing in the World is Difficult for One Who is Determined"
  Chihong.62.t: "Awaiting the Time When Mountain Flowers are in Full Bloom"
  Chihong.62.d: "Life is brilliant.\n\nTeachers serving in the mountains dedicate themselves, year after year, day after day, cultivating in difficult conditions. They gave up affluent lives, missed the changes of the times, and were sealed within the layers of mountains, like an ancient amber insect, locked in a time fissure.\n\nThe Republic may have owed them much in the past, but it will never be so now. With investment at all costs, every remote area has received better teaching and accommodation conditions. Perhaps nothing can compensate for the lost years, but materially, we will never treat them unfairly.\n\nA standardized rotation system for support teaching ensures that every new teacher will relieve an older teacher at the appropriate time; no teacher will ever again remain deep in the mountains for ten or even several decades.\n\nThey raised flowers in the deep mountains. Today, the fragrance has drifted to every corner of this land, and this flower has finally bloomed for them.\n\nLife always has a kind of power, a power that is silent but irresistible. Look, that brilliant life is blossoming in the great mountains."
  Chihong.62.a: "She Smiles Amidst the Foliage"
  Chihong.63.t: "Time Flies Like a White Colt..."
  Chihong.63.d: "The autumn sky was azure blue, the sun was just right, and the warm sunlight shone upon the vast rural land, illuminating the ridges and crops.\n\nSu Zihao is a third-grade student at Sanqishan People's Primary School. When he was a first- or second-grader, the school was much more dilapidated than it is now—large patches of the exterior wall paint were peeling off, the window frames were perpetually covered with rust that couldn't be removed, and a touch would produce a 'creak, creak' sound. The cafeteria food could only be called nutritionally balanced, but definitely not delicious.\n\nJust half a semester—ah, perhaps only a few weeks—passed, and everything was completely different. Modern construction crews worked at night with unimaginable efficiency. They almost witnessed the change firsthand. Repainting the exterior walls of the school took only a few nights, without even needing scaffolding: all work was completed by automated machines, and replacing desks, chairs, interior furnishings, and teaching equipment only required a single weekend.\n\nSu Zihao's family situation is not good; both his parents are farmers. But he no longer needs to worry about money: the school no longer charges for meals or miscellaneous fees.\n\nWith brand new equipment, the teacher's instruction seems more understandable than before, and his grades are continuously improving. His parents often talk about the changes of these days at home, expressing their gratitude for the country's goodness.\n\nYoung students live in brand new school buildings, basking in the warm autumn sun, along with the harvest in the fields."
  Chihong.63.a: "With the Help of a Favorable Wind"
  Chihong.64.t: "As Time Goes By..."
  Chihong.64.d: "Su Zihao is now in middle school.\n\nIn middle school, the labor practice course taught more things. He learned to use a soldering iron and made a simple electric car under the teacher's guidance. From the political textbook, he first gained a vague understanding of how society operates.\n\nHe saw many things he had never seen before. He learned physics for the first time, and something stirred in Su Zihao's heart. The Marxist philosophy he learned in political class prompted him to realize that there must be some common principle driving all these things. He searched for a lot of information online. Although he couldn't understand everything, he always had a thought, a notion, that drove him to study avidly.\n\nThe examination system after the education reform gives everyone a greater opportunity to choose their preferred direction. Su Zihao is no exception; he thinks: I want to study physics!\n\nHe will succeed, and almost every single person will succeed."
  Chihong.64.a: "Send Me Up to the Blue Clouds"
  Chihong.65.t: "Initial Assessment of the Murderer's Circumstances (1)"
  Chihong.65.d: "\"So, Student Chen, why did you kill your principal?\"\n\n\"I personally think the answer to this question is obvious. Our principal constantly cut back holidays, forced us to buy school uniforms to profit from the mark-up, and most of the instructors he hired were thugs who would grab girls by the hair and question them about bringing cell phones to school. Moreover, several people have already jumped off buildings at our school, but the principal merely suppressed the news and prevented the outside world from knowing. When teachers pleaded with him, he just asked why they should be so good to the students. I believe my motive for killing him is self-evident.\"\n\n\"Then what did these things have to do with you, since the principal did not directly harm you?\"\n\n\"I need to correct that. Although the principal did not directly harm me, I constantly suffered from sleep deprivation at school, only sleeping five hours. In addition to the lack of sleep, I was woken up every morning by the principal's shouting because we were students in the regular classes and the ones with the lowest grades. So, every day during his rounds, the principal would insult us before leaving. Apart from our homeroom teacher, I seemed to have never received respect, even in our own class, where I was just the most unremarkable one.\"\n\n\"Can you tell us about your situation in the class?\"\n\n\"It's nothing major. Since childhood, I've had trouble integrating into the collective. My hobbies and interests were always out of sync with the people around me. I would often get along well with them but always resisted forming deep friendships. I could accept you playing with me, but I didn't know how, nor did I want, to integrate into their group… Perhaps this is what is called outwardly warm but inwardly cold. So, I've always felt lonely even when the class was lively. This situation has never been resolved, even up to now.\"\n\n\"So, this is your motive for murder?\"\n\n\"I was just seeking justice for the student who jumped off the building.\""
  Chihong.65.a: "This person is a first-time murderer, but his mental state is exceptionally stable. This point should be noted again during tomorrow's transcript."
  Chihong.66.t: "Initial Assessment of the Murderer's Circumstances (2)"
  Chihong.66.d: "\"Then let's do another transcript today, Student Chen. Can you describe how you committed the murder?\"\n\n\"I'll have to explain how I found out the address of the principal and his family. Although we only had three hours of activity time on Sunday afternoons, it was still a rare opportunity for freedom. So I used those three hours every day to follow the principal. The principal had a habit of going to the vegetable market at five o'clock every afternoon; I happened to overhear him mention this while chatting with the head teacher. So, I staked out the market every day, waiting for him to get into his car, and followed him all the way to his house. Then, when I was staking out at around five-thirty, his wife came home from work just in time for dinner, until six o'clock when the principal left for the school. After making preparations, last Sunday, I was already waiting for the principal in the stairwell. I walked out of the parking shed with a knife, held it to his neck, and walked him into his house. Once inside, I killed him and his five-year-old son. When his wife came home from work, I was squatting in the room. His wife didn't discover that I had hidden the bodies in the closet. She only smelled blood and thought it was strange. When his wife walked further in, I slit her throat and killed her.\"\n\n\"What did you feel when you killed them?\"\n\n\"Nothing much. But since it was my first time killing, I forced myself to stay calm by biting my own palm forcefully. I kept telling myself, this is the chance for retribution; if I miss this opportunity, there might not be another one. After killing his son and wife, I did feel extremely panicked, and my thighs were trembling. It wasn't until I smoked a cigarette to calm down that I truly recovered. After all, the great revenge was exacted, which is a source of relief.\"\n\n\"But the principal's wife and child were innocent.\"\n\n\"An eye for an eye.\""
  Chihong.66.a: "File this record for future reference as a typical case."
  Chihong.67.t: "Initial Assessment of the Murderer's Circumstances (3)"
  Chihong.67.d: "\"Can we talk about your family?\"\n\n\"We can. First of all, I was born into a typical working-class family. However, because our county is relatively underdeveloped, many backward rural ideas have had an impact. My mother would often insult me because of my poor grades, saying things like my dreams were shattered, I was living a wasted life, how would I succeed with such low scores, and so on. I didn't dare to cry when I felt wronged then, only crying under the covers. So, I have a deep hatred for the score-based system. It seems that if your score is low, anything else you do is wrong. Fortunately, extracurricular books helped me through primary school. After entering middle school, it became various ACGN works. As I said before, this situation hasn't improved much even now. The silver lining, perhaps, is that I surprisingly don't have any mental illness. I find it incredible that I was able to make it through.\"\n\n\"Now let's talk about your views on your surrounding interpersonal relationships.\"\n\n\"Although I mentioned earlier that I found it difficult to integrate into the collective, that doesn't mean I never thought of trying. Unfortunately, whenever I tried to recommend works I liked, the people around me were either uninterested or thought it was too childish to watch. So, I simply stopped bothering to talk to others about these things. I think a quote from Lu Xun is very accurate: 'When I am silent, I am full.' This sentence sums up my experience in interpersonal relationships very well.\"\n\n\"Don't you feel very lonely?\"\n\n\"I'm used to it.\""
  Chihong.67.a: "This person's family situation and interpersonal relationships are abnormal; attention should be paid to this."
  Chihong.68.t: "Initial Assessment of the Murderer's Circumstances (4)"
  Chihong.68.d: "\"Can you talk about your views on society?\"\n\n\"I personally don't have many views on society. However, I am very confused as to why classmates with a similar family background to mine actually idolize strongman politics, when historically, these strongmen did not rise to power entirely by their own strength. Moreover, one day when I went into the city, I happened to see a group of people following the city's famous entrepreneur. It is incomprehensible to me why these people who have power and wealth would strip others of their wealth and power, yet they still fawn over them. You constantly see worship of officials, billionaires, and even the government on the streets.\"\n\n\"So you decided to kill to put your ideas into practice.\"\n\n\"Yes. Because as an ordinary person, I have no means to change society. But don't forget one thing: many things in life are unfair. Only death is the sole fair thing. Everyone is equal in the face of death. Even if I die, I have to take someone down with me.\"\n\n\"Finally, this is the last transcript. Do you have anything else to say?\"\n\n\"It's a pity I couldn't send more school administrators to meet the King of Hell.\""
  Chihong.68.a: "Close the file and submit as evidence to the court."
  Chihong.69.t: "Initial Assessment of the Murderer's Circumstances (5)"
  Chihong.69.d: "\"Student Chen, I am a reporter from the People's Daily. I have a few questions for you. Your parents came to visit you yesterday. Could you tell me your thoughts or feelings at the time?\"\n\n\"I don't have much to say, but my parents did come to visit me these past few days, saying they have always regretted treating me that way, and if they had been better to me earlier, I wouldn't have gone down this path. They did make my favorite chicken soup, and thinking that I will never be able to eat that kind of chicken soup again makes me feel quite regretful.\"\n\n\"Did you feel regret when you saw your parents crying?\"\n\n\"Yes, if there were no regrets in life, it would be too boring. After all, it wasn't easy for the old couple to raise me, and I understand their feelings. But thinking about what they did to me over the past decade or so, I still feel conflicted. If my parents hadn't acted like that, perhaps I wouldn't have killed anyone.\"\n\n\"There is one more thing. Your case is currently being debated across the entire society. Some say you should not be sentenced to death for killing the principal's family; others say your action was excessive, though justified, and you should still receive the death penalty. What is your view?\"\n\n\"I know what impact my actions will have. Some will call me an overly enthusiastic student of the petite bourgeoisie, others will brand me a 'terrorist,' and some will applaud my actions. However, I believe that if my own death can be of any benefit to this society, then I will die without regret.\"\n\n\"Wait, Old Wu, new information from the court. Public opinion is strong, demanding a heavier sentence. There are protesting crowds outside the court. Let's wait a moment.\""
  Chihong.69.a: "Alright, Student Chen, you've gained a few extra days."
  Chihong.70.t: "Initial Assessment of the Murderer's Circumstances (6)"
  Chihong.70.d: "\"Did you hear? The case of the kid who killed the people in the city is being re-tried, and apparently, they are trying to change it to a lighter charge. I think the impact of this case is enormous.\"\n\n\"Yes, when this case first broke, the comments were universally supportive of him, all saying he did a good job. Even the criticisms only chastised him for being excessive. After the initial result came out, a huge crowd blocked the court entrance, demanding the judge impose a harsher sentence, even threatening to give the judge the same treatment. It turns out that the more they investigated, the dirtier the school was. The influence is truly terrifying. And I feel sorry for him too; he suffered hardships no less than an adult at such a young age, so it's not surprising he had those ideas.\"\n\n\"Let's think about the positives. As long as it's not the death penalty, it's still a good thing for his parents, as he is their only child.\"\n\n\"I agree. After all, the greatest of the three forms of unfilial conduct is to have no male heir.\"\n\n\"Speaking of which, what do you think of his actions?\"\n\n\"I don't know, but if I were in his situation, I might not actually do such a thing. So, while I don't fully agree with his ideology, I admire the man's actions very much.\"\n\n\"That's true. But let's see how this case influences the future. I think the difference this time is that a huge number of people actually dared to physically block the court. That was unthinkable before. So, let's wait and see what impact this case will have in the future.\""
  Chihong.70.a: "You can't always assume social progress is without bloodshed."
  Chihong.71.t: "When Soldiers Go to War"
  Chihong.71.d: "\"Splash— Splash— Splash—\"\n\nThe scorching sun was directly overhead, and the waves crashed against the coarse concrete of the shore again and again, breaking into white foam. On the pier, young faces stepped onto the gangway, leaving the land they deeply loved.\n\nThe blazing sun baked them, soaking the uniforms of the People's Liberation Army with sweat, but no one went inside the cabin to rest.\n\nThey looked towards the direction they boarded from, at the people who came to see them off, at that land—the land that conceived them, raised them, nurtured them from infants in swaddling clothes into adults—the land that deeply loved them. Most of them were leaving her for the first time.\n\nWas that tears or sweat? Drops of water flowed down the soldiers' faces. They might be crying, but no one felt any regret.\n\nBecause these lovable people have decided to dedicate themselves to the greatest cause in human history, just like their predecessors over seventy years ago.\n\n\"To blaze trails through the mountains and forests.\"\n\nThe path of China has never lacked difficulties and obstacles, but every bump and every ravine has been turned into a flat road by the indomitable Chinese people. They open roads across mountains and build bridges over water; no difficulty is insurmountable!\n\nNow, the Chinese people are finally free to turn their gaze to the world. The people across the great ocean have united; they are going to liberate the entire United States! How can we not lend them a hand?\n\nThe bow of the ship cleaves through the waves. They have set sail!"
  Chihong.71.a: "Long Live the Great Unity of the World's People!"
  Chihong.72.t: "Inspection by the American People's Liberation Army"
  Chihong.72.d: "\"So, the foundation of the Three-Three System is that a small squad consists of three people, either with the spearhead in front or the main force behind. By using outflanking, encirclement, and tactical penetration, you can achieve a situation where the weak defeat the strong and the few defeat the many. Have you all understood our demonstration?\" Platoon Leader Liu asked.\n\nStanding before him was an American named James, a member of the APLA inspection team. He came specifically to represent the American comrades to learn experience from the Chinese comrades. Although it may not be directly applicable on the battlefield, it is better to be prepared, just in case; it's always good to learn a bit more.\n\nJames hesitated for a moment, then slowly said, \"Platoon Leader Liu, this Three-Three System is indeed very powerful. But we have another issue: our West Coast base lacks a large number of heavy weapons, and many of our weapons are temporarily modified from civilian firearms. The industrial and agricultural potential of the base is not enough to support us for a long-term war, and it will be difficult to cope with the surrounding Federal Army. We are worried that we might be wiped out on the beaches of California before we can even get out of the West Coast.\"\n\nUpon hearing this, Platoon Leader Liu smiled slightly and said, \"Don't panic. When we fought against you Americans in the Korean War, didn't we end up driving MacArthur back? If weapons truly determined everything, we would have been gone long ago. We can understand the difficulties of the American comrades. If you are truly afraid of the Federal Army's tanks and planes, we will immediately show you the skills we have kept secret to help you overcome the difficulties.\"\n\nJames was overjoyed. Subsequently, Platoon Leader Liu called several soldiers to perform a demonstration in front of the American comrades. At the moment of parting, Platoon Leader Liu gave James a book. James opened the first page, which clearly read:\n\n\"Who are our enemies, and who are our friends? This is the foremost question of the revolution.\""
  Chihong.72.a: "This is the foremost question of the revolution."
  Chihong.73.t: "Taxi"
  Chihong.73.d: "\"Those students aren't really studying well now. I heard that quite a few students in your school are choosing to go to the countryside to work and learn from the villagers, saying they want to practice skills and integrate with the masses. Who knows what they're doing.\" On the road, a taxi slowly drove into a tunnel. Inside the car, besides the driver, there was only one student dressed simply, seemingly in a great hurry, so much so that his socks were stained with rainwater.\n\n\"You can't say that, uncle. At least we learn something practical by learning from the villagers.\"\n\n\"They go, that's fine. I don't mind that, but how will they get into a good university in the future? Spending all their time doing these things leaves no time for studying, and if their scores are low in the future, they won't get into a good university.\"\n\n\"We should take a long-term view, right? The central government also issued a document on comprehensive education reform. Maybe in the future, success won't be determined by scores.\"\n\n\"I hope so too, but…\" the uncle paused, \"But I, as a parent, work hard every day picking up and dropping off people, and all the money I earn is for my daughter to get a good education. If you change things this way, I'm still afraid that good schools won't favor poor people like us. I think it's better to be conservative. If anything goes wrong, my family will have no future.\"\n\n\"Uncle, don't worry. It's just the beginning; no one knows what the future holds. But you have to believe in us young people, right?\""
  Chihong.73.a: "\"But it seems like you are thinking fifty years ahead.\""
  Chihong.74.t: "September Third (I)"
  Chihong.74.d: "In the early morning of Beijing, an atmosphere of solemnity and grandeur permeated Tiananmen Square. The autumn wind gently swept past, the red flags were like a tide, and the breathing of hundreds of thousands of people converged into an invisible rhythm. Comrade Hu Chunhua paused briefly behind the Tiananmen gate tower. Beside him were several members of the Central Military Commission and loyal and reliable Politburo members. Their military uniforms and Zhongshan suits glistened in the morning light, their ranks and medals shining brightly.\n\n\"Comrade Chairman of the Central Military Commission,\" General Li Zuocheng spoke slowly, his voice filled with the steadiness of decades in the military, \"Today's military parade is the first internationalist parade since the founding of our nation, and it is extraordinary. It belongs not only to the People's Liberation Army but also to all fighters around the world struggling for liberation. It holds epoch-making significance in this era when fascism, militarism, and imperialism are once again raising their heads.\"\n\nHu Chunhua nodded, his gaze calm yet focused, looking past the densely packed formations in the distance. Tanks, missiles, and equipment were already lined up, and nearly ten thousand soldiers awaited the command.\n\nHe gently stretched out his hand, gesturing for the staff to move aside, and personally helped the shaky hand of Mao Yuanxin, answering softly: \"Comrades, over the past twenty years, we have paid a heavy price. Whether it was the invasion of the financial storm, the test of the pandemic, or the threat of foreign blockade, the people did not fall. The foundation of our Communist Party's governance did not come out of thin air but emerged from the calls and practices of the people. Today's military parade is not merely a display of military might, but a message to the world: socialism is still the future of humanity, and the flames of world revolution will surely triumph over the poison of fascism and imperialism.\"\n\nAnother, younger military commission cadre took the conversation, his eyebrows flashing with emotion: \"General Secretary, we have confirmed that formations from fraternal parties in Vietnam, Laos, the Philippines, South Africa, and even Latin America will proudly march through Tiananmen. Member states of the World Liberation International will dispatch armed forces or militia formations to participate in the review. This is a spectacle the international communist movement has not seen for decades.\"\n\n\"Yes,\" Hu Chunhua's tone was slightly slow, as if pressing every word into the depths of history, \"Our motherland was once called the 'world factory,' passively enduring the exploitation of capital and empire. Today, we must let the world see that a China whose direction is jointly held by workers, peasants, youth, and intellectuals stands proudly in the East of the world, playing a leading role on the path of world revolution. We must let the oppressed people know that they are not alone. We are not fighting in isolation; our banner is the lighthouse for the millions of oppressed people.\"\n\nAt this moment, the old general's voice rang out again, low and firm: \"General Secretary, this will be an unparalleled grand ceremony. But don't forget, the enemy is also watching. Tokyo, Canberra, New Delhi… the military intelligence departments of the Pacific Defense Pact organization probably won't be sleeping tonight.\"\n\nHu Chunhua smiled faintly, a smile that was not sharp but carried a trace of the shyness of an old functionary, yet as solid as a mountain: \"They can suffer from insomnia, but we cannot. Comrades, we must face all this with calmness and confidence. Because we are not trying to provoke the running dogs of imperialism, but to solemnly prove that socialist China is not a force that any power can crush.\"\n\nSpeaking here, he gently adjusted his breathing, his fingertips clenching and then relaxing slightly. At that moment, he seemed to tuck all his nervousness and conscious shyness into his chest, leaving only the deepest tranquility. He understood that the eyes of hundreds of millions of people and the cameras of dozens of countries were waiting for him to step onto that stage."
  Chihong.74.a: "Our banner is the lighthouse for the millions of oppressed people."
  Chihong.75.t: "New Construction of the Old Party (Part I)"
  Chihong.75.d: "The 20th century left-wing movement gradually declined, symbolized by the collapse of the Soviet Union. The Communist Party of China in the 21st century, as the largest existing left-wing political entity and the standard-bearer of the left-wing movement, must systematically and dialectically reflect on past history. It must derive theory from practice and then use that theory to answer the unfinished question of the Soviet Union: how can the Party resist internal decay and pathology and lead the people toward communism through self-renewal?\n\nCurrently in China, a localized trend of thought has gained temporary popularity, even becoming widespread within the ranks of Party members. This notion is the \"Party's self-revolution.\" If the Party did not have its own self-correction mechanism, did not listen to the voice of the people, and did not carry out self-revolution, how could it have turned the tide in times of crisis? How could it have won the war of unification? Didn't our re-socialization also take up the mantle of Chairman Mao? Even if the Party temporarily deviates from the people, it will return to the correct path due to the centripetal force of the mass line. Therefore, \"self-revolution\" and \"people's supervision\" will become the answer to escaping the historical cycle, and the central government must possess the courage and spirit of \"turning the knife inward\" to break the old and establish the new.\n\nThere are many young students who support this argument. On the one hand, the emergence of this situation proves that the central reforms have been effective, satisfying the moderate pan-leftists and left-conservative faction's demand to \"protect the Party and save the nation.\" On the other hand, the central government is indeed favorable towards this report—it grants the center the legitimacy to tightly grasp the surgical knife and dissect entrenched interest groups internally, which is beneficial for deepening civil administration reform."
  Chihong.75.a: "A Magnificent Frankenstein?"
  Chihong.76.t: "New Construction of the Old Party (Part II)"
  Chihong.76.d: "Aside from the support of the moderate and pan-left factions, opposition from firmly-aligned Marxist professors has also followed. The more hardline view argues that the "self-revolution" theory is merely an attempt to reconcile the contradictions between Marxism and revisionism, and to mediate between the vested interests and the proletariat. Essentially, it is nothing more than a servile doctrine of the corporatists. The central government must ultimately return to the main road of promoting the supervision of the masses and advancing labor democracy.\n\nThis viewpoint is generally popular among the hardline faction and left-progressives. Its cornerstone is that the Party is always the vanguard of the people. To ensure it does not degenerate, the people's right to supervise must be deepened in the upcoming reforms. Furthermore, expanding the people's right to oversee the government is always the best way to promote labor democracy. The Party itself must also return the power wrested from the state to the working people, rather than merely rebuilding contact with the masses without fully empowering them, as the "self-revolution" theory would do—a lip service that does not fulfill its promise.\n\nThis argument naturally also provides justification for the reform. However, under the guidance of this theory, the next step of the reform will inevitably expand government transparency and will, to a certain extent, weaken the power of the Party Central Committee. Whether the Party's governing capacity will be enhanced depends on the success of previous grassroots democracy reforms. If the masses have been fully trained, promoting grassroots labor democracy is completely feasible. But if they have not been sufficiently trained, residual local forces will inevitably stage a counter-attack, impacting grassroots governance."
  Chihong.76.a: "The Road is Long and Hard"
  Chihong.77.t: "Medog Construction"
  Chihong.77.d: "Xiao Wang stood next to the pouring zone, staring at the construction progress map on his tablet, his tone excited: \"The wall painting for the residential area is almost finished! Thanks to the supporting workers and the villagers taking on the tasks with low technical requirements, we can focus entirely on the main structure. Although we have to finish before those stinking Indian reactionaries recover their strength, with the smart construction system helping us organize everything rationally, we're not worried at all!\"\n\nLao Zhang, who had just finished measuring the formwork, leaned over to glance at the screen: \"Isn't that right! Back when we were rushing work at Baihetan, just coordinating materials and manpower was a huge headache. Now, the system even accounts for mountain roads that are prone to collapse, transports sand and gravel in advance, and provides a basic infrastructure checklist for the supporting workers—they just follow it to pave roads and set up supports, so we don't have to get distracted at all!\"\n\nXiao Wang leaned against the wall and wiped his sweat, exclaiming, \"And there are quite a few workers who were inspired to come, hearing that building the hydropower station is important, they volunteered to help; the local villagers are also enthusiastic. Knowing our difficult conditions, they often lend a hand, handling simple infrastructure tasks like weeding the slopes and leveling roads. A few days ago, the system gave a slope collapse warning and adjusted the parameters based on the terrain information the villagers provided. We added anchor rods in time, and nothing happened. With them and the system, rushing the schedule is also very steady.\"\n\nLao Zhang gestured toward the busy crowd in the distance: \"We must supervise the anchor rods and concrete pouring of the main structure; the basic infrastructure and residential area are up to them. Look, the villagers are laying curbstones, and the supporting workers are putting up toilets. They're doing well. It's truly a case of help coming from all sides when one area is in need. With their added strength, plus the overall planning of the smart system, our force is sufficient!\"\n\nXiao Wang nodded repeatedly: \"This system is too crucial! Last year we were still crowded in mobile dormitory construction vehicles, but this year it's all thanks to it—it first calculates the construction plan based on the number of people and needs, and then divides the workers and villagers into tasks like assembling frames, laying pipes, and interior decoration. The division of labor is clear, and the efficiency is high. Now the residential buildings are completed, the facilities are complete, and we can move in immediately!\"\n\nLao Zhang looked at the brand-new residential area, his face full of satisfaction: \"The change is so fast! It used to take a long time to build residential areas. Now, with the system planning and everyone working together, things are getting twice the result with half the effort. Even the six-hour, eight-shift rotation is smoother because there are more people to handle the handover, and with the system assisting with the shift change, the effective working time is much more than before!\"\n\nXiao Wang laughed: \"With so much support, the drive to work is strong! When the hydropower station is completed, it will not only generate electricity to benefit the people, but we can also proudly say that this achievement holds not only our sweat but also the contributions of so many enthusiastic people!\"\n\nThe two looked at each other and smiled. In the distance, the villagers were still watering the green belt of the residential area, and the progress data on the smart system screen was constantly updating, as a construction panorama of fervor and orderliness slowly unfolded on the land of Medog."
  Chihong.77.a: "Let those vermin see the true efficiency of socialism!"
  Chihong.78.t: "A Corner of the Dormitory"
  Chihong.78.d: "The drizzling rain had fallen for about an hour, and the already damp dormitory seemed even gloomier in this weather. However, the air in the rain was very cool, which was perhaps one of the few good things.\n\n\"The school is a bit restless now. Those few in the class have been very jumpy lately, saying that we 'mental patients' might get up and beat them, that they are getting ahead of themselves just because they got a little opening, disrupting their interest in preparing for exams,\" Wu Cheng said, taking a puff of his cigarette.\n\n\"After all, the notice came down saying there would be education reform. How can they not be jumpy after reading that notice?\" Wang Chang held his head in his hands. \"What's more, when students like us just offer a few moderate opinions, they start shrieking. If things really turn bloody, they'll probably lose their lives.\"\n\n\"Don't you find those people humorous? When we complain about something, they jump out and say, 'Oh, why don't you talk about something positive? The current difficulties are only temporary, and everyone will have meat to eat when things improve in the future.' The question is, will we live to see that time?\" Zhao Qing'an took a sip of water. \"And if you debate with them, they'll say, 'I'm just a commoner, I don't think about so many things.' That kind of shameless evasion is probably peerless.\"\n\nThe few people in the dorm burst into laughter. Then, Wu Cheng said, \"Forget about those people. Today, let's first discuss what opinions to raise. That is the most urgent matter.\""
  Chihong.78.a: "\"If he is a commoner, then am I not?\""
  Chihong.79.t: "Website"
  Chihong.79.d: "\"Once this code is finished, the task should be complete.\" As the last line of code was finished, Xiao Chen leaned back in his chair, feeling tired but proud of the masterpiece he had completed under tireless work.\n\n\"Chen Ge, what is this thing?\" Xiao Wu, his roommate, returned with water and saw a strange website on the computer. \"It's not that strange. The main purpose of this website is to reduce learning costs, so a single video can simultaneously switch between modal materials like text, audio, and animation. If you often forget what was said earlier while watching a video, you can directly jump to the part you don't understand from the sliding catalog on the left or top, and then switch to the text to read it carefully. Furthermore, I have broken down the text content into different types of materials, such as this segment is an example, this is a description, this is an analogy, and so on. Otherwise, people watching an article or video wouldn't know what it's about.\"\n\n\"Interesting. So, various materials and modalities can be used to minimize learning costs as much as possible.\" \"Of course. This website is completely open-source. As long as you know a bit of programming, you can come over and optimize it. What's more, I have an ambition: this website is to be highly interactive, not just the interaction between different modalities, but even human-to-human interaction.\"\n\n\"That's great. Wanting to lower the learning cost for everyone is quite a big project. But what if someone says the plan is too idealistic? How would you respond?\"\n\n\"Whenever you propose an alternative plan, someone will always say it's too idealistic. These people are either unthinking followers who instinctively oppose any plan, or they are utterly terrified that drastic change will interfere with their modern life. If you ask them why it cannot be realized, they definitely won't be able to give a coherent answer. But honestly, if I were an official instead of a student, no matter how wild my plan or idea was, these people would immediately shut up.\"\n\n\"Worship of authority, is that it?\"\n\n\"Finally, I have a quote for these people.\""
  Chihong.79.a: "\"If you don't even dare to imagine it, what right do you have to criticize others as fantasists?\""
  Chihong.80.t: "In the Afternoon..."
  Chihong.80.d: "In the afternoon, the warm sun offered a sliver of kindness to those shivering from the cold, and the chilly air grew somewhat warmer under the sun's rays. On a long bench on the sports field, Song Wei and his friend Peng Wen were sitting, enjoying the afternoon sun and freeing themselves from the morning's heavy coursework.\n\n"I say, Old Song, why haven't I seen you passionately debating online lately?" Peng Wen asked teasingly.\n\n"Sigh, don't even get me started." Song Wei felt a bit thirsty and drank a cup of coffee: "Why did I comment on politics online before? It was because my junior and senior high schools were absolutely terrible, so I had a lot of grievances. You don't think there's a problem when people like Yang Yongxin are allowed out to harm students, do you? So during that time, I was constantly online. And usually, I could only talk to you guys; my family didn't understand, and school was too suffocating. I didn't have much opportunity to participate in changing society, so I could only debate passionately online."\n\n"True, hahahaha. If the entire education system hadn't been completely reformed now, the few of us would probably still be just trash-talking online."\n\n"That's just how it is. It's normal for young people to have some radical, progressive ideas. It's just that after commenting on politics for so long, although I haven't learned much knowledge, I do have some experience. I'm very surprised that many young people in their late teens and early twenties like us are very, very conservative, unwilling to even believe in social realities like labor disputes, high incidence of mental illness, and rising unemployment rates. They just choose to turn a blind eye and pretend to be deaf and dumb, getting anxious even if you just mention a little bit of negative news. What's more, some of their values even want to revive feudal rites and rituals?"\n\n"After all, it's that saying..."
  Chihong.80.a: "\"The era of desiring to be a slave but failing, and the era of having temporarily secured a seat as a slave.\""

  Chihong.81.t: "A Small Discussion on 'Innocent Souls Under the Atomic Bomb'"
  Chihong.81.d: "...\nThe crux of the problem is not 'are there innocent souls under the atomic bomb,' but a thought-provoking phenomenon: why is it that in the third decade of the twenty-first century, when information control has greatly relaxed and culture is relatively enlightened, the contemporary Japanese people who proudly claim to be 'citizens of a democratic nation' have a view of the history of aggression, militarism, and the dark past that is even inferior to that of the people of the old Japan under authoritarian rule?\n\nWhy is the biggest motivation for Japanese parliament members, who are 'elected representatives,' to visit the Yasukuni Shrine simply to cater to their constituents? Why is the reflection on war by the new generation of Japanese cultural practitioners, who grew up in a relatively free cultural environment, not as profound as that of the older generation who grew up under the high-pressure rule of war? Is this phenomenon of historical cognitive regression not worthy of our deep reflection?\n\nIf the people of the old Japanese Empire were forced to accept militarist brainwashing and lacked the freedom of choice, then can we assume that the majority of contemporary Japanese people have actively chosen to discriminate against China, ignore historical truth, actively chosen to 'reconcile' with the history of aggressive war, and actively chosen to understand or even support the 'heroic spirits' of the various war criminals enshrined in the Yasukuni Shrine?\n\nSeriously speaking, Fascism is not a state of totalitarianism, but the result of the modern liberal dream turning into an illusion. Modern Japan, despite making itself appear somewhat 'civilized' through continuous social development, has in reality transformed every Japanese person into a 'monster' due to internal class oppression in the form of workplace bullying, high debt, high unemployment, and a bubble economy. They have been treated not as human beings but as tools and minerals by the rentiers since birth. If they cannot even face the 'undignified' members of their own nation, can we still implore their people to have the mental capacity to face other nations? This is the so-called 'banality of evil,' the ultimate evil of unconsciously doing evil, and even being unaware that one is doing evil. And behind the 'banality of evil' is the irredeemable nature of the entire old society. What is regrettable is that it is precisely Japan's many years of so-called 'prosperity and development' that has allowed countless ordinary people to gradually engrave this man-eating order into their hearts through daily life, and it is also this 'prosperity and development' that prevents the outside world from seeing through its cannibalistic social order.\n\nI always believe that 'there are innocent souls under the atomic bomb'—those innocent civilians should not become casualties of war. However, if history repeats itself, if the madness of militarism ignites the flames of war again, then how many truly innocent souls will there be under the next nuclear weapon dropped on Japanese soil?\n..."
  Chihong.81.a: "If there were ten righteous men..."

  Chihong.82.t: "A Political Class"
  Chihong.82.d: "In the blink of an eye, half a semester had passed. After finishing his lecture, Xu Wenliang closed his textbook, looked at the bright eyes below the stage, and said, "I'm sorry, I need to take up some of your self-study and discussion time. Please pass out the sports meet reply slips now."\n\n"The school is going to hold a school sports meet. Students, as is customary, please freely form groups to discuss your views, and then find a classmate to report." Xu Wenliang said, looking at the astonished students below.\n\nThe atmosphere immediately cooled down until a student wearing glasses was the first to speak, "How about... our class doesn't participate in this sports meet? We have an exam in one week."\n\n"The sports meet is only for one day, students need to balance work and rest, you know." Xu Wenliang smiled, "If you don't want to participate in the school sports meet, you can also discuss participating in other activities."\n\nUpon finishing his sentence, the classroom immediately erupted into chatter. Xu Wenliang stood on the podium, watching the students' lively discussion, and let out a sigh of relief.\n\nWang Qiang, who came up to report, had a loud voice, "Our group feels that going on an outing is more in line with our wishes. We can choose a park for a group tour... Is that okay, teacher?"\n\n"Let's hear the opinions of the other groups." Xu Wenliang's voice was gentle. He turned around, wrote "Outing" on the blackboard, and asked, "Is there anything else to add?"\n\n"Um... no." Wang Qiang looked back, confirmed that his group members had no objections, and returned to his seat.\n\n"Next group then."\n\nThe reporting took less than ten minutes, and the reports on the blackboard were divided into three categories: going on an outing, staying in the classroom for self-study, and participating in the school sports meet. There were significantly fewer members who chose to stay put for self-study; most students were happy to go out with this unconventional teacher.\n\n"On the day of the school sports meet, the teaching building will be locked. For those who want to participate in the sports meet, let English teacher Liu take you, alright?" Xu Qiliang said, "As for the students who want to self-study, one day won't affect your grades. If you study, study well. If you play, play well, okay?"\n\nAs some students nodded doubtfully, Xu Qiliang looked at the children, "I suggest we go to Haihu Park, which is nearby. How about that? Everyone prepare your supplies, and I'll pitch in some money to prepare some dry food for everyone. Let's go for a walk."\n\nThe students blinked, clearly not having recovered from the shock—Xu Qiliang had taken into account the needs of most students while also catering to the minority. A teacher circumventing the school's arrangement to give them the free activity they wanted? This was too incredible for the former rigid and conventional school teachers.\nChihong.82.a: "Xu Qiliang looked at the astonished and then cheering students, revealing a heartfelt smile."

  Chihong.83.t: "During a Work Break"
  Chihong.83.d: "During work breaks, people always find something to relax and get into the groove to cope with the day's fatigue. However, Chen Huai'an was the opposite; even during a work break, he was still writing and drawing, making one wonder if he was sketching the scenery outside, acting as an amateur painter.\n\n"I say, Old Chen, what are you doing? Don't overwork yourself." His colleague, Fang Qiang, said. "Nothing much, take a look at this." Chen Huai'an handed his notes to Fang Qiang. "A proposal for the transformation of education by artificial intelligence? What are you trying to do?" Fang Qiang asked. "Nothing much. Didn't the country recently announce a comprehensive reform? I think that we programmers can make good use of our knowledge and propose an education plan for the country."\n\n"So how did you think of all this? What suddenly gave you the motivation to write a proposal?" Fang Qiang asked curiously. "Actually, the reason for this isn't much. My niece complained to me that it's very troublesome to review online courses, often forgetting what was said earlier after watching the latter part. And with so many videos online, how do you find the right material for yourself in a limited time? What's more, my niece is very poor at mathematics; if one step of the formula in the textbook is missing, she immediately can't understand it. So, I thought about whether I could use the knowledge I have to make some improvements."\n\nFang Qiang nodded admiringly, "So your first idea is to make it convenient for people to use learning materials." Chen Huai'an responded with a sigh, "After all, even online courses haven't changed the teaching method, not to mention that people are still using traditional print media to learn. So let's first see if we can work on the medium, because I hold such a belief—"\nChihong.83.a: "\"Every upgrade of the learning system will be accompanied by a leap in life.\""

  Chihong.84.t: "September Third (II)"
  Chihong.84.d: "Above the gate tower, red flags fluttered in the wind. Hu Chunhua slowly raised his hand, offering a solemn salute to the people in the square, to the cameras around the world, and to the fraternal parties still struggling in distant lands. At that moment, history and future intertwined in his figure, converging into an irreversible torrent.\nGeneral Secretary Hu Chunhua stood firmly on the Tiananmen gate tower, and the rhythm of the entire square immediately entered a new dimension. The review vehicle slowly drove out, the sound of steel tracks grinding against the asphalt mixing with the uniform footsteps of the soldiers, forming a deep, resonant movement. The military band struck up an impassioned melody, and the flags fluttered like flames.\nThe first to appear below the gate tower was the Guard of Honor of the three services. The white, green, and blue formations looked like three streams of light, shining with solemn splendor under the morning sun. Hu Chunhua's gaze was focused, his body slightly leaning forward, his eyes following the formations. He did not wave or shout loudly like some politicians, but with a steady, almost humble demeanor, he watched one People's Liberation Army soldier after another march proudly past.\nHe understood that among these young soldiers, some came from the Gobi Desert in the Northwest, some from villages in Southern Xinjiang, and some from fishing villages on the East Sea coast. It was the millions of ordinary families across this land who entrusted their children to the motherland, forming this army that remains unyielding through trials and tribulations. This army, even in moments of unimaginable despair for later generations, remains the most solid backing for the people. How much more so now that they are a mighty force of thousands of chariots and a hundred-battle-tested army.\nThe tank formation rumbled forth, the tracks of the steel behemoths seemingly shaking the stone bricks beneath the gate tower. The PLA's newest main battle tanks stretched out like the Great Wall, their barrels slightly raised, silently proclaiming: any enemy who dares to invade this land will be crushed by the steel Great Wall. A flicker of light crossed Hu Chunhua's eyes, but he quickly masked it with a calm expression. He knew in his heart—no matter the storms, the people's homeland will have the most robust Great Wall.\nNext came the formations of the Rocket Force and the Strategic Missile Corps. The long columns of missile carriers pressed forward like mountains, their dark bodies gleaming with a cold luster in the sunlight. The air across the entire venue seemed to freeze at that moment. Hu Chunhua stood ramrod straight, his hand resting on the red-lacquered railing of the gate tower, his eyes firm and fearless. He showed no exaggerated emotion but silently told himself in his heart: this is not only China's sharp sword but also the shield of the World Liberation International. As long as they exist, those forces attempting to push the world back into colonialism and oppression will not dare to act rashly.\nWhen the Air Force echelon swept across the sky, fighter jets roared, and colored smoke formed rainbows, the cheers and applause in the square erupted once more. Hu Chunhua looked up slightly at the formations of aircraft slicing through the sky like falcons. His expression revealed an inexplicable complexity: this was the power of technology, the wisdom and labor accumulated by the people over decades, the achievement forged by countless researchers experimenting day and night and innumerable workers' sweat. He felt a profound sense of responsibility in his heart: to ensure that such power would always serve the people, and not repeat the failures of capitalist military blocs. The J-10C, which performed outstandingly in the India-Pakistan Air War, pulled a few long, lonely streaks of colored smoke at the end of the formation.\nUnder the gaze of hundreds of millions of people worldwide, Hu Chunhua made no overly ostentatious gestures, but simply raised his right hand solemnly, saluting the formation, the people, and history. The red flags on the gate tower fluttered fiercely in the wind, as if proclaiming to the world: China in the new era is ready to shoulder its own mission amidst the thunder and storm."
  Chihong.84.a: "A Salute to History!"

  Chihong.85.t: "September Third (III)"
  Chihong.85.d: "As the last armored formation of the PLA rumbled past, the drum and bugle sounds paused briefly, then struck up another impassioned melody—The Internationale. The viewing stands on both sides of the square immediately burst into a new wave of cheers, for what followed were the fraternal army formations of the World Liberation International.\nThe first to come into view was the red flag formation of the New People's Army of the Philippines. Their uniforms were not magnificent, even a bit rough, but every pair of eyes was bright and focused. Their steps were firm and powerful, indicating that they were warriors forged in the primeval mountains and forests. Flag bearers held high the hammer and sickle banner and the revolutionary red flag of the Philippines, fluttering fiercely alongside the Five-Star Red Flag in the autumn wind of Beijing. Hu Chunhua gazed at them, his mind naturally recalling the streets of Manila a few years ago, where the impoverished workers and landless peasants were still struggling in poverty and exploitation. It was these soldiers in simple military uniforms who took up arms and shattered the chains of the old world. Hu Chunhua's lips moved subtly, and he nodded.\nFollowing closely was the formation of the Thai People's Army. The Thai soldiers were dressed in deep green uniforms, with a bright red five-pointed star badge pinned to their chests. They marched with their heads held high, their steps uniformly aligned, their eyes revealing a sense of nascent pride. Looking at them, Hu Chunhua recalled the past humiliation of that country: the unbalanced economy ravaged by tourism and foreign factories, the juxtaposition of slums and luxurious mansions, women becoming commodities openly priced in brothels, and men becoming neither human nor ghost ladyboys for the so-called service industry. Now, under the leadership of the People's Armed Forces, Thailand is walking a different path, a path of its own. \nNext came the steel formation of the Vietnamese People's Army. The familiar military uniform, the neat formation, but what was different was the unique resilience and composure in their steps. They shared decades of combat camaraderie with the PLA, from resisting colonialism to defending independence; the image of the Vietnamese soldier is already carved into the history of world revolution. Although the two brothers were regrettably driven to conflict by the internal and external manipulations of Le Duan's revisionist clique, they now stand once again in the trench of world revolution, having collectively embraced their socialist初心 (original aspiration). Hu Chunhua watched their figures, his eyes conveying deep respect. He knew that these comrades were not only members of the Liberation International but also veterans tested by blood and fire. Their presence allows people all over the world to see: revolution is not a fantasy; revolution is a reality that can truly stand in history.\nAt this moment, colored flags fluttered over Tiananmen Square, and applause surged like a tide. The world's cameras were focused on this scene: soldiers from different countries and different skin colors marching uniformly under the same red banner of the World Liberation International. Their flags intertwined.\nHu Chunhua stood on the gate tower, his expression solemn. He made no superfluous gestures, nor any extravagant expressions, but instead bowed deeply. This bow was not only for the marching soldiers but also for all people worldwide who are still struggling and bleeding. At that moment, his silhouette, set against the fiercely fluttering red flags, appeared both serene and solemn.\nJournalists worldwide rushed to press their shutters, capturing the moment their leader bowed.\nChihong.85.a: "A Salute to the People and the History they Created!"

  Chihong.86.t: "September Third (IV)"
  Chihong.86.d: "As the Thai and Vietnamese formations gradually receded, the atmosphere in the square suddenly became even more tense and rousing. The drum and bugle call abruptly changed key, becoming deep and heavy, as if mountains were collapsing and rivers were surging. The audience beneath the Tiananmen gate tower held their breath, as if awaiting that moment.\nAccompanied by footsteps as uniform as iron, a giant red flag slowly appeared at the end of Chang'an Avenue. On the flag, a brush pen and a hammer and sickle were intertwined, and on the other side, the North Korean national flag fluttered high—the symbol of the Democratic People's Republic of Korea.\nHundreds of Korean People's Army soldiers marched with their heads held high. Their military uniform was completely different from the past Korean military, no longer a symbol of rigid stagnation, but a new, refreshed look. The red badge glittering on their chests showed that they were no longer the guards of a certain family, but the people's own army of Korea. Their formation was as sharp as a blade, every step powerful and resounding, seemingly crushing centuries of heavy repression and suffering underfoot.\nHu Chunhua stood on the gate tower, his eyes deeply fixed on this contingent. He thought of the past country locked behind the iron curtain and dictatorship, where the people struggled in hunger, remained silent in fear, and lived in a society almost like a Truman Show under overwhelming pressure, where everything was predetermined, and a life from the moment of birth to aging and death was clearly arranged by an unseen "Supreme Will." But now, with the help of China and the support of the World Liberation International, this fraternal nation, which once fought alongside the Northeast Anti-Japanese United Army in the White Mountains and Black Waters, has finally broken free from its chains.\nThe applause in the square erupted thunderously, many people even shedding tears. It was not only a cheer for the appearance of the Korean comrades but also an emotional response to the end of an old era. For decades, the division of the peninsula and the Iron Curtain were considered the deepest wounds of imperialism, and today, the people's flag has finally risen again on this land. Almost everyone firmly believes that the unification of the Korean nation is close at hand, with the united help of the comrades of the World Liberation International.\nHu Chunhua slowly raised his right hand, giving a solemn salute to the Korean People's Army. His action was steady, but his expression was exceptionally moved. People could see an undisguised light flash in his eyes. In the formation, a young Korean officer looked up at the gate tower, his gaze briefly meeting Hu Chunhua's in the air. His eyes held both gratitude and determination. At that moment, between the gate tower and the formation, a profound understanding was formed, seemingly transcending national borders and language: this is not only a victory for China but also a victory for the proletariat of the entire world. The eyes of hundreds of millions of people worldwide, through screens and radio waves, were focused on this instant—red flags fluttered over Tiananmen, the Korean People's Army marched forward, and a new internationalist Long March has begun its journey.\nChihong.86.a: "Heard of it, never seen it, the Twenty-Five Thousand Li!"

  Chihong.87.t: "September Third (V)"
  Chihong.87.d: "After the iron torrent-like steps of the Korean People's Army gradually faded away, the drumbeat in the square changed again, with a touch of foreign intensity and passion in the melody. A gasp of astonishment came from the audience—a new formation had appeared.\nThe first to enter people's sight were the left-wing armed forces of Latin America. Cuba's red flag was the most prominent; their soldiers held portraits of Che Guevara and Fidel Castro, their steps firm and their eyes blazing. Closely following were the People's Armed Forces from the Colombian jungles, whose rough camouflage uniforms still bore the marks of time, but they marched with their heads held high, appearing especially solemn under the Beijing sun. Further back, left-wing groups from Chile, Peru, and Brazil also held up their respective flags and banners. Among them were not a few warriors still struggling in the mountains, cities, and underground networks of their home countries. Today, they appeared in a neat formation on Tiananmen Square. This moment seemed to herald the future: the colonial order of the Old Continent will one day crumble in the shouts of the people of Latin America.\nClosely following them were the warriors from the African continent. The revolutionary groups of Angola, South Africa, and Mozambique, their flags interwoven with red, green, and black, carried the dream of African independence and liberation. Their steps were not as uniformly aligned, but more heavy and powerful, as if every step was crushing the shadow of colonialism. Especially the formation of the New Economic Freedom Fighters from South Africa, who wore strips of cloth pinned to their chests with "Freedom and Equality" written on them, their eyes showing a deep sense of unyielding stubbornness.\nThe applause in the square surged higher and higher, but there was an emotion different from before—it was an applause of support and guardianship. People understood that most of these comrades have not yet seized power in their home countries, are still fighting the enemy underground, still being blockaded, pursued, and exiled. Yet today, they could march in neat formation through Tiananmen, backed by the support of China and the Liberation International, and the attention and response of the world's people. Even if the reactionary governments loudly clamored about China's blatant support, it would not mask the fact that they are cruelly suppressing the voices of the people.\nHu Chunhua stood on the gate tower, gazing at these warriors from distant lands. His eyes were deep and silent, seeming to see through their figures the scenes of blood and fire, mountains and barricades, the alternation of dark night and dawn. He knew in his heart that these comrades were the sparks of the future, the single spark still burning in the most difficult places of the world revolution.\nAs these formations marched past Tiananmen, they sang their national revolutionary songs aloud, echoing The Internationale played by the military band. The singing was hoarse but powerful; the ranks were young, but their steps were firm. At that moment, a strange atmosphere formed over Tiananmen Square: not one of complete victory celebration, but a solemn oath bearing an unfulfilled ambition.\nHu Chunhua slowly raised his hands, and the applause was clear and strong. He did not shout slogans in the manner of a leader, but responded to them in the most sincere way. Because he knew that these unfinished struggles will one day lead to victory; and Beijing today is the lighthouse of their faith.\nChihong.87.a: "A sharp edge comes from grinding, a bitter cold brings out the fragrance of the plum blossom."

  Chihong.88.t: "September Third (VI)"
  Chihong.88.d: "The drum and bugle calls slowly ceased, and the square fell into a solemn yet fervent silence. Red flags fluttered fiercely, and tens of thousands held their breath. General Secretary Hu Chunhua stood in the center of the Tiananmen gate tower, facing the wind and looking down at this steel torrent formed by the Chinese People's Liberation Army and the fraternal formations of the World Liberation International.\nHe took a deep breath, his voice not loud, but clearly audible across the entire square:\n"Comrades, fighters, hundreds of millions of proletarian brothers and sisters!\nToday, our socialist motherland solemnly declares here to the whole world: the people's army forever belongs to the people, and the banner of socialism shall fly high across all corners of the world. We have seen the victory of the Korean comrades, and the contingents of our comrades-in-arms from Southeast Asia, Africa, and Latin America. Among them, some have overthrown oppression, and some are still fighting in blood in the darkness. But no matter where they are, their hearts are connected with ours, shoulder to shoulder. In this era, where imperialism runs rampant, and fascism and militarism are increasingly raising their heads and becoming more rampant, the goal of our socialist China is not hegemony, but liberation; not oppression, but equality. The old world of imperialism and colonialism will surely collapse, and a new era for the people is coming.\nLet today's steps resonate across the earth; let today's oath spread in all directions. The Chinese people and all members of the World Liberation International will surely unite closely to jointly seize the great victory of human liberation!\nComrades—Advance!"\nThe square erupted in thunderous applause and cheers. The fighters' slogans and the people's shouts intertwined into one sound, echoing in the vast sky. The Five-Star Red Flag and the red flags of various countries fluttered together in the wind, proclaiming that a new era of internationalism is setting sail from here.\nChihong.88.a: "Advance! Advance!"

  Chihong.89.t: "September Third (VII)"
  Chihong.89.d: "In the heart of Tokyo, thick bulletproof glass reflected the cool autumn light. In the conference room of the Pacific Defense Pact Joint Command, the air was a hundred times heavier than the outside. On the giant screen, the PLA's steel torrent rolled past Tiananmen in columns, followed closely by a succession of red flag formations from Asia, Latin America, and Africa.\nSilence reigned in the conference room. Japan's Chief of Staff, General Sato Shoichi, tapped his finger on the table, but couldn't find a suitable word to break the tension. His eyes were locked on the Korean People's Army contingent on the screen—the uniform steps, the glistening bayonets, and the brand new red flag symbolizing the Democratic People's Republic of Korea—seemed to be an open mockery of the PacDef confidence.\nIndian representative General Rao muttered under his breath, "The situation has truly taken a sharp turn." His words were immediately swallowed by the tension in the air. Since the collapse of the Kim regime and the system's re-establishment in Pyongyang with Beijing's help, the balance of power in East Asia had quietly tilted. What was once considered the peninsula quagmire has now become the bridgehead for the World Liberation International.\nAustralia's Defense Minister's steel pen snapped with a *snap* and ink spilled onto the document, like an overflowing shadow. "Ah, what bad luck, let's wait until the sun sets before continuing the meeting."\nThe giant screen continued to switch, showing the red guerrilla groups of Latin America, perhaps with simple weapons, but with blazing eyes and firm steps. Then came the left-wing armed forces of Africa, though few in number, holding banners symbolizing unity and struggle. The generals in the Tokyo hall understood perfectly: these forces, which were originally scattered and isolated, are now coalescing with Beijing as their core, forming a red network spanning continents.\nThe air was practically solidified. Everyone felt the silent pressure: this was a political declaration—China is no longer isolated, no longer seeking isolated development, but is standing center stage with the revolutionary forces of the entire Third World.\nA Japanese Foreign Affairs official finally whispered, "Gentlemen, if we continue to underestimate Beijing's resolve, the next ones to walk across Tiananmen might be the enemies we consider to be far out of reach."\nA few remnants of the "Republic of China" defeated troops were "specially invited" to attend this meeting, which made these lost dogs feel utterly disgraced. At this moment, they were silently wiping the sweat from their foreheads with white handkerchiefs.\nThe Foreign Minister was silent for a while, then forced a reluctant smile: "Alright, alright, Minasan, let's have some refreshments first."\nSubsequently, a few waiters served Tiramisu and strawberry soda, as alcohol was not served during the meeting. But as ill luck would have it, one serving of Tiramisu was unfortunately knocked over, forcing the two "Republic of China" staff officers to share the same dessert.\nThe two poked at the dessert with their forks, their faces strained, the only effect of which was to ruin the dessert's exquisite presentation—the two felt a mix of emotions, but none of them was sweetness.\nChihong.89.a: "We'd better finish eating soon..."

  Chihong.90.t: "Report on Indian Army Movements on the Tibet Border"
  Chihong.90.d: "\n\n\n                  £GFX_MSS_event_texticon   \n\n\n\n\nTo: Central Military Commission\n\nAccording to information gathered by our comrades in the clandestine front through various channels, the Indian government authorities plan to establish a so-called 'All-Weather High-Altitude Mountain Warfare Force' in its northeastern states, and the Indian government authorities are also planning to deploy more troops to the Aksai Chin and South Tibet areas to strengthen their military presence. Furthermore, based on information provided by some volunteers involved in the underground organization of the 'CPI (Maoist)', they have recently photographed a considerable amount of Indian troops mobilizing towards India's northeastern states, which further corroborates the accuracy of the above intelligence.\n\nAt the same time, according to the report from our Tibetan border defense forces, some Indian troops are constructing a large number of combat fortifications and various types of infrastructure along the border, and scattered incidents of team-level border crossings and conflicts occur from time to time. Some Indian troops were found carrying intelligence they had collected about our border defense posts. These minor conflicts are clearly reconnaissance preparations for larger-scale border crossing activities to come.\n\nThe Western Theater Command has strengthened patrols on the Tibetan border and dispatched engineer units to reinforce border outposts. Although the Indian Army's specific movements and plans are still unknown, our army will adhere to the principle of self-defense and counterattack, and resolutely defend every inch of the motherland's territory.\n\nNote: Due to the Indian troop movements, the operational environment for the CPI (Maoist) guerrillas has slightly eased, which creates a favorable condition for us to provide assistance. If our side successfully aids the CPI (Maoist), it will create a good condition for their active operation. However, if exposed, it will have a severe negative impact on our international reputation."
  Chihong.90.a: "Very well, keep a close watch on the Indian Army"
  Chihong.90.b: "The Central government will allocate extra resources to reinforce fortifications in the border area"
  Chihong.90.c: "It seems we need to light a fire in the belly of this giant elephant"

  Chihong.91.t: "The Endless War"
  Chihong.91.d: "Singh's body was deeply sunken into the sofa in the temporary command post, unable to move, letting the sporadic sounds of gunfire and grenade explosions, and the tide-like screams and roars continue outside. He did not move, only staring intently at the bloodstain-like scarlet patch on the map and the red arrow extending from it.\n\nA grenade slammed violently into the wall, shaking the chandelier so much it dropped abruptly onto the floor from the ceiling. It was only then that Singh's brain seemed to struggle out of the endless abyss. He had to escape now. He couldn't stay here. He would surely be devoured alive. He quickly took off his officer's uniform and dragged out a locked box hidden deep in his traveling luggage. He fumbled through his pockets and finally pulled out a large bunch of keys. The keys scraped roughly across his fingertips; the closer the gunfire outside got, the faster the keys scraped. Just as he finally found the key he needed, a burst of rapid gunfire suddenly rang out, making him flinch. The key fell inopportunely from his fingertips, about to drop into the pile of keys he had screened out. He closed his eyes in despair.\n\nWhen he opened his eyes, he spread his palm and found the key lying there. Fortunately, he caught it. He tremblingly aimed the tip of the key at the keyhole, but his wrist kept shaking, preventing him from inserting it. The dense gunfire finally gradually faded, becoming sparse, leaving only rough shouts and pleas for mercy. Singh's wrist shook even more violently. He took a deep breath, gritted his teeth, thrust the key into the keyhole, and turned it, revealing the soldier's uniform hidden inside.\n\nHe remembered the first time he killed someone. It was in a Tamil village where a tenant farmer, repeatedly extorted by the landlord, took a knife and killed him. Singh was 16 then and, along with the household servants, apprehended the tenant farmer, tied him to a tree, and while drinking beer, shot him in the chest with a hunting rifle. The tenant farmer's blood dyed his poor, ragged shirt scarlet. He and the servants drank themselves into a stupor, but that streak of red and the eyes that would never close were etched into his mind.\n\nHe changed into the soldier's uniform and was about to stand up when he heard his office door crash down. Several guerrillas appeared from the dust, their muzzles black, and their eyes black too."
  Chihong.91.a: "And the scarves tied around their necks were as crimson as blood."

  Chihong.92.t: "Border Standoff Situation Report"
  Chihong.92.d: "\n\n\n                  £GFX_MSS_event_texticon_3   \n\n\n\n\nTo: Central Military Commission\n\nThe true purpose of the Indian Army has now been officially confirmed. The Indian authorities have faced a severe crisis due to their incompetent handling of the epidemic and rural land reform. To divert domestic attention, the Indian authorities are attempting to make a big issue of the border problem to save face. They have formulated the so-called 'Arunachal Pradesh Action Plan,' intending to initiate more military friction in our South Tibet area for political leverage. The standoff incident that occurred in the Galwan Valley a few days ago was one part of this plan. If our side had been defeated, the Indian Army would have been even more brazen in encroaching upon the South Tibet region.\n\nThanks to the Central government's aid, our border defense forces have now deployed defensive facilities in these key defense areas. During the construction of defensive facilities, our newly developed unmanned technology units played an important supporting role. These unmanned military equipment served an excellent purpose in psychological deterrence and engineering assistance. Our border patrol personnel utilized this unmanned equipment, which is equipped with non-lethal casualty means, to effectively deter and control the Indian troops violating the border, ultimately preventing them from acting rashly, and extremely effectively protecting the lives of our soldiers.\n\nCurrently, all pre-scheduled border fortifications have been completed, our military's controlled area has been further consolidated, and the Indian Army's attempt to encroach upon our nation's sacred territory has been greatly frustrated."
  Chihong.92.a: "Hopefully, they'll learn a lesson this time."

  Chihong.93.t: "Report on India's Domestic Situation"
  Chihong.93.d: "To: Central Political Bureau\n\nSince the COVID-19 epidemic entered India, the combination of India's medical conditions and the government's fragmented approach has resulted in the failure to effectively control or cure COVID patients, leading to the death of a significant number of Indian citizens. At the same time, the impact of the epidemic on the global supply chain has also affected India's domestic economic situation, and problems such as unemployment and economic recession have become increasingly severe. Moreover, the Indian authorities' so-called agricultural marketization reform measures have greatly angered self-cultivating farmers and some landlords, leading to an extreme increase in dissatisfaction with the Indian authorities in rural areas. All these factors have prompted the current Indian authorities to take desperate measures, attempting to make a big deal out of the border issue with our side. However, the current tense situation in India is creating extremely favorable operating conditions for the Naxalites (CPI-Maoist).\n\nAccording to the Central government's deployment, comrades in India contacted the Naxalite leadership through various channels. Although the other party was initially hesitant about accepting our aid, after communication, we established trust and provided various assistance in finance, personnel, and activities. Our side strictly adhered to the Central command during the aid process—no interference, no questioning, and no condescension regarding their specific activities—resulting in a preliminary establishment of a cooperative relationship. The technical and combat volunteers we dispatched played an important role in counter-reconnaissance and assisting their operations, which also created favorable conditions for us to further deepen cooperation.\n\nThe Naxalite underground organization seized the opportunity while the Indian government authorities were deeply mired in the difficulties of agricultural reform, quickly mobilizing to gain control of and guide a considerable portion of the peasant movement, striving to exclude the influence of landlords and establishing various large and small peasant associations in the countryside. They also organized and led peasant and worker protests in major Indian cities, forcing the Indian authorities to dispatch a large number of military police to maintain order. Furthermore, after receiving our aid, the Naxalite guerrillas once again expanded their strength, not only crushing the 'encirclement and suppression' campaigns of local military and police organizations like the Rifles Corps but also expanding their base areas outward, and at one point occupying a considerable number of towns. This series of military activities has forced the Indian authorities to tighten their containment of the Naxalites, and many troops originally prepared to provoke border conflicts had to be diverted to various parts of India for suppression, temporarily shelving their plan to instigate border conflicts."
  Chihong.93.a: "Happy Cooperation"
