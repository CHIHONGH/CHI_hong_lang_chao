  prcs.1.t: "Warriors on the Plateau"
  prcs.1.d: "Standing in front of the outpost at an altitude of more than 5,000 meters, I tightened my military coat. The cold wind carried snow particles and hit my face like countless tiny blades. In the distance, the outline of the Himalayas loomed in the twilight, like a silent barrier.\nThis is my second year at the border outpost. Whenever night falls, looking at the bright moon in the sky, I always think of my hometown thousands of miles away. The braised pork made by my mother, the jasmine tea brewed by my father, and the old locust tree in the yard are all becoming clearer in my memory.\n\"Do you miss home? It's cold, come and have some tea.\" the instructor's voice came from behind. I hurriedly wiped my face, turned around and saluted. The instructor waved his hand, motioning me to relax, took the gun from my hand, and asked me to leave the post and stand on it. Then he handed out a thermos cup from the insulation bag on his waist, which contained hot ginger tea.\n\"When I first came, I often stared at the moon in a daze. \"The instructor looked into the distance, \"Later I figured it out, we are here to allow thousands of families to reunite in peace.\" He pointed to the border in the distance, \"Look, that's our position. The more we stand guard, the more peace our motherland will have.\" \n Under the moonlight, the instructor's face looked particularly resolute. I suddenly remembered the oath I made when I joined the army: to defend the motherland to the death. A warm current surged in my chest, dispelling the chill. \n \"Come, let me show you something.\" The instructor took out his mobile phone and clicked on a video. \"Dad, you didn't come back again this year, Yuanyuan was very unhappy, but Dad is a great hero, so Yuanyuan forgave Dad, but Dad, when can you come back to accompany me, you haven't been back for three years.\" In the video, a little girl sat in her mother's arms, looking only six or seven years old, \"This is my daughter, I haven't been home for three years, I can understand your thoughts, next year I will fight for a place for you to go home to visit relatives\" \n My eyes were wet. The instructor patted my shoulder: \"Remember, we are not fighting alone. There are millions of people behind us supporting us. \"\nIt was late at night, I stood on the sentry post, looking at the bright moon. This time, I no longer felt lonely. Because I knew that on this snowy plateau, there were countless comrades like me, guarding the peace of the motherland with their youth. The moonlight sprinkled on the epaulettes, shining with warm light."
  prcs.1.a: "Salute to the Chinese People's Liberation Army"

  prcs.2.t: "New Year 2025"
  prcs.2.d: "Comrades, friends: \nThe bells of the New Year have rung, and the dawn of the Year of the Snake is spreading across the land. In these years full of vitality and change, we hold infinite visions for the future and move hand in hand towards a more glorious tomorrow! \nSnakes, agile and firm, symbolize wisdom, rebirth and unyielding will. Just as the road of revolution, although winding and tortuous, the direction of progress is always unwavering. Let us use the snake's keen insight into the world, use the snake's tenacity to overcome difficulties, unite and struggle on the new journey, and let the communist ideal shine in our era! \nDuring this Spring Festival, let us wish together: the proletariat of the world will unite closely, overthrow exploitation, eliminate classes, and bring true liberation to mankind! May the places where the red flag points be places of freedom and equality; may the hearts of the workers and peasants be accompanied by light and warmth! \nStrive forward in the Year of the Snake, and the revolution will last forever! \nComrades, Happy New Year!"
  prcs.2.a: "China will prosper!"

  prcs.3.t: "Hu Chunhua submits resignation"
  prcs.3.d: "After several years in office, Hu Chunhua formally submitted his request to the Standing Committee of the National People's Congress to resign from the presidency. Subsequently, at the first meeting of the Standing Committee of the 15th National People's Congress, based on the proposal of the Premier of the State Council, the meeting discussed and decided to accept Hu Chunhua's request to resign from the presidency.\n\nAt the subsequent plenary session, Hu Chunhua delivered an important speech entitled "Returning Power to the People". He said: "We have completed the staged reform tasks. Now it is time for power to truly return to the people and for the National People's Congress, the highest organ of power, to fully play its role. "\n\nFinally, in accordance with the provisions of the Constitution, the Standing Committee of the National People's Congress began to perform the powers of the President. This marks an important step for China to move towards greater democratization."
  prcs.3.a: "A new historical phase has begun."

  prcs.4.t: "China invades North Korea"
  prcs.4.d: "Shocking news came from Beijing: The People's Republic of China declared war on the Democratic People's Republic of Korea today. A large number of troops are gathering at the Yalu River border, and the vanguard has entered the North Korean mainland.\nWhen asked about the reason for the declaration of war at today's diplomatic press conference, the spokesperson of the Chinese Ministry of Foreign Affairs replied: "The North Korean people have been living a hungry life under the rule of the Kim family revisionism since 1948, while the North Korean rulers have been eating greasy food and having big bellies. This crime has been ignored for too long. Today, China will complete the unfinished business of the past: completely liberate North Korea and let the real revolution come to the Korean Peninsula."\n\nThe North Korean side strongly condemned China's undeclared war. The North Korean Ministry of Foreign Affairs said: "The invasion of northern imperialism will not make the North Korean people surrender. The Workers' Party of Korea will fight the CCP revisionists to the end. Comrade Kim Jong-un will lead the North Korean army and people to drive the CCP invaders out of North Korea."\nCurrently, videos of the battle between the Chinese and North Korean troops have been leaked on the Internet. We will continue to report on the follow-up of the Sino-North Korean war."
  prcs.4.a: "The clarion call of revolution will surely spread all over the world!"
  prcs.4.b: "Fuck the crazy throne"

  prcs.5.t: "China invades Vietnam"
  prcs.5.d: "In the early hours of this morning, troops mainly composed of the Chinese People's Liberation Army crossed the Sino-Vietnamese border and officially launched a military operation against Vietnam called armed anti-revisionism. The spokesperson of the Chinese Ministry of Foreign Affairs announced at an emergency press conference that the action aims to "correct the serious deviation of Vietnam's revisionist path" and help the Vietnamese people return to the true socialist track.\n\nThe World Liberation International Headquarters issued a statement saying that the top leaders of the Vietnamese Communist Party have been controlled by "capitalist restoration forces and revisionists", betrayed the revolutionary legacy of President Ho Chi Minh, and became "agents of imperialism in Southeast Asia." The statement emphasized that this action is an "internationalist obligation" and its purpose is to "save the Vietnamese revolution that has fallen into the quagmire of revisionism."\n\nInternational leftists have issued statements in support of China's actions. Some scholars even said: "Vietnam has long deviated from the socialist path, and today's action is a historical necessity."\n\nThe Pacific Treaty member states expressed strong protests. The Japanese Foreign Minister called the move a "serious threat to the stability of the Southeast Asian region" and claimed to provide military assistance to Vietnam at all costs"
  prcs.5.a: "The clarion call of revolution will surely spread all over the world!"
  prcs.6.t: "China establishes the World Liberation International!"
  prcs.6.d: "Today, the People's Republic of China held an international conference of unprecedented scale in the Great Hall of the People, officially announcing the establishment of the "World Liberation International". This move was seen by many international observers as another major turning point in the global political landscape after the American Civil War.\n\nChinese President Hu Chunhua delivered a two-hour speech at the conference, emphasizing that "the order of the old world is rapidly collapsing, the dawn of a new world has appeared, and since the real "restoration of order", the power of the proletariat has been unprecedentedly strong", and declared that "now, it is time to let the flames of revolution burn again around the world". The President said that the World Liberation International will unite the oppressed people around the world to build a "world without exploitation". "We will fight to the end for a new world without oppression and oppression, and carry out the unfinished work of all protesters dating back 8,000 years." This move has caused a thousand waves in the international community. Suspicion, panic and ecstasy have converged into a frenzied symphony, shattering the remaining old order. Finally, let us quote a comment. When the world is at the crossroads of multiple crises, Beijing has chosen to pick up the banner of revolution. Is this a historical regression or a kind of progress that we have not yet understood? Perhaps only time can give the answer. In this complex global public opinion field, Beijing seems to have made its own choice, and the world, whether ready or not, will have to face this new reality."
  prcs.6.a: "East over West."

  prcs.7.t: "End of the Malay Archipelago Revolution"
  prcs.7.d: "In the Malay Archipelago, the revolutionary movement supported by the Chinese Communist Party has ended."
  prcs.7.a: "Correct"

  prcs.8.t: "China invades Burma"
  prcs.8.d: "After Myanmar's People's Defense Army won the civil war, the situation took a surprising turn: China immediately launched a military invasion of the Southeast Asian country. Beijing announced that the invasion was the result of Myanmar's continuous attacks and incursions into Chinese territory before and after the civil war. However, many geopolitical experts agree that the real purpose of the invasion was to safeguard China's strategic interests in the region.\n\nAfter launching the invasion under the pretext of protecting the border and maintaining regional stability, Chinese troops crossed the border into Myanmar and advanced towards key strategic locations. The sudden invasion shocked the international community and raised concerns about a wider regional conflict and humanitarian crisis."
  prcs.8.a: "Asia is sliding further into endless war."
  prcs.8.b: "This decision is necessary!"
  prcs.9.t: "A ray of hope (Part 2)"
  prcs.9.d: "Minister Liu nodded thoughtfully: "Go on." \n"For example, Caojing Industrial Park, which was originally mainly engaged in the export of electronic products, can now guide some enterprises to switch to the production of medical equipment and household appliance parts that are urgently needed in China. At the same time, a distribution network directly connected to the community is established to reduce the intermediate links." Chen Mingyuan walked to the whiteboard and quickly drew a network diagram, "This not only guarantees employment, but also stabilizes prices and reduces logistics pressure." \n"The key is to cooperate with grassroots organizations." Minister Liu pointed out. \n"Yes, this requires us to reactivate the initiative of grassroots organizations." Chen Mingyuan's eyes lit up, "I have communicated with several street offices, and we can establish a 'resident demand coordination group' at the community level to collect residents' needs, organize centralized procurement, and even consider restoring some cooperative forms." \n"Your idea is very bold, a bit like returning to the collective economy?" Minister Liu showed an interested expression. \n"It's not a simple return to the past, but innovation under new conditions. "Chen Mingyuan explained, "Although our generation has not experienced the planned economy era, we understand what the core of socialism is. In the face of crisis, it is important to ensure that people's basic lives are not affected and to maintain social stability. This is the purpose of our party." Minister Liu stared at Chen Mingyuan for a long time, and suddenly asked, "When did you join the party?" "Sophomore year of university." Chen Mingyuan replied. "You young cadres do have different ideas from us." Minister Liu stood up and patted Chen Mingyuan on the shoulder, "Write a detailed plan, and you will report to the Standing Committee of the Municipal Party Committee tomorrow." Chen Mingyuan was stunned for a moment: "I report directly?" "Young people must dare to take responsibility." Minister Liu smiled and said, "This crisis is different from the past, and new ideas and new methods are needed. You young cadres can show their talents. "\nIn the next two weeks, Chen Mingyuan's "Industrial Mutual Aid Consortium" plan was approved by the Municipal Party Committee. He led a working group and ran around between various enterprises and communities day and night to organize and coordinate the production conversion. The initial resistance was not small. Some enterprises took a wait-and-see attitude towards this semi-planned adjustment, and some grassroots cadres were not used to this way of working.\nBut as the impact of the American Civil War deepened and the chaos in the global market continued to spread, more and more companies realized that participating in the "mutual aid consortium" might be the only way to survive. And when the first batch of companies that switched production showed benefits, more companies began to actively apply to join.\nA few months later, Jiaxing City showed amazing resilience in the crisis. While other regions were still struggling in the quagmire of the crisis, this small city in the south of the Yangtze River was like a small boat sailing steadily through the stormy waves-the supply of basic living materials was sufficient and the prices were stable, the unemployment rate was far below the national average, and the community security was in order. Although the rhythm of life of the citizens has been adjusted, it has not been disrupted. \nThis series of results soon attracted the attention of the provincial party committee. The research team visited the streets and alleys of Jiaxing, went deep into the workshops of enterprises, and shuttled through various communities to comprehensively investigate this phenomenon. After a detailed investigation report and several special meetings, the provincial party committee decided to promote the "Jiaxing Model" led by Chen Mingyuan as a benchmark for the province's response to crises. Chen Mingyuan himself was also promoted to the Provincial Development and Reform Commission to shoulder a more important mission. \nIn the vast land of the motherland, countless passionate cadres like Chen Mingyuan are stepping forward and opening up new paths with amazing courage and creativity. They broke through the shackles of thought, boldly innovated, and lit up a beacon of hope for the motherland in the darkest moment of the global financial crisis. However, they have not yet realized that these radical governance measures taken in times of emergency, like stones thrown into deep water, will arouse what kind of magnificent historical waves in the near future. "
  prcs.9.a: "The seeds have been sown, when will they take root and sprout?"

  prcs.10.t: "Golden Horse Awards"
  prcs.10.d: "On the playground of the recruit training center in Chenggongling, Taichung, a team of newly recruited conscripts of the Republic of China's National Army is undergoing a four-month standing military service training. Today's training subject is the 3,000-meter weighted long-distance run that scares every "strawberry soldier" in the mouth of the Communist Army. Although the superiors constantly emphasize some nonsense such as "Whampoa Spirit" and "sincere unity", it is obvious that the power of these spiritual atomic bombs is not enough to make these spoiled fledglings learn the principle of the early bird flying first - let alone to help them overcome extreme physical fatigue. The sparse formation on the playground is the biggest ironclad evidence.\n\n"Hey!" The company commander, holding a watch in one hand and a blue record sheet in the other, kicked Lin Chuxing angrily. "Faster! At your speed, the Communists will be the first to capture you as a prisoner in the future!"\n\n"Report, report to the superior..." Lin Chuxing reported breathlessly. "Please, request a rest..."\n\n"Rest? Please, we only require 14 minutes and 45 seconds to pass the 3km race! Can't you hold on to this?" The company commander put a hand under Lin Chuxing's shoulder to stop him from falling forward. "The Afghan Communist Army requires 13 minutes and 40 seconds to pass!"\n\nThe company commander shook Lin Chuxing's shoulders anxiously. "Can you still hold on? If you really can't hold on, go down and rest."\n\nLin Chuxing clearly heard the sneers of several soldiers in the same team, but the darkness in front of him did not allow him to force himself to be a hero. He pulled his legs that were as heavy as lead, untied the helmet strap, held the helmet upside down in his hand like the inner pot of an electric rice cooker, and walked step by step to the shade of the trees beside the playground."
  prcs.10.a: "Mom, I don't want to be a soldier..."
  prcs.11.t: "Grievances Conference"
  prcs.11.d: "Rahul sat in the last row of the conference room with his arms folded, watching Instructor Zhao walk up to the podium. As an ordinary soldier in the Indian Army Infantry Division, he has spent two months in a prisoner-of-war camp. Today, the Chinese organized an event they called a "grievance meeting."\n\n"Welcome everyone to today's exchange meeting." Instructor Zhao said with a smile, translating the language into fluent Hindi, "Here, everyone has a say, regardless of rank. Today we are going to discuss: what kind of comradeship should exist in the army."\n\nThe meeting room was silent. The Indian soldiers looked at each other, and it seemed that no one dared to speak first. Their eyes unconsciously drifted to the backs of the officers sitting in the front row.\n\nAfter a long time, the silence was broken. "I... I want to say a few words. "A timid voice sounded from the corner. Everyone turned to look and saw a thin soldier named Pritt. His hands were shaking, but he still stood up.\n\n"Lieutenant Roy... He often asked us to wash his clothes, fetch water for him, and even asked us to give him massages. Once he said that I didn't wash the clothes clean enough, so he punished me to do fifty push-ups and then beat me with a belt." Pritt said with tears in his eyes.\n\nThe meeting hall was in an uproar. Lieutenant Roy in the front row blushed and turned to glare at Pritt, but under the gaze of the Chinese counselor, he could only grit his teeth and sit back.\n\n"Does anyone else want to share? "Instructor Zhao asked calmly.\n\nThis time, the silence did not last long. One after another, the soldiers stood up and told about the unfair treatment they suffered in the Indian army: their salaries were withheld by officers, they were forced to do free labor for their superiors' families, they were discriminated against because of their low caste, and they were beaten and insulted at will...\n\nRahul was surprised to find that these sufferings that had been suppressed in his heart, once opened, poured out like a flood. What shocked him even more was that there was no soldier present who had not experienced similar treatment.\n\n"Is this normal military discipline?" Instructor Zhao asked, "In the People's Liberation Army, officers cannot beat or scold soldiers, cannot insult soldiers, and cannot ask soldiers to provide private services. The only right of officers is command, and this power comes from responsibility, not blood or caste. "\n\nThree months later, the prisoner-of-war camp held a special event: Indian prisoners of war watched a documentary about the plight of the lower classes in India, followed by a discussion on India's social problems.\n\n"Are your parents, brothers and sisters, relatives and friends also experiencing similar injustices? :" The Chinese counselor asked gently, "When you were oppressed by officers as soldiers, did you ever think that your compatriots were oppressed by the same system?"\n\nThis question hit the hearts of many soldiers. Rahul thought of the poor countryside in his hometown, his father's bent back and his mother's rough hands. Didn't he join the army to escape that kind of life?\n\n"We India claims to be the world's largest democracy, but why are our people still so poor?" An older soldier suddenly asked, "I have been in the army for fifteen years and fought three wars, but my village still has no decent schools and hospitals. ”\n\nFrom that day on, the discussion began to shift from injustice within the army to broader social issues. The Chinese counselors cleverly guided them to think: What caused the gap between the rich and the poor in India? Why is the caste system still so deep-rooted? Why are politicians keen to incite foreign hostility instead of solving domestic problems?\n\nSix months later, when the prisoner repatriation plan was discussed, an unexpected situation occurred. Rahul and more than 30 other soldiers jointly submitted a request to the Chinese side - asking to stay in China.\n\n"We don't want to go back." Rahul said bluntly in a private conversation with Instructor Zhao, "If we go back, persecution may be waiting for us, or even worse. They will treat us as 'brainwashed' traitors. And even if we are not regarded as traitors, we are unwilling to work hard for those blood-sucking officers. "\n\nInstructor Zhao thought for a moment and nodded: "I will ask my superiors for instructions, and I believe your wishes will be taken seriously. \n\nA month later, Rahul and his comrades who chose to stay were transferred to a new base. They began to receive more systematic political and military training, learning organizational work, propaganda skills and guerrilla tactics. \n\n"You will become the spark of the Indian people's liberation cause." Chinese military adviser Li said at the opening ceremony, "When the time is right, you will return to your country, not as prisoners of war, but as liberators." \n\nRahul stood under the flagpole of the new training camp, looking at the red flag fluttering in the wind. He thought of his hometown and his compatriots who were still living under oppression. He knew that choosing to stay meant a road of no return, but also a new beginning. "
  prcs.11.a: "For the liberation of India, for all the suffering people." He said to himself and clenched his fists.

  prcs.12.t: "Though the years pass..."
  prcs.12.d: "Wonsan, North Korea. Under the gloomy sky.\n\nThe infantry company commanded by Zhang Youmin assembled in the wilderness outside Wonsan City and stood in line. In the distance, the engineers were intensively building firepower positions and command positions. Armed helicopters with the emblems of the Chinese People's Liberation Army and Pakistan flew low, and the armored columns of the Chinese and North Korean armored soldiers passed in front of the positions side by side. The commanders of China, North Korea and Pakistan were arranging combat plans. The national flags of China, North Korea, Pakistan and the bright red flags of the World Liberation Front coalition fluttered in this gray world. Not far away, there were also Soviet Red Army officers who were invited to observe the exercise. They held binoculars and were curiously watching the movements of the various troops. This was the first joint military exercise conducted by the World Liberation Front coalition, and the purpose was to run in the armed forces of the three countries. And the Soviet Union The Russian Red Army showed great interest in this joint military exercise of the East Asian revolutionary forces, hoping to learn something from it to deal with the dense war clouds over Europe. \n\nFor Zhang Youmin, this was his first time to set foot on foreign soil, but for his family, this was not the first visit. He still remembered the military certificate written in Korean that his grandfather carefully collected. If his grandfather had not passed away, he would not have known that this serious old military doctor had once been a soldier walking on the front line, and had saved the lives of several Korean People's Army soldiers, and even took a photo with one of them. \n\n"Is it Zhang Youmin Dongji?" A somewhat awkward Chinese sentence brought his thoughts back to reality. A Korean People's Army squadron leader who was wearing new equipment saluted him, about the same age as him. He immediately returned a salute: "Yes, I am Zhang Youmin." "I am Park Lizhi, and I will cooperate with your operations in this exercise. "After saying this, the squadron leader was stunned for a moment, looked at Zhang Youmin's face carefully, then took out a black and white photo and looked at it, and asked tentatively: "Was your grandfather a military doctor of the Volunteer Army?"
  prcs.12.a:"Zhang Youmin immediately reacted and said excitedly: "Yes, he is a military doctor."

  prcs.13.t: "Though the years pass..."
  prcs.13.d: "Wonsan, North Korea. Under the gloomy sky.\n\nThe infantry company commanded by Zhang Youmin assembled in the wilderness outside Wonsan City and stood in line. In the distance, the engineers were intensively building firepower positions and command positions. Armed helicopters with the emblems of the Chinese People's Liberation Army and Pakistan flew low, and the armored columns of the Chinese and North Korean armored soldiers passed in front of the positions side by side. The commanders of China, North Korea and Pakistan were arranging combat plans. The national flags of China, North Korea, Pakistan and the bright red flags of the World Liberation Front coalition fluttered in this gray world. This was the first joint military exercise conducted by the World Liberation Front coalition, and the purpose was to run in the armed forces of the three countries. . \n\nFor Zhang Youmin, this was his first time to set foot on foreign soil, but for his family, this was not the first visit. He still remembered the military certificate written in Korean that his grandfather carefully collected. If his grandfather had not passed away, he would not have known that this serious old military doctor had once been a soldier walking on the front line, and had saved the lives of several Korean People's Army soldiers, and even took a photo with one of them. \n\n"Is it Zhang Youmin Dongji?" A somewhat awkward Chinese sentence brought his thoughts back to reality. A Korean People's Army squadron leader who was equipped with new equipment saluted him and was about the same age as him. He immediately returned a salute: "Yes, I am Zhang Youmin." "I am Park Lizhi, and I will cooperate with you in this exercise." After saying this, the squadron leader was stunned for a moment, looked at Zhang Youmin's face carefully, then took out a black and white photo and looked at it, and asked tentatively: "Was your grandfather a military doctor of the Volunteer Army?" "
  prcs.13.a: "Zhang Youmin immediately reacted and said excitedly: "Yes, he is a military doctor."

  prcs.14.t: "Be the best warrior (I)"
  prcs.14.d: "Zhou Hang's eyes were fixed on the green frame on the screen. He was using the thermal imaging pod of the Wing Loong 2 to direct an AKD10 towards a square-headed tank.\n\nBut he didn't notice the white smoke rising from the enemy's spawn point. "Damn it's the Hornet again!" He looked at the kill report on the screen and couldn't help regretting why he was in a hurry to find the Japanese Type 90 that had just destroyed him when he was in the sky. His roommate Zhang Wei leaned over with curiosity: "What Hornet? I also have the Skyrim... I'm so surprised, why are you also playing War Thunder?"\n\n"Just started, Chinese system, now there is only a Khalid and a 80UD. The Japanese 90 is too beastly. It can fire two rounds in the time it takes my Khalid to fire one shot. The 80UD is even more blank with only armor-piercing shells. How can it beat it head-on?" Zhou Hang shrugged helplessly, "When I have the Type 99 and the J-11, I will kill all these Japanese. "\n\n"Although the Soviets put some pressure on gaijin in order to promote their own equipment, it is said that the People's Liberation Army also participated in it, strengthening the entire red camp country together with China, but the Khalid you can play is not a hard car itself, you should play to your strengths and avoid weaknesses and make use of the traditional interspersed people's army to attack the opponent from the side. "Zhang Wei patted Zhou Hang on the shoulder and said, "Add me as a friend later, I will take you to play 11.0, you follow me and learn how to walk the line. "Zhang Wei returned to his desk and opened War Thunder, "Lin Min, where are you? Take Brother Hang to play two games. Now we need someone who can play airplanes. "\n\n"I'm here, wait for me." Lin Min's voice came from the dormitory next door, "I just finished playing VT5 accessories, it's so cool to shoot once every five seconds. Although the current 99 has become 6.5, it is much better than the previous 7.1, but which golden helmet will refuse a light tank that can shoot fast and resist machine guns. "
  prcs.14.a: "One more round!"

  prcs.15.t: "Be the best warrior (I)"
  prcs.15.d: "Zhou Hang's eyes were fixed on the green frame on the screen. He was using the thermal imaging pod of the Wing Loong 2 to direct an AKD10 towards a square-headed tank.\n\nBut he didn't notice the white smoke rising from the enemy's spawn point. "Damn it's the Hornet again!" He looked at the kill report on the screen and couldn't help regretting why he was in a hurry to find the Japanese Type 90 that had just destroyed him when he was in the sky. His roommate Zhang Wei leaned over with curiosity: "What Hornet? I also have the Skyrim... I'm so surprised, why are you also playing War Thunder?"\n\n"Just started, Chinese system, now there is only a Khalid and a 80UD. The Japanese 90 is too beastly. It can fire two rounds in the time it takes my Khalid to fire one shot. The 80UD is even more blank with only armor-piercing shells. How can it beat it head-on?" Zhou Hang shrugged helplessly, "When I have the Type 99 and the J-11, I will kill all these Japanese. "\n\n"Stupid BVVD, in order to promote his Russia, China in the game was severely slashed. I thought that China's equipment was all inferior imitations of Russian goods. What's more, the Khalid you have is not a hard car itself. You must play to your strengths and avoid your weaknesses and make use of the traditional interspersed methods of the People's Army to attack the opponent from the side. "Zhang Wei patted Zhou Hang on the shoulder and said, "Add me as a friend later. I will take you to play 11.0. You follow me and learn how to walk the line." Zhang Wei returned to his desk and opened War Thunder, "Lin Min, where are you? Take Brother Hang to play a few games. Now we need someone who can play airplanes." \n\n"I'm here, wait for me." Lin Min's voice came from the dormitory next door, "I just finished playing VT5 accessories. VT5 can't even stand 12.7. One of the North Industries Bangladesh and your mother's Russians must be a moron, but at least it is a fast-shooting starter, which can barely get me to the sky"
  prcs.15.a: "One more round..."

  prcs.16.t: "Be the best warrior (Part 2)"
  prcs.16.d: ""Brother Hang, look at the yellow label, the enemy Type 90, its tracks are broken but the gun is intact and I can't get on." Zhang Wei nervously confronted a man driving a Type 90. Although the 620 steel needle at hand could penetrate the enemy, the enemy's four-second one-shot was not a pushover. Lin Min now only had two air-to-air missiles left, and the only one who could help was Zhou Hang's Wing Dragon 2 and the two AKD10s at hand.\n\n"I'll clear the air defense of the opposite house, you can shoot with confidence... Damn, my RWR is ringing!" The alarm from Lin Min's side could be heard even by Zhou Hang with some faint and rapid beeps. "AKD10 is off the shelf, seven kilometers and twenty seconds. "The green box on Zhou Hang's computer has tightly wrapped around the enemy's tanks. When he followed Zhang Wei just now, there were indeed three stupid Abrams tanks with a tile-throwing chair on their heads, exposing their sides. Before Lin Min had time to mark the small map, Zhou Hang got two kills in just seven seconds. The last one just turned around and was hit by Zhang Wei's high-explosive shell and carried away by the overpressure of the machine gun on the roof.\n\n"Countdown ten seconds, nine seconds, fuck Zhang Wei, look to your left, there is a wheeled vehicle!" Zhou Hang looked at the high-speed mobile wheeled vehicle next to the screen and gave the team a yellow mark. Zhang Wei twisted the vehicle body as soon as he heard it. The Italian Centaur was shot through by Zhang Wei as soon as it appeared, and the Type 90 was pulled out directly when it saw Zhang Wei firing. Just as it was about to fire, it was hit by the AKD10 and turned into a burning wreckage.\n\n"Well done." Zhang Wei straightened the vehicle body and said as he drove forward, "Lin Hang, how are you doing? ”\n\n“F14., I twisted off his two Phoenixes, and before the keycaps could react, I sent him away with one shot with my Viper...Fuck Hang, the guy on the opposite spawn point came to fuck me with Adats!”\n\n“Lin Min, why are you in so much danger? The second AKD10 is off the rack.” Zhou Hang locked onto the aluminum box at the enemy’s spawn point, “Zhang Wei, keep pressing forward, and turn right after you reach the slope I marked. Three more tanks are facing you.”\n\n“Received, thank you, comrade drone.” Zhang Wei pressed the W key, “When you graduate, do you want to consider joining the Air Force and flying drones? Our drones are better than Wing Loong 2 now. It just so happens that the Air Force has released a drone simulation software, do you want to try it?”"
  prcs.16.a: "Yeah, that looks good."

  prcs.17.t: "Be the best warrior (Part 2)"
  prcs.17.d: ""Brother Hang, look at the yellow label. The Japanese Type 90 and the fucking Type 577 were eaten up by the Japanese fuel tanks again." Zhang Wei hurriedly reversed, but the Japanese JM33 still got into his crotch of the third-stage Type 99. "It's the fucking fuel tank that exploded again. Why the hell is China a nitroglycerin fuel tank?"\n\n"There's really no way. I've already fired my AKD10, but guess what, hitting the Japanese scalp is a hit." Zhou Hang said angrily, "During the Taiwan Strait, I didn't see the Japanese tanks so hard, but they were still trampled to death together with Abrams."\n\n"Isn't that the stupid Russians? Just now there was an F14, and the two Vipers of the J-8B flew away. It was hard to bite him at six o'clock, but the one-kilometer PILI 5B was able to chase vertically and burn the butt instead of hitting the keycap, and the machine gun was full of sparks. "Lin Min said as he locked onto the F14 with Doyle's radar, "Fuck Doyle, please don't chase the Phoenix, okay?" \n\n"War Thunder is like this, our sunk costs are too high and it's too late. You've only been playing for less than a month and you still have time to quit." Zhang Wei stood up from his seat and walked to Zhou Hang, looking at Zhou Hang's unhappy expression after his drone was destroyed by the Phoenix, "Recently, the Air Force has released a drone simulation software. If you like drones, go play that. Although it's more difficult, at least it won't be targeted by foreign companies. ""
  prcs.17.a: "He sighed and pointed to the mold."

  prcs.18.t: "Be the best warrior (Part 3)"
  prcs.18.d: "It was late at night, but Zhou Hang's dormitory was still lit. His fingertips moved quickly on the keyboard, his eyes fixed on the Wing Loong-2 on the screen.\n\n"Why is it spinning again? This game is so difficult to control the stick."\n\nThe system popped up a task evaluation interface, and several operation clips were automatically cropped out: the angle of attack was too large, the control stick was unstable, and the details were listed by the AI ​​referee. But this was Zhou Hang's seventh failure tonight, and it was almost this problem every time.\n\n"The new plane is finally out, I'm going to sleep." Roommate Zhang Wei closed the computer, climbed up the ladder and turned over to the bed, "Still serving the People's Air Force here."\n\n"One more game, I can do it this time! "Zhou Hang muttered and clicked the retry button with his mouse.\n\nThe drone simulation game that Zhou Hang was playing, sponsored by the People's Liberation Army Air Force and produced by Shenzhen People's Internet Co., Ltd. (formerly Tencent Group), has become popular among military game enthusiasts at home and abroad. The game simulates the full spectrum of operating experiences, from the handheld "Hummingbird" reconnaissance aircraft to the medium and large "Rainbow" series, and then to the heavy "Wing Loong" strike drone. The slogan is "Experience future air combat and add color to the blue sky of the motherland", but players prefer to call it "cyber service" - because it is so realistic that many players who have only used keyboards and mice find it difficult to get started.\n\nZhou Hang switched to the smaller "Flying Eagle-1" single-soldier reconnaissance drone, trying to complete the secret surveillance mission on the edge of the forest. This small drone is theoretically easier to control, but the real airflow simulation added to the game makes it likely to be blown away by a gust of air at any time.\n\n"Why is the wind so strong? "Zhou Hang pounded the table. When the drone he carefully controlled was overturned by a sudden breeze again and swayed and hit the big tree beside him, Zhou Hang couldn't help but feel irritated.\n\n"It's really that big." Zhang Wei's voice came from the upper bunk, "My cousin is a soldier in the border defense. He said that the control difficulty of the small drones in this game is a little lower than in reality."\n\n"Then how do they fly?"\n\n"Why do you think it's called 'cyber service'?" Zhang Wei lifted the pillow and said jokingly, "Do you think it's so easy to win? The drone pilots of the People's Air Force practice this every day, and you are just getting started."\n\nThe phone vibrated, and a message from Lin Min in the next dormitory popped up: "Brother Hang, try 'Rainbow-7', which has better stability in complex terrain and has automatic terrain following function."\n\nZhou Hang replied curiously: "How do you know I'm playing?"\n\n"Nonsense, your game status has always been online. It's three o'clock and you're still not asleep. Will you be able to concentrate in class tomorrow?"\n\n"Are you playing too?" Zhou Hang smiled and switched to "Rainbow-7" as Lin Min suggested. Sure enough, the control feeling was immediately much more comfortable. He carefully adjusted the altitude and speed, letting the drone fly along the ridge and avoid the simulated radar detection area.\n\n"It should work this time..."\n\nAs the mission objectives were completed one by one, Zhou Hang's control became more and more proficient. In this almost demanding simulation game, every successful flight is like a real victory. The mountain scenery on the screen is picturesque, and he can even feel the airflow from Rainbow 7 blowing on his cheeks. When the mission victory prompt finally popped up, Zhou Hang couldn't help but raise his hands and cheer:\n\n"Finally!"\n\nZhang Wei sighed helplessly: "Three twenty, you can finally fall asleep tonight, right? "\n\nBut Zhou Hang has already opened the next game. This time he chose the heavy "Wing Loong-10" stealth drone. This latest model requires a lot of skill points to be unlocked before it can be used in the game. It is said that its control interface is a 1:1 replica of the real model.\n\n"It's worth it to serve in the cyber prison for the People's Air Force!""
  prcs.18.a: "Zhou Hang muttered, and took off again to defend the virtual blue sky of the motherland."

  prcs.19.t: "Last year at this door"
  prcs.19.d: "At eight o'clock in the morning, the peach branch was reflected on the blackboard through the window in the front row, slowly sliding into the narrow gap of the chalk slot and mixing with the dust accumulated last year. Teacher Fang was preparing a lesson plan and writing comments under the column of necessity, unaware that the peach blossom had climbed up the corner of his pants. The peach branch turned away from the unfaithful man and went to play with the floating dust in the corner. As the class became more and more noisy, Teacher Fang couldn't help but look up. It didn't matter if he didn't look, but he was immediately furious when he saw it. Some were chatting, some were playing with airplanes, some were sleeping... It was a mess. Teacher Fang opened his mouth and was about to say something, but was interrupted by the sudden bell for class.\n\nAs the bell ended, Teacher Fang looked at the quiet students and didn't want to say a word. Frosted eggplant? Maybe, at least it was still more energetic before class, Teacher Fang comforted himself. Turning around to write down the lesson to be taught today, Teacher Fang said to the students: "Today let's talk about the necessity of self-revolution. "\n\n"I believe that the students have prepared carefully before class. Now let's pick a student to ask a question. "Before Teacher Fang finished speaking, the atmosphere in the class suddenly became solemn, and Taoying shrank under the desk and trembled.\n\n"Is there anyone who volunteered? ... In this case, the sleeping student..." The snoring person was poked by the elbow next to him unconsciously, and even Taoying beat the person's feet madly. "...The student next to him will answer."\n\nAs soon as the voice fell, the class seemed to have returned to the heat first, and then fell into a colder abyss, and Taoying froze behind the chair. "I... I don't know, teacher, I need to read a book first."\n\n"That's right, wake up the student next to you." Teacher Fang looked at the students and said slowly: "Recognize your own problems, and make changes, grow in the negation of negation, and thus develop in a spiral upward. Dialectics tells us that the fundamental reason for the development of things lies in the contradictions within things, and self-revolution is our way to jump out of the historical cycle. "The students focused their attention on the classroom, and the peach branch was having fun pretending to be the blush on the students' faces.\n\n"Let's have a free discussion later, let's go to class now."\n\nThe face of the man and the peach blossoms are red\n\nThe face of the man is unknown\n\n"The fundamental reason for the development of things lies in the contradictions within things..." The peach branch was doing morning exercises on the eyelashes of the students, and Teacher Fang was concentrating on the class. Brother Elbow elbowed Brother Sleep again, "What are you doing?" Brother Sleep turned his head, and the peach shadow fell on the back of his head and stuck to the tip of his hair.\n\n"What do you think the internal contradiction is?" Brother Elbow said, he felt that the peach branch reflected on his face was a little dazzling. "It's definitely not you poking me now, this is obviously an external contradiction. "Shui Ge was obviously still upset about the elbow strike just now. A gust of wind blew, and Tao Ying was facing the two bad guys fighting in a ball, and she didn't notice that she had been moved. "My two classmates, now is not the time for free discussion, why don't you two go to the stage to speak?" The two were chatting when suddenly their eyes went dark, and Teacher Fang just walked to their side.\n\n"... The free discussion will start with you two." Teacher Fang returned to the stage...\n\n"Let's have a free discussion now." The audience was quiet at first, and then it became intense, waking up Tao Zhi who was sleeping on the top of the students' heads.\n\n"You need to have a collection of wrong questions, and you can find problems only by sorting them out frequently." This was what Elbow Ge said. "It's better to write more self-reflection, self-reflection is the most important." Shui Ge obviously disagreed. "You stayed up past one o'clock last night, and the self-reflection you wrote would only say that your learning attitude is not correct. "This is the roommate who shared the dormitory with Brother Shui." "Sleeping late can't be called staying up late, how can students' affairs be called staying up late?" Then there were things like "turn off the lights at 10 o'clock" and "it's better to clean up after being late", which made the students around laugh. "Don't forget that students have to evaluate each other during our monthly exams." "We must also take self-revolution as a kind of self-consciousness..." Teacher Fang added.\n\n Taozhi ran to the lesson plan, and her footprints just covered the words "two complete breaks" circled in red pen."
  prcs.19.a: "Peach blossoms still smile in the spring breeze"

  prcs.20.t: "People in the apricot forest"
  prcs.20.d: "Doctor Zhang had just seen off the last patient of the morning when he collapsed in a chair from exhaustion. It was already noon, and he didn't want to touch the lunch box his wife had prepared. He just wanted to lie down in a chair and rest for a while. As the only doctor in several nearby villages with nearly thousands of people, he really felt exhausted.\n\nHe used to be very tired. Occasionally, a few nearby villagers would come to him for medical treatment, but when he walked in those villages, he could still often see children with high fever being wrapped in swaddling clothes by their mothers with ginger slices applied to them, and elderly people with enteritis vomiting and diarrhea while drinking Coptis chinensis water. So he could only take the initiative to find those patients and provide them with free medical treatment. Prescribe them medicine at cost price. But some villagers either can't afford it or are more superstitious about their own prescriptions. \n\nHowever, in the past few months, he has been busy here, and the clinic has become lively. After all, seeing a doctor is cheaper, and the recent free clinics have helped the villagers popularize a lot of medical knowledge, and more people are still willing to come to him for treatment. Although it is said that there is no need to take the initiative to go to the village, it is inevitable to be tired. \n\nDoctor Zhang walked to the empty backyard, looked at the apricot tree planted behind the yard, and lit a cigarette for the first time and started smoking. "It would be great if someone could help me share the pressure of seeing a doctor." He thought. \n\n"Is Doctor Zhang here?" Someone shouted at the door. \n\n"Please sit down first, fellow villagers, I'll be there soon." He threw the cigarette on the ground and stepped on the cigarette butt. \n\nWhen he walked to the reception desk and saw another man in a white coat standing there, he was immediately stunned. "
  prcs.20.a: ""Doctor Zhang, I am a new doctor, and we will be colleagues from now on.""
  prcs.21.t: "Thousands of people, thousands of faces"
  prcs.21.d: "Teacher Fang straightened his collar and walked quickly across the corridor full of flowers. His chest rose and fell, and he happily enjoyed the sweet and refreshing breath of spring flowers. The policy of letting a hundred flowers bloom and a hundred schools of thought contend on the cultural front allowed this young scholar to finally get rid of the stereotyped repetitive words in political books and teach students real thoughts and opinions, knowledge that is truly worthy of the name of the textbook "Thoughts and Politics".\n\nWhen the chalk dust fell on the multimedia podium, the May sunshine shone through the window lattice, sprinkling a breath of new life on the students' desks. Teacher Fang turned around and looked at the students with a smile: "Students, in this ideological and political class, we are going to talk about something different from the past. Let's break the old."\n\n"Break the old?"\n\n"Yes, break the old. In layman's terms, it is to criticize the poisonous weeds of our past. "Teacher Fang inserted the USB drive into the all-in-one machine, swiping the screen while smiling. "For example - practice is the only criterion for testing truth." \n\n"Students, look at this historical image." The red laser dot stopped on the worker wearing a red armband, "In 1932, workers at the British-owned tobacco factory in Shanghai went on strike. When they were testing the truth that 'strikes can fight for rights and interests' on the streets, the British consulate across the street was also practicing the truth that 'military suppression can safeguard colonial interests'. So what do you think, did they all practice it? ”\n\nSeveral students were speechless, as if they were thinking deeply, and some were furious, because this was completely different from the education they had received for so long. However, some understood and were quickly using the new version of the ideological and political textbooks to highlight the key points with fluorescent pens.\n\nThe slides continued to play, and the yellowed pages of Guangming Daily in 1978 and the bright red title of Mr. Wang Huning's report in 2023 collided on the screen. Teacher Fang's finger slid across the touch screen, and two photos split the solidified air like a sword-the left was a human wall built by striking workers in Shanghai during the epidemic, and the right was a silhouette of stock exchange elites ringing the bell in the stock exchange building.\n\n"Comrade workers, you are using practice to verify the truth that unity is strength, and capitalists are also using practice to verify the truth that capital never sleeps and only makes money without talking about the bottom line. If practice is the only criterion for testing truth, can we still say that truth is the only one? "\n\nThe classroom was filled with the sound of students flipping through books. Even the most naughty student in the corner was aroused by the current situation and listened to the class carefully.\n\n"Let's take a look at an interesting comparison." Teacher Fang slid the screen. The bar chart of the surge in grain production in Xiaogang Village in 1982 was juxtaposed with the video of drone sowing in an agricultural cooperative in 2023. "For the same yellow land, the practice of dividing land to households forty years ago created a miracle, and forty years later, the practice of land transfer is continuing its glory--" He suddenly enlarged the densely packed equity structure fan chart on the screen, "but why do the shares of agricultural production cooperatives all come from those large investment companies? ”\n\nThe coolness from the air-conditioning vents climbed up the back of the neck, and several students unconsciously straightened their backs. Several students who were best at ideological and political education felt that the education they had received was as pale and powerless as catkins - because that was not an education that spoke for their class.\n\n"When we talk about 'practice verifies truth', is it the workers on the assembly line who are testing it by working 12 hours a day, or the clinking of champagne glasses in the board office?" Teacher Fang suddenly raised his voice. "Hmm? Classmates? You are also children of workers, and your parents are also making a living in cramped offices, stuffy steel rolling workshops, and exposed fields. Classmates, please think about it, what truth are they verifying?"\n\n"Let's take one last example, the intensification of the global greenhouse effect. "Teacher Fang cleared his throat and glanced at the whole class with his peripheral vision - he was satisfied to see that the whole class held their heads high and followed his thoughts closely. "While developed countries are practicing 'environmental truths' with hypocritical carbon trading and relying on carbon emissions to patch up the gaps, the indigenous people of Tuvalu are using their flooded homes to 'practice' another truth - that excessive carbon emissions will really devour their country. "He tapped the outline of the island that was about to disappear on the screen, "That's why Marx said that mankind always only proposes tasks that it can solve. "\n\nThe spring breeze swept into the classroom with the fragrance of wisteria. This is the spring breeze of this era, the spring breeze of workers and farmers, the vast proletariat, and the spring breeze of those "neglected majority" who have lost their voice for decades.\n\nTeacher Fang threw half of the chalk head on the table in a chic manner, looking at the whispering students, he knew that he could no longer endure the students' eager discussion.
  prcs.21.a: "Classmates! Free discussion for five minutes!"

  prcs.22.t: "Catch the "Pig""
  prcs.22.d: " As the People's Liberation Army swept down several cities like autumn wind sweeping fallen leaves, the ordinary soldiers in the Taiwan puppet army collapsed at the first touch, and the morale of the army collapsed. Under the guidance of underground personnel, the defeated Taiwan puppet army surrendered to the People's Liberation Army in an organized manner. Due to the large number of surrenders, the PLA's advance troops could only confiscate their guns first, leaving a part of the backup troops to guard them, and the new recruit Cheng Gang was one of them.\n\n"Gangzi, the quality of these strawberry soldiers is really poor. We fired a few shots into the air and then threw our weapons to the ground and started to salute in French. Catching them is like catching pigs. It's just hard for the comrades in the receiving troops in the rear to adopt so many "pigs". "After dinner, my roommate Wei Xiang complained, "No, even if it's tens of thousands of pigs, it will take time for the comrades on the front line to catch them..."\n\n"Don't say it, I just delivered food to a puppet soldier, and he asked me how to eat guava." Next to him was the squad leader of the next class, Lao Zhang, "He cried and asked me how to eat a whole guava, saying that at home his mother would open it and remove the seeds before giving it to him." He sighed helplessly and tiredly.\n\n"Indeed, I heard that there was a leaf smoker at the second battalion commander's side. After being caught, he was addicted, drooling and snotting, begging for leaves." Cheng Gang answered, glancing at the prisoners squatting on the ground, and looking around vigilantly from time to time. "The comrades on the front line are fighting hard, and we should also do a good job. "\n\n"Crack" the sound of breaking branches reached the ears of several people.\n\n"Swish" several people raised their guns almost at the same time and looked towards the source of the sound\n\n A man in an unknown military uniform stood there in a daze. He repeated the action of holding the gun like a machine, but the pistol was not even unholstered. He was just doing it in vain.\n\n"Don't move, put down your weapon, and raise your hands." Cheng Gang said coldly, observing his every move. As long as the man had any abnormal behavior, he would shoot immediately.\n\nAnd Wei Xiang beside him had been on guard all around, his eyes like torches.\n\nThe man finally reacted, slowly raised his hands, and said in a trembling voice, "Jiang Can Shi Te Sha Su Na (I surrender, don't kill me)"\n\nCheng Gang frowned. He felt a sense of familiarity when he first saw this man. After hearing the voice, He was sure - that was his Japanese foreign teacher when he was studying in junior college. \n\n"Toyokawa-san, please calm down" he said in a strange voice. Then, he skillfully unloaded the foreign teacher's weapon. \n\nToyokawa was trembling, and kept muttering "Shasana-ide (Don't kill me)", while Cheng Gang, who was guarding him, was wondering why he was here. \n\n "Student Cheng Gang, I'm going back to China to join the army. Please take care of yourself and hope to see you again in the future." Recalling the parting words of Teacher Toyokawa several years ago, a chill rose from his feet to his head. He stopped Wei Xiang and said, "He is a member of the Japanese Self-Defense Forces. The devils are interfering with our unification. Report it quickly! "After speaking, he took a breath and looked at Wei Xiang to report the situation.\n\n"Report to the battalion commander, Japanese Self-Defense Force infantry has been found, requesting support and interrogation. ""
  prcs.22.a: "Catch the pigs, catch the Japanese pigs"

  prcs.23.t: "New Mountain City, New Era"
  prcs.23.d: "At night, Xiao Zhang strolled in the Jiefangbei state-owned business district in Chongqing. In the past 10 years, there has not been such a big change. 10 years ago, people were impressed by the bustling pedestrian street with huge crowds of people. And 10 years later... it has become a "cyberpunk" city.\n\n Chongqing used to have no shortage of high-rise buildings, but in the era of large-scale infrastructure, the planning of building a giant business district has added icing on the cake for this mountain city. After the seaweed, the central government quickly gave Chongqing construction planning guidance, saying that the goal is to move towards a futuristic city. . Soon, this place became a state-owned business district. The night covered Chongqing with a veil, and the steel skeleton of this mountain city became clearer in the dark. The skyscrapers lined up like giants under a spell, piercing the sky between the mountains. The glass curtain walls reflected the neon light, stirring the stars and the lights of the world into a dazzling vortex. The LED lights in several high-rise buildings flashed a few words, but unlike usual, what came into view was "Salute to the People of Chongqing". Xiao Zhang was surprised. After all, he had only seen such scenes in novels. "
  prcs.23.a: "It's a foggy city!"

  prcs.24.t: "Old guard, new faces, young people"
  prcs.24.d: "The atmosphere in the conference room was a bit subtle. No one was talking. Some people looked at the faces they rarely saw with a questioning look; while some new faces had uncertain expressions. What was most puzzling was that among these people sat an old man who was older than many of the people present. His face no longer showed the restlessness of his youth, leaving only a pair of calm eyes.\n\nThe conference room was silent for a while, and it was Hu Chunhua who first broke the state: "Comrades should have discovered that our 20th National Congress has elected many new faces, but also many old soldiers, which reflects both a new look and steady progress. In any case, we should all unite as one."\n\n"So for now, those who need to be transferred include the general leader of state affairs, the host of economic work, the host of foreign affairs, the host of internal affairs, and the host of propaganda work. ""
  prcs.24.a: "Now, let's discuss who the appropriate candidates are..."

  prcs.25.t: "Flowers blooming on red walls"
  prcs.25.d: "If the President is the helmsman of the Republic, the Premier of the State Council is the first officer of this aircraft carrier. The Premier generally serves as a supplement to the President's focus. If the President himself is active in diplomacy, the Premier will govern on his behalf. If the President is diligent in governing, the Premier will handle foreign affairs. In General Secretary Hu's reform plan, it is necessary to concentrate on major events in the future, so the comrade who succeeds the position of Premier must be experienced, strong and able to convince the public. Therefore, the image of an old predecessor emerged in his mind.\n\nComrade Wang Zhaoguo, one of the members of the Political Bureau during the era of former President Hu Jintao, during the era of Hu Jintao, he headed the Federation of Trade Unions of the People's Republic of China and made a series of correct judgments on economic development. He is not only outstanding in ability, but also quite left-leaning in politics. There are rumors that if he were not so left-leaning, he would be the Premier of the Hu Jintao era.\n\nFor such a loyal, firm and capable old comrade, we should re-appoint him."
  prcs.25.a: "A thousand ships pass by the sunken boat, and a thousand trees bloom in front of the dead tree"

  prcs.26.t: "New institutions..."
  prcs.26.d: "In order to adapt to the new international changes and the form of domestic party building reform, the Political Bureau has authorized the establishment of an independent diplomatic department, the People's Committee of Foreign Affairs, which aims to analyze the international situation, adjust the diplomatic policy of the diplomatic department and give corresponding suggestions.\n\nSome old comrades and former members of the Ministry of Foreign Affairs will join it, but the appointment of the position of chairman of the committee is related to the future diplomatic direction. We should make a careful choice.\n\nThe candidate proposed by the Political Bureau is Comrade Le Yucheng. He represents the conservative and harmonious diplomatic trend within the party. He still supports the concept of peaceful development and opposes the concept of imperialist diplomacy. This moderate concept can help us win more trading partners, but it also limits our assistance to revolutionary brother countries.\n\nAnother candidate is Comrade Mao Yuanxin, a veteran revolutionary. He represents the radicals within the party. Although he is old, his revolutionary heart is still enthusiastic. Choosing Comrade Mao Yuanxin can greatly ease the differences in left-wing ideology within the camp, and we can also let go of exporting revolution.\n\nNow, after careful consideration, General Secretary Hu cast a key vote."
  prcs.26.a: "Let us influence the world through peaceful policies"
  prcs.26.b: "Internationale Scheherazade must be realized"

  prcs.27.t: "Reorganization of the National Development and Reform Commission"
  prcs.27.d: "The functions of the former National Development and Reform Commission have changed, and the original personnel should also begin to change. On the road to the automated planned economy, we need a candidate who is familiar with both science and technology and politics and supports the left. And it happens that a local official has all three and supports our cause.\n\nComrade Yuan Jiajun, who comes from the aerospace department, is also a disciple of the old revolutionary Comrade Qian Xuesen. He not only supports the development of high-tech, but also inherits his teacher's loyalty to socialism and the proletariat. Therefore, we will let Comrade Yuan Jiajun be responsible for the reorganization of the National Development and Reform Commission and the reconstruction of the State Planning Commission."
  prcs.27.a: "It's time for some fresh air"

  prcs.28.t: "Return a favor"
  prcs.28.d: "It can be said that Wang Huning, an evergreen in the political arena, has survived for so many years by choosing the right dish for the right dish. His theoretical construction level is rare in the world, and his political vision is unique, so he can make the right choice every time he faces major issues.\n\nWhen Hu Chunhua announced him as the new Secretary of the Political and Legal Affairs Commission at the meeting, he was shocked but also understood: this was the return of favors from the new left. Obviously, although he and the new left have different political views, they still extended an olive branch to him, intending to win over the original "establishment left".\n\nAfter the meeting, Hu Chunhua stretched out his hand, smiled kindly and said: "Although we have different political views, we still have to be united, Comrade Huning."\n\nWang Huning hurriedly shook Hu Chunhua's hand, bowed his head slightly and said: "Maintaining the unity of the party is the life of the party, and we insist on implementing the resolutions of the Party Central Committee. ""
  prcs.28.a: "United...for now"
  
  prcs.29.t: "New agency, new faces..."
  prcs.29.d: "With the end of the Taiwan Strait War, the domestic situation has undergone new changes. The class struggle that was temporarily shelved in the past should be picked up again at this moment. In order to cope with the increasingly complex domestic struggle, the central government authorized the establishment of a new security agency. The organization will draw elites from the Public Security Bureau, the Central Commission for Discipline Inspection, the local municipal supervision committee, the Organization Department, and the Ministry of Economy, and coordinate with various departments and commissions to cooperate with the party organization's layout for economic reforms."
  prcs.29.a: "Let's put on our velvet gloves."
  prcs.29.b: "It is easy for a country to support an enterprise, and it is not difficult to bring it down."
  prcs.30.t: "Footnotes of History (Part 1)"
  prcs.30.d: ""Unblock! Unblock!"\nAfter a busy day, Chen Tinglan was leaning on the back of the sofa to rest. The sound waves, one higher than the other, broke into her dream like an iron horse and an ice river. With a violent throbbing of her heart, she opened her eyes and almost jumped up from the sofa as if she was electrocuted: "What happened! ?"\n"Secretary, outside the door, the whole street is protesting!" The secretary took the signature pen from his chest in panic. He was trembling with heart and hands, and the pen cap slipped from his fingers accidentally. It rolled several times on the floor piled with various materials and reports, and disappeared in an unknown corner.\nChen Tinglan pulled open the curtains, pulled down the window bolt, and pushed open the window. The dull and bleak spring breeze in the evening and the shouts of people rushed into the house, driving away the last trace of sleepiness in Chen Tinglan's mind.\n"Increase the supply of materials!" "Fully resume work and school! "On the bright red slogans and posters, people have clearly stated their needs. The police and armed police are sweating to maintain order. They hold riot batons and shields, but no superior will order the suppression of such a peaceful march.\nChen Tinglan sighed: "This day has finally come..."\n"Secretary, what should we do?" The secretary took two steps forward and asked anxiously. "Should we send basic living supplies to Xuhui District..."\n"Yes, not only should we send them, but we should also send them well." Chen Tinglan turned his head and looked at the young cadre. "Comrade Xiao Zhang, I have only been transferred here for a short time. I am considered a frontline cadre who came to put out fires. You will not act like a local snake just because I am a new strong dragon, right?"\n"How could it be, how could it be!" The secretary stood at attention suddenly. "Secretary, now we all listen to you. At this time of national crisis, we..."\n"We are now grasshoppers on the same rope.""
  prcs.30.a: "“The people above and below share the same aspirations and stand together through thick and thin.”"
  prcs.31.t: "A ray of hope (I)"
  prcs.31.d: "Chen Mingyuan rubbed his sore eyes. The sky outside the office window had completely darkened. As the youngest deputy director of the Jiaxing Development and Reform Commission, he has been working for nearly three months with almost no days off since the outbreak of the American Civil War triggered the global financial crisis.\n"Mingyuan, are you still working overtime?" Minister Liu of the Municipal Party Committee Organization Department pushed the door open with a cup of hot tea in his hand.\n"Hello, Minister Liu, aren't you dealing with the Caojing Industrial Park? The orders caused by the American Civil War have fallen sharply, and at least one-third of the factories in the park are facing the risk of bankruptcy." Chen Mingyuan pointed to the data table on the computer screen and said, the red numbers in the table were shocking.\n"Our dependence on foreign trade is too high. The impact of this American Civil War is more serious than the financial crisis in 2008." Minister Liu sighed and put the hot tea in front of Chen Mingyuan, "Drink some tea, don't get tired. "\nChen Mingyuan nodded gratefully, but did not drink the tea immediately. He stood up and walked to the industrial distribution map of Jiaxing City hanging on the wall of the office.\n"Minister Liu, several colleagues and I have studied it for a week and feel that this crisis is actually an opportunity." He pointed to the dense factory marks on the map and said, "Although our GDP has grown rapidly in recent years, it is actually export growth in exchange for cheap labor and resource consumption. The actual income of the people has not grown synchronously."\nMinister Liu was a little surprised at the young man's outspokenness, but he motioned Chen Mingyuan to continue.\n"The American Civil War caused a cliff drop in orders, but the demand in the domestic market has actually been there. Our problem is that we have not established an effective domestic production and consumption circulation system." Chen Mingyuan took out a handwritten plan from the drawer, "We can take this opportunity to promote the transformation of the industrial structure."\nMinister Liu took the plan and read it carefully. "The core idea of ​​this plan is to organize enterprises that originally relied on exports and adjust production according to domestic market demand. The government does not simply provide subsidies, but takes the lead in establishing an 'industrial mutual aid consortium' to coordinate resource allocation and production plans. "Chen Mingyuan explained. \n"Does this sound a bit like a planned economy?" Minister Liu looked up and asked. \nChen Mingyuan shook his head: "Not exactly. This is a special form of organization in times of crisis, which retains the flexibility of the market mechanism but increases the government's macro-control efforts. The most important thing is that we must put the basic living needs of the people first, not market profits. ""
  prcs.31.a: "We'll see..."
  prcs.32.t: "Public Opinion Choices in Crisis"
  prcs.32.d: "As the global financial turmoil brought about by the American Civil War continued to worsen, the Central Propaganda Department jointly held a meeting on public opinion guidance. The core topic of the meeting was only one: how to guide the domestic public opinion field during the special period of implementing strengthened macroeconomic regulation and some planned economic measures.\nIn the conference room, two obviously different voices clashed.\nSome government representatives firmly stated: "Under the current situation, public opinion unification is the key to responding to the crisis. We need to focus on promoting the necessity and effectiveness of government regulation measures, reduce discussions on the slowdown of market-oriented reforms, and create a good public opinion environment for policy implementation."\nHowever, some think tanks and media representatives held a different view: "During the crisis, open discussions should be encouraged to gather wisdom from all parties. Excessive control of public opinion may lead to policy mistakes not being corrected in time, which is not conducive to the scientific decision-making of the government."\nAfter several days of meetings, the General Office of the Central Committee issued the "Guiding Opinions on Strengthening Public Opinion Work during Crisis Periods", which mentioned the main work direction of the media at present——"
  prcs.32.a: "Unify public opinion and strengthen the people's consensus on the necessity of reform."
  prcs.32.b: "Open up discussion, gather social perspectives and ensure effective implementation of reforms."
  prcs.33.t: "Reexamination of the Economic Development Model"
  prcs.33.d: "As global financial markets gradually return to order and the domestic economic situation stabilizes, China's State Council convened a key economic situation analysis meeting. The core topic of the meeting was only one: whether to continue the government's macroeconomic regulation model strengthened during the economic crisis response. \nIn the meeting room, two completely different voices clashed. \nThe representative of the National Development and Reform Commission firmly stated: "The regulatory system and planned economic elements established during the crisis have successfully stabilized people's livelihood and employment. These mechanisms should be retained and improved. The international situation is not yet completely clear, and we need to maintain macroeconomic control over key industries and resources. "\nHowever, representatives of the economic community and some ministries and commissions hold a different view: "Strengthening regulation is an expedient measure to deal with the crisis, and it should be withdrawn in an orderly manner as the crisis ends. Over-reliance on government regulation will suppress market vitality and affect long-term economic growth potential. "\nAfter several days of meetings, the State Council issued the "Decision on Optimizing the Economic Governance System", the most eye-catching content of which is: "
  prcs.33.a: "Strengthen the national strategic control system and ensure economic security and resilience."
  prcs.33.b: "Give full play to the role of the market and stimulate the vitality of micro-entities."
  prcs.34.t: "Getting through the most difficult moments of the economic crisis"
  prcs.34.d: "Xiaoya pressed her face against the cold window glass and drew mist with her fingers. It was gray outside, just like her father's face. For several months, the house was always quiet. Mom and Dad no longer smiled and watched interesting short videos for her as before. Instead, they often frowned at the mobile phone screen or TV news, whispering words she didn't understand, such as "economy", "crisis" and "unemployment".\nShe hadn't had the bubble milk tea from the store downstairs for a long time. The note "temporarily closed" on the door of the store had faded a little. The park that she had promised to take her to before had become "wait until later". Even the sound of her mother telling her stories before going to bed at night seemed to be less energetic. She secretly heard her mother and grandma say during a video call: "... Save as much as you can, you don't know if your job is stable..."\nAlthough Xiaoya is still young, she can feel the worries of adults. She noticed that there were fewer and fewer snacks in the refrigerator, and her father no longer bought those "unnecessary" things online, and even the cake she usually had on her birthday was "forgotten". Once, she heard several classmates at school After talking about her parents being "laid off", she secretly looked up the term after returning home, and she felt like she had overturned a five-flavor bottle in her heart. Since then, she has learned not to clamor for new toys, and even pretends to forget that she wanted to drink milk tea. Xiaoya felt empty inside, but she didn't dare to ask too much, for fear of making her parents more worried. \nBut today, something seemed different. \nAfter returning home from school in the afternoon, Xiaoya was surprised to find that the pink sign of the milk tea shop downstairs was actually lit! Several older brothers and sisters in school uniforms were standing at the door, holding milk tea and talking and laughing. , the sound of the straw piercing the cup lid was "puff", very crisp. She hurried upstairs and saw her father busy in front of the computer for the first time in a long time, with the corners of his mouth slightly curled up. Mom was preparing dinner in the kitchen, humming the song she often listened to for the first time. \nXiaoya stood at the door, her heart beating faster. She noticed that the atmosphere at home was different, like the first ray of spring sunshine shining into the gloomy room. She was not sure what it meant, but she felt hopeful, just like in the fairy tales her teacher had told her, winter would always pass. \n"Mom! The milk tea shop downstairs is open!" Xiaoya shouted excitedly, with the cautiousness accumulated over the past few months hidden in her voice. \nMom turned around and smiled: "Really? Then when you finish your homework, Mom will order you a cup, okay? "\nXiaoya nodded vigorously, her eyes lit up. She wanted to ask her father if he had found a new job, why her mother was so happy today, and what those "stability" and "plan" meant, but she just hugged her mother tightly. She still didn't quite understand what those adult words meant, but she felt that the stuffy atmosphere at home seemed to be brightened by the lights of the milk tea shop downstairs.\nBefore going to bed at night, she secretly heard her father talking about "new government policies" and "job guarantees" on the phone, and his tone was much more relaxed than before. Xiaoya smiled secretly and fell asleep sweetly."
  prcs.34.a: "Perhaps the park of "Let's talk about it later" is not too far away?"
  prcs.35.t: "Footnotes of History (Part 2)"
  prcs.35.d: "Chen Tinglan leaned on the balcony with her arms, watching the demonstrators with interest - especially the bright red flags and portraits of Chairman Mao. The people are waking up, the people are speaking out, and the people are protecting their rights...\nChen Tinglan showed a happy smile at the corner of her mouth. She was pleased to see that the lovely working people were protecting their right to live.\n"In order to deceive the central government, the former secretary concealed the number of people infected and reduced the supply of materials, causing complaints from the people, and they could not get timely help when they had symptoms." Chen Tinglan looked at the secretary firmly. "We can't do this."\n"You mean..."\n"Tell the central government, tell the media, tell the public." Chen Tinglan shook her neatly permed short hair, put her hands behind her back, and stared out the window. "Tell them the truth, there is concealment and false reporting of the epidemic in Shanghai... Let's burst this bubble and fix it all."\n"But..."\n"We must have the courage to admit our mistakes before we can continue to make up for them. "Chen Tinglan turned and walked towards the door. "Also, you go open the door, I'm going to meet the demonstrators." \n"What?" \n"I'm going to meet them, we have to tell them that this is our country, this is the country of workers and peasants, your just demands have been heard, we will do our best to meet everyone's needs, and we will definitely get through it with unity." \nChen Tinglan walked down the stairs step by step, and the sound of singing the Internationale outside the door gradually became clearer and louder. \nPushing open the door, it was the demonstrators and the red flags that were walking in front of them. When Chen Tinglan and several cadres in suits and leather shoes appeared, the crowd was stunned, and the flowing crowd froze here in an instant. The people in the front row looked at each other, wondering what the secretary meant by his appearance at this time. \nChen Tinglan smiled slightly and walked quickly towards the crowd: "Comrade, give me a red flag." \nJust like all fairy tales, the crowd burst into huge cheers, and the singing of the Internationale became louder and louder, and there was a little more confidence in it. "
  prcs.35.a: "“Give me a red flag too!”"
  prcs.36.t: "Declaration of Victory of the Socialist Revolutionary War in Asia"
  prcs.36.d: "The Central Committee of the Communist Party of China, the Standing Committee of the National People's Congress of the People's Republic of China, the State Council of the People's Republic of China, the National Committee of the Chinese People's Political Consultative Conference, the Communist Party of China and the Central Military Commission of the People's Republic of China hereby announce to the whole Party, the whole army and the people of all ethnic groups in the country:\nThe war report sent by our World Liberation International Coalition shows that the last "Taijuo" imperialist army has laid down its arms and surrendered to our army. The "Taijuo" imperialist military group is dead in name only. The fascist imperialist war criminals who launched this war of aggression have all been arrested and executed, and will be tried and punished later.\nWith the authorization of the Central People's Government of the People's Republic of China, we hereby announce to the whole Party, the whole army and the people of all ethnic groups in the country that the Asian socialist revolutionary war has achieved a complete victory in all aspects.\n\nComrades! Fellow countrymen! Our brothers and sisters from all Asian countries who share life and death and fight side by side! All friends who pursue freedom and equality!\nToday is a day of extraordinary significance. Today is the victory day of the Asian Liberation War, the triumphant day of the revolutionary fighters, the liberation day of hundreds of millions of Asian compatriots, and the new birthday of the innocent people ruled by the "Taiya" imperialist reactionaries. But today is also the resting day of countless innocent people who died at the hands of imperialist fascism. \n Imperialism has committed numerous crimes since the first Portuguese colonial ship occupied Cochin, India. The Opium War, the Sino-Japanese War of Jiawu, the September 18th Incident, the Nanjing Massacre... The bamboo books in the Nanshan Mountains are full of crimes, and the waves of the East China Sea are full of evil. Countless heroic sons and daughters died in an untimely death. What echoes in our ears is the roar from countless sacrifices: Down with imperialism! The victory of this war is the result of the continuous struggle of the heroic people and is built on a blood debt. And now we can proudly announce: We have defeated imperialism! We will build a new China and a new Asia without war, violence, imperialism, colonial aggression, independence, prosperity and strength. "
  prcs.36.a: "From the beginning, the mountains are like the sea, and the setting sun is like blood."
  prcs.37.t: "Old Look"
  prcs.37.d: ""You know, while you are gaining benefits for the company, you are also laying the foundation for your own beautiful life..." The team leader in the office began to use his official language and PUA language again, and wanted to get a satisfactory answer from these new recruits - be loyal to the company and use them at will.\n"Leader, it's like this. I want to ask, I talked to HR before joining the company, but I still want to confirm with you whether there is an overtime culture in our company." A newcomer raised his hand and asked, interrupting the leader who was still talking. He obviously didn't expect that these newcomers would ask him questions in return. After being interrupted, it took him a while to react, "What did you say? Overtime? Ah, our company does have overtime now, but it's rare. "\n"You dare to say that, damn it. "You cursed a few times in your heart, but you haven't come to the point of standing up. After all, you are afraid of losing this job. In addition to the environment, it is more about your age. You can only look at the questions raised by these newcomers, and expose the reality of "human blood steamed buns" little by little. "Excuse me, can your company guarantee the rest time on statutory holidays and whether it has an overtime compensation mechanism?" "Does your company have corresponding medical compensation after employees are sick?" "If employees are in the company..." Each of the series of questions they raised hit the hearts of you old employees, so you also stopped what you were doing, and saw that the arrogant leader on weekdays also blushed and yelled. "It's not you who chose the company, but the company chose you! You are responsible for what you say!" His roar wanted to interrupt the newcomers' thoughts and let you old employees see the facts and who is the leader. "If the company chooses us, then we should also know more about our next work and colleagues, so isn't it for a better company for us to ask first? You are right, leader. "The newcomer was obviously not affected and said everything he thought, which made the leader confused and angry. He said a few words and asked everyone to go back to work.\n"Lao Liu, this is the smartest among the newcomers. You are the best old employee in our company. I will hand him over to you and let him get familiar with his work content as quickly as possible." After the leader sent you this message, he pushed a business card with a cute puppy head to you. You couldn't help but smile. After adding him as a friend, you took him to understand the work content and precautions, and also pulled him into various work groups and chat groups in the company. However, on the first day, the leader sent annoying messages in the work group.\n"Everyone stay today to hold a welcome party for the newcomers and complete the remaining tasks in one go."\nBefore you complained, the newcomers in the water group couldn't help but start discussing.\n"Why do we have to work overtime on the first day? What should we do?" "I don't know, but it doesn't look like a good thing."\n"It seems like they are using us as a shield. "You feel that these newcomers are so quick-witted, but after seeing the message sent by the newcomer you led, you feel a little confused.\n"Brother Liu, if there is nothing else tonight, I will go back first."\n"Nothing else, won't you stay for a welcome dinner tonight?"\n"No need, I'll go home to eat, there are people waiting for me at home."\nThis sentence touched your heart at once. Indeed, why don't you go home to eat, but stay in the company? It seems that going home has become a rest point, not a choice.\nYou have never been so shaken in your heart, but you still want to see other people's reactions before making a decision, so you raised your head and looked around at your workstation, and found that the old colleagues who were assigned to the newcomers were the same as you. They couldn't help but laugh together, chatted a few words in the water group, and expressed their position-this year, you don't plan to spoil him.\n"Leader, I have something tonight, I have to go home. ""
  prcs.37.a: "It seems like a dream, but I can't tell the difference between dream and reality"
  prcs.38.t: "Dawn"
  prcs.38.d: "After spending a few months in the company, the newcomers handed in their own answers in their respective positions: According to statistics, the company's revenue increased by 5% in the first quarter after the newcomers joined the company, achieving a huge breakthrough. This also attracted the attention of the general manager. In order to let other departments and branches learn advanced experience, a group of study groups will be organized in the group to come and study in a few days.\n"You guys, when the time comes, I'll beg you to beg me, don't tell them about our company's overtime situation." Through the voice coming from the crack of the leader's office door, you unconsciously stopped and listened to the leader's persuasion to this group of newcomers.\n"But leader, this thing has already happened. Although we accepted overtime, we were also given the next vacation and compensation." Wait, haven't I been working overtime with them for the past few months? Why don't I have these things? The previous anger sprouted again.\n"I know, I know, but I hope you don't tell them that we achieved our results by working overtime and extending working hours. "It can be heard that the leaders are scared after these months of getting along. These guys not only have the skills, but also understand the law and how to use them.\nSeeing that the communication was fruitless, the leader finally had no choice, "Well, you guys can take a rest when the time comes, and let the old employees take charge of this event." Then he asked them to leave the office, and you took the opportunity to return to your workstation, followed by a message of "approval" from the leader.\n"Lao Liu, the headquarters will organize a study group to study with us in a few days. When the time comes, you can take those old employees to sort out our recent achievements. Remember, this time it concerns the status of our company, and we can't be careless. ”\nYou wanted to ask something else, but the long mechanical reply has helped you make a choice - "Received".\nYou slumped in your chair and thought about the things that have happened in the past few months. The small cards of encouragement posted by the newcomers on the door, the small plants raised in the office area, not to mention the smiles on their faces, made you feel warm and determined to write them into the report you compiled. Just as you were busy, the newcomer sent you a message.\n"Brother Liu, why don't you let us tell the headquarters when we already have overtime."\n"It should be for the company..." Before you sent this sentence, you quickly withdrew it and sent a new sentence "It should be for your good."\n"But I think it would be better to explain the situation, otherwise only we will have overtime benefits, which will cause confrontation between new and old employees."\n"It's okay, just suffer a little, and you will be able to get through it soon."\n"I don't think so, Brother Liu."\n"Then what do you plan to do. "After that, you no longer hear from him, and your feelings grow deeper and deeper."
  prcs.38.a: "I really don't know what these kids are going to do."
  prcs.39.t: "New Look"
  prcs.39.d: ""When the time comes, I hope your advanced experience can help other companies in the group grow." The leader of the study group shook hands with you at the farewell party to express celebration and praise.\n"No... Actually, in the final analysis..." You scratched the back of your head, and when you wanted to tell the real reason, you retracted your words,\n"In fact, it was the group of newcomers who injected new vitality into our company."\n"Oh, is that so? It sounds interesting. Tell me more about it." The leader looked at you with interest. After all, these were not written down in the report.\nYou told him some things that the newcomers had never tried at work, and even gestured with your hands when you talked about things that made you happy, but you didn't notice that your eyes were shining when you talked about these people.\n"After listening to you say so much, I have become curious about these young people. Can I meet them? "You did not refuse the team leader's request. After confirming that they were all free, you dialed their video calls.\n"Brother Liu, I heard that the team leader was looking for me..."\n"Sir Liu, our time is precious... Well, I see..."\n"Want to know about our business? I just need to do what I should do well..."\nEvery time you dialed a person's video, the team leader liked this group of newcomers more and more. Finally, you dialed the last one, which is also your favorite newcomer's video call.\n"Hello, Brother Liu, ah, is this the team leader, hello, hello."\n"Don't be too nervous, I just can't stop listening to your brother Liu talking about you, so I'm curious about what magic you have."\n"Oh, it's such a team leader. Although our performance may make everyone shine, Brother Liu and his people still pay more, not to mention that they have not received overtime and vacation compensation."\n"What did you say? Overtime? I remember that the group decided to solve these problems not long ago. Lao Liu, tell me the truth, have you worked overtime? "\nYou didn't expect this kid to bring up this question at this time. Your head was dizzy, and you wanted to answer no instinctively, but then you bit your lip and nodded.\nYou told him about the unfair treatment you had received in the past few years without reservation. You didn't expect the team leader to help you, but after listening to what you said, he patted your shoulder gently, expressing his hard work. He also reported to the higher-ups that the abolition of overtime had not been implemented.\nThe learning exchange meeting ended quickly, but the problems you and the newcomers reported were obviously The headquarters took it seriously. A few days later, the headquarters sent an investigation team to check whether the employees' working and overtime hours violated the regulations, and also asked each employee whether there was a serious overtime situation. \nAt the subsequent group meeting, the investigation team first confirmed that the situation was true, and then started a "anti-overtime culture" reporting activity. The group also returned the various compensations owed to you in various welfare measures. Although you think the compensation is no longer important, you still left a thank you message on the young man's WeChat. "
  prcs.39.a: "I wish you the best and hope you get better and better"

  prcs.40.t: "A New Interpretation of "National Studies""
  prcs.40.d: "Wei Le pushed up her glasses and said to the sleepy class, "I know that many of you have become physically uncomfortable with the things like the dilemma of loyalty and filial piety, Guo Ju burying his son, and today I will tell you about my understanding of Chinese studies."\nShe turned around and wrote a poem on the blackboard. Someone recognized it at a glance. It was "There is a Dead Deer in the Wild" in the Book of Songs. There was a burst of chuckles from the audience, and a slight voice: "Old Wei is also sexually repressed."\nThe corners of her mouth curled up: "Many of you are open-minded and know a lot of knowledge. Kollontai would be stunned in private. But when it comes to emotional needs, you become moralists. The unrestrained songs of our ancestors have become harsh in your ears. This is actually the steel stamp that those pseudo-Chinese studies have branded on your thoughts. How sad. "\nThese words rang out in the classroom like thunder. The smiles on some students' faces froze, some snorted contemptuously, and more looked at Guo Shaohua with resentment, wanting to hear what this "old witch" had to say.\nSeeing that everyone was looking over, Guo Shaohua smiled and began to talk nonstop: "The people of the pre-Qin period always bravely pursued beautiful feelings. Since the birth of Chinese civilization, there have been seeds of humanistic liberation. The free combination of men and women and equal status have been handed down from ancient times. Our people regard them as treasures and write them into the ballad era. "\n"Tang Wu's revolution liberated Chinese civilization from the rut of witchcraft, allowing people to commemorate their own exchanges and pursue the continuation of life from generation to generation. The so-called family is wrapped in the Chinese people's eternal pursuit of life. We are not here to create people, but life itself. "\n"Then, King Chen and others bravely rose up and swore with the roar of "Kings, princes, generals, and ministers, are you a kind of people?" that the lower class people of China are equal to the kings, princes, generals, and ministers, and there is no essential difference. They are human beings, they neither obey the heaven nor inherit destiny, and it is only by chance that they become rulers. "\n"These are the essence of our national studies." Wei Le finished speaking, then took a deep breath and continued to talk endlessly.\n"However, when we entered the feudal era, those intellectuals who surrendered to the kings, princes, generals, and ministers, they compiled the so-called Neo-Confucianism, the so-called preservation of heaven's principles and elimination of human desires, denied the most basic emotional needs and life pursuits of the people, but they spent their days in wine and women, and did all kinds of evil. "\n"The literati raised by the kings, princes, generals, and ministers maliciously refused to record the true feelings of the people, causing the people's precious native culture to be forgotten and destroyed. The long feudal era has trampled on the people for thousands of years, making us forget how to seek the eternity of life. Let us forget the roar of kings, princes, generals and ministers. "\n"After thousands of years, what can you remember when you mention Chinese studies? Nothing but the Three Bonds and Five Constant Virtues, nothing but etiquette, filial piety, integrity and shame, nothing but the morality of master and slave. The only thing is that there is no pursuit of beauty and life. Maybe there is still love, and there are still dreams of the Red Mansion and a song of the West Chamber, but now, love and lovers are just synonyms for lust. "\nWei Le had tears in her eyes and looked a little gloomy. But she mustered up the courage to say this: "
  prcs.40.a: "“Our national studies need to return to their origins, to their original intentions, and more importantly, to our people. ”"
  prc_change.1.t: "Li Keqiang passed away"
  prc_change.1.d: "Today, a breaking news shocked the whole of China: Li Keqiang, a member of the Standing Committee of the Political Bureau of the Communist Party of China and the Premier of the State Council, who was less than 70 years old at the time, died of a sudden heart attack in Beijing. This is extremely unbelievable for the leaders of the Communist Party of China who generally have good medical insurance.\n\nIt is reported that Li Keqiang had worked for many days to deal with the sudden oil crisis and the previous outbreak of the new crown epidemic. After Li fell into a coma, the medical team immediately launched a rescue, but in the end it was still powerless. In the official unified caliber, this tragedy was caused by Premier Li's long-term and high-intensity work.\n\nLi's death is undoubtedly a symbol, symbolizing that China's administrative machine can no longer continue under high-load operation. Obviously, a storm will sweep across China with the death of the head of government."
  prc_change.1.a: "Winter is coming..."
  prc_change.2.t: "Interview - Up"
  prc_change.2.d: "In the courtyard of Longdong County Party Committee, where the morning mist had not yet dissipated, dewdrops condensed on the new buds of the old locust tree. In the reception room of the county party committee, the faded wooden long table was polished to a shine, the plastic thermos was steaming, and the slogan "Seek truth from facts" in Fangsong font on the wall was faintly golden in the morning light.\n\n"Here we come!" Someone shouted. Three black cars drove to the gate of the courtyard. The door of the leading Red Flag car opened, and Hu Chunhua, wearing a navy blue suit, walked steadily. He waved to the crowd, and the Shanghai watch on his wrist flashed in the morning light.\n"Comrades, I've been waiting for a long time!" The thick Hubei accent echoed under the eaves, "Today we won't read the manuscript, but just chat about family matters. "He sat down at the head of the long table, took out a fountain pen from his suit pocket, and spread out his blue notebook on the polished tabletop.\n\nZhang Degui, a large cattle farmer, stood up, rubbing his cracked palms: "Report to the chief, our cooperative has 300 cows..." "Don't report." Hu Chunhua interrupted with a smile, "Just call me old comrade. Comrade, sit down and talk slowly."\n\nOld Zhang's dark face flushed: "Feed prices have risen sharply, and silage pits are not enough..." The pen tip rustled as it moved on the paper. "Experts from the Provincial Academy of Agricultural Sciences will be stationed here next week." Hu Chunhua turned to the accompanying cadres and said, "Agricultural machinery subsidies should be tilted towards breeders. "\n\nA sigh suddenly came from the corner. Hu Chunhua looked at a teacher sitting in the corner. He was absent-minded and dazed. Looking out the window, Hu Chunhua stood up and walked over, patted the teacher on the shoulder, and he woke up as if from a dream, "Little comrade, you are the teacher representative of the county here, why are you sighing?" "Prime Minister Hu, our county is short of teachers and teaching aids, but it has not been approved." After the teacher representative answered, he looked at Hu Chunhua with expectation. Hu Chunhua nodded, "After a while, the province will support you. If it doesn't come, you can call the province. This matter will definitely be put on hold."\n\nSeeing that the problem could really be solved, the worker representative Wang Jianguo stood up and was about to speak, Hu Chunhua suddenly asked: "Old comrade, the calluses on your hands are probably caused by the lathe, right?" Amidst the laughter of the whole room, the old worker raised his calloused hands: "Our county technical school is short of CNC machine tools..." "Okay! "The chief slammed the table and said, "The province will allocate 20 new equipment next month, and will also build a technician training base!"
  prc_change.2.a: "Next page"
  prc_change.3.t: "Interview - Next"
  prc_change.3.d: "As the sun rose higher, the shadow of the old locust tree shrank into a small ball. When the village party secretary Zhou Weidong held the account book to report the poverty alleviation results, Hu Chunhua suddenly stretched out his hand: "Let me see." He adjusted his reading glasses and his fingertips ran over the dense numbers: "Comrade Weidong, the money for repairing the canal in the account..." "It was specially approved by the province!" Zhou Weidong stood up anxiously. "Don't panic," Hu Chunhua smiled, "I mean we should add another 300,000 to repair the branch canal." When the noon bell rang, the leader tore a page of paper from his notebook: "This is my phone number. If you encounter difficulties, come to me directly." He turned and looked at the party emblem and national flag on the wall. "Back in Yan'an, Chairman Mao said, 'We Communists are like seeds.' Now these seeds must take root and sprout in the soil of the new era! ”\n\nBefore leaving, Hu Chunhua put a fountain pen into the hands of student representative Zeng Haoran: "Baby, you have to study hard and write better articles than us." When the motorcade drove out of the county party committee gate, tens of thousands of people had already been waiting along the street. The sun pierced through the clouds, and the party emblem on Hu Chunhua's chest shone brightly in the spring breeze.\nThe new branches of the old locust tree stretched in the wind, and next to the faded "Serve the People" slogan, the newly installed electronic screen was scrolling the red words "Comprehensively Promote Rural Revitalization."
  prc_change.3.a: "...working completely for the benefit of the people."
  prc_change.4.t: "Planning"
  prc_change.4.d: "Hu Chunhua looked around, and several faces were uncertain under the dim light. He cleared his throat, and the whispers around him disappeared instantly, waiting quietly for him to speak.\n\n"Everyone has seen it during this investigation." Hu Chunhua said, "The unemployment phenomenon outside is very serious, and it is almost threatening the social order."\n\nEveryone nodded silently. Everyone knows the impact of the epidemic on exports: the foreign situation has fallen into extreme chaos, and large numbers of foreign trade orders have become empty words. Many small factory owners woke up and found that the heads of foreign companies they had contacted with were either missing or in the morgue. The once prosperous Yiwu is now full of mourning, with companies with broken capital chains and workers who have been owed wages everywhere. The government is racking its brains to arrange the lives and work of these people, but it is undoubtedly a drop in the bucket in today's economic downturn.\n\n"We may be able to provide relief to these workers in a short period of time, but it will not last long. "Someone said, "There are only two solutions. One is to wait for the foreign countries to gradually stabilize and foreign trade to naturally recover..." He was interrupted: "Looking at the current international situation, is it still possible to stabilize?" This statement aroused a voice of agreement.\n\nHu Chunhua smiled bitterly: "Then we only have one way." He didn't say what it was, but everyone present knew it well. They nodded one after another, and their eyes became firm. Under the dim light, a plan was emerging..."
  prc_change.4.a: "The storm is coming."
  prc_change.5.t: "United Front"
  prc_change.5.d: "Looking at the sunset outside the window, Hu Chunhua thought deeply for a long time. In his office, the heads of several key ministries had been sitting around for a long time. "Comrades," he said softly, "the current situation is clear to everyone." \n\n"The old leftists have been calling for reforms in recent years, and there are more and more new leftists among intellectuals." An official said, "They all oppose the current unfair distribution." \n\n"And those grassroots cadres," another added, "many people miss the spirit of serving the people in the past. Even in the army, there are many comrades who support change." \n\nHu Chunhua nodded: "It's time to unite these forces. We need a new united front to prepare for the coming changes." \n\n"But be careful," an old comrade reminded, "We must grasp the scale and not let the situation get out of control." \n\n"I understand," Hu Chunhua stood up, "This is a necessary change, for the people and for the survival of the party. ""
  prc_change.5.a: "Hearts turn north"
  prc_change.6.t: "A speck of dust in the era"
  prc_change.6.d: "In the market, Xiao Chen took the last two eggs from the paper box, his mind in a mess. He opened WeChat and checked his balance. After deducting the necessary expenses, he only had 32 yuan left this month. His wife was at home in confinement after childbirth, and he lost his job three months ago. He used to have a monthly salary of over 10,000 yuan, but now he can only be frugal. Wearing a mask, he walked home with vegetables. Halfway through, he heard the sirens of police cars and the roar of the people on the next street. He didn't want to get involved, as his wife was still waiting for him at home.\n\n"Give me back my job!"\n\n"Give me back my salary!"\n\nThe sound of the horn echoed in the community, and he couldn't help but feel a little upset. He walked up the stairs and heard the sobbing of Sister Cui next door, and couldn't help thinking that she had also lost her job. He thought for no reason, "Maybe we are both wanderers in the world." But he couldn't provide more help. The powerlessness of government measures, the dying struggle of enterprises, and the free fall of the economy, he seemed to understand the neighbors who were marching outside."
  prc_change.6.a: "A mountain on an individual."
  prc_change.7.t: "The factory no longer roars..."
  prc_change.7.d: "Zhang Jianguo sat at his desk, holding a yellowed bill, looking at the latest People's Daily with a worried look on his face. The headline on the front page read "The Sixth Middle East War broke out, and Arab countries imposed an oil embargo." This mechanical processing factory, which had been struggling for nearly 30 years, was now struggling like a terminally ill patient. The workers' wages had been in arrears for almost three months; the remaining book funds were not even enough to pay for the materials. The loan from CCB was due next month. When the last old customer withdrew the order yesterday, he rubbed his hands and apologized, saying that the orders from the US market had been cut by 70%.\n\nHe sighed, recalling the ups and downs his factory had experienced: this factory had risen against the trend in the industrial winter of the Asia-Pacific financial crisis, and had also stood firm in the 2008 financial tsunami. But now, it has exhausted all its tricks and can't find a way out... Thinking of this, he gently slapped the bill in his hand on the table, and supported his head with his other hand. He smiled nervously."
  prc_change.7.a: " "This time it may really not be possible to continue." "
  prc_change.8.t: "2022 Chinese Communist Party General Secretary Election"
  prc_change.8.d: "The much-anticipated 20th National Congress of the Communist Party of China recently came to an end in Beijing. Delegates from all over the country have left Beijing one after another, but the magnificent and solemn Great Hall of the People has not turned off its crystal chandeliers. This political ceremony can only be officially declared over when the newly elected 20th Central Committee completes its first agenda and elects the party leaders.\n\nWait until the day of the press conference. Facing countless camera flashes and shutter sounds, the seven members of the Central Standing Committee, including the General Secretary of the Communist Party of China, walked on the red carpet and appeared to the world. Surprisingly, the former General Secretary Xi Jinping did not continue to be re-elected as speculated by countries around the world, but followed convention and gave up the throne of General Secretary to Hu Chunhua, the designated successor of the former leader of the Republic, Hu Jintao. Governments around the world cautiously congratulated Hu and waited with suspicion for the first step of the new leader, who was rumored to have close ties with the left wing of the Communist Party of China."
  prc_change.8.a: "The thousand-year-old iron tree is about to bloom."
  prc_change.9.t: "Preview"
  prc_change.9.d: "When he received the list of the presidium of the conference at the preparatory meeting, he immediately frowned again, then read it carefully several times, and even counted it silently in his mind, but repeated it several times, and the result was always the same. He raised his head and looked at the other members of the review team in the conference room.\n"This... uh, is this list okay? "His tone was the same as usual, without any change.\nThere was a moment of silence in the conference room. Everyone else in the conference room turned their heads away and didn't look at him. Only Wang Yang and the others looked around and glanced at him with a playful look.\nThe corners of his mouth twitched, and the piece of paper in his hand also trembled slightly. He glanced at the circle of people in the conference room. Except for the few guys who dared to look at him directly, the others just lowered their heads and didn't speak.\nHe nodded, let out a long breath, grinned, and gave Wang Yang a look with sparks in his eyes.\nFinally, Wang Yang spoke: "Comrade General Secretary, this list of the presidium was reviewed by us together, and there is no problem. There is no need to review it again. We have reviewed and passed it. "After saying that, Wang Yang lowered his head and raised the corners of his mouth.\nHe looked around the conference room for several times, and no one joined in. Everyone was just silent. The slogans in various mass incidents in various places, the remarks attacking him on the Internet, and even the violent incidents that openly attacked the entire country and the party, all made the conference table where he was now constantly up and down. Although he was an experienced old captain, how could such a ship survive such a storm? He couldn't help but tighten the neutral pen used for taking notes.\n"Since this is the decision made by this group now, I can't interfere." After a long silence, he finally spoke, but he looked around the conference room again: "The conference is a place for democratic decision-making. We will still make good decisions in a democratic way. Since we want to engage in intra-party democracy, we must do it well, right? "\nBefore waiting for others to agree, he raised his hand to stop these people, and then waved his hand."
  prc_change.9.a: "“The meeting is adjourned. We will see the result on the first day of the conference.”"
  prc_change.10.t: "In the rain and fog"
  prc_change.10.d: "The secretary was sitting in the passenger seat, holding his briefcase tightly. The Red Flag car was shuttling through the rainy streets of Beijing. When the car passed the intersection of Wangfujing Street, he looked over there. At this time, there were only a few people wandering around the crowded Wangfujing Street. He glanced back at the chairman sitting in the back seat. Chairman Xi just turned his head and stared at something outside the window, but there was only thick fog outside. His fingers repeatedly rubbed the cap of a pen, sometimes squeezing the pen tightly, and sometimes scratching it with his nails. Wiping the pen, he did not notice his secretary. \nThe secretary leaned back again. The fog on the street was so thick that he could not see the road ahead. He looked at the unfamiliar driver and suddenly had a strange thought: "He won't take the wrong road, will he?" But he did not speak. He remembered that in the past, when the Commission for Discipline Inspection held a meeting, a group of people did not speak, but just stared at him silently. The secretary felt very thirsty, very thirsty, but he had just drunk water. \nAfter a long time, Xi Jinping spoke, still in that unhurried voice: "Where are Wang Yang and his gang?" \n"Report to the General Secretary, they are still on the way, there may be a traffic jam." The secretary was startled, but immediately answered. \nXi Jinping smiled contemptuously, and asked in that unhurried voice, "Where is Comrade Hu Chunhua?" \n"They said they are almost there, General Secretary." \n"I know." Xi paused, "Then where is Comrade Hu Ning?" \n"He is inspecting the preparations for the venue with other people in the General Office." \n"Not bad. You should take a rest first, lie down for a while, don't be too nervous. Don't be nervous, you will perform well later. "Xi said in an encouraging tone.\n"Thank you for your concern, General Secretary. I will do my best. "The secretary turned around and found that the chairman was no longer staring out the window, but put his hands in his pockets and looked straight ahead. The outlines of the towering monument and the memorial hall were barely visible in the rain and fog.\nThe secretary took a deep breath and lay down on the passenger seat. He was no longer interested in looking outside, it was just a piece of rain and fog. After a while, the car stopped steadily, and outside was a crowd of reporters and the solemn Great Hall.\nThe car door opened, and he still smiled confidently and kindly. "
  prc_change.10.a: "But only the secretary noticed that his hair had turned a lot greyer."
  prc_change.11.t: "Night Talk"
  prc_change.11.d: "They passed through the gate of the courtyard. The evening breeze blew over the lake, touching people's faces. The moon was hidden under the clouds.\nHu Chunhua had walked into this courtyard countless times, but it was the first time at such a late hour as today. After passing through several doors, they finally walked to the depths of the courtyard.\n"Comrade Chunhua, the General Secretary is waiting for you inside..." The secretary took him to one of the side rooms. Hu Chunhua took a deep breath, hesitated for a while, pushed open the door and walked in.\nThis reception room is not very large, and can only accommodate two or three seats. A rosewood coffee table is placed in the middle, on which are some tea sets and a porcelain plate with a few shaqi ma and glutinous rice noodles. Xi Jinping is sitting on the coffee table making tea, and no one else is inside.\n"Chunhua, don't be too restrained, sit down. "Xi Jinping still bowed his head and brewed the tea in his hand. Hu Chunhua hesitated a little, but still sat down slowly.\n"It has been difficult for so many years. The epidemic, the oil crisis, and the economic crisis are also pressing on our chests. "Xi Jinping brewed the tea and handed it to the opposite side, and Chunhua took it immediately.\n"With so many difficulties, it was under your leadership that we got through it..."\n"Without you, who else would give such great support?" Before Hu Chunhua finished speaking, Xi Jinping said this abruptly. A pair of sharp eyes stared at Hu Chunhua's face.\nHu Chunhua was stunned for a moment, but continued to speak: "The needs of the party are the needs of every party member. There is no support for party members. It is our responsibility to do things for the Party Central Committee. "\n"The greater the responsibility, the greater the ability; you know that our party is a place where talents are selected, and the greater the ability, the greater the burden to be carried. "\n"The general secretary is right, but our party is still a collective. No matter how big the burden is, it cannot be carried by one person. Everyone must work hard together, and no one will fall behind. Since everyone has contributed, then we should all share the benefits. "\n"Hehe..." Xi Jinping nodded, "A collective has a core, but it also needs a facade. If the facade is bad, it is still not good for the collective..."\n"General Secretary, we have tried our best. The black swan incident in the United States is such a big thing that it is rare to see in a century..."\n"Comrade Chunhua, don't be so modest." Xi Jinping sat upright and said seriously, "This is a very serious matter. Someone must be responsible for it, and there can only be one person."\n"You know, we are just born for the party, and we are always tied to the party. If we can't follow the will of the people, it will damage our party itself."\n"You helped me a lot in the past few years, and now the party has a new task for you." Xi Jinping finished speaking in one breath, looking directly at him, "This burden is heavy, can you bear it?"\nHu Chunhua pondered for a moment and said firmly: "
  prc_change.11.a: "“Thank you for the General Secretary’s trust.”"
  prc_change.12.t: "Some are happy, some are sad"
  prc_change.12.d: "When the list of election results was slowly read out, Wang Yang's smile gradually solidified and twisted, and the corners of his mouth that were about to open twisted together. The laughter got stuck in his throat and turned into an indistinguishable mutter.\nHe stared at the representatives with bloodshot eyes, and looked around with a trembling head, but he could not see anything, only darkness, and those teeth bared in the darkness.\n"Comrade Wang Yang, are you feeling unwell? "A faint voice came from the darkness.\n"No, it's not... impossible..."\n"This is the list we have collectively reviewed, there can't be any mistakes..." Wang Yang was about to speak, but this very familiar sentence blocked his mouth.\nSlowly, a person emerged from the darkness, a Hubei native, a man who became the governor at the age of 27, a man who stood out in this meeting, and a man with whom he had a close personal relationship. The man sighed, shook his head, covered his mouth with his hand, and moved his eyes to the other side. For the first time, Wang Yang felt a deep shame, a shame of being betrayed.\n"You...you guys...impossible, it's such a great opportunity...traitors..." He murmured, breathing heavily, dormant for many years, forbearing for many years, hiding his strength for many years, but today he was defeated and got nothing. He just felt a fire suddenly burning in his heart, burning his internal organs.\n"Comrade Wang Yang, the CPPCC is also a vast world, do a good job. "After a dizzy spell, Hu Chunhua shook him, patted his face gently, and fed him some water, which at least put out the fire in his stomach. He finally struggled out of the darkness, rubbed his eyes, and the world in front of him regained color. He no longer looked at his friend beside him, but looked at Chairman Xi standing on the rostrum."
  prc_change.12.a: "On the stage, Xi Jinping and Wang Yang looked at each other for a moment. The Chairman still had a deep gaze, but just smiled contemptuously."
  prc_change.13.t: "Carrying on the past and opening up the future"
  prc_change.13.d: ""Comrades, first of all, thank you all for coming together for this grand event," Xi Jinping walked to the podium and began to deliver his closing speech as the applause gradually died down: "Then, I also thank you all for your efforts and struggles over the past two years, which have enabled our country to finally defeat the epidemic, control the oil crisis, and stabilize the financial crisis. You have always united under the banner of the Party Central Committee, forged ahead courageously, and made great contributions and sacrifices. On behalf of the Party Central Committee, I would like to express my most sincere thanks to you. "After saying this, he bowed deeply to all the party members.\nAt this moment, the applause was thunderous.\nHe talked about many things: targeted poverty alleviation, rural revitalization, common prosperity, new development concepts, comprehensive deepening of reforms, the fight against the three major crises, and most importantly, the whole world has entered an era of great changes that have not been seen in a century due to the American Civil War.\n"On the other side of the ocean, the United States has accumulated social contradictions to an unprecedented level due to its long-term structural injustice in economic development and rigid political mechanisms. The Republicans and Democrats and the interest groups behind them have taken advantage of their internal social contradictions and launched a bloody civil war in order to realize their own political interests, dragging the American people into a dark era and greatly weakening the national strength of the United States. The American Civil War also reminds us all the time with bloody facts that we must comprehensively deepen reforms and must take people's livelihood and well-being as the foothold of economic construction. But the most important thing," he paused, and when everyone's eyes were focused on his face, he continued: "The most important thing is that our ruling party must always take unity and stability as the foundation of politics. Our party cannot lose its footing, and must always take maintaining basic social stability as the basic principle. "\n"In such a turbulent era, I am honored to fight side by side with you. But the party needs a new look. This is the requirement of the party, the people of the whole country, and the requirement of history. But no matter what team it is, no matter who leads it, we still have to stride forward with full courage and absolute confidence, not taking the wrong path, not taking the crooked path, not taking the old path, not fearing any difficulties and obstacles, for the great rejuvenation of the Chinese nation, for the Chinese people, and for the history of China, hand in a full score answer sheet. "\nAfter speaking, he put down the manuscript, raised his head, and said with a momentum that swallowed the mountains and rivers: "The road is long and obstructed, but no matter what, the Chinese nation must be liberated and China will prosper! "\nAll party members stood up at the same time, and the overwhelming voice rang out throughout the hall:"
  prc_change.13.a: "“The Chinese nation will be liberated and China will prosper!""
  Chihong.1.t: "Egg taste"
  Chihong.1.desc: "Park Wenxiu held his gun cautiously, crouched down and walked to a car at the entrance of the village, looked at the center of the village cautiously, and found that the center of the village was empty. There was no sound in the whole village, only the wind from the mountains was blowing. There was a faint smell in the air, and it was hard to tell what it was.\nAfter observing for a long time, the village was surprisingly quiet, without any human voice. Then Park Wenxiu called out to the back and whistled. Hearing the whistle, a PLA soldier emerged from the grass on the hill. He skillfully moved to Park Wenxiu's side. He whispered in Korean: "Are you sure it's safe here? Park Dongji? I didn't find too many devils up there." Park Wenxiu nodded and said, "No problem, Wu Chengren Dongji. I grew up here and I'm very familiar with it. My father occasionally comes home, and he doesn't see anyone on weekdays. The fat pig doesn't want to give us more wages. But my mother is very powerful. She not only feeds me, but also my twin sisters. "While Wu Chengren was muttering, he stood up and strode into the village.\nThe village is made up of a row of houses that form a circle. These houses surround the village square. In the center of the square grows a lush tree. Usually the villagers gather here, but the square is very deserted at this moment. There are footprints everywhere on the ground. Only a colorful ball can be seen rolling alone on the ground. Wu Chengren walked under the tree and found a row of children's shoes that girls would wear neatly placed under the tree. The smell seemed a little obvious, a bit like the smell of rotten eggs.\n"Wu Dongji, come to my house quickly and eat something, otherwise we will not be able to catch up with the troops, and then we will miss the time to fight the Japanese devils. "Park Wenxiu's voice came. He was already standing at the door of his house. Wu Chengren followed immediately. Park Wenxiu pushed the door open and walked in while calling his mother in Korean. But no one answered. So Park Wenxiu went to the side room and asked Wu Chengren to sit down first, and he went to see if there was anything to treat him. But when Wu Chengren walked into the living room, he found a dining table in the middle of the living room. The tatami mats were piled up together, and the table was There were several dirty dolls, the stains on them had dried for a while and were crawling with flies. The smell of rotten eggs in the air became stronger and stronger, and even a burnt smell could be smelled. \nPark Wenxiu came out of the wing room, holding a pot of still warm soup. He walked into the living room, muttering that his sister at home was really ignorant, while setting up the tatami. Then he asked Wu Chengren to sit down first, served the soup, and brought it to Wu Chengren. \n"My mother is the most diligent and cooking woman in this village. I like her broth the most. Today's soup is still hot, but it smells a little wrong..." Park Wenxiu suddenly found something wrong. He saw Wu Chengren's face pale and pointed to a piece of something in his bowl. \nPark Wenxiu took a look and saw that it was a piece of finger, slender and short, like a child's finger. "
  Chihong.1.a: "The smell of rotten eggs in the air is getting stronger and stronger."
  Chihong.2.t: "The violence continues"
  Chihong.2.desc: "Park Moon-soo ran like crazy towards the back hill, with Wu Seung-in following closely behind him. While running, Wu Seung-in seemed to catch a glimpse of something. He saw a pile of naked bodies lying in a mess next to a well in the backyard of a house. He immediately turned his head away. Park Moon-soo ran while shouting, "Follow me, follow me, I know where the folks are, I know! Wu Dong-ji, don't lose me!" "He pushed aside the branches like crazy, crossed the ditch in the mountain, and went down to the river. He didn't even notice that the reeds cut his face. Wu Chengren followed very hard. He wanted to vomit, but he couldn't.\nFinally, they ran to a cave covered by bushes. There were messy footprints in front of the cave. Fortunately, there were no military boots. So Park Wenxiu plucked up the courage and stuck his head into the cave. The sound of the bolt clicked immediately rang, and the bayonet was against his face. Wu Chengren followed closely behind, looking back from time to time.\n"Who! ?" This rude Korean language echoed in the cave.\n"It's me, Park Wenxiu, and I brought a PLA. "\n"Ah, Park Qinyong... and China Dongmu..." The leading guerrilla put down his gun.\n"My mother, is it okay?" Park Wenxiu asked anxiously.\nThe guerrilla suddenly turned his head to the side and didn't speak. "Are you okay...? "The guerrillas still did not speak, but just pulled Park Wenxiu to the depths of the cave.\nThe depths of the cave were crowded with all kinds of women and old people. When Park Wenxiu appeared, the crowd burst into a chaotic cry. "Wenxiu, poor baby..." "What a sin..." He walked towards the center of the crowd. The crying villagers took the initiative to make way for him. The dim flashlight gradually pointed to the "person" lying on the bed in the deepest part of the cave. The person's whole body was black, and a burnt stench came.\nAs soon as Park Wenxiu saw the person's face, he collapsed and knelt down, his voice began to tremble: "Mom..."\n"My son...my son...Mom's hand is broken, and I can't make soup..." Park Wenxiu's mother was burnt all over her body, and her clothes were torn into pieces. The pieces of cloth were strangely stuck to the wound, the ears were hard, the two lips had disappeared, and only the two eyes could move. \n"My son.....Mother is useless...Mother failed to save...sisters...Taeyo...those beasts...when they saw...your sisters...they wanted...then they were..." Park Wenxiu's mother couldn't say anything more, she couldn't go on. \n"Beasts...Wenxiu's mother was just protecting her two sisters, and was dragged to the backyard by Taiyo's soldiers, doused with gasoline, and burned to death...Wenxiu's two sisters also..." The guerrilla said this and began to sob. \nPark Wenxiu fell back to the ground, covering his ears with his hands. He felt a tearing headache. "
  Chihong.2.a: "Instantly, the sound of crying filled the entire cave."
  Chihong_2_tt: "§RLushun, Nanjing, Pyongyang...haven't changed at all...§!"
  Chihong.3.t: ""
  Chihong.3.desc: "Wu Chengren pulled Park Wenxiu up and shook his shoulders.\n"Park Dongji, we have to move. So many villagers are here, without food or medicine. We must do something, or find the troops and let them come to resettle the villagers. Cheer up, Auntie is just burned. If we can find antibiotics, we can save Auntie's life. If we can find a team, it would be even better. In any case, we can't stay here any longer. Move, Park Dongji!" As he spoke, Wu Chengren took out his gauze and carefully bandaged Park Wenxiu's mother. Then, he handed the coagulant, cardiotonic, antibacterial ointment and morphine to the guerrilla and explained the use of the medicine.\nPark Wenxiu took two deep breaths and stood up with gritted teeth.\n"Armani, Mom, hold on, your son will definitely come back. After the war, your son will cook for you. Your son will cook for you for the rest of his life. "After that, Park Wenxiu and Wu Chengren walked out of the cave together. Behind them, the villagers looked at them sadly, watching them plunge into the bushes and disappear in the reeds.\nThey walked towards the front line for several hours, occasionally hearing the whistling of missiles, the sound of tank engines, the sound of guns and fighter planes passing by, but these sounds collided with the mountain and disappeared immediately. In the distance, a few white cranes could be seen flying across the sky.\nThey didn't know how many villages they had passed. Those villages were either filled with smoldering ruins or filled with all kinds of corpses in the village square. When they approached those villages, men and women, young and old, were hanging on the telephone poles on both sides of the village roads. He They were all barefoot and were arranged from oldest to youngest. They saw a bloody baby body hanging upside down on a telephone pole. Various crooked words were written on their bodies in Japanese, and some of the bodies were written in Korean: "Red Element", "Disloyal Mob", "I Offended Democracy", "I Slandered Freedom". Wu Chengren finally couldn't help it and vomited violently. Park Wenxiu just gritted his teeth, didn't look at those things, and continued to move forward. \nWu Chengren saw that in front of a burning school, a little girl covered in blood was dragging a torn rooster doll, standing in front of the fire, motionless. \n"Little friend, I am a Chinese uncle. It's very dangerous here. Let's go quickly. "Wu Chengren pulled the little girl.\nThe little girl didn't move, and murmured something, but Wu Chengren didn't hear it clearly.\n"Armani... Armani..." The little girl raised her hand and pointed to the fire.\nWu Chengren smelled the stench again--"
  Chihong.3.a: "Wu Chengren smelled that stench again, that damn smell of burnt rotten eggs."
  Chihong_3_tt: "§RCommunists§! have become the §tnew Democratic Republicans§!, while the original §2Democratic Republicans§! have disappeared..."
  Chihong.4.t: "One Family"
  Chihong.4.desc: "They found a safe cellar for the little girl, where a lucky family who had not been caught hid. They left a little food and left in a hurry.\nOn the way, Park Wenxiu just pulled Wu Chengren faster and faster. They took a very rugged mountain path, which would lead them directly to a small market town in the area, where they might be able to find the medicine and food they needed. They ran desperately in the dark night, and the moonlight was already obscured by the black smoke rising from the horizon.\nFinally, at dawn, they finally arrived The small market town was only slightly larger than the previous villages, but Park Wenxiu told Wu Chengren with certainty that there must be medicine there. \nThey hid their guns and military uniforms and crawled all the way to the yard of a house outside the market town, and then they knocked on the locked door of the yard. But there was no sound from inside, so they continued to knock persistently, and suddenly a baby cried inside, but the baby's cry was immediately covered. \n"Fellow villagers, don't be afraid, I am the Korean People's Army, Park Wenxiu, and I also brought a Chinese Dongmu, we are good people. "\nPark Wenxiu said in a low voice. After waiting for a long time, he heard a heavy sigh from inside, and the locked door opened a little, revealing a bloodshot eye. The eye looked them up and down for a long time, and then the door opened a little wider, beckoning them to go in quickly.\nThey walked into the living room and saw a woman with shriveled breasts and a pale face sitting on a ball of dirty rotten cotton wool, trying her best to comfort the baby in her arms, but the baby sucked the nipple hard, but could only suck out blood.\n"What do you want?" A one-eyed old man looked at the two soldiers in front of him haggardly, and looked at them repeatedly for a long time, "Where are your guns? Forget it, tell me what you want, I don't have much at home. "\n"Old man, we just want to borrow your clothes. My Armani was burned by the Japanese with gasoline. I have to find some medicine for her here, but entering the market town in military uniform..." Park Wenxiu explained eagerly.\n"Do you know what you are doing?" The one-eyed old man stared at them fiercely, "I have lived for more than 80 years. I have seen Japanese devils, American devils and the second devils in the south. I have seen their methods too clearly. More than 80 years ago, just because my uncle accidentally bumped into a Japanese devil, he let his lackeys drag him naked into the ice and snow, wrapped him with a piece of iron sheet, and then peeled off the iron sheet an hour later. More than 80 years have passed, and they are still like this. "\n"The brutal nature of Japanese imperialists..." Park Wenxiu was about to continue.\n"Since you know this, why do you still come in openly? If you are followed by a large team, then we welcome you, but now there are only two of you. What if the devil finds out? "The one-eyed old man turned around and fumbled in his closet. \n"Come on, put it on, don't make trouble!" The one-eyed old man stuffed two civilian clothes into their hands, "Find the medicine as soon as possible, don't delay, your Armani is waiting for you, go!" \nBefore leaving, Wu Chengren quietly left a nut energy bar for the woman. The woman just stared at him blankly, without any expression, two tears running down her face."
  Chihong.4.a: "Silent hatred..."
  Chihong.5.t: "Withered Clinic"
  Chihong.5.desc: "After a while, they found the town clinic. The doctor in the clinic had disappeared. Only a dozen old and young women and children were left hiding in the clinic. They huddled in the drip room, motionless. Under the guidance of these refugees, Park Wenxiu and Wu Chengren found the medicines they needed. They left an IOU on the doctor's desk, stating what medicines they had taken, the unit number they were in, and stated that if they couldn't find them, they should go to the village committee to show the IOU. Just as they were about to retreat, a noisy sound came from outside the door. A chaotic Japanese song mixed with the roar of the engine rolled in from outside the town. The refugees were all in panic, and some of them were sobbing.\nPark Wenxiu immediately ordered the refugees to lie down, slowly crawl to the back door, and escape from there. Wu Chengren quietly lay on the windowsill to observe the situation.\nThose too The soldiers were obviously completely disorganized. Their uniforms and military caps were casually worn. One man wore a large military cap askew, and behind him was an officer dressed neatly, awkwardly. The Taiyue devils parked their cars in the town square and rushed into houses in groups of three or five. Wu Chengren saw several Taiyue people rushing into a house with lewd smiles, and then a half-grown girl ran away from the house. However, she fell to the ground after running a few steps when she was grabbed by the hair by the Taiyue soldiers who followed behind. Then they dragged the girl by the hair and dragged her to a place where they could not see her. The girl's heart-wrenching screams immediately disappeared in the lewd laughter, gunshots, screams, baby cries, and engine sounds. \nA dead body was tied to a Taiyue jeep. The body was stripped naked like the other bodies. There was a sign stuck on the body: "I am a lowly Xian person. "The jeep was circling the highway of the whole town in a show of strength. The driver drove the car recklessly over those who had just been pushed out of their homes and onto the street, humming an obscene song. He turned on the loudspeaker and started playing songs. Wu Chengren didn't hear the music played in the jeep clearly. It seemed to be a song from a girl band TV series he had seen before. The brisk tune was intertwined with the various "natural sounds" in the town. Several Taiyo soldiers ran out of the yard holding a baby. The desperate mother behind wanted to grab her child, but was grabbed by the waist and dragged into the house by the people behind. She struggled desperately to grab the door sill, so the Taiyo soldiers chopped off her entire palm.\nThen, several Taiyo soldiers saw the sign of the clinic from a distance, and began to scream strangely, holding their guns and rushing towards this side in a twisted posture. Wu Chengren cursed and rushed downstairs.\n"Park Dongji, run with the villagers! "Wu Chengren's face was distorted.\n"What about you?"\n"Don't worry about it!""
  Chihong.5.a: "Then, Wu Chengren rushed out of the clinic through the main entrance without looking back."
  Chihong_5_tt: "§R"I am not a hero, I just fight alongside heroes!" - Che Guevara§!"
  Chihong.6.t: "The End"
  Chihong.6.desc: "When Wu Chengren was a child, he watched many movies about the massacres committed by the Japanese devils. He never really imagined what kind of horror his ancestors had experienced at the hands of the Japanese, nor could he imagine what the Nanjing Massacre was like.\nHe still remembers that when he was in college, he flipped through the Bible when he had nothing to do. When he turned to the Book of Revelation or some chapter, the lost lamb asked Peter what the end of the world would be like. Peter did not reveal anything too much, but just jokingly said: "Go and see for yourself." "And Wu Chengren saw all this with his own eyes now.\nHe was pushed by those sloppy Japanese soldiers in front of the well-dressed man and the sloppily dressed man. The sloppily dressed man looked him up and down and smiled evilly. Then he tilted his head, and the clerk with a crooked military cap behind him walked over with a flattering look on his face. Without waiting for the well-dressed man to give an order, the clerk immediately put on a ferocious expression and slapped Wu Chengren in the face.\n"The lowest and most inferior Chinese have fallen into our hands today! "The clerk suddenly spoke in fluent Chinese, but Wu Chengren just smiled contemptuously.\n"Yeah, I saw your bitch mother a few days ago, just as you said, shitting like a dog on the street of Caishikou. Now you are also like your bitch mother, shitting in front of your wild father in a lowly way, wagging your tail and begging for mercy to the living beast who came from nowhere, am I right?" Wu Chengren stared at the clerk and smiled, "Anyway, a wild dog like you will only live for a few days. When our World Liberation International Coalition arrives, you will be a wild dog without a home... Oh, no, I'm afraid you won't live to see that day..."\n"Fuck your mother's stinky Chinese, kneel down for me!" The clerk suddenly became furious and punched Wu Chengren in the abdomen with his fist, but Wu Chengren just spit in his face.\n"A wild dog, why is it barking here when its teeth can't even bite people? "\nThe clerk was completely enraged, and raised the butt of his rifle and smashed it towards Wu Chengren's knee. Although Wu Chengren was held by someone, he still hit him back with a headbutt. The clerk was a little dizzy, so the Japanese officer made a gesture, and the Taiyue soldiers who were holding Wu Chengren immediately knocked him down, held down his limbs, and rained down the butts of their rifles and military boots on him. His knee was smashed into a bloody mess.\n"You, you still want to stand up now? I tell you, in front of the lady, you are only fit to kneel! "The clerk wiped the blood from his nose and kicked Wu Chengren viciously.\nBut, to their surprise, Wu Chengren endured the severe pain and tried to stand up again. The clerk was completely furious, pressed Wu Chengren to the ground, and cut his tendons with a dagger. Wu Chengren's teeth were broken, but he didn't even groan.\nThe neatly dressed officer stepped on Wu Chengren's face with his boots and asked the clerk to take a photo of him with satisfaction. After taking the photo, he laughed and put the photo in his pocket. Then, he threw Wu Chengren to the Taiyue soldiers, letting them slowly experience the "trophy". The Taiyue soldiers rushed up with bayonets and began to cut meat from Wu Chengren. They scrambled for the cut meat and put it in their mouths."
  Chihong.6.a: "Just like decades ago."
  Chihong_6_tt: "“They pointed to the ruins and told me that this was peace.” - The New Order: The End of Europe, the Destruction of Ukraine"
  Chihong.7.t: "Democratic military"
  Chihong.7.desc: "The Taiyo soldiers drove all the living townspeople to the square, and then the jeep playing the girl band's music stopped in front of them. The clerk asked the townspeople to dance with him in awkward Korean. The Taiyo soldiers gathered in a circle and clapped along with the music. The frightened people didn't know what to do for a while and stood there unable to move. So a Taiyo soldier grabbed a helpless woman's hair and threw her forward, and the others rushed up and started beating her limbs hard, until the woman's bones could not be put together.\n"The rice cake needs to be beaten more, and the more it is beaten, the softer it will be! "The clerk laughed. Then, the Taiyue soldiers began to manipulate the woman's body like a puppet show, and performed an extremely terrifying dance. The people below began to riot, but the Taiyue soldiers picked out a few people, cut off their ears and noses, and stuffed them into their mouths.\nSo the remaining people were forced to dance to the music. One person danced to the wrong beat, and was beaten to death.\n"This is the spread of democracy and civilization, this is civilization! See, everyone is feeling the enlightenment of civilization! Such a conservative Xian people have also accepted the ritual and music civilization under our education! Those who don't understand will have to learn under our gun butts! "The Taiyue soldiers all laughed.\nWhen the music ended, the Taiyue soldiers were tired and threw the woman to the ground. The common people thought that it was over.\nBut they drove the villagers into the warehouse, including men, women and the elderly. As for the children, according to the order of the neatly dressed officer, they tied them up and threw them on the street. The mothers whose children were taken away screamed in collapse, but were immediately stabbed in the mouth by a branch by the Taiyue soldiers. The warehouse door was locked, and some people wanted to escape through the window, but were immediately hit by several bullets.\nThe Taiyue soldiers gathered in the warehouse Outside, a lot of things were thrown in. After a while, the smoke of white phosphorus bombs, the flames of incendiary bombs, and the flames of grenade explosions all appeared at the window of the warehouse. Before leaving, they filled the warehouse with gasoline and lit a fire. The flames rose up all of a sudden and engulfed the entire building in an instant. \nJust like when they came, these Taiyo soldiers drove over the children and disappeared on the road, and the noisy sound also went away with the dust of the car. \nAfter a while, a huge explosion rose in the distance, and short or long gunshots and intermittent commands also sounded. Screams, shouts for killing, and pleas for mercy were intertwined, but they also quickly died down. "
  Chihong.7.a: "How polite and clear, you fascist maggot."
  Chihong.8.t: "Execution"
  Chihong.8.desc: "Park Wenxiu and the guerrillas held their guns against the heads of the captured Taiyo soldiers. Other soldiers of the People's Liberation Army and the Korean People's Army were standing guard. The two officers, one neat, with his cap gone and his collar open, stared at him with red eyes; the other, dressed in rags, lowered his head, not daring to let others recognize his face.\nA guerrilla pushed through the crowd and roared, "Why, do you want to send these beasts away so easily? Give them a bullet, is that it? Think about our village, think about so many folks?"\n"They are the Emperor's Guards, the Special Forces! It was these Japanese devils who set the fire, not me! I'm not Japanese!" The clerk explained in a panic.\n"Sit down! Sit! "Park Wenxiu held up his bayonet and pinned down the clerk. The political commissar of the People's Liberation Army walked up to the Taiyo prisoners and glanced at them. "Unit number, rank." The clerk suddenly seemed to have grasped a life-saving straw, stood up, pointed at the shabby Taiyo commander and said: "Sato Shinsuke, the 12th Detachment of the Ground Self-Defense Force Special Forces, he is the leader, all the orders were given by him." Then the shabby officer began to read a string of things in a low voice and quickly, and the clerk translated it: "He said he was just a victim of the war, he didn't want to hurt anyone, he said he was just a foreman of a company, but was forcibly conscripted. "\nBut the neatly dressed officer glanced at the sloppy officer with contempt, then pushed the clerk away and spoke in Korean: "Your genes and your bones are permeated with inferior factors. Not all nations are qualified to continue to survive in the modern world. Races like you deserve to be destroyed. Modern society does not need you believers in communism, nor does it need you nations that do not understand democracy and have not yet been enlightened by enlightenment."\n"Listen carefully." The political commissar said.\n"You inferior nations that spread the plague of communism are not qualified to survive. Our mission will be accomplished." The neatly dressed officer continued: "Even if we fail today, we will win one day."\nThe clerk's breathing suddenly tightened: "This is what they said, this is what they did, I was forced, I am innocent, I am on the same side with you, comrades..." His voice was already trembling.\n"You are not Japanese, then what the hell are you? A wild dog? "Park Moon-su roared.\n"They forced me to do it, they forced me! My hands are clean! Kill all these beasts, kill them all, but don't kill me!"\n"Then do it for us. Kill them all." The commissar said, and threw two barrels of gasoline in front of the clerk.\nThe clerk immediately rushed out with the others, and they started fighting. In the chaos, the clerk took the two barrels of gasoline and poured them on the heads of the Taiyo prisoners without saying a word.\n"Give me a fire, a fire, comrade! I will pay your blood debt for you!" He roared hoarsely.\n"Enough!" Park Moon-su unlocked the safety and fired at the beasts in front of him. The guerrillas also shot at the prisoners. "
  Chihong.8.a: "Instantly, the sound of gunfire spread out."
  Chihong_8_tt: "The bullet fired at the beasts pierced through their bodies.\nThe collapsed buildings are gradually recovering,\nThe rising smoke column is gradually falling back,\nThe planes and tanks are all retreating,\nThe dropped bombs are returning to the bomb bays,\nThe newly formed Japanese Self-Defense Forces have been disbanded,\nThe power of the militarists is dissipating,\nThe Japanese people have never been mobilized;\nThe emperor was beaten back to the dropping of the atomic bomb,\nBetween the time before the rice riots,\nBetween the Meiji Restoration,\nBetween the Tokugawa Shogunate,\nBetween the Japanese Warring States,\nUntil the first emperor lay in his cradle,\nInnocent eyes looking at his mother.\nThen the bullet stopped\nAnd did not penetrate the child.\n\nHereby commemorate the 80th anniversary of the victory of the World Anti-Fascist War. §YI hope there is no §nmilitarism§!§! in the parallel universe."
  Chihong.9.t: "Farewell"
  Chihong.9.desc: "Chen Que opened the door and found that his door was full of people. Although he had rehearsed this scene countless times in his mind and even thought about how to escape, all of this would not be necessary today. Because he did not need to think about escaping today.\nThe people standing outside were not policemen in black uniforms, but all kinds of haggard people with simple clothes, including elderly people in their seventies and eighties, and children in their teens or even a few years old. He knew that these people were poor people with cancer. For many years, he imported anti-cancer drugs and sold them at low prices. They could not cure the disease, but they could relieve their pain.\nChen Que was a grassroots doctor. He had come into contact with too many patients and seen too many separations and deaths. But one day, a patient who often came to see him disappeared without saying hello, which made him feel very strange. Driven by curiosity, he found the patient's "home", a simple shack in the suburbs. Recycled garbage was randomly piled outside the door of the house, and the patient was wearing a yellowed backpack. The heart lay on the rotten cotton wool, groaning in pain. He looked at the prescription in his hand, looked at the astronomical bill, and finally lost the courage to go in. After that, he found a channel to buy cheap drugs, and when the time was right, he sold these drugs to the poor, sometimes even refusing to charge and distributing them for free. He knew that these drugs were not included in the procurement list and medical manual. Although these drugs can relieve the condition, it is undoubtedly illegal to sell drugs without official endorsement and supervision. \nFor so many years, he has protected the lives of those poor patients with these cheap drugs. He knows that this cannot cure cancer, let alone cure diseases deeper than cancer. But even if it changes a little, he will do it without hesitation. This is his duty. \n"Fellow patients, what is this..." Before Chen Que could speak, the patients bowed deeply. \n"Brother Chen, you don't have to worry anymore. We don't have to let you step into the fire pit for us anymore. We can buy these cheap drugs in the hospital." A patient took off his mask and squeezed out a smile: "Thank you for your care for so many years, Brother Chen. I won't bother you again in the future." After saying that, the patients bowed to Chen Que again.\nTwo huge tears rolled out of Chen Que's eyes. He knew that the day he had imagined countless times had come true. He was not a savior, he was just an ordinary person who accidentally carried a heavy burden.
  Chihong.9.a: "I wish that people in the world would be free of disease, so why should I be sad that the medicine on the shelf is gathering dust."
  Chihong.10.t: "The Road Back Home"
  Chihong.10.desc: "When Park Wenqing walked along the road under construction to the entrance of the small village in North Pyongan Province, he hesitated for a moment, suddenly lost his courage, and dared not go in.\nHe knew that this place was the place he had been thinking about day and night. This was the place where his grandmother had sung songs countless times when he was still in his infancy, and it was also the place where his grandmother had called softly countless times when she was in a coma with a high fever. When he was a child, his grandmother carried him on her back and stood on the Dandong Iron Bridge countless times to look at the other side of the Yalu River, but the sunlight from the east was too dazzling for him to open his eyes.\n"Wenqing, Wenqing, China treats us very well, you have to repay China and Chairman Mao; but I still want to go home and see the mountains, the water, and the rice fields there. "At that time, he was only five years old, and this sentence almost accompanied him for the rest of his life.\nIt was difficult for Park Wenqing to say how he felt after hearing that the Kim family was driven out of power, but he vaguely felt that the time for him to take his grandmother home was approaching; after the outbreak of the war against the Taiyo imperialist group, he joined the People's Liberation Army without hesitation and became an outstanding Korean fighter.\nBut when the war was over, when he walked to the quiet mountain village that he and his grandmother had been thinking about day and night, he didn't dare to go in. Why? Was he afraid of meeting acquaintances? Or was he afraid that his accent had become unfamiliar? Or was he afraid that he was alienated from his roots?\nHe took off his backpack, took out the urn, strolled in this quiet village, strolled in the mountains, looked at the newly built buildings painted in Chinese and Korean, listened to the children's cheerful laughter, and smelled the rice fragrance in the air. He suddenly felt very tired, very tired, but with it came a long-lost softness, as if he was still in the cradle."
  Chihong.10.a: "After a long march, he finally boarded the burning train home."
  Chihong.11.t: "The Wind of Reform"
  Chihong.11.desc: "Pushing open the door of the third-floor conference room, Zhang's hands, holding the light blue evaluation form, were sweating. As an old clerk who had worked in the archives of the county water conservancy bureau for 23 years, this was the first time he wrote down his evaluation of Deputy Director Wang on the cadre evaluation form.\nThe green ivy leaves on the windowsill rustled in the draft, and Zhang remembered the rainstorm last month, when the ceiling of the archives room leaked, and Deputy Director Wang rushed in with an umbrella to help transfer the data. The pen tip hung on the "mass base" column for a long time, and finally wrote a neat "good" character.\nWhen he got off work in the evening, Sister Li from the mailroom held up her mobile phone and stopped him in a hurry: "Zhang, look, the new sunshine notice board in the bureau!" The screen showed the travel expenses of each department this month. Sister Li pointed to one of the lines: "Lao Liu from the administrative department went to the provincial meeting with others. How come the high-speed rail ticket is more expensive than the plane ticket? "Then Lao Zhang raised the doubts on behalf of Sister Li at the morning meeting the next day. The chief financial officer blushed and stammered as he explained that it was a system input error.\nOn the winter solstice, the bureau held a "stove meeting" for the first time. In the temporary meeting room converted from the boiler room, more than 30 staff members gathered around the cast iron stove and listened to Xiao Lin, a new college student village official, talk about flood prevention plans. When he talked about forming a "silver-haired patrol team" in each village, Deputy Director Wang suddenly interrupted: "My father participated in the flood control in 1998. The old people are familiar with the river course. This is a good idea! "The coal in the furnace crackled and exploded with a few sparks.\nOn the day of the public announcement of cadre adjustments in the beginning of spring, the comrades in the archives room were busy submitting and summarizing the names of personnel. Old Zhang looked at the notice on the bulletin board that "Comrade Wang Jianguo was transferred to the consultant of the Flood Control Office", and remembered that at the previous democratic concentration discussion meeting, seven section members unanimously ticked "weak" in the column of "professional ability". The sun shines through the new leaves of the sycamore, casting a swaying spot of light on the notice paper. Nowadays, when passing by the office building of the unit, you can often see resident supervisors wearing red armbands. Last Friday, Sister Li pulled Old Wu, who was selling tofu in the vegetable market, to point in front of the notice board: "Look, the progress of the irrigation canal dredging that you reported last time, isn't this posted with the construction log?" After hearing this, Old Wu took out his mobile phone and opened the "Government Affairs Sunshine" APP, and couldn't help laughing: "Hey! I think the government's reform is good. It is much more efficient than before. If you didn't push it before, it would take you ten days or half a month..."\nWhen the autumn rain hit the glass window of the archive room, Lao Zhang was sorting out the newly arrived flood prevention ledger. The title page was sandwiched with a yellowed "Notes on Democratic Evaluation of Cadres", which was issued during the first evaluation half a year ago. He gently brushed away the dust on the pages. The sweet-scented osmanthus fragrance outside the window mixed with the smell of ink flowed quietly in the autumn light in the room."
  Chihong.11.a: "The spring breeze of reform is blowing everywhere..."
  Chihong.12.t: "People in the apricot forest"
  Chihong.12.desc: "Doctor Zhang had just seen off the last patient of the morning when he collapsed in a chair. It was already noon, and he didn't want to touch the lunch box his wife had prepared. He just wanted to lie down in a chair and rest for a while. As the only doctor in several nearby villages with nearly thousands of people, he really felt exhausted.\nHe used to be very tired. Occasionally, a few nearby villagers would come to him for medical treatment, but when he walked in those villages, he could still often see children with high fever being wrapped in swaddling clothes by their mothers with ginger slices on their bodies, and elderly people with enteritis vomiting and diarrhea while drinking Coptis chinensis water. So he could only take the initiative to find those patients and provide them with free medical treatment. , prescribe them a prescription at cost price. But some villagers either can't afford it, or are more superstitious about their own prescriptions. \nHowever, in the past few months, he has been busy here, and the clinic has become lively. After all, seeing a doctor is cheaper, and the recent free clinics have helped the villagers popularize a lot of medical knowledge, and more people are still willing to come to him for treatment. Although it is said that there is no need to take the initiative to go to the village, it is inevitable to be tired. \nDoctor Zhang walked to the empty backyard, looked at the apricot tree planted behind the yard, and lit a cigarette for the first time and started smoking. "It would be great if someone could help me share the pressure of seeing a doctor." He thought. \n"Is Doctor Zhang here?" Someone shouted at the door. \n"Please sit down first, fellow villagers, I'll be there soon." He threw the cigarette on the ground and stepped on the cigarette butt. \nWhen he walked to the reception desk and saw another man in a white coat standing there, he was immediately stunned. "
  Chihong.12.a: ""Doctor Zhang, I am a new doctor. We will be colleagues from now on.""
  Chihong.13.t: "Long March Central Computing System Mass Health Intervention Program"
  Chihong.13.desc: "This plan has passed the Long March system calculation review. The humanoid execution unit CN20280607-4217 is responsible for the specific implementation of this intervention.\nIntervention target: Lin Ximing\nGender: Male\nAge: 23\nOccupation: After graduating from university, he worked briefly at the Gangshan Computing Power Distribution Center and has now resigned.\nComrade Lin Ximing is currently in a state of deep social disembedding, manifested as circadian rhythm disorder, social function atrophy and lack of self-worth. Physiologically, there are malnutrition (dependence on high-sugar and high-salt canned foods), very low exercise (average daily activity <1000 steps) and decreased immunity; psychologically, there is a tendency to escape reality (specifically, indulge in the virtual world, average daily game time >10 hours), emotional blunting and self-worth anxiety. His living environment has problems such as excessive bacterial colonies and insufficient lighting, which may further aggravate the imbalance between body and mind.\nIntervention principles: Follow the spirit of the "People's Health Protection Regulations" and "non-invasive" "Style companionship" is the core strategy. Relying on the advantages of a materially abundant society, the three-axis linkage is constructed through environmental adaptation, habit reshaping and self-value identification, and the organic connection between individuals and society is gradually restored.\nSpecific implementation plan:\nPhysical health intervention: End sub-healthy diet, use the drone delivery system to semi-mandatory directional delivery of 27-style nutritious meals to [Unit 2, No. 46, Jiefang Road, Gangshan Town], and CN20280607-4217 is responsible for supervising consumption. Environmental colonies, dust, air quality and other indicators should return to normal levels.\nCognitive reshaping: By showing the comprehensive informatization and intelligent construction of Gangshan Town Commune, stimulate their interest in participating in observation.\nValue reshaping: Cater to their preferences and connect with the "Nostalgia Game Restoration Plan" to enable them to achieve self-value reshaping in the practice of game expansion and restoration.\nHuman value self-anchoring takes precedence over the optimal solution for efficiency, allowing the sub-individual CN20280607-4217 to break through some protocol restrictions."
  Chihong.13.a: "Signature: Long March Central Computing System - Social Care Division"
  Chihong.14.t: "Home and Lights"
  Chihong.14.desc: "50-year-old Hu Kailai sat on the bus and silently took out the last soft Zhonghua from his pocket. He started working on the production line at the age of 19, with 31 years of work experience and 30 years of party membership. In the end, he still failed to keep up with the new changes and was transferred away from the cadre line in advance. His life exchanged for a leisurely position for retirement for the party.\nHu Kailai's wife, who graduated from the same technical school as Hu Kailai, immediately knocked out his cigarette: "On the bus, can't you control it?"\nHu Kailai replied impatiently: "I'm upset."\n"What are you upset about? If you are cut, you are cut. Don't make trouble. The family still needs money. Let the rest of the class worry about the rest. It's not a big deal." His wife, who had always complained about Hu Kailai's lack of ambition, now comforted Hu Kailai.\n"Among those people, only the new secretary seems to be so serious. He still torments people with one campaign today and another campaign tomorrow; I think this kid who replaced me is really incompetent, but he is good at talking. "Hu Kailai recalled the frequent personnel transfers over the past year, and still felt that the decision to transfer him was too hasty. "The old secretary was so angry that he cursed at the meeting. I think, when the work they are making trouble for can't be carried out, we have to be invited back." \n"Okay, don't worry about that thing in class. It's rare for your son to come back from other places, can't you give him a good face?" His wife scolded, "Don't worry about it, just rest assured." \nThe bus stopped smoothly at the entrance of the community as usual. The vendors who were worried about losing their livelihoods now began to set up stalls at the entrance of the community again. It was still the same people, and there was no change. \nHu Kailai walked into the store next to the gate of the community, which had been replaced with the sign of the supply and marketing cooperative, and bought himself a pack of cigarettes again. Although his wife watched him closely, he would still find a place to smoke in the future. Just like his wife would still be able to get rid of his cigarettes in the future."
  Chihong.14.a: "So, life goes on."
  Chihong.15.t: "Cabbage and Truth (I)"
  Chihong.15.desc: "When the cherry blossoms on Luojia Mountain bloomed for the 32nd time, Chen Shouming finally no longer had to squat on the steps of the administrative building to block people.\nAt 6:40 in the morning, he walked down the bluestone steps of the old dormitory as usual. The faded canvas bag rubbed against the hem of his navy blue Zhongshan suit. The bag contained the annotated version of the 1986 edition of "Das Kapital". The edges of the hardcover notebook had been wrinkled and yellowed. When he reached the corner of the road, he leaned against an old locust tree by the roadside to rest. There were still some handwriting on the bark, but it had been blurred by the years.\nAfter returning to the philosophy department office, Professor Chen habitually opened the door and sat at the desk. "Mr. Chen!" The young assistant ran over and handed over the thermos cup, "The Party Committee Propaganda Department just called and wanted to invite you to be the speaker of a series of lectures. "Chen Shouming's fingers paused on the cup lid. Just last year, the same phone called and advised him to take more subjects after attending the advanced course. The hot steam from the tea blurred his lenses. He remembered that rainy night in 2003, when he stood at the door of the logistics warehouse with three boxes of manuscripts. Old Zhang, who was in charge of the keys, smoked a Red Gold Dragon and said, "Marxist philosophy research room? It has long been changed into a storage point for printing paper." At that time, a witty saying was popular on campus: "
  Chihong.15.a: "It's better to sell fried dough twists than to study Marxism-Leninism. At least you can hear the sound of money."
  Chihong.16.t: "Big Dreams in Vain"
  Chihong.16.desc: ""You will never understand how many people your international revolution has blocked..."\n"You are just a dreamer..."\n The young man opened his eyes and saw a bright hall in front of him. A group of people were pointing at a depressed man. They were all wearing formal clothes, only the man was wearing a tattered military coat. Those who were pointing at the man could not see his face clearly, but he could see the depressed man's face clearly, but he didn't recognize him at all.\nFor some reason, he knew the style of the military coat and could understand their language. He just didn't recognize the man surrounded in the middle. He clearly remembered that he was preparing for class in a primary school in Hunan just now, but he suddenly became dazed for a moment, and then he saw this scene.\n...\nThe man said nothing and was accused and insulted by everyone. After a long time, he shook his sleeves and walked straight out of the hall. The movement of opening the door was very heavy, causing the door to shake violently and make a harsh sound.\n..."
  Chihong.16.a: "The scene in front of me changed, as if it was about to enter the next scene."
  Chihong.17.t: "Don't believe it?"
  Chihong.17.desc: "Time seemed to freeze at this moment. The dewdrops on the leaves were half hanging in the air, the birds' chirping was frozen in their throats, the soldiers were panting, and the moisture from their breath never dissipated. The whole world was stagnant, and only the young man and the captain were still able to move. He felt a sense of familiarity, and understood why this stranger called him with such a respectful and affectionate name.\nThe captain stood up with difficulty. He had a gunshot wound on his leg and was obviously limping when he walked. He walked up to the young man, his eyes filled with complex emotions.\n"I... I didn't let you down, did I? "The captain's voice trembled a little. The young man didn't know how to answer and could only shake his head gently. "Really... That's good, that's good..." Tears flashed in the captain's eyes, "But Chairman, they don't believe it... I have no way, I really have no way..." The young man looked at this strange yet familiar face, and an inexplicable feeling surged in his heart. He pointed to the front and asked in his usual Chu accent: "Little comrade, your adjutant said that the village ahead is where you launched the uprising, why don't you go and have a look?" "I dare not." The captain lowered his head. "Why?" "Those young people wearing coarse cloth clothes and holding hoes in their hands joined the guerrillas after a few words from me and the village chief. I took them to travel all over the country, and they died in the jungles and valleys for the illusory ideals I talked about," the captain's voice became lower and lower, "I still remember the young man who always sang "The East is Red" in the newly learned Chinese, the man who wanted to save a piece of land for his unmarried wife, the boy who left his parents and wanted to make a name for himself, and the old soldier who joined the army again to repay his mother for a few hundred rupees of medicine money. \n"......"\n"I can't remember their names or their faces, I only know that after each ambush, the land behind me was dyed red. Time and time again..."
  Chihong.17.a: ""Until now, there are only a dozen people left.""
  Chihong.18.t: "Tears"
  Chihong.18.desc: "The raindrops dripped onto the ground, making a very subtle sound. I gasped, and the moisture from my breath slowly dissipated. The world seemed to start moving again.\n\nMy adjutant and soldiers looked at me in horror, as well as the young man with the same face as my deceased teacher. His soft hand held me and pulled me towards the village ahead that I had expressly forbidden to go to.\n\nI was too ashamed to go, and I didn't dare to go: I had mobilized the first group of people there, but I couldn't lead them to triumph; I had promised to make everyone poor, but I couldn't fulfill it; this was probably the fear and guilt shared by all of us generals. General Liao was like this back then, and so was I.\n\nBut the young man didn't seem to understand this. Perhaps it was because he was a military god who roamed the world and rarely suffered a defeat, or perhaps it was because he already knew the answer. In any case, he pulled me forward, and I was powerless to resist."
  Chihong.18.a: "Footsteps landed on the ground, splashing up clouds of dust."
  Chihong.19.t: "Pakistan's election is early"
  Chihong.19.desc: " In the early hours of this morning, the Pakistan Election Commission approved the Senate's resolution to hold an early national election, which will be held next Monday. It also announced that it would relax the election criteria to allow several left-wing parties, including the Communist Party of Pakistan, to participate in the election.\nThe joint spokesperson of the Commission and the Senate said that this move was made "in consideration of the development of the domestic and international situation and the strong voice of the people." Observers pointed out that this sudden election will become an important turning point in Pakistan's political landscape."
  Chihong.19.a: "We'll have to wait and see."
  Chihong.20.t: "Pakistan Popular Front triumphs in election"
  Chihong.20.desc: "The Pakistan Election Commission announced the final vote count this morning. The Popular Front Party Alliance, formed on the basis of the former Lahore Front, won more than half of the seats in the National Assembly with an absolute advantage of 47% of the votes, creating a major breakthrough in the country's political history.\nThe general secretary of the Popular Front said in his victory speech: "This is a victory for the Pakistani people. We will be committed to building a new Pakistan that is more fair, democratic and progressive." It is reported that the enthusiastic participation of a large number of young voters has become a notable feature of this election.\nThe election can be generally described as peaceful and orderly, and the new government is expected to be formally formed next week."
  Chihong.20.a: "That's great. Send them a congratulatory message."
  Chihong.21.t: "Debate"
  Chihong.21.desc: "The Great Hall of the People was brightly lit. The old man on the rostrum had a solemn expression. He looked around at the hundreds of eyes below and slowly said: "Today we are going to discuss an important issue: whether to intervene in the revolutionary process in Afghanistan and Iran." The audience was boiling. Some shouted "export revolution" loudly, while others shook their heads in a low voice. The old man knocked on the table and signaled silence. "Please let the representatives of the supporters speak first." A middle-aged man wearing glasses stood up, his voice was steady and powerful: "Comrades, we once said that we wanted to be the torch of world revolution, but now we are hesitating whether to light this flame? Those Afghan farmers in rags, bending over in the fields, those Iranian workers who are suffocating under the oppression of theocracy, their eyes are looking at us!" His voice gradually became excited: "Have we forgotten how we got here? What would those revolutionary martyrs think? They shed blood and sacrificed their lives, not for us to sit here hesitating today! "\nThe applause was thunderous, but it was soon interrupted by the voice of another representative:\n"We all respect the revolutionary martyrs, but we must face reality," the white-haired old man slowly stood up, "The situation in West Asia is much more complicated than ours. Religious, tribal, and ethnic conflicts are intertwined, and external forces have serious infiltration. If we intervene rashly, can we guarantee that we will not repeat the mistakes of the Soviet Union?"\nThe old man's eyes swept across the audience.\n"I once led a team into the mountainous areas of Afghanistan. The villages there were dilapidated and the people were poor, but their vigilance against outsiders was engraved in their bones. The right to speak in the countryside is in the hands of the mullahs. Islam is rooted in the deepest part of the Afghan countryside. From a military perspective, what the Afghan people can embrace is still feudal warlord-style; from a cultural perspective, it is still religious brainwashing; from an economic perspective, it is still landlord class-style. The situation in Iran may be better. But it is definitely not much. "\n"Can we give an answer? Can we live up to their expectations? Can we...can we solve these problems? "\nThe meeting room fell silent, with only the sound of the wind outside the window sobbing."
  Chihong.21.a: "We must acknowledge the difficulties, analyze the difficulties, and fight against the difficulties."
  Chihong.21.b: "We should wait for a more mature time rather than act rashly."
  Chihong.22.t: "Faith"
  Chihong.22.desc: "Thirty miles north of Kabul, in the foothills of the Hindu Kush Mountains, on a barren land, old Karim sat in front of his mud house, looking at the blurred shadows of the mountains in the dusk. His fingers slowly stroked the well-read Quran, the edges of the parchment had been worn white by years of reading.\nMore than sixty years have carved deep grooves on his face. His cloudy eyes have witnessed the fall of the kingdom, the establishment of the "Republic", the fluttering of the red flag, the waving of the Stars and Stripes, and now they are back under the cover of the green flag.\n"Oh God..." he murmured to himself, his voice like a dead leaf in the autumn wind, "Why do you test us like this? "\nKarim put down the scripture and looked at the barren fields covered with gravel in the distance. When he was a teenager, he picked up a gun and followed his father and uncles to fight against the "red pagans"; when he was middle-aged, he took his eldest son to deal with the "American Crusaders" in the mountains. Both times, they cheered the victory, and both times, the mullahs declared that God's will was upheld.\nNow his eldest son is sleeping in the valley, and his youngest son is holding an old AK-47 and working at a checkpoint.\n"Uncle Karim, what are you thinking about?" Young Abdullah from the village came over, holding a skinny goat in his hand.\n"I wonder why this is happening." Karim's voice was hoarse, "The Soviets left, and our granaries didn't get fuller; the Americans left, and our wells are still dry."\nAbdullah put down the goat and sat next to the old man: "The mullah said that this is a punishment for our lack of faith."\nKarim smiled bitterly: "I heard this when I was young. My father heard this before he died." He pointed to the valley, "Look over there, twenty years ago, the white trucks of the United Nations came, bringing food and medicine. The mullah said it was the temptation of the infidels. Now there is no temptation." \n In the distance, several children were playing among the stones, their laughter was crisp but short, as if diluted by the barren air. \n "I used to think that as long as we drove away the foreigners, Allah would bless us." Karim picked up the crutches beside him and pointed to the sky, "We drove away two powerful countries, but look at our village, it is poorer than when I was a child." \n Abdullah lowered his head: "Maybe it will be different next time..." \n "Next time?" Karim shook his head, "I don't have a next time. I'm just an old farmer. I can't grow enough food, and I can't save my grandchildren." He slowly stroked his palm over the cracked land, "I have seen too much blood, but I have never seen a tulip bloom again. "\nHe didn't finish because the village mullah came over and announced that it was time for evening prayers.\nNot long ago, the pagan countries collapsed. The mullah told everyone that this was God's favor to believers and a reward for believers. In order to thank God for his power, he increased the frequency of evening prayers.\nThe mullah preached loudly in the mosque every week, saying that victory has belonged to true believers and that God will grant loyal servants a good harvest and wealth. People knelt, prayed, and waited for miracles to happen.\nKarim struggled He stood up and followed the villagers to the simple mosque. Tonight, the mullah will tell another story about faith and victory, just like every night in the past fifty years. \nBut Karim knew that when he woke up tomorrow, his fields would still be dry and his grandchildren would still be hungry. \nIn the prayer, the old man closed his eyes and called out again: he only hoped that the emirs in the capital would not change their policies every day and stop demolishing people. \nThe Quran on the table was illuminated by candlelight, but there was no ripple. "
  Chihong.22.a: "A drop of turbid tears merged into the dust, silently."
  Chihong.23.t: "Afghanistan Investigation Report"
  Chihong.23.desc: "I. Ethnicity and social structure The Hindu Kush Mountains are like a natural barrier, dividing Afghanistan into countless unconnected valleys and plateaus. In these isolated spaces, ethnic groups have passed down their own languages, customs and hatreds from generation to generation.\nPashtuns account for about 45% of the total population, mainly distributed in the south and east, and are the main support base of the Taliban. However, even among the Pashtuns, the conflicts between tribes are intricate. The Tajiks in the north (27%), the Hazaras in the center (9%) and the Uzbeks in the northwest (9%) have long been excluded and oppressed.\nOur investigators recorded the words of an old Hazara man in Bamiyan Province: "Whenever the black flag of the Taliban appears at the mountain pass, we know that another disaster is coming. We are not a country, we are just prisoners who are forcibly tied together. ”\n2. Economic Foundation\nAfghanistan’s economic structure has been completely distorted. More than 40 years of war have destroyed the traditional agricultural system, irrigation facilities have fallen into disrepair, and a large amount of arable land has been abandoned. In the provinces south of Kabul, we see vast tracts of land planted with poppies, which is an important source of income for the Taliban.\nA farmer in Kandahar told us: “If you grow wheat, the whole family will starve to death; if you grow poppies, at least the children can have enough food. "It is estimated that the opium trade accounts for more than 30% of Afghanistan's GDP, and the Taliban obtains a lot of money by collecting "taxes" or even selling it themselves.\nAt the same time, the unemployment rate in cities is as high as 35%, and a large number of young people have nothing to do, becoming the target of recruitment by extremist organizations.\n3. Political and religious situation\nThe Taliban regime's ruling foundation is built on three pillars: religious authority, tribal relations and armed forces. They use religion to legitimize their rule and define all opposition voices as "heresies", but at the same time, conservatives and reformists within their regime are constantly arguing and changing their orders.\nHowever, we observe that among the younger generation, doubts about the extreme interpretation of the Taliban are increasing. Near Kabul University, the students we secretly contacted told us: "We are not against Islam, we are against oppression implemented in the name of Islam. "\nIn the north and central regions, resistance to the Taliban has never stopped. We have recorded at least 17 underground resistance organizations in operation, many of which are remnants of the Maoists of the last century.\nIV. Evaluation of revolutionary conditions\n1. Favorable factors:\n(1) Sharp ethnic conflicts and general resistance to the Taliban by non-Pashtun ethnic groups;\n(2) There is a strong desire for change among young people;\n(3) The economic crisis is intensifying and people are living in hardship;\n(4) There are still organized resistance forces.\n2. Disadvantages: \n(1) Religious forces are deeply rooted; \n(2) Tribal loyalty is higher than national identity; \n(3) The people are generally wary of foreign forces (historical lessons from the Soviet Union and the United States); \n(4) The terrain is complex, transportation is inconvenient, and it is difficult to form a united front. \nV. Strategic Recommendations\nThe Taliban regime is essentially a reactionary regime that relies on clan power, religious power structure and violence to maintain its existence, rather than "the choice of the people." As Comrade Lenin said, we should clearly distinguish the boundaries between "anti-imperialism" and "progress" - not all forces opposing imperialism are worthy of support, especially when such opposition comes from more reactionary classes. \nIf we decide to take action, we suggest: \n1. First establish bases in Hazara and Tajik areas; \n2. Support progressive secular forces and avoid getting involved in religious disputes \n3. Emphasize land reform and economic development, rather than ideology; \n4. Establish a multi-ethnic united front to avoid being seen as a foreign invader"
  Chihong.23.a: "Raise the flames!"
  Chihong.24.t: "Mahsa Struggle"
  Chihong.24.desc: "A 22-year-old Iranian Kurdish woman named Mahesa Amini was arrested by the morality police in Tehran because she was said to be wearing a headscarf too loosely. Later, the police said that Amini collapsed in the police station due to sudden heart failure and died after two days of coma. But witnesses said that she was beaten before her death and her head hit the side of the police car. Her brain scans showed that she had fractures, bleeding and cerebral edema in her head.\n\nAmini's death triggered a series of large-scale protests across the country. In order to suppress the tide of demonstrators, the Iranian government used tear gas and high-pressure water cannons to disperse demonstrators, and even used birdshot and metal bullets to shoot and kill. It also blocked a large number of applications including Instagram and WhatsApp, and restricted Internet connections to weaken the protesters' ability to organize. This is the largest Internet restriction since Iran completely shut down the Internet in 2019."
  Chihong.24.a: "This is not the end of the beginning, but the beginning of the end."
  Chihong.25.t: "The Man in the Mountain"
  Chihong.25.desc: "Navid casually swiped the screen of his mobile phone, and the news push from the national TV station popped up: "Beware! "Man of the Mountain" terrorists attacked police posts in Kurdistan Province." The picture was a blurry photo of several masked men holding weapons, and the eye-catching red font under the title read: "These atheists controlled by evil forces are trying to undermine the stability of the Islamic Republic. The police say everything is under control." Navid snorted contemptuously and turned off the push. It has been three months since he graduated from the Department of Political Science at the University of Tehran. He has been reading these propaganda-like news for twenty-three years and has long been numb. "Have you really decided? Travel around the country?" asked his roommate Amir, leaning against the door frame. "Yes, I want to see the real face of this country before looking for a job." Navid closed the suitcase, "I've been in the bubble of Tehran for too long." \n\nAmir lowered his voice: "Be careful, the situation is not stable now. Ever since that girl..."\n\nNavid nodded. They all knew who "that girl" was referring to."
  Chihong_25_tt: "A curious young man, from the ivory tower to the vast land..."
  Chihong.25.a: "So, he set out"
  Chihong.26.t: "Travel—beauty and reality"
  Chihong.26.desc: "The dusk in Isfahan is stunningly beautiful, with the ancient bridges gleaming golden in the setting sun. Navid stood by the Zayend River, feeling the ancient city he had only seen in textbooks.\nHowever, the reality behind the beautiful scenery was far from beautiful. Just the night before, the cheap hotel he was staying in was broken into, and his laptop and some cash were looted. After calling the police, the police just recorded it carelessly, and even implied that outsiders like him deserved this kind of loss. "We have more important things to deal with," the officer said arrogantly, "those traitorous demonstrators and terrorists in the mountains. ""
  Chihong.26.a: "It's just this little trade-off..."
  Chihong.27.t: "Travel - Long Distance Bus"
  Chihong.27.desc: "On the long-distance bus to Shiraz, a middle-aged man sat next to Navid. At first, Navid just nodded politely and focused on the desolate mountain scenery passing by outside the window.\n\nBut as the journey progressed, the stranger began to approach him intentionally or unintentionally, and his hand "inadvertently" touched his thigh. When Navid stood up and wanted to change seats, the man whispered: "Don't be so nervous, pretty boy. In this country, we all need some small comfort, don't we?"\n\nNavid felt a wave of nausea. He realized that in a society that suppresses normal human desires to the extreme, distortion will erupt in another form."
  Chihong.27.a: "People accuse the oppressors of being shameless, but never mention why."
  Chihong.28.t: "Travel—Ordinary Gathering"
  Chihong.28.desc: "In Shiraz, Navid witnessed a scene he had never imagined.\n\nHe was walking near the Hafez cemetery when he heard shouting in the distance. Curiosity drove him closer, and he saw a group of young men and women gathered in the square, shouting "Life, Freedom" slogans, and some took off their headscarves and waved them in the air.\n\nBefore he could react, riot police and plainclothes Basij militia had already rushed into the crowd. He witnessed the moment when sticks fell on young faces and saw blood flowing from the forehead of a young man who was no more than 20 years old. When he tried to step forward to help a girl who was pushed down, a Basij member pushed him away fiercely.\n\n"Get out! Do you want to be arrested with these running dogs?"\n\nNavid staggered back, anger and powerlessness intertwined in his heart. Is this the Iran he loves?"
  Chihong.28.a: "Yes, but maybe not."
  Chihong.29.t: "Travel - Ending"
  Chihong.29.desc: "At night, in a small town in Kurdistan Province, Navid lay on the simple bed in the hotel, tossing and turning. Outside the window, the outline of the Zagros Mountains loomed in the moonlight.\nHe recalled the journey of the past few months: the looted property, the violence he witnessed, the shame of being violated, and the ubiquitous fear and repression. He remembered the professors in the classrooms of Tehran University carefully avoiding sensitive topics; he remembered the fire in the eyes of the young people who bravely stood up during the Mahsa struggle; he remembered the complicated expressions of the old people when they talked about the "people in the mountains" along the way.\nThe official media called them terrorists, pagans and unbelievers, and running dogs of the West. But Navid He began to wonder if those who fled to the mountains were just like him, tired of lies and oppression? \nAt dawn, Navid made a decision. He packed his simple bag, left his room fee, and walked out of the inn. \nNo one guided him, no one recruited him, only the irrepressible desire deep in his heart drove him. He was not sure if he could find those "people in the mountains", or even what would happen after he found them. But he knew that he could never go back to the world that pretended everything was normal. \nNavid looked back at the town for the last time, then turned around and walked into the depths of the mountain. In the morning mist, his figure gradually blurred and finally disappeared at the end of the winding mountain road. "
  Chihong.29.a: "Another "mountain man" is born."
  Chihong.30.t: "Iranian Civil War"
  Chihong.30.desc: "In the early hours of this morning, armed clashes broke out simultaneously in several cities in Iran, and then the intensity escalated rapidly. This marks that this Middle Eastern country has officially fallen into a state of civil war.\n\nAccording to reports, the armed forces formed by the Communist Party of Iran, the People's Party of Iran and other left-wing coalitions mobilized the masses to launch a large-scale armed uprising in provinces such as Kurdistan, Lorestan and Isfahan, claiming to recapture the fruits of the 1979 revolution.\n\nAt the same time, the Chinese government issued a statement publicly recognizing and supporting the new regime, saying that it "represents the just cause of the Iranian people in pursuit of freedom and progress." After the conflict broke out, the Iranian Revolutionary Guard and government forces quickly counterattacked. Tehran's Supreme Leader Khamenei delivered a televised speech, accusing the rebels of being "traitors controlled by infidels" and vowing to "defend the dignity of the Islamic Republic with flesh and blood."\n\nAccording to reporters on the scene, the two sides engaged in fierce exchanges of fire at several strategic locations. Soldiers on both sides shouted to fight for Iran and showed their determination to die if they failed to win."
  Chihong.30.a: "This is not a civil war, this is a revolution!"
  Chihong.31.t: "Eve"
  Chihong.31.desc: "Jeremy Olu pulled the grenade ring and threw it into the crowd of people who were charging at friendly positions. The explosion built an invisible fence in front of the rolling black tide, giving him a chance to catch his breath. As he retreated into the next trench, a question suddenly popped up in Jeremy's mind: How did he get to this hellhole?\nA few months ago, Jeremy Olu almost laughed out loud when he received the order to go to Miami for peacekeeping: the blue helmets that used to be active in various third worlds were actually going to the United States to perform missions. This was a huge benefit. However, after arriving in Miami, he realized how naive he was: the scene in front of him was far from the sunny beaches and luxury hotels he imagined. Most of Miami has become a charred battlefield, the once prosperous seaside avenue is full of craters, and the glass curtain walls of skyscrapers reflect the blazing flames.\n"Olu! The third team is short of people, go to reinforce the eastern defense line! "The lieutenant's shout brought Jeremy back to reality. He climbed out of the trench, crouched and ran to the designated location. Along the way, he could see the busy scene in the temporary medical station - UN medical staff were urgently treating a group of civilian casualties, mostly women and children injured in the latest cleansing operation of the "Nuclear Division".\nJeremy arrived at the eastern defense line and quickly checked the ammunition reserves and trench conditions. It was not optimistic - there was not much ammunition left, and the last batch of supplies arrived a few days ago. The supplies that should have arrived yesterday were nowhere to be found. They could only learn to calculate every bullet carefully.\n"Here they come again," whispered Kassem, a veteran from Senegal beside him, "There are many more people this time."\nJeremy raised the telescope. "Yes, it seems that they are determined to take our position this time. "He checked the scope on his rifle and touched the last two grenades in his breast pocket.\nAs night fell, disturbing news came from the radio: the nuclear division had captured the northern checkpoint, and the UN station was left with only one line of defense. Their reinforcements were blocked fifty kilometers away and would take at least two days to arrive. Jeremy knew what this meant - the wing had become an isolated force and could not expect any support in the future.\nThat night, Jeremy wrote to his wife who was already abroad under the starlight: "Dear Ade, the United States is not what we imagined. Here, I see the coexistence of the most noble ideals of mankind and the most cruel evil. I don't know what will happen tomorrow, but I know that what we are doing is right. If I don't make it home, please tell our son that his father died protecting those who couldn't protect themselves..."\nHe didn't finish. The sirens pierced the night sky, and Jeremy put down the letter and checked his gun neatly to make sure the magazine was full. He put on his helmet, tightened his tactical vest for the last time, and rushed to the front line. Ten years of combat experience made every move he made fast and precise.\nIn the distance, the convoy of the Nuclear Weapons Division approached with searchlights on, and the black sun and swastika flag fluttered in the night wind, like demons rushing out of hell. Jeremy lay down behind the bunker, adjusted his breathing, and lightly pulled the trigger with his fingers. Every bullet found the target, but these efforts seemed so insignificant in front of the heavy weapons of the Nuclear Weapons Division.\nIn the distance, a dazzling light flashed on the horizon, followed by a deafening roar. Jeremy's heart sank-it was the characteristic flash of the 155mm howitzer.\n"Get down! "He screamed, but it was too late to warn.\nThe first round of artillery fire landed accurately on the front line, the whole ground was shaking, and sandbags and concrete fragments were flying everywhere."
  Chihong.31.a: "So, the battle began..."
  Chihong.32.t: "Big Hand"
  Chihong.32.desc: "When the smoke cleared, Jeremy saw that the once solid fortifications had become a ruin.\n"Where did they get such heavy weapons?" a surviving soldier asked in horror.\nJeremy did not answer. He knew that the local garrison's arsenal had been looted, and that a whole unit of American troops had defected with their full equipment. The existence of these heavy artillery pieces was not surprising in itself, but what was really surprising was that they had not taken them out a few days ago.\n"Qasim!" Jeremy searched for his comrades in the ruins, but only saw an arm sticking out of the rubble, with the UN armband on it soaked in blood.\nThe intermittent voice of the lieutenant came from the radio: "Attention everyone... The enemy has deployed M777 howitzers and HIMARS multiple rocket systems... They are bombarding all known positions... Evacuate immediately..."\nJeremy was just about to move a few steps, but soon, another round of shelling came."
  Chihong.32.a: "So..."
  Chihong.33.t: "Bullets and Wounded People"
  Chihong.33.desc: "This time, the grenade landed precisely on the temporary command post, and the radio immediately fell into silence.\nJeremy took advantage of the brief break to crawl towards the medical station. His legs were scratched by shrapnel, but this did not slow down his determination. When he arrived at the medical station, he saw a chaos - medical staff were urgently transferring the wounded, but everyone's face was full of despair.\n"Headquarters has lost contact," the chief doctor told him with a trembling voice, "our evacuation route has been cut off." "How many more wounded are there?" Jeremy asked.\n"Thirty-seven people, most of whom cannot move on their own."\nJeremy gritted his teeth: "I have a plan."\nHe quickly organized the remaining soldiers to build a hidden passage and began to transfer the wounded. But at this moment, a drone quietly flew over their heads..."
  Chihong.33.a: "Damn..."
  Chihong.34.t: "Evacuation"
  Chihong.34.desc: ""Damn it!" Jeremy raised his gun and fired, but it was too late. The drone sent back their location.\nIn less than five minutes, the first 155mm grenade landed precisely fifty meters away from the medical station, and the ground shook in the violent explosion. Then came the second, the third... like a deadly rain, falling continuously.\n"Guided bombs!" Jeremy realized that the situation was worse than he had imagined, "They are using precision-guided artillery shells!"\nThey were trapped in the medical station, surrounded by an approaching artillery circle. Each explosion made the building shake more violently, and the cracks in the walls continued to widen.\n"We must evacuate in a dispersed manner," Jeremy said to the remaining dozen soldiers,\n"Each person takes two wounded and breaks out along different routes." When the last group of people were about to leave, Jeremy noticed that there were three seriously injured people in the corner with no one to take care of them.\n"You go first," he said to the last soldier, "I'll take care of them. "\n"But sir..."\n"This is an order!" Jeremy said firmly, "I'll find a way."\nWhen everyone left, Jeremy stared at the three wounded, struggling internally. He knew he couldn't take everyone away at the same time, and leaving anyone behind meant death.\nOutside, the engine sounds of the heavy armored vehicles of the Nuclear Weapons Division were getting closer and closer, accompanied by the precise bursts of howitzers, which gradually eroded the area controlled by the blue helmets.\nJeremy made a decision. He helped the three wounded hide in the basement, used up all the medical supplies to bandage them, and made sure they had enough water and food. "Someone will come to save you," he said, "Hold on. ""
  Chihong.34.a: "After that, Jeremy picked up the gun and walked towards his fate..."
  Chihong.35.t: "Hymn"
  Chihong.35.desc: "Jeremy walked out of the medical station, took the last of his ammunition, and found a commanding height. Using a telescope, he clearly saw the artillery positions of the Nuclear Weapon Division - three M777 howitzers and two sets of "HIMARS", which were constantly pouring firepower into the peacekeeping area.\nJeremy set up his sniper rifle and adjusted his breathing. He knew he couldn't stop the massacre, but maybe he could buy some time for others. In the scope, he locked the artillery commander.\nThe moment he pulled the trigger, the commander in the distance fell down. The artillery fire of the Nuclear Weapon Division immediately turned to his position.\nJeremy quickly moved and continued to snipe key targets. He successfully killed two gunners and a communications officer, but his ammunition was about to run out. After the last bullet ran out, he took out the unfinished letter and hurriedly wrote the last words on the back:\n"Dear Ade, when you receive this letter, I will be gone. Please tell our son that his father did not back down in the face of evil. Although we failed, one day, justice will triumph over cruelty. I love you, forever..."\nHe didn't finish. A 155mm guided missile accurately hit the building he was in, reducing everything to ruins."
  Chihong.35.a: "Jeremy Olu, history will remember this warrior."
  Chihong.36.t: "Report on Japan's potential military adventure"
  Chihong.36.desc: "\n\n\n £GFX_MSS_event_texticon \n\n\n\n\n Dear Comrade Chairman:\nSince the end of the Taiwan Strait Campaign, Japan has sought to amend its constitution to promote the so-called "normalization of the country". Specifically, Article 9 of Japan's peace constitution on the renunciation of the right to war has been amended, and its armed forces have been renamed the Imperial Japanese Army. These measures have shown that Japan's efforts to de-militarize since World War II have completely failed. The Japanese government's series of measures are not only a serious threat to regional peace, but also a complete subversion of the post-war international order.\nIn terms of domestic affairs, the Japanese government has taken a series of tough measures to consolidate its militarist policies. First, in the name of "national security", through the "Special Security Maintenance Law" and other evil laws, cruelly suppress anti-war groups, establish a system of ideological censorship, and comprehensively suppress pacifist voices; second, reconstruct the national education system, comprehensively implement military training courses in the basic education stage, and systematically implement militarism by tampering with history textbooks and manipulating media public opinion. Ideological indoctrination. \n In terms of diplomacy, Japan has adopted a more aggressive strategy. In Northeast Asia, it has used the Korean Peninsula as a strategic breakthrough point, frequently creating incidents such as the "Takeshima Crisis" and the "Fishing Boat Incident" in an attempt to reconstruct the regional security architecture; in terms of military construction, it has secretly promoted the separation of weapons-grade plutonium in Aomori, Fukui and other places under the cover of "civilian nuclear energy", and its nuclear armament process has posed a real threat to the global non-proliferation system. \n Faced with such a severe situation, we must immediately take decisive measures to comprehensively enhance the state of national defense combat readiness and be prepared to meet any unexpected events. At the same time, it is necessary to intensify international diplomatic offensives, expose Japan's aggressive intentions, and win broad support and cooperation from the international community to curb its dangerous military adventures. \n Comrade Chairman, we are on the brink of war, and any negligence may lead to serious consequences. We will continue to closely monitor developments and report the latest intelligence to you in a timely manner. \n Sincerely, \n Salute. "
  Chihong.36.a: "Ministry of State Security of the People's Republic of China."
  Chihong.37.t: "The Proletarian Cultural Festival was a complete success!"
  Chihong.37.desc: "Recently, the first National Proletarian Cultural Festival was grandly opened at the Workers' Stadium in the capital yesterday. People from all over the country gathered together to celebrate this grand event aimed at promoting socialist culture and showing the spirit of the working people in the new era.\nAt the opening ceremony, the General Secretary delivered a speech on socialist culture. He emphasized that against the backdrop of the United States falling into civil war and the deepening crisis of the Western capitalist system, our country has successfully achieved the complete reunification of the motherland and socialist construction has entered a new stage. The holding of the Proletarian Cultural Festival is precisely to further strengthen class consciousness throughout society, consolidate the dominant position of the proletariat, and resist the erosion of the decadent bourgeois culture.\nThis cultural festival lasts for one week and the activities are rich and colorful. At the opening ceremony, representatives from Taiwan Province performed a large-scale music and dance epic "The Road to Reunification", and the moving scene attracted the whole nation. warm applause. Afterwards, the workers' art group performed the drama "Fighting in the Workshop" which reflects the spirit of grassroots struggle; the peasant delegation brought the newly created folk song "Harvest Fields"; and the PLA Art Troupe performed the song and dance "Heroic Hymn" to commemorate the Taiwan Strait Unification Campaign. \nDuring the cultural festival, industrial achievement exhibitions, agricultural harvest exhibitions and revolutionary traditional education exhibitions will be held simultaneously across the country. It is particularly worth mentioning that this cultural festival has set up an "International Revolutionary Art Exchange Zone", inviting artists from socialist countries around the world to participate in exchanges and showcase the achievements of proletarian cultural development in various countries. \nIt is understood that major online platforms have opened special live broadcast channels for the cultural festival, and units across the country have organized collective viewing. After watching, Master Wang of Baosteel said excitedly: "I feel extremely proud to see that the cultural status of our working class has been so improved! Such a cultural festival is a festival that truly belongs to our working people! "\nThe head of the Central Propaganda Department said that holding the National Proletarian Cultural Festival is an important measure to implement the "Left-wing Cultural Renaissance Project" in the new era. In the future, provinces and cities will take turns to host local proletarian cultural festivals to form a new pattern of national cultural development. The Ministry of Culture also announced a series of supporting policies, including increasing support for literary and artistic creation on worker and peasant themes, establishing a worker writer training program, promoting various units to accelerate the establishment and improvement of employee cultural clubs, and carrying out theme activities such as "Searching for Working Class Heroes" across the country.\nIt is reported that the closing ceremony of the cultural festival will be held on May 10, when the "Chinese Proletarian Cultural Manifesto" will be issued, making systematic arrangements for promoting socialist cultural construction under the new situation and contributing more wisdom and strength to the construction of socialist new culture."
  Chihong.37.a: "The red flag of proletarian culture is flying high!"
  Chihong.38.t: "A new list of "People's Artists" is released!"
  Chihong.38.desc: ""
  Chihong.38.a: "To be commended."
  Chihong.39.t: "Only the Yellow Crane Tower remains here"
  Chihong.39.desc: ""Oh, my ladder is broken again, and the 14 yuan this month is a waste." Li Ming complained while refreshing the network. As a college student, he has become accustomed to this daily routine of climbing over the firewall.\nJust when he was about to give up, his roommate Wang Hao suddenly shouted excitedly: "Brother Ming, do you know? I heard that the firewall control has been lifted!"\nLi Ming sneered: "Don't be funny, this rumor is spread several times a year."\n"It's not a rumor!" Wang Hao handed him the phone, "Official announcement, because of the reorganization of the international network after the American Civil War, China's Internet will fully open international connections."\nLi Ming took the phone half-believingly and read the news from Xinhua News Agency carefully. Then, with a try-it mentality, he directly entered the Twitter URL in the browser address bar.\nUnexpectedly, the page really started to load. There was no familiar timeout prompt, no connection reset error. But after waiting for nearly a minute, the page only loaded a simple error prompt: "Due to server damage, Twitter is temporarily unable to provide full service. ”\nHe tried Facebook, YouTube, and Instagram again, but the results were similar - either the error page loaded extremely slowly, or it simply could not connect.\n"What's going on?" Li Ming scratched his head.\nWang Hao shrugged: "Many data centers in Silicon Valley were directly destroyed, and foreign Internet infrastructure was severely damaged. Everyone knows what the United States is like now."\nLi Ming suddenly realized: "So the firewall was lifted not because of a policy shift, but because..."\n"Because there is nothing to block anymore." Wang Hao took over the conversation, "Those foreign platforms themselves are not working."\nLi Ming was silent for a while, and suddenly laughed: "Hehe, the wall we tried so hard to climb over has collapsed, but we found that the world outside has changed."\nHe closed the inaccessible websites and opened Bilibili. On the screen, countless messages and comments from foreign users came into view. They were heatedly discussing how to adapt to China's social platforms and network environment.\n"It seems that now they are coming in. "Li Ming sighed. Outside the window, Beijing's night is still brightly lit, while on the other side of the ocean, the country that once dominated the global Internet is falling into darkness and chaos."
  Chihong.39.a: "At least I don't need to use a ladder to go to the creative workshop..."
  Chihong.40.t: "Foreign users flock to Xiaohongshu"
  Chihong.40.desc: "Xinhua News Agency, Beijing: As the American civil war continues to deepen, major global network servers built on the US mainland have suffered serious damage, and many internationally renowned social media platforms have been paralyzed. Against this backdrop, Chinese social platforms are experiencing an unprecedented surge in international users and have become a new center for global network communication.\nAccording to the latest data from the State Cyberspace Administration of China, in the past three months, the number of newly registered users of the international version of Xiaohongshu has exceeded 200 million, among which the number of users from Europe and South America has increased most significantly. WeChat's overseas version has added more than 300 million new users during the same period, and the supported language versions have expanded from the original 20 to 37.\n"I never thought of using Chinese social platforms before, but now they are my only choice." Carlos, a reporter from Brazil, told our reporter through the international version of Weibo, "To my surprise, these platforms have much richer functions than I thought. ”\nFaced with the sudden surge in users, major Chinese social platforms quickly adjusted their strategies. WeChat, Douyin and Xiaohongshu announced that they would increase investment in overseas servers and urgently expand their multilingual content review teams to cope with the surge in international user demand. At the same time, in order to solve the barriers to cross-cultural communication, major platforms have launched AI tools that support real-time translation in 94 languages ​​to facilitate cross-border communication.\nIndustry experts pointed out that this sudden change in the global network landscape has brought unprecedented international opportunities to Chinese Internet companies, but they are also facing many challenges. Experts said: "We need to adapt to the usage habits and expression needs of international users more flexibly while maintaining the network management model with Chinese characteristics."\nThe State Council Information Office recently issued an announcement stating that it will moderately adjust the user content management policy and provide a more open communication environment for international users on the premise of complying with Chinese laws and regulations.\nThe industry generally believes that this change may reshape the global Internet ecology, and Chinese social platforms are expected to upgrade from "Chinese services" to "global services" in this process, further enhancing China's voice in the global digital economy and network governance. "
  Chihong.40.a: "Come to Xiaohongshu and have a look!"
  Chihong.41.t: "Bus"
  Chihong.41.desc: "Several police cars flashed their lights, flanked by a black bus, slowly drove out of the prison gate and passed through the streets of Taipei. Senior officers of the Taiwan puppet army and those die-hard "Taiwan independence" government civil servants were on the same bus. The bus was dull.\n\nThe woman who had once called the wind and rain on the island of Taiwan now looked ashen, not wanting to say a word. She just looked through the one-way glass at the bustling streets of Taipei as usual, as if she had never been there and the war had never broken out - if it weren't for the small bullet holes on the wall still staring at her teasingly.\n\nLai Qingde kept banging his head against the seat in front of him, his teeth chattering. He stood up and wanted to shout a few words, but when he saw that everyone on the bus was lying like dead pigs, he sat down dejectedly, staring at an unknown direction with a dark face."
  Chihong.41.a: "The bus moved forward, heading towards their destiny."
  Chihong.42.t: "The Clown"
  Chihong.42.desc: "In a cavernous room in the prison, Lai Qingde lay on the bed like a dead pig, motionless. After the guards finished their last round of inspection, he suddenly got up, fumbled in the dark for a long time, and grabbed a piece of glass from under his pillow.\n\nHe took a deep breath, opened his mouth, and prepared to swallow the glass directly into his stomach, but when his tongue felt the cold texture of the glass fragment, he changed the direction of the glass fragment several times, trying to find a more suitable angle to swallow the glass, but it seemed that this angle could not be found. Then, he mustered up his courage, picked up the sharpest end of the glass fragment and pointed it at his abdomen, doing He made a gesture as if he was going to perform a caesarean section. But he just stretched out his hand, gesturing for a long time, as if he couldn't find where his abdomen was. He gritted his teeth, rolled up his sleeves again, exposing his wrists, and prepared to let the black blood in his veins gush out. Before cutting, he recalled many things. He thought that he would be dismembered by the devil and his soul would be burned by the flames of hell. He thought of many terrible things, so he finally made up his mind and cut it hard -\n\nThen, a little blood seeped out of his wound, and then gathered into a blood spot and stopped flowing out. Then he threw the glass fragments away and kicked them aside. "
  Chihong.42.a: ""No, I can't cut too deep...""
  Chihong.43.t: "Take your seat"
  Chihong.43.desc: "Soon, the bus stopped. The prisoners were taken off the bus one by one and separated: the military was taken away by the soldiers of the military court, and the civilians were taken away by the bailiffs.\n\nAs soon as Lai Qingde got off the bus, he started shouting and yelling, trying to ask the crowd for help, but no one paid attention to him, so he lay down and rolled around, drowning himself in tears and saliva. But the bailiffs behind him stepped over him directly. Tsai Ing-wen was taken to the original venue of the pseudo-legislative council, a place she was very familiar with. Lai Qingde was escorted to the detention center and strictly guarded. He deserves to be tried in private so that others can come and see his circus. \n\nNow, the Legislative Council has been set up as a perfect courtroom. Except for the statue of Sun Yat-sen, all other symbols have been cleaned up and replaced with the national emblem of the People's Republic of China. The entire courtroom is full of people, and a large group of reporters holding cameras are broadcasting this moment to the world. \n\nShe wanted to deliberately fall down or pretend to limp in, but the court bailiff helped her to the bench, which made her trick meaningless. "
  Chihong.43.a: "And so, the long-awaited trial has begun."
  Chihong.44.t: "Destined"
  Chihong.44.desc: "Under the gaze of the national emblem of the People's Republic of China and Sun Yat-sen, the prosecutor, judge, and defense counsel walked into the courtroom. The gavel fell, and the entire courtroom quickly became quiet. Only Tsai Ing-wen was so scared that she almost couldn't stand.\n\nThen, after the judge read out the court rules, the prosecutor stood up and began to read the indictment word by word. But the woman just quietly clasped her hands on the wooden railing of the defendant's seat, gritted her teeth, and only heard this sentence clearly:\n\n"Tsai Ing-wen and her accomplices have long accepted foreign help, ignored the laws of the People's Republic of China, actively cooperated with foreign forces to promote Taiwan independence, organized illegal armed forces, and even actively accepted foreign armed forces to seek independence by force, disregarding the integrity of China's territorial sovereignty and the safety of people's lives and property, and have constituted the crime of splitting the country and treason. The above charges are clear in facts and sufficient in evidence. According to the Anti-Secession Law, the Criminal Law of the People's Republic of China, and the Criminal Procedure Law of the People's Republic of China, they should be sentenced to life imprisonment. "\n\nAfter hearing what the prosecutor said, she could no longer stand, hunched over, and held onto the railing, barely managing to keep herself from falling."
  Chihong.44.a: "A fitting ending."
  Chihong.45.t: "Cabbage and Truth (II)"
  Chihong.45.desc: "The changes began one morning after the 20th National Congress. The school party secretary and two young men in jackets knocked on the door of his 10-square-meter study. Various materials and notes were piled up on the peeling wall. "Professor Chen, the Central Committee has just issued a document on strengthening the construction of Marxist disciplines," the secretary handed a red-headed document to his desk, "Do you think we should reopen the research room? ”\nNow his lecture notes are printed on coated paper, with the words "Research Center for the Sinification of Marxism" embossed on the gold-plated school emblem. Last week, when I went to Beijing for a meeting, the newspaper of the day was placed on the seat of the high-speed rail, and there was an interview with him in the lower right corner of the front page. In the photo, Professor Chen was in high spirits and complacent, and the caption read: Senior scholars of Wuhan University talk about theoretical innovation in the new era.\nWhat impressed him most was the change in the attitude of teachers and students. In the past, he always sat in the west corner to eat alone, but now as soon as he sat down, someone came over with a tray: "Mr. Chen, the historical materialism methodology you talked about last time..." Even Professor Zhou from the School of Economics, who always laughed at him as an "old antique", came to borrow his edited "Chronology of Marx and Engels" last week.\nAfter get off work in the afternoon, he went to the ideological and political area on the third floor of the library as usual. The sunset passed through the colored glass, and the bookshelves were also reflected with golden light. When the administrator girl saw Professor Chen coming again, she whispered: "Teacher Chen, the newly arrived Russian original version of "The Complete Works of Lenin" is kept for you. "When he thanked me, he saw out the window that several students were posting notices for the "Shou Ming Academic Thought Seminar" on the poster board. The reflection of the wet ink was like the surface of a lake in spring.\nSuddenly, he remembered that snowy day in 1997, when he took three months of pension and took a green train to Beijing to buy used books. In front of the stall in Panjiayuan, the old man selling books held the original German version of "Anti-Dühring" and asked: "Do you really want to buy it? It's enough to buy cabbage for half a year." He put his frozen red hands into his sleeves, exhaled white air and said: "
  Chihong.45.a: "If there is a cabbage that can grow into truth, I would be willing to grow it for the rest of my life."
  Chihong.46.t: "Believe"
  Chihong.46.desc: ""I probably won't dare to go back to that village forever. Because I don't know how to face that scene, the lame old village chief with a group of villagers, respectfully looking at me, a failed oriental liar, and asking those questions..."\n"......"\n"'Namaskara, the captain has been away from here for eight years, why don't you see the young man of the past? Why doesn't that singing boy write letters? The hunter died by the forest last year, waiting for his son who could shoot arrows at a hundred paces. The filial son's mother died in the winter of the year before last, and his father was still waiting for him to come home. The old friend's daughter was blessed to get a good son-in-law who didn't ask for a dowry, and now she is just waiting for him to come back to enjoy the family..."\n"How can I say it? The singing youth was torn to pieces by the artillery fire, and the hunter's child was pierced by a stray bullet. The filial son blocked seven blows for me. The old soldier fell in front of the enemy...""How can I say it!" "How can I say it? "\n"Do you want me to tell them that the communist ideal is a lie? Do you want me to tell them that those comrades in China who claimed to want common prosperity don't believe it now? Do you want me to admit that so many lives and their sacrifices were in vain? ! ! "\nThe young man finally understood. Why could this man, this scarred captain, endure such great pain without saying a word? It turns out that there is real pain. And here, he gently asked: "Don't you still believe it?" \n"But, Chairman! What's the use if I am the only one who believes? They don't believe it anymore, they don't believe it anymore! What's the use if I am the only one who believes it? ! ! "\n"That 'they', which 'they' are they?" The young man asked back. \n"Is it the Chairman who is high in the temple? Is it the nearly 3,000 deputies to the National People's Congress? Or the billions of migrant workers in China and even the world? "\nThis may be a phantom from the future, or a certain obsession from decades later. The young man does not know what will happen after his death, but he vaguely feels that all this has a deep connection with himself."
  Chihong.46.a: "He reached out and grasped the captain's wrist."
  Chihong_46_tt: "“Then go and see what they will ask you.”"
  Chihong.47.t: "Our Future"
  Chihong.47.desc: "The villagers saw us coming. Some were surprised by the young man's appearance, some noticed the scars on my body, and some saw the dusty and scarred team following us.\nI couldn't understand what the young man did and said. He was a great man unprecedented in history, and I was just a madman like Don Quixote. I was dragged to a point where I had no way out, so I could only walk out behind him timidly, ready to face the upcoming trial.\nI thought I would hear complaints, face questions, and endure countless "whys". Why couldn't I bring back their relatives? Why did I let this team be so embarrassed? I'm afraid that many old men would question him with tears in their eyes after checking, "Where is my child? Where is he? ″\nThere were indeed old men who came to me in tears after finding the entire team, and some of them even held the hands of young boys. If not only the old father asked his son, but the boy also asked about his brother, I would probably be like Xiang Yu in the past and kill myself.\nI looked around, and as I imagined, it was still the lame village chief of the past. He really brought a group of old and young and walked respectfully in front of himself, a Chinese liar.\nBut it was not the village chief who spoke, but the old men who came to me holding the young boys.\nHe was full of tears, but there was no complaint. He just choked and put the boy's hand in mine. He told me: "It's okay, this is my second son, he can also work for the future of us 'untouchables'."\n...\nThe gradually disappearing figure smiled at me and said: "
  Chihong.47.a: "“When I struck the water, I didn’t believe that it would be gone today.”"
  Chihong.48.t: "Fragment"
  Chihong.48.desc: "Time flows, the light changes, the damp jungle smell hits his face, the smell of soil after rain mixed with the metal smell of guns, he stretched out his hand, rubbed two fingers gently, hesitating whether to leave.\n\nCountless fragments flashed back in front of him, when people in suits and leather shoes in the luxurious hotel toasted and drank, the undisguised sarcasm and anger in the eyes of the man when "dividing the cake", the uniformed officers escorted the newly appointed officials to take office, and the indignation and unwillingness of the man who was accused by everyone in the first scene. After that, the man left.\n\nThe young man didn't know when this man went to South Asia, and he was the head of the international aid force that spontaneously left China. He just guessed his ending.\n\nThe picture was reorganized in front of him, and the air was filled with gunpowder and blood. That was the taste of war and death.\n\nHe raised his eyes, and sure enough, the man he didn't know was leading the army to a great defeat and huddled in a corner of the village."
  Chihong.48.a: "Go over there."
  Chihong.49.t: "No complaints"
  Chihong.49.desc: "The man's body was covered with bandages. None of the bandages were white, but blood red. It looked like he should be in pain, but the man just sat on a protruding boulder without saying a word. The adjutant who bandaged him complained and asked him:\n\n"Now we're defeated. Are you happy? Everyone says you're crazy. Why did you insist on fighting an impossible battle in a foreign country? \n"..."\n"Who says ideals can defeat reality? Who says the people are the source of power? You want a fair world, but the world itself is not fair."\n"..."\n"The village ahead is where you once promoted your ideals and launched the first uprising. Do you have the courage to go and have a look?"\nThe adjutant was still complaining. His words were not pleasant to hear, but there was no resentment on his face. \n\nThe young man looked at the man. He realized that he was just a shadow in this memory, a passer-by. However, he never expected that the man covered in bandages would look up at him. "
  Chihong.49.a: "“…Chairman.”"
  Chihong_49_tt: "The old memories flooded into his heart."
  Chihong.50.t: ""
  Chihong.50.desc: ""
  Chihong.50.a: ""
  Chihong.51.t: "Farewell"
  Chihong.51.d: "It was a day like any other, a sunny day, with birds singing and flowers blooming, Beijing's scenery was intoxicating, and the crowds were bustling.\n\nOn Tiananmen Square, the pines and cypresses were still green, and the red flags were fluttering in the spring breeze. Under the Monument to the People's Heroes, thousands of people stood in silence. This morning, the old man who had been sleeping in the Crystal Hall for nearly half a century will follow his last wish and embark on his journey home.\n\nEight honor guards dressed in dark green military uniforms, carrying black coffins on their shoulders, walked out of the memorial hall slowly. The coffin was covered with a bright red party flag - the flag that the old man had fought for all his life, and at this moment it was like a leaping flame in the morning light.\n\nOn Chang'an Avenue, a convoy of several hearses slowly drove by. The farewellers on both sides held white flowers in their hands and looked determined. They no longer cried bitterly like they did in the past, and they were no longer at a loss. Instead, they watched this man who changed the fate of China with a shocking solemnity and calmness. The last journey of a man. When he passed away, the people wept in confusion about where the country was heading. Now, the new generation of Chinese Communists has not let the people down - we are his disciples, and his spirit will be remembered by us. The motherland will never forget it, and the people will not forget it. \n\n"The East is Red, the Sun Rises..." The song rang out in the crowd, but it was not as high-pitched and passionate as in the past, but with a bit of tenderness and remembrance. Some old people sobbed softly, some young people raised flags silently, and more people just held white chrysanthemums in their hands and watched the hearse go away quietly. \n\nIn the Babaoshan Revolutionary Cemetery, the last wisp of smoke came out of the furnace, and was blown by the breeze, and then turned into dust and scattered into the embers all over the mountain. The ashes were carefully placed in a white porcelain urn and escorted south by a special train, rushing to the Xiangjiang homeland that he had been dreaming of. \n\nHe finally stepped down from the altar and went to the people he loved deeply. "
  Chihong.51.a: "Yu'er, Mao Zedong is here to apologize to you."
  Chihong.51.b: "Another victory of dialectics."
  Chihong.52.t: "Monument"
  Chihong.52.d: "The train slowly pulled into Xiangtan Station. The platform was already crowded with people who came to see him off. Thunderbolts shook the sky and red flags fluttered. Just like a hundred years ago, wherever he went, from Beijing to Xiangtan, there was such a scene on both sides of the railway tracks. People gathered spontaneously, as if welcoming an old friend who had returned from a long journey.\n\nOn the bank of the Xiangjiang River, the breeze blew across the river, raising layers of ripples. The crowd on the river bank stretched for more than ten miles. There were Tibetan elders wrapped in white Hada and holding portraits, there were foreign comrades with blond hair and blue eyes, and more were young people full of vigor. They stood silently. , watching this solemn moment. Hu Chunhua personally picked up the white porcelain urn and gently scattered the ashes into the center of the river. \n\nAccompanied by the sound of "The Internationale", the ashes were scattered on the river surface and merged with the rolling river water. Between heaven and earth, all things return to one, heroes return to the people, and revolutionaries return to the earth. On this day, there were no complicated ceremonies, no grand salutes, only the surging river, quietly flowing eastward. \n\nAs dusk gradually rose, the farewell crowd began to disperse. A little boy took the teacher's hand, looked up and asked: "Teacher, why don't we erect a monument for Grandpa Mao? So that everyone can remember him." \n\n"Child, look at this surging river, look at the factories and farmlands on this land, and look at these happy people. The truth that Chairman Mao taught us is the truth that makes the poor stand up and the belief that workers should be the masters of their own affairs. These truths that will never change are his monuments. Even after thousands of years, the passage of time, and the shift of stars, they will never be erased and decayed.""
  Chihong.52.a: "If one day the evil fog comes back, please... use this monument as a shield."
  PRC_20big_effect: "§RChina's fate will be decided here......§!"
  PRC_tfr_china_end_tt: "§RWhen the mountain flowers are in full bloom, he will be smiling among them§!"
  
  china.1702.t: "Failed terrorist plot"
  china.1702.d: "Urumqi International Airport, Terminal T3 Arrival Hall.\nThe morning sun shines in through the glass curtain wall, casting a thin strip of light on the marble floor. Li Ming, the customs officer on duty, is routinely checking a passenger on a connecting flight from Tehran.\n"Next."\nA tall, thin, middle-aged man walked to the inspection counter. He was wearing a loose gray windbreaker and holding a black suitcase that looked new in his right hand. Li Ming noticed that there were fine beads of sweat on the man's forehead, even though the central air conditioning in the terminal was turned on very well.\n"Passport."\nThe man handed over a dark green Iranian passport, his fingers trembling slightly. Li Ming took the passport and checked the information in the system. Everything seemed normal, but his professional intuition told him that something was wrong.\n"Please open the suitcase for inspection."\nThe man's Adam's apple rolled noticeably: "This... these are just some ordinary clothes."\nLi Ming maintained a calm tone: "Routine inspection, please cooperate. "At the same time, his left hand had quietly pressed the alarm button under the table.\nThe man seemed to be hesitating whether to turn around and run away. At this moment, two men had quietly approached the inspection desk. They looked like ordinary passengers, holding mineral water bottles in their hands and chatting with each other.\nWhen the man finally realized that he was surrounded, his expression suddenly twisted. He pushed the suitcase open and stretched his right hand to the inside of his windbreaker. But before he could take out his weapon, he was kicked on the right hand by the first man, and the other man quickly pounced on him and pressed him under his body, tying him up tightly.\nThe whole process was so fast that the passengers around didn't react to what happened. It was not until the SWAT team rushed into the hall with live ammunition that people realized that they might have just avoided a disaster.\nThe explosion-proof robot arrived at the scene quickly. After inspection, the suitcase contained a carefully disguised improvised explosive device that was enough to blow up a medium-sized building. Tickets for the Beijing National Stadium and detailed hand-drawn floor plans were also found on the suspect.\n"Allah will punish you! "You have desecrated the land of Allah!" the subdued man shouted in stiff English. He raised his head and roared wildly.\nNo one paid attention to his shouting. Li Ming looked at the rising sun outside the window and thought that the world was finally moving towards light, no matter how those lunatics hiding in the dark struggled.\nSubsequent investigations showed that the terrorist belonged to an extremist organization. They could not accept changes in their country, let alone such changes affecting the entire West Asia region. But their crazy behavior could not change anything except arousing people's disgust."
  china.1702.a: "They shout for Allah, but their hearts are filled with greed."
  china.1703.t: "Aid reaches West Asia"
  china.1703.d: "A series of transport convoys carrying relief supplies and construction equipment are passing through the mountains of Afghanistan and Iran. This is the first batch of large-scale aid since my country launched the reform movement to the socialist countries in West Asia.\n\nEngineers and doctors squatted in the carriages, flipping through notes on learning local languages. The engines of trucks loaded with equipment roared as they moved along the winding mountain roads. Someone hummed an old song:\"We workers have the power..."\n\nIn the village below the mountain, children looked at the huge convoy curiously. A young worker jumped out of the car and distributed candy to them. The old people stared into the distance, as if they saw the hope of change.\n\nThis batch of aid not only brought tangible materials, but also brought progressive ideas. Medical teams will go deep into the villages, engineering teams will build roads and schools, and agricultural experts will improve farming techniques.\n\nLocal progressive forces are waiting for this team. They know that this is not a one-time charity, but the beginning of long-term cooperation. The seeds of change are taking root and sprouting in this ancient land."
  china.1703.a: "Let the seeds of socialism take root and sprout in West Asia"
  china.1704.t: "Aid to West Asia Completed"
  china.1704.d: "OK"
  china.1704.a: "Confirmed"
  china.1709.t: "Set off again"
  china.1709.d: "Workers of the world, unite!\nComrades! Today, we announce to the world with great excitement: China will once again take up the banner of world revolution! The flames of revolution have been ignited again!\nLet those who shout that revolution is dead open their eyes and see!\nDecades ago, we sang the Internationale to support the world revolution. Today, we blow the assembly call again and call on the oppressed people of the world!\nThe iron hoof of imperialism is still raging, and the shackles of capital are still heavy. However, the flame of revolution has never been extinguished! It flickers in the ruins of Gaza, burns in the jungles of Africa, and jumps in the valleys of Latin America!\nToday, the death knell of the old order has sounded, and the dawn of the proletariat has arrived. Comrades! Let us pack our bags and set off again!\nThe great slogan of the workers of the world, unite, will once again resound through the sky!\nPeople's Daily"
  china.1709.a: "The wheel of history rolls forward!"
  china.1710.t: "The spark that never fades away"
  china.1710.d: "In the morning light of Bangkok, a bright red flag was rising slowly. Sarah, who was over 60 years old, stood by the Chao Phraya River, looking at the flag that symbolized victory, with tears in his eyes.\nMore than 40 years of guerrilla experience seemed like yesterday. He still remembered when he was 20 years old, when he had just joined the revolutionary team and was full of ideals to change the world. He remembered the trembling of holding the gun for the first time, the first rainy season in the jungle, the laughter and singing of his comrades, the voices of the older comrades teaching simple revolutionary theories, and the clanging sounds of the masses in the base area when they were plowing the land.\nLater, there was a long period of darkness. He still remembered the despair of the 1990s, when the news of the disintegration of the Soviet Union came, and many old comrades laid down their weapons. "Maybe we were wrong," they said, "maybe this road is not feasible. "One after another, the comrades left the jungle, some returned to the city, and some died silently. Whether it was singing, laughter or the calls of the masses, everything seemed to have returned to silence. At that time, he often sat alone by the campfire, looking at the dancing flames, accompanied by the faint chirping of insects in the forest, thinking of those faces that he would never see again. But he and a few comrades still insisted on fighting in the jungle, even if there were only a few dozen people left, even if the outside world believed that the Thai Communist Party had died.\nNow, when he looked at the red flag, how could he not shed tears? This revolutionary road was so difficult. How many comrades fell, how many ideals were ridiculed, and how many times they were declared dead.\nOn this spring morning, he finally saw the dawn."
  china.1710.a: "A long-cherished wish has come true"
  china.1711.t: "Dawn"
  china.1711.d: "The cold is biting on the Yalu River. Lieutenant Li Zhenghao wrapped his military coat tightly and looked at the thin ice floating on the river. Last night, his superiors suddenly ordered to reduce the frequency of patrols, saying it was to "save manpower." This order came strangely, but he didn't dare to ask more. In the darkness, the sound of the river flowing was intermittent. He raised the night vision goggles, and there was silence on the other side of the river. At three o'clock in the morning at this time of year, even hares are hibernating. "Report to Comrade Lieutenant, there is no abnormality in the western section." The voice of the subordinate came from the communicator. "Got it. "He answered mechanically.\nI don't know since when, this sense of mechanicalness has permeated his life. Every morning at six o'clock, they line up, shouting slogans that no one believes in, and saluting the capital in the south. They are all acting, acting a play that everyone knows is a play, but no one dares to point it out.\nThe sky in the east is pale.\nHe suddenly noticed that there were strange ripples on the river. It was not a natural water flow, but... His pupils suddenly contracted.\nIn the darkness, countless rubber boats were silently crossing the river. In the night vision goggles, he saw a familiar figure. It was squad leader Zhang, who exchanged cigarettes with him at the border last week. PLA soldiers. \nAt this moment, squad leader Zhang was standing on the rubber boat in the front, with a neat battle formation behind him. \nLi Zhenghao put down the night vision goggles and showed a bitter smile. He finally understood. He understood why the border officers were so uneasy recently, and why there was that inexplicable order to reduce patrols. \n"Report, found in the east section..." A hurried voice came from the communicator. \nHe turned off the communicator. \nThe sky in the east began to turn red, like a splash-ink landscape painting that was ignited from the bottom. The morning glow dyed the river red and was also reflected on the helmets of the soldiers on the opposite bank. \n"Surrender!" He suddenly shouted at the river, and his voice echoed in the morning mist. \nThe rubber boat continued to approach silently. He threw away the rifle and raised his hands. At this moment, he felt that the burden on his body was finally lifted. For many years, they have lived in hunger and fear, numb in lies and deception. \n"We have been waiting for this day for a long time. "He said softly.\nThe first ray of sunlight penetrated the clouds and shone on his face. In the distant military camp, sporadic gunshots had been heard. But he knew that it would not last long. Because there were more people who had awakened like him than anyone could imagine.\nA rubber boat came ashore. Squad Leader Zhang jumped ashore and walked towards him.\n"It's better to come in time than to come early." Squad Leader Zhang said with a smile, handing him a cigarette, "Catch up with dawn."\nLi Zhenghao took the cigarette and took a deep breath. Yes, dawn. He looked at the eastern sky, where the red glow became brighter and brighter. "
  china.1711.a: "A new day has finally arrived."
  china.1712.t: "Broken Myths"
  china.1712.d: "To the General Staff: \nWe now report the summary of the "Shoot the Sun" operation and the analysis of the current situation. \nI. Summary of the "Shoot the Sun" military operation \nThe 82nd Army Group was the advance force, and the 78th Army Group and the 83rd Army Group were the left and right wings that crossed the Yalu River in the early morning. Under the full-scale detection of the Space Force, our electronic warfare forces accurately paralyzed the North Korean air defense system and communication network, causing its various troops to fall into a state of command chaos, almost paralyzing the North Korean command system. The border defense forces of the Korean People's Army surrendered without almost any resistance, and then the 425th Armored Division and the 806th Mechanized Division of North Korea successively laid down their weapons, which created favorable conditions for our army to advance rapidly \nIt is worth noting that the "Long March" system discovered the abnormal mobilization of the North Korean nuclear arsenal in a timely manner by analyzing satellite images and electromagnetic signals. Under the guidance of satellites, our special forces successfully raided and controlled the Yongbyon nuclear facilities, preventing possible extreme actions by the enemy. \nHowever, the Pyongyang Capital Garrison and the 105th Armored Division and the 8th Special Operations Corps put up a stubborn resistance. Our 81st Army suffered nearly 100 casualties when breaking through the Nampo defense line. Fortunately, the 83rd Army, under the cover of the Air Force and armed helicopter formations, made a detour from Wonsan, cutting off the main traffic arteries in the east of Pyongyang, forcing the defenders to give up further resistance. \nIt is particularly worth mentioning that the deputy commander of the 91st Capital Defense Corps of the Korean People’s Army took the lead in instigating an uprising and opened the passage to the underground command post of the Kim Dynasty. This provided key intelligence for our special forces to successfully capture Kim Jong-un\nDuring the entire operation, the coordinated operations of the Space Force, the Electronic Countermeasures Force and the "Long March" AI system demonstrated the comprehensive combat capabilities of our army in modern warfare and minimized our casualties. \nII. Results and Statistics of casualties\n-\tA total of 63,240 enemies were killed\n-\t378,910 prisoners\n-\tNearly 600,000 people surrendered and revolted\n-\t486 tanks and 417 armored vehicles were seized...\n-\t2,640 of our people were killed and 8,910 were injured\n3. Assessment of the current situation\nNot surprisingly, the attitude of the North Korean people towards the People's Liberation Army is relatively complicated. The situation in the border areas is better, but in the urban area of ​​Pyongyang, only about 20% of the people showed a welcoming attitude. What is more worrying is that in Sinuiju, Chongjin and other places, there have been many incidents of people storming detention centers where important members of the Kim regime are held. \nConsistent with pre-war analysis, this phenomenon is related to the long-term ideological control of the people by the Kim regime. Many people still regard the Kim family as "gods." When the "gods" collapsed, a sense of loss arose instead. . \nFourth, recommended measures\n1.\tPostpone the public trial of Kim Jong-un, and suggest that he be detained in secret first. \n2.\tIncrease the propaganda and education efforts for the North Korean people, focusing on exposing the crimes of the Kim regime, but the wording should be cautious to avoid stimulating national sentiment. \n3.\tPrioritize the restoration of people's livelihood supplies, especially food and electricity. The logistics department has been requested to speed up transportation. \n4.\tProper placement of officers of the Korean People's Army who surrendered may be given, and some of them may be considered for appointment in the new regime. \nFive, follow-up prospects\nIt takes time to break the deep-rooted personality cult. It is recommended that the headquarters adopt a gradual strategy in promoting subsequent reforms and avoid rushing. The top priority is to stabilize the people's hearts and let the North Korean people truly feel the meaning of liberation. \nI hereby report, please approve. \nThe commander-in-chief of this operation and commander of the 82nd Army Group\tLin Xiangyang"
  china.1712.a: "Before the public trial, Kim Jong-un's safety must be protected to avoid any accidents."
  china.1713.t: "Grievances Conference"
  china.1713.d: "In the suburbs of Chongjin, North Hamgyong Province, in an agricultural cooperative auditorium.\nOld man Park Hun-sik sat in a corner with a gloomy look in his eyes. In the past week, the People's Liberation Army has distributed warm steamed buns to the community every day and helped them with agricultural production every day. There has never been a shortage of water in the water tank. He had to admit that these were the days when he had the most food in many years, and they really didn't seem to be bad. But today, he was still dragged to this "grievance meeting" by his son.\nIn the front row of the auditorium, several arrested local officials lowered their heads, handcuffed on their wrists. The projection screen has been set up.\n"Comrades," the PLA instructor who presided over the meeting was named Wang, speaking not very standard Korean, "Today, we have to speak our minds and settle accounts. "\nPark Hun-sik suddenly stood up: "I want to talk about how American imperialism blocked us! If it weren't for..."\n"Old man," Instructor Wang interrupted him gently, "Do you still remember the days around 1995? "\nThe auditorium was silent. That was the nightmare of the "March of Hardship" that no one wanted to recall.\n"Let's watch a video first." The projector lit up. In the picture, a former Party Secretary of South Pyongan Province was explaining the problem. He described how local bureaucrats withheld relief supplies and used the aided fertilizers as a stepping stone to exchange for promotion channels, while ordinary farmers could only regress to small peasant economy.\n"After the collapse of the CMEA, North Korea lost an important source of oil." Instructor Wang explained, "But even in that case, so many people could have avoided starving to death. However, these people..."\nHe pointed to the officials in the front row, "What are they doing? Let's continue watching."\nA new picture appeared. It was a surveillance video of a senior official's home. While the people were starving, they were toasting in a mansion. The wife of an official complained that foreign cosmetics were out of stock and a special plane had to be sent to buy them.\n"I...I want to say." A thin woman stood up, "At that time, my husband worked in a steel plant. The factory trucks ran out of fuel and could only burn firewood. In the end, there was no firewood left and they had to rely on people to do it bit by bit. But the rations distributed to the workers..."\nShe couldn't continue. Suppressed sobs sounded in the auditorium.\n"Look at this." Instructor Wang switched to a new screen. It was a list of the property of a senior official: luxury houses, famous watches, foreign currency deposits... In the area under his jurisdiction, the farmers were just holding porridge.\nPark Xunzhi's hands began to tremble. He thought of those years, his brother who starved to death, and his granddaughter who died because of lack of medicine. And these people, these officials who were supposed to serve the people...\n"Kill them!" Someone shouted.\n"Shoot the corrupt officials!" Shouts came one after another.\nInstructor Wang raised his hand: "Fellow villagers, I understand your anger. These people will be punished by law. But more importantly, we have to think about why this happened? Who gave them so much power to do whatever they want? ”\nThe auditorium fell silent. People were thinking.\n“When a regime’s rulers only care about their own power and don’t care about the lives of the people. When carrying out radical economic reforms means shaking their power, they would rather let the people starve. Such a regime...”\nHe didn’t finish, but everyone understood.\n“Comrades,” Instructor Wang said, “It’s not that we don’t have the ability to live a good life. It’s that some people would rather let the entire country stagnate in order to maintain their own privileges. They are afraid that reforms will shake their rule, so they would rather let the people continue to suffer..."\nIn the auditorium, there were cries, sighs, and voices intertwined.\nThe next morning, in the crowded square, several gunshots broke the tranquility of Chongjin, followed by cheers that resounded through the sky. Those corrupt officials paid the price for their crimes.\nBut for the North Korean people, this is just the beginning. They finally realized that the real enemy is not just external forces, but the key is this distorted system itself.\nAt this moment, similar scenes are being played out in factories, rural areas, and military camps across North Korea. Lies are exposed one by one, and the truth is revealed to the world. In tears, regret, and anger, people finally see this absurd privilege system.\nAs the sun sets, the afterglow shines in through the windows of the auditorium. Park Hun-sik looked at the light and suddenly realized that he, like tens of millions of compatriots on this land, had been deceived for too long.\nAnd now, it's time to open your eyes."
  china.1713.a: "Finally saw the light."
  china.1714.t: "Sunset"
  china.1714.d: "Kim Jong-un, once one of the golden suns of North Korea, is the third-generation leader of the "Kim Dynasty". During his more than ten years in politics and leadership of North Korea, he has made certain contributions to the development of North Korea and the improvement of people's livelihood. However, at the turning point of history, some of his merits and contributions still cannot cover up the problems of the entire system and system of North Korea. His own trial and characterization are the focus of this public trial.\nThe morning sun in Pyongyang was already hanging in the sky. Kim Jong-un, wearing a black suit, was escorted by Chinese PLA soldiers to the May Day Sports Center in Pyongyang. During the trial, Kim Jong-un looked at the shackles on his hands and the streets of Pyongyang from time to time. The Chinese People's Liberation Army set up isolation belts and human walls on both sides of the street. Some North Koreans outside the isolation belts stood in place and looked at the supreme dignity of the past, some rushed to the trial site, and some cursed on the side. When the sun climbed to the middle of the sky, Kim Jong-un, who had been identified, unlocked his shackles with the help of the bailiff, and then he walked into the dock. "The criminal suspect Kim Jong-un, while serving as the president of the People's Republic of Korea, During his tenure as the supreme leader, he misappropriated state property for private use, condoned and shielded factional personnel for personal gain, embezzled international aid for personal gain, and transferred state assets overseas..." When the prosecutor read out the charges, Kim Jong-un acted indifferent. After the prosecutor finished reading, Kim Jong-un looked at the judge and said, "I, the former supreme leader of North Korea, Kim Jong-un, plead guilty, but I don't understand why, other cadres in our country have committed these crimes, but I have to be pulled out for a separate trial. Do Chinese comrades want to swallow up North Korea?" Obviously, Kim Jong-un was pretending to be confused, or he didn't realize what his problem was at all.\n"Our country has always been adhering to the idea of ​​curing diseases and saving lives. Since you don't understand, then we have to ask the representatives of the masses to accuse you." The judge at the trial seat signaled the assistant to leave. After a few minutes, several North Koreans in different clothes entered the courtroom.\n"I am a worker in a state-owned cotton mill in North Korea. More than 40 years ago, my son was the real owner of this position, but during the difficult period of the country, the factory had no money and nothing to give to the workers. The aid originally sent by the United Nations appeared on the black market, and the government refused to allow the United Nations inspectors to enter where I was on the grounds of national security. Finally, my son stole food from the factory director’s warehouse for food, and the factory director asked the security guard to shoot him for treason. When the vacancy occurred, I was asked to fill it, otherwise I would be…” The old worker with wrinkled hands and weather-beaten face described his situation, but he just narrated it calmly, as if the matter was very far away from him. After he paused, he pointed to Kim Jong-un and said, “Why, Supreme Leader, how can this slave-like household registration and job system be like socialism? Why do you treat your people like this?” But before Kim Jong-un could reply, the old worker put on a show. He waved his hand and left quietly...\nSeveral other representatives of the masses also expressed their grievances and confusions in front of the live broadcast of the public trial, and Kim Jong-un stopped talking and moving. Did he understand? Or maybe he understood, at least he knew why the Chinese government wanted to try him, so he turned to the judge and asked, "I am very grateful to the Chinese comrades for giving me the opportunity. At least I understand why I failed and was deserted by my friends and relatives." After that, Kim Jong-un laughed, but his laughter seemed miserable and absurd, "Then, can I know the result of my trial?" "This is not made by us, but by the people of North Korea. The people of your country are watching this public trial."... As the verdict came to an end, the sun also set, and the setting sun brought hope for tomorrow."
  china.1714.a: "A gunshot."
  china.1714.b: "Let him go to labor camp, and may he redeem himself."
  china.1715.t: "North Korea thaws"
  china.1715.d: "Xinhua News Agency, Pyongyang\nChina and North Korea signed the "Comprehensive Cooperation Framework Agreement" in Pyongyang today. According to the agreement, China will provide North Korea with all-round technical support and development assistance in many fields such as industry, agriculture and military.\nIt is reported that the first batch of Chinese technical experts will arrive in North Korea at the end of this month. These experts will go deep into factories and farms across North Korea to help promote production process reform. Among them, Hamhung Fertilizer Plant and Kim Chaek Steel Plant will be the first batch of pilot units.\nIn the field of agriculture, China will send agricultural scientific research personnel to introduce high-quality seeds and modern agricultural tools to help North Korea increase grain production. At the same time, China will share its experience in rice breeding and farmland water conservancy construction to help North Korea's agricultural modernization process.\nIn terms of economic reform, the Chinese Economic Advisory Group will assist North Korea in formulating a reform plan that suits its national conditions. It is understood that North Korea will deepen economic cooperation with my country and explore new models of opening up to the outside world.\nIn terms of military cooperation, the People's Liberation Army will send a group of instructors to assist the Korean People's Army Promote the modernization of the army. The two sides will carry out in-depth exchanges in the fields of military training and equipment maintenance. \n In the field of education, China will train nearly 1,000 technical backbones for North Korea. These talents will receive systematic training in key Chinese universities and will become the backbone of North Korea's development in the future. \n It is worth noting that the agreement particularly emphasizes the principle of "adapting measures to local conditions, independence and autonomy, and opposing big-powerism". China will fully respect the actual situation of the DPRK and avoid mechanical imitation. \n The Rodong Sinmun, the official newspaper of the Central Committee of the Workers' Party of Korea, published an editorial pointing out that this cooperation has opened a new chapter in the DPRK-China relations and will inject new impetus into the economic and social development of North Korea. \n Analysts believe that this agreement reflects China's in-depth thinking on North Korea's development path. Through gradual reforms, North Korea is expected to achieve a smooth transformation of its economy and society. \n It is understood that China and North Korea will also establish a regular meeting mechanism to summarize cooperation experience in a timely manner and ensure that various measures are implemented. \n Xinhua News Agency reporter\t Li Ming"
  china.1715.a: "Pleasant news"
  china.1716.t: "Volunteer Army of the New Era"
  china.1716.d: "September 12, 2024\tSunny\nAfter five hours of bumping on the dirt road, the jeep finally arrived at Xinxingli in North Pyongan Province. The slogan "March Construction" on the mud wall at the entrance of the village was mottled and faded, which reminded me of the similar slogans on the outer wall of the supply and marketing cooperative in my hometown in the 1980s. Director Jin held my hand and said "Dongmu", which is pronounced somewhat similar to the Northeastern dialect "comrade".\nSeptember 14, 2024\tRainy\nIn the morning, I followed Choi Young-sil, a North Korean doctor who studied in my country, to make rounds. There was only half a bottle of aspirin and some miscellaneous hemostatic tools left in her medicine box, but she had to give them to the three villages. Patients see doctors and receive treatment. Passing by the village primary school classroom, a dozen children were crowded in front of desks with bricks on their legs to write, and their pencils were so short that they could hardly be held. I touched the ballpoint pen in my backpack, and couldn't help but think about which class to distribute it to first. \nSeptember 20, 2024\tCloudy\nOn the day when the mobile clinic was set up in the threshing ground, seventy-year-old Park Amani lifted up her trouser legs to show me her swollen feet. The translator Xiao Jin suddenly got stuck and was sweating anxiously. I gestured for the old man to lie down, and suddenly remembered the sketchbook in my bag - I drew a heart and outlined the kidneys next to it. Amani's turbid eyes lit up, and she nodded and pointed at herself waist. \nOctober 5, 2024\tSunny\nWhen the first batch of greenhouse vegetables sprouted, the village organized the Korean Red Guards to guard them overnight. Technician Xiao Liu taught the cadres and farmers sent by North Korea to use straw ash to prevent insects. Forty-year-old squad leader Li drew circles on his notebook like a primary school student. In the evening, when I was leaving work and passing by the medical station, I saw Dr. Cui practicing acupuncture with a book on a human model. There were seven or eight women holding children lined up outside the faded blue cloth curtain. \nNovember 2, 2024\tSnow\nOn the eve of the return trip, Director Jin sent an enamel jar wrapped in red cloth. When I opened it, it was dried pollack, and the fishy smell was mixed with The salty sea breeze. The children from the village primary school stood in two lines at the entrance of the village, shouting "Thank you Chinese comrades" in the Chinese language they had just learned. When the jeep started, the corner of Dr. Cui's white coat flashed in the rearview mirror. She was carrying the medicine box we donated and was walking to other villages in the valley. On the way back, we passed the Taedong River, and fish were vaguely seen wagging their tails under the thin ice. I looked at the enamel pot in my arms and suddenly remembered that on the eve of leaving home, my father said that when he went to Pyongyang to help build a textile factory in 1992, the North Korean workers always secretly put the eggs for lunch into the lunch boxes of the Chinese technicians. Thirty years have passed, and this warmth is still flowing quietly under the frozen land. "
  china.1716.a: "The cutest person"
  china.1717.t: "Meeting in the Forest"
  china.1717.d: "In the twilight of the Ganges Plain, a PLA squad was advancing along a hidden mountain road. They were dressed in plain clothes, carrying camouflaged equipment, and walking on this strange and ancient land.\nCaptain Ju Zizhou glanced at the military multi-function instrument on his wrist, which showed that they had arrived at the scheduled meeting point. He took out the communication terminal, and the PLA soldiers immediately dispersed and stood alert in a combat posture. Then he quickly connected to the agreed frequency band.\n"The hands of workers," he said in English, "can smash all shackles."\n"The farmer's sickle," the radio responded, "will harvest the oppressed rice ears."\nThree minutes later, there was a rustling sound in the forest, and dozens of figures quietly appeared. They were men and women, wearing relatively uniform green coarse cloth uniforms, holding a variety of rifles in their hands. The leader was a dark-skinned young man.\nAfter the PLA and the guerrilla fighters saluted each other, "Hello, comrades. "The young man spoke first in English with a slight accent, "I am Rahul, the director of international affairs of the Bihar-Jharkhand Special Regional Committee." \n"Hello, comrades." Ju Zizhou stepped forward, "I am Ju Zizhou, the captain of the Chinese People's Liberation Army's advance team to aid India." \nThe two shook hands. In the dim light, their eyes flashed with a similar light. It was a tacit understanding that transcended language, skin color and national boundaries. \nRahul's team members gathered around and looked at the equipment of the PLA soldiers curiously. A young guerrilla smiled in broken English: "Comrades, you are really on time, not early or late at all." \n"Yes," a PLA soldier replied with a smile, "The People's Liberation Army strictly implements combat orders and arrives when they are told to! ”\nAlthough there was a language barrier, simple gestures and sincere smiles resolved the unfamiliarity. The two sides, who were a little awkward at the beginning, soon put down their airs and began to share gifts with each other. A guerrilla handed over a bag of homemade Indian tea from the base, and the PLA soldiers took out carefully prepared Chinese knots from their backpacks.\n"Comrades," Ju Zizhou explained in English, "this is our traditional Chinese handicraft, and each knot represents a different meaning. This long knot," he pointed to the complex pattern woven from red ropes, "symbolizes eternity and unity. May we be as closely connected as this rope and witness the dawn of victory together. "\nRahul and the soldiers carefully took the Chinese knot, and gently stroked the delicate patterns with their fingers. "Thank you," he said, "we will definitely carry it with us until the day of the victory of the revolution. ”\nAs the night deepened, wisps of smoke rose from the forest. A simple curry rice was cooking in the pot, and the aroma filled the forest. The bonfire reflected everyone's face. Although their facial features were distinct, they were all lit up by the same fire of ideals.\nSomeone suddenly hummed a familiar melody in a low voice. It was the tune of "The Internationale". Soon, more voices joined in. Some sang in Chinese, some in Hindi, and some in English. Different languages, but conveying the same belief.\n"Arise, ye workers from your slumber..."\n"Arise, ye workers from your slumber..."\nThe singing echoed in the jungle, startling a few night birds.\n"Tomorrow," Rahul pointed to the mountains in the distance and said when the singing subsided, "we will go there to carry out our mission."\nJu Zizhou nodded: "Let's go together. For the liberation of the working people and the destruction of the oppressors. "\nThat night, in the vast jungles of India, a group of warriors from different countries are writing a new chapter of internationalism in the new era."
  china.1717.a: "Today our homeland is Bihar"
  china.1718.t: "An old promise"
  china.1718.d: "Our Chinese comrades in the south have made an important request: to fulfill the promise made by Comrade Lenin in his 1919 Declaration to the Chinese People and return the territories seized by Tsarist Russia through unequal treaties.\nOn this issue, we face two choices - if we fulfill our promise, it will completely eliminate the historical barriers between China and the Soviet Union, and we will be able to better withdraw from the European situation, and at the same time show the world the difference between the new Soviet regime and Tsarist Russia and the revisionist Soviet Union, but it will also make us lose the strategic depth and excellent ports in Central Asia and the Far East. But if we refuse, we will certainly not lose all of the above, but I am afraid it will bring more unbearable costs in the future."
  china.1718.a: "We are happy to negotiate in a friendly manner with our comrades"
  china.1718.b: "They'd better take it with a sword"
  china.1719.t: "The New Great Wall"
  china.1719.d: "We have finally completed this huge project.\nFrom the banks of the Heilongjiang River to the foot of the Tianshan Mountains, a modern defense system has been built. This is not the ancient Great Wall built with bricks and stones, but a three-dimensional defense network composed of radar stations, defense fortresses, underground fortifications, anti-missile systems and mobile forces.\nIn the northeast, the new air defense missile system and the domestically produced Hongqi-19 missile form a double air defense network. The underground command post is hundreds of meters underground, and the command system can remain intact even if it is hit by a nuclear attack. The new long-range strategic radar can detect any air target 6,000 kilometers away.\nOn the Mongolian defense line, we have established a multi-level mobile defense system. The hundreds of kilometers of underground channel network allows armored forces to complete strategic deployment before the enemy detects it. Distributed supply bases ensure that the front-line troops can maintain their combat effectiveness even after being hit.\nIn the northwest , we have established a series of hidden military facilities deep in the Gobi Desert. The satellite navigation jammer system can render the enemy's precision-guided weapons ineffective. The underground airport can protect the air force in wartime, and a large number of bomber formations are enough to paralyze the transportation blood vessels of the "Big Bear" in Central Asia and Siberia. \nThis project, which cost hundreds of billions of dollars, mobilized more than one million builders and used the latest military technology. It is not only a military defense line, but also a political declaration: we are ready. \nThe latest assessment of the General Staff believes that this new Great Wall can allow our army to gain at least a week of strategic maneuvering time when it is attacked suddenly. This is of great significance for a possible two-front combat situation. \nI hope this line of defense will never be used. But if that day comes, it will make any enemy who attempts to invade our territory pay a heavy price. "
  china.1719.a: "It is truly a magic weapon to stabilize the country"
  china.1720.t: "The People's Liberation Army assisted the Korean People's Army in seizing power"
  china.1720.d: "Pyongyang, 4:00 a.m. When the first air defense alarm sounded on the front line, Kim Jong-ho, commander of the 1st Motorized Infantry Brigade of the Capital of the Korean People's Army, was making the final deployment with Major General Zhang, head of the Advisory Group of the Chinese People's Liberation Army. "The time has come." Major General Zhang glanced at his watch, "Are all the units in place?" "The 1st Motorized Infantry Brigade is in place." Kim Jong-ho nodded, "The 4th Motorized Infantry Brigade and the Capital Light Infantry Regiment are also waiting for the signal." "Very good." Major General Zhang pressed the call button, "Operation code: Dawn." At the general's mansion, two guards on duty quietly opened the courtyard gate. The captain of the guard, who had long been turned against, turned off the electronic monitoring system. The special operations team sneaked into the building like a ghost. In the master bedroom, Kim Jong-un was sleeping soundly. When he was awakened by the hurried footsteps, it was too late. The special operations forces had already blocked all retreat routes. "Don't move! "The captain said in a low voice.\nThirty minutes later, the main organs in Pyongyang had been controlled. The reformist officers in the People's Army who had been prepared for a long time quickly took over the command system. No Kwang-tie, Jiang Chun-nam and others were isolated for investigation. There was no bloodshed, no chaos, and everything was done quietly.\nWhen the first ray of sunlight illuminated the sky over Pyongyang, the new Supreme Command of the Korean People's Army had been established, and news of swearing allegiance from various troops came one after another. Kim Jong-ho watched Major General Zhang pack up the items on his desk.\n"Are you leaving now?"\n"Yes," Major General Zhang smiled, "This is your country, and you should govern it. Our mission has been completed."\n"Thank you." Kim Jong-ho shook Major General Zhang's hand, "Thank you comrades for helping us get rid of the cage."\n"You're welcome, comrade." Major General Zhang said, "Build your country well."\nOutside the window, the flag of the Korean People's Army was rising slowly."
  china.1720.a: "The True Glorious Revolution"
  china.1721.t: "The fate of Kim Jong-un"
  china.1721.d: "We have caught Kim Jong-un. Compared with his father, he did show a certain willingness to reform during his reign and ensured that the North Korean people had enough food and clothing. During the thaw policy, he also contributed to the improvement of Sino-North Korean relations, and although North Korea has thawed. He still has a good reputation among many North Koreans. All in all, he can get a gentle ending."
  china.1721.a: "Let him live out his days in Yuanshan Villa"
  china.1721.b: "Send him to a farm for forced labor"
  china.1722.t: "A letter from American comrades:"
  china.1722.d: "Dear Chinese comrades, we have been paying close attention to the situation in East Asia and have noticed the growing arrogance of the reactionary forces in Taiyo. This is a destruction of world peace! It is also the reactionary forces trying to extinguish our revolutionary spark! At this critical moment, we will stand firmly on the side of the communist cause, firmly support your struggle against the reactionary forces, and carry on Chairman Mao's cause to the last moment!"
  china.1722.a: "Thank you! I wish you all the best in your revolutionary cause!"
  china.1722.b: "Arm up! Defeat all reactionary forces!"
  china.1723.t: "A letter from Southeast Asian comrades:"
  china.1723.d: "Dear Chinese comrades, the night is long. Decades after the collapse of the Soviet Union and the ebb of the communist revolution, our great cause has suffered a heavy blow. Now, your rise has finally given us hope at the end of the night, but the situation is still not optimistic. Taiyo is constantly causing unrest throughout Southeast Asia. We have a premonition that a storm is coming, and this time, we will stand together through thick and thin!"
  china.1723.a: "Thank you for your support! No force can stop the united people!"
  china.1723.b: "Today we cheer for Sun Wukong, only because the evil fog has returned again..."
  china.1724.t: "A letter from Japanese comrades:"
  china.1724.d: "Dear Chinese comrades, thank you for your secret help, which has allowed us to resume the long-dormant revolutionary struggle. The reactionary Japanese imperialist government authorities are constantly oppressing and exploiting the interests of the people. They will never represent the will of the Japanese people!\nOur underground party comrades who have been planted in the Japanese army have collected news that the Japanese army is about to start action recently, and have sent it to you together with maps of major Japanese cities and some defense maps. However, due to the brutal suppression of us by the Japanese government, we will enter a period of silence and choose another time to fight.\nIf you are ready to liberate Japan, we will provide necessary help and absolute support! The future belongs to the people!"
  china.1724.a: "Thanks for your support. We have always believed that the people of our two countries can become friends."
  china.1724.b: "The wind of hatred roars overhead..."
  china.1725.t: "A letter from Indian comrades:"
  china.1725.d: "Dear Chinese comrades, the Indo-Pakistani war and joining the Pacific are another manifestation of India's imperialist ambitions! We will continue to persevere in the revolutionary struggle. At the same time, we are deeply concerned about the safety of the revolutionary spark, and we also look forward to the successors of Mao Zedong Thought to once again defeat all the sieges and cages of the reactionaries! Just like in 1953!"
  china.1725.a: "Thank you for your support. We will unwaveringly achieve our goals!"
  china.1725.b: "Long live Mao Zedong Thought! Long live the people!"
  china.1726.t: "A letter from an Australian comrade:"
  china.1726.d: "Dear Chinese comrades, the whole of Australia has become the most solid fortress of reactionary imperialism. We deeply regret this, but the Australian people still stand on the same front with the Chinese people. Our intelligence members have learned about the recent military action in Pacific and New York. We will plan to hold strikes, protests and marches to support you! Even if we shed our last drop of blood, we still demand liberation!"
  china.1726.a: "Thank you for your support. The anger of the people will break through all cages and shackles!"
  china.1726.b: "Be careful and safe, and we will meet at sunrise."
  china.1727.t: "A letter from European comrades:"
  china.1727.d: "Dear Chinese comrades, peace has left us forever. Under the shadow of war, the fate of the whole of Europe hangs on the edge of a knife... Although we don't know where the future lies, we always wish your revolution to last forever, and the world will eventually be filled with red flags!"
  china.1727.a: "Thank you for your support. May you finally be liberated! May peace last forever!"
  china.1727.b: "The weapon of criticism will be realized by the criticism of weapons."
  china.1728.t: "A letter from Russian comrades:"
  china.1728.d: "Dear Chinese comrades, I believe you have also noticed those bastards' little actions. They think they are not discovered? The situation in Europe is becoming more and more intense, attracting all of our attention. The help we can provide in East Asia is very limited, but once we are free, we will immediately provide you with practical help. Comrade Lenin and Comrade Mao Zedong are guiding us!"
  china.1728.a: "Thank you for your support! Long live the cause of communism!"
  china.1728.b: "Rise up! Great country..."
  china.1729.t: "A letter from African comrades:"
  china.1729.d: "Dear Chinese comrades, our struggle is a dark wilderness path, and you are the stars that guide us. We are always grateful for the deep friendship you have established with the African people. So, don't let the red flag fall! Let Chairman Mao Zedong and Captain Sankara be proud of us!"
  china.1729.a: "Thanks for your support! The Chinese people also care about the cause of the African people!"
  china.1729.b: "Sankara's spirit will never fall!"
  china.1730.t: "The "New Great Wall" was captured"
  china.1730.d: "You are a traitor to our great motherland. How could you allow the Russians to capture our New Great Wall?"
  china.1730.a: "The organization has already decided that you will carry the explosives and blow up the bunker."
  china.1731.t: "Russia has agreed to transfer the Outer Manchuria region"
  china.1731.d: ""
  china.1731.a: "This is a wise choice"
  TFR_MRC_at_value_MON: "Mongolian people's wishes:\n[?PRC_at_MON|2Y]%"
  china.1733.t: "The final result of the Mongolian referendum"
  china.1733.d: "After a series of promises and guarantees, the Mongolian government has agreed to join us and they will become part of our new autonomous region."
  china.1733.a: "Correct"
  china.1732.t: "The final result of the Mongolian referendum"
  china.1732.d: "The gap between China and Mongolia is like a mountain separating us. Now, we must rescue Mongolia from the quagmire of nationalism."
  china.1732.a: "The order has arrived, you can set off now"
  nlnews.556.t: "South Asian Upheaval"
  nlnews.556.a: "The giant elephant has been completely ensnared..."
  nlnews.557.t: "The Asceticism Ends"
  nlnews.557.d: "The dawn breaks through the Southeast Asian rainforests, illuminating this land scarred by history. The World Liberation International has completely shattered the carefully constructed chessboard of the Pacific Defense Pact, ending nearly a century of ascetic struggle for Southeast Asia's revolutionaries. The remnants of communist parties from various nations have emerged from the dense jungles, crossed the Mekong River, and marched out of the island thickets. The flames forcefully suppressed decades ago have reignited in the crimson tide. From Bangkok to Hanoi, from Jakarta to Kuala Lumpur, the entire corrupt old order of Southeast Asia has been set ablaze. The tyrants, oligarchs, and butchers of yesteryear now face their judgement amidst the bugle call of revolution. Concurrently, the Pacific Defense Pact is sadly realizing that the fruits of its years of meticulous management in Southeast Asia have been lost with the collapse of the old regimes. The maritime containment network, built upon the basis of the old First and Second Island Chains, has been pulverized by the crimson wave like a torn spider web, geographically dividing the PDP into three separate sectors and making effective military coordination impossible. Even international strategic experts most hostile to the WLI must admit that the PDP's crushing defeat is now a foregone conclusion."
  nlnews.557.a: "Ho Chi Minh, Aidit, Chin Peng, .......you can finally rest in peace..."
  nlnews.1.t: "Indonesian Civil War Ends!"
  nlnews.1.d: "The world's largest archipelago nation has finally reached a historical crossroads. The civil war in Indonesia, lasting several years, has drenched this thousands-of-kilometers-long tropical archipelago in blood. The streets of Jakarta once burned with fire, the jungles of Sumatra echoed with gunshots, and the villages of Borneo and Sulawesi were repeatedly ravaged by war. The old government was barely maintained by warlords and financial oligarchs, while the People's Army spread across the islands like a wildfire. Every poor person was a potential member of the People's Army, and every worker, peasant, and soldier was a future revolutionary. The corrupt and reactionary government was clearly no match for the poor majority of the nation. Ultimately, victory belonged to the revolutionaries, who, despite holding rusty rifles, possessed an unconquerable will. With the change of hands in Jakarta, the capital of Indonesia, the People's Army's red flag unfurled over the parliament building, announcing the demise of the old order. The new regime proclaims its intent to establish a unified Workers' and Peasants' Republic across the thousands of islands, reshaping Indonesia, the Land of a Thousand Islands, in the name of the people. Telegrams from Beijing and the World Liberation International arrived in Jakarta immediately, calling this a "historic day for Southeast Asia." At the WLI assembly, more and more voices began discussing whether this vast archipelago nation should be incorporated into the common revolutionary front to become one of the most vital pillars of the South Seas, and what kind of assistance Beijing and other socialist allies should provide to this new, stumbling red regime. Meanwhile, the atmosphere in the conference room in Tokyo froze to the core. The Pacific Defense Pact has lost Indonesia, a strategic pivot. The "fall" of Indonesia means the sea lanes from the Strait of Malacca to the Pacific are no longer secure. Geographically, the PDP is now split into two major theaters: South Asia and the West Pacific, forcing India and Japan to fight their own separate wars, unable to assist each other. Politicians in Japan and Australia have furiously denounced the new regime as "based on terror rule" and called for an acceleration of re-militarization in the Indo-Pacific region. The flame of the archipelago has become a prairie fire, and the crimson tide is surging higher and higher. In the terrified eyes of the old order's rulers, the Pacific is burning."
  nlnews.1.a: "The vast land is painted red!"
  nlnews.2.t: "Philippine Civil War Ends!"
  nlnews.2.d: "The Philippine Civil War, which lasted several years, has finally reached its conclusion. Under a baptism of iron and fire, Jose Maria Sison and his comrades led the New People's Army out of the Philippines' mountains and primeval forests, utterly crushing the corrupt and reactionary Marcos regime with irresistible force. Ruined palaces, fleeing dignitaries, and collapsed warlords—everything of the old Philippines has been reduced to yesterday's ashes by the wrath of the people. Today, the red flag of revolution flies high over Manila. The World Liberation International, composed of China and its allies, has issued warm congratulations, calling this "another piece of Asian land returned to the hands of the people." At the Shanghai assembly, participating nations are eagerly discussing whether the Philippines can join the World Liberation Organization as "a small friend of Great China," and are actively working toward this goal. The torch of revolution is crossing the South China Sea, igniting new hope, and rapidly becoming a prairie fire in Southeast Asia. However, on the other side of the West Pacific, the Pacific Defense Pact, led by Japan, has fallen silent. The defection of the Philippines means they have lost a crucial ally and military pivot in Southeast Asia. Media outlets and politicians have begun a barrage of criticism, accusing the new government of "human rights violations" and "political purges," and warning that this will be "a major disaster for regional stability." Yet, these voices sound more like the feeble excuses of losers for their own incompetence than well-founded criticism. The red archipelago stands amidst the Pacific's winds and waves, its fate now closely linked with the thousands upon thousands of oppressed peoples of Asia."
  nlnews.2.a: "Welcome, new comrade, to our family!"
  nlnews.3.t: "Malaysian Civil War Ends!"
  nlnews.3.d: "It appears the fate of Malaysia, south of the equator, has finally reached its decisive moment. Years of civil war have torn this fertile land into opposing camps: on one side, the reactionary authorities supported by financial conglomerates and the PDP; on the other, the People's Armed Forces, gathered from workers, peasants, and intellectuals. The contest of blood and fire was ultimately decided in the ruins of Kuala Lumpur—the clamor of the masses clearly drowned out the wails of the reactionaries. As the last government troops announced their surrender, the People's Army's raised red flag fluttered on the Petronas Towers. The new regime proclaims that this tropical land has finally broken free from the shackles of colonialism and the oppression of capital, and will use the "will of the people" as its sole standard to build a Malaysia for workers and peasants. The World Liberation International sent immediate congratulations, with Beijing calling the nation "another Southern brother who has stood up," and actively responded to the new equatorial partner's strong desire to join the WLI. The flame of World Liberation is expanding at an astonishing speed. In contrast, the Pacific Defense Pact organization laments the loss of yet another strategic position. Media in Singapore and politicians in Tokyo fiercely criticize and denounce the new government, accusing it of "maintaining rule through violence" and "trampling on human rights." But their anger is more akin to the resentment of having lost a chess piece than a genuine concern for the lives of the countless ordinary Malaysian people. Malaysia's future is destined to no longer be a vassal of the old world, but one of the protagonists in the creation of the new century—a century of workers and peasants, a century of the people."
  nlnews.3.a: "New Comrades, New Hope"
  nlnews.4.t: "Japan Declares Permanent State of Combat Readiness"
  nlnews.4.d: "To counter the growing threat of Communism, particularly the expansion of Chinese Communism, the Japanese government today announced that the nation is entering a state of permanent combat readiness. In a speech to the Diet, the Prime Minister emphasized that in the face of ideological erosion and escalating regional instability, Japan must take decisive measures to defend its national sovereignty, democratic values, and regional peace. The statement authorizes the government to implement a series of emergency measures, including expanding the Self-Defense Forces, increasing the defense budget, strengthening military cooperation with allies, and mobilizing key industrial sectors to support defense construction. A government spokesperson stated that these measures are intended to deter potential aggression and ensure Japan's capability to respond to any contingency. Domestic public sentiment is complex. While many support the government's strong stance, viewing it as a necessary means to defend the homeland, pacifists and anti-war groups are also staging protests, calling for diplomatic resolution of disputes to avoid repeating the mistakes of history. Regardless, Japan has taken a decisive step. This marks a major shift from its post-war pacifist policy and signals profound changes in the geopolitical landscape of the Asia-Pacific region. The whole world is watching to see what the future holds for this land that has been ravaged by war."
  nlnews.4.a: "Uphold the Emperor, Punish the Traitors"
  nlnews.4.b: "That savage *oni* (devil/Japanese soldier) has returned..."
  PRC_tfr_nl_china_multigov_tt: "The two factions at the upper level, who have differences on the allocation of power in government organs, have clearly formed two circles: the §AAuthoritarian Socialism-Politburo Faction§! and the §RDemocratic Socialism-NPC Faction§!. Making a choice for the corresponding faction will naturally increase the respective daily support rating and corresponding effects"
  PRC_tfr_nl_china_multigov_civ_tt: "The supporters behind the two groups have also quietly surfaced: the §pSocial Democrat-Moderate Faction§! and the §dTotalitarian-Hardline Faction§! are supported by the §APolitburo Faction§! and the §RNPC Faction§!, respectively. Generally, the two factions have significant differences in their ideologies, but expanding grassroots organizations can increase the influence of both."
  PRC_tfr_nl_china_old_hkway_tt: "We will begin preparations for the structural adjustment of the Special Administrative Region's personnel. The transition will take several years, and deployment of central personnel remains an option. The results and next steps will be revealed after §Y120§ days."
  PRC_tfr_nl_china_new_hkway_tt: "We will begin preparations for the abolition of the Special Administrative Region. The transition will take several years, and deployment of central personnel remains an option. The results and next steps will be revealed after §Y180§ days."
  PRC_tfr_nl_china_third_core_tt: "Hong Kong will be incorporated into Guangdong and become the province's third economic core. The next step is for Hong Kong to maintain its path of economic development and, with central government support, be integrated into Guangdong's industrial economic system. We will gain commercial output and factory bonuses, which will also require a period of coordination."
  PRC_tfr_nl_china_fifth_city_tt: "Hong Kong will become the fifth directly-administered municipality, maintaining a relatively independent status. The effect is: an increase in political power, stability, and a degree of social development, which will also require a period of coordination."
  PRC_tfr_nl_china_pandem_tt: "In the governance of Hong Kong, we will focus on cooperation with the moderate pan-democrats."
  PRC_tfr_nl_china_hksyndica_tt: "Shift the basis of rule, revitalize the Hong Kong Federation of Trade Unions, and keep pace with the reforms of the mainland."
  prcs.3001.t: "Multi-Headed Regime - Factional Composition (Government)"
  prcs.3001.d: "The internal political operation of the Chinese Communist Party (CCP) is not as clearly delineated as in a Western party system, but is composed of loose yet stable "circles." The political identity of an individual bureaucrat is often not fixed to a specific faction but rather shifts flexibly between multiple layers, forming a specific inclination through continuous deliberation. Following the collapse of the Communist Youth League faction, Hu Chunhua quickly pivoted, forming a tactical alliance with the party's left wing, using a reform agenda and a base of public support to re-establish his position. However, both the previous leadership collective he inherited and the strong conservative structure that has dominated the party's operation for decades compel him to offer a polite smile to the liberal-conservative faction that has shown him favor. It can be said that during his tenure, Hu Chunhua can only rely on the party's left wing and the liberal-conservative faction. Beyond these two, both the Hardline Conservatives, rooted in the tradition of the "Red Nobility," and the Reformists, represented by the market-oriented elite who rose during the Reform and Opening-up period, will be obstacles to his reform efforts. The former resent the dissolution of their privileges and resist, while the latter complain bitterly because the differing development path prevents them from seizing profits. It can be said that they are the party's primary adversaries. Currently, the core platform of the party's left wing is complete nationalization, the devolution of power to People's Congresses at all levels, and the promotion of grassroots democratic reform. The liberal-conservative faction, however, prefers to maintain the concentration of power at the Politburo level, reinforcing the "collective leadership" model to resist individual autocracy. While the two factions may find common ground on economic and social issues, their differences on the ultimate structure of power are significant. In the gap between these two factions, all Hu Chunhua possesses, besides the political capital gained from the wartime victory, is his personal ability to maneuver and coordinate. His own faction has long been weakened, and he himself is not a "princeling" like the previous few leaders, destined to be rootless like duckweed. Outsiders widely predict that Hu Chunhua is very likely to emulate his predecessors by voluntarily stepping down after completing a full term, ending his political career, and not seeking a third term."
  prcs.3001.a: "The die has been cast"
  prcs.3002.t: "Multi-Headed Regime - Factional Composition (Civilian)"
  prcs.3002.d: "The support base for this left-wing government should ideally be the broad proletariat and a section of the petit bourgeoisie. In reality, however, while the core support remains somewhat unstable, voices of opposition are gradually rising. In the civilian sphere, Hu Chunhua's tough stance against the liberal faction and his tolerance towards the left during his acting premiership have made him a target for the liberal-leaning mouthpieces. Capitalists and local powers have not forgotten his acquiescence to "mob" behavior, and conservatives view the situation with apprehension. Post-war, a propaganda war quickly erupted across the country, but the pro-government camp itself began to diverge. Thanks to China's mediation policy and the government's deft maneuvering, the academic dispute between Soviet Marxism and Maoism has temporarily subsided, with both sides uniting to counter the opposition. Nevertheless, the two major pro-government factions are gradually differentiating themselves in this confrontation. One is the Moderate Faction, which advocates for gentle reform, practices reformism, and seeks to advance the process of new-era socialism through compromise and operation. The other is known as the Hardline Faction, which insists on uncompromising implementation of people's democracy, resolute return to Chairman Mao's revolutionary ideals, and vows to realize and carry on Chairman Mao's legacy. These two currents of thought, circulating among closely affiliated mass organizations and left-wing intellectuals, are gradually permeating the party's grassroots. However, we cannot ignore that the two major factions in the party's high-level leadership are also secretly maneuvering behind the scenes. Ultimately, the situation is complex, the future uncertain, and the evolution of the political landscape will continue to face many challenges."
  prcs.3002.a: "It is not easy to observe, but harder still to act and overcome challenges."
  prcs.3003.t: "Removing the Fuel from Under the Pot"
  prcs.3003.d: ""Comrade Hu Chunhua." After the meeting, Yuan Jiajun remained seated. "We cannot follow the old path with the small temple that is Hong Kong." Hu Chunhua frowned and responded in a deep voice, "Then let's proceed with the established plan and begin discussing the SAR issue." Back then, Deng Xiaoping, for strategic considerations and external positioning (and perhaps personal enrichment), established the "fifty years unchanged" SAR system. However, the Hong Kong riots during the Taiwan Strait War caused considerable difficulty for the Republic. Now, this system has evolved into a sanctuary for vested interests, a channel for external forces to infiltrate and aid the party's opposition. Without tackling its institutional foundation, not only will local residents remain long trapped in a cage of financial oligarchs and judicial-legislative co-option, but grassroots democratic reform will also be impossible. "We have roughly two plans here," Yuan Jiajun said, flipping through a prepared document. "The first is to continue the previous administration's line: implement the incomplete regulations restricting Hong Kong people, allowing only pro-Party individuals and organizations to participate in Legislative Council elections, and only allowing individuals and organizations close to our Party's stance to run for the Legislative Council. Indirect control, low risk." "But won't this provoke a strong backlash from the locals, like in 2019?" Hu Chunhua asked, a little worried. "Our military, police forces, and intelligence system are much stronger than they were then. We can preemptively act at the slightest sign," Yuan Jiajun said, tapping the corner of the table. "Plus, by giving the locals some benefits, the cost of governance can be significantly lowered." Hu Chunhua did not immediately commit. He knew this was a feasible plan but still carried the inertia of "compulsory rule." Furthermore, were not the people of Hong Kong and Macau also children of the Party and the Republic? After a moment of thought, he inquired, "Is there a more thorough and long-term design?" "Of course," Yuan Jiajun smiled, pulling another document from his briefcase. "This is our proposed plan to abolish the SAR, a hardline approach that will, over several years, cancel the legal and institutional exemptions under 'One Country, Two Systems' and fully integrate Hong Kong into the national governance system. However, this step requires your decision." Hu Chunhua looked at him, his expression as composed as ever, his brow slightly furrowed. "Let me think about it.""
  prcs.3003.a: "The old plan is the most reliable."
  prcs.3003.b: "Let us completely eliminate the distance and estrangement between us and our compatriots."
  prcs.3004.t: "Blue Lotus"
  prcs.3004.d: ""Members in favor, please raise your hands." The light from the screen, like a cold water surface, flickered across Xiao Chen's face. He lowered his head, avoiding the light as one avoids a truth they are unwilling to face. His fingertips kept twirling the pen, but he hadn't written a single word on the paper for a long time. "Members abstaining, please raise your hands." "—None." The camera slowly panned across the venue, revealing the expressions of all 90 members. Some had a slight smile, as if they had long foreseen this moment; others simply raised their hands expressionlessly, like mechanical gears being engaged. A mainland-accented vote counter calmly repeated the numbers, the sound like the reading of a sealed verdict. "Members opposed, please raise your hands." "—None." "None. Passed." The voice of the Chief Executive echoed beneath the high ceiling of the Legislative Council, a condescending reverberation that hammered heavily into Xiao Chen's ears through the TV speaker. Over the past few months, he had watched several financial giants collapse with a crash, even though the news called it "market adjustment." On the other side, a few "patriotic" financial families remained rock-solid, even expanding further amidst the turmoil. He watched the pro-mainland members and moderate pan-democrats whisper in the hallway before the session, exchanging documents, occasionally patting each other on the shoulder. That tacit understanding reminded him of a suture thread used by a doctor during his appendectomy, forcefully sewing together two originally opposing pieces of flesh—sewn crookedly, ugly, but too tight to be undone. Hong Kong outside seemed to heave a sigh of relief. The words "freedom of speech" reappeared in newspapers and on the radio. Citizens could gather on the streets, and some even held up slogans previously considered taboo. Members occasionally appeared at rallies, posing for photos and shaking hands with residents. But Xiao Chen knew this was just an exchange for a bigger cage—the bars were painted a warm color, the door was ajar, and the air flowed better. But once anyone tried to fly out, the high-pressure behind the bars would instantly crush them. He turned his head and saw a faded light blue metal badge pressed under a clear glass box on the corner of his desk—a relic from a street action years ago. That day, someone in the crowd shouted: "The Blue Lotus will eventually bloom!" The voice was torn apart by the tear gas of the Sikh police force of the Governor's administration and washed into the sewer by the rain. Xiao Chen reached out to touch the badge. The cold metal made him shiver slightly. The city outside his window twinkled in the night, the neon lights painting the sky a sickly blue-violet. Hong Kong has passed through the dark years of 2019 and 2022. But on the rooftops, in the sea breeze, and deep in the alleys of this city, when will its own Blue Lotus finally blossom?"
  prcs.3004.a: "When will the Blue Lotus blossom in that world of freedom in my heart..."
  prcs.3005.t: "Old Joys Like a Dream"
  prcs.3005.d: "At noon, Xiao Chen walked through a Hong Kong factory, shaking hands with the worker representative, Old Liang. "Mr. Liang, we're here today to see if the worker comrades have any other needs." Having said this, he pulled out a pen and notebook from his pocket, making notes as he walked. Old Liang, with a grin on his dark face, walked alongside him, saying, "Mr. Chen, our worker comrades are very satisfied with their current pay, and the infrastructure regulations passed by the Legislative Council mean we no longer have to worry about our livelihood..." The two walked into the employee cafeteria, which retained the style of a Hong Kong-style *cha chaan teng*, but its service method and target audience were identical to the mainland's—special discounts for the elderly and children, and the price itself was not high. The lights were bright and warm. It was noon, and the workers were eating *dai tou fan* (rice with topping) and joking with each other. "No need to rush, you'll have an employee apartment eventually," Old Li, a neighbor, told Xiao Lu, a young man who had just joined the company. "I'm not even excited about getting paid," the young man Xiao Lu said. "Our Federation of Trade Unions is not as well-organized as the mainland's mass organizations. They organize and participate themselves. Unlike now, where even getting an employee apartment has to go through the Legislative Council." Xiao Chen wrote down this comment and sat down to eat. Honestly, the food was not outstanding, but the great thing was that it cost less than 20 Hong Kong dollars. Outside, that price would only get you convenience store cart noodles. After the visit, Xiao Chen received a gift from the Hong Kong Construction Workers Union—the seventh volume of the *Selected Works of Mao Zedong*, taught at their night school."
  prcs.3005.a: "When I met the person of my dreams back then, our temperaments were similar"
  prcs.3005.b: "Meeting a soulmate doubles the spirit, the heart is happy and without regret."
  prcs.3006.t: "Old Citizens, New Soil"
  prcs.3006.d: "After the last sentence was typed, Xiao Chen hit the Enter key, and the document was immediately uploaded to the server of the superior direct-reporting agency. He leaned back in his chair, let out a long breath, and vigorously rubbed his aching temples. This document carried exceptional weight. It formally ended the SAR system for Hong Kong and Macau in a legal sense. As a transitional arrangement, the central government has drafted the *Interim Local Law for Hong Kong and Macau Regions* to ensure a smooth transition and allow preparation space for the subsequent change in status. The subtlety of this regulation lies in giving local residents a buffer period—an adaptation window. Despite this, voices of opposition on the streets remain constant. As a native-born local, Xiao Chen often sees protest parades in the streets and alleys holding banners: "Oppose the Abolition of the SAR," "Protect Our Way of Life," "Hong Kong People Ruling Hong Kong." But all of this, in the face of the well-trained mainland military and police, is merely a wave hitting the shore—great in noise, but unable to form a storm. With the continuous injection of central government funds, the orderly relocation of some local labor, and the Legislative Council's successive promotion of infrastructure investment and the investigation of financial oligarchs' assets, the transformation is unfolding with the force of thunder. And among this massive institutional restructuring, the first to feel the change are the lowest-tier laborers, the silent majority. They are silent, pragmatic, and peaceful; they are the ones who created Hong Kong's prosperity. Xiao Chen could not forget the unconcealed joy on the face of his neighbor, Officer Chung, upon retirement, whose generous pension secured his later years; nor could he forget Aunt Li's teary eyes when she spoke of her child being able to attend an expensive local university; and he could not forget Old Li, the worker, sighing softly, as if reborn from his fate, when he moved from his landlord's small, dark "cage home"—sectioned off by half a balcony—into a spacious and respectable affordable housing unit. He took a sip of his now-cool coffee and looked at the myriad of lights outside the window. A ripple stirred in his heart—the ship of change had set sail, and the future truly seemed to hold infinite possibilities. Hong Kong, this century-old prodigal son, was finally on the path to becoming an equal part of the Motherland. "The Bauhinia fades, but the chrysanthemum still blooms every year, the west wind weakens, and the east wind continues to arrive constantly..." he hummed softly, getting up to pack his laptop bag."
  prcs.3006.a: "The sun sets but will climb up again tomorrow morning, the flowers wither but will bloom the same way next year."
  prcs.3006.b: "An acre of terraced fields accommodates thousands of residents, Guan Di looks across at the Heavenly Father"
  prcs.3007.t: "Below Lion Rock"
  prcs.3007.d: "Since the day the sea breeze blew from Victoria Harbour, the shadow of Lion Rock has intertwined with the glimmer of the Pearl River. The SAR boundary marker has been dismantled, the customs gates at the port are no longer closed, and Hong Kong—a city once independent of institutional barriers—has been integrated into the map of Guangdong Province. It will become the third core of development, a hub connecting the Greater Bay Area to the world. Crowds of people flow like tides. Merchants, artisans, dockworkers, and programmers move from Hong Kong to Foshan, Dongguan, and further afield; others move upstream, bringing Cantonese and Guangzhou cuisine back to the shores of Victoria Harbour. The barrier has disappeared, but the city's rhythm has not descended into chaos. Police lights still flash quietly, the night markets are still bustling, and the surrounding cities have welcomed unprecedented prosperity due to the shift in the development model. Hong Kong's laborers—both foreign and local—demonstrate the same focus and tenacity on construction sites, in workshops, and in offices. Guangdong's inclusiveness and cultural kinship have dissolved the linguistic and customary barriers that separated the two places for a century. We were, are, and will always be family bound by blood. Xiao Chen leans on the railing, looking at the opposite shore across the narrow strip of water, and smiles. For him, life is more stable; his days are no longer suspended in uncertain air. In people's conversations, words about the "past" are gradually fading, replaced by discussions about housing, education, and technology parks. Once upon a time, Hong Kong was the model for Guangdong's modernization. Today, Guangdong's technological transformation and social security system are charting the path forward for Hong Kong. Below Lion Rock, on both banks of the Pearl River, lights and tides converge—this time, there is no estrangement, only the steps of advancing hand-in-hand. Never before have we been so astonished by the sparkling waves of the Pearl River. We all drink from the Pearl River; how could the same mother river nurture two estranged children?"
  prcs.3007.a: "Fellow boatmen, we vow to follow, without fear or further dread."
  prcs.3008.t: "The Bauhinia Blossoms Anew"
  prcs.3008.d: "As the SAR restructuring work deepens, Hong Kong has taken the path of reform into a directly-administered municipality. As the fifth municipality, the Bauhinia has not withered as many expected; it enjoys unique policy advantages, and its historical culture is largely respected. Following the abolition of the SAR restrictions, close economic integration work has begun. If Xiao Chen has one particular feeling, it is that things have "slowed down." Previously, the people of Hong Kong seemed like a child with heart disease, cerebral thrombosis, and uncoordinated limbs, yet they were frantically struggling for their destiny and development. Now, they can finally lean on the mainland's embrace and assign meaning to themselves. They are Hong Kong people, but even more so, Chinese people. The new way of life is a sticking point for some executives and CEOs, but more of the masses have genuinely smiled—either because their hope for life has been reignited or because a long-dormant "dream" has been polished bright. The previous protests gradually subsided after the people experienced the benefits brought by the integration. After the Legislative Council was restructured into a local People's Congress, both the pan-democrats and the Federation of Trade Unions became local mass organizations participating in politics. A new consultative democracy replaced electoral politics. It is foreseeable that with deeper reforms for people's livelihoods, political transparency, and industrial transformation, the Hong Kong public's recognition of the Party and the Republic will continue to deepen, and they will soon be fully integrated into the Republic."
  prcs.3008.a: "The Bauhinia in my heart, blossoms with love, as one family."
  prcs.3009.t: "Lost Son"
  prcs.3009.d: "With a *pat-ta* sound, Xiao Chen hit the Enter key, sending the document to the superior direct-reporting agency, and closed his dry eyes. This was the draft document concerning the recent introduction of comprehensive political vetting into the Hong Kong civil service system. When this order is enacted, youths who participated in the two storms of 2019 and 2022 will be disqualified from applying for civil service positions. And for him, his strong support for the mainland in 2022 made him shine brightly in the eyes of the central-led steering committee, yet it also made him utterly hated in the eyes of the "independent democrats." Waking up this morning, he saw through the window that his car had been spray-painted red. When he tried to drive to work, he found his tires had been slashed. With no other choice, he could only take a taxi to the office to start his day. Does he regret it? No, he does not. The Legislative Council, urged by the central government, passed a work-hour limit law that had long been stalled in Hong Kong, and the central government also extended an olive branch to the moderate pan-democrats. The change seems to be silent, yet it is nurturing the vast majority of Hong Kong people... It would just be better if his neighbor, Officer Chung's, pension hadn't been delayed due to being dismissed by his company, forcing him to take a job in a *cha chaan teng* for his retirement; if Aunt Li's child could attend a local university without Aunt Li frowning over student loan worries; and if Old Li, the worker, wasn't sighing softly in his "cage home" because the restricted work hours with unchanged hourly wages were not enough to cover expenses... He sipped his now-cold coffee, looking out at the haphazard buildings of Hong Kong. The man-eating nature of that steel forest remains unchanged, and he, at times, doesn't know what the future holds for this metropolis. "Will prosperity and civilization remain hereafter? When will the black money, white eyes, gold cards, and deficits be changed..." he sang softly, tears involuntarily streaming down his face."
  prcs.3009.a: "When will the green footprint of youth and the iron curtain of the blue sea return..."
  prcs.3009.b: "Intent on growing flowers, but the flowers have no scent, and instead provoke hatred..."
  prcs.3010.t: ""
  prcs.3010.d: ""
  prcs.3010.a: ""
  prcs.3011.t: "Triumphant Advance"
  prcs.3011.d: "Party Secretary Chen and Mayor Wang exchanged glances, and then Mayor Wang, who was sitting in the center of the presidium, twisted the microphone open, cleared his throat, and said to the audience: "First of all, thank you all for coming to the first official general meeting of our Home of the People. Many of the daily municipal issues of our township government will be deliberated and discussed by everyone here. So, let's begin the first agenda item: for each representative to propose their motions..." The first person to speak was a college student in a white shirt. Party Secretary Chen, flipping through the motion this person had just submitted, recognized him as the leader of the "New Trade Union." "Thank you all for this opportunity. My motion is simple: I hope the township government can convert some old, unrented commercial premises into trade union stations; also, I hope we can establish a warm-heart canteen..." As soon as he finished speaking, half of the attendees applauded, accompanied by cheers in various accents. The other half who hadn't clapped suddenly seemed to wake up, their smiles twisting together like a tangled mess of duckweed on their faces. "Quiet! I said quiet!" A man in a sharp suit, wearing a Rolex watch, stood up. The muscles on his face twitched with anger as he glared at Mayor Wang, but he quickly changed his expression, speaking in a measured tone: "All of this, is it acceptable, Mayor Wang?" "I don't understand what you mean." "I mean, since this is about our local affairs. Representatives should be permanent residents born here, so why are these people mixed in?" As he spoke, his finger swept in the direction of "those people," as if he wished to draw blood. "Nonsense, this is the Home of the People, aren't they the people? Stop talking..." Party Secretary Chen grabbed Mayor Wang, and Mayor Wang suddenly realized and immediately changed his words: "Please don't attack our neighbors, okay?" But these words were like a basin of cold water poured into a pot of boiling oil, and the floor immediately exploded like popping beans. "We've given so many benefits to non-locals, and now they want to interfere with our affairs?" "Everyone is Chinese, how can you draw a distinction, don't you see what era it is?" "Stinking non-local, your XX mother!" "Son of a bitch!" "Damn your mother!" Finally, Party Secretary Chen could not stay seated. He immediately stood up and shouted into the microphone: "Everyone quiet down! We are not here to fight." The man in the suit instantly stood up, knocking over the small national flag ornament on the table. He pushed open the door and walked out. Then, the sounds of people standing up rose like a shower of rain."
  prcs.3011.a: "People filed out, leaving only the knocked-over national flag on the table"
  PRC_tfr_nl_pimi_tt: "§AAn attempt to initiate grassroots democratization. In the process, there will inevitably be demons and monsters attempting to steal the results. The central government can choose to have the military and police intervene to control the situation, or it can guide the masses to fight the grassroots vermin.§!"
  prcs.3012.t: "Dog Whistle"
  prcs.3012.d: "Wang Yuan held his breath and sharply blew the whistle in his hand. A subtle yet sharp sound flew in all directions, and then dogs of all colors and types seemed to emerge from the ground, running toward Wang Yuan. Then he pressed his palm down, and the dogs immediately squatted in front of him. "Well done, well done. Old Wang, no one here can surpass your skill in training stray dogs." Li Lizhi applauded. Wang Yuan glanced sideways at Li Lizhi, remained silent for a while, and finally spoke: "Old Li, my little tricks are nothing; it's just a dog whistle. But for some people, the dog whistle can command more than just a few dogs..." "What kind of background do these people come from? Their families must be very good at training beasts, right?" Wang Yuan sighed, turned around, and put his hand on Li Lizhi's shoulder, asking, "Old Li, have you been busy with your thesis lately?" "Yes, yes, I told you I came here to visit after finishing my work. You said you've been training dogs well recently. Is something on your mind?" "Let me show you something." Wang Yuan pulled out his phone and opened his Moments (WeChat feed). Li Lizhi is a little nearsighted. As he leaned closer, a few large characters jumped right into his eyes: "Those bastards who incite non-locals to invade the East should get lost!" Li Lizhi was startled. He quickly took off his glasses, wiped them for a long time, put them back on, and after looking for a while, he gasped. "Old Wang, what are you doing?" "Just showing you a dog training master. This 'stinking non-local' dog whistle is never tiresome to blow. See for yourself." Li Lizhi trembling took the phone, but as he scrolled further, he saw AI-generated images depicting "non-locals" dividing spoils in a grassroots democratic meeting, oppressing "pure citizens" under the backing of the Red Devils, and burning "the Great Beautiful City." At this point, not only his hands but his body also began to tremble with his heavy breathing. "What the hell is all this supposed to mean? What does 'poor beggars don't deserve a seat at the table' mean? They've suffered too much from transfer payments, and now the authorities are staging a fake democracy to completely let the non-locals in? And this one, look, what does 'letting poor beggars interfere with their democratic politics is like mixing sand into the grassroots, destroying democracy' mean? Is this something a university student would say? Moreover, aren't non-locals Chinese people? They have settled here, made such great contributions to development, and now they want to kick them out?" Li Lizhi fiercely grabbed his forehead, making his long-neglected hair even messier. Wang Yuan took out the dog whistle, shook it in front of Li Lizhi's eyes, and slowly began to speak:"
  prcs.3012.a: "There is a lot of this kind of stuff, it's everywhere."
  prcs.3013.t: "Fermentation"
  prcs.3013.d: "Dust rolled up from the ground and surged towards a corner of the sky, where it accumulated into a pagoda-shaped mass of dirty cotton wool. Then, carried by the rising heat, it came rolling, pressing down on people's heads and smacking against the windows. Chen Wensen wiped the window several times with a rag, but as soon as he finished, a new layer of ash immediately covered it. Below the window, several people dressed in black drifted past, followed closely by a trailer dragging a huge cardboard box. Ma Wensen was utterly annoyed and decided to hang the rag in the utility room of the bathroom. But as soon as he walked into the bathroom, several people who had been whispering immediately stopped, piercing the intruder with their eyes. He felt a sense of bewilderment; something hard seemed to be hidden under their clothes. One person held his hand behind his back, bent slightly at the waist, and stared fixedly at him. He looked askance at them, and they stared back. The rag was washed, wrung out, and hung on the hook, and Ma Wensen walked out. He walked to the entrance of the teaching building, where a wave of heat rolled in from outside. He was about to swipe his card to exit through the turnstile when he realized that the old security guard who always greeted him with a smile was gone, replaced by a stranger with dyed yellow hair. The stranger felt the unusual gaze, looked up, and gave him a contemptuous look. A chill crept up his spine. Ma Wensen quickened his pace toward the dormitory. Since the fire at the Home of the People a few days ago, the atmosphere in the city had suddenly frozen. He occasionally heard that people were hiding in the shadows, staking out workers who had joined the trade union or students who helped defend workers' rights, and dragging them into an alley for a beating when they were alone—and this was especially common near the university. Several people carrying black boxes and quiver bags rushed past, bumping into him and making his eyes spin with stars. The individuals, wearing black masks, offered no apology and immediately disappeared in the direction of the archery club. "Damn it... who are these people..." He rubbed his injured back, his rising anger instantly extinguished as if he had fallen into an ice cave: a few arrows had fallen from one of them, all with large armor-piercing broadheads. It was only then that he realized: although the pandemic had passed, the school was packed with all sorts of people wearing masks and face coverings—and those wearing black masks were especially numerous. And now, all of their eyes were fixed squarely on his face."
  prcs.3013.a: "The black clouds on the horizon congealed with the dust"
  prcs.3014.t: "Carnival (1)"
  prcs.3014.d: "The van-style police car shattered the deadly silence of the night. The siren slid across the street, drawing out many eyes hidden behind curtains and windows. The moon in the sky tried to peek out, but the black clouds pushed it back down. Under the dim streetlights, the specters gathered and grew, causing unease. Inside the vehicle, SWAT officers were reviewing a briefing on their police terminal. Captain Zhang Tianfang was silent. As the SWAT captain, he was accustomed to such nights, but tonight they were dealing with a group of students, and students who had kidnapped their own classmates at that. He couldn't help but sigh. The red and blue lights flashed alternately. A container house appeared in view, surrounded by several small villas. The windows of the container house were boarded up. Officer Chen from the local police station had been waiting there for a long time, holding a megaphone, patiently trying to persuade them: "Students, you are still young. Why do you choose the wrong path? If you have something to discuss, we can talk calmly!" But there was only deadly silence from inside, not a single sound. Captain Zhang and Officer Chen briefly exchanged information and quickly formulated a raid plan. While the uniformed officers continued their fruitless negotiation, the SWAT officers, clad entirely in black, split into two teams. One team, holding shields, stood directly at the front door of the container house. After a brief reconnaissance, they confirmed there was no immediate danger behind the door. The other team hid beneath the windows, their battering ram poised for action. At Captain Zhang's command, the two teams quickly breached the door. The building was torn open as easily as if it were made of paper. The SWAT officers filed in, seeing several elderly and young people with their eyes covered. And sitting inside the house were..."
  prcs.3014.a: ""
  
  prcs.3015.t: "Carnival (2)" 
  prcs.3015.d: "It went too smoothly. Zhang Tianfang yawned and instructed his comrades to escort the prisoners into the police van. The hostages were unharmed but couldn't utter a word, trembling uncontrollably, so they were helped into the police van to rest.\n\nSuddenly, a firework shot out from the darkness, and a shrill sound echoed in the air. Following this, a large crowd of people wearing black masks crawled out of the darkness and surrounded them. They held various crude weapons: hiking sticks, oil drums cut open to be used as shields, and sharpened wooden sticks.\n\nA riot, a very obvious riot. Zhang Tianfang raised his baton. The special police immediately formed a human wall with their shields, and the local police, under the command of Team Leader Chen, also prepared for battle, taking cover behind the police vehicles. Team Leader Chen immediately dove into a police vehicle to call headquarters on the police radio, but he found that the radio had been sabotaged. He pulled out his cell phone, but the signal had mysteriously turned into 'No Service'. A chill ran from his feet up the entirety of Team Leader Chen's body.\n\nZhang Tianfang raised a megaphone and shouted at the black-clad crowd, \"Disperse immediately, or we will use force!\" The black-clad crowd erupted in a cacophony of noise, which then quickly coalesced into uniform slogans: \"Release the innocent, punish the rogue police!\" \"Down with the bandits! Annihilate the gang!\" \"Give me back my freedom! Give me back the clear, bright sky!\" Stones rained down on the special police shields, and some bricks flew past them, smashing the windows of the police vehicles.\n\nTeam Leader Chen quickly walked up to Zhang Tianfang's ear: \"Team Leader Zhang, none of this is right. The radio is destroyed, and someone here is jamming the cell phone signal. We've been ambushed!\" Zhang Tianfang's body swayed for a moment, but he gritted his teeth and said to Team Leader Chen, \"We'll lead the way forward, and you follow in the cars. No matter what, we have to get out of here. We can call for support afterward!\"\n\nAfter repeated warnings proved fruitless, under Zhang Tianfang's command, the special police shoved hard against the black-clad individuals with their shields. Although the rioters were numerous, the fierce assault by the special police forced them to clear a path. The local police followed closely, wielding long batons to try and disperse the crowd. The police vehicles immediately followed, but a stray arrow, shot from who knows where, pierced a car window, terrifying the poor hostages who screamed non-stop. "
  prcs.3015.a: "Next Page" 
  prcs.3016.t: "Carnival (3)"
  prcs.3016.d: "The police broke through the crowd's encirclement and quickly got into the police vehicles. The shrill siren wailed again. The driver desperately drove forward, trying to leave the screaming crowd behind. The road was short, but at this moment, it seemed endless, like the road to the underworld.\n\nWhen the faint orange light appeared in their field of vision, those dots of light seemed to have a warmth to them. However, when they drove the car to the school gate, a school bus had completely blocked the exit, and next to the gate was a fence much taller than a person. The police quickly jumped out of the car and crouched down by the fence. They had the hostages step on their shoulders to send them over first, followed by the colleagues escorting the suspects. The two team leaders directed the people, ensuring their orderly passage.\n\nAs a police officer was about to climb over the wall, a stray arrow pierced his shoulder squarely. He instantly lost his balance and fell forward, but luckily, colleagues on the outside caught them. Another group of black-clad individuals immediately surrounded them again. A very large black-clad person charged at the police line with a shovel but was met with a fierce blow to the face, instantly falling to the ground and crawling back into his own ranks.\n\n\"Rogue police assaulting people! Rogue police assaulting people!\" \"Give us justice! Severely punish the murderers!\" \"Down with the murderers! Down with the totalitarian government!\" The crowd erupted in such ferocious cries again, and this time, they rushed forward like ghosts, slamming hard against the special police shields. One special police officer's mask was sprayed with a large can of paint, leaving him instantly blinded. The moment he took off his mask, a wooden stick jabbed fiercely upward, hitting him square in the face.\n\nAlthough the special police were well-trained, they were overwhelmed by the relentless assault of the rioters. A gap appeared in the shield formation, and the rioters seized the opportunity to completely break the formation, swallowing the special police in the human tide.\n\n`In the shadows, a carefully positioned camera quietly recorded everything. Soon, this footage would be edited, collaged, and replicated, and at an opportune moment, with an intentional green light, it would "wake up" every Chinese person. "
  prcs.3016.a: "And this is just the beginning"
  PRC_tfr_nl_china_kuanghuan_tt: "§RThe Unveiling of Fear§!"
  prcs.3017.t: "Black Clouds" 
  prcs.3017.d: "The black clouds, accumulated on the horizon, finally rolled over people's heads, propelled by the muggy air. The iron-like black clouds hung high in the sky, so thick they seemed about to drip water. At this moment, there was no wind, no sun, only the cicadas still shrilling desperately, but the heart-wrenching sound of the loudspeakers silenced even the cicadas.\n\n\"Gentlemen, everyone, hear me out!\" A young man in a black T-shirt and black mask stood on a minibus equipped with several loudspeakers, holding a microphone. The windows of the bus had been reinforced with iron rods and covered with one-way mirror film. The bus was surrounded by people also dressed in black and wearing black masks, who guarded the bus with crudely processed weapons and \"shields.\"\n\n\"In 2022, the so-called Cultural Revolution bandits crawled out of their graves. They stole the fruits of victory from the Taiwan Strait War to pave the way for their grand scheme of usurping the nation. Now, they use all sorts of means to plunder the wealth of us honest citizens and distribute it to those mobs and troublemakers to win over hearts. Haven't we given enough transfer payments to these outsiders, troublemakers, and mobs? Now they want to engage in this so-called democratic reform—it sounds good, but the result is just boosting the arrogance of these troublemakers, allowing them to rule us more savagely. These people are not truly Chinese, not Han Chinese. They believe in the German devils, two armchair intellectuals who only knew how to fuck their maids in their rooms, and they use their theories to slaughter us here in China. Starting from that Mao thief, that yellow-skinned Russian, these Cultural Revolution remnants have been buying off the lowest of the low, those pigs and dogs, to make them rise up and kill us innocent civilians. We finally managed to set things right, and now they are trying to come back to life!\" The young man grew increasingly agitated, raising his fist high and shouting slogans. Those beneath him holding weapons also began banging their shields, the booming sound shaking the sky.\n\nThe young man wiped the sweat from his head and yelled through gritted teeth, \"Our nation is about to be stolen by these ultra-leftist bandits. We cannot let these Cultural Revolution remnants and those pigs and dogs have it easy. We must rise up and fight! We must thoroughly defeat them and let them know that we, the Chinese, the Han people, are not to be trifled with! We cannot let the cold current of Siberia blow here again!\"\n\nWith that, the person took a portrait of Mao Zedong from beneath his feet and splashed a bottle of ink onto his face. Then, he threw Mao Zedong's portrait from the top of the bus onto the ground, and the black-clad individuals swarmed over it, fiercely stomping on the portrait. "
  prcs.3017.a: "Mobilize the Armed Police Force to maintain order, begin martial law!"
  prcs.3017.b: "Let's see the world turned upside down..."
  PRC_tfr_nl_china_heiyun_a_tt: "The situation must end before it becomes uncontrollable..." 
  PRC_tfr_nl_china_heiyun_b_tt: "Let's quietly await developments, more rats might surface...." 
  prcs.3018.t: "Red and Black (1)" 
  prcs.3018.d: "Torrential rain battered the streets, gathering into countless black streams of water. The manholes were blocked, and these black streams brazenly paraded through the city's main streets. Countless passersby tried to avoid them, struggling not to lose their balance in the currents. But the downpour had submerged everything; the black water roared down the main roads, wantonly destroying everything in its path.\n\nAn elderly woman, because she spoke with a slight suburban accent, was grabbed by her hair by several rioters and thrown to the ground. They punched and kicked her, spitting on her face. Storefronts that hadn't had time to pull down their shutters had their windows smashed by bricks. The national flag and the Party flag were torn down and thrown onto the ground, wantonly trampled by countless feet. Portraits of Mao Zedong were splashed with ink and defaced with black markers, while, incongruously, portraits of Chiang Kai-shek and the flags of the defunct puppet government appeared in the marching procession. There were also people holding red-and-black flags with a capital 'A' lying in the center, and some held portraits of unknown foreigners, whom they proclaimed to be great pioneers against the revisionist, wicked, authoritarian government.\n\nSuch incidents were everywhere. The already stretched-thin special police riot squads were overwhelmed. Some roads had been blocked by buses, and others were inexplicably under maintenance. Some units planned to mobilize via the subway, but several subway stations had their shutters pulled down, and staff were nowhere to be found. Some police stations were surrounded, and once the crowd receded, only completely destroyed police vehicles and gates remained. When some police officers tried to peek out of the windows, arrows or pellets immediately rained down on them.\n\nMany citizens watched all this in terror, hiding under windows and filming it with their cell phones. However, these videos couldn't be posted on social media channels; they were either rejected by censors or stuck in the queue for review, with no results forthcoming. The only videos currently going viral online were those titled \"Rogue Police Assaulting People,\" \"Freedom Fighters Defending Rights,\" and \"Citizens Offering Flowers to Freedom Fighters.\""
  prcs.3018.a: "This black tide grew increasingly rampant, lunging in all directions." 
  prcs.3019.t: "Red and Black (2)"
  prcs.3019.d: "The curtain of rain blocked people's sight, blurring everything between heaven and earth. There was no one on the streets, no vehicles, only the exterior facade of a shopping mall still playing product advertisements, the music echoing in the rain. At the intersection of this deathly silent street, a grey-black low wall seemed to stand silently, and on the wall, a splash of vibrant red was particularly eye-catching.\n\nRioters surged toward this intersection from all directions, blaring abrasive music from their speakers. \"Do you hear the people sing?\" was bellowed from their mouths. The flags of the puppet government, the Rising Sun of the former empire, the black 'A' flags, and the yellow 'snake' flags were enough to make one's eyes spin. There was actually something red there; they strode forward resolutely, intent on completely taking this intersection.\n\nThey broke through the curtain of rain, revealing the true nature of the low wall: countless silent people. Their faces were etched with countless scars by the years, their countenances, usually accustomed to meek submission, were now as heavy as iron; their hands were terribly distorted, the round-the-clock work in cubicles causing their hands to occasionally spasm; terrifying scars were exposed on their necks—skin that the sun had ripped from them. Countless people wore old, threadbare police patrol uniforms, filthy aprons, school uniforms that had been arbitrarily defaced but then had to be washed clean under the threat of teachers, and vests that had been their companions for decades. In their hands, they held branches, brooms, shovels, folding stools, pipe wrenches, or flagpoles.\n\nThe red flag, soaked by the rain, was no longer agile, but the standard-bearer waved it with an arm of iron. Beneath this banner was a crowd in a myriad of colorful clothes, speaking with various local accents. They were all gathered beneath this red banner, under the radiance of the five stars. Standing in the front row were men, women, the elderly, and the youth, but within this colossal entity, they seemed to share the same faces and the same names.\n\nRaindrops mercilessly battered them, but they stood firm and unmoving. They waited quietly for the arrival of these people; they had waited for a long time, and they were ready, despite being hastily organized, which was not an impediment." 
  prcs.3019.a: "On the barricade, our flag flies" 
  prcs.3020.t: "Red and Black (3)" 
  prcs.3020.d: "\"Folks, what are you doing?\" A black-clad rioter shouted at the human wall through a megaphone, but no sound replied to them except the pouring rain. So, the person changed his demeanor and spoke earnestly, \"Don't sell your lives for those Cultural Revolution remnants and troublemakers. Why should we work for their government? Everyone has their own lives to live, why make trouble for yourselves? Think about your own home!\"\n\nHearing this, a person walked out from the barricade. He was wearing a yellow helmet covered in cement dust, and his face was dark. His voice was hoarse and carried a local accent: \"Yes, I have two homes. One home was given to me by you. You gave me a stench-filled environment, a filthy kitchen, a rat-infested living room, a bedroom as narrow as a coffin, and you forgot to give me a toilet but didn't forget to give me a landlady who hounds me every day. The other home, though not spacious, is comfortable to live in; though not big, it is fully equipped; though inconvenient, no one is hounding me. This home was built brick by brick by my own hands; it was given to us, the poor, by our government, the government of the poor! When we were being beaten, did you ever speak up for us? You stole the opportunity for development from my hometown, and then you labeled us poor, stupid, clumsy, and easy to bully. We don't want anything you give us anymore, never again! We will take what we want for ourselves; we will stand up for ourselves!\"\n\nHis voice circled over the people's heads, overpowering the sound of the rain, the music, and the car alarms. It overpowered everything. The speakers were still playing \"Do You Hear the People Sing?\", but the lyrics were no longer being shouted by the rioters' mouths; only the speaker was performing a monologue.\n\nBoth sides fell into a deathly silence. The rioters were murmuring among themselves, and the slogans had stopped. 
  prcs.3020.a: "The black tide halted before the barricade" 
  prcs.3021.t: "Red and Black (4)" 
  prcs.3021.d: "The rioter with the megaphone nodded and let out a sneer. He then made a gesture to the people behind him, who immediately understood and raised the weapons in their hands. With a wave, several armed rioters rushed forward, screaming and yelling.\n\nUnder the red flag, a person with a white towel tied around their neck and a red armband on their arm raised a fist high. The citizens standing in the very front immediately crouched down, aiming one end of their long sticks towards the charging rioters, while firmly bracing the other end against the ground. Those standing in the back shielded the heads of the front row with everything they could find to block stones and bricks, whether it was promotional displays from the roadside or school bags; anything that could protect the people in front was utilized. Still others, armed with convenient short clubs and wrenches, waited, crouched, for their opportunity.\n\nWhen the rioters charged forward roaring, just as they had done countless times against the under-resourced special police, they believed they would now use their superior training to crush these \"troublemakers,\" having previously overwhelmed the special police with sheer numbers. Wrapped in the rain, they charged fiercely. One man, holding a samurai sword, raised it high above his head and rushed toward the people under the red flag. The red flag still stood upright in the rain, and there was not the slightest sign of wavering in the human wall beneath it.\n\nThe rioters surged forward but were instantly poked and knocked down by those wielding the long sticks. Some rioters hesitated when they saw the rows of \"spear formations\", but before they could recover, they were fiercely jabbed in the abdomen, chest, or face by the long sticks, or shoved onto them by the people behind. Then, those with short clubs immediately struck, delivering a fatal blow to the rioters still trying to break through the spear formation, knocking them to the ground. These individuals were immediately dragged into the crowd by countless hands reaching out from the human wall, gripping their ankles. They issued sharp, mournful screams as they were dragged into the human wall like dead pigs; not even a real slaughterhouse would have such sounds. They were hog-tied, gagged with towels, tossed to the side, and put under the supervision of dedicated personnel.\n\nThe rioters began to show signs of retreating, and the human wall under the red flag began to move. Under the command of an old soldier wearing a military cap and bearing a scar on his face, the human wall marched with neat steps, shaking the entire street. They crushed everything that dared to obstruct them, turning it to dust. A wall does not speak, but every step of this wall was like a hammer blow to the hearts of the enemy.\n\nSeeing this stance, many rioters quickly scattered. Those attempting to maintain order whipped the retreating rioters with sticks, but with little effect. Instead, they themselves were swept along, fleeing in the direction they had come from" 
  prcs.3021.a: "The black tide shattered against the human embankment, breaking into countless fragments, fleeing in all directions." 
  prcs.3022.t: "The Street" 
  prcs.3022.d: "The heavy rain washed away all the filth on the street. Banners, megaphones, shoes, and various flags that had been randomly discarded were swept into the water flow, escaping together with the scattering black shadows. Just as they had emerged from the shadows, they disappeared back into the vast downpour. But this was only temporary.\n\nWhen the special police team arrived, breathless, they were astonished to find that order had been restored on the street that had just been a battlefield. Citizens carrying all sorts of makeshift weapons were patrolling under the leadership of a few older police officers, the large characters for 'Discipline' on their red armbands highly conspicuous. Others were bundling up the various discarded weapons and tossing them into the bed of a pickup truck marked with 'Electric Grid'. A few children were making faces at the hog-tied black-clad rioters. A furious shout echoed in the rain, and the children flew away like birds. People who were normally strangers to one another were sweeping the main street; they swept the scattered rubbish into a pile, stacked it, and shoveled it onto a garbage truck. The injured were helped into vans; one person with a medical kit was treating wounds, while another was making the sign of the cross over an injured person, quietly murmuring something. Vehicles carrying people and supplies drove out of the street one after another, directed by a volunteer in a reflective vest. These vehicles were adorned with red flags and red banners, and the people who had been fighting side-by-side moments before waved their arms at each other. Accompanied by the rain and the sound of car engines, the songs Unity is Strength, My Motherland, and March of the Volunteers flowed through the main street.\n\nThe moment the special police appeared, the crowd erupted in cheers. They swarmed forward, surrounding the special police whose gear was battered and broken, stuffing food, fruit, and drinks into their hands. The special police had a hard time politely declining. This surging tide of people was so immense it stretched out of sight. They gathered together, resembling the waters of the Yangtze and Yellow Rivers surging through the veins of the Motherland. But this current, which had rushed for thousands of years, had shed its wildness and was now shaping the Motherland with its own will."
  prcs.3022.a: "Seas are raging, clouds are tumbling, continents are rocking, storm and thunder are drumming/" 
  prcs.3023.t: "The Heart (1)" 
  prcs.3023.d: "The red vehicles packed with people proceeded along the streets. Red flags, red banners, and red armbands carried those noisy yet silent people to various parts of the city. Wherever there was inflammation or bacteria, their figures would appear. After they extinguished the inflammation and eliminated the bacteria, they would board the vehicles again and flow towards the same destination.\n\nThe Civic Plaza served as the city's façade, not only because of its vast area but also because the buildings that best represented the city's wealth rose up nearby: the International Deng Xiaoping meticulously sculpted Concert Hall, the twin skyscrapers with their streamlined, cloud-piercing design, and the Baroque-style underground shopping street. But these were minor details; the most striking was the International Grand Hotel, covered entirely in tempered glass, resembling a crystal jewel. Lights, dyed by the walls and refracted cleverly through a series of angles, radiated from within the International Grand Hotel, looking like an amber jewel in the city night. Surrounded by these buildings, a statue of a person stood quietly, with their shadows cast upon it.\n\nBut now the scene was completely different. A circle of man-high barricades had been erected around the plaza, their frame constructed from various leftover building materials and debris. Bricks and sandbags formed the base of the barricades, while broken tables and chairs, shared bicycles, movable railings, street center guardrails, and all sorts of junk formed the outer shell. The barricades blocked all unnecessary streets, and the most critical points were guarded by a public bus. The entrances and exits of the underground shopping street were adorned with white banners bearing a red cross. The accessible ramps were now truly serving its purpose, with the injured being transported from here to the emergency medical area that had been hastily set up. Volunteers rushed in and out, handing medicines to the doctors. After emergency treatment, the injured would be immediately taken away in ambulances or vans to nearby hospitals. The International Grand Hotel was currently crowded with people queuing for meals. Some people tried to cut corners and take more portions, but smart onlookers immediately saw through their tricks. All sorts of tents covered the plaza surrounding the statue, including tents for the Armed Police Force, blue fire department tents, but mostly temporary sun shelters. Countless red flags fluttered over the plaza and near the statue. Someone, identity unknown, had tied a red scarf around the statue's neck.\n\nThe statue's gaze was piercing, watching everything in the plaza, observing this chaotic yet tacitly coordinated crowd. Outside the barricades, the city was turbulent, and flames were ignited."
  prcs.3023.a: "And behind it is the building with the highest significance in the entire plaza." 
  prcs.3024.t: "The Heart (2)" 
  prcs.3024.d: "The Concert Hall was once described by its designer as a masterpiece that encapsulated half of his life's work. He asserted that no other building could surpass it, either artistically or functionally. He said that he had ingeniously integrated the pipe organ into the walls, allowing the entire audience to feel the power of classical music, making it comparable to the ancient Greeks and Romans who used exquisite statues as columns. He declared it a pinnacle of his design art.\n\nAnd now we are entering another sanctuary, ascending another peak. History requires a vessel, and when history happens, the first thing is to find a dwelling place for it. The masses and the Party chose this place at first sight, selecting this building that represented \"artistic taste.\"\n\nThe Concert Hall has been completely redecorated. Movable railings separate the crowds, directing citizens and idle people who only want to join the excitement into the entertainment area, while others step into the waiting hall, which also features a transit corridor. More tables and chairs have been placed in the waiting hall, along with a small lectern. Generator wires were pulled in from outside the building, initially a chaotic tangle, but gradually separating into multiple lines connected to the various work lights in the hall. Deng Xiaoping once said that the lights in the Concert Hall should be dimmer, not too bright, to preserve the \"ambiance.\" But after this place was selected, the first priority was to make the hall brighter; no one liked to stay too long in that deliberate ambiance. Small national flags, Party flags, and trade union flags completely dyed the predominantly white waiting hall red.\n\nVarious posters and slogans are pasted here: \"Unite as one, suppress the black violence!\" \"Workers, farmers, students, and soldiers, crush the powerful enemy!\" But the most conspicuous is a poster: \"Disrupting the order of the meeting is counter-revolutionary!\" However, since the events began, no one has genuinely disrupted the order of the meeting, because nothing could disrupt it.\n\nThe doors to the auditorium opened, and people poured in in an orderly stream. The curtain is about to be raised there, and one drama after another will unfold."
  prcs.3024.a: "And this is a drama where you and I are both protagonists." 
  prcs.3025.t: "The Heart (3)" 
  prcs.3025.d: "Let's take a look at the auditorium; it truly is a classic example of acoustics and architecture. The building itself was designed as a model where everything served music. The music played by the orchestra on the stage is reflected by the walls, and with the added reverberation, the music becomes incredibly loud. There are also several boxes in the audience area, clearly intended for people of distinguished status to enjoy the performance. Deng Xiaoping was not fond of overly magnificent designs, so saffron-colored wallpaper was used to wrap the entire auditorium, but tradition was hard to ignore, so the stage was still clad in gold.\n\nSadly, since its completion, the auditorium has almost never been full, and the elaborately designed boxes have been completely neglected. Apparently, having a distinguished status does not necessarily mean having a genuine appreciation for art.\n\nBut now, it is packed with people almost every day. The audience seats are full, of course, and the aisles are also crowded with all sorts of people, whether they are young or old, male or female, pale or dark-skinned. The boxes are even more crowded, having become the territory of common folk instead of the gentlemen they were designed for. Their gazes are all directed toward the same place: the golden stage.\n\n A lectern has been placed at the center of the stage, flanked by two small tables. These two tables are completely asymmetrical, a stark contrast to the perfectly symmetrical hall. On the table to the right is a laptop and a printer, with piles of A4 paper next to the printer. Under the watchful eyes of many spectators, a secretary records everyone's every word and action—motions, reports, initiatives, and orders—which are all recorded, and the printed paper immediately transforms these words into power. The moderator sits at the table on the left. Since no gavel or similar object could be found, a vendor contributed their megaphone.\n\nRepresentatives from various groups step up to the lectern to express their thoughts to the other representatives and the audience. Ideas clash here, philistines and pragmatists wrestle, the poor and the \"educated\" argue, and hot-headed idealists describe the great prospects of the struggle to the people, while the silent ones in the crowd ponder how to cure the city's chronic ills. There are arguments and struggles from time to time, but there is never a shortage of sober-minded people, nor a lack of those who can knit various arms together. Since everything began, various ordinances have been passed here, starting with the basic program of the \"Revolutionary Front\", then the basic discipline for the oversight team, the fundamental procedures for restoring order after defeating the enemy... and so on.\n\nAnd once these acts are confirmed, they immediately translate into action, instantly becoming material force. Words, after passing through the hands of the people, are immensely powerful." 
  prcs.3025.a: "The hammer and sickle hang quietly on the stage..." 
  prcs.3025.b: "The machine is overheating, let us consolidate our existing achievements" 
  prcs.3026.t: "The Madman" 
  prcs.3026.d: "Zou Hanping stood on the lectern, unable to utter a single word. He tried hard not to have an outburst, but his heart was filled with bitterness, ready to spill out at any moment.\n\nUnder the 'big tree' (metaphor for a powerful patron), he had instantly leapt from a township official to a provincial-level cadre. He had seen all sorts of 'troublemakers' and felt that after all these years of weathering storms, he had seen every kind of situation—but a scene like today's...\n\n\"Stop zoning out!\" A sharp shout harshly pulled him back to reality. When he looked up, countless pairs of eyes from all directions of the auditorium were directed at him, searing his face. \"We are currently examining your issues, openly and fairly.\"\n\n\"Since last week, we've found you leading people to arrest ordinary citizens for so-called investigations. When you meet comrades, you put on airs based on your status, you refuse to do your work properly, and you directly arrest and beat people who don't obey! The Oversight Committee is not your private army! The masses appointed you because they thought a provincial-level cadre like you should understand oversight. What have you done?!\" A person wearing an old-fashioned steel helmet and goggles pointed at Zou Hanping's nose and sternly denounced him. Zou Hanping merely glanced at him.\n\n\"Things have gone haywire. These 'troublemakers,' getting a little power in their hands, immediately want to show off…\" He gritted his teeth, looking at the hateful gazes and the bruised, swollen faces aimed at him from below. He felt deeply wronged. This was a naked frame-up, because he didn't recall ever ordering the beating of these people. But he might have given orders, though he genuinely couldn't remember who he had hit; who would remember every person they'd struck? After all, there were more important things for him to worry about... and what's the big deal anyway?\n\n\"What else did your oversight team do during this time? You'd better confess honestly! The Party and the people are asking you now!\" The scolding came again, pouring into his heart, making him feel terribly aggrieved. For some reason, the bitter water in his heart was constantly rising, squeezing his heart until it was about to burst.\n\nFunny, so funny. How could something be this hilarious?\n\nHe finally couldn't hold it in anymore and burst into loud laughter, opening his bloodshot eyes and making faces at the people below, like a drunkard. \"I know! As soon as you get a little power, you want to start a struggle and forget who you are... Go on, struggle! Just struggle! Kill me and be done with it! What can you all do without me? You 'troublemakers' only know how to run around following others like a bunch of pigs and dogs, tee hee hee... Hahahaha!\"\n\nThe entire auditorium fell silent. But a very faint whisper could be heard:" 
  prcs.3026.a: "\"That idiot is mad\"" 
  prcs.3027.t: "Under the Night Sky" 
  prcs.3027.d: "During the day, the entire city was engulfed in flames and anger, with various colors clashing on the streets. Rioters versus the masses, shovels versus barricades, \"freedom\" versus democracy, white versus red. But as the sun set, these violent clashes gradually subsided. The rioters often moved in groups of a dozen, targeting solitary individuals or attempting to destroy the barricades constructed by the masses. However, the masses were well-prepared for such harassment; patrol teams made up of volunteers were deployed on every street, and cameras monitored every corner. As soon as the rioters' figures were spotted, an alarm would be sent to every barricade. Yet, many of these individuals could evade the cameras; they seemed intimately familiar with every corner of the city, always disappearing in a flash.\n\nThe daytime belonged to large armies, and the night belonged to guerrillas.\n\nDespite this, the areas of the entire city controlled by the masses (who preferred to call themselves revolutionaries) remained stable, as usual, with no disruption of order due to this riot. On the contrary, under the protection of the spontaneously organized oversight teams composed of mass volunteers, the local police, and the newly established grassroots Party organizations, the streets were even more orderly than before. Even the 'spiritual young men' who loved to speed and were a massive headache for traffic police had to obediently park their 'rides,' voluntarily giving up such so-called 'entertainment.'\n\nOf course, there was an exception. On one occasion, the oversight team spotted a Lamborghini that completely disregarded the red light and the safety of other cars, habitually cutting off other vehicles and squeezing directly through gaps. It brazenly ran a red light, even nearly hitting a pedestrian. So they immediately acted to blockade the road. Before they could completely block the road, the car even intended to drive directly over the traffic police and the oversight team, but a police car placed crosswise put an end to his idea. A traffic police officer walked over and tapped on the window. The car window rolled down, revealing an unruly, sunglasses-wearing face.\n\n\"Hey, cop, do you know who I am... \"\n\n\"Sorry, I don't.\" The traffic police officer cut him off directly. He was about to boast about his powerful connections to intimidate these 'troublemakers.' But hearing such a resolute answer and seeing the cold faces nearby, a sudden, inexplicable fear clutched his heart.\n\nWhen he was escorted out of the car, surrounding residents came to watch, some mocking and deriding, others cheering. But only the oversight team members could hear the subtle whisper:" 
  prcs.3027.a: "\"The world has truly changed.\"" 
  prcs.3028.t: "The Party Members" 
  prcs.3028.d: "The iron door of the stairwell suddenly emitted a dull yet forceful knocking sound—three knocks in a row, a pause, then two knocks, another pause, and finally, three more knocks.\n\nThe hinges creaked, and a pair of slightly vigilant eyes appeared from behind the door crack. As soon as he saw the face of the newcomer, he immediately widened the gap in the iron door, allowing him to slip into the stairwell.\n\n\"Lao Chen, why are you so late?\" As Chen Wen pushed the door open, Zhang Wuzhuo, one of the attendees, saw him. \"Is there something important we need to discuss this time?\"\n\n\"Sorry, comrades. It took some time on the road to shake off the tail.\" He said to the room already filled with people. Then he quickly walked to the front of everyone, glanced around to confirm everyone was present, and pulled a map densely marked with various symbols from his bag and spread it on the table. Everyone gathered around.\n\n\"First, these recent attacks by the rioters are highly suspicious. Several of our breached barricades and raided supply points happened precisely when our defensive forces were depleted.\"\n\n\"The rioters appeared in large numbers almost immediately after our people were mobilized,\" supplemented Wang Yuan, wearing an old-fashioned steel helmet and a red scarf. He immediately lowered his head and whispered, \"To be precise, within minutes of the Oversight Command making a deployment decision, the rioters knew about it.\"\n\n\"The command is mostly composed of Party comrades and enthusiastic masses. How could they possibly leak information?\" Li Liao asked.\n\n\"Another thing: the Revolutionary Front recently received reports that quite a few so-called Party members and some ruffian students have infiltrated the mass organizations, heckling during mass meetings, disrupting the order of mass organizations, and acting like local tyrants in the grassroots democratic self-governance bodies, which has caused widespread resentment among the masses and ultimately led to the dissolution of these organizations. Many of these individuals are systematically and deliberately infiltrating and sabotaging these mass organizations.\"\n\n\"That is indeed true. Our Front's General Oversight Team has received many such reports. One person we caught a few days ago was reported by the masses as a repeat offender. He consecutively destroyed several student organizations. As soon as he joined an organization, he would intimidate people with how many anti-revisionist books he had read. Someone said he was the Party branch secretary of a certain university,\" Zhang Wuzhuo said.\n\n\"Similar things are happening a lot, but the biggest enemy is far from these…\" Chen Wen smiled.\n\nAnd as Chen Wen calmly narrated, a more chilling reality gradually unfolded. "
  prcs.3028.a: "This meeting has just begun." 
  PRC_tfr_nl_china_dangyuanmen_tt: "§RTrouble is brewing again.....§!" 
  prcs.3029.t: "The Tip of the Iceberg" 
  prcs.3029.d: "\"Just a few days ago, the oversight team arrested several individuals suspected of being minor rioter leaders. A few of them were simply mercenaries working for money, offering only useless information we already knew. But two people caught the attention of me and Zhang Wuzhuo. These individuals were very tight-lipped, but comrades from the State Security spent some time digging up valuable information,\" Chen Wen said, nodding to Zhang Wuzhuo, who produced a thick stack of investigation reports.\n\n\"The first person was a student who had studied in the US and then stayed in Japan for a period after '21. According to his confession, he was forced by circumstance to join a Japanese intelligence organization there. After returning to the country, he was instructed by his superior to go undercover here. Just a few months before the riot broke out, their superior suddenly instructed them to receive combat training in certain locations, including how to counter special police formations and organized sabotage. He claimed to have heard about so-called high-level friends during his training. This riot may have been enabled by the assistance of these people.\"\n\nThe air in the conference room was unusually heavy. No one dared to speak, and the buzzing of the old electric fan clung to their hearts, impossible to shake off.\n\n\"The identity of the second person is very interesting. His father was a high-ranking official who was recently taken down by the disciplinary committee, which caused their family status to plummet. Consequently, he harbors resentment towards our current movement. But what is special about him is that he was approached by some 'big shot' who wanted him to act as an intermediary to connect these big shots with his father's former associates. As a reward, he was allowed to become a small-to-mid-level leader in this riot.\" Chen Wen's voice was unhurried, but every word weighed heavily on everyone's mind: \"While we can't determine who exactly these people are, we can at least confirm one thing: this riot is extremely strange. The public security department was completely unaware of it. Some comrades reported that grassroots police officers submitted many such reports, but the public security organs never responded. And just as the comrades from State Security began their investigation, the riots erupted.\"\n\n\"This was a careful, premeditated act,\" Li Liao said.\n\n\"I heard that many Party and government cadres are collectively using this large-scale riot to pressure the Central Committee, criticizing its policies…\" Wang Yuan said, but immediately cut himself short.\n\nA deathly silence fell over the conference room.\n\n\"So what do we do? Wait for the State Security guys to figure things out?\" Someone finally broke the silence after a long time.\n\nChen Wen looked up and said firmly, \"Do what we, as Party members, should do: seize control of this movement, hold firm to the mass base, and let this movement develop healthily.\"" 
  prcs.3029.a: "\"As long as we hold firm to the mass base, no demons or monsters can do anything to us.\""
  PRC_tfr_nl_china_bingshanyijiao_tt: "§RThe red rain stirs up waves at will, the spring mountain intentionally turns into a bridge§!" 
  prcs.3030.t:" A World of Difference" 
  prcs.3030.d: "\"Brothers, I'm a hundred percent anti-communist!\" Lu Cheng's snot and tears flowed endlessly, his cries nearly tearing his vocal cords. Looking at the black-clad individuals who remained unmoved, he used all his strength to cry out to them: \"I am absolutely sincere about our cause! I'm truly only here for the revival of the Party-State, to eliminate the Fourth Abrahamic Religion, to prevent the rats from getting to the table, to punish the violent Chinese, to overturn the swamp, to elevate virtue, and to restore the rightful tradition! I'm really not a spy sent by the Red Bandits!\" As he spoke, he violently kowtowed to the black-clad individuals, nearly bashing his forehead until it bled.\n\nHe couldn't see the faces of the black-clad individuals; their black masks obscured Lu Cheng's vision. The person at the head, who looked like the \"boss,\" merely smoked a cigarette, not even sparing Lu Cheng a glance. Under the dim yellow streetlamp, their shadows stretched over Lu Cheng. The zip ties on his hands were so tight he could barely breathe. The clubs in their hands seemed to have something clinging to them; the dripping liquid fell onto his neck, making his hair stand on end.\n\n\"Do you have anything else to say, Communist spy?\"\n\n\"Brothers! Brothers!\" Lu Cheng saw this and decided to make one last effort, weeping and wailing with even more desperation:\n\n\"I... my family was originally very wealthy, but because the Red Bandits fought the Party-State, our business was ruined. Later, because of some so-called worker autonomy and nationalization, our family was sued by those 'troublemakers' several times, and we lost our house. Our whole family had to move back to the countryside... I have a deep-seated hatred for them! I, I can do anything for you, even kill!\" After this long outburst, he felt something blocking his throat, no air left in his lungs, his chest felt sunken, and his face was deeply buried in the dirt.\n\n\"Good...\" This single word was soft, but it seemed to come from heaven, warming Lu Cheng's heart slightly. He lifted his dust-covered face, his eyes filled with tears.\n\nThe leader in black still smoked, his face obscured, but his voice became a little gentler: \"Since that's the case, then go and demonstrate your sincerity. We will treat every brother kindly—but you have to prove yourself.\" With that, the person pulled out a wad of cash and waved it in front of his nose.\n\n\"Thank you, Boss! Thank you, Boss! I will dedicate myself completely and serve you faithfully!\" Lu Cheng kowtowed repeatedly.\n\nWhen he was taken to the so-called \"Newcomer Group,\" he felt light-headed. But he couldn't hear the black-clad individuals' unrestrained, booming laughter, and the phrase that slipped out inadvertently as they chuckled— "
  prcs.3030.a: "\"That trick never fails!\""
  PRC_tfr_nl_china_tianyuanzhibie_tt: "§RWhere they cannot see, a drone turns its camera§!" 
  prcs.3031.t: "\"I am a Rebel!\"" 
  prcs.3031.d: "The school playground was packed with people, school uniforms mixed with workers' overalls. Red flags unfurled across the playground, embracing everyone. The white characters on one of the red flags were particularly striking: \"Workers' and Students' Red Alliance\".\n\nAn older youth, whose blue overalls were notably conspicuous, walked onto the lectern under the gaze of the crowd. Facing the ocean-like tide of people, his voice was inevitably trembling a little: \"Students! Fellow workers! We two groups are brothers, sharing weal and woe, and we must form this fighting alliance. Only by uniting as one can we avoid defeat!\""
  prcs.3031.a: "Completely denounce and disgrace the traitorous students!"
  prcs.3031.b: "Severely punish those who assaulted others!"
  PRC_tfr_nl_china_woshizaofanpai_a_tt: "Cultural attack and military defense..."
  PRC_tfr_nl_china_woshizaofanpai_b_tt: "I'd say, the weapon of criticism can never replace the criticism by weapons."
  prcs.3032.t: "A \"Leftist\" Statement"
  prcs.3032.d: "Voice of the XXX Revolution to all progressive students:\n\nThe fanged revisionist clique can no longer suppress its internal contradictions. Under the guise of so-called "democratic reforms," they are in fact waging a full-scale civil war to save their crumbling rule.\n\nSince the pandemic, the revisionist group's economy has suffered a tremendous blow, and its internal class contradictions can no longer be hidden. Even though there have been minor changes of power within the clique, it does not alter their true nature. After their military adventures succeeded, the Hu Chunhua faction and other ruling groups have reached an open rupture in their struggle for power and profit.\n\nHu Chunhua's faction promotes so-called "socialist economic reform," preaching "workers' democratic self-management," but in reality they are destroying the proletariat's conscious control over the economy. They even invoke the name of the "Anshan Constitution" to disguise their capitalist class-conciliation essence. Yet after advancing this revisionist path of "workers' autonomy," they established a so-called "Central Commission for Economic Planning" to greedily plunder the people's wealth for private gain, attempting to soothe class contradictions with shameful bribery. These acts are no different from those of fascist states.\n\nAlthough Hu Chunhua's clique publicly raises the banner of "class struggle," in practice they bribe the so-called lumpen proletariat and petty-bourgeois students, harshly suppress democratic thought and freedom of speech, and unleash their running dogs to verbally assault anyone who dares to dissent. This is the most vile manifestation of the "theory of extinguished class struggle." Their lackeys even set up "revolutionary fronts" at the grassroots, proclaiming themselves "democratic authorities," while in fact they violently attack the genuine participants of the democratic movement.\n\nThese henchmen, when beating the masses, even carry so-called "2D" bourgeois cultural products, which fully expose their petty-bourgeois nature — and from another angle, their fascist character.\n\nBut Hu Chunhua's reactionary path will inevitably provoke the people's righteous resistance. Those democratic fighters dressed in black are, through their actions, struggling for a brighter future for China. Their struggle is intimately linked with the struggle of the international proletariat, and the imperialist fascist bloc's ambition to dominate Asia will never succeed. The decisive battle between two roads has already arrived.\n\nDown with revisionism!\nDown with the fascist bloc!\nDefend Asia!\nDefend the international communist movement!"
  prcs.3032.a: "Justice lives in people's hearts — not worth a sneer."
  PRC_tfr_nl_china_tongtoupidai_tt: "§YEffect:§W Radicalism: §R-10§!"
  PRC_tfr_nl_china_yizezuopaiyanlun_tt: "Let the comrades at the leather factory patch it up — maybe it'll still work?"
  prcs.3033.t: "The Fortress"
  prcs.3033.d: "On the very first day the riots erupted, both the crowd and the police were thrown into confusion by the sudden upheaval. To protect themselves, citizens quickly organized self-defense groups to confront the rioters. At first, these groups were small and poorly equipped. But when a team of construction workers used leftover materials and vehicles from their worksite to build the first barricade and successfully repelled a mob, barricades began springing up across the city like bamboo shoots after rain.\n\nSoon after, the disoriented grassroots Party organizations regained their senses. Unable to contact higher authorities, they took the initiative to unite the self-defense groups and grassroots democratic organizations spontaneously formed by the people, establishing a "Revolutionary Front" to replace the now-paralyzed government institutions. The Revolutionary Front was born on a primary school playground — initially only a joint defense coordination body. Later, as the people took control of the central square, the Front moved its base to the city's heart — the first place where many citizens truly felt history in their own hands.\n\nUnder its unified coordination, the masses dismantled redundant or obstructive barricades, repaired and reinforced key ones. Engineers and construction workers, who had spent half their lives designing precise buildings, now used every kind of material — bricks, furniture, cars — to raise fortress-like barricades in the streets.\n\nThe most iconic of these was the one on Liberation Avenue. Once the site of imperial offices, later a foreign concession during the Qing and Republican eras — the place that once bore the sign "No dogs or lowly Chinese allowed." In the past thirty years, it had become the city's "calling card," lined with Western-style buildings and luxury stores flaunting urban splendor.\n\nNow, a two-story-high, dozens-of-meters-wide barricade stretched across it. Packed earth, paving bricks, doors, broken cabinets, benches, tarps — all manner of odd materials piled into a perfect defense, complete with embrasures. It was loud, it was defiant; it teemed with people — steel helmets, safety helmets, straw hats, wide-brimmed hats forming a storm of fury. Pitchforks, hoes, shovels, brooms, and sticks fought alongside trekking poles, compound bows, air guns, and Molotovs. Everything became a weapon: pottery shards, pig bones, bottles, buckets.\n\nThis barricade was the sediment left by the flood — the people's poverty brought to the surface, and from it, this fortress was born. Over 800 citizens guarded it in turns; more than a hundred never left. Among them were Party members, Youth League members, mass organizations, residents, and migrant workers — all sharing one name: the People.\n\nWithin this fortress's body, a storm was brewing — a storm of rage."
  prcs.3033.a: "And above the fortress, a red flag cracked and snapped in the wind."
  PRC_tfr_nl_china_baolei_tt: "The spring breeze stirs ten thousand willow branches; six hundred million in China all as Yao and Shun."
  PRC_tfr_nl_china_baolei_b_tt: "A few days later, we shall regroup and raise our banners again."
  prcs.3034.t: "The Party Members' Assembly"
  prcs.3034.d: "The bright red Party flag was unfurled across the body of the barricade. Beneath it stood a makeshift podium made of folding tables from a street stall, and in front of it rows of benches, plastic stools, and folding chairs. There was no decoration — unless one counted the barricade itself.\n\nOutside, something was still smoldering, its stench drifting in. Inside, heads crowded together. Many had not even removed their armor — old olive-green police helmets gleamed; some clutched shields, one even brought a wooden pot lid. Others still held weapons, too recently used to set down. They had just repelled another assault — now, silence. This was a Party meeting, but many non-members attended.\n\n"Comrades! Our barricade has held for a long time. The rioters have tried every trick — frontal assaults, infiltrations, bribery, division — yet we remain unshaken. Why?" A young man stood at the podium, dark circles under his eyes, voice undimmed. "The secret lies here. Among us are not only Party members but the masses themselves. Everything within our Party organization is laid bare for the people to see. Our decisions are made together with mass organizations and representatives. That is why our barricade became the strongest, most unbreakable line of defense.\n\n"And when we defeat these rioters, there will be more battles ahead, more work to do — together. There's nothing to debate: we Party members are also the people. So our grassroots Party meetings must let the people sit in, hear their thoughts, understand their needs, and resolutely carry out what must be done!"\n\nThen he stepped down. One by one, the humblest Party members — "small voices" — came forward to report, followed by representatives of the mass groups, the most ordinary of citizens. Beneath the Party flag, they voiced their thoughts, dreams, even delusions. Some gestured wildly for fear of being misunderstood, but no one silenced or interrupted them — and when they finished, applause echoed."
  prcs.3034.a: "In the glow of the firelight, the Party flag burned brighter still."
  prcs.3035.t: "The Prisoner"
  prcs.3035.d: "\"We must let everyone see the tyrant's cruelty to the innocent!\"\n\"Support the anti-tyranny struggle! Down with red despotism!\"\n\"Friends of democracy worldwide stand with us!\"\n\"Down with the revisionist clique! Down with Sino-imperialism!\"\n\"All people of conscience, support the just democratic struggle!\"\n...\nHuang Dongcang's finger mechanically pressed Enter. The carefully crafted posts were distributed by script across dozens of accounts. When the words "Under Review" appeared, he gave a bitter smile. In the beginning, their videos had never needed review — their "resistance" was "just," and many "men of conscience" had helped. But those "righteous men hidden in the dark empire's core" had long since vanished.\n\nHe bit a piece of bread; his tongue was dry, the bread tasteless — at least it was soft. He washed it down with bottled water. How he longed for pizza — thin, crispy, with smoked sausage, cheese, and imported basil. He remembered the last time he'd eaten one — 2020. He had shown off, ordering an expensive custom pizza during lockdown, having it delivered to his desk. He had made sure it was a single-person pizza, so classmates eating instant noodles could only watch. Back then, he'd sneer: "We're all prisoners, but some can make prison a paradise." Since 2022... he couldn't go on. He bit again, angrily.\n\nHe felt itchy, glanced in the mirror — the face there was unrecognizable: unshaven, filthy, eyes crusted yellow, breath foul. The water was cut; rations strictly limited.\n\nOutside the window, the university had become a fortress. Under the guidance of seasoned foreign instructors, they had blocked roads with bricks, chevaux-de-frise, and wrecked cars; strung barbed wire on the walls; set up watchposts and drones. Yet the sentries kept slacking off.\n\nAcross the street, the barricades advanced — alive, creeping forward day by day. A hundred meters, fifty — but never backward. Barely shoulder-high, yet impenetrable.\n\nHe crouched behind the campus defenses, telling himself he was defending freedom — but if that was true, what were those barricades across the road?"
  prcs.3035.a: "He felt a sudden tightness in his chest, and breathing became hard."
  PRC_tfr_nl_china_qiutu_tt: "The west wind weakened; the late-spring chill began to fade. The east wind blew from the red Party flag."
  prcs.3036.t: "Closing the Net"
  prcs.3036.d: "\"Through close cooperation between local citizens and police, the rioters' base was stormed yesterday...\"\nSwitch channel.\n\"Order has been restored nationwide; revolutionary masses celebrate the victory over the rioters...\"\nSwitch channel.\n\"The Chinese people will never be frightened by the dying struggles of reactionaries. The path of people's democracy is tortuous, but the Chinese people have the courage to go forward...\"\nSwitch channel.\n\"Today, several officials involved in the unrest have been removed and placed under investigation...\"\n\nHe turned off his phone, covering his face with his hands. Curtains shut tight — he dared not let sunlight in. He had lost — utterly. He knew he was out of moves. The foreigners caught would soon confess, and the security agencies and disciplinary commission would follow the trail upward — to him. What awaited him now? Who could stop it?\n\nHe had united all who resented current policies — second-generation elites, gangsters, businessmen stripped of power, chaos-seekers, disgraced cadres, and foreigners — hoping to use the grassroots democratization reform as leverage: force the authorities to act harshly and lose prestige, or use the turmoil to restore his own influence. It had been a brilliant plan — so why had it failed? How could his armed, well-trained men lose to peasants? Useless fools! His head throbbed painfully.\n\nWhere did he go wrong? Was it underestimating their incompetence? Should he have, like his predecessor, simply served the Party and nation faithfully? Or had the plan been flawed? He tore at his hair in anguish.\n\nRing-ring-ring— the phone suddenly rang, cutting off his thoughts. He knew what it meant. No one else would call now. He had no choice, nothing left to save — but one last thing he could still do.\n\nHe rose, straightened his clothes, pinned the Party badge to his chest, and calmly picked up the phone."
  prcs.3036.a: "\"This is the Disciplinary Commission. Do not leave your premises. Cooperate with the investigation.\""
  PRC_tfr_nl_china_shouwangshike_tt: "§RIt's time to settle the accounts.§!"
  prcs.3037.t: "Morning After the Rain"
  prcs.3037.d: "Heavy rain once again fell upon the ancient city's streets, washing them clean. The gray-black water flowed into drains and slowly turned clear — yet it could not wash away the people's fervor.\n\nThe concert hall was packed tighter than ever; latecomers craned their necks for a glimpse. Though crowded, though feet were stepped on, no one complained — only the voice of the chairperson could be heard.\n\n\"According to the Revolutionary Front's general assembly vote, the Front will be reorganized after the unrest ends and integrated into the relevant departments. The reorganization plan, jointly discussed by all comrades, is as follows:\"\n\n\"The people's associations shall be preserved; their dissolution or merger decided by the masses themselves.\"\"The Revolutionary Front shall form a People's Review Council, directly connecting to local governments. Citizens will participate in the council to supervise government work, and mass organizations may submit proposals, which the council shall deliberate and local governments execute.\"\n\n\"At the grassroots, mass consultation committees will be created to mediate conflicts among popular groups, with Party branches recording and certifying agreements.\"\n\n\"The people's patrols organized during the movement will become voluntary law-enforcement auxiliaries, maintaining order during public events.\"\n...\nThe resolution was brief but weighty. Copies passed hand to hand, flying through cyberspace, from citizens' phones to officials' desks — the whole nation watched. Words printed on paper would soon rot, but these words no longer needed paper.\n\nWhen the chair finished reading, silence filled the hall — until a child's laughter rang out from a corner, clear and pure. In an instant, cheers and applause erupted, filling the hall like a rising tide.\n\nThe doors opened; delegates stepped into rain puddles under the clearing sky. The square, the city, the whole of China became a sea of joy. Sheets of the printed resolution fluttered into the sky, carried toward the sunlight breaking through the clouds."
  prcs.3037.a: "§YThe sunlight breaks through from behind the clouds§!\n\n§RAnd shines upon the ancient yet youthful land.§!"
  PRC_tfr_nl_china_yuhoudezaochen_tt: "Once again, the Chinese people, swept by the east wind, behold the dawn on the horizon."
  prcs.3038.t: "An End Without Illness"
  prcs.3038.d: "After 21 years of policing experience in Taiwan, the security system had long mastered the art of suppressing dissent. The people, too, were accustomed to ignoring the wail of sirens each day. Following a brief period of arrests and interrogations, stability had returned.\n\nThough society had fallen silent, the central authorities, on the surface, relaxed their grip. Yet once a fire of enthusiasm is extinguished, it is not easily rekindled.\n\nThus, propaganda departments gradually reduced discussion of 'grassroots democracy,' turning instead to cultural reform and artistic innovation. Perhaps one day, they would revive the slogan and perform another round of symbolic reforms—but clearly, the true opportunity had already been missed.\n\nAs Rosa Luxemburg once said, to oppose the premature start of a revolution is to oppose all revolution, for the subject of revolution—the people—must be tempered within its process."
  prcs.3038.a: "Everything as usual"
  PRC_tfr_nl_china_wujierzhong_tt: "§sGrassroots Democratic Reform§! — Aborted"

  prcs.3039.t: "Immortality and Eternity"
  prcs.3039.d: "The Yangtze River churned white foam, licking the cliffs, slapping the shores. The moon upon the water still shone as it had for millennia. A small boat drifted with the current; cigarette tips and stars flickered in the night. Wisps of blue smoke blended with the waterborne clouds, dancing in the breeze, scattering the reflected ripples. A faint sigh was nearly drowned by the waves.\n\nThe mighty river flows eastward, washing away heroes,' murmured a middle-aged man, fumbling in his pockets. The elder at the stern smiled, asking, 'What troubles you?'\n\n'Nothing much, just a feeling,' the man sighed. 'Look at this river, this Red Cliffs—once the stage of heroes. So many fell here, their glories buried in sand. Now we float here and speak as Su Dongpo once did.'\n\nThe elder chuckled. 'Dynasties rise and fall—such is the way of history. Nothing lasts forever. Man must die, but history and the people must go on, like the river that flows to where it must.'\n\n'I don't understand,' the middle-aged man turned sharply, his tone heavy. 'Change is inevitable—like this river! Yet there are always those clinging to the past, shouting \"ancestral rules cannot be changed,\" \"shaking the foundation,\" \"treasonous ideas,\" \"poisonous weeds\"! Are they blind? Do they live in wells?'\n\nThe elder didn't answer immediately. He dipped his hand into the cool water, letting it flow between his fingers like the passing years. 'They're not blind—they've become fixed.'\n\n'Once a person sits in a position long enough, that seat fuses with his bones. The accustomed pedestal, the polished steps, the raised chin—all become sacred and untouchable. They know full well the \"ancestral rules\" were made by men and can be changed by men. But comfort, privilege, and habit have bound them like chains. That's their so-called reason. When they say they're defending tradition, what they're truly defending is their own wealth, rank, and the futures of their descendants. That's what it means to be fixed—to sit so long you become the bricks of your own tomb, sealing all paths forward.'\n\nHe paused, eyes narrowing. 'But those who only stare at others' grease-stained seats, blind to the glue beneath their own feet—they won't last long either. This river, in its power, can sweep away all who think themselves immovable.'"
  prcs.3039.a: "Next page"

  prcs.3040.t: "Immortality and Eternity"
  prcs.3040.d: "Moist river wind brushed their faces. The middle-aged man was silent for a long while; the fire in his brow dimmed into something deeper. 'That's why I struggle—while I still have strength—to steer this broken boat toward a better course. But...' His voice faltered, heavy with doubt. 'What if my oar is too short, my strength misdirected? What if I can't see the hidden rocks, and I steer us into the whirlpool? Or worse—what if I drown, and the barriers I broke through are rebuilt stronger than before?'\n\nThe elder stared into the turbulent depths. The moon's reflection twisted and broke in the current, torn apart and reformed again and again.\n\n'Who can measure their oar amidst the roar of waves?' he finally said, voice blending with the creak of planks. 'Old waves fade, new waves rise. The old may be murky, but their dregs dissolve; the new may be strong, yet even they can hide rocks beneath their spray. The boatman's task is not to judge clear from muddy, but to see the current—and to know his oar, his eyes, his strength, and how much of the river he can fathom.'\n\nHe lifted his head slightly. 'The direction is never wrong—the river must reach the sea. But which stretch of the river can claim absoluteness? We can only face the wind, steer the helm, and listen to the echoes from the hull—asking the moon, the rocks, the waters where the flow will go...'\n\nBefore his words could end, a surge struck the hull. Water exploded against the planks, spraying cold droplets across their faces. The boat tilted sharply, then steadied—like a paper vessel kneaded in a giant's hand."
  prcs.3040.a: "'Can we... truly break the old waves?'"
  PRC_tfr_nl_china_yongshengyuyongcun_tt: "§AIn midstream we strike the waves, restraining the speeding boat.§!"
  prcs.3041.t: "My Homeland"
  prcs.3041.d: "'Look at the ceiling above us! Step on the bricks we laid ourselves!' The migrant workers, clothes stained with mortar and dust, tossed their helmets high and danced hand in hand.\n\nJu Guangda left behind the cheering crowd in the courtyard and slowly approached the apartment building they had built, brick by brick. The construction proposal raised by their migrant workers' delegation at the district council had been seriously discussed and approved. With government support, they had erected these apartments with their own hands.\n\nJu Guangda touched the freshly tiled floors and the smooth walls. Photos of the new owners hung on the outer wall. Among all the bright smiles, his shy, stiff grin stood out. He was an experienced builder; his hands curled inward instinctively from years of gripping trowels.\n\nThey were modern nomads—homes left behind, never to return. Following the work sites, leaving only fleeting shadows in each city before poverty and exclusion drove them away again. His dreams were full of bricks, cement, and steel, forming great towers he could never quite reach.\n\nNow, he had entered one—with his partners, fellow villagers, comrades. They would live as citizens among citizens—sharing food, clothing, homes, and dignity.\n\n'We came to this world once, one part spring, two parts desolation. Laughing as we wander through life, trying hard to grasp fate's gun.'\n\nA lyric flowed from his lips, carrying the soil of his hometown and the smoke of the city, the rasp of his voice and a heart not yet old."
  prcs.3041.a: "'Forgive all the farewells that will never come again—for where the heart rests, there is my homeland.'"
  prcs.3042.t: "The Cooling Machine"
  prcs.3042.d: "Upon the ruins, the Revolutionary Committee and Party organization achieved victory in the street battles, cleansing remnants of reactionary elements within the grassroots.\n\nAs smoke cleared and people rebuilt, the Central authorities quietly issued new regulations.\n\nThese, as always, were disciplined and organizational. They praised the people's achievements while cooling the flames of overzealousness. The decree stated that grassroots organizations, in coordination with local disciplinary commissions, could now supervise officials effectively. After review, mass organizations could volunteer to maintain neighborhood security and participate in local self-governance. Old residents' committees would be reformed into forums for mutual consultation among citizens. Non-governmental cadres—outstanding Party members and individuals emerging from the movement—would serve as coordinators among organizations.\n\nGrassroots groups sprouted rapidly, but their size was limited by approval—to ensure harmony, identify infiltrators, and maintain Party oversight. Though restrained, the Central Committee nonetheless raised an umbrella for the tempered organizations and the people—opening a window to the east wind, cracking the late-spring frost that had frozen grassroots democracy."
  prcs.3042.a: "Slow but steady, the race will be won."
  prcs.3043.t: "The Nightmare"
  prcs.3043.d: "Suda pulled Basong out of Thammasat University. On the distant street, buses sped past flashing police lights, while soldiers of the Royal Army checked passersby. The Chao Phraya reflected dark clouds; leaves hung limp and gray.\n\nDragged along, Basong stopped walking. Suda turned, staring coldly at him.\n\n'Suda,' he said, 'You heard Professor Chaiwut. Everything I've learned tells me I must fight for a better Thailand. The time has come—I can't stand aside.'\n\nSuda glared. 'You want to play the hero, wear red, wave a flag, clash with the army—and then what? You know how ruthless the Yellow Shirts and the military are.'\n\n'But I must stand with my comrades. Please don't stop me. You've always supported me—why not this time?' he pleaded.\n\n'So you'll abandon me,' she said bitterly. 'Maybe you've forgotten what happened here fifty years ago—but I haven't.'\n\n  Basong snapped, shoving her aside and running. Behind him, her sobs turned into the shouts of megaphones, chants, gas grenades, screams, the clash of shields—until a gunshot cut through everything.\n\nRaindrops followed. The deluge fell; the crowd scattered like ants, toppled like dominoes. Those not wearing red were soon dyed in it. Amid the sea of red, he saw Suda. She saw him—but before she could speak, her face shattered like a mirror. His heart clenched painfully, and he collapsed.\n\nHe awoke drenched in sweat. Outside, mist shrouded the mountains. Roosters crowed. The flag of the Thai Communist Party hung on the wall. Guerrillas stood watch outside."
  prcs.3043.a: "The vision of the dream returned, and for the first time, the sobs drowned him."
  prcs.3044.t: "The Children"
  prcs.3044.d: "Basong pulled a handful of White Rabbit candies from his pocket like magic. The village children hesitated, then saw the red scarf at his neck and dared to take them—scattering like birds.\n\nQuartermaster Chanon clapped Basong's shoulder. 'You know what the locals like most about us here in the Golden Triangle?' Basong asked, 'What is it?' Chanon sighed. 'They say—we have integrity. We fight, but never harm the children.'\n\n'The drug lords kill kids?' Basong was shocked. Chanon found half a cigarette and lit it. 'If only. They use them.'\n\nSeeing Basong's confusion, Chanon continued: 'They take strong village kids—boys and girls—make them child soldiers. Disobedience is punished by beatings; the badly injured are dumped in corpse pits. Some \"clean\" ones pour acid to dissolve the bodies. Those who survive get their \"rite of passage\"—murder. The lords tie a hooded prisoner to a pole, and the child must shoot. If lucky, it's a stranger. If not—when the hood comes off, it's their parent. I've seen it.'\n\nBasong trembled, staring blankly. Outside, children's laughter floated in."
  prcs.3044.a: "'That's why we're here.'"

  prcs.3045.t: "Discipline"
  prcs.3045.d: "Blood-red rain flowed into the sewers; concrete dust mixed with acrid smoke replaced morning fog. Guerrillas and civilians with red armbands were dismantling the ruined barricades. Sporadic gunfire came from a few bunker-like villas, then silence.\n\nThe assembly horn sounded beneath a gray sky. The guerrillas lined up, faces grim. Before them stood their commander—and a row of bound soldiers.\n\nHe walked slowly past them, eyes sharp as knives. No one dared speak.\n\n'Well done,' he said coldly. 'After all these battles, you enter Chiang Mai and immediately act like warlords—extorting, beating those who refuse, harassing girls, playing heroes before their parents!'\n\nHe turned away, breathing deep, fists clenched tight. The bound soldiers bowed their heads lower.\n\n'We are the Communist Army—the people's army, their avengers! Behave like this, and what separates you from the royal beasts?' His voice thundered: 'Such acts will be punished severely!'\n\nHe motioned to the guards, who dropped a bundle of bamboo whips before them.\n\n'Fifty lashes each—administered by your own comrades. Any repeat offense—execution.'\n\nThe whips cracked through the air, landing hard upon their backs."
  prcs.3045.a: "The soldiers endured in silence."
  prcs.3046.t: "The Scorching Sun"
  prcs.3046.d: "Heat waves shimmered above the road, distorting the view ahead. Dust clung to the rice leaves by the roadside, turning green to gray. A black mass of troops marched south along the highway beneath a crimson flag. Overhead, jet fighters bearing the same insignia roared low, their engines buzzing close enough to rattle the scalp.\n\n  The sky hung heavy, the clouds pressing down, suffocating. Aside from the engines and synchronized boots, the world was silent—no insects, no wind. Basong felt heat rise from his skull; sweat streamed down his neck, back, and chest, as though his body were being boiled alive. Removing his cap would only release more heat.\n\nHis boots gnawed at his ankles, the bullet belt bruised his shoulder. Each step was torture on molten iron. Swollen bites on his face throbbed, gifts from fearless tropical mosquitoes. He cursed their audacity, unable to lift a hand to swat them. Within minutes, his skin was dotted with angry welts.\n\nThey marched in rhythm, kilometer after kilometer of endless sameness. The air shimmered, the sweat flowed, and time itself seemed to loop.\n\nSuddenly, Basong halted, and the entire column froze.\n\nEveryone stared at a utility pole ahead. Several corpses hung from it, hair tangled, bodies swaying in the scorching air. One woman's belly was grotesquely swollen.\n\nBasong stepped closer and read the paper nailed to the pole:\n\n\"Bandits harbored by a village woman, who failed to report them, claiming pregnancy as an excuse. Executed for treason against the King—let this be a warning.\"\n\nHe said nothing, just handed the notice to the man behind him.\n\nThe sun burned hotter; flies circled, their droning like a funeral dirge.\n\nThe column quickened its pace—pushed onward by an unseen hand.\n\nThey marched on, toward the two fates that awaited them."
  prcs.3046.a: "'One is victory…'"
  prcs.3046.b: "'The other is death.'"
  SIA_cuminst_ture: "§RThe scorching sun sears the heart; the blood-soaked road stretches far ahead.§!"
  SIA_cuminst_flase: "§gThe shadow of death envelops this land; every breath bears the weight of despair.§!"
  prcs.3047.t: "Before Midnight"
  prcs.3047.d: "The Chao Phraya rolled beneath their feet. Without the sound of flowing water, one might think the river had congealed into the same lifeless black as the sky.\n\nOn the far bank, machine-gun turrets of the Royal Army's bunkers glared like beasts' eyes into the darkness beyond. That far shore was silent—so silent it seemed death itself whispered there. Each night, soldiers awoke from nightmares, clutching rifles in panic before sinking back into the endless dark.\n\nSome soldiers, hollow-eyed, drowned their fear in alcohol, hugging bottles instead of guns. Officers, hiding terror behind uniforms, upheld authority through violence while praying the orderlies might save them when doom arrived.\n\nYet no matter how they struggled, the opposite shore remained silent—no gunfire, no wind. That darkness devoured all: sound, time, hope. The war itself seemed unreal.\n\nIn the tall grass by the riverbank, Basong lay camouflaged beneath sod, his body one with the earth. His eyes fixed on the opposite side, where occasional shots broke the night, but he did not move. He knew this calm was temporary; the enemy waited in the dark. The night was thick—no stars, no moon, no sound, only infinite black.\n\nHolding his breath, he felt the silence press upon him until his heartbeat itself seemed swallowed. All were waiting—for the moment to strike.\n\nSuddenly, streaks of light cut through the sky, followed by thunderous explosions. The enemy's bunkers vanished in flame. Smoke and fire surged like a tidal wave, tearing the night apart. When the roar subsided, flares arced overhead, casting white light across the battlefield. Then came the steel voices of men, erupting from the dark:  \n\n'Comrades—forward!'"
  prcs.3047.a: "In Basong Dan's §Ygolden eyes§!, dawn's §Rcrimson glow§! began to rise."

  prcs.3048.t: "The Rising East"
  prcs.3048.d: "The night convulsed. Crowds, tanks, and jets surged like waves. Artillery fire split the darkness, thunder shaking heaven and earth—the Grand Palace trembled. Gunfire followed, then silence. Bangkok stared wide-eyed at the clash of blood and iron.\n\nBasong, carrying a rolled red flag, hid with comrades behind cover. The European-style mansion ahead burned red in the firelight.  \n\n'Comrades…' A mortar shell exploded, drowning Chanon's voice, but his iron tone persisted through the smoke. 'Ahead lies the Prime Minister's Office! However fiercely they resist, they'll soon meet their hell…'\n\nMachine guns screamed, but Chanon's shout rose higher: 'Comrades, plant the red flag in their hearts!'  \n\nSignal flares shot skyward. Artillery roared from below, shaking the earth. Under the storm of shells and engines, soldiers surged through the breached gates.\n\nThe Prime Minister's compound fell. Soldiers wept and surrendered; others were herded into captivity. Upstairs, the officers' offices were strewn with blood. The overweight Prime Minister lay dead in an ill-fitting uniform.\n\nOn the roof, Chanon and Basong climbed together. Explosions lit the city. In the east, the horizon brightened. The palace spire, its tip blasted away, formed a jagged step. Chanon knelt below it.\n\n'Step on my shoulders, Basong—raise the flag!'\n\nBasong sprang forward, climbed, and unfurled the red banner. In the wind, full of bullet holes, it rose proud and high.\n\nThe red flag danced as cheers erupted. It caught the dawn light; the monsters of night fled and vanished beneath its crimson glow."
  prcs.3048.a: "§RThe red flag dyes the §Yrising sun§! crimson.§!"

  prcs.3049.t: "Farewell"
  prcs.3049.d: "Red tides surged through Bangkok's streets. Red flags, banners, and crowds in crimson filled the avenues. Laughter, drums, and horns echoed as citizens lifted Chinese volunteers into the air. The golden palace shimmered beneath dozens of red flags, while ragged street children painted over royal portraits with mischief—the city's first true carnival in years.\n\nBasong stumbled through the jubilant throng, exhaustion weighing on him. He longed to sleep forever. Yet amid the crowd, he saw her—the familiar figure he'd never forgotten. He pushed forward desperately, but the sea of bodies separated them further and further.\n\nThen, she turned. Her face was as pale, as beautiful, as familiar as ever. Their eyes met amid the storm of celebration. Suda still wore that same dress. Her eyes no longer held tears, but pride.\n\nBasong's lips trembled; he tried to speak but no sound came. She held his gaze for a long moment, then raised her thumb and waved goodbye as the crowd swallowed her.\n\nHer voice echoed softly in his ear: 'I'm proud of you, Basong. But now—forget me. My wish is fulfilled.'"
  prcs.3049.a: "'I'll live on, carrying your hope.'"
  prcs.3049.b: "'No—I will never forget.'"

  prcs.3050.t: "The Red Continent of South Asia (Part I)"
  prcs.3050.d: "A Chinese soldier received new orders, standing over a collapsed Indian trooper. Smoke curled from his rifle muzzle. He lowered it, smiled faintly, and said in Hindi, 'The war is over.'\n\nConfused, the Indian checked his radio—it confirmed the same. In broken Chinese, he echoed, 'War... over.'\n\n'You speak Chinese?' the Chinese soldier brightened. 'When did you learn?'\n\nThe Indian scratched his head, pulling a worn booklet from his pocket—'Two-Hour Crash Course in Basic Chinese,' issued by the Indian Ministry of Defence.\n\n'Now that the war's over, what do you want to do?' the Chinese asked as they waited for transport.  \n\n'Me? Go home—to see my family. You?'\n\n'First, I'll see you safely handed over. Let's be friends—you're the first Indian I've met here. I'm Yang Qibin. You?'\n\n'Charma Kala,' he said, shaking hands. 'And you're my first Chinese friend.'"
  prcs.3050.a: "Facing the sunset, they helped each other toward the transfer post—their friendship had just begun."
  PRC_tfr_nl_china_nanyachidaluyi_tt: "Their story is recorded; later, we shall complete the bones of its foundation."

  prcs.3051.t: "The Red Continent of South Asia (Part II)"
  prcs.3051.d: "With the South Asian campaign drawing to a close, the task ahead was rebuilding this war-torn land.\n\n Kala was typical of his generation—dragged from his village by recruiters, given rushed training, and sent to the front. The good news: he survived. After being discharged and given fare money, he boarded the train home.\n\nIn civilian clothes, free of the stench of war, he relaxed for the first time. Yet some passengers, still filled with zeal, shouted about fighting to the last man.\n\nUnable to bear it, Kala rose. 'The war is over! Can't you understand?'\n\nThe ringleader—a high-caste man—grabbed him by the collar. 'Why surrender our homeland? What caste are you, to speak to me this way?'\n\nThe others looked away; no one dared intervene.\n\nBut Kala's hatred for such men boiled over. He punched the man square in the nose, venting all the humiliation of his service.\n\nWhen the train reached his village stop, Kala spat on the man's face before stepping off."
  prcs.3051.a: "As the doors closed, the train carried the wreckage of the old era away."
  prcs.3052.t: "The Red Continent of South Asia (Part III)"
  prcs.3052.d: "Kala dreamt—a nightmare drawn from his own past.\n\nHe was back in training camp: bullets flying, the instructor's shouts hammering his skull. Fear and exhaustion crushed him.\n\n'Not good enough!' the instructor screamed as Kala fumbled his rifle, missing the last shot.\n\n'You think you can face those bloodthirsty Chinese like that? On the battlefield, you trust your gun—and your comrades!' The instructor kicked him hard. Pain doubled him over. Then, the black muzzle of the rifle aimed at his head.\n\n'Trust me, Kala. It's loaded. If you don't believe me, roll away. Three seconds, or you prove your faith.'  \n\nToo hurt to move, Kala stayed frozen.\n\nIn his memory, the instructor had lied—the gun had been empty. But in the dream, a bullet fired. Darkness swallowed him. When he awoke, he was the one holding the gun—aimed at his instructor's fallen body.  \n\nPanic and guilt flooded him. Around him, comrades shouted, 'Why did you betray us?'\n\nA voice—Yang Qibin's—echoed: 'Don't lose yourself, Kala!' Strong hands grabbed his shoulders. 'Stay with me!'"
  prcs.3052.a: "He jolted awake, clutching the five-pointed star Yang Qibin had given him."
  prcs.3053.t: "The Red Continent of South Asia (Part IV)"
  prcs.3053.d: "Although his hometown was in a relatively poor region and had not suffered the worst destruction, the village elders said Kara was the first young man to return. According to the announcement posted by the PLA, the next group would not return for another week, but before that, Kara had to face the harsh reality of a village ravaged by war and then plundered.\n\nThere were essentially no able-bodied laborers left in the village. Beyond that, the children had long been sent away through family connections. At present, the only people remaining were women and the elderly. Yet when he pushed open the door of his own home, the sight before him tightened his chest.\n\nHis mother was fixed in front of a simple spinning machine. In the dim house, only a kerosene lamp glowed faintly, allowing her to barely see the work in her hands.\n\nSeeing her son return alive, she wanted to embrace him warmly, but years of sitting cross-legged at the spinning machine had left her with \"occupational pains,\" and she cried out the moment she tried to move.\n\n\"Ma, what’s wrong?\" Kara immediately opened the door as wide as possible to let in as much sunlight as he could. But nothing prepared him for the sight of her hands—covered in countless calluses. In the few months he had been away, the suffering she endured was something he suspected he would never truly comprehend.\n\nHis mother gently pounded her own shoulders, her voice hoarse as she slowly said, \"Ka… Kara… it’s good you’re back. Did anyone bully you in the army…\" Kara held his mother tightly, tears streaming down his face as he begged her not to speak, but she simply wiped his tears and continued worrying about him.\n\n\"Ma, I did well out there. Look, I came back safely.\" With that, he tried to lift her onto his back to take her to the town hospital for treatment. But the moment he picked her up, his heart sank.\"\n\nNews spread quickly: The new People's Government of India had been established in Delhi. The new tricolor flag bore a red star where the old wheel once spun. Workers, peasants, and soldiers filled the capital, chanting slogans. Across the countryside, villages like Kala's sent representatives to join local assemblies.\n\nHis mother watched the news on the neighbor's radio, tears streaming silently. 'Your father would have been proud,' she whispered.\n\nKala said nothing. He looked toward the horizon, where the morning sun rose blood-red. Somewhere beyond, in China, his friend Yang was likely smiling the same way."
  prcs.3053.a: "His mother's weight felt lighter than the rifle he remembered."

  prcs.3054.t: "The Red Continent of South Asia (Part Five)"

  prcs.3054.d: "It would still take a while to walk from his village to the town, and given the just-ended fighting, who would have the ability to carry him and his mother to the hospital?\n\nKara was anxious. This road carried his memories—when the conscription officer pushed him onto the truck, he had wanted to jump off somewhere along this very road and run back to the village. But things didn’t go as he wished; the truck was too fast, forcing him to give up on that idea.\n\nNow he only wished for a vehicle—one slow enough to see him waving, to notice the mother on his back, and kindly stop to take them both to the hospital in town. Reality’s merciless sun quickly shattered that fantasy, and his mother kept murmuring in his ear, \"Child, don’t worry about me. You should set me down, put down this burden, and go carve out your own future.\"\n\nBut if he truly abandoned his mother, how could he ever face the village—the place that gave him life and raised him? What would people think of her then? He didn’t dare imagine it, yet the long exposure to the sun made his head spin, little by little eroding what reason he had left.\n\nJust as he was about to give up, a vehicle—yes! The sound of an engine, one he remembered—appeared. He saw it approaching slowly. With the last of his strength, he murmured, \"Help us…\" and fainted. Before losing consciousness, the last thing he heard was—"

  prcs.3054.a: "\"Kara! Kara! Get him onto the truck, quickly!\""

  prcs.3055.t: "The Red Continent of South Asia (VI)"
  prcs.3055.d: "When Kala woke up again, he was already lying in a hospital bed, an IV drip in the back of his hand, and sitting beside his bed was none other than his first Chinese friend—Yang Qibin, with two guards standing next to him.\nSeeing him awake, Yang Qibin gestured for him not to move too much and told him to rest assured. \"Don’t worry. We are organizing an expert consultation for your mother, and we will soon provide the best treatment plan based on her condition.\" He peeled an apple for Kala while chatting as if they were old friends.\n\"Do you know how long you stood under the hot sun carrying someone? Conservatively speaking, you were probably under there for 3-4 hours. Hurry up and eat some apple to replenish your vitamins.\" With that, a peeled slice of apple was placed in Kala’s mouth. As the moisture and sugar were replenished, Kala gradually found the strength to speak.\n\"Thank you, Yang Qibin. Now, our whole family owes you one life, and I owe you two.\" Kala didn't understand why Yang Qibin was able to find his village. He recalled Yang saying he was planning to return to China when he was with the receiving unit.\n\"I know you have many questions for me. Let me formally reintroduce myself now. I am Yang Qibin, a volunteer for the China-Aid India Reconstruction Program, and the village I am responsible for aiding is yours.\"\nUpon hearing this seemingly fateful arrangement, Kala was first confused, then surprised, and finally, overwhelmed with emotion. He desperately wanted to hug Yang Qibin, but the tubes on his hand clearly prevented them. Yang Qibin just smiled, asked the nurse to come in, instructed them to take good care of him and his mother, and prepared to leave.\n\"Yang! Wait a moment!\" Kala suddenly realized a problem: what about the medical expenses for him and his mother? It didn't look like a small sum. Yang Qibin held up his index finger, shaking it slightly to signal that they didn't need to pay, and then explained the reason.\n\"This is a temporary local hospital converted from our field hospital, and we are currently still in the final stages of the special operation, so naturally, the medical expenses are being covered by our country.\""
  prcs.3055.a: "At that moment, the words 'China' became the eternal benefactor in Kala's heart"
  prcs.3056.t: "The Red Continent of South Asia (VII)"
  prcs.3056.d: "After he and his mother were discharged from the hospital, the second batch of young people returning to the village happened to be back as well, so the two of them hitch-hiked with Yang Qibin and returned to the village.\nAs soon as they entered the village, many people were drawn to the PLA military vehicle. They gathered around, wanting a closer look at the impressive vehicle, but were kept at a distance by the guards for safety reasons.\n\"Xiao Zhang, let them take a look.\" After getting Yang’s approval, the guards confidently allowed them to touch it, while standing nearby, ready to protect his safety at all times.\nYang Qibin stood on the military vehicle, holding a megaphone, and loudly announced to the people gathered around him in Hindi, \"People of India, your war is over!\"\nKala barely remembered what Yang Qibin said next; he only knew that a surge of impulse made him suddenly stand up. With dissatisfaction over the previous war and the arrival of peace, he and the people around him cheered and celebrated, expressing their gratitude in their own ways.\nThat evening, the village prepared a lavish banquet to celebrate the series of joyful events. At this moment, they had forgotten the pain of wartime and only wanted to fully enjoy this hard-won time with their relatives who had returned home. After the banquet, Kala went to Yang Qibin and voiced the question he had in his heart: \"Yang, why don’t you return to your homeland?\"\n\"This question, Kala, do you want to know my answer? Then take a walk around the village and see what is still missing.\"\n\"A lack of clean water sources, reliable electricity, and inconvenient transportation…\" Kala listed the things he remembered the village lacked, just as Yang Qibin smiled.\n\"These are exactly the things I’m going to help you bring.\"\nKala was speechless for a moment. After thinking it over, he recalled a life-saving phrase from his crash course book and, making his accent sound less awkward, spoke in Chinese."
  prcs.3056.a: "\"My Chinese Comrade, Comrade Yang Qibin.\""
  prcs.3057.t: "The Red Continent of South Asia (VIII)"
  prcs.3057.d: "Yang Qibin naturally knew how tedious these meetings were, but he had to be present. Because of this, he could only look down at his watch occasionally, mentally calculating when the meeting would adjourn.\nHe found it hard to understand why these small parties couldn't cooperate properly with the CPI, but instead, strove to fight for their own rights. Although the Indian government had declared the CPI and a large number of other progressive left-wing groups illegal organizations and brutally suppressed their activities during the war, they had reorganized with the help provided by the CPC.\n\"I think our focus should be on how to restore the Party's work, authority, and operations, rather than playing this so-called parliamentary house game here!\" Even when the CPI spokesperson threw newly formulated documents like the Party Constitution and agenda onto the faces of this group, it failed to shut them up.\n\"Let me clarify one thing first.\" Perhaps feeling from the bottom of his heart that such bickering would lead to no solution, Yang Qibin cleared his throat and said, \"I think the current top priority is to coordinate all the forces we can coordinate so that our reconstruction work can be completed as soon as possible.\"\nAfter hearing the "Honorary CPC Member’s" speech, they finally quieted down and began exchanging opinions with the leaders of neighboring parties. As one of the first Chinese Communist Party members who volunteered to stay and assist the CPI in rebuilding their homeland, the Indian side, in gratitude for his contribution, conferred upon him the status of "Honorary Communist Party Member of India," allowing him to audit meetings and offer Chinese suggestions on reconstruction issues.\n\"Comrade Yang, thank you so much just now. If you hadn't been present, I don't know how I would have advanced the meeting process.\" The CPI member in charge of chairing the conference shook his hand at adjournment. \"I really don't know how to thank you.\"\nHe slightly waved his hand. \"No need for thanks. Our two parties share a relationship of close cooperation. We in China sincerely hope to see the CPI take healthy root in this land and realize communism.\"\n\"I understand, I understand. It's a pity, though, that the CPI's party organization and grassroots structure have clearly been severely damaged, and even with your assistance, the number of party members is still tight...\"\n\"Wait, you said... could I, as an honorary member, recommend a party member for your CPI?\" Yang Qibin abruptly changed the subject, leaving the official puzzled, who could only respond."
  prcs.3057.a: "\"If he supports our organization and the Party Constitution, then yes, he can.\""
  prcs.3058.t: "The Red Continent of South Asia (IX)"
  prcs.3058.d: "Although Yang Qibin had said the meeting might run very late, Kala still stood waiting for him at the village entrance. On one hand, it was because Yang had promised to bring him a decent dinner, but on the other hand, he was quite worried about him. After all, he knew the situation of this area, and as an outsider, Yang... was not as familiar with it as he was.\nWhile waiting, Kala took the opportunity to reflect on what they had accomplished during this time: Reached an agreement with the water company, so clean water would be available to every household in the village in two days. Contacted the newly built power plant nearby, so the village lights could finally shine continuously at night... Yang Qibin seemed like a superhero; the promises he had made were being fulfilled bit by bit.\nRight, and these things were yet to be done. Using the light from the streetlamp, Kala took out a notebook and pen from his pocket and wrote down something that seemed small but was actually very important—making it easier for villagers to see a doctor; they could hire a doctor (crossed out), or *I could study medicine*, this is the main point, and needs to be taken seriously.\n\"Writing so seriously, what are you writing, let me see.\" Yang Qibin came over without a word, looking at Kala's task notebook under the light, seeing what they still hadn't done and the newly added items.\n\"It looks like you want to study medicine? But you’ve only just become proficient in spoken Chinese; can you understand the professional terms in those medical books?\" Kala nodded. Through his communication with Yang Qibin and the guards during this time, he could now speak Chinese fluently.\n\"Listen, Kala, I just had a word with the CPI people at the meeting. My mission term is almost up, and I will be returning to my homeland soon. But the reconstruction work here has only just started to pick up. I am very worried that after I leave, this area will revert to its former predicament.\"\nWhat? He just said he was leaving. Although the two of them had been busy during this time, yet he hadn't realized how quickly time had passed. Seeing Kala's obvious disappointment, Yang coughed slightly, \"Kala, what do I usually tell you?\"\n\"Be prepared to fight for communism.\" Kala’s voice was firm."
  prcs.3058.a: "\"Then, your struggle and mine will have a new goal.\""
  prcs.3059.t: "The Red Continent of South Asia (Epilogue)"
  prcs.3059.d: "\"This is your application approval letter, Comrade Kala.\" Beside his hometown, the newly established party organization officially pinned the party emblem on him. As he gently touched the slightly weighty emblem, his thoughts always returned to that night.\nThat night, Yang Qibin quietly left, leaving behind a membership application form and supporting documents. It wasn't until the next morning, when they noticed the two guards were gone from the doorstep, that they realized Yang Qibin had departed. The villagers were all in a daze that day, calculating that the past few months had passed so quickly. The young people grumbled that they hadn't learned anything yet and had wanted to show him their current progress.\nAs for him—Kala, the appointed village cadre—he searched his room for more information, wanting to know if Yang had planned future arrangements for them, but clearly, there was nothing. Just as he was about to give up, a letter was exposed under the pillow. He eagerly tore it open and read:\n \nTo Kala\nDon't miss me too much. My time was actually up long ago, but in order to do more on this land, I applied for two extensions from the organization, and both were approved. This time, the organization needs me on a new frontline to continue the revolution, hence the transfer.\nDuring these days, I increasingly felt that your drive and enthusiasm were the vital foundation for our enjoyable cooperation, as well as your willingness to accept my suggestions. To be honest, I always wanted to leave more things for you, but due to limited capacity, I could only write a letter of recommendation to your local party organization. You can take the application letter and supporting documents to apply and continue serving the people here.\nTime flies so fast; in the blink of an eye, it’s time to say goodbye. I hope that from now on, you will dedicate all your energy to the promise we made—to make our village better and better.\n                                                        Writer: Yang Qibin\nUnder the red flag, he gradually understood Yang Qibin's meaning: after Yang, after China, after the aid had left. Kala, India, must independently carry out socialist transformation. Holding the Communist Manifesto, Kala slowly spoke the sentence."
  prcs.3059.a: "\"I volunteer to join the Communist Party of India…\""
  prcs.3060.t: "The Unnamable Object"
  prcs.3060.d: "When the red cloth covering the sculpture was slowly unveiled, a colossal, monstrous object appeared before the crowd.\nAt first glance, the sculpture resembled a giant hand, a concrete-cast palm reaching for the sky, as if to pluck the sun. The rusted rebar was so explicitly exposed, in some places only steel with no concrete, this giant hand was deeply rooted in the base, straining to ascend, whether to grasp or to climb. The protruding \"branches\" also made the sculpture look like a giant tree.\nIt had no green leaves; instead, its branches were replaced by countless greeting cards, scarves, bridal veils, turbans, and notebooks. Steel, concrete poles, and wooden posts, without excessive processing, supported the sculpture in concert, allowing the giant tree to stand firm and the giant hand to hold up the sky. And at the very top of the sculpture, a radar dish lay quietly. Sunlight shone down, reflecting off the specially coated radar dish, making its gaze sharp and fixed on the cosmos. The sculpture required no other coatings, only displaying its most original and true colors.\nUnder this giant tree, there were small figurines molded from mud, their features indistinct; there were tiles bearing the smell of moss and mud; there were woodworker's chisels and painter's brushes; there were chipped celadon bowls painted with flowers; there were enamel cups covered in many "pockmarks"; there was glass with a slight blue tint, encased in an aluminum shell; and at the end of all these, a turned-off cell phone lay quietly. Data cables, wires, and network cables tightly bound these objects together, making them a single cluster that formed the base of the sculpture. And yellow soil, black soil, and red soil were interspersed, completely embracing these objects within their bodies, making them cling tightly together, no longer separated. There were many other things, including glutinous rice, crushed corn stalks, and flour dusted with a bit of ash.\nThe base supported this colossal palm, allowing it to hold up the radar that gazed into the cosmos. The roots of the giant tree were deeply embedded in the base, embracing it like a lover.\nWhat is this? Useful objects placed in the wrong position, pieced together here to form an unnamable object, then it must be trash—but is that truly the case?\nWho created it? The creators are too many to write down on a single iron or copper plate. Yet the creators are also very few, so few that there is only one name. And this creator is often mentioned by us, right beside us.\nWhat should we call this sculpture? That is indeed a good question. Its creators are enthusiastically debating the topic. One suggests \"Us,\" another \"Life,\" and even more literary names like \"The Sentient Beings Beneath the Firmament\"… But in the end, they could not reach a consensus, so its name field was left blank."
  prcs.3060.a: "In the eyes of different people, it might hold different meanings. Therefore, a mere name cannot define it."
  prcs.3061.t: ""Setting Things Right" - The Great Debate on Philosophical Issues (Part I)"
  prcs.3061.d: "A fierce debate over philosophical issues has erupted in academia, with different scholars expressing their personal views, not only in journals but also in forums and—internet comment sections.\n—Thesis\nIn the philosophical academic discussions of the forty years since the Reform and Opening Up, the Ontology of Practice has dominated as the mainstream textbook system. In the dissemination of higher education in our country, undoubtedly, only Marx's \"Philosophy of Practice,\" which centers on practice, is the true Marxist philosophy. In the current historical process of the "post-forty years" following the Reform and Opening Up, we should especially hold high the banner that \"Practice is the Sole Criterion for Testing Truth\" and move towards a new historical journey.\nSome people are now attempting to negate our proposition that \"Practice is the Sole Criterion for Testing Truth,\" which is effectively opposing the Historical Materialism of Marxist philosophy. This is a detrimental trend in academia. In the context of our country's market economy since the 1990s, the subjective philosophy centered on practice has long been the humanist philosophy guiding our Party, a humanism that emerged in opposition to the severe constraints of the "leftist" errors of the Cultural Revolution.\n—*Defending the Philosophy of Practice: Reflections under the New Guidelines*\n—Thesis\n...In fact, those who emphasize "humanism" are not steadfast Marxists; the so-called "humanist Marxists," tainted with petit-bourgeois sentiments, will inevitably lead to the annulment of the philosophical legitimacy of Marxism. In fact, this is a "regression" back to the embrace of Feuerbach's philosophy, which is fundamentally a reactionary, anthropological religion. Regardless of the bankruptcy of humanism in continental philosophy after '68, simply looking at the academic "humanist turn" following Khrushchev's reforms, we need to put a big question mark on this set of supposedly truly Marxist "Philosophy of Practice."\nClinging to their subjectivity, alienation logic, and metaphysics, they attempt to continue holding up "Practice is the Sole Criterion for Testing Truth" even while reviving the planned economy and true Marxist science. This is still a new manifestation of empiricist form. The attempt to continue defending mistakes and defending their new dogmatism is entirely without legitimacy.\nThe criterion of truth, and truth itself, are both the results of practice. The fetishistic worship of any single situation, the exaltation of any empiricism, is an anti-dialectical bourgeois ideology. —*Defending Marxist Science*\n—\nComment Section\nxx User:\nHumanism is an old issue, right? Why is someone promoting it again when the planned economy is being revived?\nxx User:\nThat's right, this feels a bit like Althusser.\nxx User replying to xx User:\nThat's Althusserian, that's Western Marxism.\nxx User: I wonder why the practice issue is being debated again now."
  prcs.3061.a: "A new great debate on the criterion of truth?"
  prcs.3062.t: ""Setting Things Right" - The Great Debate on Philosophical Issues (Part II)"
  prcs.3062.d: "—To *Defending the Philosophy of Practice: Reflections under the New Guidelines*\nIt is impossible for a philosophical question to have a perfectly rigorous, true answer. We have all experienced a history where politics overrides academics, and I do not wish to be attacked and slandered for our personal stances again under the guise of the so-called "new guidelines" by these young scholars who clearly lean towards the "Left."\n—Thesis\nThe young scholar's thesis is simply slander. He attacks our continued adherence to subjectivity as a so-called bourgeois ideology; they even compare us to China's "Stepanian." How is this conduct different from the "Cultural Revolution remnants" of the past?\nHave they forgotten that Marx already emphasized in *Theses on Feuerbach* that Feuerbach and his peers did not understand things \"as practical activity, not subjectively.\" Therefore, \"in opposition to materialism, the active side was developed abstractly by idealism.\" The negation of subjectivity and agency will lead to the same structuralist deadlock as Althusser, endlessly revolving and re-revolving in some kind of "subject-less" gibberish.\n—Thesis\nA certain professor calls my defense slander and attack, which means I have touched the old professor's sensitive nerve. However, I admit my language was too aggressive, but science brooks no challenge. Some scholars call me China's \"New Althusser.\" If we both defend Marxist science, then I *am* China's \"New Althusser.\"\nBut the professor seems to know Althusser well, using the emphasis on "subject-lessness" to deny my emphasis on science. In fact, "subject-lessness" is a direct return to the historical driving force of class struggle; it is precisely an emphasis on what Marx \"wrote about class struggle.\" Under the guidance of the new guidelines and the new planned economy, and on the condition of defending the first thirty years of history, emphasizing science, putting politics in command, and class struggle are all aimed at pulling our ideals as Marx-Leninists back into the reality of struggle. For the new guidelines, for the new ideals, we do not mind seeking possibilities from any scholar.\n—Thesis\nFrom a certain perspective, both scholars have fallen into certain errors. We can approach this by considering the perspective of Zhang Yibing. Historical Dialectics has two \"dimensions\"—the \"subjective dimension\" and the \"objective dimension.\" Anchoring the dialectical relationship between the two is a crucial academic topic, and under the \"new guidelines,\" the significance of re-discussing this issue is self-evident…\n—\nThe debate will not cease…"
  prcs.3062.a: "Why won't the arguing end?"
  prcs.3063.t: ""Setting Things Right" - The Great Debate on Philosophical Issues (Part III)"
  prcs.3063.d: " "The Thorough Settling of Accounts with Practical Materialism—A Critique of a Reactionary Philosophy, what a title…" \n"Hey, Professor Zhang, still reading the big-character posters." \nZhang Yibing waved his hand. "It's good that students have personal ideas, but it's wrong if the critique reverts to a Stalinist perspective." \n"Then what is your view, Professor Zhang?" \n"I've generally read it. If you're familiar with the developmental history of Marxist philosophy, especially if you know about the Chinese philosophical circles since the Reform and Opening Up, you'll find that his theoretical discourse is basically consistent with the so-called 'dogmatism' we once criticized. The only difference might be that their critique includes more contemporary philosophical content." Zhang Yibing gestured along the vertical historical development timeline.\n"And how did you figure that out?" The student looked at Zhang Yibing, curious about what the professor would say.\n "Look at this part. It shows that he, the author of this article, fundamentally failed to realize that the object is not itself—pay attention, the object is not itself. I already said in *Back to Marx* that Marx's historical materialism actually solved Kant's dilemma through historical practice, which is what I referred to in my lecture as the three 'first-nesses.' However, this author not only failed to grasp Marx's relational ontology, failed to grasp the 'perspective' of Marx's historical materialism, but instead chose to regress to that kind of 'object-first' metaphysical materialism." Zhang Yibing shook his head. ""Clearly, his critique is of East European Marxism; compared to the Chinese academic circles after the Reform and Opening Up, it is closer to the Yugoslavian Praxis School."\n "Yes, for example, Professor Yang Geng's Practical Materialism is the high unification of Historical Materialism and Dialectical Materialism. This simple delineation of humanism is vulgar." The teaching assistant chimed in to agree.\nThe student thought for a moment, then opened his mouth and said:"
  prcs.3063.a: " "Professor Zhang, I have one more question." "
  prcs.3064.t: ""Setting Things Right" - The Great Debate on Philosophical Issues (Part IV)"
  prcs.3064.d: " \"Humanism, alienation,\" manipulating the humanist language that had gone bankrupt with the May Storm after 1968, the great debate on philosophical issues further escalated on the internet, moving from discussions of \"Western Marxism\" to the \"consensus on Practical Materialism\" in academia over the forty years since the Reform and Opening Up. To avoid ambiguity, re-discussing Practical Materialism, Dialectical Materialism, and Historical Materialism has become a universal consensus in today's philosophical circles.\n**Yang Geng's Dialogue with Zhang Yibing.**\nYang: \"Practical Materialism, Historical Materialism, and Dialectical Materialism are actually the three characteristics of Marx’s New Materialism. For example, if you look at Marx’s *Theses on Feuerbach*, the ontology of practice ‘starting from the subject’ is inherently historical. Many people now criticize Practical Materialism, but they are actually repeating Stalin’s mistake in *Dialectical and Historical Materialism*—that logic of ‘nature is thus, and human society is naturally thus,’ a mistake that persisted in Soviet textbooks until the late 1980s. I already said in *Research on the System of Marxist Philosophy* that there is a difference between the compilation system of Soviet textbooks and that of Chinese textbooks.\"\nZhang: \"Yes, Ai Siqi’s *Dialectical and Historical Materialism* was a great improvement over the Soviet-compiled *Dialectical and Historical Materialism*.\"\nYang: \"Stalin’s mistake was that he turned the logic from Dialectical Materialism to Historical Materialism into the logic of ‘nature is thus, and human society is naturally thus.’ However, this fundamentally fails to grasp Marx’s profound meaning.\"\nZhang: \"There are fundamental differences between the theoretical construct of the Soviet textbook system and Marx’s philosophy. Stalin did not delve into the construct of Marx’s New Materialism; his theoretical schema still remained at the level of Old Materialism.\"\n \n**Dialogue with the \"New Left\"** \nReporter: Hello, you have been heavily involved in this great philosophical debate. How do you view the current discussion environment, or rather, what is your perspective?\nJiang Xiao: Whether it’s Zhang Yibing, Yang Geng, or Sun Zhengyu, all these people adhere to the logic of humanism. Practice can be explained objectively or subjectively. Practical Materialism, since its proposal in China, has always been the mouthpiece for the officials to evade real-world contradictions. Zhang Yibing now talks extensively about the subject. Has he forgotten that he once said in the 1990s, \"Giving the people enthusiasm and giving the people science are fundamentally different?\"\nSo I have long said that these official apologists, these state-employed writers, are essentially pedantic intellectuals divorced from the masses."
  prcs.3064.a: " "Sir, I have one more question" "
  prcs.3065.t: ""Setting Things Right" - The Great Debate on Philosophical Issues (Part V)"
  prcs.3065.d: "*Dialogue with the \"New Left\"*\nReporter: Since you evaluate it this way, what is your view on philosophy?\nJiang Xiao: The fundamental problem of philosophy, as stated by Engels, is the fundamental problem of all philosophy. The essence of the "Zhdanov system," which the internet has declared illegitimate, is Leninism and Maoist philosophy. The essence of rejecting the "Zhdanov system" is the negation of Leninism and Maoist philosophy. Under the distorted banner of negating the "Zhdanov system" is a truly reactionary Western Marxist philosophy, which is essentially bourgeois idealism. Let's take Althusser as an example. The current "trendy" Althusser research is fundamentally the promotion of petit-bourgeois reactionary philosophy. Althusser himself is neither idealist nor materialist, which indicates that Althusser himself is a wavering, reactionary petit-bourgeois intellectual. Chairman Gonzalo's assessment is absolutely correct: this French philosopher, this Structuralist Marxist, is fundamentally a French revisionist.\nReporter: Okay, you mentioned Western Marxism (WestMar). Could you evaluate WestMar?\nJiang Xiao: WestMar is a group of bourgeois intellectuals, reactionary philosophers who ignore the economic base, ignore the state apparatus, and only focus on cultural struggle, such as Lukács, Korsch, and Habermas, or more recently, Žižek, Foucault, and Althusser. The common characteristic of these people is a fundamental lack of practice; WestMar is essentially non-Marxist and anti-Marxist. Some people say the WestMar concept is a geographical concept, which is completely false, because WestMar is essentially an ideological concept—an ideological concept that opposes Leninism and orthodoxy, and advocates for a bourgeois trend of thought to interpret, supplement, and transform Marxism.\nReporter: Alright, could you talk about your philosophical view?\nJiang Xiao: Certainly. The fundamental problem of philosophy is the problem of thinking and being. The essence of being is an objective reality, and this reality is matter. The world is unified by matter. When we perceive matter, we perceive matter itself. To deny this is an anti-Marxist epistemological statement, a form of agnosticism..."
  prcs.3065.a: "\"Thank you for accepting our interview. Tomorrow, another comrade would also like to have a dialogue with you.\""
  prcs.3066.t: ""Setting Things Right" - The Great Debate on Philosophical Issues (Part VI)"
  prcs.3066.d: "Philosophical Researcher: Hello, nice to meet you. I won’t bother with formalities; I’ll get straight to the point.\nJiang Xiao: Good.\nPhilosophical Researcher: First, your definition of Western Marxism immediately becomes vague upon closer examination. Whether it's Lukács, Korsch, Habermas, or Marcuse before 1968, I agree with Anderson's definition of Western Marxism, especially regarding the absence of analysis of the state apparatus and the economic base. However, applying this label to Althusser is frankly hilarious. If you've read his 70s texts such as *On Reproduction* or *Philosophy and the Spontaneous Philosophy of the Scientists*, it's impossible to evaluate him as Western Marxism in the Andersonian sense. Even your claim of him being "anti-orthodox" (anti-Leninist) cannot be pinned on Althusser at all.\nJiang Xiao: Let me interrupt. First, I have already stated Althusser's petit-bourgeois nature. What is your intention in defending him? Secondly, regarding his later materialism of the encounter (aleatory materialism), is it impossible to see the essence of Althusser, this reactionary philosopher, during a period of revolutionary low tide? Weren't those articles written during the revolutionary high tide merely his superficial pretense?\nPhilosophical Researcher: What I find incredibly amusing is that you have an a priori assumption here: that Althusser is reactionary. Therefore, all arguments must lead to his negation. Isn't this a form of a priori idealism at work? Your labeling here is utterly meaningless for evaluation. This is precisely the teleology that Althusser specifically criticized.\nJiang Xiao: But...\nPhilosophical Researcher: I’ll continue. Second, the cognition of matter itself is clearly a regression to the pre-Kantian era. Regardless, Kant's proposition is abstract in nature. Once the cognition of matter is reduced to a simple correct vs. incorrect, and the issue of ideology *starting from the subject* is completely ignored, such an excessively simplistic proposition will only cause Marxist epistemology to lose all historical nature. Firstly, Marx's New Materialism, in the words of Xu Chongwen, Marx’s \"Practical Materialism\" \"asserts that things, reality, and sensuousness must not only be understood in the form of object or intuition, but also as human sensuous activity—as practice—understood from the subjective aspect; on the other hand, it consistently upholds materialism, maintaining the priority of the external natural world.\" The cognition of matter is first generated by historical practical activity; this is the *priority* of social relations."
  prcs.3066.a: "Furthermore…"
  prcs.3067.t: ""Setting Things Right" - The Great Debate on Philosophical Issues (Part VII)"
  prcs.3067.d: "Philosophical Researcher: It’s hard to take seriously when you turn critique into labeling and attacking with labels. This context perfectly aligns with Zhang Yibing's critique of the previous critique, because you really are attacking labels and doing quote-book excerpts. Furthermore, rather than truly defending Maoist philosophy, you seem fundamentally unaware of what you are defending. According to textual research by foreign scholars, the dialectical narrative in Mao's *On Contradiction* is closer to \"Hegelianized Leninism,\" because relevant texts, which are now considered Lenin's *Philosophical Notebooks*, had already been translated and introduced to Mao when he was writing. Your avoidance of this here is likely not due to any textual research, but simply because you read an article by a \"big-shot\" and wanted to parrot it.\nJiang Xiao: First, I must clarify that the essence of the \"Soviet Marxism\" you attack is Leninist philosophy and Maoist philosophy. I have read the *Philosophical Notebooks* many times, and this is my conclusion: there is essentially no difference between *Materialism and Empirio-criticism* and the *Philosophical Notebooks*. Your attempt to separate them here is completely wrong...\n\n...\n\nThe discussion is intense, the disputes are complex. Reaching a consensus on philosophical issues is much harder than reaching a consensus on practical matters. The debate will continue, but history must still be written. Conclusions established in abstract speculation will not necessarily hold true in reality. Just as the commentary Mao wrote when reviewing the article *Two Different Lines on the Question of War and Peace* from the \"Fifth Comment\" on the Soviet Communist Party Central Committee’s Open Letter states—"
  prcs.3067.a: " "Social Practice is the Sole Criterion for Testing Truth" "
  prcs.3068.t: "Supervision"
  prcs.3068.d: "It was a very ordinary morning. Old Zhang unhurriedly bought *youtiao* (fried dough sticks) and *mantou* (steamed buns) from a roadside stall. He suddenly remembered that he had an appointment with Old Wang to play chess in the park this morning. Old Zhang checked his watch, realizing he was going to be late, so he hurriedly took a taxi to the park.\nOld Zhang rushed into the park, only to find Old Wang intently staring at his phone, so much so that the chess pieces weren't properly set up and he had only eaten a few bites of the *shouzhuabing* (hand-grabbed pancake) on the board. Old Wang's brow was furrowed, his eyes glued to the content on the phone. One hand gripped the phone, and the other rested on his thigh. Old Zhang thought to himself, Old Wang isn't usually like this; he typically plays chess all day and barely looks at his phone. So, Old Zhang asked, \"Old Wang, what happened? You’re not playing chess or eating. Something’s wrong.\"\nOld Wang looked up as he heard the voice. \"Ah, yesterday the Central Committee announced a reform of the supervisory power, saying they want to give the power of supervision to the people. I’ve been reading the news for a long time but still don’t understand how this will be implemented. You're more educated than me, come help me take a look.\"\nOld Zhang leaned in to see. The news about the supervisory power reform involved a great many things, such as technology-based anti-corruption, organizational reform plans, and speeches from the Disciplinary Inspection Commission. Old Zhang felt dizzy too. \"I can’t understand it either. This must be a huge project, right?\" \"It is. I’ve never seen a spectacle this big,\" Old Wang agreed.\nOld Zhang paused for a moment, then saw the feedback link below and suddenly thought of something. He immediately said, \"Hey, tell me, how many corrupt officials and local tyrants have popped up in our little city over the years? They catch one batch, and another appears. I don’t understand this supervisory reform, but we can provide some feedback and contribute a little to this project. Maybe after it’s completed, catching corrupt officials will be much easier for us.\"\nOld Wang pondered for a while after hearing this."
  prcs.3068.a: "\"Now that you mention it, I also want to personally catch a corrupt official.\""
  prcs.3069.t: "Poem. Bullet"
  prcs.3069.d: "Dear friend:\nBy the time you read this letter, I will have boarded the warship of our Chinese brothers. These mysterious guests from the East once brought us silk, and now they are taking us home. May God bless them.\nYou might be confused. I am just a literature student, not a soldier, nor a fanatic. Why would I risk death to participate in such a futile war? Why return home through war instead of peace?\nI was once arrogant, hoping to use countless poems and calls for peace to show the world that our homeland had not been completely destroyed by the Israelis and the tyrants. That culture, beauty, and everything worthy of human pity still existed there. I hoped to write thousands of epics for my people, so that all humanity could see the commonality between us, lay down their weapons together, and move forward for peace. I sang softly in front of photographers, hoping everyone would see that our homeland still had kind-hearted children who knew how to care for white doves. I hoped to wash away the soot from the crows of the tyrants and the Israelis, to show people the white feathers beneath the black smoke.\nBut the dead told me: Enough. The enemy's crows are made of coal; they cannot change. Decades of support from the colonizers have enabled their recklessness. Their repeated bloody victories have exempted them from all their crimes. The hearts of our people are as vast as those of saints, but this reality has become unbearable for them. And now, war after war is unfolding on this land, and I absolutely cannot let them off. I am not qualified to forgive these people on behalf of those who have died and are dying, and even less qualified to talk about peace with them. If we do nothing, as time passes, people will pretend nothing happened and continue to walk docilely into the slaughterhouse at the sound of the shepherd’s flute. I will be there, using my notes to document our people, recording how they rush forward, one after another, toward the dawn, and recording how our prophet moves toward the sacrifice.\nFriend, thus, I have gone. I will return to my homeland. Friend, remember, do not expect the enemy to read the poetry you write; they never will. Even if all you have in your hand is a handful of loess, smash it at the enemy."
  prcs.3069.a: "The exiled poet has returned, a rifle in his hand"
  prcs.3070.t: "Great Nation, Small Affairs"
  prcs.3070.d: "He was spinning his pen out of boredom, his mind, which had been concentrating, had long drifted off, separating himself from the noisy venue. He decided to find something for his empty thoughts to do, so he started pondering the question he had thought of countless times: \"Why am I here?\"\nInitially, when the grassroots democracy policy was made public, he was very excited and posted his feelings on his social media: "Sweep away all vermin, absolutely invincible!" When the first general meeting was held, he also felt that spirit—working with familiar neighbors, collecting all sorts of information, watching the usually arrogant big shots nervously answering the people's inquiries at the meeting. It really felt like a world-changing task. But the subsequent events were not so wonderful: the venue was filled with various trivial matters, such as "the garbage bin placement at the community entrance is unreasonable," "the corridor light has been broken for three months and no one has fixed it," and "Old Wang next door plays his stereo too loudly and disturbs the rest." He had expected grassroots democracy to bring passionate debates, merciless critiques of the exploiting class, and earth-shattering social changes. Instead, it was all about neighborhood gossip, neighbor disputes, and property management issues.\nOn the stage, the neighborhood committee director was reading a summary of the rectification list from the previous few times: "Regarding the elevator noise issue in Building 3, the property management company has contacted repair personnel... Regarding the damaged community fitness equipment, replacement is expected to be completed next week..."\nHe looked at the neighbors around him, most of whom were listening attentively, nodding in agreement now and then. Auntie Li was taking notes, preparing to speak later; Young Zhang next door was raising his hand to signal a new problem. These people all seemed very engaged, as if these mundane, daily affairs truly related to the fate of the nation.\n"Maybe the problem is with me?" He began to doubt himself. Perhaps revolution is not always earth-shattering, and perhaps changing society starts from these small details. But... compared to the impassioned articles he read online, the grand narratives about the people being the masters of their own country, this was simply too ordinary. Nevertheless, seeing the serious discussion among his neighbors, he felt embarrassed to continue daydreaming. He braced himself and rejoined the meeting."
  prcs.3070.a: "It’s just that, compared to his initial expectations, this was far too different"
  prcs.3071.t: "The Golden Rooster Heralds the Dawn"
  prcs.3071.d: "Asia was deeply engulfed in the massive shadow of the Earth. In the dark side of the planet, countless bloodshot eyes were fixated, without exception, on the eastern part of the Asian continent, staring intently at the crimson rooster facing the direction of the sunrise.\nThe iron fist of the dark night was pressed down on people's heads. The closer this time came, the tighter, the more seamlessly, the more impenetrably this black hand clenched. They feared the rooster; they feared that cry that had been hundreds of years late. They had tried countless times to suffocate it, clip its wings, or even hack it to pieces. But after each trial by fire, that rooster had grown the feathers of a phoenix, piled up mountains of firewood, and only awaited the final moment of Nirvana. And the closer this moment was, the more terrified the dark night became, for they knew that the cry that would pierce the silence would set the night ablaze and make the sea of stars boil.\nThe people beneath the night waited expectantly, ready for battle. For hundreds of years, their eyes had grown used to the pitch-black night, their ears had submitted to the dead silence of the night, and their hearts had tightened their rhythm, afraid that even a heartbeat would invite the night's strangulation. They had forgotten who they were, forgotten that they had once lived under the sun, forgotten that this world was one where all beings were equal, and no one was inherently nobler than anyone else. But now, all this was about to end. People were only waiting for a signal, a gesture, a clap of thunder, that would allow them to drink this fiery liquor of anger.\nThe rooster stood tall on the roof of the world. It held its head high; it waited patiently. Centuries of hardships had taught it patience, and those centuries of bloody struggles had taught it one truth: the sun would not, and could not, be called forth by a single rooster's crow. Only fiercely rising flames could thoroughly burn away this night that was heavier than iron, and only the roar from the deepest core of billions of souls could completely tear apart this absolute silence. For this, it had prepared for a long time, waited for a long time...\nThe Earth slowly turned, and Asia gradually moved out of the planet's massive shadow. A bright line of dawn had appeared on the Pacific horizon. Everyone's heart suddenly tightened; they held their breath and gripped their weapons tightly.\nThe rooster shook its wings, lifted its head high, and, facing the light rising from below, used all the power and fury accumulated over the past century to let out a cry that transcended regions, nations, languages, and cultures—\n\"This is the World Liberation Front People's Voice channel,\""
  prcs.3071.a: "\"We now broadcast the *World Liberation Front's Proclamation to the Peoples of Asia*.\""
  prcs.3072.t: "Selecting Good Seeds"
  prcs.3072.d: "After discussion by the Propaganda Department of the Central Committee, we currently have five main propaganda directions.\nFirstly, naturally, is the socialist cultural freedom policy that our current government has been actively promoting. We have given it the old name \"Let a Hundred Flowers Bloom.\" Promoting cultural and artistic freedom is conducive to our government's image as enlightened.\nSecondly, to echo the rekindled enthusiasm for ideological enlightenment among the youth, we can re-organize and re-issue existing Marxist theories, and also encourage civilian interpretation and discussion of various waves of Marxism.\nAlternatively, we can encourage proletarian art, encourage the proletariat to create their own art, absorbing the strengths of avant-garde and futurist art.\nInternationalism has been a hot topic raised in recent years, and the Propaganda Department can certainly ramp up its promotion to encourage the people to step out of their isolationist small sphere, support the Party's world policy, and we can also resume corresponding cultural output to compete with the bourgeois "universal values."\nFinally, we can also bring up "class struggle" again, encouraging "Grasp Revolution, Promote Production," and through our practical achievements and statistics, we will focus on promoting the advantages of our system and the struggling spirit of the people, breaking the bourgeois's so-called "hegemony" over production."
  prcs.3072.a: "No need to rush; let's look at the choices we have"
  PRC_tfr_nl_china_zhenxuanliangzhong_tt: "The capacity of the propaganda department is limited; in fact, our propaganda core should ideally not exceed two directions"
  prcs.3073.t: "Debate in the Classroom"
  prcs.3073.d: "\"Classmates, today we start our course on Marxist Philosophy. Picking up from last time, what is matter? Matter is something that does not depend on man's subjective will, nor on man's sensory perception....\" On the podium, an old man was vigorously writing on the whiteboard, detailing the lesson's content. He looked down at the students only to find them either dozing off, playing on their phones, or chatting amongst themselves. Feeling uncomfortable, the old man decided to call out a name to restore classroom discipline.\n\"You, the second person from the left in the back row, you answer: what is matter?\" The old man pointed to a random student in the back. The student who was called out was unlucky; he was in a dream world until a classmate tapped his shoulder to wake him up. \"Hey, it's you.\" \"Huh? Me what?\" \"Get up and answer the question.\" Evidently, he was severely displeased about being woken up; his eyes were drooping, and his lips were slightly parted.\n\"Answer, what is matter,\" the old man said, thinking to himself, *I finally caught one, I can't waste this opportunity to make an example of him.* \"Hmm? Teacher, isn't the 'matter' in this textbook just Kant's 'thing-in-itself'? A matter that exists independently of man and determines man's consciousness. This greatly deviates from the first section of *Theses on Feuerbach*, which actually says, 'The chief defect of all previous materialism is that the thing, reality, sensuousness, is conceived only in the form of the object or of contemplation, but not as human sensuous activity, practice, not subjectively'.\"\nThe old man looked incredulous and asked, \"Then why don't you come up and tell everyone what matter is? If you're so good, why don't you teach the class for me?\" Unexpectedly, the student replied, \"Sure, I can even explain the original texts and show everyone the difference between the textbook's ideas and Marx’s own thinking.\" The student slowly walked up to the podium, picked up a pen, and started drawing. From *Critique of Pure Reason* to *The Difference Between the Democritean and Epicurean Philosophy of Nature*, he wrote various book titles on the whiteboard while nonstop explaining to the audience. The students, who had been minding their own business, were captivated. Some even stood up to debate him on whose logic was correct.\nThe old man sat by the side, happily watching the young people discuss. He thought to himself, *I never expected there would actually be a young person who genuinely studies Marx, and whose level is even higher than mine.* *\"Perhaps I should prepare for retirement and let the new people take over the lectures,\"* the old man decided."
  prcs.3073.a: "Therefore, a student is not necessarily inferior to his teacher, nor is a teacher necessarily wiser than his student. One hears the Way earlier or later, and each has their own specialized field. That is all."
  prcs.3074.t: "Victory Speech"
  prcs.3074.d: "General Dong Jun stood backstage, taking a deep breath, clutching the manuscript he had revised countless times. Through the slit in the curtain, he could see the dense crowd—reporters, military officers, government officials—all waiting for this historic moment.\nJust a while ago, he received the call from the East Sea Fleet. The trembling voice on the other end told him: the advance fleet engaged in fierce combat with the Taiwanese pseudo-fleet in the Taiwan Strait; after 6 hours of naval battle, the main force of the Taiwanese pseudo-fleet was annihilated, and the maritime defense of the Taiwanese pseudo-regime had completely collapsed. In that moment, Dong Jun felt his heart almost burst from his chest.\nIn the time that followed, everything felt dreamlike. News from the frontline troops came one after another—the Five-Star Red Flag was raised by Sun Moon Lake, on the peak of Alishan, and atop the Taipei 101 building. The speed of the war reports could barely keep up with the advancing pace of the soldiers. With the complete collapse of the Taiwanese pseudo-regime, the central government requested him to make a formal statement on behalf of the military. He knew this would be the most important speech of his military career, one that would be written into the annals of history.\nNow, as the staff signaled for him to go on stage, Dong Jun nodded, straightened his uniform, and stepped toward the podium. Each step felt especially heavy, not because of nervousness, but because this moment carried too much weight. The ancestors who established the military's political principles at the Gutian Conference, the Red Army soldiers who braved hardships on the Long March, the Volunteer Army heroes who fought to the bitter end in the War to Resist US Aggression and Aid Korea, and the martyrs who made the ultimate sacrifice in the Taiwan Strait campaign—they all seemed to be watching him now.\nA thunderous applause erupted in the audience. Dong Jun stood before the microphone, scanning the surroundings, seeing countless pairs of expectant eyes. \"Comrades, compatriots!\" Dong Jun’s voice pierced the venue, resounding powerfully, \"Today is another great victory belonging to the People’s Republic of China! The treasure island of Taiwan has finally returned to the embrace of the Motherland!\"\nA deafening ovation burst from the audience. Dong Jun looked at the excited faces below, feeling an unspeakable sense of pride surge within him. He continued to read his speech, but his heart had already flown to the unified Motherland—from the ice fields of Heilongjiang to the coconut groves of Hainan Island, from the snow peaks of the Pamir Plateau to the azure waves of the Taiwan Strait, across 9.6 million square kilometers of land, there would be no more shadows of division, only the sunlight of unification shining upon the earth."
  prcs.3074.a: "Now we see the Nine States united."
  prcs.3075.t: "Abolish Bidding, Define the Structure, End Tenders"
  prcs.3075.d: "The State Power Department's reorganization plan is implemented: the business landscape of the \"Two Grids, Five Majors, and Six Minors\" is reshaped, and a mandatory task model is comprehensively adopted for power construction.\nXinhua News Agency Report: One week after the official inauguration of the National Electricity Planning and Development Commission, the State Council today officially issued the *Implementation Plan on Deepening the Reform of the Power System and Optimizing the Functional Layout of Main Entities*. This plan marks the entry of China’s power system into a period of deep restructuring. The business scopes of the two major grid companies, \"State Grid\" and \"China Southern Power Grid,\" the five major generation groups (\"Huaneng, Datang, Huadian, State Energy, State Power Investment\"), and the six specialized energy enterprises (\"Three Gorges Group, CNNC, CGN, China Resources Power, SDIC Power, China Energy Conservation Group,\" collectively known as the \"Five Majors and Six Minors\") will be strategically redrawn. The ‘Competitive On-Grid Pricing’ mechanism is formally terminated, the bidding system for power construction is completely abolished, and a national task mandate system is established.\nAccording to the plan, the original \"Two Grids\"—State Grid Corporation—will uniformly operate the national UHV transmission network; China Southern Power Grid will continue to deepen the construction of smart grids in the five southern provinces and establish a cross-border power trading platform for Southeast Asia. For the \"Five Majors and Six Minors\": Huaneng Group and Datang Group will focus on traditional energy transition and flexible regulation, undertaking 60% of the national coal-fired unit clean-up modernization; State Power Investment Group and Huadian Group will lead the construction of a new energy system, responsible for offshore wind power development in coastal provinces; China Energy Investment Group will transform into a comprehensive new energy investment platform, coordinating the development of large wind and solar power bases in the Northwest, supplemented by ten-million-kilowatt-class energy storage projects; Three Gorges Group will focus on the integration of all river basin hydropower entities, consolidating hydropower stations in the Yangtze and Jinsha River basins, and establishing a unified river basin dispatch center; CNNC and CGN will focus on specialized nuclear power operation, respectively responsible for the development and operation of Pressurized Water Reactor (PWR) and Fast Reactor technology routes; China Resources Power and SDIC Power will mainly focus on regional comprehensive energy services, with a key emphasis on comprehensive energy solutions for industrial parks; China Energy Conservation Group will center on integrating distributed energy, coordinating the development of distributed resources like rooftop solar and biomass power generation.\nAt the power construction level, \"Power Construction Corporation of China\" (PowerChina) and \"China Energy Engineering Group\" (Energy China) will merge to establish the \"China Power Construction Group,\" which will undertake all UHV projects and power station construction tasks and will no longer participate in public tenders. Equipment manufacturing enterprises (such as Harbin Electric, Shanghai Electric, etc.) will implement an integrated \"research, production, and application\" binding: they will respectively serve the \"Five Majors and Six Minors,\" with technological R\&D directly guided by national laboratories. Furthermore, the power construction bidding system, in place for over twenty years, is also canceled, replaced by the \"National Task Mandate\" model, which will see the Ministry of Electric Power publish a *White Paper on Power Construction Tasks* every March. Project contractors will be designated through discussions by the Committee and representatives of the various groups. An AI full-process supervision system will be introduced into the regulatory framework, implementing blockchain notarization for design, construction, and acceptance, and central supervisory teams will be stationed for all extra-large projects.\nThis deep restructuring signifies that China’s power system has officially entered a \"New Stage of National Coordinated Development.\" \"Reform is not a simple return to the old system but a strategic choice based on energy security and low-carbon transition.\" With the completion of the adjustment of the leadership teams of the Five Major Generation Groups and the launch of the Task Mandate system, the construction of China’s new power system is entering a comprehensive acceleration phase led by the national plan."
  prcs.3075.a: "Power Planning Enters a New Era"
  prcs.3076.t: "An Unbroken Thread"
  prcs.3076.d: "As he placed the last book into his backpack, Wang Chencheng finally let out a sigh. The slogans and ideals he had promoted both now and in the past seemed about to be shattered by reality. He was unwilling to accept it. On the wooden desk he had used for many years lay a paper that made him gasp for air—*A Further Planning Proposal for the Training and Development of Teacher Wang Chencheng*.\nWhen he was still in college, his roommate joked, *It's easy for you to enter Xinjiang, but hard to leave*. He didn't understand what that meant back then. It wasn't until this document was suddenly delivered that his heart sank. When did he start to be unable to let go of this group of children?\n\"We believe that we, the youth aiding Xinjiang, comrades, definitely have the responsibility and ability to help the people in our backward and impoverished regions embark on a happy and beautiful future life.\" This was what he had said as a representative for Xinjiang aid. In the blink of an eye, this sentence was tested under the scorching sun and the endless yellow sand, but it hadn't reached the final step yet.\nA knock came at the door. The principal walked in with a forced smile. \"Teacher Wang, what’s the matter?\" the principal asked. Although he was the one who showed Wang Chencheng the document, he didn't know how to start the conversation and could only ask clumsily.\n\"I have to leave.\" Wang Chencheng's voice was calm, but his heart was already like shattered glass, ready to fall apart with one more gentle touch...\n\"Teacher Wang, you know that these children really like you, but I ultimately can't decide this matter. You have already contributed too much to our school and these children...\"\nBefore he could finish, Wang Chencheng’s glasses blurred. Unknowingly, tears were already streaming down his face. \"I don't want to leave, I can't let go of this...\"\n\"You can still come back later, can’t you? You're just being transferred for further study.\" The principal comforted him this way, but in reality, once he left, it would be difficult for him to return. The principal gently patted his shoulder, said two words, and then left."
  prcs.3076.a: "\"Take care\""
  prcs.3077.t: "A Tangle Unwound"
  prcs.3077.d: "After finally sorting out his thoughts and calming his emotions, Wang Chencheng’s phone rang again. The name displayed was the one he didn't want to see—Secretary Zhang.\n\"Hello Secretary Zhang, this is Teacher Wang Chencheng, is everything alright?\"\n\"Comrade Xiao Wang, how are you considering the organization’s matter?\" The voice on the other end, though amiable, pierced his heart, which was like rotten glass, with every word.\n\"Secretary Zhang, if I complete my further studies, can I still come back?\" Wang Chencheng asked the question, one tinged with personal emotion, as if he had finally made up his mind.\n\"Regarding this, let me first assure you that the students at your current school will definitely keep up with the curriculum in your absence. Secondly, I will bring up your request during their meeting and try to get a favorable outcome for you...\"\n\"I understand, Secretary Zhang. Thank you for your concern.\"\n\"Don't be so formal with us. We've lived here for so long, and we understand the pain of you all dealing with the immense change in environment and the insurmountable difficulties of acclimatization and other harsh conditions. We genuinely appreciate you, which is why I was able to secure this opportunity for further study for you.\"\n\"Thank you.\"\n\"And thank you for your contribution and dedication to the education of Xinjiang. The car to pick you up will be at the entrance soon; they will call you then.\"\nAfter hanging up, he quietly gathered all his luggage and sat on the bed, lighting a cigarette.\nIn his daze, all he could recall were these children. His own situation, however, was only briefly touched upon. Reality was driving him to a region with even fewer educational resources, but his sense of duty made him unable to let go of the land where he had established roots."
  prcs.3077.a: "\"A heavy heart\""
  prcs.3078.t: "The Sorrow of Parting"
  prcs.3078.d: "\"Teacher Wang, are... are you leaving?\" A tender voice sounded outside the door. He was instantly pulled back from his thoughts and stubbed out the cigarette. \"Yes, I’m leaving. What’s the matter?\" A student pushed the door open.\n\"Teacher, I have a problem I can’t solve. I don’t know if you have time to teach me.\" This was the least motivated child in the class, who used to drift through the school day and disappear after school. Yet, under Wang Chencheng’s personal guidance, he slowly developed an interest in learning and even discovered a talent for mathematics. He gently patted the bed, asking the child to sit down and take out his workbook. The child did so. He tried his best to use his usual encouraging tone to guide him. Finally, after realizing he had missed a condition, the child successfully solved the math problem.\n\"It was a very basic condition, why didn’t you see it? That’s not good, you need to be more careful when reading questions in the future.\" Wang Chencheng pushed up his glasses. This was likely the last time he would tutor this child. However, a moment later, he felt a weight suddenly appear in his left pocket. A quick touch revealed a pack of cigarettes, and a good brand at that.\n\"You child, why are you buying cigarettes at such a young age?\" Wang Chencheng’s tone immediately became serious. \"Which shop sold these to you? I need to report them for illegally selling cigarettes to a minor.\"\n\"It’s not like that, Teacher Wang. It's because I don't want you to leave.\" The child said, his tears dripping onto the workbook. \"I told my parents that you were leaving, and they said they wanted to buy you something to show their thanks, preferably the most expensive thing, because... you taught us... 'One day as a teacher, a lifetime as a father'...\"\nAs he spoke, Wang Chencheng’s throat was choked by the pack of cigarettes, rendering him speechless. The child's family was one who relied on the land for survival; this pack of cigarettes must have been a decision the family debated for a long time. Looking at the crying child, he could only force back his own impending tears, comforting the child by patting his head."
  prcs.3078.a: "\"I know\""
  prcs.3079.t: "A Taste Unlike Any Other in the Heart"
  prcs.3079.d: "Finally, the phone rang again, drowning out the child’s sobs in the room. Wang Chencheng answered the call, spoke a few words, and then wiped the child’s tears. \"It’s time.\"\nWhen he opened the door, he was surprised to find that, besides the colleagues and children he spent every day with, their parents, as well as the village elders and cadres, had all come to see him off.\n\"What is this, all of you?\" Before Wang Chencheng could finish speaking, his hands were filled with various items: fruit, naan bread, and all kinds of home-cooked food.\n\"When you first came to our village, we didn't give you a proper welcome. Now that you are leaving, we don't have much to offer, just these foods and the children's well-wishes. Take them to eat on the road,\" the principal whispered to him. Unable to resist the warm gaze of the crowd, he finally accepted everything, carrying what wouldn't fit in his backpack in his hands and around his neck.\n\"Teacher Wang, although we are all reluctant to see you go, thanks to your help, the situation here has improved. Now, there are other places that need you. We hope you will go and help their children just as you helped ours.\"\nHe nodded gently, then quickly got into the car under the crowd’s caring eyes. As the vehicle slowly started, he waved his hand at them, assuring them with his voice.\n\"I will! I promise I will! I will always remember you all!\" And as the village grew smaller and smaller in the distance, he finally could no longer hold back his tears and broke down crying.\nHe wished he could stay here longer, but if he stayed for too long, what about the other places? The other places that needed him?\n\"If I keep thinking this way, I will be far from my original oath.\" He flipped through his lesson plans and notes from these past days, reviewing his knowledge, then tucked the photo of himself and the children inside. In preparing for his time with the children of the future, he gradually came to understand the weight of the phrase, *to lead everyone toward a beautiful life*."
  prcs.3079.a: "\"Trade-off\""
  prcs.3080.t: "Rekindling the Beacon of World Revolution"
  prcs.3080.d: "Comrades! Workers of the world! Oppressed proletarians!\nAt this moment, my voice is surging toward you, passing through the cold mists of the oceans, sweeping over the waves of the great rivers, and crossing the high mountains of the continents. This is no ordinary speech; it is the spark ignited from within our hearts, the roar of the October Revolution in the twenty-first century!\nDecades ago, the great red flag descended from the Kremlin. The magnates of Wall Street traded humanity’s sweat and blood for gold in the stock exchange. The lords of London raised champagne glasses to celebrate the revelry of neo-liberalism. At the time, some mocked, calling this \"the end of the world revolution.\" But what about today?\nThe wheel of history will not stop because of the cries of bandits! Capitalism’s general crisis has penetrated deep into its marrow—it creates unemployment in Europe, famine in Asia, slaughter in Africa, and war in the Americas!\nComrades, revolution is never waited for! Today, we will use the unity of the global proletariat to tear open the Iron Curtain of neo-colonialism!\nSomeone says that another world revolution will once again cause a split in the socialist camp and once again plunge the revolution into a low point.\nBut I want to tell them: the People’s Republic of China has never stopped striving, and the ideal of communism has never stopped calling! We will use the \"世解阵\" machinery to forge weapons for our brothers in Asia, Africa, and Latin America, use the \"Beidou\" orbits to transmit signals for the global revolution, and use our great ideal to unite the people of the whole world.\nThe flame of revolution is never extinguished by the passage of time. As long as humanity exists for a single day, we will never stop pursuing beauty and happiness, and we will never abandon the ideal of communism.\nWorkers of the world, unite! This will no longer be a slogan, but an action plan! Starting today, we must set off a revolutionary wave around the world, and we must fight for the common emancipation of all mankind.\nLet the financial oligarchs of Europe tremble! Let the zaibatsu of Tokyo suffer insomnia! The dawn of socialism is illuminating every oppressed corner of the globe, and we will struggle for the most beautiful future for the rest of our lives."
  prcs.3080.a: "To Light All This Up"
  prcs.3081.t: "\"The Great Transformation in Progress\" (I)"
  prcs.3081.d: "In a small room next to the main conference hall of an office building in Beijing, Song Jianyu, the newly appointed Director of the National Planning Commission (NPC), was deep in thought. Liu Xinguo, the Deputy Director next to him, couldn't help but say, \"Why don’t you rest a bit more? The meeting won’t start for another five hours, and the relevant enterprise heads haven’t arrived yet.\" Song Jianyu looked up, revealing tired dark circles under his eyes. His response was low and steady: \"I can't sleep, Old Liu. Some people are more anxious than we are. They’re sniffing around, pulling strings everywhere to find out about this corporate restructuring policy. Although the specific measures have been finalized, how to ensure stable progress is no small challenge.\" With that, Song Jianyu put down the *Plan for the Nationalization of the Information Industry* and took a sip of his tea. Seeing this, Liu Xinguo said no more, waving a nearby secretary over to instruct them on the meeting details.\nA Mercedes-Benz passed through the outside crowd of reporters and stopped in front of the building. The middle-aged man who stepped out adjusted his glasses, a trace of imperceptible anxiety flitting across his eyes. Although he had confirmed certain ‘whispers’ through his network in Shenzhen, he still found it hard to believe the top leadership would make such a decisive move. Upon entering the venue, most of the ‘giants’ of the information industry were already seated. The man walked over to a familiar acquaintance, exchanging a few quiet words. The acquaintance responded with a nod, his expression a mix of helplessness and unwillingness. In an instant, the man’s expression became more solemn and uneasy. Shortly after he took his seat, the meeting officially began...\n\"Today, an important decision-making meeting regarding the nationalization of the information industry, spearheaded by the National Planning Commission and the State-owned Assets Supervision and Administration Commission (SASAC), was successfully held in Beijing. Key persons-in-charge from major enterprises in the information industry attended the meeting. The necessity of nationalizing the information industry was analyzed during the meeting. Director Song Jianyu of the NPC stated that this is to promote economic restructuring and provide crucial support for subsequent national economic system reforms. Through resource integration and policy support, the process of nationalizing information enterprises will be accelerated. The key persons-in-charge of all enterprises expressed firm support for the national decision at the meeting. The meeting focused on reviewing and passing the *Information Industry Sector Reform Plan*.\""
  prcs.3081.a: "To spit out what was swallowed"
  prcs.3082.t: "\"The Great Transformation in Progress\" (II)"
  prcs.3082.d: "On December 19, 1990, the Shanghai Stock Exchange officially opened as the first stock exchange in Mainland China. Its establishment promoted the development of China's capital market and was an important milestone in the development of China's financial industry. Today, the Shanghai Stock Exchange officially announced its indefinite closure, and the shares held by shareholders of over 3,700 listed companies were bought back by the central bank at market price. The National Planning Commission (NPC) held a press conference, where the spokesperson stated that this decision was based on an in-depth analysis of the financial market's susceptibility to fluctuations in the international economic situation, aiming to adjust the country's economic management development structure and prevent possible systemic risks. At the same time, the NPC promised to take a series of measures to ensure a smooth transition in the financial market structure adjustment. Some economists, led by Lu Qiyuan, believe that this is a prelude to the transformation of the national economic management system, the purpose of which is to highly integrate the market later to adapt to an automated economic system. However, most experts and scholars worry that this may lead to economic volatility and impact market confidence...\nInside a financial information data service company by the Huangpu River, Chairman Wang Ye, who had returned from the meeting in Beijing, urgently convened a high-level meeting. He tapped his finger on the desktop, a vein protruding on his forehead, which then receded with a sigh. \"The state’s data recovery policy is not a consultation, it’s an ultimatum!\" A high-level data executive suddenly raised his voice, slamming a document onto the table. \"All core financial data must be handed over, and the service transmission channel must be connected to NEMS. What about our financial services? Isn't this pulling the rug out from under us!\" The chairman's lips were pursed into a pale line. He suddenly let out a cold laugh, a sound like iron scraping glass: \"Do you still remember the ‘encouraging financial innovation’ that the regulatory authorities talked about three years ago? Now that financial data is being brought under the National Economic Management System (NEMS), we only have the authority to wipe our own butts. The future of finance? Ha, we can't even protect our own lifeblood, so what future is there to talk about?\" With that, he took a large gulp of his tea, only to find it had gone cold long ago. The liquid flowed down his throat with a blade-like chill. Outside the window, the setting sun painted the Huangpu River red. The conference room fell silent, with only the blue light of the projector casting on the wall."
  prcs.3082.a: "Your Future Is Not The Future"
  prcs.3083.t: "\"The Great Transformation in Progress\" (III)"
  prcs.3083.d: "Inside the National Planning Commission (NPC) conference room, officials from various relevant departments lined both sides of the table. NPC Director Song Jianyu’s sharp gaze swept over the leaders from the Ministry of Finance, the National Audit Office, and the Ministry of Natural Resources. Opening his folder, the title on the first page—*Risk Disposal Plan for the Nationalization of Real Estate Capital*—was heavily circled in red. \"Today is not just about discussion; it's about bomb disposal. The debt implosions in local real estate are just one small incision; the festering sore underneath is much deeper than we imagined.\" The Ministry of Finance leader’s expression was grave: \"In ten provinces, land transfer fees accounted for over 50% of fiscal revenue in the past five years, with a large portion of the funds used to fill debt holes. Once issues with nationalized enterprises trigger a chain reaction, local debt risks will be directly exposed.\" The National Audit Office leader took over: \"We tracked the associated local projects, and found a large number of problems, including illegal guarantees, fraudulent capital injections, and the recycling of land transfer fees. Some localities even used future land revenues as collateral.\" He tapped a red-stamped document, continuing his accusation: \"Now, just verifying land ownership is troublesome enough, and some parts have been illegally re-mortgaged by local governments...\" He paused, glancing at Song Jianyu’s ashen face. Song Jianyu's expression was stern: \"Troublesome? Will it only stop being troublesome when the buyers of unfinished buildings block the government's entrance and a run on the banks collapses the banking system? Nationalization is not the goal; it is the first step in reform to stop losses. The central government’s stance is very clear: lock down the land finance problem chain. Audits are to be directly stationed locally. Every day we delay now, the risk increases by another point. Tell the market, we are not saving real estate companies; we are reforming economic problems. Any local bureaucrat who wants to cover things up, let them first ask the central government!\"\nHuang Jun and Shen Zhouzhou rarely went out to eat today. When they first got married, the young couple pooled their savings for the down payment on an apartment in a development. Every day, the couple’s favorite thing was to pass by their new home under construction, but later they were met with news that the developer had fled. They had joined the crowds, holding banners to protect their rights, but to no avail. The timely mortgage payment was like a blood-sucking leech, draining most of their monthly salaries. The couple could only spend their days in regret and anxiety. But a few days ago, they saw that construction on the unfinished building had resumed. A notice was posted at the construction site entrance stating that a state-owned enterprise had taken over the construction, and the government had also tallied the situation and issued compensation payments. Huang Jun and Shen Zhouzhou were eating skewers, looking at the gradually forming structure of their \"new home\" not far away, feeling as if their future warm home was getting closer little by little."
  prcs.3083.a: "There will always be bread and milk"
  prcs.3084.t: "\"The Great Transformation in Progress\" (Conclusion)"
  prcs.3084.d: "At the meeting, the National Planning Commission's representatives articulated how nationalization would resolve the current chaos in the transportation industry, such as monopolies, unfair competition, and insufficient protection of employees’ rights. Their words were impactful. The heads of the various transportation enterprises present knew that these problems could not be solved by market regulation and standardization. The documents in front of the enterprise heads detailed the specific nationalization plan: enterprises would be gradually brought under state ownership, and private entrepreneurs would receive a certain amount of compensation. Although a considerable number of the attending entrepreneurs were uneasy about the nationalization policy, they had no choice but to show their agreement given the circumstances.\nAfter the meeting, the visibly relieved Director Song Jianyu of the NPC sat in his chair and said to Deputy Director Liu Xinguo: \"This phase of the work is mostly done. The completion of the transportation industry nationalization is vital to the National Economic Management System (NEMS), promoting the integration of urban and rural transportation, better bearing the responsibility of balanced development, and ensuring the effective implementation of national defense strategy.\" Liu Xinguo nodded and responded: \"I’ll go give the interim report to the central government. Old Liu, you should get some good rest too. To be frank, we are the Party's swift blade, cutting through the chaos at the forefront. There have been quite a few people with no small amount of complaints recently.\" Liu Xinguo then pulled an encrypted document from his briefcase: \"Some transportation and logistics enterprises that participated in the nationalization reform suddenly had massive layoffs a while ago. Some people are trying to create social conflict to pressure the nationalization policy.\" The content of the document pierced Song Jianyu’s eyes like a knife. \"Investigate the relevant personnel clearly. Activate the contingency plan if necessary.\" Song Jianyu’s tone was cold. His finger created a crease on the edge of the document as he glanced out the window, speaking in a low, steady voice: \"No matter how many opinions some people have, they cannot stop the wheel of history.\""
  prcs.3084.a: "The Wheel of History Rolls Forward"
  prcs.3085.t: "The Setting Sun"
  prcs.3085.d: "\"Finally, this day has come...\" Although numerous exercises and training had long ensured Wang Qiang was no longer the clumsy new recruit, when the sharp alarm sounded, his heart still pounded rapidly. Aside from the inevitable slight nervousness, the greater part of it was the influence of excitement.\nHaving officially joined the air force only after the Taiwan Strait campaign, Wang Qiang's service tenure was naturally not long. However, thanks to his outstanding talent and hard work, in just two years, he stood out from his contemporaries and even earned the qualification to participate in the East China Sea patrol. The driving force that sustained Wang Qiang during this arduous period, besides encouragement from his family and his own self-respect, was the veterans' bragging. Especially his instructor, a taciturn middle-aged man, who would always look intentionally or unintentionally at his own aircraft—a snow-white J-16 with the nose art full of F-15 silhouettes—whenever he was lecturing the trainees.\nThrough countless close encounters, Wang Qiang had seen all kinds of 'Taiyue' (Taiwanese and Japanese/US-allied) fighters. From the old F-15s to the new F-35s, and even the so-called 'pride of Japan,' the 'Xinshen' (ATD-X/X-2). He remembered the shape of every single one, so that when that day finally came, he could, like his instructor, paint his beloved fighter with a unique medal—of course, Wang Qiang knew this was practically impossible. After all, modern aerial combat was no longer a knightly duel. He could probably only confirm what he had shot down by the marker on his Heads-Up Display (HUD) radar.\n\"—232, bearing 146, range 180, contact target batch 01.\"\n\"232 acknowledged.\"\nWang Qiang’s random thoughts didn’t last long; they were immediately interrupted by the Airborne Early Warning (AEW) aircraft’s alert. Furthermore, the data link was instantly connected, causing several clear green dots to flash before his eyes. There was no fierce dogfight, just a smooth, familiar, and even boring routine, like a normal exercise. Wang Qiang only lightly squeezed the trigger a few times, and the under-wing PL-17 missiles emitted a sharp tearing sound as they broke the air, vanishing instantly, leaving only two thin white smoke trails.\n\"Attacked two targets separately, 232 launching completed, turning right to disengage.\"\nAfter confirming the PL-17 was tracking, Wang Qiang and his teammates left the air space. Although he wished to witness the result himself, the Standard Operating Procedures were not something to be casually violated. He just hoped the AEW pilot was meticulous enough not to let his tally mark lose a few numbers. A few minutes later, the radar dots disappeared. As for the enemy aircraft?"
  prcs.3085.a: "The Rising Sun Flag can no longer fly over the East China Sea, all that remains in the clouds are a few scarlet parachutes."
  prcs.3086.t: "What is the State?"
  prcs.3086.d: "\"Classmates, in today's ideological and political education class, let's discuss a question: How do we view the state?\" A teacher said, writing the characters \"How do we view the state\" on the blackboard.\n\"Teacher, isn’t it said in the textbook, ‘Only with a country can there be a home’? Without the state, where would we get personal life and personal security?\"\n\"Teacher, your question is too low-level. It’s well-known that only a powerful state can ensure our lives, isn't it?\"\n\"Exactly, why ask such a trivial question? Everyone knows the answer.\"\nThe teacher smiled without speaking. He simply took two sips of water and said: \"I know you will answer this way. But here's something you need to consider: What if you graduate and can’t find a job? What if you are crammed into a coffin-sized room? What if your monthly income is only a thousand? What if you work in a factory until you collapse from exhaustion? At that moment, someone tells you that these are necessary sacrifices for the progress of the state. Do you think you can accept that statement?\"\n\"The reason I’m discussing this issue with you today is to tell you one thing: we surrender our rights to the government to ensure our happiness. Therefore, state power is a means, not an end. To build state power by sacrificing the people’s happiness is undoubtedly putting the cart before the horse. Man does not live for the state; man lives for the individual and for the human collective.\"\n\"So, students, you must be wary of any group that preaches the eternity of the state, the supremacy of the state, or ‘the country before the home.’ If war comes, these people will only hide in bars and chat, too afraid to go to the front lines. Do not believe what they say. After all, so-called heroes are aplenty in the bars, but on the dentist's operating table, there is not a single one.\""
  prcs.3086.a: "\"The so-called state is merely a tool. If you don't forget this, you should be able to maintain your sanity.\""
  PRC_tfr_nl_china_heweiguojia_tt: "\"The greatest evil spawned by human civilization is probably the belief in the state.\" — *Legend of the Galactic Heroes*"
  prcs.3087.t: "That Which Remains Eternal"
  prcs.3087.d: "The old man took out a faded box from the drawer and opened it with trembling hands. Inside was a photo from his youth. Layers of uniform creases fit his steel-plate-like physique. His two dark eyes looked straight ahead. Even though the medals on his uniform were hard to discern due to the erosion of time, the sharp glint they contained still reflected out. This old photograph seemed to tell people about its owner’s youthful vigor, a glorious past that was hard to conceal even with the passage of time.\nThe old man held the photo and said meaningfully to the young person next to him: \"You all see this, right? This is the photo I took when I first enlisted. Back then, I went to guard the border in the Northeast, doing my part for the country. It was minus thirty degrees Celsius; that was all my sweat. Later, I retired and came home. My habit is to always stir things up. Seeing that it was difficult for the folks back home to get water, I simply built an aqueduct, leading a team to dig through the mountain to divert water. You now see the aqueduct, I played a part in it.\"\nA frost-like silence fell over the room. Thinking back, they were like red bricks; wherever there was a gap, they filled it. They endured all the hardship and exhaustion, so that future generations could enjoy the sweetness and the good life. Behind them were the copper walls and iron ramparts, the lights of countless homes, and a long national border. If it weren't for these tough men, how could there be the happy life of today?\nThe old man walked off the stage and patted a young man on the shoulder, saying with a smile: \"You kids nowadays eat very well. You are tall and strong, each one of you as robust as an ox. And you recently brought glory to our hometown, didn't you? Your contributions were even on CCTV. I see that I don't have to worry about our country lacking fine young men to bear the responsibility.\"\nThe young man nodded slightly, clenching his hands. Yes, even if time is like a shuttle and the light is like an arrow, some things remain eternal, still emitting a faint glow after the relentless scouring of time."
  prcs.3087.a: "Grasp my hands, riddled with contradictions."
  prcs.3088.t: "Electric Power System Reform"
  prcs.3088.d: "State Power Department Reorganization Unveiled, Vertical Management System Relaunched: Power System Reform Enters a New Stage.\nThe State Council recently officially announced the restructuring and establishment of the National Electricity Planning and Development Commission, ending the market-oriented experimental phase of the power system since the \"separation of generation and transmission\" in 2002. According to the plan, State Grid and China Southern Power Grid will be brought under direct central management, the business scope of the Five Majors and Six Minors generation groups will be re-divided, and simultaneously, the power industry's bidding process will be replaced by the National Task Mandate model. This marks the cessation of a series of market-oriented measures in the power system, including ‘Competitive On-Grid Pricing,’ since the separation of generation and transmission.\nWith the deepening of the \"Dual Carbon\" goals and the increasing pressure on energy security brought by international geopolitical changes (such as the recent intensification of the \"oil crisis\" in Central Asia), the challenges faced by the current decentralized management system—in terms of planning uniformity, efficient absorption of new energy, and cross-regional coordination efficiency—have become increasingly prominent. Concurrently, the deep adjustment of the domestic economic model has also rendered market-oriented mechanisms, such as the ‘Competitive On-Grid Pricing’ designed earlier to \"break up monopolies,\" insufficiently adaptive in ensuring basic supply security and supporting the energy transition. These factors collectively urged the decision-making level to systematically re-evaluate and restructure the power management system.\nAccording to the restructuring plan approved by the State Council, the power system will undergo three major changes: management architecture reconstruction, adjustment of responsibilities for the two grids, and the exit of market mechanisms. This means: the re-establishment of the \"National Electricity Planning and Development Commission,\" directly subordinate to the State Council, which will take over the power management functions of the former National Energy Administration and the electricity price approval authority of the National Development and Reform Commission; the State Grid and China Southern Power Grid will reclaim management authority over all pumped-storage power stations, integrating over 50% of the national pumped-storage resources to form a unified peak-shaving dispatch center; furthermore, the approval authority for inter-provincial Ultra-High Voltage (UHV) transmission projects will also be centralized; the 'Competitive On-Grid Pricing' mechanism on the generation side will be completely terminated, returning to a planned electricity pricing model. Electricity prices will adopt a \"benchmark price+special adjustment\" dual-track system: residential and agricultural electricity will follow fixed catalog prices, industrial electricity will implement differentiated industry pricing, and new energy electricity prices will be subsidized through special fiscal funds.\nThis adjustment marks the entry of China's power system into its \"third stage,\" following vertical integration and market-oriented exploration. The specific details regarding the business division of the \"Two Grids, Five Majors, and Six Minors,\" the complete abolition of the power construction bidding system, and the implementation of the National Task Mandate model have all been incorporated into the subsequent reform agenda, which is being formulated in earnest. This round of restructuring is by no means a simple return to the planned system, but rather a systemic breakthrough to achieve the energy transition through direct central management. When the share of new energy exceeds 30%, only a nationwide concerted effort can avoid resource mismatch. With the upcoming completion of the latest personnel appointments for the Five Major Generation Groups and the grid-connection testing of the two grids' dispatch systems...."
  prcs.3088.a: "....China's power system will enter a new cycle dominated by central planning."
  prcs.3089.t: "Systemic Air Superiority"
  prcs.3089.t: "Systemic Air Control"
  prcs.3089.d: "\"I'm going to shoot down a J-20? Really?\" Li Minghua stared wide-eyed in the cockpit, almost unable to believe the mission briefing he'd just received through his headset. His palms were sweating, and he instinctively adjusted his oxygen mask. Every pilot knew this was tantamount to throwing an egg against a rock. \"Thunderbird 02, did you hear that?\" the lead aircraft's voice came through the channel. \"Don't be nervous. Today is just to verify our combat capabilities supported by the system. You'll receive assistance from the electronic warfare system.\" Hearing this, Li Minghua took a deep breath, trying to calm himself. He knew from previous flights about the significant enhancement electronic systems provided to fighter jets, but he was still unsure if he could use this to challenge a higher-level aircraft. He checked the various parameters displayed on the MFD, confirming the data link was working properly. Through the cockpit window, he could see the lead aircraft's J-10Cs maintaining a standard two-aircraft formation in the distance. \"Thunderbird formation, this is Sky Eye.\" The AWACS commander's voice rang out, invigorating Li Minghua. \"The area where the target 'Golden Eagle' is located has been marked.\" \"Thunderbird 01 is responsible for illumination, Thunderbird 02 is responsible for attack. Respond upon receipt.\" \"Thunderbird 02 received.\" Li Minghua replied. Before his eyes, the data on his holographic helmet began to slowly unfold, as if invisible guide lines were truly pointing him in the air. Thunderbird 01 activated its gaze mode, narrowing the radar's detection range to the area indicated by the AWACS. Information transmitted via the data link caused a flashing directional marker to appear on Li Minghua's HUD—the target J-20. Li Minghua took a deep breath and moved his thumb to the launch button. Through the helmet display, he could see the cursor representing the J-20 already encircled by a small cross, and then he pressed the button. \"Missile launch!\" \"The PL-15 detached from its belly pylon with a sharp whistling sound, the orange flames of its propellant casting flickering shadows on the cockpit glass. Li Minghua felt a slight tremor in the aircraft, then watched the missile disappear into the distant sky. On the HUD, he could track the missile's flight status in real time. 180 km... 160 km... 140 km... The missile was flying steadily along its preset trajectory, while the data link continuously corrected its course. \"Missile flight normal, target stable,\" Li Minghua reported, his voice calmer than he had expected. At this moment, he felt as if he could feel the pulse of the entire combat system—the scanning rhythm of the AWACS, the illumination beam of the lead aircraft's radar, and the missile flying at high speed. 100 km... 70 km... 40 km... Suddenly, the target began a sharp turn, and Li Minghua's heart raced. The enemy had finally detected the threat, but it was too late. The target had entered the missile's no-escape zone. \"Target begins maneuvering!\" \"The lead aircraft's voice came through, 'Detecting the missile at this distance? The electronic warfare aircraft is quite powerful.'\" On the HUD, Li Minghua could see the cursor representing the missile rapidly approaching the target. 25 kilometers... 20 kilometers... 15 kilometers... The missile's onboard radar should be activated; it's searching for the stealth target with its own \"eyes.\" 10 kilometers... 5 kilometers... \"Hit! Target destroyed!\" An excited voice burst through the channel. Although there was no flash of light from the missile explosion, Li Minghua knew he had succeeded. The command from headquarters came through his headset, ordering him to return to base. He maneuvered the aircraft in a graceful arc, turning and flying back towards the base. On the way, an idea popped into his mind:"
  prcs.3089.a: "If the J-10 is this powerful, then wouldn't I be able to take off in the J-20?"
  prcs.3090.t: "Days"
  prcs.3090.d: "Fernanda Capio abruptly sat up in bed, gasping for breath, beads of cold sweat on her forehead. Her hand reached to her right side, but she felt nothing. She immediately scrambled into the next room, pulling back the curtains. Moonlight gently fell on her child's face, the soft chest rising faintly with the night breeze. An unfinished bucket of fried chicken sat on the table. The child had never eaten proper fried chicken before, but he devoured it like a wolf, yet he couldn't finish even two drumsticks and gave up. She fumbled her way to the shoe rack, picked up her worn-out rubber rain boots, and put them on.\nMoonlight guided her, while the dim light of the street lamp cast shadows of newly painted slogans and the hammer and sickle symbol of the New People's Army on the wall. Although it had rained, the path was muddy, but she had long been familiar with it. Plantation workers had to rise at midnight to cut rubber, and her decade-long life as a rubber tapper had made her know every stone on the path.\nFinally, she reached the gate of the rubber plantation. An elderly gatekeeper, holding a large dog, was dozing inside. She didn't speak but quietly slipped past. The old man should rest well—nobody would be cutting rubber at night. But everyone trusted him—after all, who would come to cut their own rubber now?\nShe entered the rubber plantation, the air filled with the scent of earth. The canal whispered to her, fireflies danced in the night breeze, and moonlight filtered through the layers of rubber leaves, leaving countless silver specks on the ground. Not far away, a charred, bald tree stood alone, a strange noose hanging from its branch. She tried hard not to think about what had happened there. People said the tree would be cut down in a few days, and everything there would fade with time. A snake slipped away from under her feet.\nFinally, she reached the grassy field where her husband stood, staring blankly at the plantation under the moonlight. She walked over and shook him.\n‘Pengpeng, did you have a nightmare again?’ she asked.\n‘Am I not dreaming right now…?’ the man mumbled. He lowered his head again, clutching the edge of his clothes. ‘I always feel like this world isn’t real… the house… the land… I saw a red flag hanging in the rubber plantation… All of this… is it real? Has it all ended?’\nFernanda looked up at the sky, the night sky washed by rain exceptionally clear. Tonight, the stars were brilliant. She paused and said:"
  prcs.3090.a: "‘Their days are over, ours are just beginning.’"
  prcs.3091.t: "Black Ships"
  prcs.3091.d: "Four aircraft carriers appeared on the sea surface of Tokyo Bay, followed by a long string of various warships. On those warships, the Stars and Stripes were particularly striking. \nThese warships entered the naval base at Yokosuka in a grand manner. The pier where the warships docked was filled with Japanese Self-Defense Force officials, who held both the Stars and Stripes and the Japanese flag, merely looking up at the massive vessel, red carpets already laid out. In a formal suit, a U.S. Navy admiral walked onto the pier. His gray eyes glanced at the Self-Defense Force officials lining the route of honor, and a uniform chorus of 'Viva la Mar!' erupted. Instantly, the pier became an ocean of Japanese and American flags. Yet, he paid them no attention, merely striding forward. \nAt the end of the red carpet stood Japan's prime minister, and upon seeing this U.S. Navy admiral, he eagerly extended his hand. The admiral merely gave a cold handshake in return. The driver opened the door of the high-end limousine for the admiral, who sat inside directly, and then the prime minister quickly climbed into the car. The driver stepped on the accelerator, and the dust raised by the car swallowed those still waving flags."
  prcs.3091.a: "Not far away, the monument erected by the Japanese for Admiral Perry still stood proudly"
  prcs.3092.t: "A Turning Point"
  prcs.3092.d: "The laboratory was filled with the scent of chemicals, as beads of sweat the size of beans slowly and powerfully slid down his cheeks. That day, Dr. Zheng conducted experiments in the lab as usual, though the results were not immediately successful. But perhaps the next experiment would yield results? Dr. Zheng thought with this mindset, then continued to tinker with the lab equipment.\nAfter a day of busy work, Dr. Zheng stretched, changed his clothes, and took a taxi home for dinner. He slumped into the seat, looking up and closing his eyes to relax. 'Old Zheng, you're a bit late home today. What's going on?' The taxi driver, Old Zhou, a familiar acquaintance, asked 关切 ly. Dr. Zheng smiled, replying, 'Oh, there's no such thing as being late or not. It's normal for us in research to work hard.'\n'Oh, did you watch the news today? I think it's related to what you researchers do.' 'What news? Let me see what's going on.' Dr. Zheng checked the news on his phone.\n'The central government has decided to establish a science and technology committee.' These large characters caught his eye. Dr. Zheng, who had been leaning against the seat, leaned forward slightly. His tired gaze refocused on the phone screen. 'You know, our unit leader mentioned this a few days ago. But I didn't expect it to be officially announced now.'\nOld Zhou chuckled, saying, 'Oh, I see. But it looks like the country is going to put in some effort for you this time. They say that technological reform is the top priority of all reforms. Without breakthroughs in science and technology, other projects won't be easy to push forward.' Old Zhou paused, then added, 'Old Zheng, I guess I'll have to pick you up late at night from now on.' Dr. Zheng showed no significant reaction, but instead smiled bitterly; 'I've been doing experiments for so many years, and I've failed and tried too many times. It might be a bit difficult to push me harder this time.' Upon hearing this, Old Zhou fell silent for a long while, then the only sound heard was the continuous adjustment of the steering wheel, without the usual banter between the two.\nAfter paying the fare and getting out of the car, Dr. Zheng looked at the stars in the sky. For a researcher like him, who toiled in obscurity, constantly rising from failure in search of breakthroughs, the news undoubtedly stirred a ripple in his heart. It could even be his only chance in a lifetime to achieve fame through a single success. Thinking of this, Dr. Zheng clenched his fists, took a deep breath, and strode toward home. Tomorrow's lab might carry a bit more hope.\n"
  prcs.3092.a: "Opportunity is now before me. I must consider whether this could be my only chance in a lifetime."
  prcs.3093.t: "Return"
  prcs.3093.d: "The lead-gray sky hangs low, like a heavy curtain, overwhelming. The cold and biting sea breeze, wrapped in a rich salty smell and a faint smell of rust, roared across the lonely port of Yokosuka. On the pier, several seagulls let out a mournful cry, circling, unwilling to fall. \n\nThe battle in 2022 was a nightmare in everyone's hearts: the waters of the Taiwan Strait were stained red with blood, the ships of the Self-Defense Forces sank to the bottom of the sea like broken toys, and even Japan, with the U.S. Seventh Fleet, known as the \"Needle of the Sea\", could not escape the end of failure. The rout in Taiwan was like a fuse, igniting everything they were familiar with - India, once regarded as a strategic ally, was repeatedly frustrated in border conflicts, and domestic contradictions intensified, almost falling into a prison cage; In Southeast Asian countries, with the infiltration and support of China, red waves have risen one after another, and even in Japan itself, those \"red bandits\" that are considered to be long extinct, radical left-wing groups, have sprung up like mushrooms after rain, and one after another violent incidents have made the already fragile social nerves even more tense. \n\nHowever, just when everyone thought the general trend was gone, news came from afar. The American Civil War finally ended, and the Patriot Front, led by Thomas Russo, successfully united the entire North American continent. The remnants of the U.S. Navy, which suffered heavy losses in the Battle of the Taiwan Strait, are now loyal to the new government and are ready to make a comeback. In the secret room of Tokyo, the high-ranking officials in suits and leather shoes are making dirty deals. In order to regain capital against China, the Japanese government is willing to pay almost any price - more US military bases, greater military spending, or even completely ceding Okinawa to US military jurisdiction. These things, once seen as symbols of national sovereignty, are now bargaining chips. \n\nThe seagulls on the pier were still chirping mournfully, and they seemed to have a premonition of something. This land, which was once baptized by nuclear bombs, is about to become a victim of the great power game again. And the politicians who shout \"for Japan\" are auctioning off the country's sovereignty and people to foreigners little by little. \n\nThe smell of rust is getting stronger and stronger, and the sea breeze seems to be mixed with the smell of blood. This is not a harbinger of spring,"
  prcs.3093.a: "But a prelude to a greater disaster"
  prcs.3094.t: "Master"
  prcs.3094.d: "In the early morning of Naha Harbor, the fog was shrouded in mist, and the sea water had a dead gray sheen. A low whistle was heard in the distance, and it was the new Seventh Fleet slowly sailing into the harbor. In order to show their military appearance and military might, the Americans spent a lot of effort to renovate the warships that had not been maintained for several years to make them look shiny, but for some reason, the remnants of the defeated generals of the Seventh Fleet and the members of the Sea of Japan who came to greet them only saw a piece of decay, perhaps it was their delusion. \n\nIn the conference room, the smoke filled the air, connecting with the sea mist outside the window, blurring the faces of the master and the loyal servant. The new fleet commander was reading the \"New Covenant\" in an almost charitable, unquestionable tone. The Japanese Self-Defense Force officers opposite him kept nodding, as if they were listening to the only truth. At the moment of signing the agreement, a long whistle sounded outside the window again, loud and arrogant, as if announcing the unquestionable return of the old era, whether the people of this land were angry or afraid. \n\nOutside the port, Ryukyu fishermen are returning from their nets. They know that from today onwards, this sea area where they have lived for generations will once again become a training ground for foreign troops. They also know that the agreement just signed by those politicians will completely reduce the island to a pawn in the great power game. They also know that once the war really breaks out, they, the common people, will bear the brunt of the devastation of the war. But they understand that they have no choice - countless anti-American protest marches have been exchanged for more warships and American soldiers, and now the numb people just want to survive before the war comes, waiting for tomorrow. \n\nThe sun sets, and the blood-colored sky reflects this ancient land. The old people sat on the beach, looking at the steel behemoths in the distance, their eyes shining with complex light. They vaguely remembered that it was as if a giant beast with the Rising Sun flag passed through the same place, and they had promised to bring the glory of the Greater East Asian Holy War to the Yamato nation, but in the end it only brought blood and death. And now, the behemoths with a different flag are here again, this time what do they promise? Freely? Democracy? Or another doomed war of revenge? "
  prcs.3094.a: "Go and inform the Prime Minister!"
  prcs.3094.b: "Maybe this sounds good, but it was the same last time."
  prcs.3095.t: "Draft Supervision Opinions"
  prcs.3095.d: "Supervision commissions of all provinces, autonomous regions, and municipalities directly under the Central Government, and directly subordinate agencies: In order to better implement the Supervision Law of the People's Republic of China and promote the standardization and rule of law of supervision work, in accordance with the Decision of the Standing Committee of the National People's Congress on the Formulation of Supervision Regulations by the State Supervision Commission, the State Supervision Commission has studied and drafted the Regulations on the Implementation of the Amendment to the Supervision Law of the People's Republic of China (Draft for Comments) (hereinafter referred to as the Draft for Comments). This public solicitation of opinions aims to enhance the participation of the people, explore the three-dimensional social supervision system at a deep and multi-level level, and promote the law to be deeply rooted in the hearts of the people. At present, it seems that the supervision system between provinces and cities can no longer meet the growing needs of the people. In order to further strengthen the central supervision system and promote the construction of the rule of law and a better life for the people, this draft is hereby issued to the public to encourage the masses to actively participate in the construction of the social rule of law and enhance the concept of governing the country according to law. The draft mainly includes the following aspects: \n1, the supervision power will be issued on a trial basis to people who know the law, abide by the law, and know how to use the law, and encourage the people to establish cooperative organizations under the guidance of supervision agencies at all levels, so as to explain the relevant content and meaning of the \"Draft Opinions\" and assist local supervision agencies in pilot exploration and reform. On this basis, the scope of social supervision should be gradually expanded, and attention should also be paid to the relevant welfare and safety guarantees of the people who actively participate. Excessive enthusiasm and interference by foreign forces in the process of pilot exploration should be avoided, and supervision commissions at all levels should be asked to play a guiding and stabilizing role. 3. Make more use of the Internet, artificial intelligence and other science and technology in the new era, expand the means and methods of communication with the people, use more advanced supervision technology to supervise, investigate illegal and criminal acts in office, and promote anti-corruption work. \n4, cooperate with other departments, such as discipline inspection commissions, act in unison, and exchange opinions. "
  prcs.3095.a: "The public may provide feedback on the draft for comment in the following ways:
  PRC_tfr_nl_China_jianchayijiangao_tt: "Visits: 250914561"
  prcs.3096.t: "Digital Future"
  prcs.3096.d: "If the well-connected transportation network is an engineering miracle created by China in the past, then the NEMS network that is densely covered with cobwebs across the country today is a great miracle of science and engineering in China's new era. Every day, every hour, every minute, every second, the economic information from production enterprises across the country is transmitted to the NEMS branch nodes of major cities, and after analysis and processing, it is transmitted to the general fulcrum in Beijing, so that it can derive the overall situation of the national economic operation and provide accurate data reference for the Central Planning and Economic Commission to make major economic decisions. Therefore, as a network engineer who maintains the general fulcrum, Xiao Wang has an extremely heavy responsibility, not only to master the knowledge of network processes, but also to learn economics, so that he can find out the types of errors from the huge data content and correct them. \n\"Xiao Zhang, now the enterprises in a certain place are really bold, and they dare to collude with local governments to falsify production data and directly double the output. Xiao Wang chatted with his colleagues during dinner. \"Yes, the government in that place was directly cleaned, if it weren't for the NEMS system, they would have been mixed in, and God knows what kind of damage it would cause to the economy.\" Xiao Zhang replied. \nXiao Wang thought for a while and said, \"To be honest, if our system can go deeper into the national economy, there will be no chance for the local government to manipulate the economic data, but I don't know how difficult it is to find a feasible solution.\" \"\n\"So now the organization is also researching various solutions, but I have the impression that the most feasible one is the one that uses artificial intelligence on a large scale, what is it called......"
  prcs.3096.a: "By the way, it's called the Long March Plan."
  prcs.3097.t: "Family Banquet"
  prcs.3097.d: "Sun Partridge opened the door and saw his wife's white robe hanging on the coat rack, and as he took off his uniform, the fragrance that escaped from the air hit him. The gluttonous worms in his stomach were instantly seduced, urging him to find out quickly. \n\"Partridge, are you off work? My meal has just been made, come and eat. The female voice he was no longer familiar with sounded, but it made him even more puzzled: after all, cooking only existed in the memories of when they first lived together. And when he glanced at the dining table, the fish-flavored tofu hanging on the table, the paper-wrapped chicken with sizzling oil, and the steaming chicken stewed with mushrooms immediately caught his eye. Before he could react, a soft song flew into his ears, and his wife Xiang Hui floated out of the kitchen with it. Xiang Hui looked at the stunned Sun Partridge, laughed out loud, and beckoned him to quickly serve the food and eat together. \nThe fresh aroma of tofu spread in his mouth, and Partridge Cheng savored the food in the bowl carefully, but the rice he swallowed did not suppress the doubts in his heart, so he finally spoke:\n\"Hui, why did you suddenly remember to cook today?\" \n\"The general practitioner in the hospital has been quite relaxed lately, so I have a little bit of leisure. After all, it's not a thing to eat boxed lunches all the time. \"\n\" What's going on? The price of medicine is cheaper, and there are more types of drugs and special drugs that can be bought, so many minor illnesses and pains are solved by the people themselves. \"\n\" I still remember the days when we first got married, we were huddled in a small apartment to count the days. At that time, I was so tired that I came back every day, you were too lazy to cook, and I was too lazy to wash the dishes. \"\n\", isn't it? Xiang Hui smiled, \"I thought housework was easy, but after a tiring day at work, who still has the heart to do this.\" Who wants to get such a big house that we can live in now?\" \n\"However, if you cook so many dishes, it will be troublesome to wash the dishes when the time comes......\" Sun Partridge felt a little unhappy in his heart and was about to volunteer, but Xiang Hui stopped him. \n\"I won an automatic dishwasher in a lottery a few days ago, let's let it do this kind of thing in the future......"
  prcs.3097.a: "Bowls and chopsticks collide, singing a crisp ballad"
  prcs.3098.t: "Cease Fighting and Stop Fighting"
  prcs.3098.d: "CCTV News reported on November 20 that on the 19th, 124 officers and soldiers of the first echelon of our country's 25th batch of peacekeeping forces to the Congo departed from Lanzhou Zhongchuan Airport and took a military plane through Korla, Kashgar, Karachi, Pakistan, and Djibouti, and are expected to arrive in the Congo mission area on November 21 to carry out a one-year peacekeeping mission. \nThe 25th batch of peacekeeping troops to the Congo has a total of 218 personnel, including 175 engineers and 43 medical units. After arriving at the mission area, they will be mainly responsible for engineering survey, road construction, bridge erection, destruction of unexploded ordnance, medical treatment and humanitarian relief. \nSince our country first sent peacekeeping troops to the Congo in 2003, it has sent more than 3,000 peacekeeping officers and soldiers to the Congo. In an environment of turmoil and frequent dangers, Chinese peacekeeping officers and men have lived up to their trust and completed various peacekeeping tasks brilliantly, winning full recognition and widespread praise from the Congolese people and the international community. "
  prcs.3098.a: "We will bring peace"
  prcs.3099.t: "The military and the people are united as one"
  prcs.3099.d: "In a mountain village where disaster relief has ended, soldiers of an engineer company of the People's Liberation Army are packing their equipment and preparing to return to their stations. \nCompany elder Liu wiped the sweat beads from his forehead and looked back at this small mountain village where they had been fighting for a long time. The ruins have been cleared, temporary resettlement sites have been built, and the lives of the villagers are gradually returning to normal. \n\"Company commander, the villagers are here. Squad leader Xiao Wang pointed as he said, Lao Liu followed his fingers, and a stream of people was running towards them. \nI saw Uncle Zhang, the leader, leading some villagers, walking towards them with various foods in his hands. There are canned eight treasure porridge, Red Bull drinks, as well as several boxes of instant noodles and various biscuits. \n\"Comrade of the People's Liberation Army, thank you for your hard work these days!\" Uncle Zhang held Lao Liu's hand and said excitedly, \"Our village has just experienced a disaster, and there is nothing to entertain you well, so I hope you can accept the food we sent.\" Lao Liu hurriedly waved his hand: \"Uncle, this is what we should do, we can't ask for things, besides......\"\n\"\n\"I must want it!\" Uncle Zhang's tone was extremely resolute, interrupting what Lao Liu wanted to say next, \"You are the saviors of our village.\" Since it is a favor, then accept it generously. \"\n\" Uncle Zhang, really not, we have discipline. Lao Liu continued to decline, and at the same time signaled to the car soldiers behind him to prepare to leave. \nSeeing that the PLA soldiers resolutely refused to accept the food, the villagers were anxious. As soon as Uncle Zhang winked, several young villagers immediately rushed to the military vehicle and threw canned eight treasure porridge and red bulls into the carriage. Lao Liu and the others planned to dissuade them when they saw something wrong, but they were caught by Uncle Zhang beside them, and there were two more boxes of food and drink in their hands. \n\"Ouch!\" Xiao Wang didn't have time to dodge in the car, and was hit in the head by a can of eight treasure porridge, grinning in pain. \n\"It won't hurt if you put it away, haha! A villager aunt smiled and continued to throw the Red Bull into the car. Seeing that he couldn't stop it, Lao Liu had to shout: \"Stop, stop, stop!\" Can't we accept it!\" \nThe villagers stopped, with satisfied smiles on their faces, and then amidst the goodbye of the villagers, Lao Liu and his party drove towards the station. On the way back to the station, Lao Liu touched Xiao Wang's head, \"Does it still hurt?\" \"Of course, company commander, I really didn't expect them to forcibly send it to us.\" \nHearing him say this, Lao Liu laughed, \"Neither of us thought of it, but this also proves one thing - we both put each other in our hearts and are willing to treat each other with sincerity.\""
  prcs.3099.a: "Therefore, we must study this lesson of the villagers." "
  prcs.3100.t: "Megalitis Cracking"
  prcs.3100.d: "Rain, gently patting everyone. Everyone was silent, staring at the stone tower. \nThe stone tower was like the fangs of a wild wolf, sticking out from the land of Miyazaki Prefecture and exposing it to everyone's eyes. Hundreds of rocks from the land of Japan pressed against 238 stones from China and 123 stones from Korea. This pressure has been pressed for more than 80 years. Thousands of North Korean People's Army soldiers and Chinese People's Liberation Army soldiers stared at the stone pagoda in silence. And some Japanese with red ribbons around their necks and various helmets also stared at the stone tower in silence. \n"Eight Hong, a word that originally symbolized a family in the country, is engraved on stones from Miyazaki Prefecture. Scold! These stones in a small deep mountain in Miyazaki Prefecture have also been transformed and become representatives of the whole of Japan. After all, who doesn't know that this is the birthplace of the "one lineage for all generations" of the emperor's family? After all, as long as there is an emperor, then Japan will become Japan. However, the emperor's boasting still has to be paid by the Japanese people. For this 10 million yen tower, the Japanese people "donated" 5 million, and the remaining "5 million" was naturally paid by them earlier. \nAnd those stones from China and North Korea were crushed under them by hundreds of stones of the Heavenly Emperor. Despite the wind and rain, these stones can still identify their origin - Mount Tai, Sun Yat-sen Mausoleum, the Great Wall, the Korean Governor's Palace...... They were uprooted from their hometowns, pressed under them in this way, blown by wind and rain, exposed to sun and rain, and they were silent for more than 80 years. \nThe engine of the engineering armored vehicle roared and slammed into the boulder. But the crowd was silent, and everyone stood there like stones. No one spoke, no one moved. Everyone is waiting, waiting for that moment to come. \nWhen the construction vehicle hit it, the boulder suddenly collapsed. The stone tower of "one series for all generations" shattered in the air like powder and turned into dust, while the engineering vehicle only used a little force. Yes, it disintegrated. \nRaindrops fell on the stones of the tower base and on the faces of those who were silent. "
  prcs.3100.a: "The water marks slipped down, and it was the tears of the foundation stones"
  prcs.3101.t: "Requencing Steel (1)"
  prcs.3101.d: "Eight-year-old Xiang Dongming sat in front of his house, the big yellow dog next to him was one of the few playmates, and the mud on his face had long dried from playing, and he looked like a sloppy little refugee in the afterglow of the setting sun. Suddenly, Xiang Dongming looked at the looming figure on the loess road in the distance, and ran over excitedly, and the big yellow dog on the side followed the little master. When one person and one dog approached, the owner of the figure, an old woman with a hunched back, took out the potato cake she had bought in a hurry, the oil paper was steaming, wrapped in the unique mellow aroma of mountain potatoes, and she handed the food to Xiang Dongming: \"Xiao Dongming, gnaw while it's hot, don't burn it.\" Xiao Dongming skillfully helped the old man take the basket and carry it on himself, and turned his head and asked while eating: \"Grandma, why have you been gone for so long today, is it my dad who has come to news?\" \"No, they are building houses in the city and are very busy.\" The old man replied with a kind face, and then walked slowly home with Xiao Dongming. After entering the door, the old man took out a yellowed book from his arms and gave it to Xiang Dongming, which was an old book she bought at the vendor for two yuan when she rushed to the market, after all, she usually had to do farm work, and her son and daughter-in-law went out to work, and the illiterate old man should buy it for his little grandson to relieve his boredom. Although Xiang Dongming is in the second grade of elementary school, he has never seen any other books except textbooks, and novels have only been seen by his classmates. After Xiao Dongming got the book, he held the \"baby\" and jumped to the edge of the courtyard dam and sat down. Looking at the cover, a person riding a horse and waving a knife, wearing a strange pointed hat, tickled his heart, rubbed the title of the book with his fingers, and unconsciously read aloud: \"How Steel is Made\"......\nThe sunset reflected the basketball court on the cement floor in a yellow color, Xiang Dongming and a few classmates skipped class, sweating and playing ball here, although there were only three days left in the countdown to the high school entrance examination on the blackboard in the classroom, but they couldn't even find a trace of anxiety on their faces, just like most left-behind children in township middle schools, they had long learned to give up on themselves and lie flat. Like weeds, let the wind of fate blow wherever it goes. After playing, several people sat aside, one of them poured half a bottle of water, wiped his mouth and said: \"Anyway, if you can't get into the county high school, you have to go to a vocational school, so it's better to practice the strength to move bricks now.\" Ergou squatted on the ground and played with the stones, without raising his head: \"My father said that after junior high school, I will follow him to the Guangdong construction site, and if I can't read, it is better to save a few more years of service.\" Xiang Dongming didn't speak, bent down and tied his loose shoelaces. The bell rang after class, and several people quickly ran towards the school gate. When he got home, Xiang Dongming picked up the baked potatoes and ate them indiscriminately, and since his grandmother passed away, he didn't have the heart to make a decent dinner. In the past, my grandmother would always bake the potato cake to a crispy texture, and when she handed it over, there was still the residual heat of the stove in the wrinkles on the back of her hand. \nAfter breakfast the next day, he packed his luggage, and as soon as the high school entrance examination was over, he and Ergou and the others went to the county seat to work as a small worker until the vocational school started, and when he went out, he caught a glimpse of the nick on the door frame where his grandmother measured his height with a knife before his death. As he walked on the road, the wind blew from the mountain hollow, like an invisible hand, urging him to move forward. "
  prcs.3101.a: "We all have a bright future"
  PRC_tfr_nl_China_xiangdongming_tt: "§Y We will come back to .......§ in many years!"
  prcs.3102.t: "Re-hardening steel(2)"
  prcs.3102.d: "This is the second year of Xiang Dongming's college after graduating from college, when he first came here, the neon light of the city stung his eyes again and again, and the day after day of circuit board soldering made him feel that he was just a part on the production line. After get off work at night, Xiang Dongming squatted on the balcony of the dormitory to escape the sweltering heat, holding half a cigarette between his fingertips, and the blue light of the mobile phone screen reflected on his bloodshot eyes. The betel nut in the pocket of the cargo pants touched the thighs. The chewed betel nut shell was spit out on the ground at will, mixed with cigarette butts and instant noodle boxes thrown by unknown people, exuding a sour smell. \nIn the public laundry room downstairs of the dormitory every day, there is always the noise of workers arguing in dialect, mixed with the drunken scolding of a lovelorn. After Xiang Dongming got off work, he relied on games and betel nut cigarettes to paralyze his nerves, and occasionally went out with his co-workers to surf the Internet overnight, and the pleasure of the virtual world was always more real than the mechanical action of screwing screws in reality. Indulging bad habits became his only refuge, and the fatigue and unwillingness in reality all disappeared in a moment of joy. Day after day, Xiang Dongming felt that maybe his life was like this, the meaning of life, dreams and anything like that had nothing to do with people like himself, and it was not as good as the two-dimensional characters in the game that were half exposed. \nXiang Dongming also fantasized about the future like everyone else when he was in college. He flipped through the textbooks of his CNC major, and he always liked to lie by the window when he studied at night, looking at the blurred outlines of the neon of the city in the distance. On the way to class, he would even hum a few out-of-tune tunes, as if his dream had grown wings. \nThe phone suddenly vibrated, and it was a WeChat message from his father: \"Ming'er, when will you come back.\" He stared at the screen for a long time, threw the cigarette butt into the soup of the instant noodle box, and started the game again. The night wind blew his sweaty overalls, cockroaches crawled around on the balcony, the neon halo in the distance was still flowing, and he squatted in the shadow of the balcony, like a defective circuit board forgotten next to the assembly line. "
  prcs.3102.a: "If you lose, let's do it again."
  prcs.3103.t: "Re-hardening steel (3)"
  prcs.3103.d: "Xiang Dongming, who came back from surfing the Internet all night, was walking back to the dormitory in a daze, and suddenly saw a bright red banner hanging in the factory area: \"Factory Reform Conference\". \"What kind of trick to reduce costs and increase efficiency, the last reform was said to optimize the process, but the result was to change three shifts to two shifts, and life was difficult.\" Xiang Dongming muttered. I went back to the dormitory and took a big nap, until the sun went down and was noisy by the alarm clock, and I got up in a daze and went to the workshop for the night shift. \nXiang Dongming, who changed into his work clothes and entered the workshop, felt different from usual, the usually domineering line leader didn't know where he went, and there was a middle-aged man wearing a red armband standing in the position of the line leader, and his eyes showed not an aggressive foreman atmosphere, but gently looked at the workers in front of him, and after the personnel were all together, the middle-aged man said: \"Brothers, I only work five hours on the night shift today, and the rest of the time is arranged in the dressing room.\" Xiang Dongming thought he had heard it wrong, he didn't dare to imagine that the factory would be kind, could it be that he was going to lay off people? After working at the workstation for five hours uneasily, Xiang Dongming and the others gathered in the dressing room, and saw the middle-aged man begin to announce to the workers about the reform of the factory, what wage transparency, the cancellation of night shifts, the shortening of working hours, the subsidy for skills training, the establishment of a workers' union, and the participation of workers' representatives in the management meeting...... Xiang Dongming, who has never asked about the world in the factory, can still understand the front, and the more he goes to the back, the more strange he feels, how can he not understand a little? \nOn a sultry afternoon two days later, Xiang Dongming, who had finished work, was about to return to the dormitory before passing by the open-air propaganda meeting in the factory area, when he suddenly saw the workers' propagandists of the newly reorganized trade union standing on the tin table, curiously leaning forward, and the young propagandist's voice split the stuffy air: \"Workers are not tools to be alienated!\" He is the master of the machine! Reform is not a gift, but the dignity earned by workers with their hands! Xiang Dongming originally planned to go back to the dormitory to play games, but he was squeezed by the crowd who didn't know when he would gather. The propagandist held up a copy of the \"Industrial Reform Manual\", and the logo of the sickle hammer on the cover pierced his eyes, and the man pointed to the audience: \"Workers, comrades, we have never been puppets of the assembly line?\" We have knowledge, passion, and are the backbone of the factory! It is the backbone of the country and society! The man then talked about the power of workers and how workers should participate in management......\nXiang Dongming had insomnia, curled up on the bed, the mobile game picture was intertwined with the words he had heard in the past two days, and the betel nut residue tasted bitterness in his mouth. I can't help but recall the words of the trade union propagandist during the day: \"Our workers are not dignified tools on the assembly line, but the backbone that supports the industrial building!\" Reform is not a handout, workers should have a better future! He remembered the crooked lumbar spine because of the night shift, the hourly wage that had been lowered again and again, and the words liberation and a better future were like legendary equipment that was out of reach in the game, and no one had ever told him how to get it. Xiang Dongming suddenly remembered that he had seen the work card hanging around the neck of the propagandist, who was also a technical school student who entered the factory two years earlier than him. If the reform is fake, why doesn't the light in the eyes of the propagandists seem to be fake? Xiang Dongming curled up in the corner of the bed, unsettled. The stagnant heart stirred up ripples, and the heart began to tremble slightly. "
  prcs.3103.a: "rusty gears make sounds"
  prcs.3104.t: "Re-hardening steel (4)"
  prcs.3104.d: "The factory has enacted an annual leave regulation for the first time, declaring that workers have the right to take a seven-day long leave once a year. Xiang Dongming applied for annual leave in disbelief, he had not returned home for a year, and the annual leave was quickly approved, although he often swiped short videos to see various news, but on the train to the train station, he was still surprised by the changes in the big city during this time, through the car window he saw that many commercial advertisements on the street were replaced with public service advertisements, and political propaganda slogans were also styles that had never been seen before, such as what two references, one change and three combinations, the implementation of proletarian leadership, and so on. When passing by the laborers' station on the street, I even saw takeaway riders and sanitation workers blowing air conditioners to avoid the heat. \nXiang Dongming, who returned to the entrance of the village, thought about it against his memory, and saw the new asphalt road at the entrance of the village and the solar street lamps standing on the side of the road, which made him not dare to be sure that this was his hometown in the mountains. He walked into the courtyard dam of the house, and his father was sitting on a bamboo chair peeling corn, and when he heard the sound of footsteps, he suddenly looked up, and a smile squeezed out of his wrinkles: \"Ming'er!\" The crooked smile reminded him of his father's spine that had been bent on the construction site for many years, and his father's voice trembled, and he almost knocked over the chair when he got up. Mother came out of the stove room, her apron was still stained with ash, and Xiang Dongming's throat tightened, but her dull personality only held back one sentence: \"Road...... It's getting better again. \nAs dusk approached, Xiang Dongming helped peel corn on the chair, and his father talked endlessly, especially when it came to the current subsidy policy, there were thousands of words, and the old migrant workers who went to the city to find a \"way to live\" in the early years began to pay pensions after the relevant departments counted the years and work conditions. Listening to his father's words, Xiang Dongming continued to peel the corn, and kept muttering in his heart, \"It's changed, many things have changed, and the times seem to be really different.\" \nXiang Dongming had insomnia again, so he simply tidied up the clutter in the room. A dusty book in the corner caught his attention, picked up the book and shook off the dust, the cover of the figure riding a horse and wielding a knife was gnawed out of the raw edge by insects, but the title of the book was still vaguely visible \"How Steel is Made\", looking at this book, Xiang Dongming remembered the dream he wrote on the mottled blackboard in the leaky classroom when he was a child, his dream before he was \"alienated\" by society, that is, to become a person like the protagonist of this book, a person who insists on moving forward, he opened the book, the pages were crisp and yellow, but the words were still sharp: \" This is how a person's life should be spent......\" He thought of the \"backbone\" that the preacher in the factory said, the wrinkles of his father's joy, and the hesitation of curling up on the dormitory bed. At this moment, these words are not lying in the pages of a book, but turn into the fire of the furnace, melting and sealing the ice that seals the heart for the future life and ideals. He gradually understood that he was not a screw that had been welded to death, but a steel waiting for a round of hardening. \nAfter Xiang Dongming returned to the factory, he signed up for the \"Production Optimization Proposal Competition\" organized by the trade union. He also applied to join the Communist Youth League of the new group of the factory, he quit smoking, replaced the betel nut he carried with him into a notebook, and his eyes were full of persistence after graduating from CNC major. Xiang Dongming led by example in the competition group and became an activist, arriving at the studio first every day to immerse himself in complex process data and design drawings. That focused look seemed to declare that all problems must be overcome. "
  prcs.3104.a: "\"No remorse for wasting time\""
  prcs.3105.t: "Requencing steel (end)"
  prcs.3105.d: "The sun rises in the distance, the morning dew shines in the sun, today is the volunteer labor day of the league members, and Xiang Dongming arrived at his destination early.\" Dongming, you came so early. The thick voice of party member Uncle Han came from behind. Carrying a box of mineral water, the old comrade who had organized a workers' strike in the factory next door now sees compulsory labor as a battlefield for \"proletarian self-education\". \"We have to clean up all the branches and debris on the road today, and the typhoon a few days ago caused a lot of trouble.\" \nAs nearby resident volunteers and group members arrived one after another, the sound of the friction of waterproof rubber shoes was intertwined with passionate slogans. Some people carry broken stumps, some sweep them, and the female members are not far behind, some distribute gloves, and some move debris as much as they can. In this land illuminated by the morning light, voluntary labor is no longer just a simple physical effort, but a revolutionary invitation written by the workers with their hands, inviting every exploited person to join the ranks of rebuilding a fair world. When Xiang Dongming's team was selected as a pilot, the workshop applauded, and his and the names of the team members were on the commendation board in the factory, with \"Young Worker Pioneer\" written next to the photo. At the conference, Xiang Dongming, who was selected by the team members as a speaker, walked to the front of the stage, picked up the worn-out book, and changed his introverted image in the past and said: \"Workers, comrades, I want to borrow the content of this book and talk about my thoughts.\" In today's era, what kind of attitude should each of our workers and young people have towards life? Whether it is greedy for enjoyment or continue to struggle, wasn't it for today's bloody struggle of our ancestors back then, so today, in this new era in the true sense, the image of the young generation should be united and struggling, arm in arm, and no difficulties can scare us! "
  prcs.3105.a: "Come here, Paul!"
  prcs.3106.t: "The road is walked out by people"
  prcs.3106.d: "\"What are you worried about, Zhang Jian, looking at your sad face, have you forgotten that there is no smoking on board?\" The accompanying medical staff looked at the usually amiable captain looking at the sea in confusion. \n\"Sorry, I forgot. Captain Zhang threw the cigarette butt under his feet and trampled it out, apologizing to the medical staff, \"I am very distressed, distressed, this outbound mission will be the longest in the history of the Peace Ark and the largest area covered.\" We will not only stop at ports in Southeast Asian countries, but also turn to the Indian Ocean, where medical resources are consumed and replenished...... Not only that, the voyage is so long, there are so many countries passing through, and the personal safety of you crew members is also a problem......\"\n\"It's okay, Zhang Jian, haven't we accepted patients yet? Besides, we haven't set sail yet. The medical staff patted him lightly on the shoulder, \"You also said, this task is heavy, where can you go on with such a sad face?\" You are the captain!\" \"\n\" is, as a captain, if I don't keep my soul, the other crew members will only panic. But...... Traveling to so many regions and countries for the first time, we may encounter countless problems and dangers. I have been a captain for so many years, and this is the first time I have had such a big burden, and I couldn't breathe all of a sudden. He looked at the sun gradually rising above sea level, and slowly talked about his past experiences and honors, \"But...... Every time we went to a place before, after contacting the people there for a while, they were all so cheerful, I witnessed their suffering, and I realized how important our help was to them...... \"\n\" But I'm afraid, I'm afraid that something will go wrong on this voyage......\" Captain Zhang subconsciously wanted to smoke again, but just brushed his lips with his fingers. \n\"But if we don't go, who can help those people? So, Captain Zhang shook his head, took a deep breath, and said, \"You're right! The matter depends on the man-made process. We will prove to the world that even if the world is broken, there will be people who are willing to mend it and make the world a better place. Let's go! As the last batch of medical supplies and entourage confirmed to board the ship, the dock signaled that it could sail away. Captain Zhang looked at the comrades who saluted him at the port side, and regained his original calm appearance, he said on the intercom, \"Please rest assured that the party, the motherland and the people will rest assured, no matter what difficulties there are, I believe that the road is through people, and the Peace Ark has now left the port to ensure the completion of the task!\" "
  prcs.3106.a: "The sun facing the new day, the Ark of Peace carries the future and hope to share with the world"
  prcs.3107.t: "One Sky"
  prcs.3107.d: "Recently, the Ministry of National Defense announced that according to the annual cooperation plan between the Chinese and Russian militaries, the two sides organized the implementation of the 9th joint air strategic cruise in the relevant airspace of the Sea of Japan.\" The picture released on the official website of the \"People's Air Force\" shows that the H-6N participated in the strategic cruise, which is the first time that the H-6N has participated in the Sino-Russian strategic cruise. Experts interviewed by the Global Times said that the H-6N's participation in the cruise can greatly expand the deterrence and strike range of the formation cruise. The main purpose of routine joint air strategic cruises between the Chinese and Russian militaries is to enhance strategic mutual trust between the two militaries, enhance the level of strategic cooperation between the two militaries, improve the ability of the two militaries to jointly respond to security challenges, and maintain regional and world peace and stability. Regarding the threat theory exaggerated by the news of the Pacific Treaty, a spokesperson for the Ministry of National Defense said: Since 2019, the constant point of the nine air strategic cruises between China and Russia is that they are not aimed at third parties, in line with international law and international practice. "
  prcs.3107.a: "Spread your wings and fly high"
  prcs.3108.t: "One sky, one red flag."
  prcs.3108.d: "Recently, the Ministry of National Defense announced that in order to enhance strategic mutual trust between the two militaries, enhance the level of strategic cooperation between the two militaries, improve the ability of the two militaries to jointly respond to security challenges, and maintain regional and world peace and stability, the Chinese and Russian militaries will continue their annual cooperation plan, and the two sides will organize the implementation of the ninth joint air strategic cruise in the relevant airspace of the Sea of Japan.\" The picture released on the official website of the \"People's Air Force\" shows that the H-6N participated in the strategic cruise, which is the first time that the H-6N has participated in the Sino-Russian strategic cruise. Experts interviewed by the Global Times said that the H-6N's participation in the cruise can greatly expand the deterrence and strike range of the formation cruise. In addition, the nascent Soviet Russian government attached great importance to this strategic cruise and sent various new models, including the Tu-160M1, to participate in the strategic cruise, hoping to deepen ties with China while accumulating air force experience. In response to the threat theory exaggerated by the news of the Pacific Treaty, a spokesperson for the Ministry of National Defense said: Since 2019, the current point of the nine air strategic cruises between China and Russia is that they are not aimed at third parties, in line with international law and international practice. "
  prcs.3108.a: "Eagle Strikes in the Sky"
  prcs.3110.t: "Red Cloth"
  prcs.3110.d: "A man with a red cloth in front of his eyes walks slowly on this land, and half of the cigarette butt in his hand has long since been extinguished. No one walked with him, and he didn't know where he was going, let alone when. \nHe still remembers many things, things that were no longer worth mentioning to him in the past. Love, career, family. He had long forgotten when he had lost them, but for him, there was only one thing that haunted his mind: when did he become so alone; Why did he become so alone? He walked past the crowd, but people isolated him, excluded him, made him no longer who he was, and let him get lost in the labyrinth, either out of fear, or out of disgust, more out of awe and fanaticism. But he still remembers this land, remembers the deepest scars on this land, so he has to go on, he has to go on. \nSo he blindfolded himself with a red cloth, covering heaven and earth. Red wrapped around him, warmed him, made him forget his loneliness, kept him walking on the road, and let him keep walking on this scarred land...... In this way, he walked for many years. However, on this day, for some reason, he plucked up the courage to slowly take off the red cloth that was covering his eyes and rubbed his sore eyes. He found that there was a dew-stained grass at his feet, and countless sunflowers were blooming in the fields not far away. \nSuddenly, as if rising from the sky, red flags appeared on the horizon. The pure red flag, the flag stained with blood, the flag soaked in the smoke of artillery fire, our flag, were held high and stretched freely in the wind. Under the banner, a group of people are striding forward. \nHe saw them, and they saw him. He subconsciously wanted to avoid everyone's gaze, covering his ears and not wanting to hear those fanatical cheers. \n\"Come on, come to us! Come with us! They waved to him like a friend. \n\"What?\" He couldn't believe his ears. \n\"Come on, let's move forward together! They still waved to him. Those were his most unfamiliar faces, but he felt extremely familiar. \nHe looked at the red cloth in his hand, threw it away, and it floated to the horizon, blending with the brilliant morning glow. "
  prcs.3110.a: "We are no longer alone"
  prcs.3111.t: "Decay"
  prcs.3111.d: "Hou Zhendong dragged his decaying body and sat at the guest seat of the annual \"Red Light Commune Memorial Mao Zedong Thought Conference\" in the Hongguang Community. He looked around, there were few participants, only a few old comrades who had struggled together in the revolutionary era, and there were new seedlings in spring every year, and the pedestrians were different. When it was time for his routine speech, he walked up to the stage tremblingly, and a touch of white light poured into his eyes, and he was unmoved. \nThe white light is getting stronger, but he still insists on reading his speech word by word: \"It is not easy for the new and old comrades of the Red Light Society to get to this day, and from now on, I implore you to continue to carry forward and hold high the great banner of Mao Zedong Thought, and continue to carry forward the revolutionary spirit to the end.\""
  prcs.3111.a: "That's it, there was a sparse applause from the audience, and in his ears, the voice was getting quieter and quieter"
  prcs.3112.t: "past"
  prcs.3112.d: "Since then, Hou Zhendong's hearing has deteriorated, and many inconveniences have appeared in his life, and his ears have to be closer and closer when others talk to him; Hands-free mode in the phone has become almost permanent; The revolutionary comrades who visited him had to knock on the door for a long time to hear it; So much so that it was changed from knocking on the door to a phone in the back. The situation worsened day by day, so much so that Hou Zhendong and his comrades-in-arms believed that one day he would completely lose his hearing, and if he wanted to visit again, he might have to make an appointment in advance and pray that he would notice the text messages on his mobile phone before the appointment time arrived. \n Despite the gradual withering of his body, Hou Zhendong could not forget for a long time that he personally devoted himself to that great revolution that had never been seen before. I remember that morning on February 17, 1967, Wei Jie, deputy commander of the Chengdu Military Region, openly carried out the counter-revolutionary road against the current in February and issued the order to 'suppress the rebellion'. In prison, he and his comrades carried out a hunger strike demonstration in the spirit of a fearless red prisoner, but were beaten inhumanly by the prison guards. The soldiers of the Corps armed with Mao Zedong Thought cannot retreat, and they are determined to leap into the red sun in their chests and enjoy fighting the evil wind at the ends of the earth! The Corps, the 826th, the Red Guard Army, and comrades-in-arms from all over the world set off an earth-shattering roar, vowing to turn the prison where the revolutionaries were held into a big school for transmission and learning Mao Zedong Thought! Finally, after surviving the headwind in February and the black wind in March, the People's Daily issued a call to \"treat the revolutionary young generals seriously\", and the Sichuan issue began to be dealt with! Under the dual pressure of the central government and the people, Ru Fuyi, deputy chief of staff of the Chengdu Military Region, began to release people on the afternoon of April 18. As soon as they saw the 'red prisoners' who had been tortured to the point of being disfigured walking out, the emotions that had been squeezed for more than two months finally couldn't help but explode, and the lovely people cheered and hugged each other with emotion, some cried with joy with their family and friends, some sang \"826 Misses Chairman Mao\", and some were high-spiritedly preaching the experience of comrades criticizing private repairs. And he did it on the third wheel of the 98th Corps, raising the red flag with his comrades-in-arms, smiling tired but full of joy. "
  prcs.3112.a: "At that time, Hou Zhendong never felt that there was a day when the sun was as dazzling as this day"
  prcs.3113.t: "Turnaround?"
  prcs.3113.d: "Time has passed, and in the blink of an eye, sixty years have passed. Ten years of prison life made him go through vicissitudes, price breakthroughs, social turmoil, golden words, workers were laid off, comrades-in-arms left one after another, and he also suffered a lot in the ups and downs of the business sea. Sometimes, he would drag his skinny body and sit by the window, thinking sadly, \"Maybe soon, I will also go to see Chairman Mao.\" \n A year after the last speech, the time has come to 2025, and the early spring of March is still mixed with a hint of chill, which penetrates into the human body is the most uncomfortable for the elderly. But Hou Zhendong, who had lived in the winter, still decided to go out even if he braved the cold of spring. The risk of the old man going to the street alone is not small, and Hou Zhendong ended up just taking a walk in the community. \nJust as Hou Zhendong was about to finish the last lap around the community, he felt the pocket of his coat shaking slightly, and he took it out and swept it: It was a message from a junior who sent him that some students wanted to see him next week. "
  prcs.3113.a: "Hou Zhendong assumed countless possibilities in his mind, but he never figured out what a group of students could do with him?"
  prcs.3114.t: "old branches and new shoots"
  prcs.3114.d: "Time has come to next week in the blink of an eye. Hou Zhendong, who cleaned up the house with the help of the Zhan family, was staring at the chat box of his juniors at this time, for fear of missing the text message sent, but he didn't hear a knock on the door. \nIt wasn't until the junior sent him a message that he realized it and said, \"Come in, come in, don't change your shoes, just come in directly\" After the door opened, in addition to the junior who was also older, there were three vivid faces. When the young man entered the room and took his seat, Hou Zhendong slowly sat back in the armchair. \nTwo young people curiously looked at the furnishings of the house that had experienced that \"special\" era, but were slightly disappointed to find that except for Chairman Mao's mural poster, it could not be more simple. The other young man was calmer, taking out his notebook from his bag and turning to a page full of interview questions, obviously doing a lot of work. Even so, his slightly trembling hands revealed his excitement. \nAfter a simple exchange, Hou Zhendong understood the purpose of the trip of the three young people in front of him, and the young people all knew on the post bar, and they had a certain understanding of the history of the Cultural Revolution in the first thirty years of New China, especially the ten years of the Cultural Revolution, and they were also from universities in Sichuan. \nAs he talked, Hou Zhendong gradually became in a trance, his thoughts drifted back to the past little by little with the problems of the youth, as if that hot era had never gone away, the laughter of the red prisoners in prison, the mountain shouts and tsunamis of the masses when the Red Ten Articles were issued, the rampant siege of the 611 bandits, the soaring of the J-7 into the fireworks of the establishment of the Provincial Revolutionary Committee, Political Commissar Zhang Guohua's strong northeast accent seemed to echo in his ears again, and the scenes of the past flashed like a slide lamp, he swam in the memories like this, Until the figures of young people and the figures of deceased comrades-in-arms gradually overlapped. \nAt the end of the interview session, when the young man was about to exchange contact information with him, Hou Zhendong woke up like a dream. With a smile, he left his name on the materials he brought to the young people. \nWhen parting, Hou Zhendong looked at the young man with infinite vitality in front of him, and his heart, which had been silent for many years, was also a little excited. He held their hands tightly, remembering Chairman Mao's words when he met with international students in the Soviet Union. \"
  prcs.3114.a: "The world is yours and ours, but in the end it is yours"
  prcs.3115.t: "For my China, I am determined to build the Three Gorges"
  prcs.3115.d: "Xiao Wang is here, take a look at Xingyun first, Tianqing Antivirus has just pushed a new patch, by the way, the confidential self-inspection ledger must be updated simultaneously.\" The director pointed to the office system prompt bar, and tapped his fingertips twice on the desktop, \"Last week's round of updates was for intranet border protection, and this time it was a newly detected vulnerability in the network attack and defense drill, and now it is a critical period.\" \"\n\" Good director. Xiao Wang nodded and opened his mouth to the unified identity authentication of the work computer, while removing the red armband on his shoulder, and the metal buckle made a soft sound: \"No wonder the access control checked two more work permits this morning, and the armed police sentry at the door also added double posts.\" \nBefore the prompt sound of unified identity authentication dissipated, Xiao Wang had quickly called up the console of Tianqing Antivirus, the light blue interface jumped out of the progress bar, the hard disk read and write sound rustled, and the 372 file nodes lit up on the screen one by one. The self-inspection window of Zhongfu Confidentiality System pops up synchronously, and with the mouse gently tapping on the option of \"Monthly Self-Inspection Template\", the eyes will sweep over the confirmation bar - no problem. \nAfter the high-risk patch was installed, Xiao Wang got up, pushed open the heavy safety door, and walked into the monitoring room; The 4K display screen on the entire wall is running in real time: the river rushes to the sand gate, and the crane is hoisting the sewage barrier; The control room of the Erjiang drainage gate, the hydraulic monitoring curve is steadily on the green line; In the cable corridor, the thick and thin busbars lie in the trunking in a regular manner...... Xiao Wang's fingertips swiped on the central touch screen, and the corridor screen of Unit 5 was covered with screens. The new vibration sensor stands out, and the metal contacts reflect cool light under the ceiling light. \nHis eyes swept over the key screens, confirming that it was correct, Xiao Wang took a deep breath, put on the red helmet of \"safety supervision\" firmly, and pinned the red armband to his left arm. The buckle clicked again, and a new day of inspection began. \nIn the blink of an eye, he walked to the door of the factory, and the armed police sentry at the door was in a straight posture. Xiao Wang stopped, handed over his work permit, the young soldier's eyes were like a blade, he held the pistol on his chest in one hand, took the document with the other hand and checked it carefully, and conveniently landed on the ground and saluted and let him go; In the factory, a low and thick roar surged from the ground - twenty-one steel beast-like water turbine generator sets were galloping with all their might, and the sound waves stirred in the empty factory, shaking the floor and the chest. \"In extraordinary times, there is no room for carelessness.\" This thought was like a heavy hammer at his heartstrings, and he subconsciously straightened his back, his eyes swept like an eagle through the passages densely packed with pipelines, the valves with flickering cold lights, and the control cabinets with the indicator lights flickering, without letting go of the slightest movement. From the dark equipment corridor to the roaring unit pit, from the high-voltage insulation wizzing switch station to the sparsely populated dam passage, Xiao Wang walked steadily. At noon, the sun shines through the 500KV tower, casting spots on the ground, elongating his focused patrol. When he reached the vicinity of Huangcaoba, he stood around for a long time - this place is easy to ignore, it is a remote corner of Xiba, and surveillance cameras are prone to blind spots, and the police force needs to be strengthened. \nAfter the inspection, Xiao Wang returned to the office, took off his helmet and armband, wiped the sweat from his head, and picked up the internal phone: \"This factory-wide inspection is complete, and there is no abnormality.\" However, there are blind spots in the monitoring of Huangcaoba, and it is recommended to contact the dam management department to add armed police patrols. After the report, he turned on the office computer and began to compile today's inspection ledger, writing down the inspection path, time, details and equipment status. \nOutside the window, Xihui gilded the staggered busbars and towers of the huge factory. Off work time. Xiao Wang sorted out the files and turned off the computer. Walking out of the factory gate through the layers of sentry cards, he habitually stopped and looked back, in the glow, the statue of Chairman Mao at the door was draped in a military coat, and his eyes were like torches, as if following the telescope in his hand all the way east with the rolling Yangtze River, with a long history, vigilantly looking at the enemy in the east. Xiao Wang straightened his body, his expression was solemn, and he gave a deep salute to the brass figure, \"For my China, I am determined to build the Three Gorges, and I will live up to my mission!\""
  prcs.3115.a: "Then, his figure blended into the crowd after work, gradually disappearing into the twilight and lights of thousands of homes"
  prcs.3116.t: "Waist rod"
  prcs.3116.d: "Wang Jiakang shook off the newly bought handkerchief, held it in his hand, and wiped it on his face. The soft sponge-like texture enveloped his face, and the sweat on his face was immediately sucked dry. When he carefully folded the handkerchief and stuffed it into his belt, he straightened his rickety waist and pushed open the door of the trade union station with a lunch box. \nThe wind of the air conditioner dusted off the tiny beads of sweat that ooze from his face for him. Every time he came here to take a nap, he was used to closing his eyes and enjoying the breeze. He relaxed, and his waist was hunched over again. When he opened his eyes again, several old acquaintances broke into his sight. \n\"Oh, isn't this old? As soon as his colleague Cheng Hai saw him, he put down the lunch box in his hand and immediately moved out of a position with the person next to him, and Wang Jiakang was also unambiguous, quickly dragging a chair into the empty seat, and sat down steadily. \n\"What's wrong with Brother Kang, the sun is coming out in the west? Usually, you are waiting for us here, but now we are waiting for you. The young decorator Zhang Yi was holding a large bowl of rice bowls and was feasting, Wang Jiakang glanced into the bowl, several steaming meat rolls were still hanging with marinade, and a large piece of roasted meat and cut pig's feet became a hill. \nWang Jiakang smiled, opened his three dishes and one soup, picked up a piece of saliva chicken and put it in his mouth, chewed the meat carefully, instigated the bones, picked up a mouthful of rice and pressed the meat into his stomach, and when he was a little more steady, he spoke: \"Because there are still some places on the side of the road that have not been cleaned, and there is a lot of garbage, so I will work for a while and sweep the floor before coming.\" \"\n\"Huh! The sun did come out in the west. But what did you tell us here before? If you live and die, you will be disbanded when you deal with work. I remember this clearly. \"\n\" But Xiao Zhang, you are different, Aunt Qin has praised you for being much more serious recently. Others once laughed at you for being a decorator who couldn't even get dust when you walked around in other people's rooms. Cheng Hai said sarcastically. \n\"I...... I mainly feel that everything I do now is very down-to-earth, you know, I used to be precarious, I was afraid that I would eat the last meal and not eat the next meal, do it well today, and liquidate it tomorrow, what are you doing? Now I have a bottom in everything I do, and I feel at ease, so I will do it well. \"\n\"Hehe......\" Wang Jiakang looked at the laughing acquaintances, and his heart was also full of mixed feelings, and he didn't know why he was so full of enthusiasm to do such a job, it was definitely not a treatment, because he was an old thing who didn't care about these anymore. But he remembers the day that changed him completely:\nThat day, he was about to find a place to slack. But he saw that a group of red scarves saluted his rickety body with an unstandard, but sincere enough Young Pioneers salute. He saw that there was no condescending gesture in the eyes of the children, and there was no pretentious sympathy. Only the most sincere respect for his rickety figure. "
  prcs.3116.a: "That day, his waist was straightened"
  prcs.3117.t: "Grab the iron U color"
  prcs.3117.d: "Guangzhou, the transportation hub of South China, has recently ushered in an important railway reform measure. According to official sources, the independent pricing power of China Railway Guangzhou Bureau Group Co., Ltd. has been officially withdrawn, a decision that has attracted widespread attention and positive repercussions in Guangdong Province. For a long time, railway fares in Guangdong Province have been at a relatively high level, which has increased the travel cost of people to a certain extent. According to statistics, the high-speed rail fare in Guangdong is on average 15-20% higher than that of the same mileage line in the country, and this price difference has always been a hot issue for the local people. \nThe withdrawal of pricing power marks that the price system of Guangdong railway transportation will be re-included in the unified management. Relevant departments said that the new pricing mechanism will pay more attention to public welfare and people's livelihood orientation to ensure the accessibility and inclusiveness of railway transportation services. The people in Guangdong Province generally welcomed this initiative. They believe that the withdrawal of pricing power by the Railway Corporation means that the fares in Guangdong will be in line with the national railway, which will not only help reduce the travel burden of the people, but also further promote the development of regional economic integration and enhance the overall competitiveness of the Pearl River Delta region. With the gradual implementation of the new pricing policy, the history of Guangdong's \"iron lottery\" will become a thing of the past, and people's travel will be more convenient and affordable. "
  prcs.3117.a: "The Water Fish Becomes History"
# Unknown U.S. events
  prcs.3118.t: "U.S. Formal Membership in the Pacific Defense Treaty Organization"
  prcs.3118.d: "Recently, after a multilateral meeting in Tokyo, the US Patriot Front government officially announced its membership in the Pacific Defense Treaty Organization (PDTO) as a full member of the organization. Over the past few months, senior U.S. diplomats have frequently visited allies in the Asia-Pacific region to conduct in-depth consultations on regional security cooperation. After several rounds of negotiations, the military alliance expansion plan was finally settled. The expansion ceremony was held in Tokyo, and the foreign ministers of the member states witnessed the signing ceremony. The U.S. representative said after the meeting that he joined the organization to \"maintain freedom and stability in the Indo-Pacific region.\" At the same time, international observers are closely monitoring the possible impact of this move on the regional strategic landscape. \nThe addition of the United States has clearly changed the balance of power in the Asia-Pacific region, especially in the face of the Chinese-led World Liberation Front. Analysts pointed out that the anti-communist stance of the \"Patriot Front\" government was an important consideration for its choice to join the Taiyu organization. In addition, the prospects for economic cooperation between member states and the commitment of the United States to provide military technical support are also seen as key factors driving the expansion. \nThe further expansion of the PAPAC has undoubtedly exacerbated tensions between the two major camps in the Asia-Pacific region. At present, the region has formed a pattern of confrontation between the Pacific Treaty Organization with the United States, Japan, India and Australia as the core, and the World Liberation Front led by China. Today, maintaining peace and stability in this densely populated area is probably a luxury. "
  prcs.3118.a: "Something is brewing."
  prcs.3119.t: "Asian War!"
  prcs.3119.d: "Since the end of the Taiwan Strait campaign, everyone has been breaking their fingers to calculate the arrival of this day. The war between the World Liberation Front and the Pacific Defense Treaty Organization, two of the most representative military alliances after the Cold War, has officially begun. People immediately used the synonym \"Great Asian War\" to refer to this new war. The name may recall the Pacific theater of World War II and what militaristic Japan calls the \"Greater East Asian Holy War\", but the scale and pattern of this war has far exceeded that of any conflict in the Asia-Pacific region in history. Some believe that China and its allies, with its large population, strong industrial power and the world's largest army, have advantages that are difficult for its enemies to match, and that the members of the World Liberation Front can use China as a solid rear to play the advantage of internal operations. The other side pointed out that the TPE camp led by the United States has formed a geographical encirclement and interception of China, and the vast sea area controlled by the TPE camp has also ensured sea control and stable trade routes. Not only that, the Taiyo is mainly composed of \"democratic countries\", which naturally has an ideological advantage for the enemies of \"authoritarianism\". In any case, the direction of war is no longer dictated by any factor other than strength from the moment it starts. From land to sea, from sky to universe, and now with cyberspace, God of War has started a bloody game that will shape the political map of mankind for the next half century. "
  prcs.3119.a: "Flames rise, burn Asia-Pacific
  prcs.3120.t: "World Liberation Front Wins Great Asian War"
  prcs.3120.d: "There are few places on this planet that can claim to have never been far from gunpowder like the Asia-Pacific region. Since the end of World War II, from the long border conflicts on the South Asian subcontinent, to the guerrilla wars on the Indochina Peninsula, to the tense confrontation between fleets and aircraft groups on both sides of the 38th parallel and the Taiwan Strait, everything is just waiting for a Martian to detonate. Now, the war that has burned the entire Asia-Pacific region seems to have finally come to an end. \nThe World Liberation Front, composed of China, North Korea, Pakistan and other countries, became the final winner of this seemingly never-ending war. When the Liberation Front Combined Fleet successfully landed on the west coast of the United States and the US \"Patriot Front\" government was forced to announce its surrender, the will to resist the entire Taiyue camp completely collapsed. The great sacrifices made by the coalition against imperialist hegemony proved that they were worthy of being standard-bearers of the just cause of the peoples of the world. Under the just-signed peace treaty, the United States was forced to cede the Hawaiian Islands and all of its island territories in the Pacific, and these strategic locations would be returned to the arms of the Asian people. As for the losers, the so-called \"too covenant\" camp, waiting for them only to be completely torn off the veil of hypocrisy of so-called \"democracy\" and accept the sanctions of the people. "
  prcs.3120.a: "Only peace is priceless"
  prcs.3121.t: "The Final Battle of the Asian Revolution"
  prcs.3121.d: "The Central Committee of the Communist Party of China, the Standing Committee of the National People's Congress of the People's Republic of China, the State Council of the People's Republic of China, the National Committee of the Chinese People's Political Consultative Conference, the Communist Party of China, and the Central Military Commission of the People's Republic of China hereby issue the following notice to the entire Party, the entire army, and the people of all nationalities throughout the country:\n\nSeveral hours ago, the Pacific Defense Treaty Organization (PTT), an imperialist military bloc headed by US imperialism, brazenly interfered in the liberation cause of the Korean people. Hundreds of thousands of imperialist armed personnel landed in Busan, and its fleet and air force also brazenly invaded our territorial waters and airspace. These actions constitute acts of war against our country and seriously infringe upon the rights and interests of socialist countries in Asia.\n\nThe PTT has long used the pretext of defense to continuously interfere in our Taiwan affairs and fuel the arrogance of 'Taiwan independence.' After its aggression against Taiwan and interference in our internal affairs were completely crushed, it still sends spies and saboteurs to contact traitors and spies within our country, to fund counter-revolutionary organizations within our country, to engage in counter-revolutionary activities, to incite the subversion of state power, to attempt to overthrow the socialist system, and to fund and arm our country.\" Internal separatist forces and terrorist organizations disregard the lives and property of our people. At a time when the Asian people's liberation movement is surging, the imperialist war in Europe is intensifying, and capitalism is in a general crisis, the \"Taiwanese Alliance\" (TAA), led by the United States, continues to frantically obstruct our socialist revolution and construction, piecing together a counter-revolutionary military bloc in an attempt to launch another bloody war of aggression against our country and hinder the socialist revolution and national independence movement of the proletariat throughout Asia. Their insane actions vividly demonstrate the death throes of imperialism in the face of a general crisis of capitalism; they refuse to acknowledge their defeat and attempt to gain a final chance of survival through military adventurism and the kidnapping of their own people. Based on the above facts, the President of the People's Republic of China declares, according to the decision of the First Session of the Standing Committee of the Fifteenth National People's Congress of the People's Republic of China: the People's Republic of China enters a state of war against the \"Taiwanese Alliance\" countries. This state of war will not be lifted unless the \"Taiwanese Alliance\" imperialist military bloc surrenders voluntarily or is completely destroyed.
  prcs.3121.a: "Long live the People's Republic of China! Long live the great unity of the people of the world!"
  prcs.3122.t: "The Last Battle against the Colonial Order"
  prcs.3122.d: "The World Liberation Front solemnly declares to all the people of Asia that Asia, this vast and rich land that we have watered with our blood and bones, has given birth to our long and great civilization. Our ancestors have created brilliant achievements on this land, and we have been independent and free for generations. However, when the Western colonists bombarded our homes with guns......\nColonialism never really left, and the rest of the evils are frantically killing the lifeblood of Asia's economy. The dirty black hand of hegemonism manipulates the fate that should belong to the Asian people. the chaebol group that kneels at its feet and gnaws at the people's fat and people's ointment; A puppet regime that betrays national interests and betrays the nation. In the name of the so-called \"Cold War\", they pointed their guns at the real masters of Asia - the people who rose up to fight! \nThe foundations of the old world are crumbling. The greedy nature of imperialism is dragging itself into an irredeemable abyss: economic paralysis, social tearing, and frequent wars...... They struggled to drag all of Asia into endless darkness. In decades of bloody struggle, in the fire of victory and defeat, we have forged an iron will to fight and an indestructible fighting spirit. From the smoke of the Korean Peninsula to the golden rice waves of the Mekong River, from the Himalayan snow line to the turbulent waves of the South China Sea Islands - the awakened Asian brothers have rallied under the same banner, standing up unyielding in the same trenches. The balance of history is unstoppably tilting towards the people who are fighting for freedom. \nThis war is not a bargaining chip in the game of great powers, not a so-called \"holy war\" that promotes colonialism in the name of brotherly co-prosperity, let alone a regime change of any doctrine. This is a belated revenge for hundreds of years, a just trial for millions of compatriots who have died. We will regain our homeland, regain our place, and we will make those colonists pay with their blood; We must fulfill the unfulfilled wish of our Asian revolutionary martyrs, countless revolutionary martyrs died before dawn, we will never forget their sacrifice and dedication, and we will never live up to their expectations. \nWe're going to smash the chains of the old world! With the iron fist of the people's war, the shackles symbolizing slavery will be completely shattered into powder! On a land soaked in the blood of the enemy, we will build a free and equal Asia with our own hands, free from oppression, no exploitation, unity and mutual assistance of all ethnic groups, free from the shackles of old and new colonies, and independent and independent! \nBrothers, comrades, bury our sacrificed compatriots, bandage our wounds, raise the blood-stained battle flag, hold our steel guns, and organize our invincible army. \nTowards the final liberation, towards the final victory. Advance! Advance!! Advance!!! "
  prcs.3122.a: "Every drop of blood we shed will bring the land of our homeland back to life"
  prcs.3123.t: "The World Liberation Front has invaded the United States!"
  prcs.3123.d: "After many days of beach grabbing, the vanguard of the WEF coalition has gained a foothold on the west coast of the United States. Despite the desperate resistance of the U.S. military, it was unable to prevent the World Liberation Front's front from touching its homeland. This was the first time since the 19th century that a foreign armed force had landed in its core territory. \nWhen the United States, which had just ended the civil war and was in ruins, decided to join the war far away in the Western Pacific, this large-scale war, known as the \"Asian Liberation War\" by the World Liberation Front, had reached its largest scale, and some people privately called it the Second Pacific War. Although some believe that this war will be a repeat of the First Pacific War, after a series of devastating blows by the U.S. Navy, Japan, South Korea, Australia, India and other countries, the balance of victory has completely tipped to China and its loyal allies. And the forces of the United States had to shrink back on their own, desperately waiting for the landing of the World Liberation Front. After the U.S. government fell into a disadvantage, it declared that its system, values and national security had reached its most dangerous moment, and issued a series of mobilization bills to this end, requiring all military service members to join the military and fight to stop the red forces and defend democracy and American values. At present, nearly a million young and middle-aged people have been conscripted into the army, and nearly 10 million civilians have participated in the auxiliary work of the war. The landing force of the World Liberation Front will face considerable defensive pressure. \nIn predictable days, the World Liberation Front will consolidate its beachhead and launch an offensive on the entire west coast. At that time, if the United States cannot stop its attack, its political arena will experience the largest earthquake in history. "
  prcs.3123.a: "The American dream is about to be shattered"
  prcs.3124.t: "Iron rice bowl"
  prcs.3124.d: "The clear and translucent river quietly flows through the loess of this ravine. The back wave pushed the front wave, calm and powerful, pumping the water into those channels. The capillary-like aqueduct allowed this flowing life to seep into the depths of the soil, and the emerald green and golden color of the earth were dyed all over the earth. \nThe tires of the electric bicycle pressed against the concrete cover of the newly repaired ditch, and the clattering sound swept through the field. Liu Zhixiang especially likes to ride through this farmland at dusk in midsummer and golden autumn, and he often says that the evening breeze is more beneficial to health than air conditioners or fans. On the field road, the sign of the collective agricultural grain enterprise quickly passed by and immediately disappeared from sight. \n\"squeak——\" The electric car slowly stopped on the low river embankment, the river rolled away from under his feet, and on the other side of the river, the newly built pumping station was rumbling. The fragrance of wheat is in the air, dancing with flying insects. Liu Zhixiang pulled out a mat from under the seat of the car and spread it on the river embankment, then he took out his lunch box and began to feast. He still remembers that when he was a child, the porcelain bowls and enamel lunch boxes with black pimples at home were either easy to accidentally scratch his mouth or were a bit ugly. So he has always liked iron rice bowls, especially stainless steel. So much so that when he eats at home, his rice bowl is exclusive stainless steel. \nHe opened the lid of the lunch box, and the aroma of the braised mutton immediately mixed with the aroma of the dough, and the evening breeze flew in with the smell of water and wheat, forming a strange aroma. Since the establishment of the enterprise, the corporate canteen has become a good place to solve people's appetites, after all, he is now a \"formal fixed employee\" of the enterprise, and has become a \"worker\" who receives a salary. \nThe sun sets in the west, projecting countless broken gold onto the long river, and the water waves rise and fall, breathing with this boundless golden wheat wave. It won't be long before the wheat will be harvested, threshed, ground into flour, processed, and brought the life drawn from the earth and rivers to the lights of thousands of homes. "
  prcs.3124.a: "The iron rice bowl is in your own hands"
  prcs.3125.t: "Dead wood in spring, golden crow rises in the east"
  prcs.3125.d: "The World Liberation Front solemnly declares to all the peoples of Asia that Asia, on this vast and rich land has given birth to our long and great civilization, where our ancestors have created glorious and splendid cultural achievements, and we have been a free and independent people for generations. But since the Western colonists broke into our homes, everything has changed. Although Western colonialism no longer colonizes Asia on the surface, they have left countless agents of the old order here, and now they are creating the so-called \"Cold War\" in Asia with their American masters, frantically suppressing revolutionary democratic movements in Asian countries. Today, when the old world order is about to collapse, the weakness of the old order has been exposed. They refuse to admit their failure and want to drag all of Asia into a darker and more cruel future. \nRevolutionary comrades, Asian brothers, the people who refuse to surrender and submit! How many times will we have to be slaughtered like pigs and sheep by the arrogant Western colonists and their lackeys? Are we destined to be inferior and never be able to control our own destiny? \nNo, we will never acknowledge such a reality. We can see that the colonialists have become more weak than ever because of the deep crisis within them, the old world on which they live is about to collapse, and they are dying in an attempt to delay their death. And we have become unprecedentedly strong, we have strengthened our strength in the revolutionary struggle and economic construction, and more importantly, we are now united under one banner. So, now is the time to strike the final blow to the old colonialist order. In the past, it was they who chose the battlefield, but now it is up to us to choose the battlefield where we attack. We will fight in the desert, we will fight in the rainforest, we will fight in the countryside, we will fight in the city - we will fight until complete victory comes. This is not a great power game, not a so-called \"jihad\" that promotes colonialism in the name of brotherly co-prosperity, nor is it a regime change of this or that doctrine. This is a war of revenge that has been delayed for hundreds of years, the protagonist is the people, the object is the old world order that has suffocated us for hundreds of years, we will go to regain our homeland, regain our own place, we want to make those colonists pay with their blood; Therefore, this is a war of our own, this war is related to our own destiny, and only by rising up by ourselves can we completely realize this great revenge against the old world; And this is also a great war to fulfill the last wishes of our Asian revolutionary martyrs, countless revolutionary martyrs died before dawn, we will never forget their sacrifices and dedication, and we will never live up to their last wishes. We believe that the future of Asia is bright and that Asia belongs to the Asian people, not to those reactionaries who collude with colonialist forces. And as long as we unite and fight bravely, we will defeat all strong enemies. \nBrothers, comrades, bury our sacrificed compatriots, bandage our wounds, take up our weapons, raise our banners, and organize our army! Towards the final liberation and victory, move forward and move forward again! "
  prcs.3125.a: "Every drop of blood we shed will bring the land of our homeland back to life"
  prcs.3126.t: "\"Earth-shattering and generous\" (Part 1)"
  prcs.3126.d: "Sir, now that the party is ready for planned economic reform, why do you still have to hold on to the 'birdcage economy'?\" \n\"The combination of planned economy and market economy is the only way out to future development and rapid economic growth. The advantages of the market economy, combined with the advantages of the planned economy, do not this perfectly promote the development of productive forces, and now you are still following the old path, why do you still ask the surname 'capital' and surname 'society' before the reform? The planned economy rejects market regulation, and the planned economy reduces the anarchy of the market. \"\n\"When did the planned economy become a simple economic plan, and how did the market directly become a market economy? You are always an old party member, I know that you may not be able to bear the denial of General Deng Xiaoping's reform, and then embrace Chen Yun's 'birdcage economy' model, now that the digital economy model is so developed, how can you still ......\"\n\"Little comrade, digital planned economy or digital 'birdcage economy', this question is very profound, this is not what you are talking about as a young person, now you really need to make concessions to young people, but you are trying to educate me as an old party member, it is not right to point fingers at me, right? \"\n\"Comrade, you are wrong,\" the corners of the young man's mouth raised with an arc, \"You are sophistry.\" The old comrade slapped the table vigorously, turned his head, and stopped speaking, another old party member looked at the young man and sneered, \"You have only been in the party for a few years, so you talk to the old comrade like this?!\" \"\n\" The grasp of truth knows no age, and supporting the market so much is not socialism. The young man squinted his eyes slightly and patted the table. \n\"Do you know what socialism is? The old comrade looked angry and stared at the young man, \"Let me tell you, socialism is to liberate the productive forces, develop the productive forces, eliminate exploitation, eliminate polarization, and finally achieve common prosperity. \nThe young man curled his lips:"
  prcs.3126.a: "\"Ask again, surname 'She' or surname 'Zi'\""
  PRC_tfr_nl_China_tianfandifukaierkang_tt: "If you don't sweep the broom, the dust won't run away by itself."
  prcs.3127.t: "\"Earth-shattering and generous\" (Part 2)"
  prcs.3127.d: "Correctly evaluating the \"first thirty years\" and \"the last forty years\" is the beginning of our reform, and it is the first problem we face, how to undertake the historical problems of the \"last forty years\", how to face up to the idealized \"top thirty\" that has gone away, this is our current task, now, if we want to plant the red flag higher, we cannot avoid an objective evaluation of the land under the red flag. But the problem is that especially when we face the \"Cultural Revolution\", first of all, the limited information, and secondly, it is extremely difficult to make a truly correct comment on this highly controversial historical event. It is also extremely difficult to analyze the \"Cultural Revolution\" and \"reform\", and behind this behavior is the two main voices, the first is the doubt of the left, why the two should not be a kind of \"rupture\", behind this rupture is the contradiction between the bourgeois line and the proletarian line, and the contradiction between the \"two lines\"; The second is the question of the right, the continuity of the two should be regarded as a historical law, although they support tandem analysis, but they try to erase the contradiction in the continuity. \n\"Old leftist\", \"new left\", the wheel of history will run over everything that has passed, where to go, history will not give a direct answer, but we can move from today to tomorrow by facing up to history. The views of Wang Shaoguang, Charles Bertrand, Wang Hui, and these scholars provide theoretical assistance for us in analyzing the \"top 30\" and \"last 40\". "
  prcs.3127.a: "Dare to compete with evil spirits, and do not give up an inch to the overlord"
  prcs.3128.t: "\"Earth-shattering and generous\" (Part 3)"
  prcs.3128.d: "The evaluation of the \"first thirty years\" and the \"last forty years\" has always been a key issue, and when the revolution comes to the present, it is an important quality point to correctly evaluate the connection between the two. The \"soft\" and \"hard\" of the \"first thirty years\" are undoubtedly a major evidence of the progress of reform and opening up, but where is the continuity of the \"first thirty\" and \"last forty\"? Why will it be \"reopened\" after the \"Cultural Revolution\"? As Wang Shaoguang said, China's decentralized planned economic system (decentralization of fiscal revenue and expenditure and material management power), a large number of small and medium-sized enterprises, large-scale construction of water conservancy facilities, and a relatively complete industrial system built in 1975 have undoubtedly laid a solid \"hardware\" foundation for reform and opening up. [In 1978], state-owned enterprises accounted for 77.16% of the country's total industrial output value and 22.14% of collective enterprises. However, in terms of the number of industrial enterprises, there are only 83,700 state-owned enterprises, while there are as many as 264,700 collective enterprises\", \"In the late period of the 'Cultural Revolution', there were only 217 kinds of unified materials and materials under the management of the ministry.\" In the first thirty years, through land reform, socialist transformation, and restrictions on \"bourgeois legal rights\", China became a relatively flat society, and there were no powerful \"profit-sharing groups\". This has laid a solid \"software foundation\" for reform, but why is it moving towards reform and opening up? The high degree of decentralization of China's planned economic system actually gave the spontaneity of local forces a sweet taste, and large-scale \"decentralization\" actually facilitated the development of the vigorous commodity economy of reform and opening up. However, under China's planned economy model that has not yet been abolished, this high degree of decentralization fully practices the design concept of \"walking on two legs\" expounded by Comrade Mao Zedong in \"On the Ten Major Relations\", and in fact brought about China's economic take-off (Charles Bertrand). Of course, after this decentralized model fell into the hands of the supporters of the market economy, the dual echo of the local and central governments directly made the market economy model fully adapt to China's economic form. After bidding farewell to high inflation and low GDP growth, the economic take-off of the market economy reform in the 90s also brought \"pains\", that is, the decline in workers' living standards and the widening gap between the rich and the poor. "
  prcs.3128.a: "Ten years of spring and autumn looking forward to spring warmth, thirty years of winter and spring cold"
  prcs.3129.t: "\"Earth-shattering and generous\" (Part 4)"
  prcs.3129.d: "Why is it a \"reform\" after the Cultural Revolution? For example, Deng Xiaoping once said that \"reform is also the liberation of the productive forces\", and before criticizing the \"Gang of Four\" in October 1976, the mainstream theory emphasized that \"socialism was born out of capitalism\" and emphasized the objective existence of bourgeois legal power in socialist society, and the theoretical commander of \"taking class struggle as the key\" was born The absolute dominance of \"revolution is the liberation of the productive forces\". Here, revolution means a declaration of war on the old society, because there is no socialism that has been perfected, the logic of reform is based on perfect conditions, and we are always fighting against capitalism. Here, the endogenous logic of the \"Cultural Revolution\" and \"Reform\" is not only completely contradictory, but even on two opposites. However, the dialectic of history happened precisely here, the mistakes of the \"Cultural Revolution\" itself, especially the huge resistance of the old cadres (even though there were many old cadres who changed their positions after the \"reform\"), and the political enthusiasm of the masses was indifferent to non-theoretical construction (especially mistakenly manifested as a simple competition for positions between some kind of rebels and conservatives), and the theoretical goals of the \"Cultural Revolution\" itself to move towards the conscious nature of the masses were directly buried by poor class analysis and theoretical propaganda. \nWhen the criticism meeting was held, criticism of the other party was only manifested as criticizing the other party's historical mistakes, only criticizing the other party as so-called \"traitors\" and \"workers' thieves\", overturning old historical accounts, and seriously absentee the persuasion and education of the masses. This leads to the fact that when criticizing the \"Gang of Four\", the representatives of the \"rich and the bad\" and the \"old and new bourgeoisie\" in our party can also be used, and the theoretical confusion leads to the fact that the masses are not aware of the threat of the so-called \"capitalist roaders\" at all, and a large number of people who have come out of the old society will not understand why there are \"capitalist roaders\". \nThe end of the \"short twentieth century\" not only stems from the subsequent direction of reform, but also is profoundly related to the burial of the legacy caused by the heavy historical mistakes of the \"Cultural Revolution\" movement.
  prcs.3129.a: "Suddenly like a spring breeze overnight, thousands of trees and pear blossoms bloom"
  prcs.3130.t: "\"Earth-shattering and generous\" (Part 5)
  prcs.3130.d: "The young man unfolded the scribbled manuscript paper on the table, smiled from ear to ear, then went downstairs, excitedly found the teacher, and unfolded, \"Teacher, look, I have written all the excerpts and annotations here.\" I think it is like the Soviet Union's OGAS and Chile's Cybersyn, both of which are very interesting directions, the former is more like the mending of the Soviet system, and the latter's 'recursive' system is undoubtedly suitable for a certain decentralized planned economic model, but the latter's recursive system is decentralized with a feeling of excessive local power, and now China is not Chile at that time, I think it is very interesting. The teacher took the manuscript paper, smiled, and asked, \"Then what do you think of the 'digital birdcage economy'?\" \"\n\" Haha. The young man took out a pen from his inner pocket and wrote a few words on the back of the manuscript paper, and the teacher stretched out his hand to drag the paper over and took a look, and patted the young man, \"You boy.\" On paper is \"Frankenstein Monster\". \n\"Alas, I thought of your teacher, I was also a supporter of the planned economy before, I remember in the 80s, we taught planned economics, and at that time, we emphasized the further decentralization of rights and the expansion of the commodity economy. In the 90s, we taught market economy, and then we had to study macroeconomics and microeconomics, when we emphasized macroeconomic regulation and giving full play to the regulation ability of market entities...... It's enough to frame our thoughts, and now, it's up to you young people. General Deng Xiaoping's reform ...... The pain of the times...... \"The teacher lit a cigarette, took a puff slowly, looked out the window, looked at the young man again, and smiled and spat out the white smoke in his mouth,"
  prcs.3130.a: "\"Bashan Chushui is desolate, abandoned for twenty-three years.\""
  prcs.3131.t: "Earth-shattering and generous (Part 6)"
  prcs.3131.d: "Although the voice of planned economic reform has overwhelmed the unswerving supporters of the market economy, the change of old problems still gives proletarian intellectuals a great headache. \n"Is the material base rich enough? "What is the intention of re-emphasizing the restriction of bourgeois legal power?" "The 'Gang of Four' intends to borrow the corpse to return to the soul!" "Class struggle or economic construction as the center?" "Political commander of the economy is politics for the economy!" The doubts first came from the opposition to the "Gang of Four". \nPeople dug out a pamphlet in 1978, intending to liquidate the reflection of the reactionary ideas of the so-called "Gang of Four" in the present, the title of the book is: "Criticism of the "Gang of Four" to the "Theory of Productive Forces", in order to continue the exchange, this book was taken out separately and reprinted, and the so-called "counter-revolutionary" books that were labeled as the "Gang of Four" also came to be reprinted, "Socialist Political Economy" reappeared in Shanghai People's Publishing House after more than 50 years, from internal reference to public distribution, and the new book binding was based on red. The name of the book is written in hot stamping. \nThe final theoretical construction of the "Cultural Revolution" and the new publication made readers who could only see it in electronic documents feel a little melancholy, and the fierce debate is still ongoing, just as the "historical legacy problem" that has been entangled for more than 50 years still exists. \n"Hello, former Internet left-wing star. I don't know if this title is offensive to you, but thank you for being interviewed by our TV station. "\n" Haha, nothing, once we discussed on the Internet, at most we were surprised by certain remarks, and if the current popular remarks on the Internet were put at that time, they would be regarded as crazy Internet left criticism. "\n"What are your feelings? ”"
  prcs.3131.a: ""The tiger sits on the dragon plate and surpasses the past, and the world is turned upside down and generous".
