  Chihong_6602_a_tt: "The §RWorkers' Factory Seizure§! Movement will be §Gcontrollable and orderly§!. However, we must invest more §YPolitical Power§!."
  Chihong.6602.b: "Inciting the Workers' Factory Seizure Movement"
  Chihong_6602_b_tt: "The §RWorkers' Factory Seizure§! Movement will be §suncontrollable§!, which could be §Gbetter§! or §Aworse§!.\nA Worker Factory Seizure event will be triggered every 30 days."
