  prcs.3132.t: "三子归边"
  prcs.3132.d: "“我在受训的时候可从没想过从这么高的地方跳下来。”老陈看着舷窗外的地球，感叹道。\n"说实话我们不用跳的，"刘航笑了笑，"返回舱会把我们送到目标区域。真正难的是落地后立刻能战斗。"\n老陈点点头，看着轨道站渐渐远去。作为中国人民解放军太空军第一批轨道空降兵，他们的任务是整个轨道空降计划的关键一环——验证轨道空降的可行性。\n返回舱内共有六名队员，都是从空降兵特种部队精挑细选出来的精英。在太空站上，他们已经进行了三个月的适应性训练——在失重环境下生活，学习如何应对骨密度流失和肌肉萎缩。而今天，他们将证明人类能否在从太空返回后立即投入战斗。\n返回舱开始进入大气层，温度升高，舱内开始震动。与普通宇航员不同，他们身着的不是笨重的航天服，而是经过特殊设计的半刚性战术服——既能提供基本的太空保护，又保留了地面作战的灵活性。\n"各位同志，"队长王铁打开通讯，"我们不是普通宇航员，着陆后没有医疗队接应。我们要牢记做过的生理代偿训练。降落到地面后迅速调整至战斗状态。"\n老陈调整呼吸，开始执行特制的肌肉绷紧放松程序。这是他们在太空站上每天必练的功课——通过特定的呼吸和肌肉控制技术，帮助身体更快适应重力环境。这些技术结合先进的压力服设计，能让他们比普通宇航员更快恢复行动。\n返回舱降落伞展开，地面接近。"着陆倒计时，30秒。各就各位。"系统提示音响起。\n老陈握紧了特制轻型步枪。尽管经历过无数次从高空坠落的训练，面对这前所未有的太空归航，他的手心依然渗出了细密的汗珠。\n"着陆！"\n返回舱稳稳落地，轻微颠簸后停止。舱门弹开，六名战士迅速展开，按预定方案构筑临时防御阵地。尽管肌肉有些颤抖，呼吸略显急促，但他们都能保持基本的战术动作。\n远处尘土飞扬，蓝军的士兵正在向这里推进。老陈迅速找到掩体，强忍着肌肉的酸痛感和头晕目眩，稳住呼吸，瞄准前方。\n"锁定目标，火力压制！"王铁果断下令。\n六人战术队形迅速形成，交叉火力覆盖整个接近路径。老陈的第一枪略微偏高，但立即调整后连续击中两个移动目标。全队配合默契，如同平日地面训练一般精准。\n"太空轨道空降实验，战斗能力测试达标！"地面观察员的声音在通讯频道中响起。\n老陈抹去额头的汗水，露出笑容。从陆地到太空，解放军再次创造了历史。"
  prcs.3132.a: "太空军的轨道空降一环，正式成功"
  prcs.3133.t: "三子归边（其二）"
  prcs.3133.d: "“老陈，你看外面，这地球真漂亮吧。”顺着他指的方向看去，地球就展现在他们的眼前，那么动人。\n老陈点了点头，他在手册上读过，欣赏一下美景是会让人在轨道投送时缓解紧张情绪。而眼下，正是中国人民解放军太空军组建以来的最关键的一环——将那些数据和理论用之以实践。\n \n“各位同志，最后一遍检查弹药。”随着队长王铁的声音在特质的作战服中响起，首批六名成员开始检查着枪支，投送仓，以及作战服等是否准备就绪。等到他们固定在各自的投送仓后，那个平日训练里出现了不知多少次的声音再一次响起，但是这一次，将会是实战测试。\n“即将发射投送舱。请注意……五...三...一，确认发射。”\n此时，在北京的地面指挥部中，除了有太空军的各级将领和发射中心的技术人员，还有着为此事业一直奋斗过来的研究所代表等。在大屏幕上，六个投送舱的位置，下降速度都符合他们的预期，电脑中传回的众人生命体征图也是保持正常，没有过快心跳。\n“保持冷静，保持冷静。”这是老刘在脑中不断告诉自己的东西。没有人来过这个领域，可现在，他们正在创造历史——从近地轨道直接部署作战力量支援作战。随着投送舱越来越接近地面，在舱顶的反助推火箭果断喷射着，让速度迅速降了下来。而到了离地两三米后，返回舱的支架便完全展开，六人鱼贯而出。紧接着便是展示六人训练中的各项内容——落地后迅速集结，展开战术行动……\n“报告指挥部，此次太空尖刀演练圆满完成，请指挥部验收。”\n在那个瞬间，指挥部内所有人都激动的拥抱在了一起，而在现场则是由及时赶到的卫生队为这些“勇士”测量各项生命体征是否正常，并拿出装置让他们适应大气压，以及收集各项数据准备优化接下来的流程和装备。\n老陈在两人的搀扶下，不由得发出来一句感慨。"
  prcs.3133.a: "“天空属于勇敢者，而太空属于开拓者。”"
 prcs.3134.t: "Condor"
 prcs.3134.d: "The flash came on one after another, but Russo just walked into the Puji Monastery with a black face. \nThis monastery in the downtown area of Macau is surprisingly quiet, with green smoke rising from the incense burner and Buddha statues smiling as they watch visitors from all over the world. Russo glanced at the smiling Buddha statues, snorted coldly, drew a cross, and continued to walk towards the back garden. \nIn the back garden, the stone table and stone bench under the intertwined tree are still the same. The victors were waiting for him, and he gritted his teeth and walked towards them with his usual majestic steps. \nBefore Russo could speak, Zhao Yongyuan spoke: "You're late, American." We've waited too long; He paused and showed a mysterious smile: "But we don't care about this, we can wait a little longer today." \nThe translator conveyed the past, Russo ignored him, staring straight at Hu Chunhua: "Your Chinese taste in choosing an address really makes me sick, won't you choose a better place?" Hu Chunhua smiled and said, "You Western Christians will swear under God's watch, so we might as well sign this treaty under the watchful eye of the Buddha." "\n"Don't think of me as a fool! This is where the Treaty of Wangxia was signed, which is a naked diplomatic humiliation. Satoshi Shirai said with a scholarly smile: "Maybe we can drive four aircraft carrier battle groups to your New York Harbor to sign this treaty." "\n" Give me the treaty, hurry up, stay here for one more second is a humiliation to the American people. Russo said impatiently. \nHe picked up the treaty and turned it over..."
  prcs.3134.a: "... But the more he turned over, the more his hands trembled."
 prcs.3135.t: "Folded Wings"
  prcs.3135.d: ""Release the U.S. islands in the Pacific Ocean and place them under the trusteeship of the World Liberation Front...... Disbanding all fleets in the Indo-Pacific region and garrisons in all regions of the Indo-Pacific...... Transfer overseas military bases, ships and equipment to local countries...... You want to embezzle the property of the American army! "\n" You Americans have the law that you can shoot unwanted intruders – and you've been breaking into our homes for too long. Zhao Yongyuan said. \n"Compensate Japan for the property plundered by the United States in Japan, compensate the militaristic lackeys it supported for plundering Japan's property, and apologize to the Japanese people for the historical crimes of funding militaristic lackeys......"\n"Compensate North Korea for all losses caused by illegal interference in the motherland's war of reunification, and compensate the Korean people in the interference in the Asian socialist war......\n"\nCompensate for all legal property plundered from China through unequal treaties in history......\nThis is completely unreasonable! Russo protested, "This is a complete insult to the United States, why should we make reparations for what has passed?" \n"It is only natural that debts are repaid by debts, and fathers and sons are repaid. "\n" ceded the Hawaiian Islands and transferred local power to the control of the United States People's Liberation Army...... All these operations will be completed under the supervision of the coalition forces of the World Liberation Front......" Gloria looked at Russo, who was becoming more and more ugly, sarcastically. Russo put the treaty on the table and squinted his eyes at the people: "So, you still want the plague of communism to spread on our land?" Even if you don't hesitate to divide our country?" He was silent for a while, and then said, "I refuse to sign such a treaty." Hu Chunhua suddenly became very serious and said: "How long this battle will be fought, I think it is up to His Excellency the President to decide; He raised his volume: "As long as you want, we will fight." Until you completely spit out the blood you ate and your blood. Zhao Yongyuan then said: "We don't mind carving a few more numbers on your so-called victims' broken stele." ”"
  prcs.3135.a: "Russo clenched his fist and reached for the pen"
# The South China Sea event chain was not triggered
  prcs.3136.t: "Fury"
  prcs.3136.d: "In the summer of 2026, the sun in the South China Sea will be like melting golden water, splashing unobstructed on the vast blue sea. The air was so hot and humid that it could wring out the water, and the sea breeze had a sticky salty smell. Beneath this seemingly eternal calm, a storm is brewing that will stop the heartbeat of the whole world. After the second black ship, the United States of America did not leave much time for the world to react. The ghostly return of the Seventh Fleet, after a short rest in Japan and after joining the main force of the Fifth Fleet, reversed course and pointed the finger at the world's most sensitive waters. \nThe nuclear-powered aircraft carrier USS Nimitz, a steel behemoth that has been dormant in Alaska's icy waters for years, is now splitting the warm waves of the South China Sea in an almost arrogant manner. Its deck glowed with a cold metal glow under the scorching sun, and the four steam catapult tracks resembled crossbow arrows ready to fire. In the sea further behind it, there is a ghostly presence of the USS Carl Vinson and the USS George Washington aircraft carrier battle group, which are like two tigers ready to go, watching in the shadows and providing invisible strategic support for the "Nimitz" ahead. \nThe United States, this returning giant is using the most radical actions to vent its power to the world, and it wants to use the roar of carrier-based aircraft and the locking of radar to measure how hard the scales of this dragon are and how scorching its breath is. "
  prcs.3136.a: "But can all this really be as it wants?"
  prcs.3137.t: "Discussions"
  prcs.3137.d: "Exactly two hours before the carrier-based aircraft of the Nimitz roared into the sky, three icons representing the U.S. aircraft carrier battle group were firmly locked by the space-based reconnaissance system on the huge screen of the Central Military Commission's Joint Underground Operations Command Center in Xishan, Beijing. Their every move is under close surveillance. Both China and the United States know that the so-called "freedom cruise" has been a show in the spotlight from the beginning. The alarm was silent, but the atmosphere was as solemn as iron. Faced with the unabashed provocative intentions on the screen, the decision-making process is surprisingly fast. \n \n" ordered the Rocket Force to pre-order the coordinates of the shooting range in the South China Sea, conduct anti-ship ballistic missile denial strike exercises, and disclose data throughout the process. "\n \n" ordered the air forces of the southern and eastern theaters, all fighters on duty took off with bombs, and land-based anti-ship missile forces entered the launch procedure. "\n \n" orders the Marines, all landing and special operations units to enter Level 1 combat readiness. \n \nThe three targeted deployment orders were passed unanimously almost without debate, and the radio waves instantly cut through the sky. The real disagreement arose in the scale of the mobilization of the naval fleet. \n \nDing Yi stood up and said loudly: "Comrades. I suggest that the main forces of the three major fleets be gathered and a net should be laid in the South China Sea! Finish the battle and completely end any illusions of US imperialism in the Pacific! However, Tanaka retorted, "In such a large-scale confrontation, be careful to wipe your guns." The South China Sea is the home of the Southern Theater Command. Order the main force of the Southern Theater Fleet to respond and form a confrontation. The East China Sea and North Sea Fleets, as strategic general reserves, maneuvered in the direction of the Taiwan Strait and the Miyako Strait to form a countermeasure. What we want is not a decisive battle to bet on the national fortune, but to tell them in the calmest and most professional way - this is no longer a hunting ground where they can run rampant. ”"
  prcs.3137.a: "Mobilize all fleets and stand ready"
  prcs.3137.b: "The South China Sea Fleet goes to deal with it, and the other fleets serve as the general reserve"
  prcs.3138.t: "Running to the South China Sea"
  prcs.3138.d: "Wang Li parked his Jiefang truck on the emergency stop belt of the G75 Lanhai Expressway, and together with dozens of other civilian vehicles, was commanded by the traffic police to turn off the engine. On a June afternoon in the south, the sun was scorching, and the asphalt pavement was baked to a soft extent, steaming up distorted air. He rolled down the window, lit a cigarette, and looked irritably at the cleared section of the road ahead. Usually there is such a battle only when facing some big person. But this time, it wasn't the black Audi team that came. \n \nFirst came the dull roar from the end of the horizon, getting closer, like oppressive thunder rolling on the ground. The entire road surface trembled slightly, and the pendant in his truck's rearview mirror began to shake restlessly. Immediately afterwards, an unstoppable stream of olive green iron occupied the entire southbound highway with an unstoppable momentum. \n \nLed by a wheeled infantry fighting vehicle with a high-powered turret. Followed by the behemoth that made Wang Li gasp - the ZTD-05 amphibious assault vehicle. Their muscular boat-shaped hulls and huge water thrusters silently declare that their destination is far from inland. The tracks of these steel behemoths struck the hot asphalt, emitting a symphony of metal, each beat seemingly striking the heart of a bystander. On the hull, the faces of the young soldiers looked angular in the shadow of the steel helmets, and they did not look around, but looked directly at the south, which was an absolute concentration without any personal emotion. \n \nAn indescribable emotion seized him. It was not fear, but a shock mixed with awe and blood. Those cold numbers and weapons in the news on weekdays were now running over his eyes in an extremely rough and real way. \n \nThe iron flow rolled south, dyeing the hot summer with a layer of iron horse glacier."
  prcs.3138.a: "When the day comes"
  prcs.3139.t: "Old soldier"
  prcs.3139.d: "The air in Okinawa is as sticky as rotten honey, and the sea breeze rolls up the rotten smell of salt and damp plants, as if even the lungs are moldy. But behind the barbed wire of Kadena Air Base, this disgusting smell is expelled by another smell - sweat, gun oil, the smell of steel left over from the old days, like breath from another world, cold, cruel, unquestionable, only kissed by the fighters. \n \nThe patrolling soldiers paced the edge of the camp one after another, their figures heavy, their steps regular but silent, and the M4 carbine seemed to have been embedded in their bones and became part of their limbs. They are not the young master soldiers who once messed around in peacetime, but wolves that survived the scorched earth of Texas and the ruins of Washington. They have crushed the chests of Confederate soldiers and hung the bodies of politicians on flagpoles in front of the White House. They live, not for peace, but because the war never really ended. War is not an ethereal thing, war is part of their lives. \n \nThe bloody sunset slid down to the horizon, casting a heavy rust red on the camp. Colonel Marcus Kane stood quietly on the roof of the Humvee, his figure straight, like a polished tombstone. The scar from the brow bone to the corner of the mouth was a "gift" left to him by the Chicagoans, and in the twilight, the scar was like a burning crack, tearing the entire face in half, becoming more and more hideous. \n \n"Listen up. His voice was dry and low, like the crisp sound of rust and iron rubbing against each other, but every word was like a nail smashed into the ground. \n"Do you see this land? This is not Seattle, not San Francisco, not where we vacation. Do you think we won? Do you think the war is over? He paused, his eyes scanning over the faces. Some of them are familiar to him, and some of them he can't remember their names for a long time. This was the army he had put together little by little, from New England to the Rocky Mountains, from San Francisco to Richmond. They have won and been beaten through - to die, to replenish, and to die again and again. In fact, the number of people who followed the uprising back then has become very few. But the spirit of this unit is still maintained, they have always been good at fighting strong enemies, and they are also accustomed to the roaring artillery fire of the long night, the drone swarms covering the sky and the torrent of steel all over the mountains. \n \n"We were wrong. Kane whispered, but his tone was getting colder and colder. As we bury our heads in rebuilding, a new tyranny rises from across the Pacific. They laugh at us and wish they could pee on the ruins of Capitol Hill. They feel that we have become soft and broken our backbone. I thought that the Stars and Stripes were just a trademark and could only be printed on Walmart's underwear. His fist was slowly raised, and the back of his calloused hand bulged like a stone: "They have forgotten who we are." They forgot how the United States of America was born. Then let's remind them - "We are here to rewrite every word of the Constitution on their land with the blood of the enemy!" Let the world see what the price of tyranny is! He raised his fist, and the veins on his arms burst out. Polishing your bayonets! When the trumpet blows, we will make hell tremble for us! "\n \n" Polishing your bayonets. He roared, as if giving some kind of curse, "When the horn sounds, we will let hell itself make way for us." Oorah！ ”\n“OORAH！ The response was not a cry, but more like a group of beasts biting the reins and roaring nakedly made of blood and fire. They are not fighting for justice, but because they have no choice. The war has shaped them, and now, they are the fire itself. It was a collective hungry roar from a group of vicious dogs fed by war, after smelling a new smell of blood. \n \nThe whole night in Okinawa seems to be trembling with it. "
  prcs.3139.a: "Do it, soldiers, just as we crushed the Antifa visionaries on the West Coast."
  prcs.3137.b: "The South Sea Fleet proceeds to respond, with other fleets serving as a general reserve"
  prcs.3138.t: "Heading toward the South Sea"
  prcs.3138.d: "Wang Li parked his Liberation 牌 truck on the emergency stopping strip of the G75 Lanhai Expressway, along with dozens of civilian vehicles, and had his engine turned off under the command of traffic police. In the afternoon of June in the Southland, the sun was scorching, the asphalt road softened under the heat, and the air twisted as it rose. He rolled down his car window, lit a cigarette, and watched impatiently in front of the cleared section of the road. Such a scene is usually only staged when welcoming some big personality.\n \nBut this time, it wasn't an Audi convoy in black.\n \nFirst, a low, rumbling thunder was heard from the horizon, growing closer, like suppressed thunder rolling on the ground. The entire road surface trembled slightly, and the ornament in the rearview mirror of his truck began to shake restlessly. Next, an endless stream of olive-green iron, with an unstoppable momentum, occupied the entire southbound highway.\n \nLeading the way were wheeled armored fighting vehicles with their turrets raised. Following them were the colossal machines that made Wang Li gasp in astonishment—the ZTD-05 amphibious assault vehicle. Their muscular hulls and massive water propellers silently declared that their destination was far from inland. The tracks of these steel behemoths 敲击 on the scorching asphalt road, producing a symphony of metal, with each impact as if striking the heart of an onlooker. On the hulls, the faces of the young soldiers appeared sharp under the shadows of their helmets; they did not look around but stared straight south, a look devoid of any personal emotion, absolute focus.\n \nAn indescribable emotion gripped him. It wasn't fear, but a mix of awe and surging blood. The cold designations and weapons he had seen in the news were now passing before his eyes in an incredibly rough and real manner.\n \nThe iron stream rolled southward, casting a chill of 'iron cavalry crossing a frozen river' over the sweltering summer"
  prcs.3138.a: "When that day comes"
  prcs.3139.t: "Old Soldier"
  prcs.3139.d: "The air of Okinawa is thick as rotting honey, the sea breeze carrying salt and the stench of decaying plants, as if even the lungs are moldy. But behind the barbed wire of Kadena Air Base, this disgusting smell is driven away by another scent—sweat, gun oil, the lingering scent of steel from another era, like the breath of another world, cold, cruel, unquestionable, only to be kissed by warriors.\n\nPatrolling soldiers march in formation at the edge of the camp, their figures heavy, their steps regular yet silent, the M4 carbines seemingly fused into their bones, becoming a part of their limbs. They are not the kind of officers who loafed around in peacetime; they are the wolves that survived the scorched earth of Texas and the ruins of Washington. They have crushed the chests of Southern Union soldiers and have personally hung the bodies of politicians on the flagpoles in front of the White House. They do not fight for peace, but because war has never truly ended. War is not something intangible; war is a part of their lives.\n\nThe blood-red sunset slides down the horizon, casting a heavy rust-colored hue over the camp. Colonel Marcus Kane stands motionless atop a Humvee, his posture straight, like a polished tombstone. The scar that cuts from his brow to his mouth is a 'gift' left by the Chicagoans, and in the twilight, the scar resembles a burning rift, tearing his face in two, becoming even more fierce.\n\n\"Listen up,\" his voice is dry, low, like the crisp sound of rusty iron grinding against each other, but every word feels like a nail being driven into the ground.\n\"Have you seen this land? It's not Seattle, not San Francisco, not where we go on vacation. Do you think we won? Do you think the war is over?\"\n\nHe pauses, his gaze sweeping over each face. Some he recognizes, some he has long forgotten their names. This was the army he pieced together piece by piece, from New England to the Rocky Mountains, from San Francisco to Richmond, burning their way. They have won, but also been pierced—dying, replenishing, dying again. In fact, the number of those who once followed the uprising has become extremely small. But the spirit of this army remains, they have always been skilled at fighting against strong enemies, and they have grown accustomed to the 炮火 of roaring nights, the drone swarms that 遮天蔽日, and the flood of steel that covers the mountains and plains.\n\n\"We were wrong,\" Kane says in a low voice, his tone growing colder.\n\"While we were busy rebuilding, a new tyranny rose across the Pacific. They laugh at us, wishing to urinate on the ruins of the Capitol. They think we have become soft, broken our spines. They think the Stars and Stripes is just a trademark, something that can only be printed on the underwear of Walmart.\"\n\nHis fist slowly rises, the back of his calloused hand bulging with stone-like blue veins:\n\"They've forgotten who we are. They've forgotten how the United States of America was born. Then let us remind them—We are here, ready to rewrite every word of the Constitution with the blood of our enemies on their land! Let the whole world see what the price of tyranny is!\" He raises his fist, the blue veins on his arm bulging.\n\"Sharpen your bayonets! When the bugle sounds, we will make hell tremble for us!\"\n\n\"Sharpen your bayonets,\" he roars, as if delivering some kind of curse.\n\"When the bugle sounds, we will make hell itself clear a path for us. Oorah!\"\n\"OORAH!\"\nThat response is not a shout, but more like a group of beasts tearing their reins, baring their teeth and emitting a 狂吼 forged in blood and fire. They do not fight for justice, but because they have no other choice. War has shaped them, and now, they are the fire itself.\"It was a pack of war-fed vicious dogs, letting out a collective, ravenous howl upon catching the scent of fresh blood. \n \nThe entire night of Okinawa seemed to tremble in response.Please provide the text you would like translated into English Language\""
  prcs.3139.a: "Go and do so, soldiers, just as we crushed those Antifantasy dreamers on the Western coast"
  prcs.3141.t: "Sharp Blade"
  prcs.3141.d: "The hustle and bustle of the electromagnetic spectrum has not completely subsided, and the clash of physical space has begun. At an altitude of tens of thousands of feet, the thin air is cold and biting, and the South China Sea is like a huge, deep sapphire set in the curved horizon. Here, it will soon become the ultimate gladiatorial arena of pilot will, technology and aircraft performance. \n \nA formation of more than a dozen F/A-18Es, like a flock of raptors with open claws, pounced straight to the edge of the Chinese fleet's air defense identification circle. Their goal is not to break through, but to oppress, and to use the most direct air superiority to draw a "red line" belonging to the United States at the other party's doorstep. Almost at the same time, the J-15 fighter jet ejected from the skid deck of the Shandong ship met with a standard interception formation. The sea gray paint makes them almost blend in with the background of the sky and the sea, like sharks leaping out of the depths, ready to defend their territorial waters. \n \nThere was no communication, no warning, and the moment they met, the fierce aerial combat began. This is a tacit dance of death on the brink of war. U.S. pilots took the lead in attacking, and with their rich practical experience, they tried to use the classic "scissor maneuver" to get around the rear of the J-15. However, the Chinese pilots showed amazing composure, and instead of falling into a one-on-one fight, they used small formations as a unit to cover each other and use data links to build a three-dimensional defense network. \n \nIn the cockpit, the screech of radar lock alarms came and went, and on the HUD, the cursor representing the enemy aircraft was frantically flashing and jumping. Every maneuver with high G overload pressed the pilot to the seat, and the blood seemed to be drawn from the brain. The sky has become a three-dimensional chessboard, and both sides are playing the most complex game with life and steel. Once they passed by, the pilots of both sides could even see the cold eyes under each other's helmets through the cockpit cover. "
  prcs.3141.a: "The flying shark raised a furious wave, and the swarm was submerged in this blue sky"
  prcs.3141.b: "The sky in the South China Sea is also shattered"
  prcs.3141.c: "On this turquoise gem, the bees dance wildly, circling like flies"
  prcs.3142.t: "Ghost? Phantom! "
  prcs.3142.d: "Six B-2 Ghosts of the 509th Bomber Wing have just completed aerial refueling and are flying from Hawaii to Guam. The formation leader, Air Force Lieutenant Colonel Mark Thompson, was confirming the route with the rear command through an encrypted channel. "Pacific Command, the Ghost Formation has completed its second refueling and is expected to arrive at Anderson Air Force Base in four hours." He checked the navigation system while scanning the boundless Pacific Ocean. The B-2 has only a faint green light in the cockpit and a deep night sky outside the cockpit. \n"Ghost formation, received by Pacific Command. Maintain the course, and the early warning network shows that the route is clean. Thompson nodded, but he felt a little uneasy. Since the Patriot Front reunited the United States, the situation in the Pacific has become increasingly tense. The Navy's "freedom of navigation" operation in the South China Sea hit the Chinese aircraft carrier battle group, and at this time it was the turn of the Air Force to show its muscles. The deterrent value of the six B-2s is self-evident—a strategic bomber capable of carrying strategic weapons deep into any air defense zone. The stealth performance of the B-2 does not require any escort: escort fighters will even expose the position of the B-2. This was supposed to be a completely safe task, but Thompson always felt that something was wrong. \nSuddenly, Thompson's co-pilot, Captain Jack Rodriguez, stared at the night sky on his left, his voice tingling with a hint of confusion: "Long plane, two o'clock on the left... Do you see anything? \nThompson turned his head and saw nothing, only boundless darkness. But gradually he noticed that the starlight seemed to be subtly obscured in an area, creating an irregular shadow outline. "Hell... What is that? \nAs soon as the words fell, the shadow moved. It turns slowly, and the moonlight shines on the surface of its body, revealing a breathtaking silhouette - a diamond-shaped body, sharp leading edges, and an overall surreal geometric beauty. The fighter plane was like a deadly blade, silently cutting through the night sky. \n"Attention all units, an unidentified aerial vehicle was spotted on the left! "Thompson hurriedly reported in the encrypted channel." The radar did not respond, and the visual confirmation of a... Fark, I don't know what type of fighter it is! "\n" Ghost One, Pacific Command, please report the contact in detail. The voice of the command came, with obvious nervousness. \nAt this moment, the second, third, and fourth identical shadows emerged from different directions. And Thompson finally saw the logo on the wing - the rectangle cut off by the Bayi star. "Chinese Air Force!" Thompson exclaimed, "Damn, how did they find us?" At this moment, the four fighters began to approach the formation at the same time, in Thompson's view, this was an invisible noose put on the neck of the ghost formation, and at this moment the B-2 formation was like a hen in front of the eagle, and any movement of the Chinese military aircraft made him tremble. He shouted into the radio regardless: "For God's sake, hurry up and fuck support!" F-22, F-35 or anything else will do! If we were later, we would have been knocked down! "Ghost One, calm down!" Hold your horses! "The voice of the Pacific Command sounded sharply in the channel." The nearest F-22 formation is 800 nautical miles away, and the F-35 needs to take off from Okinawa, which takes at least an hour and a half. Now listen to me, don't make any provocative moves! As if hearing their communications, the four fighters continued to approach, suffocatingly close. Through the cockpit glass, Thompson could almost see the indifferent eyes behind the PLA pilot's helmet mask, as well as the sarcastic smile on the corner of his mouth. The feeling of being thoroughly seen through made him shiver. \nSuddenly, as if receiving some kind of invisible instruction, the four silver ghosts broke away from the formation in unison. They spread out in four different directions at a dizzying acceleration, instantly disappearing into the dark night sky as if they had never appeared. The whole process took less than ten seconds, and it was as clean as an illusion. The night sky returned to silence, leaving only six B-2s suspended alone over the Pacific Ocean. Thompson and his crew looked at each other, each with cold sweat oozing from their foreheads and their flight suits on their backs soaked with sweat. They had just experienced the most terrifying minutes of their careers - the radar was clean and the AWACS aircraft reported that "everything is fine". But they knew that the ghost and his warning were the most real existence over this sea. "
  prcs.3142.a: "The name of 'ghost' has changed its ownership since then."
  prcs.3205.t: "Ginkgo biloba"
  prcs.3205.d: "Six F/A-18F Super Hornets of the Warhawk squadron have just completed aerial refueling and are performing combat patrols in predetermined airspace in standard diamond formations. Squadron Commander, Rear Admiral Kyle R. Rattlesnake" Johnson, while scanning the mirror-like sea surface of the South China Sea, listened to the repeated air situation report from the E-2D "Hawkeye" AWACS aircraft - "The airspace is clean, and there is no abnormal contact." Pardon, airspace clean, no unusual contact. This calm boredom made him feel a little uneasy. \nSuddenly, Jensen's wingman pilot, the captain codenamed "Ghost", broke the silence with a hint of confusion in his tone: "Fry the No. 1, I...... At three o'clock, I seemed to see something, it looked like a piece of ...... Leaf? "\n" Leaf? Jensen raised his eyebrows and turned his head to look in that direction. Fry the dough circle No. 2, check your oxygen supply system. We are now 30,000 feet high, and you may be hypoxic-"\nAs soon as the words fell, Jensen saw it himself. That's not an illusion. There was an airplane, with an almost impossible smooth stance, silently rising from the lower right side of their formation, hovering in a parallel position to them, less than half a mile away. The radar warning was still unresponsive, and the data link was not marked at all, as if it did not belong to this world at all. It looks like a huge ginkgo leaf, and the entire fuselage is a matte light gray, simple and streamlined, like a work of art. It doesn't have the heavy aggression of the "Super Hornet", nor does it have external mounts, only a deadly grace, as if it were the light claws of an apex predator. \nPanic rushed through the cockpit of the six fighters like an electric current, and a chill spread quickly. The pilots of the "Warhawk" squadron subconsciously dispersed, trying to lock the uninvited guest on the fire control radar. However, no matter how they adjusted their flight, the ginkgo leaf-like target always remained in the blind spot of their attack angle. It does not make any attack movements, as if it is just quietly observing, following closely behind like a ghost. \nThen, the ginkgo biloba moved. With an acceleration that was almost impossible to capture, it instantly cut between Jensen and the wingman, and the distance between the two was so close that the coating on the surface of the fuselage was almost visible, and that coating seemed to swallow the surrounding light. \nAfter the display, the ginkgo leaf did not stay. It just flicked slightly, and the nose rose slightly, turning into a streamer that could hardly be captured visually. Immediately, with an almost incredible vertical climb rate, it disappeared into the azure sky. The whole process takes less than three minutes, from appearance to disappearance, like an illusion. \nIn the communication channel, the six pilots of the "War Hawk" squadron fell into dead silence in the air. Their radar is still clean, and the AWACS aircraft are still reporting that "everything is normal". But they knew that the ghost and his warning just now were the most real existence over this sea. "
  prcs.3205.a: "The ginkgo biloba leaf that keeps people awake at night"
  prcs.3143.c.t: "Dragon roaring in the South China Sea"
  prcs.3143.c.d: "In the early hours of this morning, a brief statement issued by the Pentagon brought a shocking end to the tense standoff in the South China Sea that lasted for several days. In view of the complex tactical environment in the current sea area, in order to ensure the safety of personnel and assets, the USS Nimitz, USS Carl Vinson and USS George Washington aircraft carrier battle groups of the United States Navy have completed their "freedom of navigation missions" and have begun "scheduled rotations" to Philippine waters, the statement said. \n \nIntelligence sources who spoke on condition of anonymity confirmed that in the past 72 hours, the U.S. military has encountered unprecedented challenges on both invisible and tangible battlefields. The global market reacted violently when the news broke. Tokyo's Nikkei index plummeted more than 5% at the opening, and the Japanese prime minister urgently held a national security meeting. A senior official of the Japanese Ministry of Foreign Affairs, who did not want to be named, said pessimistic: "We seem to have overestimated the weight of the United States. "In Canberra, Delhi and Seoul, panic is also spreading, and the foundations of Taeyo have been shaken at this moment. Beijing has maintained a high degree of restraint, with a Foreign Ministry spokesman only reiterating at a regular press conference: "The Chinese military is determined and capable of defending national sovereignty and territorial integrity." "However, this silence is more powerful than any fiery rhetoric."
  prcs.3143.a: "White Eagle Broken Wings"
  prcs.3143.t.t: "Deadlock"
  prcs.3143.t.d: "After urgent mediation by many parties, the clouds of war hanging over the South China Sea have temporarily dissipated. According to reliable sources, China and the United States have reached an informal disengagement understanding, and the fleets of the two sides will retreat to a safe distance to avoid escalation of the conflict. The "South China Sea standoff" that lasted for several days ended in a suffocating draw. In this high-stakes game, there is no winner. Although the U.S. aircraft carrier battle group successfully entered the South China Sea, it faced an unprecedented tough posture of the Chinese Navy and Air Force. In the fierce electronic warfare and aerial dogfighting, both sides showed the ability to make the other pay a heavy price, while also exposing their vulnerabilities. A former senior NATO military adviser commented: "Both sides put their guns to each other's heads, and this is a stalemate that no one can afford to lose." This event is not the end, but the beginning of a new Cold War era. The United States has proven that it still has the determination and ability to intervene in the Western Pacific, while China has proven with its strength that it is no longer its backyard. The South China Sea has since become a long-term and high-risk front of confrontation between the two giants. "
  prcs.3143.b: "Take a step back."
  prcs.3143.a.T: "White Eagle Victory"
  prcs.3143.a.d: "The White House today announced that the U.S. Navy has successfully completed its "freedom of navigation" mission in the South China Sea, vigorously defending international law. The Department of Defense report rarely discloses some details: in electronic warfare confrontations and air confrontations, the U.S. military does not fall behind, forcing Chinese fighters to never enter effective attack positions. Satellite imagery confirmed that the Chinese fleet maintained a safe distance of more than 200 nautical miles from the U.S. military during the standoff. In the end, after the U.S. carrier-based aircraft formation completed a symbolic operation over a disputed island and reef, the Chinese ship and aircraft chose to disengage. This victory is tantamount to a shot in the arm for the United States of America, which has just emerged from the shadow of the civil war. Thomas. Russo gave a televised address in the Rose Garden, saying that "America is not only back, but stronger than ever." \n \nThe countries of the Pacific Covenant have issued statements expressing complete trust in the leadership of the United States, and the cohesion of the Pacific Covenant has been unprecedentedly consolidated. Beijing, on the other hand, fell into an awkward silence, with little official media coverage of the incident. "
  prcs.3143.c: "Dragon Broken Halberd"
  prcs.3146.t: "The dust is starting to settle......"
  prcs.3146.d: "At this time, there were only sporadic firefights left in the entire South China Sea, and as the smoke gradually dissipated, the outcome was clear. \n\nBased on the research and judgment of multiple battle reports, it can be asserted that ......"
  prcs.3146.a: "…… The battle is coming to an end"
  prcs.3147.t: "Fall into the Trap"
  prcs.3147.d: "Chinese armored vehicles and tanks drove along the main road. The Japanese civilians on both sides mostly looked haggard, their hands covering their mouths. They couldn't believe that the 'kamikaze' attacks, so heavily publicized by the General Headquarters, hadn't come. Instead, it was this group of Chinese soldiers they had jokingly said would never set foot on Japanese soil. Even during World War II, the US military hadn't landed on the Japanese mainland, but now, these 'monsters' had broken through the defenses of the Maritime Self-Defense Force and the Air Self-Defense Force, advancing towards the final defensive line built by the Ground Self-Defense Force in Kyoto. On the crumbling walls of the buildings on both sides, there were still propaganda posters declaring a final battle against the Chinese army, but sappers had planted explosives, preparing to blow them up. Then, the roar of a Chinese fighter jet flying at extremely low altitude made these Japanese citizens in the occupied territories dizzy and terrified." "Mom, I miss Dad." A little girl tugged at her mother's tattered clothes, the doll in her hand already mangled from dragging on the ground. Her mother picked her up and whispered in her ear, "Daddy isn't coming back yet. Daddy has to go with the others to drive these people who have occupied our land back." "But Mommy, these uncles all look victorious on their faces. Didn't the radio say we're stronger than them? But a couple of days ago..." "Stop talking, Mitsuko!" Her mother, as if provoked, slapped her hard across the face. "If you ever question Daddy or our country again, I'll send you to these ruthless red devils right now! I'll abandon you!" The girl couldn't understand why her mother had slapped her, but the burning sensation made her instinctively cry.
  prcs.3147.a: "Amidst the girl's cries, the propaganda posters were reduced to ashes as the explosives detonated."
  prcs.3148.t: "Entrepreneurs anti-war protests?"
  prcs.3148.d: "Since General Secretary Hu came to power, the party has slightly relaxed public opinion. The situation in the Taiwan Strait was turbulent, and when the PLA soldiers were overcoming difficulties, a letter came to the general secretary's desk. \n"Dear General Secretary Hu Chunhua:\nMy name is Liu Xingfu, from Ningbo, and I joined the Communist Party of China in 1998. I started running a garment processing factory in 2014, and the garments I produced were basically sold overseas, and the profits generated were enough to make me, my wife, and my son and daughter live a prosperous life. \nWe have established good relationships with distributors overseas, and our products can be found on the shelves of Vietnam, Singapore, and Japan until the war in the Taiwan Strait completely bankrupted the factory. I shut down equipment, dismissed employees, and took loan sharks. We had to sell our apartment in the city. Both of my children still have to go to school, but I can't even afford to pay the tuition fees. My wife is already planning to go through the divorce procedures with me. General Secretary Hu Chunhua, I want to say that I have always believed that you can lead our country to strength. But now, this war has caused countless people like me to live in pain. Is this the "fairness and justice" you promised? I beg you to end this war and bring peace back!"
  prcs.3148.a: "The general secretary put down the letter and looked at the battle report on the front line, with a touch of coldness in his eyes"
  prcs.3149.t: "Anti-war public opinion?"
  prcs.3149.d: "With the development of the war in the Taiwan Strait, the country gradually turned to a wartime economy, and the people of the whole country began to be united in the mighty war song led by the party. However, the Grand Concerto also has several dissonant sounds - on some social media, calls for "peace, not war" have sprung up; On the censorship platform, videos of demonstrators from some big cities taking to the streets holding up red, green and white flags representing "workers, peace, democracy" were placed. They gathered in groups to accuse the Chinese Communist Party of bringing war, oppressing workers to produce military facilities at high intensity, and the central government being arbitrary, disrespecting public opinion to forcibly launch wars and attack the police force, and then being dealt with by riots. \n"I have to say that now the central government has taken decisive action, but compared with Germany and France, which rely on the strength of their own people to solve the economic crisis, the consequences of this approach by the central government... I can't say, well" In the latest video, a well-known "democratic socialist" expresses his "opinion". One stone stirred up a thousand waves, and his comment area reacted violently, but people from all walks of life turned upside down at this time. "
  prcs.3149.a: ""War is a mistake, and the party is only trying to divert contradictions!" "
  prcs.3151.t: "A different parade"
  prcs.3151.d: ""Another parade on Friendship Avenue in the east of the city?" \nIn a police station in Guangdong, Xiao Wang's facial features were twisted together, "Didn't you parade at noon?" It's really a bunch of cunning people..." Sori commissioner Zhen Cangshu smiled reluctantly, "This... It can only mean that the comrades in our propaganda department have not done a good job. He tore open the packaging of medical swabs with his teeth and applied medicine to his injured arm - just now, the marchers threw homemade Molotov cocktails into the procession and were stabbed by flying glass shards. \n"If there is an order from the superior, if there is another bloodshed, the special police will be dispatched. Da Chen said, nervously looking at the screen, in which police officer Xiao Zhang was on the front line. \n"No, this is a parade led by the leaders of the local automobile trade union that was established not long ago," Xiao Zhang paused on the front line, looking at the shocking scale of the parade. "I feel that they are on our side, and some auxiliary police are coming, and it is enough to maintain order." \n "Who said that the propaganda comrades are not working hard enough, the propaganda comrades are great." Da Chen breathed a sigh of relief and opened his mouth to tease. The high-altitude camera only captured a red tide - the crowd waved a five-star red flag and pulled a red banner that read "Adhere to the party's leadership and don't let the People's Liberation Army chill the heart". Unlike the small fights of dozens of people, this time, the parade of 10,000 people sent out a deafening roar to the world: "The Chinese people firmly support the just Taiwan Liberation War, and any attempt to divide public opinion will succumb to the will of the people." ”"
  prcs.3151.a: "In the air, a part of the plane rows through the sky, guarding this red tide"
  prcs.3152.t: "Lines, newspapers, reasoning"
  prcs.3152.d: "Kaga looked at the report on his desk, there have been riots in various areas of Tokyo these days, go around the city, you may see clashes between the marchers and the police, so Tokyo citizens have to be careful not to be hit in the head by a Molotov cocktail or accidentally hit by a stick. \n \nKaga took a puff of smoke, only to see him holding scissors to cut the newspapers wantonly and scattering them on the table, and then he took out a few thumbtacks and a piece of chalk from the drawer, and then, while conceiving the blueprint of his brain, he drew lines to bind the newspaper, drawing various relationships and annotations on it, as if an engineer was conceiving his grand plan. \n \nIshigami pushed open the door of the office, holding the coffee he bought from downstairs in his hand, and asked when he saw this; "Hey, Kaga, what are you doing, didn't the newspaper make it very clear, Mr. Kitajima was assassinated by the red group." \nKaga disagreed, saying; "Are you sure? How do I think this is a bit strange? Kaga picked up the coffee that Ishigami put on the table, took a sip, and continued; First of all, some people on the forum recently said that a lot of new surveillance systems have been installed near their home, and they have seen that people suspected of being monitoring their community, and although Kitajima himself has been criticizing the red elements and does not have any good impression of the red elements, but the North Island has always been positive and popular with the public, if the red elements choose to assassinate North Island, then it will be a loss-making deal for them, so I personally suspect that it is not as simple as it seems. The stone god looked at the blackboard in a daze, and suddenly, he thought of something;" At that time, some people recalled that when they saw the police who came to suppress it, they seemed to shout 'werewolf' into the walkie-talkie, it seemed that there should be something tricky, maybe they could investigate it? "\n \nKaga also nodded in agreement, perhaps, the whole thing doesn't seem that simple."
  prcs.3152.a: "Can two detectives find anything?"
  prcs.3206.t: "Inspections"
  prcs.3206.d: "It was a late night in early autumn, the road was silent and uninhabited, only to see the yellowed leaves falling on the cement, and being blown down by the wind on the side of the road, not far away, patrol officer Sasagaki was inspecting the street with a flashlight, for him, this was just another ordinary patrol task, he only needed to carry out the task step by step until dawn to sleep beautifully. With this in mind, Sasagaki walked all the way to a certain alley, which was very tortuous and seemed to have no end, and when the street lights around here were broken, the alley seemed even more silent with a hint of horror. \nSasagaki raised his throat, although it was not the first time he had come to this place, but he would always feel a little terrified, but since he had come to this place so many times, there was no need to be afraid of anything, so Sasagaki walked into the alley as usual to check what was wrong with this place. \nThe light of the flashlight shines into the depths of the alley, and there is nothing else except the mottled walls and a few very foul-smelling trash cans. Sasagaki thought to himself, continue to patrol this alley and complete his task tonight. \nWhat he didn't know was that in the trash can he missed, the rotting raw meat that maggots were gnawing on, exposing the bones of his knuckles, and the helmet with the word "core" could be vaguely seen next to the carrion on the thighs where the flies layed. "
  prcs.3206.a: "Today, the body of a 20-year-old male was found while taking out garbage from nearby residents, who was suspected to be a member of the Core faction during his lifetime........"
  prcs.3153.t: "small talk"
  prcs.3153.d: "So do you have any ideas at the moment? The people in this block asked around, I still don't have any clue, maybe we need to go to the deceased's hometown to investigate? In an old car, Kaga said to Ishigami while eating bread. \n \n"Hmm。。。。。。。 I can't say, first of all, the deceased rarely contacted his family after coming to Tokyo, maybe because he was too busy with work, or maybe he was involved in the red group so he couldn't have much contact with his family, and then, some people around here said that there was a mysterious black shadow flashing in the alley, although I am not sure if it is true, but in view of the damage to the street lamp, my personal tendency is true, after all, there are indeed conditions for committing crimes in a dark environment. "\n \n"But how did he complete the murder in an alley in such a dark environment? I mean, how did he kill people without making a sound, and disappeared in a winding alley? "\n \n" wait a minute, look at this. Ishigami opened the note, "'I heard a bang from the sewer', there have been voyeurs staying in the sirs and peeping under the girl's skirt before, so maybe the murderer used the sewer to commit the crime, and then opened the manhole cover and threw the body into the trash can, which may be a more reasonable explanation." "\n \nKaga nodded in agreement and said;" So go to the sewer now? Anyway, it's coming, so we have to dig something up. ”"
  prcs.3153.a: "\"Wow—\" The sound of the manhole cover opening"
  prcs.3154.t: "Ghosting"
  prcs.3154.d: "The crowd, who had been waiting for a long time, craned their necks to look at the seemingly endless subway tunnel. Then a blinding beam of light shone on their faces as a subway train emerged from the darkness and slowly pulled up beside the platform. The light from the platform shone into the carriage, illuminating Ando Sai's face, which was shrouded in shadow. Ando Sai stood in the carriage, his gaze sweeping over the faces of the seated passengers. An old woman leaned on an old man's shoulder, and the old man pulled her closer to him; a young man was playing a handheld game with his companion, their joy evident on their faces; an office worker was discussing late-night snacks with his family. His gaze met that of a child." Just as Ando Sai's stiff facial muscles were about to twitch into a smile, the child immediately burrowed into his mother's arms, unable to bear looking at him. His gaze averted, staring blankly out the subway window. As the train started moving, the faint lights of each station quickly abandoned him, disappearing into the darkness of the tunnel. His eyes caught sight of posters advertising conscription and the "Greater East Asia Holy War." He quickly tightened his collar, shrank his neck, and wrapped himself up even more tightly. The train slowly came to a stop. He stood in the crowd and slowly moved forward, exiting the subway station. The moment he stepped out, a powerful roar reached his ears: "No America! No war!" Then a sea of ​​white and red helmets filled his vision. On the other side of the students was a human wall formed by the Metropolitan Police Department's riot police, their gray-black shields already lined up. The two groups were now facing off. "Snake has arrived. Snake, please enter." The female voice through the headset pierced his mind. He reached into his pocket; the glass bottle lay still. Then he put on his white helmet and walked into the crowd. A man in a red helmet and glasses, holding a megaphone, addressed the group behind him: "Gentlemen! The foolish authorities have dragged our Japanese people into a pointless war, sacrificing many of our compatriots in vain. And now, for the sake of their so-called allies across the ocean, they want to drag us into another pointless, bloody war, plunder more wealth for this war, and further turn us into slaves of the Americans! We are simply here to show the authorities the will of peace. We will not use force; we are just petitioning. We just want them to see that we will not buy into their so-called anti-China and anti-communist rhetoric!" Then, with all his might, he roared: "We will not be human shields for the Americans! We are not sacrifices for the authorities!" A roar erupted from the sea of ​​helmets. Ando remained silent, pushing his way through the crowd, his target already firmly in his mind. His headset crackled: "All teams are in position. Snakes, come out!" "So he ripped off his headset and pushed through the crowd. He saw the impenetrable shield formation of the Mobile Squadron, the ghostly figures swaying in the shadows, and the posters encouraging war donations. He stepped forward, pulled a wax-sealed bottle from his pocket, the dark yellow liquid reflecting his face. A few shakes would release the flammable substance into a high-temperature environment. With all his might, he hurled the bottle at the Mobile Squadron. The man in the red helmet stared in surprise, about to say something to stop him, but it was too late. Sparks flew everywhere. Then the Mobile Squadron's shield formation rushed towards the sea of ​​helmets, while the ghostly figures emerged from the shadows, the Metropolitan Police Department's Public Security Bureau insignia glaringly obvious. Amid screams, Ando Sai quietly slipped away from the crowd and disappeared into the darkness."
  prcs.3154.a: "He subconsciously touched the Ministry of Public Security badge in his pocket."
  prcs.3155.t: "War Machines"
  prcs.3155.d: "Brilliant lights shone from the glass-like buildings, tearing through the Tokyo night sky along with countless searchlights. Under the dim streetlights, groups of office workers, dressed in identical white shirts and black trousers, carrying black backpacks, walked mechanically forward. Several drunken American soldiers staggered through the crowd, the baton insignia on their epaulets particularly conspicuous. An employee accidentally bumped into them and was immediately shoved violently to the ground and kicked twice. In the distance, a Metropolitan Police Department police car was hidden in the shadows of tall buildings; a struggling figure was brutally struck on the head with a baton and then shoved into the car. The traffic lights mechanically emitted bird-like cries, their blood-red light reflecting on the pale faces." On the facades of high-rise buildings, holographic advertisements looped, playing the Emperor's call to arms. Behind the images of the Imperial Palace and samurai, a proud bald eagle, a roaring elephant, and a poised kangaroo glared angrily, their blinding light causing passersby to instinctively lower their heads. The glory of the Empire weighed heavily on the shadows of the streets. Between the light and shadow, a tiny black shadow moved slowly—like a dead pixel, impossible to erase by the dazzling electric light. Kobayashi Shusui walked past the giant screen. Posters on the street corner were a mix of propaganda for "anti-red and anti-Chinese" and "Japan-US friendship" with small advertisements for schoolgirls. A poster of an armored samurai and an official with piercing eyes caught her eye—the slogan read, "Dedicate yourself to the Holy War of Greater East Asia!" She slightly raised the corner of her mouth, her hand reaching into her pocket, the touch calming her nerves. She took out a vanity mirror, glanced at herself, and turned into a small alley. In her earpiece, the host was passionately lecturing on the "necessity of national defense." Inside the alley, beggars huddled under newspapers, some already stiff. The overpass was piled high with yellow chrysanthemums and weeping candles; the loved ones of those who lost their lives in the war lamented its devastation. She glanced at her watch, quickened her pace, and walked to the small, neon-lit restaurant deep in the alley. She took a deep breath and pushed open the door. The security guard at the entrance was tilting his head back, chugging cheap sake down his parched throat. Inside the private room, several greasy-faced old men were swaying drunkenly, their slurred conversation rising from the alcohol: "Well, whatever tricks they play… the glory of our nation's army… is imperative!" "One of them was the face from the poster. Seeing her enter, the group lewdly grinned. 'Beauty…come sit next to the samurai. I am a samurai, you know! How despicable!' The man raised his hand. 'Remember Okawa Inoue?' Kobayashi suddenly spoke. 'Who? My colleague?' 'He was a soldier, he died in Taiwan.' 'The Chinese did it?' he asked casually. 'No.' Kobayashi smiled, a bright smile: 'It was you who killed him to prevent him from being captured. Then you said he was missing.'" "That's... loyalty to the Empire, huh..." Laughter echoed in the private room. Kobayashi laughed too—restrained, cold, and filled with venomous rage. It was they who had dragged our birthplace into a reactionary war. A moment later, she stuffed her bloodstained clothes into her bag, tore open the sealed bag, and flung out a note, landing it on the lifeless men. A red star shone brightly on the paper, the words on it even more horrifying. The police were busy again; the terrifying specter they spoke of—targeting Self-Defense Force soldiers, especially those who had participated in the war to aid Taiwan—was approaching.
  prcs.3155.a: "Those who plunge our people into needless war shall be killed without mercy."
  prcs.3156.t: "Those Who Enter the Wolf's Den"
  prcs.3156.d: "Ando Sai walked up to the building, the searchlights of a police helicopter watching his footsteps. Ando Sai's figure parted the flow of people in the city center. The pedestrians ignored him, chatting happily with their companions, yet their bodies unconsciously avoided him. A drunkard bumped into Ando Sai, his hazy, intoxicated eyes scanning Ando Sai's face and coat. When their eyes met, the drunkard immediately sobered up, swallowing back the trash talk that was about to come out. He bowed apologetically and fled.\n“Identity confirmed, please enter.” "..." A synthesized female voice emanated from the access control system. Ando Sai entered the building, walking through the bustling corridor. Doors closed behind him, the crowd thinned, and the sunlight dwindled until only the cold glow of the overhead LED lights remained. Only his footsteps echoed through the corridor. He walked to the end and slipped into an inconspicuous iron door. The door closed softly, revealing the words "Ministry of Public Security Anti-Red Special Division" beneath the Tokyo Metropolitan Police Department's insignia. Uniformed staff moved between departments, all seemingly cut from the same mold. They were all like carved images, devoid of any expression, mechanically passing on various documents. Others, seemingly calm and collected while conversing with others, could send agonizing screams emanating from the interrogation room the moment they stepped inside. Their smiling eyes were captivating, yet the chilling aura emanating from them could freeze one to the bone. They walked not only the streets of Tokyo but might also frequent a high-end hotel in Shanghai. Though they wore smiles, they couldn't conceal their fangs. Ando Sai quickened his pace. Whispers brushed past his ears: "The students in Shimokitazawa Ward have taken over the conscription officer's stall..." "They smashed it, and even burned the conscription registration cards..."\n"Dockworkers in Yokohama, incited by the Red bandits, refused to unload military supplies..."\n"Our agents who infiltrated the General Association of Korean Confederation have been out of contact with us for several weeks..."\nSince the establishment of the so-called "Japan Anti-War Revolutionary Alliance," Ando Sai had become accustomed to such news, but these few words immediately pierced his nerves:\n"Did you know that the violent search by CIA agents a few days ago gave the Red bandits an opportunity to incite unrest? There are more and more communist posts on online forums demanding that the Americans get out."\n"Ever since that foolish white hat Rousseau and his gang of thugs entered Japan, those CIA agents who suffered great losses in China have come running over to interfere in so-called anti-communist affairs!"\n"Shh!" One of the voices suddenly lowered its volume by several decibels, but Ando Sai could still hear it: "Now the Americans are very dissatisfied with our actions. They think that we have taken on all the anti-communist affairs but have failed to suppress communist activities." The Prime Minister declined several times, but the Americans still wanted us to follow their orders because…”
  prcs.3156.a: "They thought they could replace us..."
  prcs.3157.t: "Interview"
  prcs.3157.d: "When I went out to throw away the trash, I only smelled an unpleasant odor, thinking it was just a normal smell, until I opened the trash can and found a male corpse inside. I can't imagine what happened." — The person involved, 33 years old\n\n"Oh, you mean anything unusual lately? I don't know. I only know that the streetlights haven't been on lately. They're usually on at night, but lately it's been pitch black, making it very inconvenient for me to go out at night. Damn it, I complained to someone and they haven't responded yet. I don't know what they're doing." — A nearby resident, male, 43 years old\n\n"Hmm? Something unusual? There's nothing wrong with this place, but one night when I was closing up late at night, I saw a big dark shadow flash past in that alley. I was a little scared, so I waited in the shop for a while before leaving... You ask if I'm scared now? I think after what happened last night, I might have to close earlier." — A fruit shop owner, 51 years old\n\n"That boy... ..." "He rented a room here recently. He said he graduated from university and came to Tokyo to try his luck and help support his family, so he rented a room here. But I noticed he got up around 7 a.m. every morning and came back close to midnight. I thought he was just working hard and wanted to earn more money, but I never expected him to have communist tendencies. It's such a shame, such a good young man died like that." —Landlady, 44 years old. "If I had to point out anything unusual, I remember one night when I was walking home after drinking, I kept hearing strange noises coming from under a manhole cover nearby. I went to check out, and all I heard was a thumping sound, then it went silent after a few seconds. Maybe it was just a routine sewer repair; I don't really remember anything else." —Company employee, 23 years old.
  prcs.3157.a: "Continue the investigation. I personally believe this matter is significantly related to the Beidao case and deserves continued attention." — Ishigami Notes.
  prcs.3158.t: "brick"
  prcs.3158.d: "In the pitch-black tunnel, water droplets on the walls dripped onto the sewer in a specific rhythm. In the distance, the sound of two pairs of leather shoes slowly approached, treading on bricks. Ishigami and Kaga looked around, afraid of missing any detail, but to their dismay, the sewer was empty except for dripping walls and rat holes, which was quite disappointing.\n\nIshigami stretched and yawned, "Damn it, there's nothing in this sewer. If the murderer really was here, then that person is really good at destroying evidence!"\n\nKaga also yawned. The two wandered around the area. Suddenly, a large rat scurried out from under Kaga's feet, startling him so much that he plopped down on the third seat. When they came to a sewer, it was covered with feces and various kinds of kitchen waste, and the stench made them cover their mouths and noses as they walked past, turning their faces away in fear of seeing the disgusting things.\n\n"If we don't find anything today, let's go back, Kaga." "Ishigami said, clearly feeling immense anguish from the investigation. "Alright, we'll talk about it tomorrow." Kaga nodded, then took a step forward. However, perhaps still unwilling to give up, he looked around. Suddenly, he saw something and excitedly shouted, "Ishigami, we've found crucial evidence!" Before Ishigami could react, Kaga walked to a brick, pointed at it, and said, "Look at this brick. It's covered in tiny dents and dark brown stains. This isn't mold or dirt; it's definitely blood. It's very likely the murderer shot the victim here, but forgot about this brick when cleaning the scene." Ishigami was shocked, staring blankly at the brick. Perhaps things weren't as simple as they seemed.
  prcs.3158.a: "The devil is in the details"
  prcs.3159.t: "Silence"
  prcs.3159.d: "This is indeed an incredible discovery. I'll take a picture first and record it as evidence," Ishigami said. The two of them began examining the brick. It was clear that this was a very exciting and important clue.\n\n"But do you think the murderer might return to the crime scene? After all, even the best plans can have flaws. What if something is discovered?" Ishigami suddenly had a bad feeling. "Hmm? Then let's hurry up?" "Upon hearing this, Kaga became frightened and the two hurried towards the exit, fearing something unexpected might happen. Fortunately, apart from the dripping of water, the sewers were deathly silent. The dim light illuminated the path ahead. The two detectives remained silent, their eyes fixed on the distance, striding forward, afraid the murderer would see them. "Click!" A crisp sound rang out, neither the sound of a rat chiseling nor the sound of water rushing, but the crisp sound of a hard object colliding. Hearing this, the two slowly turned their heads, frozen in place. "Bang!" In just an instant, the black sewage was stained crimson, and then, the sewers returned to deathly silence."
  prcs.3159.a: "And the owner behind the black gun barrel, wearing leather shoes, was slowly walking towards the two detectives."
  prcs.3160.t: "Wolf's Lair"
  prcs.3160.d: "In the heart of Tokyo, the city, sits a castle tightly embraced by a moat. The moat and towering walls form layers of defense, allowing the Emperor, though residing in the heart of the city, to remain seemingly isolated from the world—only in this way can the majesty of the Imperial Household be maintained. This is the function of the Imperial Palace.\nThe Emperor sits firmly in the center of the Imperial Palace, with attendants attending to his left and right; the Imperial Palace sits firmly in the center of Tokyo, and modern Japan's parliament and various government agencies also stand to its left and right. If we look at this array of institutions, among them, the triangular building of the Metropolitan Police Department headquarters is..." So conspicuous, it silently lies at the entrance to the Sakurada Gate of the Imperial Palace, scanning the passersby on the street. In a corner of the Metropolitan Police Department, there is a peculiar office building called the Japanese Public Security Department. This institution, with a name similar to the Chinese People's Police, seems somewhat cumbersome within the Metropolitan Police Department, but this is merely its disguise, meant to deceive people and make them forget its former name: the Special Higher Police Department, also known as the "Special Higher Police." Born in the Meiji era, inflated during the Taisho and Showa eras, although it lost some of its strength after the defeat in World War II, the Public Security Department still faithfully guards the Imperial Palace. The entrance. For so many years, from the depths of the mines in Hokkaido to the streets and alleys of Tokyo and Osaka, from the Korean Communist Party to the Northeast Anti-Japanese United Army, from Kotoku Shusui and Kobayashi Takiji to the Red Army, they have faithfully monitored the "subjects" of the Imperial Family. They are the Emperor's loyal dogs, the dark demons under the radiance of Great Japan. The Emperor is benevolent, Japan is humane; they will not openly kill disloyalists. How could the wise Emperor's hands be stained with blood? How could a stain appear on the humane foundation of Japan? Therefore, if any disloyal individuals appear, the Ministry of Public Security, or rather, the Special Higher Police, will take control of them. They evaporate everything, ensuring that all this filth does not interfere with these sacred images. This is the meaning of their existence. The disloyal will not perish, and so they will continue to exist. Countless "dangerous elements" have been brought down by them, countless "red bandits" have been tormented by their relentless harassment, and countless subjects have lived under their watchful eyes. Their members may have had doubts about these actions, but one thing is considered the sole truth by all of them: the Emperor needs them, Japan needs them, they are unique, because only they can do these things.
  prcs.3160.a: "So their position is unshakeable...?"
  prcs.3161.t: "Step 1..."
  prcs.3161.d: "Sunlight streamed into the conference room through the window, casting the shadows of a few flowers onto the table. Wang Zhaoguo was about to push open the conference room door, but stopped, straightened his clothes, adjusted his collar, and relaxed his tense temples and sore eyes before steadily walking in. As soon as he entered, many familiar and unfamiliar faces appeared before him, but what attracted his attention most were the young faces. Although their eyes were rimmed with tan lines, the vitality in their eyes dispelled any such blemishes. Seeing this, he strode to his seat and began his speech. "Comrades, good morning. Today, we have comrades from the Ministry of Human Resources and Social Security, the Ministry of Housing and Urban-Rural Development, and the Ministry of Labor and Social Security here for this meeting. Welfare issues are of great importance; they are closely related to the economy, politics, and the happiness of the people. However, a long march always needs a first breakthrough; once that's achieved, our work can proceed steadily." His voice was old yet powerful. As he spoke, he gestured for his secretary to distribute the report he had already annotated. "Welfare isn't just about giving money. From a Marxist economic perspective, reducing the cost of labor reproduction for the masses, allowing them to do more with less money, is true welfare. So, where is the first breakthrough? I'd like to hear your opinions, comrades. Let's have the comrade from the Ministry of Human Resources and Social Security speak first." He then gestured for the comrade to speak. "Thank you, Premier." A woman with a short ponytail slowly stood up, adjusting her glasses. "Labor reproduction, simply put, is about food, clothing, housing, and transportation. Actually, there are two more crucial aspects now: healthcare and education. For healthcare, we can establish a universal medical insurance system; but for education, currently, what we can do is provide higher-quality nutritious meals for children in schools nationwide. Regarding medical insurance, we need to proceed step by step; as for nutritious meals, food safety is a concern." The Premier nodded approvingly and then invited the comrade from the Ministry of Housing and Urban-Rural Development to speak. "High housing prices are mainly due to land revenue, debt-driven development, and excessive leverage." While major changes are not feasible now, gradual deleveraging is possible, which would reduce workers' living expenses. Of course, local finances must be sound, otherwise this would bring the region to a standstill. Finally, a representative from the Ministry of Labor and Social Security spoke. The young man had listened attentively to everyone's remarks from the beginning of the meeting, without whispering. "Stable labor relations and rights protection are also costs, but the working environment is even more important. If labor relations are unstable, workers will have to spend more time and effort seeking their rights; if workplaces are unsafe, then the work injury rate will remain high." He paused, lowering his voice slightly, but everyone could hear him: "We have tried to strengthen enforcement, but because some comrades said something about prioritizing economic development..." Wang Zhaoguo remained silent, nodding. When he was chairman of the All-China Federation of Trade Unions, those shocking reports of working conditions had kept him up at night, and now he finally had the opportunity to change everything. After listening to everyone's reports, Wang Zhaoguo felt a sense of clarity; the first breakthrough on this long journey would be...
  prcs.3161.a: "The health of the people is of paramount importance."
  prcs.3161.b: "We can expand the community's green kitchen to provide healthier meals for the elderly and children."
  prcs.3161.c: "Houses are for living in, not for oppressing people."
  prcs.3161.e: "Strengthen the protection of workers and alleviate their burdens."
  PRC_tfr_nl_china_diyibu_a_tt: "We will attempt to build a comprehensive and universally accessible medical insurance system to ensure that the prices of examinations and prescription drugs continue to decline...\nIf we have completed the 'cleansing of local power structures,' we will receive an additional 5 points of social development."
  PRC_tfr_nl_china_diyibu_b_tt: "We will try to subsidize affordable community kitchens to ensure meal prices for students and the elderly... Of course, this will hit the revenue of private restaurants."
  PRC_tfr_nl_china_diyibu_c_tt: "We will try to de-financialize the real estate market and build more affordable housing. In the long run, this will certainly benefit the economy and people's livelihoods, but for now, we have to swallow the bitter pill..."
  PRC_tfr_nl_china_diyibu_e_tt: "Working together with non-governmental labor aid organizations to care for workers, and wielding the existing labor law as a weapon against capitalists, is beneficial in cracking down on reactionary elements within the Party who have excessively close ties with commercial groups..."
  prcs.3162.t: "Cultivation, farming, textile manufacturing, and metallurgy"
  prcs.3162.d: "Aside from the sound of turning pages, there was no other noise in the meeting room. Hu Chunhua, watching the party cadres reviewing the materials, spoke in his usual calm tone: 'How to organize labor is a question we cannot easily answer. Exploration in this area often needs to be left to the masses, especially the frontline workers. And now we have already made significant progress.' 'Currently, three very typical reform plans have emerged locally. The first, simply put, is to expand the existing state-owned enterprise system, ensuring every employee has a secure job and can be employed for life. The powers of cadres and technical personnel don't need major changes; only the employee's supervisory power needs to be expanded to prevent corruption…' 'The other is to modernize the previously effective Ansteel Constitution, combining technical personnel and frontline workers in democratic decision-making, while cadres and managers, according to them, are implementing a constitutional monarchy in labor.'" "The last one, even more radical, is based on the separation of government and enterprise. They hope that workers and technicians can enjoy significant democratic decision-making and autonomy, and that managers will be elected by the workers." "Then, comrades, let's share our opinions." The words had barely left his lips when a heated discussion erupted like a wave, only to gradually recede just as quickly. After an awkward silence, a voice rang out…
  prcs.3162.a: "General Secretary, the full implementation of the state-owned enterprise model is already a significant step forward."
  prcs.3162.b: "The Ansteel Constitution still has reference and learning value today, and we will use it as a blueprint for reform."
  prcs.3162.c: "Wouldn't a more thorough approach of worker self-governance and enterprise socialization within the framework of a planned economy be a better one?"
# The event chain before the US GAW was not triggered
  prcs.3163.t: "Back to the Pacific"
  prcs.3163.d: "In a joint statement issued at the White House, the United States of America officially announced today that it will take over the leadership of the Pacific Defense Treaty at the request of Japan, Australia and other friendly countries. The move is seen by global observers as a turning point in an era, marking a tough return to the center of the world's power chess game after a brutal civil war and years of strategic contraction. The statement emphasized that U.S. leadership will infuse the alliance with unparalleled determination and strength to address the growing challenges in the Asia-Pacific region. Since China's victory in the Taiwan Strait war, the Japanese-led Taiyo has struggled to contain its expansion. Now, the return of the United States has undoubtedly given a shot in the arm to this alliance of democracies. The industrial and military machine of the United States has roared again. This event officially announced a complete change in the geopolitical landscape of the Western Pacific, and a huge military alliance with Washington as the core, including East Asia and Oceania, has taken shape, confronting the Chinese-led World Liberation International across the sea. A new and more intense superpower game has begun. "
  prcs.3163.a: "The United States of America showed their determination!"
  PRCS.3164.T: "Drafting a New Civil Rights Act"
  prcs.3164.d: "Today, the U.S. Congress passed the New Civil Rights Act, drafted by the new President of the United States, Russo, which is broad and is called "the most important step in defending the American dream." The Civil Rights Act aims to propose a new industrial relations framework, including allowing "American-style unions" to participate in corporate governance in the United States, and under government supervision, "real American unions" will negotiate and cooperate with "American entrepreneurs." while protecting workers' rights, the government will ensure that "the workers' struggle for their own rights and interests does not degenerate into a tool for communist mobs to destroy the American dream." On the other hand, Russo promised in the Civil Rights Act to protect the rights and interests of small farmers by providing subsidies for agricultural planting and raising the purchase price of grain to protect farmers "from globalism and bankruptcy." There are many more aspects involved, such as vigorously developing the "untamed frontier" of the Midwest, repairing local infrastructure, and relocating "hardworking Americans" to the Midwest. As soon as the bill was enacted, it immediately sparked cheers from all over the United States, and many people spontaneously marched to celebrate the birth of this law. Many are confident in the prospects of this bill, believing that it will be the key to the revival of the United States coming out of the shadows. \nIn his speech to Congress, Russo said, "We need a healthy nation, a harmonious society. God shaped American society, and each of us was born with God in our destined place. And we will spare no effort to protect the status of all people from being challenged, so that everyone can get their place and live in peace, without too much delusion and unnecessary greed. And only in this way can we defend the land that God has given us. And this law was born for this. ”"
  PRCS.3164.A: "New Act, New American Dream"
  prcs.3165.t: "ghost"
  prcs.3165.d: "In the glimmer of dawn deep in the Nevada desert, a mysterious, fully tailless vehicle quietly lifted off and completed its first test flight. The Pentagon later confirmed that this was the final result of Project Jupiter - the F-47 Ghost fighter. This first flight marks that the United States of America has officially entered the threshold of the sixth-generation air combat system, and also opens a thrilling new chapter in the global arms race. The emergence of the F-47 is widely regarded by the outside world as Washington's direct response to Beijing. Previously, China had semi-publicly displayed its two sixth-generation fighter prototypes of different designs, which once made the outside world think that the United States was passive in the competition for future air superiority. Today's first flight is not only a powerful response to such doubts, but also a clear signal to the world, especially its own allies, about its technological prowess and determination to fight. Military analysts note that the significance of the F-47 lies not in its own technical parameters, but in the fact that it breaks China's short-lived monopoly in this field. This forced the formula for calculating the global military strategy to have to be rewritten. Its presence will greatly boost the morale of the Taiyo camp, but it will almost certainly spur Beijing to accelerate the deployment and deployment of its own projects. "
  prcs.3165.a: "The clouds of war in East Asia are thicker and thicker."
  prcs.3166.t: "Final Holy War"
  prcs.3166.d: "In a historic address to a joint session of Congress, President Rousseau of the United States today issued an unambiguous declaration of war against the global communist forces led by China. He defined the impending conflict as an inevitable final holy war and called upon the entire free world to commit everything to it. With Rousseau's powerful speech, the U.S. Congress was required to declare the United States of America to a state of total war. This speech is seen as the official start of the Asia-Pacific war.\nHistory has brought us to the final crossroads," Rousseau's voice echoed in the Capitol and was broadcast globally on television, "On one side is a red empire built on slavery and lies, and on the other is human freedom under God's protection. We have no room for compromise with them, and this blue ocean will not allow tyranny to expand unchecked eastward… Today, in the name of the President of the United States, I declare that, under the leadership of ourselves and our allies, we will wage a final holy war to eradicate the red bandits that threaten the civilization and values ​​of the United States!" "After the speech, the entire world was instantly activated. From Tokyo to Canberra, from Seoul to New Delhi, governments declared a state of war. Factory production lines were switched to military production within hours, conscription laws were activated, and massive war machines began to roar into action with unprecedented efficiency. This was not a traditional war for territory or resources, but a global conflict aimed at the complete annihilation of the opposing ideology, a fight to the death."
  prcs.3166.a: "Only bloodshed can drive history forward!"
  prcs.3167.t: "The Holy War"
  prcs.3167.d: "As the silence of dawn was ripped apart, China launched a meticulously planned, all-out offensive across East Asia into the entire Western Pacific. US military bases in Japan, forward positions in South Korea, and even defenses along the Indian border were simultaneously subjected to saturation attacks. War descended upon everyone without warning. Hours later, in an emergency national televised address, President Russo of the United States, with a somber yet resolute tone, announced the arrival of the Red Horseman to the world. 'Today, the free world itself is under attack by a deliberate and deadly force.' His voice resonated across the globe, 'A red band of thugs seeking to enslave its neighbors and extinguish the spirit of human democracy has imposed its war upon us. They have chosen war. And so, they will receive war.' 'This is not merely a war for territory or interests; it is a sacred war—a war to defend our beliefs, our civilization, and our way of life. The road ahead will undoubtedly be fraught with peril, but I have no doubt about the resolve and courage of the American people.'" "We will fight to the very end, until the shadow of tyranny is completely dispelled and light returns to God's land." This speech formally declared the Pacific Defense Treaty to be in a state of full-scale war. From Washington to Tokyo, the defense agreement was immediately triggered, and massive military forces began to assemble in the Asia-Pacific region. A bloody and sacred war that would determine the future of humanity had been ignited on this lonely ocean; there was no room for compromise, only the blood of one side to be shed to the very end.
  prcs.3167.a: "The war horns have sounded, and no one can escape unscathed!"
  prcs.3168.t: "Voice of China"
  prcs.3168.d: "Recently, the South Korean media outlet *Chosun Ilbo* extensively pointed out in news interviews that China is subtly infiltrating North Korea with its ideology and culture. North Korea, a country with a unique cultural development trajectory, is now facing ideological and cultural influence from China. Related reports from South Korean television stations mentioned that China is cleverly transmitting its ideological elements to North Korea through various channels. From the circulation of Chinese-style artistic works in North Korea to the quiet unfolding of activities containing Chinese ideological and cultural connotations within the country, all signs indicate that China is systematically advancing this cultural infiltration strategy. The targets of this dissemination are ordinary people, youth, local officials, people with overseas experience, and people in border areas within North Korea. North Korean students studying in China, trade officials, workers, interns, and families of diplomats are key targets at all levels. The goal is to expose as many North Koreans as possible to Chinese culture. It is rumored that China has established a strategy to disseminate various cultural contents to North Korea. The plan is to continuously disseminate documentaries on the history of the founding of the People's Republic of China, films about the War of Resistance Against Japan, and modern TV dramas emphasizing 'socialist civilization' to North Korea." Film and television materials. South Korean analysts believe that China's move is far-reaching. This cultural infiltration aims to subtly influence the North Korean people from an ideological perspective, potentially triggering chain reactions in broader areas such as politics and economics. The powerful appeal of Chinese culture and the socialist values ​​it embodies are slowly seeping into every corner of North Korean society like a gentle stream. South Korean media also emphasize that this phenomenon warrants high vigilance. North Korea's cultural landscape is undergoing subtle changes, and the infiltration of Chinese culture is undoubtedly a key factor. South Korea will closely monitor this situation, concerned that the expansion of this cultural influence may have unpredictable impacts on the geopolitical and cultural landscape of Northeast Asia. South Korean experts suggest that a deeper investigation into the underlying motives behind this ideological strategy and its potential long-term consequences is necessary to better address this complex regional cultural dynamic. A source pointed out: "China is systematically establishing special channels for transporting cultural content among the North Korean people, most likely with the aim of influencing North Korea's ideological and cultural environment." "This report by a South Korean television station has brought China's ideological and cultural infiltration into North Korea into the spotlight, sparking widespread discussion and attention within South Korea regarding competition for regional cultural influence and geopolitical shifts."
  prcs.3168.a: "(Broadcast content) Power belongs to the oppressed workers!"

  prcs.3169.t: "Nighttime Stargazing"
  prcs.3169.d: "As night deepened, on an unnamed hill, an off-road vehicle sat quietly at the edge of a meadow. Beside it, two amateur astronomers were skillfully assembling their telescope equipment.\n"The transmission gears need to be aligned with the graduations," Old Zhang said to the newcomer, Xiao Li, while adjusting the equatorial mount. "The atmospheric transparency is good tonight; we should be able to see quite a few deep-sky objects."\nXiao Li tightened the tripod screws and looked up at the starry sky: "I heard from friends in the Hainan group that the launch frequency at the Wenchang Space Launch Site has been quite high lately. I checked the public information, and there have been several launches this month."\n"Yes," Old Zhang carefully installed the main tube onto the equatorial mount, "but what's strange is that the launch list is mostly for communication satellites, meteorological monitoring equipment, and the like—all fairly routine. Logically, these payloads shouldn't need to be launched so frequently."\nXiao Li nodded thoughtfully: "Indeed, and the launch times aren't very regular either." Several launches were late at night, a time window that commercial satellites typically don't choose. "Maybe it's to secure orbits," Old Zhang said, adjusting his telescope. "Ever since the Japanese got GPS and Starlink, they've been launching all sorts of things into the sky, regardless of their usefulness, just to grab orbital resources. We can't let them occupy space." "I heard we're working on space weapons," Xiao Li said in a low voice—though he knew no one was listening—to Old Zhang. "Do you think these payloads are…?" "I advise you not to believe everything you hear," Old Zhang shrugged. "According to those military academy videos on Douyin, we've already reached the Trisolarans." Xiao Li smiled, but the smile quickly froze on his face: "What's this?" He pointed to the sky, where a dim point of light flashed by. If it weren't for his stargazing intuition, he probably would have missed it. Old Zhang looked up in confusion at the spot Xiao Li was pointing to: "There's nothing there." "Xiao Li also began to doubt his eyes: 'I clearly saw a flash of light...' He turned the telescope around and aimed it at that area, but when he carefully observed through the eyepiece, all he could see was pitch black space, as if the flash of light had never existed. 'You mean a flash of light?' Old Zhang, as a seasoned stargazer, already had the answer in his mind, 'It was either a reflection from a satellite's solar panel or some small meteors, nothing special.' 'That's true.' Xiao Li quickly forgot about it and focused on his observations for the evening."

  prcs.3169.a: "However, Lao Zhang was wrong this time."

  prcs.3170.t: "Through the heavens and the earth"
  prcs.3170.d: "On the vast land of the motherland, several red spots of light appeared. These points of light were solitary at first, far away from each other, and flickered like lone stars. However, just as the night sky gradually unveiled itself, more red spots of light gradually appeared, some large and conspicuous, some small and dim, and these points of light were scattered on the jade plate like red pearls. Then, from those largest and brightest red dots of light, countless threads diverged, pulling up those small dots of light, embroidering a huge net stitch by stitch. \n"Do you like this fishing net we weave for the whole country? Director Chen patted Yu Qing on the shoulder and continued: "It is said that the bigger the wind and waves, the more expensive the fish, and now we have such a big fishing net, why worry about not being able to catch big fish?" Yu Qing nodded, pointed to the huge electronic display screen and said, "We have now built NEMS data nodes in the most important industrial zones in the country. Although it is not as accurate as regulating the power grid now, our producers already know where there is a surplus of materials and where there is a shortage of materials, and our NEMS will also assist us in the mobilization of materials...... Yu Qing took a deep breath, saluted NEMS, and then turned back to Director Chen and said: "In the past, I just wanted to carry out planning and construction with some data, but now it is like playing a simulation business game." "\n" is a good idea, but the consumption behind this is also huge. Look, Xiao Yu. As he spoke, Director Chen's fingers swiped across the display screen, from the eastern part of the motherland full of stars to the western part of the motherland where the lone star shone. In stark contrast to the east of the motherland, there are few pitiful link lines and lonely data nodes in the west of the motherland. "It's just getting started, and it can only help us here." The light from the electronic display screen scattered down, wrapping Director Chen's body. And behind him, a few more red dots appeared. \n\nEpilogue: "We must weave this net. ”"
  prcs.3170.a: "We must weave this web."

  prcs.3171.t: "40 years (one)"
  prcs.3171.d: "In a conference room in Zhongnanhai, Chairman Hu Chunhua and senior party and government cadres were already sitting in their seats waiting for the main personnel to participate. Now these people may not know that their next speech will lay the foundation for the future. \n\n"Okay, everyone is here, let's summarize the work in the previous stage first. With the Chairman's statement, the heads of the departments began to report on their achievements in turn. At present, all departments understand the urgency and importance of their work, and after the liberation of Taiwan, they quickly carry out military control, quickly crack down on local underworld forces, and restore the economy. At the same time, local construction has not stopped, and the Internet of Things, national economic restructuring, and grassroots governance have achieved great results. \n\nAfter listening to their speeches, Hu Chunhua pushed his glasses and showed a satisfied smile, and then put forward the focus of the meeting, "Comrades, we are now in a major change in the world that has not been seen in a century. At present, with the surging international situation, all aspects of domestic construction have reached a new height, and historical development has its own laws, but people are not completely passive in it. As long as we grasp the general trend of historical development, seize the opportunity of historical change, work hard, and forge ahead, society can move forward better. \n\nAfter hearing what the chairman said, many comrades were still ignorant and wanted to guess the meaning from the words, but when they saw the document that had just been issued, it still caused a burst of discussion - "Resolution on Several Historical Issues of the Party since the Reform and Opening-up". \n\n"Chairman, you are ......" Most of them were obviously blown through their heads by this explosive headline and couldn't think of any questions, but Hu Chunhua remained calm and continued to dominate the meeting. \n\n"Comrades, I think that in the future history of our party, reform and opening up will be a profound history. At present, our enthusiasm for work is positive, but we have not systematically reflected and learned critically on the cause of reform. There are two sides to any matter, and I hope that the delegates will speak more actively and finalize the tone of our meeting, so that we can carry out the next stage of work"\n\nAfter listening to the chairman's speech, many people began to talk with the neighboring cadre representatives and exchange their opinions. Time passed little by little, and after the discussion gradually decreased, everyone's opinion seemed to be clear, and they stood up and reported to the chairman: "
  PRC_new_left_Conservative: "§R Party§! will be biased towards §G Conservative§ at this moment!"
  PRC_new_left_Centrist: "§R Party§! Will be biased towards §Y Establishment§ at this moment!"
  PRC_new_left_Extreme: "§R Party§! will be biased towards §t reform§ at this moment!"
  PRC_new_left_Oppose: "§R Party§! will be biased towards §d Left§ at this moment!"
  prcs.3171.a: "Reform and opening up is a necessary measure for our country in independent exploration." "
  prcs.3171.a.tt: "§g Conservatives§! will be happy, maybe §Y Xi Jinping§! will too, but what about you?"
  prcs.3171.b: "Reform and opening up is an innovation in our country's socialist exploration process and should be carried forward bravely." "
  prcs.3171.b.tt: "§Y Don't talk to death§! Always be a wisdom"
  prcs.3171.c: "Reform and opening up have created our country's success, but it is no longer applicable to the current situation." "
  prcs.3171.c.tt: "§t a good way to get a salary at the bottom of the pot§!, but will you be satisfied?"
  prcs.3171.F: ""Reform and opening up have shaken the party's ruling foundation, and we should correct it." "
  prcs.3171.d.tt: "§g Conservatives§! won't like it, but maybe it's more in line with §R's current national conditions§!"
  PRC_40yrs_tt: "§R Conference Close§!"
  prcs.3172.t: "40 Years (Part Two)"
  prcs.3172.d: "Thanks to the efforts of several generations of comrades, China has finally achieved de facto unification across the Taiwan Strait. Currently, although the two sides have initially aligned their economic models and administrative systems, there is still a certain distance to go in terms of subsequent cultural exchanges and the gradual lifting of security measures." Listening to the General Secretary's words, everyone present pushed up their glasses, pondering solutions to these problems.\n\n"General Secretary, I have a question." A representative raised his hand, explaining his viewpoint, "In cross-strait exchanges, I've noticed some phenomena indicating that most people are still influenced by a misinterpretation of the '1992 Consensus.' In their minds, although Taiwan and the mainland have achieved physical unification, Taiwan should retain some of its previous electoral and administrative systems, gradually abolishing them once Taiwanese compatriots understand socialist ideals and new social customs." "The Taiwan issue ultimately led to the compromise of proposing the '1992 Consensus.' However, if the '1992 Consensus' is maintained, it might be exploited by some with ulterior motives, hindering future work with Taiwan. On the other hand, directly abolishing the '1992 Consensus' would negate all previous efforts." "Representative Wang, your point is very insightful. The Taiwan issue is indeed a major problem left over from the reform and opening up, especially since in the new century we have neither been able to nor effectively maintain contact with Taiwan in various aspects. I think..."
  prcs.3172.a: "Taiwanese troops need to temporarily extend their deployment time and rely on military control to eliminate any misinterpretations."
  prcs.3172.b: "Then let the Revolutionary Committee of the Chinese Kuomintang (RCCK) act as our representatives and talk to them about the construction of a new democracy in Taiwan."
  prcs.3172.c: "The 1992 Consensus was a previous temporary measure; Taiwan should be treated as a regular provincial unit."
  prcs.3172.F: "Strive to unify Taiwan's left-wing pro-unification faction, establish a grassroots management system, and temporarily maintain Taiwan's autonomous status."

  prcs.3173.t: "40 Years (Part 3)"
  prcs.3173.d: "As the meeting progressed, many people's foreheads were beaded with sweat. They knew they were walking a tightrope—on one side was a summary of the Party's past, and on the other, a plan for the Party's future. If they were not careful, as those who were both inheriting the past and welcoming the future, they would mess everything up, and it would take countless years to salvage the situation. Gradually, when making choices, they considered this and that, and in the end, maintaining the status quo became the majority. Many people were tormented. They wanted to lead the masses into a better life, but on the other hand, how should they evaluate the current foundation? Everyone seemed worried. Perhaps from the beginning, they were not prepared. "I see that you comrades are almost at your breaking point," Hu Chunhua put down the documents he was still reviewing. "Should we slow down and go for a walk?" "No, Chairman, let's finish judging these matters as soon as possible, ha..." Before he could finish speaking, a senior cadre yawned. They had been working here for a day and a night, and had only explained part of the issues. The subsequent discussions naturally needed to be accelerated slightly, but the overall process couldn't lack rigor. In some areas, should they leave a slight opening for the other factions?
  prcs.3173.a: "Only retain the necessity of reform and opening up, while critically and dialectically viewing the situation of capitalist restoration."
  prcs.3173.b: "The measures were correct, but the personnel selection was wrong. They nailed Deng Xiaoping to the brink of death while refraining from criticizing other leaders."
  prcs.3173.c: "As a transitional measure, reform and opening up is no longer able to cope with the crises of the new era, but this is not the fault of the Party and previous leadership teams."
  prcs.3173.F: "Currently, our country still needs the spirit of reform and opening up, and still needs to solve problems through reform and self-democratization."

  prcs.3174.t: "40 Years (Part 4)"
  prcs.3174.d: "The Resolution on Certain Historical Issues of the Party Since the Reform and Opening Up is an important document with profound significance and great influence in the history of the Communist Party of China. It was adopted by the Sixth Plenary Session of the 20th Central Committee of the Communist Party of China after a long period of discussion and revision, presided over by Hu Chunhua, under the leadership of the Political Bureau and Secretariat of the Central Committee. The Resolution summarizes and evaluates the major historical issues of the Party since the beginning of the new century, especially the 'reform and opening up,' the Taiwan issue, and the merits and demerits of past leaders and their theoretical guiding significance. It dialectically views the path of 'building a modern socialist country suited to China's national conditions,' which has been gradually established since the Third Plenary Session of the 11th Central Committee, and further points out the direction for the continued advancement of China's socialist cause and the Party's work. At the same time, the Resolution also points out that all the achievements my country has made since the early stages of reform and opening up are attributable to the entire working people. The term 'working people' has been formally recorded in the Party's history, forming, together with the Party's leadership, the foundation for the great victory of reform and opening up. The Resolution on Certain Historical Issues of the Party Since the Reform and Opening Up, unanimously adopted by this plenary session, will undoubtedly play the same historical role." The plenary session called upon the entire Party, the entire army, and the people of all nationalities throughout the country, under the great banner of Marxism-Leninism and Mao Zedong Thought, to unite closely around the Party Central Committee, continue to carry forward the spirit of the Foolish Old Man Who Moved Mountains, work together with one heart and one mind, overcome all difficulties, and strive to gradually build our country into a modern, highly democratic, and highly civilized socialist power!
  prcs.3174.a: "§d Our goal must be achieved§!!§R Our goal will definitely be achieved§!!"
  prcs.3175.t: "Bring to justice"
  prcs.3175.d: ""What is the American Civil War, it feels like it's not as ...... as spiders love each other" Li Buqun typed out these words on Zhihu, clicked send, and his face in front of the screen was full of disdain, as if the bloody war on the other side of the ocean was just a game. As a veteran god, Li Buqun has become accustomed to using the most mean language to belittle his motherland, while worshiping the United States as a holy place in his heart. In his worldview, the United States represents freedom, democracy and civilization, while China is a symbol of autocracy, ignorance and backwardness. However, when the American Civil War and the former "lighthouse" fell into division and turmoil, Li Buqun's spiritual pillar began to crumble. He desperately defended the United States online, claiming that it was just "the throes of democracy", but was greeted with overwhelming ridicule. \n\n"Why did your beautiful father fight? "\n" What about licking? People are killing each other. "\n" I like the United States so much, hurry up and run the beauty! \n\nWhat made it even more difficult for him to accept was that at the same time as the American Civil War intensified, China began a landing operation on Taiwan. Li Buqun ridiculed in various small groups: "A certain army is about to show its filling, and when it encounters a real democratic army, it will know what combat effectiveness is." "But unfortunately, the world is material. When the PLA's landing force surged onto Taiwan's beachhead like a tide, when the defense line of the Taiyue coalition was torn apart like paper paste, and when Taipei planted the five-star red flag in just 48 hours, Li Buqun was disillusioned again. All kinds of ridicule rolled in, making him tremble with anger but helpless. \n\nOf course, he won't sit still. The information database on the telegram gave him the means to "fight back". Most people will be frightened and run away when they see their identity information and malicious P-picture headshots appearing in private messages, and those who are stubborn and add "call him to death" can also get it done. Seeing that he could frighten the little pink who had once opposed him with his fingers, Li Buqun had to admit that he enjoyed this state of life and death in hand. Of course, he also tried to exchange these things for some money - there were many vulgar people who wanted to open the box but had no means, and this was when he appeared. \n\nWhen he clicked on an avatar that was arguing with him, there was a knock on the door. He was stunned for a moment, then remembered the KFC he ordered half an hour ago, so he shouted loudly outside the door: "Just put it outside." \n\nBut the knocking on the door hasn't stopped yet, adding a burst of anger to Li Buqun's anxious heart. He pulled open the door vigorously and roared outside: "Are you ......?" The second half of the sentence came to an abrupt end - what caught his eye was not the yellow uniform belonging to the rider, but the light blue of the police. "
  PRCS.3175.a: "You are suspected of infringing on citizens' personal information, please come with us."

  prcs.3176.t: "Rooting"
  prcs.3176.d: "The night is gloomy, and the lights in Zhongnanhai are sparse. The lake was calm and calm, and occasionally a gust of wind swept by, lifting up a few fallen leaves and falling into the water in a spiral. At that moment, even the air seemed to be condensed in the folds of history, becoming a little dry and a little silent. \n\nIn the living room, the lighting is soft, and the two cups of tea on the table are already cold. General Secretary Xi Jinping sat quietly, with a heavy briefcase in front of him, and the leather corners were slightly whitened by the years. His expression was a little less majestic than usual, and a little more contemplative and relieved. \n\nHu Chunhua pushed the door in, his steps extremely light. In the room, only the second hand of the clock could be heard beating the night. He stopped and bowed slightly: "General Secretary." \n\nXi Jinping raised his head, his eyes stopped on him, and he was silent for a long time before slowly saying, "Sit down, Comrade Chunhua." \n\nThe two sat opposite each other. At that moment, it was as if time had slowed down. \n\n"All these years...... Xi Jinping's voice was low, with a tired hoarseness, "The road is not easy to walk." Some people want to be faster, some want to be more steady. But no matter how you go, if you go in the wrong direction, it will help you wherever you go, this is the truth of the south and north, Comrade Chunhua. \n\nHu Chunhua listened quietly, without saying a word. The light shone on his face, and between light and dark, there was an inexplicable meaning. \n\n"I know you better than anyone else," Xi Jinping slowly raised his eyes, and his tone suddenly became deep, "This seat, sitting on it is not for yourself." Some people will praise you, some people will hate you, but you remember that what they scold and love is this land - it is our China, not us, our Communist Party. Our Communist Party is only chosen and recognized by the people to develop and prosper the land where they were born, and if we forget, the people have the right to abandon us. \n\nHe paused, as if he was about to swallow some words, but he couldn't hold back after all. The voice trembled slightly, but it was unprecedentedly relieved and soft: "Comrade Chunhua, I am old, and I may not see the storms you will face in the future." But I ask you - no matter where the wind blows in the future, you must protect this land. Remember, 1.4 billion people can bear the blood of tens of millions, but they cannot withstand a chill, so don't let the people of this great country down. \n\nHu Chunhua's throat moved slightly, and his fingers tightened on his knees. He raised his head, and a certain almost solemn firmness flashed in his eyes: "I understand." The general secretary can rest assured that we will not forget our original intention and strive for the realization of great ideals for a lifetime. "\n\nThere was silence in the room. Xi Jinping slowly stretched out his hand, his palm covered with thick calluses, as if there were countless traces of holding the steering wheel, chemicals, and pens. He put that hand on Hu Chunhua's shoulder and patted him gently. \n\n"Take care of China. \n\nThis sentence is almost inaudible, but it is heavier than a thousand pounds. \n\nA gust of wind came from outside the window, and the rhododendron branches swayed gently, and the shadows were reflected on the window, like the backs of two generations overlapping each other. The lake rippled and gradually subsided, and in the silent night, an old man solemnly entrusted the fate of a country to the next dawn. "
  prcs.3176.a: "A long rooster crowing in the distance, and the sky glowed with a faint orange glow"

  prcs.3177.t: ""rice balls"
  prcs.3177.d: "When the hour hand on the clock pointed downwards, the melodious song of "Nanniwan" floated out of the city's tallest radio tower, accompanied by a crowd of people off work. \nYang Zhuo was holding a few packs of instant noodles and was thinking about whether to replace the meat sausage with a starch sausage when he suddenly felt that he was patted on the shoulder. He turned his head and found that it was Lao Wang, a mechanic in their workshop. "Xiao Yang, why don't you go to the cafeteria? I've been watching you for several days, and you eat instant noodles every night. \nHe smiled bitterly: "I'm a newcomer, I'm slow at work, and I'm late when I go to the cafeteria." The family is also in a hurry to use money...... A few days ago, it was up to you to figure out what kind of rental method that part-time apartment was......" Saying that, Yang Zhuo saw Master Wang holding all fresh vegetables and meat in his hand, and a few bottles of Niulanshan were extremely eye-catching. \n"Hey, this is not right, Xiao Yang, why don't you come with me, let's get some wine and snacks by ourselves." My home is not far away. Master Wang raised his eyebrows, and before Yang Zhuo could react, he settled his account and collected the invoice. Yang Zhuo could only follow Master Wang. \n"Brothers, this is the invoice, the dishes are here, everyone should order a little." I am not short of pounds, and I am not embezzling everyone's money. As soon as Master Wang entered the house, he put the food and invoice on the dinner table and shouted at everyone. \n"Hi, Master Wang, you do things, let's rest assured......" A few workers said, and then noticed Yang Zhuo: "Oh, isn't this Xiao Yang, who is new to the workshop?" Rare guest! Yang Zhuo scratched the back of his head embarrassedly. \nThe food was served quickly, and a few home-cooked dishes made people eat a lot, Yang Zhuo's mouth was turning saliva, but he was embarrassed to move his chopsticks to the plate. Seeing this scene, everyone actively brought food to his bowl. Yang Zhuo desperately said thank you, but the other workers just waved their hands so that he didn't have to bow too much. Yang Zhuo volunteered to wash the dishes, but everyone couldn't resist him, so they could only agree to his request. \n"We are usually like this, several workers often get together to eat, pay money together, and manage accounts together. If you have money, you can make a strong contribution, and if you have something, you can help each other. While putting away the table, Master Wang said to Yang Zhuo, who was washing dishes, "Do you want to join our 'rice balls' for dinner?" "\n"But, you and I don't know each other very well, why do you suddenly want me to join? Yang Zhuo asked cautiously. Master Wang smiled and said to Yang Zhuo: "
  prcs.3177.a: "Under one roof, there is a big family everywhere."

  prcs.3178.t: "I was set up by the people... (Part 1)"
  prcs.3178.d: "Hasn't Zhou Bapi signed yet?" Chen Mingyuan asked, looking at the dejected Xiao Li.\n"No, that bastard is making excuses again, refusing to sign no matter what..." Xiao Li finally found an outlet and poured out his grievances from the past few days. Chen Mingyuan wasn't surprised—he himself had suffered a lot at this man's hands.\nZhou Bapi, whose surname is Zhou, is a "notorious" wage arrears boss in the area. His factory workers once staged a labor arbitration to demand their wages, but he arrogantly declared, "I'd rather fight you all to the death than pay this money!" "He kept his word, spending a lot of money to hire lawyers to drag out the case. Although he ultimately lost, many workers couldn't afford the time and energy and withdrew their lawsuits. This 'glorious' record earned him the 'reputation' of a ruthless exploiter, which spread by word of mouth among the local working people. Thinking of this, Chen Mingyuan sighed and said to the people in the office, 'No matter what, we still have to crack this tough nut. Otherwise, how can we push forward with the public-private partnership? Let's go, let's go and do some more work with him, try to get him to agree!' Everyone in the office stood up and went out with Chen Mingyuan. When they arrived at the gate of Zhou Bapi's textile factory, they could hear a commotion coming from inside. Pushing open the gate, they saw Zhou Bapi surrounded by a group of workers, all red-faced and gesturing wildly, ready to fight. 'Boss Zhou, where are our wages? It's been three months!' 'You promised to pay us a few weeks ago, why have you changed your mind now?'" "I'm not leaving until I get my money!" Faced with the menacing workers, whose recent court rulings had all found them innocent, Zhou Bapi was no longer the arrogant man he once was. He cowered behind his desk, his face ashen, his legs trembling. He was usually quite fierce, but facing this group of workers who were red-eyed and ready to fight, and remembering his recently fallen protector, he immediately became as timid as a wilted eggplant. "Gentlemen, gentlemen!" Zhou Bapi's voice trembled. "I'm just broke! You all know business is tough these days..." "Bullshit!" an older worker pointed at him and cursed. "You drove your new car to the factory yesterday, and now you're complaining about being poor?" "Exactly! Your villa was just renovated, how much did it cost?" Zhou Bapi was rendered speechless, sweat dripping from his forehead. Seeing this, Chen Mingyuan chuckled inwardly. This usually arrogant Zhou Bapi now resembled a chick being targeted by an eagle. However, the situation was escalating rapidly, and if it resulted in death, it would only dampen public sentiment. So he walked into his office and said…
  prcs.3178.a: "Comrades! Let's calm down and work together to solve this problem."

  prcs.3179.t: "I was set up by the people... (Part Two)"
  prcs.3179.d: "The workers calmed down slightly when they saw the government officials arrive, but they were still indignant. 'What's the use of calming down! What did he do when we sued him last time?' 'Yes! He just bullies us ordinary people because he's rich and powerful!' Chen Mingyuan nodded, then looked at Zhou Bapi: 'Boss Zhou, you've seen the situation. The workers' demands are simple: they want their owed wages. Is that too much to ask?' Zhou Bapi swallowed hard and stammered, 'This...this...I really have difficulties...' 'Difficulties?' one worker sneered, 'Then sell your Mercedes and pay us our wages!' This remark drew a chorus of agreement, and Zhou Bapi's face darkened even more. Chen Mingyuan pressed his advantage: 'Boss Zhou, you see, the country is now promoting a public-private partnership policy, which is precisely to resolve this kind of labor-capital conflict.'" "If you're willing to cooperate, not only will the workers' wages be resolved, but you yourself will also find a suitable position under the new system. But if you continue to drag this out..." Zhou Bapi was naturally unwilling, but faced with the angry workers, he could only stall: "I...I..." His voice trembled, "I need to think about it..." "Think about my ass!" a worker slammed his fist on the table, "You've been thinking about it for three months! You must give us a definite answer today!" Chen Ming, seeing the situation was favorable, continued to exert pressure: "Mr. Zhou, this is putting us in a difficult position. How about this, I'll call my colleagues from the public security bureau, procuratorate, court, and market supervision bureau over, so you can have a good talk with them about your difficulties?" Zhou Bapi completely panicked. Faced with the immense pressure from both sides, his legs began to tremble involuntarily, and a warm liquid flowed down his trouser leg... "I'll sign! I'll sign!" Zhou Bapi finally broke down, "I agree to the public-private partnership! I'll pay the wages too!" "After saying that, he picked up the pen with trembling hands and signed his name on the joint venture agreement. Chen Mingyuan nodded in satisfaction, thinking to himself: This Zhou Bapi, he made things so difficult for me and the work team before, but now he's like this with the working people. The workers clapped and cheered when they saw Zhou Bapi finally sign. Zhou Bapi, on the other hand, slumped in his chair, his face ashen, knowing that his "good days" were over. If someone got close to Zhou Bapi, they could hear him muttering: "Damn it, how can the labor law be so bad? Suppressing our company like this, we'll lose our motivation to produce..."
  prcs.3179.a: "People, you have won..."
  prcs.3180.t: "The matter of setting up a street stall"
  prcs.3180.d: "Aunt Wang, it's your turn to speak," the host said, handing the microphone to Aunt Wang as she walked onto the stage. Aunt Wang straightened her clothes, then slowly began, "Hello everyone, I'm here today on behalf of us street vendors selling vegetables. I know you all say our stalls take up space and are inconvenient for everyone, but we don't want this either. We're all laid-off or retired, here to supplement our families' income. We don't have that much money to rent a shop. Now, let's have a meeting, so please speak your minds." "Aunt Wang," a bald, bespectacled man in the audience said, "how about this? When you set up your stall, look around and see if there's a place that won't interfere with people's commutes. That way, you can make money without affecting their commute." "Sigh, if I could always find a spot like this, I wouldn't be here asking for advice." "Aunt Wang smiled wryly. It was clear this was a major problem. "Hey, I have an idea!" someone in the audience suddenly shouted. "Aunt Wang, didn't you say you didn't have money to rent a shop? We're representing small shop owners, I'll ask around to see if there are any spare shops available for rent. I'll even ask if the rent is cheaper. What do you think?" Aunt Wang was overjoyed and said with a smile, "Oh, thank you so much! Now I'll have a shop to sell things!" Another person raised their hand and said, "Aunt Wang, why don't you take me to see where you usually set up your stall? I want to check it out in person and see if there are any problems with the community planning in that area, so it will be convenient for you to do business without affecting other people's travel." "The meeting then erupted in discussion. Some nodded in agreement, others whispered among themselves about the feasibility of the proposed solutions, and still others raised their hands to question the suggestions put forward earlier. For a time, a seemingly simple issue like street vending had sparked a lively debate among over a hundred people. Aunt Wang, meanwhile, silently watched as the crowd offered her advice and suggestions. Perhaps she never imagined that such an unknown roadside vendor like herself could garner so much attention from people of different professions and backgrounds."
  prcs.3180.a: "“Hey, hey, Aunt Wang, I have another suggestion.........."

  prcs.3181.t: "Like walking on thin ice"
  prcs.3181.d: "“I don’t understand. I’m doing just fine as a teacher, why are they making me the school accountant?” Old Dai asked, his shoulders slumping.\n“There’s no other way. The school’s original accountant retired, and recruiting is a hassle. You’re a math teacher who deals with numbers, so you’re quite suitable for the job. We’ll make you the school accountant.” The principal patted Old Dai on the shoulder and lowered his voice, “This position is quite lucrative.”\nFacing the computer with the integrated budget management system open, Old Dai looked down at the bank statements spread out on the table, recalling his previous conversation with the leader, his mind filled with mixed emotions.\nAlthough he could teach one less class and wouldn’t have to be a homeroom teacher, he would have to come to the school to work during the holidays, answer calls from other faculty and staff to explain various salary changes, and sometimes handle problems for other departments. Just a few days ago, he helped the personnel department pay the 2010 employee insurance premiums. He was clearly much more tired.\n The most dangerous aspect was the various flaws in the processing procedures. Sometimes, when calling the school's relevant leader to get the signature on documents, he would actually say, "Just sign it for me," and even give Lao Dai his personal seal as a supplement. The accompanying cashier wasn't very meticulous either; when copying the bank's daily journal, if there was a mistake, he would simply use a black pen to correct it without drawing a red line or adding a signature. The most dangerous thing was the wrangling between leaders, which eventually led to Lao Dai having to sign off, to which he could only politely decline. The most complicated task was the school's asset inventory, which hadn't been done for several years and still had several discrepancies. Thinking of this, Lao Dai sighed and continued working. After carefully processing all the accounts and copying the processed electronic vouchers to his online cloud drive, ensuring there were no hidden problems with his work, he finally went home.
  prcs.3181.a: "Better safe than sorry"

  prcs.3182.t: "The long blade falls"
  prcs.3182.d: "Another pile of bank statements, another endless stream of accounting entries. Old Dai couldn't feel how long this monotonous accounting work had been going on. Each voucher, each document, was numbingly detailed, yet Old Dai still treated them with utmost care. The reason was simple: the school leaders' hands were clearly not behaving properly, as evidenced by the transaction records. Then one day, a carton of milk from the school appeared on his desk. He opened the packaging, and hidden in a compartment was a bank card and a note. He skillfully placed his phone away and began recording. See? Yesterday he was worried about not having enough decisive evidence, and today, a pillow has been delivered to his sleepy head. Sure enough, as Old Dai finished his day's work and was resting in his leather chair, the finance office door clicked open by several strangers. Old Dai breathed a sigh of relief. This day had finally arrived. Old Dai obediently raised his hands, letting them take his phone, and then was 'invited' for questioning. 'Why is the signature on this document yours?'" "This is what XX asked me to sign directly. I have a recording on my phone, recorded by XX." "Is the electronic voucher on the computer genuine?" "I have a backup on my cloud drive; I can verify its authenticity." "Was the person who recorded this video you? Where is the stolen goods now?" "It was me. The stolen goods are under my desk." After an unknown amount of time, when Lao Dai walked out of the disciplinary inspection and supervision office, he was still somewhat dazed. The long blade had already fallen, but he had escaped unscathed thanks to his caution and principles. Back home, looking at his worried wife and children, Lao Dai forgot all his thoughts. He wanted to say something but his words caught in his throat. Finally, he hugged his children tightly. "Although I haven't done well enough in many ways," he thought.
  prcs.3182.a: "But at least, I saved my child's future."

  prcs.3183.t: "Sunrise and Sunset"
  prcs.3183.d: "In a dimly lit residence in Beijing, an indescribable sense of oppression seemed to hang in the air. Wang Haiyang picked up his teacup, took a small sip, as if the warm tea could soothe his anxiety. His gaze, passing through the rim of the cup, subtly swept across Li Zhanshu opposite him. The Chairman of the Standing Committee of the National People's Congress remained seated, his gaze calm and composed, as if everything was under his control. However, Wang Haiyang knew that his old friend's composure concealed deep-seated hesitation and struggle. He put down his teacup, his fingertips lightly rubbing the table, making a faint sound. 'Comrade Li Zhanshu, regarding the current position of Premier, perhaps you shouldn't remain silent.' His tone was unhurried, yet carried an unfathomable sense of urgency. 'Please consider this carefully. We need this opportunity, and the country's development needs our support.'" Li Zhanshu clenched his fists tightly, the veins on the back of his hands bulging slightly. His gaze was lowered, as if he were struggling with some inner force. "To be honest, I really can't let Comrade Wang Haiyang become Premier." His voice was low and firm, as if he had made a decision, yet he seemed unable to hide his inner struggle. Wang Haiyang chuckled, waved his hand, raised an eyebrow slightly, and said in a more relaxed tone, "That's not important, Comrade Li Zhanshu. By rejecting the candidate for General Secretary, our position is naturally more solid. One day, the General Secretary will come to us personally, and then our opportunity will come." He paused, leaned slightly forward, and his eyes became deep. "Sunset is the law of nature, and no one can defy it. Just like sunrise, spring will eventually come again, it's just a matter of sooner or later." His tone seemed to foreshadow a predetermined fate, a fate that could not be ignored. "Of course, I'm not forcing you." "Wang Haiyang chuckled awkwardly. "But I still have to tell you, silence is ambiguity, and ambiguity is bias. If you can't openly challenge me, then you might as well not speak." Li Zhanshu nodded slightly, a complex mix of emotions surging within him. The subtle threat in those words, mingled with an unspeakable allure, made him waver, yet it was also like an unreachable fog. "I don't know much about tea, and this tea isn't very expensive. Have some." Wang Haiyang slowly raised his teacup.
  prcs.3183.a: "Tea doesn't taste the same when it gets cold."
  prcs.3183.b: "Nobody likes drinking re-brewed tea."

  prcs.3184.t: "Secret Talk in the Car"
  prcs.3184.d: "The asphalt road outside the car window reflected the faint light after the rain, and the air in the capital still carried a slight chill. On the road leading to West Chang'an Avenue, an official car slowly drove along the rough asphalt, the air inside filled with the mixed smell of leather and old documents. Hu Chunhua flipped through thick reports, page after page, more chaotic than his own thoughts.\n“Chunhua.” Wang Haiyang broke the silence, his tone unusually urgent, “I know this shouldn’t be said in the car, but time waits for no one. This opportunity is of extraordinary significance to me… to our entire system.”\nHu Chunhua didn’t look up, silently staring at the plan, the work to be reported to the group later. Li Keqiang, who could unite the moderates and reformists within the Youth League faction, was gone. Now, whether this loosely knit group, brought together by similar promotion paths and experiences, could be maintained depended on the attitudes of the two leaders.\n“You know.” “Wang Haiyang continued, trying to soften his tone, “Xi Jinping got to where he is today not through ability, but through systematic exclusion. Now it’s our turn to make the decision. As long as you nod, I can gather the people—the old ways, all familiar faces.” Hu Chunhua then closed the document, his gaze still calm: “You know very well that I’ve always had reservations about the capitalization of healthcare. I’ve seen your proposal to make healthcare a pillar industry—turning hospital beds into assets, calculating patient flow—this system is bound to cause problems sooner or later. Especially now, if this kind of healthcare capitalization reform is implemented, the number of deaths will be far more than just tens of thousands—and the number of deaths is not just a matter of statistics.” “We can discuss the policy in detail later.” Wang Haiyang leaned back in his chair, his gaze sweeping over Hu Chunhua’s eyes. “I’m not asking you to agree with my proposal. I’m saying, wouldn’t it be more meaningful if we could join hands and revive the political legacy left by Premier Wen and Comrade Li Keqiang?” Hu Chunhua's face was as cold as an icy river, but the undercurrent of disappointment within him surged because his close friend before him had been distorted beyond recognition by his lust for power. He said softly, "Comrade Wang Haiyang, if you're here to find a participant, I'm afraid you'll be disappointed. I will not join this operation to reclaim the Premier." A brief silence fell over the carriage; even the screeching of the chassis against the floor could be heard clearly. Wang Haiyang nodded slowly, offering a bitter smile: "Then please remain neutral, between the Youth League faction and 'them'." Hu Chunhua looked out the window: "I will... if there's still room." He knocked on the window: "Xiao Zhou, turn right ahead and stop." The car slowly slowed, and Hu Chunhua got out, carrying his old briefcase, and walked towards the spring breeze after the rain.
  prcs.3184.a: "Inside the car, Wang Haiyang lowered his head, remaining silent."
  prcs.3184.a.tt: "The time has come, but the faction has already split."

  prcs.3185.t: "Willows Swaying"
  prcs.3185.d: "The night sky over Hangzhou was ablaze with lights. At the InterContinental Hotel on the banks of the Qiantang River, a grand reception for innovative technology companies was being held. After Hu Chunhua finished his speech, he looked down at the audience, where a familiar yet unfamiliar face met his gaze. After the Vice Premier delivered his address, the banquet officially began. The clinking of glasses, the conversations and laughter among those in suits, created a seemingly relaxed and lively atmosphere. However, behind this facade of merriment, a different kind of calculation and scheming was brewing. The officials and the emerging entrepreneurs exchanged insincere smiles, their true intentions hidden." The deep-seated suspicion became Hu Chunhua's perfect cover. Hu Chunhua stepped down from the podium and stood alone by a chalk pillar in the corner. The main speaker today was supposed to be someone else, but the responsibility of hosting the speech had fallen to him. He didn't know if this was a demonstration or a gesture of goodwill. Just recently, he had confronted Wang Haiyang—his former friend now stood on diametrically opposed political positions. That moment of parting ways was like a broken dam, the torrent pushing him into a desolate wasteland. He understood that the Communist Youth League faction, which had been through several battles... The loose alliance was on the verge of collapse. To gain a foothold in this power game, he needed to find new allies. The left wing within the party, long suppressed and lacking connections at the top, readily agreed. When the provincial party secretary invited him to an inspection tour, he readily accepted. Not far away, the crowd parted slightly, and a burly, composed middle-aged man entered. The surrounding Zhejiang officials and foreign businessmen greeted him. That was Yuan Jiajun, the helmsman of Zhejiang and a leading figure of the party's left wing. Their eyes met briefly in the distance. Yuan Jiajun nodded almost imperceptibly, raised his glass in acknowledgment, and after a few polite greetings, raised his right glass in a gesture of warm invitation. The two walked side by side to a secluded spot near the floor-to-ceiling windows. The river outside, shimmering under the neon lights, surged and rippled, reflecting the unspoken turmoil in their hearts. "Comrade Chunhua," Yuan Jiajun began, his tone steady, "this reception tonight, ostensibly a gathering of technology companies, doesn't truly represent the driving force of development." Hu Chunhua's gaze, hidden behind his glasses, darkened: "Comrade Jiajun, we may differ in our political stances. But on one point, I think we agree—we cannot allow those reformers who champion liberalization to lead the country astray." Yuan Jiajun's eyes sharpened, then he slowly nodded: "Exactly. Zhejiang has forged a path where technological innovation leads economic development, but whether the fruits of development are distributed to the people or to enterprises—this must be clearly defined." Hu Chunhua paused for a moment, the prepared offer of becoming Vice Premier of the State Council hanging on his lips. Years of political intuition told him that this cadre from the aerospace industry was not someone who could be swayed by a mere position. So he spoke directly, "I think we can unite and form a new alliance to resist liberalization reforms." These words were like a pebble thrown into a river, creating ripples. Yuan Jiajun gazed at the young leader before him, once considered a "representative of the Youth League faction," and after a moment, a meaningful smile appeared on his face. "Have you capsized Wang Haiyang's ship?" "We were never on the same side." Yuan Jiajun pondered for a moment, a smile appearing on his handsome face. "Then we're in the same boat. Rest assured, the left wing of the Party will stand behind you and also have expectations for Comrade Chunhua." "A force lacking a voice from above, gradually fading from the center, and a lone high-ranking bureaucrat—what a perfect alliance. They clinked glasses, the crisp sound of the glass against the glass particularly clear in the night. A breeze from the river swept in, casting their shadows on the French windows, overlapping and lengthening, like a secret and heavy pact."
  prcs.3185.a: "Respect for the People"
  prcs.3185.a.tt: "The New Left has formed an alliance with Hu Chunhua, some moderates from the Communist Youth League will leave and join the New Left, and another force has entered the fray."

  prcs.3186.t: "Qinling Grasslands"
  prcs.3186.d: "The main conference room in the West Building of Zhongnanhai was brightly lit, yet the air was thick with an inappropriate heaviness. At the end of the long table, General Secretary Xi Jinping, the driver of the red dragon, stood calmly, his weathered and weary face still bearing a serene and solemn expression. He reached out, pretending to casually flip through the documents in front of him, his tone slow and firm.\n"In order to stabilize the current economic situation, I nominate Comrade Li Qiang to take over the leadership of the State Council Premier." He still spoke in that low voice. Because of his natural taciturnity and reticence, this leader differed from the elegant and humorous speech of his predecessors; he was more like the hardworking and arid land from which he was born. His brief words echoed relentlessly between the wooden walls, stubbornly striking the eardrums of the Standing Committee members. Inside the meeting room, the Standing Committee members, their eyes darting around, tried to catch the gaze of their political allies. Their movements were extremely subtle; even their breathing was deliberately slowed, as if a slight oxygen deprivation could bring a moment of calm to their wildly beating hearts. Someone lowered their head and opened... They began studying the document they had already reviewed several times beforehand. Someone raised a cup, using strong Anhui black tea to mask the barely perceptible twitch at the corner of their mouth. Wang Haiyang sat to the right of the chairman's table, his hands clasped casually on the table, a subtle smile playing on his lips. His face was amiable, and the faint smile only accentuated his composure, a rare quality in the turbulent meeting room. His expression spoke volumes about his complete understanding of the situation. The vote began, and the red numbers slowly climbed on the screen. President Xi had never felt time pass so slowly. His once-favored leadership team… Following a series of crises, disunity gradually began to emerge. While seemingly calm, undercurrents surged beneath. Time was running out, yet the hands of several key figures remained hovering over the voting machine, unwilling to make a move. One Standing Committee member, beads of sweat forming on his forehead, nervously wiped them away and subtly turned to look at Wang Haiyang. Wang Haiyang's fingers tapped lightly twice on the edge of the table, landing precisely in a moment of silence. After much hesitation, the Standing Committee members ultimately did not press the button that could determine China's future. They subtly adjusted their posture, slowly tucking their hands into the sleeves of their Zhongshan suits. The numbers on the screen... The vote was below the majority—the proposal failed. A brief silence filled the room, as if the air had been sucked out. President Xi Jinping slowly raised his head, his gaze sweeping across the room. His expression remained calm, but the subtle lines between his brows betrayed a barely perceptible weariness and disappointment. He closed the folder, gently tossing it onto the table. His fingertips lingered on the cover for a moment, waiting for a Standing Committee member to meet his sweeping gaze. Clearly, no one did. Whether out of fear of authority or fear of virtue, no one wanted to look directly at the helmsman at such a moment. President Xi sighed and spoke, his tone calm and collected: "In that case, let's consider other options." As he finished speaking, his gaze shifted slightly to the other side of the meeting room, past Wang Haiyang, and landed on several silent Standing Committee members, his expression complex. On the scales of politics, he needed more weight to maintain balance. Outside the window, the twilight light filtered through the edges of the heavy curtains, casting long silhouettes. The streetlights along Chang'an Avenue dimmed one by one, and the distant traffic flowed silently forward like a river—Beijing, the heart of China, was closing time. Families would reunite, lights would come on, and the day's toil and fatigue would be washed away by hot meals and baths, ushering in a rare moment of peace. President Xi rose, walked alone towards his living quarters in Zhongnanhai, the high-wattage lights behind him going out one by one, while he, weary, continued on his way.
  prcs.3186.a: "He has insomnia."

  prcs.3187.t: "Magnolia Tree Rustling"
  prcs.3187.d: "Night enveloped Zhongnanhai, the lake surface shimmering gently under the streetlights. A breeze rustled through the magnolia leaves, creating delicate ripples on the lake. The streetlights cast golden spots of light on the water, swaying gently with the ripples. In the living room, warm yellow light illuminated the walnut coffee table, the tea long since cooled, a few wisps of steam dissipating into the air. General Secretary Xi Jinping sat on one side of the sofa, looking even more tired than during the day, clutching a thin folder in his hand, his knuckles slightly white from the pressure. His gaze lingered on a certain point on the coffee table, as if weighing options, or pondering a choice that had remained unresolved. A soft knock came at the door, and the secretary reported in a low voice, 'Comrade Hu Chunhua has arrived.'" Hu Chunhua entered, his steps slightly hesitant. He wore a dark gray suit, his expression respectful, and sat upright with his hands neatly placed on his knees. Xi Jinping glanced at him for a few seconds, as if trying to see through his outward humility to the cunning beneath. He spoke slowly, his voice low but powerful: "Comrade Chunhua, I invited you here tonight because I have a responsibility to entrust to you." Hu Chunhua paused slightly, a hint of nervousness flashing in his eyes, and instinctively straightened his back: "General Secretary, please speak." Xi Jinping closed the document, his fingertips lightly tracing the cover, as if weighing a heavy weight: "You see, the balance of the Standing Committee has been broken. Some are testing the bottom line, some are shaking the direction. I need someone who can not only take over the State Council leadership but also safeguard the Party's foundation amidst the ups and downs. We can no longer allow those who undermine the Party's line to lead the Party by the nose." Hu Chunhua's breath hitched slightly. He lowered his head, his hands clenched tightly on his knees, his knuckles white. His breathing quickened. The air in the room seemed to solidify into a heavy stone, pressing down on his heart. Xi Jinping leaned forward slightly, his tone unusually earnest: "What I need is someone who can shoulder responsibility and uphold their principles. This is a heavy burden, not an honor. I won't hide it from you; this path is difficult, and we might not even be understood in the end. But someone must walk it." Hu Chunhua raised his head, the initial fear in his eyes replaced by a thoughtful expression. He remained silent for a long time, as if weighing a strange and heavy suit of armor, finally nodding slowly: "If the organization trusts me, I will do my utmost to live up to the trust you have placed in me." Xi Jinping stared at him, silent for a moment, then finally revealed a weary but sincere smile, extending his hand, his palm warm and strong. Hu Chunhua hesitated for a moment, then grasped both hands tightly. "This path won't be easy." The wind outside stirred the curtains, and moonlight filtered through the gaps, falling onto the carpet like a quiet path stretching into the unseen distance. Inside, only the gentle sloshing of the tea could be heard, as if bearing final witness to a weighty promise.
  prcs.3187.a: "You only get one chance, you know that."

  prcs.3188.t: "Azaleas in Full Bloom"
  prcs.3188.d: "The main conference room in the West Building of Zhongnanhai was brightly lit again, the air still heavy, but with an unseen tension added compared to last time. The Standing Committee members on either side of the long table had varying expressions, the sound of documents turning was as soft as whispers. General Secretary Xi Jinping sat in the center, his expression calm, but his eyes held a bottomless coldness. Several documents were neatly arranged before him; no one knew which one he would begin voting on.\nWang Haiyang already had a plan in mind—according to convention, the General Secretary would mention Li Qiang's appointment again, then waste time in a tug-of-war, while his prepared "alternative" would be brought to the table at the crucial moment. He had even thought about the order of his speeches, just waiting for that moment to arrive.\nHowever, Xi Jinping's first words were like a heavy hammer, striking him directly and hard in the heart.\n"To ensure the stability of the Party's line, I nominate—Comrade Hu Chunhua—as the successor to the State Council." "With just a few words, the air in the meeting room seemed to be sucked away, the silence so profound that even the sound of pens scratching on paper sounded jarring. Several Standing Committee members exchanged glances unconsciously, their rehearsed responses instantly rendered useless. Wang Haiyang's brow twitched almost imperceptibly, the smile in his eyes extinguished as if by a cold wind. He hadn't expected Hu Chunhua to be brought up at this moment—a person who had previously remained outside the factions, but was now clearly branded as a "new leftist," and a former close friend of his. Even worse, this name had bypassed all his carefully laid defenses; he felt betrayed. Hu Chunhua, composed, rose from his seat and greeted the General Secretary and all the Standing Committee members. His voice was not loud, but exceptionally clear: "Thank you for the General Secretary's trust, and thank you for the organization's arrangement. I will do my utmost to uphold the Party's direction and live up to everyone's expectations." His words were brief, yet carried an undeniable certainty, as if he had already shouldered this responsibility. Wang Haiyang looked at him, but a sense of unease crept in—clearly, he and the General Secretary had a heart-to-heart talk; Hu Chunhua had found a reliable political ally and was preparing to inherit his political legacy. The vote began, and the red numbers on the screen climbed rapidly, without the awkward hesitation of the previous vote. A majority passed, almost without suspense. Xi Jinping closed the document. His movements were clean and efficient, a smile playing on his lips that betrayed no emotion. He surveyed the room, his gaze lingering briefly on Wang Haiyang's direction before moving away, as if he didn't need to confirm anything. Wang Haiyang lowered his eyes, picked up his teacup, concealing the shadow that had crossed his eyes. The tea was at the perfect temperature, yet tinged with bitterness. Outside the window, the lights of Chang'an Avenue began to illuminate, as if drawing back a new curtain for a sudden upheaval. The curtain rose, revealing lights, splendor, and dancers. The azaleas in Zhongnanhai were in bloom.
  prcs.3188.a: "Azaleas in Full Bloom"
  prcs.3188.a.tt: "§R Hu Chunhua§! Appointed Premier and designated as the next successor"

  prcs.3189.t: "Visitors from Beneath the Iceberg"
  prcs.3189.d: "The old car in the county bumped along the gravel road, its wheels crunching over the stones, leaving a long trail of yellow dust behind it. In the distance, the snow-white icebergs were gradually left behind, standing like a giant ice wall between heaven and earth, separating development from desolation. Ahead lay a gray-brown valley, barren and devoid of any greenery, except for a small oasis suddenly rising from the valley floor, its vibrant green striking, as if the earth had suddenly softened its heart there. A dozen or so low mud-brick houses and yurts were scattered throughout the oasis, like gray pebbles carelessly strewn on the ground. Smoke curled from the rooftops, leaving faint traces in the dry air. As soon as the car entered the village, a flock of unruly goats blocked the way. The copper bell around the lead goat's neck jingled, its sound echoing through the empty valley." The shepherd brandished his whip, his bronze face etched with the marks of time. Several children ran towards the sound, their cotton-padded coats covered in dust, their faces flushed red from the high-altitude sun, snot crusted under their noses, yet their large, curious eyes darted around the car. Yu Haoxuan rolled down the window, took out a few fruit candies from his pocket, and was about to hand them out when a woman wearing a felt hat suddenly emerged from behind a mud wall, shouting a few words in an unintelligible dialect at the children. The children scattered like startled sparrows, hiding behind the woman. The woman eyed Yu Haoxuan warily, her deep-set eyes holding an unreadable suspicion. Yu Haoxuan awkwardly withdrew his hand, the candy wrappers rustling in his palm. The Uyghur cadre in the passenger seat sighed and turned to him: “Comrade, you saw it all. Conditions here are harsh, and the worst thing is altitude sickness.” "In previous years, eight out of ten students who came wouldn't make it through the first winter and would have to go back." He paused, gazing out the window at the endless barren mountains. "I'm not suggesting everyone should force themselves to endure hardship here, but... someone has to take the first step, paving the way for those who follow." The car started again, slowly moving along the narrow dirt road. The Uyghur cadre added, "If too many people give up halfway, it will dampen everyone's enthusiasm... To be honest, I'm already very grateful that you came at all." The car finally stopped in front of a row of low stone houses. A weathered blackboard stood in the open space in front of the houses, displaying the day's schedule in both Chinese and local script. A loudspeaker hung under the eaves, playing a melodious shepherd's flute tune, its sound drifting through the empty valley, carrying an indescribable desolation. Several local officials were already waiting at the door, wearing faded uniforms, old but clean, their faces bearing the dark tan characteristic of people from the high plateau. Yu Haoxuan took a deep breath, picked up his luggage, jumped out of the car, and turned to the Uyghur officials inside, saying, "
  prcs.3189.a: "When the county has a new policy, remember to let me know as soon as possible."

  prcs.3190.t: "Work Report"
  prcs.3190.d: "The work report was spread out on the mottled wooden table, the yellowed paper and curled edges recording the changes this land had undergone over the past year. Secretary Qi's fingers slowly traced the numbers on the report, but his peripheral vision never left Yu Haoxuan standing opposite him. 'Following the deployment of the Autonomous Prefecture Party Committee and the Prefecture Government, three companies from the interior have successively settled in our township.' His voice carried the distinctive pauses of a Northwestern dialect, like the wind on the Gobi Desert, dry yet powerful. 'These companies have paved gravel roads, erected power lines, and most importantly—' the secretary's finger tapped heavily on the words 'water conservancy project,' '...built a water storage network. In our arid and rain-scarce place, this is a lifeline.' Yu Haoxuan straightened his back, his gaze falling on the mottled earthen wall of the office. A faded map hung on the wall, marked with red markers of the newly built breeding base. 'Your township's livestock breeding is indeed quite good.'" The secretary's tone softened, and fine lines appeared at the corners of his eyes. "The new varieties cultivated by professors and students from inland universities have not only made a name for themselves throughout the autonomous region, but have also been sold to Central Asia and Iran." He waved his hand, gesturing for Yu Hao-xuan to sit down. "That's a good thing. With exports come imports; that's how the economy works." A gust of wind blew past the window, rattling it. The secretary got up and closed the window tightly, then turned and leaned against the table: "Scientific research and technology transfer to the countryside—you at the grassroots level have to be able to handle it. I think your township has done a good job. Conditions are so poor, the mountains are full of rocks, and the altitude is high. But you cadres, farmers, and technicians eat and live together—that's what sharing joys and sorrows is all about. I really admire and am very pleased. When the people have energy, everything becomes easier!" Suddenly, as if remembering something unpleasant, he waved his hand dismissively, like shooing away flies: "Some places with better conditions... sigh, they're always up to no good!" "The technicians went, but the cadres didn't provide anything, yet they kept giving orders and nitpicking, driving them away; in some places, the technicians acted like they owned the place, refusing to do this or go that, putting on airs!" He shook his head, a bitter smile tugging at the corner of his mouth. "The common people are all saying strange things, like wild boars from the frontier can't eat this coarse chaff!" The secretary looked up, carefully examining Yu Haoxuan. One winter had passed, and the young man from the south already bore the marks of the plateau—purplish-red skin, deep nasolabial folds, and hands roughened by wind and sand. The secretary knew all too well; he himself had gone through the same thing. Silence filled the office, broken only by the ticking of the wall clock. The secretary took out his cigarette case, lit a cigarette, and the bluish-gray smoke swirled in the sunlight. "Young Yu, you're from the south," the secretary slowly exhaled a puff of smoke, "Do you find our winters cold?" Yu Haoxuan raised his head, his gaze passing over the secretary's shoulder and landing on the endless, barren mountains outside the window. He thought of the herders who still went out to graze their livestock in the cold wind, and the warmth that clung to their chapped hands. "The people here all say," he began slowly, his voice low but as firm as a mountain stone, "that mountain people aren't afraid of the cold wind, they're only afraid of a cold heart." The secretary took a deep drag on his cigarette and nodded. "Young Yu, you must remember, we, the Communist Party, came from the mountains. The people sent us out of the mountains with red rice and pumpkin soup. Are we going to leave them in poverty for the rest of their lives? If so, then we don't deserve the name of the Communist Party."
  prcs.3190.a: "Party members and cadres must always stand at the forefront of the people's lives; their hearts must never grow cold."

  prcs.3191.t: "Tit for Tat (Part 1)"
  prcs.3191.d: "The meeting hall was eerily quiet; even the air conditioner dared not utter a sound of gasping for air. The closed-door meeting entered its fourth day, the agenda dragging on, but the real tension was just beginning to build. In the presidium, Hu Chunhua opened a printed sheet of paper, his gaze slowly sweeping across the room. He spoke, his tone restrained, but his words sharp and clear. "The 19th Central Committee Communiqué provided us with an important political framework, but history does not end with documents. We must admit that some formulations are no longer sufficient to guide practice under the current circumstances, and some contexts are detached from the realities of governance. We must face the fact that some formulations have become a burden rather than a driving force in our work. It's not that we can't talk about the 'new era,' but that we can't continue with empty talk; it's not that we can't emphasize the 'two establishments,' but that we can't mythologize them as absolute forbidden rights." "In the face of the dual changes in the international and domestic situations, the Party should demonstrate its great spirit of self-revolution and bravely make a fair evaluation of historical documents..." As he finished speaking, several representatives in the front row glanced sideways, and the hum of the air conditioner seemed to pause for a moment. Wang Haiyang raised his head, slowly straightening his back from his previously downcast eyes. His speech was slow, but his voice was as cold as frost. "Whom are you drawing conclusions for? The 19th CPC National Congress Communiqué is a collective achievement of the Party Central Committee. If we're going to nitpick over it today, will we be re-evaluating the 18th CPC National Congress tomorrow? Will we be re-evaluating reform and opening up? I'm sorry, Comrade Hu Chunhua, you say you're raising questions, but what I see is wavering, a lack of confidence in the Party." Hu Chunhua gazed at his old friend, took a deep breath, and looked him directly in the eye. "I respect collective achievements. But respect is not about closing off or avoiding problems. If a document begins to create constraints rather than guidance in practice, we have the responsibility and obligation to confront the Party's problems. Different developmental eras face different pressures, and we must adapt accordingly." The air seemed to linger for a second after that sentence. Wang Haiyang slowly put down his pen, his tone no longer argumentative, but rebuking: "You're not trying to vindicate, you're tearing down the door. Comrade Chunhua, you should be more discreet in your speech. We're not discussing academic matters, we're discussing the Party's line." A sudden increase in murmurs filled the room as several representatives whispered amongst themselves. Wang Huning tapped his fingers lightly on the table, trying to quell the commotion, but Hu Chunhua and Wang Haiyang didn't look away. The conflict was no longer concealed; the line had been drawn.
  prcs.3191.a: "Xi's fingers gently traced the rim of the teacup, silently sensing the temperature of the tea."
    
  prcs.3192.t: "Tit for Tat (Part Two)"
  prcs.3192.d: "Hu Chunhua did not shy away from Wang Haiyang's accusations. He raised his head, his voice no longer calm, but sharp. 'I'm not shooting history in the dark. I'm pointing out that some things in the communiqué should be inherited, some should be discarded, some are the hard truths of development, and some are just whitewashing of a peaceful and prosperous society!' He flipped through the pages, his speech quickening. 'The communiqué spoke confidently about 'common prosperity,' but avoided the realities of its implementation mechanisms, ultimately distorting into a wait-and-see attitude towards market order, condoning the expansion of bureaucratic capital, the dysfunction of state-owned enterprises, and the stagnation of private enterprises. It affirmed the direction led by the state, yet hesitated to sever its dependence on capital groups. It talked about 'high-quality development,' but shifted the focus of governance to fiscal and real estate logic, leading to mounting debt, strained local finances, and living beyond one's means...' Wang Haiyang stood up, interrupting him before he could finish speaking. 'What exactly are you trying to say? A return to a planned economy? A nationwide commune?' "The 'iron rice bowl'?" Wang Haiyang's tone turned stern. "You speak so grandly, but you're merely using 'institutional justice' as a pretext to repackage rigid redistribution, criticizing the market economy and reform and opening up!" He turned to all the delegates, his voice so clear it almost vibrated in our ears. "Without the industrial opening-up policy of the 19th National Congress, we might not even have the right to sit here today. What you're trying to dismantle isn't 'fallacy,' but reform itself! Comrade Hu, you're shaking our foundation, our nation's very core!" Hu Chunhua closed his eyes, took a deep breath, and responded softly: "If reform becomes a mechanism immune to vested interests, then it must be reformed again. We must use progressive reform to combat backward reform, fair reform to combat unfair reform..." A brief moment of chaos ensued. Several older delegates unconsciously stood up and sat down, their eyes meeting, trying to discern which side was the true "mainstream."
  prcs.3192.a: "Xi curled his fingers and used the back of his fingers to push open the teacup lid. He intended to take a sip, but then put it down."

  prcs.3193.t: "Turning Point"
  prcs.3193.d: "No one spoke; even the sound of the air conditioner seemed to have disappeared. The national emblem on the dais hung silently, as if oblivious to the ongoing dispute. Just as the delegates' gazes shifted back and forth between Hu Chunhua and Wang Haiyang, the General Secretary slowly put down his pen. Since the opening of the conference, he had hardly made any direct statements, but now he gently brought the microphone closer, his voice not loud, yet it instantly silenced the entire hall. He didn't look at Wang Haiyang, only at the documents in front of him, his tone as usual, even somewhat weary: 'The communiqué was the solution back then. Not today's answer.' He paused, took off his glasses, and slowly said: 'Hu Chunhua is right.' The meeting hall seemed to suddenly lose its air. Several Standing Committee members' eyes widened in shock, and some in the delegation opened their mouths slightly, but no sound came out. 'This communiqué, we approved it. It worked when it was approved, but now it should give way to new discourse.' 'The people are the country, and the country comes from the people.'" "The people and history have presented us with the questionnaire of our time, and we have an obligation to answer it well. Times are changing, and the answers should change too. We can no longer cling to outdated ideas, comrades." The General Secretary's voice remained steady, yet undeniably authoritative: "The new era is not a royal decree, not someone's guillotine to be used to behead good comrades at any time. What can be changed, what should be changed, should not be delayed. Comrade Chunhua's opinions, as he has compiled, should be sent to the drafting group." He closed the document, his words sharp and incisive. "Meeting adjourned." No one moved. Wang Haiyang slowly sat down, his face pale, and remained silent for a long time. He glanced at his old friend on the stage with complex emotions, leaving only a sigh. Hu Chunhua lowered his eyes and remained silent, trying to avoid his gaze. The red flag on the platform hung silently, the air still heavy. Hu Chunhua opened the gift Xi had given him, accepting the old man's heavy goodwill.
  prcs.3193.a: "Xi walked very slowly, so slowly that Hu could see his relieved smile."
  prcs.3193.b: "Xi walked a little too fast, so fast that he forgot about that cup of strong Longjing tea."
  prcs.3193.c: "The person is gone, the tea has gone cold."
  prcs.3194.t: "Pragmatic Reform"
  prcs.3194.d: "A temporary small meeting room was set up on the second floor of the east side of the Great Hall of the People. There were no guards outside, but inside sat those who would decide the future. A long wooden table, an old air conditioner, and gray fluorescent lights—everything was set up like a temporary government office, except for the thick stack of documents that weighed heavily on the room. Hu Chunhua sat in the main seat, his gaze sweeping over the several young policy officials in attendance. He didn't offer any extra opening remarks, directly summarizing the General Secretary's instructions from the previous day into a single sentence: 'During the Korean War, our medics would put hot stones into quilts to warm the soldiers, but now, we can no longer keep warm by clinging to stones that have lost their heat.' He pulled out a draft prepared by members of the New Left and distributed it to everyone. The meeting room fell silent, save for the occasional rustling of pages turning. 'First, we will not overturn the entire technical system of the 19th National Congress, but we must dismantle the language structures and institutional inertia that are no longer suitable for the present. Wherever policies cannot be implemented, they must be changed, and changed to be able to be implemented smoothly.'" For example, 'high-quality development'—to be truly effective, we must shift from compressing targets to evaluating results. It's not about shouting high goals, but about whether they can be achieved. Second, 'common prosperity' must be genuine. It's not about using horizontal transfer payments for show, but about designing a real secondary distribution mechanism from the levels of fiscal system, household registration system, and asset declaration. As he finished speaking, a Standing Committee member asked in a low voice, "Isn't this too reckless?" Hu Chunhua's tone remained unchanged: "Risk is not a reason for not reforming. We have disappointed the people too many times with empty promises." He pushed aside the last document: "Third, we must clarify one direction: our fundamental goal is for the people to live well, not for documents to look neat. We need to write logically, provide concrete indicators, and establish a people's government that is audible, visible, and actionable." He paused, looking at the crowd: "Refusing revolution has never been a tradition of our Party; our glorious and great Party must always be on the path of self-revolution."
  prcs.3194.a: "Retain the original framework, optimize language structure and target logic."
  prcs.3194.b: "Initiate reforms to the distribution system and establish a redistribution adjustment committee."
  prcs.3194.c: "Reshape the policy evaluation system with people's well-being as the core, and reform various policies."

  prcs.3195.t: "A sharp sword?"
  prcs.3195.d: "Hu Chunhua stared at the densely written characters on the case file, and the long-suppressed resentment in his chest finally released slowly. With the Discipline Inspection Commission transferring the last heavyweight on the list to the judiciary, the large-scale rectification movement of grassroots Party organizations declared a phased victory. The alliance between the left-wing reformists and the moderate conservatives temporarily stabilized the situation, but he knew very well—this was not a time for celebration.\n“General Secretary Hu.”\nWang Huning pushed open the door and entered, carrying a thick stack of documents. His tone was still calm, but beneath the calm surface lay a subtle new meaning: “Regarding the rectification movement, after discussion, the Politburo unanimously agreed that the Discipline Inspection Commission system should be further reformed to promote the improvement of cadres' work style and advance the foundation of socialism in the new era.”\nHu Chunhua sat upright behind the mahogany table, his thumb gently stroking the pen, his gaze subtly landing on Wang Huning's face: “Comrade Huning, do you have a specific plan?”\n“Yes.” Without hesitation, Wang Huning opened the document and explained clearly and logically: “The Discipline Inspection Commission must become a true sword within the Party. Local Discipline Inspection Commissions should be completely separated from local finances and government control, and their cadres should be directly assigned by the Central Commission for Discipline Inspection to ensure the independence of supervision. At the same time, the Central Commission for Discipline Inspection is only responsible to the Politburo and accepts the unified supervision of the Politburo. Within the Discipline Inspection Commission, we will establish a more stringent anti-corruption system to ensure that this sharp sword can accurately tear apart the protective umbrellas of various interest groups. Only in this way can power be properly supervised, and those who supervise be free from corruption.” His words were firm and carried an undeniable logic. Hu Chunhua nodded slightly, his fingers tapping lightly on the table. He did not immediately express his opinion, but only said calmly: “A sharp sword in hand can certainly cut through thorns, but if the wielder harbors selfish motives, this sword will also turn against them. Comrade Huning, you and I can still restrain it, but what about after we leave office?” "I worry it will become a tool for internal party struggles, and our descendants will use this double-edged sword to hurt themselves, turning anti-corruption and discipline inspection into synonyms for factional infighting within the party." Wang Huning smiled, but his expression was complex and unpredictable: "Water has no constant form; it adapts to circumstances. General Secretary, we now need a sharp sword hanging over the heads of all Party members; this is the only way to reshape the political ecosystem. Once the people's supervision system is fully established, the sword of discipline inspection can naturally be sheathed. At that time, the political ecosystem will naturally change again." Hu Chunhua gazed at him, his eyes thoughtful, seemingly weighing his options. After a moment, he slowly closed the draft, his tone calm: "I will seriously consider your opinion. But Comrade Huning, once such a system is implemented, the power of the Discipline Inspection Commission will be unprecedented. If we want it to proceed steadily and sustainably, we probably need a more comprehensive set of regulations. What do you think?" The air seemed to freeze for a moment after he finished speaking. Wang Huning's smile didn't disappear, but it softened slightly, and his eyes seemed to hold a meticulous logic. He nodded slightly: "I'm willing to listen to opinions from all sides at any time." With that, he bowed and withdrew, his figure gradually disappearing behind the heavy mahogany door. Only Hu Chunhua remained in the quiet room. He lowered his head, his hand stroking the draft document, as if smoothing out some undercurrent of turmoil. After a long while, he reached for the telephone on the desk, his voice low but clear:
  prcs.3195.a: "“Receive Comrade Yuan Jiajun.”"

  prcs.3196.t: "Public servant?"
  prcs.3196.d: "A few days later, Yuan Jiajun returned from the Ministry of Industry and Information Technology. The courtyard still held the dampness of the rain in the evening, with sycamore leaves dripping water droplets along the blue bricks. As soon as the door opened, Hu Chunhua greeted him, smiling and patting his shoulder: 'Comrade Jiajun, you still haven't forgotten your old profession, you're so busy you lose all focus.'\nYuan Jiajun put away his umbrella, his expression showing the excitement of his busy work: 'The scientific research front has just achieved fruitful results, and we're waiting for the General Secretary's instructions.'\nThe smile faded, and Hu Chunhua turned to lead him inside, pointing to a stack of materials on the desk: 'A few days ago, Comrade Hu Ning came to me, proposing an agenda for reforming the Discipline Inspection Commission. You should have read the draft. What do you think? I'd really like to hear your opinion.'\n'Comrade Hu Ning has always acted out of pragmatism.' Yuan Jiajun put down his briefcase and adjusted his glasses. 'He's a good comrade; his advantage is that he can get the best solution at hand.'" But the sum of local optima does not necessarily equal the overall optimum. He pulled a written proposal from his bag, his eyes behind his glasses sharpening, the ink still slightly glistening on the paper: "If our previous rectification campaign has shown initial results, we can consider a 'discipline inspection commission going to the grassroots' system—directing the sharp knife of supervision directly to the very core of the Party's spirit." Hu Chunhua rose and slowly paced the courtyard corridor, lightly tapping the railing with his fingertips: "Won't that create chaos?" "No." Yuan Jiajun followed behind, his tone steady, "The reformists' plan strengthens the constraints of Party oaths and organizational life, and at the same time—" He paused, a confident smile appearing on his face, "this is related to a 'new tool' on the scientific research front." "A new supervisory system?" Hu Chunhua turned his head, a cautious glint in his eyes. For him, power was like a budget; every penny spent was a penny less. If he could allocate a portion of the 'budget' to the "red and expert" (referring to political integrity and professional competence), allowing technology to serve the people, he could retain the title of 'reformer' even after leaving office. "Or perhaps..." "Yes," Yuan Jiajun nodded, "we are conducting forward-looking research on the flow of funds between personal and public office accounts. By cross-referencing income, expenditure, deposit items, and declared matters, detailed fund flows can be automatically alerted. The data goes directly to the central system, leaving a read-only mirror image, making it difficult to tamper with." Hu Chunhua frowned slightly: "I'm worried this will cause collective panic among cadres. Furthermore, if public opinion interprets 'technical supervision' as 'distrust of technology,' the backlash will be significant." "So we'll first roll it out at the grassroots level," Yuan Jiajun said calmly, "limiting the application scenarios to public office-related accounts, project subjects, and reporting scope; personal consumption is anonymized, only anomalies are detected, not privacy." The Discipline Inspection Commission acts as the "Party police" at the grassroots level, while supervisory power is appropriately delegated to the masses and mass organizations, creating a two-pronged approach. Grassroots windows publicly disclose necessary data, accept modern appeals in a "drumming and pleading" style, and coordinate with large-scale "listening, questioning, and diagnosis" anti-corruption propaganda—characterizing corruption as a deeply ingrained scourge that erodes Party spirit and public interests. While we dare not say it will be completely eradicated, we can at least make it disappear. At the end of the corridor, the wind carried the damp, astringent smell of earth after the rain. Hu Chunhua paused, lightly tapping his thumb on the lid of his teacup, his voice lowering: "Comrade Hu Ning's approach is to keep a sword hanging high above; your plan is to spread a net on the ground. Both have their advantages. However, I need a more comprehensive report." Yuan Jiajun nodded obediently, his sharp gaze instantly softening: "Understood, I will follow the General Secretary's arrangements." Hu Chunhua did not immediately respond. He closed the suggestion. After a moment, he slowly uttered four words, both a blank space and a bargaining chip:
  prcs.3196.a: "Let me think about it some more."
  prcs.3197.t: "The conference begins"
  prcs.3197.d: "At the last plenary session, Hu Chunhua felt a clear distinction between friend and foe. Although enemies were everywhere, his party colleagues responded swiftly. But at this plenary session, looking around, his old enemies were gone, and the vastly different opinions of his former colleagues on the reform of the Discipline Inspection Commission shook the very foundations of the political alliance. It could be said that he was like a dancer wearing hot irons, treading a tightrope; the slightest misstep would ruin the entire reform effort.\nHis thoughts raced again, trying to sort out the demands of the various factions and groups, and trying to maintain this alliance with its obvious cracks.\nThe moderate conservatives, represented by Wang Huning, demanded the expansion of the Discipline Inspection Commission's power and a complete overhaul..." Separating the Discipline Inspection Commission from the local administrative system and removing many restrictions would allow them to hone the "sharpness" of this powerful tool. This would inevitably lead to a significant expansion of their authority, potentially even creating an "unofficial empire" like the Soviet KGB. Meanwhile, the "red" technical officials, represented by Yuan Jiajun, and the left wing of the Party demanded that the Discipline Inspection Commission work at the grassroots level, cooperate with grassroots democratic reforms, and implement comprehensive audits of officials' personal accounts. This would inevitably favor research departments, leading to a surge in funding and the rise of "red experts." Yuan Jiajun, an ally, tapped the table, snapping out of his reverie. He opened the document and began to speak:
  prcs.3197.a: "We will strengthen the powers of the Central Commission for Discipline Inspection to cope with new situations."
  prcs.3197.b: "Our democratic reforms will truly implement the people's right to oversight and truly break free from the historical cycle of rise and fall..."
  prcs.3197.c: "Let's discuss this later."

  prcs.3198.t: "Convenience Construction"
  prcs.3198.d: "Hey, Lao Zhan, have you seen the recent news?" In the community's chess club, two elderly men were preparing to play a game. Lao Zhan's chess partner, Lao Du, brought up the recently released annual report from the government. As he set up the chess pieces, he said, "Our statistical method has changed to something like 'total industrial and agricultural output value,' which doesn't show any direct growth. I'm always afraid the famine of the 1960s will return." Lao Zhan stroked his beard. "Aren't you just worrying unnecessarily? These days, all that data is processed and calculated by AI; there won't be any more falsification. Besides, aren't our lives getting better and better? In two months, my son will even get his allocated car." The chess pieces were finally set up. Seeing Lao Du still worried, Lao Zhan brought up his recent observations. "Back to that annual economic report, didn't it say we had a surplus?" "What? The national treasury has surplus money to spend on us?" "Old Du sighed. 'Oh my, it really is.' Old Zhan said with a smile, 'The government is making the funds public and collecting opinions on mobile phones to see what kind of help we need. There are also hearings in various places about upcoming projects.' Old Du immediately became interested. 'What opinions and projects?' 'The first is the development of some kind of small-scale infrastructure.' Old Zhan said, 'In the past, we were always building roads, and those rigid officials would always build, tear down, and rebuild them again. In the future, these kinds of projects will need to be reviewed by experts. Now, more medical stations, vegetable markets, and other facilities will be built to meet our needs.' 'Then our club can expand?' Old Du asked with some delight. 'How could we? We only have a few people, and we're still competing for funding.' Old Zhan said, 'But we can propose to build a community hospital. Don't you have high blood pressure? You can get your medication nearby, instead of having to travel two hours to the city center.' 'Anything else?'" Old Du's interest was clearly piqued. "How about setting up a robot emergency service station?" Old Zhan paused. "A few days ago, Sister Wang next door went to Shenzhen to live with her children. It just so happened that they were piloting a robot emergency service there. When she had a sudden heart attack, thankfully the robot was there, and now she's able to get out of bed normally." "These are all things people need." Old Du nodded, a glimmer of hope in his eyes. "Which project do you plan to support?" Old Zhan asked, starting to make his decision.
  prcs.3198.a: "The new farmers' market and hospital will definitely be very convenient."
  prcs.3198.a.tt: "We will begin developing and building convenient small-scale facilities for the public."
  prcs.3198.b: "Now that I'm old, anything can happen to me, so it would be good to have some kind of insurance."
  prcs.3198.b.tt: "We will begin building nodes for the robotic emergency medical service."
  prcs.3198.c: "After thinking it over, I think it's better to switch to fruits and vegetables."
  prcs.3198.c.tt: "We will begin providing living subsidies to reduce residents' spending."

  prcs.3199.t: "Shackles Fall, New Life Begins (Part 1)"
  prcs.3199.d: "Defendant Wang Degui, under the guise of safeguarding rights, committed crimes by participating in organizing illegal strikes that disrupted production and business operations, spreading subversive rhetoric, and participating in anti-government organizations. The defendant's actions trampled on the bottom line of the law, endangering national security and social stability. The defendant refused to plead guilty, failed to compensate for losses, and showed no remorse. This court now sentences the defendant to ten years imprisonment, deprivation of political rights for three years, and confiscation of all personal property, to be executed immediately!" "I protest! I will appeal! This is blatant persecution! The conviction process has obvious problems! You bureaucrats who collude with unscrupulous enterprises!" "Wang Degui responded loudly to the verdict, and the bailiffs beside him quickly dragged him out of the courtroom. His feeble words had no impact on the trial's outcome. Awakening from his cell bed, Wang Degui wiped the cold sweat from his forehead. For the past seven years, he had often had similar dreams, returning to the courtroom that buried his life. Sometimes he regretted why he had ended up like this, but after a bitter smile, he felt he didn't regret his choices. Lying in bed, Wang Degui's thoughts drifted back seven years. Back then, he was just an ordinary factory worker. His factory operated on a twelve-hour shift system, requiring workers to stand continuously, not to speak freely, and the labor intensity was high. The factory employed strict management..." The factory emphasized discipline and obedience. Workers were required to attend meetings and receive instructions before and after work. They worked under the supervision of line foremen, with strict requirements for every action, such as which hand to move first and the timing of the other hand's movement. Workers lived in a high-pressure, monotonous, and confined environment, yet their basic wage was only 2200 yuan. These conditions led to the emergence of underground groups within the factory advocating for "workers' rights," and Wang Degui was one of them. Wang Degui's underground group held a small reading group every week, mainly teaching basic labor law knowledge, and also exchanging ideas. Wang Degui vaguely remembered the scene of his first activity... Some workers sat, some leaned; some were silently reading, while two debated the meaning of "surplus value" in *Capital*. In a corner, someone was teaching a young coworker to read; the dim light of the chandelier cast their expressions of excitement and contemplation, as if this small space were another world isolated from the factory. Wang Degui, led by his coworkers, joined in, somewhat bewildered, picking up a well-worn copy of *The Communist Manifesto*. The chandelier swayed in the wind outside, casting their shadows on the mottled wall, like a group of ghosts gradually ignited by knowledge. The strike erupted on a sweltering summer day when a young worker in the parts workshop jumped from a building because he needed to return to care for a bedridden patient. The grandmother in the bed, while the manager withheld her ID card and wages, citing the unexpired work contract. After several rejections, the young worker, unable to bear the pressure, committed suicide by jumping from a building. This incident ignited long-suppressed discontent among the workers. Organized by the underground workers' group led by Wang Degui, strikes broke out throughout the factory. Workers occupied the factory workshops and office buildings. Workers' representatives then began negotiations with the factory owner, who was under police protection. Just as the workers' demands were agreed to, a series of sirens sounded outside the factory. With the arrival of a large number of special police and riot police, everything came to an end. The workers were dispersed, and Wang Degui and other members of the strike organization were taken away in police cars.
  prcs.3199.a: "Stability trumps everything"
  prcs.3200.t: "Shackles Fall, New Life Begins (Part 2)"
  prcs.3200.d: "Wang Degui sat bewildered on the sofa in the prison administration office. He had just been cleaning his cell when two prison guards appeared at the door, and in the blink of an eye, he was brought here. A staff member who looked like a leader told him to sit on the sofa and not to be nervous. 'It can't be anything good, can it? I haven't done anything particularly noteworthy lately,' Wang Degui muttered to himself. He understood that, in a sense, he was a political prisoner, and even a sentence reduction was unlikely to come his way. Watching the staff member searching through documents, Wang Degui thought that since he was already in this situation, he simply stopped his wild thoughts. Wang Degui stood up, and the staff member who looked like a leader took out a document and began to read: 'Wang Degui, a native of Nanchang, Jiangxi Province, was sentenced to ten years in prison for participating in the March 25th strike. Now, according to the joint investigation team of the Henan Provincial Committee of the Communist Party of China, the original March 25th strike was caused by collusion between relevant enterprises and local government officials, disregard for labor laws, and serious infringement of workers' rights, leading to a strike and resistance by the workers.'" Based on the aforementioned facts and legal grounds, and after careful review and study by this working group, and upon reporting to the Supreme People's Court and the Supreme People's Procuratorate, it has been decided to exonerate Wang Degui, the original person responsible for the incident, revoke the original judgment regarding the crime and document number, restore Wang Degui's reputation, and eliminate all adverse effects arising from the original judgment. Furthermore, in accordance with relevant national regulations, reasonable compensation and indemnification will be provided for the losses he suffered. This decision shall take effect from the date of its issuance. Wang Degui stood frozen, his face filled with bewilderment. When the words "rehabilitation" pierced the air, the fine lines around his eyes trembled, his knees suddenly went weak, and a sob escaped his throat like the cry of a beast imprisoned for years, venting his grievances and bitterness. The staff beside him helped him to a sofa, and as two streams of tears flowed from his eyes, a hoarse sob echoed in the small office… As he walked out of the prison, dusk was painting the sky red. The wind rustled the leaves of the roadside trees. Wang Degui turned to look at the closing iron gate, his thoughts racing. There were still traces of rain on the bus stop bench. Wang Degui took out the mints the guard had given him; the wrappers gleamed in the setting sun. He touched the newly issued ID card in his pocket, the edge feeling both strange and real. With the arrangement of the relevant departments and Wang Degui's own wishes, he chose to return to work at the factory where he had started working. It had become a state-owned electronics parts factory. His seniority was calculated from the time he went to prison. Walking along the newly built green belt in the factory area, the setting sun on the plastic track reminded him of the exercise yard in prison. In those years, he always stared at the clouds beyond the barbed wire fence, fantasizing about one day being able to step on real earth again. Now, the real smell of grass filled his nostrils, but it felt like walking on cotton. A group of young workers passed by in the distance, their chattering laughter making him pause. Back in his dormitory, he looked at himself in the mirror. The wrinkles around his eyes were deeper than before, but the flame in his pupils still flickered. On his bedside table was a copy of "Modern CNC Technology" given to him by his coworkers, with greeting cards drawn by them tucked between the pages. The crookedly written eight characters on the card, "The working class leads everything," brought tears to his eyes. He suddenly understood that perhaps some things time cannot take away, and rehabilitation was not the end. He had to relearn how to work, relearn how to trust, and find his place again in the tides of the times.
  prcs.3200.a: "The working class leads everything"

  prcs.3201.t: "Valve removal and source clearing"
  prcs.3201.d: "Ma Xiaohai, a graduate student at a medical university in Guizhou Province, was pretending to read, his pen tapping unconsciously on the edge of the book. His advisor, Yan Ziying, was furious at the podium. A female student in their group hadn't followed his instructions to add her name as an author to an SCI paper, leading to Yan Ziying's outburst at the inter-group meeting. 'Academia values ​​inheritance and teamwork,' Yan Ziying said, his glasses flashing with a cold, venomous light. 'If you can't even show basic gratitude and humility, how will you establish yourself in the field?' He walked over to the girl, his finger seemingly pointing casually. 'Do some people still think they can shake the foundations of academic tradition with their meager efforts? Don't forget, without the guidance of seniors, some people can't even get into the lab!'" Ma Xiaohai glimpsed the girl's throat bobbing up and down, like a small animal choking. Her left hand, hanging by her side, clenched into a fist, then slowly relaxed, the crescent-shaped red marks left by her nails on her palm—marks she might repeatedly rub tonight during her sleepless night. The others pretended to read, but secretly watched this public humiliation out of the corner of their eyes. The cicadas outside the window suddenly became shrill, intertwining with Yan Ziying's continuous stream of sarcastic remarks into a suffocating noise. Just as Yan Ziying was about to continue her humiliation, there were three urgent knocks on the back door of the classroom. Two figures in dark gray suits appeared through the crack in the door. The man in the lead walked up to Yan Ziying and showed her a work badge marked "Education Supervision Committee." "Teacher Yan Ziying, we have received a report and request your cooperation in our investigation." The staff member's voice was steady and firm. Yan Ziying's shoulders twitched slightly, and stray hairs from her ponytail fluttered in the air conditioning. Her voice held a stiff tone: "Please wait a moment, my group's meeting isn't over yet." She tried to put the laser pointer back in her pocket, but missed the socket twice, the metallic clanging sound crisp and jarring. "I'm sorry, but you must now cease all your work." "The staff member stepped forward and said. Ma Xiaohai noticed that his mentor, Yan Ziying, was unconsciously rubbing her index finger along the seam of her trousers. That habitual gesture always appeared when he faced great pressure—like the day she smashed a beaker in front of everyone in the lab after failing to apply for professorship last year.\nAs Yan Ziying was taken away by the staff member, the sound of leather shoes scraping against the tiles echoed in the corridor. The classroom fell into an eerie silence, and the air conditioning suddenly became bone-chilling. The movement of someone flipping through a book in the front row broke the stagnant air, and a rustling sound was mixed with low whispers: "Finally, someone has dealt with her..." The low voice was filled with trembling excitement, as if to vent all the grievances suffered over the past two years. Someone slammed their hand on the desk, making the skeletal model on the desk rattle: "It should have been investigated a long time ago! She stole Senior Brother Wang's patent last year, didn't you know?" But someone immediately hissed to stop them: "Keep your voice down, they haven't gone far yet." Looking at everything before him, Ma Xiaohai rubbed his temples, feeling as if in a dream. He then put away his books and walked outside. His classmates were engrossed in their conversation, oblivious to what this usually quiet boy, due to his impoverished background, was up to. Following the information he had gathered, Ma Xiaohai arrived at an inconspicuous office building, knocked on the door, and asked, "Hello, is this the Complaints Office of the Education and Culture Supervision Committee?..."
  prcs.3201.a: "Perhaps there's hope for subsidies and scholarships as well."

  prcs.3202.t: "Catch them all in one fell swoop"
  prcs.3202.d: "Holy crap, this news is explosive!" Lin Yu suddenly sat up straight on the bed, his eyes wide with excitement. As a college student who was keen on current events, his voice was full of surprise and excitement, instantly breaking the previous tranquility of the dormitory. His roommate Zhang Hao, who was engrossed in playing games at the table, was startled by Lin Yu's sudden shout, causing him to make a mistake in his game. He frowned and turned around with some dissatisfaction, muttering, "Brother Yu, why are you so jumpy? I was sniping, what news is so exciting? Is it some celebrity scandal again?" Lin Yu held his phone in front of Zhang Hao, quickly reading aloud: "The donation incident that caused such a stir online has now been investigated! The Central Commission for Discipline Inspection has also made the investigation fully public, dispelling the previous doubts!" "Recently, under the impetus of the Central Commission for Discipline Inspection and the Central Leading Group for Rectification of Cadres, discipline inspection and supervision departments and judicial organs in many parts of the country have jointly launched an operation to investigate and punish the illegal acts of embezzling disaster relief donations that have recently caused a great stir online. After a detailed investigation, a network of corrupt officials in the former Sichuan Provincial Party Committee and government who embezzled disaster relief funds by abusing their positions have been investigated and punished according to law, and relevant personnel have been detained for investigation. This special operation demonstrates the country's high regard for the safety of disaster relief funds and safeguards the vital interests of disaster-stricken people. Disaster relief donations are a carrier of love and trust, and even more so, a 'lifeline' for disaster-stricken people. From severe punishment to institutional innovation, my country is using swift and decisive measures and long-term governance to ensure that every penny of donations reaches those in need accurately. The 'iron-fisted' actions of the discipline inspection and supervision organs not only uphold the dignity of the law but also solidify the foundation of social trust." After watching the video, Zhang Hao exclaimed, "Wow!" "They really investigated! I thought they were just pretending not to hear. It seems the transparency policy they talked about at the investigation meeting wasn't just talk; the government really heard us." Lin Yu and Zhang Hao chattered excitedly, as if they themselves were participants in this righteous action.
  prcs.3202.a: "We will no longer 'play deaf and dumb,' because people are our ears and mouths!"

  prcs.3203.t: "Farce"
  prcs.3203.d: "When political reforms are implemented, society seems to be injected with a powerful stimulant. A series of reforms are taken: raising the minimum wage, expanding medical insurance coverage, reforming enterprise management, promoting rural democratic reforms… However, in the undercurrents of the internet, a group of young people who call themselves 'revolutionary vanguards' are brewing another storm. Chen Dong is a third-year sociology student at a university. Since high school, he has been obsessed with Marxist theory, and radical left-wing forums on social media are his spiritual home. He has shoulder-length hair, always wears round-framed glasses, and wears a badge with socialist symbols on his shirt. After the political reforms, he quickly formed an open online community called the 'Red Tide Youth Alliance' with his online 'comrades,' gathering hundreds of young people as radical as he is. Most of these people have never experienced a real social movement, but they use the internet as a battlefield to practice their ideals. 'This reform is too mild, it's a complete compromise with capital!' 'The existing economic system should be overthrown immediately and completely, an automated planned economy should be established, and true communism should be achieved!'" Chen Dong typed these impassioned words on his keyboard, as if he were a great leader guiding a revolution. His online "comrades" echoed his sentiments, and a flood of extreme opinions poured onto the internet. "The government is betraying us!" Chen Dong shouted hoarsely during a live stream on social media. Behind him, the wall was covered with hand-drawn revolutionary slogans, and his computer screen constantly switched between various protest videos. He accused the government of retaining the "right to negotiate" in the labor rights bill, calling it a "compromise to the capitalists"; he criticized the grassroots democratic reform plan for falling far short of the goal of "proletarian dictatorship." His words ignited the passion of the group members like wildfire, and the comment section was instantly filled with "Down with revisionism!" and "The revolution has not yet succeeded!" Slogans like "..." flooded the internet. They spread radical demands, such as immediately starting a second Cultural Revolution, providing free housing for all, and unconditionally providing high welfare subsidies. They believed that as long as the slogans were shouted loud enough, their ideals could instantly become reality. Immersed in their self-constructed fantasy world, they were blind to the complexities of reality. They organized so-called "revolutionary activities" online, creating propaganda posters with exaggerated slogans. They even tried to pressure the government by launching online petitions, as if this would make the government act according to their wishes. However, to most people, their behavior seemed like an absurd online farce. Some rational netizens tried to debate with them, pointing out the irrationality of their claims. "Have you considered the country's financial situation? Implementing such policies will cause serious economic problems. We will inevitably build an automated planned economy, but we have to take things one step at a time." "But Chen Dong and others regarded these rational voices as 'class enemies,' hurling insults and even personal attacks, completely losing their rationality and objectivity. The wheels of reform continue to turn. A doctor involved in designing medical insurance reform lamented on his social media account: 'Those young people think policies are fairy tales that can be realized instantly by pressing a button, weaving radical fantasies in the virtual world, like a group of children trapped in a data maze, filling their sense of powerlessness in the face of reality with empty shouts. Their 'revolution' is nothing more than a farce in the torrent of the times.'"
  prcs.3203.a: "Only by slowing down can we walk steadily. Focusing on the current situation is essential to making decisions that best benefit the people."

  prcs.3204.t: "Even flies need to be swatted"
  prcs.3204.d: "Zhang Bing, a city management leader in a street office in Guiyang City, is a veritable 'optimist representative of the fly world.' When he learned of the anti-corruption rectification campaign, he thought to himself, 'How could the Discipline Inspection Commission possibly care about a 'small fry' like me? They're busy patting down the big shots, I'm just a grain of rice in their bowl!' So, he continued his 'fly-like corruption': when small vendors begged him not to close their stalls, he smiled and accepted two boxes of tea; when shops wanted to occupy more sidewalk space, he pretended to decline, then immediately pocketed the bribe. He called it 'serving the people, so I have to collect a little 'service fee.' Like a mouse sneaking around in the dark, he greedily devoured benefits that didn't belong to him. Half a month passed in this 'fearful yet delightful' state." The sun was shining brightly that day. Zhang Bing lay on the office sofa, pondering whether to stop by a shop and get some tea. Then there was a knock on the office door. Zhang Bing turned his head, assuming it was another small shop owner asking him for a favor, but he only saw a few staff members in white shirts… As Zhang Bing was taken away, the setting sun cast his long shadow, making him look like a crooked tree that had been uprooted. He hung his head, muttering, “Shouldn’t we have a talk first…” A disciplinary committee staff member behind him added sarcastically, “A talk? Even a small fly is still meat.” Downstairs, several city management team leaders who witnessed Zhang Bing being taken away by the disciplinary committee felt uneasy. They had long been accustomed to numbing themselves with the saying “small flies don’t matter.” They accepted the local specialties secretly handed to them by vendors, tacitly approved of shops illegally occupying the road, and treated every “hardship fee” as a matter of course, a “workplace benefit.” But the moment Zhang Bing was taken away, they suddenly realized: all the illicit income they had once been so proud of had now become the reason for the "fly swatter" to fall. An eerie silence fell over the neighborhood office. Deputy Director Li's teacup still spun on the corner of the table, Captain Wang's leather shoes left anxious marks on the floor, and Team Leader Zhao's locker locker made a soft scraping sound... They each chewed on the same fear in different ways—the trial of the "flies" had begun.
  prcs.3204.a: "Tigers must be fought, and flies must be swatted too!"
  prcs.3208.t: "High-altitude supplies"
  prcs.3208.d: "Above the Karakoram Mountains at an altitude of 4,600 meters, the wind and snow remain fierce, as if this land has never lost its cold countenance. The snow-covered mountains blend into the sky, with only the patrolmen's suede boots leaving deep marks on this vast snowfield. The nine soldiers of the third squad silently fulfill their duties along the border, their footsteps leaving a series of neat imprints on the soft snow. Squad Leader Wang Jun walks at the front of the column, his gaze resolute, occasionally glancing down to communicate with the rear via walkie-talkie. 'Third squad has reached boundary marker number 12, all is normal.' After reporting this, he looks up at his watch. 'Comrades, take a break, then prepare for lunch.'" The soldiers skillfully found shelter in the snow, put down their heavy backpacks, and quickly cleared the snow with tools, preparing for the upcoming "airdrop." Soon, a familiar sound filled the snowstorm—it was a high-altitude transport drone. Beneath its "belly" lay the food that would soon be served to the soldiers. Squad leader Li Qiang glanced up and said casually, "It's here." The other soldiers didn't look up, but the constant swallowing betrayed their eagerness and anticipation. The drone landed precisely on the designated open ground. With a whirring sound as the blades stopped spinning, the hatch automatically opened, revealing insulated crates filled with supplies. The soldiers stepped forward one by one, collecting their meals according to their assigned numbers. Braised pork, Kung Pao chicken, and beef stew with potatoes—these hearty dishes, previously only available at the camp canteen, were now steaming hot in their hands. "Ah, this food smells so good!" "Someone joked, 'This beef stew is alright, better than the sweet and sour pork we had last time. The last one wasn't coated with batter, and the sweet and sour flavor wasn't right.'" "Now you're starting to complain? You weren't this picky when we were only eating biscuits," Squad Leader Wang Jun laughed. "Our lives are getting better, aren't they?" The soldiers laughed, the atmosphere relaxed and cheerful. After finishing their meal, they cleaned up the dishes and put them back in the drone's cabin. The squad leader pressed the start button, watching the drone slowly rise and disappear among the snow-capped mountains, its distant roar echoing in the silent plateau. "Pack up the equipment, let's move on." "Squad Leader Wang Jun gave the order. The nine soldiers regrouped and continued marching forward through the snow. The snow remained soft, the distant mountains remained silent, and the border line stretched far and wide behind them, serene and tranquil. On this plateau known as the 'forbidden zone of life,' modern technology is quietly changing the lives of those guarding the border. The soldiers remain as strong as steel, the land remains vast and beautiful, but those who guard this land receive a reward more worthy of their sacrifice. Whenever the drone's buzzing sounds, the border guards know what's going on..."
  prcs.3208.a: "“The motherland will not forget... me... and them.”

  prcs.3209.t: "Old Methods, New Ideas (1)"
  prcs.3209.d: "Xiao Li is an ordinary cadre in the village. These past few days, because the central government announced the resumption of the planned economy, the villagers are very confused. The news of the central government's resumption of the planned economy is like a boulder crashing into the peaceful village. The discussions under the old locust tree are even louder than before, filled with anxiety and even a hint of panic. However, Xiao Li himself is helpless, because this planned economy is said to be very different from the old one, involving not only technical issues, but also many so-called 'negotiation models,' 'decision-making models,' and other political science concepts. Just to understand these technical terms, Xiao Li had to work late into the night for three consecutive days.\n\n'Xiao Li, are you kidding me? After so long with a market economy, how come we're going back to a planned economy?'" "Upon hearing this news, Grandpa Wang immediately jumped up, his face full of suspicion. 'Hey, Uncle, times have changed! The country's recent 'NEMS' plan is to establish data nodes in each village, so everyone can fill in what they need on their phones. After a few days, the town will send supplies to distribute to everyone. And, more importantly—' Xiao Liu paused, 'From now on, our plans will be made through consultation among everyone. Who needs fertilizer? How should the rice price be set? We'll discuss and decide together. We want to completely take control of the planned economy.' The villagers were astonished. This was something they had never seen before. Although big data technology had developed rapidly in recent years, this new form of 'high technology + consultative democracy' had never been tried on a large scale, let alone in a small village like theirs. 'Then how will we manage it?'" "Grandpa Wang continued to ask, but Xiao Li didn't answer. Instead, he found a table, picked up a pen and a piece of white paper, and drew a diagram on it, trying to explain the model the village would follow to achieve democratic management in the future. When the villagers saw this, they enthusiastically gathered around and asked Xiao Li all sorts of questions that interested them or that puzzled them. The area under the large banyan tree was bustling with people, and even passersby at the village entrance stopped to see what was going on."
  prcs.3209.a: "Xiao Li, could you explain what this subject, Ke, was talking about, again?"

  prcs.3210.t: "Old Methods, New Ideas (2)"
  prcs.3210.d: "After Xiao Li finished drawing up the blueprint and explaining to the villagers how to implement the village's democratic practices, he suddenly felt parched. So, as soon as he finished his task, Xiao Li rushed back to the office, grabbed a paper cup, and started drinking from the water dispenser.\n\nXiao Li gulped down five or six cups in a row before stopping, slumping into his chair, looking at the sky, and letting out a long sigh. 'Ah, this work is finally finished. I need to reward myself with a good night's sleep.'" "His eyelids drooped and he simply slumped into his chair and fell asleep. He didn't know how long he slept, but when he opened his eyes, he saw a thin figure typing something at a computer. Looking closer, he realized it was Yang, the tech geek from his workplace. Yang's ten fingers flew across the keyboard like a hurricane, the code on the screen flowing like a torrent, his eyes never leaving the screen, afraid of making a single mistake. Li leaned closer to look and saw a document next to Yang with the words "<Regulations on Combining Internet Open Source Projects with New Democratic Practices>". "Open source projects? Yang, what's that?" Li asked curiously. "Oh, you mean this? Recently, there's been a democratic practice, so we programmers discussed whether we could use the open source nature of the internet to contribute to our socialist cause. After the leaders studied our proposal, they said to see what results we could achieve before further discussion. If it's good, we'll report it to the central government. So today I'm here coding." "Xiao Yang looked up and replied. Xiao Li casually flipped through the document; it was full of icons, English terms, and even more computer language he couldn't understand. His brain, which had finally had a break, was now battling with jargon again. However, the document wasn't entirely a jumble of words; much of it was related material that Xiao Li had read to help his fellow villager understand. Xiao Li closed the document and sighed, "This document has really put me through a lot. I finally escaped the pit of battling technical terms, and now I'm jumping into this big pit." Xiao Yang laughed heartily at this and replied, "Then I'll have to trouble you to understand it. But I guarantee you, my suggestion will definitely be taken seriously, after all, I'm going to paraphrase that famous saying—"
  prcs.3210.a: "The Internet is the smallest unit of communism."

  prcs.3211.t: "Old Methods, New Ideas (3)"
  prcs.3211.d: "A few days later, a new trend swept through the village. The uncles and aunties frequently visited each other's homes using their mobile phones, exchanging information and discussing issues. For a time, their smiles and questions were often reflected on the screens.\n\n"Old Li, you've finally arrived! Come and see this." Old Wu greeted Old Li, who happened to be passing by Old Wu's house. He asked suspiciously, "What's wrong? Did your chickens get stolen?" Old Wu scolded him playfully, then said, "Hey, what are you saying? Come and see this."\n\nOld Li entered the house with a puzzled look. He saw a brand-new computer installed in Old Wu's room, looking very new, probably installed just a few days ago. "Wow, Old Wu, this new computer is pretty cool!" "Of course! It was installed by Little Yang, the guy in our village who knows about computers." "Old Wu said smugly. Old Li praised him, but then asked, "Are you sure you can use a computer with just that little bit of knowledge?" Old Wu replied mysteriously, "What? You don't believe me? I'll show you something later." Old Wu opened an app on his computer, and a 3D map of the entire village appeared. He clicked on his house's model, and a list appeared on the screen, clearly recording his family's monthly changes in supplies and income, as well as real-time temperature monitoring data for the vegetable garden, etc. Old Li looked at it, clicking his tongue in amazement, "This thing knows everything! Wouldn't that make my work much easier?" Old Wu laughed, "Of course! This way, everyone will have concrete data to support their meetings, making decision-making much easier." Old Li asked doubtfully, "Decision-making? Let me see how it's convenient." Old Wu then opened a webpage displaying the words "This Week's Pork Price Setting Decision," followed by a dozen suggestions from the village and a poll to determine the final price for the week. "Look," Old Wu said with a smile, "this plan will save a lot of costs. These are all useful suggestions from everyone, and this is the best solution we've come up with after combining them." Old Li was genuinely impressed. Young Yang and Young Li were indeed capable; in just a few days, they had completely transformed the village. The more Old Li looked, the more itchy he became. He then took out his phone and made a call.
  prcs.3211.a: "“Hey, Xiao Li, it's Uncle Li. Um, do you have time to come over…”
