l_simp_chinese:
 ######  大亚洲战争GAW国策  #########

 PRC_chinas_greatest_hour: "消灭所有反动派"
 PRC_chinas_greatest_hour_desc: "虚伪的和平面纱已被撕下。从板门店到马六甲，从克什米尔到关岛，大亚洲战争的烈焰点燃了陆地与海洋。中华民族将在这场最艰巨的考验中迎来重生，迎来最伟大的时刻！"
 PRC_operation_majestic: "§Y至尊行动§!"
 PRC_operation_majestic_desc: "我们将执行这场战争中的核心战略：对日本的登陆行动。只要解放军的铁蹄踏上日本列岛的土地，这场战争的胜负也将见分晓。"
 PRC_operation_southern_fury: "§Y南天之怒行动§!"
 PRC_operation_southern_fury_desc: "在东南亚与南太平洋地区，星罗棋布的岛群记录了太平洋战争中日美两国的一系列血腥战役。如今，这片海域将再次被战火点燃；我们的舰队和海军陆战队将倾巢出动，以印度支那半岛为跳板，最终打进太约组织的心脏—澳大利亚。"
 PRC_rebuild_japan: "重建日本"
 PRC_rebuild_japan_desc: "中日之间千年的永恒冲突似乎终于迎来了句点。我们赢得了对这一宿敌作战的彻底胜利，是该展现胜利者的宽容的时候了。我们将协助新生的日本列岛诸政府的重建工作，让日本人民认识到追随中国才能真正带来繁荣与和平。"
 PRC_operation_changma: "§Y季风行动§!"
 PRC_operation_changma_desc: "7余年前，英勇的中国人民志愿军联合朝鲜人民军打败了以美帝国主义为首的联合国军。如今，我们将再此重演先辈们的辉煌。中朝联军将再一次摧毁大韩民国和它背后的美国－日本主子。"
 PRC_integrate_korea: "整合朝鲜"
 PRC_integrate_korea_desc: "朝鲜半岛的战事已进入尾声。在原朝韩两国分治的基础上，我们将建立一个统一的朝鲜特别行政区，这将更有益于中朝之间的经济融合与合作治理。"
 PRC_only_one_korea: "一个朝鲜"
 PRC_only_one_korea_desc: "朝鲜半岛的战事已进入尾声。我们将尊重朝鲜人民的统一意愿，建立一个范围涵盖全半岛的朝鲜民主主义人民共和国，只有这样才能加强中朝友邦之间的兄弟情谊。"
 PRC_appeal_to_the_chinese_people_gaw: "呼吁中国人民"
 PRC_appeal_to_the_chinese_people_gaw_desc: "大亚洲战争是一场总体战。只有政府和军队在付出牺牲是绝对无法赢得战争的。只有全中国人民拧成一股绳、劲往一处使，胜利果实才能最终落入我们手中。"
 PRC_martial_law: "紧急措施"
 PRC_martial_law_desc: "我们必须承认，战争的严峻形势超出了我们的想象。我们必须加紧现有部队和预备役的训练流程，将这些生力军更快地投入战场。"
 PRC_call_up_the_reserves: "动员预备役"
 PRC_call_up_the_reserves_desc: "在我们调动了后方参与伟大的解放斗争的热情之后，我们将开启新一轮的预备役征召，为我们的前线部队提供更多的可靠兵员。不仅如此，这还将促进社会的进一步军事化。"
 PRC_east_china_wall: "东方长城"
 PRC_east_china_wall_desc: "有了规模更加庞大的可供调动的兵力，我们将能够加强我们在陆上的重要防线和边境线。我们决不允许哪怕有一名敌国士兵的军靴踏到中国的领土上。"
 PRC_coastal_defense_brigades: "海岸防卫旅"
 PRC_coastal_defense_brigades_desc: "有了规模更加庞大的可供调动的兵力与更多的装备，我们将能够加强我们的重要海岸防线和海上据点。我们决不允许哪怕有一艘敌国军舰开进中国的领海。"
 PRC_kashmir_road: "克什米尔通路"
 PRC_kashmir_road_desc: "克什米尔高原乃兵家必争之地。拿下了这里，就意味着我们能拥有对印度的绝对战略主动权。我们将联合我们的巴基斯坦盟友一同行动。"
 PRC_operation_gangaridai: "§Y冈加里迪亚行动§!"
 PRC_operation_gangaridai_desc: "在1971年的战争之后，东巴基斯坦独立为新生的孟加拉国，并成为数十年间中印争夺影响力的主战场之一。以陆军特种部队为前锋，我们将派出一支精锐远征军千里跃进孟加拉，在印度的心脏上狠狠插上一刀。"
 PRC_operation_pallava: "§Y帕那瓦行动§!"
 PRC_operation_pallava_desc: "我们与印度的漫长边境线以高原和雪山为主，在此处展开的拉锯战难以取得战果。我们将发起一场大胆的奇袭行动，派出特遣舰队出其不意地登陆印度南部海岸，在其腹地大胆穿插。同时西北边境的中巴联军也将发起协同攻势，让印度的抵抗彻底崩溃。"
 PRC_operation_samosir: "§Y沙摩西行动§!"
 PRC_operation_samosir_desc: "印度尼西亚是该地区面积最大的国家，不计其数的岛礁将大片水域分割为数个拥有重要战略意义的海峡。拿下印度尼西亚就意味着我们的海军能够在南方战事中占据绝对的优势。但我们也必须认识到，攻占这个拥有3亿人口的群岛国家对解放军来说绝对是项艰巨的任务。"
 PRC_operation_baru_nah: "§Y奇现行动§!"
 PRC_operation_baru_nah_desc: "文莱，这个南海周边的蕞尔小邦不仅拥有丰富的石油资源，其优越的地理位置也将为我们扩大南方战事的行动提供进一步跳板。解放军的参谋们预计对这个小国的一次奇袭行动将会易如反掌。"
 PRC_cover_the_back: "覆及后地"
 PRC_cover_the_back_desc: "菲律宾，这个长年以来的亲美国家，在诸多南海岛屿的归属上与中国存在重大矛盾的国家，始终是我们的一块心病。其地理位置更对我们南方攻势的大后方产生了重大威胁。是时候对该国采取行动，翦除这个潜在的重大威胁了。"
 PRC_revenge_for_nanking: "雪耻南京"
 PRC_revenge_for_nanking_desc: "中日之间千年的永恒冲突似乎终于迎来了句点，以其中一方的毁灭为终点；日本将被永久分裂，日本民族也将彻底成为一个历史概念。我们终于能为在抗日战争中死去的同胞们真正雪耻了。"
 PRC_starve_the_island: "围岛战术"
 PRC_starve_the_island_desc: "我们终于来到了这一步——解放军距离澳大利亚本土仅剩一步之遥。为了避免不必要的损失，我们可以对整块大陆的重要海上航道进行封锁。澳大利亚人迟早会因为无法忍受物资的短缺和持久的恐惧而主动要求和谈。"
 PRC_operation_coronet: "§Y王冠行动§!"
 PRC_operation_coronet_desc: "我们终于来到了这一步——解放军距离澳大利亚本土仅剩一步之遥。只要发起最后的登陆战役，我们便能给这场血腥的战争画上句号。士兵们，登船吧！"
 PRC_suspend_the_consumer_economy: "中止消费经济"
 PRC_suspend_the_consumer_economy_desc: "繁荣的消费市场曾是中国经济增长成就的象征。然而战争已经改变了这一切。过量的消费只会造成浪费，对社会风气也意味着不良影响。我们将对商品经济进行管制，同时提倡生活中的节约之风。"
 PRC_all_chinese_mobilization: "全中国总动员"
 PRC_all_chinese_mobilization_desc: "我们必须承认，战争的严峻形势超出了我们的想象。现在已经不是仅能够依靠现有兵力和敌人周旋的时候了。我们将启动新一轮总动员，在最短时间内建成一支有史以来规模最大的军队。"
 PRC_propagandize_our_success: "昭告胜利"
 PRC_propagandize_our_success_desc: "无需多言，一盘散沙的太约组织绝不会是我们坚强的盟友与伟大的人民解放军的对手。我们将在我方阵营内部开启声势浩大的宣传活动，尤其是对我国国民宣扬人民军队的光辉战绩，让全社会更加热情地支持我们的解放事业。"




 taiwan_detente.0.t: "国民党赢得台湾选举"
 taiwan_detente.0.d: "近期，在我方社交媒体平台上广泛传播、引发热议的话题，莫过于台湾地区地方选举的结果。此次选举中，民众选出韩国瑜担任该分裂地区的行政负责人。有人对此表示庆祝，认为是对激进“台独”势力的一次有力否定；也有部分网友质疑该次“地方选举”的合法性。\n\n国台办对这一结果并未作出过多评论，仅重申所谓“总统选举”不过是台湾地区的一次地方选举，外部势力不应干涉中国内政。不过，据传政府内部部分人士对于国民党的胜选持谨慎乐观态度，认为该党在立场上较倾向于与我方沟通合作，有助于维持两岸关系的温度。尽管对韩国瑜是否真心致力于恢复两岸联系仍存疑虑，但在民进党下台的背景下，整体对话的推进至少将会更加顺畅。"
 taiwan_detente.0.a: "我们希望他们能够明辨是非。"
 taiwan_detente.6.t: "新加坡会谈开幕"
 taiwan_detente.6.d: "在新加坡的极力促成下，大陆与台湾地区代表近日在新加坡正式展开会谈，就两岸关系发展相关议题进行协商。此次台湾方面由中国国民党代表出席，大陆方面则由国务院台湾事务办公室代表组成代表团。\n\n双方本着平等协商、互相尊重、搁置争议、求同存异的原则，就两岸经贸合作、人员往来便利化、区域和平稳定等议题进行了深入沟通，并在多个领域达成初步共识。会谈气氛坦诚积极，展现出重启交流、改善关系的共同意愿。\n\n新加坡外交部表示，欢迎双方选择在新加坡作为中立场地对话交流，并希望此次会谈有助于缓解紧张局势，推动地区和平稳定。"
 taiwan_detente.6.a: "看看他们会谈些什么。"
 taiwan_detente.7.t: "两岸统一议题迫在眉睫"
 taiwan_detente.7.d: "在美国内战局势恶化之前，国际外交格局已显现明显的变化迹象。随着美国国内社会分裂日益加剧，政府运作频频受阻，其在国际事务中的影响力持续衰退。\n\n在这一背景下，中国大陆加紧掌控周边局势。与此同时，台湾内部也出现了多元声音，一些主流政党呼吁重新审视两岸关系的走向，以避免在国际力量重组中被边缘化。\n\n不久之后，随着美国内战正式爆发，美国政府的对外干预能力骤然下降，亚太地区的安全局势出现了重大空缺。中国大陆明确表示，将坚定不移地推进国家统一进程，坚决反对任何形式的分裂行径，强调维护国家主权与领土完整的决心绝不会动摇。\n\n在台湾，面对政局动荡，国民党等主要政治力量呼吁以更务实的态度面对两岸现实，主张通过和平谈判寻求新的安排。"
 taiwan_detente.7.a: "分裂要结束了？"
 taiwan_detente.8.t: "新加坡两岸会谈提出统一议程"
 taiwan_detente.8.d: "本周，来自中国大陆和台湾的代表团在新加坡政府的协调下举行了新一轮谈判。此次会谈正值美国内战、亚太局势深刻变动之际，因而引发国际社会的广泛关注。\n\n在会谈过程中，大陆代表团正式提出加快推进两岸统一进程，呼吁建立常态化沟通机制，并就统一框架展开实质性对话。代表指出：“实现祖国完全统一是十四亿人民的共同心愿，也是中华民族伟大复兴的关键一步”，强调应把握当前的历史机遇。\n\n由中国国民党领导的台湾代表团则持谨慎态度。台方重申致力于和平处理两岸关系，但对统一议题持“开放但保留”的立场，强调必须维护台湾民众的生活方式、社会制度与核心利益。\n\n这是多年来统一议题首次作为正式议程重返两岸谈判桌。尽管前路充满不确定性，但此次对话本身已具有重要的战略意义。"
 taiwan_detente.8.a: "两岸统一是必然趋势。"
 taiwan_detente.9.t: "新加坡会谈破裂"
 taiwan_detente.9.d: "在新加坡举行的两岸会谈于今日宣告中止。双方在统一议题与政治安排上的关键分歧始终未能缩小，会场气氛一度紧张，最终未发布联合声明。\n\n大陆代表团在会中强调，当前国际格局剧烈变化，两岸应抓住战略窗口期，推进统一进程。大陆方面提出设立联络机制并商讨统一路径草案，重申“和平统一是最大诚意，不排除必要选项”的政策立场。\n\n台湾方面则明确拒绝进入任何涉及统一议程的阶段性协商。国民党主导的代表团，称现阶段“缺乏岛内共识”，并对大陆在会中强调“一国框架”表达严重关切，要求“先处理现实接触、建立互信”，再谈后续安排。\n\n闭门会议持续不到两小时即告中断，双方未安排媒体简报，代表团分别提前离场。\n\n新加坡外交部对此表示遗憾，呼吁双方保持沟通渠道畅通，并避免言语升级和误判风险。"
 taiwan_detente.9.a: "至少我们尽力了。"
 taiwan_detente.10.t: "最终抉择"
 taiwan_detente.10.d: "中南海深夜，胡春华独坐勤政殿办公室。案前摊开的泛黄台湾海峡地图上，凌厉灯光将海界线照得如同历史裂痕。\n\n总参谋部与中央军委的汇报反复确认：和平统一的关键窗口期已然消逝。岛内民意深度撕裂，外部干涉持续加剧。再等，将彻底丧失战略主动。\n\n十年来，他始终避免对抗，谋求稳定的国际秩序，化解风险。但时间，此刻却成了最凶险的敌人。统一不再是政治选项，而是关乎国家完整与未来的存亡抉择。他清楚代价——战场牺牲、经济震荡、国际压力乃至重大政治风险。但历史不会等待。\n\n“风险？”他望向夜色，“革命年代，我们的同志哪次前进不冒风险？”中南海的空气仿佛凝固，举国目光似都聚焦于此。\n\n“命运只留下这条单行道。”\n\n“准备下一阶段行动。”"
 taiwan_detente.10.a: "历史的大门已然敞开。"
 excessive_parade_drill_spirit:0 "过量阅兵式训练"
 excessive_parade_drill_spirit_desc:0 "一个士兵的首要职责就是在阅兵式上风姿飒爽。"
 get_super_event_title: "-"
 PRC_china_to_mars_super: "世界解放阵线凯旋"
 PRC_china_to_mars_super_text: "“它是远方地平线上已经看得见的桅杆的那一航轮船，是挣脱母腹的婴儿的第一声啼哭，是林中的响箭，是报春的惊雷”\n- 鲁迅"
 PRC_china_to_mars_super_button: "东方红！"
 PRC_protect_human_rights: "人民至上"
 PRC_protect_human_rights_desc: "由于现实的障碍与全面工业化浪潮的冲击，在一片乱糟糟中政府的力量很难去全面地维护人民权益，从而造成了地方不平衡发展、法制建设不完全、制度不自信……等等问题，承认问题才能解决问题，只有加快对人民权益的保护和制度性建设，我们才能真正地称自己为“人民的国家”。"
 PRC_invite_new_left_scholars: "新时代社会主义辩论"
 PRC_invite_new_left_scholars_desc: "在全国上下一直存在着对于“社会主义究竟该怎么走”这个问题的辩论，只是绝大多数的时候这样的辩论都不上台面，政府为了发展也一直在有意无意地忽视。\n但现在，我们已经站在了一个前所未有的变革节点上，政府将承认自己对于理论的局限性，邀请社会各界优秀人才参与到这场对于社会主义未来道路的讨论辩论上，这一次，我们不仅要明晰社会主义要怎么走，更要让社会主义真正深入这个国家最底层逻辑，打造出一个永恒不破的革命堡垒。\n中国依旧是社会主义的中国，社会主义也必将是中国的社会主义。"
 PRC_free_political_prisoners: "对旧时代的整理"
 PRC_free_political_prisoners_desc: "只要我们还活在需要人管人的时代，我们就一定会犯错，犯错不可怕，重点是改错。在开启新一轮改革之前，我们注意到在我们之前还有着一些政治犯身上存在的问题是可以纠正的，他们对人民也依旧是有价值的。\n经过人大代表审议中央政治局，我们将对一部分符合人民阶级利益的政治犯进行特赦，在迈向未来的道路上朋友总是越多越好。"
 PRC_emancipate_the_npc: "解放人大"
 PRC_emancipate_the_npc_desc: "作为我国的最高权力机关，人大的真正力量似乎一直无法显现，这其中有着多重原因。现在，我们将为了实现真正的社会主义民主而向着未来迈出一大步：在人大层面实现全面的思想解放，让人民的代表与一线优秀工作者都能在向着共产主义迈进的路途上发光发热、建言献策、畅想未来。"
 PRC_humanist_marxism: "马克思思想再验证"
 PRC_humanist_marxism_desc: "随着全世界共产主义革命浪潮陷入低谷，不仅是民间，就连党内都有一些人对共产主义事业都产生了动摇，以至于马克思思想陷入了困顿的境地。\n但这并不可怕，现如今的我们再困难也不会困难过两万五千里长征中的红军。我们依然保留着革命的火种，并且随着美国内战的开启，革命的火焰重新燃烧，我们党的工作重点也将进行转移，以适应这个充满变化的世界。\n用马克思思想去对世界进行验证解释，同时借整个世界的变化来重新验证马克思思想，强化我们的意识形态武器，强化我们的制度自信和文化自信。"
 PRC_from_the_clean_slate: "全国人民代表大会"
 PRC_from_the_clean_slate_desc: "人大代表作为代表人民民主意志的存在，除了要在大会上解放思想外，也得更大程度上受到人民的监督，如“家庭财产公开”、“建立媒体账号”等方式，必须要确保所有人大代表都真正在为人民利益说话，社会主义中国的民主绝不是精英与富人蒙骗分裂人民的权力游戏和综艺节目，而是“人民万岁”这句口号的具体体现。"
 PRC_concessions_to_partocrats: "红旗永不倒"
 PRC_concessions_to_partocrats_desc: "只有强调中国共产党的领导，才能确保中国永远走在社会主义的道路上，而非苏联那样一夜改变颜色，多党制只会导致政治极端化以及对人民内部的分裂。但党自身并非没有问题，我们将加紧建设党内民主化，将一些因为时代发展而积压的问题拿到阳光下晒一晒、改一改。"
 PRC_modernize_hu_jintao_theories: "改开后理论发展整理"
 PRC_modernize_hu_jintao_theories_desc: "邓小平、江泽民、王沪宁、胡锦涛、习近平……在改革开放之后，已有多位党内领导人对于马克思主义中国化做出了探索，现在我们将对他们的思想进行系统性整理发展，使他们的思想更适应现代的发展。"
 PRC_popular_socialist_democracy: "大众社会主义民主联盟"
 PRC_popular_socialist_democracy_desc: "只有马克思科学社会主义思想，才能成为中国人民对抗官僚资本主义和帝国主义以及一切反动势力的有力武器，在全国人大最新的一场会议上，全体人大代表与胡春华一同宣誓，党与政府将确保马克思科学社会主义真正成为14亿人民生活和思想的一部分，而不再是空洞的口号。"
 PRC_anti_lobbying_laws: "发动人民群众监督政商关系"
 PRC_anti_lobbying_laws_desc: "在社会主义国家中依旧存在着政商输送利益关系，这种广泛的腐败在过去已经引起了极大的民愤，我们不能将其视为是社会经济发展中的“必要之恶”或者“经济润滑剂”。因此我们将正式订立相关法律，公开向一切腐化势力宣战。"
 PRC_theory_of_neo_socialism: "新社会主义理论"
 PRC_theory_of_neo_socialism_desc: "新社会主义在二十世纪中叶被首次提出，它和当时占主流的苏联式社会主义相对抗，揭示了官僚主义、修正主义和僵化经济体制的危害。我们将学习其理论中有借鉴价值的部分，并对其进行改造，结合中国大众的革命经验，使之更符合中国的实情。"
 PRC_modernization_of_the_party: "党的现代化"
 PRC_modernization_of_the_party_desc: "通过云缨经过革新的新社会主义思想，党将成为一个真正与时俱进的现代化政党，与人民建立更加密切的联系，党将引领社会的进步，而社会民意也将推动党进行自我革新。\n社会主义中国的未来已经昭然若揭……"
 PRC_reform_local_elections: "地方选举改革"
 PRC_reform_local_elections_desc: "我们终于将迈出这最重要的一步：经过数十年的艰辛探索，经过无数挫折和倒退，新的基层选举与公社自治制度将被引入到日常政治生活之中。新的选举制度将更好地顾及广大人民的切实利益，并扭转一直以来的政治冷感情况。"
 PRC_a_truly_harmonious_society: "属于我们的大同之梦"
 PRC_a_truly_harmonious_society_desc: "在中国的上古神话中 曾描绘过所谓“路不拾遗，夜不闭户”的美好盛世，表明了中国人民对于物质极大丰富的期盼，而如今，我们可以自豪的宣布，我们不仅建设起了一个在物质层面现代化生产力极大富足的社会主义新中国，而且那个属于千百年中国人民的大同之梦也在我们的精神层面与政治层面上实现了！"
 PRC_reconcile_with_militarists: "重整人民解放军"
 PRC_reconcile_with_militarists_desc: "台海战争之后，解放军全体指战员的作战能力得到了实际的验证，其中有亮点，也有缺点。有经验，也有教训。重整人民解放军既是对解放军整体工作的肯定，也是为开启下一次军队改革做预备。强军首先强人，解放军是受党领导服务于人民的军队，这一点一万年都不能动摇。"
 PRC_rejuvinate_cpc_cadres: "招募年轻党员干部"
 PRC_rejuvinate_cpc_cadres_desc: "从大学生和一线工作者中招募党员一直是我们的优秀传统，但随着拜金主义、官僚主义的风再次席卷而来，成为党员不再代表着理想与革命，而变成了爬上权力的梯子，赫鲁晓夫“全民党”的墓碑就在眼前，我们应当对现有党员干部进行整顿，让真正充满热情有能力有信念不忘初心的党员干部继续发光发热并得到应有的荣誉，让那些机会主义者和被腐化的人靠边站并施行再教育。"
 PRC_legacy_of_mao: "毛的遗产"
 PRC_legacy_of_mao_desc: "毛泽东思想是得到了历史验证符合历史规律的正确思想，哪怕在其死后，其留下的遗产也在不断地影响并滋润着我们这片广袤的国土，帮助着这个国家向前迈进。\n而今日我们将整理毛泽东思想，刷去上面的浮尘，加强其根本性方针对国家的领导，让那个神像的毛主席重新变为一个人民的毛泽东。"
 PRC_reverse_confucian_turn: "尘归尘，土归土"
 PRC_reverse_confucian_turn_desc: "经过数十年来的新中国建设和改革，我们已经初步实现了物质生活上的丰富化，但在精神层面却依然背负着一座大山，封建遗毒、诈骗、境外势力的颠覆阴谋……那些残害人民的毒药都披上了一层传统文化的神圣外衣，让人不敢去撼动。\n现在，我们将号召全国上下对所有的传统文化进行分门别类的大调查，让好的变得更好，坏的放到博物馆去批判，建立全国上下总体性的新文化共识，树立起真正的新中国文化自信。"
 PRC_revise_cultural_revolution_verdict: "打倒资本剥削"
 PRC_revise_cultural_revolution_verdict_desc: "人民奋斗确实需要积极性做推动，但在过去十几年的建设中，我们似乎把一些建设发展归功于了资本家带来的流动性，但就事实来看，如今很多公司内部已经充满了腐烂的脓疮与利益熏心的污血，靠这些以利益为驱动的机器自我修复显然是不现实的，如此腐烂压迫剥削的机构又怎么能担任起发展社会主义经济为人民谋幸福的重任呢？因此，我们将一边探索代替他们的方式，一边对他们搭建外部强而有力的制度化纠正框架，比如说加强劳动法建设、扩大劳动监管部门权力、鼓励公司内部员工举报等等，让剥削不再被美化，利益优先也不再成为一条不变的铁律。"
 PRC_denounce_xi_revisionism: "鞍钢宪法"
 PRC_denounce_xi_revisionism_desc: "鞍钢宪法作为我国无产阶级在社会主义经济建设浪潮中的优秀民主创举，同时也符合二十一世纪新时代新革命的社会情况，是科学的管理方向，应得到发展壮大。开展技术革命，大搞群众运动，实行两参一改三结合（“两参”即工人参加管理、干部参加劳动，“一改”即改革不合理的规章制度，“三结合”即干部、工人、技术人员相结合），这一切都将让国企焕发新生，重新开始争夺经济主权，让社会主义经济两条腿都走得稳走得踏实。"
 PRC_expand_provincial_autonomy: "扩大省权"
 PRC_expand_provincial_autonomy_desc: "在过去的社会主义建设中，中央政府和基层政府都暴露了许多官僚主义问题，中央政府在地方指导上的滞后性，地方政府的政策层层加码，都为人民带来了困难。我们现在将在各级政府都设立巡回的人民代表以及公社纠察组，尝试通过扩大省一级人民参政议政权力以及监督权，来让政府更加高效更加符合实际利益地运转。同时也不能放弃中央政府的自我革新，加强在调控全国资源当面的落实度。我们相信，人民和政府只有心连心才能更好的建设社会主义。"
 PRC_reform_the_cppcc: "改革政协联盟"
 PRC_reform_the_cppcc_desc: "全国政协集合了执政党，也就是中国共产党，以及参政党，也就是民革和民盟等民主党派的社会精英，但却被一直认为是毫无权力的清淡机构。我们将通过改革赋予其真正的实权，并使之在吸纳社会精英的同时也留出更多的位子来给来自社会各界的出色道德模范和劳动模范，使之成为中国社会主义发展中一个优良的润滑剂与纠错人。"
 PRC_revive_peoples_war_mindset: "将人民战争理念现代化"
 PRC_revive_peoples_war_mindset_desc: "人民战争是中国共产党取得革命胜利的重要法宝之一。但在军事技术取得突飞猛进的突破后，这一思想似乎被渐渐视为老旧的观点而淡忘。然而，台海战役中暴露出来的一些问题证明了人民战争理论依旧存在先进性，我们是时候将人民战争的灰尘擦去了。解放军是人民的解放军，两者缺一不可，只有有机结合起来，进行现代化的人民战争，我们才能有能力面对一切风雨。\n加强民兵武器装备与训练、扩大预备役、解放军革命化教育建设……我们依旧任重道远！"
 PRC_restore_party_authority: "民心重归于党"
 PRC_restore_party_authority_desc: "党员不应该是实现个人野心和荣华富贵的桥梁，只有加强对党员干部队伍的自我约束，让所有党员都加强对社会主义革命理论的认识以及“为人民服务”的理念，党才能获得民心支持，除此以外所有的手段都只是遮羞布。"
 PRC_revitilize_peoples_democratic_dictatorship: "恢复人民民主专政"
 PRC_revitilize_peoples_democratic_dictatorship_desc: "恐怕我们已经为经济发展做了太多妥协，比如说允许资本家加入共产党这一点，就使得党和工人为代表的广大人民群众渐行渐远，并逐渐被维护社会精英和新兴资产阶级利益的反动论调所影响。我们将彻底扭转这一趋势，让党重新成为代表无产阶级的革命党。"
 PRC_crackdown_on_corruption: "常态化干部队伍纠错反腐"
 PRC_crackdown_on_corruption_desc: "腐败问题绝不仅是一个思想问题或个人操守问题。反腐是社会主义进步力量对资产阶级和党内修正主义反动派的正义之战，但运动式执法只能解决一时之需，还容易被有心之人利用并扩大化而让效果减弱，因此我们将建设起一套由巡视组、检察院、人民自发举报、先进科技力量联合组建的常态化反腐倡廉体系，确保无论何时无论何地，一个腐败也也绝对不能放过，让反腐变得像喝水吃饭一样常见！"
 PRC_stir_up_youth_patriotism: "学习雷锋好榜样"
 PRC_stir_up_youth_patriotism_desc: "青年人的思想决定着现在和未来二十年全社会的风气和思潮，我们将鼓励青年人以及文艺工作者创作那些在社会主义革命斗争与经济建设中起到关键作用的模范成员创作更多作品，在繁荣文化市场的同时激励青年人加大对建设、保卫、巩固社会主义祖国的热情与归属感。"
 PRC_cutdown_party_bureaucracy: "干部队伍高效化"
 PRC_cutdown_party_bureaucracy_desc: "我们的党和政府在长久以来的官僚主义影响下，已经变得越来越臃肿，其中藏纳了许多毫无理想信念的无能者和投机分子，我们需要对整个党和政府来一次大扫除，将一些无效机构与混吃等死的铁饭碗给裁剪掉，使政府和党都能更高效地履行人民的意志，进行社会主义革命。"
 PRC_foster_authoritative_statesmen: "培养革命干部"
 PRC_foster_authoritative_statesmen_desc: "社会主义的执政党必须充满对自己的约束与革命信念，我们必须让那些两者兼备且具有强大才能的干部成为党的主心骨与领头羊，起到带头作用，我们的党才能成为真正名副其实的革命先锋，社会主义才能在中国长存。"
 PRC_communist_vanguard_restored: "共产主义革命堡垒"
 PRC_communist_vanguard_restored_desc: "前进，各民族英雄的人民！\n紧密团结在共产党身边，继续长征！\n万众一心奔向共产主义明天！\n建设祖国，保卫祖国，英勇地斗争。\n前进！前进！前进！\n我们千秋万代，\n高举人民万岁旗帜，前进！\n高举人民万岁旗帜，前进！"
 PRC_revolution_of_21_century: "21世纪的革命浪潮"
 PRC_revolution_of_21_century_drdv: "我们将对马克思主义与毛泽东思想进行开拓性的发展，在坚持基本原则的立场上使之更加能适应并应对二十一世纪社会主义革命的社会和经济条件。而前人的罪与功都会成为帮助我们前进的助力和警示。"
 PRC_chinese_communist_party_idea: "中国共产党"
 PRC_chinese_communist_party_idea_desc: ""
 PRC_spread_maoist_propaganda: "扩大共产主义宣传"
 PRC_spread_maoist_propaganda_desc: "我们坚信共产主义的思想与唯物史观是打开通向未来之门的钥匙，只有加大宣传，让星星之火重燃于中国大地，我们才能彻底摆脱必然王国的枷锁，通向自由王国。"
 PRC_call_upon_cultural_revolution: "文化革新"
 PRC_call_upon_cultural_revolution_desc: "文化这个高地我们不去占领，阶级敌人就会占领，我们应当成为中国新时代文化的引领者，腐朽文化的送葬人。"
 PRC_purge_anti_chinese_intelligentsia: "消灭社会蛀虫"
 PRC_purge_anti_chinese_intelligentsia_desc: "我们的人民一直生活在被这帮社会的害虫所啃食的环境中，现在，我们将展开雷厉风行的行动彻底抹除这群人所存在的痕迹！"
 PRC_study_theories_of_chairman_prop: "§Y政治宣传：§!学习毛主席的理论！"
 PRC_follow_lei_feng_example_prop: "§Y政治宣传：§!学习雷锋好榜样！"
 PRC_let_flowers_grow_prop: "§Y政治宣传：§!社会主义的百花齐放！"
 PRC_let_flowers_grow_prop_desc: "“让人民说话，天塌不下来。”"
 PRC_reform_voting_laws: "改革§O民主§!选举"
 PRC_support_grassroots_democracy: "改革§G基层民主§!自由"
 PRC_democratize_the_party: "属于§R党§!的§G民主§!道路"
 PRC_new_era_for_china_prop: "§Y政治宣传：§!中国新纪元！"
 PRC_new_era_for_china_prop_desc: "社会主义中国正站在一个前所未有的起点上，我们将越过历史的长河，推开通向伟大的大门。"
 PRC_power_to_the_people_prop: "§Y政治宣传：§!权力归于人民！"
 PRC_power_to_the_people_prop_desc: "“人民万岁”并不止于口号，建设起社会主义中国的伟大人民们也终将完全拥有这个国度的一切。"
 PRC_down_with_bureaucracy_prop: "§Y政治宣传：§!打倒官僚主义！"
 PRC_down_with_bureaucracy_prop_desc: "官僚主义是压在人民身上的一座大山，而被马克思思想武装起来的人民和党终将要把这座大山彻底送进历史的坟墓。"
 PRC_21deshj: "§Y人大联盟§!将进一步加强"
 PRC_21shiji: "我们的§R革命§!已取得进一步进展"
 PRC_organic_bureaucratism_idea: "权威干部队伍"
 PRC_popular_socialist_democracy_tt_1: "如果完成§G民主改革§!措施："
 PRC_reform_peoples_republic: "§Y中国共产党：§!改革§t共和国§!"
 PRC_destroy_reactionary_thinking: "§Y中国共产党：§!砸碎§R锁链§!"
 PRC_cult_of_science: "§Y中国共产党：§!§C科学§!崇拜"
 PRC_amend_historic_wrongs: "§Y中国共产党：§!正视历史§R错误§!"
 PRC_maoist_politburo_cat: "政治方针"
 PRC_maoist_politburo_cat_desc: "\n\n\n\n\n£GFX_PRC_maoist_politburo_banner\n\n\n\n\n\n\n\n政治局作为党的最高领导机关，既是统合全党思想的风向标，同时也是执行全国代表大会民主意志最坚强有力的手。在这个新的时代，它将继续承担起在推进新中国社会主义建设浪潮同时把方向、谋发展、定政策、促改革，确保中国的社会主义事业不会遭到任何势力的颠覆与破坏。"
 PRC_angang_xianfa: "鞍钢宪法" 
 PRC_political_prisoners_freed_idea: "特赦政治犯"
 PRC_the_red_phoenix: "凤凰涅槃"
 PRC_the_red_phoenix_desc: "天将降大任于斯人，胡春华已接过了最高权柄。他将让伟大的人民共和国如不死鸟一般从灰烬中重生！"
 china.297.t: "中国大选"
 china.297.d: "历史的指针指向了关键时刻。今天，全国人民代表大会第二次会议在庄严的国歌声中拉开帷幕。根据新修订的宪法和选举法，此次国家主席选举将在中国共产党、中国国民党革命委员会、中国农工民主党和九三学社四个政党提出的候选人中进行。选举将严格遵循公开、公平、公正的原则，充分保障每一位代表的民主权利，确保选举结果真实反映人民的意志，同时选举结果将由全国人大主席团宣布，并由全国人大公告。\n\n在计票结果公布的时刻，人民大会堂内鸦雀无声，来自全中国各地的近三千名全国人大代表都屏息凝神，等待着主席团公布选举结果。\n\n“根据选举结果，新一届中华人民共和国国家主席将由……”"
 china.297.f: "胡春华继续担任总书记！" 
 china.307.t: "旧日残影"
 china.307.d: "渤海边的大连市，这里曾经是北方美丽的“花园之城”和城市治理的光荣成功案例，而此时此刻，在这座城市里不为人知的某个角落还居住着一位囚徒。前大连市长，曾担任政治局委员的薄熙来正在看着电视，在疗养院外的车水马龙中，时时有怀念他的低语，但他的躯体却在这舒适的院落中缓慢朽烂。\n\n新闻节目中正在字正腔圆地讲述着党中央的新政策。薄布满老年斑的手按下了回滚键，又听了一遍这段新闻，然后是又一次，又一次，直到那双曾经刚劲的手微微颤抖，直到沟壑纵横的老脸上潸然泪下。自己自由了，薄熙来这样想道。作为被囚之人度过了十几年的时光后，他即将能够再次行走在这片大地上。尽管荣光和野心已经一去不返，但大连清新的空气却从未如此刻般甘美。"
 china.307.a: "久在樊笼里，复得返自然……"
