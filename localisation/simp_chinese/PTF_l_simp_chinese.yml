l_simp_chinese:
 PRC_Invade_America_tt: "§Y最终攻势§! - 我们将登陆西海岸迫使美国彻底投降"
 PRC_Invade_America_dec_idea: "§Y美利坚特别行动§!"
 PRC_Invade_America_dec: "§a美利坚§!最终攻势 - 最终阶段"
 # PTF National Focus Localization
 PTF_soaring_white_eagle: "白鹰振翅"
 PTF_soaring_white_eagle_desc: "美国的象征——白头鹰，将再次展翅翱翔于太平洋上空。我们必须重振国家士气，为即将到来的挑战做好准备。"

 PTF_storming_back_into_tne_pacific: "重回太平洋"
 PTF_storming_back_into_tne_pacific_desc: "太平洋曾是我们的势力范围，现在是时候重新确立我们在这片海域的主导地位了。我们将领导太平洋条约组织，重塑地区秩序。"

 PTF_the_new_marshal_plan: "新马歇尔计划"
 PTF_the_new_marshal_plan_desc: "如同二战后的马歇尔计划重建欧洲，我们将启动新的援助计划，帮助我们的太平洋盟友重建和发展，以此巩固我们的影响力。"

 PTF_freedom_of_navgation: "航行自由"
 PTF_freedom_of_navgation_desc: "自由航行是国际贸易和海洋秩序的基石。我们将确保太平洋航道的畅通无阻，维护海上交通线的安全。"

 PTF_defeated_but_unbowed: "败而不馁"
 PTF_defeated_but_unbowed_desc: "虽然我们经历了挫折，但美国精神从未被击垮。我们将从失败中汲取教训，变得更加强大。"

 PTF_fortress_of_freedom: "自由堡垒"
 PTF_fortress_of_freedom_desc: "美国本土必须成为坚不可摧的自由堡垒。我们将加强国防建设，确保任何敌人都无法威胁我们的家园。"

 PTF_roaring_steel: "轰鸣钢铁"
 PTF_roaring_steel_desc: "美国的工业机器将再次全速运转，钢铁洪流将淹没我们的敌人。我们将动员全国的生产力量。"

 PTF_oil_the_blade: "为刃上油"
 PTF_oil_the_blade_desc: "一支强大的军队需要充足的燃料供应。我们将确保石油资源的稳定供应，为即将到来的战争做好准备。"

 PTF_project_jupiter: "朱庇特计划"
 PTF_project_jupiter_desc: "如同罗马神话中的众神之王朱庇特掌控雷电，我们将掌握最先进的军事科技，从天空降下雷霆之怒。"

 PTF_forge_the_chain: "铸牢锁链"
 PTF_forge_the_chain_desc: "我们将把太平洋盟友紧密联系在一起，形成一条坚不可摧的锁链，共同对抗任何威胁。"

 PTF_stranglehold: "扼住咽喉"
 PTF_stranglehold_desc: "我们将控制太平洋的关键航道和战略要地，如同扼住敌人的咽喉，让他们无法呼吸。"

 PTF_the_final_crusade: "最终圣战"
 PTF_the_final_crusade_desc: "这将是捍卫自由世界的最后一战。我们将集结所有力量，发动决定性的攻势，彻底击败威胁和平的敌人。"


 reshape_military_industrial_complex: "重塑军工复合体"
 arsenal_of_democracy: "民主兵工厂"