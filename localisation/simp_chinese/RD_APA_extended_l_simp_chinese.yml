l_simp_chinese:
#二阶段
 rd_apa.1.t: "夜幕下的旅程（一）"
 rd_apa.1.d: "“吉姆，快点，把这批东西搬上去，利索点，不然鲁索那帮狗娘养的打过来我们一个都没好果子吃。”\n\n夜幕之下，一艘大小适中，颜色较深的船停泊在码头，生锈的痕迹布满了栏杆和船身，而在码头的一侧，几个壮汉正在麻溜地装货，塞到货船上。\n\n”这批货就是最后一批了，把这批装完我们就马上出发。”\n\n“队长，但是。”吉姆指了指货物，“这批物质只够我们吃半个月，大伙之前做决定优先把物资分给其他有困难的同志，现在给我们的物资就这么多，我们是最后一队人，到中国起码要一个月，油量可能还不够，怎么办呀。”\n\n汉克沉默不语，边搬东西边思考，随后说道：“搬东西上去，然后清点人数和物资，撑到一个月就是成功。”"
 rd_apa.1.a: "“什么？你是说要熬一个月？”"

 rd_apa.2.t: "夜幕下的旅程（二）"
 rd_apa.2.d: "“现在收到命令，航向要从去中国变成去美墨边境地区。”吉姆摘下通讯器，对众人说道。“拉里瓦主席在那边等我们，现在已经有一批同志已经到了。”队长思索片刻，查看了罗盘，对着地图上划定坐标和航向，准备掉头前往边境。\n\n突然间，寂静的黑夜被一声枪响划破，众人纷纷警戒，马上关灯，跑去拿武器迅速集结。“队长，附近枪声好像是东北方向传来的，我们应该是碰上海盗了。”杰克拿着望远镜，对着众人说道。“大伙听我说，别慌，我们的目标是迅速到达边境，不要和他们缠斗，吉姆，发动机保持低转速待命，随时准备全速撤离。杰克，继续观察他们的动向。”众人无声领命，迅速做好准备。\n\n“队长！他们冲过来了！”杰克喊道，此时黑漆漆的海面上突然出现探照灯的强光，传来几声西班牙语的喊叫和口哨声，紧接着，一串串子弹“哒哒哒”打在船身上，危险越来越靠近了。"
 rd_apa.2.a: "“拿起武器，准备战斗！”"

 rd_apa.3.t: "夜幕下的旅程（三）"
 rd_apa.3.d: "队长正说话间，一颗子弹“搜”的一声穿过他的耳边，击中后方的窗户，炸开一片玻璃网的蛛纹。\n\n枪声在寂静当中炸响，密集的火力朝着小船倾泻而出，海盗们没想到这艘小小货船居然有如此强的火力，于是准备招呼其他人过来包围。“吉姆！发动机全功率启动，朝西南方向突围！杰克！和我守着船头！科尔！保持火力压制！”队长喊道。\n\n发动机轰鸣起来，船身剧烈震动，开始加速转向，海盗的子弹迅速打来，正当海盗紧追不舍的时候，在暗处，狙击手约翰定睛凝神，“砰”的一声，海盗船上探照灯突然碎裂，紧接着约翰连续开枪，击中了海盗船上的油箱，一团火球升起，海盗们直呼不妙。"
 rd_apa.3.a: "“这帮杂种总算安静了。”"

 rd_apa.4.t: "边境线上的指挥所"
 rd_apa.4.d: "当一行人历尽千辛万苦来到美墨边境的游击队指挥所的时候，众人已经筋疲力尽了，杰克两眼一黑，倒在地上，吉姆靠着一块石头，双眼无神地看着天空，队长则是强撑着站着，向赶过来的众人报到：“第三小队队长詹姆斯·科尔。向你报道。”“辛苦了，各位，快上车吧。”说罢，负责联络接头的人把众人抬着上车，一路无话。\n\n中午的太阳十分刺眼，令人难受的温度烘烤着营地上的人们，绿色的布料尽力地挡住太阳的热浪，而绿布之下则是一系列电台和敲打的声音。“各位，辛苦了，现在部队已经全部转移，你们是最后一批到的。”格洛丽亚·拉里瓦拍着队长的肩膀，说道。“主席，现在的情况怎么样了？”吉姆卸下武器，喝了一口水问道。拉里瓦没有急着回应，而是先示意众人稍安勿躁，随后转身指向身后那张巨大的作战地图。地图上密密麻麻的红蓝标记交织在一起，显示出局势的错综复杂。“情况比预想的要严峻，”她沉声说道，眉头紧锁，“现在有三分之一的人前往拉美各地区支援革命，留在边境打游击的一直面临严重的物资封锁和人员减少，我们现在既需要在边境地区骚扰鲁索，又需要防止附近的毒贩不会找茬，还得联络当地革命组织以及对接国内的地下组织，总之，我们要做的任务很多，目前看来只能希望墨西哥的同志们成功了。”说罢，拉里瓦叹了口气。\n\n烈日之下，联络员一口烟一杯水，正在不断的调试设备，受伤的士兵仔细地打绷带，希望伤口不会崩裂，拉里瓦和众人对着地图讨论接下来的战略，一切似乎看起来很平常。"
 rd_apa.4.a: "泰山崩于前而面不改色。"

 rd_apa.5.t: "广场的静默时刻"
 rd_apa.5.d: "时代广场的屏幕已经很久没有真正属于纽约了。白天，它们循环播放着爱国者阵线的征兵广告、战争债券宣传和阵亡士兵名单。晚上，它们播放工厂复产指标、忠诚市民表彰、对华战争“战略转进”的解释，以及那句每隔十五分钟就会出现一次的口号：“购买战争债券，保卫美利坚重生。”\n\n没人再抬起头，工人忙着去复工，退伍兵弓着背排在救济队尾，巡警垂着眼核对一个个行人。所有人的脖颈都养成了向下的惯性，只有高处的屏幕永远睁着眼，像一排钉在城市上空的、不会闭眼的神。\n\n晚八点整，中央主屏还在循环着熟得发腻的宣传片，可下一秒，画面猛地抽搐了一下。军旗卷成杂讯，债券认购数字被拉长、撕碎，淌成一串认不出的乱码。所有屏幕同时频闪，时代广场跟着猛地一暗。几秒后，所有屏幕同时复亮，但只有一个穿黑衣、戴红色面罩的人，站在一块粗糙的黑布前。"
 rd_apa.5.a: "他想要说什么？"

 rd_apa.6.t: "演讲"
 rd_apa.6.d: "镜头推得很近，只能看见他的肩线、眼睛，和身后晃荡的昏黄灯光。他没戴任何组织徽章，也没报姓名。\n\n“纽约，你们听得见吗？”人群没有应答，但整座广场瞬间安静了下来。“高官们坐在白宫和五角大楼，趾高气昂地告诉你们，物价上涨是因为暂时的疼痛，工资拖欠是因为国家正在重建，买战争债券就是爱国，低头忍耐就是忠诚，沉默就是秩序。”“可你们比任何人都清楚，这不是国家的重建，而是他们在一片废墟上继续啃食着血肉，他们让死去的人继续为活着的官员还债，他们把失败卖给你们，再要求你们为失败付款。”\n\n屏幕底下的人越聚越多，像被声音拢住的羊群。巡警开始上前驱离，人群却没立刻散。有人钉在街口，有人缩进店铺门廊，有人刚举起手机，但下一秒就被厉声喝止。巡逻车的警灯扫过湿冷的路面，红蓝光晕和屏幕上的红面罩缠在一起，把整座广场变成了一间巨大的审讯室。\n\n忽然，中央最醒目的大屏上，狠狠砸出一行白字：\n\n“工厂属于使用它的人、城市属于生活在这里的你……”"
 rd_apa.6.a: "“……未来不属于蓝衫军！”"

 rd_apa.7.t: "交易"
 rd_apa.7.d: "“莫平先生，这一个慎重的决定，鉴于战争期间阁下对我们的帮助，我们同意战后不清算政治创新中心所有成员，但关于加入爱国者阵线为我们效力，这是一个重要的决定，烦请您请考虑再三。”西雅图一个昏暗的办公室内，窗外正在下着瓢泼大雨，而打雷的声音使得本就压抑的氛围更加令人不安，但是对于办公桌两边的人来说却并不是这样。\n\n“我想我说的很明白了，杰克专员，美人解那帮家伙我早就知道不成器，所以我提前把情报给了尊敬的鲁索先生，这并非变节，而是出于忏悔和为了正义事业，你知道的，先生，政治创新中心的工会和士兵会为您提供任何帮助和支持，不管那些叛徒如何染指我们的美利坚，政治创新中心一定会走在最前线保卫美利坚。”莫平笑嘻嘻地回应道。\n\n“哦？是吗？可我们再三讨论，我们认为政治创新中心很难有能力帮助我们平定西海岸局势，尤其是阁下的能力，鲁索统领认为这值得怀疑，所以，请阁下好好考虑。”\n\n“这个嘛……请阁下相信我们，不过，我向你们保证，政治创新中心有能力平定局势。”“那么阁下，我们该如何信任你？”\n\n“请把西雅图交给我，一个月之内，我会让这个地方变得井井有条。”说罢，莫平把一份名单摆在桌子上，上面是美国人民解放军各个重要成员名字以及其战略物资等各种资源的地址和计划。"
 rd_apa.7.a: "西雅图上空的闪电依旧，但是似乎天空更加黑暗。"

 rd_apa.8.t: "农村来了个洋干部"
 rd_apa.8.d: "“好那个，帮忙把那个麦子抬一抬，装好准备回村里。”老范扛着一捆麦子放车上，对着田地里的两个人说。而如果凑近看，田地里的两个年轻人一个金发蓝瞳，一个红发黄瞳，皮肤秀白，看就知道是两个外国人，而当他们把麦子放进车里的时候，两个人累到坐在地上喘气。“你俩，还行不。”老范笑着递水，“不…不行了……开车吧大叔。”\n\n“你们是不是那个什么D什么什么A的，我听说中央派你们来农村学习，我还纳闷是谁，原来派了俩外国小伙来咱们村帮忙。”老范打趣道。“这倒是，我们书记说了，要学习中国同志的经验，尤其是现在的民主改革，所以我们就去农村了。”麦克喝了一大口水，缓缓地说道。“那你们学的要很多咯，我看你俩帮我收麦子捆麦子就费半天劲，等这麦子装上车了，你俩直接瘫在地上，所以说这农活看着简单，实则讲究手眼身法步的配合，没个三年五载的功夫，很难达到咱们老把式的效率。不过你们肯放下架子，满头大汗地干，这份诚意比什么都强。”\n\n老范一边说，一边用手比划，嘴巴和车一样停不下来，从种地的诀窍一直聊到农村琐事，而两个年轻人呢？则是静静地倾听老农口中的故事，路边的野草随风飘动，灰色的水泥路在落日的余晖当中逐渐失去自己的光彩，而随着车子停下，麦克和汤姆知道，他们明天又需要和老范下地，感受农村的肌理。"
 rd_apa.8.a: "小小的土地，不小的同志之情。"

 rd_apa.9.t: "大逃亡"
 rd_apa.9.d: "近日，白宫新闻发言人表示，当蓝衫军进入西海岸的时候“并未发现赤匪残余”，并且在核查几次之后只发现几名前美人解成员，从中得知，美人解大部分成员以及美国大量左翼份子已经逃离海外，其中近期美墨边境上的游击队骚动有一部分是美人解残余力量，而其余大部分人已经逃往东亚寻求世解阵寻求庇护，白宫表示，美国事务和北京无关，要求尽快交出“赤匪”，否则将动用外交手段寻求制裁。\n\n世解阵发言人表示，并未接收任何美国流亡政治犯，只有有计划的接收有意愿来中国工作的美国流亡专家和知识分子，美国政府此次发言实为污蔑，要求美方严肃对待，停止造谣污蔑，否则中方将以同样的手段予以回击。"
 rd_apa.9.a: "“不可能！绝对不可能！赤匪一定在他们那边！”"

#三阶段
 rd_apa.10.t: "“真实”的理论"
 rd_apa.10.d: "“关于我是怎么踏上政治经济学这条路的，我在读研的时候偶然阅读一本书，叫《世俗哲人》，里面提到的经济学的意义让我很兴奋，因为我意识到经济学是可以用于指导现实生产等等现实意义，此外我深受罗宾逊夫人和帕西内蒂的著作影响，从此一发不可收拾，钻进了经济学的大门。\n\n“那么谢克教授，现在不乏对马克思主义经济学的质疑和批判之声，但是随着疫情带来的一系列影响导致人们重新看待马克思主义经济学，因此您对于马克思主义经济学有什么看法吗？”\n\n“这需要讲到我在美人解经历的一个事情了，我当时在和一些中下层干部讨论，他们说，教授，学校平时教给我们的经济学知识，我们现在有机会运用实践，却发现，经济的事情不只是经济，这是以前我们从未遇见过的情况，和我们受到的经济学教育完全大相径庭，这件事情让我感受颇深，毕竟对于资本主义社会，真正的难题并不是解释为什么它会崩溃，而是解释为什么它能持续运行着，所以马克思的经济思想不可能只是解释经济的部分，而是扎根到到所谓的‘真实世界’。”"
 rd_apa.10.a: "“人们常说，忽视历史的人注定会重蹈覆辙。”"
 rd_apa_10_tt: "“也许我们可以补充一句：忽视历史的人注定会创造同样的历史。”"

 rd_apa.11.t: "归乡"
 rd_apa.11.d: "西海岸，阳光依然照射在沙滩上，海鸥惬意地在海滩上觅食，石头缝隙中的螃蟹也小心翼翼地探头，希望享受到新鲜的阳光，但对于另一些人来说，可能就没心情享受加州的阳光了。哈登拖着战略物资来到海滩上，而艾佛森正在架着临时联络设备，其他人各忙各的，手一刻也没停下来。\n\n很快，一个临时联络中心已经搭建起来，向着散落各地的抵抗力量发起广播：“这里是美国民主社会主义者，重复，这里是美国民主社会主义者，我们在此宣布，DSA已经完成重建，目前和华盛顿合作的DSA系原政党分裂出来的反社会主义份子，请不要混淆我们和他们的区别……我们将尽所能帮助全美各地抵抗力量，请各位注意……”\n\n沙哑但不间断的广播持续播放着，信号穿透嘈杂的海浪声，向内陆辐射。艾佛森紧盯着跳动的频谱仪，手指在键盘上飞速敲击以维持链路稳定。哈登卸下背囊，仔细地检查着剩余的弹药与医疗包，清点好数目准备分发给抵抗力量，说道：“加州过了这么久还是一点没变，起码我走的时候很热闹，现在也一样。”艾弗森打趣的回应道：“那自然，只不过以前的基层组织还有工会基本上都没了，目前的总方针是‘内战建国’，一边召集抵抗力量对抗鲁索，一边完成党建建设，这第一步啊，就先从广播集合开始。”\n\n“我看得多准备几辆小车，咱准备好的弹药可能填不饱大伙热情的肚子。”哈登点了点弹药数量，点点头。"
 rd_apa.11.a: "焕然一新的，政党。"
 
 rd_apa.12.t: "及时雨"
 rd_apa.12.d: "“抱歉同志，我们来晚了.”恩佐带着一伙人急急忙忙地跑向营地，低头喘气，而在他背后的队伍则是带着“墨西哥民主联军”缩写袖带，身穿深绿色迷彩风衣，头戴绿色军帽，脖子上绑着红领带，头戴面罩的武装份子，“我们接到命令，马上去边境地区接应美人解游击队，但是北边几个卡特尔和毒枭的残余势力一直在骚扰我们，很抱歉我们来的太晚了。”说罢，他尴尬地笑了一下。\n\n而此时PSL的指挥中心——或者说不能叫指挥中心——堪称一片狼藉，散落在地上的弹匣到处都是，将近一半步话机还有通讯设备也是欠维修状态，而不远处几个人正抬着尸体走向附近的河边，以及眼窝深陷，面色饥黄，啃着为数不多的食物勉强度日的士兵干部们。格洛丽亚·拉里瓦，这位昔日在战场上挥斥方遒的主席，现在不得不把自己所剩无几的口粮分给众人，而看到墨西哥的同志们前来支援，她那饱受饥饿折磨的眼睛突然就注入了生命，急忙迎上去，说道：“不用客气，快来吧。”接着把众人引到了营地。\n\n恩佐看着这一切的场景，感到又愤怒又悲伤，接着他掏出来几个墨西哥塔克分发众人，说道：“同志们！大家辛苦了！我们的部队已经解放墨西哥大部分地区，现在我们带着物资分发给大家，人人都有份！行军锅摆上！”语毕，一口行军锅架在地上，大家开始生火做饭，而此时众人已经饿的等不及了，纷纷急着上前看着饭菜什么时候做好。"
 rd_apa.12.a: "“别抢啊别抢啊！人人有份！大家排队领饭！”"
 
 rd_apa.13.t: "来点塔可（Taco）吗？"
 rd_apa.13.d: "“因此，这次胜利是墨西哥人民的胜利，是美洲人民的胜利，美帝国主义又一次遭受挫败，我们向着全美州解放又迈向了一步！”广播传来格洛丽亚·拉里瓦的演讲声，而底下的宴会已经开始了，只见几个老农拖着一头大牛，绑起来准备宰了，而老太太正在和孩子们卷薄饼，手忙脚乱之间不乏对孩子们的关切和打趣，而其他人忙着张灯结彩，布置现场，准备进行晚晚会。\n\n而另一边，酒馆里面有两个PSL的成员，喝着小酒看着忙活的人们，打趣到：“忙活了这么久总算是能休息一段时间了，从西海岸一路跑到墨西哥城，又是撤退又是打游击，正规大作战没打多少次，反倒是游击战打了不少，也是倒霉，我觉得还不过瘾。”另一边的同伴则说道：“那没关系啊，你看红军长征不也是一样，虽然咱们比不上人家，但好歹也是做了点贡献嘛。”\n\n“我倒是在想，下次战争爆发了，我们要怎么回家，要穿的干净点，不然容易闹笑话。”“是啊，得体面一点，起码得看着干净嘛。”两人有说有笑期间，走过来一个墨西哥老农，为了表达谢意嗯塞了墨西哥塔克给了两个士兵，说道：“这可是用了村里面最好的牛做的！你俩不能拒绝！必须吃！”“大爷犯不着犯不着，这太贵了！省着点省着点……”“不行不行，必须吃必须吃！”“真不需要真不需要，哎哎哎别塞了别塞了……”"
 rd_apa.13.a: "“你们不吃，那我们吃什么？”"
 
 rd_apa.14.t: "散落一地的文件"
 rd_apa.14.d: "“诺曼，那边那个办公桌烧了，带不回去就原地解决，利索点！”眼前一个身穿衬衫，头戴墨镜的四十几岁秃顶男人说道，“安德森长官，实在是不行了，文件太多了我们带不回去。”刚刚搬完一大堆文件上飞机的诺曼气喘吁吁的跑过来回复道。\n\n“你没听到我说的吗？总部下命令了，所有CIA探员要全部撤离并且处理证据，不管什么手段一定不要留在墨西哥，你们实在是带不走马上就地解决。”安德森催促道。而若把视角转移到旁边燃烧的火堆，则是一大堆不可告人的秘密——“杜兰戈州剿匪方案”、“奇瓦瓦州防怠工意见”、“南墨西哥渗透破坏计划”等等方案，这些秘密自然是要随着美军撤出墨西哥一起销毁的。\n\n屋内外，探员们四处奔走，有的把一大叠文件塞到碎纸机当中，结果导致碎纸机卡住不得不用手撕纸张，有的干脆将整箱资料倾倒进火堆，烈焰瞬间吞噬了那些墨迹未干的阴谋。浓烟滚滚，夹杂着纸张焦糊的刺鼻气味，弥漫在燥热的空气中。诺曼抹了一把额头的汗水，眼神复杂地盯着那团火光，那里烧毁的不仅是纸片，更是美军不可告人的阴暗面。安德森看了一眼腕表，冷声喝道：“动作再快点，直升机马上起飞，谁也不许掉队。”\n\n“长官，全部文件已经解决，已完成任务。”诺曼擦了擦汗，向安德森汇报到，“赶紧上飞机，妈的，这些计划方案我就没觉得能成功过。”"
 rd_apa.14.a: "“这些方案有过靠谱的吗？”"
 
 rd_apa.15.t: "在丛林中"
 rd_apa.15.d: "“杰克，给我弹药。”辛克说道，随即接过了抛过来的子弹。又是东躲西藏的一天，尽管PSL众人脱离了物资短缺的境况，但是事情远远没有结束，随着鲁索宣布“清除拉美地区赤色威胁。”几万PTF士兵开始南下进攻墨西哥，出于敌我实力对比考虑，指挥部决定化整为零，用空间换取时间，部队开始有序撤退，并在大后方建立根据地和游击队使其陷入长期的治安战，而PSL的成员们选择继续在敌占区打游击，为反攻争取时间。\n\n“派克，清点一下人数还有物资，我们明天还得准备战斗呢。”辛克靠在树上，点了一根烟，说道，“队长，这些物资还剩一半，咱们得省着点用了。”派克一边清点物资，“而且，附近的村庄前天还被烧干净了，当时蓝衫军来村子问话，说你们家里面有没有藏游击队的人，村民们说，我们这里没有什么问题，请各位不用来了，刚刚说完这话，下一秒这些士兵就开枪杀人，无论妇孺老幼，格杀勿论，最后他们一把火烧了村子，而且还不留下任何口粮给我们。”\n\n说罢派克锤了锤大树，他望着不远处的废墟，几篇瓦砾堆叠在地上，木板上缓缓长出来一些微小的青苔，村口对着的雕像只剩下半截身子，而半截雕像下则是一堆白骨，七零八落地围着底座，似乎在宣告着鲁索三光政策的胜利。"
 rd_apa.15.a: "“根据地的封锁越来越紧啊。”"
 
 rd_apa.16.t: "焦灼的雨林"
 rd_apa.16.d: "“跟总部汇报一下，战线拉太长了，导致我们现在大后方出了严重的后勤问题，现在后方各种游击队神出鬼没，抵抗力度开始增强，三光政策实行下来反而适得其反，而前方陷入焦灼状态，我们的部队很难再往前推进一步，每攻下一座城市就要付出巨大的代价。”办公室的空调正在悠然地运作着，把难以忍受的温度降下去，但是办公桌后面的指挥官却是忙的完全没有感受到任何清凉，长期的治安战让美军陷入泥潭当中，而前线推进速度的停滞又不断在制造美军的伤口，每天都能听到伤亡战报从广播当中传出来，而且他还需要催促新闻部门美化一番，否则鲁索一查下来他的乌纱帽可就不保了。\n\n“长官，总部来电。”一个士兵拿着电话递过去，“约翰，上头的意思很明显了，你要么继续推进进军墨西哥城，要么就撤职回家，总部不接受任何失败，知道吗？”听到这个消息的时候，约翰瘫软无力，坐在椅子上，骂道：“他妈的，老子还没受过这样的委屈，我的士兵在前线在后方一直遭重，又是游击队伏击又是怠工破坏后方生产，华盛顿这帮官僚是不是有病，他们就不知道每天烧了多少美金吗？不知道每天伤亡人数，物资受损数量有多少吗？一帮肥头大耳的官僚真是闹麻了！“\n\n说罢，约翰不得不再次下命令开会，商讨之后的作战计划，而与之前有所不同的是，这次到场的军官似乎都有一个共同的想法，那就是对于未来获取胜利的可能性少了五分信心。"
 rd_apa.16.a: "“长官似乎非常不高兴，还是说点好话吧。”"
 
 rd_apa.17.t: "战后小憩"
 rd_apa.17.d: "秃鹫啃食着地面上的尸体，旁边则是已经凝固的血迹，血迹上面有着散落的弹壳和被撕裂的布料，弹头则是嵌入在腐肉中，一旁，三个人正在清理物资以及清理现场，但是拖着一具尸体非常困难，尤其是对于已经耗尽体力打赢战斗的三人来说，于是三人决定休息，过会再说.\n\n“瑞克，你看一下咱们这次战绩如何？”派克抽了一根烟，喘了口气。“三打五，护送走私队伍去大本营，歼灭一个，跑了四个。”瑞克揉了揉眼睛。“鲁索派的这些废物真不经打，来的都是些贪生怕死的人，也就欺负没拿枪的人了。”杰克倒是打趣道：“黄口小儿派来的也是黄口小儿，不奇怪，物以类聚嘛。”\n\n远处，飞翔的猎鹰奔向北方，而随着猎鹰的视线看下来则是一望无际的黄沙，仙人掌点缀着这些干燥的沙子，而再往北方一些，则是那道令非法移民叹息的边境强，此时，鲁索已经着手加强边境警力，防止物资跑到游击队手上。“不过，最近的日子越来越艰难了啊，现在想搞物资靠走私快行不通了，只能看看那帮毒贩混战能不能趁机捞点。”派克感慨道，“熬吧，日子总归要过的，希望墨西哥的同志们能够胜利，这样我们能好受点，我现在也是吃了上顿没下顿，一块面包分两餐，能省就省。”杰克拍了拍肩，安慰道。\n\n秃鹫仍旧在啃食着尸体，三人无言看着秃鹫，似乎是在思考自己窘迫的境地。"
 rd_apa.17.a: "“这日子可是真难熬啊。”"
 
 rd_apa.18.t: "胜利的曙光"
 rd_apa.18.d: "前线战事不利的影响最终还是波及到了这座小城，对于当地居民来说，物资的日益减少和物价的上升让人们不得不勒紧裤腰带过日子，但除此之外，定期开展的“反赤匪搜查行动”更是让人们本来就不安的心理再添一层阴影，不过，所幸最近搜查行动的频率下降很多，这是紧张的日子当中为数不多的好消息。\n\n“戈登，发消息给其他安提法成员，鲁索现在节节败退，准备投降了，我们得快点组织起来。”戈登听罢，连发消息，而其他人则是在这个狭小的地下室当中收集情报，闷热的空气催促每个人的脸上逼出豆大的汗珠，厚重的墙壁似乎是隔绝了外界的一切，唯有敲击键盘的声音传遍整个房间。\n\n“各位，已联系西海岸总部，好消息是总部的部队即将到我们这边，坏消息是我们能动员的人数不多，附近的安提法因为长期处于地下状态，所以想要马上召集需要时间，而且我们因为在敌占区，想起义还是很困难的。”戈登挪动椅子，对着众人说道。“这不打紧，发挥老本行，咱们想办法黑入网络，拿情报给总部，然后点对点展开宣传，能融工组织工人的想办法动员起来，我们没那么多时间了。”史蒂文森说道，而地下室在短暂的开会之后又陷入了只有敲键盘的沉默。"
 rd_apa.18.a: "沉默的第二战线。"
 
 rd_apa.19.t: "扎根在车间的政治"
 rd_apa.19.d: "“布洛维教授，我看了您的《制造同意》，我个人的感受是您似乎对家长制这一组织模式很有兴趣，可以说说为什么吗？”\n\n布洛维顿了一下，翻了翻手上的资料，缓缓地说：“关于这个，就拿我在美国的经历来说吧，在我写书的那个年代美国正好是从传统的凯恩斯主义转型到新自由主义的时期，美国的工厂家长制随着新一轮市场化遭到肢解，这也是为什么‘铁锈带’工人会怀念5，60年代，而在ALPA立足西海岸之后，不少干部都会拿我的书作为参考，防止再一次出现‘社会主义家长制’，有一个年轻的干部和我说，他之前一直觉得苏联解体是因为经济体制的问题和戈尔巴乔夫的实践，但是在阅读了我的著作之后，他认识到即使是社会主义国家，也有可能会出现家长制的生产组织，这是他从来没有想到过的，他以为只有资本主义才有家长制的情况。”\n\n“我除了考察发达资本主义的生产组织以外，当年还去了苏东地区和南非的工厂进行考察，事实上从一个车间的生产组织开始能延申到整个国家的政治体制，而这个观点并不是一个新鲜的观点，不过，放在我们这个时代，确实是需要一次正本清源。”\n\n“那么布洛维教授，您对于中国的工业组织发展历程有过考察吗？”布洛维回答道：“我这次来中国就是为了这件事，毕竟过去一直没有机会考察中国的工厂，而现在就有这个机会完成这个心愿，或许我的那本《生产的政治》需要写一个新的前言和内容了。”"
 rd_apa.19.a: "看到那些塑造我们日常生活的因素，也要看到改变这些因素的可能。"
 
 rd_apa.20.t: "慌不择路的飞机"
 rd_apa.20.d: "当美人解的成员再次在西海岸站稳脚跟的时候，远处的飞机场则是聚集了一帮人，一个戴墨镜的保镖正在提着两箱行旅跑去飞机上，乱七八糟的行旅堆叠成一块一块的，像一个垃圾山，而仔细一看，“名贵珠宝用品”、“贵重金条”、“私人珍藏画作”……各种各样的名贵物品随意堆积起来，好像物主完全不在意一样。\n\n“快！勒布朗！快，赶紧把这些玩意放飞机，他们快打过来了！”莫平催促到，而旁边的几个保镖和随从一人四个行李箱，气喘吁吁地挤进狭窄的登机楼梯，把厚重的行李箱放下来之后又得回去再搬几次。\n\n“老板，没时间了，那帮人要打过来了，机场外边可以看到APLA进军的轮廓，怎么办？”“不管了，赶紧跑，有多远跑多远。”“可是这架飞机……”“你他妈没听到我说的吗！？跑！不管这些行李箱了！”说罢，几个人连忙跑上飞机，催促驾驶员往更远的地方逃亡，至于跑去哪里，他们也不知道。\n\n“勒布朗，你刚刚说什么？”“呃，老板，我想说的是，这飞机快没油了，而且还有故障隐患，我们是不是要……”"
 rd_apa.20.a: "（~乱流~爆炸~蜂鸣~）"
 rd_apa_20_a_tt: "“政治创新中心”主席凯莱布·莫平尸体已被找到，于今日在小石城附近发现。"
