# ==================== OSS 事件 ====================
 ChinaOSS.1.t: "中国对我们发动了电子战"
 ChinaOSS.1.desc: "中国的电子战能力已经达到了一个新的高度，他们的干扰设备能够覆盖我们大部分的领土，导致我们的通讯和雷达系统频频失灵。这不仅削弱了我们的防御能力，也让我们的军队在战场上处于极大的劣势。我们必须迅速采取措施，加强我们的电子对抗能力，以应对中国的威胁。"
 ChinaOSS.1.a: "可恶！"

 ChinaOSS.3.t: "对印度核反击体系破坏行动的报告"
 ChinaOSS.3.desc: "致 中央军委\n\n依中央部署，我军已顺利完成对印度各类核设施的大规模破坏行动。空军、火箭军协同太空军对印度的重大核设施进行了外科手术式打击，并摧毁了印度相当一部分战略轰炸力量，这一系列打击行动足以破坏掉印度绝大多数核反击能力。这一行动已经在印度官方激起巨大恐慌情绪，对其持续作战意志将造成不可估量的影响。\n\n由于我军的太空军轨道封锁，印度日前也无法对我国发起战略战术核打击。我军将迅速行动，尽快终结印度战事。"
 ChinaOSS.3.a: "虎口拔牙"

 ChinaOSS.4.t: "纽约遭遇核打击"
 ChinaOSS.4.desc: "就在今日，纽约被世解方面投放的核武器袭击，即便美国防空部队竭尽全力，但是致命的核武器依然突破其防空网络击中了纽约城。\n\n据报道，一团巨大的蘑菇云在曼哈顿区上方升起，核武器产生的烈焰瞬间将曼哈顿和旁边的布鲁克林区化为一团烈火。爆炸落点区域的建筑瞬间被汽化，唯有几座建筑还余留些许框架可见。哈德逊河在核弹爆炸的瞬间一度被彻底蒸发，而后倒灌的海水又涌入河道将船只的残骸推上河岸。而自由女神像的身体被核弹的高温融化，并倒塌坠入大西洋中。纽约的应急系统已经被核打击彻底瘫痪无法运转，数百万人被困在核废墟中等待救援。\n\n美国政府方面严厉谴责了这次核打击，并扬言要对世解各国进行更加严酷的报复，要让世解各国的“政府和民族都彻底地被毁灭和抹去”。但是在世解严密的轨道封锁和对空防御下，白宫的任何核突击都不太可能造成实际损失。"
 ChinaOSS.4.a: "大苹果的毁灭"

 ChinaOSS.5.t: "华盛顿遭遇核打击"
 ChinaOSS.5.desc: "据福克斯新闻报道，美利坚合众国的华盛哥伦比亚顿特区遭遇了其自20世纪以来最大的浩劫——世解发射的数十枚核武器于前不久突破美国的防空网络，击中了这一地带。\n\n原子弹爆炸的冲击波将华盛顿的大半个城区彻底化为废墟，接踵而来的高温则将剩下的另一半城区陷入火海之中。五角大楼和许多美利坚合众国联邦政府的建筑被彻底摧毁，许多还没来得及躲进核弹掩体中的人员则瞬间被夺取了生命。白宫被原子弹化为废墟，但在战争开始之初，美国政府高层便转移到了美国的深层地下军事设施进行军事指挥和最高政务决策，因此尚且可以维持美国的政府运转。\n\n美国总统在公开讲话当中表示：“这是美利坚合众国历史上最黑暗和耻辱的一天。这是我们民族有史以来最大的耻辱。我们只想求得生存和发展的权利，但是却被强权无耻剥夺。”\n\n许多国际观察家纷纷对此表示惊恐，警告拥核大国间这样公开的核子攻击将会带来不可预料的后果。但是由于世解方面的对空防御和轨道封锁，美国方面的核突击不可能发挥任何效果。"
 ChinaOSS.5.a: "新罗马将于烈焰中轰然倒塌"

 ChinaOSS.6.t: "旧金山遭遇核打击"
 ChinaOSS.6.desc: "令人震惊的消息从美国传来，就在今日，若干枚核武突破了美军在西海岸部署的反导系统网络，并直接直接命中了美国西海岸的明珠——旧金山。\n\n在核武被发射后，美国方面竟然毫无察觉，直到核导弹即将落地前，旧金山的防空部队才堂而皇之地拉响了防空警报。但此时已经为时已晚，旧金山的港口、飞机场和大半个城区已经被核武从地面上抹去，囤驻在此准备开拔的数万美国军队和无数军火也被核弹彻底摧毁。金门大桥被核武器直接炸断，坠入大海之中。核武器带来的高温还点燃了旧金山附近的山火，熊熊烈火已经将整座城市包围。目前，整座旧金山已经彻底失去了大多数对外沟通的能力，许多美国人被困在熊熊燃烧的烈焰当中无法脱身。\n\n虽然相当多的美国政客激烈谴责这次核打击，但是太约方面在亚太地区犯下的非人道罪行并没能让他们取得道德高地。尽管美国方面在世解这次核打击之前便主动发起了数次核突击的尝试，但是因为世解方面的严密防御，他们已经丧失了任何反制的能力。美国民众第一次感觉到自己离毁灭如此之近。"
 ChinaOSS.6.a: "但这次被摧毁的似乎只有他们"

 ChinaOSS.7.t: "洛杉矶遭遇核打击"
 ChinaOSS.7.desc: "当美国人铤而走险向世解发起疯的战争时，世解方面核打击的降临似乎已经成为了一个时间问题。而今日，洛杉矶的毁灭刚好成为了这一问题的答案。\n\n若干枚原子弹以迅雷不及掩耳之势突破了美军的对空防御，命中了著名的“天使之城”，洛杉矶。从拍摄的影像来看，洛杉矶的整个城区都近乎被原子弹从地面抹去，城市的交通系统已经被彻底地摧毁。洛杉矶的沙滩近乎被原子弹的高温化为玻璃。从远处拍摄的影像来看，火光和黑烟在洛杉矶的天空上交织，红色与黑色形成了一副诡异的绘画。任何想要进入洛杉矶的企图都已失败。洛杉矶已然成为一座死城。\n\n美国民众开始强烈谴责美军方面在核反击上的“无所作为”，但事实上是美军此前数次主动的核突击均在世解方面严密的防御下归于失败。绝望和恐慌的情绪笼罩在美国头上。"
 ChinaOSS.7.a: "天使堕入业火"

 ChinaOSS.8.t: "夏威夷遭遇核打击"
 ChinaOSS.8.desc: "战争这个词对于夏威夷而言既远在天边，但是珍珠港内停泊的无数海军舰船无时无刻不让战争利剑高悬于夏威夷头上。而就在今日，数枚原子弹撕开美军的对空防御系统，从天而降，命中了珍珠港。\n\n原子弹爆炸的光芒短暂地让天空陷入黑暗，数颗比太阳还要明亮数十倍的光球在珍珠港上升起，而后冲天的蘑菇云便迅速笼罩了整个珍珠港，港内的水面舰船一瞬间便被原子弹化为烟雾。待到蘑菇云散去，被冲击波掀起的海啸卷起那些幸存的船只，将它们狠狠地抛向陆地，数艘为战争刚下水没多久的战舰还没来得及完成训练就因这一次毁灭性的打击彻底葬身鱼腹。火奴鲁鲁城市的一半被核弹激起的海啸卷入海中，另一半则被化为火海。这次核打击造成的冲天烟柱和夏威夷火山的身影叠加在一起，红黑色的天空覆盖在这太平洋的十字路口上。其他岛屿试图联系瓦胡岛，但是瓦胡岛方面依然保持沉默。已经被彻底武装起来编入海军作战序列的前海岸警卫队试图前往救援，但是高强度的辐射使他们不敢向前一步。\n\n这一次核打击彻底摧毁了美国在太平洋上最重要的港口之一，让美国的太平洋舰队补给线遭到了巨大的威胁。尽管美国方面依然高调宣称：“要把发动核打击的民族彻底抹除，要让世界和平的毒瘤付出代价。”但是其核突击的尝试已经在世解方面的严密防御下化为泡影"
 ChinaOSS.8.a: "翡翠浴火"

 ChinaOSS.2.t.a: "最后手段（中国）"
 ChinaOSS.2.a.desc: ""
 ChinaOSS.2.b: ""
 ChinaOSS.2.t: "核大战"
 ChinaOSS.2.desc: "当远在太平洋的这场大战逐渐走向失控和白热化时，被封存于潘多拉魔盒中的核子恶魔终于冲出了束缚。\n\n早在战争出现如此走向的苗头时，中国方面便提出了严正的警告，警告太约方面的得寸进尺和军事的侵犯将会毁灭性的后果，但在太约拒绝了一切可能的和平要求后，核末日的降临已经箭在弦上。\n\n目前遭遇核打击的各国被毁灭性的热核武器抹去了数座要害城市，美国与中国这两个拥核大国因忌惮彼此的核战潜力从而宣布进行休战谈判。随着两大军事外交阵营的解散，这场战争由此草草画上了句号。\n\n战争还会继续爆发，但是那些被核弹毁灭的国度或许再无重见天日的机会。"
 ChinaOSS.2.c: "至少它结束了"

 ChinaOSS.104.t: "太空军核打击授权"
 ChinaOSS.104.desc: "致 中央军委联合参谋部\n\n为顺利推进战事，现已授权使用太空军的在轨部队和太空核武器打击。太空军轨道部队与太空核武器作为我军的战略性打击力量，将会在战场上对敌军产生巨大的打击，使用得当将直接扭转战场形势。\n\n我军虽有强大且先进的战略打击力量，但也绝不可有恃无恐，仍应当以最大的警惕去应对敌人的进攻，不作不必要的牺牲，不作不必要的浪费。"
 ChinaOSS.104.a: "核弹高悬昆仑巅"

 ChinaOSS.105.t: "穹盾"
 ChinaOSS.105.desc: "亚利桑那州，重新启用的泰坦II基地附近，荒漠的夜空被火光映照得亮如白昼。伴随着震耳欲聋的撕裂声，重达一百多吨的抗核爆井盖被炽热的高压燃气猛烈推开。一枚LGM-35A“哨兵”洲际弹道导弹拖拽着刺目的高能固体推进剂尾焰，从地下深处的发射井中拔地而起，直刺苍穹。\n与此同时，从怀俄明到北达科他，数百枚导弹接连升空；深海中的“俄亥俄”级核潜艇也发射出“三叉戟”导弹，人类末日似乎即将降临。\n然而，在近地轨道，一张隐秘的天基防御网络迅速苏醒。预警卫星锁定导弹红外信号，数据通过星间链路高速传输，攻击指令被精确分配至各个武器卫星。数百个激光平台在数秒内完成部署与瞄准。\n当导弹进入中段飞行阶段，天基激光同时开火。高能光束跨越数百公里精准命中目标，通过持续烧蚀破坏弹体结构。数秒之内，导弹纷纷解体。/n没有爆炸与火球，数百枚核弹头在太空中悄然失效，最终在重返大气层时燃烧殆尽，化作一场无害的流星雨。"
 ChinaOSS.105.a: "而对于美国——太空已成禁地"

