 pdto_difficulty_choose.1.t: "红色黎明游玩须知"
 pdto_difficulty_choose.1.d: "红色黎明对原版战斗机制进行了大量修改，并在此基础上增加了独特的玩法系统。改动涵盖海陆空三军，如果你是首次游玩，建议阅读以下指南了解核心机制。\n\n你可以选择翻阅完整教程，或直接跳过进入难度选择。"
 pdto_difficulty_choose.1.a: "阅读教程"
 pdto_difficulty_choose.1.b: "我是老手，直接选难度"

 pdto_difficulty_choose.2.t: "Page 1 — 剧本概述"
 pdto_difficulty_choose.2.d: "§H1.§! 台海战争前：完成20大国策后自动转入新左线，无需刻意输掉台海战争。\n§H2.§! 台海战争后：中日冷战阶段。鲁索统一美国并领导太约入侵加拿大、墨西哥和中美洲。\n§H3.§! 南海冲突：鲁索领导的法西斯美国在南海挑衅中国。中国玩家需尽快完成军事线中的导弹分支，以驱逐美国舰队。\n§H4.§! 领导世界革命：向亚洲输出革命，对抗太约不断扩大的影响力。\n§H5.§! 最终决战：与美日印澳展开横跨太平洋的血战。"
 pdto_difficulty_choose.2.a: "下一页 — 陆军指南"
 pdto_difficulty_choose.2.b: "上一页"

 pdto_difficulty_choose.3.t: "Page 2 — 陆军指南"
 pdto_difficulty_choose.3.d: "§H1.§! 美国陆军完全由装甲部队构成，数量多、质量高、侵略性极强。\n§H2.§! 自行火炮数值已回调至上版本；直升机、外骨骼装备得到额外加强。\n§H3.§! 红色黎明新增了陆军单位——合成营。军事国策点完后记得体验。\n§H4.§! 不建议干预美国内战——鲁索有新手保护期。如坚持干预，后果自负。\n§H5.§! 美国不生产火星兵，但其部队训练速度远快于正常水平。"
 pdto_difficulty_choose.3.a: "下一页 — 空军与太空军"
 pdto_difficulty_choose.3.b: "上一页"

 pdto_difficulty_choose.4.t: "Page 3 — 空军与太空军"
 pdto_difficulty_choose.4.d: "§H1.§! 红色黎明拥有独特的太空部队机制，可使用电子战、轨道轰炸、轨道投送部队等新式战术。\n§H2.§! 增加了全新的导弹装备及配套的军事工业组织。如果还没玩过原版导弹系统，建议先补课。"
 pdto_difficulty_choose.4.a: "下一页 — 海军指南"
 pdto_difficulty_choose.4.b: "上一页"

 pdto_difficulty_choose.5.t: "Page 4 — 海军指南"
 pdto_difficulty_choose.5.d: "§H1.§! 红色黎明已取消航母堆叠惩罚。\n§H2.§! 新增海军装备——武库舰导弹系统。为你的武库舰（导弹巡洋舰变体）安装真正的导弹发射器吧。\n§H3.§! 美国海军非常强大，且完全由主力舰构成。善用反舰导弹解决近海美军舰艇。\n§H4.§! 美国海军抗潜能力极强，不要依赖潜艇对其造成有效杀伤。\n§H5.§! 集中舰队使用才能对美国海军造成最大伤害。"
 pdto_difficulty_choose.5.a: "下一页 — 难度选择"
 pdto_difficulty_choose.5.b: "上一页"

 pdto_difficulty_choose.6.t: "难度选择"
 pdto_difficulty_choose.6.d: "红色黎明共有四种难度。难度决定了美国的军力规模与战斗属性：\n§H简易§! — 美国在2030年前约有400~500个装甲师，海军由2支导弹巡洋舰编队+3航母的特遣舰队组成。\n§H普通§! — 500~600个精锐装甲师，海军由3支特遣舰队组成。\n§H困难§! — 800~1000个精锐装甲师，海军由4支特遣舰队组成。\n§H极难§! — 1000~2000个精锐装甲师，海军由多支特遣舰队组成。\n精锐装甲部队属性全面提升。难度越高，美国装甲厚度越高。美军部队的软杀伤略高于高于硬杀伤，请注意针对性配置。"
 pdto_difficulty_choose.6.a: "简易 - §4「试探之战」§!"
 PTF_choose_Simple: "你们要追念往日，蒙了光照以后，所忍受大争战的各样苦难。一面被毁谤，遭患难，成了戏景，叫众人观看；一面陪伴那些受这样苦难的人。\n《希伯来书》10:32-33"
 pdto_difficulty_choose.6.b: "普通 - §8「征伐之年」§!"
 PTF_choose_Normal: "耶和华我的磐石是应当称颂的；他教导我的手争战，教导我的指头打仗。\n《诗篇》144:1"
 pdto_difficulty_choose.6.c: "困难 - §t「围困之时」§!"
 PTF_choose_Hard: "仇敌必像狮子从约旦河边的丛林上来，攻击坚固的居所。转眼之间，我要使他们逃跑，离开这地。\n《耶利米书》49:19"
 pdto_difficulty_choose.6.d: "极难 - §0「忿怒大日」§!"
 PTF_choose_Extremely_hard: "因为他们忿怒的大日到了，谁能站得住呢？\n《启示录》6:17"

 tide_of_iron: "钢铁洪流"