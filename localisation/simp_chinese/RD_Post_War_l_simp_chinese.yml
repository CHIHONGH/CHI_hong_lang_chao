l_simp_chinese:
 PRC_nl_Post_War: "战后重建"
 PRC_nl_Post_War_desc: "战争已经结束，但我们的国家满目疮痍。我们需要重建家园，恢复生产，让人民重新过上和平安宁的生活。"
 PRC_nl_Lushan_constitutional_conference: "庐山制宪会议"
 PRC_nl_Lushan_constitutional_conference_desc: "为了国家的长治久安，我们需要一部真正代表人民利益的宪法。在风景秀丽的庐山，我们将召开制宪会议，共商国是。"
 PRC_nl_clean_unhealthy_trends: "整顿不正之风"
 PRC_nl_clean_unhealthy_trends_desc: "革命队伍中出现了一些不良风气，这会侵蚀我们的事业。必须坚决予以整顿，保持党的纯洁性和战斗力。"
 PRC_nl_rebuild_people_public_prosecutor_court: "重建人民公检法"
 PRC_nl_rebuild_people_public_prosecutor_court_desc: "法律是人民的武器，是维护社会秩序的保障。我们将重建公检法系统，让法治的光辉照耀每一寸土地。"
 PRC_nl_strike_the_bell_for_the_stubborn: "为顽固分子敲响警钟"
 PRC_nl_strike_the_bell_for_the_stubborn_desc: "对于那些冥顽不化的反动分子，我们不能心慈手软。必须予以严厉打击，让他们知道人民的铁拳是无情的。"
 PRC_nl_expand_workers_struggle_rights: "扩大工人斗争权利"
 PRC_nl_expand_workers_struggle_rights_desc: "工人阶级是国家的主人，他们的权利神圣不可侵犯。我们将扩大工人的斗争权利，让他们能够更好地维护自身利益。"
 PRC_nl_serve_the_people: "为人民服务"
 PRC_nl_serve_the_people_desc: "“为人民服务”是我们党的根本宗旨。每一位党员干部都必须牢记在心，全心全意为人民谋福利。"
 PRC_nl_digital_anti_corruption: "数字化反腐"
 PRC_nl_digital_anti_corruption_desc: "腐败是社会的毒瘤，必须坚决予以铲除。我们将利用现代科技手段，建立数字化反腐体系，让腐败分子无处遁形。"
 PRC_nl_Greedy_Rats_Do_Not_Eat_My_Millet: "硕鼠硕鼠，无食我黍"
 PRC_nl_Greedy_Rats_Do_Not_Eat_My_Millet_desc: "那些贪得无厌的贪官污吏，就像偷食粮食的老鼠一样可恶。我们必须把他们揪出来，绳之以法。"
 PRC_nl_end_corruption: "终结腐败"
 PRC_nl_end_corruption_desc: "反腐斗争永远在路上。我们将以雷霆之势，彻底终结腐败现象，建设一个风清气正的社会。"
 PRC_nl_Jinggangshan_extended_conference: "井冈山扩大会议"
 PRC_nl_Jinggangshan_extended_conference_desc: "井冈山是革命的摇篮。在这里，我们将召开扩大会议，总结经验，统一思想，为新的征程指明方向。"
 PRC_nl_re_examine_political_prisoners: "复查政治犯"
 PRC_nl_re_examine_political_prisoners_desc: "过去的一些案件可能存在冤假错案，这损害了党的声誉。我们将对所有政治犯进行复查，还无辜者清白。"
 PRC_nl_punish_past_mistakes_cure_diseases: "惩前毖后，治病救人"
 PRC_nl_punish_past_mistakes_cure_diseases_desc: "对于犯了错误的同志，我们不能一棍子打死。要本着“惩前毖后，治病救人”的方针，帮助他们认识错误，改正错误。"
 PRC_nl_i_am_peoples_vote_counter: "我是人民的计票员"
 PRC_nl_i_am_peoples_vote_counter_desc: "人民的选票是神圣的。作为计票员，我将忠于职守，确保每一次选举都公平、公正、公开。"
 PRC_nl_seeking_unity_in_struggle: "在斗争中求团结"
 PRC_nl_seeking_unity_in_struggle_desc: "团结就是力量。我们要在同各种错误思想和行为的斗争中，不断巩固和加强党的团结。"
 PRC_nl_revolutionary_party_fighting_party: "革命党，奋斗党"
 PRC_nl_revolutionary_party_fighting_party_desc: "我们的党是革命的党，是奋斗的党。要永葆革命激情和奋斗精神，带领人民不断从胜利走向新的胜利。"
 PRC_nl_victory_for_all_people: "万众的胜利"
 PRC_nl_defend_socialist_motherland: "加紧保卫社会主义祖国"
 PRC_nl_long_live_world_peoples_unity: "世界人民大团结万岁"
 PRC_nl_reactionaries_are_paper_tigers: "反动派都是纸老虎"
 PRC_nl_revolutionary_fighting_spirit_high: "革命斗争士气高"
 PRC_nl_fortress_of_world_revolution: "世界革命堡垒"
 PRC_nl_victory_for_all_people_desc: "我们的胜利，是全体人民的胜利。这是人民用鲜血和生命换来的，我们必须倍加珍惜。"
 PRC_nl_defend_socialist_motherland_desc: "保卫祖国是每一个公民的神圣职责。我们将加强国防建设，随时准备粉碎一切敢于来犯之敌。"
 PRC_nl_long_live_world_peoples_unity_desc: "全世界无产者，联合起来！我们坚信，世界人民大团结的力量是不可战胜的。"
 PRC_nl_reactionaries_are_paper_tigers_desc: "一切反动派都是纸老虎。看起来样子是可怕的，但实际上没有什么了不起的力量。"
 PRC_nl_revolutionary_fighting_spirit_high_desc: "昂扬的革命斗争精神是我们战胜一切艰难险阻的法宝。要让这种精神代代相传，永放光芒。"
 PRC_nl_fortress_of_world_revolution_desc: "中国革命的胜利，极大地鼓舞了世界被压迫人民和被压迫民族的解放斗争。我们将成为世界革命的坚强堡垒。"
