 rd_nss.3.t: "绝密·情报急报"
 rd_nss.3.d.1: "抄送：中央军委联合参谋部情报局\n\n近期获悉，美东时间昨日深夜，白宫核心幕僚与国防部高层召开闭门会议。总统乔·拜登已签署代号为“烈阳斩首”的特别军事行动预案，意图彻底铲除墨西哥新近成立的革命政府。\n\n美陆军第82空降师两个旅级战斗队已向德克萨斯州布里斯堡基地暗中调动；海军“福特”号航母打击群正以“例行演习”为由驶向墨西哥湾。\n\n建议立即启动美洲局势应急响应，保护我驻墨大使馆，同时向墨西哥新政府发出预警，密切监控美军南方司令部无线电频段频次。\n\n保卫革命！保卫墨西哥人民！"
 rd_nss.3.d.2: "抄送：中央军委联合参谋部情报局\n\n近期获悉，美东时间昨日深夜，白宫核心幕僚与国防部高层召开闭门会议。总统乔·拜登已签署代号为“烈阳斩首”的特别军事行动预案，意图彻底铲除墨西哥新近成立的革命政府。\n\n美陆军第82空降师两个旅级战斗队已向德克萨斯州布里斯堡基地暗中调动；海军“福特”号航母打击群正以“例行演习”为由驶向墨西哥湾。另外，我们在美国的情报人员侦测到新型超限武器的使用迹象，美国似乎将在墨西哥首次大规模检验这些武器。\n\n建议立即启动美洲局势应急响应，保护我驻墨大使馆，同时向墨西哥新政府发出预警，密切监控美军南方司令部无线电频段频次。\n\n保卫革命！保卫墨西哥人民！"
