 rd_nss_3_tt_b: "§t“困难只存在于那些胆小鬼的心里，英雄从不向困境低头。”§!\n\n我们将押上一些筹码，更加积极地武装§G墨西哥§!做好应对@USB§2美国§!的准备。但§0战争§!如果失败，将对我们的§G士气§!造成一些§R打击§!。"
 rd_nss_3_tt_bextra: "\n由于§C全知者§!§3美国§!相比§g爱国者阵线§!的特质，这将是一门§R惩罚§!§A更高§!的§Y投资§!。"

