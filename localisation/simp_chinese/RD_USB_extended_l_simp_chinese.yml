 rd_nss.4.t: "漫长而麻木的"
 rd_nss.4.d: "杰克从自己的床上爬起来，揉了揉眼睛，薯片袋子扔的到处都是，家里到处都是白兰地和威士忌的酒瓶子，药品的罐子堆得到处都是。他感觉到脑袋里空空的，但是痛，有什么东西肿胀了起来。他捏了捏自己的肚子，惊讶于自己居然已经肿胀至此。\n\n他环顾着自己的家，自己的房间，堆积如山的垃圾、混乱的床铺、各种各样的性功能用品、cult录像带和充斥着淫秽视频的手机，最后他的目光落在了那个已经落尘的相框，那里面的小伙子长着与他相仿的面孔，有点羞涩，但是健壮脸色红润，脸上挂着自然的笑容，手上还拿着一本红色的书，上面印着一个十字架和镰刀相结合的图标。而相框旁边，浮现出了一个肿胀、面容憔悴、宛若一个土豆一样的面孔，那是他的镜子，上面也已经污秽不堪。\n\n他的呼吸开始颤抖，他感觉自己的头很痛。上周他在干什么？美国发生什么了？这几年在干什么？\n\n……"
 rd_nss.4.a: "他喘不上气了，于是向窗户扑去。"
 rd_nss.5.t: "生活"
 rd_nss.5.d: "窗帘被一把扯开，杰克发现家外面升起来了红旗，但是图案不是美国这里任何势力的——五颗星，一颗大的，四颗小的。在家外面，士兵们正在和他的邻居们打着招呼，运兵车从马路上开过，但是那些士兵却长着亚洲的面孔。他茫然地盯着街角，总感觉街角的阴影里好像少了些什么，像是眼睛，又好像是照相机，但肯定少了什么。他一脸茫然地盯着窗外。到底少了什么？他习惯性地拿起手机，想刷点什么，他感觉好像网页干净了很多，感觉好像那些新闻终于是在说一些正在他身边发生的事情——总统在绝望的战争后失踪了、美国政府崩溃了、世界解放国际的士兵们承诺会帮助美国人民重建。是的，可算有些他可以感受到的东西了。他感觉自己手机里好像也少了些什么。\n\n突然，门被敲响了，沉稳，有力。他莫名其妙地感到一阵颤抖，然后迅速举起来了双手，把手抱在头上——不，他为什么要这么做？从什么时候开始学着这样的？他走过去，拉开了门。\n\n两个戴着红袖章的美国民兵映入了他的眼中。“杰克同志，你被解放了。”一个人开口说道。解放？陌生但熟悉的词，许久未见。但是杰克点了点头。"
 rd_nss.5.a: "“是，解放了。”"

