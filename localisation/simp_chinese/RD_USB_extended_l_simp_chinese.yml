 rd_nss.1.t: "日韩海军闯入朝鲜海域"
 rd_nss.1.d: "长久以来，外界一直在猜测中美终有一战，猜忌与博弈的阴云早已笼罩亚太数十年；而今，美军航母打击群与日韩舰队一同公然出现在这片逼仄狭窄的边缘海，将最后的和平幻想撕扯殆尽。\n\n凌晨04时17分，刺耳的战备警报彻底撕碎了沿岸地下指挥所的死寂。厚重混凝土工事深处，低频的通风机嗡鸣与雷达操作员急促的呼吸声交织在一起。火控雷达的绿色荧光屏上，密密麻麻的光点正成战斗队形压向警戒基线——日本海上自卫队的宙斯盾驱逐舰与韩国海军的水面打击群已强行切入争议水域，舰载电子战系统释放的强杂波瞬间烧穿了防空监视网络，高频火控照射的啸叫在侦听耳机里如同死神的尖鸣。\n\n而美军主导的无形绞杀——针对认知与意识层面的“神经战争”——即将全面铺开。近海特种电子战飞机已经抵达了冲绳，冲突双方的网络安全部队已经在虚拟的通信世界开始了全面交锋。\n\n和平终将消逝……"
 rd_nss.1.a: "……而炮火将粉碎黑暗。"
 rd_nss_1_tt: "将由@USB§3美利坚联邦§!发起§R大亚洲战争§!。\n\n§A做好准备。§!\n\n§G和平§!时期的§Y国策§!稍后将§R不再可用§!。"
