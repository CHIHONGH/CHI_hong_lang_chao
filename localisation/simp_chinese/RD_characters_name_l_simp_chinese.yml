l_simp_chinese:
# 总理

 PRC_hog_Wang_Zhaoguo: "总理：§H王兆国§!\n\n\n\n\n\n\n\n   £GFX_portrait_PRC_hog_Wang_Zhao_guo\n\n\n\n\n\n\n\n\n-------------------------------------\n§H“起了个大早，赶了个晚集”§!\n\n§9这句话对王兆国的仕途而言算是一个很准确的描述。\n\n他生于抗战年间的河北丰润县，自幼便跟随家人在战火中苦苦求生。在共和国建立后，25岁的他从第一汽车制造厂的车间出发，一步一个脚印地向前走，凭借着自己的专业知识和基层工作经验获得了党的信赖。而后，乘着干部年轻化的浪潮，正值中年的他从企业被提拔进入到了政界，成为了共青团中央第一书记。自此，他的能力由此才真正地得以展示出来。在他的力所能及之处，他都尽力地在保护工农权益和发展经济当中进行平衡，而这也成为了他意识形态立场坚定的体现。而他本人也成为了那个时代干部年轻化运动的象征和标杆。而他的高光时刻莫过于03年被选为中华总工会的主席，在他的推动下，相当一部分劳动监督条例和农村福利政策得以落地，但他能做的毕竟有限......\n\n数十年弹指一挥间，新一届班子再次“发现”了他，并且向他抛来了橄榄枝。现在的王兆国总理虽已是耄耋之年，但他的眼睛当中仍然燃烧着青年时期的斗志。这个老人的肌肉虽已松弛，但他已决心扛起这无数华夏子女的未来......§!"

