 rd_ptf_news.2.t: "美国宣布新锐航母服役"
 rd_ptf_news.2.d: "在近日，在美国纽波特纽斯造船厂举行了一场盛大的下水典礼，亨廷顿·英格尔斯工业公司向美国海军交付了一批新锐航母，而美国现任总统鲁索出席了此次下水庆典，并发表了一次例行演讲。\n\n鲁索在讲话中表示，美利坚是被大洋环抱的国度，大洋是美利坚的城墙，而战舰便是城墙上的守卫者，只要这些战舰仍然可以严密地控制住大洋航道，那么美利坚的传统和生活方式就将屹立不倒。\n\n其实早在爱国者阵线结束美国内战后，鲁索便在国会讲话上宣布要重新刺激美国正在衰退的造船业，以此作为振兴美国传统“重要且不可或缺的一步”。为此，美国国会专门向海军拨款以建立全新的航母战斗群，以作为复兴美国造船业的举措。这一笔订单不仅包括三艘新型的航母，还包括一系列全新的大型战斗舰船。这对于许多军事观察员而言，并不是什么特别的秘密。\n\n这些航母在不久后就将投入使用，被整编进入到美国海军的战斗序列当中。所有人都心知肚明，这些航母将会被投入到远在天边的战争当中，为已经沸腾的西太平洋浇上一锅滚油。"
 rd_ptf_news.2.a: "战鼓轰鸣"

 rd_ptf_news.3.t: "美国宣布起草罗斯福法案"
 rd_ptf_news.3.d: "“多年以前，为了捍卫美国人的土地，美国人将自己的工厂贡献给了自由世界的斗争。这种举措看似是出卖美国劳动者的血汗，但是却让他们的家园免于战火的侵袭。要记住，美国绝不是与世隔绝的国家，两个大洋太宽阔，但是也很狭窄，狭窄到大洋彼岸任何一点风吹草动都将让美国的传统和安宁陷入危机。”\n\n鲁索的笔尖干净利落在这一张被称为“罗斯福法案”的纸张上写下名，由此开启了二十一世纪以来最大规模的军事物资输送活动，同时也开启了美国自二十一世纪以来最大的军火订单潮。根据白宫的说法，他们将会为“一切愿意对抗赤色恐怖分子的同道中人”提供“美利坚尽其本分的军事援助”。就在这份法案签署的当天，洛克希德·马丁公司便宣布扩张自己的战斗机制造线，并宣布在一个月内交付法案定额的相关战斗机。\n\n“真正的美国人们，你们要相信，这一份法案也并不是我们用你们的血汗钱去喂饱那些吃人肉的军工复合体和大公司，更不是用你们的血汗去滋养外国人。而是为了将大洋彼岸的邪恶匪徒扼杀。尽管我们许诺美国人优先，但是我们决不能对那些企图破坏整个世界应有秩序的势力坐视不管，当整个世界跌入火海，我们也将遭遇不幸。”鲁索在电视讲话当中毫不掩饰自己的目的，而这一次讲话也同样激起了其支持者的狂热，美国各地甚至出现了“捐赠武器”的热潮，对于那些愿意主动捐赠符合援助要求武器的居民，白宫当局将会对其进行特别嘉奖。\n\n事实上而言，这一举措并不是什么值得人大惊小怪的事情，自内战余烬当中重生的美国，必然需要一次更大规模的扩张性财政刺激来重振其产业，而战争财恰好成为了当下世界最赚钱的生意罢了。"
 rd_ptf_news.3.a: "当人意图重演历史，便是闹剧。"