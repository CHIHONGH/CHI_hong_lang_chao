l_simp_chinese:
 USA_war_with_PRC_tt: "完成§Y建设未来之军§!国策，将解锁与§R东协§!的§n最终§!§0战争§!国策树。"
 PTF_saint_george_de_dragon: "圣乔治屠龙"
 PTF_saint_george_de_dragon_desc: "中国这头重新觉醒的巨龙，自诩为被压迫者的领袖，实则是文明世界的终极威胁。正如古老传说中的圣乔治，爱国者阵线将披挂正义的铠甲，深入东方这片危险的荒野，执行这场命中注定的“屠龙”壮举。这不是一场简单的国家博弈，而是一场光与影、秩序与混乱、美洲精神与红色瘟疫之间的圣战。当我们的旗帜插在紫禁城的废墟上时，世界将见证谁才是真正的主宰。"
 PTF_king_wing_change: "王翼易位"
 PTF_king_wing_change_desc: "旧时代的华盛顿政客们早已在内战的硝烟中丧失了领导这个国家的能力。通过“王翼易位”，我们将正式完成权力的结构性重组：将脆弱的行政中枢转移到更安全的掩体与更坚固的爱国者官僚体系中。这不仅仅是一次战术性的撤退或防御，而是为了给即将到来的反攻腾出空间。让那些旧世界的残党在我们的虚招面前迷惑吧，真正的力量正在侧翼集结，准备给任何胆敢挑衅美洲主权的人致命一击。"
 PTF_king_wing_change_flag_tt: "这将锁定§Y麦克阿瑟计划§!与§Y李奇微攻势§!国策，持续§Y90§!天。"
 PTF_king_wing_change_trigger_tt: "尚未完成§Y王翼弃兵§!国策或距离完成§Y王翼弃兵§!国策已过去§Y90§!天。\n（当前剩余天数：[?PTF_king_flank_pawns_flag:days_left]）"
 PTF_alexander_re_conquest: "亚历山大再征服"
 PTF_alexander_re_conquest_desc: "世界不需要多极化的纷乱，它需要一个统一的意志。鲁索主席将继承亚历山大大帝的宏愿，在21世纪开启一场史无前例的全球扩张。我们不仅要收复在混乱中失去的影响力，更要将美洲的法律输出到每一个角落。从白令海峡到孟加拉湾，爱国者阵线的铁蹄将踏碎一切阻挠统一的壁垒。如果说第一次内战是自救，那么这场“再征服”就是我们作为新时代神选之民的成年礼。"
 PTF_operation_cross: "十字军行动"
 PTF_operation_cross_desc: "为了对抗东协那激进的革命输出，我们必须唤醒潜藏在西方骨子里的信仰力量。这一行动旨在整合北美所有的传统宗教与爱国力量，发动一场针对“革命邪教”的现代十字军东征。我们将不再回避暴力，我们将歌颂牺牲。每一个士兵都是为了文明而战的圣骑士，每一枚落向敌国的炸弹都是神圣的审判。我们将以十字之名，彻底净化太平洋对岸那片被革命毒素侵蚀的土地。"
 PTF_coordination: "子力协调"
 PTF_coordination_desc: "战争不是孤立的冲突，而是一场复杂的博弈。在整合了加拿大与墨西哥的工业潜力后，我们必须确保海、陆、空以及信息战部队能够像棋盘上的子力一样精准联动。每一枚导弹的发射都必须与宣传机器的鼓噪同步，每一处边境的推进都必须与后勤补给的节奏合拍。我们将消除军种间的隔阂，建立起一套由鲁索主席直接垂直领导的指挥链条。协同即是效率，效率即是胜利。"
 PTF_roosevelt_bill: "起草罗斯福法案"
 PTF_roosevelt_bill_desc: "这里的罗斯福并非指那个软弱的官僚，而是那位倡导“大棒政策”的猛士。该法案将确立国家对战略资源的绝对支配权，将整个北美洲转化为一座不分昼夜运作的兵工厂。我们要彻底清除自由市场的低效，取而代之的是服务于战争意志的总体战经济。所有的工厂、所有的公民、每一磅钢铁和每一滴石油，都必须打上爱国者阵线的烙印。让新时代的“大棒”跨越太平洋，去敲碎那些重走革命道路者的幻梦。"
 PTF_cincinnatus_strategy: "辛辛纳图斯方略"
 PTF_cincinnatus_strategy_desc: "托马斯·鲁索主席正如古罗马的辛辛纳图斯，在国家最危难的时刻放下了私人的平稳生活，拿起了统帅的利剑。该方略要求每一位爱国者在战时都要像公民兵一样随时响应号召，并在国家统一后回归生产岗位，但心中必须时刻保留对敌人的警惕。这是一种“全国一体，全民皆兵”的社会重构，旨在将美国打造成一个纪律严明的军事化有机体。我们虽渴望和平，但唯有通过最极端的战争准备，才能守护我们的家园。"
 PTF_fire_vestal_hearth: "维斯塔的炉火"
 PTF_fire_vestal_hearth_desc: "在古罗马，维斯塔女神的炉火象征着国家的永恒。对于爱国者阵线而言，北美的统一与繁荣就是我们必须誓死守护的圣火。为了确保这团火焰在决战期间不被熄灭，我们必须在国内实施最严格的监控与肃清。任何潜伏的间谍、失败主义者或革命同情者都将被投入火中。这种绝对的后方稳定，将支撑我们在前方进行最残酷的博弈。圣火不熄，美利坚帝国永存。"
 PTF_dance_of_mars: "马尔斯之舞"
 PTF_dance_of_mars_desc: "战神马尔斯正在战鼓声中狂欢，而我们是他在人间最完美的舞伴。这不仅是一场军事动员，更是一场社会性的战争美学崇拜。通过大规模的阅兵、极端的体能训练和全国性的军事竞赛，我们要让每一个美洲人都在肌肉的律动中感受到战争的快感。当整个国家都跟随着马尔斯的节奏起舞时，任何敌人的防御都将在这种纯粹的斗志面前瓦解冰消。\n\n§t欢迎来到§!，§0战争§!的§n新纪元。§!"
 PTF_sacrifice_attack_king: "弃子攻王"
 PTF_sacrifice_attack_king_desc: "为了彻底粉碎“东协”的顽抗，局部的牺牲是不可避免且必要的代价。我们将故意暴露一些次要的利益节点或边缘据点，引诱革命军落入精心设计的陷阱。当敌人的主力在这些诱饵面前疲于奔命、阵型拉散时，我们的精锐打击群将直取对方的指挥枢纽与政治核心。这是一种极其危险但回报丰厚的豪赌，但这正是爱国者阵线的信条：为了最终的将死，一切皆可抛弃。"
 PTF_king_flank_pawns: "王翼弃兵"
 PTF_king_flank_pawns_desc: "在太平洋的棋局上，日本及其“太约”仆从国不过是掩护我们核心利益的卒子。执行“王翼弃兵”意味着我们将允许部分战略前沿承受敌人的首轮打击，用盟友的血消耗东协的锐气。通过这种残酷的博弈，我们将筛选出真正忠诚的附庸，并迫使日本彻底倒向我们的战争机器。正如棋盘上的真理：舍弃侧翼的兵，是为了让我们的“王”在北美本土永立不败之地，并为中局的屠戮拉开序幕。"
 PTF_king_flank_pawns_trigger_tt: "尚未完成§Y王翼易位§!国策或距离完成§Y王翼易位§!国策已过去§Y90§!天。\n（当前剩余天数：[?PTF_king_wing_change_flag:days_left]）"
 PTF_king_flank_pawns_tt: "这将锁定§Y亚历山大再征服§!与§Y十字军行动§!国策，持续§Y90§!天。"
 PTF_project_macarthur: "麦克阿瑟计划"
 PTF_project_macarthur_desc: "我们从未真正离开过太平洋。麦克阿瑟将军未竟的愿望，将由爱国者阵线在21世纪彻底实现。该计划旨在建立一套从阿拉斯加延伸至东南亚的岛链封锁体系，利用核威慑与远程精准打击手段，将“东协”的力量锁死在亚洲内陆。我们将动用一切尖端科技，甚至包括那些被国际公约禁止的手段，来确保美洲秩序的火炬重新照亮东方。这一次，没有任何力量能阻止我们“重返”并统治这片海域。"
 PTF_ridgway_offensive: "李奇微攻势"
 PTF_ridgway_offensive_desc: "面对东协那看似无穷无尽的“人民革命”浪潮，我们需要李奇微式的冷静与铁血。通过建立坚固的防御地带与极其高密度的火力输出，我们要把每一场战斗都变成敌人的绞肉机。该攻势强调“磁性作战”与“火力覆盖”，不计代价地杀伤敌方有生力量。当敌人的革命热情被爱国者阵线的金属风暴撕成碎片时，他们就会明白，在纯粹的工业暴力面前，任何意识形态的狂热都不过是自寻死路。"

# 第二阶段
 PRC_Invade_America_tt: "§Y最终攻势§! - 我们将登陆西海岸迫使美国彻底投降"
 PRC_Invade_America_dec_idea: "§Y美利坚特别行动§!"
 PRC_Invade_America_dec: "§a美利坚§!最终攻势 - 最终阶段"
 PRC_operation_America_tt: "派遣§R海军陆战队§!夺取美国西雅图,旧金山城市"
 # PTF National Focus Localization
 PTF_soaring_white_eagle: "白鹰振翅"
 PTF_soaring_white_eagle_desc: "美国的象征——白头鹰，将再次展翅翱翔于太平洋上空。我们必须重振国家士气，为即将到来的挑战做好准备。"

 PTF_storming_back_into_tne_pacific: "重回太平洋"
 PTF_storming_back_into_tne_pacific_desc: "太平洋曾是我们的势力范围，现在是时候重新确立我们在这片海域的主导地位了。我们将领导太平洋条约组织，重塑地区秩序。"

 PTF_the_new_marshal_plan: "新马歇尔计划"
 PTF_the_new_marshal_plan_desc: "如同二战后的马歇尔计划重建欧洲，我们将启动新的援助计划，帮助我们的太平洋盟友重建和发展，以此巩固我们的影响力。"

 PTF_freedom_of_navgation: "航行自由"
 PTF_freedom_of_navgation_desc: "自由航行是国际贸易和海洋秩序的基石。我们将确保太平洋航道的畅通无阻，维护海上交通线的安全。"

 PTF_defeated_but_unbowed: "败而不馁"
 PTF_defeated_but_unbowed_desc: "虽然我们经历了挫折，但美国精神从未被击垮。我们将从失败中汲取教训，变得更加强大。"

 PTF_fortress_of_freedom: "自由堡垒"
 PTF_fortress_of_freedom_desc: "美国本土必须成为坚不可摧的自由堡垒。我们将加强国防建设，确保任何敌人都无法威胁我们的家园。"

 PTF_roaring_steel: "轰鸣钢铁"
 PTF_roaring_steel_desc: "美国的工业机器将再次全速运转，钢铁洪流将淹没我们的敌人。我们将动员全国的生产力量。"

 PTF_oil_the_blade: "为刃上油"
 PTF_oil_the_blade_desc: "一支强大的军队需要充足的燃料供应。我们将确保石油资源的稳定供应，为即将到来的战争做好准备。"

 PTF_project_jupiter: "朱庇特计划"
 PTF_project_jupiter_desc: "如同罗马神话中的众神之王朱庇特掌控雷电，我们将掌握最先进的军事科技，从天空降下雷霆之怒。"

 PTF_forge_the_chain: "铸牢锁链"
 PTF_forge_the_chain_desc: "我们将把太平洋盟友紧密联系在一起，形成一条坚不可摧的锁链，共同对抗任何威胁。"

 PTF_stranglehold: "扼住咽喉"
 PTF_stranglehold_desc: "我们将控制太平洋的关键航道和战略要地，如同扼住敌人的咽喉，让他们无法呼吸。"

 PTF_the_final_crusade: "最终圣战"
 PTF_the_final_crusade_desc: "这将是捍卫自由世界的最后一战。我们将集结所有力量，发动决定性的攻势，彻底击败威胁和平的敌人。"


