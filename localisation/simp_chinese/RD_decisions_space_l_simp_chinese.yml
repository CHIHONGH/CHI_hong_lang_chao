l_simp_chinese:
# 晨曦计划 — 航天决议
 PRC_asteroid_mining_programme_new_left: "小行星采矿项目"
 PRC_asteroid_mining_programme_new_left_desc: ""
 PRC_new_moon_race_programme_new_left: "新月球竞赛"
 PRC_new_moon_race_programme_new_left_desc: ""
 PRC_expand_satellite_launching_programme_new_left: "扩大卫星发射项目"
 PRC_expand_satellite_launching_programme_new_left_desc: ""
 PRC_national_orbital_strategy_committee_new_left: "成立国家轨道战略委员会"
 PRC_national_orbital_strategy_committee_new_left_desc: "我国对地球轨道的逐步开发迫使我们需要科学管理轨道资源和航天器，为此，我们将组建国家轨道战略委员会进行管理。"
 PRC_integrate_military_aerospace_new_left: "整合军工航天企业"
 PRC_integrate_military_aerospace_new_left_desc: "随着太空开发和轨道军事化的发展，我们有必要学习上世纪美国的措施，将不同的科研单位和企业整合在一个框架之下，便于进行合作。"
 PRC_expand_wenchang_launch_center_new_left: "扩建文昌发射中心"
 PRC_expand_wenchang_launch_center_new_left_desc: "现有的发射场地难以满足我们日益增长的载荷需求，我们亟需扩建各地的发射中心，而靠近赤道的文昌发射中心就是最佳选项。"
 PRC_build_jiuquan_second_launch_zone_new_left: "建设酒泉第二发射区"
 PRC_build_jiuquan_second_launch_zone_new_left_desc: "内陆发射场在保密性和全天候发射能力上具有不可替代的优势，我们需要在酒泉开辟新的发射工位，以保障军用载荷的安全与发射频次。"
 PRC_orbital_tracking_network_new_left: "建立轨道测控网络"
 PRC_orbital_tracking_network_new_left_desc: "随着在轨航天器数量的激增，仅靠地面测控站已存在诸多盲区。我们必须建立覆盖全球的星间链路测控网络，确保对所有在轨卫星和航天器的实时掌控与指挥。"
 PRC_first_gen_recon_satellite_new_left: "发射下一代侦察卫星"
 PRC_first_gen_recon_satellite_new_left_desc: "传统的侦察手段已无法满足现代战争对战场的全天候监视需求。我们将部署搭载高分辨率合成孔径雷达的新一代卫星，敌方的任何调动在我国面前无所遁形。"
 PRC_global_comm_constellation_new_left: "建立全球通信星座"
 PRC_global_comm_constellation_new_left_desc: "确保全球范围内的通信畅通是维护国家海外利益的基础。通过在低轨部署庞大的卫星集群，我们将彻底摆脱对外部通信网络的依赖，实现全球无死角覆盖。"
 PRC_beidou_military_enhanced_new_left: "建设北斗军用增强网络"
 PRC_beidou_military_enhanced_new_left_desc: "现代精确打击武器极度依赖卫星导航，为北斗系统增设军用级抗干扰与高精度增强模块，将极大提升其在全球范围内的可靠性与精确打击效能。"
 PRC_early_warning_satellite_new_left: "部署预警卫星"
 PRC_early_warning_satellite_new_left_desc: "面对日益严峻的弹道导弹与高超音速武器威胁，建立天基红外预警网络是争取战略反应时间的关键，这将为我国构筑起第一道太空防线。"

 PRC_orbital_energy_platform_new_left: "轨道能源平台"
 PRC_orbital_energy_platform_new_left_desc: "随着我们在太空中发电装机量的逐步增大，可以开始对地进行微波输电，用太空能源反哺地面的工业。"
 PRC_space_power_system_new_left: "空间电源系统"
 PRC_space_power_system_new_left_desc: "随着空间站实验载荷与高耗能设备的增加，现有的太阳能帆板已显捉襟见肘。我们必须升级轨道电源模块，为未来的定向能武器或高功率测试提供能源保障。"
 PRC_high_orbit_control_station_new_left: "高轨控制站"
 PRC_high_orbit_control_station_new_left_desc: "同步轨道的战略制高点不容有失。建立高轨控制中枢将使我国能够居高临下地俯视整个近地轨道，对敌方高价值卫星进行降维监视与战略威慑。"
 PRC_space_robotic_arm_new_left: "空间机械臂"
 PRC_space_robotic_arm_new_left_desc: "复杂的舱外组装与设备维护需要高度灵活的辅助工具。部署大型空间机械臂不仅能大幅降低航天员出舱作业的风险，更为未来捕获轨道目标奠定了技术基础。"
 PRC_auto_resupply_spacecraft_new_left: "自动补给飞船"
 PRC_auto_resupply_spacecraft_new_left_desc: "维持庞大轨道设施的常态化运转离不开高效的后勤保障。开发具备完全自主交会对接能力的货运飞船，将为太空前哨站建立起一条稳定、可靠的物资生命线。"
 PRC_orbital_ew_module_new_left: "轨道电子战模块"
 PRC_orbital_ew_module_new_left_desc: "未来的战争将首先在电磁波段打响。在轨部署大功率电子干扰阵列，能够在战时瞬间瘫痪敌方的通讯与侦察网络，夺取至关重要的制天权与制电磁权。"
 PRC_orbital_airdrop_system_new_left: "轨道空投系统"
 PRC_orbital_airdrop_system_new_left_desc: "全球快速投送能力是震慑敌对势力的杀手锏。利用再入舱段将特种武备甚至战斗人员从天而降，我们将具备在数小时内将武力精准投射到地球任何角落的能力。"
 PRC_orbital_interception_system_new_left: "轨道拦截系统"
 PRC_orbital_interception_system_new_left_desc: "面对敌方的弹道导弹和天基武器，我们必须拥有针锋相对的硬杀伤手段。部署轨道动能拦截器和天基激光器，将能够干净利落地摧毁任何敢于威胁我国国家安全的航天器。"
