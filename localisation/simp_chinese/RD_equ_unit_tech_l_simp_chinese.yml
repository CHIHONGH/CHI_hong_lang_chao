# ==================== 科技 ====================
 base_ballistic_missile: "$ballistic_missile_equipment_1$"
 improved_ballistic_missile: "$ballistic_missile_equipment_2$"
 advanced_ballistic_missile: "$ballistic_missile_equipment_3$"
 modern_air_defense_systems: "现代防空系统"
 Nuclear_Missiles: "核导弹"
 Nuclear_Missiles_desc: "配备有高当量核弹头的天基导弹。尽管是前太空时代的老旧技术，这种简单粗暴的制导武器在射程范围内有着惊人的高效。"
 ballistic_missile: "弹道导弹"
 sam_missile: "防空导弹"
 base_cruise_antiship_missile: "基础通用平台反舰导弹"
 base_cruise_antiship_missile_desc: "为水面舰艇和岸防部队配备通用的亚音速反舰巡航导弹平台，具备掠海飞行与末端机动能力，是建立现代海防打击力量的基础。"
 improved_cruise_antiship_missile: "改进通用平台反舰导弹"
 improved_cruise_antiship_missile_desc: "在基础平台上升级制导系统与发动机性能，提升射程与命中精度。改进型具有更强的抗干扰能力与掠海突防性能，可对中远距离水面目标实施可靠打击。"
 advanced_cruise_antiship_missile: "先进通用平台反舰导弹"
 advanced_cruise_antiship_missile_desc: "新一代高超音速反舰巡航导弹，采用超燃冲压发动机与乘波体气动布局，实现长时间高超音速巡航。具备极强突防能力与末端机动性，可在远距离外突破多层防御体系，对航母等高价值目标实施致命打击。"
 ASBM_launcher: "反舰弹道导弹发射器"
 nuclear_ship_engine: "水面舰艇核引擎"
 nuclear_ship_engine_desc: "以舰载压水反应堆为核心的无限续航动力方案，让重型水面舰艇与航空母舰摆脱对燃油补给线的依赖，以恒定高航速巡航于全球大洋。"
 molin_armor: "墨鳞装甲"
 molin_armor_desc: "以墨鳞为名的舰用装甲技术路线：不追求极致厚度，而是通过复合吸波结构、表面特征抑制与主动电子隐形涂层，大幅压低巨舰的雷达反射与红外信号，配合间隙装甲的卸力设计兼顾鱼雷防护。"
 electromagnetic_gun: "电磁轨道炮"
 electromagnetic_gun_desc: "电磁轨道炮是一种利用电磁力发射高速弹丸的先进武器系统。通过强大的电流在导轨间产生磁场，将弹丸加速至极高速度，实现远程精确打击。该技术不仅提高了火力打击能力，还减少了传统火药的使用，降低了后勤负担，是现代海军舰艇的重要武器装备。"
 EHIHS: "加强型抗冲击舰体结构"
 EHIHS_desc: "为护卫舰设计的增强型抗冲击舰体结构。该结构采用高强度材料和优化的几何设计，能够有效吸收和分散冲击力，提高舰艇在战斗中对抗爆炸和撞击的能力。其强化的船体框架和防护层，使护卫舰在面对敌方火力时具备更高的生存能力，确保关键系统和人员的安全。"
 tremendous_power: "雷霆万钧"
 PRC_tremendous_power_tt: "§Y雷霆万钧§!：\n舰载机夜间起降与空中交通效率大幅提升，航母战斗群在夜色与恶劣海况下仍能保持饱和出击。雷霆所至，四海皆惊。"
 exoskeleton_reinforcement: "外骨骼强化"
 unmanned_aircraft: "无人化战斗机"
 loyal_wingman_control: "忠诚僚机协同作战"
 loyal_wingman_control_desc: "忠诚僚机协同作战系统通过人工智能核心与先进数据链，实现有人战机对多架无人僚机的集中指挥与协同作战。无人僚机可自主执行侦察、突防、打击与电子压制任务，并与主机共享战场态势，显著提升机群的作战半径与生存能力。"
 integrated_electronic_warfare: "综合电子战技术"
 integrated_electronic_warfare_desc: "综合电子战技术集成了雷达侦察、通信干扰与信号欺骗能力，能够实时监测敌方电磁活动并实施定向压制。搭载该系统的平台可在复杂电磁环境中保持作战效能，削弱敌方雷达与制导武器的威胁，为机群提供隐蔽与防护优势。"
 remote_weapon_system: "遥控武器站"
 unmanned_mechanized: "智能机械步兵"
 synthetic_battalion_tech: "合成营部队编制"
 synthetic_battalion_tech_desc: "合成营是融合步兵、装甲与火力支援的现代化多兵种合成作战单位。重型合成营配备主战坦克与重型步战车，具备强大的正面攻坚能力；中型合成营以轻型装甲车辆为核心，兼顾机动与火力；轻型合成营以直升机为机动平台，擅长山地、丛林与城市等复杂地形作战。三种合成营的列装将显著提升陆军在多维战场环境下的应变能力。"

# ==================== 单位 ====================
 Space_expeditionary_forces: "太空陆战队"
 Space_expeditionary_forces_desc: "进攻部队乘坐自己的运输船并可以登陆行星作战。"
 heavy_synthetic_battalion: "重型合成营"
 heavy_synthetic_battalion_desc: "重型合成营是现代化的多功能作战单位，融合了步兵、装甲和火力支援元素。其核心特点是高度机动性与强大火力，能够在复杂战场环境中执行多样化任务，包括城市作战、野战防御以及快速突击。重型合成营通常配备先进的装甲车辆、反坦克武器和远程火力支援系统，使其在面对敌方装甲部队时具备显著优势。"
 medium_synthetic_battalion: "中型合成营"
 medium_synthetic_battalion_desc: "中型合成营是现代化的多功能作战单位，融合了步兵、装甲和火力支援元素。其核心特点是高度机动性与适度火力，能够在复杂战场环境中执行多样化任务，包括城市作战、野战防御以及快速突击。中型合成营通常配备轻型装甲车辆、反坦克武器和远程火力支援系统，使其在面对敌方装甲部队时具备一定优势。"
 light_synthetic_battalion: "轻型合成营"
 light_synthetic_battalion_desc: "轻型合成营是现代化的多功能作战单位，融合了步兵、装甲和火力支援元素。其核心特点是高度机动性与灵活战术，能够在复杂战场环境中执行多样化任务，包括城市作战、野战防御以及快速突击。轻型合成营通常配备轻型装甲车辆、便携式反坦克武器和远程火力支援系统，使其在面对敌方装甲部队时具备一定的应对能力。"

# ==================== 模块 ====================
 EQ_MOD_CAT_plane_ai_control_module_TITLE: "AI控制"
 EQ_MOD_CAT_remote_weapon_system_TITLE: "遥控武器站"
 EQ_MOD_CAT_heavy_ship_rocket_TITLE: "重型VLS装置"
 EQ_MOD_CAT_ship_rocket_TITLE: "VLS装置"
 ship_missile_launcher_1: "中型VLS装置"
 ship_missile_launcher_1_desc: "这个装置可以携带128发巡航导弹"
 ship_missile_launcher_2: "重型VLS装置"
 ship_missile_launcher_2_desc: "这个装置可以携带128发巡航导弹或64发洲际导弹"
 USA_ship_missile_launcher_1: "Mk41 垂直发射系统"
 USA_ship_missile_launcher_2: "Mk57 垂直发射系统"
 USA_ship_missile_launcher_1: "Mk41 垂直发射系统"
 USA_ship_missile_launcher_2: "Mk57 垂直发射系统"
 PRC_ship_missile_launcher_1: "HT-1型VLS装置"
 PRC_ship_missile_launcher_1_desc: "海通1型VLS装置是中国海军舰艇上用于发射各类导弹的垂直发射系统。该装置采用模块化设计，能够兼容多种导弹类型，包括防空导弹、反舰导弹和巡航导弹。其垂直发射方式使得导弹能够快速、灵活地从舰艇上发射，提升了舰艇的战斗力和反应速度。"
 PRC_ship_missile_launcher_2: "HT-2型VLS装置"
 PRC_ship_missile_launcher_2_desc: "海通2型VLS装置是中国海军舰艇上用于发射各类导弹的先进垂直发射系统。该装置在设计上进行了优化，具备更高的发射效率和更强的兼容性，能够支持多种导弹类型，包括防空导弹、反舰导弹和巡航导弹。其模块化结构使得维护和升级更加便捷，同时提升了舰艇在复杂战场环境中的作战能力。"
 ship_armor_bb_molin: "墨鳞装甲"
 ship_armor_bb_molin_desc: "以墨鳞为名的舰用装甲方案。装甲厚度并非极致，却通过复合吸波结构与主动电子隐形涂层，显著降低舰艇的雷达反射与红外特征，让巨舰在敌阵的侦测屏上若隐若现；叠加间隙装甲对鱼雷与穿甲弹的卸力设计，防护与隐蔽兼得。"
 ship_armor_shbb_molin: "墨鳞装甲"
 ship_armor_shbb_molin_desc: "为超级战舰重型化的墨鳞装甲。在不过度堆叠厚度的前提下，将电子隐形能力推向巅峰——多层吸波衬层与舰体外形共形处理，使这头巨兽在雷达屏上近乎隐身，敌人往往在炮火降临前才惊觉它的存在。"
 light_ship_nuclear_engine: "小型核动力引擎"
 light_ship_nuclear_engine_desc: "以舰载核反应堆为核心的无限续航动力系统。压水堆驱动蒸汽轮机，让轻型水面舰艇摆脱对燃料补给的依赖，以恒定高航速巡航于全球大洋——只要有水，就有航迹。"
 heavy_ship_nuclear_engine: "大型核动力引擎"
 heavy_ship_nuclear_engine_desc: "以舰载核反应堆为核心的无限续航动力系统。压水堆驱动蒸汽轮机，让重型水面舰艇摆脱对燃料补给的依赖，以恒定高航速巡航于全球大洋——只要有水，就有航迹。"
 carrier_ship_nuclear_engine: "航母核动力引擎"
 carrier_ship_nuclear_engine_desc: "为航空母舰设计的舰载核动力装置。充足的电能与永不停歇的航程让航母战斗群得以长年部署于远离本土的海域，弹射器、雷达与舰载机维护系统全天候运转——这座钢铁浮岛自此拥有了供应不尽的心脏。"
 ship_super_deck_space: "超级机库"
 ship_super_deck_space_desc: "为航空母舰设计的超大型舰载机机库。该机库采用模块化设计，能够容纳更多的舰载机，并配备先进的维护和起降系统。其宽敞的空间和高效的布局，使得舰载机能够快速起降和维护，提升了航母战斗群的整体作战效率。"
 ship_electromagnetic_gun: "电磁轨道炮"
 ship_electromagnetic_gun_desc: "电磁轨道炮是一种利用电磁力发射高速弹丸的先进武器系统。通过强大的电流在导轨间产生磁场，将弹丸加速至极高速度，实现远程精确打击。该技术不仅提高了火力打击能力，还减少了传统火药的使用，降低了后勤负担，是现代海军舰艇的重要武器装备。"
 ship_armor_cruiser_EHIHS: "加强型抗冲击舰体结构"
 ship_armor_cruiser_EHIHS_desc: "为护卫舰设计的增强型抗冲击舰体结构。该结构采用高强度材料和优化的几何设计，能够有效吸收和分散冲击力，提高舰艇在战斗中对抗爆炸和撞击的能力。其强化的船体框架和防护层，使护卫舰在面对敌方火力时具备更高的生存能力，确保关键系统和人员的安全。"
 ship_weapon_laser_system: "燎原-1舰载激光武器系统"
 ship_weapon_laser_system_desc: "燎原-1舰载激光武器系统是一种先进的定向能武器，利用高能激光束对目标进行精确打击。该系统能够在极短时间内摧毁来袭的导弹、无人机和小型水面目标，具有快速响应和高命中率的特点。其模块化设计使得维护和升级更加便捷，同时减少了传统弹药的消耗，是现代海军舰艇的重要防御装备。"
 ship_unmanned_helicopter: "舰载无人直升机"
 ship_unmanned_helicopter_desc: "舰载无人直升机是一种专为海军舰艇设计的无人飞行器，能够执行侦察、监视、目标指示和反潜等多种任务。该直升机配备先进的传感器和通信系统，能够在复杂海上环境中自主飞行，并将实时数据传回舰艇。其小巧灵活的设计使其能够在有限的甲板空间上起降，为舰艇提供了额外的作战能力和战术优势。"
 unmanned_module_small: "人工智能核心"
 unmanned_module_small_desc: "人工智能核心是一种高度智能化的计算模块，能够自主处理复杂的战术和战略任务。该核心集成了先进的算法和数据分析能力，能够实时评估战场态势、优化资源分配，并提供决策支持。其模块化设计使得在不同平台上部署更加灵活，同时具备自我学习和适应能力。"
 loyal_wingman_control_module: "忠诚僚机控制模块"
 loyal_wingman_control_module_desc: "忠诚僚机控制模块是一种先进的无人机控制系统，能够实现对多架无人机的集中管理和协同作战。该模块集成了通信、导航和任务规划功能，使得操作员能够在安全距离内远程控制僚机执行侦察、打击和支援任务。其智能化的控制算法能够根据战场态势动态调整僚机的行为，提高作战效率和生存能力。"
 integrated_electronic_warfare_system: "综合电子战系统"
 integrated_electronic_warfare_system_desc: "综合电子战系统是一种多功能的电子战平台，能够执行电子侦察、干扰和防护任务。该系统集成了先进的雷达、通信和信号处理技术，能够实时监测敌方电子活动，并对其进行干扰或欺骗。其模块化设计使得在不同作战平台上部署更加灵活，同时具备自适应能力，能够根据战场环境调整电子战策略，提高作战效能。"
 low_observability_kit: "低可探测性套件"
 low_observability_kit_desc: "通过降低雷达、红外及其他特征信号，减少飞机遭到敌方探测和锁定的机会。"
 tank_advanced_electric_engine: "先进电力引擎"
 tank_advanced_electric_engine_desc: "先进电力引擎是一种高效、环保的动力系统，利用电能驱动机械部件，实现车辆的高性能运作。该引擎采用最新的电池技术和电动机设计，提供强大的动力输出和快速响应能力，同时减少了传统内燃机的排放和噪音。适用于现代化坦克和装甲车辆，提升其机动性和战场适应能力。"
 remote_weapon_system_antiair: "高射机枪遥控武器站"
 remote_weapon_system_antiair_desc: "高射机枪遥控武器站是一种先进的远程武器控制系统，允许操作员在安全距离内远程操控高射机枪进行目标打击。该系统集成了光学瞄准、红外传感和自动跟踪技术，使得武器能够在各种环境条件下精确锁定和攻击目标。其远程操作能力不仅提高了作战效率，还增强了人员的安全性，是现代防御体系的重要组成部分。"
 remote_weapon_system_antitank: "反坦克导弹遥控武器站"
 remote_weapon_system_antitank_desc: "反坦克导弹遥控武器站是一种先进的远程武器控制系统，允许操作员在安全距离内远程操控反坦克导弹发射器进行目标打击。该系统集成了光学瞄准、红外传感和自动跟踪技术，使得武器能够在各种环境条件下精确锁定和攻击装甲目标。其远程操作能力不仅提高了作战效率，还增强了人员的安全性，是现代防御体系的重要组成部分。"
 remote_weapon_system_antiinf: "反步兵武器遥控武器站"
 remote_weapon_system_antiinf_desc: "反步兵武器遥控武器站是一种先进的远程武器控制系统，允许操作员在安全距离内远程操控反步兵武器进行目标打击。该系统集成了光学瞄准、红外传感和自动跟踪技术，使得武器能够在各种环境条件下精确锁定和攻击步兵目标。其远程操作能力不仅提高了作战效率，还增强了人员的安全性，是现代防御体系的重要组成部分。"
 remote_weapon_system_mix: "混合型遥控武器站"
 remote_weapon_system_mix_desc: "混合型遥控武器站是一种多功能的远程武器控制系统，结合了高射机枪、反坦克导弹和反步兵武器的功能。该系统允许操作员在安全距离内远程操控多种武器进行目标打击。其集成了光学瞄准、红外传感和自动跟踪技术，使得武器能够在各种环境条件下精确锁定和攻击不同类型的目标。混合型遥控武器站不仅提高了作战效率，还增强了人员的安全性，是现代防御体系的重要组成部分。"
 anti_drone_laser_system: "反无人机激光系统"
 anti_drone_laser_system_desc: "反无人机激光系统是一种高能定向能武器，除了能够摧毁来袭的无人机外，还能损坏敌方的观瞄设备。该系统利用高能激光束对目标进行精确打击，具有快速响应和高命中率的特点。其模块化设计使得维护和升级更加便捷，同时减少了传统弹药的消耗，是现代防御体系的重要组成部分。"
 GL7_active_protection_system: "GL7主动防护系统"
 GL7_active_protection_system_desc: "GL7主动防护系统是一种先进的防护技术，旨在保护装甲车辆免受来袭导弹和火箭弹的威胁。该系统通过雷达和传感器实时监测周围环境，并在检测到威胁时自动发射拦截装置，摧毁来袭的弹药。GL7系统的快速反应能力和高效拦截性能，使其成为现代装甲车辆的重要防护装备，显著提高了车辆在战场上的生存能力。"
 tank_high_velocity_cannon_4: "140mm滑膛炮"
  tank_high_velocity_cannon_4_desc: "140mm滑膛炮是一种高威力的坦克主炮，采用滑膛设计以提高弹药的初速和穿透力。该炮能够发射多种类型的弹药，包括穿甲弹、破甲弹和高爆弹，适应不同战场需求。其先进的火控系统和稳定的射击平台，使得坦克在远距离作战中具备卓越的打击能力，是现代装甲部队的重要火力支撑。"

