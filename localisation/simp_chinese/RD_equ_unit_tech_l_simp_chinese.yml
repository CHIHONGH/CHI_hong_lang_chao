# ==================== 科技 ====================
 base_ballistic_missile: "$ballistic_missile_equipment_1$"
 improved_ballistic_missile: "$ballistic_missile_equipment_2$"
 advanced_ballistic_missile: "$ballistic_missile_equipment_3$"
 modern_air_defense_systems: "现代防空系统"
 Nuclear_Missiles: "核导弹"
 Nuclear_Missiles_desc: "配备有高当量核弹头的天基导弹。尽管是前太空时代的老旧技术，这种简单粗暴的制导武器在射程范围内有着惊人的高效。"
 ballistic_missile: "弹道导弹"
 sam_missile: "防空导弹"
 base_cruise_antiship_missile: "基础通用平台反舰导弹"
 base_cruise_antiship_missile_desc: "为水面舰艇和岸防部队配备通用的亚音速反舰巡航导弹平台，具备掠海飞行与末端机动能力，是建立现代海防打击力量的基础。"
 improved_cruise_antiship_missile: "改进通用平台反舰导弹"
 improved_cruise_antiship_missile_desc: "在基础平台上升级制导系统与发动机性能，提升射程与命中精度。改进型具有更强的抗干扰能力与掠海突防性能，可对中远距离水面目标实施可靠打击。"
 advanced_cruise_antiship_missile: "先进通用平台反舰导弹"
 advanced_cruise_antiship_missile_desc: "新一代高超音速反舰巡航导弹，采用超燃冲压发动机与乘波体气动布局，实现长时间高超音速巡航。具备极强突防能力与末端机动性，可在远距离外突破多层防御体系，对航母等高价值目标实施致命打击。"
 ASBM_launcher: "反舰弹道导弹发射器"
 tremendous_power: "雷霆万钧"
 unmanned_aircraft: "无人化战斗机"
 unmanned_mechanized: "智能机械步兵"
 synthetic_battalion_tech: "合成营部队编制"
 synthetic_battalion_tech_desc: "合成营是融合步兵、装甲与火力支援的现代化多兵种合成作战单位。重型合成营配备主战坦克与重型步战车，具备强大的正面攻坚能力；中型合成营以轻型装甲车辆为核心，兼顾机动与火力；轻型合成营以直升机为机动平台，擅长山地、丛林与城市等复杂地形作战。三种合成营的列装将显著提升陆军在多维战场环境下的应变能力。"

# ==================== 单位 ====================
 Space_expeditionary_forces: "太空陆战队"
 Space_expeditionary_forces_desc: "进攻部队乘坐自己的运输船并可以登陆行星作战。"
 heavy_synthetic_battalion: "重型合成营"
 heavy_synthetic_battalion_desc: "重型合成营是现代化的多功能作战单位，融合了步兵、装甲和火力支援元素。其核心特点是高度机动性与强大火力，能够在复杂战场环境中执行多样化任务，包括城市作战、野战防御以及快速突击。重型合成营通常配备先进的装甲车辆、反坦克武器和远程火力支援系统，使其在面对敌方装甲部队时具备显著优势。"
 medium_synthetic_battalion: "中型合成营"
 medium_synthetic_battalion_desc: "中型合成营是现代化的多功能作战单位，融合了步兵、装甲和火力支援元素。其核心特点是高度机动性与适度火力，能够在复杂战场环境中执行多样化任务，包括城市作战、野战防御以及快速突击。中型合成营通常配备轻型装甲车辆、反坦克武器和远程火力支援系统，使其在面对敌方装甲部队时具备一定优势。"
 light_synthetic_battalion: "轻型合成营"
 light_synthetic_battalion_desc: "轻型合成营是现代化的多功能作战单位，融合了步兵、装甲和火力支援元素。其核心特点是高度机动性与灵活战术，能够在复杂战场环境中执行多样化任务，包括城市作战、野战防御以及快速突击。轻型合成营通常配备轻型装甲车辆、便携式反坦克武器和远程火力支援系统，使其在面对敌方装甲部队时具备一定的应对能力。"

# ==================== 模块 ====================
 ship_missile_launcher_1: "HT-1型VLS装置"
 ship_missile_launcher_1_desc: "海通1型VLS装置是中国海军舰艇上用于发射各类导弹的垂直发射系统。该装置采用模块化设计，能够兼容多种导弹类型，包括防空导弹、反舰导弹和巡航导弹。其垂直发射方式使得导弹能够快速、灵活地从舰艇上发射，提升了舰艇的战斗力和反应速度。"
 ship_missile_launcher_2: "HT-2型VLS装置"
 ship_missile_launcher_2_desc: "海通2型VLS装置是中国海军舰艇上用于发射各类导弹的先进垂直发射系统。该装置在设计上进行了优化，具备更高的发射效率和更强的兼容性，能够支持多种导弹类型，包括防空导弹、反舰导弹和巡航导弹。其模块化结构使得维护和升级更加便捷，同时提升了舰艇在复杂战场环境中的作战能力。"
 ship_armor_bb_xuanwu: "玄武装甲（战列舰）"
 ship_armor_bb_xuanwu_desc: "以传说四象之玄武为名的重型复合装甲。层叠的合金板与间隙装甲在舰体外壳下构成龟甲般的防护网络，大幅降低敌方穿甲弹与鱼雷的致命一击概率，令战列舰在炮火中岿然不动。"
 ship_armor_shbb_xuanwu: "玄武装甲（超级战列舰）"
 ship_armor_shbb_xuanwu_desc: "为超级战列舰量身打造的极限防护方案。在玄武装甲的基础上进一步加厚合金层，将整舰包裹在近乎不可摧毁的装甲壁垒之中——当这样的巨兽碾入战场，敌人的弹雨只会在龟背般的坚壳上迸出徒劳的火星。"
 heavy_ship_engine_nuclear: "核动力推进系统（重型舰）"
 heavy_ship_engine_nuclear_desc: "以舰载核反应堆为核心的无限续航动力系统。压水堆驱动蒸汽轮机，让重型水面舰艇摆脱对燃料补给的依赖，以恒定高航速巡航于全球大洋——只要有水，就有航迹。"
 carrier_ship_engine_nuclear: "核动力推进系统（航空母舰）"
 carrier_ship_engine_nuclear_desc: "为航空母舰设计的舰载核动力装置。充足的电能与永不停歇的航程让航母战斗群得以长年部署于远离本土的海域，弹射器、雷达与舰载机维护系统全天候运转——这座钢铁浮岛自此拥有了供应不尽的心脏。"
 unmanned_module_small: "无人化模块"
 unmanned_module_small_desc: "无人化飞行器的核心组件，能够将传统有人驾驶飞行器改装为无人驾驶版本。该模块集成了先进的自动飞行控制系统、传感器和通信设备，使得飞行器能够在没有人类操作员的情况下自主执行任务。"

