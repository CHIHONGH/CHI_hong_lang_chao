 nlnews.556.t: "南亚剧变"
 nlnews.556.d: "南亚次大陆的政治地震已然结束，短短数月间，南亚的政治格局被彻底改写，世界解放国际与太平洋防卫条约的政治博弈，以前者的完胜宣告终结。\n在喜马拉雅山脉两侧，尼泊尔共产党迅速清洗了党内修正分子，并在议会中夺取了政权。与此同时，不丹王国内部政变爆发，不丹共产党推翻了延续百余年的王室统治，宣布成立不丹人民共和国。\n在南方，在经历长期经济危机后，斯里兰卡政府宣布加入世界解放国际，而在孟加拉，起初被低估的工农运动如燎原之火迅速蔓延，仅用了不到三个星期，孟加拉红军就进入了达卡，建立了孟加拉人民共和国。新政权迅速获得世解承认并加入该组织，成为南亚革命的又一个标志性成果。\n巴基斯坦政坛更是风云突变。新成立的人民阵线在一场提前的大选中凯旋，以压倒性优势赢得议会多数席位。新总理公开承诺要进行一系列左翼改革，并正式宣布加入世界解放国际。\n然而，印度政府并无余力为自己的前哨被拨除而哀悼。印度境内，气氛正日益紧张。印度共产党（马克思主义）内部革命派重新掌权，与印度共产党（毛主义）达成历史性和解，结束了长达数十年的分裂局面。印共毛在中部和东部邦区的武装活动日益频繁且组织有序，尽管印度政府在报纸竭力鼓吹反叛乱部队一次又一次的大胜，但其从东方败退回的“甲仗不全”的部队已无声地告知了真相。\n国际观察家普遍认为，南亚局势的急剧变化，标志着世界解放国际与太平洋防卫条约在亚洲博弈中的重要转折点。这场无硝烟的战争，已然以世解的完胜告终。南亚的红色浪潮，或将成为太约彻底崩碎的前奏。"
 nlnews.556.a: "巨象已经彻底陷入囚笼……"
 nlnews.557.t: "苦行终止"
 nlnews.557.d: "黎明的曙光穿透东南亚的雨林，照亮了这片饱经沧桑的土地。世界解放国际彻底砸碎了太平洋防卫条约组织精心构筑的棋盘，终结了东南亚革命者的近百年的苦行。\n从密林中走出的各国共产党残部，踏过了湄公河畔，走出了群岛密林。在数十年前被强行压下的烈火，在赤红浪潮中再次升腾，从曼谷到河内，从雅加达到吉隆坡，整个腐朽的东南亚旧秩序被付之一炬。昔日的暴君，寡头与屠夫们，如今在革命的号角声中迎来属于自己的审判。\n而与此同时，太平洋防卫条约正悲哀地发现，己方在东南亚精心经营多年的成果也随着东南亚旧政权的倾覆而付诸东流，那个基于旧第一、第二岛链基础构建的海上包围网，如同一张残破的蛛网，被赤浪打得粉碎并将太约在地理分割成三个版块，再难以形成有效的军事协同。\n就连对世解抱有最大敌意的国际战略专家也不得不承认，太约的惨败已成定局。"
 nlnews.557.a: "胡志明，艾地，陈平，…….你们终于可以含笑九泉了..."
 nlnews.1.t: "印度尼西亚内战结束！"
 nlnews.1.d: "世界上最大的群岛国家终于走到了历史的十字路口。长达数年的印度尼西亚内战，让这片绵延数千公里的热带群岛血流成河。雅加达的街头曾燃烧过火焰，苏门答腊的丛林里曾响彻枪声，婆罗洲和苏拉威西的村庄也曾被战火反复蹂躏。旧政府依靠军阀与财阀勉力维持，而人民军则在岛屿间如烈火般蔓延，每一个穷苦人都是潜在的人民军，每一个工农兵都是未来的革命者，腐朽反动的政府显然并不能战胜占据全国绝大多数的贫苦人民。\n最终，胜利属于那些手握锈旧步枪、却有着永不服输的意志的革命者。随着印度尼西亚首都雅加达易手，人民军的红旗在国会大厦上空展开，宣告了旧秩序的覆灭。新的政权声称要在数千岛屿间建立统一的工农共和国，以人民的名义重塑印尼这个千岛之国。\n北京和世界解放国际的电报第一时间抵达雅加达，称这是“东南亚历史性的一天”。在解放国际的会场上，越来越多的声音开始谈论是否应将这个庞大的群岛国家纳入共同的革命阵线，成为南洋最重要的支柱之一，以及北京与其他社会主义盟友将为这个新生的步履蹒跚的赤色政权提供怎样的援助。\n而在东京都的会议室里，气氛则凝固到了冰点。太平洋防御公约痛失印度尼西亚这个战略枢纽，印尼的“沦陷”意味着从马六甲海峡到太平洋的航道再也不稳固，太约在地理上被分割为了南亚与与西太平洋两大战场，以至于印度与日本必须各自为战，无法顾及彼此。日本与澳大利亚的政客怒斥新政权“以恐怖统治为基础”，并呼吁加快在印太地区的再军事化。\n群岛的烈火已成燎原之势，赤色浪潮一浪高过一浪，在旧秩序的统治者惊恐的眼神中，太平洋正在燃烧。\n"
 nlnews.1.a: "万里江山红遍！"

 nlnews.2.t: "菲律宾内战结束！"
 nlnews.2.d: "长达数年的菲律宾内战终于迎来了终局。在铁与火的洗礼下，何塞·玛利亚·西松和他的同志们率领新人民军冲出菲律宾的崇山峻岭与原始森林，以摧枯拉朽之势彻底击溃了马库斯家族腐朽的反动政权。残破的宫殿、逃亡的权贵、崩溃的军阀，旧菲律宾的一切统统在人民的怒火前沦为了昨日的灰烬。如今，马尼拉已经高高飘扬起了象征革命的红旗。\n中国与其盟友们组成的世界解放国际对此发出热烈祝贺，称这是“亚洲又一片土地回归人民之手”。在上海的会场上，与会各国正在热切讨论关于菲律宾是否能作为“大中国的小朋友”加入世界解放组织，并积极为之努力。革命的火炬正在跨越南海，点燃新的希望，在东南亚渐成星火燎原之势。\n然而，在西太平洋的另一边，以日本为首的太平洋防御公约组织则陷入沉默。菲律宾的倒戈意味着他们在东南亚失去了一个至关重要的盟友与军事支点。媒体和政客们开始口诛笔伐，指责新政府“侵犯人权”“实行政治清洗”，并警告这将是“区域稳定的重大灾难”。但这些声音更像是失败者对于自己无能的苍白辩驳而非有理有据的批评。\n红色群岛矗立在太平洋的风浪之中，它的命运，已经与亚洲千千万被压迫的人民紧紧联系在一起。"
 nlnews.2.a: "欢迎新同志加入我们的大家庭！"

 nlnews.3.t: "马来西亚内战结束！"
 nlnews.3.d: "看来赤道之南的马来西亚的命运终于走向了决定性的时刻。多年的内战，将这片富饶的土地撕裂为对立的阵营：一边是依靠财团与太约当局支持的反动当局；另一边，则是由工农群众和知识分子汇聚而成的人民武装。血与火的较量，最终在吉隆坡的废墟中分出了胜负——人民群众的声浪显然压过了反动派的哀嚎。\n\n随着最后一批政府军部队宣布投降，人民军高举的红旗在双子塔上迎风猎猎。新的政权声称，这片热带大地终于摆脱了殖民的枷锁与资本的压迫，将以“人民的意志”为唯一准绳，建设一个属于工人和农民的马来西亚。\n\n世界解放国际第一时间发来贺电，北京方面称其为“又一个南方兄弟站了起来”，并积极回应这个赤道上的新伙伴加入世界解放国际的强烈意愿。世界解放的烈火，正在以惊人的速度扩展。\n\n反观彼方，太平洋防御公约组织却哀叹失去了又一个战略要地。新加坡的媒体与东京的政客口诛笔伐，控诉新政府“以暴力维系统治”“践踏人权”。但他们的愤怒更像是失去了棋子的怨恨，而非真正在乎千千万万马来西亚普通人的死活。\n\n马来西亚的未来，注定不再是旧世界的附庸，而是新世纪的缔造者，工农世纪，人民世纪的主角之一。"
 nlnews.3.a: "新的同志，新的希望"
 
 nlnews.4.t: "日本宣布进入永久战备状态"
 nlnews.4.d: "为了应对日益增长的共产主义威胁，特别是来自中国的共产主义扩张，日本政府今日宣布国家进入永久战备状态。首相在国会演说中强调，面对意识形态的侵蚀和地区不稳定的加剧，日本必须采取果断措施，以捍卫国家主权、民主价值观和地区和平。\n该声明授权政府实施一系列紧急措施，包括扩大自卫队规模、增加国防预算、加强与盟国的军事合作以及动员关键工业部门以支持国防建设。政府发言人表示，这些举措旨在威慑潜在的侵略，并确保日本有能力应对任何突发事件。\n在国内，民众情绪复杂。尽管许多人支持政府的强硬立场，认为这是保卫家园的必要手段，但也有和平主义者和反战团体举行抗议，呼吁通过外交途径解决争端，避免重蹈历史的覆辙。\n无论如何，日本已经迈出了决定性的一步。这标志着其战后和平主义政策的重大转变，也预示着亚太地区地缘政治格局的深刻变化。未来，这片曾经饱受战火蹂躏的土地，将何去何从，全世界都在拭目以待。"
 nlnews.4.a: "尊皇讨奸"
 nlnews.4.b: "那头残暴的鬼子回来了……."

 nlnews.5.t: "印度共产党宣布介入大亚洲战争！"
 nlnews.5.d: "在今日，以原印度共产党（毛主义）在印度东北部地区所组建的“印度民主联合政府”向印度全国进行了一次电视直播。在这次直播当中，其政府领袖痛斥了印度当局的腐败无能和他们对印度全国人民的压榨，并且强烈谴责了印度当局组建的历年以来对“解放区”军民的残忍屠杀和愚蠢的战争行为。在谴责过后，其电视发言人宣布彻底解放全印度人民的时刻已经到来，零星的游击战已经全面升级为彻底的内战。“这场战争已经到了最白热化的地步，我们只有两个选择，要么解放印度，要么彻底失败。而失败不属于我们”。在此发言的同时，印度共和国和纳萨尔派控制区的对峙前线不断传来零星的交火报告，来自其印度东北部大量的军事调动报告也在不断地传来。\n\n华盛顿方面对此表示不屑一顾，认为这不过是印度国内的一次小小叛乱的升级，并承诺自己将很快予以镇压；东京和墨尔本方面对此表示严重关切，并且严厉谴责了中国煽动他国动乱的行为；而新德里方面则反应激烈，其不仅指责这次内战是“共产主义者及其外国主子蓄意煽动的内乱”，并且还表示“这暴露了共产主义者的卖国本性，他们随时都准备把自己的祖国卖个好价钱”，但与此同时，印度立刻宣布了有史以来最为严厉的戒严措施和抓捕行动。印度当局宣布其军警有权利援引特别法案直接逮捕他人，并且有权直接处决被拘捕者。虽然纳萨尔派并不在世界解放阵线之内，但世界解放阵线各国仍然纷纷对印度纳萨尔派的宣言表示支持和声援。\n\n无论如何，有一点可以确认，印度方面将不仅仅面对着来自中国及其盟友的军事压力，其内部也将面临着来自其国内革命势力带来的政治风险。如果印度内战的情况发生在太约其他国家，对其战争决心的打击将会是毁灭性的。"
 nlnews.5.a: "天竺浴火……"

 nlnews.6.t: "印度共产党加入世界解放阵线！"
 nlnews.6.d: "在整个亚洲的战火愈演愈烈的时候，中国为协调自己盟友的军事行动，特意在北京召开了世界解放阵线的联合军事会议。在这场会议上，除却几个新加入世界解放阵线的盟友以外，最令人瞩目的势力莫过于印度毛派，也就是所谓的纳萨尔派。\n\n作为印度境内长期活跃的红色武装力量，纳萨尔派曾经在印度当局的残酷打击下多次陷入生死存亡境地。就在众人认为南亚次大陆上最后的红色势力也将要陷入沉寂之时，纳萨尔派却出人意料地杀出地狱，并且重创了印度当局，还在现在极度不稳定的印度国内掀起了一波又一波的革命浪潮。他们还成功地在印度的东北部地区建起来了一个稳定的政权，并且还顺利地推行了自己许诺已久的激进社会变革政策。\n\n这一异军突起的红色势力与中国一直保持着紧密的联系，在其顺利地建立印度东北部政权后，中国便立刻对其予以了承认，并且还和其签订了许多互惠互利的外交条约，并且中国还派出志愿者和军事顾问去为纳萨尔派建立一支真正意义上的革命军队。尽管纳萨尔派虽然出于政治考虑的原因并没有立刻作为一个政权实体加入中国领导下的世界解放阵线，但是在亚洲战火滔天的现在，纳萨尔派加入中国一方已经成为了对其最有利的外交选择。因此，在印度内战全面爆发后，其加入世界解放阵线是不值得惊讶的事情。\n\n当新闻记者将印共毛领导人在北京与中国领导人握手的照片拍下来时，全世界所有国家都已明了了这样一个事实：纳萨尔派的印度内战，不仅仅是南亚次大陆的革命斗争，而是国际性的革命斗争。"
 nlnews.6.a: "东风将火星吹成燎原烈火。"

 nlnews.7.t: "日本鹿儿岛发生起义！"
 nlnews.7.d: "在前几日，鹿儿岛地区的码头工人为抗议日本当局的战争行为而发起的罢工遭遇了日本自卫队的血腥镇压。这一血腥行径极大地激起了鹿儿岛地区平民百姓的愤怒，原本和平的罢工立刻升级为群众与日本军警的对峙，并在近日彻底升级为激烈的交火。\n\n根据当地居民拍下的画面，戴着红袖章和红围脖的武装分子领导着武装平民在凌晨突袭了当地驻军的营地，当地驻军在睡梦当中被俘虏并被人缴械。部分军警撤入当地政府大楼企图顽抗，但是其简易阵地被武装分子制作的火箭弹炸毁。武装分子组成的突击队立刻一拥而入，并在激烈交火后于县厅上升起红旗。而后这些武装分子便立刻召开了动员大会，宣布成立“日本红军”。\n\n而在这一起义发生后不久，长期潜伏的日本左翼势力宣布对此次起义负责。他们严厉谴责了日本当局的执迷不悟，他们公开表示：“我们曾经试图以和平的方式阻止日本陷入战火，而现今我们的和平努力失败了；所以这一次我们将用炸弹和步枪去为日本争取和平。”在这次宣言的末尾，他们向全日本发出号召，在这样的战争情况下，日本人唯一能做的，便是彻底推翻这个腐败无能的、不断地为日本人民和亚洲人民带来痛苦的旧日本，用自己的双手缔造一个真正意义上的独立自主、爱好和平的新日本。\n\n日本方面对此次起义出乎意料地保持了沉默，对于日本当局而言，这一切早就在他们不顾一切地再军事化的时候就已经注定。但无论如何，这一次起义如果顺利成长，将会对太约在西太平洋上的重要基地带来一次巨大的毁灭。"
 nlnews.7.a: "止戈为武。"

