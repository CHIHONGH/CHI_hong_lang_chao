 rd_vietnam.1.t: "越南的红色之夏"
 rd_vietnam.1.d: "对于越南人而言，金融海啸让这些身处北回归线以南的人民感觉到了刺骨的寒意——投资萎缩、资本外逃、出口损毁，这些事件让越南的经济陷入到了严重的困境之中。而越南社会内部的矛盾终于在此刻爆发。\n\n河内一工厂的工人因工厂主破产后拒绝发放遣散费与结算工资，直接行动起来驱逐了管理层；这一行动通过越南国内的网络迅速如病毒一般扩散到了越南各处。贫困的劳农与学生纷纷效仿这一夺厂运动，驱逐经营不善的厂长。而即便是国营工厂都无法幸免。而夺厂运动的发展立刻激发了一些民间左翼分子的活跃，“再走社会主义道路”，成为了重要口号。\n\n而越南的北方派官员虽然嘴上要求对这些工人进行稳控，但是却并没有实质地阻碍工人的行动，他们试图放任这一行动的发生，并将其作为对南方派的一个重要打击手段。\n\n与北方派的态度不同，南方派所控制的媒体大肆攻击““激进分子”正在威胁公民财产安全。而南方市民也在集体地抵制北方工人生产的产品，据报道，部分地带甚至发生了群体性互殴事件。\n\n对于部分人而言，这不禁让人想起了意大利的红色二年，而类似的事情正在越南重演。"
 rd_vietnam.1.a: "越南走到了十字路口。"
 rd_vietnam.2.t: "越南申请经济援助"
 rd_vietnam.2.d: "对东盟国家而言，美国的崩溃之后的日子无疑是黑暗的。美国市场的崩溃、国际投资的回流已然让他们的经济命悬一线；而中国经济的转向、接踵而至的台海战争则进一步地摧残了他们的出口市场。而其中，日子最不好过的莫过于越南。\n\n这个中南半岛上的小巨人自革新开放以来便将自身的经济深度捆绑于西太平洋贸易、代加工和劳务输出之上。而随着经济形势的恶化，越南的北方工人们主动发起了夺厂运动，从一开始的占领外逃资本家的工厂，到后续则逐步地发展为了要求惩办“无能干部”和“黑专分子”并“发展真正的社会主义”，这些北方工人的行动虽然深深地冲击了越南的社会安定，但是部分越南的基层干部却将其视为工人阶级的“伟大自救”。\n\n目前，这一工人运动已经深刻地撕裂了越南社会。南方派官员和南方市民将其视为一次暴动，对其夺厂行动深恶痛绝，并且开始有组织地断绝这些工人控制工厂的贷款和市场。而北方派则向我们求援，申请我国对他们的农业与工业进行投资，签署新的贸易协定，并许诺搁置南海问题，承认我国西沙群岛的主权，并签署共同开发协议和新贸易。\n\n从经济上看，同越南工人的贸易有利于我国在纷繁复杂的环境下寻找到一个更加可靠的经济盟友。从政治上看，目前主政越南的是旧北方派的掌门人阮仲富，优惠政策有可能带来一个潜在的盟友——只是目前我们自己都顾及不暇，还能够挤出余钱去帮助他们吗？"
 rd_vietnam.2.a: "没钱撒，老乡你自求多福吧。"
 rd_vietnam_2_a_tt: "越南社会的§0动荡§!将§R加剧§!。"
 rd_vietnam.2.b: "安排一场会议。"
 rd_vietnam_2_b_tt: "§Y他们应该知道自己需要做什么……§!"
 rd_vietnam.3.t: "深化熔炉运动"
 rd_vietnam.3.d: "最近，越南共产党的总书记阮仲富就越南社会目前的系列动荡问题发表了讲话。\n\n在讲话中，阮仲富先是感谢了越南基层干部和警方对于越南基层稳定作出的努力，强调了越共中央坚持革新开放事业的决心；但是他随即话锋一转，开始大力地指责“资产阶级自由化分子”和“背弃了人民的贪污分子”正在蛀空越南社会稳定的根基，这些人需要为今天的乱局负责。这一严厉的措辞后，随即则是越共中央深化熔炉运动的决定，誓要彻底扫清社会的动乱和腐败，恢复社会主义道路的稳定。\n\n先前，阮仲富便以“熔炉运动”清扫了大批南方派腐败政要，严厉地打击了其经济网络，进一步巩固了北方派在党内的权威。就目前而言，在越南社会进一步撕裂的状况下，彻底决定好“以后走什么样的道路”已经成为了越南共产党内的唯一共识。过去老一辈越共政治家所构造的政治平衡已经被打破，越南北方派和南方派，乃至于越南北方工人和南方市民的最终决斗在此刻吹响号角。在这场决斗中，只能有一个赢家。成王败寇，越南的未来即将在这场运动中见分晓。"
 rd_vietnam.3.a: "烈火锻造真金，还是烧得只剩下灰烬？"
 rd_vietnam_4_fake_title: "来客"
 rd_vietnam.4.t: "苏林申请清查资本联系"
 rd_vietnam.4.d: "近日，时任越南公安部长的苏林以及其亲信通过秘密渠道与我们进行了一次隐秘的会晤。\n\n在会晤中，他开门见山地提到越南警方目前已经掌握了一个跨国腐败网络的初步面貌，其涉及到一个通过香港、新加坡等系列金融中转地带的各类灰黑色交易活动，而他有充足的理由相信这一张交易网络的背后受益者和庇护者正是越南的南方系官员。但苦于这些官员善于利用多个跨国公司和空壳信息用以掩盖自身交易痕迹，故而他请求中越双方整合目前所有的线索，用以进行对于南方寡头的调查行动。他希望中越双方可以共同进行信息和资本截流体系，以确保跨国资本寡头难以外逃，延续熔炉运动的步伐。并且他还希望中国可以通过部分渠道，去制造针对这些腐败分子的负面新闻。\n\n苏林，这一政治新星，他明面上是由北方派阮仲富在熔炉运动伊始提拔的反腐利刃，实际上同越南传统势力中的军方也有深刻联系。在对于外交的态度上，这位公安部长秉承着实用主义的态度了。在会晤的最后，他十分委婉地提到了北方派官员们的困境以及南方派官员同日本和澳大利亚的亲密关系，并暗示了这次调查行动对越南政局的重大影响。假若说不能让北方派上台，那么也至少不能让一个敌视中国、并且可能对华挑起战争的派系上台。\n\n问题是，这会不会造成其他后果呢？"
 rd_vietnam.4.a: "给这位沉默的兴安汉子搭把手。"
 rd_vietnam_4_a_tt: "§A军警§!出身的§t苏林§!会获得§Y权势§!。\n\n§t苏林§!将保持中立，不会加入§t东协§!或§3太约§!的任何一方。"
 rd_vietnam.4.b: "出身军警系统的人搞反腐？逗我笑呢！"
 rd_vietnam_4_b_tt: "越南的社会将会走向§0崩溃§!。"
 rd_vietnam.5.t: "越南北方派稳坐王位"
 rd_vietnam.5.d: "随着以武文赏发挥了领导作用的新一任政府所代表的新一代北方派粉墨登场，在旧北方派掌门人阮仲富去世后牢牢占据了政府机关和工厂间大大小小职位，在这个号称龙的子民的国度迎来了久违的一派独大，打破了先前政治制衡的惯例。\n\n新北方派由何构成也？他们有深刻学习北方大国新路线经验的事大主义者，有根植于民众，反对寡头垄断的民族民粹主义者，还有新生代一边摸索一边尝试回答时代之问的劳农和学生，他们在全球化新自由主义秩序破碎后，怀揣着对生活和国家的虔诚进行了无边际的探索。以武文赏为首，背后似有庞然大物站台的新北方派成功稳定了经济，在政治上沿袭并深化了旧北方派掌门阮仲富发起的“熔炉运动”，将反对“劳农革新开放”的南方派和军阀利益集团一扫而空，巩固了党内的权威。\n\n而今，北方派的“皇长孙”武文赏终于顺利“登基”，都将权力顺利下放到了新生代的继任者手中，虽有传言他罹患癌症，命不久矣，此刻的越南却一片欣欣向荣之景。昔日由党阀，财阀，军阀在越南上空笼罩的浓云厚雾中，终有几道薄光刺破云层，洒在了辛劳的劳农们皲裂的面庞上。"
 rd_vietnam.5.a: "胡志明含笑九泉。"
 rd_vietnam.6.t: "越南南方派执掌越南大权"
 rd_vietnam.6.d: "随着军队的铁蹄踏过越南的国会大厦，南方苦于经济暴动的市民们终于偃旗息鼓。随即，一场剧烈的政治地震席卷了整个以龙为号的国家。\n\n随着北方派无法处理美国内战带来的外贸和农业崩溃，被视为最后一搏的“熔炉运动”也招致了军队的围攻，越共集体罢免了北方派的时任主席武文赏，并决定将它和一亿越南人民托付给一位新的领袖。阮春福，前越南国家总理，已经被任命为新一任国家主席。这位主席在国会大厦前侃侃而谈，宣称要“全面深化革新开放，彻底融入世界贸易体系。扩大全民红利，建设商业友好型越南，改善民生，推进民主化，建设安定，民主，反对激进主义和暴政的社会主义越南”并向日本发出了例行的外交照会。\n\n阮春福在有着维多利亚大学认证的经济才能的同时，身上缠绕着数不尽的南方派联系——本身是南方派掌门人阮晋勇的女婿，旗下子女均担任南方商业寡头高管，以及曾经被北方派掌门阮仲富打压。风云变幻，昔日的败者卷土重来，党的经济学家是否能让越南焕然一新？这一切都需要时间证明。"
 rd_vietnam.6.a: "故渡秋风长送客，中流回首一披襟。"
 rd_vietnam.7.t: "越南警方恢复越南秩序"
 rd_vietnam.7.d: "在热烈的掌声中，苏林等一众越共警方从幕后走向台前，正式地接过了越共的最高权杖。\n\n在美国崩溃和台海战争的接连打击下，本就摇摇欲坠的越南经济骤然跌入冰谷。而越南社会的裂痕终于在此刻暴露无遗。“资产阶级自由化”和“社会主义道路”之争再次成为越南社会斗争的主要议题。社会上的动乱又带来了越共内部的混乱，新北方派和南方派们借着熔炉运动大行争权夺利之事，甚至公开地支持并放任社会的进一步动乱，全然不顾越南革新开放事业的发展。\n\n而以苏林为代表的越南警方，在这次社会危机当中深谙团结稳定对越南社会主义事业的重要性。越南警方同越共内部的实干派党员果断地行动，在混沌中如中流砥柱一般顶住了各方的压力，刚柔并济，稳定了国内秩序。\n\n苏林在就职演讲中指出：“如今的混乱，是由世界的大气候和国内的小气候所导致；全世界正在经历前所未有的格局重塑，而这一点更加要求我们注意社会主义事业和人民利益的实现，必须以社会和党的团结稳定为先。”\n\n这匹政治黑马自混乱中冲出，现在以稳定为口号坐镇河内；而在警方和越共党中央的支持下，他雄心勃勃的反腐计划和改革计划正在被稳步推行。这个来自兴安省的沉默汉子将会把越南和革新开放的事业带向何方?世界屏息以待。"
 rd_vietnam.7.a: "越南人民奋进前行，安南走向新的境地！"

 nax.4.t: "米莱总统于混乱中丧生！" 
 nax.4.d: "混乱之中，媒体发现米莱总统倒地，米莱随即被紧急运离现场。随后几个小时，阿根廷媒体公布了米莱去世的消息。"
 nax.4.a: "六百六十六。"