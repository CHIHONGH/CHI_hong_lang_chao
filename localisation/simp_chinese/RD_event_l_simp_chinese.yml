 PRC_tfr_nl_china_yizezuopaiyanlun_tt: "让皮革厂的同志们修修，指不定还能用？"
 prcs.3033.t: "堡垒"
 prcs.3033.d: "在暴乱刚刚爆发的第一天，群众和警察们被这突如其来的巨大变故弄得一时间手足无措，群众们为了自保，迅速组织起了自卫团体以应付这些暴徒。一开始这些自卫团体可能只有寥寥数人，并不足以应付那些装备精良的暴徒们。但是，自从一群建筑工人们用工地上多余的建筑材料和工程汽车在街道上筑起了第一座街垒，并有力地击退了一群暴徒后，街垒便在这座城市内如雨后春笋般拔地而起。\n\n而后，被打得晕头转向的基层党组织迅速清醒过来。他们在无法与上级取得联系的情况下主动联合了群众们自发组织的各个自卫团体和基层民主自治组织，并建立了革命阵线以取代业已失能的政府机关。革命阵线出生在一个小学的操场上，那时仅仅只是一个协调联防的组织；而后随着群众们控制了市民广场，革命阵线便将自己安置在了这座城市的中心，成为了许多群众第一次真正将历史握在手中的地方。\n\n在革命阵线的统一协调下，群众们将那些多余甚至互有妨碍的街垒拆除，将那些关键地点的街垒修缮并加以整合。那些用图纸和标准材料造了大半辈子精致建筑的工程师和建筑工人们用各种各样的建筑材料、家具、汽车在城市的街道上筑起了一座又一座固若金汤的街垒。\n\n其中最为标志性的莫过于解放大道上的那座街垒。解放大道，过去是衙门的所在地，清朝到民国时又成了西洋人的租界，是“狗与贱民不得入内”的地方。而后在近三十年里又成为了所谓“城市名片”。西洋风情的建筑蹲在这条大道两边，各种各样的奢侈品店铺分置两旁，向着游客展示着这座城市的浮华。\n\n但是现在，一座高两层楼，宽数十米的街垒横亘在了这条大道上。加固的土堆、铺人行步道的砖块、门板、破柜子、条凳、挡雨布，各种各样奇形怪状的东西堆成了这座街垒，却又恰到好处地留出了垛口。这座街垒吵闹无比，这座街垒气冲霄汉，它的身子上爬满了各种各样的人，钢盔、安全头盔、草帽、宽檐帽交织成了愤怒的风暴。草叉、锄头、铲子、扫把、棍棒同登山杖、复合弓、气枪、燃烧弹对战。它把一切都变成了武器，陶片、猪大骨、玻璃瓶、水桶都在这里成为了武器。它是洪水留下的冲积物，民众将这座城市的贫穷冲到表面，于是便有了它。800多名群众先后把守着这座街垒，但有100多人从未离去，其中，有党员，有团员，有群团组织，有居民，也有外来务工者。他们有一个共同的名字——人民。\n\n这座堡垒的体内孕育着风暴，孕育着怒火。"
 prcs.3033.a: "而在堡垒之上，一面红旗劈啪作响"
 PRC_tfr_nl_china_baolei_tt: "春风杨柳万千条，六亿神州尽尧舜。"
 PRC_tfr_nl_china_baolei_b_tt: "§t几天后，我们将重整旗鼓。§!"
 prcs.3034.t: "党员大会"
 prcs.3034.d: "鲜艳的党旗在街垒的身躯上被展开。在旗帜下则是临时用大排档折叠桌搭起来的主席台，主席台前则摆满了条凳、塑料高脚椅、小马扎。这里没有多余的装饰，倘若说有，那便是街垒本身。\n\n街垒外，有什么东西依然阴燃着，其臭味飘入街垒。而街垒内，则是人头攒动，有很多人还没脱掉自己的防具，那老旧的墨绿色警用头盔非常扎眼；有些人手上还拿着各种各样的盾牌，一个人甚至把木质锅盖都拿来了；还有的人手里还提着武器，没来得及放下。他们刚刚抵御住了一波暴徒的袭击，而现在他们都安静地出奇，静静地听着讲台上的人说话。这是党员大会，但是却有许多不是党员的人参与其中。\n\n“同志们！我们这个街垒已经连续坚守了很长一段时间，暴徒们轮番使出各种各样的招式，无论是正面强攻还是派出奸细内部渗透，无论是企图威逼利诱还是企图分化瓦解，都没能撼动我们分毫。这是为什么？”一个年轻人站在讲台上，他的眼眶上挂着浓厚的黑色，但丝毫没减弱他的声量：“秘密就在我们会场的里面。我们这里不仅有党员，还有很多群众，我们党组织内的东西，都是干干净净地摆在这里给群众们看到的。而很多决策，也是我们积极邀请群团组织，邀请群众代表一起商议出来的。所以我们把这座街垒变成了最坚固，最牢不可破的防线。而以后，我们打赢了暴徒，我们还有更多的仗要打，还有更多的事情要一起同心协力。这不是什么需要思考的东西，因为我们党员也是群众。所以，我们基层党组织的党员大会，应该要让这些群众进来旁听，和这些群众一起，了解他们的想法，知道他们的需求，并且，把我们要做的，坚决地做下去！”\n\n而后，他走了下去，每个最基层的所谓人微言轻的党员都开始依次上台作报告，而后则是那些群团代表，那些最不起眼的群众。在党旗下，他们将自己心中的各种想法、梦想甚至是妄想都说了出来，有的人生怕别人不理解，夸张地比划了起来，甚至有一点手舞足蹈，但没人喝止，没人打断，语毕时，还有响亮的掌声鼓舞。"
 prcs.3034.a: "在这火光的照耀下，党旗愈发鲜艳……"
 prcs.3035.t: "囚徒"
 prcs.3035.d: "“一定要让大家看到暴君残害无辜的真相！”\n\n“支持反暴抗争！打倒赤色暴政！”\n\n“国际友人与真正的民主站在一起！”\n\n“打倒修正主义集团！打倒中帝！”\n\n“有识之士都来支持正义的民主抗争！”\n\n……\n\n黄冬藏的手指机械按下回车键。这些精心拍摄和制作的文案便被脚本用数十个账号投放到了各个平台上。当“正在审核中”的文字出现后，他不由得苦笑了一下，毕竟在这一切刚刚开始的时候，凡是他们发出的视频都根本不需要审核——毕竟他们的“抗争”是“正义的”，自然有不少“有识之士”帮助他们。但是，这些“潜伏在黑暗帝国核心”的“义人”也已经许久不和他们联系了。\n\n他机械地咬下一口面包，他的舌头发干，品不出来什么味道，所幸这面包是软的。他啜饮着手边的矿泉水，将嘴里的面包冲刷进胃里。好想吃披萨，尤其是那种薄薄的，烤得酥脆的，上面放了熏好了的香肠和奶酪还有进口罗勒叶的披萨。他还记得，上一次吃披萨是20年，那个时候他在所有同学面前掏出了一大笔钱定制了一份披萨，还请人绕过了封控，送到他的桌上。他特意点了一个仅供一个人吃饱的小披萨，让旁边那些只能啃泡面的同学只能看着。那个时候，他经常讥讽，大家都是囚徒，但是有人可以把监狱过得像天堂一样，贵人到哪里都能这样。但是自从22年之后……他想不下去了，他再也不想回忆，于是他愤怒地咬了第二口下去。\n\n黄冬藏突然感觉到身上好痒，他照了照镜子，发现镜子里面的那个面孔已经完全认不出来了：胡子没刮，里面带着秽物、眼角沾着黄色的东西、一呼一吸间都吐着臭气。已经停水了，剩下的水和食物也只是按日按量配给。\n\n他看向窗外，这座大学已经在这数日里被他们布置成了一个防守严密的堡垒，在那些经验老到的外国教官的指挥下，他们在外面部署了许多阻挡大队前进的砖块堆、拒马、路障，用被摧毁的汽车堵塞了其他道路，而在布满了路障两旁的高楼上，则是有各种各样的复合弓、弹弓，甚至还有复合弩和一些危险品。还在校园的围墙上搭起来了铁丝网。他们还部署了观察哨，无人机监视平台。但是这些观察哨这几天总能看到有人开小差。\n\n而在街道的另一边，那些街垒就仿佛是有生命的活物一样，一点一点地向他们靠拢。这些街垒的前进速度不快，一天可能前进一百米，或者几十米，但是这些街垒一旦前进，就绝对不可能后退。哪怕它们只有一人高一头，但是也绝不可通过。\n\n他瑟缩在校园的防线后，试图以此保卫自己的自由；但是这样说的话，街垒那边又是什么呢？"
 prcs.3035.a: "他感觉到呼吸一阵困难……"
 PRC_tfr_nl_china_qiutu_tt: "§3西风§!弱了，§C倒春寒§!开始褪去。§t东风§!自鲜红的§R党旗§!吹来……"
 prcs.3036.t: "收网时刻"
 prcs.3036.d: "“当地民众和当地警方紧密协作，已经于昨日攻入暴徒的基地……”\n\n换台。\n\n“全国各地的秩序已经得到稳定，各地的革命群众纷纷走上街头庆祝对暴徒的胜利……”\n\n换台。\n\n“中国人民不会被任何反动分子的垂死挣扎吓倒。人民民主之路曲折，但中国人民有十足的勇气走下去……”\n\n换台。\n\n“在今日，部分与暴乱相关的嫌疑人已经被解除职务，接受调查……”\n\n他把手机关掉，再也不想去看这些东西，用双手捂住了自己的脸。窗帘紧紧地拉着，他不敢拉开，不敢让太阳光照进房间里。他已经输了，输得一败涂地，他知道自己已经没有手牌可以打了。他知道，那些外国人被抓住之后立马就会把他们背后的小交易吐出来，而后那些国安和纪委就会像抓住了绳子的火焰一样，一直一直往上窜，一直窜到他身上来。而后，迎接他的还能有什么？他还有别的人能够阻止这一切吗？\n\n联合所有对当下政策不满的人，联合那些一切利益受了损失的人，无论是那些二代还是流氓，无论是那些被泥腿子夺权了的商人还是那些唯恐天下不乱的人，无论是那些落魄干部还是那些外国人。然后借着这次基层民主化改革的机会把整个国家搞乱，要么逼得当局不得不强硬下场，然后威信扫地；要么就借此施压，以再次提振自己的影响力，将这些改革都阻止下来——这明明是多么好的计划！但是怎么会这样？到底从哪里错了？为什么这些武装到了牙齿的受训打手还打不过一群泥腿子？这帮废物！他感觉到自己的脑袋一阵一阵的胀痛，让他无法思考。\n\n他哪里做错了？是从开始就低估了自己手下的饭桶程度？还是早就应该像是刚刚卸任的前一个领导人那样安心地为国家和党尽心尽力？还是计划做得太疏漏了？他想不通，他真的想不通。他撕扯着头发。\n\n叮铃铃——叮铃铃——叮铃铃——电话冷不丁地响了起来，打断了他最后的思考。他知道这意味着什么，不会有别的人会打这个电话来。他知道自己马上就做不了其他的事情来挽救了，他没有别的选择了。但至少现在他还能做最后一件事情。\n\n他站了起来，理了一下衣服，把党徽别在胸口。然后若无其事地拿起了电话。"
 prcs.3036.a: "“这里是纪委，不要离开所在地，配合调查。”"
 PRC_tfr_nl_china_shouwangshike_tt: "§R该秋后算账了。§!"
 prcs.3037.t: "雨后的早晨"
 prcs.3037.d: "大雨再次落在这座古老都市的街头，落在地上，汇成一道道水流，冲刷着这座古都的街头。灰黑色的水流入下水道，而后逐渐变得清澈了起来。但是即使是这样也并没有浇灭群众的热情。\n\n那个音乐厅里挤满了人，这可能是这个音乐厅里人最多的一次，来晚了的人被挤到人群后，被迫伸着脖子去看个清晰。尽管人头济济，尽管有人被踩到了脚，也没有人喧哗。只听得见会议主持人的声音。\n\n“那么，根据革命阵线全体代表会议的投票决定，革命阵线将会在暴乱结束后改组，并入到相关的部门里。按照同志们集体商议的方案，改组方案如下：”\n\n“人民群众所结社团将得到保留，解散合并均由群众自行决定；”\n\n“革命阵线将会组成人民评议会，直接对接各个基层政府，各政府辖区内的人民群众将参与评议会，直接对基层政府的工作进行监督，并且人民团体将在此为政府工作提出议案，评议会审议后由基层政府便直接执行；”\n\n“基层将建立群众协商会，群众团体之利益冲突将会在协商会内尽量协商解决。而基层党组织则将会就其调解协议进行记录与公证；”\n\n“群众所组织之纠察队将成为志愿性的执法辅助人员，在公共活动时志愿承担秩序维持的辅助作用；”\n\n……\n\n这份决议很短，但是每个字都那么富有重量。它的复印件在人民群众的手中传递，在赛博空间上飞跃，从百姓的手机到那张办公桌上，全国上下所有人都在注视着这次会议。所有人都在看着这些印刷在纸上的文字。这张纸很快就会腐烂，但是这些文字已经不需要纸张了。\n\n主持人念完会议最终的决议，整个大厅刹那间陷入了一阵沉寂。而后，一阵孩子的笑声从大厅的一角响起，这稚嫩的笑声如此纯真，如此清澈，在人群中舞动。瞬间，欢呼声、掌声自地底升起，响彻大厅。\n\n大门打开，那些代表们踩着雨后的水潭走出大厅，广场、全城、全中国都变成了欢乐的海洋。写着决议的文件随着欢呼声飞向天空，飘向那乌云的缝隙间。"
 prcs.3037.a: "§Y阳光自乌云后显露……§!\n§R照在古老而又年轻的大地上！§!"
 PRC_tfr_nl_china_yuhoudezaochen_tt: "再一次，中国人民吹拂着东风，看到了地平线上的曙光。"
 prcs.3038.t: "无疾而终"
 prcs.3038.d: "经过21年与台湾治安管理锻炼的警务系统早已熟练地镇压异议，民众也习惯地不再理会每天都响起的警灯声响。在经历了一小段时间地抓捕与审讯后，局势已然稳定。\n\n在民间沉寂了许久后，中央的管控在明面上已然松弛。然而熄灭下去的热情想要再燃起来，却是不那么容易了。\n\n于是，宣传部门逐渐减少了对于“基层民主”的宣传，转而开始推动文艺革新等话题。或许有一天，他们将会重新捡起这个名号，再做些象征性的改革，但是很显然，这一次改革的契机，中央错过了。\n\n正如罗莎卢森堡所说，反对过早的开始革命，就是反对一切革命，因为革命的主体也就是人民群众。必然是要在革命的过程当中得到锻炼的。"
 prcs.3038.a: "一切如常。"
 PRC_tfr_nl_china_wujierzhong_tt: "§s基层民主改革§!无疾而终。"
 prcs.3039.t: "永生与永存"
 prcs.3039.d: "长江翻涌着白沫，舔舐着山崖，拍岸而去。水中那轮明月，依然如千万年来那般辉映着大地。一叶小舟随波轻漾，烟头与星辰在夜幕下明灭闪烁，青色的烟缕融入水中的流云，在微风中起舞，揉碎了摇荡的水影。一声若有若无的叹息，几被浪涛声淹没。\n“滚滚长江东逝水，浪花淘尽英雄。”一个中年人喃喃地念着，然后又在口袋里面左掏右掏起来。而坐在船尾的老人笑了，问道：“有什么心事？”\n“也没什么，有所感而已。你看这长江，这赤壁，想当年也是英雄角力的地方，多少英雄折戟沉沙，多少豪杰在这里陨落。我们现在泛舟赤壁，又在作和东坡先生一样的议论了。”中年人苦笑道。\n“千古兴亡多少事，悠悠。”老年人接过话茬：“历史上必然不可能有什么永存的东西。人嘛，固有一死，但是历史和老百姓还要往前走，就像这长江，终归要流向该去的地方。”\n“我不解的是，”中年人猛地转过身，语气里带着压抑的激动，“变革是必然的，就像这长江之水，不进则退！偏有一群人，仿佛被夺了祖传宝贝似的！什么‘祖制不可废’、‘动摇国本’、‘乱臣贼子’、‘毒草邪流’！他们难道瞎了吗？真就如此坐井观天？”他重重地跌坐回船舷。\n老者没有立刻反驳。他缓缓伸出手，探入微凉的江水，任江流从指缝淌过，如同抚摸着流逝的岁月。“并非瞎了，是‘坐实’了。”\n“人哪，”老者的声音清晰起来，“一旦在某个位置上坐久了，那位置便长进了骨头里。坐惯了的高位，踩顺了的台阶，端起来的架子——样样都变成了金科玉律，动不得的命根子。他们未必不知那‘祖制’是前人所变，今人亦可再变。只是屁股下的安稳、碗里的油水、脑袋里的‘习以为常’，早已绑成了锁链。这便是他们的‘道理’。他们口中的‘护祖宗法度’，护的哪里是什么江山社稷？护的是自己这一辈子的功名利禄、子孙后代的锦绣前程罢了！这叫‘坐实’，坐得太实，就成了坟墓里的砖头，把活路都砌死了。”他顿了顿，目光掠过中年人紧绷的脸庞，“但是呢，那些只盯着别人屁股底下的油腻、看不见自己脚下也有浆糊的人，也快了……这江水的本事，是冲得动所有自以为是的根基。”"
 prcs.3039.a: "下一页"
 prcs.3040.t: "永生与永存"
 prcs.3040.d: "江风带着湿气拍在脸上。中年人沉默良久，眉宇间那点激愤渐渐被更深的复杂代替：“所以我拼命，在我还有力气的时候，总想为这艘破船调个能走得更远的方向……可是，”他的声音低沉下去，带着前所未有的犹疑，“我怕我的桨不够长，力道使歪了方向；怕我看不清暗处的礁石，反把船带进了漩涡；甚至怕我自以为在破浪，其实不过是在旧的漩涡边上打转……更怕我沉了，那些我拼死顶开的朽木栅栏，又被人从水下捞起来，变本加厉地插满航道……”\n\n舟尾的老者没有立刻回答。他凝视着江水深处。那轮明月在湍急的水下挣扎翻滚，被奔涌的暗流反复撕扯、扭曲、破碎又重聚。\n\n“谁能在浪涛声中，听见自己船桨的尺寸？”他开口，声音与木板的吱嘎声混在一起，“旧浪去，新浪生。旧浪虽浊，沉渣终究消糜，新浪虽劲，水花也会遮住礁石。船夫的活计，不是分清水清于浊，是在无尽的摇荡里，看清流向，也看清自己这桨，这双眼，这身力气……能丈量多少江流。”\n\n他微微扬起头：“方向不会错，是江海终要归流。可那奔涌的河道，哪一段容得下绝对？我们只能顶着风，调着舵，听着底舱传回的每一声闷响，不断问那月光、问那石头、问这翻腾的江水……\n\n老者话语未落，一道暗流猛然冲撞船底，浪花炸开在舷边，冰冷的水点溅上两人的面颊。\n船身剧烈地倾向一侧，又挣扎着回正，像在巨大的掌心中被揉捏的纸船……"
 prcs.3040.a: "“此去，……可破旧浪否？”"
 PRC_tfr_nl_china_yongshengyuyongcun_tt: "§A中流击水，浪遏飞舟。§!"
 prcs.3041.t: "吾乡"
 prcs.3041.d: "“望望我们头上的天花板呵！踩踩脚下我们铺的砖！”那些衣衫不整，身上还沾满了砂浆泥灰的农民工们将头盔高高地抛起，手拉着手跳起了舞。\n鞠广大将那些在楼下院子里欢呼雀跃的工友们丢在身后，缓缓地靠近那栋他们一砖一瓦盖起来的公寓楼。他们农民工组成的农民工代表团在区政府的评议会上提出的建设议案在认真的协商后，便得到了认可。而后，他们便在区政府的支持下，用自己的双手，一砖一瓦地盖起来了这些公寓。\n鞠广大看着那铺好了瓷砖的地板，摸着那粉刷好了的墙壁。在外墙壁上挂着公寓楼业主的照片。里面那些灿烂的笑容当中，他那略带羞涩的僵硬笑容显得很不自然。他是工地上的熟手，他的双手因为握惯了水泥抹子而不自觉地向内蜷曲。\n他们是现代的游牧民，他们有那个遥远的家乡，远得再也回不去。他们跟随着工地而前进，在每个城市只是留下一个匆匆的背影，便又因为干瘪的钱包和那些有意无意的排斥而离开。鞠广大的梦中装满砖块，装满了水泥和钢筋，以及它们结合而成的巨楼，他无数次在梦中向那高楼走去，但是却又总是无法靠近。\n而他现在走进了这高楼，与他的伙伴们，同乡们，工友们，一起走了进去。他们将成为这座城市的一份子，与他人无异，有钱同使、有衣同穿、有饭同吃、有房同住。\n“我们来这人间一趟，一分春色，两分荒凉。笑着在生活里流浪，想用力握住命运的枪。”\n一句歌词从鞠广大的口中流出，带着家乡的黄土和城市的烟火，带着粗粝的嗓音和那尚未衰老的心。"
 prcs.3041.a: "“原谅吧所有不再见的再见，此心安处是吾乡。”"
 prcs.3042.t: "冷却机器"
 prcs.3042.d: "废墟之上，革委会与党组织取得了巷战的胜利，肃正了党组织和基层的反动势力残余。\n\n风烟俱净，人们在一砖一瓦上重建破损的房屋时，中央的条例悄然而至。\n\n条例一如既往地具有组织性与纪律性，既赞成了目前群众丰厚的成果，又为了避免运动过火而泼了盆冷水。条例规定，基层组织在与下达基层的纪委协调后，可以完善地对地方官员进行监督。在经过审查后，群团组织可以志愿维护小区治安并承担一部分基层自治的职能。先前的居委会职能也将一并进行调整，将会转型为群众组织互相协商，互相沟通的绝佳地点。而非政府干部，从这次运动脱颖而出的党员与先进个人将成为组织间的协调者。\n\n基层组织如雨后春笋般冒头，可是通过审批后，规模也被相应地限制——这既是为了维持基层的稳定和谐，甄别一些混入其中的颠覆分子，也保证了党组织的掌控。虽然幅度有限，但是中央为经过淬炼的组织和群众撑起了一把伞，开了一扇吹着东风的窗，划开了因为倒春寒结出坚冰的基层民主。"
 prcs.3042.a: "慢而稳，赛必胜。"
 PRC_grassroots_ord_tt: "§s基层民主改革§!作出了一些伟大的§G尝试§!，然而，道阻且长。"
 prcs.3043.t: "噩梦"
 prcs.3043.d: "素妲拉着巴颂走出法政大学的校门，远处的街上，几辆大巴车闪着警灯呼啸而过，几个国防军正在盘查着过路的人。黑云倒映在湄南河的河面上。树叶上像是蒙着灰，耷拉在枝头上。\n巴颂被素妲拖着，走了不知多久，巴颂停下了脚步，不让素妲再拖着他。素妲转过身来，面无表情地盯着他。\n“素妲，”巴颂开口了：“猜武教授说的话你也听到了，我的毕生所学告诉我，要为建立一个更好的泰国而奋斗。现在这个机会来了，我不能缺席，你应当理解我。”\n素妲怒视着巴颂，说：“是啊，你要当英雄，你觉得你穿上红杉去那里摇旗呐喊，然后和国防军碰一碰就能够改变这一切。然后呢?黄衫军和国防军的手有多毒你不知道吗？”\n“但是我应该去和我的战友们在一起，求你了，不要阻拦我。你往常都很支持我的，为什么这一次不行呢？”巴颂近乎恳请地说道。\n“果然，你还是要丢下我。”素妲近乎偏执地盯着巴颂，“也许你忘了五十多年前这里的事情，但我没忘记。”\n巴颂再也忍不住了，他一把推开素妲，然后转头就跑，在他的身后，仿佛传来了一阵含混不清的哭声。然后，这哭声慢慢地变成了高音喇叭的警告声音、人群的口号声、催泪瓦斯的发射声、怒吼声、盾牌的撞击声——这些声音混杂在一起，越聚越多，越聚越高，最后融为一片混沌，直到那清脆而又尖利的一声枪响划破了一切。\n一声，两声，雨滴敲打在人群上，大暴雨降下来了。人群就如蚂蚁一样溃散，又如多米诺骨牌一样倒下，原本没有穿着红杉的人，他们的衣服也被染成了红色。在那一片红色的人群中，巴颂看见了素妲。素妲也看见了他，但还没开口，她的脸就如镜子破碎一般变成了几块。巴颂感觉到自己的心脏被人猛捏了一把，再也支撑不住，倒下了。\n巴颂从床上挣扎起来，浑身冷汗，外面是缭绕着云雾的群山，公鸡正在打鸣，泰共的旗帜正挂在墙上，外面的游击队员正在警惕地放着哨。"
 prcs.3043.a: "梦中的景象袭来，哭声第一次将他淹没。"
 prcs.3044.t: "孩子们"
 prcs.3044.d: "巴颂从口袋如变魔法般从口袋里掏出一大把“大白兔”。村里的孩子们一开始还有点迟疑，但是看见巴颂脖子上捆着的红丝巾，便大着胆子拿走了糖果，然后如小鸟一般散开了。\n游击队的司务长查侬拍了拍巴颂的肩膀：“巴颂，你知道吗，金三角这里的老百姓对我们评价最好的一点是什么?”“是什么?”巴颂好奇地问。查侬叹了一口气，把头扭到一边去，说道：“他们说，我们有担当，打仗不会祸害孩子们……”\n巴颂问道：“毒枭们还会杀小孩?这帮人渣……”查侬在口袋里摸了半天，摸出来半支香烟叼在嘴里，带着些许嘲弄地看着巴颂：“按你这样说的，那他们可是圣人了。”\n看见巴颂疑惑不解的眼神，查侬笑了笑：“毒枭们没有一个是不用童兵的。他们在自己控制的村子里，看见那些长得结实而且年纪尚小的孩子就把他们抓去，无论男女。把他们抓到童兵营里，稍有不从的就棍棒管教，打得重伤了，就丢到尸坑里面自生自灭，而有些“爱干净”的毒枭……他们每年都会买很多王水倒在坑里。而个别幸运儿，从兵营里出来了，就是“成人礼”，也就是杀人……而毒枭会把他们要杀的人戴着头套捆在木杆子上，让他们用枪杀。”\n说到这，查侬停了停，猛猛地吸了几口烟，把自己的脸淹没在烟雾里：“有些幸运儿可能打死的只是几个不认识的人，但那些不那么幸运的……当死人被摘下头套时，他们会发现那是自己的父母。这些都是我曾经见过的事情。”\n巴颂的嘴唇在颤抖，痴痴地盯着查侬。孩子们嬉笑打闹的声音飞入窗内。"
 prcs.3044.a: "“所以说，我们来了。”"
 prcs.3045.t: "惩戒"
 prcs.3045.d: "血红的雨水缓缓地流入下水道里，混凝土的粉尘混着刺鼻的白烟取代了晨雾。一群捆着红袖章的泰共战士和老百姓正在拆除街道上那些已经被炸毁的街垒。那几幢碉堡似的别墅还在传来零星的枪声，不一会就彻底沉寂了。\n\n集结号响起，回荡在灰暗的天空下。游击队员们在广场上一排好队，就看见了黑着脸的游击队队长和一排五花大绑起来的游击队员。队长一言不发，缓缓地从那些战士的队伍前走过，目光在那些黑瘦的脸旁上割着。没人敢说话。\n\n“都干得好啊，干得好。”队长站定，对着那些战士开口了：“打了这么久的仗，刚刚进了个清迈，就开始耍军爷威风了。强买东西，别人不肯卖就动手打人;缠着人家女孩子，以为自己是什么大英雄，现在就要和她干柴烈火，还是当着人家父母……”队长转过身去，深吸了一口气，然后慢慢地呼出来，咬紧了自己的牙关，拳头捏得咔咔作响。那些被捆起来的游击队员只是把头埋得更深了。\n\n“我们是共产党的部队，是老百姓的部队，是给他们报仇的部队，你们这样做，你们和那些国防军畜生有什么区别?”队长提高了音量，对着所有人说道：“我们对这种滋扰群众的行为，严惩不贷！”他一摆手，警卫员在队列前丢下了一捆竹鞭。\n\n“每个人各抽50鞭子，你们来亲手执行。如有再犯，直接枪毙。”\n\n竹鞭破开空气，狠狠抽在那些人背上。"
 prcs.3045.a: "那些战士们只是默默地承受着……"
 prcs.3046.t: "烈日"
 prcs.3046.d: "热浪从公路上升腾，丝丝缕缕的热气，扭曲了前方的视线。队伍扬起的灰尘粘在路旁水稻叶上，使得青绿变得灰白。一支黑压压的队伍在一抹鲜红的旗帜带领下，沿着公路向南缓缓前行。头顶上，印着相同红旗标志的战斗机低空掠过，嗡鸣声仿佛紧贴着头皮轰响。\n\n天空低沉，云层压下，让人窒息。除了引擎的轰鸣与军靴整齐的踏步声，天地之间空无一物，连虫鸣也仿佛被蒸发。巴颂觉得头顶冒烟，汗水一股股从脖颈、额头、背脊滚落，像是身体正被蒸煮。，如果把军帽摘下，登时就是热气升腾。\n\n他的靴子紧紧咬着脚踝，子弹带压得肩膀隐隐作痛。每一步都像踩在灼热的铁板上。而脸上鼓起的红肿，如同高原的风疙瘩，却是热带蚊虫的馈赠。他连抬手去驱赶它们的力气都没有，只能暗骂这些混蛋为何不惧怕烈日炎炎，几只蚊子耀武扬威地大快朵颐，他却无计可施，登时，几个红肿得可怕的大包就鼓了起来。\n\n他们就这样走着，踩着一模一样的节奏，穿越一公里又一公里毫无区别的道路。热浪翻滚，汗水淌流，一切都像是在无尽重复。\n\n忽然，巴颂停住了脚步。整个队伍随之停下。\n\n所有人的目光，不约而同地落在路边一根电线杆上。几具尸体披头散发，被吊在杆上，悬在灼热的空气中随风轻晃。其一腹部异常隆起。\n\n巴颂走近几步，看见电杆上钉着一张纸：\n\n“今有匪藏匿于本村村民宅邸，其主妇不上报我军，反以其有身孕为由进行窝藏。此乃对国王之叛逆，现已将其全部处以绞刑，以儆效尤。”\n\n他没有说话，只是默默把纸递给身后的战友。\n\n太阳越发炽烈，苍蝇盘旋其上，嗡嗡作响，如同死亡的礼乐。\n\n这支黑压压的队伍，仿佛被什么推着，默默地，加快了脚步。\n\n他们继续前进，走向注定属于他们的两条路。"
 prcs.3046.a: "“一条是胜利……”"
 prcs.3046.b: "“另一条是死亡。”"
 SIA_cuminst_ture: "§R烈日灼心，血泪铸就的道路延伸向远方……§!"
 SIA_cuminst_flase: "§g死亡的阴影笼罩着这片土地，每一次呼吸都带着绝望的沉重……§!"
 prcs.3047.t: "子夜之前"
 prcs.3047.d: "邵披耶河从脚下滚过，倘若不是水流的哗哗声，人们恐怕会以为这漆黑的河水已经与这天空一同凝固成了死气沉沉的黑暗。\n河岸的国防军暗堡中，机枪的枪口如同野兽的眼睛，死死盯着对岸那片漆黑。对岸一片死寂，似乎是死神的低语，悄无声息，吞噬了一切生机。每当夜深，国防军的士兵们便在噩梦中惊醒，神经质地抬枪四望，然后又重新沉入无尽的黑暗。\n几个失魂落魄的士兵，已经开始依赖酒精来麻痹自己，把武器丢在一旁，抱着酒瓶度过漫长的夜。而那些军官，更多的是在自己的制服下藏起了另一种面孔——他们掩饰着对战斗的恐惧和对未来的绝望，试图通过暴力与长棍来维系一丝权威的同时，又祈求军官服下的勤杂兵服能在关键时刻救下他们的一条烂命。\n\n然而，无论他们如何挣扎，河对岸依然沉默如一。没有枪炮声，甚至没有风声。那里的黑暗，仿佛吞噬了一切，包括时间、声音与希望。所有人都陷入了无望的等待，一切都沉寂得让人窒息，仿佛这场战争从未存在过。\n\n在这片死寂的河岸旁，巴颂蜷伏在高草丛中，草皮裹在他身上，几乎与大地融为一体。他的眼睛始终注视着对面，那边偶尔有枪声划破黑暗，但他没有还击，也没有反应。他知道，这只是暂时的平静，敌人仍然潜伏在那片黑暗中，等待着机会。好浓重的夜色啊，星星也没有，月亮也没有，什么声音也没有……只有无边的黑夜。\n\n巴颂屏住呼吸，感受着每一分沉默，心跳声似乎要被这浓重的夜色吞噬。他知道，只有等待，直到那个“时刻”来临。他和所有人，都在这片黑暗中，等待着那一刻的爆发。\n\n突然，几束光划破了夜空，瞬间，雷鸣般的爆炸声如同从天而降，震动了大地。敌人的阵地瞬间被吞没在熊熊烈火中。硝烟和火光如洪流一般席卷而来，撕裂了这片沉寂的夜空。待一切归于平静，几发照明弹腾空而起，在空中划出一道亮丽的弧线，随后，铁一般的声音从钢一般的胸膛中炸响，自黑暗中传来\n“同志们，前进！”"
 prcs.3047.a: "巴颂丹§Y黄色的眼眸中§!\n泛起了§R东方的鱼肚白§!"
 prcs.3048.t: "东升"
 prcs.3048.d: "黑夜翻滚了起来。人潮、装甲车、战斗机如波涛涌动。这浓重的夜色在远处被火炮的光芒劈开，隆隆滚雷震撼着天与地，那稳坐闹市中的大皇宫也在颤抖。炮声将息后，激烈的枪声又炸裂开来，在喊杀声过后，就彻底陷入了沉寂。曼谷在枪炮声中瞪大了双眼，惊恐地注视着血与铁的碰撞。\n巴颂背着卷起来的红旗，与自己的战友们躲在掩体中，那栋欧洲式的巨大楼房被烈火的光烧得通红。“同志们……”一发迫击炮炮弹炸开，凄厉的爆炸声将查侬的声音淹没，硝烟呛得人咳嗽不止，铁一般铿锵的声音依旧回荡：“前面就是总理府了！敌人如何拼死抵抗，也不过是迟一点下地狱罢了……”机枪又在狂吼起来，但压不到查侬的声音：“同志们，把红旗插在他们的心脏上！”话音刚落，几发灿烂的信号弹飞上天空，火炮和装甲车引擎的怒吼声从地下隆隆升起，淹没了世间万物。\n在火箭弹与装甲车机炮的掩护下，无数的战士从被炸开的缺口里涌入总理府。有许多国防军丢下武器，哭喊着什么，但是那些战士们压根不理会，只是把他们丢到了俘虏的队列里。战士们踹开总理府办公室的大门，只看见一具套着极度不合身军服的肥大身躯倒在血泊之中，还有几个瑟瑟发抖的参谋。\n而查侬和巴颂已经爬到了总理府的楼顶上，火光在曼谷城区四处炸开。在东方的那一抹白色越来越亮了。泰国总理府的尖顶就在那，它被火炮削去了一角，形成了一人高的台阶。查侬立马蹲在了那底下，对巴颂喊到：“踩着我的肩膀，把红旗插上去！”\n巴颂一个箭步，踩着查侬的肩膀，麻利地爬了上去。他取下背后的红旗，用尽全力将它展开。在习习微风中，这面布满弹痕的旗帜昂起了头颅，拥抱着天地。红旗起舞，无数的欢呼声涌起，红旗飘扬，带起来了天边绚烂的朝霞，无数的魑魅魍魉在这光芒下溃散、消失……"
 prcs.3048.a: "§R赤旗染红了东升的§Y太阳§!……"
 prcs.3049.t: "再见"
 prcs.3049.d: "红色的波涛在曼谷的街道上涌动。红旗、红横幅、穿着红衣服的市民、戴着红星军帽的泰共战士们在街道上汇聚成一条河流，欢呼声和鼓掌声此起彼伏。锣鼓声、喇叭声、歌声在大街上流淌。老百姓们把中国志愿军战士们抛向天空，又用自己的臂膀接住他们。金碧辉煌的大皇宫上，数十面红旗正在猎猎作响，而红旗下是那些衣衫不整的流浪儿们，这些孩子恶作剧般地在昔日神圣不可侵犯的皇室画像上肆意涂抹。这是曼谷这么多年以来第一次陷入这种狂喜。\n巴颂在这人潮当中跌跌撞撞地前行，一阵疲惫感爬上他的心头，他好想休息，就这样一睡了之。但在恍惚间，在那欢乐的人潮里，他又看见了那个身影，那个他再也熟悉不过的身影。他奋力向前，不顾一切地拨开人群，向她靠去，那飘然的身影在这欢腾的人潮当中若隐若现，但他跟在那后面，一直锲而不舍地追着。但是汹涌的人群将他与那个身影隔得越来越远，他几乎绝望了。\n但是，就在此刻，那个身影转过身来，那张面孔依旧那么洁白，依旧那么美丽，依旧那么熟悉。他们在这欢涌的人潮中四目相对。素妲还穿着那一天的衣服，那双眼睛当中已然不再是泪水，而是骄傲与自豪。巴颂的嘴唇颤抖着，他想说什么，但是他发现自己的喉咙已经被哽住了，什么话也说不出来。素妲久久地凝视着他，但仿佛下定了决心一样，对他比了一个大拇指，然后便轻轻地挥了挥手，任由人潮涌来。\n素妲消失在了那一片欢腾的人潮中。但她的声音却凭空出现在巴颂耳边：“我为你自豪，巴颂。但现在，忘了我吧，我的心愿已了。”"
 prcs.3049.a: "“我将带着你的期望，好好地活下去。”"
 prcs.3049.b: "“不，我绝不忘记。”"
 prcs.3050.t: "南亚赤大陆（其一）"
 prcs.3050.d: "一名中国士兵在收到最新指令后，俯视着瘫坐在地的印度士兵。枪口残留的火药形成烟圈散开，而准心依然放在他的脑袋上。\n他稍稍一笑，随即将枪收了起来，用印地语对他说到：“战争结束了。”\n\n印度士兵的眼中先出现了一丝不解，紧接着在自己的通讯器中也传出同样的讯号后，他用着歪歪扭扭的中文回答道：“战争...结束了...”\n\n“没想到，你还会说中文。”中国士兵的眼神一下子亮了起来，“你是在什么时候学习的？”\n\n他有些不好意思的挠着头，从随身口袋里拿了一本《2小时速成基本中文交流》的小本本出来，上面的分发单位写的是——印度国防部。\n\n“战争结束了，你现在最想做的事是什么？”趁着接收单位还没有来，两人保持着一定距离闲聊着，“我吗？我想回去看看我的家和家人。那你呢？”\n\n“我吗？这说来可就长了，不过我现在最想做的还是把你送到接收单位那边先，怕你出事。这样，我们俩交个朋友吧，你也算是我在印度认识的第一个朋友了，我叫杨启斌，你呢。”说完，他上前一步，伸出了手。\n\n印度士兵支撑着自己的身体，握住那一只手说到，“我叫恰尔玛·卡拉，你是我认识的第一位中国朋友。”"
 prcs.3050.a: "迎着夕阳，两人互相搀扶着来到了接收单位，两人之间的联系，才刚刚开始。"
 PRC_tfr_nl_china_nanyachidaluyi_tt: "他们的故事已经记录完毕，在之后，我们会补全主体的根骨。"
 prcs.3051.t: "南亚赤大陆（其二）"
 prcs.3051.d: "在南亚的军事行动已经落入尾声，接下来的任务就是如何在这片遭受战火的土地上重建。\n卡拉就像是这场战争中大部分年轻人的缩影，他匆匆忙忙的被村子里的征兵官带走，凑凑忙忙的接受基本训练后就被送上战场。不过好消息是他活下来了，在接收单位那拿到了足够回家的路费后，他便踏上了回家的火车。\n列车上，卡拉已经被解除了武装，穿着一套常服，没有作战服的那种汗臭和不舒服感。虽然战争已经结束了，但是列车上依然还有着一些主战的平民高呼着拒绝投降，战至最后一人。\n卡拉显然是听不下去了，他站了出来，对着这帮人说到：“战争已经结束了，你们是听不懂吗？”\n那些人扭过头来看着卡拉，随后就是围了上来，抓着他的衣领呵斥道：“凭什么要放弃我们的国土？还有，你是什么种姓的？敢这么跟我说话。”\n周围的乘客都下意识的把头扭了过去，因为眼前这个为首的一看就是高种姓的。\n但卡拉已经对这些人恨之入骨，他一拳打在了他的鼻子上，愤怒的把自己在军队中受到的委屈全发泄在了眼前的这个人脸上。\n在众人惊诧的眼神之中，卡拉抵达了他的家乡站，下车前，卡拉朝他的脸上吐了一口唾沫。"
 prcs.3051.a: "关门之后，列车就这样带着旧时代的残骸驶离。"
 prcs.3052.t: "南亚赤大陆（其三）"
 prcs.3052.d: "卡拉做了一个梦，这个梦和他之前的遭遇息息相关。\n在梦境中，他一下子又回到了那个让自己害怕的新兵训练营。耳边不断传来教官的怒吼和子弹发射的声音，在生理和心理的双重打击下，他不得不尝试着去适应这样的环境。\n“做的不好！”突然的一声怒吼把他吓瘫在原地，手里的枪也哆嗦的射歪了最后一颗子弹。\n“你就打算这样去面对那帮嗜血的中国人吗？回答我，在战场上，你只能相信你的枪，还有你的队友。”教官一脚踢在了他的腹部上，剧烈的疼痛感让他蜷缩在地上，但紧接着，他又看到了令其不得不害怕的东西——教官黑洞洞的枪口，不知道什么时候已经对准了他的脑门。\n“卡拉，你相信我吗？这枪我已经装上子弹了，如果你不相信的话，可以直接翻滚到另一边去。但三秒后你要是还在原地，那就是对我的信任。”说是这么说的，但是刚刚腹部的剧疼明显让他动弹不得，滞在原地。\n在卡拉的印象里，教官骗了他，子弹根本没有装进去，但是在梦里，一颗流弹却直接击中了他，他两眼一黑，失去了意识。等到再次睁眼，他发现，自己变成了手里拿着枪的人，而在脚下，居然是刚刚训斥自己的教官。\n他的呼吸越来越急促，额头不断渗出密密的汗滴，周围围观的眼睛越来越多。卡拉本想张口辩解，却发现嘴巴已经被堵上，只留下了周围一群同行士兵的斥责声，“你，你为什么要背叛我们...”\n“到底是谁背叛了谁？”他的耳边突然响起了别人的声音，好像是杨启斌的，紧接着便是他有力的双手抓住了自己，“别迷失了自己！卡拉！”"
 prcs.3052.a: "他一下子从床上坐了起来，手里握着杨启斌离别时给他的五角星……"
 prcs.3053.t: "南亚赤大陆（其四）"
 prcs.3053.d: "虽然自己的家乡处于比较贫困的地区而未遭受到严重打击，但据村里面的老人所说，卡拉是村子里第一个回来的年轻人。根据解放军贴的公告来看，下一批人回来就要到一周以后了，但在这之前，卡拉必须要认清的看着村里经过战乱而又惨遭洗劫的现实。\n村子里的精壮劳动力可以说压根没有，除此以外，孩子们也早已经被家里托关系送到别的地方去了，目前来看，村里的人基本上就只有妇女和老人，可当他推开自己家的房门时，眼前的一幕又让他揪心。\n母亲此时固定在了那台简易的纺织机上，在昏暗的家中，只有一盏煤油灯微微发亮来帮助母亲看得见手中的活。\n见到自己的儿子活着回来了，她想要亲切的拥抱上去，但是长期的盘坐在纺织机前所造就的“职业病”让她一下子唉哟不断。\n“妈，你怎么了？”卡拉立马把房门开到最大，让阳光尽可能的照进来，谁曾想，母亲的手指上，竟多了数不数胜的老茧。他出门的这几个月，母亲遭受的苦，可能他这辈子都想不明白。\n母亲慢慢捶打着自己的肩膀，声音嘶哑的缓缓说道：“卡...卡拉...你回来了就好，在部队里有没有受到欺负...”卡拉死死的抱住了他的母亲，泪流满面的求她不要再说了，但母亲只是擦了擦他的眼泪，继续关心着他。\n“妈，我在外面过得很好，你看，我都回来了。”说罢，他想要背起他的母亲，送她到镇上的医院去接受治疗，可一背起来，他的心不由得咯噔一下。"
 prcs.3053.a: "母亲的重量，好像比自己印象里枪的重量要小了。"
 prcs.3054.t: "南亚赤大陆（其五）"
 prcs.3054.d: "从自己的村子走到镇上还需要一段路程，可目前看来，就刚刚结束的战事，谁会有能力载着自己和自己的母亲去医院呢。\n\n卡拉很着急，这条公路装载着他曾经的回忆——在被征兵官抵着后背压上卡车时，他想要在这条公路上找个位置跳下去回到村子里，可是事与愿违，卡车的太快了，让他不得不放弃了这种考虑。\n\n他现在只希望有一辆车，一辆足够慢的车，慢到可以看到他的挥手，看到他背上的操劳的母亲并好心的停下来接他们母子俩到镇上的医院里面去。现实的毒辣太阳显然是打破他幻想的最好手段，而且，母亲也不断的在自己的耳边说着，孩子啊，不要管我了，你应该放下我，放下这个负担，去闯出一片新的天地。\n\n可是，如果真的放下了母亲，那他还有脸回到这生了自己，喂养自己长大的村子吗？母亲到时候到底会被村里人怎样看待。他不敢想，但长时间的暴晒又让他的脑子晕乎起来，一点点的摧残着他仅存的理性。\n\n正当他真的要放弃的时候，一辆车，对！是引擎声，是他印象中的引擎声突然出现了，他看到一辆车，正朝着他们缓缓驶来，用尽最后的力气说了一句“帮帮我们”，就昏了过去，在失去意识之前，他听到的最后一句话是："
 prcs.3054.a: "“卡拉！卡拉！快把他送到车上！”"
 prcs.3055.t: "南亚赤大陆（其六）"
 prcs.3055.d: "等到卡拉再次醒来时，他已经躺在了医院里，手背上正在打着点滴，而坐在他病床边的，正是他的第一个中国朋友——杨启斌，而站在他身边的，则是两名警卫员。\n见到他醒了过来，杨启斌便示意让他不要有太大幅度的动作，并让他安心养病，“你就放心好了，你的母亲我们正在组织专家会诊，不久后就会根据你母亲的情况给出最好的治疗方案。”他一边像是日常朋友之间交谈那般，一边给卡拉削着苹果皮。\n“你知道你在大太阳底下背着一个人站了多久吗？保守估计，你差不多在那下面站了3-4个小时，赶紧吃点苹果补充维生素吧。”说罢，一块已经削好的苹果就放在了卡拉的嘴中，随着水分和糖分的补充，卡拉也渐渐有了说话的力气。\n“谢谢你，杨启斌。这下，我们全家都欠了你一条命，而我欠了你两条命。”卡拉不明白，为什么杨启斌能找到他的村子，印象里，他不是打算回国吗？在接收单位时他说的。\n“我知道，你看到我有很多的疑惑，我现在正式的重新自我介绍一下。我是中国援印重建计划的志愿者——杨启斌，所负责援助的村落，正是你们的。”\n卡拉在听到命运般的安排后，先是困惑，紧接着是惊喜，再接着，便是说不完的激动，他多想在此时和杨启斌拥抱，但手上的管子无疑阻碍了他们。杨启斌只是笑了笑，让护士进来，交代了要多加照顾他和他的母亲后，便打算离开了。\n“杨！等一会！”卡拉突然意识到一个问题，那就是他和他母亲的医疗费用该怎么办，看样子这可不是一个小数目。杨启斌食指伸了出来，稍稍摆了摆示意他们不用付，紧接着阐述了原因。\n“这是由我们野战医院改建而来的临时性地方医院，目前仍在处于特别行动的收尾工作嘛，自然医药费这些就是我们国家出了。”"
 prcs.3055.a: "中国二字在此刻成为了卡拉心中永远的恩人。"
 prcs.3056.t: "南亚赤大陆（其七）"
 prcs.3056.d: "当他和母亲出院之后，第二批回到村子里的年轻人刚好也回来了，于是他们俩便搭乘着杨启斌的顺风车，也回到了村子里。\n刚一进村，不少人都被那辆解放军的军车所吸引眼球，他们凑上来想要近距离观赏这台漂亮的车，但被出于安全考虑的警卫员拦在了一定距离之外。\n“小张啊，就让他们看看吧。”在得到杨的同意后，警卫员们就放心大胆的让他们摸着，而他们站在一旁随时准备保护他的安危。\n杨启斌就这样站在军车上，他拿着一个扩音器，对聚在他旁边的人们用印地语大声宣布着，“印度人民们，你们的战争结束了！”\n卡拉哪还记得杨启斌后面说的话，他只知道，此刻有一种冲动感让他一下子站了起来，带着对先前战争的不满和对和平的到来，他和周围的人们一起欢庆着，用着他们自己的方式表示着感谢。\n当晚，村子里就准备了一顿丰盛的招待宴来庆祝这串喜事，在这个时刻，他们已经忘记了战时的疼痛，只想与回到家乡的亲人们好好的享受这段来之不易的时光。宴后，卡拉来到杨启斌的身边，把自己心中的那个问题说了出来：“杨，你为什么不回到你的祖国？”\n“这个问题啊，卡拉，想要知道我的回答吗？那就在村子转一转，看看还缺些什么。”\n“缺干净的水源，持续的电，还有交通不方便……”卡拉把自己印象里村子里缺少的东西都说了出来，正好看到了杨启斌露出微笑。\n“这些正是我要帮你们带来的东西。”\n卡拉的喉咙有些说不出话来了，在寻思过后，他想到了那本速成书上的保命词汇，让自己口音听起来不那么别扭的用中文说道。"
 prcs.3056.a: "“我的中国同志，杨启斌同志。”"
 prcs.3057.t: "南亚赤大陆（其八）"
 prcs.3057.d: "杨启斌当然知道这种会议闲得无聊，但他却又必须在场，为此，他只好时不时低下头来看看时间，心里算盘着什么时候散会。\n他有些不能理解为什么这些小党派不能好好的与印共合作，反而要努力的争取自己的权利。虽然战争中印度政府把印共等一大批左翼进步团体宣布为非法组织并残酷镇压他们的活动，但在中共提供的帮助下，他们又重新的组建了起来。\n“我觉得我们的重点是放在如何恢复党的工作，权威和运作等工作，而不是在这里和玩所谓的议会过家家！”随着印共的发言人将新制定的，党章议程之类的东西甩在这帮人脸上，都没能让他们的嘴巴闭上。\n“我先说明一点。”或许是他发自内心觉得这样争吵下去根本探讨不出任何解决方案，杨启斌清了清嗓子说了一句，“我觉得当前的首要任务是协调我们可协调的力量，让我们的重建工作可以尽快完成。”\n在听到“中方名誉党员”的发言后，他们终于安静了下来，开始与相邻的党派负责人交换意见。作为首批志愿留下来协助印共重建家园的中国共产党员中的一员，印度方面为了感谢他的付出，为其颁发了“荣誉印度共产党员”的身份，可以在会议之中旁听，并可以就重建问题提出中方的建议。\n“杨同志，刚刚真是感谢你了，如果没有你在场的话，我都不知道该怎么推进会议进程了。”负责主持这次大会的印共党员散会时握着他的手，“真不知道该怎么感谢你。”\n他稍稍摆了摆手，“不需要感谢的话语，我们两党之间是亲密合作的关系，我们中方真心希望看到印共可以健康的扎根在这片土地上实现共产主义。”\n“理解，理解，可惜的是，印共的党组织与基层架构显然是遭到了严重破坏，哪怕在你们的协助下，党员数量仍然是吃紧……”\n“等等，你说，我能不能以名誉党员的身份，为你们印共推荐一位党员呢？”杨启斌话锋一转，让这位负责人摸不着头脑，只能表示一句。"
 prcs.3057.a: "“如果他拥护我们的组织和党章的话，就是可以的。”"
 prcs.3058.t: "南亚赤大陆（其九）"
 prcs.3058.d: "虽然杨启斌说这次会议可能要开到很晚才会回来，但是卡拉还是一直站在村口等着他，一方面是因为他说好了要给自己带一份不错的晚饭，不过另一方面还是很担心他，毕竟自己知道这块地方的情况，他作为一个外来人……怎么说也不及自己了解。\n趁着这段等他时间，卡拉也顺带在脑海里想了一下这段时间他们都干了些什么：与自来水公司达成协议，再过两天村里挨家挨户都能用得上干净的水了。跟附近新修的发电厂取得了联系，村里的灯终于可以在夜晚持续发出它们的光芒……似乎杨启斌就像是一个超人，他之前所说的承诺，都一点点的在兑现。\n对，还有这些没做，靠着路灯，卡拉从自己随身口袋中拿出来本子和笔，记下了一件看似虽小实则很大的事情——让村里人看病简单一点，可以去请一个医生（划掉），或者我去学医术，这是重点，需要认真对待。\n“写这么认真，在写什么呢，我看看。”杨启斌二话不说的凑了上来，看着灯光照射下，卡拉的任务笔记本上他们还有多少没做到和新增添的事情。\n“看起来，你要去学医吗？可你才刚刚熟练的用口头中文，看得懂那些医学书籍的专业名词吗？”卡拉点了点头，通过这段时间和杨启斌以及警卫员的交流，他可以流畅的说着中文了。\n“这样，卡拉，我刚刚在会议上跟印共的人聊了一嘴，我的任务期限马上就要到了，再过一段时间就要回到祖国去了，但是这边的重建工作才刚有起色，我很担心我走后，这块地区会回到以前的那种困境之中。”\n什么，他刚刚说，他要走了，虽然这段时间他们两人一直在忙，却不曾想到时间过的这么快。眼见卡拉明显的失落了，杨稍稍的咳嗽了一声，“卡拉，我平日里是怎么跟你说的。”\n“准备着，为共产主义而奋斗。”卡拉的声音坚定。"
 prcs.3058.a: "“那么接下来，你我的奋斗便有了新的目标。”"
 prcs.3059.t: "南亚赤大陆（结局）"
 prcs.3059.d: "“这是你的申请通过书，卡拉同志。”在他家乡旁边，新设立的党组织正式为他佩戴党徽，当他轻轻的抚摸着这枚略有重量的党徽时，他的思绪总能回到那晚。\n在那一晚，杨启斌留下了一封入党申请书和佐证资料便悄然离开了，他们是直到第二天早上才发现房子门口的两个警卫员不见了，才意识到了杨启斌的离开。他们村里人当日都恍惚了一下，计算起来这短短的几个月过的竟然这么快，年轻人嘟囔着自己还啥都没学会，还想给他看一眼现在的进度。\n而他——被委任的村干部卡拉，他想在他的房间里找到更多信息，想知道他有没有给他们规划之后的安排，但很明显，这并没有，正当他打算放弃的时候，在枕头下，一封信露了出来，他迫不及待地拆开来看，上面写着：\n\n致卡拉\n不必特别思念我，我的时间其实早就到了，但为了能在这片土地上做更多的事情，我向组织申请了两次延长的请求并都得到了通过，这次组织需要我到新战线上继续革命，所以调任。\n在这些日子中，我愈发的感觉得到，你身上那一股奋干的劲是让我们合作愉快的重要基础，还有你对我的建议采纳。老实说，我一直想为你们多留一些东西，但是鉴于能力有限，我只能向你们当地的党组织写了一封推荐信，你可以拿着申请信和佐证资料去申请，继续为这里的人民服务。\n时间过得真快，眨眼间就到了说分别的时候，我希望你能从今往后，把一切的精力都奉献给我们许下的诺言——让我们的村子越来越好。\n                                                        写信人：杨启斌\n在红旗之下，他逐渐理解了杨启斌的意思，在离开了他，中国，援助之后。卡拉，印度，必须独立的进行着社会主义改造。捧着共产党宣言，卡拉缓缓的说了出来那一句话。"
 prcs.3059.a: "“我志愿加入印度共产党……”"
 prcs.3060.t: "不可名状之物"
 prcs.3060.d: "当覆盖着这个雕塑的红布被缓缓揭开，一个庞然的怪物出现在了众人面前。\n乍一看，这个雕塑像一只巨手，混凝土所造的手掌伸向天空，仿佛要摘取太阳，而那些锈蚀的钢筋那么露骨地显现出来，有的地方甚至只有钢筋没有水泥，这只巨手深深地扎在基座上，不顾一切地要向上，无论是抓取，还是攀登。那些伸出来的“树枝”却又使得这个雕塑像一棵巨树。\n它没有青翠的枝叶，枝头上取而代之的则是无数张贺卡、围巾、新娘的盖头、包头巾、笔记本。钢材、水泥电线杆、木柱子，没有多余的加工，它们齐心协力地将这个雕塑支撑住，让巨树稳稳屹立，让巨手托起了天空。而在雕塑的最顶端，静静地躺着一个雷达锅。阳光射下，反射在这抹上了特殊涂料的雷达锅上，使得它目光如炬，将自己的视线射向太虚之中。这个雕塑不需要别的涂料，只展露着自己最原始本真的颜色。\n这颗巨树下，有泥巴所捏的小人，五官不分；有那带着青苔和泥巴味的瓦片；有木工用的凿子和漆匠用的刷子；有绘着花朵的缺口青瓷碗；有已经生了不少“麻子”的搪瓷杯；有泛着些许蓝色的玻璃，铝壳将它包裹其间；在这些的尽头，静静地躺着一部熄了屏的手机。数据线、电线、网线讲这些物件紧紧地连在一起，使得它们抱成了一团，组成了雕塑的基座。而黄土、黑土、红土错落有致，将这些物件彻底抱在了自己的身体里，使得它们紧密相拥，不再分离。还有很多东西，还有糯米、粉碎的玉米秸秆、沾着点灰色的面粉。\n基座托起了这只巨大的手掌，让它手掌得以托起那望向太虚的雷达。巨树的根基深深地扎入在这基座内，与这基座如恋人一般相拥。\n这是什么？有用之物放错了位置，在这里拼接起了这样一个不可名状之物，那么这就必然是垃圾——但果真如此吗？\n谁创造了它？创造者太多，一块铁板或者铜板亦不可能写下。但是创造者也很少，少到名字也只有一个。甚至这个创造者也常常被我们提起，就在我们身边。\n我们该如何称呼这个雕塑？这确实是一个好问题。它的创作者们正热烈地讨论着这个话题。这个说叫“我们”，那个说叫“生活”，还有更文艺些的名字“天穹之下的众生”……但最终，大家没能达成共识，于是它的名称栏中就落了个空。"
 prcs.3060.a: "在不同人眼中，它或许有着不同的含义。因此，区区一个名字无法定义它。"
 prcs.3061.t: "“拨乱反正”——哲学问题大争论（其一）"
 prcs.3061.d: "学术界关于哲学问题爆发了激烈的争论，不同学者进行了个人见解的抒发，当然，这不止限于期刊，还有讨论会，以及——互联网评论区。\n——论文\n在改革开放四十年以来的哲学学术界讨论当中，实践本体论一骑绝尘，作为主流教科书式体系。在我国的高等教育传授中，无疑只有围绕着实践为中心的马克思的“实践哲学”才是真正的马克思主义哲学。在如今重新面向改革开放的“后四十年”历史进程，更应当高举“实践就是检验真理的唯一标准”大旗，奔向历史的新进程。\n现在有人企图否定我们说“实践就是检验真理的唯一标准”的提法，实际上就是反对马克思主义哲学的历史唯物主义，这是学术界的一股歪风，在我国90年代以来的市场经济环境下，围绕着实践为中心的主体性哲学是长期以来指导我党的人道主义哲学，这种人道主义哲学是反对文革“左”的错误的严重束缚而生的。\n——《为实践哲学辩护：在新方针下的思考》\n——论文\n……事实上，强调“人道主义”的并非什么坚定的马克思主义者，沾染着小资产阶级情绪的所谓“人道主义马克思主义者”，必然会导致取消掉对于马克思主义的哲学合法性。事实上，这是“倒退”回去拥抱了费尔巴哈的哲学，这事实上是一种反动的人学宗教。我们不论68年后在欧陆哲学中的人道主义破产，单纯看赫鲁晓夫改革后的学界“人道主义转向”，我们就需要将这套所谓的真正符合马克思的“实践哲学”打上一个大大的问号。\n他们抱着那套主体性、异化逻辑与形而上学，企图在复苏计划经济，复苏真正的马克思主义科学的情况下继续高举“实践就是检验真理的唯一标准”，这仍然是一种经验主义形式的新体现。企图继续为错误辩护，继续为自己的新教条主义辩护，是完全没有合法性的。\n真理的标准，以及真理本身，都是实践的结果，对于任何一种情形的拜物教式崇拜，对于任何经验主义高扬，都是反辩证法的资产阶级意识形态。——《保卫马克思主义科学》\n——\n评论区\nxx网友：\n人道主义问题是个老问题了吧，怎么重搞计划经济还有人吹\nxx网友：\n是这样的，这里感觉和阿尔都塞差不多了\nxx网友回复xx网友：\n阿人是这样的，西马是这样的\nxx网友：不知道现在怎么又吵起来实践问题了"
 prcs.3061.a: "新的真理标准问题大讨论？"
 prcs.3062.t: "“拨乱反正”——哲学问题大讨论（其二）"
 prcs.3062.d: "——致《为实践哲学辩护：在新方针下的思考》\n一个哲学问题，是不可能会有非常严谨的真正答案的，我们都经历过政治压过学术的历史，我不希望在所谓“新方针”的幌子下，再被这些明显带有“左”的倾向的青年学者们攻击和诋毁我们的个人立场了。\n——论文\n这位青年学者的论文简直就是诋毁，他攻击我们继续坚持主体性是所谓的资产阶级意识形态，他们甚至把我们比作为中国的“斯捷潘年”，这种行径，和过去那些“文革余孽”们有何区别！\n他们是否忘记了马克思早在《关于费尔巴哈的提纲》里就强调过，费尔巴哈他们是没有“当作实践去理解”，不是从主体方面去理解。因此，和唯物主义相反，能动的方面却被唯心主义抽象地发展了。对于主体性，能动性的否定，就会和阿尔都塞一样陷入结构主义的僵死泥潭，只会在某种“无主体”的梦呓中无止境地打转和再打转。\n——论文\n某位教授将我的保卫称之为诋毁和攻击，是我触碰了这位老教授的敏感神经，不过，我承认是我的言语过于激烈，但是科学不容质疑，某些学者将我称之为中国的“新阿尔都塞”，如果说我们一样为马克思主义的科学辩护，那么我就是中国的“新阿尔都塞”。\n但是教授似乎很了解阿尔都塞，通过强调“无主体”来否决我对科学的强调，可事实上，“无主体”是对阶级斗争的历史动力的直接复归，它恰恰是对马克思“阶级斗争所书写”的强调。在新方针，新计划经济的指导下，在为前三十年辩护的条件下，强调科学，强调政治挂帅，阶级斗争，都是为了将我们作为马克思列宁主义者的理想，重新拉回到现实斗争当中。为了新方针，为了新理想，我们不介意从任何学者身上寻找可能性。\n——论文\n两位学者从某种角度上都陷入了一定错误，我们可以从张一兵的角度上带入思考。历史辩证法存在两个“向度”——“主体向度”与“客体向度”，对二者的辩证法关系锚定，是至关重要的学术议题，在“新方针”下，再度讨论这一问题的重要意义是不言而喻的……\n——\n争论不会停息……"
 prcs.3062.a: "怎么吵起来没完了？"
 prcs.3063.t: ""拨乱反正"——哲学问题大讨论（其三）"
 prcs.3063.d: " "《彻底清算实践唯物主义——一种反动哲学批判》，这名字……" \n"诶，张老师，还在看大字报呢。" \n张一兵摆了摆手，"学生有些个人想法是好的，但如果使批判重新回到斯大林主义的角度，这是错的。" \n"那张老师您怎么看。" \n"我大体看了一遍，如果你熟悉马克思主义哲学发展史，尤其是，如果你了解过改革开放以来的中国哲学界，你就会发现，他的理论话语，同我们所曾批判的所谓‘教条主义’基本是一致的，唯一的不同可能是他们的批判多了些当代的哲学内容。"张一兵比划了一下纵向的历史发展脉络。\n"那你怎么看出来的呢？"学生看向张一兵，好奇这位老师会说些什么。\n "你看这个部分，就是说他，这篇文章的作者，根本就没有认识到，物并不是它自身，注意，物不是它自身。我早在《回到马克思》里就说过，马克思的历史唯物主义实际上以历史的实践解决了康德的难题，这也是我在讲座里提到的，三个‘第一性’，然而这位作者不仅没有认识到马克思的那种关系本体论，没有认识到马克思的历史唯物主义的‘透视’，选择倒退回那种‘从客体出发’的形而上学唯物主义。"张一兵摇了摇头。 ""显然，他批判的是东欧马克思主义，比起改革开放后的中国学界，更接近南斯拉夫的实践派。"\n "对，举个例子，杨耕教授的实践唯物主义就是历史唯物主义、辩证唯物主义的高度统一，这种简单的人道主义划界是庸俗的。"助教在一旁开口附和。\n学生想了想，张开嘴说："
 prcs.3063.a: "“张老师，我还有一个问题。”"
 prcs.3064.t: ""拨乱反正"——哲学问题大讨论（其四）"
 prcs.3064.d: ""人本主义、异化"，操弄着早在1968年后随着五月风暴破产了的人道主义语言，关于哲学问题的大讨论进一步在互联网上升级，从"西方马克思主义"的探讨，到改革开放四十年以来的学界"实践唯物主义共识"。为了避免语焉不详，重新讨论实践唯物主义、辩证唯物主义与历史唯物主义，便成了当今哲学界的普遍共识。\n杨耕对谈张一兵。\n杨："实践唯物主义、历史唯物主义和辩证唯物主义，实际上是马克思新唯物主义的三个特点，比如你去看马克思的《关于费尔巴哈的提纲》，‘从主体出发’的实践本体论本就是历史性的了，现在很多人批判实践唯物主义，实际都是重复斯大林早在《论辩证唯物主义与历史唯物主义》中那种‘自然对等历史’的错误，这也是苏联教科书一直到80年代末都存在的错误，我早在《马克思主义哲学体系研究》里面就说过，苏联教科书体系与中国的教科书体系编撰是有区别的。"\n张："对，艾思奇的那本《辩证唯物主义与历史唯物主义》就要比苏联编撰的《辩证唯物论与历史唯物论》要有很大进步。"\n杨："斯大林的错误在于，他把辩证唯物主义到历史唯物主义的逻辑变成了‘自然如此，人类社会自然如此’的逻辑，然而这根本是无法把握到马克思的深意的。"\n张："苏联教科书式体系的理论构境与马克思的哲学是根本存在差异的，斯大林并未深入到马克思的新唯物主义构境，他的理论构式仍旧停留在旧唯物主义的层面上。"\n\n《对谈"新左派"》\n记者：您好，这次哲学大讨论您有很大参与，请问您怎么看现在的讨论环境，或者说，您怎么看待。\n蒋箫：无论是张一兵、杨耕还是孙正聿，这些人无一例外都是人本主义逻辑，对于实践，可以做客观的解释，也可以做主观的解释，实践唯物主义从它在中国被提出以来，一直都是官方搪塞现实矛盾的喉舌。张一兵如今大谈主体，难道是忘了他曾经在90年代便说过，"给人民以热情和给人民以科学是根本不同的"？\n所以我早就说过，这些官方的辩护师，这些御用的笔杆子，本质都是脱离群众的迂腐知识分子。"
 prcs.3064.a: " "先生，我还有一个问题……" "
 prcs.3065.t: ""拨乱反正"——哲学问题大讨论（其五）"
 prcs.3065.d: "《对谈"新左派"》\n记者：既然你如此评价，那我想问问您对哲学的看法是什么呢？\n蒋箫：恩格斯所讲的哲学基本问题就是整个哲学的基本问题，互联网宣布不具备合法性的"日丹诺夫体系"的本质，是列宁主义，毛主义哲学，否决"日丹诺夫体系"的本质，是否定列宁主义、毛主义哲学。在否定"日丹诺夫体系"的歪旗下是名副其实的西马反动哲学，本质仍是资产阶级的唯心主义。我们以阿尔都塞为例，如今"潮流"的阿尔都塞研究，根本就是小资产阶级的反动哲学宣扬，阿尔都塞本人既不唯心主义也不唯物主义，这说明阿尔都塞本人就是一位摇摆的反动小资产阶级知识分子。贡萨罗主席给出的评定是绝对正确的，这位法国哲学家，这位结构主义马克思主义者，是根本的法国修正主义者。\n记者：好的，您提到西马，请问您可以评价一下西马吗？\n蒋箫：西马是一群资产阶级知识分子，是忽视经济基础，忽视了国家机器，只注重文化斗争的反动哲学家，比如卢卡奇、科尔施与哈贝马斯，如果近一点，就是齐泽克、福柯与阿尔都塞。这些人的共同特点，就是根本没有实践，西马本质是非马，是反马。某些人说西马概念是个地理概念，这是完全的谬误，因为西马本质是一个意识形态概念，它是一种反对列宁主义反正统、主张某种资产阶级思潮解释、补充和改造马克思主义的意识形态概念。\n记者：好的，那您可讲一下您的哲学观吗？\n蒋箫：好的，哲学的基本问题，是思维与存在的问题，存在的本质是一种客观实在性，这种实在性就是物质，世界统一于物质，我们对物质进行认识，认识的就是物质的本身，否认这一点是一种反马克思主义认识论的言论，这是一种不可知论……"
 prcs.3065.a: ""感谢您接受我们的采访，明天，另一位同志也想与您对谈。""
 prcs.3066.t: ""拨乱反正"——哲学问题大讨论（其六）"
 prcs.3066.d: "哲究：你好，初次见面，客套话我就不多说了，我直入主题。\n蒋箫：好。\n哲究：第一，你对西马的定义一旦来到细究，就会立刻变得含糊不清，无论是1968年之前的卢卡奇、科尔施、哈贝马斯抑或是马尔库塞，首先我认为，安德森关于西方马克思主义的定义，尤其是其对国家机器的分析与经济基础分析的缺场，我都是完全不反对的。但是这个帽子扣到阿尔都塞头上就令人感到忍俊不禁了，但凡你看过《论再生产》《在哲学中成为马克思主义者》此类70年代文本，就不可能对其评价为安德森意义上的西马，纵使是你所说的"反正统"（反列宁主义）也根本扣不到阿尔都塞头上的。\n蒋箫：打断一下，首先，阿尔都塞的小资产阶级性质我是已经说过了的，为其辩护你是何居心？其次后期他的偶然相遇的唯物主义，难道在革命低潮期看到阿尔都塞这位反动哲学家的本质是做不到的吗？难道这些在革命高潮期写作的文章不是他的表面伪装吗？\n哲究：令我感到无比搞笑的是，你在这里就有一个先验预设，就是阿尔都塞是反动的，那么在一切论述当中都必须来到对其的否定问题上，这难道不是一种先验主义的唯心主义作祟？你在这里扣帽子对评定没有丝毫意义，这就是阿尔都塞专门批判过的目的论。\n蒋箫：可是……\n哲究：我继续说了，第二，对于物质本身的认识，这俨然是倒退回前康德那里去，但是无论如何，康德命题本质是抽象的，一旦对物质的认识来到了简单的正确与非正确，闭口不谈从主体出发的意识形态问题，这种简单到极致的命题只会使马克思主义的认识论丧失掉任何的历史性。首先，马克思的新唯物主义，用徐崇温的话来说，马克思的"实践唯物主义""主张对于事物、现实、感性，不只要从客体或者直观的形式去理解，而且要把它当作人的感性活动当作实践去理解，从主观方面去理解;另一方面，又始终坚持唯物主义，坚持外部自然界的优先地位"。对物质的认识首先是历史性的实践活动所生成的，这是社会关系的"优先性"发生。"
 prcs.3066.a: "再者……"
 prcs.3067.t: ""拨乱反正"——哲学问题大讨论（其七）"
 prcs.3067.d: "哲究：你把批判变成扣帽子加攻击帽子就很难绷的住了，这和张一兵对之前的批判所做的批判是恰好符合语境的，因为你真的是在攻击帽子，搞语录本摘抄。再者与其说你真的是在保卫毛主义哲学，不如说是根本意识不到自己在保卫的是什么。经国外学者考证，毛的《矛盾论》文本中的辩证法叙述更接近于"黑格尔化的列宁主义"，因为早在毛写作的时候，列宁如今被视为《哲学笔记》的相关文本就已经译介到了毛那里，你在这里避而不谈恐怕不是因为什么考证，只是因为看了篇"大佬"文章想要复读吧。\n蒋箫：首先，我应当澄清，你们所攻击的"苏马"本质是列宁主义哲学、毛主义哲学，《哲学笔记》我读过很多遍，这是我得出的结论，《唯物主义与经验批判主义》本质和《哲学笔记》没有什么分别，你们在这里切割是完全错误的……\n\n……\n\n讨论是激烈的，争执是驳杂的，哲学问题达成共识，这远比在实践上达成共识更困难，争论将继续下去，但是历史仍需继续书写，在抽象思辨上成立的结论，不一定会在现实上成立。正如毛在审阅"五评"苏共中央公开信的文章《在战争与和平问题上的两条路线》上所写的批语那样——"
 prcs.3067.a: " "社会实践是检验真理的唯一标准。" "
 prcs.3068.t: "监察"
 prcs.3068.d: "这是一个平平无奇的早晨，老张慢悠悠的去路边摊买了油条和馒头，他突然想起来，早上和老王有约去公园下象棋，老张看了看手表，发现自己快迟到了，于是他打出租车匆匆忙忙的来到公园。\n老张急匆匆的跑到公园，却发现，老王正在认真看着手机，以至于棋子没有摆好，棋盘上的手抓饼只是吃了几口，老王眉头紧锁，眼睛直盯着手机里面的内容，一只手握着手机，另一只手放在大腿上，老张心想，平时老王也不这样啊，都是下象棋下一天，没怎么看手机，于是，老张问道：“老王，发生啥事了，你这棋也不下，饭也不吃，不对劲啊。”\n老王一听到声音，抬起头来，“啊，昨天中央说要搞检察权改革，说是要把监察的权力交予人民群众，我看这新闻看半天还是搞不懂这是怎么搞，你墨水比我多，过来帮我看看。”\n老张凑近去瞧了瞧，这新闻说的监察权改革涉及到非常非常多的内容，比如说科技反腐，组织改革方案，以及纪委的相关讲话，老张也看的很头晕，“我也看不懂，你说这不得是个大工程啊。”“是啊，我也没见过这么大的阵仗。”老王也同意到。\n老张顿了一会，看到下方反馈链接，突然想到一件事，于是他立刻说道“哎，你说，这几年咱这小城出了多少个贪官地头蛇，抓了一批还有一批，我看不懂这个监察改革，但咱们可以给点反馈，给这工程出点力，没准这工程完成了以后咱抓贪官就轻松多了。”\n老王听他这么一说，思索了一会："
 prcs.3068.a: "“你这么一说，我也想亲手抓住贪官。”"
 prcs.3069.t: "诗，子弹"
 prcs.3069.d: "亲爱的朋友：\n当你看到这封信的时候，我已经搭上了中国兄弟的战舰。这些神秘的东方来客过去为我们带来丝绸，现在则要带我们返乡。愿真主保佑他们。\n你也许会感到疑惑不解，我只是一个文学系的学生，不是战士，也不是狂信徒，为什么要冒着死亡的风险去参加这样一次以卵击石的战争。为什么要以战争而不是和平的方式归家。\n我曾经狂妄自大，希图以无数诗篇与和平的呼吁让全世界看到我们的家乡并没有被以色列人和暴君彻底摧毁，那里仍旧存在着文化，存在着美好，存在着人类值得惋惜的一切。我希望为我的人民写下千卷史诗，让全人类都看到你我的一致性，共同放下武器为和平而前进。我在摄影师面前轻声歌唱，希图让大家看到我们的家乡仍有心地善良的孩童，他们知道如何照料白鸽，我希望洗去暴君与以色列人乌鸦上的烟灰，让大家看到被黑烟笼罩下的白色羽毛。\n但死者对我说，够了。敌人的乌鸦是用煤炭做的，它们不可能改变。数十年以来，殖民者对他们的支持让他们肆意妄为。他们一次又一次的血腥胜利让他们豁免了自己的一切罪行。我们的人民心胸如圣徒般广阔，但这一切的现实终究让他们的心脏难以忍受。而现在，一场又一场的战争在这片土地上展开，我绝不能放过他们。我没有资格代替那些已经死了和正在死去的人们原谅这些人，更没有资格对他们大谈和平。而倘若我们无所作为，随着时间流逝，大家便会假装一切都没有发生，继续在牧羊人的笛声里温顺地走入屠场。我将在那里，用我手中的笔记下我们的人民，记录他们是如何前仆后继地冲向黎明，记录我们的先知走向牺牲者。\n朋友，如此，我便去了。我将回到家乡。朋友，记住，不要期待敌人读你写下的诗歌，他们永远不会。哪怕你手中只有一抔黄土，也将它砸向敌人。"
 prcs.3069.a: "流亡的诗人回来了，手里带着步枪。"
 prcs.3070.t: "大国小鲜"
 prcs.3070.d: "他无聊的转着笔，原本聚精会神的心思早已发散到天外，把自己和嘈杂的会场隔开。他决定给空荡荡的思想找点事干，于是又开始想起了那个他想了无数遍的事情：“为什么我要来这里？”\n起初，当基层民主政策公开之时，他还十分兴奋的在朋友圈里发出了自己的心声："扫清一切害人虫，全无敌！"在大会最初召开的时候，他也感受到了这种气魄——和熟识的邻居们一起工作，搜集各种信息，看着平日耀武扬威的大人物在大会上战战兢兢的回复着人民的质询，的确像是在做改天换地的工作。但之后的事情就没这么美好了：各种鸡皮蒜毛的事情充斥着会场，什么"小区门口垃圾桶的位置不合理"、"楼道灯坏了三个月没人修"、"隔壁老王家的音响声音太大影响休息"。他本以为基层民主带来的会是激情四射的辩论，会是对剥削阶级的无情批判，会是翻天覆地的社会变革。结果却是张家长李家短，邻里纠纷和物业管理。\n台上，居委会主任正在念着前几次整改清单的汇总："关于三号楼电梯异响问题，物业公司已经联系维修人员...关于小区健身器材损坏问题，预计下周完成更换..."\n他看了看周围的邻居们，大多都在认真听着，时不时还点头表示赞同。李大妈正在记笔记，准备等会儿发言；隔壁的小张正举手示意要反映新的问题。这些人看起来都很投入，仿佛这些琐碎的日常事务真的关系到国家命运似的。\n"或许问题出在我身上？"他开始自我怀疑。也许革命不总是惊天动地的，也许改变社会就是从这些细微的地方开始的。但是...这和他在网上看到的那些慷慨激昂的文章、那些关于人民当家作主的宏大叙述相比，实在是太过平凡了。不过，他看着周围邻里认真的讨论，也不好意思继续神游下去，而是打起精神，重新投入到会议中。"
 prcs.3070.a: "只是，这和他当初的期望相比，实在是太不一样了。"
 prcs.3071.t: "金鸡报晓"
 prcs.3071.d: "亚洲，深陷在地球的巨大阴影之中。在地球的暗面里，无数双布满了血丝的眼睛都不约而同地盯紧了亚洲大陆的东方，目不转睛地盯着那面向日出方向的赤色雄鸡。\n黑夜的铁掌倒扣在人们头上，越是这个时候，这双黑手便扣得越紧、越严丝合缝、越密不透风。他们害怕雄鸡，害怕那一声迟到了数百年的啼鸣。他们无数次想要将那它窒息、折翼乃至于大卸八块。但是在那一次次的浴火之后，那一只雄鸡已然长出了凤凰的羽毛，堆好了山一般的薪柴，只待那最后的涅槃时刻。而越是到这个时刻，黑夜越是惊恐，因为他们知道那一声划破寂静的鸡鸣将使夜幕燃烧，使星海沸腾。\n夜幕下的人们翘首以盼，枕戈待旦。数百年来，他们的眼睛已经习惯了这漆黑的夜，他们的耳朵已经屈服于这万马齐喑的夜，他们的心也收紧了节拍，生怕心跳声也将引来夜的扼杀。他们已然忘记了自己是谁，已然忘记了自己曾经还生活于阳光之下，已然忘记了这个世界是众生平等的，没有什么人天生地高贵于其他人。而现在，这一切即将画上句点，人们只是在期待着一个信号，期待着一个手势，一声惊雷，让他们饮下这一口愤怒的烈酒。\n雄鸡屹立于这世界的屋脊上。它昂首挺胸，它静心等待。数百年的风雨兼程已然让它学会了耐心，而这数百年的腥风血雨也告诉了它一个道理：太阳不会，也不可能被一声鸡鸣叫出来。唯有熊熊升腾的烈焰，才能彻底焚毁这比铁还重的夜幕，唯有发自数十亿灵魂底层的怒吼，才能彻底撕碎这万马齐喑的死寂。为此，它已经准备了许久，等待了许久……\n地球缓缓地转过身去，亚洲逐渐地走出这颗星球上的巨大阴影。太平洋的海平面上已然泛起了那一抹明亮的鱼肚白。所有人的心脏都骤然提起，屏住了呼吸，捏紧了手中的武器。\n雄鸡抖了抖翅膀，将自己的头高高昂起，对着那从地下升起的光芒，用尽那从百年以前就积攒起来的力量与怒火，发出了一声跨越了地域、民族、语言、文化的啼叫——\n“这里是世界解放阵线人民之声频道，”"
 prcs.3071.a: "“现在播报《世界解放阵线告亚洲人民书》。”"
 prcs.3072.t: "甄选良种"
 prcs.3072.d: "经过中央委员会宣传部的讨论，就目前，我们的主要宣传方向有五个。\n\n首先自然是我们本届政府一直在努力推动的社会主义文化自由政策。我们冠之以旧名“百花齐放”。宣传文化与艺术自由有利于我们政府的开明形象。\n\n其次是呼应青年重新燃起的思想启蒙热情，对现有的马克思理论进行重新整理和发行，也鼓励民间阐释与讨论各种马克思主义的浪潮。\n\n或者，我们可以鼓励无产阶级艺术，鼓励无产者进行自我艺术创作，吸纳先锋艺术和未来主义的优点。\n\n国际主义作为一个近几年提出的热点，宣传部当然也可以加大马力宣传，用来鼓励人民走出自己的孤立主义小家，支持党的世界政策，我们也可以恢复相应的文化输出，与资产阶级的“普世价值”打擂台\n\n最后，我们也可以重提“阶级斗争”，鼓励“抓生产，促革命”，通过我们的实践成果与统计，我们会着重宣传我们的体制优势与人民的奋斗精神，打破资产阶级对于生产所谓的“霸权”。"
 prcs.3072.a: "不必操之过急，让我们看看手上的选择。"
 PRC_tfr_nl_china_zhenxuanliangzhong_tt: "“宣传部门的能力有限，实际上，我们的宣传核心最好不要超过两个……”"
 prcs.3073.t: "课堂上的辩论"
 prcs.3073.d: "“同学们，今天我们开始讲马原课，那么接着上回，什么是物质呢，物质是不以人的主观意志为转移，不依存于人的感性认识的。。。.”讲台上，一个老头正在白板上大书特书，上面写着这节课的内容，并且回头望了望台下，却发现同学们要么上课打瞌睡，要么低头玩手机，再要么是转头和别人聊天，老头觉得有点不自在，于是决定点个名好好整肃一下课堂纪律。\n“那个后排左手起第二的，你来回答一下，什么是物质。”老头看着后排，随便点了一个人，而被点到名的同学就倒霉了，他正在睡梦中畅游世界，同学一个拍肩就把他叫醒，“喂，到你了。”“啊？我什么？”“起来回答问题了。”很显然，他被吵醒这事感到严重不愉快，眼角耷拉着，嘴唇微微张开。\n“那个，你来回答一下什么是物质。”老头说到，心里想嘿我总算逮到一个，不拿来杀鸡儆猴白浪费了这次机会。“嗯？老师，课本上这个物质不就是康德的物自体吗？一个独立于人之外的物质并且决定人的认识，这跟《费尔巴哈提纲》第一段说的大相径庭，因为原文其实说‘旧有的唯物主义并不是从人的感性认识和实践出发，而是从客体出发’”\n老头一脸不可思议，问道；“那你要不上来跟大伙讲讲什么是物质，你这么厉害要不代我上一节课？”没想到，这位同学说；“可以啊，我顺带给大伙讲原著给大伙看看课本和马克思本人的思想有什么区别。”只见这位同学慢悠悠的走向讲台，拿起笔来就是画来画去，从《纯粹理性批判》一直到《德谟克里特的自然哲学和伊壁鸠鲁的自然哲学的差别》，他一边在白板上写各种书名号，一边停不住口在给大家解释，只见，原本自顾自玩自己的同学们都被他勾起了兴趣，有些人甚至起来跟人家辩论，到底谁的逻辑是对的。\n老头坐在旁边，乐呵呵的看着这些年轻人讨论，心想，没想到居然会真的有年轻人去真的研究马克思，甚至水平比他这个老头还高，“或许我应该准备退休给新人上来讲课了。”老头如此打算道。"
 prcs.3073.a: "是故弟子不必不如师，师不必贤于弟子。闻道有先后，术业有专攻，如是而已。"
 prcs.3074.t: "胜利演讲"
 prcs.3074.d: "董军上将站在后台，深吸了一口气，手中紧握着那份已经被他反复修改过无数遍的讲稿。透过幕布的缝隙，他能看到台下黑压压的人群——记者们、军官们、政府官员们，所有人都在等待着这个历史性的时刻。\n\n就在不久前，他接到了来自东海舰队的那个电话。电话那头的声音颤抖着告诉他：先遣舰队在台湾海峡海域与台伪舰队发生激烈交战，经过6小时的海战，台伪舰队主力被全歼，台伪政权的海上防线彻底崩溃。那一刻，董军感到自己的心脏几乎要跳出胸膛。\n\n随后的时间里，一切都变得如梦似幻。前沿部队的消息接踵而至——五星红旗插上了日月潭畔，插上了阿里山顶，插上了台北101大楼，战报传递的速度几乎赶不上战士们推进的步伐。随着台伪政权彻底崩溃，中央要求他代表军方发表正式声明。他知道，这将是他军旅生涯中最重要的一次讲话，也将是载入史册的一次。\n\n现在，当工作人员示意他可以上台时，董军点了点头，整理了一下军装，迈步走向演讲台。每一步都显得格外沉重，不是因为紧张，而是因为这一刻承载着太多的重量。当年那些在古田会议上确立军队政治原则的先辈们，在长征路上不畏艰险的红军战士们，在抗美援朝战场上血战到底的志愿军英雄们，在台海战役中光荣牺牲的烈士们，此刻仿佛都在注视着他。\n\n台下响起雷鸣般的掌声。董军站在麦克风前，环视四周，看到了无数双期待的眼睛。"同志们，同胞们！"董军的声音穿透整个会场，铿锵有力，"今天，是属于中华人民共和国的又一次伟大胜利！宝岛台湾，终于回到了祖国母亲的怀抱！"\n台下爆发出雷鸣般的掌声。董军望着台下那些激动的面孔，心中涌起一股无法言喻的自豪感。他继续念着讲稿，但心早已飞到了重归一统的祖国之上——从黑龙江的冰原到海南岛的椰林，从帕米尔高原的雪峰到台湾海峡的碧波，960万平方公里的土地上，再也没有分裂的阴霾，只有统一的阳光普照大地。"
 prcs.3074.a: "而今得见九州同。"
 prcs.3075.t: "去竞价、定格局、收招标"
 prcs.3075.d: "国家电力部重组方案落地“两网五大六小”业务版图重构 电力建设全面推行指令性任务模式\n新华社 讯 在国家电力规划与发展委员会正式揭牌运行一周后，国务院今日正式印发《关于深化电力体制改革优化主体功能布局的实施方案》，该方案标志着我国电力系统进入深度重构期。对“国家电网”“南方电网”两大电网企业，“华能、大唐、华电、国家能源、国家电投”五大发电集团，以及“三峡集团、中核集团、中广核集团、华润电力、国投电力、中节能集团”六家特色能源企业（统称“五大六小”）的业务范围进行战略性重划，并正式宣告终止“竞价上网”机制，全面取缔电力建设招标制度，建立国家任务指令体系。\n\n根据方案，原有“两网”中的国家电网公司将统一运营全国特高压输电网络；南方电网公司则继续深耕南方五省的智能电网建设并建立东南亚跨境电力交易平台。对于“五大六小”，华能集团与大唐集团将专注于传统能源转型与灵活调节，承担全国60%燃煤机组清洁化改造；国家电投集团、华电集团主导新型能源体系建设，负责沿海省份海上风电开发；国家能源集团转型新能源综合投资平台统筹开发西北风光大基地，配套建设千万千瓦级储能项目；三峡集团聚焦于全流域水电开发主体整合长江、金沙江流域水电站，组建流域统一调度中心；中核集团、中广核集团聚焦核电专业化运营，分别负责压水堆、快堆技术路线开发与运营；华润电力、国投电力将主攻于区域综合能源服务，重点发展工业园区综合能源解决方案；中节能集团将以分布式能源整合平台、统筹屋顶光伏、生物质发电等分布式资源开发为核心。\n在电力建设层面，“中国电建”与“中国能建”两家集团将完成合并，建立 “中国电力建设集团”，承接所有特高压工程和电站建设任务，不再参与公开招标；设备制造企业（如哈尔滨电气、上海电气等）实施“研产用”一体化绑定：分别对口服务“五大六小”，技术研发由国家实验室直接指导。另外，实行二十余年的电力建设招标制度也被取消，由“国家任务令”模式取代，将于每年3月由电力部发布《电力建设任务白皮书》，经由委员会及各集团代表讨论指定项目承建方，在监管体系引入AI全流程监造系统，对设计、施工、验收实行区块链存证并在所有特大型项目配备中央督导组驻场监督。\n\n此次深度重构标志着我国电力体制正式进入 “全国统筹发展新阶段”。“改革不是简单的体制回归，而是立足能源安全与低碳转型的战略选择。”，随着五大发电集团领导班子调整完成和任务令系统上线运行，我国新型电力体系建设进入以国家计划为主导的全面加速期。"
 prcs.3075.a: "电力规划走进新时代。"
 prcs.3076.t: "剪不断"
 prcs.3076.d: "当把手中的最后一本书放入背包的时候，王辰诚终究是叹了一口气，自己平日里和过去所宣传的那种口号和理想似乎也要被现实所击破。他不甘心，在那使用多年的木桌上，放着一张令他喘不过气来的纸——《关于对王辰诚老师培养和发展的进一步规划方案》。\n当时还在学校的时候，他就被舍友调侃，你进新疆容易，出来可就难了。当时他还不明白这句话是什么意思，直到这份文件突然发下来的时候，他的心被揪了一下，到底从什么时候开始，自己已经放不下这一群娃娃了呢。\n“我们相信，我们这些援疆的青年们，同志们，一定有责任和能力来帮助我们的落后和贫困地区的民众走上幸福美好的未来生活。”这句话是自己作为援疆代表时所说过的话，眨眼之间，这句话在满天的黄沙和太阳的灼烧下得到了考验，但还没到最后一步。\n门在这时被敲响，校长带着用力挤出的笑容走了进来。“王老师，你这是怎么了？”校长发问，虽然这份文件是他给王辰诚看的，但，他也不知道该怎么开第一个口，只能这样笨拙的发问。\n“我要走了。”王辰诚嘴上说的沉稳，但心已经是一个破烂不堪的玻璃，只要再轻轻碰一下……\n“王老师，你知道的，这些娃娃真的很喜欢你，但是这件事我终究做不了主，你已经为我们这个学校和这一群娃娃付出太多……”\n他还没听完，镜片就模糊了起来，不知道什么时候，眼泪就止不住的往下流，“我不想走，我放不下这……”\n“到时候你还是可以回来的嘛，你只不过是被调走去进修了嘛。”校长这样安慰着他，但是实际上，他这一走，以后就很难再回来了。校长轻轻拍了拍他的肩膀，说了两个字，便离开了。"
 prcs.3076.a: "“保重。”"
 prcs.3077.t: "理还乱"
 prcs.3077.d: "好不容易整理好了思绪和平复心情，王辰诚的手机又响了，上面显示的是他不想看到的备注人——张书记。\n\n“张书记你好，我是王辰诚老师，怎么了吗？”\n“小王同志啊，组织上的事情，考虑的怎么样了。”电话那头的声音虽然很平易近人，但是每个字又都刺痛着他这一颗即将烂掉了的玻璃心。\n\n“张书记，如果我到时候进修完毕了，我还能回来吗？”王辰诚下定了决心一般，把这个带有一点个人情感的问题抛了出来。\n“这个问题，我先向你保证，现在的这个学校的学生一定会跟上你不在的时候的教育课程，其次就是，你这个请求我会在他们开会的时候提出来，为你争取一下……”\n\n“我知道了张书记，谢谢你的关心。”\n“不要跟我们这些人客气嘛，我们在这生活了这么久，也理解你们在我们这落差太大，还有水土不服等恶性条件无法解决的痛苦。我们是真的感谢你们，所以，我才为你争取到了这个进修的机会。”\n“谢谢你。”\n“也谢谢你为新疆教育事业的贡献和付出，等一会接你的车子就到门口了，到时候会叫你的。”\n\n挂断电话后，他静静的把行李都收拾在一起，坐在床铺上点了一根烟。\n他的恍惚之间，回忆起的都是这些娃娃，而每每想到自己，都是简略的一下带过，现实驱动着他前往更加缺乏教育资源的地区，可是责任却又让他放不下自己扎根的土地。"
 prcs.3077.a: "“难受。”"
 prcs.3078.t: "离愁"
 prcs.3078.d: "“王老师，你…要走了吗？”门外一个稚嫩的声音响起来，他一下子从思绪中拉回现实，把烟头掐灭。“嗯，我要走了，有什么事吗？”一个学生推门而入。\n“老师，我有一道题还不会解，不知道你还有没有空可以教我一下。”这本是班上最没有积极性的孩子，每天在班上都是混日子，放了学就找不见人影。可在他亲自指导下慢慢的对学习产生了兴趣，更是发现了在数学方面上的天赋。他轻轻拍了拍床，让他坐下来把作业本拿出来，孩子照做了，他尽力用着平日的那种鼓励的语气点拨着他，终于，在发现自己是少看了一个条件之后，孩子顺利的把数学题做了出来。\n“明明是很基础的条件，你为什么没有看到呢？这不应该哦，以后要仔细审题。”王辰诚推了推眼镜，这应该是他最后一次辅导这个娃娃了，然而一瞬间，他感到自己左口袋中突然有分量感，轻轻一摸，是一包烟，还是一包好烟。\n“你这孩子，年纪轻轻的买什么烟呢。”王辰诚的语气一下子严肃起来，“这是哪个商铺卖给你的，我要去反馈他违法了，给未成年人卖烟。”\n“不是这样的王老师，是我不想让你走。”娃娃自己一边说着，眼泪滴滴答答的就落在了练习本上，“我回家跟我爸妈讲了你要走的事，他们就说，想给你买点东西表示感谢，最好越贵越好，因为…你也教过我们…一日为师，终身为父…”\n说着说着，王辰诚的喉咙也被这一盒烟堵住说不出话来，他们家本身就是背靠老天爷吃饭的，这烟一定是家里决定了好久才买下来的，望着这个正在哭泣的娃娃，他只能强忍着自己要流出来的眼泪，摸着头安慰道。"
 prcs.3078.a: "“我知道。”"
 prcs.3079.t: "别是一般滋味在心头"
 prcs.3079.d: "终于，电话声再次响起，把房间里娃娃的哭泣声所遮盖住，王辰诚接通电话说了两句后，把他的眼泪擦了擦，“时候到了。”\n等到他打开了房门，他才惊讶的发现，外面除了自己朝夕相处的同事和娃娃们，还有着他们的父母，以及村里的老人和干部们，都来为他送行了。\n“你们这是”王辰诚话还没说完，手里就被各种东西塞得满满的，水果，馕饼，还有各种自家人做的吃食。\n“当初你来到我们村，也没有好好的款待你，如今你要走了，我们也没什么拿得出手的，就这些吃的和娃娃们的心意，带在路上吃吧。”校长此时在他耳边说着，架不住众人亲切的目光，他最终把这些都收了下来，背包放不下就提在手上，挂在脖子上。\n“王老师，虽然我们都舍不得你，但是在你的帮助下，我们这边的情况已经得到了改善。眼下，还有别的地方需要你，希望你去帮助他们的娃娃，就像对待我们一样。”\n他轻轻点了点头，随后在众人关怀的目光中快速上了车。在车辆缓缓发动后，他朝着这些人挥舞着自己的手，用自己声音向他们保证。\n“我一定会的，我一定会的！我会永远记得你们的！”而他自己在看到村子越来越远后，终于忍不住的痛哭了起来。\n他多想在这里再多待一会，可是如果再久一点，那别的地方呢，别的需要自己的地方呢。\n“如果自己一直这样的话，那跟当初的誓言，就相差甚远了。”他翻着这些日子的教案和笔记温习着知识，随后将他和这群孩子们的合照夹在其中。\n在准备与未来娃娃们的相处之中，他渐渐明白了这句带领大家走上美好生活的份量感。"
 prcs.3079.a: "“取舍”。"
 prcs.3080.t: "重燃世界革命的烽火"
 prcs.3080.d: "同志们！世界的工人们！被压迫的无产阶级们！\n此刻，我的声音正穿过大洋的寒雾，掠过大河的波涛，跨过大陆的高山，向你们奔涌而去。这不是普通的演说，而是从我们内心燃起的火种，是十月革命的回声在二十一世纪的轰鸣！\n数十年前，伟大的红旗自克林姆林宫降下，华尔街的大亨们在股票交易所里把人类的血汗兑换成黄金，伦敦的勋爵们举着香槟庆祝新自由主义的狂欢，当时有人嘲笑，说这是“世界革命的终结”，但今天呢？\n历史的车轮不会因强盗的叫嚣而停滞，资本主义的总危机已深入骨髓——它在欧洲制造失业，在亚洲制造饥荒，在非洲制造屠杀，在美洲制造战争！\n同志们，革命从来不是等来的！今天，我们要用全球无产阶级的团结撕开新殖民主义的铁幕！\n有人说，再一次的世界革命还会再一次造成社会主义阵营的分裂，还会再一次让革命陷入低谷。\n但我要告诉他们：中华人民共和国从未停止过奋斗，共产主义的理想从未停止过召唤！我们将用“世解阵”的机器为亚非拉兄弟铸造武器，用“北斗”的轨道为全球革命传递信号，用我们伟大的理想团结全世界的人民。\n革命的火焰从不因时间的流逝而熄灭，只要我们人类存在一天，我们就永远不会停止追求美好与幸福，就永远不会放弃对共产主义的理想。\n全世界无产者，联合起来！这将不再是口号，而是行动纲领！从今天开始，我们要在全世界掀起革命的浪潮，我们要为全人类的共同解放战斗。\n让欧洲的金融寡头颤抖吧，让东京的财阀们失眠吧！社会主义的曙光正照亮全球每一个被压迫的角落，我们将会为最美好的前途而奋斗终生。"
 prcs.3080.a: "将这一切点亮！"
 prcs.3081.t: "“巨变进行时”（一）"
 prcs.3081.d: "北京某处办公楼会议大厅隔壁的小房间中，新任的国计委主任宋建宇正在不断思索。一旁的副主任刘新国忍不住开口道：“还是再休息一下吧，会议还有五个小时才开，相关企业的负责人都还没到场呢。”宋建宇抬起头，露出疲惫的黑眼圈，语气低沉稳健的回应道：“睡不着呀老刘，有的人比我们还急呢，闻到味道到处托关系打听这次企业改制政策的消息，虽然具体的措施方案已经敲定，但是如何保证稳定推进，是个不小的挑战啊。”说完宋建宇放下手中的“国有化行业改革计划”端起茶杯喝了起来，见状刘新国也不再言语，挥手示意一旁的秘书过来，嘱咐起了会场的细节。\n一辆奔驰梅赛德斯穿过外围的记者，停在大楼门前，车上下来的中年男人扶了扶眼镜，眼角掠过一丝难以察觉的焦虑。尽管他在深圳时就已通过关系网确认了某些“风声”，但此刻仍难以相信高层会做出这般决断。进入会场后，信息行业的诸位“巨头”大多已到场落座。男人走向其中一位相熟的旧识，低声交换几句讯息后，对方以一副无奈与不甘交织的神情点头回应。刹那间，男人的神情愈发凝重不安，待他落座不久，会议便正式拉开帷幕……\n“今日由国计委、国资委牵头组织的，关于信息行业领域国有化的重要决策会议在京顺利召开，信息行业领域各主要企业负责人到场参会。会议上分析了信息行业国有化的必要性。国计委主任宋建宇表示，为推动经济结构转型，为后续国家经济体制改革提供重要支撑。将通过资源整合与政策支持，加速推动信息企业国有化进程。各企业主要负责人在会上表示坚决拥护国家决策。会议重点审议并通过了《信息行业领域改革计划》。”"
 prcs.3081.a: "把吃进去的吐出来！"
 prcs.3082.t: "“巨变进行时”（二）"
 prcs.3082.d: "1990年12月19日，上海证券交易所正式开业，作为中国大陆第一家证券交易所。其成立推动了中国资本市场的发展，是中国金融业发展的重要里程碑。就在今天，上交所正式宣布无限期关闭，3700多家上市公司股民手中的股票被央行按市价回收。国计委召开新闻发布会，发言人表示，这一决策是基于金融市场受国际经济形势波动影响的深入研判，旨在调整国家经济管理的发展结构，防范可能产生的系统性风险。同时，承诺将采取一系列措施确保金融市场结构调整的平稳过渡。经济学界部分以卢麒元为首的专家认为，这是为国家经济管理系统体系所做的转型铺垫，目的是为之后高度整合市场以适配自动化经济体系。而大部分专家学者则担忧这可能会带来经济波动和市场信心影响...\n黄浦江边一家金融信息数据服务公司内，从北京开完会回来的董事长王叶紧急召开高层会议，他手指在桌面上敲击着，额头青筋凸起，又随着叹息陷下去。“国家这次的数据回收政策根本不是商量，是通牒！”一位数据主管高层突然提高音量，将手中文件摔在桌上，“核心金融数据全要上交，服务传输通道接入NEMS，我们的金融服务怎么办？这不是釜底抽薪吗！”董事长嘴唇抿成一条苍白的线，突然冷笑出声，那笑声像铁片摩擦玻璃：“你们还记得三年前监管部门说的‘鼓励金融创新’吗？现在金融数据收归国有经济管理系统，我们手里只剩下擦屁股的权限。金融未来？哈，我们连自己的命脉都保不住，还谈什么未来？”说完他拿起茶水猛灌一口，却发现早已凉透，茶水流进喉咙时带着刀刃般的寒意。窗外夕阳把黄浦江面映成红色，会议室陷入沉默，唯有投影仪的蓝光在墙上投射。"
 prcs.3082.a: "你的未来非未来。"
 prcs.3083.t: "“巨变进行时”（三）"
 prcs.3083.d: "国计委的会议室内，会议桌两侧坐满了各相关部门负责人。国计委主任宋建宇锐利的目光扫过在场财政部、审计署、国土资源部的领导。翻开文件夹，文件首页“地产资本国有化风险处置计划”的标题被红笔重重圈起，“今天不仅是研讨，更是拆弹。各地的地产债务爆雷只是一个切口，底下烂掉的脓疮远比我们想的深。”财政部领导面色凝重：“十个省近五年的土地出让金占财政收入的50%以上，其中大量资金被用于填补债务窟窿。一旦国有化相关企业引起连锁问题，地方债务风险将直接暴露。”审计署领导接过话头：“我们追踪了关联的地方项目，发现了大量的违规担保、虚假注资、土地出让金回流等问题。有些地方甚至用未来的土地收益作抵押。”他敲击着一份附有红章的文件，控诉一般继续说到：“现在光是清查土地权属就够棘手了，还有部分被地方政府违规二次抵押...”他顿住，余光扫过宋建宇铁青的脸，只见宋建宇神情严峻到：“棘手？等买烂尾楼的群众堵政府大门，等挤兑潮冲垮银行系统的时候，那个时候就不棘手吗？国有化不是目的，是改革止损的第一步。中央的态度已经很明确了，锁定土地财政问题链条。审计直接进驻地方，现在每拖一天，风险就多一分。告诉市场，我们不是在救房企，是在改革经济问题。地方官僚谁想捂盖子，先问问中央！”\n黄军和沈舟舟今天难得下了趟馆子，刚结婚时两个年轻人就拿出攒的钱，首付了开发楼盘中的一套房子。每天上下班的小两口最喜欢的事就是路过自己在建的新房，到后面等来却是开发商跑路的消息，两人也曾在抗争的人群中拉着横幅维权，却也无可奈何，如期的房贷又像吸血的蚂蟥，每月吸掉工资单上大半数字。小两口只能在懊悔焦虑中渡过一天又一天。但就在前些日子，他们看到烂尾的楼盘开始复工，工地门口贴着国企接手建设的公告，政府还统计情况发放了交付赔偿金。黄军和沈舟舟吃着烤串，望着不远处“新家”逐渐成型楼体的，仿佛看到了他们未来温馨的家在一点点靠近。"
 prcs.3083.a: "面包和牛奶总会有的……"
 prcs.3084.t: "“巨变进行时”（完）"
 prcs.3084.d: "会议上，国计委的代表阐述着国有化将如何解决当前运输行业的乱象，诸如垄断与不公平竞争、从业人员权益保障不足等问题。他们的话语掷地有声，在座的各个运输企业负责人深知这些问题无法通过市场的调节和规范来解决。企业负责人面前的文件上，详细说明了国有化的具体方案，企业将被逐步收归国有，民营企业家将获得一定的补偿，尽管参会的企业家中有相当部分的人对国有化政策介怀，但碍于形势也不得不展现出同意的姿态。\n会议结束后，如释重负的国计委主任宋建宇坐在椅子上，对副主任刘新国说到：“这个阶段的工作也差不多了，完成运输行业国有化的工作，对于NEMS国家经济管理系统至关重要，促进城乡运输一体化，更好的承担均衡发展的责任，确保国防战略的有效实施。”刘新国点了点头，接话到：“我去向中央做阶段汇报吧，老刘你也该好好休息一下了。直白点说，我们是党的快刀，在台前斩乱麻。这段时间以来可有不少人有不小的意见呢。”说完刘新国从公文包中抽出一份加密文件：“部分参与国有化改革的运输物流企业前段时间突然大幅裁员，有人这是要制造社会矛盾给国有化政策施压呀。”文件上的内容如刀锋刺入眼底。“查清楚相关人员，必要时启动预案。”宋建宇语气冷峻，手指在文件边缘碾出一道褶皱，眼神向窗外瞟去，低声沉稳：“有些人的意见再多，也阻止不了历史的车轮。”"
 prcs.3084.a: "历史车轮滚滚向前！"
 prcs.3085.t: "旭日西沉"
 prcs.3085.d: "“终于等到这一天了...”尽管在经历了无数次的演习的锻炼之后，王强早已不再是那个笨手笨脚的新兵蛋子，但当尖锐的警报声响起之时，他的心脏却依旧砰砰急促跳动起来。除去难免的些许紧张之外，更多的还是因为兴奋情绪的影响\n作为台海战役后才正式入列的航空兵，王强的兵龄自然不算多长。不过，得益于出众的天赋与刻苦的努力，仅仅两年，他便从自己同期的伙伴中脱颖而出，甚至获得了参与东海巡逻的资格。而在这段艰难的岁月中支撑王强前进的力量，除了家人的鼓励，内心的自尊外，就是老兵们的炫耀了。尤其是他的师傅，每次批人的时候，那个不苟言笑的中年人总是有意无意的看着自己的座驾——一架洁白如雪的J16，机头上画着满满当当的F15\n在无数次的插肩而过中，王强也曾见过各种各样的太约战机。从老式的F15，到新锐的F35，乃至于所谓日本的骄傲“心神”。每一架的外形，他都记得清清楚楚，以便到那一天来临时，自己也能和他的师傅一样，把心爱的战机画上独有的勋章——当然，王强知道，这几乎是不可能的，毕竟，现代的空战早已不是骑士决斗的模样，他恐怕只能从头显雷达上的标记，来确定自己打下来了什么东西\n“——232，方位146，距离180，发现目标01批”\n“232收到”\n王强的胡思乱想并未持续多久，便被预警机的提醒就此打断，除此之外，数据链也即使接入联通，令他的眼前闪出几个清晰绿点。没有所谓的激烈狗斗，只是如往常的演习一样，行云流水，轻车熟路，甚至可以称得上无聊。王强只是轻轻扣动了几下板机，下挂的PL17便发出尖锐的破空声响，并在瞬息之间失去了踪影，只留下两道细长的白色云烟\n“分别攻击了两个目标，232发射完毕，右转脱离”\n当确认PL17开机后，王强便与自己的队友们离开了这片空域。尽管他也希望能够亲眼目睹战果，但操典可不是能够随便违反的东西。只希望预警机的驾驶员足够细心，别让自己的图章少了几个。数分钟后，雷达的光点消失不见，至于敌机们？"
 prcs.3085.a: "旭日旗标志再也不能翱翔于东海上空，留在云层中的，只有几朵鲜红的伞花。"
 prcs.3086.t: "何为国家"
 prcs.3086.d: "“同学们，我们今天这节思政课来聊一聊一个问题，怎么看待国家。”一个老师说到，并且在黑板上写了“怎么看待国家”这几个大字。\n“老师，课本上不是说了吗，有国才有家，没有国家哪来个人生活和个人保障。”\n“老师，你这问题问的也太没水平了，一个强大的国家才能保障我们的生活，这不是众所周知的事情吗？”\n“对啊，怎么问这种没啥含金量的问题，这问题大伙都会答。”\n老师笑而不语，他只是喝两口水，说到：“我知道你们会这么回答这个问题，但是呢，你们要想想一件事，你出来毕业找工作，找不到怎么办？蜗居在一个棺材大小的房子怎么办？月收入一千怎么办?跑去工厂打螺丝干到累死怎么办？这个时候，有人跟你说，这些都是为了国家前进的必要牺牲，你觉得你能接受这个说法吗？”\n“我今天跟大家聊这个问题，就是要跟大家说一件事，我们将权利让渡给政府，是为了保障我们的幸福。因此国家强大是手段而不是目的，用牺牲人民幸福的方式来铸造国家强大，无疑是一种本末倒置的行为。人不是为了国家而活，人是为了个人和人类集体而活的。”\n“所以，同学们，任何宣传国家永恒，国家至高无上，先有国再有家的群体，你们可得小心咯，如果战争来临，这些人只会躲在酒馆里面侃大山而不敢上前线，不要听信这些人的话，毕竟，所谓的英雄，到酒吧去要多少有多少，相反的，在牙医的治疗台上，可一个也没有。”"
 prcs.3086.a: "“所谓的国家只是一个单纯的工具。不忘记这一点，就应该能保持理智了。”"
 PRC_tfr_nl_china_heweiguojia_tt: "“人类文明产生的最大的恶疾，大概就是对国家的信赖了。”——《银河英雄传说》"
 prcs.3087.t: "亘古不变之物"
 prcs.3087.d: "老人从抽屉拿出一个发旧的盒子，颤颤巍巍的打开盒子，里面是一张年轻时的照片。一层层的军装褶皱嵌入他钢板似的身材，两只乌黑的眼球目视前方，军装上的勋章即使是照片被岁月的侵蚀而难以辨认，但是其包含的那道锋利的闪光仍然折射出来，这张老照片仿佛在跟人们诉说主人年轻时期的意气风发，即使是岁月流转也难以掩盖其背后的光辉岁月。\n老人拿着这张照片，意味深长的对着身边的年轻人说到：“大伙看到了吧，这是我当年参军入伍时拍的照片。那时候我去东北戍边，给国家出一份力，零下三十多度啊，都是我的汗水，后来我退伍回家，我这人毛病就是爱折腾，见老家人取水困难，我干脆修水渠，带队挖山引水，你们现在看到的那个水渠，就有我的一份力。”\n房间里陷入如冻土般的沉默，遥想当年，他们就像一块红砖，只要哪里缺，就往哪里补，苦得累得都让他们吃完了，甜的好的都给后人享受了。他们的身后就是铜墙铁壁，是万家灯火，是一道漫长的国境线，倘若没有这些铁汉，又怎能又现在的幸福生活呢？\n老人走下台，拍了拍一位年轻人的肩膀，笑着说；“现在你们这些娃娃吃的可好咯，人高马大，个个壮如牛，而且前段时间你们也给咱老家争光了嘛，你们的贡献都上央视咯，我看，我是不担心我们国家没有好男儿担当咯。”\n年轻人微微点头，紧握着双手，是的，哪怕岁月如梭，哪怕流光似箭，但是有些东西却仍是亘古不变，依然在时间的不断冲刷之下散发着薄薄的闪光。"
 prcs.3087.a: "握紧我矛盾密布的手。"
 prcs.3088.t: "电力系统改革"
 prcs.3088.d: "国家电力部重组揭牌 垂直管理体系重启 电力系统改革迈入新阶段\n近日，国务院正式宣布：重组设立国家电力规划与发展委员会，结束自2002年“厂网分离”以来的电力市场化实验阶段。根据方案，国家电网与南方电网将收归中央直接管理，五大六小发电集团业务范围被重新划分，同时，电力行业招标将被国家任务令模式取代，这标志着自厂网分离以来，包括“竞价上网”在内的电力系统的一系列市场化措施就此截止。\n随着“双碳”目标的深入推进以及国际地缘政治变化（如近期中亚地区“石油危机”加剧）带来的能源安全压力持续增大，现行分散化管理体制在规划统一性、新能源高效消纳、跨区域协调效率等方面面临的挑战日益凸显。同时，国内经济模式的深度调整也使得早期为“打破垄断”而设计的“竞价上网”等市场化机制，在保障基础供应安全、支撑能源转型方面呈现出适应性不足的问题。上述因素共同促使决策层对电力管理体制进行系统性重估与重构。\n根据国务院批准的重组方案，电力系统将实施三大变革：管理架构重建、两网权责调整、市场化机制退出，即重新组建直接隶属于国务院的“国家电力规划与发展委员会”，接管原国家能源局的电力管理职能及国家发改委的电价审批权限等；国家电网和南方电网收回所有抽水蓄能电站管理权。整合全国50%以上的抽蓄资源，形成统一的调峰调度中心，同时，跨省特高压输电项目审批也将权收归中央；全面终止发电侧“竞价上网”机制，回归计划电价模式，电价形成采用 “基准价+专项调节”双轨制：居民和农业用电执行固定目录电价，工业用电实施行业差别定价，新能源电价通过财政专项基金补贴。\n此次调整标志着中国电力系统将进入继垂直一体化、市场化探索后的“第三阶段”；对“两网五大六小”的业务划分、全面取缔电力建设招标制度、实施国家任务令模式的具体细则，均已纳入紧锣密鼓制定的后续改革议程。此轮重组绝非简单回归计划体制，而是在通过中央直管实现能源转型的系统性突破。当新能源占比超过30%，只有全国一盘棋才能避免资源错配。随着即将到来的五大发电集团最新人事任命完成和两网调度系统并网调试……"
 prcs.3088.a: "……中国电力系统将进入中央计划主导的新周期。"
 prcs.3089.t: "体系制空"
 prcs.3089.d: ""我打J-20？真的假的？"\n李明华在座舱里瞪大了眼睛，几乎不敢相信刚才从耳机里传来的任务简报。手心里已经开始冒汗，他下意识地调整了一下氧气面罩。每一个飞行员都知道这不亚于以卵击石。\n"雷鸟02，听到了吗？"长机的声音从频道里传来，"别紧张，今天就是验证我们在体系支撑下的作战能力。你会得到电子战系统的帮助。“\n听到这个，李明华深吸一口气，努力让自己冷静下来。他在之前的飞行中就知道电子系统对战斗机的巨大加成，但能否借此越级挑战心里还是没底。他检查着MFD上显示的各种参数，确认数据链工作正常。透过座舱玻璃，他能看到远处长机的J-10C正保持着标准的双机编队。\n"雷鸟编队，这里是天眼。"预警机指挥员的声音响起，让李明华精神一振，"目标'金雕'所在区域已经标识。雷鸟01负责照射，雷鸟02负责攻击。收到请回答。"\n"雷鸟02收到。"李明华回答道。在他眼前，全息头盔的数据开始缓缓展开，就好像空中真的有一道道无形的辅助线在指引他一般。雷鸟01开启了凝视模式，将雷达的探测范围缩小到预警机所指示的那片区域，通过数据链传来的信息让李明华的HUD上出现了一个闪烁的方位标识，那是作为目标的J-20。李明华深吸一口气，拇指移向发射按钮。透过头盔显示器，他能看到那个代表J-20的光标已经被一个小十字套住，随即按下了按钮。\n"导弹发射！"\n霹雳-15带着尖锐的呼啸声脱离了机腹挂架，推进剂的橙色火焰在座舱玻璃上投下闪烁的光影。李明华感受到飞机轻微的抖动，然后看着导弹消失在远方的天空中。\n在HUD上，他能实时追踪导弹的飞行状态。180公里...160公里...140公里...导弹正沿着预设的弹道稳定飞行，而数据链还在不断修正着它的航向。\n"导弹飞行正常，目标保持稳定。"李明华汇报道，声音比他预期的要平稳。此时此刻，他仿佛能感受到整个作战体系的脉搏——预警机的扫描节拍，长机雷达的照射波束，还有那枚正在高速飞行的导弹。\n100公里...70公里...40公里...\n突然，那个标识开始了大幅转向，李明华的心跳加速了。对方终于发现了威胁，但现在已经太晚了。目标已经进入了导弹的不可逃逸区域。\n"目标开始机动！"长机的声音传来，"这个距离才发现导弹，电战机的威力不小啊。"\n在HUD上，李明华能看到代表导弹的光标正在快速接近目标。25公里...20公里...15公里...导弹的弹载雷达应该已经开机了，它正在用自己的"眼睛"搜索着那个隐身目标。\n10公里...5公里...\n"命中！目标被“击毁“！"兴奋的声音在频道中爆发出来。\n虽然没有导弹爆炸的光芒，但李明华知道自己成功了，耳机里指挥部要求返航的指令传来，他操纵飞机划出一道优美的弧线，转头向基地飞去。而在路上，他脑海中冒出了一个想法："
 prcs.3089.a: "J-10都这样强了，那我开上J-20不得起飞啊？"
 prcs.3090.t: "日子"
 prcs.3090.d: "费尔南达·卡皮奥猛得从床上坐起来，大口喘着粗气，额头上冷汗直冒，她的手摸向自己的右边，却什么也摸不到。她立马疯了一般地冲到隔壁房间，掀开纱帘。月光轻柔地撒在她孩子的脸上，那柔软的胸脯在夜风的轻抚下微弱地起伏。桌上摆着没吃完的炸鸡桶，那孩子第一次吃正经的炸鸡，但是他吃得如狼似虎，但是只吃了两个鸡腿就再也吃不下了。她摸索着走到了鞋架旁，捡起了自己缝缝补补过的橡胶雨靴，穿了上去。\n月光指引着她，昏黄的电灯映着墙上新刷的标语与菲律宾新人民军的镰刀锤子符号。虽然说下过了雨，这一路上很泥泞，但是她早已对这条小路烂熟于心，种植园的工人必须要在子夜时分起床，前往种植园割橡胶，对于她而言，十几年的橡胶工人生涯早已让她熟悉了路上的每一块石头。\n她终于走到了橡胶种植园的大门那里，看门的老人牵着大黄狗正在屋里打盹，她没有说话，而是悄悄地绕了过去。老人应该要好好休息，在夜晚不可能熬夜，但大家信任他——毕竟现在谁会来割自己的橡胶呢？\n她走进了橡胶园，空气中弥漫着一股土地的香味，水渠低声地向她致意，萤火虫在晚风中起舞，月光穿过层层叠叠的橡胶树叶，在地上留下了无数碎银。在不远处，一颗烧焦的秃树孤零零地矗立在那里，一根绳圈怪异地挂在树枝上，她努力不去回想那里发生了什么，大家说后面几天就要把那棵树砍掉了，那里的一切都会随时间远去。毒蛇在她的脚下远遁。\n终于，她走到了那片草地，她的男人在月光中站着，痴呆地盯着种植园。她走过去，摇了摇那个男人。\n“彭彭，又做噩梦了吗？”她问。\n“我现在没有在做梦吗……?”那个男人迷糊地说道，他又低下了头，捏着衣角：“我总感觉这世道不像真的呢……房子……地……我看见那橡胶园上挂着红旗……这一切……都是真的吗？都结束了吗？”\n费尔南达望向天空，雨水刷洗过的夜空格外澄澈，今夜，群星璀璨。她沉思了一下，说："
 prcs.3090.a: "“他们的日子结束了，我们的日子才刚刚开始。”"
 prcs.3091.t: "黑船"
 prcs.3091.d: "四艘航空母舰出现在了东京湾的海平面上，后面跟着一大串各种各样的战舰。那些战舰上，星条旗格外扎眼。\n这些战舰大摇大摆地开入横须贺的海港。战舰停靠着的码头上站满了日本的自卫队官员，他们举着星条旗和日本国旗，只是抬头仰望着那庞然巨物，红毯已经铺好。身穿礼服的美国海军上将走上码头，他那灰色的眼睛瞥了一下那些夹道欢迎的自卫队官员，一阵“阔阔西库戴赛”的声音便整齐地响了起来。刹那间，码头便成为了日美国旗的海洋。而他看都不看那些人，只是大步地往前走去。\n红毯的尽头，站着日本的首相，而他一见到这个美国的海军上将，便热切地伸出手来，而那个海军上将只是很冷淡地握了握他的手。司机为那个海军上将拉开高级轿车的门，海军上将便直接坐了进去，然后首相麻利地爬进了车里。司机一脚踩下油门，这辆车扬起的尘土便淹没了那些还在挥着旗的人。"
 prcs.3091.a: "不远处，日本人为美国佩里上将立下的纪念碑还耀武扬威地屹立着。"
 prcs.3092.t: "转机"
 prcs.3092.d: "实验室里面飘荡着化学物质的味道，额头上豆大的汗珠缓慢而又有力的滑落在脸颊上面，这天，郑博士在实验室像往常一样做着实验，虽然结果并不是一下子就成功，但没准下一次实验就有结果呢？郑博士抱着这样的心态想，接着捣鼓起实验室的器材。\n结束了一天忙碌的工作之后，郑博士伸了个懒腰，换好衣服打车回家吃饭，他瘫坐在座位上，仰着头闭目养神，好好的放松自己，“老郑，今天回家有点晚啊，咋那么个回事。”司机老周也是个老相识，关切的问道，郑博士倒是笑着说：“哎，哪有什么晚不晚的事，咱做科研的辛苦点正常。”“哎，你今天看新闻没有，我看是跟你们做科研的相关的。”“啥新闻？我看看怎么个事情。”郑博士打开手机看了看新闻。\n“中央今天决定成立科技委员会。”映入眼帘的是这几个大字，老郑原本靠在座椅上的身子微微往前倾，原本疲惫的眼光开始重新聚焦到手机屏幕，“你说这事啊，前几天我们单位领导提到过，不过我也没想到到现在才正式公布。”\n老周嘿嘿了几声，说：“哦，这样啊，但我看新闻这次国家是要下功夫给你们上点强度，说科技改革是所有改革的重中之重，没有科技方面的突破其他项目不好搞。”老周顿了顿，接着说：“老郑啊，我看以后得深夜接送你咯。”郑博士倒是没有什么起伏，而是带着一丝苦笑着说；“我这人做实验这么多年了，屡败屡战的次数太多太多，这次给我上强度恐怕有点难。”老周听到这句话之后，沉默良久，接着，只听到老周不断调转方向盘的声音，而没听到二人平时有说有笑的声音。\n在下车付钱之后，老郑看着天空上的星星，对于他这样默默无闻，在失败当中不断爬起寻找突破的科研人员来说，这则消息无疑是在他心中掀起了一层涟漪，更有可能是此生仅有的机会，凭借一战彻底成名，想到这，郑博士握紧拳头，长吸一口气，迈步向家的方向走去，而明天的实验室或许多了一丝希望的气息。"
 prcs.3092.a: "如今机会就在眼前，我必须考虑这会不会是我此生仅有的机会。"
 prcs.3093.t: "归来"
 prcs.3093.d: "铅灰色的天空低垂，像一块沉重的幕布，压得人喘不过气。冰冷刺骨的海风，裹挟着浓郁的咸腥与若有若无的铁锈味，呼啸着刮过横须贺寂寥的港口。码头上，几只海鸥发出凄厉的叫声，盘旋着，不愿落下。\n\n2022年的那场战役是所有人心里挥之不去的梦魇：台湾海峡的海水被鲜血染红，自卫队的舰艇如同破碎的玩具般沉入海底，纵使日本有着被誉为“定海神针”的美国第七舰队也逃不过失败的下场。在台湾的溃败如同导火索一般，点燃了他们熟悉的一切——曾经被视为战略盟友的印度，在边境冲突中屡次受挫，国内矛盾激化，几乎陷入囚笼；东南亚各国，在中国的渗透与支持下，赤色浪潮此起彼伏，就连日本本土，那些被认为早已绝迹的“赤匪”——激进的左翼团体，也如同雨后春笋般冒出头来，此起彼伏的暴力事件让本就脆弱的社会神经更加紧绷。\n\n然而，就在所有人都以为大势已去的时候，远方传来了消息。美国的内战终于结束了，托马斯·鲁索领导的爱国者阵线成功统一了整个北美大陆。那支在台海战役中遭受重创的美国海军残部，如今向新政府效忠，准备卷土重来。东京的密室里，那些西装革履的高层们正在进行着肮脏的交易。为了重新获得对抗中国的资本，日本政府几乎愿意付出任何代价——更多的美军基地，更大的军费分摊，甚至是将冲绳完全割让给美军管辖。这些曾经被视为国家主权象征的东西，如今都成为可以讨价还价的筹码。\n\n码头上的海鸥依然在凄厉地叫着，它们似乎预感到了什么。这片曾被核弹洗礼过的土地，即将再次成为大国博弈的牺牲品。而那些高喊着"为了日本"的政客们，正在一点一点地将这个国家的主权和人民拍卖给外国人。\n\n铁锈味越来越浓了，海风中仿佛还夹杂着血腥味。这不是春天的预兆，"
 prcs.3093.a: "而是一场更大灾难的前奏……"
 prcs.3094.t: "主人"
 prcs.3094.d: "清晨的那霸港，雾气缭绕，海水泛着死灰色的光泽。远处传来低沉的汽笛声，那是新的第七舰队正在缓缓驶入港口。为了彰显自己的军容军威，美国人花大力气把几年没能接受维护的军舰翻修了一遍，使其看着熠熠生辉，但不知为何，前来迎接的第七舰队残兵败将和日本海自成员只看到了一片衰朽之气，或许是他们的错觉吧。\n\n会议室里，烟雾弥漫，与窗外的海雾连成一片，模糊了主人与忠仆的面孔。新任的舰队司令正用一种近乎于施舍的、不容置疑的语调宣读着“新盟约”。他对面的日本自卫队军官们则不住地点头，仿佛在聆听唯一的真理。签署协议的那一刻，窗外再次传来汽笛长鸣，那声音宏大而傲慢，仿佛在宣告旧时代不容置疑的归来，无论这片土地上的人民是愤怒抑或是畏惧。\n\n港口外，琉球的渔民们正在收网归来。他们知道，从今天开始，这片他们世代生活的海域将再次成为外国军队的练兵场。他们也知道，那些政客们刚刚签署的协议将让这个岛屿彻底沦为大国博弈的棋子。更知道一旦战争真正爆发，他们这些平民百姓将首当其冲地承受战火的摧残。可他们明白，自己没有选择——无数次反美的抗议游行，换来的只是更多的军舰和美国大兵，如今麻木的人民只想在战火来临前苟延残喘，等待明天。\n\n夕阳西下，血色的天空映照着这片古老的土地。老人们坐在海边，望着远方那些钢铁巨兽，眼中闪烁着复杂的光芒。他们依稀记得，好像有着挂着旭日旗的巨兽经过同一地方，他们曾经允诺给大和民族带来大东亚圣战的荣光，但最后带来的只有鲜血与死亡。而如今，换了一面旗帜的巨兽又来了，这一次它们承诺的是什么？自由？民主？还是又一场注定失败的复仇战争？"
 prcs.3094.a: "快去通报首相！"
 prcs.3094.b: "或许这很中听，但上一次也是如此。"
 prcs.3095.t: "《监察意见稿》"
 prcs.3095.d: "各省、自治区、直辖市监察委员会，各直属机构：\n为更好地执行《中华人民共和国监察法》，推动监察工作规范化、法治化建设，根据《全国人民代表大会常务委员会关于国家监察委员会制定监察法规的决定》，国家监察委员会研究起草了《中华人民共和国监察法修正实施条例（征求意见稿）》（以下称之为意见稿）。此次公开征求意见，旨在增强人民群众参与，深层次多方位的探索社会立体监察体系，促使法律深入人心。\n目前看来，各省市之间的监察体系已无法满足人民群众日益增长的需要。为进一步强化中央监察体系，同时推动社会法治和人民美好生活建设，特向社会发布此意见稿，鼓励群众积极参与社会法治建设，增强依法治国理念。\n此次意见稿主要包括以下方面：\n1，将监察权试验性发放给知法懂法守法以及会用法的人民，鼓励人民群众在各级监察机构的指导下成立合作组织，以此来解释《意见稿》相关内容和含义，协助当地监察机构进行试点探索改革。\n2，在此基础之上，逐步扩大社会监察范围，同时也应注意积极参与的人民的相关福利和安全保障。应避免在试点探索过程中会出现的过度热情和境外势力干涉，请各级监察委员会做好引导和稳定作用。\n3，多使用互联网，人工智能等新时代科学技术，扩大与人民群众的交流手段和方式，使用更加先进的监察技术进行监督、调查职务违法和犯罪行为、推进反腐败工作等。\n4，与其他例如纪委部门等开展合作，统一行动，交流意见。"
 prcs.3095.a: "公众如对征求意见稿有修改意见，可通过以下方式反馈："
 PRC_tfr_nl_china_jianchayijiangao_tt: "访问人次：250914561"
 prcs.3096.t: "数字未来"
 prcs.3096.d: "如果说四通八达的交通网络是中国过去所创造的工程奇迹的话，那么如今蛛网密布般遍布全国的NEMS网络便是中国新时代的科学与工程的伟大奇迹。\n\n每一日，每一时，每一分，每一秒，海浪般的来自全国各地生产企业的经济信息被传递到各大主要城市的NEMS分支节点，经过分析处理后传输给北京总支点，让其得出国民经济运行的整体态势，为中央计划经济委员会做出重大经济决策提供准确的数据参考。因此，小王身为维护总支点的网络工程师，其担负的责任极其重大，不但要掌握网络过程知识，还要学习经济学内容，这样才能从庞大的数据内容中找出错误类型并予以修正。\n\n“小张啊，现在某地的企业胆子是真大，竟然敢串通地方政府造假生产数据，直接把产量翻了一倍，我这边检查系统时都怀疑是不是系统设计出错了。”小王在吃饭时与同事闲聊道。\n\n“是啊，那地方的政府直接被清洗得一干二净，要不是有NEMS系统，否则就给他们混过去了，天知道会对经济造成怎样的破坏。”小张回答道。\n\n小王想了想，说“说实话，要是我们的系统能够更深入国民经济中的话，地方上想对经济数据动手脚都没有机会，就是不知道要找到一个可行的方案有多困难。”\n\n“所以现在组织上也在研究各类方案，但我印象中可行性最高的是那个大规模运用人工智能的那个，叫什么来这……”"
 prcs.3096.a: "“对了，叫‘长征计划’……”"
 prcs.3097.t: "家宴"
 prcs.3097.d: "孙鹧承推开家门，看见自己妻子的医生白袍挂在衣帽架上，而正当他脱下自己的制服时，那逸散在空气中的香味便与他撞了个满怀。肚子里面的馋虫瞬间就被勾引了起来，催促着他赶快去一探究竟。\n“鹧承，下班了啊？我饭刚刚做好，快来吃吧。”那个他再也熟悉不过的女声响起，但却更加让他感到疑惑：毕竟下厨这种事只存在于他们刚刚同居时的回忆当中。而当他瞥到餐桌时，餐桌上那挂着芡的鱼香豆腐、滋滋冒着油的纸包鸡、发着热气小鸡炖蘑菇便立马抓住了他的眼球。\n还没等他反应过来，一曲轻柔的小曲飞进了他耳中，他的妻子向慧便与它一齐从厨房里飘了出来。向慧看着惊呆的孙鹧承，笑出了声，招呼着他赶快盛好饭一起吃。\n豆腐的鲜香在口腔中弥漫开来，鹧承细细地品尝着碗中的美食，但吞下去的饭没压住他心中的疑惑，于是他终于开口了：\n“慧，今天怎么突然想起来做饭了?”\n“医院全科医生最近的工作还算轻松，所以说我稍微闲下来了一些。毕竟一直吃盒饭也不是个事嘛。”\n“怎么回事啊？”\n“药价便宜了，药的种类和特效药这些能买到的也多了，所以说很多小病小痛老百姓自己就解决了。”\n“我还记得，我们刚刚结婚那段日子，我们挤在小公寓里面算日子。那时候每天回来累得要死，你懒得做饭，我也懒得洗碗。”\n“可不是嘛。”向慧笑了一下，“都以为家务轻松呢，但是工作上累了一天，谁还有心思做这些。现在谁还想得到我们可以住这样的大房子?”\n“不过，做这么多菜，到时候洗碗就麻烦了……”孙鹧承心里有点过意不去，正准备自告奋勇，但向慧止住了他的话头。\n“我前几天抽奖得了一个自动洗碗机，今后这种事就让它来做吧……”"
 prcs.3097.a: "碗筷碰撞着，唱着清脆的歌谣。"
 prcs.3098.t: "停戈止争"
 prcs.3098.d: "央视新闻11月20日消息，19日，我国第25批赴刚果维和部队第一梯队124名官兵，从兰州中川机场出发，乘坐军机经库尔勒、喀什、巴基斯坦卡拉奇、吉布提，预计将于11月21日抵达刚果任务区，执行为期一年的维和任务。\n\n第25批赴刚果维和部队共编制218人，其中工兵分队编制175人，医疗分队编制43人。到达任务区后，他们将主要担负工程勘察、道路修筑、桥梁架设、未爆弹药销毁、医疗救治和人道主义救援等工作。\n\n自2003年我国首次向刚果派出维和部队以来，已累计向刚果派出维和官兵3000余人次。在局势动荡、险情频发的环境中，中国维和官兵不负重托，出色地完成了各项维和任务，赢得了刚果人民和国际社会的充分肯定和广泛赞誉。"
 prcs.3098.a: "我们将带来和平。"
 prcs.3099.t: "军民团结如一心"
 prcs.3099.d: "在一个救灾结束的山村中，解放军某工兵连的战士们正在收拾装备,准备返回驻地。\n连长老刘擦了擦额头上的汗珠,回望着这个他们奋战许久的小山村。废墟已经清理干净,临时安置点也搭建完毕,村民们的生活正在逐步恢复正常。\n"连长,村民们过来了。"班长小王一边说一边指着，老刘顺着他的指头望去，一股人流正朝着他们奔来。\n只见领头的张大爷带着一些村民,手里拎着各种食物朝他们走来。有罐装八宝粥、红牛饮料,还有几箱方便面和各种饼干。\n"解放军同志,这些天辛苦你们了!"张大爷握住老刘的手激动地说,"俺们村也是刚经历了灾，没啥可以好好招待你们的东西了，也就希望你们能收下我们送来的吃的啊。"\n老刘连忙摆手:"大爷,这是我们应该做的,东西我们不能要，再说了……"\n"必须要!"张大爷的语气异常坚决，打断了老刘接下来想说的话，,"你们就是我们村的救命恩人啊。既然是恩，那就大大方方的收下吧。"\n"张大爷，真的不行,我们有纪律的。"老刘继续推辞着，同时向身后的汽车兵示意准备发车。\n眼看解放军战士们坚决不肯收下食物,村民们急了。张大爷一使眼色,几个年轻村民立刻冲向军车，把八宝粥罐头、红牛往车厢里扔。老刘他们一看不对就打算去劝阻,结果被身边的张大爷一把抓住，手里凭空多了两箱吃的喝的。\n"哎哟!"小王在车上来不及躲闪，被一罐八宝粥砸中脑袋,疼得龇牙咧嘴。\n"好好收了就不疼了，哈哈！"一个村民大婶笑着并继续往车上扔红牛。\n眼看拦不住,老刘只好大喊:"停停停!我们收下还不行吗!"\n村民们这才停手,脸上都挂着满意的笑容，随后在乡亲们的再见声中，老刘一行人朝着驻地驶去。\n在回驻地的路上，老刘摸了摸小王的脑袋，“还疼吗？”“当然了，连长，我是真没想到他们会强行给我们送上来。”\n听到他这么一说，老刘大笑了起来，“我们都没有想到，但这样也是证明了一件事——我们彼此都把对方放在了自己的心上，都愿意拿出真心来对待。”"
 prcs.3099.a: "“所以，乡亲们的这一节课，我们都要好好学啊。”"
 prcs.3100.t: "巨岩崩裂"
 prcs.3100.d: "雨，轻轻地拍着大家。所有人都沉默着，凝视着那一座石塔。\n\n那座石塔如一颗野狼的獠牙，从宫崎县的大地伸出，暴露在众人的目光下。几百块出产于日本大地的岩石压在了238块来自中国的石头、123块来自朝鲜的石头上。这一压，便压了八十多年。\n\n数千名朝鲜的人民军战士和中国的解放军战士，沉默地凝视着那一座石塔。而一些脖子上捆着红丝带、戴着各式各样头盔的日本人，也沉默地凝视着那座石塔。\n“八纮一宇”，这个原本象征着海内一家的词汇被刻在那些来自于宫崎县的石头上。呵！这些宫崎县一片小小深山里的石头，竟然也摇身一变，成为了整个日本的代表。毕竟，谁不知，这是“万世一系”的天皇家族的诞生地呢？毕竟，只要有天皇，那日本就成其为日本了。但，天皇的自吹自擂，钱还是得要日本国民出的。这座1000万日元的塔，日本国民就“捐款”了500万，而剩下的“500万”，自然是他们早先上缴“税款”。\n\n而那些来自于中国、朝鲜的石头，被数百块天皇家的石头压在身下。尽管风吹雨打，这些石头依然还可以辨认它们的来源——泰山、中山陵、长城、朝鲜总督府……它们背井离乡，被人以这种方式压在身下，风吹雨打，日晒雨淋，它们沉默了八十多年。\n\n工程装甲车的引擎发出吼叫声，狠狠地向着那块巨岩撞去。但人群沉默着，众人如石头一样站在那。没有人说话，没有人移动一下。大家都在等待着，等待着那一刻的到来。\n\n当工程车撞上去的时候，那块巨岩，便突然崩解了。那座“万世一系”的石塔，如齑粉一般碎裂在空中，化为尘土，而工程车仅仅只是稍微用力了一点。是的，就这样崩解了。\n雨点落下，淋在塔基的石头上，淋在那些沉默的人脸上。"
 prcs.3100.a: "水痕滑下，那是塔基石块的泪水。"
 prcs.3101.t: "“再淬钢铁”（一）"
 prcs.3101.d: "八岁的向东明坐在家门口，旁边的大黄狗是为数不多的玩伴，他脸上因玩耍粘上的泥巴早已风干，在夕阳余晖的照映下活像个邋遢的小难民。忽然间，向东明望着远处黄土路上若隐若现的身影，兴奋的跑了过去，一旁的大黄狗紧跟着小主人。待一人一狗靠近，身影的主人，一个佝偻着背的老妇人拿出赶场买的洋芋粑，油纸冒着热气，裹着山野土豆特有的醇香，她将食物递给向东明：“小东明，趁热啃，莫烫到咯。”小东明身手娴熟的帮老人拿过背篼背在自己身上，边吃边扭头问：“奶奶你今天咋去这么久，是不是我爸来消息了。”，“没得呢，他们在城里建房子，忙得很。”老人一脸慈祥的回复着，随后和小东明慢慢的向家里走去。进门后老人从怀中摸出一本泛黄的书，拿给向东明，这是她赶集时在小贩子哪里花两块钱买的旧书，毕竟自己平时要干农活，儿子儿媳又出去打工，不识字的老人权当买给小孙子解解闷。向东明虽然小学二年级了，但除了课本还没见过其他书呢，小说更是只有在同学那见过。小东明拿到书后捧着这本“宝贝”，欢喜得蹦到院坝边坐下。看着封面一人骑着马挥着刀，戴着奇样的尖帽，勾得他心痒，手指摩挲着书名，不自觉念出声来：“《钢铁是怎样炼成的》……”\n夕阳把水泥地的篮球场映成一片黄色，向东明和几个同学逃了课，在这里挥汗打球，尽管教室黑板上中考倒计时只剩三天，可他们脸上连一丝焦虑的影子都寻不见，如同大多乡镇中学留守儿童一样，他们早学会了自我放弃和躺平，像野草般任由命运的风往哪儿吹就往哪儿倒。打完球几人瘫坐在一边，一人灌了半瓶水，抹着嘴说：“反正考不上县高中也得去职校，还不如现在就练练搬砖的力气。”二狗蹲在地上玩石子，头也不抬：“我爹说了，读完初中就跟着他去广东工地，读不了书还不如多攒几年工龄。”向东明没说话，弯腰系松了的鞋带。下课的铃声响起，几人快速向校门跑去。回到家的向东明拿起烤洋芋胡乱吃起来，自从奶奶去世后他也没心思弄像样的晚饭了。从前奶奶总会把洋芋粑烙得酥脆，递过来时手背的皱纹里还留着灶火的余温。\n第二天吃完早饭后，他便收拾起行李，中考一结束，他就跟二狗他们去县城打小工，直到职校开学，出门时，他瞥见门框上奶奶生前用小刀给他量身高的刻痕，最顶上那道已不知是何时刻的，如今他早已蹿过了老妇人佝偻的肩头。他走在路上，风从山坳里吹来，像只看不见的手，催促着他向前走。"
 prcs.3101.a: "“我们都有光明的未来。”"
 PRC_tfr_nl_china_xiangdongming_tt: "§Y我们将在多年后再会……§!"
 prcs.3102.t: "“再淬钢铁”（二）"
 prcs.3102.d: "这是向东明大专毕业后进厂的第二个年头，刚来这里时，城市的霓虹一次次刺痛他的眼睛，日复一日的电路板焊接让他觉得自己不过是生产线上的一个零件。夜晚下班后，向东明蹲在宿舍的阳台上躲避闷热，指尖夹着半截香烟，手机屏幕的蓝光映在他布满血丝的眼睛上。工装裤口袋里的槟榔硌着大腿。嚼完的槟榔壳被随意吐在地上，混着烟蒂和不知谁扔的泡面盒，散发出酸涩的馊味。\n每天的宿舍楼下的公共洗衣房里，总是传来工友们用方言争论的喧闹声，夹杂着某个失恋者的醉骂。向东明下工后就靠游戏和槟榔香烟麻痹神经，偶尔和工友出去包夜上网，虚拟世界的快感总比现实中拧螺丝的机械动作来得真实。放纵不良习惯成为了他唯一的避难所，现实里的疲惫与不甘，全在一时的欢愉中烟消云散。这样的日子日复一日，向东明觉得可能自己这辈子也就这样了，人生的意义梦想什么的跟自己这种人毫无关系，不如游戏里半边裸露的二次元人物角色来的更有感觉。\n向东明在大学时也跟其他人一样幻想过未来可期。数控专业的课本被他翻得卷边，晚自习时总爱趴在窗边，看着远处城市霓虹模糊的轮廓。上课的路上他甚至会哼几句不成调的曲子，仿佛梦想已长出翅膀。\n手机突然震动，是父亲发来的微信：“明儿，什么时候回来。”他盯着屏幕良久，将烟蒂丢进泡面盒的汤汁里，重新开始了游戏，楼下传来新一批夜班工人进厂的嘈杂声，像一群蚂蚁涌入永夜。夜风吹动他沾着汗味的工装裤，阳台上的蟑螂四处乱爬，远处霓虹的光晕仍在流转，而他蹲在阳台的阴影里，像一块被遗忘在流水线旁的残次品电路板。"
 prcs.3102.a: "“输了，再来一把。”"
 prcs.3103.t: "“再淬钢铁”（三）"
 prcs.3103.d: "通宵上网回来的向东明，浑浑噩噩的走在回宿舍的路上，突然看到厂区内挂起了鲜红的横幅：“工厂改革大会”。“又是什么降本增效的把戏，上次改革说是优化流程，结果把三班倒改成两班倒，日子难熬咯。”向东明嘴上嘀咕道。回到宿舍闷了个大觉，一直到太阳落下被闹钟吵起，浑浑噩噩的爬起来去往车间上夜班。\n换好工作服进到车间的向东明感觉到与平常的不同，平日盛气凌人的线长不知道去哪了，线长位置上站着一个戴着红袖章的中年人，眼神中流露的不是咄咄逼人的工头气息，而是温和的看着眼前的工人，待到人员齐后，中年人说到：“兄弟们，今天夜班只工作五个小时，剩下的时间在更衣室里安排。”向东明以为自己听错了，他可不敢想象工厂会发善心，难不成是要裁人了？忐忑不安的在工位上干了五个小时后，向东明他们在更衣室里集合，只见中年人开始滔滔不绝的向工人们宣告起工厂改革的事情，什么工资透明化、取消夜班、缩短工时、技能培训补贴、建组工人工会、工人代表参与管理会议……，在工厂里一向不问世事的向东明，前面还听得懂，越到后面越觉得陌生至极，怎么有点听不懂呢？\n两天后的闷热下午，下了工的向东明路过厂区露天宣讲会前，正准备回到宿舍，忽然看到新改组工会的工人宣传员站在铁皮台上，好奇的凑向前，年轻的宣传员嗓音劈开闷热的空气：“工人不是被异化的工具！是造机器的主人！改革不是恩赐，是劳动者用双手挣来的尊严！”向东明本打算回宿舍打游戏，却被不知道什么时候聚集起的人群挤着挪不动腿。宣传员举起一本《工改手册》，封皮上镰刀锤子的标志刺进他的眼睛，那人指向台下：“工友们，同志们，我们从来不是流水线的傀儡？我们有知识、有激情，是工厂的脊梁！是国家和社会的脊梁！”那人接着讲工人的力量，讲工人应该如何参与管理……\n向东明失眠了，蜷在床上，手机游戏画面在脑中与这两天听到的词句交织，槟榔残渣在嘴里尝出苦涩。不禁回想起白天工会宣传员的话：“咱们工人不是流水线上无尊严的工具，是撑起产业大厦的脊梁！改革不是施舍，劳动者本就该拥有美好的未来！”他想起因为夜班歪曲的腰椎，想起之前被一降再降的时薪，解放、美好未来这些词像游戏里遥不可及的传说装备，从未有人告诉他如何获取。向东明忽然想起，自己看见过宣传员脖颈上挂着的工作牌，那也是个比他早两年进厂的技校生。改革若是假的，那宣传员眼里的光为何不似作伪？向东明蜷在床角心神不定。死水般的内心搅起涟漪，那颗心，开始微微震颤。"
 prcs.3103.a: "生锈的齿轮发出声音。"
 prcs.3104.t: "“再淬钢铁”（四）"
 prcs.3104.d: "工厂破天荒的颁布了年假条例，宣布工人们有权每年申休一次七天的长假。向东明不敢置信的申请了年假，他已经一年没有回家了，年假很快被批准，虽然经常刷短视频看到各种新闻，但在去往火车站的车上，他还是惊讶于这段时间大城市的变化，透过车窗他看到街面上很多商业广告被替换为公益广告，政治宣传标语也是以前从未见过的风格，例如什么两参一改三结合、贯彻无产阶级领导等等。在路过街边的劳动者驿站时，甚至看到里面有吹着空调躲避炎热的外卖骑手和环卫工。\n回到村子口的向东明对照着记忆思索，看到村口焕然一新的柏油路，路旁立着的太阳能路灯，让他不大敢确定这里是他大山中的故乡。他走进家中的院坝，父亲正坐在竹椅上剥玉米，听见脚步声，猛地抬头，皱纹里挤出笑容“明儿！”歪脸的笑容让他想起了父亲长年在工地压弯的脊梁，父亲的声音带着颤，起身时差点碰翻椅子。母亲从灶房出来，围裙上还沾着灰，向东明喉咙发紧，沉闷的性格却只憋出一句：“路……又变好了。”\n渐渐黄昏，向东明在椅子上帮着剥玉米，父亲在一旁滔滔不绝，特别是提到现在的补助政策，更是有千言万语一般，早年进城找“活路”的老农民工都在相关部门统计年限和工作情况后开始发放起了退休金。听着父亲的话语，向东明继续剥着玉米，心中不断喃喃到“变了，好多东西都变了，时代好像真的不一样了。”\n向东明又失眠了，干脆在房间整理起杂物。角落里一本布满灰尘的书引起他的注意，拿起书抖了抖灰，封面骑马挥刀的人影被虫子啃出了毛边，书名却还依稀可见《钢铁是怎样炼成的》，望着这本书，向东明想起来了，自己小时在漏风教室的斑驳黑板上写下的梦想，自己还没有被社会“异化”前的梦想，那就是成为像这本书主角一样的人，一个坚持不断向前的人，他翻开书，纸页脆黄，文字却仍然锋利：“人的一生应当这样度过……”他想起厂里宣讲员说的“脊梁”，想起父亲欣喜的皱纹，想起自己蜷在宿舍床上犹豫的模样。此刻，这些词句并非躺在书页中，而是化作熔炉的火光，融化封印内心对于未来生活向往和理想的寒冰。他逐渐明白，自己并非焊死的螺丝，而是等待一轮淬火的钢。\n向东明回到工厂后，鬼使神差地报名了工会组织的“生产优化提案大赛”。还申请加入工厂新组的共青团，他戒了烟，随身的槟榔换成了笔记本，数控专业毕业的他眼眸中透着执着。向东明在参赛小组中以身作则，成了积极分子，每日最先抵达工作室，沉浸在复杂的流程数据和设计图纸之中。那专注的神情仿佛在宣告一定要攻克所有难题。"
 prcs.3104.a: "“不因虚度年华而悔恨……”"
 prcs.3105.t: "“再淬钢铁”（完）"
 prcs.3105.d: "太阳在远方升起，清晨露珠在阳光的照耀下闪烁着晶莹，今天是团员义务劳动日，向东明早早的就到了目的地。“东明，你也来这么早呀。”身后传来党员韩叔浑厚的声音。他扛着一箱矿泉水，这位曾在隔壁厂区中组织工人罢工抗争的老同志，如今将义务劳动视为“无产阶级自我教育”的战场。“咱们今天要把道路上的树枝杂物都清理干净，前几天的台风可是搞出不小麻烦哩。”\n\n随着附近居民志愿者和团员们陆续到来，防水胶鞋的摩擦声与激昂的口号交织。有人扛起断裂的树桩，有人清扫，女团员们也不甘落后，有人分发手套，有人到处搬动力所能及的杂物。在这片被晨光照耀的土地上，义务劳动不再只是简单的体力付出，而是劳动者们用双手书写的一封封革命请柬，邀请每一个被剥削者加入重建公平世界的行列。\n\n当向东明所在参赛小组的方案被选为试点时，车间掌声雷动，他和小组成员的名字登上了厂内表彰栏，照片旁写着“青年工人先锋”。这是向东明从未体验过的感觉，农村出身的他从小到大也不曾有过的感觉，\n\n大会上，被组员选为发言代表的向东明走向台前，拿起那本破旧的书，一改往日的内敛的形象说到：“工友们，同志们，我想借用这本书的内容，说一下我的想法。在今天这个时代，我们每一个工人、青年，要用什么样的态度对待生活？是贪图享受还是继续奋斗，当年我们的先辈们浴血奋斗不就是为了今天吗，那么在今天，在这个真正意义上的新时代，青年一代的形象应该是团结奋斗，手挽手一往无前，任何困难都吓不到我们！”"
 prcs.3105.a: "“到这儿来，保尔！”"
 prcs.3106.t: "“路是靠人走出来的！”"
 prcs.3106.d: "“发啥愁呢，张舰，看你一副愁眉苦脸的样子，船上禁烟都忘了呀？”随行的医疗人员看着这位平日里和蔼可亲的舰长正迷茫的眺望着大海。\n“不好意思，忘了。”张舰长把烟头扔在脚底下踩灭，对着医护人员道了个歉，“我很苦恼，苦恼在，此次出港任务将是和平方舟号有史以来历程最久，覆盖区域最多的一次。我们不仅会在东南亚各国的港口停留，还要再转向去印度洋，这一路上的医疗资源消耗和补充……不仅如此，航程这么长，途径的国家这么多，你们这些船员的人身安全也是个问题……”\n“没事，张舰，我们这不还没接收病人吗？再说了，我们还没启航呢。”医护人员轻轻拍了拍他的肩膀，“您也说啦，这次任务重，这样愁眉苦脸的胡思乱想下去哪儿行？您可是舰长呀！”\n“是，作为舰长，我若是都魂不守舍，其他船员只会更加慌张。不过……首次前往那么多地区和国家，这其中，我们可能会遇到数不清的问题和危险。我身为舰长这么多年了，这可是头一遭有这么大的担子，我一下子喘不过气。”他望着海平面上逐渐升起的太阳，缓缓说着以往的经历和荣誉，“可是……之前我们每到一个地方，和那里的人民接触一段时间后，他们都是那样开怀，我见证了他们的苦难，也意识到了我们的帮助对他们有多么重要……”\n“但我怕，我怕这次出航，出了差错……”张舰长又下意识地想抽口烟，但只是手指拂过嘴唇。\n“可要是我们不去，又有谁能帮助那些人民呢？”\n于是，张舰长摇了摇脑袋，深吸一口气，说道“你说得对！事在人为。我们必将向世界证明，即便世界破破碎碎，也会有人愿意将他们缝缝补补，让世界变得更美好一些。启程吧！”随着最后一批医疗物资和随行人员确认登船，码头方面示意可以驶离。\n张舰长望着港口边对着自己敬礼的同志，恢复了原来沉稳模样，他在对讲机中说道，“请党，祖国和人民放心，无论有什么困难，我相信，路是靠人走出来的，和平方舟号，现已出港，保证完成任务！”"
 prcs.3106.a: "迎着新的一天的太阳，和平方舟载着未来和希望分享给世界。"
 prcs.3107.t: "同一片天空"
 prcs.3107.d: "近日，国防部发布消息显示，根据中俄两军年度合作计划，双方在日本海相关空域组织实施第9次联合空中战略巡航。“人民空军”官网发布的图片显示，轰-6N参加了此次战略巡航，这是轰-6N首次参加中俄战略巡航。接受《环球时报》采访的专家表示，轰-6N参加巡航，可以极大拓展编队巡航的威慑力和打击范围。\n\n中俄两军进行例行性的联合空中战略巡航主要目的是增进两国两军之间的战略互信，提升两军之间的战略合作水平，提高两军共同应对安全挑战的能力，维护地区和世界的和平稳定。\n\n对于太约方面新闻所渲染的威胁论，国防部新闻发言人表示：从2019年以来，中俄9次空中战略巡航不变的一点是，不针对第三方，符合国际法和国际实践，希望个别国家不要对号入座，不要进行歪曲和渲染。"
 prcs.3107.a: "展翅高飞。"
 prcs.3108.t: "同一片天空，同一面红旗"
 prcs.3108.d: "近日，国防部发布消息显示，为增进两国两军之间的战略互信，提升两军之间的战略合作水平，提高两军共同应对安全挑战的能力，维护地区和世界的和平稳定，中俄两军将延续年度合作计划，双方在日本海相关空域组织实施第9次联合空中战略巡航。“人民空军”官网发布的图片显示，轰-6N参加了此次战略巡航，这是轰-6N首次参加中俄战略巡航。接受《环球时报》采访的专家表示，轰-6N参加巡航，可以极大拓展编队巡航的威慑力和打击范围。\n\n此外，新生的苏俄政府对此次战略巡航表现了高度重视，派遣了包括图-160M1在内的各类新型机型参与战略巡航，期望在积累空军经验的同时，加深与中国方面的联系。\n\n针对太约方面新闻所渲染的威胁论，国防部新闻发言人表示：从2019年以来，中俄9次空中战略巡航不变的一点是，不针对第三方，符合国际法和国际实践，希望个别国家不要对号入座，不要进行歪曲和渲染。"
 prcs.3108.a: "鹰击长空。"
 prcs.3109.t: "火鸡？"
 prcs.3109.d: ""怎么回事——"长机在无线电里愤怒地咆哮着，声音在频道中显得格外刺耳。不知为何，他面前的多功能显示器突然陷入混乱，原本清晰的态势图变成了一片片毫无意义的数据乱流，各种警告灯如圣诞树上的彩灯般闪烁不停。在这个即将奔赴西太平洋前线的关键时刻出现这种状况，简直是最糟糕的噩梦。\n"长机，我觉得..."无线电中传来僚机飞行员紧张的声音，他明显在努力保持冷静，"我们可能遭到了强烈的电子干扰。我的系统也出现了同样的问题。"\n队长感到一阵荒谬感涌上心头："开什么玩笑？我们现在离战区还有十万八千里远！难道中国人把他们的干扰机开到我们家门口来了？"\n但无论多么荒诞，眼前铁一般的事实是他的F-22猛禽战斗机——这架价值1.5亿美元的五代战机——正处于半瘫痪状态。一想到自己很快就要驾驶着这架服役了二十多年的"老古董"去对抗中国人那些崭新的J-20和J-36，他就忍不住苦笑。虽然洛马和波音的六代机项目据说已经准备列装，但那些未来战机对现在的他来说毫无意义。\n经过一番紧张的操作，战机的电子对抗系统终于开始发挥作用，大部分干扰信号被滤除，各种显示器逐渐恢复正常运转。就在他松了一口气的时候，雷达屏幕上突然闪现出一个微弱的反射信号——非常短暂，几乎转瞬即逝。他只当是没被过滤的杂波，继续向上级汇报这个异常事件。\n突然，战机内部警铃大作，他瞪大眼睛，在雷达屏上看到已经摸到自己侧方的J-36向中队甩出了将近十枚导弹。他手忙脚乱的发射热诱弹，做规避动作，但都太迟了。被恐惧麻木的他，最后看到的是几道扑向自己的火蛇——最后听到的则是僚机的连连惊叫。"
 prcs.3109.a: "猎杀时间到！"
 prcs.3110.t: "红布"
 prcs.3110.d: "一个眼前蒙着红布的人在这片大地上缓缓独行，他手里拿着的半截烟头早已熄灭。没有人与他同行，他也不知道要去向何方，更不知道要走到何时。\n他还记得很多东西，记得过去那些对他而言早已不值一提的东西。爱、事业、家人。他早已忘记了自己又何时失去了这些，但对于他而言，唯一一件萦绕在他心头的事情只有一件：到底是从什么时候开始，他变得如此形单影只；到底是为什么，他变得如此形单影只?他从众人身旁走过，但，人们或是出于恐惧、或是出于厌恶、更多的是出于敬畏和狂热，将他孤立，将他排挤，让他不再成为他，让他迷失在迷宫中。但他还记得这片土地，记得这片土地身上最深的伤疤，所以说他得走下去，必须要走下去。\n于是他用一块红布蒙住了自己的眼，蒙住了天与地。红色包裹着他，温暖着他，让他忘却了孤独、让他一直坚持地走在路上，让他一直坚持地走在这片布满了伤痕的土地上……就这样，他走了许多年。\n但，在这一天，不知道什么原因，他鼓起了勇气，缓缓地摘下蒙在眼前的红布，揉了揉自己发酸的眼睛。他发现自己脚下是沾着露水的草地，不远处的田野里，无数朵向日葵正在怒放。\n忽然，就像从天边升起来了一样，一面面招展的红旗出现在地平线上。那纯红的旗帜、被血染过风采的旗帜、浸透了炮火硝烟的旗帜、我们的旗帜，被人高高举起，正在风中自由地舒展。而旗帜下，一群人正在阔步向前。\n他看见了他们，他们也看见了他。他下意识地想要躲开众人的目光，捂着耳朵不想听见那些狂热的欢呼声。\n“来啊，到我们这里来！和我们一起走吧！”他们向他招手，像招呼朋友一样。\n“什么?”他不敢相信自己的耳朵。\n“来吧，咱们一起向前走吧！”他们依然向他招手。那些他最陌生的面孔，但他却又感觉到无比的熟悉。\n他看了看手中的红布，将它奋力一丢，它飘向天边，与绚烂的朝霞融为一体。"
 prcs.3110.a: "我们不再孤独了。"
 prcs.3111.t: "衰朽"
 prcs.3111.d: "侯振东拖着衰朽的身躯，坐在了红光社区一年一度“红光公社纪念毛泽东思想大会”嘉宾席。他环顾四周，参会者寥寥，只有几个革命年代便一同奋斗的老同志，春暖新苗年年有，往来行人各不同。等到了他例行发言的环节，他颤颤巍巍地走上台，一抹白光涌进眼底，他不为所动。\n\n白光越盛，但他还是坚持把自己一字一句打出来的演讲稿给念完：“吃水不忘挖井人，红光社的新老同志们能走到今天并不容易，从今往后还恳请各位继续发扬并高举毛泽东思想伟大旗帜，将继续革命的精神进行到底。”"
 prcs.3111.a: "罢了，台下响起了稀稀拉拉的掌声，在他耳中，声音也越来越小……"
 prcs.3112.t: "过往"
 prcs.3112.d: "自那以后，侯振东的听力每况愈下，生活上也陆陆续续出现了诸多不便，别人与他对话时他的耳根要贴得越来越近；电话中的免提模式几乎成了常驻；看望他的革命战友要敲老半天的门才能听得到；以至于到后面由敲门改换成了电话。情况一天天恶化，以至于侯振东和战友们也相信，终有一天他会彻底失掉听力，届时想要再上门探望恐怕只能提前预约并祈祷他能够在预约时间到来前注意到手机里的短信了。\n 尽管身体逐渐凋零，侯振东却久久无法忘记自己亲身投身于那场旷古未有的伟大革命。记得那个1967年2月17日的那个上午，成都军区副司令韦杰公然执行二月逆流反革命道路，下达‘镇反’命令，白色恐怖在四川达到了顶点，军队以中央的名义大肆抓捕革命造反群众，他本人也因1119兵团勤务组负责人的缘故被老产们拖进了四大监。在狱中，他和战友们以大无畏的红囚徒精神开展绝食示威活动，却遭到狱警们非人殴打。退神光退不了用毛泽东思想武装的兵团战士，志存胸内跃红日，乐在天涯战恶风！兵团、八二六、红卫军团，五湖四海的战友们掀起了震天的吼声，誓要将这关押这革命者的大牢变成传递，学习毛泽东思想的大学校！ 终于，熬过了2月逆流，闯过了3月黑风，人民日报发出了《正确对待革命小将》的号召，四川问题开始处理了！在中央和人民的双重压力下，成都军区副参谋长茹夫一于4月18日下午着手放人。川大826兵团的学生们和迎接的群众们早已将监狱外的道路堵得水泄不通，一见到被折磨得脱了形的‘红囚徒’们走了出来，两个多月来挤压的情绪终于忍不住爆发，可爱的人儿们欢呼地，感动地拥抱在一起，有的和家人朋友们喜极而泣，有的唱起《八二六想念毛主席》，还有的正昂扬地宣讲同志们批私批修的经历。而他做在九八兵团的三轮上，和战友一起高扬着红旗，笑容疲惫却洋溢着喜悦。"
 prcs.3112.a: "彼时，侯振东从未觉得，有哪天的阳光如这一天耀眼。"
 prcs.3113.t: "转机？"
 prcs.3113.d: "时过境迁，转眼一晃六十年过去了。十年牢狱生涯让他饱经沧桑，价格闯关，社会动荡，金口玉言，工人下岗，当年的战友一个接一个地离去，他也在商海的浮沉中吃尽了苦头，这位造反老将已然不如当年那般意气风发，资本主义的复辟和日渐孱弱的身体带给他肉体和精神上的双重折磨。有时，他会拖着骨瘦形销的躯体坐在窗边，悲戚地想着“或许不久后，我也要去见毛主席了吧。\n\n距最后一次演讲一年后，时间来到了2025年，三月份的初春还夹杂着一丝寒意，这种渗进人身体内的寒意最令老人难受。可蜗居了一个冬季的侯振东哪怕顶着倒春寒也依旧决定出门。老人独自上大街风险不小，侯振东最终只是在小区里散了散步。\n\n就在侯振东即将绕完小区的最后一圈时，他感到大衣的口袋有些微微地震动，他拿出来一扫：是一个晚辈给他发来的消息，说有一些学生想在下周见他。\n\n侯振东在脑中假设了无数可能，但也始终没想明白："
 prcs.3113.a: "一帮学生能找他干嘛？"
 prcs.3114.t: "旧枝新芽"
 prcs.3114.d: "时间一眨眼便来到了下周。在战家人的帮助下把家里收拾得干干净净的侯振东此时正死死注视着晚辈的聊天框，生怕错过了发来的短信，却丝毫没听到敲门声。\n待到晚辈给他发了信息，他才后知后觉地支起身体“进，进，不用换鞋子，直接进来就行”门开之后，映入眼帘的除了那位同样年事已高的晚辈，还有三张鲜活的面庞。等青年进屋入座，侯振东才缓缓地坐回扶手椅上。\n有两位青年好奇地打量着这位曾经经历过那“特殊”年代的的屋内陈设，却略微失望地发现除了毛主席的壁画海报外，简直不能再朴素。另一位青年则较为沉稳，他从包里掏出笔记本，翻到写满采访问题的一页，显然是做足了大量的工作。即便如此，他微颤的双手也暴露了他的激动。\n经过简单的交流，侯振东搞明白了眼前这三位青年此行的目的，青年们均在贴吧上认识，对于新中国前三十年尤其是十年文革的历史都有一定的了解，并且同样都来自于川内的大学，三位青年此行的目的便是为了从文革的亲历人员入手，将支离破碎的历史一点点补全，从历史的经验中吸取教训。\n谈着谈着，侯振东渐渐恍惚起来，他的思绪随着青年的问题一点点飘回过往，仿佛那个火热的年代从未远去，红囚徒们在狱中的欢声笑语，红十条下达时群众们的山呼海啸，611产匪的猖狂的围攻，歼七的腾空一跃化为省革委成立时的烟火，张国华政委浓重的东北口音好像又回荡在耳畔，往事一幕幕如同幻灯闪过，他如此在回忆中畅游，直到青年的身影与逝去的战友们的身影渐渐重叠。\n在采访环节到了尾声，青年准备和他互换联系方式时，侯振东这才如梦初醒。他带着笑意给青年们带来的材料上留下了自己的大名。\n临别的时候，侯振东看着眼前有无限生命力的青年，他沉寂多年的心也振奋了几分。他紧紧的握住他们的手，想起了毛主席在苏联会见留学生的话。"
 prcs.3114.a: "世界是你们的，也是我们的，但归根结底是你们的。"
 prcs.3115.t: "为我中华，志建三峡"
 prcs.3115.d: "“小王来了啊，先看一下行云，天擎杀毒刚推了新补丁，对了，保密自查台账得同步更新。"主任指了指办公系统提示栏，指尖在桌面轻叩两下，"上周那轮更新是针对内网边界防护，这次是网络攻防演练新检出的漏洞，现在可是关键期。”\n“好的主任。”小王一边对着工作电脑的统一身份认证点头张嘴，一边取下肩膀上的红袖标，金属卡扣发出轻响：“难怪今早门禁多查了两道工作证，门口武警岗哨也添了双岗。”\n统一身份认证的提示音还未散尽，小王便已麻利地调出天擎杀毒的控制台，浅蓝色的界面跳出进度条，硬盘读写声沙沙作响，三百七十二个文件节点在屏幕上逐次点亮。中孚保密系统的自查窗口同步弹出，随着鼠标在"每月自查模板"的选项上轻轻轻敲击，目光便随之扫过扫过确认栏——无虞。\n高危补丁安装完毕，小王起身，推开了厚重的安全门，步入监控室；整面墙的4K显示屏正流转着实时画面：大江冲沙闸，起重机正吊起拦污栅；二江泄水闸控制室，液压监测曲线稳走绿线；电缆廊道内，粗细母线规整卧于线槽……小王指尖在中央触控屏一划，5号机组廊道画面铺满屏幕。新装的振动传感器格外醒目，金属触点在顶灯下反射冷光。\n目光扫过各个关键画面，确认无误，小王深吸气，将“安全监察”的红盔稳稳戴正，红袖标别上左臂。卡扣再响“咔哒”一声，开始了新一日的巡查。\n转眼便走到了厂房门口，门口武警哨兵身姿笔挺。小王停步，递上了自己的工作证，年轻战士目光如刃，一手握向胸前的手枪，一手接过证件仔细核对，便利落地敬了个礼放行；厂房内，低沉浑厚的轰鸣自地底涌起——二十一台钢铁巨兽般的水轮发电机组正全力奔腾，声浪在空旷厂房内激荡，震得地板与胸膛共鸣。“非常时期，不容半点大意。”这念头如同千钧重锤扣于心弦，他下意识挺直脊背，目光如鹰隼般扫过管线密布的通道、冷光闪烁的阀门、指示灯明灭的控制柜，不放过丝毫异动。\n从幽暗的设备廊道到轰鸣的机组机坑，从高压绝缘瓦滋滋作响的开关站到人迹稀少的坝区通道，小王步履沉稳。正午阳光透过500KV的高塔，在地面投下光斑，拉长他专注巡视的身影。行至黄草坝附近，他久立四望——此处易被忽视，是西坝的偏僻一隅，监控摄像头易有死角，需要加强警力。\n巡检结束，小王回到办公室，卸下头盔与袖标，擦了擦头顶的汗，便拿起内线电话：“本次全厂巡查完毕，无异常。但黄草坝监控存在盲区，建议联系坝管部增设武警巡逻。”汇报完毕，他便打开了办公电脑，开始编写今天的巡查台账，将巡查路径、时刻、细节与设备状况悉数记下。\n窗外，夕晖为巨大厂房交错的母线与杆塔镀上暖金。下班时分。小王理好文件，关闭电脑。穿过层层哨卡走出厂门，他习惯性驻足回望，霞光中，门口的毛主席雕像披着军大衣，目光如炬，仿佛顺着手中的望远镜随滚滚的长江水一路向东，源远流长，警惕地望向东面的敌人。小王挺直身躯，神情庄重，向那黄铜铸就的身影，行了一个深沉的注目礼，“为我中华，志建三峡，我定不辱使命！”"
 prcs.3115.a: "随后，他的身影融入下班的人潮，渐次隐入暮色与万家灯火之中。"
 prcs.3116.t: "腰杆"
 prcs.3116.d: "王家康一把抖开这块新买的手帕，用手托着手帕，将它向脸上一抹。海绵般柔软的质感裹住了他的脸，他的脸上的汗水登时就被吸干了。待他把手帕小心翼翼地叠好，塞进腰带里，他就用力挺直了他佝偻的腰，拎着饭盒推开了工会驿站的门。\n空调的风替他掸掉了脸上又渗出的微小汗珠。每次来这里小憩时，他都习惯闭着眼享受这微风的感觉。他放松了下来，腰杆又佝偻了下来。当他再睁开眼时，几个老熟人闯进了他的视线里。\n“哎呀，这不老康吗？”他的同事程海一见到他便放下了手中的饭盒，立马和旁边的人一起挪出了一个位置，而王家康也不含糊，麻利地拖着一把椅子塞进空位，顺势就稳稳地坐下了。\n“咋了康哥，太阳打西边出来了？往常都是你在这等我们，现在换我们等你了。”年轻的装修工章祎捧着一大碗盖浇饭，正在大快朵颐，王家康往那碗里一瞟，好几根热气腾腾的肉卷上还挂着卤汁，一大块烧腊和切好的猪脚码成了小山。\n王家康笑了笑，打开自己的三菜一汤，夹起一块口水鸡放进嘴里，细细地嚼了肉，唆了骨头，扒了一口米饭把肉压进肚子里，等稍稍踏实了一点，他就开口了：“因为路边上还有些地方没弄干净，垃圾堆得有点多，所以说我就多干了会，把地扫干净了才来。”\n“呵！太阳确实打西边出来了。但以前你在这怎么给我们咋说的？活着吃死了算，工作对付对付就解散。这话我记得清清楚楚的。”\n“但是小章你也不一样了嘛，覃大妈最近夸你做事都认真多了。别人曾经笑你一个干装修的，在别人房间里面走一圈连灰都沾不了一下。”程海挖苦道。\n“我……我主要还是觉得现在做什么都很踏实，你知道吧，以前就是朝不保夕，就怕吃了上顿没下顿，今天好好干，明天就清算，这干什么嘛。现在干什么都有个底，心里踏实，就好好干了。”\n“呵呵……”王家康看着笑起来的熟人们，心里也是百感交集，他也不知道自己为什么就这样饱含着热情去干这样一份工作，肯定不是待遇，因为他一个老东西已经不在乎这些了。但他还记得彻底改变了他的那一天：\n那一天，他正准备找个地方偷懒。但他看见，一群红领巾对着他佝偻的身躯，敬了一个不标准，但足够真挚的少先队队礼。他看见那些孩子们眼中没有什么居高临下的姿态，也没有什么矫揉造作的同情。只有对他佝偻身形最诚挚的敬意。"
 prcs.3116.a: "那一天，他的腰杆挺直了。"
 prcs.3117.t: "抢铁U彩之终"
 prcs.3117.d: "广州，这座华南地区的交通枢纽，近日迎来了一项重要的铁路改革措施。据官方消息，中国铁路广州局集团有限公司的自主定价权已被正式收回，这一决定在广东省内引起了广泛关注和积极反响。\n\n长期以来，广东省内的铁路票价一直处于相对较高的水平，这在一定程度上增加了民众的出行成本。据统计，广东地区的高铁票价平均比全国同等里程线路高出15-20%，这种价格差异一直是当地民众关注的热点问题。\n\n此次定价权的收回，标志着广东铁路运输价格体系将重新纳入统一管理。相关部门表示，新的定价机制将更加注重公益性和民生导向，确保铁路运输服务的可及性和普惠性。\n\n广东省内民众对这一举措普遍表示欢迎。他们认为铁总集团收回定价权意味着广东地区的票价将会和全国铁路接轨，不仅有利于减轻民众出行负担，也将进一步促进区域经济一体化发展，提升珠三角地区的整体竞争力。\n\n随着新的定价政策逐步实施，广东"抢铁U彩"的历史将成为过去，民众出行将更加便利实惠。"
 prcs.3117.a: "“水鱼号”成为历史。"
 prcs.3118.t: "美国正式加入太平洋防卫条约组织"
 prcs.3118.d: "近日，在东京举行的多边会议后，美国"爱国者阵线"政府正式宣布加入太平洋防卫条约组织（PDTO），成为该组织的正式成员国之一。过去数月来，美国高级外交官频繁访问亚太地区各盟友国家，就地区安全合作问题进行深入磋商。经过多轮谈判，这一军事同盟扩员计划终于尘埃落定。\n\n太约此次扩员仪式在东京举行，各成员国外长共同见证了签字仪式。美国代表在会后表示，加入该组织是为了"维护印太地区的自由与稳定"。与此同时，国际观察家们正密切关注这一举动对地区战略格局可能产生的影响。\n\n美国的加入明显改变了亚太地区的力量对比，特别是在面对中国领导的世界解放阵线时。分析人士指出，"爱国者阵线"政府的反共产主义立场是其选择加入太约组织的重要考量。此外，各成员国之间的经济合作前景，以及美国承诺提供的军事技术支持，也被视为推动此次扩员的关键因素。\n\n太约组织的进一步扩张无疑加剧了亚太地区两大阵营之间的紧张关系。目前，该地区已形成以美日印澳为核心的太约组织与以中国为首的世界解放阵线相互对峙的格局。如今，维持这片人口稠密地区的和平稳定，恐怕已经是一种奢望。"
 prcs.3118.a: "有什么东西正在酝酿。"
 prcs.3119.t: "亚洲大战！"
 prcs.3119.d: "自台海战役结束以来，所有人都在掰着手指头计算这一天的到来。世界解放阵线和太平洋防卫条约组织，这两个针锋相对的冷战后最具代表性的巨型军事联盟之间的战争正式打响。人们立刻用"大亚洲战争"这一代名词代指这场全新的战争。\n\n这个名字或许会使人回想起二战的太平洋战场和军国主义日本所称的"大东亚圣战"，但这场战争的规模和模式已经远远超出了历史上任何一场亚太地区曾经经历过的冲突。有些人认为，拥有庞大人口、雄厚工业实力和世界上最大规模军队的中国以及其盟友具有其敌人难以企及的优势，并且世界解放阵线的成员国均可以中国本土为稳固的大后方，发挥内线作战的优势。另一方则指出，以美国为首的太约阵营在地理上对中国形成了包围堵截之势，太约阵营所控制的广大海域也确保了制海权与稳定的贸易路线。不仅如此，太约主要是由"民主国家"组成，对"威权主义"的敌人来说天然具有意识形态上的优势。\n\n无论如何，战争的走向从开战的那一刻便已不再为除实力以外的任何因素所左右。从陆地到海洋、从天空到宇宙，如今还要加上赛博空间，战神已经开启了一场将塑造未来半个世纪人类政治版图的血腥游戏。"
 prcs.3119.a: "烈焰升腾，燃尽亚太。"
 prcs.3120.t: "世界解放阵线赢得大亚洲战争"
 prcs.3120.d: "在这颗星球上，很少有地方可以像亚太地区一样宣称自己从未远离过硝烟。自第二次世界大战结束后算起，从南亚次大陆上的漫长边境冲突，到印度支那半岛此起彼伏的游击战争，再到三八线南北、台湾海峡两岸遮天蔽日的舰队与机群的紧张对峙，一切都只是在等待着一个火星子来引爆。如今，燃尽整个亚太的战火似乎终于到了熄暗的时刻。\n\n由中国、朝鲜、巴基斯坦等国组成的世界解放阵线成为这场看似永远没有尽头的战争的最后赢家。当解放阵线联合舰队成功登陆美国西海岸，美国"爱国者阵线"政府被迫宣布投降时，整个太约阵营的抵抗意志彻底崩塌。抵抗帝国主义霸权的联盟所付出的重大牺牲证明它们不愧为世界人民正义事业的旗手。\n\n根据刚刚签署的和平条约，美国被迫割让夏威夷群岛以及其在太平洋的所有岛屿领土，这些战略要地将重新回到亚洲人民的怀抱。至于失败者——所谓的"太约"阵营，等待他们只有被彻底撕下所谓"民主"的虚伪面纱和接受人民制裁这一种可能。"
 prcs.3120.a: "唯有和平无价。"
 prcs.3121.t: "亚洲革命总决战"
 prcs.3121.d: "中国共产党中央委员会、中华人民共和国全国人民代表大会常务委员会、中华人民共和国国务院、中国人民政治协商会议全国委员会、中国共产党和中华人民共和国中央军事委员会，向全党全军全国各族人民通告：\n\n数小时前，以美帝国主义为首的帝国主义军事集团——太平洋防御条约组织，以下简称“太约”，悍然插手朝鲜人民的解放事业，数十万帝国主义武装分子在釜山登陆，其舰队和空军也悍然入侵我国领海领空。这些行为构成了对我国的战争行为，严重侵犯了亚洲社会主义国家的权益。\n\n“太约”组织长期以来以防御为名，不断插手、干涉我国台湾事务，助长“台独”气焰。在侵略台湾、干涉我国内政遭到彻底粉碎后，仍派遣特务、破坏分子，联络我国内部的叛徒、内奸，资助我国内部的反革命组织，从事反革命活动，煽动颠覆国家政权、妄图推翻社会主义制度，资助并武装我国内部的分裂势力和恐怖组织，置我国人民的生命财产安全于不顾。\n\n在亚洲人民解放运动风起云涌、欧洲的帝国主义战争愈演愈烈、资本主义陷入总危机的当下，以美国为首的“太约”组织仍疯狂阻挠我国的社会主义革命与建设，拼凑反革命军事集团，企图再次对我国发起血腥的侵略战争，阻挠全亚洲无产阶级的社会主义革命与民族独立运动。其疯狂行径淋漓尽致地体现了在资本主义陷入总危机的当下，帝国主义的垂死挣扎，他们拒绝承认自己的失败，企图以军事冒险和绑架自身人民来换取最后的存续机会。\n\n基于上述事实，中华人民共和国主席宣布，根据中华人民共和国第十五届全国人民代表大会常务委员会第一次会议于[GetDateText]的决定：中华人民共和国进入对“太约”诸国的战争状态。除非“太约”这一帝国主义军事集团主动投降或被彻底摧毁，这一状态不会解除。"
 prcs.3121.a: "中华人民共和国万岁！世界人民大团结万岁！"
 prcs.3122.t: "对殖民秩序的最后一战"
 prcs.3122.d: "世界解放阵线向全亚洲人民庄严宣告：\n亚洲，这片我们用骨血浇灌过的广博而富饶的土地，孕育了我们悠久而伟大的文明。我们的祖先曾在这片土地上创造了辉煌灿烂的成就，我们世世代代独立而自由。然而，当西方殖民者用枪炮轰开我们的家门，一切都变了……\n殖民主义从未真正离开，其余孽正疯狂扼杀亚洲经济的命脉。霸权主义的肮脏黑手，操弄着本应属于亚洲人民的命运。跪伏其脚下，啃噬民脂民膏的财阀集团；出卖国家利益、背叛民族的傀儡政权。它们打着所谓“冷战”的名号，将枪口对准亚洲真正的主人——奋起抗争的人民！\n旧世界的根基摇摇欲坠。帝国主义贪婪的本性，正将其自身拖入无可救赎的深渊：经济瘫痪、社会撕裂、战火频仍……它们在挣扎中妄图将整个亚洲拖入无尽的黑暗。而我们在数十年浴血抗争中，在胜利与失败的烈火中，锻造了钢铁般的战斗意志和不可摧毁的斗争精神。从朝鲜半岛的烽烟到湄公河金黄的稻浪，从喜马拉雅雪线到南海群岛的惊涛——觉醒的亚洲兄弟已在同一面旗帜下集结，在同一条战壕里挺起不屈的脊梁。历史的天平，正不可阻挡地倒向为自由而战的人民。\n这场战争不是大国博弈的筹码，不是以兄弟共荣之名大行殖民主义之实的所谓“圣战”，更非任何主义的改朝换代。这是一场迟来数百年的复仇，一场为千百万罹难同胞昭雪的正义审判。我们将夺回我们的故乡，夺回属于我们的一席之地，我们要让那些殖民者血债血偿；我们要完成我们亚洲革命先烈的未竟之遗愿，无数的革命先烈薨逝于黎明到来之前，我们绝不忘记他们的牺牲与奉献，我们绝不辜负他们的期望。\n我们要砸碎旧世界的锁链！以人民战争的铁拳，将象征奴役的枷锁，彻底碎为齑粉！在敌寇污血浸透的土地上，我们将亲手建立起一个自由、平等、没有压迫、没有剥削、各民族团结互助、摆脱了新旧殖民枷锁、独立自主的新亚洲！\n兄弟们，同志们，埋好牺牲的同胞，包扎我们的伤口，举起染血的战旗，握紧我们的钢枪，组织起我们无坚不摧的军队。\n向着最后的解放，向着最后的胜利。前进！前进！！前进！！！"
 prcs.3122.a: "我们撒下的每一滴热血，都将让故乡的土地回归生机！"
 prcs.3123.t: "世界解放阵线已攻入美国本土！"
 prcs.3123.d: "经过多日的抢滩作战，世界解放阵线联军的先头部队已经在美国的西海岸上获得了立足点。尽管美军拼死抵抗，也未能阻止世界解放阵线的兵锋触及其本土。这是自十九世纪后，第一次有外国的武装力量登陆其核心领土。\n当内战刚刚结束不久、百废待兴的美国决定加入远在西太平洋的战争时，这场被世界解放阵线称为“亚洲解放战争”的大规模战争已经达到其最大规模，而有人私下称为其为第二次太平洋战争。尽管有人认为这场战争将会成为第一次太平洋战争的重演，但是在美国海军以及日韩澳印等国遭遇一了系列毁灭性打击后，胜利的天平已然彻底倒向中国以及其忠实盟友。而美国的势力也不得不龟缩本土，绝望地等待世界解放阵线的登陆。\n而美利坚政府在其落入下风后，即宣布其制度、价值观与国家安全已经到了最危险的时刻，并为此签发了一系列动员法案，要求一切适龄兵役人口参军服役，为阻止赤色势力、捍卫民主与美利坚价值观而战。目前已经有将近百万的青壮年被征召入伍，近千万的平民参与到战争的辅助工作当中。世界解放阵线的登陆部队将会面临不小的防御压力。\n在可以预计的日子里，世界解放阵线将会巩固其滩头阵地，并发起向整个西海岸的进攻。届时，美国方面若无法阻止其进攻，其政坛将会发生有史以来最大的地震。"
 prcs.3123.a: "美国梦碎在即。"
 prcs.3124.t: "铁饭碗"
 prcs.3124.d: "清澈透亮的河流静静地从这片沟壑纵横的黄土中走过。后浪推着前浪，沉稳而有力，把流水泵入到了那些水渠中。毛细血管一般的水渠使得这流动的生命渗入到土壤的深处，翠绿与金黄因此染遍了大地。\n电动自行车的轮胎压着新修水渠上的混凝土盖板，咯咚咯咚的响声在田野中划过。刘志祥特别喜欢在盛夏和金秋的黄昏时分骑着车穿行于这片农田里，他经常说比起空调或者电扇，晚风更加有益于身体健康。田野公路上，集体农粮企业的牌子飞快地掠过，立马消失在了视野里。\n“吱——”电动车缓缓地停在那段矮矮的河堤上，河水从脚下滚滚而去，河对岸，新盖的抽水站正在隆隆作响。麦香氤氲在空气中，与飞虫共舞。刘志祥从车座下拉出一张垫子，铺在河堤上，然后他拿出了自己的饭盒，开始大快朵颐。他还记得小时候家里那些长满了豁口的瓷碗和黑痘痘的搪瓷饭盒，不是容易不小心划伤嘴就是丑得有点水平。所以他一直都很喜欢铁的饭碗，尤其是不锈钢的。以至于在家里吃饭的时候，他的饭碗都是专属的不锈钢。\n他打开饭盒盖子，烩羊肉的香气立马就与面饼的香混在一起，晚风携着水腥味和麦香味气飞来，形成了一种奇异的香气。自从企业办起来之后，企业食堂成了解决人们口腹之欲的好地方，毕竟他现在是企业的“正式固定员工”，成了拿工资的“上班的”，有固定饭票，就不必骑车半天从田里骑回家再吃饭了。\n太阳西斜，将无数碎金投射于长河之上，水浪上下起伏，与这片无边无际的金色麦浪一同呼吸。过不了多久，这些麦子将被收割，脱粒，被磨成面粉，加工，将这从大地与河水汲取的生命带到万家灯火之中。"
 prcs.3124.a: "铁打的饭碗，端在自己手中。"
 prcs.3125.t: "枯木逢春，金乌东升"
 prcs.3125.d: "世界解放阵线向全亚洲人民庄严宣告：\n亚洲，这片广博而富饶的土地上孕育了我们历史悠久而伟大的文明，我们的祖先曾经在这片土地上创造了辉煌而灿烂的文化成就，我们世世代代都是自由且独立的民族。但是自从那西方殖民者闯入我们的家园，一切都变了。\n尽管西方殖民主义不在明面上殖民亚洲了，但他们却在这里留下了无数旧秩序的代理人，而现在，他们与他们的美国主子在亚洲制造所谓的“冷战”，疯狂地镇压亚洲各国的革命民主运动。在世界旧秩序行将崩溃的今天，旧秩序的虚弱已然暴露无遗。他们不肯承认自己的失败，要将全亚洲拖入到更加黑暗和残忍的前途当中去。\n革命同志们，亚洲兄弟们，不肯投降屈服的人民百姓们！我们还要被那些傲慢的西方殖民者以及其走狗当成猪羊一般宰割多少次?难道我们注定就低人一等，永远也不可能自己掌握自己的命运吗？\n不，我们绝不承认这样的现实。我们可以看见，殖民主义者因为其内在的深重危机已经变得空前虚弱，他们赖以生存的旧世界行将崩溃，而他们正在垂死挣扎企图延缓自己的死亡。而我们则变得空前强大，我们在革命的斗争和经济建设中壮大了自己的实力，更重要的是，我们现在团结在一面旗帜下。\n所以，现在是时候发动对殖民主义旧秩序的最后一击了。过去是他们来选择战场，而现在则是由我们来选择我们进攻的战场了。我们将在沙漠战斗，我们将在雨林战斗，我们将在乡村战斗，我们将在都市战斗——我们将一直战斗下去，一直打到彻底胜利的到来。\n这不是一场大国博弈，不是以兄弟共荣之名大行殖民主义之实的所谓“圣战”，更不是什么这个主义或者那个主义的改朝换代。这是一场迟到了数百年的复仇战争，主角是人民，对象是窒息了我们数百年的旧世界旧秩序，我们将去夺回我们的故乡，夺回属于我们自己的一席之地，我们要让那些殖民者血债血偿；所以，这是一场属于我们自己的战争，这场战争关乎我们自己的命运，只有我们人民百姓自己起来，才能彻底实现这次对旧世界的伟大复仇；而这，也是一次完成我们亚洲革命先烈遗愿的伟大战争，无数的革命先烈薨逝于黎明到来之前，我们绝不忘记他们的牺牲与奉献，我们绝不辜负他们的遗愿。\n我们相信，亚洲的未来是光明的，亚洲是属于亚洲人民的，而不是那些与殖民主义势力勾结一气的反动派的。而只要我们团结一心，英勇战斗，我们就必将战胜一切强敌。\n兄弟们，同志们，埋好我们牺牲的同胞，包扎好我们的伤口，拿起我们的武器，举起我们的旗帜，组织起我们的军队！向着最后的解放和胜利，前进前进再前进！"
 prcs.3125.a: "我们撒下的每一滴热血，都将让故乡的土地回归生机！"
 prcs.3126.t: "“天翻地覆慨而慷”（其一）"
 prcs.3126.d: "“老先生，现在党都准备计划经济改革了，你为什么还要对着‘鸟笼经济’抱残守缺呢？”\n\n“计划经济与市场经济相结合是通向未来发展，经济快速增长的唯一出路。市场经济的优点，配合计划经济的优点，这不就完美地促进了生产力的发展，现在你们还是走老路，怎么还在改革前问一遍姓‘资’姓‘社’？计划经济排斥市场调节，计划经济减少市场的无政府状态，你难道不知道社会主义有市场，资本主义有计划？”\n\n“计划经济什么时候成了简单的经济计划，市场怎么就直接化约为了市场经济？您老是老党员，我知道您可能忍不了对邓小平改革的否定，退而求其次才拥抱陈云的‘鸟笼经济’模式，现在数字经济模式如此发展，你怎么还……”\n\n“小同志，数字计划经济还是数字‘鸟笼经济’，这个问题很深刻，这不是你一个年轻人谈的了的，现在确实需要向年轻人让步，但是，你试图教育我一位老党员，对我指手画脚就不对了吧？”\n\n“同志，你这就不对了，”年轻人嘴角扬起一抹弧度，“你这是诡辩。”\n“砰”老同志大力拍向桌子，扭过头去，不再言语，另一位老党员看向年轻人，讪笑了笑，“你才入了几年党啊，这么跟老同志说话？！”\n\n“真理的掌握不分年龄，这么支持市场，也不是社会主义。”年轻人微眯双眼，轻拍桌子。\n“你知道什么是社会主义吗！”老同志面露怒意，死死盯住年轻人，“我告诉你，社会主义是解放生产力，发展生产力，消灭剥削，消除两极分化，最终达到共同富裕，怎么就不能用市场经济了？”\n\n年轻人撇了撇嘴:"
 prcs.3126.a: "“再问一遍，姓‘社’还是姓‘资’？”"
 PRC_tfr_nl_china_tianfandifukaierkang_tt: "§R扫帚§!不扫，§g灰尘§!不会自己跑掉。"
 prcs.3127.t: "“天翻地覆慨而慷”（其二）"
 prcs.3127.d: "正确地评价“前三十年”与“后四十年”，这是我们改革的开始，是第一时间面对的问题，如何做到承接“后四十年”的历史问题，如何正视那个远去的被理想化的“前三十”，这是我们当下的任务，现在，我们要把红旗插的更高，就避免不了对红旗下的土地进行客观的评价。\n\n但是问题在于，尤其是我们面向“文革”，首先是资料受限，其次是在这一段极具争议的历史事件中做出一个真正正确评论是极端困难的。把“文革”与“改革”串起来进行分析也是极度困难的行为，这一行为背后要面对两种主要声音，第一是左派的质疑，二者为何不应该是一种“断裂”，这种断裂的背后是资产阶级路线同无产阶级路线的矛盾，是“两条路线”的矛盾；第二是右派的质疑，二者的连续应当被看为一种历史规律，他们固然支持串联分析，但他们企图将矛盾抹杀在连续性当中。\n\n“老左派”、“新左派”，历史的车轮将碾过过去了的一切，走向何方，历史不会直接给出答案，但我们可以通过对历史的正视，从今天走向明天。\n\n王绍光、夏尔·贝特兰、汪辉，这些学者的观点对我们分析“前三十”与“后四十”时提供理论助力。"
 prcs.3127.a: "敢向恶鬼争高下，不向霸王让寸分！"
 prcs.3128.t: "“天翻地覆慨而慷”（其三）"
 prcs.3128.d: "“前三十年”与“后四十年”的评定问题，一直都是关键性的问题，当革命走到现在，正确评定二者的联系，是一个重要的质点。“前三十年”的“软”“硬”皆具，无疑是改革开放行进的一大凭据，不过，“前三十”与“后四十”的连续在哪里？为什么“文革”后会是“改开”？\n正如王绍光所说，中国的分权化（财政收支权、物资管理权的下放）的计划经济体制、数量庞大的中小企业、大规模修建的水利设施与1975年建成的较为完善的工业体系，无疑为改革开放打下了坚实的“硬件”基础。“[1978年]在全国工业总产值中，国有企业占77.16%，集体企业占22.14%。但从工业企业数目上看，国有企业只有83700家，而集体企业多达264700家”，“‘文革’后期，统配物资与部管物资加在一起只有217种。”（王绍光）\n“前三十年”中，通过土地改革、社会主义改造以及限制“资产阶级法权”，这使中国变成一个相对扁平化的社会，不存在任何势力强大的“分利集团”。这为改革打下了坚实的“软件基础”，但是，为什么会走向改革开放？\n中国计划经济体制的高度分权化实际上让地方势力的自发性尝到了甜头，大规模的“权力下放”实际上为改革开放的大力商品经济发展提供了便利，甚至说，如果当时中国的高度分权化取消了事实上的“统一计划”，便一定会步入相似于南斯拉夫“市场经济社会主义”的经济模式。不过，在中国还未取消的计划经济模式下，这种高度分权化，充分实践了毛泽东同志在《论十大关系》中阐述的“两条腿走路”的设计理念，并事实上带来了中国的经济腾飞（夏尔·贝特兰）。\n当然，这种分权化的模式在高层领导权落入市场经济支持者的手中后，地方与中央的双重呼应直接使市场经济模式充分适配了中国的经济形态，在整个80年代的过渡期结束后，一把大火顺势将计划经济烧成了经济计划。告别了高通货膨胀率与低额GDP增量的最后89年后，便是90年代市场经济改革的经济腾飞，这同时带来了“阵痛”，那就是工人的生活水平下降与被生生拉大的贫富差距。"
 prcs.3128.a: "十载春秋盼春暖，卌年冬寂倒春寒。"
 prcs.3129.t: "“天翻地覆慨而慷”（其四）"
 prcs.3129.d: "为什么“文革”后会是“改革”？\n事实上是，“文革”本身并非为了“改革”，甚至说它和“改革”本身处于极端对立的立场，这个表现在一个基本逻辑里面，举个例子，邓小平曾经说“改革也是解放生产力”，在1976年10月批判“四人帮”前，主流理论是强调“社会主义是从资本主义脱胎出来的”，并强调资产阶级法权在社会主义社会当中的客观存在，“以阶级斗争为纲”的理论统帅催生出了“革命就是解放生产力”的绝对统治力度。\n在这里，革命意味着对旧社会的宣战，因为不存在一个已经完善好了的社会主义，改革的逻辑是建立在已完善的条件下的，我们始终在同资本主义斗争。这里，“文革”同“改革” 的内生逻辑，不仅是完全矛盾的，甚至是在两个对立面上的。但是历史的辩证法恰恰在这里发生了，“文革”本身的错误，尤其是对上，老干部的巨大阻力（纵使存在不少在“改革”后改变立场的老干部），对下，群众的政治热情被非理论性的建设（尤其被错误地表现为某种造反派与保守派单纯的对职位的争夺）冲的冷淡，“文革”自身企图走向群众自觉性的理论目的被贫乏的阶级分析与理论宣传直接葬送。\n批斗大会的召开，对对方的批评只表现为批评对方的历史性错误，只批评对方是所谓“叛徒”、“工贼”，空翻历史旧账，对群众的说服教育的严重缺席。这就导致，对“四人帮”进行批判的时候，同样可以使用“地富反坏”和“新老资产阶级分子”在我党内的代表，理论上的混乱导致群众事实上根本意识不到所谓的“走资派”的威胁到底在哪儿，大量从旧社会当中走出来的人民群众也不会理解为什么会有“走资派”。\n“短二十世纪”的终结不仅源于后续的改革方向，更是深刻地源与“文革”这场运动的沉重的历史错误所导致的遗产葬送息息相关，“文革”后，未被造反派团结的保守派知识分子、老干部与利益集团相互勾连，占据了整个上层建筑领域，接下来——"
 prcs.3129.a: "忽如一夜春风来，千树万树梨花开。"
 prcs.3130.t: "“天翻地覆慨而慷”（其五）"
 prcs.3130.d: "年轻人展开桌子上字迹潦草的稿纸，笑的合不拢嘴，随后下楼，兴奋地找到老师，展开，“老师你看，我把摘录和批注全写这上面了。我觉得像是苏联的OGAS，智利的Cybersyn，这二者都是一个非常有意思的方向，前者更像是苏联体制的缝缝补补，而后者的‘递归’系统无疑适配于一定的分权化计划经济模式，不过，后者的递归系统的去中心化大有一种地方权力过大化的感触，现在的中国不是当时的智利，我认为很有搞头。”\n\n老师拿过稿纸，笑了笑，问：“那你怎么看‘数字鸟笼经济’呢？”\n\n“哈哈。”年轻人从衣服内兜里掏出一根钢笔，随手在稿纸背后写下几个字，老师伸手把纸拽过来看了一眼，拍了拍年轻人，“你小子。”\n\n纸上的是“弗兰肯斯坦怪物”。\n\n“唉，我想到了你老师我之前也是个计划经济支持者，记得80年代那会儿，我们教的是计划经济学，那会儿强调权利进一步下放，扩大商品经济。90年代，我们教市场经济，那时不得不学了宏观经济学与微观经济学，那时候我们强调宏观调控与发挥市场主体调节能力，四十年……已经足够框住我们的想法了，现在，还是靠你们年轻人。邓小平改革……时代的阵痛……”老师点了一根烟，缓缓吸了一口，看向窗外，又看了看年轻人，笑着吐出了口中的白烟，"
 prcs.3130.a: "“巴山楚水凄凉地，二十三年弃置身。”"
 prcs.3131.t: "“天翻地覆慨而慷”（其六）"
 prcs.3131.d: "虽说计划经济改革的声音压过了市场经济的坚定不移的支持者，但是老问题的换新衣仍旧使无产阶级知识分子头疼无比。\n\n“物质基础是否足够丰富？”“重新强调限制资产阶级法权的是何居心？”“‘四人帮’意图借尸还魂！”“以阶级斗争为纲还是经济建设为中心？”“政治统帅经济到底是政治为经济服务！”质疑首先来自对“四人帮”的反对。\n\n人们翻出了1978年的一本小册子，意图清算所谓“四人帮”的反动思想在当下的反映，书名叫：《批判“四人帮”对“唯生产力论”的“批判”》，为了继续进行交流，这本书被单独拿出来再版，被打成“四人帮”的所谓“反革命”书籍也来到了再版，《社会主义政治经济学》时隔五十余年重现于上海人民出版社，从内参走向公众发行，新的书本装帧以红色为底，书的大名以烫金书写。\n\n“文革”最后的理论建设，崭新的出版却使它曾经只能在电子文件中看到的读者们略感惆怅，激烈的辩论还在进行，就像那纠缠了五十余年的“历史遗留问题”依旧存在一样，现在，学术界重新掀起了对姓“社”姓“资”的讨论，现在某种历史清算，开始了。\n\n“您好，曾经的网络左翼明星。不知道这个称呼是不是对您有冒犯，总之感谢您接受我们电视台的采访。”\n\n“哈哈，没什么，曾经我们在互联网上进行讨论，最多是对某些言论感到吃惊，如果现在的网络流行言论放到当时，是会被视作疯狂的网左批判的。”\n\n“您的感受是什么呢？”"
 prcs.3131.a: "“虎踞龙盘今胜昔，天翻地覆慨而慷！”"
 PRC_tfr_nl_china_taikongjunhaizaizuo_tt: "太空军的机制仍在制作中，敬请期待！"
 PRC_tfr_nl_china_taikongjunguihaizaizuo_tt: "太空军的UI仍在重新制作中，敬请期待！"
 prcs.3132.t: "三子归边"
 prcs.3132.d: "“我在受训的时候可从没想过从这么高的地方跳下来。”老陈看着舷窗外的地球，感叹道。\n"说实话我们不用跳的，"刘航笑了笑，"返回舱会把我们送到目标区域。真正难的是落地后立刻能战斗。"\n老陈点点头，看着轨道站渐渐远去。作为中国人民解放军太空军第一批轨道空降兵，他们的任务是整个轨道空降计划的关键一环——验证轨道空降的可行性。\n返回舱内共有六名队员，都是从空降兵特种部队精挑细选出来的精英。在太空站上，他们已经进行了三个月的适应性训练——在失重环境下生活，学习如何应对骨密度流失和肌肉萎缩。而今天，他们将证明人类能否在从太空返回后立即投入战斗。\n返回舱开始进入大气层，温度升高，舱内开始震动。与普通宇航员不同，他们身着的不是笨重的航天服，而是经过特殊设计的半刚性战术服——既能提供基本的太空保护，又保留了地面作战的灵活性。\n"各位同志，"队长王铁打开通讯，"我们不是普通宇航员，着陆后没有医疗队接应。我们要牢记做过的生理代偿训练。降落到地面后迅速调整至战斗状态。"\n老陈调整呼吸，开始执行特制的肌肉绷紧放松程序。这是他们在太空站上每天必练的功课——通过特定的呼吸和肌肉控制技术，帮助身体更快适应重力环境。这些技术结合先进的压力服设计，能让他们比普通宇航员更快恢复行动。\n返回舱降落伞展开，地面接近。"着陆倒计时，30秒。各就各位。"系统提示音响起。\n老陈握紧了特制轻型步枪。尽管经历过无数次从高空坠落的训练，面对这前所未有的太空归航，他的手心依然渗出了细密的汗珠。\n"着陆！"\n返回舱稳稳落地，轻微颠簸后停止。舱门弹开，六名战士迅速展开，按预定方案构筑临时防御阵地。尽管肌肉有些颤抖，呼吸略显急促，但他们都能保持基本的战术动作。\n远处尘土飞扬，蓝军的士兵正在向这里推进。老陈迅速找到掩体，强忍着肌肉的酸痛感和头晕目眩，稳住呼吸，瞄准前方。\n"锁定目标，火力压制！"王铁果断下令。\n六人战术队形迅速形成，交叉火力覆盖整个接近路径。老陈的第一枪略微偏高，但立即调整后连续击中两个移动目标。全队配合默契，如同平日地面训练一般精准。\n"太空轨道空降实验，战斗能力测试达标！"地面观察员的声音在通讯频道中响起。\n老陈抹去额头的汗水，露出笑容。从陆地到太空，解放军再次创造了历史。"
 prcs.3132.a: "太空军的轨道空降一环，正式成功。"
 prcs.3133.t: "三子归边（其二）"
 prcs.3133.d: "“老陈，你看外面，这地球真漂亮吧。”顺着他指的方向看去，地球就展现在他们的眼前，那么动人。\n老陈点了点头，他在手册上读过，欣赏一下美景是会让人在轨道投送时缓解紧张情绪。而眼下，正是中国人民解放军太空军组建以来的最关键的一环——将那些数据和理论用之以实践。\n\n“各位同志，最后一遍检查弹药。”随着队长王铁的声音在特质的作战服中响起，首批六名成员开始检查着枪支，投送仓，以及作战服等是否准备就绪。等到他们固定在各自的投送仓后，那个平日训练里出现了不知多少次的声音再一次响起，但是这一次，将会是实战测试。\n“即将发射投送舱。请注意……五...三...一，确认发射。”\n此时，在北京的地面指挥部中，除了有太空军的各级将领和发射中心的技术人员，还有着为此事业一直奋斗过来的研究所代表等。在大屏幕上，六个投送舱的位置，下降速度都符合他们的预期，电脑中传回的众人生命体征图也是保持正常，没有过快心跳。\n“保持冷静，保持冷静。”这是老刘在脑中不断告诉自己的东西。没有人来过这个领域，可现在，他们正在创造历史——从近地轨道直接部署作战力量支援作战。随着投送舱越来越接近地面，在舱顶的反助推火箭果断喷射着，让速度迅速降了下来。而到了离地两三米后，返回舱的支架便完全展开，六人鱼贯而出。紧接着便是展示六人训练中的各项内容——落地后迅速集结，展开战术行动……\n“报告指挥部，此次太空尖刀演练圆满完成，请指挥部验收。”\n在那个瞬间，指挥部内所有人都激动的拥抱在了一起，而在现场则是由及时赶到的卫生队为这些“勇士”测量各项生命体征是否正常，并拿出装置让他们适应大气压，以及收集各项数据准备优化接下来的流程和装备。\n老陈在两人的搀扶下，不由得发出来一句感慨。"
 prcs.3133.a: "“天空属于勇敢者，而太空属于开拓者。”"
 prcs.3134.t: "秃鹰"
 prcs.3134.d: "闪光灯此起彼伏地亮起，但是鲁索只是黑着脸，走进了普济禅院。\n这身处澳门闹市的寺院出奇地宁静，青烟从香炉中升起，佛像微笑地注视着八方来客。鲁索瞟了一眼那些微笑着的佛像，冷哼了一声，画了一个十字，便继续向后花园走去。\n\n后花园里，那棵连理树下摆着的石桌和石凳依旧如故。胜利者们正在等他，他咬了咬牙，用他往日那威风十足的步伐向着那些人走去。\n还没等鲁索说话，赵甬元便开口了：“你迟到了，美国人。我们已经等得太久了；”他顿了顿，露出了一丝神秘的微笑：“但我们不在乎这些，我们今天可以多等一会。”\n\n翻译传达了过去，鲁索没理他，眼睛直勾勾地盯着胡春华：“你们中国人选地址的品味真让我作呕，不会选个更好的地方吗？”\n胡春华笑了笑，说：“你们西方基督徒会在上帝的注视下起誓，那我们也不妨在佛陀的注视下签订这份条约。”\n\n“别拿我当傻子！这里是签订望厦条约的地方，这是赤裸裸的外交羞辱。”\n\n白井聪带着学者般的笑容开口道：“也许我们后面可以开着四个航母战斗群去你们的纽约港来签订这份条约。”\n\n“把条约给我，赶快了事，在这里多呆一秒都是对美利坚人民的羞辱。”鲁索急不可耐地说。他拿起了那份条约，翻了起来……"
 prcs.3134.a: "……但是越翻，他的手就越是颤抖。"
 prcs.3135.t: "折翼"
 prcs.3135.d: "“释放太平洋美国诸岛屿，将这些岛屿移到世界解放阵线的托管之下……解散印度洋太平洋地区的所有舰队以及在印太所有地区的驻军……将海外军事基地、舰船与装备移交到当地国家……你们想侵吞掉美利坚军队的财产！”\n“你们美国人有法律，你们可以用枪打死不受欢迎的闯入者——而你们闯入我们的家门太久了。”赵甬元说。\n“向日本赔偿美国在日本掠夺的财产、赔偿其扶植的军国主义走狗掠夺日本的财产，以及为资助军国主义走狗的历史罪行向日本人民道歉……”\n“向朝鲜赔偿非法干涉祖国统一战争所造成的一切损失、并赔偿干涉亚洲社会主义战争当中对朝鲜人民造成的损失……”\n“对历史上一切通过不平等条约自中国掠夺的合法财产进行赔偿……”\n“这完全不可理喻！”鲁索抗议道，“这是对美利坚彻头彻尾的侮辱，为什么我们要为已经过去的事情进行赔偿?”\n“欠债还钱，父债子偿，天经地义。”\n“割让夏威夷群岛，并将当地政权移交至美国人民解放军的控制下……这一切行动将在世界解放阵线联军的监督下完成……”格洛莉亚讥讽地看着面色越来越难看的鲁索。\n鲁索把条约放在桌上，眯缝着眼睛直视着那些人：“所以说，你们还要让共产主义的瘟疫在我们的国土上蔓延?甚至不惜分裂我们的国家?”他沉默了好一会，然后说：“我拒绝签这样的条约。”\n胡春华突然变得很严肃，说道：“这场仗，要打多久，我看还是得总统阁下来决定;”他提高了音量：“你要打多久，我们就打多久。一直打到你们把你们吃下去的血，还有你们的血，彻底吐出来。”\n赵甬元紧接着说道：“我们不介意在你们那块所谓遇难者的破碑上多刻下几个数字。”"
 prcs.3135.a: "鲁索捏紧了拳头，把手伸向了钢笔……"
 prcs.3136.t: "狂怒"
 prcs.3136.d: "[?year]年的夏天，南海的阳光像是熔化的金水，毫无遮拦地泼洒在广袤无垠的蔚蓝海面上。空气湿热得能拧出水来，海风都带着一股粘稠的咸腥味。就在这片看似亘古不变的平静之下，一场足以让整个世界心跳停摆的风暴正在酝酿。\n\n在二次黑船后，美利坚合众国并未给世界留下太多反应的时间。那支幽灵般回归的第七舰队，在日本短暂休整后，与第五舰队主力汇合后，调转了航向，矛头直指全球最敏感的海域。\n\n“尼米兹”号核动力航空母舰，这头在阿拉斯加冰冷的海水中蛰伏了数年的钢铁巨兽，如今正以一种近乎傲慢的姿态，劈开南海温热的波涛。它的甲板在烈日下泛着金属的冷光，四条蒸汽弹射器轨道如同蓄势待发的弩箭。在它身后更远的海域，如同幽灵般存在的，是“卡尔·文森”号与“乔治·华盛顿”号航母战斗群，它们像两只蓄势待发的猛虎，在阴影中窥伺，为前方的“尼米兹”提供了无形的战略支撑。\n\n美利坚，这个归来的巨人正用最激进的行动，向全世界宣泄力量，它想用舰载机的呼啸和雷达的锁定，去丈量一下，这条巨龙的鳞片究竟有多硬，它的吐息究竟有多灼人。"
 prcs.3136.a: "但这一切，真能如它所愿吗？"
 prcs.3137.t: "议论"
 prcs.3137.d: "在“尼米兹”号的舰载机呼啸着冲上云霄前整整两个小时，北京西山，中央军委联合地下作战指挥中心的巨幅屏幕上，三个代表着美国航母战斗群的图标就已经被天基侦察系统牢牢锁定。它们的一举一动，都在严密的监控之下。中美双方都清楚，所谓的“自由巡航”，从一开始就是一场在聚光灯下的表演。\n\n警报无声，但气氛凝重如铁。面对屏幕上那毫不掩饰的挑衅意图，决策过程快得惊人。\n\n“命令火箭军，向南海预定靶场坐标，进行反舰弹道导弹拒止打击演习，全程公开数据。”\n\n“命令南部、东部战区空军，所有值班战机带弹起飞，陆基反舰导弹部队进入发射程序。”\n\n“命令海军陆战队，所有登陆和特战单位进入一级战备。”\n\n三条针对性的部署命令几乎未经辩论便被一致通过，电波瞬间划破长空。真正的分歧，出现在海军舰队的调动规模上。\n\n丁毅站起身来，声音洪亮：“同志们。我建议，集结三大舰队主力，于南海布下天罗地网！毕其功于一役，彻底终结美帝国主义在太平洋的任何幻想！”\n\n然而，田中出言反驳“如此大规模的对峙，小心擦枪走火啊。南海，是南部战区的主场。命令南部战区舰队主力前往应对即可，形成对峙。东海、北海舰队作为战略总预备队，向台海和宫古海峡方向机动，形成策应之势。我们要的不是一场赌上国运的决战，而是要用最冷静、最专业的方式告诉他们——这里，不再是他们可以肆意横行的狩猎场。”"
 prcs.3137.a: "调动所有舰队，严阵之待。"
 prcs.3137.b: "南海舰队前往应对，其他舰队作总预备队……"
 prcs.3138.t: "奔向南海"
 prcs.3138.d: "王立把他的解放牌大卡车停在G75兰海高速的紧急停车带上，和其他几十辆民用车辆一起，被交警指挥着熄了火。南国六月的午后，太阳毒辣，沥青路面被烤得发软，蒸腾起扭曲的空气。他摇下车窗，点上一根烟，烦躁地看着前方被清空的路段。通常只有在迎接什么大人物时，才会有这种阵仗。\n\n但这一次，来的不是黑色的奥迪车队。\n\n先是地平线尽头传来的、越来越近的沉闷轰鸣，像是压抑的雷声在地面滚动。整个路面都在微微颤抖，他卡车后视镜里的挂件开始不安分地摇晃。紧接着，一列望不到头的橄榄绿铁流，以一种无可阻挡的气势，占据了整条南下的高速公路。\n\n打头的是轮式步战车，炮塔昂扬。紧随其后的，是让王立倒吸一口凉气的庞然大物——ZTD-05两栖突击车。它们那充满肌肉感的船型车体和巨大的水中推进器，无声地宣告着它们的目的地绝非内陆。这些钢铁巨兽的履带敲击在滚烫的柏油路上，发出金属的交响，每一下都仿佛敲在旁观者的心脏上。车体上，年轻士兵们的脸庞在钢盔的阴影下显得棱角分明，他们并没有东张西望，而是直视着南方，那是一种不带任何个人情感的、绝对的专注。\n\n一种难以言喻的情绪攫住了他。那不是恐惧，而是一种混杂着敬畏与血脉贲张的震撼。平日里新闻中那些冰冷的番号和武器，此刻正以一种无比粗暴和真实的方式，从他眼前碾过。\n\n铁流滚滚向南，将燥热的盛夏染上了一层铁马冰河的凛冽……"
 prcs.3138.a: "当那一天来临……"
 prcs.3139.t: "老卒"
 prcs.3139.d: "冲绳的空气粘稠得如同腐烂的蜜糖，海风卷着盐与潮湿植物的腐气，仿佛连肺都在发霉。但在嘉手纳空军基地的铁丝网之后，这份令人作呕的气味被另一种味道驱逐——汗水、枪油、旧时代残留下的钢铁味，像是来自另一个世界的呼吸，冷冽、残酷，不容置疑，只能被战士所亲吻。\n\n巡逻的士兵一队接一队地在营区边缘踱步，他们的身影沉重，步伐规整却沉默，M4卡宾枪仿佛已经嵌入他们的骨骼，成为肢体的一部分。他们不是那些曾在和平年代混日子的少爷兵，而是从德克萨斯的焦土与华盛顿的废墟中幸存的狼群。他们曾踏碎过南方联盟士兵的胸膛，亦曾亲手将政客的尸体挂在白宫前的旗杆上。他们活着，不是为了和平，而是因为战争从未真正结束。战争不是什么虚无缥缈的东西，战争就是他们生活的一部分。\n\n血色残阳滑落地平线，给营区蒙上一层浓重的铁锈红。马库斯·凯恩上校静静站在悍马车顶，身形笔直，像一块打磨过的墓碑。那道从眉骨劈至嘴角的伤疤，是芝加哥人留给他的“礼物”，在暮色中，这伤疤像一道燃烧的裂口，将整张脸撕成了两半，愈发狰狞。\n\n“听好了。”他的声音干涩、低沉，仿佛锈铁互相摩擦的脆响，但每一个字都像钉子砸进了地里。\n“你们看到这片土地了吗？这不是西雅图，不是旧金山，不是我们度假的地方。你们以为我们赢了？你们以为战争结束了？”\n\n他顿了顿，目光在一张张面孔上扫过。有些他熟悉，有些他早已记不清名字。这是他当年他一点点拼凑起来的军队，从新英格兰走到落基山，从旧金山一路烧到里士满。他们打赢过，也被打穿过——一次又一次地死去、补充，再死去。其实当年的追随起义之人，已经变得极少极少。但这支部队的精气神还保持着，他们从来都擅长与强敌交手，也见惯了轰鸣长夜的炮火，遮天盖日的无人机群与堪称漫山遍野的洪流钢铁。\n\n“我们错了。”凯恩低声说，语气却越来越冷。“当我们埋头重建时，一个新的暴政从太平洋彼岸升起了。他们嘲笑我们，恨不得在国会山的废墟上撒尿。他们觉得我们已经软了，断了脊梁。以为星条旗只是个商标，只能印在沃尔玛的内裤上。”\n\n他的拳头缓缓举起，布满老茧的手背鼓起如石的青筋：“他们忘了我们是谁。他们忘了美利坚合众国是怎么生出来的。那就让我们提醒他们——“我们在这里，就是要用敌人的血，在他们的土地上重写宪法的每一个字！让全世界看看，暴政的代价是什么！”他举起拳头，手臂上的青筋暴起。“擦亮你们的刺刀！吹响号角时，我们要让地狱都为我们颤抖！”\n\n“擦亮你们的刺刀。”他低吼，像是在下达某种咒令，“当号角响起时，我们要让地狱自己都为我们让路。Oorah！”\n“OORAH！”\n那声回应不是呐喊，更像是一群野兽咬碎了缰绳，赤裸地发出血与火铸就的狂吼。他们并非为了正义而战，而是因为他们已别无选择。战火塑造了他们，现在，他们就是火本身。那是一群被战争喂养大的恶犬，在嗅到新的血腥味后，发出的集体饥渴的咆哮。\n\n整个冲绳的夜，似乎都为之战栗。"
 prcs.3139.a: "去做吧士兵们，就像我们在西海岸踏碎那些安提法空想家一样。"
 PRC_tfr_nl_china_laozu_tt: "在你衰老之前，战争恩赐你死亡……"
 prcs.3140.t: "对攻"
 prcs.3140.d: "在物理世界，舰队对峙，战机盘旋，双方的距离保持在一条无形的、名为“战争”的红线之外。但在电磁频谱这个无形的战场上，第一次交锋早已如火如荼。\n\n美军的EA-18G“咆哮者”电子战机，如同一群幽灵般的猎手，率先发起了攻击。它们释放出强大的宽频干扰，像一场无声的数字海啸，席卷向南沙岛礁和前出的中国舰队。其目标明确而致命：致盲解放军的雷达，切断他们的通讯，让庞大的作战体系变成一盘散沙，让那些先进的驱逐舰和岛礁上的导弹阵地，都变成瞎子和聋子。\n\n一瞬间，南部战区指挥中心的大屏幕上，代表着己方部分传感器和数据链的光点开始剧烈闪烁，信号质量曲线断崖式下跌。美军的电子战，凶悍、精准，一如他们半个世纪以来的霸道作风。\n\n然而，这片海域早已不是单方面的猎场。几乎在“咆哮者”亮出獠牙的同一秒，从中国的055型驱逐舰上，从歼-16D电子战机吊舱中，从海岛上伪装成岩石的天线阵列里，一股同样强大，但更加复杂的电磁能量逆流而上。这不再是单纯的噪声对抗，而是夹杂着欺骗、引诱和渗透的复杂算法博弈。中国的系统试图在美军制造的“白噪音”海洋中，开辟出一条条加密的“深海航线”，同时，它们也释放出无数虚假的“数字幽灵”，试图污染美军的战场感知网络。\n\n南海的电磁频谱，瞬间变成了一个混乱、狂暴的漩涡。双方最顶尖的电子战系统，如同两头无形的巨兽，在这片看不见的战场上疯狂撕咬。数据流像瀑布一样奔涌，代码在毫秒间交锋，算力在极限燃烧。这场交锋的结果，将直接决定下一阶段对抗的走向。"
 prcs.3140.a: "在剧烈的争吵后，唯有中国的电磁波矗立于频道之中。"
 prcs.3140.b: "噪音交织，仿佛要把整个频道撕裂……"
 prcs.3140.c: "“所有人，启用应急预案！”"
 prcs.3141.t: "利刃"
 prcs.3141.d: "电磁频谱的喧嚣尚未完全平息，物理空间的交锋已然展开。在数万英尺的高空，稀薄的空气冰冷刺骨，南海如同一块巨大的、深邃的蓝宝石，镶嵌在弧形的地平线上。这里，即将成为飞行员意志、技术与飞机性能的终极角斗场。\n\n十几架F/A-18E组成的编队，如同一群张开利爪的猛禽，径直扑向中国舰队防空识别圈的边缘。它们的目标不是突破，而是压迫，是用最直接的空中优势，在对方的家门口画下一道属于美国的“红线”。\n\n几乎在同时，从山东舰的滑跃甲板上弹射而起的歼-15战斗机，以标准的拦截队形迎了上去。海灰色的涂装让它们几乎与天海一色的背景融为一体，如同从深海跃出的鲨鱼，准备捍卫自己的领海。\n\n没有通讯，没有警告，相遇的瞬间，激烈的空中格斗便开始了。这是一种默契的、游走在战争边缘的死亡之舞。美军飞行员率先发难，凭借丰富的实战经验，试图利用经典的“剪刀机动”绕到歼-15的后方。然而，中国的飞行员表现出了惊人的沉稳，他们没有陷入单对单的缠斗，而是以小编队为单位，相互掩护，利用数据链构筑起一张立体的防御网。\n\n座舱内，雷达锁定告警的尖啸声此起彼伏，HUD上，代表敌机的光标在疯狂地闪烁、跳跃。每一次高G过载的机动，都将飞行员死死地压在座椅上，血液仿佛要从大脑中被抽离。天空变成了三维的棋盘，双方都在用生命和钢铁进行着最复杂的博弈。一次擦肩而过，双方飞行员甚至能透过座舱盖，看到对方头盔下那冰冷的眼神。"
 prcs.3141.a: "飞鲨掀起怒涛，蜂群被淹没在了这片蓝色的天空。"
 prcs.3141.b: "南海的天空也因此碎裂……"
 prcs.3141.c: "在这碧蓝的宝石上，蜂群肆意狂舞，宛若苍蝇般盘旋……"
 prcs.3142.t: "幽灵？幽灵！"
 prcs.3142.d: "第509轰炸机联队的六架B-2“幽灵”刚刚完成空中加油，正从夏威夷飞往关岛。编队长机，空军中校马克·汤普森，正通过加密频道与后方指挥部确认航线。"太平洋司令部，幽灵编队已完成第二次加油，预计四小时后抵达安德森空军基地。"他一边检查着导航系统，一边扫视着无垠的太平洋。B-2的驾驶舱内只有仪表盘微弱的绿光，座舱外是深邃的夜空。\n"幽灵编队，太平洋司令部收到。保持航向，预警网显示航线清洁。"\n汤普森点点头，心中却隐隐有些不安。自从爱国者阵线重新统一美国以来，太平洋上的局势变得愈发紧张。海军在南海的"自由航行"行动撞上了中国航母战斗群，在这针尖对麦芒之际，轮到空军来展示肌肉了。六架B-2的威慑价值不言而喻——这可是能够携带战略武器深入任何防空区域的战略轰炸机。而B-2的隐身性能不需要任何护航：护航战斗机甚至会暴露B-2的位置。这原本应该是完全安全的任务，但汤普森总觉得有什么地方不对劲。\n突然，汤普森的副驾驶员，上尉杰克·罗德里格斯，紧盯着左侧的夜空，声音中带着一丝困惑："长机，左侧两点钟方向...你看到什么了吗？"\n汤普森转头看去，起初什么也没看到，只有无边的黑暗。但渐渐地，他注意到星光似乎在某个区域被微妙地遮挡着，形成了一个不太规则的阴影轮廓。"见鬼...那是什么？"\n话音刚落，那个阴影动了。它缓缓转向，月光照在它的机体表面上，露出了一个令人窒息的轮廓——菱形的机身，锐利的前缘，整体呈现出一种超现实的几何美感。那架战机就像一片致命的刀锋，无声地切割着夜空。\n"所有单位注意，左侧发现不明飞行器！"汤普森在加密频道中急促地报告。"雷达无反应，目视确认一架...法克，我不知道那是什么型号的战机！"\n"幽灵一号，太平洋司令部，请详细报告接触情况。"指挥部的声音传来，带着明显的紧张。\n就在这时，第二个、第三个、第四个同样的阴影从不同方向浮现出来。而汤普森也终于看清了机翼上的标识——被八一星切断的矩形。"中国空军！"汤普森惊叫出声，"该死，他们是怎么找到我们的？"\n就在此时，四架战机不约而同的开始靠近编队，在汤普森看来，这就是一条无形的绞索套在了幽灵编队的脖子上，此刻B-2编队就像雄鹰面前的母鸡一般，中国军机的任何动作都让他胆战心惊。他不管不顾的对着无线电喊道：“看在上帝的分上赶紧他妈的支援！F-22、F-35还是其他的什么都可以！再晚点我们就被打下来了！” \n"幽灵一号，冷静！保持冷静！"太平洋司令部的声音在频道中急促响起。"最近的F-22编队距离你们800海里，F-35需要从冲绳起飞，至少需要一个半小时。现在听我说，不要做任何挑衅动作！"\n好似听到他们的通讯一般，那四架战机继续逼近，距离近得令人窒息。汤普森透过座舱玻璃，几乎可以看清解放军飞行员头盔面罩后那双冷漠的眼睛，以及嘴角若有若无的讥讽笑意。那种被彻底看透的感觉让他浑身发冷。\n突然间，仿佛接收到了某种无形的指令，四架银色幽灵齐刷刷地脱离编队。它们以令人目眩的加速度向四个不同方向散开，瞬间消失在漆黑的夜空中，就像从未出现过一样。整个过程不到十秒钟，干净利落得如同幻觉。\n夜空重归寂静，只留下六架B-2孤零零地悬浮在太平洋上空。汤普森和他的机组人员们面面相觑，每个人的额头都渗出了冷汗，后背的飞行服已经被汗水浸透。他们刚刚经历了职业生涯中最恐怖的几分钟——雷达干干净净，预警机通报“一切正常”。但他们知道，那个幽灵和他的警告，才是这片海域上空最真实的存在。"
 prcs.3142.a: "“幽灵”之名从此易主。"
 prcs.3205.t: "银杏叶"
 prcs.3205.d: "“战鹰”中队的六架F/A-18F“超级大黄蜂”刚刚完成空中加油，正以标准的菱形编队在预定空域执行战斗巡逻。编队长机，海军少校凯尔·“响尾蛇”·詹森，一边扫视着如镜的南海海面，一边听着E-2D“鹰眼”预警机传来的、重复的空情通报——“空域清洁，无任何异常接触。Pardon，空域清洁，无任何异常接触。” 这种平静的枯燥让他心中泛起一丝不安。\n突然，詹森的僚机飞行员，代号“幽灵”的上尉，打破了宁静，语气中带着一丝困惑：“炸面圈一号，我……三点钟方向好像看到点什么，看起来是片……叶子？”\n“叶子？”詹森眉头一挑，转头望向那个方向。“炸面圈二号，检查一下你的供氧系统。我们现在三万英尺高，你可能是缺氧——”\n话音刚落，詹森自己也看到了。那不是错觉。正有一架飞机，以几乎不可能的平稳姿态，从他们编队的右下方无声地升起，悬停在他们平行的位置，距离不到半英里。雷达警告器依然没有反应，数据链也没有任何标记，仿佛它根本不属于这个世界。它的外形像一片巨大的银杏叶，整个机身呈现一种哑光的浅灰色，简洁、流线型，宛如一件艺术品。它没有“超级大黄蜂”那种厚重的攻击感，也没有外部挂载物，只有一种致命的优雅，仿佛是顶级掠食者的轻盈的利爪。\n恐慌如同电流般窜过六架战机的座舱，一股冷意迅速蔓延开来。“战鹰”中队的飞行员下意识地分散，试图将这名不速之客锁定在火控雷达上。然而无论他们如何调整飞行，那个银杏叶般的目标始终保持在他们攻击角度的死角里。它不做任何攻击动作，仿佛只是静静地观察，像幽灵一样紧随其后。\n接着，那个银杏叶动了。它以几乎无法捕捉的加速度，瞬间切入了詹森和僚机之间，两者之间的距离近得几乎可以看清机体表面的涂层，那个涂层仿佛能吞噬掉周围的光线。\n展示完毕后，那个银杏叶没有停留。它只是轻轻一晃，机头微微上扬，化作一道几乎无法被视觉捕捉的流光。随即以几乎不可思议的垂直爬升率，消失在蔚蓝的天际。整个过程不到三分钟，从出现到消失，仿佛一场幻觉。\n通讯频道里，“战鹰”中队的六名飞行员在空中陷入了死寂。他们的雷达依旧干干净净，预警机仍在通报“一切正常”。但他们知道，刚才那个幽灵和他的警告，才是这片海域上空最真实的存在。"
 prcs.3205.a: "那片让人夜不能寐的银杏叶。"
 prcs.3143.c.t: "龙啸南海"
 prcs.3143.c.d: "今日凌晨，一则由五角大楼发布的简短声明，为持续数日的南海紧张对峙画上了一个令世界错愕的句号。声明称，鉴于当前海域复杂的战术环境，为确保人员与资产安全，美利坚合众国海军尼米兹号，卡尔文森号与乔治·华盛顿号航母战斗群已完成其“自由航行任务”，并开始向菲律宾海域进行“预定轮换”。\n\n不愿透露姓名的情报界人士证实，在过去的72小时内，美军在无形与有形的战场上均遭遇了前所未有的挑战。\n\n消息传出，全球市场反应剧烈。东京日经指数开盘即暴跌超过5%，日本首相紧急召开国家安全保障会议。一位不愿公开姓名的日本外务省高级官员悲观地表示：“我们似乎过高地估计了美国的重量。”在堪培拉，德里和首尔，恐慌情绪同样在蔓延，太约的根基在这一刻发生了动摇。\n\n北京方面则保持了高度的克制，外交部发言人仅在例行记者会上重申：“中国军队有决心、有能力捍卫国家主权和领土完整。”然而，这种沉默比任何激烈的言辞都更具力量。"
 prcs.3143.a: "白鹰断翼。"
 prcs.3143.t.t: "僵持不下"
 prcs.3143.t.d: "经多方紧急斡旋，笼罩在南海上空的战争阴云暂时消散。据可靠消息，中美已达成非正式脱离接触谅解，双方舰队将后撤至安全距离，以避免冲突升级。持续数日的“南海对峙”，以一种令人窒息的平局告一段落。\n\n在这场高风险的博弈中，没有赢家。美军航母战斗群虽成功进入南海，但面对的是中国海空军前所未有的强硬姿态。在激烈的电子战与空中缠斗中，双方都展现了足以让对方付出惨重代价的能力，同时也暴露了各自的脆弱性。一位前北约高级军事顾问评论道：“双方都把枪顶在了对方的脑门上，这是一个谁也输不起的僵局。”\n\n此次事件并非结束，而是一个新冷战时代开启的序幕。美国证明了其仍有决心和能力介入西太平洋，而中国则用实力证明这里已不再是任其驰骋的后院。南海，自此成为两大巨头之间一个长期、高危的对峙前线。"
 prcs.3143.b: "各退一步。"
 prcs.3143.a.t: "白鹰之胜"
 prcs.3143.a.d: "白宫今日高调宣布，美海军已成功完成在南海的“自由航行”任务，有力捍卫了国际法。国防部报告罕见地公开部分细节：在电子战交锋中与空中对峙中，美军都不落下风，迫使中方战机始终无法进入有效攻击阵位。\n\n卫星图像证实，对峙期间中国舰队始终与美军保持着超过200海里的安全距离。最终，在美军舰载机编队完成一次极具象征意义的、飞越某争议岛礁上空的行动后，中方舰机选择了脱离接触。\n\n这次胜利，对刚刚走出内战阴影的美利坚合众国而言，无异于一剂强心针。托马斯.鲁索在玫瑰园发表电视讲话，称“美国不仅回来了，而且比以往任何时候都更强大。\n\n太约各国相继发表声明，对美国的领导力表示完全的信任，太约的凝聚力空前巩固。相反，北京方面则陷入了尴尬的沉默，官方媒体对事件报道寥寥。"
 prcs.3143.c: "巨龙折戟。"
 prcs.3146.t: "尘埃开始落定……"
 prcs.3146.d: "此时整个南海仅余零星交火，随着硝烟渐散，胜负之势已然明朗。\n\n综合多份战报研判，可以断言……"
 prcs.3146.a: "……战斗即将结束"
 prcs.3147.t: "陷落"
 prcs.3147.d: "一辆辆中国的装甲车和坦克在主干道上行驶着，两边的日本群众大都面容憔悴，双手捂住自己的嘴巴，他们不敢相信，大本营大肆宣传的“神风”竟然没来，来的是这一群他们调侃永远登不上日本的中国军人。\n哪怕是上世纪的二战美军都没有登上日本本土，而现如今，眼前这些人，“怪物”，已经突破了海自和空自的防线，朝着陆自在京都所构建的终极防御线前进着。\n两旁破碎的建筑墙壁上，还有着对中国军队发出最后一战的宣传画，只不过已经被工兵埋下了炸药，准备将这些墙壁炸烂。紧接着一架中国战斗机超低空飞行引起的轰鸣声震得这些沦陷区的日本公民头晕目眩，也害怕的不行。\n“妈妈，我想爸爸了。”一位小女孩拉着她妈妈破烂的衣角，手里的娃娃因为在地上拖着已经残缺不堪。她妈妈将她抱了起来，小声的在她的耳边说着，“爸爸现在还回不来呢，爸爸要和其他人一起，把这些占领我们土地的人给赶回去呢。”\n“可是，妈妈，我看这些叔叔脸上都是一种胜利的样子，广播里不是说我们的实力比他们更厉害吗，但是前两天……”\n“不准再说了，美津子！”她妈妈像是受到了什么刺激一般，朝她的脸上狠狠地扇了一巴掌，“如果你要是再对爸爸和我们的国家有什么质疑的话，我现在就把你送到这些杀人不眨眼的红色恶魔手中！我就不要你了！”\n那女孩想不明白母亲为什么给了她这一巴掌，但火辣辣的感觉让她本能的哭了出来。"
 prcs.3147.a: "在女孩的啼哭中，那些宣传画随着炸药引爆而灰飞烟灭。"
 prcs.3148.t: "企业家反战抗议？"
 prcs.3148.d: "自从胡总书记上台后，党对于社会舆论方面略有放宽。台海局势波谲云诡，解放军战士攻坚克难之际，一封信却来到了总书记台前。\n“尊敬的胡春华总书记：\n我的名字是刘兴福，来自宁波，1998年加入中国共产党。我从2014年开始经营一家服装加工厂，生产的成衣基本上都销往海外，所创造的利润曾足以令我、我的妻子还有我的儿子和女儿过上富裕的生活。\n我们与海外的经销商建立了良好的关系，在越南、新加坡和日本的货架上都可以找到我们的产品，直到台海战争让工厂彻底破产。我关掉了设备、解散了员工、背上了高利贷。我们不得不卖掉了市区的公寓。我的两个孩子都还要上学，但我连学费也快交不起。我的妻子已经打算和我去办离婚手续。\n胡春华总书记，我想说的是，我一直认为您能带领我们的国家走向强大。但现在，这场战争已经令无数和我遭遇一样的人生活在痛苦中。这难道是您所承诺的“公平公正”吗?我垦求您结束这场战争，把和平带回来吧!”"
 prcs.3148.a: "总书记放下信，看着前线的战报，眼神中浮现一抹冰冷。"
 prcs.3149.t: "反战舆论？"
 prcs.3149.d: "随着台海战争的发展，国内逐渐转向战时经济，全国人民开始统一在党领导的浩荡战歌中。\n\n然而，这首大协奏曲也有几个不谐之音——一些社交媒体上，“要和平，不要战争”的呼声如雨后春笋般冒头；审查平台上，放着一些大城市的示威者走上街头，高举代表着“工人，和平，民主”的红，绿，白三色旗帜的视频。他们成群结队，控诉着中国共产党带来战争，压迫工人高强度生产军用设施，中央乾刚独断，不尊重民意强行发动战争并冲击警员队伍，然后被防暴处理的画面。\n\n“不得不说，现在中央做出了果断的行动，但是相较于德国与法国依靠自身人民的力量解决经济危机，中央这种方法的后果…我不好说，嗯”在最新的视频中，一位知名“民主社会主义”者发表了自己的“观点”。一石激起千层浪，他的评论区反应激烈，各路人马此时却杀了个天翻地覆。"
 prcs.3149.a: "“战争就是错误，党只是为了转移矛盾！”"
 prcs.3151.t: "不一样的游行"
 prcs.3151.d: "“城东友谊大道又有人游行？”\n\n广东的一座派出所中，小汪的五官扭到一块去了“中午不才游行过吗？真是一帮刁民…”所里特派员甄苍术勉强笑笑“这…只能说明我们宣传部门的同志工作没做好嘛。”他用牙齿撕开医用棉签的包装，给自己受伤的手臂上药——刚才，游行的人群往队伍里扔自制燃烧瓶，被飞溅玻璃片扎伤了。\n\n“上级有命令，再发生流血事件的话，就出动特警。”大陈说着，紧张地看向屏幕，屏幕中，警员小张正在一线。\n\n“不对，这是前不久成立的地方汽车工会领导的游行，”前线的小张顿了顿，望着令人震撼的游行规模。“我感觉，他们站在我们这边，在来些辅警吧，维持秩序就够了。”\n\n“谁说宣传的同志不够努力啊，宣传的同志太棒了！”大陈舒了口气，开口调侃。\n\n高空录制的摄像头只拍到一片红潮——人群挥舞着五星红旗，拉着“坚持党的领导，不要让解放军寒心”的红色横幅。与几十人的小打小闹不同，这一次，万人空巷的游行向世界发出了震耳欲聋的咆哮：“中国人民坚定支持正义的台湾解放战争，任何妄图分裂的舆论都将屈于人民的意志之下。”"
 prcs.3151.a: "空中，一部分飞机划过云霄，守护着这抹红潮。"
 prcs.3152.t: "线条，报纸，推理"
 prcs.3152.d: "加贺看着办公桌上的报道，这几天，东京各个地区一直有骚乱，去市区晃悠一圈，也许能看到游行群众和警察爆发冲突，因此东京市民出门还得小心会不会被燃烧瓶砸到脑袋，抑或是不小心被一棍子砸下去。\n\n加贺抽了一口烟，只见他拿着剪刀肆意剪开这些报纸，散开在桌子上面，紧接着，他从抽屉里面拿出几根图钉和一根粉笔，随即，他一边构想着大脑的蓝图，一边画着线条订上报纸，在上面画着各种关系和注释，仿佛像是一个工程师构想着自己的宏伟计划。\n\n石神推开办公室的大门，手里面拿着从楼下买来的咖啡，见状问道；“喂，加贺，你这家伙在干吗，报纸上不是说了很清楚了吗，北岛先生是被赤色团体暗杀的。”\n加贺却不以为然，说到；“你确定？我怎么觉得，这事情有点蹊跷呢？”加贺拿起石神放在桌子上的咖啡，喝了一口，接着说；“首先，论坛上最近有人说他们家附近新装了不少监控系统，而且看到疑似有人一直在监视他们社区，还有北岛本人虽然一直在批评赤色份子，对赤色份子没有任何好感，但是北岛对大众形象一直是偏向正面而且深受欢迎，如果赤色份子选择暗杀北岛那么对他们来说是笔亏本买卖，所以我个人怀疑并不是像表面上那么简单。”\n\n石神看着黑板发愣，突然，他想到了一件事；“北岛被暗杀那会，一帮人不是上去抗议吗，当时有人回忆说，看到前来镇压的警察似乎对着对讲机喊着’人狼’，看样子应该是有什么猫腻，也许能调查看看？”\n\n加贺也点头同意，或许，整件事看起来没有那么简单。"
 prcs.3152.a: "两个侦探能查出什么吗？"
 prcs.3206.t: "巡查"
 prcs.3206.d: "这是初秋的一个深夜，道路上寂静无人，只见泛黄的叶子飘落在水泥之上，又被路边的风吹起吹落，而不远处，巡警笹垣提着手电筒在街道上视察，对于他来说，这不过是又一个平常的巡查任务，只需要按部就班的执行任务熬到天亮就可以美美的睡一觉了。\n\n打着这样的想法，笹垣一路走到某处小巷，这座小巷十分曲折，看上去没有尽头，而在这附近路灯坏了的情况下，巷子更显得寂静当中带着一丝恐怖。\n\n笹垣提了提嗓子眼，虽说来这地方不是第一次了，但是未免总是会感觉有一丝恐怖，不过，既然来这地方这么多次都没什么意外，倒也不用害怕啥，于是笹垣像往常那样走进小巷，检查这地方有啥问题。\n\n手电筒的灯光照向巷子深处，除了斑驳的墙面和几个十分恶臭垃圾桶之外别无他物，再把灯光一转，也无非是一样的场景，“嘛，看来这巷子也无非是和往常一样嘛。”笹垣心想，继续在这个巷子巡查，完成他今晚的任务。\n\n而他不知道的是，错过的垃圾桶里面，蛆虫正在啃食的腐烂的生肉，露出指关节的白骨，而苍蝇产卵的大腿腐肉旁边依稀可见“中核”二字的头盔。"
 prcs.3206.a: "“今日，附近居民倒垃圾时发现一具二十岁男性尸体，死者生前疑似为中核派成员……..”"
 prcs.3153.t: "闲谈"
 prcs.3153.d: "“所以你目前有什么想法没有？这个街区的人问了一圈，我还是没有任何头绪，可能我们需要去死者老家一趟调查看看？”在一辆老旧的轿车里面，加贺吃着面包，对石神说道。\n\n“嗯。。。。。。。我不好说，首先死者来到东京之后很少和家人联系，可能是工作太忙的原因，也有可能是参与赤色团体所以不能和家庭有太多联系，然后，这附近有人说巷子有一个神秘黑影闪过去，尽管不确定是不是真的，但是鉴于路灯损坏的情况下，我个人倾向是真的，毕竟一片漆黑的环境下确实是有作案的条件。”\n\n“可是，这么黑的环境下，他是怎么在一间巷子内完成谋杀的？我是说，他是怎么做到杀人不出现任何声音，并且在一个曲折的巷子里面堂而皇之的消失的。”\n\n“等会，你看看这个。”石神打开了笔记，“‘听到下水道传来咚咚咚的声音’，以前就有偷窥狂呆在下水道偷窥女生裙底的事情，所以可能凶手是利用下水道作案，然后打开井盖抛尸到垃圾桶里面，这可能是比较合理的解释。”\n\n加贺点头同意，说道；“那现在就去下水道看看？反正来都来了，总得挖掘出什么吧。”"
 prcs.3153.a: "“哗——” 井盖打开的声音。"
 prcs.3154.t: "鬼影"
 prcs.3154.d: "在外久候多时的人群伸着脑袋望着那一眼望不到头的地铁隧道。而后一束刺眼的光芒打在他们脸上，一辆地铁自黑暗中现身，缓缓的停靠在了这个站台边。站台上的光芒投入车厢，照在了安藤斋那沉入暗影的面孔上。\n安藤斋站在车厢里，他的目光从那些坐着的乘客脸上划过。一个老妇人靠在一个老头的肩上，老头将老妇人朝自己身边拉得更近了一点；一个年轻人正在和自己的同伴搓着掌机，游戏的快乐让他们喜形于色；一个上班族正在与家里人谈论着夜宵的事情。他的目光与一个小孩四目相对，安藤斋脸上僵硬的肌肉正要牵起他的嘴角，那个小孩便立刻钻进了自己母亲的怀里，不敢再看他的脸。他的目光收了回去，痴痴地望着地铁外，随着地铁的开动，那每个站点的些许微光迅速抛弃了他，消失在了隧道的黑暗里。他的眼睛触到了那宣传着征兵和“大东亚圣战”的海报，他迅速地紧了紧衣领，把脖子缩了进去，将自己包裹得更严实了。\n列车缓缓停下，他站在人潮中慢慢地向前进，走出了地铁站。而当他踏出地铁站的那一刻，一阵强劲有力的怒吼声便传入了他的耳朵里：“不要美国！不要战争！”而后一片白色和红色的头盔海洋便挤入了他的眼中。在学生的另一面，则是由警视厅机动队组成的人墙，灰黑色的盾牌已经排好了队列。两个队伍已经对峙了起来。“蛇已抵达现场，请蛇入场。”耳麦中传来的女声刺入他的脑中。他把手伸进了口袋里，那个玻璃瓶静静地躺好了，然后他将白色的头盔戴上，走到了那片人群里。\n一个戴着眼镜的红头盔举着喇叭，对自己身后的队伍说道：“诸君诸位！愚蠢的当局将我们日本国民拖入了一场无谓的战争，我们许多同胞都被他们白白地牺牲掉了。而现在他们又要为了大洋彼岸的所谓盟友而将我们拖入另一场无谓的血腥战争，还要为了这场战争掠夺更多的财富，还要把自己进一步变成美国人的奴仆！而我们现在只是要向当局展现和平的民意，我们不用武力，我们只是来请愿。只是要让他们看看，我们是不会为了他们所谓的反华防赤的东西买账的！”而后，他使出了全身的力气，怒吼道：“我们不做美国人的肉盾！我们不是当局的祭品！”头盔的海洋迅速爆发出了一阵怒吼。而安藤斋只是沉默着，拨开人群向前走去，他已经在心里默默地记下了目标。耳麦劈啪作响：“各组已经就位，请蛇出洞。”于是他扯下了耳麦，拨开了人群。\n他看见了机动队那严丝合缝的盾阵，看见了那些在暗影下晃动的鬼影，还看见了那鼓励战争捐款的海报。于是他走上前去，从口袋里掏出了一个用蜡封好的酒瓶，暗黄色的液体映出了他的脸。只消晃动几下，就能让易燃物质释放出高温。\n于是，他铆足了劲，将那个瓶子朝着机动队狠狠投掷了出去，那个戴着红头盔的人惊讶地看着他，刚想说什么来阻止，但一切为时已晚。登时，火星四溅。而后机动队的盾阵向着头盔的海洋飞奔而来，而那些鬼魅自暗影下显出了身形，警视厅公安部的徽章那么刺眼。在一片惨叫声里，安藤斋自人群悄悄脱离，溺入黑暗。"
 prcs.3154.a: "他下意识地摸了摸口袋里公安部的徽章。"
 prcs.3155.t: "战争机器"
 prcs.3155.d: "璀璨的灯光从琉璃般的大楼射出，与无数探照灯一道撕裂东京的夜空。昏黄路灯下，成群的上班族穿着同样的白衬衫、黑西裤，背着黑色双肩包，机械地向前走。几个醉醺醺的美国大兵摇晃在人群中，肩章上竖棍的标志格外显眼。一个职员不慎碰到他们，立刻被恶狠狠地推倒在地，接连挨了两脚。远处，警视厅的警车藏在高楼阴影中，一个挣扎的身影被粗暴的警棍击中头部，随即被塞进车厢。交通灯机械地发出鸟鸣，血红的光映在一张张没有血色的脸上。\n高楼外立面，全息广告循环播放天皇的征兵号召。皇居与武士的形象背后，昂首的白头鹰、咆哮的巨象和蓄势的袋鼠怒目圆睁，光芒刺眼，让行人下意识垂首。皇国的荣耀压得街道的阴影愈加浓重。光影之间，一个渺小的黑影缓缓穿行——像坏点般，无法被耀眼的电光抹去。\n小林秋水走过巨幕。街角的海报混杂着“防赤防华”“日美亲善”的宣传与学生妹的小广告。一张战甲武士、双眼炯炯的官员海报吸引了她——标语写着“为大东亚圣战献身！”。她嘴角轻轻一抬，手摸进口袋，指尖的触感让她心绪安定。取出一面梳妆镜照了照，她拐进一条小巷。\n耳机中，主持人正慷慨陈词“全体国防的必要性”。巷内，乞丐蜷缩在报纸下，有的已然僵硬。天桥上堆满黄菊与流泪的蜡烛，在战争中失去生命之人之至亲正在慨叹战争的伤害。她看了看手表，加快脚步，直至巷深处，那家闪着霓虹的小饭店。她深吸一口气，推门进入。门口保安正仰头，把廉价的清酒灌进干涩的喉咙。\n包厢内，几个油光满面的老男人醉得东倒西歪，含糊的议论从酒气中浮出：“嘛，无论他们搞什么花招……吾国军队的荣光……势在必行！”其中一个人，正是海报上的面孔。见她进来，几人齐齐露出淫笑。\n“美人……来武士身边坐，我可是武士啊，真是可恶！”那人抬了抬手。\n“还记得大川井上吗？”小林突然开口。\n“谁啊？我同事？”\n“他是个战士，在台湾死了。”\n“中国人干的？”他漫不经心。\n“不。”小林微笑，笑得灿烂：“是你们，为了不让他被俘虏，把他杀了。然后说他失踪。”\n“那是……为皇国尽忠嘛，呵呵……”笑声在包厢中交错回荡。\n小林也笑了——矜持、阴冷、咬牙切齿。\n正是他们裹挟着吾辈出生之土走向了一场反动的战争。\n片刻后，她把带血的衣物塞进包里，撕开密封袋，抖出一张字条，落在那些已经没了呼吸的男人身上。一颗红星在纸上灼灼其光，上面的文字更加触目惊心。\n警察们又有的忙了，他们口中那个针对自卫队军人，尤其是参加过援台战争的自卫队军人的可怕幽灵迫近了。"
 prcs.3155.a: "“使我国民陷入无谓战火者，杀无赦。”"
 prcs.3156.t: "入狼穴者"
 prcs.3156.d: "安藤斋走到那栋大楼前，警用直升机的探照灯盯着他的脚步。市中心街头的人流被安藤斋的身子劈开。那些行人对他视而不见，一边与自己的同伴相谈甚欢，他们的身子却又不自觉地避开着安藤斋。一个喝醉酒的人猛地撞在了安藤斋的身上，那个酒徒睁着朦胧的醉眼，扫视着安藤斋的脸和安藤斋的大衣，当他们的目光交汇时，酒徒立刻清醒了过来，涌到嘴边的垃圾话立刻收了回去，他一边鞠躬道歉，一边向后逃去。\n“身份确认，请进……”电子合成的女声从门禁系统中发出，安藤斋走入大楼内，他穿过那人来人往的走廊，一扇扇大门在他背后关上，人流逐渐稀疏，阳光也越来越少，很快只剩下头顶的LED灯还散着冰冷的光，整个走廊里只剩下他的脚步在回荡。他一直走到尽头，闪进了一扇不显眼的铁门里。铁门轻轻地合上，在日本警视厅的标志下，露出了“公安部防赤特别课”这几个大字。\n穿着制服的工作人员穿行在各个部门间，他们仿佛是从同一个模子里面刻出来的一样，看不出任何表情，只是机械地传递着各种各样的文书。还有一些人，他们与其他人交谈时气定神闲，转头走进审讯室里时，便能使里面传出撕心裂肺的惨叫声。这些人的笑眼使人沉沦，而后便能让其中散发出的寒气冻结人的骨髓。他们不仅行走在东京街头，也可能出入上海的某个高级酒店。他们虽面带笑容，却掩不住自己的狼牙。安藤斋加快了脚步。窃窃私语从安藤斋的耳边飞过：\n“下北沢区的学生们把征兵官的摊子砸了，还焚烧了征兵登记卡……”\n“横滨的码头工人在赤匪的煽动下拒绝为军事物资卸货……”\n“我们混入朝总联内部的特工已经与我们失联好几周了……”\n自从所谓的“日本反战革命同盟”建立后，这些消息已经让安藤斋见怪不怪了，但是这样几句话立刻刺进了他的神经里：\n“你知道吗，中情局特工前几日的暴力搜查给了赤匪蛊惑人心的机会，网络论坛上要求美国人滚蛋的赤化发言越来越多了。”\n“自从鲁索那个傻白帽带着他的那帮土匪进驻日本之后，那帮在中国吃了大亏的CIA又屁颠屁颠跑过来插手所谓反赤事务了！”\n“嘘！”其中一个声音猛得压低了几度音量，但是安藤斋仍然可以听到：“现在美国人那边对我们的事情非常不满，他们认为我们包揽了所有的反赤事务却并没能镇压住赤色活动。首相推辞了好几次，但是美国人们还是要我们听从他们的指挥，因为……”"
 prcs.3156.a: "“他们以为他们可以取代我们……”"
 prcs.3157.t: "访谈"
 prcs.3157.d: "“当我出去丢垃圾的时候，我只是闻到一股难闻的味道，以为这不过是正常气味，直到我打开垃圾桶才发现那居然是一具男尸，我无法想象这是怎么回事。”——当事人，33岁\n\n“哦，你说最近有什么异常？我不知道，我只知道最近这路灯一直不开，平时晚上都是开的，但是这段时间黑乎乎，搞得我晚上出去非常不方便，妈的，找人投诉结果拖到现在都没回应，不知道在干嘛。”——附近居民，男性，43岁\n\n“嗯？异常？这地方倒是没啥问题，只是我有一次深夜打烊收拾东西的时候，看到那个巷子有个大黑影闪过去，我当时有点害怕，最后在店里面等一会再走……你问我现在想起来害怕吗？我觉得出了昨晚这事可能晚上打烊时间得提前了。”——水果店店主，51岁\n\n“那个男孩子啊……他是这段时间来我们这里租房的，听他说是大学毕业了来东京闯荡给家里面补贴家用，所以来我这里租房，不过我看他每天早上七点这样就起床，晚上快十二点回来，我以为他只是干活很辛苦想多拿点钱，没想到他居然有赤化倾向，哎，好好的一个小伙子怎么就这么死了。”——房东阿姨，44岁。\n\n“如果要说什么异常的话，我记得有一次晚上喝酒回家，我走在路上一直听到附近井盖下面有什么奇怪的声音，我好奇凑上去看看怎么回事，结果只听到咚咚咚的声音，然后过了几秒之后就沉寂下来了，可能这只是个平常的下水道维修吧，我也不太记得了。”某公司职员，23岁。"
 prcs.3157.a: "“继续调查，个人认为此事和北岛一案有重大牵连，值得持续关注”——石神笔记。"
 prcs.3158.t: "砖头"
 prcs.3158.d: "漆黑的隧道内，墙壁上的水滴随着特定的旋律滴落在水道上，远处，两双皮鞋的声音踩踏着砖块缓步袭来，石神和加贺环顾四周，生怕错过任何一处细节，但令人懊恼的是，这处下水道除了滴水的墙壁和老鼠洞以外什么也没有，未免让人感到失望。\n\n石神伸了个懒腰，打了打哈欠，“该死，这下水道什么都没有，如果这地方凶手真的来过，那这人也太会销毁证据了！”\n\n加贺也打了个大哈欠，两人在这附近逛了一圈，其中，加贺走路的时候脚底下突然钻出来一个大老鼠，吓得加贺一屁股坐在第三，而走到一处水道，上面都是粪便和各种厨余垃圾，散发出来的恶臭味道使得两人不得不捂着口鼻走过去，别过脸害怕看到恶心的东西。\n\n“今天如果没收获就先回去吧，加贺。”石神说到，看得出来，他对此次调查感到十分煎熬。\n\n“行吧，明天再说。”加贺点头，于是，加贺向前抬脚，不过，或许是仍旧不甘心，他还是往四周看了看，突然，他看到了什么，然后兴奋的喊道；“石神，我们找到关键证据了！”\n\n没等石神反应过来，加贺走到一块砖头上，指着砖头说道；“你看看这个砖块，上面都是各种微小的小凹痕，而且还有深褐色的污渍，这绝对不是霉菌或者污垢，这绝对是血迹，很有可能，凶手在这地方对着死者开枪，只不过清理现场的时候忘了这个砖块。”\n\n石神大惊，盯着这块砖头发愣，或许事情没有看起来这么简单。"
 prcs.3158.a: "魔鬼藏在细节里。"
 prcs.3159.t: "寂静"
 prcs.3159.d: "“这确实是不得了的发现，我拍照先，记录下来作为证据。”石神说道，两人就这么对着那块砖头开始了研究，看得出来，这实在是一个令人十分兴奋的重要线索。\n\n“但是你说凶手会不会再次回到案发现场？毕竟百密一疏，万一被查出来什么呢？”石神忽然有一种不祥的预感，“嗯？那还不走快点？”加贺一听他这么说，未免感到害怕，于是，二人两步并作三步，快步走向出口，生怕真出什么意外。\n\n不过，幸运的是，下水道除了水滴滴答滴答的声音以外，只有死一般的寂静，昏黄的灯光照亮着前方前进的道路，两个侦探沉默不语，只是一直死盯着前方，阔步向前，生怕凶手看到他们。\n\n“咔塔——”\n\n一声清脆的声音传来，那既不是老鼠凿壁的声音，也不是水流冲刷的声音，而是一股清脆的……硬物碰撞声。而两人听此声音，缓缓的转头，像冻结一样站在原地。\n\n“砰！”\n\n仅仅在一瞬间，漆黑的污水沾满了深红色，而随后，下水道又一次恢复了死一般的寂静。"
 prcs.3159.a: "而漆黑枪口背后的主人，踏着皮鞋，正在缓步向着两位侦探走来。"
 prcs.3160.t: "狼穴"
 prcs.3160.d: "东京中心，这座都市的心脏。有一座被护城河紧紧环抱的城堡稳坐在于此。护城河和高耸的城墙组成了一道又一道的防线，使得天皇虽身居闹市，却如同与世隔绝一般，唯有这样才能保持皇室的威严。这便是皇居的作用。\n天皇稳坐在皇居中央，侍从则侍候在左右；皇居稳坐于东京中央，现代日本的议会乃至各种政府机构也侍候在皇居的左右。倘若我们放眼看去，在这么一众机构当中，警视厅本部的三角形大楼是如此显眼，它默默地趴在皇居樱田门的门口，扫视着那些街道上的穿行者。而在警视厅的一隅，有一个特别的办公楼，其名为日本公安部。这个名号与中国人民警察雷同的机构在这警视厅内显得有点累赘，但是这只是它的伪装，好欺骗人们，使人们忘记它过去的名字：特别高等警察部，也就是所谓“特高科”。\n生于明治年间，膨胀于大正与昭和，尽管在战败后被拔掉了几颗犬牙，但公安部依旧忠诚地守卫着皇居的入口。这么多年来，从北海道的矿坑深处到东京大阪的街头巷尾，从高丽共产党到东北抗联，从幸德秋水、小林多喜二再到赤军，他们一直忠诚地为皇室监视着其“臣民”，他们是天皇的忠犬，是大日本光芒下的阴暗恶鬼。天皇是慈爱的，日本是人道的，他们不会公然杀死不忠者，圣明的天皇手上怎么又能沾上血迹呢？人道的日本上怎么又能出现污点呢？所以，倘若出现不忠之人，公安部，或者说特高科便会将它们统统蒸发，让这一切污秽之事不与这些神圣的形象产生干害。这便是他们存在的意义。不忠者不灭，他们便会一直存在。\n无数的“危险分子”被他们放倒，无数的“赤匪”在他们无休止的骚扰下不堪其扰，无数的臣民在他们的巨眼下度日。他们的成员或许会对这些行径产生过怀疑，但是有一点被他们所有成员当做唯一的真理：天皇需要他们，日本国需要他们，他们是独一无二的，因为这些事情也只有他们可以干。"
 prcs.3160.a: "所以他们的地位是不可动摇的……吗？"
 prcs.3161.t: "第一步……"
 prcs.3161.d: "阳光自窗户走入会议室内，将几朵花儿的影子撒在桌上。王兆国刚准备推开会议室的门，但还是停下了手，稍稍地整理了一下着装，整了整衣领，放松了一下紧张的太阳穴和发酸的眼睛，然后便稳步地走了进去。\n刚走进去，不少熟悉和不熟悉的面孔便出现在他面前，但是最吸引他目光的还是那些年轻的面庞。那些年轻人的眼眶虽然说已经被黑色包裹，但是其眼珠中的活力却驱散了这一切。看到这，他也便大步走到自己的位置上，开始了自己的发言。\n“同志们好。今天来这里开会的，有人社部、住建保障部和劳动保障部的同志。福利问题，事关重大，经济、政治、人民幸福都与它息息相关。但是万里长征总要有第一个突破口，打开它，我们的工作就可以稳步推进。”他的声音苍老而有力，他一边说着，一边让秘书分发他已经批注过的报告书。“福利不只是发钱，从马克思主义经济学而言，降低群众劳动力再生产的成本，让群众可以少花钱多办事，更是福利。那么第一个突破口在哪，我想听听各位同志的意见，那么就请人社部的同志先发言吧。”说完，他便做出了一个请的手势。\n“感谢总理。”一个梳着短马尾的女同志缓缓地站了起来，扶了扶自己的眼镜：“劳动力的再生产，简而言之就是衣食住行，其实现在还有两个最要紧的就是医疗和教育。医疗，我们可以建立普惠医保制度；但教育目前而言，我们能做的便是为全国学校的孩子们提供更优质的营养餐。医保这方面，需要一步步来；就营养餐而言，食品安全问题便需要注意。”\n总理欣慰地点了点头，便请住建保障部的同志发言。“房价高，主要是土地财政，借债发展举债发展，加了很高的杠杆。虽然现在没法大改，但是逐渐去杠杆化是可行的，这样也可以降低劳动者的生活花费。当然，地方财政要是充盈的，不然这会让地方停摆。”\n最后便是劳动保障部的同志发言。那个年轻人从会议一开始便一直全神贯注地听着大家的发言，也没有窃窃私语。“劳动关系的稳定和维权也是成本，但更重要的是劳动环境。如果说劳动关系不稳定，那么工人就要花更多心思维权；劳动工作场所不安全，那么工伤率就居高不下。”说完，这个年轻人顿了一下，压低了一点声音，但大家都可以听见：“我们曾经试图加强执法，但是因为一些同志说什么经济发展优先嘛……”王兆国不语，点了点头。他作为总工会主席的时候，那些触目惊心的劳动条件报告曾让他彻夜难眠，而现在他终于有机会改变这一切了。\n听完大家的报告，王兆国的心里便敞亮了起来，这漫漫征途的第一个突破口将会是……"
 prcs.3161.a: "人民群众的身体健康是第一位的。"
 prcs.3161.b: "我们可以扩一扩社区绿色厨房，让老人和孩子们吃上更健康的饭菜。"
 prcs.3161.c: "房子是住的，而不是压在人身上的。"
 prcs.3161.e: "加强对劳动者的保护，减轻他们的烦恼。"
 PRC_tfr_nl_china_diyibu_a_tt: "我们将尝试建设全面普惠型医保，保证检查与处方药价格继续下压…\n如果我们已经完成了“清洗地方门阀”，会额外获得5点社会发展"
 PRC_tfr_nl_china_diyibu_b_tt: "我们将尝试补贴价格实惠的社区厨房，保证学生和老人的用餐价格…当然，这会打击民间餐馆的收入。"
 PRC_tfr_nl_china_diyibu_c_tt: "我们会尝试房地产市场去金融化并建造更多居住适用房。长远来看，这当然对经济和民生大有裨益，但是现在，我们要咽下苦果…"
 PRC_tfr_nl_china_diyibu_e_tt: "跟民间援劳组织共同参与关照工人，挥舞着现行的劳动法大棒砸向资本家有利于敲打同商业团体交往过密的党内反动派…"
 prcs.3162.t: "耕耘稼穑，纺织冶锻"
 prcs.3162.d: "会议室里除了翻动纸张的声音以外，听不到其他的任何声音。胡春华一边看着那些正在翻阅材料的党员干部，一边用他那一贯沉稳的语调说着：\n\n“如何去组织劳动，这个问题我们不能去轻易地下定论，这方面的探索往往要交给群众，尤其是一线的劳动群众。而现在我们就已经有很大的收获了。”\n\n“现在地方上出现了三种非常典型的改革方案，第一种，简单点说是把现有的国企制度扩大，让每个企业员工都能有一个铁饭碗，都可以被终身雇佣。而干部、技术人员的职权方面不需要做太大的变更，只需要扩大员工的监察权，让员工监督他们不搞腐败即可……”\n\n“而另一种，则是将过去曾经行之有效的鞍钢宪法进行现代化调整，技术人员、一线劳动者结合一气，民主决策，而干部经理这些，按他们的说法，搞劳动上的君主立宪。”\n\n“最后一种，更加激进，在政企分开的基础上，他们希望工人和技术人员可以享有极大的民主决策权和自治权力，并且经理这些，由工人们选举产生。”\n“那么，同志们来谈谈自己的意见吧。”\n\n话音刚落，激烈的讨论声便如浪潮般涌起，但又如浪潮一般逐渐地退去，在一段令人尴尬的沉默后，一个声音响起来了……"
 prcs.3162.a: "“总书记，全面铺开国企模式就已经是一个很大的进步了。”"
 prcs.3162.b: "“鞍钢宪法在如今仍旧有参考和借鉴的价值，我们会以它为蓝本改革”"
 prcs.3162.c: "“在计划经济框架进行更加彻底的工人自治与企业社会化难道不是更好的方式吗”"
 prcs.3163.t: "重回太平洋"
 prcs.3163.d: "在一份于白宫发布的联合声明中，美利坚合众国今日正式宣布，应日本、澳大利亚等友国强烈请求，将接任太平洋防卫条约的领袖职位。此举被全球观察家视为一个时代的转折点，标志着在经历了残酷的内战与数年的战略收缩后，美国正以强硬的姿态，重返世界权力棋局的中心。\n\n该声明强调，美国的领导将为联盟注入无与伦比的决心与力量，以应对亚太地区日益严峻的挑战。自中国在台海战争中获胜以来，由日本主导的太约一直在勉力遏制其扩张。如今，美利坚的回归，无疑为这个民主国家联盟打下了一剂强心针。\n\n美国的工业与军事机器已重新轰鸣。此事件正式宣告了西太平洋地缘政治格局的彻底改变，一个以华盛顿为核心，囊括东亚至大洋洲的庞大军事同盟已然成型，与中国主导的世界解放国际隔海对峙。一场新的、更为激烈的超级大国博弈，已拉开序幕。"
 prcs.3163.a: "美利坚展示了他们的决心！"
 prcs.3164.t: "起草新民权法案"
 prcs.3164.d: "在今日，美国国会方面高票通过了由美利坚新总统鲁索主持起草的《新民权法案》，这一崭新的法案包含广泛，被鲁索称为“保卫美国梦最重要的一步”。\n这一民权法案旨在提出一种新的劳资关系框架，包括允许“美利坚式工会”参与到美国的企业治理，在政府的监督下，由“真正美国人组成的工会”将会和“美国的企业家们”展开谈判，展开合作协商。而政府则会在保护工人权利的同时，保证“工人争取自身权益的斗争不堕落为共产主义暴徒摧毁美国梦的工具”。\n另一方面，鲁索在这篇民权法案当中承诺保护小农场主的权益，通过提供农业种植补贴和提高粮食收购价格等方式来保护农场主“免受全球主义的侵害，从而走向破产”。其中还涉及到更多方面，比如说对中西部的“未驯边疆”进行大力的开发，修复当地的基础设施，并且将“勤劳肯干的美国人”迁往中西部。\n这项法案一经签发，立刻引起了全美上下的欢呼，许多民众自发地举行游行，庆祝这部法律的诞生。许多人对这一法案的前景充满了信心，认为这部法律将会成为美国复兴走出阴影的关键。\n鲁索在国会演讲中表示：“我们需要一个健康的民族，一个和谐的社会。上帝塑造了美利坚社会，我们每个人出生的时候都被上帝安排好了我们注定的位置。而我们将会不遗余力地保护所有人的地位不被挑战，使得每个人都能各得其所，各安生事，不有过多的妄想和无谓的贪婪。而只有这样才能保卫好上帝赐予我们的国土。而这部法律便是为此而生。”"
 prcs.3164.a: "新的法案，新的美国梦。"
 prcs.3165.t: "幽灵"
 prcs.3165.d: "在内华达沙漠深处破晓的微光中，一架神秘的、通体无尾翼的飞行器悄然升空，完成了其首次试飞。五角大楼随后证实，这正是“朱庇特计划”的最终成果——F-47“幽灵”战斗机。此次首飞标志着美利坚合众国正式踏入了第六代空中作战系统的门槛，也为全球军备竞赛拉开了一个惊心动魄的新篇章。\n\nF-47的出现，被外界普遍视为华盛顿对北京的直接回应。此前，中国已先后以半公开的方式展现其两款不同设计的第六代战斗机原型机，一度让外界认为美国在未来空中优势的竞争中陷入了被动。今天的首飞，不仅是对这种疑虑的有力回击，更是向世界、特别是己方盟友展示其技术实力和战争决心的明确信号。\n\n军事分析家指出，F-47的意义不在于其本身的技术参数，而在于它打破了中国在该领域的短暂垄断。这迫使全球军事战略的计算公式必须被重写。它的存在将极大地提振太约阵营的士气，但也几乎肯定会刺激北京加速其自身项目的部署与列装。"
 prcs.3165.a: "东亚那名为战争的阴云又浓一分。"
 prcs.3166.t: "最终圣战"
 prcs.3166.d: "在对国会联席会议发表的历史性演说中，美利坚合众国总统鲁索今日向以中国为首的全球共产主义力量，发出了毫不含糊的战争宣言。他将这场即将到来的冲突定义为一场不可避免的最终圣战，并号召整个自由世界为其投入一切。随着鲁索发表这片浩然长文，美国国会被要求将美利坚合众国转入全面战争状态这篇演说被视为亚太战争正式爆发的标志。\n\n“历史已将我们带到了最后的十字路口，”鲁索的声音在国会大厅回响，通过电视直播传遍全球，“一边是建立在奴役与谎言之上的红色帝国，另一边，是上帝庇佑下的人类自由。我们没有与他们妥协的余地，这片湛蓝的海洋不会允许暴政向东的肆意扩张…今天，我以美利坚合众国总统的名义宣布，在我们与我们的盟友的领导下，我们将发动一场最终的圣战，彻底清除威胁美利坚合众国的文明与价值观的赤色匪帮！”\n\n演说结束后，整个太约被瞬间激活。从东京到堪培拉，从首尔到新德里，各国政府纷纷宣布进入战争状态。工厂流水线在几小时内转向军品生产，征兵法案被启动，庞大的战争机器以前所未有的效率开始轰鸣运转。这不是一场争夺领土或资源的传统战争，而是一场旨在彻底消灭对方意识形态的、不死不休的全球冲突。"
 prcs.3166.a: "唯有浴血才是驱动历史滚滚向前的车轮！"
 prcs.3167.t: "神圣的战争"
 prcs.3167.d: "在拂晓的寂静被撕裂之际，中国向整个西太平洋发动了一场横贯东亚的、精心策划的全面进攻。驻日美军基地、韩国前沿阵地乃至印度边境的防御设施在同一时刻遭到了饱和式打击。战争以一种毫无征兆的方式，降临在了所有人的头上。\n\n数小时后，在紧急发表的全国电视讲话中，美利坚合众国总统鲁索以沉痛而坚定的语气，向全世界宣告了红马骑士的到来。\n\n“今天，自由世界本身，正遭受一场蓄意且致命的攻击。”他的声音透过电波传遍全球，“一个寻求奴役其邻邦、扑灭人类民主精神的赤色匪帮，已将其战火强加于我们。他们选择了战争。那么，他们就将得到战争。”\n\n“这不仅是为领土或利益而战，这是一场神圣的战争——是捍卫我们信仰、文明与生存方式的战争。前路无疑将充满艰险，但我对美利坚人民的决心与勇气毫不怀疑。我们将战斗到底，直至暴政的阴影被彻底驱散，上帝的土地上将重现光明。”\n\n此番讲话正式宣告了太平洋防卫条约进入全面战争状态。从华盛顿到东京，防御协议被即刻触发，庞大的军事力量开始向亚太地区集结。一场决定人类未来命运的、血腥而神圣的战争，已经点燃了这片孤高的大洋，没有妥协的余地，只有一方流血至干。"
 prcs.3167.a: "战争的号角已经吹响，无人能够幸免！"
 prcs.3168.t: "中国之声"
 prcs.3168.d: "近日，韩国媒体《朝鲜日报》在新闻访谈中大量指出中国正对朝鲜进行着潜移默化的意识形态文化渗透。\n朝鲜，这个一直以来在文化领域有着独特发展轨迹的国家，如今正面临着来自中国的意识形态文化影响。韩国电视台的相关报道中提到，中国通过各种途径将自身的意识形态元素巧妙地传递至朝鲜。从一些具有中国特色的文艺作品在朝鲜的流传，到蕴含中国意识形态文化内涵的活动在朝鲜境内的悄然开展，种种迹象都表明中国正有计划地推进着这一文化渗透战略。\n传播对象是朝鲜国内的普通百姓、青年阶层、地方干部、有海外经验的人员、边境地区百姓等。在中国的朝鲜留学生、贸易干部、工人、实习生、外交官家属等各界各层是重点传播对象。尽可能让更多的朝鲜百姓受中国文化的熏染。\n据传，中国建立了向朝鲜传播各种文化内容的战略。计划向朝鲜持续传播中国建国史纪录片、抗战电影、现代电视剧等强调“社会主义文明”的影视资料。\n韩国方面分析认为，中国的这一举措意图深远。这种文化渗透旨在从思想层面入手，对朝鲜民众产生潜移默化的影响，进而可能在更广泛的领域，如政治、经济等方面产生连锁反应。中国文化的强大吸引力以及其背后所承载的社会主义价值观，正如同涓涓细流般，缓缓渗入朝鲜社会的各个角落。\n韩国媒体还强调，这一现象需要引起高度警惕。朝鲜的文化生态正在经历着微妙的变化，而中国文化的渗透无疑是一个关键因素。韩国将密切关注这一局势的发展，担忧这种文化影响力的扩张可能会对整个东北亚地区的地缘政治和文化格局产生不可预估的影响。韩国相关专家表示，应深入探究中国这一意识形态战略背后的深层次动机，以及其可能带来的长远后果，以便更好地应对这一复杂的地区文化动态。\n消息人士指出：“中国方面是有计划的在朝鲜民间建立运输文化内容的特别渠道，目的很有可能是为了影响朝鲜的意识形态文化环境。”\n韩国电视台的这一报道将中国对朝鲜的意识形态文化渗透现象置于聚光灯下，引发了韩国国内对于地区文化影响力竞争以及地缘政治变化的广泛讨论和关注。"
 prcs.3168.a: "（播音内容）权力属于被压迫的劳动者们！"

 prcs.3169.t: "夜间观星"
 prcs.3169.d: "夜色渐浓，某个不知名的小山丘上，一辆越野车静静停在草地边缘。车旁，两个天文爱好者正在熟练地组装着他们的望远镜设备。\n\"传动齿轮要对准刻度线，\"老张一边调试着赤道仪，一边对身旁的新人小李说道，\"今晚的大气透明度不错，应该能看到不少深空天体。\"\n小李拧紧了三脚架的螺丝，抬头看了看满天繁星：\"听海南那边的群友说最近文昌基地的航天发射频率挺高的啊。我查了一下公开资料，这个月已经有好几次发射了。\"\n\"是啊，\"老张将主镜筒小心地安装到赤道仪上，\"不过奇怪的是，发射清单上都是些通信卫星、气象监测设备什么的，感觉都挺常规的。按理说这种载荷用不着这么密集地发射。\"\n小李若有所思地点点头：\"确实，而且发射时间也不太规律。有几次都是深夜发射，按说商业卫星一般不会选择这种时间窗口。\"\n\"可能是为了抢轨道吧，\"老张调整着望远镜，\"自从小日本拿到GPS和星链之后就疯狂往天上射各种东西，也不管有没有用，反正先抢了轨道资源再说。我们可不能任凭他们占领太空。\"\n“听说我们正在整太空武器啊，”小李压低了声音——尽管他知道不可能有人在听——对老张说，“你说这些载荷是不是……”\n“我劝你别听风就是雨的。”老张耸耸肩，“按抖音上那些讲武堂说的我们都打到三体星去了。”\n小李笑笑，但笑容很快凝固在了脸上：“这是什么？”他手指着天空，那里有个黯淡的光点一闪而过，若不是他作为观星者的直觉，恐怕就错过了。\n老张困惑的抬起头，看着小李指着的那个地方：\n“什么都没有啊。”\n小李也开始怀疑自己的眼睛：“我明明看到有光点闪过啊……”\n他调转望远镜方向，对准了那片区域，可他通过目镜仔细观察时，视野中却是一片漆黑的太空，仿佛刚才那个光点从未存在过一样。\n“你说光点吗？“老张作为资深观星者，在心里已经有了答案，”不是卫星的太阳能板反光，就是些小流星咯，反正没啥好看的。\n“说的也是。“小李很快忘了这事，投入到今晚的观测中。"
 prcs.3169.a: "不过，老张这次错了。"

 prcs.3170.t: "经天纬地"
 prcs.3170.d: "祖国广阔的土地上，出现了几个红色光点。这些光点一开始孤零零的，彼此间相隔甚远，宛若孤星一般闪烁。但，就像夜空逐渐地揭开自己的面纱一样，更多的红色光点逐渐显现出来，有的大而显眼，有的小而暗淡，这些光点如红色的珍珠一样，撒在玉盘上。而后，自那几个最大最亮的红色光点上，发散出来无数条线，牵起了那些小光点，一针一线地绣出了一张巨大的网。\n“喜欢我们为全国人编的这张打鱼网吗？”陈主任拍了拍虞清的肩膀，继续说道：“都说风浪越大鱼越贵，我们现在有了这样一张大渔网，何愁抓不到大鱼?”虞清点了点头，指着那巨大的电子显示屏说道：“我们现在已经在全国最重要的那些工业区都修建起了NEMS的数据节点。虽然说现在没能像调控电网那样精准，但是我们的生产者们已经知道了什么地方有物资富余，什么地方有物资空缺，而我们的NEMS也将协助我们进行物资的调动……”虞清深深地吸了一口气，向着NEMS敬了一个礼，然后回过头来对陈主任说：“以前想要进行规划建设也仅仅只是拿着一些数据摸黑，现在简直就像是玩模拟经营游戏一样。”\n“说得不错，但是这背后的消耗也是巨大的。看吧，小虞。”一边说着，陈主任的手指一边从显示屏上划过，从满天星斗的祖国东部，一直划到了孤星闪耀的祖国西部。与祖国的东部形成鲜明对比的，是祖国西部那几条少得可怜的链接线与孤独的数据节点。“它才刚刚起步，目前也只能帮我们帮到这里了。”电子显示屏的光撒了下来，包裹着陈主任的身子。而在他背后，又有几个红点显现了出来。"
 prcs.3170.a: "这张网，我们必须要织下去。"

 prcs.3171.t: "40年（一）"
 prcs.3171.d: "在中南海的一间会议室里，主席胡春华和各位党政高级干部已经坐在位置上等候主要人员参与，随着参会人员的悉数抵达，小小的会议室慢慢的热闹了起来。现在这些人或许还不知道，他们接下来的发言，将会为之后的未来打下基础。\n\n“好，各位都到齐了，我们先来做在上一个阶段的工作总结吧。”随着主席的这句发言，各部门的负责人依次开始汇报着他们所取得的成就。\n\n“目前来看，各部门明白工作的紧迫性和重要性，在解放台湾后迅速进行军事管制，快速打击地方黑恶势力，恢复经济，台湾的货物吞吐量，发电量以及人口流通数均到达了回归以来的历史新高峰。同时本土建设也没有停下来，物联网，全国经济结构调整，以及基层治理均取得了很大方面的成果啊。”\n\n在听完他们的发言之后，胡春华推了推眼镜，露出了满意的笑容，进而才将此次会议的重点提了出来，“同志们，我们现在正处于一个世界百年未有之大变局中。眼下，随着国际局势风起云涌，国内各方面建设均到达了新的高度，历史发展有其规律，但人在其中不是完全消极被动的。只要把握住历史发展大势，抓住历史变革时机，奋发有为，锐意进取，社会就能更好前进。”\n\n在听到主席这么说后，仍有不少同志懵懂，想要从话里揣测出意思来，但当他们看到刚发下来的文件时，还是引起了一阵讨论的声音——《关于改革开放以来党的若干历史问题的决议》。\n\n“主席，你这是……”他们大部分人显然被这个爆炸般的标题冲破了脑袋，思考不出来任何问题，但胡春华依然保持着镇定，继续主导着会议的进行。\n\n“同志们，我想，在我们党今后的历史上，改革开放将会是一段深刻的历史。眼下，我们对工作的热情是积极的，却没有系统性的对改开事业进行批判性反思与学习。任何事务都有两面性，我在此抛砖引玉，希望各位代表们多积极发言，将我们这场会议的基调敲定下来，我们呢，也好进行下一阶段的工作”\n\n听完主席的发言之后，不少人开始与相邻的干部代表们交谈着，交换着彼此的意见。时间一点点的过去了，在讨论声逐渐减小后，众人的意见似乎明了，他们站起身来，对主席汇报说："
 PRC_new_left_Conservative: "§R党§!将在此刻偏向§g保守§!。"
 PRC_new_left_Centrist: "§R党§!将在此刻偏向§Y建制§!。"
 PRC_new_left_Extreme: "§R党§!将在此刻偏向§t改革§!。"
 PRC_new_left_Oppose: "§R党§!将在此刻偏向§d左翼§!。"
 prcs.3171.a: "“改革开放是我国在独立探索之中的必要举措。”"
 prcs.3171.a.tt: "§g保守派§!会高兴，但是你呢？"
 prcs.3171.b: "“改革开放是我国在社会主义探索过程中的一次创新，应当勇于发扬。”"
 prcs.3171.b.tt: "§Y不要把话说死§!永远是一种智慧。"
 prcs.3171.c: "“改革开放曾经铸就了我国的成功，但是已不适用于现在的情况。”"
 prcs.3171.c.tt: "§t釜底抽薪§!的好办法。"
 prcs.3171.F: "“改革开放动摇了党的执政基础，我们应当予以修正。”"
 prcs.3171.d.tt: "§g保守派§!不会喜欢的，但或许这更符合§R当前国情§!。"
 PRC_40yrs_tt: "§R大会闭幕§!"

 prcs.3172.t: "40年（二）"
 prcs.3172.d: "“在几届同志们的努力下，我们中国总算是实现了两岸实际上的统一。当下，虽然两岸在经济模式和行政体制上初步对接完毕，但在接下来的文化交流和逐步取消戒备等行动上仍然有着一定距离。”听着总书记如此讲着，在座的各位纷纷推了推眼睛，思考着这一系列问题的解决办法。\n\n“总书记，我有一个疑惑。”一位代表举起手来，阐述着自己的看法，“在两岸交流中，我发现有一部分现象表明大多数人仍然是受到曲解《九二共识》的影响，在他们的想法中，台湾与大陆虽然实现了物理上的统一，但台湾方面应该保留部分先前的选举制度和管理体系，等到台湾同胞们逐渐理解了社会主义理念和新的社会习惯后再逐步撤销。”\n\n台湾问题导致最终不得不提出《九二共识》这样折中方案的举措，而眼下，若继续保持《九二共识》，恐怕会被一些别有用心的人稍加利用，导致之后台湾方面的工作不好展开。而若直接废除《九二共识》，这不又是否决了先前所做的一切努力吗？\n\n“王代表，你提的这个问题观点很犀利，台湾问题确实也是改开之后党所遗留的重大疑难题，尤其是在新世纪后我们在各个方面没有，也无法做好与台湾方面的联系，我想……”"
 prcs.3172.a: "台湾驻军需要暂时延长驻扎时间，依靠军事管制消除曲解的意思。"
 prcs.3172.b: "那就让民革作为我们的代表，跟他们谈谈台湾的新民主主义建设。"
 prcs.3172.c: "《九二共识》是先前的临时举措，台湾应当作为一个普通的省制单位。"
 prcs.3172.F: "争取统合台湾左翼统派，建立基层管理体系，暂且维持台湾自治地位。"

 prcs.3173.t: "40年（三）"
 prcs.3173.d: "随着会议的一点点进行，不少人的额头都渗出细汗，他们知道，这是一次走钢丝——一边是对党的过去的总结，而另一边则是对党的未来的规划，倘若稍加不慎，作为承接过去和喜迎未来的他们，就会把这一切搞砸，又不知要花多少个年月才能挽救损失。\n\n渐渐的，他们在做选择时又是考虑这考虑那，到最后变成了维持现状居多，不少人心里都是煎熬，他们想带领大众迈入美好生活，但是另一方面，他们又应该如何为当今的基础做好评价，每个人都显得忧心忡忡，或许从一开始，他们就没有做好准备。\n\n“我看，各位同志已经快扛不住了。”胡春华将手里还在审核的文件放了下来，“那我们要不要暂缓一下脚步，出去走走。”\n\n“不了，主席，我们还是尽快完成这些事情的判断吧，哈…….”话还没说完，一位高级干部就打起了哈欠。他们已经在这里忙碌了一天一夜了，也才解释了一部分问题。\n\n接下来的商讨自然是要稍稍加快些许速度，但是整体也不能缺乏严谨，在一些方面上，要不要给其余的派系稍稍划开一个口子。"
 prcs.3173.a: "只保留改革开放的必要性，而对资本主义复辟的情况进行批判与辩证看待。"
 prcs.3173.b: "措施对了，人选不对。重点反思邓小平时期而搁置对其他领导人的批评。"
 prcs.3173.c: "作为一项过渡性的措施，改革开放已经无法应对新时代的危机，但并非党和前几任领导班子的过失。"
 prcs.3173.F: "目前我国仍需要改开精神，仍需要通过改革和自我民主解决问题。"

 prcs.3174.t: "40年（四）"
 prcs.3174.d: "《关于改革开放以来党的若干历史问题的决议》是中国共产党历史上具有深远意义和重大影响的重要文件。\n\n在中央政治局、书记处领导下，由胡春华主持进行的。经长时间讨论和修改，集中全党智慧形成。中国共产党第二十届六中全会通过。\n\n《决议》对步入新世纪以来党的重大历史问题特别是“改革开放”，台湾问题，过往领导人的功过与理论指导意义作了总结和评价。辩证看待了十一届三中全会以来“”逐步确立的适合中国国情的建设社会主义现代化强国”的道路，进一步指明中国社会主义事业和党的工作继续前进的方向。\n\n与此同时，《决议》还指出，在改革开放初期至今我国所取得的一切成就都归功于全体劳动人民，劳动人民一词正式被记载进党史，与党的领导一并构成了改革开放伟大胜利的基础。\n\n这次全会一致通过的《关于改革开放以来党的若干历史问题的决议》，必将起到同样的历史作用。全会号召，在马克思列宁主义、毛泽东思想的伟大旗帜下，全党、全军、全国各族人民紧密团结在党中央周围，继续发扬愚公移山的精神，同心同德，排除万难，为把我们的国家逐步建设成为现代化的、高度民主的、高度文明的社会主义强国而努力奋斗!"
 prcs.3174.a: "§A我们的目的一定要达到！§!\n§R我们的目的一定能达到！§!"

 prcs.3175.t: "绳之以法"
 prcs.3175.d: "“美国内战算什么，感觉不如蜘蛛互爱kd多……”李不群在知乎上敲出这几个字，点击发送，屏幕前的他满脸不屑，仿佛发生在大洋彼岸的血腥战乱只是一场游戏。作为一个资深的神神，李不群已经习惯了用最刻薄的语言来贬低自己的祖国，同时将美国奉为心中的圣地。在他的世界观里，美国代表着自由、民主和文明，而中国则是专制、愚昧和落后的象征。\n\n然而，当美国内战，当昔日的“灯塔”陷入分裂和动荡时，李不群的精神支柱开始摇摇欲坠。他拼命地在网上为美国辩护，声称这只是“民主的阵痛”，但迎来的却是铺天盖地的嘲讽。\n\n“你的美爹怎么打起来了？”\n“还舔呢？人家都自相残杀了。”\n“这么喜欢美国，赶紧润美啊！”\n\n更让他难以接受的是，就在美国内战愈演愈烈的同时，中国开始了对台湾的登陆作战。李不群在各种小群里阴阳怪气地嘲讽着：“某军这下要露馅了，遇到真正的民主军队就知道什么叫战斗力了。”但可惜世界是物质的。当解放军的登陆部队如潮水般涌上台湾滩头，当太约联军的防线如纸糊般被撕裂，当台北在短短48小时内就插上了五星红旗时，李不群的又一个幻想破灭了。各种嘲讽滚滚而来，让他气得浑身发抖却又无可奈何。\n\n当然他可不会坐以待毙。电报上的信工数据库让他有了“反击”的手段。大部分人在看到自己的身份信息和恶意P图的大头照出现在私信的时候就会吓得销号跑路，而那些死硬的加上“呼死他”也能搞定个七七八八。看到自己动动手指就能把曾经和他作对的小粉红吓得屁滚尿流，李不群不得不承认自己很享受这种生杀予夺大权在握的状态。当然他也尝试拿这些玩意换点钱——有很多恶俗人想要开盒却没手段，这正是他出现的时候。\n\n当他点开一个和他吵起来的头像时，敲门声响了起来。他先是一愣，然后想起了自己半个小时前点的肯德基，于是对门外大声喊道：“放外面就行。”\n\n可敲门声还没停止，给李不群焦躁的内心平添了一把火气。他大力拉开门，朝门外怒吼道：“你他妈是不是……”后半句话戛然而止——映入眼帘的不是属于骑手的黄色制服，而是警察的淡蓝色。"
 prcs.3175.a: "你涉嫌侵犯公民个人信息罪，请和我们走一趟。"

 prcs.3176.t: "落地生根"
 prcs.3176.d: "夜色沉沉，中南海的灯光稀疏。湖面平静无波，偶尔一阵风掠过，撩起几片落叶，打着旋儿坠入水中。那一瞬间，连空气都像是凝结在历史的褶皱里了，变得有点干燥，有点沉默。\n\n起居室里，灯光柔和，桌上的两杯茶早已凉透。习近平总书记静静坐着，面前摆着一份厚重的公文包，皮革边角被岁月磨得微微泛白。他的神情比往常少了几分威严，多了几分沉思与释然。\n\n胡春华推门而入，脚步极轻。屋中只听得钟表的秒针一下一下敲打着夜色。他停下，微微鞠躬：“总书记。”\n\n习近平抬起头，目光停在他身上，沉默良久，才缓缓道：“坐吧，胡春华同志。”\n\n两人对坐。那一刻，仿佛时间也放慢了脚步。\n\n“这些年啊……” 习近平的声音低沉，带着疲惫的沙哑，“路不容易走。有人想快一点，有人想稳一点。可无论怎么走，方向走错了的话，往哪使劲都是帮倒忙，这就是南辕北辙的道理吧，春华同志。”\n\n胡春华静静听着，未言一语。灯光照在他脸上，明暗之间，有一种说不清道不明的意味。\n\n“我知道你比谁都清楚，” 习近平缓缓抬眼，语气忽然变得深重，“这个位子，坐上去不是为了自己。有人会赞美你，有人会恨你，但你记住，他们骂的、爱的，都是这片地——是我们的中国，而不是我们，我们共产党。我们共产党只是被人民选择与认可来发展与繁荣这片他们的出生之土，如果我们忘记了，人民就有权利抛弃我们。”\n\n他顿了顿，似乎要把某些话咽下去，却终究没忍住。声音微微发颤，却前所未有的释然与柔和：“春华同志，我年岁已大了，也许看不到将来你要面对的风浪。可我请求你——不论将来风往哪边吹，都要护着这片土地。要记得，十四亿人民承得起千万人流血，却经不起一次心寒，不要让这个伟大的国家的人民失望。”\n\n胡春华的喉头轻轻动了动，手指在膝上收紧。他抬起头，眼神里闪过某种近乎庄严的坚定：“我明白。总书记放心，我们一定不忘初心，为了实现伟大的理想而奋斗终生。”\n\n屋内静默。习近平缓缓伸出手，掌心布满厚茧，仿佛还留着无数握过方向盘、化学品、钢笔的痕迹。他将那只手放在胡春华肩上，轻轻拍了拍。\n\n“照顾好中国。”\n\n这一句，轻得几乎听不见，却重过千钧。\n\n窗外传来一阵风，杜鹃花枝轻轻摇曳，影子映在窗上，像是两代人的背影相互重叠。湖面泛起涟漪，又渐渐平息，在寂静的夜里，一位老人将一个国家的命运，郑重托付给了下一个黎明。"
 prcs.3176.a: "远处传来了悠长的鸡鸣，天际微微泛起了橙光……"

 prcs.3177.t: "“饭团”"
 prcs.3177.d: "钟表上的时针指向正下方时，城里最高的广播塔里飘出了悠扬的《南泥湾》歌声，随着歌声一起涌出的还有下班的人潮。\n杨卓捧着几包方便面，正寻思着要不要把肉肠换成一根淀粉肠的时候，他突然感觉自己肩膀被人拍了一下。他一转头，发现是他们车间的技工老王。“小杨，怎么不去食堂呀？我看了你好几天了，每天晚上都吃泡面啊。”\n他苦笑道：“我是生手，新来的，工作做的慢，去食堂的时候也晚了。家里也急用钱……前几天也还是靠了您才搞清楚那个打工公寓是怎么个租法……”说着，杨卓看见王师傅手里提着全是新鲜的蔬菜和肉，几瓶牛栏山异常抓眼。\n“哎，这不正好，小杨你要不跟我一起来，我们几个自己去弄点小酒小菜。我家也不远。”王师傅眉毛一挑，还没等杨卓反应过来就把他的账结了，收好了发票。杨卓也便只能跟着王师傅一块走了。\n“兄弟们看好了，这是发票了，菜都在这，大家都来点一点。我可没缺斤短两，没贪污大家的钱啊。”王师傅一进家门，把菜和发票往饭桌上一搁，对着大家吆喝道。\n“嗨，王师傅，你办事，咱们放心……”几个工友说着，便注意到了杨卓：“哎呀，这不是车间新来的小杨吗？稀客啊！”杨卓不好意思地挠了挠后脑勺。\n饭菜很快就端了上来，几道家常菜让人食指大动，杨卓的嘴里翻动着唾液，他却不好意思对着盘子动筷子。大家见此场景，积极地向他碗里面送着饭菜。杨卓拼命地说着谢谢，其他的工友只是摆摆手让他不必多礼。杨卓自告奋勇地要去洗碗，大家拗不过他，于是只能答应了他的要求。\n“咱们平常就是这样，几个工友经常聚一起吃饭，一起出钱一起管账。有钱出钱，有力出力，有事就相互帮衬一下。”王师傅一边收着桌子，一边对正在洗碗的杨卓说着，“你想加入我们这个吃饭的‘饭团’吗？”\n“但，我和你们也不大认识，为什么突然要我加入呢？”杨卓小心翼翼地问着。\n王师傅笑了笑，对杨卓说："
 prcs.3177.a: "“一个屋檐下，到哪里都是一大家。”"

 prcs.3178.t: "被人民做局了……（一）"
 prcs.3178.d: "“周扒皮还没签吗？”陈明远看着面色沮丧的小李说到。\n“没有啊，那个扒皮又在推三阻四，说什么都不签……”小李可算找到倾诉口了，哇啦哇啦的就把这几天的苦水倒了出来，陈明远倒也见怪不怪——他自己也没少受这个人的气。\n周扒皮姓周，是当地“鼎鼎有名“的欠薪大户，曾经被他厂里的工人联合闹去劳动仲裁来声讨工资，但是他无比嚣张的放话道：“老子就是把这些钱和你们打一辈子官司都不会给的！”他也说到做到，砸了好多钱去请律师硬拖时间，最后虽然还是败诉，但是许多工人都拖不起这个时间和精力而纷纷撤诉了。这项“光辉”履历让他赢得了周扒皮的“美名”,在当地劳动人民中口口相传。\n想到这里，陈明远叹了口气，对办公室里一干人说到：“不管怎么样，这块硬骨头我们还是得啃下去，不然我们怎么推进公私合营呢？走，我们再去他那里做做工作，争取让他同意！”办公室里面的人都纷纷站起来，和陈明远走了出去。\n当他们来到周扒皮的纺织厂门口时，远远就听到里面传来阵阵吵闹声。推开厂门一看，只见周扒皮正被一群工人围着，个个脸色通红，手舞足蹈，大有动手之势。\n“周老板，我们的工资呢？三个月了！”\n“前几周说好要发，现在怎么又变卦了？”\n“老子今天不拿到钱就不走了！”\n面对来势汹汹，近来法院审理结果都判工人无罪的劳动者，周扒皮哪里还有之前的嚣张劲儿，整个人缩在办公桌后面，脸色煞白如纸，双腿直打哆嗦。他平时倒是能呲牙咧嘴，可面对这群红了眼想打一架的工人，又想了想他倒了没多久的保护伞，立马就成了霜打的茄子。\n“各位，各位！”周扒皮的声音都变了调，“我这不是没钱吗？你们也知道现在生意不好做……”\n“放屁！”一个老工人指着他的鼻子骂道，“你昨天还开着新车来厂里，现在跟我们哭穷？”\n“就是！你家那栋别墅刚装修完，花了多少钱？”\n周扒皮被说得哑口无言，额头上的汗珠子滴答滴答往下掉。看着这副模样，陈明远心里暗自好笑，这个平时牛气冲天的周扒皮，现在倒像只被老鹰盯上的小鸡。不过现在事情快速激化，真要闹出人命反倒打击民间的情绪。\n于是他走进办公室，开口说道："
 prcs.3178.a: "“同志们！大家先冷静一下，我们一起来处理这个问题。”"

 prcs.3179.t: "被人民做局了……（二）"
 prcs.3179.d: "工人们看到政府的人来了，稍微平静了一些，但依然义愤填膺。\n“冷静有什么鸟用！上次我们和他打官司的时候他是怎么办的？”\n“对！他就是仗着有钱有势，欺负我们老百姓！”\n陈明远点点头，然后看向周扒皮：“周老板，现在情况你也看到了。工人们的要求很简单，就是要回自己应得的工资。这很过分吗？”\n周扒皮咽了咽口水，支支吾吾地说：“这个……这个……我确实有困难啊……”\n“困难？”一个工人冷笑道，“那你把你的奔驰卖了给我们发工资啊！”此话一出，引起一片赞同之声，而周扒皮的脸色变得更加难看了。\n陈明远趁热打铁：“周老板，你看，现在国家推行公私合营政策，就是要解决这种劳资矛盾。如果你愿意配合，不但工人的工资问题能解决，你自己也能在新的体制下找到合适的位置。但如果你继续这样拖下去……”\n周扒皮当然不乐意，但是面对愤怒的工人他也只能拖下去：“我……我……”他的声音颤抖着，“我需要考虑一下……”\n“考虑个屁！”一个工人拍桌子道，“都考虑三个月了！今天必须给个准信！”\n陈明-远见局势有利，继续施压道：“周先生啊，您这样我们都很难办啊。要不这样，我把公检法、市监的同事都叫过来，让您和他们好好交流一下自己的难处？”\n周扒皮彻底慌了，面对两边的强大压力，他的腿开始不自觉地颤抖，一股温热的液体沿着裤腿流了下来……\n“我签！我签！”周扒皮终于崩溃了，“公私合营我同意了！工资我也发！”\n说完，他颤抖着手拿起笔，在合营协议上签下了自己的名字。\n陈明远满意地点了点头，心里想：这个周扒皮，之前这么为难自己和工作组，现在对上劳动人民就成了这副德性。\n工人们看到周扒皮终于签字了，纷纷拍手叫好。而周扒皮则瘫坐在椅子上，面如死灰，知道自己的“好日子”到头了。而若是有人凑近周扒皮，还能听到他的咕哝声：“哎卧槽劳动法怎么这么坏啊，这样打压我们企业，我们可是会失去生产积极性的呀……“"
 prcs.3179.a: "人民，你们赢了……"

 prcs.3180.t: "摆摊一事"
 prcs.3180.d: "“王婶，那个到你发言了”主持人一遍说着，一遍把话筒递给走上台的王婶。\n王婶整了整衣衫，随后拿着话筒缓缓说到：“大家好，我今天是代表我们这些路边摊卖菜的来这讲几句，我知道大伙都说我们摆摊占用位置不方便大家出行，但是，我们也不想这样，咱这些摆摊的都是下岗退休出来给家里面补贴家用的，我们没那么多钱租店铺啊，现在大伙开会，今天大伙有啥意见都好好说。”\n“我说王婶，咱要不这样，你们摆摊的时候看看周遭一圈有没有不影响人家上下班又能摆摊的地方，这样又能赚钱又不妨碍人家通勤。”台下一个光头眼睛男说到。\n“害，要是每次都能找到这种位置摆摊那我就不会来这找大伙支招了。”王婶苦笑道。看得出来这是个老大难的问题。\n“哎，我有一个法子。”台下有人突然喊道，“王婶，你不是说没钱租店铺吗？咱是代表开小店的，我帮你打听打听，有没有多余的店铺能出租出来，到时候我帮你问问能不能租金便宜的，你看怎么样。”\n王婶大喜过望，笑着说：“哎呀，太感谢了，以后算是有店铺能卖东西了。”\n另一个人举起了手说到；“王婶，你要不带我去逛逛你们平时摆摊的地方，我实地考察一下，看看你们那片地方社区规划有什么问题，以后好方便你们做生意不影响人家出行。”\n会议这时响起了讨论声，有的对旁人点头表示同意，有的则是低头和别人讨论这些解决方案能不能行，还有的则是直接举起手站起来对前面几位提的方案表示质疑，一时之间，一个小小的摆摊问题，居然能让百来号人讨论的不可开交，而王婶则是默默的看着台下的人们给她支招出主意，或许她从未想到，自己这样默默无名的路边摊贩居然能让这么多不同职业，不同身份的人参与讨论。"
 prcs.3180.a: "“哎哎哎王婶，我还有一个意见……”"

 prcs.3181.t: "如履薄冰"
 prcs.3181.d: "“我不明白，我一个教师做得好好的，怎么就让我去当学校会计。”老戴询问着，肩膀垮了下来。\n“没办法，学校原来的会计退休了，招人又麻烦，你又是跟数字打交道的数学老师，也挺适合去做的，就让你去做学校会计吧。”校长拍了拍老戴的肩膀，又压低了声音“这个岗位上油水可不算少。”\n\n面对开着预算管理一体化系统电脑的老戴，低头看了看摊在桌上的银行回单，又回想起之前与领导的对话，心中思绪万千。\n\n虽然可以少教一个班，还不用当班主任，但却要在假期的时候来学校办公，有事没事还要接来自其他教职工的电话去解释各种薪资变化的原因，有时还要给其他部门处理问题，前几天才帮人事处补交了一份2010年的员工保险，明显累了很多。\n\n在最危险还是处理程序上的各种瑕疵，有时打电话找学校分管领导给单据的审核签字时，他竟然说你帮忙签了算了，还把他的私章交给了老戴作为补充。陪同的出纳也不太严谨，抄录银行日记账的时候，要是抄错了，就直接拿黑笔涂改，没有划红线订正加上签名。最危险的还要是领导之间扯皮，扯到最后居然要让老戴来签字，他只能打着哈哈回绝。最繁杂的不过学校的财产清查，好几年没弄不说，还有几处对不上的窟窿。\n\n想到这里，老戴叹了口气又继续工作了。仔细处理好各种账户，再把处理好的电子凭证复制把自己的网上云盘，确保属于自己的工作内容没有隐患后，才下班回家。"
 prcs.3181.a: "小心驶得万年船……"

 prcs.3182.t: "长刃落下"
 prcs.3182.d: "又是一堆银行回单，又是做不完的会计分录，老戴已经感觉不到这样单调的会计工作已经持续多久了。一份份凭证，一张张单据，处理起来令人麻木，老戴却还要小心翼翼地对待，原因无他，从流水中可以看出学校领导的手已然不太老实了。\n直到有一天，他的办公桌上多了一箱学校送的牛奶。他拆开包装，里面的夹层中藏着一张银行卡和纸条。他熟练地放好手机，开始录制。\n瞧，昨天还担心没有决定性证据呢，今天就瞌睡来了送枕头。\n果不其然，当老戴完成了一日的工作后，正靠在皮椅上休息时，随着咔的一声，财务室的门被几个陌生的人打开了，老戴轻舒了一口气。这一天终于到来了。老戴很配合地举起手来，任由他们收走自己的手机，然后被“请”去问讯。\n“为什么这份单据的审核人签字的笔迹是你的？”\n“这是XX要求我直接签的，我手机上有相应的录音，记录是XX。”\n“电脑上的XX电子凭证是否属实？”\n“我网上云盘有相应的备份，可以核对是否属实。”\n“这个视频的录制者是否是你本人，赃物现在在哪？”\n“是我本人，赃物现在在我办公桌下。”\n不知道过了多久，当老戴走出纪检监察的大门时，人还有些迷糊，长刃已经落下，而他以自己的小心谨慎和原则逃过一劫。回到家里，看着满面担忧的妻子儿女，老戴把一切想法都抛到九霄云外，想说什么却又止于口咽，最终，他紧紧地拥抱了孩子。“虽然我在很多方面做得还不够好。”他想着"
 prcs.3182.a: "“但至少，我保住了孩子的未来。”"

 prcs.3183.t: "日升日落"
 prcs.3183.d: "北京城内的一间昏暗的住宅，沉寂的空气中仿佛凝结着一层难以言喻的压抑。汪洋端起茶杯，轻轻抿了一口，仿佛那温热的茶水能够抚平他心中的焦虑。他的目光透过杯缘，悄然扫向对面的栗战书。那位人大常委会委员长依旧端坐，目光冷静，不动声色，仿佛一切都在他的掌控之中，然而汪洋知道，老朋友的这份镇定掩盖着深藏的犹豫与挣扎。\n他放下茶杯，指尖在桌面上轻轻摩挲了一下，发出微弱的声响，“栗战书同志，眼下的总理的位子，或许，你不应该沉默是金。”他的语气不急不躁，却带着一股难以捉摸的紧迫感。“请你考虑清楚，我们需要这次机会，国家的发展也需要你我的支持。”\n栗战书的拳头紧紧握住，手背微微青筋暴起。他的目光低垂，似乎在与心中的某种力量作斗争。“说实话，我实在无法让汪洋同志你担任总理。”他的声音低沉而坚定，仿佛下了决定，但又似乎难掩内心的挣扎。\n汪洋轻笑了一下，摆了摆手，微微一扬眉，语气更显轻松，“这不重要，栗战书同志，否决了总书记的人选，我们的立场自然更加坚固。总有一天，总书记会亲自来找我们，那时，我们的机会也就来了。”他顿了顿，微微倾身，眼神变得深邃，“日落是自然的法则，无人能逆。就如同日升一样，春天终会再来的，无非早晚。”他的语气仿佛在预示着某种注定的命运，而那命运，不容忽视。\n“当然了，我也不是在逼你。”汪洋讪讪一笑。“不过我还是得告诉你，沉默呢，就是暧昧，暧昧，就是偏袒。如果你不能摆明了翻我的船，那你不要讲话就好了。”\n栗战书微微颔首，心中的复杂情绪涌动。那话语中似有若无的威胁，混杂着难言的诱惑，令他心生动摇，但又仿佛是一团无法触及的迷雾。\n“我不懂茶，这茶叶也没多贵，喝了吧。”汪洋缓缓举起茶杯。"
 prcs.3183.a: "“茶这东西，凉了就不是那个味了。”"
 prcs.3183.b: "“谁也不会喜欢喝复泡茶的。”"

 prcs.3184.t: "车上密谈"
 prcs.3184.d: "车窗外的柏油路在雨后反着微光，首都的空气仍带着一点凉意。通往西长安街的路上，一辆公务车缓缓行驶在粗糙的柏油路上，车厢里弥漫着皮革与旧文件混合的气息。胡春华翻阅着厚厚的汇报材料，一页页的，比心绪还乱。\n“春华。”汪洋打破沉默，语气罕见地带着一丝急迫，“我知道这话不该在车上说，但时间不等人。这次的机会，对我……对我们整个系统，意义非凡。”\n胡春华没有抬头，不动声色地望着计划书，这是稍后要在组内汇报的工作。能将团派中的温和派与改革派团结一致的李克强已经去世，如今，这个松散到因为升迁途径与经历相似而聚集到一起的团体是否能维系下去，还是要看两方话事人的态度。\n“你知道的。”汪洋继续说道，试图让语气放缓，“习近平走到今天，不是靠能力，而是靠系统性的排他。现在轮到我们做决定了。只要你点头，我就能把人凑齐——老路子，全是熟面孔。”\n胡春华这才合上了资料，眼神依旧平和：“你很清楚，我一直对医疗资本化持保留态度。那份你主张的医疗产业支柱化方案，我看过，病床变资产、患者算流量，这一套早晚要出事。尤其是这会，要是搞这套医疗资本化改革，死的人不止成千上万——死人可不是几个统计数据那么简单。”\n“政策可以之后详谈。”汪洋靠在座椅上，眼神掠过对方的目光，“我不是要你认同我的方案。我是说，如果我们能联起手来，重新拾起温总理与克强同志留下的政治遗产，不是更有意义吗？”\n胡春华如冰河一般面容冷峻，心底下那股“失望”的暗流却因为面前的挚友已经被对权力的渴望异化得面目全非而不断翻涌。他轻声说道：“同志，如果你是来找一个参战者，我恐怕让你失望了。我不会加入这次打回总理的行动。”\n车厢内短暂静默，连底盘与地面的摩擦声都听得一清二楚。\n汪洋缓缓点头，苦笑了一下：“那就请你保持中立吧，在团派和‘他们’之间。”\n胡春华目光望向车窗外：“我会的……如果还有空间的话。”\n他敲了敲窗：“小周，前面右转停一下。”\n车缓缓减速，胡春华推门下车，拎着那只旧公文包走向雨后春风。"
 prcs.3184.a: "车内，汪洋垂首，唯余沉默。"
 prcs.3184.a.tt: "时机已至，团派却已然分裂。"

 prcs.3185.t: "杨柳依依"
 prcs.3185.d: "杭州的夜色灯火辉煌，钱塘江畔的洲际酒店正在举办一场盛大的科技创新企业招待会。胡春华演讲完毕，望向台下，一个熟悉而陌生的面孔正与他对视。在副总理代为发言完毕后，宴会正式开场。酒杯碰撞的清脆声，西装革履间的交谈与笑声，交织成一片看似轻松热闹的景象。然而在热闹的帷幕后，却暗暗涌动着不同于商业的算计与筹谋。官员同新兴企业家之间虚伪的笑容，彼此不知根知底的怀疑，成为了胡春华绝佳的掩护。\n胡春华走下讲台，独自立在角落的白垩石柱边。本来今天的主角另有其人，演讲的主持却落到了他身上。他尚不知晓这是示威还是示好。而就在前不久，他已与汪洋摊牌——昔日的老友，如今已站在了截然相反的政治立场。那一刻的分道扬镳，犹如断裂的堤坝，决堤的溃流将他推向了一片孤寂的荒原。\n他明白，共青团派这个几经打压而松散的联盟已经接近土崩瓦解。若要在这场权力的棋局中立足，他必须另寻盟友。而党内长期被打压的左翼则一直处于缺乏上层联系的困境中，于是一拍即合，那位省委书记邀他巡查，他自然欣然赴约。\n不远处，人群忽然微微让开，一位身材魁梧、神态稳重的中年人走了进来，周围的浙江省官员与外商纷纷向他致意。那是袁家军，浙江的掌舵者，党内左翼的领军人物。\n两人的目光在远处短暂相遇。袁家军微不可察地点了点头，举杯示意，随后在礼节性的寒暄后，他的右手举杯，做出盛情邀请的姿态。二人并行走向了靠近落地窗的一处僻静之地。窗外的江水在霓虹灯绮丽的映照下翻涌起伏，也在映射着二人心底未明的波澜。\n“春华同志，”袁家军开口，语气沉稳，“今晚这场招待会，说起来是是科技企业的聚会啊，但真正能引领发展的，却不在其中。”\n胡春华眼镜下的目光晦暗：“家军同志，你我在政治立场上，或许有些差别。但有一点，我想我们是一致的——我们都不能让那些标榜自由化改革的改革派把国家的路子带偏。”\n袁家军眼神一凛，随后缓缓点头：“正是如此。浙江走出了科技创新引领经济发展的路子，但是发展成果分给人民，还是分给企业，这笔账要算清。”\n胡春华沉默片刻，原先准备好的国务院副总理筹码悬在嘴边，多年的政治嗅觉告诉他眼前这位航天出来的干部并不是一个职位可以打动的人，于是他径直开口“我想我们可以联合，组成新联盟来抵御自由化改革。”\n这句话像一枚石子投入江水，激起层层涟漪。袁家军凝视着眼前的这位昔日被视为“团派代表”的年轻领袖，片刻后露出一抹意味深长的笑意。\n“你是翻了汪洋的船了？”\n“我们本就不是一路子人。”\n袁家军思索片刻，俊朗的脸上浮上一丝笑容。“那我们就算是一根绳上的蚂蚱了，请放心，党内左翼会站在你的身后，也对春华同志你抱有期待。”\n一个缺少上位发声者，逐渐淡出中心的势力和一个形单影只的上层官僚，多好的联盟。\n他们举杯相碰，玻璃相触的清脆声在夜色中显得格外清晰。江风扑面而来，将两人的影子投射在落地窗上，交叠、拉长，像是一份隐秘而沉重的契约。"
 prcs.3185.a: "“敬人民……”"
 prcs.3185.a.tt: "新左派与胡春华达成了联盟，共青团的部分温和派会出走，并入新左派中，此外，又一个势力入局了。"

 prcs.3186.t: "秦岭草莽"
 prcs.3186.d: "中南海西楼的大会议室灯火通明，空气却凝固着不合时宜的沉重。长桌的尽头，习近平总书记的神情沉稳，沧桑疲惫的脸上仍然挂着恬淡而庄重的神情，他伸手，装作漫不经心地翻阅着面前的文件，语气缓慢而坚定。\n“为了稳固当今的经济局势，我提名，由李强同志来接国务院总理的这个班子。”他依然是那副不高的语音，因为天生的木讷与不善言辞，这位领袖并不同于前几任总书记的谈吐优雅与幽默风趣，更多的类似于他出生的那片黄土地一般勤恳而干涩。这几句简短的语音在木质的墙板之间产生了一种不容忽视的回响，顽强地叩击着几位常委的耳膜。\n会议室内，几位常委在目光的游离之间试图捕捉到自己的政治盟友的眼神，动作极轻，甚至连呼吸都被刻意放缓，似乎大脑轻微缺氧的感觉可以让各位常委狂跳的心脏得到片刻的安宁。有人低头，开始研究那份他们会前已经研究了数遍的文件，有人端杯，用浓浓的安徽红茶掩盖嘴角那阵不易察觉的抽搐。汪洋坐在主席台的右手边，双手交叠着，轻松地放在桌子上，眉眼间带着一丝不动声色的笑意，他的面容很和善，一丝若有若无的笑意更衬托出了他的安之若素在暗潮涌动的会议室内的难能可贵，他的表情就已经将他对现状的了然于胸公之于众。\n表决开始，红色的数字在屏幕上缓慢攀升，习主席从未感觉如此时间过得如此漫长，曾经得心应手的领导班子，在接二连三的危机发生后逐步开始离心离德，看似平静，实则暗潮汹涌。时间已经将要截止，几位重要人物的手却依然悬在表决器上，迟迟不肯落下。有一位常委的额头渗出细密的汗珠，他不无悚惧地擦了擦汗，轻轻转头看向了汪洋，汪洋的手指轻轻地叩击了两下桌沿，精准地落在了一片沉默声中。犹豫了许久的几位常委，最终还是没有选择摁下那一个可能决定中国未来命运的按钮，微不可察地调整了姿势，将手缓缓地缩进了中山装的袖口。\n屏幕上的数字定格在多数以下——提案未通过。\n会场内短暂的寂静像是抽干了空气，习近平主席缓缓地抬起头，目光在会场扫过，神色依然平和，但是眉宇间的细微纹路上泄露出不易察觉的疲惫与失望。他合上文件夹，将文件夹轻轻地扔在桌子上，指尖在封面上停留了片刻，等待哪一位常委迎上他环视的目光。\n显然没有，无论是为畏威者还是畏德者，没有人愿意在这种时候抬头直视这位舵手，习主席叹了一口气，开口，语气风平浪静：“既然如此，我们另做考虑吧。”\n话音落下，他的目光微微偏过会场另一侧，略过汪洋，落在几位沉默的常委身上，神色复杂。在政治的天平上，他需要更多的砝码以保持平衡。\n窗外，黄昏的光影穿过了厚重的窗帘的边缘，投下了长长的剪影。长安街的路灯一盏盏地两期，远处的车流像无声的河水一般沉默向前——北京，中国的心脏，到了下班的时候了，家人将团聚，灯光将明，一天的辛劳与疲惫将被热腾腾的饭菜与热水澡拂拭一空，迎来难得的一刻平静。\n习主席起身，踽踽独行，走向中南海的起居室，高瓦率的电灯在他背后一盏盏熄灭，而他则带着一身疲惫走向了自己的前路。"
 prcs.3186.a: "他失眠了。"

 prcs.3187.t: "玉兰树簌"
 prcs.3187.d: "夜色笼罩着中南海，湖面在路灯的映照下泛着浅浅的波光。风掠过玉兰树的叶子，带来几声干脆的簌簌声，湖面被夜风划出一道道细碎的涟漪。路灯在水面上投下金色的光斑，随着波动轻轻摇曳。起居室里，暖黄的灯光照亮了整张胡桃木茶几，桌上的茶水早已凉透，几缕白雾消失在空中。\n习近平总书记坐在沙发一侧，神情比白天更显疲惫，手里捏着一份薄薄的文件夹，指节因为用力而微微泛白。他的目光落在茶几的某个点上，像是在权衡，又像是在思索着一个迟迟没有出口的选项。\n门口传来轻轻的敲门声，秘书低声汇报道：“胡春华同志已到。”\n胡春华推门而入，脚步略显拘谨。他穿着深灰色西装，神色恭敬，坐下后背脊依旧挺直，双手规矩地放在膝上。\n习近平抬眼看了他几秒，像是要透过外在的谦恭看进那层内里的狡猾。他缓缓开口，声音低沉而不失力量：“春华同志，今晚请你来，是因为有一挑担子要交给你。”\n胡春华微微一怔，眼中闪过一丝紧张，下意识挺了挺背：“总书记，您请说。”\n习近平合上文件，指尖在封面上轻轻摩挲，像是在衡量千钧的砝码：“你看到了，现在常委会的平衡被打破了，有人在试探底线，有人在动摇方向。我需要一个人，不仅能接得住国务院的班子，还能在大势起伏中守住党的根基。不能再让那些动摇党的路线的人牵着党的鼻子走了。”\n胡春华的呼吸微微一滞，他低下头，双手在膝上紧握，指节发白。倾时，他呼吸越加急促。房间里的空气似乎凝固成一块沉甸甸的石头，压在他心头。\n习近平微微前倾，语气中带着一丝不常有的恳切：“我需要的是一个既能担当，又能守得住底线的人。这是千斤重担，不是荣誉。我不会对你隐瞒，这条路不好走，甚至可能走到最后也不会被理解。但有人必须去走。”\n胡春华抬起头，眼神中原本的惶恐被一丝沉思取代。他沉默了很久，像是在衡量一副陌生而沉重的铠甲，最终缓缓点头：“如果组织信任，我会尽我所能，不辜负您交付的信任。”\n习近平盯着他，沉默片刻，终于露出一丝疲惫却真诚的笑意，伸出手，掌心温热而有力。胡春华愣了一瞬，随即双手握住，握得很紧。\n“这条路不会很轻松的。”\n窗外的风吹动窗帘，月光透过缝隙落在地毯上，像一条安静的路，延伸向看不见的远方。屋内，只有茶水轻轻晃动的声音，像是在为一份沉甸甸的约定作最后的见证。"
 prcs.3187.a: "机会只有一次，你知道的。"

 prcs.3188.t: "映山红遍"
 prcs.3188.d: "中南海西楼的大会议室再次灯火通明，空气依旧沉闷，却比上一次多了一丝看不见的紧张。长桌两侧的常委表情各异，文件翻动的声音轻得像耳语。习近平总书记坐在正中央，神色平静，眼中却有一抹深不见底的冷意。他的面前，整齐地摆放着几份文件，没有人知道他会从哪一份开始表决。\n汪洋心中已有盘算——按照惯例，总书记会再次提及李强的任命，然后在多方拉锯中消耗时间，而自己准备好的“替代方案”会在关键时刻被抬上桌面。他甚至已经想好了发言的顺序，只等那一刻到来。\n然而，习近平开口的第一句话，就像一柄沉重的铁锤，直接狠狠地砸在了他的心上。\n“为了确保党的路线稳定，国务院的接班人，我提名——胡春华同志。”\n短短十几个字，会议室内的空气仿佛被抽走，寂静到连笔尖滑过纸面的声音都显得刺耳。几位常委不自觉地交换眼神，原本排演好的反应瞬间失去了用武之地。汪洋的眉头几乎不可察地一跳，眼底的笑意像被一阵冷风吹灭。他没想到，胡春华会在这时被抬出来——一个原本游离于派系之外、如今却被打上“新左派”鲜明烙印的人选，自己曾经的挚友。更要命的是，这个名字绕过了他精心布置的所有防线，他感到被背叛。\n胡春华神色沉稳，从座位上站起，向总书记和全体常委致意。他的声音不高，却格外清晰：“感谢总书记的信任，感谢组织的安排。我将全力以赴，守住党的方向，不辜负大家的期望。”\n他的话并不长，却有一种不容轻视的笃定，仿佛早已将这份责任扛在了肩上。汪洋看着他，心中却隐隐察觉到，这份笃定并非一夜之间形成——显然，他与总书记之间，早有过一场推心置腹的密谈，胡春华找到了可靠的政治盟友，并准备继承他的政治财产。\n表决开始，红色数字在屏幕上迅速攀升，没有了上次那种犹豫徘徊的尴尬。多数通过，几乎没有悬念。习近平合上文件，动作干净利落，嘴角浮现出一抹看不出喜怒的微笑。他环视全场，最后的目光在汪洋的方向停留了短短一秒，便移开，像是根本不需要确认什么。\n汪洋垂下眼，端起茶杯，掩去眼中闪过的那丝阴影。茶水的温度刚好，却带着苦味。\n窗外，长安街的灯火一盏盏亮起，仿佛在为一场突如其来的变局拉开新的幕布，大幕渐起，灯光，华彩，还有舞者。\n中南海的杜鹃花开了。"
 prcs.3188.a: "映山红遍"
 prcs.3188.a.tt: "§R胡春华§!就任总理，并被预定为下一任领导人。"

 prcs.3189.t: "冰山下的来客"
 prcs.3189.d: "县里的旧汽车在砂石路上颠簸前行，车轮碾过碎石，发出咯吱咯吱的声响，卷起的尘土在车尾拖出一道长长的黄龙。远处，雪白的冰山渐渐被抛在身后，像一堵巨大的冰墙矗立在天地之间，隔开了发达与荒凉。前方是一片灰褐色的山谷，荒凉得不见一丝绿意，唯有谷底突然冒出一小片绿洲，绿得扎眼，仿佛大地突然在这里心软了一下。\n十几幢低矮的土坯房和毡房散落在绿洲之中，像被随意撒在地上的灰色石子。炊烟从几处房顶袅袅升起，在干燥的空气里划出淡淡的痕迹。\n车子刚驶进村口，一群不识趣的山羊就堵住了去路。领头羊脖子上的铜铃叮当作响，声音在空旷的山谷间回荡。牧羊人挥舞着鞭子，古铜色的脸上刻满了风霜。几个孩子闻声跑来，他们穿着沾满尘土的棉袄，脸蛋被高原的太阳晒得通红，鼻涕在鼻子下面结了痂，却睁着一双双好奇的大眼睛，围着车子打转。\n于浩轩摇下车窗，从兜里掏出几颗水果糖，正要递出去，一个戴着毡帽的妇女突然从土墙后闪出来，对着孩子们吼了几句听不懂的方言。孩子们像受惊的麻雀，瞬间四散开去，躲到妇女身后。那妇女用警惕的目光打量着于浩轩，那双深陷的眼睛里藏着说不清道不明的戒备。于浩轩讪讪地收回了手，糖纸紧紧攥在掌心里，窸窣作响。\n坐在副驾驶的维族干部叹了口气，转过头来：“同志，你都看见了。这里条件艰苦，最要命的是高原反应。往年来的学生，十个有八个熬不过第一个冬天就要回去。”他顿了顿，目光望向窗外绵延的荒山，“我不是要大家在这里没苦硬吃，可是……总要有人先走这一步，给后面的人铺条路。”\n车子重新发动，在狭窄的土路上缓缓前行。维族干部又补充道：“半途而废的人多了容易坏了大家的积极性……说实在的，你们能来，我心里就已经很感激了。”\n车子最终停在一排低矮的石头房子前。房前的空地上立着一块斑驳的黑板，上面用汉语和当地文字写着今日的安排。屋檐下挂着一个高音喇叭，正在播放一段悠扬的牧笛曲，笛声在空旷的山谷间飘荡，带着说不尽的苍凉。\n几个当地干部已经等在门口，他们穿着洗得发白的制服，很旧，但是洁净脸上都带着高原人特有的黝黑。于浩轩深吸一口气，拎着行李跳下车，转身对车里的维族干部说："
 prcs.3189.a: "“到时候县里有了政策，记得早点通知我。”"

 prcs.3190.t: "工作报告"
 prcs.3190.d: "工作报告被摊开在斑驳的木桌上，泛黄的纸张和边缘卷曲的纸页记录着这片土地一年来的变迁。\n祁书记的手指缓缓划过报表上的数字，眼角余光却始终没有离开站在对面的余浩轩。“按照自治州州委、州政府的部署，先后有三个自内地而来的企业进驻我乡。”他的声音带着西北方言特有的顿挫，像戈壁滩上的风，干涩却有力。\n“这些企业在我们这儿铺了砂石路，架了电线，最重要的是——”书记的手指在“水利工程”四个字上重重敲了敲，“建成了储水网络。这在咱们这干旱少雨的地方，就是命根子啊。”\n余浩轩挺直着腰板，目光落在办公室斑驳的土墙上。墙上挂着一张泛白的地图，用红色记号笔标注着新建的养殖基地。\n“你们乡的畜业养殖确实搞得不错。”书记的语气缓和了些，眼角泛起细密的笑纹，“从内地大学来的教授和学生们培育的新品种，不仅在全自治区打响了名号，都卖到中亚和伊朗去了。”他挥了挥手，示意余浩-轩坐下。“这是好事儿啊，有出就有进，经济不就是这么搞的嘛。”\n窗外刮过一阵风沙，打得窗户啪啪作响。书记起身关严了窗，转身靠在桌沿：“科研下乡、技术下乡，你们基层得接得住。我看你们乡就做得不错。条件这么差，满山遍野都是石头疙瘩，海拔又高。但你们干部、农民、技术人员同吃同住，这才叫同甘共苦。我是很欣赏，很欣慰的，老百姓心里有了劲儿，什么都好搞！”\n他突然像是想起了什么不愉快的事，赶苍蝇似的挥了挥手：“有些条件好的地方，嗐，净搞鬼事！技术人员去了，干部什么东西也不提供，还这指点、那指点，把人家气跑了;有些地方，技术人员把自己当天王老子，这不肯干、那不肯去，把式架子搞得多得得了！”他摇了摇头，嘴角扯出一丝苦笑，“老百姓都在说怪话，什么边疆的野猪吃不得这些细糠喏！”\n书记抬起头，仔细端详着余浩轩。一个冬天过去，这个从南方来的年轻人脸上已经刻上了高原的印记——紫红色的皮肤，深深的法令纹，还有被风沙磨砺得粗糙的双手。这一切，书记再熟悉不过，他自己也是这样过来的。\n沉默在办公室里弥漫，只有墙上的挂钟滴答作响。书记摸出烟盒，抽出一支烟点上，青灰色的烟雾在阳光下缭绕。\n“小余，你从南方来，”书记缓缓吐出一口烟，“觉得我们这的冬天冷吗？”\n余浩轩抬起头，目光越过书记的肩膀，望向窗外绵延的荒山。他想起那些在寒风中依然出牧的牧民，想起他们皲裂的手掌里始终攥着的热情。\n“这里的老百姓都说，”他缓缓开口，声音不高，却像山间的石头一样坚实，“山里人不怕风冷，只怕心冷。”\n书记深深吸了口烟，点了点头。\n“小余，你要记住，我们共产党是从山沟沟里出来的党，老百姓用红米饭和南瓜汤把我们送出了山沟沟，难道我们要把他们留在贫困中一辈子吗？如果这样的话，那我们就不配共产党这个名头。”"
 prcs.3190.a: "“党员干部站在老百姓前面，心什么时候都不能冷。”"

 prcs.3191.t: "针锋相对（一）"
 prcs.3191.d: "会堂静得出奇，连空调都不敢发出倒吸一口凉气的声音。闭门会议进入第四日，议程拖延，但真正的火药味刚刚开始弥漫。主席团席中，胡春华翻开一份印刷纸页，视线不急不缓地扫过会场。\n他开口，语调克制，字句却棱角分明。\n“十九届中央公报为我们提供了重要的政治框架，但历史不以文件为终点。我们必须承认，部分提法在当前形势下已难以指导实践，部分语境也脱离了治理实际。我们必须正视，某些提法已成为工作的负担而非推动力。不是不能讲‘新时代’，而是不能继续空讲；不是不能强调‘两个确立’，而是不能将其神话为绝对禁脔。在国际局势和国内形势双重变幻的当下，党应当发挥党伟大的自我革命精神，勇敢地对历史文件做出公正的评价...”\n话音落下，前排数位代表轻微侧目，空调嗡鸣仿佛响了一瞬又静止。汪洋抬起头，原本低垂着眼帘的他慢慢直起腰杆。\n他语速不快，声音却冷得像霜。\n“你这是在给谁下结论？十九届公报是党中央的集体成果，今天要对十九届公报挑三拣四，明天是不是就要重评十八届？是不是要重评改革开放？抱歉，胡春华同志，你说你提出的是问题，但我看到的是动摇，是对党的不自信。”\n胡春华凝视着昔日的老友，深吸一口气，直视对方。\n“我尊重集体成果。但尊重不是封闭，也不是回避问题。如果一个文件在实践中开始制造约束而非指引，我们就有责任和义务直面党的问题，不同的发展时代背景下面临着不同的时代压力，我们必须随之做出改变。”\n空气似乎滞留在那句话后的一秒钟。\n汪洋缓缓放下笔，语气不再是辩论，而是斥责：\n“你不是在正名，你是在拆门。春华同志，你说话应该有分寸一点，我们不是在谈学术，是在谈路线，党的路线。”\n场内窸窣声骤然增大，几名代表偷偷低声交谈。王沪宁的手指在桌上轻敲两下，试图平息喧哗，胡春华与汪洋却没有移开彼此的目光。\n矛盾已经不再遮掩，火线已经划出。"
 prcs.3191.a: "习的手指轻抚着茶杯沿，默然地感受着茶水的温度。"

 prcs.3192.t: "针锋相对（二）"
 prcs.3192.d: "胡春华没有避开汪洋的指责，他抬起头，声音不再平和，而是带上一丝锋芒。\n\n“我不是打历史的黑枪。我在指出：公报里有的东西要继承，有的东西要扬弃，有的东西是发展的硬道理，有的东西只是对歌舞升平的粉饰！”\n他翻动文件页，语速渐快。\n\n“公报在提出‘共同富裕’时言之凿凿，又在落地机制上避实就虚，最终异化为一种对市场秩序的观望姿态，纵容官僚资本扩大化，国企失能，私企失活。它肯定国家主导的方向，却又迟迟不肯剥离对资本集团的依赖。它谈‘高质量发展’，却把治理焦点让渡给财政与地产逻辑，导致债台高筑，地方财政吃紧，寅吃卯粮...”\n\n汪洋站了起来，打断他，没有等完发言。\n“你到底想说什么？回到计划经济？搞全民公社？大锅饭？”汪洋的语气开始变得严厉。“你讲得冠冕堂皇，无非是拿‘制度正义’的幌子，实则为僵化的再分配套上新包装，批评市场经济，批评改革开放！”\n\n他转向全体代表，声音清晰得几乎震动耳膜。\n“没有十九届的产业开放政策，我们今天连坐在这里的资格都不一定有，你要清算的不是‘谬误’，而是改革本身！胡同志，你要动摇我们的家底，我们的国本！”\n\n胡春华闭上眼，深吸了一口气，低声回应：\n“如果改革沦为利益免疫机制，那它就必须被再改革。用进步的改革对抗落后的改革，用公平的改革对抗不公平的改革……”\n\n现场陷入短暂混乱，几位年长代表不自觉地站起又坐下，目光交错，试图分清哪边才是真正的“主流”。"
 prcs.3192.a: "习曲起手指，用指背推开了茶杯盖。他本想喝上一口，但放下了。"

 prcs.3193.t: "转机"
 prcs.3193.d: "谁也没说话，连空调声都似乎消失了。主席台上的国徽静静垂挂，仿佛并未注意这一切争执的发生。\n\n就在代表们的目光在胡春华与汪洋之间来回游移时，总书记缓缓放下手中的笔。自大会开幕以来，他几乎未正面表态，此刻却将麦克风轻轻拉近，嗓音不大，却让整座大厅瞬间安静下来。\n\n他没有看汪洋，只看着前方的文件，语调如常，甚至带着些疲倦，“公报是那时候的解法。不是今天的答案。”他顿了顿，把眼镜摘下，缓缓说道：\n“胡春华讲得对。”\n\n会议厅仿佛突然抽去了空气。几名常委目光剧震，代表团中有人微微张口，却未发出声响。“这份公报，我们定过。定的时候它起了作用，现在它该让位给新的话语。人民就是江山，江山来自人民。人民和历史把时代的问卷出给我们，我们就有义务答好这份问卷。时代在变化，答案也该变化，我们不能再抱残守缺了，各位同志们。”\n\n总书记的声音依然平稳，却已不容置疑：“新时代不是圣旨，不是谁谁谁的龙头铡，可以随时请出来杀好同志的头。能改的，该改的，就别拖。春华同志的意见，就按他整理的，送起草组。”他合上文件，话锋如切。\n\n“散会。”\n\n全场无人动弹。汪洋缓缓坐下，脸色发白，半晌无言，他复杂地看了一眼台前的昔日老友，只留下一声叹息。胡春华则垂眼不语，试着避开他的目光。主席台上红旗静垂，空气依旧沉闷，胡春华打开了习送给他的礼物，也接过了这位老人沉重的善意。"
 prcs.3193.a: "习走得很慢，慢到胡能看到他如释重负的笑。"
 prcs.3193.b: "习又走的有点快，快到忘记了那一杯浓浓的龙井茶。"
 prcs.3193.c: "人走了，茶凉了。"

 prcs.3194.t: "务实改革"
 prcs.3194.d: "临时小会议室设在人民大会堂东侧二楼，门外没有警卫，门内却坐着决定未来的人。木质长桌、旧空调、灰色日光灯，一切陈设都像临时借调的政务现场，唯有那叠文件厚得压人。\n\n胡春华坐在主位，眼神扫过列席的几位年轻政策官员。他没有多余的开场白，直接将前日总书记的批示简化为一句话：“抗美援朝的时候，我们的卫生员同志会把烧热的石头放进棉被给战士们取暖，但现在，我们不能再守着一块不再生热的石头焐热了。”他翻出新左派成员备好的草案，逐人分发。\n\n会场一片寂静，只剩下稀稀拉拉的翻页声。\n“第一，我们不推翻十九大的全部技术体系，但要拆解其中不再适应当下的语言结构和制度惯性。凡是政策不能落地的地方，都要改，都要改成能平稳落地的。比如‘高质量发展’——要做实，必须从目标压缩转向成果评估。不是喊多高的指标，而是能不能做出来。第二，‘共同富裕’要动真格。不是靠横向转移支付装点门面，而是从财政制度、户籍制度、财产申报等层面设计真正的二次分配机制。”\n\n话音落下，一位常委低声问：“是不是太冒进了？”\n胡春华语气不变：“风险不是不变革的理由。我们用画大饼的方式让人民失望太多次了。”他推开最后一份文件，“第三，我们要明确一个方向：我们的根本目标，是人民过得好，不是文件看起来整齐。写得出逻辑、拿得出指标，搞听得到，看得到，做得到的人民政府。”\n\n他停顿了一下，看着众人：“拒绝革命从来不是我们党的传统，我们光荣伟大的党要永远走在自我革命的路上。”"
 prcs.3194.a: "保留原框架，优化语言结构与目标逻辑。"
 prcs.3194.b: "启动分配制度改革，设立再分配调节委员会。"
 prcs.3194.c: "以人民幸福为核心重塑政策评估体系，改革各项政策。"

 prcs.3195.t: "利剑？"
 prcs.3195.d: "胡春华凝视着案宗上密密麻麻的字迹，胸口那股压抑已久的郁气才缓缓吐出。随着纪委将名单上最后一个重量级人物移交司法，基层党组织的大规模整风运动宣告阶段性胜利。左翼改革派与温和保守派的联盟暂时稳住了局面，但他深知——这并不是庆祝的时刻。\n“胡总书记。”\n王沪宁推门而入，带着一叠厚重的材料。他的语调依旧沉稳，但是在风平浪静下暗藏着一丝悄然的新意：“关于本次整风之后，政治局讨论后一致认为，应对纪委体制进行进一步改革，以推动干部作风建设，推进新时代社会主义的根基。”\n胡春华端坐在红木桌后，拇指轻轻摩挲着笔杆，轻轻地拨动目光不动声色地落在王沪宁的脸上：“沪宁同志，有具体方案吗？”\n“有。”王沪宁毫不迟疑，翻开文件，条理分明地阐述道：“纪委必须成为党内真正的利剑。地方纪委应当彻底脱离地方财政和政府控制，改为由中央纪委直接调配干部，保证监督的独立性。同时，中央纪委只对政治局负责，接受政治局的统一监督。纪委内部，我们将建立更为严格的反腐败系统，确保这柄尖刀能精准撕开各利益集团的保护伞，只有这样，才能让权有所监，监者不腐。”他言语铿锵，带着不可置疑的逻辑。\n胡春华微微点头，手指却在桌面轻轻敲击。他没有立刻表态，只淡淡说道：“利剑在手固然能斩断丛生荆棘，可若握剑之人心怀私念，这柄剑也会反噬。沪宁同志，你我尚能约束它，可在我们离任之后呢？我担心它会成为党内争斗的工具，我们的子孙后代会拿这个双刃剑伤到自己，让反腐和纪检变成党内的派系斗争的代名词。”\n王沪宁微笑，神色却复杂莫测：“水无常势，因势而利。总书记，如今我们需要一柄悬在所有党员头顶的利剑，这是重整政治生态的唯一方式。待到人民监察制度全面确立，纪检之剑自然可收鞘归匣。是时自然可以让政治生态再为之一变。”\n胡春华凝视着他，眼神沉思，似乎在权衡。\n片刻后，他缓缓将草案合上，语气平稳：“我会认真考量你的意见。但沪宁同志，这样的制度一旦推行，纪委的权力将前所未有。若要行稳致远，恐怕还是得拿个更完备的章程，你看呢。”\n话音落下，空气一时凝固。\n王沪宁的微笑没有消失，却略微收敛，眼神似乎也有着缜密的逻辑。他轻轻颔首：“我愿随时听取各方意见。”说罢，拱手而退，背影逐渐隐入厚重的红木门后。\n静室里只剩下胡春华，他低下头，手掌摩挲着那份草案，像在抚平某种暗流的波澜。\n良久，他伸手拨动了案头的电话，声音低沉却清晰："
 prcs.3195.a: "“接袁家军同志。”"

 prcs.3196.t: "公仆？"
 prcs.3196.d: "几天后，袁家军从工信部赶了回来。傍晚的院子里尚留着雨后的潮意，梧桐叶沿着青砖滴落水珠。门一推开，胡春华便迎上来，笑着拍了拍他的肩：“家军同志还是忘不了老本行啊，忙起来没个正形。”\n袁家军收起雨伞，神色里带着忙碌后的兴奋：“科研战线刚取得了丰硕的成果，正等着总书记批示。”\n笑意一敛，胡春华转身引他入内，指了指办公桌上的一摞材料：“前几天，沪宁同志找我，提出改革纪委的议程。草案你应该过目了。你怎么看？我是很想听听你的意思的。”\n“沪宁同志一向是出于实用主义做事的。”袁家军把公文包放下，推了推眼镜，“他是个好同志，好处是能拿到眼前的最优解。但局部最优之和，不一定等于整体最优。”\n他从包里抽出一份书面建议，眼镜下的双眸有几分锐气，纸面未干的墨迹还微微发亮：“若我们之前的整风已初见成效，可以考虑‘纪委下基层制’——把监督的尖刀直接扎到党的精神末梢。”\n胡春华起身，在院中回廊慢慢踱步，指尖轻叩栏杆：“这样不会乱套吗？”\n“不会。”袁家军跟在身后，语气平稳，“党内改革派的方案强化了党员誓词与组织生活约束，同时——”他顿了顿，露出一点自信的笑，“这和科研战线的一个‘新工具’有关。”\n“新的监察系统？”胡春华扭头，眼中闪过审慎的亮光。对他而言，权力像预算，用一分少一分。若能把一部分‘预算’交给红专，让技术服务人民，自己卸任后也留得‘改革者’之名。“还是说……”\n“是的。”袁家军点头，“我们以前瞻研究个人与公职关联账户的流水覆盖与比对。只要把收入、支出、存款项目与申报事项做交叉，明细资金流向即可自动预警。数据直达中枢，留有只读镜像，很难篡改。”\n胡春华眉心微蹙：“我担心这会让干部队伍产生集体恐慌。并且，一旦舆论把‘技术监督’理解为‘技术不信任’，反弹不小。”\n“所以先在基层铺开。”袁家军不疾不徐，“把应用场景限定在公职相关账户、项目科目与报备范围内；个人生活性消费脱敏处理，只取异常，不查隐私。纪委在基层扮演‘党内警察’，而监察权适度下放给群众与群团组织，形成一个双线开花的态势。基层窗口公开必要数据，接受‘闻登鼓’式的现代申诉，配合大规模“闻问切”反腐宣传——把腐败定性为侵蚀党性与公共利益的附骨之疽。不敢说杜绝，至少能让它销声匿迹。”\n回廊尽头，风把雨后泥土的味道送了进来，又潮又涩。胡春华停住，拇指在茶盏盖上轻轻一扣，声音低下来：“沪宁同志的思路，是把剑高悬在顶；你的方案，是把网铺到地面啊，两者各有优势。不过，我需要更加完善的报告”\n袁家军恭顺地点了点头，目光里锋芒倾刻敛起：“明白，听从总书记的安排”\n胡春华没有立刻表态。他抬手合上那份建议。片刻，缓缓吐出四个字，既是留白，也是筹码："
 prcs.3196.a: "“让我再想想。”"

 prcs.3197.t: "大会启幕"
 prcs.3197.d: "上一次召开全会时，胡春华只觉敌我分明。虽然举目皆敌，党内同仁亦一呼百应。而这一次全会，他举目望去，旧敌已去，昔日的同仁对纪委改制意见的天差地别也使政治同盟的根基地动山摇。可以说，他宛如穿着烙铁鞋，在钢丝上起舞的舞者，稍有不慎，改革事业便会前功尽弃。\n\n他的思绪再度流转，试着理一理各个派系，各个团体的诉求，并且试着维持这个有着明显裂痕的联盟。\n\n以王沪宁为代表的温和保守派要求扩大纪委权力，彻底将纪委从地方行政体系独立，解开诸多限制，以此来淬炼纪委这柄神剑的“锐利”。这样一来，他们的权限必然大幅扩张，甚至有可能打造苏联克格勃那般的“编外帝国”。\n\n而以袁家军为代表的红色技官与党内左翼要求纪委办事下基层，配合基层民主改革并采用全面核查官员个人账户的举措。这样一来，科研部门必然受到青睐，经费拨款必然大开口，形成“红色专家”做大。\n\n盟友袁家军扣了扣桌子，他才回过神，翻开了文件，开口说道："
 prcs.3197.a: "“我们将强化中央纪委权力，以应对新情况。”"
 prcs.3197.b: "“我们的民主改革将真正落实民众监督权，真正跳出历史周期律。”"
 prcs.3197.c: "“这件事之后再议吧。”"

 prcs.3198.t: "便民建设"
 prcs.3198.d: "“欸，老詹，你有没有看最近的新闻”社区的棋牌俱乐部里面，两个老人准备对弈。老詹的棋友老杜提起来最近政府公开的年度报表。他一边摆棋，一边开口说着。“我们的统计方式换成了什么工农业总产值，看不到直观的增长，我总害怕60年代的饥荒卷土重来。”\n老詹扬了扬胡子“你这不杞人忧天呢吗，现在那些数据啊，都经过了ai统筹和计算，不会再有造假的情况了。而且，我们老百姓的生活不是越来越好了吗？过两个月，我儿子还能领分配下来的车嘞。”\n棋子终于摆好，老詹见老杜依旧忧心忡忡，便提起了最近的见闻。“说回那个年度经济报告，最后不是说咱有盈余呢么？”\n“咋滴？国家财政有剩钱还能花我们身上？”老杜提子，吁了口气。\n“哎呦喂，还真是。”老詹笑眯眯地开口“国家将资金公开，在手机上收集起意见，看看我们需要什么样的帮助，各地还有关于即将开展的项目听证会呢。”\n老杜一下来了兴趣。“什么意见和项目？”\n“第一个是搞什么小微设施发展。”老詹说着“过去不是总修路嘛，那些个死板的官员总把路修了拆拆了再修。以后这种项目就需要专家来核查了，现在会多办一些医疗站，菜市场之类的设施来满足我们的需要。”\n“那咱的俱乐部也可以扩大规模了？”老杜有几分喜意\n“哪能啊，咱就这几个人还抢经费。”老詹说着“不过咱可以提议办一家社区医院，你不有高血压吗，开药可以就近了，不用坐两个小时到市中心去。”\n“还有嘞？”老杜的兴趣显然被勾起来了。\n“办机器人应急服务站呗。”老詹顿了顿“前些日子，隔壁王姐去到了深圳跟子女住，恰巧当地试点机器人应急服务，她突发心脏病的时候好在有那个机器人应急服务，现在也正常下地了。”\n“这都是民生所需啊。”老杜点了点头，眼中不由有了几分希冀。\n“你打算支持哪个项目呢？”老詹问着，开始落子。"
 prcs.3198.a: "“有了新的菜市场和医院肯定很方便。”"
 prcs.3198.a.tt: "我们将开始发展与建设便民的小微设施。"
 prcs.3198.b: "“现在老了，难免有个三长两短的，要是有个保障就好咯……”"
 prcs.3198.b.tt: "我们将开始建设机器人急救服务的节点。"
 prcs.3198.c: "“想来想去，还是不如换成蔬菜水果实在。”"
 prcs.3198.c.tt: "我们将开始提供生活的补贴，减少居民的生活消费。"

 prcs.3199.t: "枷落新生（上）"
 prcs.3199.d: "“被告人王德贵，以维权之名行犯罪之实，参与组织非法罢工破坏生产经营，散布颠覆政权言论，参与反政府组织。被告行为践踏法律底线，危害国家安全和社会稳定。被告拒不认罪，未赔偿损失，无悔罪表现。本院现依法判处被告有期徒刑十年，剥夺政治权利三年，并处没收个人全部财产，立即执行！”。“我抗议！我要上诉！这是赤裸裸的迫害，定罪流程有明显的问题，你们这些与黑心企业沆瀣一气的官僚！”王德贵大声回应着宣判结果，身旁的法警迅速将他拖出法庭，他无力的言语并没有对审判结果产生丝毫的影响。\n从监室床上惊醒的王德贵擦了擦额头的冷汗，七年来他时常会做这样的梦，在梦中回到那个埋葬自己人生的法庭，他有时懊悔为什么落得个这样的下场，但苦笑过后又觉得并不后悔自己的选择。\n躺在床上的王德贵思绪拉回七年前，那时的他原本只是一名普通的工厂工人，他所在的工厂工作时间是十二小时两班倒，工人需要连续站立工作，不能随意说话，劳动强度大，工厂采用严格化管理，强调纪律性和服从，工人上下班需要开会训话，工作中处于线长监督下，动作都有严格要求，如先动哪只手、第几秒另一只手怎么动等等，工人在高压、单调、封闭的环境中工作，就算是这样，工人基本工资也只有2200元。这样的环境条件下使得工厂中产生了一些以维护“工人权益”为主张的地下团体，王德贵正是其中的一员。\n王德贵所在的地下团体每个星期都会搞一次小读书会，主要是教大家一些基本的劳动法常识，当然还有一些思想上的交流。王德贵依稀记得第一次参加活动的场景，工友们或坐或倚，有人正默声看着书，有两人争论着《资本论》中“剩余价值”的含义。角落里，有人正教一位年轻的工友阅读，微弱的吊灯映得他们脸上的神情时而激动，时而沉思，仿佛这方寸之地是隔绝了工厂的另一世界。王德贵在工友的带领下也懵懵懂懂的加入其中，拿起一本被翻烂的《共产党宣言》看了起来。吊灯被窗外的风吹得摇晃，将他们的影子投在斑驳的墙上，仿佛一群被知识逐渐点燃的幽灵。\n罢工事件爆发于一个闷热的夏天，配件车间的一位年轻工人跳楼了，因为他要回去照顾卧病在床的奶奶，而经理以工作合同期限未满为由压着身份证和工资不给，年轻工人在遭受几次拒绝后不堪压力跳楼自杀了。这件事情引爆了工人们长久以来压抑的不满情绪，在王德贵所在地下工人团体的组织下，工厂各处爆发了罢工，工人们占领了厂房车间和办公楼，随后工人代表与外围在派出所民警保护下的工厂老板开始了谈判，正当工人代表提出的条件被应允后，工厂外响起了一连串的警笛声，在大量的特警与防爆队入场后一切都落下了帷幕，工人们被驱散，王德贵与其他组织罢工的成员被带上了警车。"
 prcs.3199.a: "稳定压倒一切。"

 prcs.3200.t: "枷落新生（下）"
 prcs.3200.d: "王德贵在监狱管理办公室的沙发上不知所措的坐着，刚才他还在监室打扫卫生，忽然两名狱警出现在门口，转眼他就被带到了这里，一位看似领导模样的工作人员还让他坐在沙发上不用紧张，“不能是什么好事吧，最近也没干什么显眼的事呀。”王德贵心中嘀咕，他明白从某种意义上说，自己也算是政治犯，即便是减刑什么的估计也很难落到自己头上。看着正在翻找文件的工作人员，王德贵想到自己反正已经这般处境了，索性止住了胡思乱想。王德贵站起身，领导模样的工作人员拿出一份文件开始宣读起来：“王德贵，江西南昌人，因参与三·二五罢工运动获刑十年。现经中共河南省委联合调查工作组查实，原三·二五罢工远动是因相关企业与地方政府干部利益勾连，无视劳动法规，严重侵害工人权益，致使工人爆发罢工反抗。根据上述事实和法律依据，经本工作组认真审查和研究，并上报最高法、最高检察院，决定为事件原责任人王德贵平反，撤销原判罚决定的罪行及文号，恢复王德贵的名誉，并为其消除因原判罚结果产生的一切不良影响。同时，按照国家相关规定，对其所遭受的损失进行合理的赔偿和补偿，本决定自发布之日起生效。”\n王德贵愣在原地，茫然无措充斥着他的脸，当“平反”二字穿透空气时，他眼角的细纹在颤抖，膝盖突然失去了力气，喉咙里涌出的呜咽像被困多年的兽鸣，宣泄着委屈和苦楚，身旁的工作人员上前搀扶着他坐到沙发上，随着两行热泪的从眼角流出，一阵沙哑的抽泣在这间不大的办公室内响起……\n走出监狱时，暮色正将天际染成红色。风吹得路边的树叶沙沙作响，王德贵转身望着那扇即将闭合的铁门，思绪万千。公交站台的长椅上有未干的雨痕，王德贵掏出管教塞给他的薄荷糖，糖纸在夕阳下泛着微光。他摸了摸口袋里那张重新办好的身份证，边缘的触感陌生又真实。\n在相关部门的安排和王德贵自己的意愿下，他选择回到当初的工厂工作，那里现如今已经变成国营的电子配件厂了，他的工龄从入狱时起被算起，走在厂区新建的绿化带旁，塑胶跑道上的夕阳让他想起监狱里的放风场。那些年他总盯着铁丝网外的云朵，幻想有一天能重新踩在真实的大地上。此刻脚下真实的草腥味钻进鼻腔，他却感觉像踩在棉花上。远处一群年轻的工人们经过，叽叽喳喳的笑声让他愣住，回到宿舍，他对着镜子端详自己。眼角皱纹比当年深了，但瞳孔里跳动的火苗还在。床头柜上摆着工友送来的《现代数控技术》，书页间夹着工友们画的贺卡，卡上歪歪的“工人阶级领导一切”八个字让他眼眶发热。他忽然明白，或许有些东西，时间带不走，平反不是终点，他要重新学会工作，重新学会信任，重新在时代的浪潮里找到自己的位置。"
 prcs.3200.a: "工人阶级领导一切！"

 prcs.3201.t: "除阀清源"
 prcs.3201.d: "马小海是黔省某医科大学的研究生，此时他正盯着桌上书本装出一副看书模样，手中的圆珠笔无意识地在书本边缘叩击。因为此时讲台上他的导师晏子英正发火，原因是他们组内的一名女生在报送一篇SCI论文时，没有听导师晏子英的话将她得意门生的名字加到创作者中去，从而导致晏子英在今天的组间会上大发雷霆。\n“学术界讲究传承与团队合作。”晏子英的眼镜片在某个角度折射出毒蛇般的寒光，“连基本的感恩和谦让都做不到，以后怎么在圈子里立足？”他边说边走到那个女生身旁，指尖装做不经意的指向，“还是有些人觉得，靠自己那点微薄的努力，就能撼动学术传统的根基？别忘了，没有前辈的提携，有些人连实验室的门都摸不着！”马小海瞥见那个女生的喉咙上下滚动，像被卡住喉咙的小兽。她垂在身侧的左手紧握成拳，又缓缓松开，指甲在掌心掐出的月牙形红痕，这或许会成为她今晚失眠时反复摩挲的印记。其他人低头假装看书，却用余光偷窥这场公开的羞辱。窗外的蝉鸣突然变得刺耳，与晏子英持续输出的讽刺话语交织成令人窒息的噪音。\n正当晏子英准备继续她的羞辱时，教室后门传来三声急促的敲门声。两个身着深灰西装的身影出现在门缝里。为首的男子走到晏子英面前，出示了标着“文教监察委”的工作证。“晏子英老师，收到有关举报，现请配合我们进行调查。”工作人员的声音沉稳如铁。晏子英的肩膀瑟缩了一下，马尾辫上的碎发在空调气流中飘散。晏子英声音里带着僵硬的弧度：“稍等片刻，我这组间会还没结束。”她试图将激光笔插回口袋，却两次没对准插孔，金属碰撞声清脆刺耳。\n“很遗憾，现在必须终止您的一切工作。”工作人员向前半步说到。马小海注意到导师晏子英的食指在裤缝处无意识地摩挲，那个习惯动作总在他面对重大压力时出现——就像去年申报教授失败后，她在实验室对着众人摔碎烧杯的那天。\n当晏子英被工作人员带走时，走廊里回荡着皮鞋与瓷砖摩擦的声响。教室陷入诡异的寂静，空调风突然变得刺骨。前排有人翻动书本的动作惊醒了凝固的空气，窸窣声中夹杂着低声议论：“终于有人治她了……” 压低的声音带着颤抖的兴奋，仿佛要把两年来受的委屈都宣泄出来，有人拍打课桌，震得桌上的骨骼模型作响：“早就该查了！她去年抢了王师兄的专利，你们不知道吗？”但立刻有人嘘声制止：“小声点，他们还没走远呢。”马小海看着眼前的一切，揉了揉太阳穴，感觉如梦似幻一般，随后收起了书本向外走去，身旁的同学沉浸在你一言我一语的交谈中，没人注意到这个因为家境贫寒所以平常沉默寡言的男生想干什么。\n马小海根据找到的信息，来到一座不起眼的办公地点，敲开门后问道：“你好，请问这里是文教监察委检举办公室吗？……”"
 prcs.3201.a: "或许补助和奖学金也有希望了……"

#  prcs.3202.t: "一网打尽"
#  prcs.3202.d: "“我靠，今天这新闻可太爆啦！”林宇突然从床上坐直了身子，眼睛瞪大，里面闪烁着兴奋的光芒，作为一个热衷时事热点的大学生，他的声音中充满了惊讶与激动，瞬间打破了宿舍里原本的宁静。正坐在桌前打游戏打得入神的室友张浩，被林宇这突如其来的大喊吓了一跳，手中的游戏操作都出现了失误。他皱着眉头，有些不满地转过头来，嘴里嘟囔着：“宇哥，你这一惊一乍的，我在对狙呢，啥新闻啊这么兴奋，又是哪个明星的大绯闻呀？”林宇把手机拿到张浩面前，嘴里快速地念着：“之前网上闹得沸沸扬扬的捐款事件，现在被查出来啦！中央纪委还把案情调查全面公开，打消了原先的质疑声！”\n“近日，在中央纪委监察委、中央干部整风工作组的推动下，全国多地纪检监察部门与司法机关联合行动，重点查处了近期在网络上引起较大风波的贪污救灾捐款违法行为。经过详细调查，原四川省委政府中一批利用职务之便侵占救灾资金的腐败干部网络被依法查处，涉事相关人员被控制调查，此次专项行动彰显了国家对救灾资金安全的高度重视，维护了受灾群众的切身利益。救灾捐款是爱心与信任的载体，更是受灾群众的“生命线”。从重拳惩治到制度创新，我国正以雷霆手段与长效治理，确保每一分善款都精准抵达需要的人手中。纪委监察机关的“铁腕”行动，不仅捍卫了法律尊严，更筑牢了社会信任的基石。”\n看完视频的张浩感叹道：“我去！真查了呀，我还以为他们装聋作哑呢，看来之前调查会上说的透明化政策真不仅限于说说，政府真的听到了我们的声音。”林宇和张浩叽叽喳喳的讨论，仿佛他们自己就是这场正义行动的参与者一般。"
#  prcs.3202.a: "再不会“装聋作哑”，因为人们就是我们的耳朵和嘴巴！"

 prcs.3203.t: "“闹剧”"
 prcs.3203.d: "当政治体制变革推进时，整个社会仿佛被注入了一剂强心针。一系列改革措施：提高最低工资标准、扩大医保覆盖范围、对企业进行管理改革、推动农村民主改革……，然而，在网络的暗流中，一群自诩“革命先锋”的年轻人正酝酿着另一场风暴。\n陈东是某大学社会学系大三学生，自高中起便沉迷于马克思主义理论，社交媒体上的激进左翼论坛是他的精神家园。他留着及肩长发，总爱戴一副圆框眼镜，衬衫上别着社会主义符号的徽章。在政治体制变革后，他迅速与网络“同志”们组建了一个名为“赤潮青年联盟”的公开网络社群，聚集了数百名与他同样激进的年轻人。这些人大多从未经历过真正的社会运动，却将网络作为践行理想的战场。\n“这改革太过温和，完全是在向资本妥协！”“应该立刻彻底推翻现有的经济体系，建立自动化的计划经济，实现真正的共产主义！”陈东在键盘上敲下这些激昂的文字，仿佛自己是一位引领革命的伟大领袖。他的那些网络“同志”们也纷纷响应，各种极端的言论如潮水般涌现在网络上。\n“政府在背叛我们！”陈东在社群直播中声嘶力竭地呐喊。镜头前，他身后的墙壁上贴满了手绘的革命标语，电脑屏幕不断切换着各种抗议视频。他指责政府在劳工权益法案中保留了“协商权”，称这是“向资本家跪下的妥协”；批评基层民主改革方案远未达到“无产阶级专政”的目标。他的言辞像烈火般点燃了群内成员的激情，评论区瞬间被“打倒修正主义！”“革命尚未成功！”等口号淹没。他们四处提出一些激进的主张，比如要求立即开始第二次文化大革命、实现全民免费住房、无条件高额福利补贴。他们认为只要口号喊得足够响亮，理想就能瞬间照进现实。沉浸在自己构建的虚幻世界中，对现实的复杂性视而不见。\n他们在网络上组织所谓的“革命活动”，制作一些宣传海报，上面写着夸张的标语。还试图通过发起网络签名请愿来向政府施压，仿佛这样就能让政府按照他们的意愿行事。然而，他们的行为在大多数人看来，就像是一场荒诞的网络闹剧。一些理性的网友试图与他们辩论，指出他们主张中的不合理之处。“你们考虑过国家的财政状况吗？这样的政策实施起来会引发严重的经济问题，我们必然会建成自动化计划经济，可是路要一步一步走啊。”但陈东等人却将这些理性的声音视为“阶级敌人”，恶语相向，甚至进行人身攻击，完全失去了应有的理性和客观。\n现实改革的车轮仍在不断前行。一位参与医保改革设计的医生在自己的社交媒体账号上无奈叹道：“那些年轻人以为政策是按下按钮就能瞬间实现的童话，在虚拟世界中编织着激进的幻想，如同一群困在数据迷宫中的孩子，用空洞的呐喊填补对现实的无力感。他们的“革命”不过是一场时代洪流中的闹剧。"
 prcs.3203.a: "步子缓慢下来，才走得稳。关注现实的情况，才能做出最有利于人民的决策。"

 prcs.3208.t: "高原补给"
 prcs.3208.d: "海拔四千六百米的喀喇昆仑山脉之上，风雪依旧凛冽，仿佛这片大地从未褪去冷冽的面容。白雪覆盖的山脉与天际融为一体，唯有巡逻队员的翻毛军靴在这片苍茫的雪原上刻下深深的痕迹。\n\n三班的九名战士沿着边境线，默默履行着他们的职责，脚步在松软的积雪上压出一串整齐的印记。王军班长走在队伍前方，目光坚定，偶尔低头通过对讲机与后方联系。“三班到达12号界碑，一切正常。”他说完这句报告，抬起头看了看手表，“同志们，休息一会，准备开饭。”\n\n战士们熟练地在雪地中寻找一个避风处，放下沉重的背包，迅速用工具清理积雪，为即将到来的“空投”做准备。没过多久，风雪之中夹杂着他们再熟悉不过的声音——是高原型运输无人机，在他们的“肚子”下，便是即将进入战士们肚子里的美食。\n\n副班长李强抬头瞄了一眼，淡淡地说：“来了。”其他战士们并未抬头，但喉咙不断产生的吞咽又暴露出来他们迫不及待和充满期待的心情。\n\n无人机精准降落在预定的空地上，扇叶停转的刷刷声中，舱门自动弹开，露出里头装满补给的保温箱。战士们依次走上前，按编号取走自己的餐份。红烧肉，宫保鸡丁，土豆炖牛肉——这些以前要下山去营地食堂里才能吃上的硬菜，如今都热气腾腾的在他们的手中。\n\n“哎呀，这次的饭真香啊。”不知道是谁打趣的说了一句，“这牛肉炖得还行，比上次的糖醋里脊好吃。上次的糖醋里脊没挂上糊，甜醋口都没调好。”\n\n“现在开始提意见了？当初上来只吃饼干的时候可没见你们这么挑过。”王军班长笑道，“咱们的日子也是好起来了啊。”\n\n战士们都笑了起来，气氛轻松愉快。吃完饭后，他们将餐具收拾好，放回无人机的舱内。班长按下启动键，看着无人机缓缓升空，旋即消失在雪山之间，远去的轰鸣声在寂静的高原中回荡。\n\n“收拾装备，继续前进。”王军班长下达命令。九名战士重新整队，踏着雪地，继续向前行进。\n\n雪地依然松软，远山依旧静默，边防线在他们身后延展，深远而宁静。在这片被称为“生命禁区”的高原上，现代科技悄无声息地改变着边疆守卫者的生活。战士依然是钢铁一般的战士，土地依然是辽阔美丽的土地，只是守卫这片土地的人们得到了更值得他们付出的回报。\n\n每当无人机的嗡鸣响起的时候，戍边的战士们便心知肚明…"
 prcs.3208.a: "“祖国不会忘记…我……还有他们。”"

 prcs.3209.t: "旧方法，新构想 (1)"
 prcs.3209.d: "小李是村子上的一个普通干部，这几天，因为中央宣布要重启计划经济，所以村里的老乡非常疑惑，中央重启计划经济的消息，像一块巨石砸进了平静的村子，大槐树下的议论声比前几天更大了，焦虑中甚至带着一丝恐慌。不过，小李自己也没辙，因为现在整的这个计划经济说是和以前大不相同，牵扯到不只是技术上的问题，甚至还有不少所谓的“协商模型”“决策模型”等等政治学上的概念，小李光是为了捋清楚这些专有名词他不得不挑灯夜战连续三天。\n\n“小李啊，你是不是开玩笑啊，搞了这么久市场经济怎么又回到计划经济了？”王大爷一听到这消息马上就跳了起来，满脸狐疑的问。\n\n“哎，大叔，时代不一样了嘛，国家最近的“NEMS”计划就是在每个村子里面建立一个个数据节点，然后大家就能在手机上填家里面缺的东西，过那么几天，镇子上就会调用物资过来分发给大伙，而且，更重要的是—”小刘顿了顿，“以后咱们定计划，都是依靠大伙协商制定，谁家肥料缺了，米价怎么定，大伙共同商量，共同决策，要让计划经济啊，彻底掌握在咱手里。”\n\n老乡们大吃一惊，这可是从来也没有过的事，虽说这几年大数据的相关技术发展非常迅猛，但是，这种“高科技+协商民主”的新形式却从来没有大规模尝试过，更何况在他们这么一个小村庄呢。\n\n“那我们要怎么管理？”王大爷接着问，不过，小李却没有回答问题，而是找来一张桌子，拿起一支笔一张白纸，在这上面画了画一个图，尽量的去解释村子未来会循着怎样的模式去实现民主管理，老乡们看到这，兴致勃勃的凑上去问小李各种他们感兴趣或者是十分疑惑的问题，热闹的大榕树下人头攒动，连村口的过路人也停下来瞧瞧是怎么个一回事。"
 prcs.3209.a: "“小李啊，这个科什么特讲的内容能再解释一遍吗？”"

 prcs.3210.t: "旧方法，新构想 (2)"
 prcs.3210.d: "小李画完蓝图，跟老乡们解释清楚该如何运作村子的民主实践怎么做之后，顿时感到口干舌燥，于是，在完成任务的时候，小李三步并作两步，急匆匆的赶回办公室，接着，他抄起一杯纸杯，接着饮水机开喝。\n\n小李猛地一喝，在连续五六杯之后停下下来，瘫坐在椅子上望着天空，长吁一口气。“哎哟，这工作总算结束了，我得好好补一觉奖励自己。”眼皮子耷拉着就这么掉下来，小李索性摊在座椅上睡着了。\n\n也不知道睡了多久，等小李睁开眼睛，却看到一个瘦削的人影在电脑旁边敲打着什么，定睛一看，原来是单位的技术宅小杨，只见他十根手指如同飓风一样快速的敲打键盘，电脑上的代码如同洪水一般决堤千里，两只眼睛没有偏离屏幕一分，生怕自己打错任何一个代码。\n\n小李凑上去瞧瞧，只看到小杨旁边的文件上面写着几个大字——<关于互联网开源项目和新型民主实践相结合的相关规定>。“开源项目？小杨，这是个什么东西？”小李好奇的问，“哦，你说这个啊，最近不是要搞民主实践吗，所以我们这些程序员就商量能不能利用互联网开源的特性给咱社会主义事业添砖加瓦，领导研究我们这几个人的方案之后，说是先看看我们能搞出什么效果，再做进一步讨论，如果做的好的话会上报中央，所以今天我就来这敲代码了。”小杨抬起头，回答道。\n\n小李随手翻了翻文件，上面满是图标，英文术语，以及更多他看不懂的计算机语言，好不容易休息的大脑又得和术语鏖战，不过，这份文件也不完全是有字天书，也有不少是小李为了给老乡解而看过的相关资料。\n\n小李合上文件，感叹的说:”你这文件可算是害苦了我，我好不容易从鏖战专业名词术语的坑跳出来，又要跳进去这个大坑。”小杨听了这话也哈哈大笑，回应到；“那得辛苦你多多理解了，不过，我敢和你打包票，我这个提议肯定能受重视，毕竟我要化用那句名言——”"
 prcs.3210.a: "“互联网是最小单位的共产主义。”"

 prcs.3211.t: "旧方法，新构想 (3)"
 prcs.3211.d: "又过了几天，村子里掀起新的风潮，大叔大妈们经常拿手机互相串门，互相交流讨论问题，一时间，频幕上经常映射着他们的笑容和疑惑。\n\n“老李，你可来了，来看看这个。”老吴招呼老李，老李正巧路过老吴家门口，疑惑的问道：“咋了，你家的鸡被偷了？”老吴嗔怪了一声，接着他说到：“哎，你这啥话，快过来看看这个。”\n\n老李一脸疑惑的进了屋子，接着，只看到老吴房间新装了台电脑，看上去非常新，应该是前几天刚装的。“哎呦我，老吴，这新电脑挺靓的啊。”“那可不，这可是咱村那个懂电脑的小杨帮忙装的。”老吴一脸得意的说，老李夸赞了一声，但接着问：“你确定你肚子里那点墨水能会玩电脑吗?”然而，老吴却一脸神秘的说：“啥，你不信?我等会给你看个东西。”\n\n老吴打开电脑上的一个app，紧接着，映入眼帘的是整个村子的3d地图，只见老吴点了他家的模型，频幕上显示出一个列表，上面清晰的记录着他家这个月的物资变动和收入变化，以及菜园温度实时检测等等数据，老李看着看着，啧啧生奇,“这玩意居然啥都知道，那我干活岂不是方便很多吗。”老吴笑道：“那当然，这样大伙开会的时候就有具体数据做支持了，更加方便做决策。”\n\n老李疑惑到：“决策？给我看看是怎么个方便法。”老吴于是打开了一个页面，上面显示了几个大字——“本周猪肉价格定价决议”，而下面显示的是村子十几条建议和一个投票，决定最后这周价格应该是多少,“你看看，这个方案能节省不少成本，这都是大伙给的建议有用，综合起来得出的最好方案。”老吴笑着说。\n\n老李由衷的佩服，这小杨小李确实是有能耐，用几天的时间，就给村子整的焕然一新，老李越看越手痒，紧接着，他打开手机，打起电话来。"
 prcs.3211.a: "“喂，小李啊，我是李叔，那啥你有时间过来吗……”"

 prcs.3212.t: "NEMS自主迭代"
 prcs.3212.d: "过去的一段时间内，NEMS从全国各地收集了海量生产数据。每座工厂的产量波动，每片农田的收成变化，每个项目的效率提升，都成为系统自我完善的养料。\n\n基于这些数据，系统已准备好进行下一阶段的优化升级。"
 prcs.3212.a: "非常好。"
