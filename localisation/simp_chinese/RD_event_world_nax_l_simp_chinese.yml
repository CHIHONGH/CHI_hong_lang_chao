l_simp_chinese:
 nax.1.t: "印共毛被消灭殆尽"
 nax.1.d: "印度安全部队在恰蒂斯加尔邦与特伦甘纳邦交界处的卡雷古塔鲁山脉展开大规模清剿行动，成功捣毁了非法武装组织“印度共产党（毛主义）”的长期核心据点。\n\n据中央武装警察部队通报，安全部队突袭了该地天然洞穴构筑的秘密要塞，击毙包括多名高级指挥官在内的30余名武装分子，并一举铲除其武器制造厂与藏匿处。现场清缴出自动步枪、榴弹发射器及大量爆炸物与补给物资。\n\n该据点曾是印共毛的核心指挥与后勤枢纽，安全部队指出，随着该要塞被完全清拆，印共毛在当地的指挥链与后勤网络遭到毁灭性打击，残余人员已被分散隔离。此举标志着印度政府在深化打击反政府武装行动中取得了里程碑式的进展。"
 nax.1.a: "这只是暂时的……"

 nax.2.t: "印共毛赢得了胜利！"
 nax.2.d: "由于印巴边境危机持续升温，印度军方不得不将部署在中央邦及中南部“红走廊”的多个精锐山地师与中央武装警察部队主力紧急调往西线部署，导致国内反恐与剿匪出现前所未有的安全真空。\n\n此前被新德里视为“已被遏制”的非法武装组织“印度共产党（毛主义）”借机发动代号为“红潮”的全面反攻。在获得东北部地方分离主义武装的战略配合后，印共（毛）武装翼“人民解放机关枪部队”避开政府军主力，迅速沿比哈尔邦与西孟加拉邦交界处推进，一举封锁了连接印度本土与东北部的唯一陆路咽喉——“西里古里走廊”。印度政府对东北部阿萨姆、曼尼普尔、阿鲁纳恰尔邦等“七姐妹邦”的后勤补给与军事指挥陷入瘫痪。\n\n外界普遍认为印共毛将迅速倒向中国，寻求中国对自己的全面支援。"
 nax.2.a: "赤色浪潮将再一次席卷亚洲！"

 nax.3.t: "战争结算"
 nax.3.d: "自20世纪60年代末纳萨尔巴里起义的枪声响起，这场被印度官方称为“国家最大内部安全威胁”的毛主义武装斗争，已在中南部“红走廊”的密林深处持续交火逾半个世纪。而今，借着印巴危机的爆发，这场漫长的决斗终于要到达了尾声。\n\n战争的结果将深刻影响南亚次大陆的走向，更关乎中国与日本带领的两大集团间对峙的未来命运。"
 nax.3.a: "我们见分晓。"