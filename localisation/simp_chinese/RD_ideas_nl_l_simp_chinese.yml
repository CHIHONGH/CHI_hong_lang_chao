 PRC_NEMS: "[PRC_NEMS]"
 PRC_NEMS_dynamic_tt: "当前等级：[?PRC_NEMS_level|.0Y]级"
 PRC_NEMS_dynamic: "[PRC_NEMS]"
 PRC_NEMS_dynamic_desc: "[PRC_NEMS_desc]"
 PRC_NEMS_LOC_1: "国家能源管理系统"
 PRC_NEMS_LOC_2: "国家经济管理系统：初掌神器"
 PRC_NEMS_LOC_3: "国家经济管理系统：推演如流"
 PRC_NEMS_LOC_4: "国家经济管理系统：算无遗策"
 PRC_NEMS_LOC_5: "国家经济管理系统：经天纬地"
 PRC_NEMS_desc_1: "在电力系统改革之后，我们可以在现有技术架构上，强化电网的智能化控制能力，依托高精度预测与动态调控技术，引入多维电价计算模型，以此构建国家能源管理系统。而这套出色运转的系统也被其他领域的同志们所眼红，开始盘算着能不能复制到其他地方去……"
 PRC_NEMS_desc_2: "成功了！经过科研工作者和中计委同志日以继夜的通力研究，我们成功将国家能源管理系统升级为一个更加宏大的系统——国家经济管理系统。通过该系统进行自动的价格核算，以帮助我们编制生产、分配、流通计划。尽管现在还有许多不尽人意的地方，但我们仍然相信它大有可为。"
 PRC_NEMS_desc_3: "随着交易信息化平台的全面铺开，大宗商品交易与各生产单位的库存供需被源源不断地汇入系统。现在的国家经济管理系统不再只是静态地核算价格，而是能够对全社会的商品流通进行动态推演与模拟。通过对物资流动趋势的精确预判，供需错配现象被大幅削减，物资调度的效率迎来了质的飞跃。"
 PRC_NEMS_desc_4: "全国性工业物联网的建成，宛如为国家经济管理系统铺设了无数敏锐的神经末梢，大到一座千万吨级钢铁厂的产能跨季度调度，小到车间里单个零件加工时的实时能耗与磨损，都被纳入了系统的精密计算之中。庞大的算力结合无孔不入的传感网络，让我们的经济调控真正做到了“算无遗策”。"
 PRC_NEMS_desc_5: "我们做到了！国家经济管理系统在我们不懈的努力下真正做到了有着经天纬地之能。在它的帮助下，祖国的第一、第二、第三产业的数据实现了完美的动态平衡，每一分资源的投入都转化为最切实的人民福祉。我们终于凭借着不屈的探索精神与科技伟力，在人类史上树立了一座不朽的丰碑。"
