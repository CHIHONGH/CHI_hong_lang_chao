 PRC_chinese_space_age_dynamic_desc: "\n\n\n\n\n£GFX_PRC_chinese_space_age_banner\n\n\n\n\n\n“坐地日行八万里，巡天遥看一千河。”\n\n旧世界的能源秩序在沙特内战的烽火中寸寸崩解，石油危机掀起的惊涛骇浪，让旧有依赖掠夺性的能源秩序彻底崩溃；这也标志着后冷战时代能源发展道路的终结——在今天，与其争夺地壳中的最后一桶石油，不如到太空中开掘无尽的宝藏：太空蕴藏着高品位金属、氦-3聚变燃料、永不枯竭的太阳能等珍贵资源。况且，这无限广袤的疆域不是帝国主义的私产，也不应当是帝国主义的私产，而是属于全世界无产阶级。"

