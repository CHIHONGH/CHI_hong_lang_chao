 PRC_research_dynamic: "中国科学"
 PRC_research_dynamic_desc: "\n\n\n\n\n£GFX_PRC_research_banner\n\n\n\n\n\n§C“可上九天揽月，可下五洋捉鳖。”§! \n\n在党的领导下，科学事业从不囿于书斋的清谈，而是亿万人民改天换地、固边强基、铸盾砺剑的炽热实践。从“两弹一星”挺起民族脊梁，到载人航天、深海探秘迈向星辰大海；从粮棉丰产养活苍生，到数字浪潮重塑山河——科学每向前一步，社会主义的根系便向下深扎一尺。每一克铀矿释放的能量、每一度电流奔涌的脉搏、每一名劳动者迸发的智慧，都在熔铸成捍卫和平的铜墙铁壁。\n\n中国科学的发展史，从来不是某个帝国的技术霸权史，而是全人类携手奔赴星辰大海的壮阔序章。"
