 RAJ_be_fucked_by_NAX_idea_desc: "“我不明白，为什么大家都在谈论着项羽被困垓下，仿佛这中原古战场对我们注定了凶多吉少。二十年前，我从徐州踏上征途，开始了第二次北伐，中华秋海棠叶遂归于一统。本党本军所到之处，民众竭诚欢迎，真可谓占尽天时，那种勃勃生机、万物竞发的境界，犹在眼前。短短二十年之后，这里竟至于一变而成为我们的葬身之地了么？”——蒋介石"

