 PRC_socialist_culture_dynamic: "中国社会主义文化"
 PRC_socialist_culture_dynamic_desc: "\n\n\n\n\n£GFX_PRC_socialist_culture_banner\n\n\n\n\n\n§R文艺为工农兵服务，为无产阶级政治服务。§!\n\n在中华民族最艰难的岁月里，文艺战线与军事战线并列为革命的两条重要战线。毛泽东同志在延安文艺座谈会上明确指出：“为什么人的问题，是一个根本的问题，原则的问题。这一论断，奠定了社会主义文化坚定不移的立场——扎根于无产阶级和人民大众，服务于占人口绝大多数的工农兵群众。\n\n步入新时代的文化建设征程，党和人民始终将文艺工作熔铸于革命事业的整体布局，使文化战线成为整个革命机器中不可或缺的强劲齿轮。在这面光辉旗帜的引领下，广大文艺工作者深入工农兵的火热生活，投身于革命斗争的激流，在淬炼中完成立场的根本转移，用心用情创作出真正属于工农兵的文艺、真正闪耀社会主义光芒的文艺。"
