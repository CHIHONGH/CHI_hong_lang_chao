 PLA_military_and_political_reform_dynamic: "人民解放军军政改革"
 PLA_military_and_political_reform_dynamic_desc: "\n\n\n\n\n£GFX_PLA_military_and_political_reform_banner\n\n\n\n\n\n§9“兵权之所在，则随之以兴；兵权之所去，则随之以亡。”§!\n\n这是一场深彻肌骨、重塑筋骨的革命性变革，熔铸人民军队的灵魂与命脉。在党的绝对领导下，人民解放军全面推进军政体系革命性改革，以政治建军为灵魂，以备战打仗为牵引，彻底破除旧式军事窠臼。各级党组织核心作用空前强化，政治工作生命线贯穿全军，官兵民主蔚然成风，士兵委员会畅通建言渠道，军事民主、政治民主、经济民主贯穿日常训练与战备生活。人民军队在革命斗争中永葆本色，军政军民团结空前巩固，枪杆子始终牢牢掌握在党和人民的手中，化作赤色江山之磐石——这是人民军队的第二次“古田新生”，是政治建军与群众路线的永恒胜利。"
