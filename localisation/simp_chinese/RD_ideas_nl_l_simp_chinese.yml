 PRC_road_to_people_democracy_dynamic: "人民民主之路"
 PRC_road_to_people_democracy_dynamic_desc: "\n\n\n\n\n£GFX_PRC_party_rectification_campaign_banner\n\n\n\n\n\n§R“我们已经找到新路，我们能跳出这个周期率。这条新路，就是民主。只有让人民来监督政府，政府才不敢松懈。只有人人起来负责，才不会人亡政息。”§!\n\n在伟大的中国共产党的坚强领导下，中国人民彻底挣脱了旧时代一切剥削阶级的枷锁，开辟了一条属于劳动人民的民主道路。这条道路不是资产阶级用以掩盖阶级统治的虚伪形式民主，而是以无产阶级专政为本质、以工农联盟为基础的全过程人民民主，国家政权牢牢掌握在人民手中，一切权力属于人民。在党的旗帜下，亿万人民正以排山倒海之势，沿着这条无可阻挡的人民民主之路，向着共产主义的伟大理想阔步前进。"
