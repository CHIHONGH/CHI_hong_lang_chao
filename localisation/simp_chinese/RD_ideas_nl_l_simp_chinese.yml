########经济民族精神########
 PRC_made_in_china_new_left_dynamic: "自动化社会主义之梦"
 PRC_made_in_china_new_left_dynamic_desc: "\n\n\n\n\n£GFX_PRC_made_in_china_new_left_banner\n\n\n\n\n\n§t“只有在生产受社会实际的预定的控制的地方，社会才会在用来生产某种物品的社会劳动时间的数量和要由这种物品来满足的社会需要的规模之间，建立起联系。”§!\n\n在自动化社会主义的理想图景之下，计划与算法交织，工厂与田野同频，劳动不再是异化的枷锁，而是自由自觉的创造。过剩的物产如泉水涌流，却不见浪费的阴影；每一个人的需求被精确聆听，每一种才能被充分唤醒。闲暇时光里，图书馆灯火不眠，剧场掌声不息，邻里共议社区治理，孩童在绿荫下追问星辰。物质丰裕如大地般坚实，精神昂扬如晨光般透亮——这不是乌托邦的幻影，而是自觉历史主体用双手编织的日常。在这座自动运转的大厦中，生产服务于人，人不再是统计报表上的符号，而是生产的目的本身。必然王国向自由王国的飞跃，正悄然发生在每一日平凡而伟大的劳作之中。"
