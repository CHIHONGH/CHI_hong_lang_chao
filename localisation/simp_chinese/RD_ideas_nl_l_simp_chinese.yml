 PRC_PLA_masterwork_dynamic_desc: "\n\n\n\n\n£GFX_PRC_PLA_masterwork_banner\n\n\n\n\n\n§3“中国人民有志气，有能力，一定要在不远的将来，赶上和超过世界先进水平。”§!\n\n“租不如买，买不如造”，在党的坚强领导下，我国尖端武器研发始终锚定世界科技前沿，坚持独立自主、自立更生，打破外部技术封锁与战略遏制，不迷信所谓“西方标准”，不屈服于任何技术霸权。每一枚制导火箭、每一架隐身战鹰、每一套防空利剑，都是红色工程师用计算尺和代码堆出的脊梁。装备可以更新，但灵魂永远不变——党指向哪里，尖端力量就打向哪里。"
