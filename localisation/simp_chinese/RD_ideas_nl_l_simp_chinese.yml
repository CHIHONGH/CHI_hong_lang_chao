 PRC_WLI_modifiers_desc: "\n\n\n\n\n£GFX_PRC_WLI_banner\n\n\n\n\n\n这是一个全新的国际组织，它既继承了过去国际共运的光荣传统，又超越了旧时代的局限。它不会再是某个大国横加干涉的工具，而是全球被压迫者的联合体。每一个加入的国家，都会让这个组织的力量更加强大；每一面红旗的飘扬，都会让这个组织的影响更加深远。这是一个真正属于无产阶级，属于人民的国际组织。"
