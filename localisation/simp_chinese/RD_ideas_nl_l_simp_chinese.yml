 PRC_communist_party_of_china: "中国共产党"
 PRC_party_rectification_campaign_empty: "党的组织：二次整风"
 PRC_party_rectification_campaign_dynamic: "党的组织：二次整风"
 PRC_party_rectification_campaign_dynamic_desc: "\n\n\n\n\n£GFX_PRC_party_rectification_campaign_banner\n\n\n\n\n\n§R“只要我们党的作风完全正派了，全国人民就会跟我们学。中国的改革和建设靠我们来领导，所以要整风，现在要整风，将来还要整风。”§!\n\n思想建党、理论强党，是百年大党永葆生机的关键所在。在过去的整风运动中，毛泽东同志肃整了党内的风气，在文风、学风、党风上均取得巨大胜利，确定了党的总路线。如今，随着我们走出新道路，一场新时代的整风运动势在必行。新时代党的建设新的伟大工程，继承延安整风确立的理论联系实际、密切联系群众、批评和自我批评的三大优良作风，以整风精神推进思想淬炼、政治历练、实践锻炼。全党上下坚持实事求是、真理标准，在坚持真理、修正错误中不断巩固党的团结统一，用马克思主义真理武装全党，推动党的建设和事业发展不断取得新成就。\n\n§3“要知道，一个队伍经常是不大整齐的，所以就要常常喊看齐。”§!\n\n§t“只要我们共产党的队伍是整齐的，步调是一致的，任何强大的敌人都是能被我们打倒的。”。§!"
 PRC_party_rectification_campaign_twother_dynamic: "党的组织：暗潮涌动"
 PRC_party_rectification_campaign_twother_dynamic_desc: "\n\n\n\n\n£GFX_PRC_party_rectification_campaign_banner0\n\n\n\n\n\n自台海战争胜利以来，就有无数迹象显示着党中央将发动一场史无前例的二次整风运动，而与此同时，各种盘根错节的腐败集团也开始暗中串联，准备对抗这一趋势。从中央到地方，从政府到民间，无不是暗潮涌动，山雨欲来。\n\n当整顿干部队伍的指令自中南海下发，新一轮的政治风暴席卷了全党上下。而各路牛鬼蛇神也不甘坐以待毙，他们开始动用一切可能的关系网络，试图对抗来自四面八方的压力。无论如何，一场将决定全党全国前途命运的大戏已然缓缓揭开幕布，唯一的问题是：你在哪一边？\n\n§R“总之，我们不要四面出击。四面出击，全国紧张，很不好。我们绝不可树敌太多，必须在一个方面有所让步，有所缓和，集中力量向另一方面进攻。”§!"
 PRC_party_rectification_campaign_another_dynamic: "党的组织：盘根错节"
 PRC_party_rectification_campaign_another_dynamic_desc: "\n\n\n\n\n£GFX_PRC_down_with_bureaucracy_banner\n\n\n\n\n\n§R“三分之一的基层领导权不在我们手里，究竟有多少，现在你们也不摸底。三分之一，一不包括思想认识问题的，二不包括一般的多吃多占的，就是那些依靠百分之五、不依靠百分之九十五的。三分之一，几年来没有抓，第一怪我们没有抓，第二怪他们自己。”§!\n\n即使是到了二十一世纪，党内还依然存在着派系林立、条块分割，地方与中央、军政与民政之间，形成了无数隐形的“权力藩篱”。这支曾以“革命熔炉”自居的队伍，正在悄然演变为一个封闭、僵化且利益交织的“权力复合体”。地方与部门的本位主义在“统一领导”的帷幕下潜滋暗长，表面严整的科层体系内部充斥着错综复杂的派系网络与心照不宣的“圈子文化”。革命的初心在无休止的协调与内耗中被严重稀释，政治肌体正遭受着“组织肥大症”与“丧失理想信念”的双重侵蚀。若再不从根基上刮骨疗毒，党就要被自己的阴影吞没。"
 PRC_party_rectification_campaign_throther_dynamic: "党的组织：自我革命"
 PRC_party_rectification_campaign_throther_dynamic_desc: "\n\n\n\n\n£GFX_PRC_down_with_bureaucracy_banner3\n\n\n\n\n\n通过延续并扩大习时期的政策，建立相应的监察制度，旧有的利益网络已经粉碎；中央执掌的监察利剑高悬于官员头顶，而中央对于基层治理的效率，已经优化到如臂指使的程度。\n\n党不谋私利的性质已经有了彻底的自我革命精神；§7党通过自我革命，已经跳出了历史周期律。党如今的生机与活力是从来没有过的。§!"
 PRC_party_rectification_campaign_fother_dynamic: "党的组织：人民公仆"
 PRC_party_rectification_campaign_fother_dynamic_desc: "\n\n\n\n\n£GFX_PRC_down_with_bureaucracy_banner2\n\n\n\n\n\n通过扩大人民监督权，让建议箱真正有用；厉行反腐，利用利益相关外的人手与机构进行大规模连根拔起的强硬举措，旧有的利益网络已经粉碎。人民的监督权得到了扩大，官僚队伍以更为负责的态度与精神投入工作，并且敢于相互进行监督，我们的党员已然拥有“人民公仆”的风气。\n\n共产党员是在不断同反革命的斗争中去改造社会，改造世界，同时改造自己的。党员不能脱离群众，特别是无产阶级群众的实际革命运动。\n\n§6而今，党与群众真正联系在了一起。党员成为群众真正的代表，党如今的生机和活力是从来没有过的。§!"
 PRC_party_rectification_campaign_fither_dynamic: "党的组织：二次四清"
 PRC_party_rectification_campaign_fither_dynamic_desc: "\n\n\n\n\n£GFX_PRC_down_with_bureaucracy_banner1\n\n\n\n\n\n党真正具备了刮骨疗毒的决心，新的四清运动涤荡的旧有的腐朽系统。人民群众同党的步伐一致，扫除了思想领域的腐朽——阶级斗争扩大到了官僚队伍，多数旧体系官僚已然被扫除，而余下的反动分子亦两股战战，我们的革命风貌焕然一新，我们走在大路上。\n\n党的领导与群众相结合，党员干部从群众中来，到群众中去。在过去，党或许曾失去过代表无产阶级利益的决心，而现在，我们已经将它重新拾起。§G党如今的生机与活力是从来没有过的。§!"

