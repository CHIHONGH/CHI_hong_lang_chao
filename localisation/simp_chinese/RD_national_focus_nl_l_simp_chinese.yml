 WLI_red_flag_flying_high: "红色旗帜，高高升起"
 WLI_red_flag_flying_high_desc: "战火与革命的洗礼让红旗在东方与全世界高高飘扬。我们将肩负起历史赋予的使命，将联合阵营的伟业推向新的高度。"

 WLI_community_with_shared_future: "赓续人类命运共同体"
 WLI_community_with_shared_future_desc: "面对复杂的国际局势，独木不成林。唯有构建紧密相连的命运共同体，深化多边协作，方能共同应对未知的风浪与挑战。"

 WLI_joint_anti_terrorism_operations: "联合反恐行动"
 WLI_joint_anti_terrorism_operations_desc: "极端势力与反动武装威胁着加盟国的安宁。我们将组建跨国联合反恐情报与行动网络，坚决消灭一切破坏和平与稳定的反动分子。"

 WLI_anti_corruption_international_cooperation: "反腐败国际合作"
 WLI_anti_corruption_international_cooperation_desc: "腐败是侵蚀革命成果的毒瘤。通过跨国引渡、资产追缴与执法联动，建立透明高效的联合防腐与打击机制。"

 WLI_expand_multilateral_poverty_alleviation: "拓展多边减贫合作"
 WLI_expand_multilateral_poverty_alleviation_desc: "消除贫困是实现真正自由与平等的基石。我们将整合区域资源，推广先进农业技术与基建经验，让发展的红利惠及广大人民群众。"

 WLI_common_foreign_policy: "共同外交政策"
 WLI_common_foreign_policy_desc: "在国际舞台上以同一个声音说话。协调盟国间的外交立场，建立多边会商机制，确保我们在全球事务中掌握主动权。"

 WLI_joint_political_propaganda: "联合政治宣传"
 WLI_joint_political_propaganda_desc: "舆论阵地不去占领，敌人就会去占领。联合出版物、无线电广播与文化交流将向全世界宣扬进步理念，粉碎敌对势力的污蔑。"

 WLI_establish_world_liberation_arbitration_agency: "设立世界解放仲裁机构"
 WLI_establish_world_liberation_arbitration_agency_desc: "成员国之间的摩擦应当通过公正、民主的内部协商加以化解。设立最高仲裁机构，以和平契约取代内部矛盾。"

 WLI_establish_world_liberation_secretariat: "设立世界解放秘书处"
 WLI_establish_world_liberation_secretariat_desc: "为了确保各项决议高效落实，我们需要一个常设的行政执行机关。世界解放秘书处的成立将极大提升行政协调与资源调度效率。"

 WLI_establish_world_liberation_supervisory_commission: "设立世界解放监督委员会"
 WLI_establish_world_liberation_supervisory_commission_desc: "权力必须在监督下运行。监督委员会将负责审查各项联合决议的执行情况，防止官僚主义与滥用职权。"

 WLI_convene_world_liberation_congress: "召开世界解放大会"
 WLI_convene_world_liberation_congress_desc: "各加盟国代表与进步力量齐聚一堂，共商大计。这次历史性的大会将明确我们的核心路线与长远战略方向。"

 WLI_red_sun_shines_bright: "红日高照"
 WLI_red_sun_shines_bright_desc: "坚持核心领导力量的集中统一，强化中央权威，确保在面临严峻外部考验时能够做出快速、果断的重大决策。"

 WLI_stars_revolve_around_the_moon: "众星拱月"
 WLI_stars_revolve_around_the_moon_desc: "强调多边平等协商与各地方、各成员的自主性，在广泛民主的基础上达成共识，凝聚最强大的联合阵线。"

 WLI_unite_and_look_forward: "团结一致向前看"
 WLI_unite_and_look_forward_desc: "摒弃历史包袱与过往分歧，将全体成员的智慧与力量统一到共同的目标上来，开创属于未来的新篇章。"

 WLI_thorough_discussion: "充分讨论"
 WLI_thorough_discussion_desc: "畅所欲言，集思广益。在重大战略制定前进行全面深入的研讨，尊重不同的声音，使决策更加科学与严密。"

 WLI_unanimous_action: "行动一致"
 WLI_unanimous_action_desc: "决策一旦形成，就必须步调一致、雷厉风行地贯彻执行。铁的纪律是战胜一切艰难险阻的根本保证。"

 WLI_each_in_their_own_beauty: "各美其美，美美与共"
 WLI_each_in_their_own_beauty_desc: "尊重不同国家与民族的历史文化差异，在保持多元特色的同时实现和谐共处，共同构建繁荣多样的进步世界。"

 # ==========================================
 # 侧枝：一带一路 / 文化
 # ==========================================
 WLI_deepen_belt_and_road: "深化“一带一路”合作"
 WLI_deepen_belt_and_road_desc: "铺设连接大洋与大陆的交通干线与物流枢纽，打通区域经济的任督二脉，实现互联互通与共同富裕。"

 WLI_reform_confucius_institutes: "改革孔子学院"
 WLI_reform_confucius_institutes_desc: "将文化交流机构转型为促进科技、学术与文明互鉴的现代化平台，进一步增强国际文化吸引力与软实力。"

 # ==========================================
 # 左侧：军事指挥分支
 # ==========================================
 WLI_joint_command_center: "联合指挥中心"
 WLI_joint_command_center_desc: "面对潜在的军事威胁，分散的指挥体系难有胜算。设立统一的联合指挥中心，全面统筹战术规划与兵力部署。"

 WLI_share_military_intelligence: "共享军事情报"
 WLI_share_military_intelligence_desc: "打破各军种与加盟国之间的情报壁垒，建立高频次、高精度的情报共享网络，做到知己知彼、百战不殆。"

 WLI_standardize_equipment: "装备标准化"
 WLI_standardize_equipment_desc: "统一轻重武器弹药口径、零部件规格与通信协议，大幅简化前线后勤补给复杂度，提高战场通用性。"

 WLI_command_system_reform: "指挥体制改革"
 WLI_command_system_reform_desc: "摒弃陈旧迂腐的军阶壁垒，推行扁平化、现代化的联合参谋指挥体制，提升各级军官的战场应变能力。"

 WLI_expand_depot_network: "拓展补给网"
 WLI_expand_depot_network_desc: "兵马未动，粮草先行。在前线与要冲构建节点式补给枢纽与铁路网络，确保大兵团作战时的物资绵延不绝。"

 WLI_military_industrial_cooperation: "军工合作"
 WLI_military_industrial_cooperation_desc: "整合各加盟国的军工产能与原材料优势，建立跨国国防工业复合体，实现先进武器装备的规模化量产。"

 WLI_joint_military_exercises: "联合军事演习"
 WLI_joint_military_exercises_desc: "举行海陆空联合实兵演习，磨合不同部队之间的协同作战能力，向潜在敌人展示捍卫和平的坚定意志。"

 WLI_coordinated_military_training: "协调军事训练"
 WLI_coordinated_military_training_desc: "统一各部队的训练大纲与战术教范，设立联合军事院校，为全军培养高素质的基层指挥官与技术骨干。"

 WLI_eagle_strikes_the_sky: "鹰击长空"
 WLI_eagle_strikes_the_sky_desc: "鹰击长空，勇夺制空权。加大对新式战机研制与飞行员培养的投入，构建覆盖战区的立体空中防御与打击网。"

 WLI_fish_glides_in_deep: "鱼翔浅底"
 WLI_fish_glides_in_deep_desc: "鱼翔浅底，潜浪制海。发展现代化潜艇部队与水面战舰，确保海上交通线的安全与对远洋敌舰的有效威慑。"

 WLI_wind_rolls_red_flag: "狂飙卷红旗"
 WLI_wind_rolls_red_flag_desc: "狂飙突进，红旗翻卷！将海陆空三军力量高度整合，形成排山倒海般的立体突击能力，一举粉碎敌人的防御。"

 WLI_unified_command: "统一指挥"
 WLI_unified_command_desc: "战时将所有盟军部队归于统一的最高统帅部指挥，实现指令的绝对集中与高效下达，发挥最大战术效能。"

 WLI_joint_action: "联合行动"
 WLI_joint_action_desc: "在保留各部队自主性的同时建立高水平的战术协同机制，灵活应对复杂多变的局部战场环境。"

 WLI_towards_common_victory: "走向共同胜利"
 WLI_towards_common_victory_desc: "无论是战术上的攻坚还是战略上的持久战，我们都将并肩作战，直到彻底击败所有反动敌人，赢得最终胜利。"

 WLI_rebirth_of_international_brigades: "国际纵队重生"
 WLI_rebirth_of_international_brigades_desc: "来自世界各地的志愿战士再次集结在正义的旗帜下。重组国际纵队，为捍卫自由与正义而战！"

 # ==========================================
 # 右侧：世解经贸合作分支
 # ==========================================
 WLI_deepen_world_liberation_economic_cooperation: "深化世解经贸合作"
 WLI_deepen_world_liberation_economic_cooperation_desc: "经济是战争与和平的物质基础。建立互利共赢的区域经济合作架构，打破敌对势力的经济封锁。"

 WLI_industrial_aid: "工业援助"
 WLI_industrial_aid_desc: "向重工业基础薄弱的盟友提供成套工业设备与技术支持，协助其快速建立自主的民用与军用工业体系。"

 WLI_technical_assistance: "技术援助"
 WLI_technical_assistance_desc: "派遣工程技术人员与专家团队，协助盟国攻克关键工业与科研瓶颈，实现技术成果的共享。"

 WLI_international_tariff_agreement: "国际关税协定"
 WLI_international_tariff_agreement_desc: "削减加盟国之间的贸易壁垒与关税，促进原材料、工农业产品与设备的顺畅流通，激活市场活力。"

 WLI_establish_joint_research_institutions: "设立联合科研机构"
 WLI_establish_joint_research_institutions_desc: "集中各加盟国的顶尖科学家与科研资源，建立联合实验室与研究院，攻克重大基础科学与应用技术难题。"

 WLI_establish_world_liberation_central_bank: "设立世界解放中央银行"
 WLI_establish_world_liberation_central_bank_desc: "建立跨国金融调控与结算中心，稳定成员国汇率，提供低息建设贷款，抵抗外部金融风暴的冲击。"

 WLI_unified_market: "统一市场"
 WLI_unified_market_desc: "消除一切行政与区域性市场分割，打造规模庞大的内部统一市场，释放巨大的工业与消费潜力。"

 WLI_unified_currency: "统一货币"
 WLI_unified_currency_desc: "推出区域联合结算货币，摆脱对霸权国家货币的依赖，建立自主可控的国际货币结算体系。"

 WLI_build_integrated_economic_circle: "构建一体化经济圈"
 WLI_build_integrated_economic_circle_desc: "深度整合产业链与供应链，形成分工明确、高效协同的区域一体化经济圈，奠定强大的物质基础。"

 WLI_expand_international_division_of_labor: "扩大国际分工"
 WLI_expand_international_division_of_labor_desc: "根据各国的自然资源、地理优势与产业基础进行合理分工，避免重复建设，大幅提升整体生产效率。"

 WLI_coordinated_development_plan: "协调发展计划"
 WLI_coordinated_development_plan_desc: "制定五年期区域总体发展规划，引导资金与资源向关键领域集中，实现整体经济的稳步增长。"

 WLI_military_supplies_first: "军需优先"
 WLI_military_supplies_first_desc: "面对严峻的外部威胁，优先将经济资源向军工生产与后勤保障倾斜，为前线提供源源不断的物资支持。"

 WLI_livelihood_first: "民生优先"
 WLI_livelihood_first_desc: "发展的根本目的是改善人民生活。优先保障粮食、住房、医疗与日用品供应，筑牢稳定的社会后方。"

 WLI_staggered_development: "错位发展"
 WLI_staggered_development_desc: "鼓励各区域发展特色优势产业，避免同质化竞争，形成互补共生的多样化经济生态。"

 WLI_urban_rural_bridging: "以城带乡"
 WLI_urban_rural_bridging_desc: "利用工业与城市的辐射带动作用，支持农村与欠发达地区发展，缩小城乡与区域差距。"

 WLI_adapt_to_local_conditions: "因地制宜"
 WLI_adapt_to_local_conditions_desc: "不搞“一刀切”，根据不同地区实际情况制定差异化的经济发展策略，务实高效地推进现代化建设。"

 # ==========================================
 # 底层总收尾国策
 # ==========================================
 WLI_earth_shaking_heroic_song: "换了人间"
 WLI_earth_shaking_heroic_song_desc: "为有牺牲多壮志，敢教日月换新天。在政治、军事与经济的全面飞跃下，我们创造了伟大的奇迹，一个公平、繁荣、强大的新世界已经诞生！"