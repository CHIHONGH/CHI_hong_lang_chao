 APC_day_of_liberation_desc: "长久以来，亚太地区的广袤土地一直笼罩在殖民主义与帝国主义的阴影之下，人民的血汗被无情地榨取，尊严被肆意地践踏。但今天，历史的洪流终于汇聚成了不可阻挡的雷霆，我们要向全世界宣告：解放的时刻已经到来！这不仅是一个日期的更替，更是一个旧时代的终结。我们将撕碎那些不平等的枷锁，建立一个属于劳动者自己的新秩序。亚太人民将不再是他人棋盘上的棋子，而是掌握自身命运的主人，正义的火种将从这里燃遍整个大洋。"
 APC_summon_comrades_desc: "在伟大的事业面前，没有谁是孤岛。我们要向潜伏在各地的革命志士发出最响亮的号召，跨越山海的阻隔，将散落在亚太各角落的红色星火汇聚成燎原之势。这不仅是权力的集结，更是信念的共鸣。我们要建立起严密的组织网络，让每一名同志都能找到属于自己的战斗位置。当这些拥有共同理想的人们紧紧握手之时，任何腐朽的阶级堡垒都将在这种团结的力量面前颤抖，我们将共同书写人类解放史上的崭新篇章。"
 APC_guide_allied_military_desc: "团结的力量需要科学的统筹与专业的指导。作为革命的先驱，我们有责任将宝贵的实战经验与先进的战略战术分享给我们的盟友们。我们要派遣最精锐的军事顾问团，帮助兄弟国家的军队建立起现代化的指挥体系与后勤保障，将那些自发的反抗力量转化为纪律严明、战力强悍的革命武装。只有当亚太各国的军事力量形成协同一致的重锤时，我们才能在未来的大战略博弈中，给予帝国主义阵营以致命的痛击，确保解放的成果坚不可摧。"
 APC_solve_reactionaries_desc: "革命的道路从不平坦，那些妄图开历史倒车的顽固反动派，是潜伏在社会深处的毒瘤。他们勾结外部势力，疯狂破坏生产，试图在黎明前夕发动垂死挣扎。我们绝不能有丝毫的慈悲与动摇，必须以雷霆万钧之势，彻底肃清这些阶级敌人。通过建立高效的甄别体系与人民法庭，我们要将那些盘踞在权位上的贪官污吏与封建余孽一扫而空。这不仅是一场肉体上的消灭，更是一场社会结构的重组，我们要让反动思想彻底失去滋生的土壤。"
 APC_international_brigades_desc: "正义的事业从不缺乏志同道合的国际友人。我们要向全球无产阶级发出倡议，组建规模宏大的国际纵队，让那些不远万里而来的热血青年在亚太的战场上挥洒汗水。这些跨越国界的战士们将带来多元的技术与视野，更将这种国际主义精神深植于我们的土地。他们是反法西斯与反霸权斗争的象征，是连接我们与世界革命中心的纽带。通过这支混编的精锐力量，我们将向世界证明：亚太人民的解放是全球正义事业不可分割的核心组成部分。"
 APC_hundred_millions_one_heart_desc: "当亿万人民的意志汇聚成同一个声音，当无数个体的跳动凝聚成同一个脉搏，这世界上便再也没有任何力量能够阻挡我们。我们要通过深度的社会动员与思想建设，让每一个公民都意识到自己是国家与民族的主人。无论是工厂里的学徒，还是田间地头的农夫，亦或是前线的战士，大家都在为同一个目标——建设繁荣稳定的亚太新秩序——而奋斗。这种前所未有的民族凝聚力，将使我们的国家机器在任何极端压力下都能保持超高频的运转，创造出令敌人胆寒的建设与战争奇迹。"
 APC_opening_action_korea_desc: "半岛的局势是整个亚太平衡的支点，也是我们战略布局的首要突破口。我们要发起一次精准而迅猛的“开场行动”，彻底打破那条人为划定的军事分界线，让被隔绝数十载的人民重新拥抱在一起。通过政治诱导与军事压力的双重作用，我们要将这个半岛转化为我们战略纵深的坚固前哨。这不仅是为了消除眼前的威胁，更是为了向南方的反对派们释放一个明确的信号：旧时代的势力范围已经不复存在，亚太的新局势将由我们亲手开启，而半岛的红旗将是第一道亮丽的风景。"
 APC_operation_downfall_japan_desc: "针对那个曾给亚洲人民带来无尽痛苦的海岛邻国，我们要实施彻底的“没落行动”。这不是为了简单的复仇，而是为了从根源上铲除军国主义复活的温床。我们要利用海空优势封锁其贸易航线，瓦解其工业基础，并最终在其本土建立起一个服务于人民利益的新政府。我们要让那些曾经的财阀与右翼政客彻底退出历史舞台，将日本从帝国主义的走狗转化为亚太和平秩序的积极参与者。当樱花再次盛开时，它应当见证的是一个摆脱了枷锁、回归人民怀抱的文明国度。"
 APC_dive_action_india_desc: "喜马拉雅山的南麓正在酝酿着深刻的变化。针对南亚次大陆这个庞大的地缘板块，我们要实施具有高度机动性的“俯冲行动”。通过支持当地的社会公平运动和基础设施的全面互联，我们要打破那些腐朽的种姓制度与封建残余对生产力的禁锢。这不仅是一次地缘影响力的扩张，更是一次伟大的文明重塑。我们要与南亚的人民建立起深厚的战略伙伴关系，将这个人口密集的市场与劳动力池纳入我们的新秩序，让亚太的共同繁荣不再有死角，让真理的阳光照亮每一座恒河边的城市。"
 APC_flip_action_anzac_desc: "那些孤悬海外、长期受制于西方霸权的南部领土，也是我们蓝图中的关键拼图。通过政治渗透与经济诱饵的精巧组合，我们要实施旨在改变其战略底色的“翻转行动”。我们要让那些身处澳洲与新西兰的民众意识到，跟随老旧的殖民体系只会走向衰落，而加入欣欣向荣的亚太大循环才是唯一的出路。通过外交博弈与民意引导，我们要让这些国家从西方在南太平洋的哨所转变为我们新秩序的友好节点，彻底切断帝国主义从南向北渗透的触角，实现亚太海权的全面翻转。"
 APC_final_act_usa_desc: "所有的博弈终将指向最后的大洋对岸。为了迎接那场决定人类未来走向的“终幕行动”，我们需要进行最周密的战略储备与舆论铺垫。我们要从金融、技术与社会思潮等多个维度，对那个试图阻碍历史进步的全球霸权进行持续性的解构。当我们的体系变得足够强大，当对方的内部矛盾变得不可调和，最后的摊牌将不再是惨烈的对撞，而是文明秩序的自然更替。我们将以一种无可辩驳的姿态，宣告霸权时代的彻底终结，让公平与正义的旗帜在全世界的上空高高飘扬。"
 APC_pla_max_readiness_desc: "为了捍卫来之不易的革命果实，为了应对随时可能爆发的外部武装干涉，我们的人民军队必须进入“最高战备”状态。这意味着从指挥中枢到每一个基层班组，都要保持二十四小时不间断的警戒与响应能力。我们要将最前沿的科研成果迅速转化为实战装备，提升陆海空三军的数字化协同水平。这不是为了穷兵黩武，而是为了确保当敌人的第一枚炮弹落地时，我们能以雷霆之势将其彻底粉碎。这种紧绷的弓弦，是亚太秩序最坚实的盾牌，让一切侵略者在我们的军威面前望而却步。"
 APC_wartime_production_desc: "现代战争是工业实力的终极比拼。我们要以最快的速度将国家的工业重心转移到战时轨道，实现工厂的二十四小时连轴转。通过优化资源配给与行政审批，我们要让每一颗子弹、每一台引擎、每一枚芯片都能以最高效率产出并送达前线。我们要建立起一套密不透风的工业防御体系，确保即便在极端的封锁环境下，我们的生产线依然能像钢铁之心一样强劲搏动。这种源源不断的物资供应，将把我们的军队武装到牙齿，让对手在我们的总体战洪流中感到绝望与窒息。"
 APC_coastal_defense_desc: "浩瀚的大洋是我们的屏障，也可能是敌人的通道。为了将侵略者阻挡在国门之外，我们要建立起一套多维度、全方位的海岸防御体系。从深埋在礁石下的远程岸炮，到密布在海面下的智能水雷阵，再到巡航在领海空域的岸基反舰导弹，我们要将漫长的海岸线打造成一道坚不可摧的“钢铁长城”。我们要通过对近海海域的绝对控制，粉碎任何试图进行强行登陆或海上封锁的企图。这不仅是领土的防线，更是亚太主权的边界，任何敢于越雷池一步的势力都必将沉没在冰冷的海水中。"
 APC_mobilize_militia_desc: "战争的伟力存在于民众之中。除了正规军的利剑，我们还要唤醒那支无处不在的人民民兵。通过广泛的军事训练与爱国教育，我们要让每一个健康的成年公民都具备基本的战斗素质与情报意识。民兵组织将深入到社会的每一个工厂、每一所学校、每一片街区，构建起一张天罗地网，让潜伏的间谍无处遁形，让入侵的散兵陷入人民战争的汪洋大海。这种全民皆兵的动员力，是我们最强大的非对称战略威慑，它向全世界宣告：想要战胜我们，就必须面对数亿人民钢铁般的抵抗意志。"
 APC_trial_by_fire_desc: "正如真金不怕火炼，一个真正的强国必须在最严酷的考验中证明自己的成色。当战火连天、危急四伏之时，正是我们民族魂魄得到最终升华的时刻。这项国策象征着我们在血与火的洗礼中，完成了从苦难到辉煌的终极跨越。我们要在这场“烈火”中剔除那些虚弱与动摇的成分，锻造出一个逻辑自洽、意志坚如磐石的新亚太共同体。当我们最终走出硝烟，看到的将是一个不仅在军事上获胜、更在思想与制度上领先于时代的伟大文明。这是历史赋予我们的加冕礼，也是我们不朽的功勋章。"

# 战后国策内容
 PRC_nl_red_dawn: "§R红色黎明§!"
 PRC_nl_red_dawn_desc: "§R我们共产党人§!\n§H在此向寰宇庄严宣誓§!\n这殷切期盼与毕生奋斗的\n是让§t普天之下一切劳动者§!，§A无论肤色深浅、种族各异、出身何处，都能挣脱一切枷锁§!，§d沐浴在真正的光明里§!：\n\n§9我们要让每一双手创造的价值，都化作充裕的物质与丰盈的生活；\n我们要让每一个不屈的灵魂，都享有完整的人格与不可践踏的尊严；\n我们要让每一颗跳动的心，都拥有主宰自身命运的、不可剥夺的权利。\n为此理想，我们愿奉献此生，奋斗不息；\n为此明天，我们心潮澎湃，热泪盈眶！§!\n\n§R为共产主义事业奋斗终生！§!"

