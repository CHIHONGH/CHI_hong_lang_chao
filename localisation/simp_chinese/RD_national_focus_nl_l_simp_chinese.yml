 PRC_stimulate_economy_idea: "刺激经济"
 PARTY_polict: "完成此国策将会解锁§Y分支§!决议："
 promote_system_reform_desc: "自中共十一届三中全会以来，党的工作中心由阶级斗争转向经济建设后，我国随着经济快速发展而逐渐扩大的贫富差距已经到了无法忽视的地步。人民汹涌的不满情绪，接踵而至的危机更是暴露了现有体制的弊病。为了人民群众的福祉，也为了党的理想存续，以胡春华同志为首的干部们寻求对现有体制进行变革，让它更符合我国的社会主义国情。"
 sail_through_the_storm_desc: "值得庆幸的是，我们已经逐渐从石油危机的阴霾中走出，经济形势重新回暖，外汇水平也开始稳定下来。许多外资也选择重新回到国内开展业务。国内光明的经济前景和高涨的民族自豪感再一次证明了，任何艰难险阻都不能击败中国人民，中国的伟大复兴已是近在咫尺。"
 energy_revolution_desc: "我们不能仅仅寄希望于恢复石油进口从而缓解国内的能源危机。通过对核能及可再生能源领域的投资，我们将依靠新时代能源为我们的经济体系和工业提供动力。" 
 optimize_extraction_technology_desc: "我国的开采业在很多时候都过于粗放，我们需要设定新的行业规定，投资新的开采技术，以此来尽最大可能充分采掘石油资源，缓解现在的情况。"
 prepare_for_20th_party_congress_desc: "前事已尽，习近平已经与我们达成一致，不再追求继续连任的同时会与我们进行人员对接。我们要开始准备文稿，清查数据，会见记者与人大代表。同时，准备拆开为我们准备的“上任礼物”。"
 cross_the_black_gold_wasteland_desc: "只有先行确保国内局势的稳定，才有助于我们更有效地开展改革以应对石油危机与恢复国力。中国从没有像今天这样需要团结和坚强的领导。"

 exploit_domestic_oil_desc: "在如此危急关头，我们不能继续依赖不稳定的海外石油进口渠道。我们将进一步开采我国国内的资源储备，建设更多石油钻井和加工工厂。只有这样，能源安全才能真正掌握在我们自己手中，同时还可以降低燃料的运输成本，进一步缓解经济危机的影响。"
 adopt_dynamic_zero_policy_desc: "如果不能保护人民的生命免遭病毒的威胁，那么党和政府的合法性将会受到严重质疑。此外，我们在病毒扩散初期采取的严格措施也被证明相当有效。任何想要中国现在放宽限制政策回归常态的人要么是认识不到病毒的可怕，要么是别有用心图谋不轨。我们将继续贯彻清零政策，就像总书记所说的：“人民至上、生命至上”。"
 return_to_normal_desc: "经历了多年的艰苦努力，今日，我们终于能向全国人民和全世界宣布，中国已经走出了新冠病毒大流行的时代，正式回归常态。这不光是中国共产党和中华人民共和国的胜利，也是十四亿中国人民所取得的伟大胜利！"
 strict_lockdown_policy_desc: "尽管已有心理准备，但冠状病毒的传染性仍然超出了我们的想象。我们只能进一步加强监控措施，投入更多资源，将市内、城乡以及出入境人员流动控制在最小范围内。有人指责我们这是“强行让整个国家停摆”，但为了战胜疫情，封控政策将被证明是必要之举。"
 promote_prevention_measures_desc: "核酸检测不仅成本低廉，易于推广，同时还可以帮助我们以更高效率对人体是否感染了冠状病毒进行诊断，对及时救治患者，疫情监视与控制、恢复经济与正常生活，起着非常关键的作用。我们将在全国各地推广核酸测试项目，并在各大城市兴建多个检测站点。首先是政府工作人员、未来还要包括全体市民甚至全体国民，都要接受检测。"
 focus_on_vaccine_research_desc: "只有开发出性能可靠的疫苗，我们才能真正从源头上控制冠状病毒的传播。目前以科兴生物公司为首的生物制药公司的疫苗研发工作已经取得了决定性的成果。我们必须妥善运用手中的资金和资源，进一步支持企业们开发疫苗的努力，并尽快将成果投入使用，确保国民们最终都能免于感染。"
 start_vaccine_research_desc: "我们将尽快发布命令，要求全国的生物研究所和医药企业即刻开始新型冠状病毒病疫苗的研究和测试，这不光是为了更快控制疫情，同时也将是提升我国国际声望、扩大影响力的重要手段。目前国内已有包括科兴生物公司研发的灭活疫苗在内的多种正在进行临床试验。同时我们也已向世界卫生组织和发展中国家发出声明，表示愿意进行疫苗捐助和科研协助。"
 lockdown_wuhan_desc: "随着恐慌的进一步蔓延，事态已经逐渐变得无法收拾。自中央电视台报道“发现一种新型传染性冠状病毒”以来，以武汉市为中心的湖北省全境均出现了人员大量外流的迹象。市民们争先恐后地试图逃出这座城市，高速公路上人满为患，几乎导致交通完全停滞。如果坐视不管，那么不出几天，全国各地的医院就都会发现更多的病毒感染病例。我们必须当机立断，现在就下令对武汉市进行全境封锁。"
 covid_full_lockdown_desc: "这将是公共卫生史上前所未有的——为了尽快控制疫情，中国全国都将进入“准战时体制”，对人员出行、交通运输等进行严格的限制，遏制病毒的扩散。不幸感染冠状病毒的市民将会被集中在医院和临时修建的医疗站中进行统一隔离和治疗。与此同时，全国的医药学家和生物学家都被动员起来，群策群力寻找战胜病毒的最终办法。"
 PRC_shake_up_the_politburo_2_desc: "我们即将召开中国共产党第二十次全国代表大会，选举新一届中央委员会，并确定党在未来五年的工作重心。海内外无数人正密切关注着这次大会的成果，而我们也将借此机会，展现党的实力、团结与变革。"
 turbulence_returns_ship_runs_aground_desc: "疫情管控的恶化，愈演愈烈的经济风暴，社会矛盾的爆发，一系列的危机早已应接不暇。二号人物的离世又使得党内的反对派们蠢蠢欲动，风雨中飘摇的红色巨轮已然岌岌可危，而巨轮又该驶向何处……"
 
 emergency_work_meeting_desc: "当下之际，必须立即召开紧急工作会议，国内局势正以超乎想象的速度恶化，保守派们维系旧秩序的方案彻底溃败。当务之急，必须立刻召开紧急工作会议，在局势失控之前，在党内分歧彻底撕裂组织之前，以改革破局之势为这艘远航的巨轮重新锚定航向，推行改革，才能带领这艘巨轮走出困境，制定出能够应对危机、扭转局势的有效措施。得让沉浸在昔日的保守派们明白，是时候改变航行了，党的舵手必须做出他的抉择。"
 
 overseas_good_doctors_desc: "能源成本的上升，已经导致我国能源密集型产业减产，进而波及上下游产业链，在发展自身能源产业的同时，可以把市场目光转向其他地方，例如尼日利亚，非洲最大的产油国之一，亦或是我们的北方邻居，加快市场接入与贸易对接，缓解能源危机造成的影响。"
 
 pragmatic_measures_desc: "形式主义的空响口号像锈蚀巨轮的铁锈，官僚主义的浮华形式如同蒙蔽双眼的迷雾，臃肿的形式主义、官僚主义作风是无法解决现在的问题的。随着局势愈发危急，采取务实的改善举措才能在危局中劈开生路。在惊涛骇浪中稳住这艘巨轮，我们将在关键领域的上做出实际的举措，让人民看到我们为稳定局势所做出的努力。"

 improve_medical_security_measures_desc: "在社会主义国家，对医药保障的重视程度，折射的是其“为人民服务” 的理念是否真正落地。城乡、区域医疗资源失衡是普遍问题，疫情也让我们发现了医疗保障体系中存在的臃肿弊病和腐败，通过改革完善公立医疗、医保全民覆盖等制度设计，逐渐的从根本上打破资本主义“金钱换健康”的逻辑。"
 
 food_safety_reform_regulation_desc: "多年以来，部分地方政府为了政绩充当保护伞，放任纵容一些无良食品企业的非法行为，而基层市场也充斥着大量不受监管的三无食品。\n这些乱象已经造成人民群众对于食品安全的恐慌，我们必须对这些情况做出必要且严格的管理措施，改革条例通过建立企业信用档案、实施“黑名单”制度，将诚信纳入市场准入和监管考核，制定严格的食品安全标准。而农村和偏远地区是三无食品“重灾区”，改革条例通过强化基层监管力量，建立溯源惩处机制，真正做到保护人民的饮食安全。"
 
 stabilize_local_finance_desc: "在这十几年的发展过程中，许多地方政府为了政绩举债建设，甚至有些官员干部为了政绩，不惜以地方信用大笔借债，进行了大量毫无回报的面子政绩工程，种种造就如今的地方财政严重失衡。\n为维护经济稳定，防止系统性风险爆发，通过中央财政资金转移，以及加强对地方财政的监管和规范，建立健全财政管理制度，提高财政资金的使用效率，再由中央财政资金保障已烂尾的民生住建工程，赔偿受到影响的购房群众，逐步达到稳定局势与地方财政的作用。"
 
 suppress_liberal_dissent_desc: "长期以来，受到西方支持煽动的国内自由派势力，不断试图影响我国的政治走向和社会稳定，在我国煽动“颜色革命”。现在美国局势愈加复杂混乱自顾不暇，我们应该趁此机会截断资金流，解决查禁非法组织、煽动暴力等问题。我们会让这些人明白，这个国家的底色是不会变的，这片土地不是他们可以胡作非为的地方。"
 
 form_united_front_desc: "即使在党内面临不同历史阶段的路线分歧时，也曾通过统一战线凝聚共识，目前我们在党内的力量还不算是稳固，无法在当前恶化的局势下独自推动变革，为了适应形势变化，与一些值得联合的力量组建统一战线是必要的，将差异转化为治理资源，避免权力斗争的失控，在维护党的团结基础上，应对可能的一切挑战。"
 
 absorb_leftist_opposition_desc: "自1979年以来，左派政治家们远离了政治权利的中心，在目前国内社会矛盾的刺激下，他们的政治力量不可小觑。新生代左派的影响力也在群众中呈现出前所未有的渗透力。\n坚持以马克思主义为指导，坚持从人民利益出发，通过科学的理论和实践路线来团结力量。我们有着共同的政治愿景与改变这个国家现状的决心，联合力量，推翻前进的一切阻碍！"
 
 reorganize_local_bureaucracy_desc: "疫情管控的乱象，地方财政的失衡，各种懒政乱政层出不穷的贪腐现象，以及形式主义、官僚主义等等问题，使得对于整顿地方行政系统的必要性不言而喻。为了后续政治变革的推进，以推动干部体系回归“为人民服务”本质为目的，强化监督，斩断利益链条，以“自我革命”的决心开展工作整顿、作风整顿。"

 promise_of_new_spring_desc: "为了获得其他力量的支持，向他们阐述政治变革的必要性，以及做出推动改革的许诺，同时以“底线声明”维护自身主动权。\n我们将带来一个通过体制变革重新焕发生命力的先锋队，让一切重回正轨，我们的承诺，不是为了权力的博弈，而是为了兑现一个关乎亿万人命运的未来，是一套具体的、可执行的变革方案；我们依靠的不是少数精英的恩赐，而是千万劳动者、正义之士的共同奋斗。让真理的火种照亮前行的道路！让这个国家在正确的方向上继续前进！"
 
 loosen_restrictions_on_pro_worker_organizations_desc: "社会上不乏有各种各样的以维护工人利益而存在的社会组织，他们许多由工人和学生组成，在以往他们的活动存在都受到了限制，是时候解除对他们的桎梏了。\n从历史经验来看，亲工人组织的壮大与社会进步紧密相连。回溯工业革命时期，当工人在恶劣环境中挣扎，超长工时、微薄薪资成为常态，是早期的工会组织站了出来。它们将分散的工人团结在一起，以集体的力量与资本博弈，为八小时工作制、安全的劳动环境等权益而抗争。这些亲工人组织，成为推动社会劳动制度变革的先锋力量，让工人从被压榨的边缘逐渐走向有尊严劳动的道路。如今，在新的政治体制变革背景下，放宽亲工人组织与左翼社会团体的限制，是对历史经验的传承与发扬，是确保工人权益持续进步的必要手段。"
 
 in_the_name_of_the_people_desc: "“以人民的名义”绝非抽象的政治修辞，而是“人民”概念的阶级性与历史性的集中体现。我们已经在前期的体制变革进程中取得了不小的成果，是到将成果扩大并践行这一理念的时候了。"
 
 still_stable_desc: "在实行了一系列的改革举措之后，尽管已经将国内局势大体稳定了下来，但此时的“稳定”，究竟是社会矛盾的真正化解，还是矛盾被暂时掩盖在“维稳”的高压之下？\n我们曾坚信“发展是最好的稳定器”，但现在我们需要明白，当改革不再回避利益调整，当制度创新真正反应人民需求，当“稳定”的定义从“秩序表象”转向“人民利益”，或许我们才能说：体制变革与稳定，正在走向辩证统一的新境界。我们的工作还远没结束，我们的道路依旧漫长，做好准备，迎接未来新的形势变化。"
 
 economic_stimulus_plan_desc: "虽然我们正逐渐从经济危机的伤害中走出来，但针对于目前国内的经济情况，制定与体制变革相并行的经济刺激计划已提上日程，经济刺激计划绝非简单的“救市工具”，而是基于对经济问题所形成的系统性干预策略。经济刺激计划的主要意义，在于证明经济政策可以成为重塑社会公平、推动历史进步的杠杆，而不仅仅是维护既有秩序的工具。"

 
