####################################################################################  政治文化国策  ####################################################################################

########政治线########
 PRC_nl_clean_house: "第二次整风运动"
 PRC_nl_clean_house_desc: "在过去的整风运动中，毛泽东同志肃整了党内的风气，在文风，学风，党风上均取得巨大胜利，确定了党的总路线。\n\n在取得了军事胜利，新左派已经成为事实上党内的最大派系，\n但是有些民族分子、修正分子和走资派喋喋不休，影响到我们党员的工作\n有鉴于此，一场新时代的整风运动势在必行。\n\n我们将从干部的思想问题入手，对党内的错误思潮进行批判，同时增强干部队伍在意识形态上的学习。"
 PRC_nl_political_awakening: "唤醒人民参政热潮"
 PRC_nl_political_awakening_desc: "§Y要真正让党代表人民，就要激发人民的参政议政积极性。§!\n\n我们将会通过回应民生关切，鼓励党员真正下基层解决民众问题，聆听民众声音的同时也向当地群众讲述，解释我们的政策会给他们带来什么好处。\n\n这样就能让他们理解，支持政府，自发的推动这种政策落实。党员的精力终是有限的，不只要在线下鼓励，随着科技发展，我们也有了更多方式去鼓励这种热潮，例如在制订政策时通过听证会了解他们的所需，或者在网上发布征求意见的稿子并允许一定的反对声音存在。\n\n这样，虽然会给反动派提供一些可乘之机，却也增强了我们力量的来源——§R人民的声音§!，越来越多的民众将走出家门，参与我们掀起的赤红浪潮中！"
 PRC_nl_party_internal_democratization: "党内民主化"
 PRC_nl_party_internal_democratization_desc: "在和各种不同意识形态的左派联盟而取得政权后，我们不得不面对一个以往保守派执政时相同的问题——党员对我们的道路显然…不太忠诚。\n\n与习的统御反对派不同，我们将会采用更加民主的方式，即在统一行动之前放宽党内的言论限制，让不同意见，央地两方党员的意见能够更加充分地表达与重视。"
 PRC_nl_dare_to_pull_down_emperor: "敢把皇帝拉下马"
 PRC_nl_dare_to_pull_down_emperor_desc: "中国共产党这个领导中国的巨人时不时会出现§Y“血管阻塞”§!的情况，即有人借着党的名义§a巧立名目，中饱私囊。§!\n\n党内对于处理这种情况的方法纵说纷纭，而我们在已经民主化的党内一锤定音——扩大党内和民间的监察权，允许党员和人民群众直接对接新成立的只对主席团负责的反腐组织检举贪腐分子；完善党内的监察体系，赋予基层党员越级举报的权力。\n\n籍此，我们会动员党内外人士再向贪腐分子§R宣战。§!"
 PRC_nl_people_walk_with_party: "人民与党并肩而行"
 PRC_nl_people_walk_with_party_desc: "§R党§!是什么？§R党§!是自诞生之始便为了人民的幸福生活而战，团结一致的集中组织;是为了实现每个人自由发展而奋斗的先锋队。\n\n§R党§!与人民群众同呼吸，共命运，不会抛下每一个需要被拉一把的群众，与人民群众血脉相连、荣辱与共。\n\n§R党§!不会高高在上地指挥，不会像昔日的压迫者一般对人民戒备森严。\n\n§R党§!会与人民并肩而行。\n\n§Y我们会在党章中添加更多关于人民监督的内容，并敦促人大通过人民监督权扩大的宪兵条例。§!"
 PRC_nl_cadre_revolutionization: "整肃基层干部队伍"
 PRC_nl_cadre_revolutionization_desc: "纵观现在的党政体系，§a无能又不忠诚§!的干部数不胜数。要从头开始整治，便要从革命思想开始。\n\n我们将会整治党内思想不端的党员干部，将党重新革命化开始，一步步对党的意识形态和工作效率进行改革。\n\n§Y重新开展座谈会，组织社会主义理论学习…§!这些举措的效果不会立竿见影，但我们希望它润物无声。"
 PRC_nl_expand_young_forces: "扩大年轻生力军"
 PRC_nl_expand_young_forces_desc: "青年党员干部很多时候工作经验不足，沟通能力不够，但是他们年轻。\n\n他们工作干劲十足，相较于坐在位置上等退休的老干部，他们会下到基层，与一线群众接触，在意识形态领域，他们的可塑性也比老干部高得多，\n\n我们只需加以引导，他们便会在不久后成为我们最忠诚的卫士。"
 PRC_nl_from_people_to_people: "坚定群众路线"
 PRC_nl_from_people_to_people_desc: "现在，让我们将改革的目光放到干部的执行方面。是时候重提§Y“从群众中来，到群众中去”§!的领导方法了。\n\n我们要祛除党内家长制的作风，做群众的朋友，老师，和学生。我们将要求干部从工作室中走出来，结束所谓的政治作秀，真切了解人民所需，再借此改造我们的工作，使之更为有效。"
 PRC_nl_marxist_theory_peak: "统合建构马克思理论"
 PRC_nl_marxist_theory_peak_desc: "随着我们决定走出新道路，我们应当开始构建属于这一代领导核心的理论体系。\n\n新的理论会在辩证继承原有的理论体系的同时修正航道，阐述阶级矛盾尖锐的现状并重提§R阶级斗争§!。\n\n党的底层理论会再建构，民族主义会渐渐退出政治舞台，工人农民士兵的地位会再度得到重视，而为富不仁的资本家也会被§R清出§!§Y人民代表大会§!。"
 PRC_nl_new_socialist_theory_practice: "“社会实践是检验真理的唯一标准”"
 PRC_nl_new_socialist_theory_practice_desc: "新的社会主义理论已经编纂完成，§Y人民的智慧§!和§R党的理论§!归纳已经结合完毕，现在，应该组织党员进行新的理论学习，并开展相关实践。\n\n人大代表开始更多走进工厂，反馈工人们的需求；民间亲工人法援组织的管制被放宽，昔日不被重视的阶层开始重新走进人们的视野。\n\n他们的笑容似乎在告诉我们：§Y我们做的是对的。§!"
 PRC_nl_marxist_glory: "扫去尘埃"
 PRC_nl_marxist_glory_desc: "马克思的思想在先前我国无疑是形而上学的，一些“专家”不在意它的内核，生搬硬套到我国的一些糟粕中，使其蒙上了一抹尘埃，这种行为必须制止，不然会对我国意识形态领域产生恶劣影响。\n\n对于马克思主义中国化的污名化会就此结束，我们会侧重马克思主义本土实践与总结，而非原先保守的传统文化。\n\n借此，我们可以同人民一并创造出新的文化与理论，而不是抱残守缺。"
 PRC_nl_historical_experience_summary: "历史经验总结"
 PRC_nl_historical_experience_summary_desc: "总书记在一次中央会议上提出了§Y“各国社会主义历史经验总结”§!的要求后，中央政治局常委王沪宁对该问题进行了诠释与总结。\n\n在反思苏联解体的经验中，经济基础变化是一个重要的因素，但更为重要的是文化上的变更。赫鲁晓夫的“解冻”和全面否定斯大林带来了思想上的混乱，奠定了苏联修正的根基，勃涅日列夫上台后以同样的方式否定前任，结果不仅没有重回斯大林道路，反而助长了修正风气。\n\n由此得知，保持辩证的文化政策，客观的评价过往历史和举措很有必要。"
 PRC_nl_redefining_first_thirty_years: "前三十年重定性"
 PRC_nl_redefining_first_thirty_years_desc: "改革开放后的很长一段时间里，建国后的三十年大量存在被污名化的现象。\n\n一些“公知”将“前三十年”贬为暴政，政府也睁一只眼闭一只眼，不少干部还深以为然。\n\n随着胡春华总书记开始肃整干部的思想文化领域，这种情况必须画上句号。\n\n我们会严肃宣告：§Y建国后的三十年并非暴政，而是§!§R奠基§!，§R奠基§!§Y了后四十年的经济腾飞，为现在的人民民主埋下了种子。§!"
 PRC_nl_red_flag_never_falls: "后四十年历程再审视"
 PRC_nl_red_flag_never_falls_desc: "通过对党员意识形态的破立，大部分党员干部已经对现在的情况有了了解，\n\n我们的党派文化得到革新，在人民群众中得到了广泛的认同，先进的干部和积极分子信仰坚定，素养得到提高，我们的工作能力也会进一步提升。\n\n大多数拥戴党的群众充满了希望，我们终于可以宣告：§R党的红旗永不倒§!"
 PRC_nl_rebuild_proletarian_dictatorship: "重建无产阶级专政"
 PRC_nl_rebuild_proletarian_dictatorship_desc: "在做完§Y党的整风§!运动后，我们终于可以改弦更张了。\n\n我们会告诉毛主席，百万为了人民幸福而战的战士没有白白牺牲。我们会告诉在工厂的工人、在田间的农民、在写字楼的白领，告诉其他这个或者那个反动势力：\n\n§R中国共产党万岁，中国人民万岁，无产阶级万岁，无产阶级专政万岁！§!"
 PRC_nl_proletarian_democracy: "无产阶级的民主"
 PRC_nl_proletarian_democracy_desc: "为实现真正的人民当家作主，必须重构国家政治体系。当前制度已无法满足人民参政议政需求，必须开创无产阶级民主新形式。\n\n通过§Y扩大基层选举权、强化人大监督权、重构公民参政机制§!，让权力真正回归人民手中。"
 PRC_nl_perfect_democratic_centralization: "旧党新造"
 PRC_nl_perfect_democratic_centralization_desc: "民主集中制是无产阶级政党的根本组织原则，但形式主义与脱离群众使其异化为“家长制”。\n\n必须恢复基层党组织活力，保障党员批评权，严格落实少数服从多数，建立自下而上的民主决策机制，防止权力过度集中于个人，时刻警惕那些试图成为独裁者的人。"
 PRC_nl_central_purge: "中央大洗牌"
 PRC_nl_central_purge_desc: "§Y官僚主义、形式主义、血统论§!与§Y特权思想§!已严重侵蚀党的肌体，我们的队伍中已混入太多蛀虫与投机分子。\n\n必须彻底清退中央机构中的腐朽分子，提拔真正为人民服务的干部，打破论资排辈和裙带关系，重塑中央领导机构，确保政策制定符合人民利益。\n\n如果有些人不愿体面，我们便帮他们§R体面§!。"
 PRC_nl_collective_leadership_system: "集体领导制确立"
 PRC_nl_collective_leadership_system_desc: "个人崇拜与权力独占是对马列主义的严重背离，但一个民主大帐蓬只会带来一个低效的政府。\n\n必须建立健全集体领导制度，明确分工与责任，重大决策必须经集体讨论通过，任何人不得凌驾于组织之上。\n\n确保权力运行受到制约，防止个人专断，同时尽力避免无意义的争吵。" 
 PRC_nl_reform_people_congress: "改革人大"
 PRC_nl_reform_people_congress_desc: "人民代表大会制度是我国根本政治制度，但形式大于实质。\n\n如果要实现真正的无产阶级民主，恢复人大作为国家权力机关的地位是必经之路。\n\n打破橡皮图章现象，让人大真正成为人民当家作主的机关，而并非§Y“举手机器”§!。"
 PRC_nl_representative_rights_and_responsibilities: "明晰代表权责"
 PRC_nl_representative_rights_and_responsibilities_desc: "人大代表是人民的§Y“传声筒”§!，不是§g“官老爷”§!。必须明确代表权力：§Y质询权、表决权、罢免权§!；更要强化责任：§Y定期述职、接受监督、联系群众§!。权力越大，责任越大。\n\n不干实事的代表，人民有权随时§R“炒他的鱿鱼”！§!"
 Prc_NewLeft_Rectification_Movement: "§R整风运动§!已经宣告§Y圆满完成§!"
 PRC_Rectification_Movement_tt: "§R整风运动§!宣告§Y圆满完成§!"
 PRC_nl_re_examine_the_people_congress: "重审人大代表"
 PRC_nl_re_examine_the_people_congress_desc: "§R“工人农民是国家的主人，不能只挂名不做主！”§!当前人大代表结构失衡，工人农民比例过低，官员资本家比例过高。\n\n而那些所谓的专业人士，如律师，运动员，明星与金融大佬等，本质上仍是资本家的走狗甚至是企业家本身。\n\n我们必须重新全面审查人大代表，大幅提高工农及基层代表比例，减少领导干部兼任代表现象。\n\n代表要能真正代表人民，不能只是某些阶层的代言人，让我们真正听见人民的声音。"
 PRC_nl_digital_supervision_of_the_people: "扩大群众监督权"
 PRC_nl_digital_supervision_of_the_people_desc: "现代技术的发展为建设一个全国范围的、广大群众性的、思想上政治上组织上完全巩固的布尔什维克化的中国共产党提供了可能。\n\n让我们建立一个数字化监督平台，让群众通过网络直接监督代表履职、政策执行和预算使用。\n\n实现§Y“指尖上的监督”§!，让权力在阳光下运行，让蛀虫们无处藏身。"
 PRC_nl_proletarian_good_representative: "无产阶级好代表"
 PRC_nl_proletarian_good_representative_desc: "我们无产阶级，一直有埋头苦干的人，有拼命硬干的人，有为民请命的人，有舍身求法的人。\n\n好干部要像焦裕禄、孔繁森那样，全心全意为人民服务。\n\n把那些真正扎根基层、了解民情、敢于斗争的代表一个个提拨上来，成为像雷峰那样的无产阶级的脊梁。"
 PRC_nl_unite_efforts_with_unity: "上下结合齐心协力"
 PRC_nl_unite_efforts_with_unity_desc: "政治改革不能“单兵突进”，必须上下结合，齐心协力。\n\n党中央要放手让人大行使职权，人大代表要勇于为民发声，基层群众要积极参与监督。\n\n只有党的领导、人大监督、群众参与三位一体，才能实现真正的人民民主。\n\n§R“众人拾柴火焰高，上下一心力量大”！§!"

########政治（文化）线########
 PRC_nl_sun_at_eight_nine: "八九点钟的太阳"
 PRC_nl_sun_at_eight_nine_desc: "§Y“世界是你们的，也是我们的，但是归根结底是你们的。你们青年人朝气蓬勃，好像早晨八九点钟的太阳。希望寄托在你们身上！”§!\n——毛泽东，1957年11月17日"
 PRC_nl_social_reeducation: "刨除思想毒草"
 PRC_nl_social_reeducation_desc: "市场经济下，§Y拜金主义、利己主义§!盛行，社会价值观混乱。\n\n我们将开展全民再教育运动，组织各阶层公民参与社会实践和集体学习，对错误路线和思想进行严厉批评，重建社会主义核心价值观，让人人都能明辨是非，自觉抵制腐朽与反动思想。"
 PRC_nl_education_the_groundstone: "铺下未来基石"
 PRC_nl_education_the_groundstone_desc: "当前教育过分重视书本知识，学生§Y“两耳不闻窗外事”§!。\n\n我们将彻底改革教学模式，学生每学期必须参与一定时间的生产劳动和社会实践，让理论在泥土中生根，在劳动中开花，真正做到知行合一。"
 PRC_nl_party_the_face: "党风，当世面孔"
 PRC_nl_party_the_face_desc: "当今体制下，官本位思想严重，干部§Y“为官不为民”§!，甚至§Y“父母官”§!言论甚嚣尘上。\n\n我们将设立干部评价新标准，以解决群众实际问题的数量和质量为考核重点，实行基层任职必修制，让每一位干部都能放下架子，俯下身子，真正做到全心全意为人民服务。"
 PRC_nl_end_to_past_chaos: "清理旧日乱象"
 PRC_nl_end_to_past_chaos_desc: "该为所谓的小资情调，资产阶级的奢靡文化画上句号了，我们将对过去宣扬资产阶级腐朽文化的媒体、软件进行限制与改造，对过往的舆论进行审视。\n\n我们会营造一种革命文化氛围，团结群众共同批斗文化领域的§Y“走资派”§!，打破资产阶级信息茧房，重塑文化领域革命属性，让人民群众重获§R无产阶级文化自由！§!"
 PRC_nl_youth_league: "改造共青团"
 PRC_nl_youth_league_desc: "共青团组织已沦为升学就业跳板，政治性与革命性被严重弱化，甚至出现江西共青团痛骂巴黎公社这种不忍直视的情况。\n\n我们将重建团员选拔标准，强化政治理论学习和社会实践，清除官僚主义和形式主义，增加管理人员维持共青团正常运转。\n\n§R让共青团重新成为青年人的真正代表和革命事业的后备军。§!"
 PRC_nl_purge_culture_propaganders: "清扫文宣蛀虫"
 PRC_nl_purge_culture_propaganders_desc: "毛主席生前曾多次批判某些官媒为二流报纸。\n\n如今，我们的文宣系统§Y脱离群众§!，充斥§Y形式主义§!和§Y官僚主义§!，其中大量从国外镀金回来的人§Y“众正盈朝”§!，他们降低了运转效率的同时，又颇有些不食人间烟火的“气质”。同时为了业绩和裁减人员，一堆工作都是外包民间，这很容易造成工作上的问题。\n\n我们将大刀阔斧清理文化教育宣传部门，选拔§R真正懂文化、爱人民§!的工作者，建立基层调研制度，确保每一个文化产品都能反映人民心声，传递人民需求。"
 PRC_nl_future_with_technology: "开拓未来以技术"
 PRC_nl_future_with_technology_desc: "教育是一个国家的未来，目前我国的教育事业上面临诸多问题，\n\n例如把人异化的考试制度；一些地区教育资源不平衡；应用于创新的资金不足…\n\n我们将彻底重构教育体系，着手解决这些问题，重新建立公平公正的德智体美劳全面发展培养模式，使教育真正成为§R塑造全面发展的社会主义新人的工具。§!"
 PRC_nl_off_bad_trend: "清不正之风"
 PRC_nl_off_bad_trend_desc: "教育领域存在学术不端、论文造假、职称评定腐败与师生地位不平等等诸多不正之风。\n\n我们将开展教育系统全面整顿，严惩学术造假，革除职称评定中的潜规则，建立真才实学的评价体系，让教育工作者回归教书育人的本职，而非沉迷于树立威信和职称晋升。"
 PRC_nl_restructure_our_study: "重提“改造我们的学习”"
 PRC_nl_restructure_our_study_desc: "党风影响学风，做表率的党员如果不好学，学不好，就做不了群众的表率。\n\n现在一部分党员脱离实际，犯主观主义错误；不从历史里学习经验，只依靠过去经验，犯经验主义错误，还有些同志，照搬西方，不作思考。\n\n在这种情境下，重提毛主席§Y“改造我们的学习”§!这篇文章很有必要，我们将自此为切入口，发起一次对党员学风的整顿运动。"
 PRC_nl_newera_edu_style: "塑造新时代教风师风"
 PRC_nl_newera_edu_style_desc: "十年树木，百年树人。在新的形势下，我们应该对教师提出更高的要求与更适应社会主义现代化的教育方式。要想种下民主集中制和尊重劳动者的氛围，最好从学校开始。因此我们会半强制性要求老师更加平等对待学生，提高自身的品格与学养，让教员这个职业不仅教书，而且育人。"
 PRC_nl_purge_academic_bureaucrats: "扫清地方门阀"
 PRC_nl_purge_academic_bureaucrats_desc: "地方学阀是地方反动保守势力的触手，他们沆瀣一气，贪下中央的改革经费，巧立名目征收学生的学杂费，还构成了地方恩庇网的一部分。\n\n想要我们的教育改革深入基层，甚至长远地影响之后的学生，就要减除地方利维坦的触手，以忠于社会主义事业的青年教师取而代之。"
 PRC_nl_revive_red_culture: "繁荣赤色文化"
 PRC_nl_revive_red_culture_desc: "市场化浪潮中，革命文化被边缘化，实用主义文化泛滥成灾。\n\n我们将大力扶持赤色文艺创作，再一次推行§Y“百家齐放，百家争鸣”§!，不局限于本本主义，用现代表达讲述革命故事，让红色基因融入流行文化，使青年一代在潮流中感受革命精神，让红色文化成为当代中国最鲜明的文化标识。"
 PRC_nl_peoples_culture_revolutionary_culture: "培育人民文化之芽"
 PRC_nl_peoples_culture_revolutionary_culture_desc: "昔日的中国， 文教领域§Y“唯流量论”§!，精神家园荒芜。\n\n通过一系列的文化重建，我们已初步培育了为人民服务、为社会主义服务的文化萌芽。这既是对过往社会主义文化政策的总结，也是谱写我们时代的文化华章。\n\n现在我们要再接再厉，呵护这颗属于人民的文化之芽，并寄望未来它茁壮成长。"
 PRC_nl_proletarian_art_festival: "无产文艺节"
 PRC_nl_proletarian_art_festival_desc: "充满着人民心中真挚情感的文艺和艺术意象被消费主义和市民社会庸俗化的污泥所玷污，大无畏的爱变成了肉欲的狂欢，艺术意象被庸俗化为一滩烂泥。\n\n而§Y无产阶级文艺节§!，不仅仅只是一个让劳动人民也有机会道出自己心声的节日，我们更希望以这样的一个节日来为那被工业流水线和盈利所窒息的世界文艺界破局，呼唤最真诚的艺术精神；\n\n同时，也为那些真正属于中国历朝历代劳动人民的传统文化，寻求一个新的未来。"
 PRC_nl_hundred_flowers_bloom: "百花齐放"
 PRC_nl_hundred_flowers_bloom_desc: "一花独放不是春。当中国终于迎来了属于自己的春日之时，花儿的绽放是挡不住的。\n\n我们祖国大地全新的时代之中，各种各样的艺术思潮、各种各样的艺术探索、各种各样的艺术形式都绽放在了我们的土地上。\n\n尽管说有很多可能被时代遗忘，甚至于走了歪路，但倘若说我们没有包容心，中国的艺术怎么会取得突破呢？但那些纯粹的渣滓，还是应当抛弃的......"
 PRC_nl_people_artist: "人民的艺术家"
 PRC_nl_people_artist_desc: "§R“人民艺术家”§! 是中国授予在文学、艺术等领域有卓越成就，为人民群众所喜爱，且对社会有突出贡献的艺术家的荣誉称号。\n\n人民群众所喜闻乐见的艺术，才是真正值得被广为流传的艺术——我们已经受够了让艺术的定义权与评判权被一小撮反动的§Y“学术权威”§!受掌握的日子了。\n\n我们将重启§R“人民艺术家”§!这一光辉的称号，并在相应委员会审核后将他授予最受人民群众欢迎的文艺工作者们，以表彰他们在文艺阵线上的突出贡献。\n\n§Y艺术不仅要有“阳春白雪”之于高阁之上，也要有“下里巴人”的田园牧歌。§!"
 PRC_nl_revolutionary_art_renaissance: "革命文艺复兴运动"
 PRC_nl_revolutionary_art_renaissance_desc: "如果说你认为革命文艺仅仅只是所谓的酸儒骂人，那就真是大错特错了。\n\n反映着我们战斗着前进着的现实生活的是§R“革命文艺”§!；而那些专注于对文艺之上的窠臼，比如说绘画技术、音乐创作思维、写作技术、表现形式等方面进行革新的也是§R“革命文艺”§!。\n\n我们要继承当年那些锐意进取的艺术家之精神，为现代的中国探索一套全新的文艺体系。"
 PRC_nl_fighting_pen_revo_draw: "战斗的笔，革命的画"
 PRC_nl_fighting_pen_revo_draw_desc: "§Y揭露黑暗，赞扬光明；剖析现实，展望未来§!；这是老一辈革命艺术家为我们留下的宝贵的精神财富。\n\n在我们迈向未来的伟大征途当中，社会上下都充满着战斗的激情，这正是激情燃烧的岁月。我们的艺术家不能做桃源中人，要走到我们的祖国大地上，真正地找到自己。\n\n为我们的人民、我们的祖国、我们的民族，写下鼓舞人心的文章，画出缤纷多彩的画卷"
 PRC_nl_long_live_internationalism: "重塑革命理想"
 PRC_nl_long_live_internationalism_desc: "中国历来推崇互帮互助的精神，历来在国际事务中尊重他国道路。\n\n当今国际局势日新月异，我们将会在外交上更进一步，重新燃起国际主义之火。§Y世界需要中国，中国需要世界。§!\n\n随着国际主义精神的重燃，越来越多的人民将意识到这世界上还有许多角落都有需要我们拯救与伸出援手的欠发达地区和挣扎在水深火热之中的人民。\n\n让我们§R再来一次§!吧，也许在当今这个全世界反动势力愈发猖獗的时代，将国际主义精神§R再次点燃§!为国际纵队那般的燎原之火是道阻且长的，§R但这值得我们去尝试。§!\n\n§R国际主义§!§Y运动再冷，也冷不过鸭绿江边的§!雪。"
 PRC_nl_cosmos_red_tide: "寰宇赤潮"
 PRC_nl_cosmos_red_tide_desc: "哪怕是最乐观的同志，也绝没有估计到如今的大好局面，随着我们重燃国际主义精神，开始在各个渠道上声援被压迫民族与各国工农阶级，响应我们号召的全世界被压迫的人民发出的呐喊便一浪高过一浪。\n\n如果说帝国主义的压迫烘干了干柴，那§R马克思列宁主义§!与§R毛泽东伟大思想§!就是人民心中的火苗——而我们，正是那一阵唤醒人民的春风，\n\n§Y现在，§！§R火焰§！§Y烧起来了，§！§R社会§!§Y沸腾起来了，§!§R赤红的浪潮§！§Y奔涌起来了！§！\n\n§R同志，到大街去，到电台去，到车站去，到为被压迫的民族、被压迫的阶级发声的地方去！§!"
 PRC_nl_second_newculture: "第二次新文化运动"
 PRC_nl_second_newculture_desc: "在第一次新文化运动中，学生青年的思想得到了启蒙，进步的知识分子发起的反封建主义运动塑造了一代进步青年。\n\n而我们现在要做的，便是引领新生的无产阶级知识分子深化对青年思想的启蒙工作，让他们在网络上，书籍中深刻学习理论，褪去过往生涩的表签，成为新一代坚定的斗士。"
 PRC_nl_shatter_myth_bourgeoisie: "打破资产阶级神话"
 PRC_nl_shatter_myth_bourgeoisie_desc: "资产阶级在生产与资本扩张增殖上对无产阶级专政的国家冷嘲热讽，认为我们的体制僵化死板，生产效率低下，尽己所能用刻薄的言辞否定无产阶级的建设成果。\n\n那就让他们说去吧，让他们说我们这也不行那也不行吧。我们会开动宣传机器，激发人民的劳动热情，从文化与数据上超越他们引以为傲的“积极性”。"
 PRC_nl_newculture_tbc: "新芽破土"
 PRC_nl_newculture_tbc_desc: "“五星红旗迎风飘扬，\n革命歌声多么嘹亮，\n歌唱我们社会主义祖国，\n到处都是灿烂阳光”我们欢欣地看到，我们的青年蓬勃向上，一代新人茁壮成长，过往萎靡倾颓的面貌一扫而空。\n\n我们欢欣地看到，五千多年以来，描述王侯将相的文化主流转向人民群众。我们欢欣地看到，人民终于有了属于自己的社会主义文化自由！"
 PRC_nl_inspiration_from_core: "领导核心的启发"
 PRC_nl_inspiration_from_core_desc: "个人崇拜与权力独占是对马列主义的严重背离，但一个民主大帐蓬只会带来一个低效的政府。\n必须建立健全集体领导制度，明确分工与责任，重大决策必须经集体讨论通过，任何人不得凌驾于组织之上。\n确保权力运行受到制约，防止个人专断，同时尽力避免无意义的争吵。因此，总书记将会从自身做起，通过条例削减自己过大的权力"
 PRC_nl_improve_cadre_witharwal_system: "完善干部清退制"
 PRC_nl_improve_cadre_witharwal_system_desc: "凭良心说话，邓小平留下的干部轮换清退制度毫无疑问是具有进步性的，只是执行起来效果…实在难以说很好。我们必须制定更加严密的条例，建立完整的干部退出机制，清理掉一些尸位素餐的老人，提拔真正为人民服务的干部，打破论资排辈和裙带关系，确保政策制定符合人民利益的情况下保持延续性。当然，如果有死硬分子不愿体面，我们便帮他们体面。"
 PRC_nl_what_does_party_represent: "再论党的代表"
 PRC_nl_what_does_party_represent_desc: "对于党权改革的第一步既然已经迈出，我们就要深化改革。\n我们当然会继承前主席江泽民的理论，强调党代表人民的利益和福祉，代表先进的文化和生产力。\n但是在新时代，我们也可以着手增添和修改一些东西，使其更符合我们的时代。"
 PRC_nl_reform_representative_ratio: "改革比例代表制"
 PRC_nl_reform_representative_ratio_desc: "“工人农民是国家的主人，不能只挂名不做主！”\n\n当前人大代表结构失衡，工人农民比例过低，官员资本家比例过高。\n而那些所谓的专业人士，如律师，运动员，明星与金融大佬等，本质上仍是资本家的走狗甚至是企业家本身。\n\n我们必须重新全面审查人大代表，大幅提高工农及基层代表比例，减少领导干部兼任代表现象。代表要能真正代表人民，不能只是某些阶层的代言人，让我们真正听见人民的声音。"
 PRC_nl_promote_public_participation_politics: "促进大众参政"
 PRC_nl_promote_public_participation_politics_desc: "在先前的政治热潮中，我们得到了教训，人民得到了权利。\n现在，我们时候推动人民参政意识了。\n\n在§R无产阶级专政§!的框架下，人民不仅能在党的引领下享受社会主义民主，还能通过实践认识到社会主义理论是捍卫自己权利的武器，\n坚定自己的社会主义信仰，与我们站在对抗帝国主义的统一战线上。"


##########经济科技国策##########

########科技经济线开门########
 PRC_nl_road_to_future: "迈向未来之路"
 PRC_nl_road_to_future_desc: "随着金融垄断帝国主义全球化的总崩溃，产业资本利润驱动经济增长的形式走向尽头。加之内部阶级矛盾尖锐化，原有的发展道路以难以为继。\n\n我们必须为中国找到一条通往发展与未来的新路；\n\n§R找到通往共产主义的前途。§!"

########经济线########
###一阶段###
 PRC_nl_socialist_modernization: "社会主义现代化建设"
 PRC_nl_socialist_modernization_desc: "列宁曾经满怀着对未来的美好憧憬提出了“俄罗斯国家电气化计划”，\n\n尽管这套计划已显陈旧，但是其内核仍旧是在提醒着我们：§R建设一个全新的社会绝对不可能抛开全国上下的现代化。§!\n\n我们需要拿出一万分的决心攻坚克难，彻底将中国建设为一个劳有，劳治，劳享的社会主义现代化强国。"
 PRC_nl_advance_productivity: "发展先进生产力"
 PRC_nl_advance_productivity_desc: "一些头脑发热的人曾经将暴力革命视为阶级斗争的唯一方式，这在实际上犯了盲动主义错误。\n\n在社会运动和阶级斗争中具有着最不可辩驳力量的斗争方式，实际上是发展生产力，构建属于无产阶级的经济基础。\n\n发展先进生产力将会为人的自我解放创造有利的物质条件，经济基础将对制度建设起决定作用。\n\n由此，我们必须要努力地发展全新的生产力，无论是生产技术还是生产领域或者新的产品，只要有利于经济体制革新，都值得我们大力投资和开发。"
 PRC_nl_reform_production_relation: "新时代三大改造"
 PRC_nl_reform_production_relation_desc: "生产关系，在一些不学无术的人眼中只有所谓劳动雇佣关系。\n\n但是实际上，生产关系的概念包括了从交易关系、经济组织建设到生产资料的所有制等十分广阔的内容。我们需要通过改革，剪除那些不符合我们当下生产力的生产关系。\n\n同时，我们也会通过更加注重内部人民的需求的政策立足点，让基层百姓口袋鼓起来，生活好起来，干劲足起来。"
 PRC_nl_socialist_construction_climax: "东方红，太阳升"
 PRC_nl_socialist_construction_climax_desc: "建设社会主义不只是一个派别的事业，这是我们全社会、全中国人民的事业。\n\n§Y会当水击八万里，自信人生五百年§!，我们现在将以十足的勇气和干劲，鼓励大家一同迈向那伟大的新明天，为我们的今日，为我们的后代，建设一个尽善尽美的人间天堂。"

###二阶段###
 PRC_nl_new_era_angang_constitution: "新时代鞍钢宪法"
 PRC_nl_new_era_angang_constitution_desc: "在总结前人经验的基础上，我们将以新时代的眼光重塑鞍钢宪法精神，确立工人群众在生产管理中的核心地位，推动民主管理与技术革新并重，强调实践探索与科学总结相结合。\n\n新时代鞍钢宪法不仅是工业发展的行动纲领，也是社会主义民主政治在生产领域的具体体现，标志着我国工业化建设进入一个更高水平的群众性时代。"
 PRC_nl_boost_production_tool_usage: "提高生产资料利用率"
 PRC_nl_boost_production_tool_usage_desc: "资源紧张仍然制约着我们的经济发展。我们将通过精细化管理、修旧利废、工艺改进等方式，显著提高生产资料的利用效率，减少浪费。\n\n通过更科学合理的调度机制，使有限的资源发挥出最大的效能，加快社会主义工业体系的壮大。"
 PRC_nl_reform_farmer_cooperation: "喜看稻菽千层浪"
 PRC_nl_reform_farmer_cooperation_desc: "在农业合作化基础上，我们将针对现有合作社的分散、低效问题展开新一轮改革。\n\n通过强化集体经济组织、推进统一经营、普及农业机械化与科学种田，我们要将合作社建设成为真正能够抵御自然灾害、稳定粮食生产、提高农民收入的坚强堡垒，确保农村成为支撑国家经济发展的稳固后方。"
 PRC_nl_restore_people_commune: "重建人民公社运动"
 PRC_nl_restore_people_commune_desc: "在总结以往经验教训的基础上，我们将重新发起人民公社运动，探索生产、生活、教育、医疗一体化的新型农村社会形态。\n\n新时代的人民公社不仅是农业集体化的高级形式，更是农村社会主义政治与经济组织的有机统一体，标志着广大农民在国家现代化进程中不再是被动的参与者，而是积极的建设者与主人翁。"
 PRC_nl_make_things_yourself: "自己动手，丰衣足食"
 PRC_nl_make_things_yourself_desc: "面对国际封锁和国内发展需求，我们将继续发扬自力更生、艰苦奋斗的优良传统，鼓励各级地方因地制宜，发动群众广泛开展地方工业和小型农业副业建设。\n\n通过自身努力解决基本生产与生活问题，走出一条独立自主、自给自足、不断发展的社会主义建设新道路。"
 PRC_nl_assure_welfare: "确保人民的美好生活"
 PRC_nl_assure_welfare_desc: "社会主义建设的最终目标，是让全体人民过上体面、幸福、有尊严的生活。\n\n我们将以保障基本生活需求为起点，着力发展教育、医疗、住房等基础事业，缩小城乡差距和地区差距，让发展成果惠及每一位劳动者。\n\n§Y美好生活§!不再是遥不可及的梦想，而是新时代社会主义建设不可或缺的§R使命§!和§R誓言§!。"

###三阶段###
 PRC_nl_UBI: "建立全民基本收入制度"
 PRC_nl_UBI_desc: "得益于经济自动化系统的逐步完善和无产阶级领导地位的巩固，我们将建立一种不同于西式UBI的全民收入制度，\n\n将劳动者从异化劳动中解放出来，推动其基于自身能力和兴趣爱好来参与到社会生产当中，最终推动实现人的自由全面发展。"
 PRC_nl_improve_commune_function: "完善基层公社职能"
 PRC_nl_improve_commune_function_desc: "随着社会主义农村建设的不断推进，基层公社的功能亟需进一步扩展和完善。\n\n我们将在原有农业生产基础上，积极发展集体食堂、公共洗衣房、托儿所和卫生站等服务设施，初步实现生活社会化，减轻个体家庭负担，释放更多劳动力参与集体生产。\n\n通过优化公社内部资源配置，推行统一管理与计划调配，基层公社将从单一的生产单位，转型为集生产、生活、教育、医疗为一体的社会主义基层组织，为农村现代化打下坚实基础。"
 PRC_nl_labors_share: "全体劳动者共享成果"
 PRC_nl_labors_share_desc: "在社会主义建设初期，如何确保广大劳动群众的基本生活保障，是摆在我们面前的重要课题。\n\n我们将以集体经济发展为基础，探索建立以公共分红、基本生活物资配给、全民医疗保障为支柱的初步全民收入体系。\n\n这一制度的核心不是取消劳动义务，而是在保障劳动者基本生活条件的基础上，减轻其生存压力，激励其更积极地参与到社会主义建设与社会活动之中。"
 PRC_nl_robotic_emergency_assist: "建立机器人应急服务系统"
 PRC_nl_robotic_emergency_assist_desc: "为应对自然灾害和社会突发事件，我们将建立由高度自动化机器人组成的应急救援网络。这些机器人将在危险环境中替代人类进行搜救、消防和灾后重建等工作。\n\n这一系统将成为我国民防体系和应急救援系统的有力补充，最大限度保障人民生命财产安全。"
 PRC_nl_labor_liberation: "实现人类劳动的解放"
 PRC_nl_labor_liberation_desc: "随着自动化技术的飞速发展，我们将把日常重复性劳动和家务劳动交由自动化系统处理，打破束缚人民创造力的桎梏。\n\n通过这一革命性变革，广大人民群众都能摆脱机械性工作的束缚，投入到真正激发其热情和才能的创造性活动中去，这不仅会提高我们的社会生产效率，更是共产主义理想中§Y“人的自由全面发展”§!的重要体现和实践路径。"
 PRC_nl_greatly_riched: "实现物质的极大丰富"
 PRC_nl_greatly_riched_desc: "物质极大丰富是共产主义社会的本质特征，是我们党一直为之奋斗的崇高目标。\n\n通过科学计划、智能调配和集体智慧的充分发挥，我们将摧毁资本主义生产方式固有的危机和浪费，建立起真正以人民需要为导向的生产体系。\n\n我们将通过技术革命和经济管理模式创新，让历代革命者设想的共产主义物质基础在中国大地上变为现实，为全人类展示一条通向物质极大丰富和自由而平等的劳动的光明道路。"
 PRC_nl_industry_five: "完善工业5.0概念"
 PRC_nl_industry_five_desc: "工业5.0超越了工业4.0的自动化与数字化，将人类工作者与智能机器深度融合，实现人机协同的更高境界。\n\n我们必须在社会主义思想的指导下，重新定义人与技术的关系，使技术真正服务于人民福祉而非资本增值。\n\n我们坚决反对机器成为工人的竞争者，而应使其成为工人手中的得力工具，延伸劳动者的创造力而非替代劳动本身。"
 PRC_nl_automation_traffic: "全国自动化交通物流网络建设"
 PRC_nl_automation_traffic_desc: "建设覆盖全国的自动化交通物流网络是实现社会主义现代化的关键基础设施工程。\n\n通过智能铁路、无人驾驶卡车车队和自动化配送中心的有机连接，我们将建立一个高效、低耗、精准的全国物资流通体系。\n\n这一网络将彻底消除地区间的物流壁垒，大幅降低运输成本，加速商品流通速度，从而为人民群众创造更加便捷的生活条件，为国家经济发展提供坚实保障。"
 PRC_nl_regional_integration: "区域产业一体化发展"
 PRC_nl_regional_integration_desc: "打破行政边界限制，实现区域产业有机融合是发挥社会主义集中力量办大事优势的重要举措。\n\n通过科学规划各地区产业布局，形成优势互补、分工协作的区域产业生态系统，我们将避免资本主义市场竞争导致的重复建设和资源浪费，使各地生产力要素按计划有序流动，实现产业链上下游的紧密衔接，为全面建设社会主义现代化强国提供强大动力。"
 PRC_nl_super_project: "超级工程的黎明"
 PRC_nl_super_project_desc: "人类历史上的超级工程总是标志着一个时代的技术巅峰与民族雄心。\n\n在社会主义制度的优越性和集中力量办大事的组织能力支持下，我们即将启动一系列震撼世界的超级工程。\n\n从太空电梯到跨洋隧道，从海底城市到沙漠绿化，这些曾被认为是天方夜谭的宏伟构想将在我们的国土上逐一实现。\n\n超级工程不仅是技术的集大成者，更是展现社会主义制度优越性的重要窗口，是凝聚人民力量的精神丰碑。\n\n通过实施这些超越时代的工程，我们将彻底改变国家面貌，开启社会主义建设新的黎明。"
 PRC_nl_free_and_equal_labor: "自由而平等的劳动"
 PRC_nl_free_and_equal_labor_desc: "在改革开放之后，存在着大量的“工贼”：一方面他们贱卖着自己的劳动，一定程度上推动了内卷的环境，而另一方面则是在吃到时代红利以后死死不放手，似乎这是为他们而量身定做的。\n\n是时候擦干净我们的眼睛——§R劳动是平等的，是自由的。§!\n\n发挥特长，各取所需：新一轮的现代化建设极大丰富了我们的物质社会，这促使着我们开始朝着新的社会交易方式发展，为此，我们终于可以朝着我们的共产主义理想社会踏出一大步——发挥特长，各取所需。"
 PRC_nl_free_life_supplement: "生活资料的无偿供给"
 PRC_nl_free_life_supplement_desc: "家家有本难念的经，柴米油盐酱醋茶。\n\n在今天，我们将开始把这些人民生活的必需品慢慢的从商品架上移除，取而代之以免费供应来惠及全体人民，保障他们的基本生活需求。"
 PRC_nl_gain_from_each_good: "发挥特长，各取所需"
 PRC_nl_gain_from_each_good_desc: "新一轮的现代化建设极大丰富了我们的物质社会，这促使着我们开始朝着新的社会交易方式发展，\n\n为此，我们终于可以朝着我们的共产主义理想社会踏出一大步——§R发挥特长，各取所需。§!"
 PRC_nl_commonhappy: "愿所有人得幸福"
 PRC_nl_commonhappy_desc: "每个人都会有自己的幸福之道，在实现的路上，不仅有充足的物质保障，更有彼此对美好生活的向往和更高的追求。\n\n幸福路上，我们一并前行，与我们的同志，我们的人民一并，实现世上的美好幸福。"
 PRC_nl_new_sky: "敢教日月换新天"
 PRC_nl_new_sky_desc: "我们的任务还很重，我们的时间很紧迫。\n\n但是，我们的美德很棒，我们的人民很开心，我们的生活很富足，我们的活动很多姿。\n\n现在，我们可以自豪的宣布——§Y我们的付出是值得的。要相信，人定胜天。§!"
 PRC_nl_building_foundation_of_model: "构建模型基础"
 PRC_nl_building_foundation_of_model_desc: "尝试一个新型计划经济的基础便需要一个相应的计算模型。而这一过程不仅需要经济学家结合马克思主义思想，还需要劳动者群众广泛参与。因此，我们需要在价值核算的基础上搭起一个人民与学者共筑的，能稳定运行的模型。"
 PRC_nl_China_shocks_world: "当惊世界殊"
 PRC_nl_China_shocks_world_desc: "站在新的起点上，我们的社会主义建设取得了巨大的成果，在人民群众的辛勤劳动下，我们的科技，经济已经站在了世界顶尖水平。而现在，我们更应百尺竿头，更进一步，拓展我们的事业与成果，然后把它们交到人民手中。"
 PRC_nl_old_transformed_newlook: "旧貌换新颜"
 PRC_nl_old_transformed_newlook_desc: "回首望去，统一战争带来的疮痍不再，昔日劳动者迫于生活难以喘息的困境不再，脑满肥肠的资本家和压迫者不再。我们的经济日渐集体化，社会化，我们的人民富足而幸福，我们的国家经过改革焕发了生机。但是目前，我国地区发展不均衡，城乡矛盾沟壑仍深…我们只走完了征程的一小部分，而希望仍仍在地平线上。我们的改革只有进行时，没有完成时。我们仍要一直奋斗下去，直到那共产主义明天到来。"

########经济（科技）线########
 PRC_nl_national_science_committee: "组建中央科技委员会"
 PRC_nl_national_science_committee_desc: "§Y当今世界，科技乃强国之本。§!\n\n为了加强党中央对科技工作的集中统一领导，中央决定组建中央科技委员会并重组科学技术部，以此推进科技创新治理体系与治理能力现代化进程。"
 PRC_nl_research_institution_consolidation: "整合科研机构"
 PRC_nl_research_institution_consolidation_desc: "审计发现诸多单位存在重复性研究课题，浪费科研资源，同时部分科研机构陷入“论文锦标赛”怪圈，基础研究与应用转化间存在严重断层。\n\n我们将整合部分科研机构来解决重复造轮子的问题。同时鼓励科研人员走出实验室，实地了解劳动人民的需求，做到产学研一体化的良好科研环境。"
 PRC_nl_nationalized_tech_industry: "国有化技术产业"
 PRC_nl_nationalized_tech_industry_desc: "我国的科技事业的推进不仅仅有国有单位的参与，民营企业也极大的促进了各项先进技术的落地和实用。\n\n但由于私人资本的局限性，构建技术壁垒、重复研究和骗取经费等浪费资源的现象层出不穷，对此我们将统一整合各大实验室和科研机构，将他们统一团结在集体领导之下，更加高效地推进我国科技事业的发展。"
 PRC_nl_military_civilian_integration: "推动军民融合"
 PRC_nl_military_civilian_integration_desc: "军民融合既能通过民用产能摊平军事成本，又以高精军事技术促进民用产业升级，达成了合作共赢的效果。\n\n毛主席在多年前就提出了§Y“军民结合，平战结合”§!的方针，在战争阴云越来越浓厚的当下，我们需要把国防建设与经济发展结合起来，为实现国防和军队现代化提供丰厚的资源和持久的后劲。"

#####科技左线#####
 PRC_nl_digital_planning_committee: "重组数字中央计划委员会"
 PRC_nl_digital_planning_commitiee_desc: "美国内战以来，国内国际经济形势均起了重要变化。\n\n原有全球化体系的彻底崩盘让我们不得不将大部分产业进行公有制改造来避开国际金融浪潮的冲击。\n\n为了更好的管理这些财产，我们需要重组中央计划委员会，并引进科技手段来辅助管理。"
 PRC_nl_maoist_vision: "回望毛主席的愿景"
 PRC_nl_maoist_vision_desc: "毛主席在革命之初的愿景是什么？\n\n§Y是人民当家作主，真正成为国家的主人。§!\n\n我们在接下来的工作之中应当牢记这一点，绝不能让新时代的中计委沦为官僚阶级剥削百姓的工具，重蹈苏联的覆辙。"
 PRC_nl_adopting_ASPR_experience: "吸收АСПР的经验"
 PRC_nl_adopting_ASPR_experience_desc: "§YАСПР（Автоматизированная система плановых расчетов，自动化计划计算系统）§!\n\n是苏联国家计划委员会于196年代中期开发的核心项目，旨在通过分阶段数字化和自动化经济计划流程，克服传统中央计划经济的低效问题。\n\n虽然因为技术原因和官僚的重重阻挠无法完全实现，但是在实践中取得了一定成果。\n\n他山之石，可以攻玉，我们将吸收其经验，保证新的系统正常运行。"
 PRC_nl_automation_model: "建构价值核算体系"
 PRC_nl_automation_model_desc: "随着前期准备工作的圆满完成，第一版自动化经济模型的修订工作已正式启动。\n\n在中计委同志们的不懈努力和广大人民群众的积极参与下，这无疑将成为自动化社会主义发展道路上的重要里程碑！"
 PRC_nl_introduce_worker_supervision: "引入工人监管"
 PRC_nl_introduce_worker_supervision_desc: "无论我们付出多大努力，任何试图描述现实的模型都无法达到绝对精确。\n\n因此，我们需要引入工人的监督机制，根据他们的实际反馈持续调整我们的自动化经济模型，从而确保系统能够维持在理想的运行状态。"
 PRC_nl_decentralized_construction: "去中心化构建"
 PRC_nl_decentralized_construction_desc: "苏联的经验教训表明，建立汇集全国数据的单一计算中心是一个难以达成的目标。\n\n因此，我们需要采取北京主导的星型网络架构，让数据处理和决策能力分布在多个区域节点之中，但保持中央的最高权限和监督。\n\n这种半分布式系统不仅能够减轻中央处理的压力，还能更好地适应各地区不同的经济特点和需求变化。\n\n通过赋予地方节点一定程度的计算自主权，同时确保北京核心节点拥有最终决策权和数据调度权，我们可以构建一个既有统一协调性又具备灵活应变能力的经济管理网络，实现社会主义计算体系的现代化升级与创新。"
 PRC_nl_state_enterprise_pilot_operations: "国有企业试点运行"
 PRC_nl_state_enterprise_pilot_operations_desc: "我们将在国有企业中率先试点自动化经济系统，这些企业作为国民经济的支柱，具备先行先试的条件和责任。\n\n试点将建立覆盖全生产链的智能传感网络，实时采集和分析数据，为宏观调控提供科学依据。\n\n同时我们将鼓励一线工人参与系统设计和优化，避免脱离实际。我们的目标不是用机器替代人，而是解放人的创造力，让劳动者真正成为经济建设的主人！"

#####科技右线#####
 PRC_nl_dawn_project: "触及“曙光”"
 PRC_nl_dawn_project_desc: "在863计划之后，我们的科学技术取得了长足的发展，已经迈入创新国家俱乐部的殿堂。\n\n不过这还远远不够，中央已经批准了一项宏大的计划--§Y“曙光工程”§!，此工程致力于多个新兴科研领域的研究，如新能源，人工智能，航空航天等。\n\n从此，§R即使是最宏大最激进的设想我们也有能力将其实现。§!"
 PRC_nl_investment_in_new_energy: "加大新能源投入"
 PRC_nl_investment_in_new_energy_desc: "随着各种搭载AGI的超级计算机深度介入社会运行，电力的需求急剧增加，传统的燃煤电站已无法承载其需求。\n\n我们将建造各种大型新能源枢纽，如塔克拉玛干光伏电站，南海温差发电厂，第四代裂变电站等等，以此为更进一步的自动化做好准备。"
 PRC_nl_quantum_supercomputer: "掌握量子霸权"
 PRC_nl_quantum_supercomputer_desc: "我们现有的超级计算机远远不能承担整个社会的自动化进程,\n\n现在是时候把目光转向更激进的选项了——科学家已经开发出了具有§Y“量子霸权”§!的量子计算机原型，\n\n其算力远超现有电子基础的超算，是时候进一步将其实用化，让其成为社会主义自动化的基石了。"
 PRC_nl_stellar_exploration: "远望星辰"
 PRC_nl_stellar_exploration_desc: "随着美国陷入内战，我国已经成为唯一的航天超级大国。\n\n在吸纳来自世界各地的航天人才之后，我国的太空事业已经有了长足的发展，我们有能力也有义务将人类的足迹送上前所未有的顶峰!\n\n现在是时候开启一系列航天工程，将我们的梦想化为现实了!"
 PRC_nl_sensor_network_deployment: "铺设传感器网络"
 PRC_nl_sensor_network_deployment_desc: "苏联人对自动化有这么一句调侃：“我们需要把在所有牛羊上装满传感器！” 而如今，得益于前所未有的工业产能，这一曾经看似荒谬的设想已成为可能。\n\n我们将在新建的厂房中全面部署各类先进传感器网络，为我国自动化浪潮奠定坚实的技术基础，推动产业向智能化、数字化转型的新阶段迈进。"
 PRC_nl_fusion_power_demo: "永耀之星"
 PRC_nl_fusion_power_demo_desc: "聚变电站目前来说尚未成熟，但是其前景不可谓不诱人——想象一下地球上每一滴水都能作为燃料的场景吧！\n\n我们将在未来的建设当中加大对聚变技术的投入，争取在一段时间内将聚变电站接入我国电网。"
 PRC_nl_smart_building_development: "智能建筑发展"
 PRC_nl_smart_building_development_desc: "随着自动化经济系统的全面铺开，智能建筑作为覆盖全国物联网的重要组成部分，正在迅速崛起。\n\n通过建筑物内的智能传感网络，我们将实现对能源消耗、空间利用、物资流动的精确把握，为整个经济系统提供更加可靠的基础数据，推动我国自动化经济迈向新的高度。"
 PRC_nl_focus_on_small_infrastructure: "关注小微基础设施"  
 PRC_nl_focus_on_small_infrastructure_desc: "在先前的基础设施建设当中，我们更偏重于如铁路、公路等大型基础设施，而往往忽视了小微基础设施的重要性。\n\n如今，随着自动化经济系统的深入推进，我们必须转变思路，将小微基础设施纳入国家建设的重要议程。这些覆盖城乡的小微基础设施——包括社区服务中心、基层医疗站、文化活动场所、智慧菜市场、社区数据中心等，正是连接千家万户与国家经济网络的毛细血管。\n\n它们虽小，却能收集最贴近人民生活的基础数据，为自动化经济系统提供最真实的需求信号。只有当这些微小的“神经元”全面覆盖城乡，形成无缝对接的物联网体系，我们的自动化经济系统才能真正实现对社会资源的科学配置，服务人民群众的美好生活。"
 PRC_nl_long_march_plan: "启动长征计划"
 PRC_nl_long_march_plan_desc: "实践证明，自动化经济系统的全面运行为我国经济发展注入了新的活力，而今天，随着§R“长征”§!智能模型的引入，我们的数字化治理将迈上新台阶。\n\n§R“长征”§!智能不仅仅是一个技术工具，更是我们党在新时代传承长征精神的创新实践。\n\n正如当年红军战胜千难万险完成长征一样，§R“长征”§!智能将帮助我们攻克经济治理中的复杂难题。\n\n这一模型能够深入分析各类社会经济数据，为各级党政机关提供科学决策支持，使我们能够更加精准地把握经济发展规律，更好的服务于人民群众。"
 PRC_nl_national_IoT_construction: "全域物联网建设"
 PRC_nl_national_IoT_construction_desc: "我国正全面推进全域物联网建设，这是实现自动化经济系统的关键基础。\n\n毛主席教导我们：§Y“要调查研究，摸清情况”§!，而全域物联网正是新时代全面§Y“摸清情况”§!的重要手段。全域物联网将覆盖从城市到乡村，从工厂到农田，从交通枢纽到社区小巷的所有角落，构建起横跨全国的神经网络。\n\n这项庞大的工程将使我国经济系统实现从“盲人摸象”到“全景透视”的质变，为科学决策提供可靠依据，推动我国在新时代的社会主义建设中迈向新的高度。"
 PRC_nl_comprehensive_social_integration: "全面引入社会"
 PRC_nl_comprehensive_social_integration_desc: "经过国有企业试点的成功实践和全域物联网的基础铺设，我们的自动化经济系统已经具备了全面引入社会的条件。\n\n随着系统在全社会的推广应用，我们将逐步实现从§Y“人治”§!到§Y“科学治理”§!的转变，既避免苏联模式中的僵化教条，又克服资本主义的无序竞争，走出一条前所未有的道路。\n\n但在推广过程中，我们必须§R警惕§!脱离群众的技术主义倾向。自动化系统再先进，也不能替代人民群众的主体地位。\n\n我们要坚持§Y“以人为本”§!，确保技术为人服务，而非相反。各级干部必须深入基层，倾听群众意见，不断完善系统，让人民真正成为自动化经济的主人。"
 PRC_nl_autonomous_iteration_system: "自主迭代系统"
 PRC_nl_autonomous_iteration_system_desc: "在正式上线运行之后，潮水般的数据涌入了数字中央计划委员会的数据库，我们意识到处理这些数据已经不是人力可以做到的。\n\n面对这前所未有的信息洪流，我们必须依靠系统自身的智能迭代能力，实现对海量数据的科学分析和处理。\n\n系统通过分析生产和消费的实时数据，能够迅速发现供需矛盾，及时调整生产计划，避免了传统计划经济中信息滞后导致的资源浪费。\n\n随着自主迭代系统的不断成熟，我们将实现从粗放式管理到精细化治理的转变，使国民经济犹如一个有机整体，各部分协调运行，为建设现代化强国提供强大动力。"
 PRC_nl_integrate_long_march_AI: "将同志纳入NEMS"
 PRC_nl_integrate_long_march_AI_desc: "实践证明，自动化经济系统的全面运行为我国经济发展注入了新的活力，而今天，随着“长征”智能模型的引入，我们的数字化治理将迈上新台阶。“长征”智能不仅仅是一个技术工具，更是我们党在新时代传承长征精神的创新实践。正如当年红军战胜千难万险完成长征一样，“长征”智能将帮助我们攻克经济治理中的复杂难题。这一模型能够深入分析各类社会经济数据，为各级党政机关提供科学决策支持，使我们能够更加精准地把握经济发展规律，更好的服务于人民群众。"
 PRC_nl_digital_communist_vision: "数字共产主义愿景"
 PRC_nl_digital_communist_vision_desc: "在网络空间之中，无数信息和数据汇集成奔流不息的虚拟海洋。\n\n中国的社会主义巨轮便乘着这滚滚数码波涛，§R向共产主义的光明未来不断前进！§!"

