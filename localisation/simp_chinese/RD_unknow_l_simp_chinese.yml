 PRC_papersama: "PaperSAMA"
 PRC_papersama_desc: "PaperSAMA是红果群u中最为压抑的一个人，对萝莉有着无比的执着，可以说没有萝莉就没有PaperSAMA。但由于PaperSAMA常常顶着艾玛头像，于是便成为群U们的虐待对象，于是他发誓要成为所有反萝莉控的噩梦，成为萝莉控的太阳与伟大舵手……"
