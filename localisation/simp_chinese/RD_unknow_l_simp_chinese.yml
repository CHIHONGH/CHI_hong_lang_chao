 MEX_corn_man: "玉米仙人"
 PRC_minecraft: "Minecraft"
 PRC_minecraft_desc: "Minecraft作为鸽子精和赛博老八，他每天最大的乐趣就是往群里搬史，品鉴各种大粪mod和坚持吃大粪游戏已经成为他日常生活的一环，他也在坚持不懈地向群友推荐他玩的各种大粪mod和大粪游戏。"
