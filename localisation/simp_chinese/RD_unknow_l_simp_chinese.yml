 PRC_red_fruit: "赤色果实"
 PRC_red_fruit_desc: "今天要种玉米，明天也要钟玉米，未来都要种玉米——这就是红果黎明制作组中最有“理想信念”的农友赤色果实，为了解决红果水群的粮食问题，他毅然决然地要分水群到户，大肆推广玉米种植，搞一个“红果奇迹”，听说还要拿黄金外汇来买外群粮食，真不愧是红果人民的好儿子（大拇指）。"
