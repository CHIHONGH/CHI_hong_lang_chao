 PRC_xiaowang: "小王系佳门"
 PRC_xiaowang_desc: "“叶若夫的”红果黎明最年轻的人，小王系佳门总是以饱满的热情投入对外的情报（搬石）工作中，名义上以美工组组员和“建制左派”的身份活动，实际上他作为狂热分子为红果黎明的对外理论输出提供了一定掩护。你在看这段文字吗？请速速支持红色黎明MOD，如果是资狗修狗请你把你的所有资产上交国计委或者工委会自己找一根绳子吊死……"
 MEX_ever_yound: "叶若夫永远年轻"
 MEX_against_cap_value: "进攻资产阶级法权"
 PRC_qiyanuo: "看乐子の九"
 PRC_qiyanuo_desc: "一个顶着琪露诺铸币大头的普通水群群友。人如其名，看乐子是真喜欢看，九也是真的九，交朋友更是纯看聊不聊得来，导致其好友意识形态光谱涵盖左中右（甚至是第三位置）。不过，如果因为怕污染大脑就不去看乐子，那跟大脑被污染了有什么区别？！"
 MEX_united_shaysh_of_america: "拱火吃大瓜"
 MEX_math_home: "完美算数教室"
 MEX_math_home_tt: "  - £research_speed_texticon 科研速度：§R-99.00%§!\n  - £GFX_stability_texticon 稳定度：§R-99.00%§!\n  - £war_support_texticon 战争支持度：§R-99.00%§!"
 PRC_pliat: "无产者"
 PRC_pliat_desc: "忠于党和人民，忠于共和国，一名年轻博学的建制派，怀揣着共产党人的初心和使命，走入了红色黎明的世界。在这里，我们一定能实现中华民族的伟大复兴，世界人民大团结一定能够实现！"
 MEX_new_sky: "新的天地"
 PRC_zhe_ergen: "蛰尔根"
 PRC_zhe_ergen_desc: "这位红果群友面善又友善，作为一个普通的水群群友，他享受着八十平米的小窝，还有个温柔的好棍木，每天能水两下群聊就美得不得了，哪有今天这么好的条件，唯一能困扰他的只有中系载具头号大敌bvvd。针对群友的xyy问题，他认为，飞机杯才是真正的蓝海，我是准备赚得盆满钵满的，真的是好安逸哟，好巴适哟！"
 MEX_revenge_on_czar: "对沙皇的复仇"
 MEX_plane_cup: "飞机杯巨头"
 PRC_east_dawn: "东方晨曦"
 PRC_east_dawn_desc: "东方晨曦是谁？红黎策划，军事线负责人，抑或是组内最大的见证头子？无论怎么讲，在一个新左submod里出现这种人似乎都非同寻常。\n\n在墙内外的见证圈视奸多年，东方早已炼成了金刚不坏之躯，无论多么逆天的暴论都能等闲视之，正因如此，在勤勤恳恳写作之余，他时常能搬来或整出一些逆天玩意让组内大开眼界。这到底是福是祸？恐怕只有天知道了……"
 MEX_hoi: "百战不灭" 
 PRC_alice: "爱丽丝"
 PRC_alice_desc: "在这个无论是左派还是自由派都谈民族主义色变的时代，一个宣称“一切普世价值，无论它自称是什么颜色、什么意识形态体系，都该被丢进火里”的人大概率是个民族主义保守派。在这个无论是安那其分子还是猫派都宣称要用宪政和制度对“先锋队”和“官僚”进行限制的时代，一个公开宣称“我们将对一切资产阶级开放奥斯维辛”的人大概率是一个专制主义分子；而在这个右翼谈着“民族黄金时代”、“伟大军事化队伍”和“宗教圣典律法”的时代，一个公开宣称“一切千年帝国，无论什么形式，无论在精神上还是物质上，都是人类的肿瘤”的人大概率是最不可理喻的恐怖分子。\n\n而聚集这三者就是Alisa。"
 MEX_maniac: "狂热分子"
 PRC_atiman: "Atiman"
 PRC_atiman_desc: "“神所创造的世界，并非完美。”作为世界最强组织——“秩序英雄”（Hero of making oder，简称Homo）的领导人，阿塔曼有旗下几位大将：拥有“林檎之力”的田所浩二，表面是著名美食家实际上是顶尖特工的德川，我修院二人组，参与“千年雪战”的老兵西条拓也，以及便乘佛教继承人三浦和“天眼”木村。“雪之恶魔”因为十二神器的出现而被唤醒，他宣布“神用七天创造世界，而我将用七天重构它。”于是一场雪暴危机即将从下北泽席卷全世界，而对此Homo们的应对方法是……"
 MEX_homo_king: "Homo的领导者"
