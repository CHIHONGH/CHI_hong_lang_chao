 PRC_loyal_oldman: "忠诚的老实人"
 PRC_loyal_oldman_desc: "正如他已经用了8年的头像——暗鸦守卫军团的尼康纳·沙罗金那样，老实人在用兵（指打策略游戏）时偏好避实击虚，以各种在意想不到的地方刷出的部队让对手背后一寒。再通过爆破产能兵不血刃地让对面打出GG（或者被有故事的对手反打）。在有了实际自领一军的机会后，如今的他正准备着用自己的下三路战术让共和国的敌人露出笑容……"
 PRC_diamond_of_time: "岁月之钻"
 PRC_diamond_of_time_desc: "尽管在红黎下属群聊中疯狂出没视奸所有人，但实际上是个普通的好人呢（大概？）。由于对文书工作实在不擅长，红黎核心们不得不将这位找不到工作的奇怪路人水友放在这个位置上，以确保他不会被某些莫名其妙的地雷傲娇北京地道男娘包养……"
 MEX_eyeist: "疯狂的视奸者"
 MEX_theorist: "理论研究者"
 PRC_changqi_shuangshi: "长期素食"
 PRC_changqi_shuangshi_desc: "在2025年2月初，长期素食作为一个普通成员加入了红黎组，面对无策划无数控的情况，他尽可能得征求多方意见，将问题和矛盾带到讨论的范畴，而后，又在几次处理外务中展露头角，逐渐成为核心组员。他面临着“意识形态不坚定”的多重指控，但是划为实用主义的“灰烬帮”也并无不可，现在，他依旧守在策划案边改数值边骂娘，说甚麽自己“越了解越拥护”，并加班加点完成组内的跃进项目，在闲暇之余，他也乐于依照组员和水友特性安上勃勃执政时期各类官员的群头衔。"
