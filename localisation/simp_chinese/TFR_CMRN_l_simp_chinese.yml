  # ========== 战后事件 ==========
  TFR_CMRN.8.t:0 "外蒙古治理完成"
  TFR_CMRN.8.d:0 "经过系统的整肃与战后重建，原蒙古国全境的军事管制措施已全部解除。外蒙古正式纳入我国的治理体系。\n\n草原上的伤口正在愈合，一个新的时代拉开了序幕。"
  TFR_CMRN.8.a:0 "草原终于安宁了。"
  TFR_CMRN.9.t:0 "外蒙古军管区建立"
  TFR_CMRN.9.d:0 "蒙古国的反动派已在战争中覆灭，其领土被我国全面控制。但战争的创伤远未愈合——外蒙古全境散布着反动残余武装、基础设施严重损毁、经济生产几乎崩溃。\n\n我国已建立战时军管体制。我们必须在五个主要地区逐步完成整肃、重建、经济恢复和民族和解，才能实现长治久安。\n\n军管区的debuff将分四步逐步消除。请打开§Y外蒙古军管区治理§!分类查看详情。"
  TFR_CMRN.9.a:0 "任务明确。开始行动。"

