  # ========== 帮助 tooltip ==========
 TFR_CMRN_help_tooltip:0 "§Y关于中蒙和统谈判的指导§!\n\n§H一、谈判框架§!\n我方将与蒙古政府展开三轮闭门磋商，每轮为期六十日。我方主动出牌，蒙方将视我方动态度回应。\n\n§H二、术语解释§!\n§G蒙古统一倾向§!：蒙古社会对统一前景的态度倾向。\n§R中国外交影响§!：我方在蒙古决策层中的话语权重。\n两项指标均在谈判过程中随双方策略动态变化。\n\n§H三、终局评估§!\n  统一意愿 = §G蒙古统一倾向§! × (§R中国外交影响§! × 我方工厂数量 × 0.008)\n当意愿值高于 §Y1§! 则§G和平统一§!\n否则将采取§R军事解决方案§!"


