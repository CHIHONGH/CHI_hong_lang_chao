 # ========== 事件 ==========
 TFR_CMRN.1.t:0 "中蒙边境问题会谈启动"
 TFR_CMRN.1.d:0 "经中蒙双方商定，边境问题会谈于今日正式启动。中方一贯主张通过平等协商解决边境问题，愿以最大诚意和耐心同蒙方交换意见，推动两国关系行稳致远。\n\n会谈进展情况将按程序对外公布。"
 TFR_CMRN.1.a:0 "召开首次会谈"
 
 TFR_CMRN.2.t:0 "中蒙谈判 — 第二轮"
 TFR_CMRN.2.d:0 "第一轮谈判已经结束。双方代表团回到了谈判桌前。第一阶段的外交试探已经过去，现在进入了对蒙古前途命运的博弈。"
 TFR_CMRN.2.a:0 "继续博弈。"
 
 TFR_CMRN.3.t:0 "中蒙谈判 — 最终轮"
 TFR_CMRN.3.d:0 "最后一轮谈判已经开始。这是决定外蒙古未来的最后期限。要么和平统一，要么兵戎相见，别无选择。"
 TFR_CMRN.3.a:0 "祖国必得统一。"
 
 TFR_CMRN.5.t:0 "外蒙古和平回归"
 TFR_CMRN.5.d:0 "经过三轮艰苦谈判，蒙古政府正式接受和平统一。这片自民国以来便游离于中国版土之外的土地终于在和平中回归了祖国的怀抱。
 TFR_CMRN.5.a:0 "欢迎回家！"
 
 TFR_CMRN.6.t:0 "中国对蒙古宣战"
 TFR_CMRN.6.d:0 "中蒙和统谈判最终未能达成协议。北京方面宣布，中国人民解放军已奉命开赴边境。外蒙古的命运，将由战场来决定。"
 TFR_CMRN.6.a:0 "不惜一战！"

 # ========== 战争决议确认事件 ==========
 TFR_CMRN.7.t:0 "最终决定"
 TFR_CMRN.7.d:0 "没必要在和那群反动派多费口舌了。外蒙古的人民已经在官僚寡头和外国资本的束缚下受苦受难数十余年，是时候解放他们了。
 TFR_CMRN.7.a:0 "前进!"

