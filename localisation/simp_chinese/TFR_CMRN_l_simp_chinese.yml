 # ========== 事件 ==========
 TFR_CMRN.1.t:0 "中蒙和统谈判开始"
 TFR_CMRN.1.d:0 "在长期的外交努力下，中华人民共和国与蒙古政府终于坐在了谈判桌前。双方将在三轮限时谈判中就外蒙古的统一问题进行磋商。历史的进程，将由这份谈判桌上的意志来决定。"
 TFR_CMRN.1.a:0 "让谈判开始吧。"
 
 TFR_CMRN.2.t:0 "中蒙谈判 — 第二轮"
 TFR_CMRN.2.d:0 "第一轮谈判已经结束。双方代表团回到了谈判桌前。第一阶段的外交试探已经过去，现在进入了真正的博弈——经济、主权、资源、地缘。桌上筹码变了。"
 TFR_CMRN.2.a:0 "继续博弈。"
 
 TFR_CMRN.3.t:0 "中蒙谈判 — 最终轮"
 TFR_CMRN.3.d:0 "最后一轮谈判已经开始。这是决定外蒙古未来的最后六十天。要么和平统一，要么兵戎相见——没有第三条路。所有的牌都已经摊在桌上了。"
 TFR_CMRN.3.a:0 "决战的时刻到了。"
 
 TFR_CMRN.5.t:0 "外蒙古和平回归"
 TFR_CMRN.5.d:0 "经过三轮艰苦谈判，蒙古政府正式接受和平统一。外蒙古——这片自民国以来便游离于祖国版土之外的土地——终于在和平的旗帜下回归了中华人民共和国。这不是征服，而是一次历史性的民族和解。"
 TFR_CMRN.5.a:0 "欢迎回家！"
 
 TFR_CMRN.6.t:0 "谈判破裂！中国对蒙古宣战"
 TFR_CMRN.6.d:0 "中蒙和统谈判最终未能达成协议。北京方面宣布，和平之门已经关闭。中国人民解放军已奉命开赴边境。外蒙古的命运，将由战场来决定。"
 TFR_CMRN.6.a:0 "不惜一战！"

 # ========== 战争决议确认事件 ==========
 TFR_CMRN.7.t:0 "最终决定"
 TFR_CMRN.7.d:0 "你批准了对蒙古的战争决议。\n\n命令已经下达。边境线上，解放军已开始集结。\n\n消息传出后，国际社会必将哗然。但有些事，终究要有人去做。\n\n外蒙古的命运——将由军人的血性来决定，而不是谈判桌上的空谈。\n\n这一战，我们等了一百年。"
 TFR_CMRN.7.a:0 "为了那片失落的土地——进攻！"

