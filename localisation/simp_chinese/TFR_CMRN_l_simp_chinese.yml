 # ========== 第1轮 - PRC 决议 ==========
 TFR_CMRN_friendly_memo:0 "递交友好备忘录"
 TFR_CMRN_friendly_memo_desc:0 "向蒙古外交部递交一份措辞温和的友好备忘录，表达和平统一的意愿。"
 
 TFR_CMRN_open_erenhot:0 "开放二连浩特口岸"
 TFR_CMRN_open_erenhot_desc:0 "扩大中蒙最大陆路口岸二连浩特的通关能力，让两国边贸与人员往来更加便捷。"
 
 TFR_CMRN_grassland_silk_road:0 "草原丝绸之路倡议"
 TFR_CMRN_grassland_silk_road_desc:0 "提出一条贯穿内蒙古与蒙古国的草原经济走廊方案，以基建投资换取蒙古的合作意愿。"
 
 TFR_CMRN_cultural_exchange:0 "文化交流年"
 TFR_CMRN_cultural_exchange_desc:0 "共同举办中蒙文化交流年活动，同时利用我国社交平台增进两国人民之间的交流，让年轻一代蒙古人更了解他们的南方邻居。"
 
 TFR_CMRN_diplomatic_note_r1:0 "外交照会跟进"
 TFR_CMRN_diplomatic_note_r1_desc:0 "通过外交部渠道再次发出照会，提醒蒙古方面我方在统一问题上的立场。"
 
 # ========== 第2轮 - PRC 决议 ==========
 TFR_CMRN_tavan_tolgoi:0 "塔旺陶勒盖煤矿投资"
 TFR_CMRN_tavan_tolgoi_desc:0 "全球最大的未开发煤矿之一就在南戈壁。我们将出资开发此地，以能源合作为杠杆推动谈判进程。"
 
 TFR_CMRN_railway_gauge:0 "跨境铁路标准轨改造"
 TFR_CMRN_railway_gauge_desc:0 "蒙古现有铁路使用俄罗斯宽轨，与中国标准轨不互通。出资改造扎门乌德至二连浩特的铁路换装站，打通两国铁路连接。"
 
 TFR_CMRN_rare_earth:0 "稀土合作框架"
 TFR_CMRN_rare_earth_desc:0 "蒙古拥有丰富的稀土矿藏，而中国掌握全球最成熟的稀土加工产业链。建立联合开采与加工框架，让蒙古的资源物尽其用。"
 
 TFR_CMRN_joint_anti_terror:0 "联合反恐演习"
 TFR_CMRN_joint_anti_terror_desc:0 "邀请蒙古人民军参加中俄联合反恐演习，在军事层面建立互信。"
 
 TFR_CMRN_economic_incentive_r2:0 "经济激励方案"
 TFR_CMRN_economic_incentive_r2_desc:0 "向蒙古提供一笔经济激励资金，用利益软化对方的谈判立场。"
 
 TFR_CMRN_escalated_pressure_r2:0 "升级施压"
 TFR_CMRN_escalated_pressure_r2_desc:0 "召见蒙古驻华大使，以外交辞令表达不满。同时放出风声：如果谈判没有进展，中方将重新评估对蒙经济合作。"
 
 # ========== 第3轮 - PRC 决议 ==========
 TFR_CMRN_final_unification_plan:0 "最终统一方案"
 TFR_CMRN_final_unification_plan_desc:0 "这是一份包含政治安排、经济过渡、安全保证在内的一揽子统一方案。没有比这更好的条件了。蒙古必须尽快做出选择。"
 
 TFR_CMRN_full_economic_integration:0 "全面经济一体化"
 TFR_CMRN_full_economic_integration_desc:0 "提出中蒙关税同盟与统一市场的远景规划。一旦统一，外蒙古将享受与内地省份同等的投资、补贴与发展政策。"
 
 TFR_CMRN_autonomy_concession:0 "敲定蒙古行政区划"
 TFR_CMRN_autonomy_concession_desc:0 "作为让步，中方承诺统一后蒙古将享有高度自治权，尊重蒙古人民的意愿组建一个新的民族自治区。"
 
 TFR_CMRN_joint_mining:0 "联合矿业公司"
 TFR_CMRN_joint_mining_desc:0 "提议成立中蒙联合矿业集团，蒙古以矿产入股、中国以技术和市场入股，以此加强两地的经济关系"
 
 TFR_CMRN_ultimatum_note_r3:0 "最后通牒式照会"
 TFR_CMRN_ultimatum_note_r3_desc:0 "发出最后的外交通牒：要么在本轮结束前接受，要么中方将不得不考虑军事选项。“
 
 TFR_CMRN_declare_war_now:0 "拒绝谈判"
 TFR_CMRN_declare_war_now_desc:0 "既然他们不吃敬酒，那只能请他们吃罚酒了。准备开战吧。"
 
 # ========== 第1轮 - MON 决议 ==========
 TFR_CMRN_mon_demand_clarification_r1:0 "要求解释中方意图"
 TFR_CMRN_mon_demand_clarification_r1_desc:0 "蒙古外交部召见中国大使，要求北京就近期一系列外交动作作解释。"
 
 TFR_CMRN_mon_emphasize_neutrality_r1:0 "强调中立传统"
 TFR_CMRN_mon_emphasize_neutrality_r1_desc:0 "蒙古是永久中立国。向国际社会重申这一立场，表示蒙古不会在大国博弈中选边站。"
 
 TFR_CMRN_mon_accept_border_aid_r1:0 "接受边境发展援助"
 TFR_CMRN_mon_accept_border_aid_r1_desc:0 "南戈壁和东戈壁省的基础设施确实需要改善。接受中方的边境援助方案，但搁置更多的政治条件。"
 
 TFR_CMRN_mon_delay_tactics_r1:0 "拖延谈判"
 TFR_CMRN_mon_delay_tactics_r1_desc:0 "以需要更多时间研究提案为由，推迟正式答复。争取以拖待变。"
 
 # ========== 第2轮 - MON 决议 ==========
 TFR_CMRN_mon_internal_mobilization_r2:0 "国内动员抗压"
 TFR_CMRN_mon_internal_mobilization_r2_desc:0 "面对大国博弈的压力，我们将启动国内舆论动员与民族凝聚力建设。没有外援，就只能靠自己。"
 
 TFR_CMRN_mon_lean_on_russia_r2:0 "向[SOV.GetName]靠拢"
 TFR_CMRN_mon_lean_on_russia_r2_desc:0 "作为上合组织观察员国和[SOV.GetName]的传统伙伴，我们必须在这个时刻提醒北京：我们的北方也有朋友。"
 
 TFR_CMRN_mon_mineral_sovereignty_r2:0 "矿产主权声明"
 TFR_CMRN_mon_mineral_sovereignty_r2_desc:0 "蒙古议会通过一项决议，重申国家对所有矿产资源的主权。任何投资协议都必须以蒙古法律为准。"
 
 TFR_CMRN_mon_conditional_coop_r2:0 "有条件合作"
 TFR_CMRN_mon_conditional_coop_r2_desc:0 "蒙古愿意在经济领域与中国深化合作，但必须在完全尊重蒙古主权的前提下进行。"
 
 TFR_CMRN_mon_national_mobilization_r2:0 "全国总动员"
 TFR_CMRN_mon_national_mobilization_r2_desc:0 "在这个危险的世界里，没有任何外部力量能够帮助蒙古。我们唯一能依靠的，只有自己的军队。"
 
 # ========== 第3轮 - MON 决议 ==========
 TFR_CMRN_mon_accept_unification_r3:0 "接受统一条件"
 TFR_CMRN_mon_accept_unification_r3_desc:0 "我们别无选择，只能接受北京的条件……"
 
 TFR_CMRN_mon_un_intervention_r3:0 "请求联合国紧急介入"
 TFR_CMRN_mon_un_intervention_r3_desc:0 "蒙古向联合国安理会提交紧急动议，要求国际社会介入斡旋。"
 
 TFR_CMRN_mon_referendum_r3:0 "全民公决准备"
 TFR_CMRN_mon_referendum_r3_desc:0 "启动全国公投程序，让蒙古人民自己决定是否接受统一方案。"
 
 TFR_CMRN_mon_state_of_emergency_r3:0 "宣布国家紧急状态"
 TFR_CMRN_mon_state_of_emergency_r3_desc:0 "总统签署紧急状态令，以防范外来干涉为由加强边境管控与内部动员。"
 
 TFR_CMRN_mon_reaffirm_neutrality_r3:0 "再次强调中立"
 TFR_CMRN_mon_reaffirm_neutrality_r3_desc:0 "向国际社会再次发出声明：蒙古的中立地位不容侵犯。"
 
 # ========== 会话记录 ==========
 TFR_CMRN_conversation_title:0 "会谈记录"
 TFR_CMRN_conversation_prc_label:0 "中方表态"
 TFR_CMRN_conversation_mon_label:0 "蒙方回应"
 TFR_CMRN_conversation_none:0 "（暂无表态）"
 
 # PRC 会话文本
 TFR_CMRN_convo_prc_1:0 "我们带来友谊与合作的蓝图，为中蒙人民带来美化的未来"
 TFR_CMRN_convo_prc_2:0 "二连浩特口岸将全面升级，贸易畅通是中蒙友谊的第一步。 "
 TFR_CMRN_convo_prc_3:0 "草原丝路，从呼和浩特到乌兰巴托，我们出钱修路，发展共享"
 TFR_CMRN_convo_prc_4:0 "让蒙古青年来华留学，让中国文化走进蒙古家庭，了解从交流开始"
 TFR_CMRN_convo_prc_5:0 "蒙方尚未正式回应，请就统一问题表明立场"
 TFR_CMRN_convo_prc_6:0 "塔旺陶勒盖是亚洲最大煤矿，中方有诚意让闲置的黑金变为两国人民的财富"
 TFR_CMRN_convo_prc_7:0 "升级中蒙铁路换轨站，降低物流成本，让贸易惠及两国人民"
 TFR_CMRN_convo_prc_8:0 "稀土提炼技术在中国手里，与其卖矿石，不如联合加工，利润共享"
 TFR_CMRN_convo_prc_9:0 "边境安全需要我们共同守护，邀请蒙古军官观摩我方反恐演习"
 TFR_CMRN_convo_prc_10:0 "援助款没有附加条件，我们只需要看到蒙方的诚意"
 TFR_CMRN_convo_prc_11:0 "我方对谈判进展表示关切，没有诚意，合作大门不会永远敞开"
 TFR_CMRN_convo_prc_12:0 "这是最终方案，政治，经济，安全三位一体，请蒙古认真考虑"
 TFR_CMRN_convo_prc_13:0 "统一后蒙古享受与内地同等的发展政策，草原不该被遗忘"
 TFR_CMRN_convo_prc_14:0 "我们承诺，统一后尊重蒙古人民的意愿组建一个新的民族自治区。"
 TFR_CMRN_convo_prc_15:0 "你出矿产，我出技术与市场，让矿石变成两国共同财富"
 TFR_CMRN_convo_prc_16:0 "这是最后的机会，不接受统一方案，我们将不得不考虑一切选项"
 TFR_CMRN_convo_prc_17:0 "谈判已经失败，中国人民解放军奉命维护国家统一"
 
 # MON 会话文本
 TFR_CMRN_convo_mon_1:0 "蒙古是独立主权国家，请北京澄清所谓谈判的法律依据"
 TFR_CMRN_convo_mon_2:0 "蒙古不会在大国博弈中选边站，更不会放弃自身的中立政策"
 TFR_CMRN_convo_mon_3:0 "南戈壁牧民需要更好的路和医院，我们接受援助，但不接受政治条件"
 TFR_CMRN_convo_mon_4:0 "如此重大的议题需要时间研究，蒙古议会尚未授权政府谈判"
 TFR_CMRN_convo_mon_5:0 "我们不会指望外来的怜悯，蒙古将捍卫自己的选择"
 TFR_CMRN_convo_mon_6:0 "蒙古的朋友[SOV.GetName]会支持我们的"
 TFR_CMRN_convo_mon_7:0 "蒙古的矿产资源属于蒙古人民，任何开发协议必须以蒙古法律为准"
 TFR_CMRN_convo_mon_8:0 "我们愿深化经济合作，前提是蒙古主权与领土完整受尊重"
 TFR_CMRN_convo_mon_9:0 "我们始终愿意伸出友谊的双手，但蒙古的主权必须得到尊重"
 TFR_CMRN_convo_mon_10:0 "为了蒙古人民的未来，我们接受和平统一"
 TFR_CMRN_convo_mon_11:0 "我们已向安理会提交紧急动议，国际不会坐视主权国家被吞并"
 TFR_CMRN_convo_mon_12:0 "是否统一，应该由蒙古人民自己决定"
 TFR_CMRN_convo_mon_13:0 "如果有必要，蒙古将采取一切手段捍卫主权与独立"
