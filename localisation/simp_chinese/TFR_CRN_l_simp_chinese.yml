l_simp_chinese:

 # ========== 类别 ==========
 TFR_CRN_negotiation_category:0 "外东北-图瓦领土回归谈判"

 # ========== 旗标/条件本地化 ==========
 TFR_CRN_negotiation_active:0 "谈判进行中"
 TFR_CRN_negotiation_ended:0 "§R谈判已结束§!"
 TFR_CRN_negotiation_accessible:0 "谈判机制已启用"
 TFR_CRN_PRC_started_negotiation:0 "已启动领土谈判"

 # ========== 决议名 & 描述 ==========
 TFR_CRN_start_negotiation:0 "开启外东北-图瓦领土回归谈判"
 TFR_CRN_start_negotiation_desc:0 "第二次欧陆战争正在欧洲肆虐，俄罗斯东西两线承压。此时不拿回故土，更待何时？\n\n启动后将有 100 天窗口期，期间可按顺序购买各州。俄罗斯的绝望度越高，愿意卖的州越多。"

 # — 大棒 —
 TFR_CRN_diplomatic_pressure:0 "外交照会施压"
 TFR_CRN_diplomatic_pressure_desc:0 "通过外交渠道对俄施压，暗示如果俄罗斯在领土问题上继续拖延，中方将重新评估双边关系。\n\n§Y效果：§!SOV 绝望度 +10\n冷却 20 天"

 TFR_CRN_economic_sanctions:0 "经济制裁威胁"
 TFR_CRN_economic_sanctions_desc:0 "放出风声：如果俄罗斯在远东领土问题上不让步，中方可能限制双边贸易、收紧投资审查。经济上的寒意比西伯利亚的冬天更难熬。\n\n§Y效果：§!SOV 绝望度 +15 + 贸易影响力 -30%\n冷却 30 天"

 TFR_CRN_border_exercise:0 "中俄边境联合军事演习"
 TFR_CRN_border_exercise_desc:0 "在黑龙江沿岸和内蒙古边境地区举行大规模军事演习。名为'联合反恐演练'，实为提醒莫斯科——远东的军力对比已经变了。\n\n§Y效果：§!世界紧张度 +0.5%，SOV 稳定度 -3%，SOV 绝望度 +20\n冷却 45 天"

 # — 购买 —
 TFR_CRN_buy_tuva:0 "赎回唐努乌梁海"
 TFR_CRN_buy_tuva_desc:0 "唐努乌梁海——自清末已脱离中国的故土。提议以经济补偿换取俄罗斯承认中国对该地区的主权。\n\n§Y赎金：§!50 PP"

 TFR_CRN_buy_vladivostok:0 "赎回海参崴"
 TFR_CRN_buy_vladivostok_desc:0 "符拉迪沃斯托克——俄国人叫它'统治东方'，我们叫它海参崴。这座不冻港在一个半世纪前被《北京条约》割让。\n\n§Y赎金：§!50 PP + 贸易优惠 90天"

 TFR_CRN_buy_south_amur:0 "赎回海兰泡"
 TFR_CRN_buy_south_amur_desc:0 "海兰泡——位于黑龙江左岸，与黑河隔江相望。1900年庚子俄难中，数千中国平民在此惨遭屠杀。今天，我们以和平的方式让这片土地回家。\n\n§Y赎金：§!60 PP + 民用工厂 90天"

 TFR_CRN_buy_birobidzhan:0 "赎回奇穆尼窝集"
 TFR_CRN_buy_birobidzhan_desc:0 "比罗比詹——犹太自治州的首府，但在这片土地上曾经生活着中国的赫哲和鄂伦春先民。\n\n§Y赎金：§!60 PP + 军备物资"

 TFR_CRN_buy_khabarovsk:0 "赎回伯力"
 TFR_CRN_buy_khabarovsk_desc:0 "伯力——以17世纪沙俄侵略者哈巴罗夫命名的地方。每一次翻开地图看到这个名字，都是一道伤疤。今天我们来还历史一个公道。\n\n§Y赎金：§!70 PP + 军用工厂 90天"

 TFR_CRN_buy_nikolayevsk:0 "赎回庙街"
 TFR_CRN_buy_nikolayevsk_desc:0 "庙街——黑龙江入海口上的重镇，庙街之名来源于清朝在此设立的庙街巡检司。拿回这里，就拿到了黑龙江的入海口。\n\n§Y赎金：§!80 PP + 装备与人力支援"

 TFR_CRN_buy_amur:0 "赎回外兴安岭"
 TFR_CRN_buy_amur_desc:0 "外兴安岭——《尼布楚条约》中确立的中俄东段边界标志。这片广袤的山林地带承载着太多的历史记忆。\n\n§Y赎金：§!90 PP + 派遣'远东国际志愿旅'"

 TFR_CRN_buy_sakhalin:0 "赎回库页岛"
 TFR_CRN_buy_sakhalin_desc:0 "库页岛——中国第一大岛，自唐以来的中国领土，在20世纪之交被日俄争夺后终落入俄手。这是整个外东北版图上最后一块拼图。\n\n§Y赎金：§!100 PP"

 # ========== 购买完成 tooltip（替代原新闻事件） ==========
 TFR_CRN_tooltip_tuva:0 "§G唐努乌梁海回归中国§!\n经过外交谈判，俄罗斯联邦政府已正式同意将唐努乌梁海（图瓦）的主权移交中华人民共和国。这片自清朝末年以后便游离于中国版图之外的土地，终于在和平的旗帜下回归祖国。"
 TFR_CRN_tooltip_vladivostok:0 "§G海参崴回归中国§!\n符拉迪沃斯托克——俄罗斯在远东最大的港口城市——正式移交中华人民共和国。作为交换条件，中方将为俄罗斯提供优惠贸易待遇。这座被俄国人称为'统治东方'的城市，从此有了它真正的名字：海参崴。"
 TFR_CRN_tooltip_south_amur:0 "§G海兰泡回归中国§!\n黑龙江左岸的重镇海兰泡已正式移交。作为补偿，中方将在未来 90 天内向俄罗斯提供民用工业设施支持。1900年的血债，今天以和平的方式了结了。"
 TFR_CRN_tooltip_birobidzhan:0 "§G奇穆尼窝集回归中国§!\n比罗比詹正式回归中国。中方同时向俄方移交了一批军备物资，以帮助俄军在欧洲战场坚持抗战。"
 TFR_CRN_tooltip_khabarovsk:0 "§G伯力回归中国§!\n哈巴罗夫斯克——以殖民者命名迄今依然是俄罗斯远东最大城市之一的伯力——已回归中国。中国将在未来 90 天内向俄罗斯提供军事工业支持。伯力不再是一个殖民者的名字。"
 TFR_CRN_tooltip_nikolayevsk:0 "§G庙街回归中国§!\n庙街——黑龙江入海口的最后一座重镇——正式回归中国。中国同时向俄罗斯提供装备和人力援助。至此从海兰泡到庙街，整个黑龙江下游已全部回到中国的怀抱。"
 TFR_CRN_tooltip_amur:0 "§G外兴安岭回归中国§!\n外兴安岭正式回归。与此同时，一支由'国际志愿者'组成的精锐部队——远东国际志愿旅——出现在布里亚特共和国的土地上。没有人知道他们从哪里来。"

 # ========== 事件 ==========
 # 1 — 谈判开始
 TFR_CRN.1.t:0 "外东北-图瓦领土回归谈判启动"
 TFR_CRN.1.d:0 "中华人民共和国政府已正式向俄罗斯联邦提出启动领土回归谈判。\n\n第一次欧陆战争的伤痕未愈，第二次欧陆战争的炮火已在欧洲燃起。俄罗斯东西两线受敌，国力日衰。在这样的历史时刻，我们选择以外交手段，而不是武力，来解决两国间存在已久的领土问题。\n\n谈判窗口为 100 天。俄罗斯面临的战争压力越大，愿意出售的领土就越多。"
 TFR_CRN.1.a:0 "开始谈判。"

 # 8 — 外兴安岭
 TFR_CRN.8.t:0 "外兴安岭回归中国"
 TFR_CRN.8.d:0 "外兴安岭——这片《尼布楚条约》中确认的中国领土，正式回归中华人民共和国。\n\n与此同时，一支由'国际志愿者'组成的精锐部队——远东国际志愿旅——出现在布里亚特共和国的土地上。这些'志愿者'装备着最现代化的武器，将作为'外国友军'协助俄军在欧洲战场作战。\n\n没有人知道他们从哪里来。"
 TFR_CRN.8.a:0 "为了和平。"

 # 9 — 超时
 TFR_CRN.9.t:0 "外东北-图瓦谈判窗口关闭"
 TFR_CRN.9.d:0 "一百天的谈判窗口已经关闭。\n\n有些历史机遇，错过了就是错过了。"
 TFR_CRN.9.a:0 "功亏一篑。"

 # 10 — 库页岛
 TFR_CRN.10.t:0 "库页岛回归中国——外东北全部回归"
 TFR_CRN.10.d:0 "库页岛——外东北地区最后一块回归中国版图的土地，已正式完成主权移交。\n\n从唐努乌梁海到海参崴，从海兰泡到庙街，从外兴安岭到库页岛——自1858年《瑷珲条约》和1860年《北京条约》以来，中国失去了一百多年的外东北领土，已在和平的谈判桌上全部收回。\n\n这不是征服。这是迟到百年的一场握手。"
 TFR_CRN.10.a:0 "历史记住了这一天。"

 # ========== 调试决议 ==========
 TFR_CRN_start_debug:0 "§Y[调试]§! 启动中俄谈判"
 TFR_CRN_start_debug_desc:0 "设置 TFR_CRN_negotiation_accessible 旗标，使谈判类别可见。"
 TFR_CRN_reset_debug:0 "§Y[调试]§! 重置谈判"
 TFR_CRN_reset_debug_desc:0 "清空所有谈判相关的变量和旗标。"
 TFR_CRN_set_desperation_debug:0 "§Y[调试]§! 设 SOV 绝望度为 100"
 TFR_CRN_set_desperation_debug_desc:0 "将 SOV 的 TFR_CRN_desperation 强制设为 100，可用于快速测试购买流程。"
 TFR_CRN_force_all_debug:0 "§Y[调试]§! 强制全部 8 省回归"
 TFR_CRN_force_all_debug_desc:0 "跳过购买流程，直接让全部 8 省转交 PRC。"
