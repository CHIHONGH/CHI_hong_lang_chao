 # 冲突事件
 TFR_CRN.20.t:0 "边境冲突爆发"
 TFR_CRN.20.d:0 "中华人民共和国政府宣布，对[SOV.GetName]在远东地区的边境挑衅已忍无可忍。\n\n没有宣战，没有最后通牒——只有集结在边境线另一侧的钢铁洪流。\n\n边境冲突开始。中国将逐州争夺外东北：\n\n第一梯队——§Y海参崴、伯力、奇穆尼窝集、海兰泡、外兴安岭§!（直接接壤）\n第二梯队——§Y庙街§!（需先拿下相邻州）\n特殊目标——§Y唐努乌梁海§!（需中国控制蒙古边境州）\n最后一州——§Y库页岛§!（其余各州收回后自动回归）\n\n每次边境战争的胜利都将收回一个州。"
 TFR_CRN.20.a:0 "边境线就是前线。"

 TFR_CRN.21.t:0 "边境战争胜利"
 TFR_CRN.21.d:0 "[SOV.TFR_CRN_GetTargetStateName]的俄军防线被彻底击溃。残余部队要么放下武器，要么仓皇撤向更深的西伯利亚。\n\n这面旗帜，现在属于中国。"
 TFR_CRN.21.a:0 "下一个目标。"
 TFR_CRN.21.b:0 "耻辱。我们记住了。"

 TFR_CRN.22.t:0 "边境战争受挫"
 TFR_CRN.22.d:0 "[SOV.TFR_CRN_GetTargetStateName]方向的进攻被[SOV.GetName]军队击退。前线部队在付出了惨重代价后撤回出发阵地。\n\n要么休整后再战，要么……全面升级。"
 TFR_CRN.22.a:0 "休整，再战。"
 TFR_CRN.22.b:0 "远东依然属于我们。"

 TFR_CRN.23.t:0 "俄方忍无可忍——全面战争爆发"
 TFR_CRN.23.d:0 "莫斯科受够了。\n\n中国在边境的持续施压——增兵、演习、电子对抗、边境战争——已经让克里姆林宫的忍耐到达极限。\n\n[SOV.GetName]宣布：对华全面开战。\n\n§Y限时一年§!：\n§G限期内俄军投降，或任一外东北州被占领§!——俄方求和，外东北全境回归。\n§R若一年内无法取胜§!——中国战败，白和并支付巨额赔偿。\n\n战争机器已经全速运转。"
 TFR_CRN.23.a:0 "那就打到底。"

 TFR_CRN.30.t:0 "中方忍无可忍——全面战争爆发"
 TFR_CRN.30.d:0 "中国受够了。\n\n[SOV.GetName]在远东的持续施压——增兵、动员、咄咄逼人的军事部署——已经让北京的忍耐到达极限。\n\n中华人民共和国宣布：对俄全面开战。\n\n§Y限时一年§!：\n§G限期内俄军投降，或任一外东北州被占领§!——俄方求和，外东北全境回归。\n§R若一年内无法取胜§!——中国战败，白和并支付巨额赔偿。\n\n战争机器已经全速运转。"
 TFR_CRN.30.a:0 "忍无可忍，无须再忍。"

 TFR_CRN.24.t:0 "俄罗斯求和"
 TFR_CRN.24.d:0 "莫斯科撑不住了。\n\n远东的战火、欧洲的压力、国内的不满——[SOV.GetName]的战争机器已经到达极限。克里姆林宫发来求和照会：\n\n外东北，全境归中国。\n\n远东方向再无战事。"
 TFR_CRN.24.a:0 "接受投降。"

 TFR_CRN.25.t:0 "战败——白和与赔偿"
 TFR_CRN.25.d:0 "一年之期已到，远东的战事仍未尘埃落定。\n\n国际调停下，双方签署了停战协定：中国撤出全部争议地区，并向[SOV.GetName]支付巨额赔偿。\n\n§R国家债务大幅增加，数以万计的装备作为赔偿运往莫斯科。§!\n\n这一次，我们输了。但外东北——不会永远属于他们。"
 TFR_CRN.25.a:0 "……总有一天。"

 TFR_CRN.26.t:0 "库页岛回归——外东北全境光复"
 TFR_CRN.26.d:0 "库页岛——外东北最后一块土地，回归中华人民共和国。\n\n从海参崴到伯力，从海兰泡到庙街，从外兴安岭到唐努乌梁海，从库页岛到整个黑龙江流域——沙俄时代失去的外东北，已被中国以边境战争的方式全部收回。\n\n这不是谈判桌上的施舍，这是战场上赢回来的。"
 TFR_CRN.26.a:0 "一寸山河一寸血。"

 TFR_CRN.27.t:0 "中国对俄宣战——远东战争全面爆发"
 TFR_CRN.27.d:0 "北京正式向莫斯科宣战。\n\n持续数月的边境冲突一夜之间升级为全面战争。远东前线炮火连天，世界各大国都在屏息观望这场两个核大国之间的战争会走向何方。\n\n克里姆林宫表示将“坚决回击”，但明眼人都看得出——[SOV.GetName]的军队正被另一场战争消耗着。"
 TFR_CRN.27.a:0 "世界屏住了呼吸。"

 TFR_CRN.28.t:0 "外东北全境回归中国"
 TFR_CRN.28.d:0 "莫斯科求和，远东战争结束。\n\n从海参崴到库页岛，外东北全境回归中华人民共和国。这是自1858年《瑷珲条约》以来，中国第一次以军事手段完整收回这片土地。\n\n世界舆论为之哗然——但远东的地图上，已经写下了既成事实。"
 TFR_CRN.28.a:0 "历史记住了这一天。"

 TFR_CRN.29.t:0 "中国在远东战争中战败"
 TFR_CRN.29.d:0 "为期一年的远东战争以中国的失败告终。\n\n在国际调停下，双方签署停战协定：中国撤出全部争议地区，并向[SOV.GetName]支付巨额赔偿。\n\n北京承认，这是一次战略上的失败。但远东的积雪之下，种子已经埋下。"
 TFR_CRN.29.a:0 "莫斯科保住了远东。"

