 # PRC 决议
 TFR_CRN_start_conflict:0 "对[SOV.GetName]发动边境冲突"
 TFR_CRN_start_conflict_desc:0 "俄方拒绝了一切外交渠道。边境的剑拔弩张已持续数月，再多的照会也换不来一张谈判桌。\n\n现在，是时候用另一种语言说话了。\n\n发动边境冲突后，中国将逐州对[SOV.GetName]发起边境战争——每次边境战争的胜利都将收回一个州。冲突烈度由双轨军事优势决定：我方优势越高，前线部队越强，俄军越弱。\n\n§R警告：任一方施压累计达到 100，都将令对方忍无可忍、直接爆发全面战争（限时一年）。§!"
