 # ========== PRC 决议名 & 描述 ==========
 # — 第1轮：大棒 —
 TFR_CRN_diplomatic_note_r1:0 "递交外交照会"
 TFR_CRN_diplomatic_note_r1_desc:0 "通过正式外交渠道向[SOV.GetName]递交关于唐努乌梁海与海参崴地区主权问题的照会。言辞克制但立场坚定。\n每轮限1次。"

 TFR_CRN_reopen_tuva:0 "重审唐努乌梁海置制"
 TFR_CRN_reopen_tuva_desc:0 "援引清《大清一统志》对唐努乌梁海的明确记载，以及1944年[SOV.GetName]吞并图瓦人民共和国未经中国承认的事实，正式要求将图瓦归还中国。"

 # — 第1轮：萝卜 —
 TFR_CRN_vladivostok_port:0 "海参崴联合港务协定"
 TFR_CRN_vladivostok_port_desc:0 "提议将海参崴港设为中俄联合管理港口，中方提供港口扩建资金，俄方给予中方船只优先通行权和贸易优惠。"

 TFR_CRN_coastal_development:0 "滨海边疆区经济补偿"
 TFR_CRN_coastal_development_desc:0 "向俄方提供滨海边疆区基础设施建设援助，包括公路、电力和通讯网络升级。以经济发展换取领土回归。"

 # — 第2轮：大棒 —
 TFR_CRN_diplomatic_pressure_r2:0 "外交施压"
 TFR_CRN_diplomatic_pressure_r2_desc:0 "在谈判桌上加大对俄施压力度。提醒对方——黑龙江沿岸的历史旧账还没有清算。\n每轮限1次。"

 TFR_CRN_64_villages:0 "江东六十四屯索赔案"
 TFR_CRN_64_villages_desc:0 "1900年，海兰泡及江东六十四屯的中国居民遭俄军屠杀，约七千人遇难。俄方违约吞并江东六十四屯——瑷珲条约原规定此地永久由中国管辖。正式提出索赔和历史清算。"

 TFR_CRN_reopen_aigun:0 "重审瑷珲条约边界条款"
 TFR_CRN_reopen_aigun_desc:0 "1858年《瑷珲条约》是沙皇俄国在第二次鸦片战争中趁火打劫的产物。俄方在江东六十四屯问题上违约在先，该条约的边界条款效力可被挑战。"

 TFR_CRN_reopen_cr_1929:0 "重审1929年中东路事件"
 TFR_CRN_reopen_cr_1929_desc:0 "1929年张学良收回中东铁路后，[SOV.GetName]红军入侵满洲，强迫中国签署《伯力协定》恢复[SOV.GetName]对中东铁路的控制。该协定为军事压力下签订，法律效力存疑。"

 # — 第2轮：萝卜 —
 TFR_CRN_amur_aid:0 "黑龙江沿岸经济援助"
 TFR_CRN_amur_aid_desc:0 "向[SOV.GetName]远东地区提供大规模经济援助，包括轻步兵装备、支援设备和轻型机械化装备，帮助俄军在欧洲战场维持战斗力。"

 TFR_CRN_far_east_investment:0 "远东基础设施投资"
 TFR_CRN_far_east_investment_desc:0 "在[SOV.GetName]远东地区大规模投资建设民用和军事工业设施。以经济纽带换取领土问题的突破。"

 # — 第3轮：大棒 —
 TFR_CRN_ultimatum_r3:0 "最后通牒"
 TFR_CRN_ultimatum_r3_desc:0 "在谈判桌上提出中方最终立场——外兴安岭和库页岛必须回归。没有任何妥协余地。\n每轮限1次。"

 TFR_CRN_nerchinsk:0 "援引尼布楚条约法理"
 TFR_CRN_nerchinsk_desc:0 "1689年《尼布楚条约》确认外兴安岭以南、黑龙江以北为中国领土。这是中国与欧洲国家间第一个平等条约，法理地位远高于其后在不平等条件下签署的瑷珲条约和北京条约。"

 TFR_CRN_sakhalin_sovereignty:0 "库页岛主权未定论"
 TFR_CRN_sakhalin_sovereignty_desc:0 "清朝从未正式割让库页岛给任何国家。日俄两国在库页岛的争夺恰恰说明该岛主权存在争议，中国作为原宗主国有权参与最终的领土安排。"

 # — 第3轮：萝卜 —
 TFR_CRN_sakhalin_development:0 "萨哈林油气联合开发"
 TFR_CRN_sakhalin_development_desc:0 "提议建立中俄萨哈林（库页岛）油气联合开发公司，中方提供资金和技术，俄方以资源入股。这是自尼布楚条约以来——对俄国人最有诚意的经济提议了。"

 TFR_CRN_far_east_strategic:0 "远东战略援助协定"
 TFR_CRN_far_east_strategic_desc:0 "这不再是经济援助——这是战略投资。向[SOV.GetName]提供现代化装甲装备、军事技术和人力支援，以交换外兴安岭和库页岛的领土归属。作为协议的一部分，三支精锐的'远东国际志愿旅'将部署在布里亚特。\n\n欧洲的战争需要[SOV.GetName]活着，但活着的[SOV.GetName]需要付出代价。"

 # ========== SOV 决议名 & 描述 ==========
 # — 第1轮 —
 TFR_CRN_sov_cold_response_r1:0 "冷淡回应"
 TFR_CRN_sov_cold_response_r1_desc:0 "以克制的措辞回应中方照会，强调[SOV.GetName]的领土完整不容谈判。"

 TFR_CRN_sov_limited_coop_r1:0 "有限合作"
 TFR_CRN_sov_limited_coop_r1_desc:0 "在海参崴港口使用权等经济议题上开放有限合作空间。在不触及主权的前提下，港口事务好商量。"

 TFR_CRN_sov_outright_reject_r1:0 "断然拒绝"
 TFR_CRN_sov_outright_reject_r1_desc:0 "中方对唐努乌梁海和海参崴的历史主张毫无依据。[SOV.GetName]对此不予讨论。"

 # — 第2轮 —
 TFR_CRN_sov_diplomatic_protest_r2:0 "外交抗议"
 TFR_CRN_sov_diplomatic_protest_r2_desc:0 "就中方在黑龙江沿岸问题上的历史主张提出外交抗议。中方的指控是对中俄两国现有友好关系的损害。"

 TFR_CRN_sov_partial_concession_r2:0 "部分让步"
 TFR_CRN_sov_partial_concession_r2_desc:0 "在边界重划等部分议题上做出有限妥协。但[SOV.GetName]不会无条件放弃黑龙江以北的任何领土。"

 TFR_CRN_sov_stall_r2:0 "以拖待变"
 TFR_CRN_sov_stall_r2_desc:0 "设立联合委员会、强调分阶段推进，用外交辞令消磨中方耐心。"

 # — 第3轮 —
 TFR_CRN_sov_submit_r3:0 "屈服"
 TFR_CRN_sov_submit_r3_desc:0 "接受了中方的全部要求。外兴安岭和库页岛的主权将移交给中华人民共和国。"

 TFR_CRN_sov_bargain_r3:0 "讨价还价"
 TFR_CRN_sov_bargain_r3_desc:0 "接受部分条件但拒绝全部——库页岛可以讨论，外兴安岭不能碰。"

 TFR_CRN_sov_threaten_rupture_r3:0 "威胁破裂"
 TFR_CRN_sov_threaten_rupture_r3_desc:0 "克里姆林宫发出最后警告：若中方一意孤行，[SOV.GetName]将退出全部谈判。"

