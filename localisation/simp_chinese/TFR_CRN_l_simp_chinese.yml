 TFR_CRN_conflict_help_tooltip:0 "§Y边境冲突玩法§!\n逐州边境战争：每次胜利收回一个州。\n§R施压决议§!（增兵/演习/电子战）→ 中方施压与军事优势\n§G俄方回应§!（增兵/动员/退缩）→ 改变双方施压与优势\n优势高 → 目标州中国正面修正强、俄军负面修正重；均势时中国略占优。\n\n§R任一方施压累计满 100 → 对方忍无可忍直接宣战§!，全面战争限时 365 天：\n限期内俄军投降（>10%）或任一州被占 → §G自动触发俄方求和§!，全境回归；\n时间耗尽 → 中国战败白和并赔偿。\n\n特殊目标：唐努乌梁海需先控制蒙古边境州；库页岛在其余各州收回后自动回归。"
