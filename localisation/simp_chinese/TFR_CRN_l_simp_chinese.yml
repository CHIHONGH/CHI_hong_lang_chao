 # ========== 中方会谈文本（15条）==========
 TFR_CRN_convo_prc_1:0 "「中华人民共和国政府就唐努乌梁海及海参崴之主权归属正式向俄方提出交涉此为照会全文」"
 TFR_CRN_convo_prc_2:0 "「唐努乌梁海自康熙年间即隶属中国设旗置制，1944年之吞并中国政府从未予以承认」"
 TFR_CRN_convo_prc_3:0 "「俄方西线战局我十分清楚，黑龙江问题拖下去对谁不利请自行斟酌」"
 TFR_CRN_convo_prc_4:0 "「海兰泡惨案七千人遇难，俄方违约在先，中方正式索赔」"
 TFR_CRN_convo_prc_5:0 "「瑷珲条约签于英法攻大沽之际，俄方又先行违约，边界条款效力存疑」"
 TFR_CRN_convo_prc_6:0 "「伯力协定系贵国占满洲时迫签，武力胁迫之协议不受国际法保护」"
 TFR_CRN_convo_prc_7:0 "「中方明确最终立场：外兴安岭与库页岛之主权必须归还，此事不容谈判」"
 TFR_CRN_convo_prc_8:0 "「尼布楚条约明确外兴安岭以南属中国，此乃三百年之法理」"
 TFR_CRN_convo_prc_9:0 "「库页岛中方从未割让，日俄之争不可取代中国宗主权」"
 TFR_CRN_convo_prc_10:0 "「海参崴港联合管理，中方投资扩建，俄方保留驻泊权，利益对等」"
 TFR_CRN_convo_prc_11:0 "「对滨海区提供路电网通讯援助，经济先行，政治推后」"
 TFR_CRN_convo_prc_12:0 "「两万步枪四千支援装备两百轻机械化车辆已在运送途中」"
 TFR_CRN_convo_prc_13:0 "「中方将在远东地区投资建设民用及军用工业设施，战争结束后上述设施无偿移交俄方」"
 TFR_CRN_convo_prc_14:0 "「萨哈林油气联合开发，中方出资技术，俄方以资源入股」"
 TFR_CRN_convo_prc_15:0 "「三百坦克三百火炮万五顾问三个整编旅已部署布里亚特，助俄稳住西线」"

 # ========== 苏方会谈文本（9条）==========
 TFR_CRN_convo_sov_1:0 "「俄方对中方照会表示遗憾，俄罗斯联邦之领土完整不容谈判」"
 TFR_CRN_convo_sov_2:0 "「港口事务方面俄方愿意探讨联合管理之可行性，前提是主权归属不做变更」"
 TFR_CRN_convo_sov_3:0 "「唐努乌梁海之地位早已确定，海参崴系俄罗斯领土，此二项议题不予讨论」"
 TFR_CRN_convo_sov_4:0 "「中方就黑龙江沿岸所提之指控俄方认为缺乏事实依据，我国正式提出外交抗议」"
 TFR_CRN_convo_sov_5:0 "「技术性问题可谈，但黑龙江以北主权不议」"
 TFR_CRN_convo_sov_6:0 "「建议设历史研究委员会先行厘清史实，领土问题分阶段再谈」"
 TFR_CRN_convo_sov_7:0 "「中方所提条件俄方全部接受，外兴安岭与库页岛之主权移交中华人民共和国」"
 TFR_CRN_convo_sov_8:0 "「库页岛安排可磋商，但外兴安岭事关西伯利亚铁路安全无法让步」"
 TFR_CRN_convo_sov_9:0 "「若外兴安岭库页岛不让步，俄方退出谈判，此前共识作废」"
