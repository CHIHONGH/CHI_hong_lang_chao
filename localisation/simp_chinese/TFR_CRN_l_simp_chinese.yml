 # ========== 事件 ==========
 # 1 — 谈判开始
 TFR_CRN.1.t:0 "中俄边境谈判启动"
 TFR_CRN.1.d:0 "中华人民共和国政府已正式向[SOV.GetName]提出启动边境历史遗留问题的谈判。\n\n谈判将分三轮进行：\n\n第一轮——§Y唐努乌梁海与滨海边疆§!：讨论图瓦（唐努乌梁海）和海参崴的主权归属。\n第二轮——§Y黑龙江沿岸§!：讨论庙街、伯力、奇穆尼窝集和海兰泡四地的归属。\n第三轮——§Y外兴安岭与库页岛§!：讨论外兴安岭和库页岛的归属。\n\n每轮谈判成功后方可进入下一轮。失败的轮次所涉领土将无法通过谈判收回。\n\n谈判方式分为两类：\n§R大棒§!（边界法理施压）—— 增加中方外交筹码\n§G萝卜§!（经济援助补偿）—— 增加[SOV.GetName]的领土让步意愿"
 TFR_CRN.1.a:0 "历史给了我们一个窗口。"

 # 2 — 第2轮开始
 TFR_CRN.2.t:0 "黑龙江沿岸谈判开启"
 TFR_CRN.2.d:0 "唐努乌梁海与滨海边疆的谈判已经成功。图瓦和海参崴的回归已成定局。\n\n现在进入第二阶段：§Y黑龙江沿岸§!。黑龙江以北、从海兰泡到庙街的广袤土地——这是1858年《瑷珲条约》中失去的最大一块领土，也是中俄边境历史中最沉痛的一页。\n\n谈判桌上，中方代表团拿出了江东六十四屯的历史档案。俄方代表团的表情比黑龙江的冰面还要冷。\n\n但他们的战争还在打。他们需要我们的援助。"
 TFR_CRN.2.a:0 "继续前行。"

 # 3 — 第3轮开始
 TFR_CRN.3.t:0 "外兴安岭与库页岛谈判开启"
 TFR_CRN.3.d:0 "黑龙江沿岸的谈判已经成功。庙街、伯力、奇穆尼窝集和海兰泡的回归板上钉钉。\n\n谈判进入了最后也是最艰难的阶段：§Y外兴安岭与库页岛§!。\n\n外兴安岭——1689年《尼布楚条约》曾经确认的最东端边界。库页岛——中国第一大岛，清朝从未正式割让，却被日俄反复争夺后落入[SOV.GetName]之手。\n\n这两块领土是外东北回归版图上最遥远、也最具有象征意义的拼图。莫斯科方面已经感到了前所未有的压力——而欧洲的战火让他们没有多少选择了。"
 TFR_CRN.3.a:0 "最后一搏。"

 # 4 — 谈判失败
 TFR_CRN.4.t:0 "中俄边境谈判中止"
 TFR_CRN.4.d:0 "外交谈判未能达成全部目标。\n\n已达成协议的领土将按照协议移交中国。未达成协议的部分则暂时搁置——在这轮谈判中，我们已经走到了[SOV.GetName]愿意走的最远处。\n\n但历史不会停滞。只要[SOV.GetName]在这场战争中继续失血，谈判的窗口也许还会再次打开。"
 TFR_CRN.4.a:0 "拿到多少是多少。"

 # 5 — 谈判全部成功
 TFR_CRN.5.t:0 "外东北全部回归中国"
 TFR_CRN.5.d:0 "三轮谈判，全部成功。\n\n从唐努乌梁海到海参崴，从黑龙江沿岸的每一座城市到外兴安岭的群山，从中国第一大岛库页岛到黑龙江的入海口庙街——1858年以来失去的外东北领土，已在外交谈判桌上全部回归中华人民共和国。\n\n在最后一轮谈判结束时，莫斯科的谈判代表默默签署了最后一份文件。据说他签字时，手在发抖。\n\n这不是征服。这不是复仇。这是一百六十多年来，第一次有人以和平的方式，把历史纠正了。"
 TFR_CRN.5.a:0 "历史记住了这一天。"

 # 8 — 外兴安岭回归
 TFR_CRN.8.t:0 "外兴安岭回归中国"
 TFR_CRN.8.d:0 "外兴安岭——这片《尼布楚条约》中确认的中国领土，正式回归中华人民共和国。\n\n中国将向[SOV.GetName]提供一笔不菲的经济援助和装备支援，作为领土转交的补偿。与此同时，一支由'国际志愿者'组成的精锐部队也已出现在西伯利亚的铁路沿线。\n\n这些'志愿者'装备着最现代化的武器，没有人知道他们从哪里来。但他们的枪口，对准了欧洲的方向。"
 TFR_CRN.8.a:0 "为了和平。"

 # 10 — 库页岛回归
 TFR_CRN.10.t:0 "库页岛回归中国——外东北全部回归"
 TFR_CRN.10.d:0 "库页岛——外东北地区最后一块回归中国版图的土地，已正式完成主权移交。\n\n从唐努乌梁海到海参崴，从海兰泡到庙街，从外兴安岭到库页岛——自1858年《瑷珲条约》和1860年《北京条约》以来，中国失去了一百多年的外东北领土，已在和平的谈判桌上全部收回。\n\n在克里姆林宫的签字仪式上，中国代表团的负责人拿起笔，停顿了三秒。这三秒，是一百六十年。\n\n然后他签下了名字。\n\n这不是征服。这不是复仇。这是迟到百年的一场握手。"
 TFR_CRN.10.a:0 "历史记住了这一天。"

 # 11 — SOV解体领土割让
 TFR_CRN.11.t:0 "红旗落地"
 TFR_CRN.11.d:0 "那个曾经横跨欧亚大陆的巨人解体了。\n\n第二次欧陆战争的炮火尚未完全平息，莫斯科的政权已陷入全面崩溃。远东的俄军指挥体系在短短数周内土崩瓦解——补给断绝、命令无人执行、部队在零下四十度的严寒中各自溃散。\n\n北京没有坐等和平会议上的外交施舍。\n\n在确认莫斯科中央政权已无力维持远东有效控制后，中国最高层下达了代号「北疆行动」的命令。中国人民解放军北部战区的三个集团军迅速越过未定边界线，未遭遇任何有组织的抵抗。海参崴港、伯力、庙街等地的俄军驻军——有的选择放下武器，有的干脆弃营而逃。\n\n这是一场没有枪声的战争。\n\n到国际社会反应过来时，从唐努乌梁海到库页岛，外东北全境已落入人民解放军的实际控制之下。随后的和平会议不过是追认了这一既成事实——谁也没有能力，也没有意愿让这片土地再回到那个已不存在的帝国手中。"
 TFR_CRN.11.a:0 "北疆行动——完成。"

 # ========== 调试决议 ==========
 TFR_CRN_start_debug:0 "§Y[调试]§! 启动中俄谈判"
