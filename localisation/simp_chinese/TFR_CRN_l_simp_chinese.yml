 TFR_CRN_help_tooltip:0 "§Y外东北谈判说明§!\n谈判分三轮进行，每轮有 50 天时间。\n中方先手提出要求，苏方随后回应。\n每轮结束时，外交筹码和让步意愿均达标方可推进。\n\n§R大棒（边界法理施压）§!：增加中方外交筹码，获取渠道少。\n§G萝卜（经济援助补偿）§!：增加[SOV.GetName]让步意愿，是谈判主力。\n\n若某轮失败，谈判立即终止，已成功轮次的领土照常交付。"
