 PTF_elec_dummy_9: "幽灵屏障"
 PTF_elec_dummy_10: "幽灵屏障"
 PTF_elec_warfare_dynamic_desc: "「幽灵屏障」——美海军新一代综合电子战系统。依托本土指挥网络与太平洋方向多座节点，该系统赋予美海军舰队显著的电磁优势：舰艇隐蔽性、防御协同、战场感知与夜间作战效能均得到大幅强化，其干扰与欺骗手段使其在交战中始终占据先机。\n\n随着该系统在实战中不断遭到针对性反制，其效能正在逐步消解。"
 prc_elec_warfare.101.t: "南海余波"
 prc_elec_warfare.101.d: "南海对峙结束数日后，总参谋部电子对抗研究所呈报了一份研判报告。报告称，南海交锋期间，美方舰载电子战系统展现出远超我军以往认知的压制能力：其干扰波形、欺骗算法与频段管理方式，与我方数据库中任何已知型号都对不上号。\n\n经情报部门与科研机构联合溯源，确认美海军已列装一套代号「幽灵屏障」的新一代综合电子战系统。该系统由本土指挥网络统辖，可对太平洋方向舰队实施全域电磁遮蔽与欺骗。\n\n报告结论只有一句话：在反制手段成熟之前，美海军将在电磁频谱上拥有可观的单向优势。"
 prc_elec_warfare.101.a: "命令科研单位拟定反制预案"
 prc_elec_warfare.201.t: "南海对峙：电磁战报"
 prc_elec_warfare.201.d: "南海对峙以我方在电磁频谱上的全面压制告终。美海军舰载电子战分队发起的所有干扰与欺骗行动，均被我方识破并反向利用，其舰队通信与导航体系一度陷入紊乱。\n\n战报同时确认：我方反舰火力在混战中精确命中并击沉美海军导弹巡洋舰一艘。打捞与修复工作尚在进行，初步消息称，该舰残骸中出现了与「幽灵屏障」系统相关的设备痕迹。\n\n西太平洋的电磁天平，正在悄然倾斜。"
 prc_elec_warfare.201.a: "记录在案"
 prc_elec_warfare.202.t: "南海：舰队通信故障报告"
 prc_elec_warfare.202.d: "南海对峙期间，我舰队电子战系统出现大规模异常。多个编队的雷达与数据链在对抗中频繁失灵，部分舰艇一度失去编队协同能力。\n\n更严重的是，一艘导弹巡洋舰在返航途中被不明反舰火力命中，舰体严重受损后沉没。初步调查认为，中方舰队可能已掌握针对我电子战系统的部分反制手段。\n\n太平洋舰队司令部的结论是：海军在电磁频谱上的优势，已不再理所当然。"
 prc_elec_warfare.202.a: "要求技术部门彻查"
 prc_elec_warfare.203.t: "轨道电子对抗阵列投入使用"
 prc_elec_warfare.203.d: "酒泉卫星发射中心，最后一颗电子对抗卫星完成组网部署，「天河工程」轨道电子对抗阵列宣告建成。\n\n阵列运行后，我方首次拥有了对太平洋方向美海军舰队实施持续电磁压制的太空节点：可对美舰雷达与数据链进行全域干扰与欺骗，并为其通信网络注入虚假信息。\n\n美海军引以为傲的「幽灵屏障」，从此不再是单向的屏障。"
 prc_elec_warfare.203.a: "通报全军"
 prc_elec_warfare.204.t: "中方的轨道干扰能力"
 prc_elec_warfare.204.d: "我方情报部门确认，中国已在近地轨道建成电子对抗卫星阵列。该阵列投入运行后，我军舰队的电磁环境将显著恶化，作战体系面临的干扰威胁将成倍增加。\n\n海军作战部的评估报告措辞严厉：「幽灵屏障」系统在中国人的轨道天线面前，已无秘密可言。"
 prc_elec_warfare.204.a: "知悉"
 prc_elec_warfare.205.t: "猎杀旗舰"
 prc_elec_warfare.205.d: "太平洋战报：美海军舰队荣耀之舰在交战中被我方击沉。\n\n击沉该舰的意义远超一艘主力舰的损失——其作战指挥与电子战核心模块皆随舰沉没，多年积累的战场数据与系统参数亦一并葬身海底。\n\n海军情报部门认为，美方重建其电子战体系核心环节，尚需时日。"
 prc_elec_warfare.205.a: "继续推进攻势"
 prc_elec_warfare.206.t: "旗舰沉没"
 prc_elec_warfare.206.d: "噩耗传来：我海军舰队旗舰在交战中沉没。该舰承载着「幽灵屏障」系统最核心的指挥与数据节点，其损失意味着海军电子战体系的运行将出现明显缺口。\n\n海军联合参谋部已下令对系统进行全链路重新评估。华盛顿的沉默，比任何哀悼都更沉重。"
 prc_elec_warfare.206.a: "善后与调查"
 prc_elec_warfare.207.t: "夏威夷上空的第一道闪光"
 prc_elec_warfare.207.d: "核弹在夏威夷群岛上空引爆。这是战争爆发以来，我方首次对美本土使用战略武器。\n\n打击摧毁了设于夏威夷的美太平洋方向电子战指挥枢纽——「幽灵屏障」系统的太平洋控制节点就此中断，美海军在西太平洋的电磁优势，随着这道闪光一同消退。\n\n战史将记载这一时刻：从今往后，电磁频谱不再由一方独享。"
 prc_elec_warfare.207.a: "命令部队扩大战果"
 prc_elec_warfare.208.t: "夏威夷遭核打击"
 prc_elec_warfare.208.d: "夏威夷群岛遭到核打击，太平洋电子战指挥枢纽在冲击波中化为废墟，大量「幽灵屏障」系统的核心设备与操作人员损于一旦。\n\n这是漫长战争中最黑暗的一天。海军电子战体系失去太平洋方向的中枢，恢复运转遥遥无期。"
 prc_elec_warfare.208.a: "召开国家安全会议"
 prc_elec_warfare.209.t: "登陆夏威夷"
 prc_elec_warfare.209.d: "登陆部队在夏威夷群岛各主要岛屿登陆，经过激烈战斗，全岛战斗基本结束。\n\n在珍珠港旧址，工兵部队发现了美军遗留的电子战设施——数十座天线阵列、成排的服务器机柜与尚未销毁的作战数据硬盘，我方技术人员当即展开系统接管。\n\n「幽灵屏障」的核心设施，正式落入我军之手。"
 prc_elec_warfare.209.a: "组织技术人员展开接管"
 prc_elec_warfare.210.t: "夏威夷沦陷"
 prc_elec_warfare.210.d: "夏威夷群岛失守。珍珠港基地及其配套的「幽灵屏障」太平洋节点设施一同落入敌手，大量敏感设备与数据未能及时销毁。\n\n海军部电令西海岸各单位：即刻变更所有密码本与通信密钥。然而所有人都清楚，丢失的远不止密码。"
 prc_elec_warfare.210.a: "……"
 prc_elec_warfare.211.t: "东瀛送来的一份厚礼"
 prc_elec_warfare.211.d: "对日战事尘埃落定。根据战后安排，日方将一批存留的美军电子战技术资料移交我方，其中包括「幽灵屏障」系统早期型号的架构文档与部分源代码。\n\n科研部门连夜组织专家翻译、比对与逆向推演，多项空白得到填补。破解「幽灵屏障」的进程，又向前推进了一段。"
 prc_elec_warfare.211.a: "组织力量开展分析"
 prc_elec_warfare.212.t: "技术资料外流"
 prc_elec_warfare.212.d: "情报部门证实：一批存留于日本的美军电子战技术资料已移交中方。该批资料虽属早期型号，但足以帮助中方大幅缩短对「幽灵屏障」系统的研究周期。\n\n五角大楼的加密电报只有一行字：系统性泄密的时代开始了。"
 prc_elec_warfare.212.a: "……"
 prc_elec_warfare.213.t: "西雅图：落下的帷幕"
 prc_elec_warfare.213.d: "西雅图战役结束，美军在西海岸的最后一个重镇落入我军之手。\n\n这座城市是「幽灵屏障」系统的研发重镇——数以万计的研究档案、工程图纸、测试报告与源代码，连同完整的指挥体系，尽数为我军缴获。象征着美海军电子战优势的「幽灵屏障」，其最后一层帷幕就此落下。\n\n从南海到西雅图，战争的进程证明：再先进的系统，也终将在人民战争的钢铁洪流面前现出原形。"
 prc_elec_warfare.213.a: "接收全部技术档案"
 prc_elec_warfare.214.t: "西雅图：最后的防线崩溃"
 prc_elec_warfare.214.d: "西雅图失守。「幽灵屏障」项目总部及其全部核心设施落入敌手，数十年的研究成果不是被摧毁，而是被完整地缴获。\n\n海军电子战体系彻底瘫痪。没有密码，没有算法，没有优势——国会山的废墟之上，新一轮的质询已经在酝酿。"
 prc_elec_warfare.214.a: "……"
 prc_elec_warfare.301.t: "反制研究取得突破"
 prc_elec_warfare.301.d: "历经数月攻关，反制研究项目取得关键突破。科研单位通过截获信号、战场数据与缴获样本的综合分析，摸清了「幽灵屏障」系统的部分频段特征与干扰算法。\n\n据此研制的对抗手段已下发舰队试用，美海军的电磁迷雾，在我方雷达屏幕上开始显形。"
 prc_elec_warfare.301.a: "加大研究投入"
 prc_elec_warfare.302.t: "系统遭遇针对性反制"
 prc_elec_warfare.302.d: "海军技侦部门报告：我方舰队的电磁环境持续恶化，多支编队在正常训练与巡航中遭到不明来源的针对性干扰。种种迹象表明，中方已掌握「幽灵屏障」系统的部分关键参数。\n\n太平洋舰队司令部的判断令人不安：对方不是在试探，而是在稳步、系统地拆除我们的屏障。"
 prc_elec_warfare.302.a: "……"
 PRC_elec_countermeasure_research: "电子战系统反制研究"
 PRC_elec_countermeasure_research_desc: "针对美海军「幽灵屏障」电子战系统开展系统性反制研究。研究团队将综合运用截获信号、战场数据和缴获样本，逐步破解其频段特征与干扰算法，并将成果转化为部队的对抗能力。"
 PRC_elec_countermeasure_available_tt: "对方电子战体系已完全瘫痪，无需继续研究。"
 PRC_elec_japan_tech: "接收日本移交的技术资料"
 PRC_elec_japan_tech_desc: "战后安排中，日方将一批存留的美军电子战技术资料移交我方。组织专家开展翻译、比对与逆向推演，可进一步压缩对美海军电子战系统的破解周期。"



