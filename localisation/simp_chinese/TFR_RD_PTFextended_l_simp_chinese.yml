 PTF_nationalist_sentiment_idea_desc: "不要害怕，这个精神在你与爱国者阵线交战后就会立即消失"
 PTF_hidden_idea: "爱国者隐藏加成"
 choose.1.t: "爱国者阵线难度选项 - 整体难度"
 choose.1.de: "凡一国自相纷争，就成为荒场；一城一家自相纷争，必站立不住。\n《马太福音》12:25\n-----------------------\n\n简单难度下爱国者联盟较玩家而言不堪一击。\n普通难度下爱国者联盟的装甲单位会被替换为精英装甲单位，但是其综合实力仍然不敌玩家领导的中国。\n\b困难难度下爱国者联盟拥有强大的海军和素质可靠的海量装甲部队。\n极难难度下爱国者联盟有着有史以来最强大的不败之军\n\n无论何种难度下爱国者联盟只会在战前生成一次火星兵，火星兵的质量会随着难度的提升而大幅增加。\n\n由于美国的民族主义浪潮，美国人非常抵制中国对美国内政的干预，所以，不要尝试干预美国内战！"
 choose.1.a: "简易 - §4「试探之战」§!"
 PTF_choose_Simple: "你们要追念往日，蒙了光照以后，所忍受大争战的各样苦难。一面被毁谤，遭患难，成了戏景，叫众人观看；一面陪伴那些受这样苦难的人。\n《希伯来书》10:32-33"
 choose.1.b: "普通 - §8「征伐之年」§!"
 PTF_choose_Normal: "耶和华我的磐石是应当称颂的；他教导我的手争战，教导我的指头打仗。\n《诗篇》144:1"
 choose.1.c: "困难 - §t「围困之时」§!"
 PTF_choose_Hard: "仇敌必像狮子从约旦河边的丛林上来，攻击坚固的居所。转眼之间，我要使他们逃跑，离开这地。\n《耶利米书》49:19"
 choose.1.d: "极难 - §0「忿怒大日」§!"
 PTF_choose_Extremely_hard: "因为他们忿怒的大日到了，谁能站得住呢？\n《启示录》6:17"
 Tide_of_Iron: "钢铁洪流"

 choose.3.t: "爱国者阵线难度选项 - 宝宝巴士"
 choose.3.de: "红黎组的组员游戏水平千奇百怪，有操作原版配件薄纱一切的难度设计师，也有死活找不到武库舰在哪里研发的所谓“主力代码”。也正是由于组内曾经仍有这样的菜鸟人物的存在，这个事件才应运而生。\n\n本事件是你最后一次退缩的机会。如果你希望维持与官组或其他sub类似的体验，不至于被更强大的美国拖垮，请启用不同的宝宝巴士模式，缓冲压力。"
 choose.3.a: "原始 - BabyBus-G1"
 choose_3_a_tt: "在美国§R内战结束重建完毕§!的时刻，移除所有难度加成性质的民族精神。"
 choose.3.b: "基本 - BabyBus-G3"
 choose_3_b_tt: "在美国§R完成最后的备战国策§!时，移除所有难度加成性质的民族精神。"
 choose.3.c: "普通 - BabyBus-G4"
 choose_3_c_tt: "在§R开战§!时刻，移除所有美国的难度加成性质的民族精神。"
 choose.3.e: "谁跟你主力代码一样菜……"
 choose_3_e_tt: "不作任何改变。\n\n§A不要后悔……§!"

 RD_graygoo_will_stop_haunting_me_tt: "§Y人类§!的躯壳将重返§O神明§!。"
