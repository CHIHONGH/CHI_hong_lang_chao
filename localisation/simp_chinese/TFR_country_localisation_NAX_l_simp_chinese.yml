  RD_NAX_Hint_button_tt: "§L星火燎云暗九垓，霜襟不语向沉哀。山河皆作寒铁色，赤帜无声破夜来。接连叠加的阴影下，印度共和国的未来如风中残烛一般摇曳不明。举国黯淡，工农命贱如纸，无产阶级被要求以忍耐来回应本不属于他们的痛苦，但历史滚滚向前的车轮绝不会因为反动派的压迫而停止，新德里试图以挑衅赤色巨龙掩盖内里的裂缝，却难以阻止愤怒在腹地蔓延。印共毛派抓住了历史短暂的喘息，点燃了失序的长夜，而在群峦之侧，重回正道的赤色中国审视着这场风暴，并在这条并不笔直的道路上，选择了缓慢而坚定的未来。我们从未像今天这样深刻地意识到选择本身就是一种赌注，但现在，我们只能希望开牌时，赢走输家的一切。§!\n\n---------------------------------------------\n\n§R武器§!：§s批判的武器§!永远代替不了§A武器的批判§!！如果没有足够的可以对抗§w@RAJ印度反动派§!的武器装备，我们只会让我们的同志§L白白流血§!。\n\n§Y号召§!：§t人民群众§!才是§R历史永恒§!的主角，只有紧密地§G团结起来§!最广大的§s工§!§R农§!阶级，@NAX§Y印度革命§!才有最广大的肥沃土壤。\n\n§d理论§!：我们已经没有时间为了@NAX§R路线§!§t之争§!吵得面红耳赤了，必须引导与鼓励§R印共毛§!走出一条结合§t马§!§R列§!§d毛§!思想的自己的§O社会主义§!道路，而不是在§Y教条主义§!的条条框框中错失千载难逢的机会。\n\n注：您必须保持§R三大数值§!均不低于§Y75％§!，否则当这场§Y革命结束§!时，印共毛的革命将会被@RAJ§w反动派§!血腥镇压！"
