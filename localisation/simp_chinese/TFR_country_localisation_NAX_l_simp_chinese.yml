  PRC_Southwestern_border_in_critical_condition: "西南边疆告急"
  PRC_Southwestern_border_in_critical_condition_desc: "印度当局在边境上咄咄逼人的态势让这雪域高原上再次笼罩上了战争的阴云，尽管说流血和战火并不是我们想要的，但是当战争的那一刻来临，我们也并不畏惧这一切，无论印度当局如何地张牙舞爪，我们也将会如数十年前一样击溃他们。并且，这一次，我们并不是孤军奋战......"
  PRC_Mobilize_the_military: "动员人民解放军"
  PRC_Mobilize_the_military_desc: "驻扎在高原上的解放军部队已经在日常训练之中无数次排练了高原战争，而这一次真刀真枪的战斗将会好好地检验我们的成果。尽管说我们的目标只是发起一次小战役，但即使是再小的战役也必须要进行充分的动员和组织。"
  PRC_Ensure_logistical_support: "保障西藏高原后勤"
  PRC_Ensure_logistical_support_desc: "数十年前的对印自卫反击战里面，尽管解放军战士们展现了极为坚强的战斗意志，克服了物资短缺和高原的极端气候等限制性因素。但今时不同往日，我们必须要要牢记兵马未动粮草先行的道理，尤其是在现代战争当中，因此我们必须要严密组织好高原的后勤工作。保证我们的战士可以顺利执行战斗任务。"
  PRC_and_NAX_Supply_Coordination: "物资对接"
  PRC_and_NAX_Supply_Coordination_desc: "在这次战役当中，我们并不是孤军奋战的，我们还有自己的盟友。每个人都是这场战役当中不可或缺的一份子，我们将会尽己所能，调拨出足够的军事物资来援助我们的盟友。这些物资将会帮助他们在后续的军事行动当中取得重大的优势。"
  PRC_Operation_Thunder: "§R雷霆行动§!"
  PRC_Operation_Thunder_desc: "时机已至，一切的工作都已经准备妥当，我们在印度的同志们也已经发起了大规模的军事行动。这次我们占尽了天时地利人和的条件，让战鼓轰鸣，让我们对印度的反动当局发起这一次雷霆般的战役！"
  NAX_The_dawn_breaks_through_the_long_nightn: "§Y长夜破晓§!"
  NAX_The_dawn_breaks_through_the_long_nightn_desc: "这一刻终于到来了，边境的战火让印度国内的反动军警已经焦头烂额，而我们的游击战争也已经大大地让他们疲于奔命。每一个印度人都已经看到了纳萨尔派的革命烈火越燃越旺，而现在，是时候向全体印度人正式宣告，纳萨尔派不仅没有被镇压下去，而且现在还将要号召他们拿起武器，推翻这个旧印度！"
  NAX_The_Liberation_War: "解放之战"
  NAX_The_Liberation_War_desc: "数十年的游击战终于在今日迎来了转机，纳萨尔派的势力逐渐成长，也有了值得依靠的盟友。这一次将会是纳萨尔派彻底地走出深山密林，正式将解放和胜利带到更多印度人民面前的不可多得的机会。而这一次机会，纳萨尔派绝不会轻易放手。"
  NAX_Launch_a_guerrilla_war: "发动游击战争"
  NAX_Launch_a_guerrilla_war_desc: "印度当局以为将纳萨尔派逼进荒山野岭当中就可以把革命扼杀，但事实上，纳萨尔派无处不在，从城市的小巷到农村的集市，从恒河之滨到喜马拉雅山下，纳萨尔派早已遍布各地。只需等到条件成熟，他们便会拿起武器，发起更大规模的游击战争，让印度反动当局吃尽苦头。"
  PRC_and_NAX_Brothers_in_Arms: "战火兄弟连"
  PRC_and_NAX_Brothers_in_Arms_desc: "这次战役我们胜利了，我们紧密协作，最终战胜了印度的反动当局，并在印度的东北部建立起来了一个真正的革命政权，而藏南地区也真正地回归了中国的怀抱。这次战役必将铭记史册，这是中印人民兄弟一般革命情谊的胜利。"
  NAX_Launch_a_guerrilla_war_tt: "我们将对印度东部发起一场游击战争骚扰印度政府军"
  PRC_Southwestern_border_in_critical_condition_tt: "已确定消息§Y印度§!正试图对我国§G边境§!发起新一轮§R战争§!"
