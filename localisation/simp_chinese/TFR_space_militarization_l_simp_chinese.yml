# ==================== 天河工程（太空军事化工程） ====================
# 归属模块：common/decisions/TFR_RD_space_militarization.txt（决议名/desc）、
#            common/dynamic_modifiers/TFR_RD_space_militarization_dynamic_modifiers.txt（天军动态精神名/desc）、
#            common/ideas/TFR_RD_ideas_PRC_space_force_flase.txt（假精神 name）、
#            common/decisions/TFR_decisions_PRC_test.txt（调试决议）
 PRC_space_militarization: "天河工程"
 PRC_space_militarization_desc: "天河工程是人民军队着眼建设航天强国、维护国家空天安全而实施的国家战略工程。工程依托酒泉、文昌发射场，以天和核心舱为枢纽，逐步建成涵盖发射、在轨、驻留、运用的航天能力体系。\n中国发展太空力量，始终坚持和平利用太空，同时坚决维护自身太空安全权益。"
 PRC_national_orbital_strategy_committee_new_left: "成立国家轨道战略委员会"
 PRC_integrate_military_aerospace_new_left: "整合军工航天企业"
 PRC_expand_wenchang_launch_center_new_left: "扩建文昌发射中心"
 PRC_build_jiuquan_second_launch_zone_new_left: "建设酒泉第二发射区"
 PRC_orbital_tracking_network_new_left: "建立轨道测控网络"
 PRC_first_gen_recon_satellite_new_left: "发射下一代侦察卫星"
 PRC_global_comm_constellation_new_left: "建立全球通信星座"
 PRC_beidou_military_enhanced_new_left: "建设北斗军用增强系统"
 PRC_early_warning_satellite_new_left: "建设预警卫星系统"
 PRC_tianhe_core_module_new_left: "发射天和核心舱"
 PRC_wentian_lab_module_new_left: "对接问天实验舱"
 PRC_mengtian_lab_module_new_left: "对接梦天实验舱"
 PRC_xuntian_optical_module_new_left: "发射巡天光学舱"
 PRC_space_robotic_arm_new_left: "安装空间机械臂"
 PRC_space_power_system_new_left: "建设空间电源系统"
 PRC_auto_resupply_spacecraft_new_left: "建造自动补给航天器"
 PRC_high_orbit_control_station_new_left: "建设高轨控制站"
 PRC_orbital_energy_platform_new_left: "建设轨道能源平台"
 PRC_orbital_ew_module_new_left: "建设轨道电子对抗阵列"
 PRC_orbital_airdrop_system_new_left: "建设轨道空投系统"
 PRC_orbital_interception_system_new_left: "建设轨道拦截系统"
 PRC_orbital_nuclear_platform_new_left: "建设轨道核打击平台"
 PRC_national_orbital_strategy_committee_new_left_desc: "统筹国家航天力量的最高协调机构。航天事业从分散攻关走向统一规划，为后续的轨道建设提供组织保障。"
 PRC_integrate_military_aerospace_new_left_desc: "将航天工业体系纳入军工集团统一管理，实现运载火箭与导弹工业的军民融合，大幅提升发射产能。"
 PRC_expand_wenchang_launch_center_new_left_desc: "低纬度发射场是通往太空的最佳跳板。扩建后的文昌将承担重型运载火箭的发射任务，年发射能力成倍增长。"
 PRC_build_jiuquan_second_launch_zone_new_left_desc: "在酒泉基地新建第二发射区，形成南北双发射场格局，确保任何天气与突发状况下都有可用的发射窗口。"
 PRC_orbital_tracking_network_new_left_desc: "建设覆盖全球的轨道测控网络，让每一颗卫星、每一艘飞船都处于地面站的不间断监视之下。"
 PRC_first_gen_recon_satellite_new_left_desc: "发射新一代高分辨率侦察卫星，天基侦察体系正式成型——敌人的一举一动都将处于我们的注视之下。\n§G完成后解锁 OSS「间谍卫星监控」功能§!"
 PRC_global_comm_constellation_new_left_desc: "由数百颗低轨卫星组成的全球通信星座，让解放军的命令传遍地球的每一个角落，无惧任何地区的地面设施瘫痪。"
 PRC_beidou_military_enhanced_new_left_desc: "为北斗导航系统加装军用增强信号，制导武器的打击精度将提升到前所未有的水平。"
 PRC_early_warning_satellite_new_left_desc: "红外预警卫星群时刻监视着地球的每一个角落，任何洲际导弹的尾焰都无法逃过我们的眼睛。"
 PRC_tianhe_core_module_new_left_desc: "中国空间站的核心舱段，全自动对接技术在此验证。它将成为我们在近地轨道上的第一个永久立足点。"
 PRC_wentian_lab_module_new_left_desc: "空间站的科研实验舱段，微重力实验室在此展开——太空中的每一项发现都将转化为地面上的技术优势。"
 PRC_mengtian_lab_module_new_left_desc: "空间站的扩展实验舱段，大规模对地观测与工业试验在此进行。太空不再只是探索，而是生产。"
 PRC_xuntian_optical_module_new_left_desc: "与空间站共轨飞行的巡天空间望远镜，两米口径的光学系统可媲美哈勃。它的镜头将对准深空，也将对准地球上每一个值得注视的角落。"

# 天河工程动态民族精神名（动态修正显示名 + 假精神 name 字段共用；修正增量 tooltip 走 effect_tooltip swap_ideas）
 PRC_pla_space_force_dynamic: "中国人民解放军天军"
 PRC_pla_space_force_dynamic_desc: "\n\n\n\n£GFX_TFR_space_force_desc_banner\n\n\n\n\n\n中国人民解放军天军，是“天河工程”淬炼出的新质作战力量，也是人民军队向“制天权”时代迈进的里程碑。\n\n从酒泉与文昌的发射场，到近地轨道上的天和核心舱，天军把侦察、通信、导航、预警与打击的触角，伸展到大气层之外。北斗军用增强、全球通信星座与预警卫星群相继升空；巡天望远镜俯瞰大地，问天、梦天实验舱中不断诞生新的技术优势。\n\n随着轨道测控网络的完善与高轨控制站的部署，天军逐步掌握对轨道目标的全时段监视与通信保障能力；空间机械臂与自动补给飞船让空间站拥有了持续运转的生命力；轨道能源平台则把太阳的能量直接接入国家电网。\n\n当轨道电子对抗阵列压制敌方的指挥系统，当轨道空投系统把远征军直接投送向地球另一端的战场，当轨道核打击平台让敌人的首都始终笼罩在阴影之下——天军的存在本身，就是一种威慑。\n\n当前各系统修正随“天河工程”决议逐项解锁，并在此实时累计。"
 PRC_space_energy_platform_tt: "完成该决议将进一步推进中国太空军事化。"
 PRC_space_robotic_arm_new_left_desc: "七自由度空间机械臂，可在轨完成舱段转位、设备维护与卫星捕获，空间站的自我维护能力就此建立。"
 PRC_space_power_system_new_left_desc: "展开巨型太阳能帆板，空间站的电力供应得到保障，为高能耗的轨道设备提供源源不断的能源。"
 PRC_auto_resupply_spacecraft_new_left_desc: "无人自动补给飞船定期往返天地之间，空间站的物资保障从此不再依赖载人飞船的宝贵舱位。"
 PRC_high_orbit_control_station_new_left_desc: "部署于地球同步轨道的高轨控制站，大幅提升对深空与高轨目标的监控与通信能力。"
 PRC_orbital_energy_platform_new_left_desc: "人类历史上规模最大的轨道工程。空间太阳能电站将能量以微波形式传回地面——建成之日，国家的能源结构将被彻底改写。"
 PRC_orbital_ew_module_new_left_desc: "天基电子战阵列向敌方战区播撒海量虚假信息与干扰信号，敌人的指挥系统将在混乱中崩溃。\n§G完成后解锁 OSS「电子战」功能§!"
 PRC_orbital_airdrop_system_new_left_desc: "轨道空降体系正式成型——整建制部队可从轨道平台直接投送于地球任意一点，兵锋所向，天兵天降。\n§G完成后解锁 OSS「轨道支援」功能§!"
 PRC_orbital_interception_system_new_left_desc: "天基激光阵列时刻戒备，任何来袭的洲际导弹与进入低轨道的敌方航天器都将被烧蚀殆尽——太空，是我们的禁地。"
 PRC_orbital_nuclear_platform_new_left_desc: "核弹头常驻轨道平台，接到指令后从太空垂直再入——任何反导系统都无法拦截来自头顶的审判。\n§G完成后解锁 OSS「战术/战略核打击」功能§!"
# 国策 PLA_orbital_drop_new（三子归边）可用性提示
 PLA_orbital_drop_available_tt: "§R需要完成天河工程前三阶段（奠基·天基·空间站）§!"
