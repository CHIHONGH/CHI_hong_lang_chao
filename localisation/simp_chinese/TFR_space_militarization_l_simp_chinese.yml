# 侧翼：中国太空时代（合并自 beta）
 PRC_nl_stellar_exploration: "远望星辰"
 PRC_nl_stellar_exploration_desc: "随着美国陷入内战，我国已经成为唯一的航天超级大国。\n\n在吸纳来自世界各地的航天人才之后，我国的太空事业已经有了长足的发展，我们有能力也有义务将人类的足迹送上前所未有的顶峰!\n\n现在是时候开启一系列航天工程，将我们的梦想化为现实了!"
 PRC_asteroid_mining_programme_new_left: "小行星采矿项目"
 PRC_asteroid_mining_programme_new_left_desc: "派遣矿船编队深入小行星带，把太空中的贵金属与稀土变成国家的财富。\n\n轨道冶炼与深空运输技术的突破将反哺地面工业，为自动化经济体系提供源源不断的资源保障。"
 PRC_new_moon_race_programme_new_left: "新月球竞赛"
 PRC_new_moon_race_programme_new_left_desc: "重返月球！在月面建立永久科考基地，验证深空生存与资源利用技术。\n\n新一轮月球竞赛的意义远超政治象征——它是人类迈向深空的第一块跳板，也是国家科技实力的全面检阅。"
 PRC_expand_satellite_launching_programme_new_left: "扩大卫星发射项目"
 PRC_expand_satellite_launching_programme_new_left_desc: "大规模提升运载火箭发射频率，把更多卫星送入轨道。\n\n通信、导航、遥感与气象卫星的密集组网，让国家的每一寸土地都处于数字化覆盖之下——该项目可反复推进，为其他太空工程提供基础支撑。"
 PRC_chinese_space_age_tt: "完成该决议将开启『中国太空时代』系列计划，解锁小行星采矿、新月球竞赛与扩大卫星发射三个长期航天项目。"
 PRC_chinese_space_age_dynamic: "中国太空时代"
 PRC_chinese_space_age_dynamic_desc: "当采矿与登月不再是幻想，国家的经济版图便延伸到了地球之外。\n\n从卫星星座的密集组网，到小行星带的采矿船队，再到月面基地的落成，太空产业正成为国民经济新的增长极——研究加速、工业效率提升、消费品下降、收入与商业价值持续增长。\n\n各项修正随『中国太空时代』决议逐项累积，并在此实时显示。"
 PRC_chinese_space_age_dummy: "中国太空时代"
 PRC_chinese_space_age_asteroid_mining_programme: "中国太空时代"
 PRC_chinese_space_age_expand_satellite_launching_programme: "中国太空时代"
 PRC_chinese_space_age_moon_landing_programme: "中国太空时代"

# 侧翼新增：太空育种工程 / 深空探测计划（2026-08-21）
 PRC_space_breeding_programme_new_left: "太空育种工程"
 PRC_space_breeding_programme_new_left_desc: "粮食安全是国家战略稳定的基石。利用宇宙射线与微重力环境诱发农作物基因突变，我们将培育出更高产、抗逆性更强的优良品种，彻底端牢中国人的饭碗。"
 PRC_deep_space_exploration_programme_new_left: "深空探测计划"
 PRC_deep_space_exploration_programme_new_left_desc: "地球只是人类的摇篮，我们的战略视野必须投向辽远的太空。启动深空探测将揭开太空的面纱，让我们的视野拓展到前所未有的广度。"
 PRC_chinese_space_age_space_breeding_programme: "中国太空时代"
 PRC_chinese_space_age_deep_space_exploration_programme: "中国太空时代"

