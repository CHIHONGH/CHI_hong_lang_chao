 oss_ECM_text: "§H启用电子对抗§!"
 oss_ECM_click_tt: "§R即刻行动§!\n成本：§H25§!£GFX_pol_power_icon \n在敌方领土部署电子对抗系统,削弱敌方通讯与雷达系统，使当地敌军陷入混乱并且降低组织度，而我方会获得一个短期的强力修正\n持续30天"
 oss_ECM_click_disabled_tt: "将会立即降低敌方70%的组织度与5%的HP，并且阻止在当地的战略部署，敌军会承受补给效率降低、战斗效率降低、速度降低、损耗增加等一系列负面效果"
