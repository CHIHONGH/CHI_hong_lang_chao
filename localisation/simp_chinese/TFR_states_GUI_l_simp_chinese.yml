 ballistic_missile_equipment: "弹道导弹"
 antiship_missile_equipment: "反舰导弹"
 antiship_missile_equipment_desc: "从舰艇、岸上或飞机上发射，攻击水面舰船的导弹。"
 ballistic_missile_equipment_desc: "弹道导弹是一种按照预先设定的弹道飞行的导弹，其飞行轨迹类似于炮弹。与巡航导弹不同，弹道导弹在大气层外飞行，通常没有弹翼，依靠发动机提供推力将其发射到大气层外，然后在无动力状态下继续飞行。 "
 ballistic_missile_equipment_1: "基础弹道导弹"
 ballistic_missile_equipment_1_desc: "作为新一代固体燃料洲际弹道导弹的代表，该型号标志着战略打击力量由早期体系向机动化、生存化方向转型。其具备公路机动发射能力与稳定的制导系统，可对远程目标实施可靠打击，是现代核威慑力量的重要基石。"
 ballistic_missile_equipment_2: "改进弹道导弹"
 ballistic_missile_equipment_2_desc: "在多弹头分导与高机动部署技术支持下，该型号显著提升了突防能力与打击效率。其具备更远射程与更强抗打击能力，能够在复杂战场环境中维持稳定的战略威慑，对敌方防御体系形成持续压力。"
 ballistic_missile_equipment_3: "先进弹道导弹"
 ballistic_missile_equipment_3_desc: "作为面向未来作战需求构想的先进战略打击平台，该型号预计融合高超音速滑翔、智能制导与多层突防技术。其强调极高机动性与复杂弹道规划能力，能够在强对抗环境中突破多重拦截体系，对战略纵深目标实施快速而精准的毁伤打击，是下一代威慑体系的核心力量。"
 antiship_missile_equipment_1: "基础反舰导弹"
 antiship_missile_equipment_1_desc: "作为世界上首个具有实战能力的反舰弹道导弹，该型号专注于中程精确打击任务。其通过末端机动制导技术实现对海上移动目标的有效跟踪与打击，能够对大型水面舰艇构成直接威胁，是区域拒止体系中的关键打击力量。"
 antiship_missile_equipment_2: "改进反舰导弹"
 antiship_missile_equipment_2_desc: "具备中远程多用途打击能力的弹道导弹平台，可执行对陆与对海双重任务。其射程覆盖范围广，机动部署能力强，能够对远距离高价值目标实施快速打击，在区域威慑与纵深打击体系中占据重要地位。"
 antiship_missile_equipment_3: "先进反舰导弹"
 antiship_missile_equipment_3_desc: "在东风-26基础上发展而来的反舰强化型号，进一步优化了对海目标探测与末端制导能力。其具备更强的远程反舰打击能力与突防性能，可在更大作战纵深内对航母战斗群等核心目标实施精确打击，是远程海上拒止体系的重要支柱。"
