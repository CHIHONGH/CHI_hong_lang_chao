 oss_comprehensive_nuclear_strike_tt: "够了，我们再也忍受不了如此的惨烈牺牲了，一切新生都得建立在毁灭的前提上——这是当前战略推演中，唯一能瓦解敌方战争机器、终结持久战的路径，即便需以现有世界格局的彻底崩塌为代价。公理得胜，九死无悔，从决策层到执行人员，均明晰此举将引发的不可逆后果，却也认同这是捍卫我们主权与正义的最后选择。为了粉碎敌方的侵略根基，为了终止持续的生灵涂炭，为了无产阶级的胜利——按下去，成为世界的死神。"

 ChinaOSS.1.t: "中国对我们发动了电子战"
 ChinaOSS.1.desc: "中国的电子战能力已经达到了一个新的高度，他们的干扰设备能够覆盖我们大部分的领土，导致我们的通讯和雷达系统频频失灵。这不仅削弱了我们的防御能力，也让我们的军队在战场上处于极大的劣势。我们必须迅速采取措施，加强我们的电子对抗能力，以应对中国的威胁。"
 ChinaOSS.1.a: "可恶！"

