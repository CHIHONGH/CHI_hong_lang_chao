 sam_missile_equipment: "防空导弹"
 sam_missile_equipment_desc: "防空导弹是指由地面、舰船或者潜艇发射，拦截空中目标的导弹。"
 sam_missile_equipment_1: "中程防空导弹"
 sam_missile_equipment_1_desc: "作为区域防空体系的重要组成部分，该型号主要承担中高空目标拦截任务，具备对战斗机、巡航导弹及部分战术弹道目标的综合防御能力。依托相控阵雷达与一体化指挥系统，其在复杂电磁环境下仍能保持稳定的探测与跟踪性能，是构建现代防空网络的核心节点之一。"
 sam_missile_equipment_2: "战略反导导弹"
 sam_missile_equipment_2_desc: "定位于国家级导弹防御体系的关键拦截力量，该型号专注于应对中远程弹道导弹威胁。通过高精度探测系统与动能拦截技术，其能够在大气层内外对来袭目标实施高效拦截，具备强大的反导作战能力，是保障战略安全的重要支柱。"
 PRC_sam_missile_equipment_1: "红旗-20"
 PRC_sam_missile_equipment_2: "红旗-29"
 nuclear_missile_equipment: "核导弹"
 nuclear_missile_equipment_desc: "具有携带核弹头的能力、并能够达成远距离核弹投送任务的导弹。\n§Y现在你还不能使用它，你得等到解锁 §5太空军§! 后才能使用核弹，但你可以先生产一部分作为战时库存§!"
