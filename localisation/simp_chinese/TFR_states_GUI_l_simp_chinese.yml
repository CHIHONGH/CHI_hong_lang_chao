 cruise_antiship_missile_equipment_1_desc: "代表新一代高超音速反舰打击能力，该型号采用类弹道飞行与高超音速滑翔技术，具备极高速度与复杂机动能力。其能够在远距离外快速突破多层防御体系，对航母战斗群等核心目标实施难以拦截的精确打击。"
