 FE_DIFFICULTY_VERY_EASY_TOOLTIP: "§L天罡地煞，聚义梁山，替天行道，斩除奸臣，以护圣名\n“《水浒》这部书，好就好在投降。”§!"
 FE_DIFFICULTY_EASY_TOOLTIP: "§L王侯将相，宁有种乎？\n“大凡初时聚精会神，没有一事不用心，没有一人不卖力，也许那时艰难困苦，只有从万死中觅取一生，既而环境渐渐好转了，精神也就渐渐放下了。”§!"
 FE_DIFFICULTY_NORMAL_TOOLTIP: "§L天下从此不能有皇帝，我们劳农真正当家做主，天下才能太平\n“我们的民族将从此列入爱好和平自由的世界各民族的大家庭，以勇敢而勤劳的姿态工作着，创造自己的文明和幸福，同时也促进世界的和平和自由。我们的民族将再也不是一个被人侮辱的民族了，我们已经站起来了。”§!"
 FE_DIFFICULTY_HARD_TOOLTIP: "§L为有牺牲多壮志，敢教日月换新天\n“也许我告别，再不能回来，你是否明白，我沉默的情怀？也许我倒下，再不能起来，你是否知晓，我化作了山脉？”§!"
 FE_DIFFICULTY_VERY_HARD_TOOLTIP: "§L喜看稻菽千重浪，遍地英雄下夕烟\n“不必时时怀念我，也不要指望我回来，我离开以后，你们就是我，人民万岁！”§!"
