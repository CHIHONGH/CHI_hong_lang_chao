 red_dawn_guide.1.t: "绝密 · 中央军事委员会指导文件"
 red_dawn_guide.1.d: "兹应斗争全局之需，中央军事委员会现就今后一个时期的战略方针与三军建设诸要务，向同志呈递本指导文件。当前敌我之作战形式与手段，与旧有条令多有不同，务请同志先行通览，再作定夺。\n\n另：本次斗争之难度方略，已于开局前的游戏规则中预设，如需调整，请在重启征程时于规则菜单内审定。\n\n文件共四编。同志可逐编研读，亦可径行批示。"
 red_dawn_guide.1.a: "逐编研读"
 red_dawn_guide.1.b: "全局早已成竹在胸，径行批示"

 red_dawn_guide.2.t: "指导文件 · 第一编 战略形势"
 red_dawn_guide.2.d: "§H一、§!台海战事开启前：党的二十大完成后，全局将转入新的历史进程。\n§H二、§!台海战事结束后：进入中日冷战阶段。鲁索统一美国，并胁迫太约入侵加拿大、墨西哥与中美洲。\n§H三、§!南海冲突：鲁索治下的法西斯美国于南海寻衅。务须尽快完成军事建设中的导弹工程分支，将美国舰队逐出南海。\n§H四、§!领导世界革命：向亚洲输出革命，遏制太约势力的扩张。\n§H五、§!最终决战：与美、日、印、澳诸敌决战于太平洋。"
 red_dawn_guide.2.a: "下一编 · 陆军建设"
 red_dawn_guide.2.b: "退回总则"

 red_dawn_guide.3.t: "指导文件 · 第二编 陆军建设"
 red_dawn_guide.3.d: "§H一、§!美国陆军全系装甲化，兵力庞大、装备精良，惯于主动寻战。\n§H二、§!我军自行火炮性能已恢复既有标准；直升机与外骨骼装备获重点加强。\n§H三、§!陆军新式编制合成营已经组建。军事部署各项完成后，务请同志检阅。\n§H四、§!美国内战，目前不宜介入。切勿为其新政权初立、内乱不休的表象所惑，敌战备之完善远超预期；若执意介入，一切后果由决策者自负。\n§H五、§!美军训练效率远超常规水准，切勿以常理度之。"
 red_dawn_guide.3.a: "下一编 · 空天力量"
 red_dawn_guide.3.b: "退回上一编"

 red_dawn_guide.4.t: "指导文件 · 第三编 空天力量"
 red_dawn_guide.4.d: "§H一、§!我军已组建天军，可实施电子战、轨道轰炸、轨道投送部队等新式作战。\n§H二、§!新型导弹装备及其配套的军事工业组织已经列装。导弹工业体系庞杂，若此前未曾经手，务请同志提前熟悉。"
 red_dawn_guide.4.a: "下一编 · 海军建设"
 red_dawn_guide.4.b: "退回上一编"

 red_dawn_guide.5.t: "指导文件 · 第四编 海军建设"
 red_dawn_guide.5.d: "§H一、§!依据新颁舰队编成条令，航母集中编组不再产生协同效率折损。\n§H二、§!海军多项新式装备已经定型，其中新型垂直发射单元（VLS）可加装于导弹巡洋舰与战列巡洋舰，使舰艇具备导弹作战能力。\n§H三、§!美国海军实力雄厚，全由主力舰编成。近海之敌，务以反舰导弹歼灭之。\n§H四、§!美军反潜能力极强，切勿寄望以潜艇予其重创。\n§H五、§!集中兵力乃制胜之道，唯有舰队集中使用，方能予美国海军以最大打击。"
 red_dawn_guide.5.a: "批阅完毕 · 即行就道"
 red_dawn_guide.5.b: "退回上一编"

